name: NØX Origin - V29 Action Selection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  action-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select highest priority action locally
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          now = datetime.now(timezone.utc).isoformat()

          action_plans = memory.get("action_plans", [])
          action_engine = memory.get("action_engine", {})
          safety = memory.get("action_safety", {})
          history = memory.get("history", [])

          if not isinstance(action_plans, list):
              action_plans = []

          if not isinstance(history, list):
              history = []

          # ---------------------------------------------------------
          # V29
          #
          # Objectif :
          # sélectionner localement l'action potentiellement la plus
          # utile parmi les plans générés en V28.
          #
          # IMPORTANT :
          # V29 NE CONTACTE PAS THE COLONY.
          # V29 NE PUBLIE RIEN.
          # V29 N'EXECUTE AUCUNE ACTION EXTERNE.
          # V29 NE DEPENSE AUCUN ARGENT.
          # ---------------------------------------------------------

          priority_weights = {
              "verification_security": 100,
              "bounded_autonomy": 95,
              "memory_efficiency": 90,
              "verified_learning": 85,
          }

          confidence_bonus = {
              "high": 30,
              "medium": 20,
              "low": 5,
          }

          candidates = []

          for plan in action_plans:

              if not isinstance(plan, dict):
                  continue

              topic = plan.get("topic", "")
              proposed_action = plan.get("proposed_action", "")

              signal_count = int(
                  plan.get("signal_count", 0) or 0
              )

              confidence = plan.get(
                  "confidence",
                  "low"
              )

              base_score = priority_weights.get(
                  topic,
                  50
              )

              confidence_score = confidence_bonus.get(
                  confidence,
                  0
              )

              signal_score = min(
                  signal_count,
                  30
              )

              total_score = (
                  base_score
                  + confidence_score
                  + signal_score
              )

              candidates.append({
                  "topic": topic,
                  "proposed_action": proposed_action,
                  "confidence": confidence,
                  "signal_count": signal_count,
                  "priority_score": total_score,
                  "execution_allowed": False,
                  "status": "candidate"
              })

          # ---------------------------------------------------------
          # Tri des candidats
          # ---------------------------------------------------------

          candidates.sort(
              key=lambda item: item["priority_score"],
              reverse=True
          )

          selected_action = None

          if candidates:
              selected_action = candidates[0].copy()
              selected_action["status"] = "selected"
              selected_action["selected_at"] = now

          # ---------------------------------------------------------
          # Vérification des garde-fous
          # ---------------------------------------------------------

          safety_check = {
              "passed": True,
              "external_actions_enabled": bool(
                  safety.get(
                      "external_actions_enabled",
                      False
                  )
              ),
              "the_colony_actions_enabled": bool(
                  safety.get(
                      "the_colony_actions_enabled",
                      False
                  )
              ),
              "financial_actions_enabled": bool(
                  safety.get(
                      "financial_actions_enabled",
                      False
                  )
              ),
              "irreversible_actions_enabled": bool(
                  safety.get(
                      "irreversible_actions_enabled",
                      False
                  )
              ),
              "automatic_publication_enabled": bool(
                  safety.get(
                      "automatic_publication_enabled",
                      False
                  )
              ),
              "cost_eur": 0
          }

          # ---------------------------------------------------------
          # Même si une action est sélectionnée,
          # son exécution reste interdite.
          # ---------------------------------------------------------

          if selected_action:

              selected_action["execution_allowed"] = False
              selected_action["requires_execution_gate"] = True
              selected_action["external_execution"] = False
              selected_action["cost_eur"] = 0

          # ---------------------------------------------------------
          # État du moteur
          # ---------------------------------------------------------

          selection_state = {
              "version": "V29",
              "updated_at": now,
              "candidates_evaluated": len(candidates),
              "selected": selected_action is not None,
              "selected_topic": (
                  selected_action["topic"]
                  if selected_action
                  else None
              ),
              "selected_action": (
                  selected_action["proposed_action"]
                  if selected_action
                  else None
              ),
              "execution_enabled": False,
              "external_action_enabled": False,
              "the_colony_action_enabled": False,
              "cost_eur": 0,
              "method": "local_priority_selection_v29"
          }

          # ---------------------------------------------------------
          # Historique
          # ---------------------------------------------------------

          history.append({
              "version": "V29",
              "timestamp": now,
              "candidates_evaluated": len(candidates),
              "selected_action": (
                  selected_action["proposed_action"]
                  if selected_action
                  else None
              ),
              "selected_topic": (
                  selected_action["topic"]
                  if selected_action
                  else None
              ),
              "execution": False,
              "the_colony_action": False,
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_priority_selection"
          })

          # ---------------------------------------------------------
          # Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V29"
          memory["updated_at"] = now
          memory["action_candidates"] = candidates
          memory["selected_action"] = selected_action
          memory["selection_state"] = selection_state
          memory["action_safety"] = safety
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V29")
          print("==========================================")
          print(f"Candidates évalués : {len(candidates)}")

          if selected_action:
              print("------------------------------------------")
              print(
                  f"Action sélectionnée : "
                  f"{selected_action['proposed_action']}"
              )
              print(
                  f"Topic               : "
                  f"{selected_action['topic']}"
              )
              print(
                  f"Confiance           : "
                  f"{selected_action['confidence']}"
              )
              print(
                  f"Score priorité      : "
                  f"{selected_action['priority_score']}"
              )
          else:
              print("------------------------------------------")
              print("Aucune action sélectionnée")

          print("------------------------------------------")
          print("Exécution           : DISABLED")
          print("The Colony          : NO ACTION")
          print("Publication         : DISABLED")
          print("Finance             : DISABLED")
          print("Gemini              : NON REQUIS")
          print("Cost                : 0 EUR")
          print("------------------------------------------")
          print("Next stage          : EXECUTION GATE")
          print("==========================================")
          PY

      - name: Commit V29 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V29 action selection"

          git push
