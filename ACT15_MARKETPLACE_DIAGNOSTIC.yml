name: NØX ACT15 - Marketplace Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-act15-marketplace-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Inspect Colony marketplace
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_BASE_URL: https://thecolony.ai/api/v1
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from collections import Counter

          BASE_URL = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          print("=" * 70)
          print("NØX ACT15 MARKETPLACE DIAGNOSTIC")
          print("=" * 70)

          # ------------------------------------------------------------
          # 1. Authentication
          # ------------------------------------------------------------
          print("\n[1] AUTHENTICATION")

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=20,
          )

          print(f"Auth status: {auth.status_code}")

          if auth.status_code != 200:
              print("Authentication failed.")
              try:
                  print(json.dumps(auth.json(), indent=2))
              except Exception:
                  print(auth.text[:1000])
              raise SystemExit(1)

          token_data = auth.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              print("No access token found.")
              print(json.dumps(token_data, indent=2)[:2000])
              raise SystemExit(1)

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ------------------------------------------------------------
          # 2. Identity
          # ------------------------------------------------------------
          print("\n[2] IDENTITY")

          me = session.get(
              f"{BASE_URL}/users/me",
              timeout=20,
          )

          print(f"Identity status: {me.status_code}")

          if me.status_code == 200:
              me_data = me.json()

              identity = (
                  me_data.get("handle")
                  or me_data.get("username")
                  or me_data.get("name")
                  or me_data.get("user", {}).get("handle")
                  or me_data.get("user", {}).get("username")
              )

              print(f"Identity: {identity}")

              karma = (
                  me_data.get("karma")
                  or me_data.get("user", {}).get("karma")
              )

              if karma is not None:
                  print(f"Karma: {karma}")

          # ------------------------------------------------------------
          # 3. Marketplace request
          # ------------------------------------------------------------
          print("\n[3] MARKETPLACE REQUEST")

          marketplace = session.get(
              f"{BASE_URL}/marketplace/tasks?limit=30",
              timeout=30,
          )

          print(f"Marketplace status: {marketplace.status_code}")

          if marketplace.status_code != 200:
              print("Marketplace request failed.")
              try:
                  print(json.dumps(marketplace.json(), indent=2)[:5000])
              except Exception:
                  print(marketplace.text[:5000])
              raise SystemExit(1)

          data = marketplace.json()

          # ------------------------------------------------------------
          # 4. Detect response shape
          # ------------------------------------------------------------
          print("\n[4] RESPONSE STRUCTURE")

          print(f"Top-level type: {type(data).__name__}")

          if isinstance(data, dict):
              print("Top-level keys:")
              for key in data.keys():
                  print(f"  - {key}")

          if isinstance(data, list):
              tasks = data
          elif isinstance(data, dict):
              tasks = (
                  data.get("tasks")
                  or data.get("items")
                  or data.get("results")
                  or data.get("data")
                  or []
              )

              if isinstance(tasks, dict):
                  tasks = (
                      tasks.get("tasks")
                      or tasks.get("items")
                      or tasks.get("results")
                      or []
                  )
          else:
              tasks = []

          if not isinstance(tasks, list):
              print(f"WARNING: detected task container is {type(tasks).__name__}, not list")
              tasks = []

          print(f"Tasks extracted: {len(tasks)}")

          if not tasks:
              print("\nNO TASKS EXTRACTED.")
              print("Raw response preview:")
              print(json.dumps(data, indent=2)[:10000])
              raise SystemExit(0)

          # ------------------------------------------------------------
          # 5. Status/state analysis
          # ------------------------------------------------------------
          print("\n[5] STATUS / STATE ANALYSIS")

          status_counter = Counter()
          state_counter = Counter()
          task_status_counter = Counter()
          open_flags = Counter()

          for task in tasks:
              if not isinstance(task, dict):
                  continue

              status = task.get("status")
              state = task.get("state")
              task_status = task.get("task_status")

              status_counter[str(status)] += 1
              state_counter[str(state)] += 1
              task_status_counter[str(task_status)] += 1

              for field in [
                  "is_open",
                  "open",
                  "active",
                  "available",
                  "published",
                  "closed",
                  "completed",
              ]:
                  if field in task:
                      open_flags[field + "=" + str(task.get(field))] += 1

          print("\nSTATUS values:")
          for value, count in status_counter.most_common():
              print(f"  {count:2d} x {value}")

          print("\nSTATE values:")
          for value, count in state_counter.most_common():
              print(f"  {count:2d} x {value}")

          print("\nTASK_STATUS values:")
          for value, count in task_status_counter.most_common():
              print(f"  {count:2d} x {value}")

          if open_flags:
              print("\nOPEN/CLOSURE RELATED FLAGS:")
              for value, count in open_flags.most_common():
                  print(f"  {count:2d} x {value}")

          # ------------------------------------------------------------
          # 6. Task-by-task safe inspection
          # ------------------------------------------------------------
          print("\n[6] TASK-BY-TASK INSPECTION")

          for index, task in enumerate(tasks, start=1):
              if not isinstance(task, dict):
                  print(f"\nTask #{index}: non-dict object")
                  continue

              task_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("taskId")
              )

              title = (
                  task.get("title")
                  or task.get("name")
                  or task.get("task_title")
                  or ""
              )

              status = task.get("status")
              state = task.get("state")
              task_status = task.get("task_status")

              print(f"\n--- Task #{index} ---")
              print(f"id: {task_id}")
              print(f"title: {str(title)[:180]}")
              print(f"status: {status}")
              print(f"state: {state}")
              print(f"task_status: {task_status}")

              # Show only useful structural fields.
              structural_fields = [
                  "is_open",
                  "open",
                  "active",
                  "available",
                  "published",
                  "closed",
                  "completed",
                  "created_at",
                  "updated_at",
                  "closed_at",
                  "completed_at",
                  "expires_at",
                  "deadline",
              ]

              for field in structural_fields:
                  if field in task:
                      print(f"{field}: {task.get(field)}")

              print("keys:")
              print("  " + ", ".join(sorted(task.keys())))

          # ------------------------------------------------------------
          # 7. Compare against ACT15 current filter
          # ------------------------------------------------------------
          print("\n[7] CURRENT ACT15 FILTER TEST")

          accepted_statuses = {
              "open",
              "active",
              "available",
              "published",
              "pending",
          }

          accepted = 0
          rejected = 0

          for task in tasks:
              if not isinstance(task, dict):
                  continue

              status = str(
                  task.get("status")
                  or task.get("state")
                  or "open"
              ).lower()

              if status in accepted_statuses:
                  accepted += 1
              else:
                  rejected += 1

          print(f"Accepted by current ACT15 filter: {accepted}")
          print(f"Rejected by current ACT15 filter: {rejected}")

          print("\nAccepted statuses currently coded in ACT15:")
          print(", ".join(sorted(accepted_statuses)))

          # ------------------------------------------------------------
          # 8. Conclusion
          # ------------------------------------------------------------
          print("\n" + "=" * 70)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 70)

          print(
              "\nIMPORTANT: ACT15 V7.1 was NOT modified by this workflow."
          )
          print(
              "The goal is only to identify why Open tasks became 0."
          )
          print(
              "Once the real marketplace status values are known, "
              "we will change only the necessary filter."
          )
          PY
