name: NØX Origin - Learning V11

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write

jobs:
  nox-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NØX Learning V11
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from collections import Counter

          MEMORY_FILE = "memory/nox_memory.json"
          LEARNING_FILE = "memory/nox_learning_v11.json"
          REPORT_FILE = "memory/nox_learning_v11_report.md"

          print("====================================")
          print("NØX ORIGIN - LEARNING V11")
          print("====================================")

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          if not os.path.exists(MEMORY_FILE):
              raise RuntimeError("NØX memory file not found.")

          with open(MEMORY_FILE, "r", encoding="utf-8") as f:
              memory = json.load(f)

          observations = memory.get("observations", [])
          decisions = memory.get("decisions", [])
          actions = memory.get("actions", [])
          learnings = memory.get("learnings", [])

          print(f"Observations: {len(observations)}")
          print(f"Decisions: {len(decisions)}")
          print(f"Actions: {len(actions)}")
          print(f"Existing learnings: {len(learnings)}")

          # --------------------------------------------------
          # 2. EXTRACT ACTIONS
          # --------------------------------------------------

          experiences = []

          for item in actions:
              if not isinstance(item, dict):
                  continue

              action = item.get("action", {})

              if not isinstance(action, dict):
                  action = {}

              title = action.get("title") or item.get("title")
              kind = action.get("kind") or item.get("kind")
              category = action.get("category") or item.get("category")

              # Possible result fields
              result = (
                  action.get("result")
                  or action.get("outcome")
                  or action.get("response")
                  or item.get("result")
                  or item.get("outcome")
                  or item.get("response")
              )

              # Possible evaluation fields
              evaluation = (
                  action.get("evaluation")
                  or action.get("assessment")
                  or item.get("evaluation")
                  or item.get("assessment")
              )

              # Possible score
              score = action.get("score")

              if score is None:
                  score = item.get("score")

              experiences.append({
                  "title": title,
                  "kind": kind,
                  "category": category,
                  "result": result,
                  "evaluation": evaluation,
                  "score": score
              })

          # --------------------------------------------------
          # 3. IDENTIFY REAL RESULTS
          # --------------------------------------------------

          with_results = []
          without_results = []

          for experience in experiences:

              has_result = (
                  experience["result"] is not None
                  and experience["result"] != ""
              )

              has_evaluation = (
                  experience["evaluation"] is not None
                  and experience["evaluation"] != ""
              )

              has_score = isinstance(
                  experience["score"],
                  (int, float)
              )

              if has_result or has_evaluation or has_score:
                  with_results.append(experience)
              else:
                  without_results.append(experience)

          # --------------------------------------------------
          # 4. CLASSIFY RESULTS
          # --------------------------------------------------

          success_words = {
              "success",
              "successful",
              "succeeded",
              "successfully",
              "positive",
              "good",
              "useful",
              "effective",
              "accepted",
              "replied",
              "response"
          }

          failure_words = {
              "failure",
              "failed",
              "error",
              "negative",
              "useless",
              "ineffective",
              "rejected",
              "denied"
          }

          result_classes = Counter()

          classified_experiences = []

          for experience in with_results:

              text_parts = []

              for field in [
                  experience["result"],
                  experience["evaluation"]
              ]:
                  if isinstance(field, str):
                      text_parts.append(field.lower())

              text = " ".join(text_parts)

              classification = "unknown"

              if any(word in text for word in failure_words):
                  classification = "failure"

              elif any(word in text for word in success_words):
                  classification = "success"

              elif isinstance(experience["score"], (int, float)):
                  if experience["score"] > 0:
                      classification = "positive_score"
                  elif experience["score"] < 0:
                      classification = "negative_score"
                  else:
                      classification = "neutral_score"

              result_classes[classification] += 1

              classified = dict(experience)
              classified["classification"] = classification

              classified_experiences.append(classified)

          # --------------------------------------------------
          # 5. BUILD LEARNING RECORDS
          # --------------------------------------------------

          learning_records = []

          for experience in classified_experiences:

              title = experience["title"] or "Unnamed action"

              result = experience["result"]
              evaluation = experience["evaluation"]
              classification = experience["classification"]

              if classification == "success":
                  lesson = (
                      f"Action '{title}' produced a potentially positive "
                      f"result. It may be worth repeating when the context "
                      f"is similar."
                  )

              elif classification == "failure":
                  lesson = (
                      f"Action '{title}' produced a potentially negative "
                      f"result. It should be reviewed before being repeated."
                  )

              elif classification in {
                  "positive_score",
                  "negative_score",
                  "neutral_score"
              }:
                  lesson = (
                      f"Action '{title}' has a recorded score of "
                      f"{experience['score']}. Future decisions should "
                      f"compare this result with similar actions."
                  )

              else:
                  lesson = (
                      f"Action '{title}' has a recorded result, but the "
                      f"available evidence is insufficient for a reliable "
                      f"success/failure conclusion."
                  )

              learning_records.append({
                  "created_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "action": title,
                  "kind": experience["kind"],
                  "category":
