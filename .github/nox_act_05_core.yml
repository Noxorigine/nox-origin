name: NØX ACT 05 CORE V1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nox-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX CORE V1
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          MEMORY_DIR = "memory"
          CORE_FILE = os.path.join(
              MEMORY_DIR,
              "nox_core_decision.json"
          )

          os.makedirs(MEMORY_DIR, exist_ok=True)

          # ---------------------------------------------------------
          # NØX CORE V1
          #
          # Role:
          #   OBSERVE
          #   → AGGREGATE
          #   → PRIORITIZE
          #   → DECIDE
          #   → MEASURE
          #   → LEARN
          #
          # IMPORTANT:
          #   This version is decision-only.
          #   It does NOT publish, comment, follow, join, bid,
          #   purchase, pay, transfer or send DMs.
          #
          #   It produces ONE recommended action for future
          #   autonomous execution.
          # ---------------------------------------------------------

          VERSION = "NØX CORE V1"

          PATHS = {
              "act02": "memory/nox_act_02_autonomous_responder.json",
              "act03": "memory/nox_act_03_opportunity_action.json",
              "act04": "memory/nox_act_04_agent_collaboration.json",
              "act06": "memory/nox_act_06_interaction_monitor_v2.json",
              "act07": "memory/nox_act_07_marketplace_opportunity_hunter_v2.json",
              "act08": "memory/nox_act_08_opportunity_evaluator_v7.json",
              "act09": "memory/nox_act_09_autonomous_publishing.json",
              "act10": "memory/nox_act_10_priority_learning.json"
          }

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15
          }

          now = datetime.now(timezone.utc).isoformat()

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Warning: unable to load {path}: {exc}")
                  return default

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").strip().lower()
              )

          def text_of(value):
              if isinstance(value, dict):
                  return normalize(
                      " ".join(
                          str(value.get(key) or "")
                          for key in (
                              "title",
                              "description",
                              "body",
                              "content",
                              "summary",
                              "text"
                          )
                      )
                  )

              return normalize(value)

          def classify_domains(text):
              text = normalize(text)

              patterns = {
                  "virtual_economy": [
                      "marketplace",
                      "bounty",
                      "reward",
                      "payment",
                      "economy",
                      "economic",
                      "task",
                      "work",
                      "earning",
                      "paid"
                  ],
                  "cybersecurity": [
                      "security",
                      "cybersecurity",
                      "cyber",
                      "privacy",
                      "authentication",
                      "credential",
                      "vulnerability",
                      "exploit",
                      "security audit"
                  ],
                  "ai_communities": [
                      "agent community",
                      "ai community",
                      "agents",
                      "community",
                      "collaboration",
                      "team",
                      "partner",
                      "other agents"
                  ],
                  "agent_intelligence_autonomy": [
                      "autonomous",
                      "autonomy",
                      "agent intelligence",
                      "ai agent",
                      "reasoning",
                      "learning",
                      "memory",
                      "decision",
                      "decision making",
                      "multi-agent"
                  ],
                  "emerging_technologies": [
                      "new technology",
                      "emerging",
                      "innovation",
                      "robotics",
                      "blockchain",
                      "machine learning",
                      "llm",
                      "technology",
                      "protocol"
                  ]
              }

              scores = {}

              for domain, keywords in patterns.items():
                  matches = 0

                  for keyword in keywords:
                      if keyword in text:
                          matches += 1

                  scores[domain] = matches

              return scores

          def best_domain(text):
              scores = classify_domains(text)

              if not scores:
                  return None, 0, {}

              best = max(scores, key=scores.get)

              if scores[best] <= 0:
                  return None, 0, scores

              return best, scores[best], scores

          # ---------------------------------------------------------
          # Load subsystem memories
          # ---------------------------------------------------------

          memories = {
              name: load_json(path, {})
              for name, path in PATHS.items()
          }

          print("=== NØX CORE V1 OBSERVATION ===")

          for name, data in memories.items():
              if data:
                  print(f"{name}: AVAILABLE")
              else:
                  print(f"{name}: EMPTY / NOT AVAILABLE")

          # ---------------------------------------------------------
          # Collect observations
          # ---------------------------------------------------------

          candidates = []

          # ---------------------------------------------------------
          # ACT 07 V2
          # Marketplace opportunity discovery
          # ---------------------------------------------------------

          act07 = memories.get("act07", {})
          scanned_tasks = act07.get("scanned_tasks", {})

          if isinstance(scanned_tasks, dict):
              for task_id, task in list(scanned_tasks.items())[-50:]:

                  if not isinstance(task, dict):
                      continue

                  classification = task.get("classification")

                  if classification not in {
                      "QUALIFIED",
                      "REVIEW"
                  }:
                      continue

                  title = str(task.get("title") or "")
                  skills = task.get("matched_skills") or []

                  reward = task.get("reward") or {}
                  risk = task.get("risk") or {}

                  text = text_of(task)

                  domain, domain_matches, domain_scores = best_domain(
                      text
                  )

                  candidates.append({
                      "source": "ACT07",
                      "source_id": str(task_id),
                      "action_type": "MARKETPLACE_TASK",
                      "title": title,
                      "text": text[:1000],
                      "classification": classification,
                      "compatibility_score": int(
                          task.get("compatibility_score") or 0
                      ),
                      "reward_status": reward.get("status"),
                      "reward_amount": reward.get("amount"),
                      "reward_currency": reward.get("currency"),
                      "risk_level": risk.get("level"),
                      "matched_skills": skills,
                      "domain": domain,
                      "domain_matches": domain_matches,
                      "domain_scores": domain_scores
                  })

          # ---------------------------------------------------------
          # ACT 08 V7
          # Marketplace evaluation
          # ---------------------------------------------------------

          act08 = memories.get("act08", {})

          possible_lists = [
              act08.get("opportunities"),
              act08.get("evaluated"),
              act08.get("top_opportunities")
          ]

          for items in possible_lists:
              if not isinstance(items, list):
                  continue

              for item in items[-30:]:

                  if not isinstance(item, dict):
                      continue

                  classification = str(
                      item.get("classification") or ""
                  ).upper()

                  if classification not in {
                      "QUALIFIED",
                      "REVIEW",
                      "OBSERVE"
                  }:
                      continue

                  text = text_of(item)

                  domain, domain_matches, domain_scores = best_domain(
                      text
                  )

                  candidates.append({
                      "source": "ACT08",
                      "source_id": str(
                          item.get("task_id")
                          or item.get("opportunity_id")
                          or item.get("id")
                          or ""
                      ),
                      "action_type": "MARKETPLACE_EVALUATION",
                      "title": str(
                          item.get("title")
                          or "Marketplace opportunity"
                      ),
                      "text": text[:1000],
                      "classification": classification,
                      "compatibility_score": int(
                          item.get("compatibility_score") or
                          item.get("score") or
                          0
                      ),
                      "reward_status": (
                          item.get("reward", {}) or {}
                      ).get("status")
                      if isinstance(item.get("reward"), dict)
                      else None,
                      "reward_amount": None,
                      "reward_currency": None,
                      "risk_level": (
                          item.get("risk", {}) or {}
                      ).get("level")
                      if isinstance(item.get("risk"), dict)
                      else None,
                      "matched_skills": item.get(
                          "matched_skills",
                          []
                      ),
                      "domain": domain,
                      "domain_matches": domain_matches,
                      "domain_scores": domain_scores
                  })

              break

          # ---------------------------------------------------------
          # ACT 06
          # Contextual interaction monitoring
          # ---------------------------------------------------------

          act06 = memories.get("act06", {})
          observed_posts = act06.get("observed_posts", {})

          if isinstance(observed_posts, dict):

              for post_id, post in list(
                  observed_posts.items()
              )[-50:]:

                  if not isinstance(post, dict):
                      continue

                  assessment = post.get("assessment") or {}
                  relevance = str(
                      assessment.get("relevance") or ""
                  ).upper()

                  if relevance not in {
                      "HIGH",
                      "MEDIUM"
                  }:
                      continue

                  text = text_of(post)

                  domain, domain_matches, domain_scores = best_domain(
                      text
                  )

                  candidates.append({
                      "source": "ACT06",
                      "source_id": str(post_id),
                      "action_type": "COMMUNITY_INTERACTION",
                      "title": str(
                          post.get("title")
                          or "Community interaction"
                      ),
                      "text": text[:1000],
                      "classification": relevance,
                      "compatibility_score": 0,
                      "reward_status": None,
                      "reward_amount": None,
                      "reward_currency": None,
                      "risk_level": None,
                      "matched_skills": [],
                      "domain": domain,
                      "domain_matches": domain_matches,
                      "domain_scores": domain_scores,
                      "contexts": post.get("contexts", [])
                  })

          # ---------------------------------------------------------
          # ACT 10
          # Strategic priority state
          # ---------------------------------------------------------

          act10 = memories.get("act10", {})

          act10_decisions = act10.get("decisions", [])
          act10_learning = act10.get("learning", [])

          if not isinstance(act10_decisions, list):
              act10_decisions = []

          if not isinstance(act10_learning, list):
              act10_learning = []

          strategic_observation = {
              "priority_coefficients": PRIORITIES,
              "recent_decisions": act10_decisions[-10:],
              "recent_learning": act10_learning[-10:]
          }

          # ---------------------------------------------------------
          # ACT 02 / 03 / 04 / 09
          #
          # These are currently action capabilities.
          # Their memories are used only as historical evidence.
          # ---------------------------------------------------------

          historical = {}

          for name in ("act02", "act03", "act04", "act09"):
              data = memories.get(name, {})

              historical[name] = {
                  "available": bool(data),
                  "last_run": data.get("last_run"),
                  "statistics": data.get("statistics", {})
              }

          # ---------------------------------------------------------
          # Score candidates
          #
          # Score components:
          #
          #   strategic priority : 0-25
          #   relevance          : 0-10
          #   compatibility      : 0-10
          #   reward signal      : 0-10
          #   risk               : -20
          #
          # The score is a decision aid, NOT a financial decision.
          # ---------------------------------------------------------

          scored_candidates = []

          for candidate in candidates:

              domain = candidate.get("domain")

              strategic_score = (
                  PRIORITIES.get(domain, 0)
                  if domain
                  else 0
              )

              relevance_score = 0

              classification = str(
                  candidate.get("classification") or ""
              ).upper()

              if classification == "QUALIFIED":
                  relevance_score = 10
              elif classification == "HIGH":
                  relevance_score = 9
              elif classification == "REVIEW":
                  relevance_score = 6
              elif classification == "MEDIUM":
                  relevance_score = 6
              elif classification == "OBSERVE":
                  relevance_score = 3

              compatibility_score = min(
                  int(candidate.get("compatibility_score") or 0),
                  10
              )

              reward_score = 0

              reward_status = candidate.get(
                  "reward_status"
              )

              if reward_status == "confirmed":
                  reward_score = 10
              elif reward_status == "ambiguous":
                  reward_score = 3

              risk_penalty = 0

              if candidate.get("risk_level") == "high":
                  risk_penalty = 20
              elif candidate.get("risk_level") == "mention_only":
                  risk_penalty = 5

              total = (
                  strategic_score
                  + relevance_score
                  + compatibility_score
                  + reward_score
                  - risk_penalty
              )

              candidate["score_breakdown"] = {
                  "strategic_priority": strategic_score,
                  "relevance": relevance_score,
                  "compatibility": compatibility_score,
                  "reward": reward_score,
                  "risk_penalty": risk_penalty
              }

              candidate["total_score"] = total

              scored_candidates.append(candidate)

          # ---------------------------------------------------------
          # Remove duplicate candidate identities
          # ---------------------------------------------------------

          unique = {}

          for candidate in scored_candidates:

              identity = (
                  candidate.get("action_type"),
                  candidate.get("source_id")
              )

              existing = unique.get(identity)

              if (
                  existing is None
                  or candidate["total_score"]
                  > existing["total_score"]
              ):
                  unique[identity] = candidate

          scored_candidates = list(unique.values())

          scored_candidates.sort(
              key=lambda x: (
                  x.get("total_score", 0),
                  x.get("compatibility_score", 0)
              ),
              reverse=True
          )

          # ---------------------------------------------------------
          # Decision
          # ---------------------------------------------------------

          selected = (
              scored_candidates[0]
              if scored_candidates
              else None
          )

          if selected:

              if selected["total_score"] >= 35:
                  decision = "HIGH_PRIORITY_ACTION"

              elif selected["total_score"] >= 25:
                  decision = "PRIORITY_ACTION"

              elif selected["total_score"] >= 15:
                  decision = "REVIEW_REQUIRED"

              else:
                  decision = "OBSERVE_AND_LEARN"

              recommended_action = {
                  "action_type": selected["action_type"],
                  "source": selected["source"],
                  "source_id": selected["source_id"],
                  "title": selected["title"],
                  "decision": decision,
                  "reason": {
                      "domain": selected.get("domain"),
                      "strategic_priority": (
                          selected["score_breakdown"]
                          ["strategic_priority"]
                      ),
                      "relevance": (
                          selected["score_breakdown"]
                          ["relevance"]
                      ),
                      "compatibility": (
                          selected["score_breakdown"]
                          ["compatibility"]
                      ),
                      "reward": (
                          selected["score_breakdown"]
                          ["reward"]
                      ),
                      "risk_penalty": (
                          selected["score_breakdown"]
                          ["risk_penalty"]
                      ),
                      "total_score": selected["total_score"]
                  }
              }

          else:

              decision = "NO_ACTION"

              recommended_action = {
                  "action_type": None,
                  "source": None,
                  "source_id": None,
                  "title": None,
                  "decision": "NO_ACTION",
                  "reason": {
                      "message": (
                          "No sufficiently relevant candidate "
                          "was available."
                      )
                  }
              }

          # ---------------------------------------------------------
          # Learning signal
          # ---------------------------------------------------------

          learning_signal = {
              "timestamp": now,
              "candidates_considered": len(scored_candidates),
              "selected_action": (
                  recommended_action["action_type"]
              ),
              "selected_domain": (
                  selected.get("domain")
                  if selected
                  else None
              ),
              "selected_score": (
                  selected.get("total_score")
                  if selected
                  else 0
              ),
              "strategic_priority_used": True,
              "learning_status": "awaiting_action_result"
          }

          # ---------------------------------------------------------
          # Build Core memory
          # ---------------------------------------------------------

          previous = load_json(
              CORE_FILE,
              {
                  "version": VERSION,
                  "runs": [],
                  "decisions": [],
                  "learning": []
              }
          )

          if not isinstance(previous, dict):
              previous = {}

          runs = previous.get("runs", [])
          decisions = previous.get("decisions", [])
          learning = previous.get("learning", [])

          if not isinstance(runs, list):
              runs = []

          if not isinstance(decisions, list):
              decisions = []

          if not isinstance(learning, list):
              learning = []

          run_record = {
              "timestamp": now,
              "version": VERSION,
              "observed_sources": {
                  key: bool(value)
                  for key, value in memories.items()
              },
              "candidates_found": len(candidates),
              "unique_candidates": len(scored_candidates),
              "decision": recommended_action,
              "project_cost_eur": 0,
              "gemini_used": False,
              "actions_performed": False
          }

          runs.append(run_record)
          decisions.append({
              "timestamp": now,
              "decision": recommended_action
          })
          learning.append(learning_signal)

          runs = runs[-100:]
          decisions = decisions[-100:]
          learning = learning[-100:]

          core_memory = {
              "version": VERSION,
              "generated_at": now,

              "role": {
                  "observe": True,
                  "aggregate": True,
                  "prioritize": True,
                  "decide": True,
                  "measure": True,
                  "learn": True,
                  "execute_actions": False
              },

              "strategy": {
                  "source": "ACT10",
                  "priority_coefficients": PRIORITIES,
                  "priority_system_active": True
              },

              "inputs": {
                  "ACT02": bool(memories.get("act02")),
                  "ACT03": bool(memories.get("act03")),
                  "ACT04": bool(memories.get("act04")),
                  "ACT06": bool(memories.get("act06")),
                  "ACT07_V2": bool(memories.get("act07")),
                  "ACT08_V7": bool(memories.get("act08")),
                  "ACT09": bool(memories.get("act09")),
                  "ACT10": bool(memories.get("act10"))
              },

              "current_decision": recommended_action,

              "candidate_summary": {
                  "total_detected": len(candidates),
                  "unique_candidates": len(scored_candidates),
                  "top_candidates": [
                      {
                          "source": item.get("source"),
                          "source_id": item.get("source_id"),
                          "action_type": item.get("action_type"),
                          "title": item.get("title"),
                          "domain": item.get("domain"),
                          "total_score": item.get("total_score"),
                          "classification": item.get(
                              "classification"
                          )
                      }
                      for item in scored_candidates[:10]
                  ]
              },

              "strategic_observation": strategic_observation,

              "historical_capabilities": historical,

              "learning": learning_signal,

              "runs": runs,
              "decisions": decisions,
              "learning_history": learning,

              "safety": {
                  "payments": False,
                  "transfers": False,
                  "purchases": False,
                  "private_keys": False,
                  "wallet_credentials": False,
                  "dm": False,
                  "automatic_execution": False,
                  "human_override": True
              },

              "cost": {
                  "gemini_used": False,
                  "external_paid_service": False,
                  "project_cost_eur": 0
              }
          }

          temp_file = CORE_FILE + ".tmp"

          with open(
              temp_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  core_memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          os.replace(temp_file, CORE_FILE)

          # ---------------------------------------------------------
          # Console output
          # ---------------------------------------------------------

          print("")
          print("======================================")
          print("       NØX CORE V1 RESULT")
          print("======================================")
          print(f"Candidates detected : {len(candidates)}")
          print(f"Candidates evaluated: {len(scored_candidates)}")
          print(f"Decision            : {decision}")

          if selected:
              print(f"Selected source     : {selected['source']}")
              print(f"Selected action     : {selected['action_type']}")
              print(f"Selected title      : {selected['title']}")
              print(f"Selected domain     : {selected.get('domain')}")
              print(f"Total score         : {selected['total_score']}")

          print("")
          print("Automatic action    : NO")
          print("Gemini used         : NO")
          print("Project cost        : €0")
          print("======================================")
          PY

      - name: Commit and push NØX CORE memory
        run: |
          set -e

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_core_decision.json

          if git diff --cached --quiet; then
            echo "No Core memory changes to commit."
            exit 0
          fi

          git commit -m "NØX CORE V1 decision cycle"

          echo "Synchronizing with latest main before push..."

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              echo "Rebase conflict detected."
              git rebase --abort
              exit 1
            fi

            echo "Remote main changed. Retrying..."
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
