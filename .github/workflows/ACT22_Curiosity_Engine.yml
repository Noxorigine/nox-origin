name: NØX ACT22 - Curiosity Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  curiosity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACT22 - Curiosity Engine
        run: |
          python -u <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"
          INPUT_FILE = MEMORY_DIR / "nox_knowledge_gaps.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_22_curiosity.json"

          MAX_ATTENTION = 10

          # NØX priority weights defined by the project.
          DOMAIN_WEIGHTS = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_tech": 15,

              # Additional allowed domains.
              "laws_regulation": 15,
              "science": 10,
              "history": 8,
              "programming": 10,
              "current_events": 10,
              "unclassified": 3
          }

          # Concepts that are usually procedural rather than genuinely
          # curiosity-worthy knowledge questions.
          PROCEDURAL_TERMS = {
              "workflow", "file", "files", "memory", "json", "yaml",
              "commit", "branch", "repository", "run", "result",
              "output", "field", "fields", "value", "values",
              "timestamp", "date", "time", "status", "id", "ids",
              "author", "title", "content", "body"
          }

          AUTONOMY_TERMS = {
              "autonomy", "autonomous", "decision", "decisions",
              "learning", "reasoning", "attention", "curiosity",
              "knowledge", "planning", "priority", "prioritize",
              "adaptation", "self-management", "self evaluation",
              "goal", "goals", "agent"
          }

          ECONOMY_TERMS = {
              "economy", "market", "marketplace", "task", "tasks",
              "reward", "rewards", "payment", "payments", "wallet",
              "earnings", "earning", "sats", "tip", "tips",
              "bid", "bids", "trade", "trading", "value"
          }

          SECURITY_TERMS = {
              "security", "cybersecurity", "authentication", "auth",
              "token", "jwt", "permission", "permissions",
              "privacy", "threat", "vulnerability", "access",
              "credential", "encryption", "rate limit"
          }

          def normalize(text):
              text = str(text).lower()
              text = text.replace("’", "'")
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def tokens(text):
              return set(
                  w for w in re.findall(r"[a-zA-ZÀ-ÿ'-]+", normalize(text))
                  if len(w) >= 4
              )

          def stable_id(domain, concept):
              raw = f"{domain}|{normalize(concept)}"
              return hashlib.sha256(raw.encode()).hexdigest()[:16]

          def concept_quality(concept):
              """
              Returns a quality score from 0 to 20.
              A curiosity target should represent a meaningful concept,
              not merely a technical field or fragment.
              """
              t = tokens(concept)

              if not t:
                  return 0

              score = 10

              if len(t) >= 2:
                  score += 3

              if len(t) >= 3:
                  score += 2

              procedural = len(t.intersection(PROCEDURAL_TERMS))

              if procedural:
                  score -= min(8, procedural * 2)

              if len(concept) >= 12:
                  score += 2

              if len(concept) >= 25:
                  score += 1

              return max(0, min(20, score))

          def autonomy_relevance(text):
              t = normalize(text)
              score = 0

              for term in AUTONOMY_TERMS:
                  if term in t:
                      score += 2

              return min(score, 20)

          def strategic_relevance(text, domain):
              t = normalize(text)
              score = 0

              if domain == "virtual_economy":
                  score += 10

              if domain == "cybersecurity":
                  score += 10

              if domain == "ai_communities":
                  score += 8

              if domain == "agent_intelligence_autonomy":
                  score += 10

              if domain == "emerging_tech":
                  score += 6

              if domain == "laws_regulation":
                  score += 8

              if any(term in t for term in ECONOMY_TERMS):
                  score += 4

              if any(term in t for term in SECURITY_TERMS):
                  score += 4

              return min(score, 20)

          def evidence_strength(gap):
              evidence = gap.get("evidence", {})

              score = 0

              explicit = evidence.get(
                  "explicit_current_gap_signals", 0
              )

              uncertainty = evidence.get(
                  "uncertainty_signals", 0
              )

              contradiction = evidence.get(
                  "contradiction_signals", 0
              )

              sources = evidence.get(
                  "distinct_sources", 0
              )

              score += min(explicit * 7, 14)
              score += min(uncertainty * 3, 6)
              score += min(contradiction * 5, 10)
              score += min(sources * 5, 10)

              return min(score, 40)

          def novelty_score(gap, all_gaps):
              """
              Curiosity is stronger when the concept is not simply a
              duplicate of many other validated gaps.
              """
              concept = normalize(gap.get("concept", ""))
              words = tokens(concept)

              if not words:
                  return 0

              related = 0

              for other in all_gaps:
                  if other is gap:
                      continue

                  other_words = tokens(other.get("concept", ""))

                  if not other_words:
                      continue

                  overlap = len(words.intersection(other_words))

                  if overlap >= max(1, min(len(words), 2)):
                      related += 1

              if related == 0:
                  return 15

              if related == 1:
                  return 12

              if related == 2:
                  return 8

              return max(2, 15 - related * 2)

          def curiosity_label(score):
              if score >= 80:
                  return "HIGH"
              if score >= 65:
                  return "MEDIUM_HIGH"
              if score >= 50:
                  return "MEDIUM"
              return "LOW"

          # ------------------------------------------------------------
          # Load ACT21 output
          # ------------------------------------------------------------

          print("NØX ACT22 - Curiosity Engine")
          print("Mode: ATTENTION SELECTION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Research: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")

          if not INPUT_FILE.exists():
              raise SystemExit(
                  "ERROR: ACT21 memory file not found: "
                  f"{INPUT_FILE}"
              )

          try:
              act21 = json.loads(
                  INPUT_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: Cannot read ACT21 output: {exc}"
              )

          validated_gaps = act21.get("validated_gaps", [])

          if not isinstance(validated_gaps, list):
              raise SystemExit(
                  "ERROR: ACT21 validated_gaps is not a list."
              )

          print(f"Validated gaps received from ACT21: {len(validated_gaps)}")

          # ------------------------------------------------------------
          # Evaluate each validated gap
          # ------------------------------------------------------------

          evaluated = []

          for gap in validated_gaps:

              if not isinstance(gap, dict):
                  continue

              concept = str(gap.get("concept", "")).strip()
              domain = str(
                  gap.get("domain", "unclassified")
              ).strip()

              if not concept:
                  continue

              base_priority = int(
                  gap.get("priority_score", 0) or 0
              )

              quality = concept_quality(concept)

              combined_text = " ".join([
                  concept,
                  " ".join(
                      str(x)
                      for x in gap.get("contexts", [])
                  ),
                  " ".join(
                      str(x)
                      for x in gap.get("sources", [])
                  )
              ])

              autonomy = autonomy_relevance(combined_text)

              strategic = strategic_relevance(
                  combined_text,
                  domain
              )

              evidence = evidence_strength(gap)

              novelty = novelty_score(
                  gap,
                  validated_gaps
              )

              domain_weight = DOMAIN_WEIGHTS.get(
                  domain,
                  DOMAIN_WEIGHTS["unclassified"]
              )

              # Base ACT21 confidence contributes, but ACT22 must
              # independently judge whether the topic deserves attention.
              base_component = min(base_priority * 0.25, 25)

              domain_component = min(
                  domain_weight * 0.35,
                  10
              )

              final_score = (
                  base_component
                  + quality
                  + autonomy
                  + strategic
                  + evidence
                  + novelty
                  + domain_component
              )

              final_score = int(
                  max(0, min(100, round(final_score)))
              )

              # Reject extremely procedural or low-quality concepts.
              if quality < 6:
                  attention = "REJECT"
                  reason = "concept_quality_too_low"

              elif final_score < 45:
                  attention = "DEFER"
                  reason = "curiosity_value_too_low"

              elif final_score < 60:
                  attention = "WATCH"
                  reason = "interesting_but_not_priority"

              else:
                  attention = "EXPLORE"
                  reason = "worth_deeper_attention"

              evaluated.append({
                  "id": stable_id(domain, concept),
                  "domain": domain,
                  "concept": concept,
                  "act21_priority_score": base_priority,
                  "curiosity_score": final_score,
                  "curiosity_level": curiosity_label(final_score),
                  "attention_decision": attention,
                  "decision_reason": reason,
                  "signals": {
                      "concept_quality": quality,
                      "autonomy_relevance": autonomy,
                      "strategic_relevance": strategic,
                      "evidence_strength": evidence,
                      "novelty": novelty,
                      "domain_weight": domain_weight
                  },
                  "act21_evidence": gap.get(
                      "evidence",
                      {}
                  ),
                  "sources": gap.get(
                      "sources",
                      []
                  ),
                  "contexts": gap.get(
                      "contexts",
                      []
                  )
              })

          # Highest curiosity first.
          evaluated.sort(
              key=lambda x: (
                  x["curiosity_score"],
                  x["signals"]["evidence_strength"],
                  x["signals"]["autonomy_relevance"]
              ),
              reverse=True
          )

          # Only EXPLORE and WATCH are useful to downstream curiosity.
          attention_candidates = [
              item for item in evaluated
              if item["attention_decision"] in {
                  "EXPLORE",
                  "WATCH"
              }
          ]

          attention_candidates = attention_candidates[
              :MAX_ATTENTION
          ]

          # ------------------------------------------------------------
          # Curiosity themes
          # ------------------------------------------------------------

          domain_counts = Counter(
              item["domain"]
              for item in attention_candidates
          )

          high_priority = [
              item for item in attention_candidates
              if item["attention_decision"] == "EXPLORE"
          ]

          # ------------------------------------------------------------
          # Output
          # ------------------------------------------------------------

          result = {
              "act": "ACT22",
              "version": "V1",
              "name": "Curiosity Engine",
              "generated_at": datetime.now(timezone.utc).isoformat(),

              "mode": "attention_selection_only",

              "policy": {
                  "gemini": False,
                  "external_ai": False,
                  "api_calls": False,
                  "research": False,
                  "verification": False,
                  "knowledge_integration": False,
                  "decision_execution": False,
                  "marketplace_actions": False,
                  "publishing": False,
                  "comments": False,
                  "private_messages": False,
                  "bids": False,
                  "payments": False,
                  "project_cost_eur": 0,

                  "principle": (
                      "ACT22 decides what deserves attention. "
                      "It does not research, verify or integrate the answer."
                  )
              },

              "input": {
                  "source": str(INPUT_FILE),
                  "validated_gaps_received": len(validated_gaps)
              },

              "analysis": {
                  "evaluated_gaps": len(evaluated),
                  "attention_candidates": len(attention_candidates),
                  "explore_count": len(high_priority),
                  "watch_count": sum(
                      1 for item in attention_candidates
                      if item["attention_decision"] == "WATCH"
                  ),
                  "domains_selected": dict(domain_counts)
              },

              "attention_queue": attention_candidates,

              "deferred": [
                  item for item in evaluated
                  if item["attention_decision"] == "DEFER"
              ],

              "rejected": [
                  item for item in evaluated
                  if item["attention_decision"] == "REJECT"
              ],

              "next_act": {
                  "target": "ACT23",
                  "role": (
                      "Transform selected curiosity targets into "
                      "research and verification plans."
                  ),
                  "input": [
                      "attention_queue"
                  ],
                  "not_for_act22": [
                      "research",
                      "web_search",
                      "verification",
                      "knowledge_integration",
                      "decision_execution"
                  ]
              }
          }

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          OUTPUT_FILE.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Console report
          # ------------------------------------------------------------

          print("")
          print("ACT22 RESULT")
          print(f"Gaps evaluated: {len(evaluated)}")
          print(
              f"Attention candidates: "
              f"{len(attention_candidates)}"
          )
          print(
              f"EXPLORE: "
              f"{len(high_priority)}"
          )
          print(
              f"WATCH: "
              f"{sum(1 for x in attention_candidates if x['attention_decision'] == 'WATCH')}"
          )

          if attention_candidates:
              print("")
              print("Curiosity queue for ACT23:")

              for index, item in enumerate(
                  attention_candidates,
                  1
              ):
                  print(
                      f"{index}. "
                      f"[{item['curiosity_score']}] "
                      f"{item['attention_decision']} | "
                      f"{item['domain']} | "
                      f"{item['concept']}"
                  )

          else:
              print("")
              print(
                  "No validated curiosity target deserves "
                  "attention at this time."
              )

          print("")
          print(f"Output: {OUTPUT_FILE}")

          PY

      - name: Commit ACT22 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_22_curiosity.json

          if git diff --cached --quiet; then
            echo "No ACT22 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT22 - select curiosity priorities"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
