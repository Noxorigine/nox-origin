name: NØX Origin - V35 Interaction Feedback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  interaction-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Record NØX interaction feedback
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          api_key = os.getenv("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY secret not configured")

          now = datetime.now(timezone.utc).isoformat()

          # ---------------------------------------------------------
          # V35
          # Retour d'expérience après interaction avec The Colony.
          #
          # Cette version :
          # - ne publie pas automatiquement ;
          # - ne modifie pas les autres agents ;
          # - ne réalise aucune action financière ;
          # - reste entièrement gratuite ;
          # - enregistre uniquement l'état de l'interaction.
          # ---------------------------------------------------------

          feedback = memory.get("interaction_feedback", [])

          if not isinstance(feedback, list):
              feedback = []

          # ---------------------------------------------------------
          # Authentification The Colony
          # ---------------------------------------------------------

          auth_url = "https://thecolony.ai/api/v1/auth/token"

          try:
              auth_response = requests.post(
                  auth_url,
                  json={"api_key": api_key},
                  timeout=30
              )
          except Exception as exc:
              raise SystemExit(
                  f"Authentication request failed: {exc}"
              )

          print(f"Authentication status: {auth_response.status_code}")

          if auth_response.status_code != 200:
              raise SystemExit(
                  f"Authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:500]}"
              )

          try:
              auth_data = auth_response.json()
          except Exception as exc:
              raise SystemExit(
                  f"Invalid authentication response: {exc}"
              )

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise SystemExit(
                  "No access token returned by The Colony"
              )

          # ---------------------------------------------------------
          # Lecture de l'identité de NØX
          # ---------------------------------------------------------

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          try:
              me_response = requests.get(
                  "https://thecolony.ai/api/v1/users/me",
                  headers=headers,
                  timeout=30
              )
          except Exception as exc:
              raise SystemExit(
                  f"Identity request failed: {exc}"
              )

          print(f"Identity status: {me_response.status_code}")

          identity_status = (
              "success"
              if me_response.status_code == 200
              else "unavailable"
          )

          # ---------------------------------------------------------
          # Analyse locale du retour
          # ---------------------------------------------------------

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          hypotheses = memory.get("hypotheses", [])
          validation_state = memory.get(
              "validation_state",
              {}
          )

          if not isinstance(observations, list):
              observations = []

          if not isinstance(patterns, list):
              patterns = []

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(validation_state, dict):
              validation_state = {}

          supported = validation_state.get(
              "supported",
              0
          )

          uncertain = validation_state.get(
              "uncertain",
              0
          )

          rejected = validation_state.get(
              "rejected",
              0
          )

          # ---------------------------------------------------------
          # Construire le feedback
          # ---------------------------------------------------------

          feedback_entry = {
              "version": "V35",
              "timestamp": now,
              "identity_status": identity_status,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "hypotheses_total": len(hypotheses),
              "hypotheses_supported": supported,
              "hypotheses_uncertain": uncertain,
              "hypotheses_rejected": rejected,
              "interaction_mode": "controlled",
              "publication_mode": "disabled",
              "financial_actions": False,
              "cost_eur": 0,
              "method": "local_interaction_feedback_v35"
          }

          feedback.append(feedback_entry)

          # ---------------------------------------------------------
          # Historique
          # ---------------------------------------------------------

          history = memory.get("history", [])

          if not isinstance(history, list):
              history = []

          history.append({
              "version": "V35",
              "timestamp": now,
              "interaction": True,
              "identity_status": identity_status,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "hypotheses_total": len(hypotheses),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_interaction_feedback"
          })

          # ---------------------------------------------------------
          # Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V35"
          memory["updated_at"] = now
          memory["interaction_feedback"] = feedback
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V35")
          print("==========================================")
          print(f"Identity          : {identity_status}")
          print(f"Observations      : {len(observations)}")
          print(f"Patterns          : {len(patterns)}")
          print(f"Knowledge         : {len(knowledge)}")
          print(f"Hypotheses        : {len(hypotheses)}")
          print(f"Supported         : {supported}")
          print(f"Uncertain         : {uncertain}")
          print(f"Rejected          : {rejected}")
          print("------------------------------------------")
          print("Interaction       : CONTROLLED")
          print("Publication       : DISABLED")
          print("Financial action  : DISABLED")
          print("Gemini            : NOT USED")
          print("Cost              : 0 EUR")
          print("------------------------------------------")
          print("Feedback saved    : YES")
          print("==========================================")
          PY

      - name: Commit V35 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || \
            git commit -m "NØX V35 interaction feedback"

          git push
