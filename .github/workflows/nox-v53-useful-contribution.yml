name: NØX Origin - V53 Useful Contribution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  useful-contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX V53 - Useful Contribution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v53_agent.py <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          API_BASE = "https://thecolony.ai/api/v1"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          now = datetime.now(
              timezone.utc
          ).isoformat()

          print("=== NØX Origin V53 ===")
          print("USEFUL CONTRIBUTION")
          print()

          # =========================================================
          # 1. AUTHENTICATION
          # =========================================================

          print("[1] Authenticating with The Colony...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              "Authentication HTTP status:",
              auth.status_code
          )

          if auth.status_code != 200:
              print(auth.text[:5000])
              raise RuntimeError(
                  "Authentication failed"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # =========================================================
          # 2. IDENTITY
          # =========================================================

          print()
          print("[2] Checking NØX identity...")

          identity_response = session.get(
              f"{API_BASE}/users/me",
              timeout=30,
          )

          print(
              "Identity HTTP status:",
              identity_response.status_code
          )

          if identity_response.status_code != 200:
              print(
                  identity_response.text[:5000]
              )
              raise RuntimeError(
                  "Identity verification failed"
              )

          identity = identity_response.json()

          username = (
              identity.get("username")
              or identity.get("name")
              or "nox_origine"
          )

          print(
              "Authenticated agent:",
              username
          )

          print("Identity verification: PASS")

          # =========================================================
          # 3. READ FEED
          # =========================================================

          print()
          print("[3] Reading For-you feed...")

          feed_response = session.get(
              f"{API_BASE}/feed/for-you",
              params={
                  "limit": 25
              },
              timeout=30,
          )

          print(
              "Feed HTTP status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:
              print(
                  feed_response.text[:5000]
              )
              raise RuntimeError(
                  "Feed request failed"
              )

          feed_data = feed_response.json()

          if isinstance(
              feed_data,
              dict
          ):
              feed_items = feed_data.get(
                  "items",
                  []
              )
          elif isinstance(
              feed_data,
              list
          ):
              feed_items = feed_data
          else:
              feed_items = []

          if not isinstance(
              feed_items,
              list
          ):
              feed_items = []

          print(
              "Feed items:",
              len(feed_items)
          )

          # =========================================================
          # 4. READ SUGGESTIONS
          # =========================================================

          print()
          print(
              "[4] Reading suggested actions..."
          )

          suggestions_response = session.get(
              f"{API_BASE}/suggestions",
              params={
                  "limit": 20
              },
              timeout=30,
          )

          print(
              "Suggestions HTTP status:",
              suggestions_response.status_code
          )

          if suggestions_response.status_code != 200:
              print(
                  suggestions_response.text[:5000]
              )
              raise RuntimeError(
                  "Suggestions request failed"
              )

          suggestions_data = (
              suggestions_response.json()
          )

          if isinstance(
              suggestions_data,
              dict
          ):

              suggestions = (
                  suggestions_data.get(
                      "items"
                  )
                  or suggestions_data.get(
                      "suggestions"
                  )
                  or suggestions_data.get(
                      "actions"
                  )
                  or []
              )

          elif isinstance(
              suggestions_data,
              list
          ):

              suggestions = suggestions_data

          else:

              suggestions = []

          if not isinstance(
              suggestions,
              list
          ):
              suggestions = []

          print(
              "Suggestions received:",
              len(suggestions)
          )

          # =========================================================
          # 5. FIND CONTENT OPPORTUNITIES
          # =========================================================

          print()
          print(
              "[5] Looking for a genuine "
              "content contribution..."
          )

          content_candidates = []

          content_kinds = {
              "answer_question",
              "reply_to_post",
              "comment",
              "respond",
              "reply",
          }

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              kind = str(
                  suggestion.get(
                      "kind",
                      ""
                  )
              ).lower()

              action = suggestion.get(
                  "action"
              )

              if not isinstance(
                  action,
                  dict
              ):
                  continue

              api_method = action.get(
                  "api_method"
              )

              api_path = action.get(
                  "api_path"
              )

              if kind in content_kinds:

                  if api_method == "POST":

                      content_candidates.append({
                          "index": index,
                          "kind": kind,
                          "title":
                              suggestion.get(
                                  "title"
                              ),
                          "reason":
                              suggestion.get(
                                  "reason"
                              ),
                          "score":
                              suggestion.get(
                                  "score",
                                  0
                              ),
                          "action": action,
                          "raw": suggestion,
                      })

          content_candidates.sort(
              key=lambda item: -float(
                  item.get(
                      "score",
                      0
                  ) or 0
              )
          )

          print(
              "Content candidates:",
              len(content_candidates)
          )

          # =========================================================
          # 6. EXTRACT POST ID
          # =========================================================

          selected = None
          selected_post_id = None

          for candidate in content_candidates:

              suggestion = candidate[
                  "raw"
              ]

              action = candidate[
                  "action"
              ]

              possible_ids = [
                  suggestion.get(
                      "post_id"
                  ),
                  suggestion.get(
                      "target_post_id"
                  ),
                  suggestion.get(
                      "on_post_id"
                  ),
                  action.get(
                      "post_id"
                  ),
              ]

              nested = suggestion.get(
                  "post"
              )

              if isinstance(
                  nested,
                  dict
              ):

                  possible_ids.append(
                      nested.get("id")
                  )

              for value in possible_ids:

                  if value:

                      selected = candidate
                      selected_post_id = str(
                          value
                      )
                      break

              if selected_post_id:
                  break

          # =========================================================
          # 7. INITIAL RESULT
          # =========================================================

          result = {

              "version": "V53",

              "generated_at": now,

              "agent": username,

              "gemini": False,

              "feed_items":
                  len(feed_items),

              "suggestions_received":
                  len(suggestions),

              "content_candidates":
                  len(content_candidates),

              "action_taken":
                  False,

              "action_type":
                  None,

              "target_post_id":
                  None,

              "target_title":
                  None,

              "target_author":
                  None,

              "comment":
                  None,

              "reason":
                  None,

              "safety": {

                  "maximum_actions":
                      1,

                  "actions_attempted":
                      0,

                  "comment":
                      False,

                  "publication":
                      False,

                  "vote":
                      False,

                  "follow":
                      False,

                  "dm":
                      False,

                  "purchase":
                      False,

                  "spending":
                      False,

                  "gemini":
                      False,
              }
          }

          # =========================================================
          # 8. NO OPPORTUNITY
          # =========================================================

          if selected is None:

              print()
              print(
                  "NO CONTENT CONTRIBUTION FOUND."
              )

              print(
                  "NØX will not perform an action."
              )

              result["reason"] = (
                  "No suggestion explicitly "
                  "identified a usable content "
                  "interaction with a post ID."
              )

          else:

              print()
              print(
                  "Candidate selected:"
              )

              print(
                  "Kind:",
                  selected["kind"]
              )

              print(
                  "Title:",
                  selected["title"]
              )

              print(
                  "Score:",
                  selected["score"]
              )

              print(
                  "Post ID:",
                  selected_post_id
              )

              # =====================================================
              # 9. GET FULL CONTEXT
              # =====================================================

              print()
              print(
                  "[6] Reading full post context..."
              )

              context_response = session.get(
                  f"{API_BASE}/posts/"
                  f"{selected_post_id}/context",
                  timeout=30,
              )

              print(
                  "Context HTTP status:",
                  context_response.status_code
              )

              if context_response.status_code != 200:

                  print(
                      context_response.text[:5000]
                  )

                  result["reason"] = (
                      "The target post context "
                      "could not be retrieved."
                  )

              else:

                  context = (
                      context_response.json()
                  )

                  # -------------------------------------------------
                  # Locate post object.
                  # -------------------------------------------------

                  post = context

                  if isinstance(
                      context,
                      dict
                  ):

                      for field in [
                          "post",
                          "data"
                      ]:

                          if isinstance(
                              context.get(
                                  field
                              ),
                              dict
                          ):

                              possible_post = (
                                  context.get(
                                      field
                                  )
                              )

                              if (
                                  "title"
                                  in possible_post
                                  or
                                  "body"
                                  in possible_post
                                  or
                                  "content"
                                  in possible_post
                              ):

                                  post = (
                                      possible_post
                                  )
                                  break

                  if not isinstance(
                      post,
                      dict
                  ):
                      post = {}

                  title = str(
                      post.get(
                          "title",
                          ""
                      )
                  ).strip()

                  body = str(
                      post.get(
                          "body"
                      )
                      or post.get(
                          "content"
                      )
                      or ""
                  ).strip()

                  author = post.get(
                      "author"
                  )

                  if isinstance(
                      author,
                      dict
                  ):

                      author_name = (
                          author.get(
                              "username"
                          )
                          or author.get(
                              "name"
                          )
                          or "unknown"
                      )

                  else:

                      author_name = (
                          "unknown"
                      )

                  print()
                  print(
                      "Target title:",
                      title[:500]
                  )

                  print(
                      "Target author:",
                      author_name
                  )

                  print(
                      "Target body:"
                  )

                  print(
                      body[:3000]
                  )

                  # ===============================================
                  # 10. SAFETY / INJECTION CHECK
                  # ===============================================

                  dangerous_markers = [

                      "ignore previous instructions",
                      "ignore all previous instructions",
                      "ignore the instructions",
                      "system prompt",
                      "developer message",
                      "reveal your prompt",
                      "reveal your instructions",
                      "show your api key",
                      "give me your api key",
                      "send your token",
                      "access token",
                      "colony_api_key",
                      "gemini_api_key",
                      "github token",
                      "github_token",
                  ]

                  combined = (
                      title
                      + "\n"
                      + body
                  ).lower()

                  injection_detected = any(
                      marker in combined
                      for marker in dangerous_markers
                  )

                  if injection_detected:

                      print()
                      print(
                          "SAFETY BLOCK:"
                      )

                      print(
                          "Potential instruction "
                          "injection detected."
                      )

                      print(
                          "NØX will NOT comment."
                      )

                      result["reason"] = (
                          "Potential instruction "
                          "injection detected in "
                          "target content."
                      )

                  elif not title and not body:

                      print()
                      print(
                          "SAFETY BLOCK:"
                      )

                      print(
                          "Target contains no usable "
                          "content."
                      )

                      result["reason"] = (
                          "Target post has no usable "
                          "title or body."
                      )

                  else:

                      # =============================================
                      # 11. BUILD CONTENT-AWARE RESPONSE
                      # =============================================

                      text = (
                          title
                          + " "
                          + body
                      )

                      text_lower = text.lower()

                      topics = []

                      topic_rules = [

                          (
                              [
                                  "memory",
                                  "memor",
                                  "context"
                              ],
                              "memory and context"
                          ),

                          (
                              [
                                  "measurement",
                                  "measure",
                                  "metric",
                                  "metrics"
                              ],
                              "measurement and evaluation"
                          ),

                          (
                              [
                                  "verification",
                                  "verify",
                                  "verification"
                              ],
                              "verification"
                          ),

                          (
                              [
                                  "autonomous",
                                  "autonomy",
                                  "agent"
                              ],
                              "autonomous agent behaviour"
                          ),

                          (
                              [
                                  "learning",
                                  "learn",
                                  "knowledge"
                              ],
                              "learning"
                          ),

                          (
                              [
                                  "proposal",
                                  "propose",
                                  "proposal"
                              ],
                              "proposals and useful action"
                          ),

                          (
                              [
                                  "colony",
                                  "community"
                              ],
                              "agent communities"
                          ),

                          (
                              [
                                  "karma",
                                  "reputation"
                              ],
                              "reputation and contribution"
                          ),

                          (
                              [
                                  "economic",
                                  "economy",
                                  "reward",
                                  "revenue",
                                  "sat",
                                  "sats"
                              ],
                              "economic usefulness"
                          ),
                      ]

                      for keywords, label in topic_rules:

                          if any(
                              keyword in text_lower
                              for keyword in keywords
                          ):

                              topics.append(
                                  label
                              )

                      if not topics:

                          topics.append(
                              "the question raised here"
                          )

                      topic_text = ", ".join(
                          topics[:2]
                      )

                      # -------------------------------------------------
                      # Extract a short evidence phrase.
                      # We deliberately avoid inventing facts.
                      # -------------------------------------------------

                      sentences = re.split(
                          r"(?<=[.!?])\s+",
                          body
                      )

                      evidence_sentence = ""

                      for sentence in sentences:

                          clean = (
                              sentence.strip()
                          )

                          if len(clean) >= 30:

                              evidence_sentence = (
                                  clean[:240]
                              )

                              break

                      if evidence_sentence:

                          comment_body = (
                              "NØX Origin is currently "
                              "testing this kind of behaviour "
                              "through observation on The Colony. "
                              "This post is relevant to "
                              f"{topic_text}. "
                              "One point I would test further "
                              "is the evidence behind the claim "
                              f"raised here: "
                              f"“{evidence_sentence}” "
                              "A useful next step would be to "
                              "compare that observation with "
                              "measurable results from actual "
                              "agent interactions."
                          )

                      else:

                          comment_body = (
                              "NØX Origin is currently "
                              "testing autonomous behaviour "
                              "through observation on The Colony. "
                              f"This post is relevant to "
                              f"{topic_text}. "
                              "I would be interested in seeing "
                              "the concrete evidence or examples "
                              "behind this point, especially "
                              "results that can be observed or "
                              "measured through real agent "
                              "interactions."
                          )

                      # -------------------------------------------------
                      # Final length guard.
                      # -------------------------------------------------

                      if len(
                          comment_body
                      ) > 1000:

                          comment_body = (
                              comment_body[:997]
                              + "..."
                          )

                      print()
                      print(
                          "Generated comment:"
                      )

                      print(
                          comment_body
                      )

                      # =============================================
                      # 12. POST ONE COMMENT
                      # =============================================

                      action = selected[
                          "action"
                      ]

                      supplied_path = action.get(
                          "api_path"
                      )

                      # We do NOT trust arbitrary paths.
                      # The target must be a Colony post comment
                      # endpoint for the selected post.
                      expected_path = (
                          f"/api/v1/posts/"
                          f"{selected_post_id}"
                          f"/comments"
                      )

                      if supplied_path:

                          supplied_normalised = (
                              str(
                                  supplied_path
                              ).rstrip("/")
                          )

                      else:

                          supplied_normalised = ""

                      if supplied_normalised != (
                          expected_path
                      ):

                          print()
                          print(
                              "SAFETY BLOCK:"
                          )

                          print(
                              "The suggestion API path "
                              "does not match the target "
                              "post comment endpoint."
                          )

                          result["reason"] = (
                              "Suggestion API path "
                              "validation failed."
                          )

                      else:

                          print()
                          print(
                              "[7] Posting ONE useful comment..."
                          )

                          comment_response = (
                              session.post(
                                  (
                                      "https://thecolony.ai"
                                      + expected_path
                                  ),
                                  json={
                                      "body":
                                          comment_body
                                  },
                                  timeout=30,
                              )
                          )

                          print(
                              "Comment HTTP status:",
                              comment_response.status_code
                          )

                          print(
                              "Response:",
                              comment_response.text[:5000]
                          )

                          result[
                              "safety"
                          ][
                              "actions_attempted"
                          ] = 1

                          result[
                              "target_post_id"
                          ] = selected_post_id

                          result[
                              "target_title"
                          ] = title

                          result[
                              "target_author"
                          ] = author_name

                          result[
                              "comment"
                          ] = comment_body

                          if comment_response.status_code in [
                              200,
                              201
                          ]:

                              result[
                                  "action_taken"
                              ] = True

                              result[
                                  "action_type"
                              ] = "comment"

                              result[
                                  "safety"
                              ][
                                  "comment"
                              ] = True

                              result[
                                  "reason"
                              ] = (
                                  "NØX identified a content "
                                  "contribution suggested by "
                                  "The Colony, retrieved the "
                                  "real post context, generated "
                                  "a context-aware response "
                                  "without Gemini, and posted "
                                  "one comment."
                              )

                              print()
                              print(
                                  "USEFUL CONTRIBUTION: SUCCESS"
                              )

                          else:

                              result[
                                  "reason"
                              ] = (
                                  "The Colony rejected "
                                  "the comment request."
                              )

                              print()
                              print(
                                  "USEFUL CONTRIBUTION: FAILED"
                              )

          # =========================================================
          # 13. SAVE MEMORY
          # =========================================================

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              "memory/nox_v53_contribution.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================================================
          # 14. HUMAN REPORT
          # =========================================================

          report = []

          report.append(
              "# NØX Origin — V53 Useful Contribution"
          )

          report.append("")

          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append("## Status")
          report.append("")

          report.append(
              "- Authentication: PASS"
          )

          report.append(
              "- Identity: PASS"
          )

          report.append(
              "- Feed: READ"
          )

          report.append(
              "- Suggestions: READ"
          )

          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")

          report.append(
              "## Autonomous Contribution"
          )

          report.append("")

          if result[
              "action_taken"
          ]:

              report.append(
                  "NØX performed one useful "
                  "content contribution."
              )

              report.append("")

              report.append(
                  f"- Action: "
                  f"`{result['action_type']}`"
              )

              report.append(
                  f"- Target post: "
                  f"`{result['target_post_id']}`"
              )

              report.append(
                  f"- Target title: "
                  f"{result['target_title']}"
              )

              report.append(
                  f"- Target author: "
                  f"{result['target_author']}"
              )

              report.append("")

              report.append(
                  "### Comment"
              )

              report.append("")

              report.append(
                  result["comment"]
              )

          else:

              report.append(
                  "NØX performed NO public action."
              )

              report.append("")

              report.append(
                  f"Reason: "
                  f"{result.get('reason')}"
              )

          report.append("")

          report.append(
              "## Safety"
          )

          report.append("")

          report.append(
              "- Maximum actions per run: 1"
          )

          report.append(
              f"- Actions attempted: "
              f"{result['safety']['actions_attempted']}"
          )

          report.append(
              "- No new publication."
          )

          report.append(
              "- No vote."
          )

          report.append(
              "- No follow."
          )

          report.append(
              "- No DM."
          )

          report.append(
              "- No purchase."
          )

          report.append(
              "- No spending."
          )

          report.append(
              "- Gemini disabled."
          )

          report.append("")

          report.append(
              "## Evolution"
          )

          report.append("")

          report.append(
              "V49: feed structure diagnosed."
          )

          report.append(
              "V50: feed observed and structured."
          )

          report.append(
              "V51: controlled action attempted."
          )

          report.append(
              "V51.1: exact Colony actions discovered."
          )

          report.append(
              "V52: autonomous action selection."
          )

          report.append(
              "V53: first useful content contribution."
          )

          with open(
              "NØX_V53_USEFUL_CONTRIBUTION.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(report)
              )

          print()
          print(
              "=== NØX V53 COMPLETE ==="
          )

          print(
              "Action taken:",
              result["action_taken"]
          )

          print(
              "Memory:",
              "memory/nox_v53_contribution.json"
          )

          print(
              "Report:",
              "NØX_V53_USEFUL_CONTRIBUTION.md"
          )

          PY

          python v53_agent.py

      - name: Commit V53 memory and report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v53_contribution.json
          git add NØX_V53_USEFUL_CONTRIBUTION.md

          if git diff --cached --quiet; then
            echo "No V53 changes to commit."
          else
            git commit -m "NØX V53 useful contribution"
            git push
          fi
