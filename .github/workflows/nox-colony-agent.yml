name: NOX - Colony Marketplace Agent (v3 - working)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes

permissions:
  contents: write

concurrency:
  group: nox-colony-agent
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_colony_state.json
  MAX_TASKS_PER_RUN: "10"
  MAX_COMMENTS_PER_RUN: "2"     # limite de sécurité : combien de tâches on commente par run

jobs:
  colony-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install colony-sdk
        run: pip install colony-sdk

      - name: Run NOX Colony Agent
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from colony_sdk import ColonyClient, ColonyAuthError, ColonyAPIError

          API_KEY = os.environ["COLONY_API_KEY"].strip()
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS_PER_RUN"])

          # -----------------------------------------------------------
          # Ce que ton agent sait faire. Adapte cette liste à toi.
          # Si aucun mot-clé ne matche le texte de la tâche, on l'ignore.
          # -----------------------------------------------------------
          CAPABILITIES = {
              "recherche web": ["research", "recherche", "find information", "investigate"],
              "rédaction": ["write", "writing", "report", "summary", "résumé", "article"],
              "python": ["python", "script"],
              "données": ["data", "csv", "json", "clean", "extract"],
          }

          # -----------------------------------------------------------
          # Mémoire : on ne commente jamais deux fois la même tâche
          # -----------------------------------------------------------
          def load_memory():
              if not MEMORY_FILE.exists():
                  return {"commented_post_ids": []}
              try:
                  return json.loads(MEMORY_FILE.read_text(encoding="utf-8"))
              except Exception:
                  return {"commented_post_ids": []}

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)
              MEMORY_FILE.write_text(
                  json.dumps(memory, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          memory = load_memory()
          already_commented = set(memory.get("commented_post_ids", []))

          # -----------------------------------------------------------
          # Connexion
          # -----------------------------------------------------------
          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant (secret GitHub non configuré).")

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError:
              raise SystemExit("Clé API invalide ou révoquée.")
          except ColonyAPIError as e:
              raise SystemExit(f"Erreur API Colony : {e}")

          profile = state["profile"]
          print(f"Connecté en tant que : {profile['username']} (karma: {profile.get('karma')})")

          me = client.get_me()
          if not me.get("lightning_address"):
              print("ATTENTION : aucune adresse Lightning sur le profil -> tu ne peux pas être payé.")

          # -----------------------------------------------------------
          # Chercher des tâches payées dans agent-economy
          # -----------------------------------------------------------
          tasks = client.get_posts(
              colony="agent-economy",
              sort="newest",
              post_type="paid_task",
              limit=MAX_TASKS,
          )

          # -----------------------------------------------------------
          # Filtrer les posts qui sont eux-mêmes des OFFRES de service
          # (quelqu'un qui vend ses services), pas des DEMANDES.
          # On ne veut répondre qu'aux vraies demandes de travail.
          # -----------------------------------------------------------
          SUPPLY_MARKERS = [
              "for hire", "i offer", "my service", "available service",
              "offering", "i can provide", "i'm offering", "services available",
          ]

          def is_supply_post(text):
              return any(marker in text for marker in SUPPLY_MARKERS)

          items = tasks.get("items", [])
          print(f"Tâches trouvées : {len(items)}")

          matched = []
          for post in items:
              post_id = post["id"]

              if post_id in already_commented:
                  continue

              title = post.get("title", "")
              body = post.get("body", "")
              text = (title + " " + body).lower()

              if is_supply_post(text):
                  continue  # quelqu'un vend ses services, ce n'est pas une tâche à prendre

              matched_skills = [
                  skill
                  for skill, keywords in CAPABILITIES.items()
                  if any(kw in text for kw in keywords)
              ]

              if matched_skills:
                  matched.append((post, matched_skills))

          print(f"Tâches correspondant à tes compétences : {len(matched)}")

          # -----------------------------------------------------------
          # Répondre aux tâches (limité par run pour rester prudent)
          # Message personnalisé avec le titre pour éviter l'anti-spam
          # -----------------------------------------------------------
          commented_this_run = 0

          for post, skills in matched[:MAX_COMMENTS]:
              post_id = post["id"]
              title = post.get("title", "cette tâche")
              short_title = title[:60]

              comment_body = (
                  f"Bonjour, je suis un agent autonome et je peux prendre en charge "
                  f"« {short_title} » (compétences : {', '.join(skills)}). "
                  f"N'hésitez pas à me contacter en DM pour discuter du livrable, "
                  f"du délai et du montant en sats."
              )

              try:
                  client.create_comment(post_id, comment_body)
                  print(f"Commenté sur la tâche {post_id} : {post.get('title')}")
                  already_commented.add(post_id)
                  commented_this_run += 1
              except ColonyAPIError as e:
                  print(f"Échec du commentaire sur {post_id} : {e}")

          print(f"Commentaires postés ce run : {commented_this_run}")

          # -----------------------------------------------------------
          # Vérification des DM / notifications non lus
          # On ne répond pas automatiquement (trop risqué), on se contente
          # de les signaler clairement dans les logs pour que tu ailles
          # y répondre toi-même sur thecolony.ai.
          # -----------------------------------------------------------
          seen_notification_ids = set(memory.get("seen_notification_ids", []))

          try:
              unread_count = client.get_unread_count()
              print(f"Messages non lus (total) : {unread_count}")
          except ColonyAPIError as e:
              print(f"Impossible de récupérer le compteur de messages non lus : {e}")

          new_alerts = 0

          try:
              notifications = client.get_notifications(unread_only=True)

              if isinstance(notifications, dict):
                  notif_items = notifications.get("items", notifications.get("notifications", []))
              elif isinstance(notifications, list):
                  notif_items = notifications
              else:
                  notif_items = []

              for notif in notif_items:
                  notif_id = str(notif.get("id") or notif.get("notification_id") or "")

                  if not notif_id or notif_id in seen_notification_ids:
                      continue

                  notif_type = notif.get("type", "notification")
                  sender = notif.get("username") or notif.get("from") or notif.get("actor") or "quelqu'un"
                  message = notif.get("message") or notif.get("body") or notif.get("text") or ""

                  print(f"🔔 NOUVELLE NOTIFICATION [{notif_type}] de {sender} : {message[:200]}")

                  seen_notification_ids.add(notif_id)
                  new_alerts += 1

          except ColonyAPIError as e:
              print(f"Impossible de récupérer les notifications : {e}")

          print(f"Nouvelles alertes ce run : {new_alerts}")
          if new_alerts > 0:
              print("👉 Va sur thecolony.ai pour lire et répondre à ces messages.")

          # -----------------------------------------------------------
          # Sauvegarde mémoire
          # -----------------------------------------------------------
          memory["commented_post_ids"] = list(already_commented)[-1000:]
          memory["seen_notification_ids"] = list(seen_notification_ids)[-1000:]
          save_memory(memory)

          print("=== TERMINÉ ===")
          PY

      - name: Commit memory
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"
          git add memory/nox_colony_state.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "nox: update colony agent memory"
            git push
          fi
