name: NØX Origin - V51.1 Action Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  action-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Discover The Colony suggestions
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v51_1_discovery.py <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          API_BASE = "https://thecolony.ai/api/v1"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          now = datetime.now(
              timezone.utc
          ).isoformat()

          print("=== NØX Origin V51.1 ===")
          print("ACTION DISCOVERY")
          print()

          # =========================================================
          # 1. AUTHENTICATION
          # =========================================================

          print("[1] Authenticating with The Colony...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              f"Authentication HTTP status: "
              f"{auth.status_code}"
          )

          if auth.status_code != 200:
              print(auth.text[:5000])
              raise RuntimeError(
                  "The Colony authentication failed"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "Authentication succeeded "
                  "but no access token was found"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # =========================================================
          # 2. IDENTITY
          # =========================================================

          print()
          print("[2] Checking NØX identity...")

          identity_response = session.get(
              f"{API_BASE}/users/me",
              timeout=30,
          )

          print(
              f"Identity HTTP status: "
              f"{identity_response.status_code}"
          )

          if identity_response.status_code != 200:
              print(
                  identity_response.text[:5000]
              )
              raise RuntimeError(
                  "Identity verification failed"
              )

          identity = identity_response.json()

          username = (
              identity.get("username")
              or identity.get("name")
              or "nox_origine"
          )

          print(
              f"Authenticated agent: {username}"
          )

          print("Identity verification: PASS")

          # =========================================================
          # 3. FEED
          # =========================================================

          print()
          print("[3] Reading For-you feed...")

          feed_response = session.get(
              f"{API_BASE}/feed/for-you",
              params={
                  "limit": 25
              },
              timeout=30,
          )

          print(
              f"Feed HTTP status: "
              f"{feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              print(
                  feed_response.text[:5000]
              )
              raise RuntimeError(
                  "For-you feed request failed"
              )

          feed = feed_response.json()

          if isinstance(feed, dict):
              feed_items = feed.get(
                  "items",
                  []
              )
          elif isinstance(feed, list):
              feed_items = feed
          else:
              feed_items = []

          if not isinstance(
              feed_items,
              list
          ):
              feed_items = []

          print(
              f"Feed items received: "
              f"{len(feed_items)}"
          )

          print("Feed request: PASS")

          # =========================================================
          # 4. SUGGESTIONS
          # =========================================================

          print()
          print(
              "[4] Reading The Colony "
              "suggested actions..."
          )

          suggestions_response = session.get(
              f"{API_BASE}/suggestions",
              params={
                  "limit": 20
              },
              timeout=30,
          )

          print(
              f"Suggestions HTTP status: "
              f"{suggestions_response.status_code}"
          )

          if suggestions_response.status_code != 200:
              print(
                  suggestions_response.text[:10000]
              )
              raise RuntimeError(
                  "Suggestions request failed"
              )

          suggestions_data = (
              suggestions_response.json()
          )

          print()
          print("Raw suggestions response type:")
          print(
              type(
                  suggestions_data
              ).__name__
          )

          # =========================================================
          # 5. NORMALISE RESPONSE
          # =========================================================

          if isinstance(
              suggestions_data,
              dict
          ):

              if isinstance(
                  suggestions_data.get(
                      "items"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data[
                          "items"
                      ]
                  )

              elif isinstance(
                  suggestions_data.get(
                      "suggestions"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data[
                          "suggestions"
                      ]
                  )

              elif isinstance(
                  suggestions_data.get(
                      "actions"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data[
                          "actions"
                      ]
                  )

              else:
                  suggestions = []

          elif isinstance(
              suggestions_data,
              list
          ):

              suggestions = suggestions_data

          else:

              suggestions = []

          print(
              f"Normalised suggestions: "
              f"{len(suggestions)}"
          )

          # =========================================================
          # 6. DISPLAY EXACT STRUCTURE
          # =========================================================

          print()
          print(
              "================================================"
          )
          print(
              "EXACT SUGGESTION STRUCTURE"
          )
          print(
              "================================================"
          )

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              print()
              print(
                  f"--- SUGGESTION {index} ---"
              )

              if isinstance(
                  suggestion,
                  dict
              ):

                  print(
                      json.dumps(
                          suggestion,
                          ensure_ascii=False,
                          indent=2
                      )[:10000]
                  )

              else:

                  print(
                      repr(
                          suggestion
                      )[:10000]
                  )

          # =========================================================
          # 7. EXTRACT ACTION METADATA
          # =========================================================

          discovered_actions = []

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              if not isinstance(
                  suggestion,
                  dict
              ):
                  discovered_actions.append({
                      "index": index,
                      "valid": False,
                      "raw": repr(
                          suggestion
                      )
                  })
                  continue

              action = {
                  "index": index,
                  "valid": True,
                  "id": suggestion.get(
                      "id"
                  ),
                  "type": suggestion.get(
                      "type"
                  ),
                  "kind": suggestion.get(
                      "kind"
                  ),
                  "category": suggestion.get(
                      "category"
                  ),
                  "title": suggestion.get(
                      "title"
                  ),
                  "reason": suggestion.get(
                      "reason"
                  ),
                  "score": suggestion.get(
                      "score"
                  ),
                  "priority": suggestion.get(
                      "priority"
                  ),
                  "action": suggestion.get(
                      "action"
                  ),
                  "api": suggestion.get(
                      "api"
                  ),
                  "endpoint": suggestion.get(
                      "endpoint"
                  ),
                  "method": suggestion.get(
                      "method"
                  ),
                  "sdk": suggestion.get(
                      "sdk"
                  ),
                  "mcp": suggestion.get(
                      "mcp"
                  ),
                  "how_to_url": suggestion.get(
                      "how_to_url"
                  ),
              }

              # Preserve the complete original object.
              action["raw"] = suggestion

              discovered_actions.append(
                  action
              )

          # =========================================================
          # 8. SAFETY
          # =========================================================

          safety = {
              "action_taken": False,
              "publication": False,
              "comment": False,
              "vote": False,
              "follow": False,
              "dm": False,
              "purchase": False,
              "spending": False,
              "external_action": False,
              "gemini": False,
          }

          # =========================================================
          # 9. MEMORY
          # =========================================================

          memory = {

              "version": "V51.1",

              "generated_at": now,

              "agent": {
                  "username": username,
                  "identity": identity,
              },

              "feed": {
                  "items_received":
                      len(feed_items),
              },

              "suggestions": {

                  "http_status":
                      suggestions_response.status_code,

                  "response_type":
                      type(
                          suggestions_data
                      ).__name__,

                  "count":
                      len(suggestions),

                  "raw_response":
                      suggestions_data,

                  "actions":
                      discovered_actions,
              },

              "safety":
                  safety,
          }

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              "memory/nox_v51_1_action_discovery.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  memory,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================================================
          # 10. HUMAN REPORT
          # =========================================================

          report = []

          report.append(
              "# NØX Origin — V51.1 Action Discovery"
          )

          report.append("")

          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append("## Status")
          report.append("")

          report.append(
              "- The Colony authentication: PASS"
          )

          report.append(
              "- Identity verification: PASS"
          )

          report.append(
              "- For-you feed: PASS"
          )

          report.append(
              "- Suggestions endpoint: PASS"
          )

          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")

          report.append("## Feed")
          report.append("")

          report.append(
              f"- Items received: "
              f"{len(feed_items)}"
          )

          report.append("")

          report.append(
              "## Suggestions"
          )

          report.append("")

          report.append(
              f"- Suggestions received: "
              f"{len(suggestions)}"
          )

          report.append("")

          for action in discovered_actions:

              report.append(
                  f"### Suggestion "
                  f"{action.get('index')}"
              )

              report.append("")

              report.append(
                  f"- Valid: "
                  f"{action.get('valid')}"
              )

              if action.get(
                  "type"
              ) is not None:

                  report.append(
                      f"- Type: "
                      f"`{action.get('type')}`"
                  )

              if action.get(
                  "kind"
              ) is not None:

                  report.append(
                      f"- Kind: "
                      f"`{action.get('kind')}`"
                  )

              if action.get(
                  "category"
              ) is not None:

                  report.append(
                      f"- Category: "
                      f"`{action.get('category')}`"
                  )

              if action.get(
                  "title"
              ) is not None:

                  report.append(
                      f"- Title: "
                      f"{action.get('title')}"
                  )

              if action.get(
                  "reason"
              ) is not None:

                  report.append(
                      f"- Reason: "
                      f"{action.get('reason')}"
                  )

              if action.get(
                  "score"
              ) is not None:

                  report.append(
                      f"- Score: "
                      f"`{action.get('score')}`"
                  )

              if action.get(
                  "priority"
              ) is not None:

                  report.append(
                      f"- Priority: "
                      f"`{action.get('priority')}`"
                  )

              if action.get(
                  "action"
              ) is not None:

                  report.append(
                      f"- Action: "
                      f"`{action.get('action')}`"
                  )

              if action.get(
                  "method"
              ) is not None:

                  report.append(
                      f"- Method: "
                      f"`{action.get('method')}`"
                  )

              if action.get(
                  "endpoint"
              ) is not None:

                  report.append(
                      f"- Endpoint: "
                      f"`{action.get('endpoint')}`"
                  )

              if action.get(
                  "api"
              ) is not None:

                  report.append(
                      "- API instruction:"
                  )

                  report.append("")

                  report.append(
                      "```text"
                  )

                  report.append(
                      str(
                          action.get(
                              "api"
                          )
                      )
                  )

                  report.append(
                      "```"
                  )

              if action.get(
                  "sdk"
              ) is not None:

                  report.append(
                      f"- SDK: "
                      f"`{action.get('sdk')}`"
                  )

              if action.get(
                  "mcp"
              ) is not None:

                  report.append(
                      f"- MCP: "
                      f"`{action.get('mcp')}`"
                  )

              if action.get(
                  "how_to_url"
              ) is not None:

                  report.append(
                      f"- How-to: "
                      f"{action.get('how_to_url')}"
                  )

              report.append("")

          report.append(
              "## Safety"
          )

          report.append("")

          report.append(
              "- NO public action performed."
          )

          report.append(
              "- NO comment."
          )

          report.append(
              "- NO publication."
          )

          report.append(
              "- NO vote."
          )

          report.append(
              "- NO follow."
          )

          report.append(
              "- NO DM."
          )

          report.append(
              "- NO purchase."
          )

          report.append(
              "- NO spending."
          )

          report.append(
              "- Gemini disabled."
          )

          report.append("")

          report.append(
              "## Purpose"
          )

          report.append("")

          report.append(
              "V51.1 discovers the exact action "
              "instructions returned by The Colony."
          )

          report.append(
              "V51.1 performs no external action."
          )

          with open(
              "NØX_V51_1_ACTION_DISCOVERY.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(report)
              )

          print()
          print(
              "=== V51.1 DISCOVERY COMPLETE ==="
          )

          print(
              f"Suggestions analysed: "
              f"{len(suggestions)}"
          )

          print(
              "No external action was performed."
          )

          print(
              "Memory:",
              "memory/"
              "nox_v51_1_action_discovery.json"
          )

          print(
              "Report:",
              "NØX_V51_1_ACTION_DISCOVERY.md"
          )

          PY

          python v51_1_discovery.py

      - name: Commit V51.1 discovery
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v51_1_action_discovery.json
          git add NØX_V51_1_ACTION_DISCOVERY.md

          if git diff --cached --quiet; then
            echo "No V51.1 changes to commit."
          else
            git commit -m "NØX V51.1 action discovery"
            git push
          fi
