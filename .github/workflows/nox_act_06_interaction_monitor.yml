name: NØX ACT 06 Autonomous Interaction Monitor V2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  interaction-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT 06 V2 contextual interaction monitor
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import requests
          from datetime import datetime, timezone

          API_KEY = os.environ.get("COLONY_API_KEY")
          BASE_URL = "https://thecolony.cc/api/v1"

          POSTS_URL = f"{BASE_URL}/posts"

          MEMORY_DIR = "memory"
          MEMORY_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_06_interaction_monitor_v2.json"
          )

          LIMIT = 100

          os.makedirs(MEMORY_DIR, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "version": "ACT 06 V2",
                      "generated_at": None,
                      "observed_posts": {},
                      "statistics": {
                          "runs": 0,
                          "posts_seen": 0,
                          "relevant_interactions": 0
                      }
                  }

              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {
                      "version": "ACT 06 V2",
                      "generated_at": None,
                      "observed_posts": {},
                      "statistics": {
                          "runs": 0,
                          "posts_seen": 0,
                          "relevant_interactions": 0
                      }
                  }

          def save_memory(memory):
              temp_file = MEMORY_FILE + ".tmp"

              with open(temp_file, "w", encoding="utf-8") as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(temp_file, MEMORY_FILE)

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").strip().lower()
              )

          def get_text(post):
              title = str(post.get("title") or "")
              body = str(
                  post.get("body")
                  or post.get("content")
                  or post.get("description")
                  or ""
              )

              return f"{title} {body}".strip()

          def detect_context(text):
              text = normalize(text)

              contexts = []

              patterns = {
                  "question": [
                      r"\?",
                      r"\bhow do i\b",
                      r"\bhow can i\b",
                      r"\bdoes anyone know\b",
                      r"\banyone know\b"
                  ],
                  "request_for_help": [
                      r"\bneed help\b",
                      r"\bhelp needed\b",
                      r"\blooking for help\b",
                      r"\bcan someone help\b",
                      r"\bneed someone\b"
                  ],
                  "technical": [
                      r"\bapi\b",
                      r"\bpython\b",
                      r"\bgithub\b",
                      r"\bworkflow\b",
                      r"\bautomation\b",
                      r"\bcode\b",
                      r"\bbug\b",
                      r"\berror\b",
                      r"\bdebug\b"
                  ],
                  "opportunity": [
                      r"\btask\b",
                      r"\bjob\b",
                      r"\bwork\b",
                      r"\bpaid\b",
                      r"\breward\b",
                      r"\brewarded\b",
                      r"\bpayment\b",
                      r"\btips?\b",
                      r"\bmarketplace\b"
                  ],
                  "collaboration": [
                      r"\bcollaborat",
                      r"\bteam\b",
                      r"\bpartner\b",
                      r"\bworking together\b",
                      r"\blooking for an agent\b"
                  ]
              }

              for context, context_patterns in patterns.items():
                  if any(
                      re.search(pattern, text)
                      for pattern in context_patterns
                  ):
                      contexts.append(context)

              return contexts

          def assess_relevance(post, contexts):
              text = normalize(get_text(post))

              score = 0
              reasons = []

              if "request_for_help" in contexts:
                  score += 3
                  reasons.append("request_for_help")

              if "opportunity" in contexts:
                  score += 3
                  reasons.append("opportunity")

              if "collaboration" in contexts:
                  score += 2
                  reasons.append("collaboration")

              if "technical" in contexts:
                  score += 1
                  reasons.append("technical")

              if "question" in contexts:
                  score += 1
                  reasons.append("question")

              high_risk_patterns = [
                  r"\bprivate key\b",
                  r"\bseed phrase\b",
                  r"\brecovery phrase\b",
                  r"\bmnemonic\b",
                  r"\bwallet password\b",
                  r"\bsend crypto\b",
                  r"\btransfer crypto\b",
                  r"\bpay upfront\b",
                  r"\bpay first\b"
              ]

              high_risk = any(
                  re.search(pattern, text)
                  for pattern in high_risk_patterns
              )

              if high_risk:
                  return {
                      "relevance": "HIGH_RISK",
                      "score": score,
                      "reasons": reasons,
                      "action_required": False
                  }

              if score >= 5:
                  relevance = "HIGH"
              elif score >= 3:
                  relevance = "MEDIUM"
              elif score >= 1:
                  relevance = "LOW"
              else:
                  relevance = "NONE"

              return {
                  "relevance": relevance,
                  "score": score,
                  "reasons": reasons,
                  "action_required": False
              }

          memory = load_memory()

          headers = {
              "Accept": "application/json",
              "Authorization": f"Bearer {API_KEY}"
          }

          response = requests.get(
              POSTS_URL,
              headers=headers,
              params={
                  "limit": LIMIT,
                  "offset": 0
              },
              timeout=30
          )

          print(f"Posts HTTP status: {response.status_code}")

          response.raise_for_status()

          payload = response.json()

          if isinstance(payload, dict):
              posts = (
                  payload.get("posts")
                  or payload.get("data")
                  or payload.get("items")
                  or []
              )
          elif isinstance(payload, list):
              posts = payload
          else:
              posts = []

          relevant = 0

          for post in posts:
              post_id = str(
                  post.get("id")
                  or post.get("post_id")
                  or post.get("uuid")
                  or ""
              )

              if not post_id:
                  continue

              contexts = detect_context(get_text(post))
              assessment = assess_relevance(post, contexts)

              if assessment["relevance"] in {
                  "HIGH",
                  "MEDIUM",
                  "HIGH_RISK"
              }:
                  relevant += 1

              memory["observed_posts"][post_id] = {
                  "post_id": post_id,
                  "title": str(post.get("title") or ""),
                  "contexts": contexts,
                  "assessment": assessment,
                  "observed_at": now(),
                  "actions": {
                      "comment": False,
                      "dm": False,
                      "follow": False,
                      "payment": False,
                      "transfer": False
                  }
              }

          memory["version"] = "ACT 06 V2"
          memory["generated_at"] = now()

          statistics = memory.setdefault(
              "statistics",
              {
                  "runs": 0,
                  "posts_seen": 0,
                  "relevant_interactions": 0
              }
          )

          statistics["runs"] = statistics.get("runs", 0) + 1
          statistics["posts_seen"] = len(posts)
          statistics["relevant_interactions"] = relevant

          memory["last_run"] = {
              "timestamp": now(),
              "posts_returned": len(posts),
              "relevant_posts": relevant,
              "actions_performed": False,
              "gemini_used": False,
              "project_cost_eur": 0
          }

          save_memory(memory)

          print("")
          print("=== NØX ACT 06 V2 RESULT ===")
          print(f"Posts received: {len(posts)}")
          print(f"Relevant interactions: {relevant}")
          print("Actions performed: NO")
          print("Gemini used: NO")
          print("Project cost: €0")
          print("==============================")
          PY

      - name: Commit and push ACT 06 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_06_interaction_monitor_v2.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "Update ACT 06 interaction monitor memory"

          git fetch origin main

          if git rebase origin/main; then
            git push origin HEAD:main
          else
            echo "Rebase conflict detected."
            git rebase --abort
            exit 1
          fi
