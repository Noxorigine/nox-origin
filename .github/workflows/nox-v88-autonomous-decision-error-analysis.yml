name: NØX V88 Autonomous Decision Error Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v88-autonomous-decision-error-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V88
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("body", "content", "text", "title"):
                      if isinstance(value.get(key), str):
                          return value[key]
              return str(value)

          def get_author(obj):
              if not isinstance(obj, dict):
                  return {}
              author = obj.get("author")
              if isinstance(author, dict):
                  return author
              user = obj.get("user")
              if isinstance(user, dict):
                  return user
              return {}

          def get_id(obj):
              if not isinstance(obj, dict):
                  return None
              for key in ("id", "comment_id", "post_id"):
                  if obj.get(key):
                      return str(obj[key])
              return None

          def collect_comments(obj, result=None):
              if result is None:
                  result = []

              if isinstance(obj, dict):
                  for key in ("comments", "replies", "children"):
                      value = obj.get(key)
                      if isinstance(value, list):
                          for item in value:
                              if isinstance(item, dict):
                                  result.append(item)
                                  collect_comments(item, result)

                  for value in obj.values():
                      if isinstance(value, (dict, list)):
                          collect_comments(value, result)

              elif isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, (dict, list)):
                          collect_comments(item, result)

              unique = {}
              for item in result:
                  item_id = get_id(item)
                  if item_id:
                      unique[item_id] = item

              return list(unique.values())

          def contains(text_value, terms):
              t = text_value.lower()
              return any(term in t for term in terms)

          # ------------------------------------------------------------
          # 1. Authenticate
          # ------------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing")

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )
          token_response.raise_for_status()

          token = token_response.json().get("access_token")

          if not token:
              raise SystemExit("No access_token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )
          me_response.raise_for_status()

          me = me_response.json()

          agent_id = str(
              me.get("id")
              or me.get("user_id")
              or ""
          )

          username = str(
              me.get("username")
              or ""
          ).lower()

          # ------------------------------------------------------------
          # 2. Load the decision chain
          # ------------------------------------------------------------

          v77 = load(
              f"{MEMORY}/nox_v77_action_readiness_engine.json"
          )

          v78 = load(
              f"{MEMORY}/nox_v78_controlled_useful_action.json"
          )

          v79 = load(
              f"{MEMORY}/nox_v79_action_result_learning.json"
          )

          v80 = load(
              f"{MEMORY}/nox_v80_adaptive_decision_learning.json"
          )

          v81 = load(
              f"{MEMORY}/nox_v81_adaptive_action_prioritization.json"
          )

          v82 = load(
              f"{MEMORY}/nox_v82_autonomous_action_selection.json"
          )

          v83 = load(
              f"{MEMORY}/nox_v83_autonomous_action_execution.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json"
          )

          v86 = load(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.json"
          )

          v87 = load(
              f"{MEMORY}/nox_v87_autonomous_prioritization_refinement.json"
          )

          selected = v82.get("selected_action") or {}

          if not isinstance(selected, dict):
              selected = {}

          selected_post_id = (
              v83.get("post_id")
              or selected.get("post_id")
              or v82.get("post_id")
          )

          selected_action = (
              v83.get("action")
              or selected.get("action")
              or ""
          )

          selected_score = selected.get("score")

          execution_status = str(
              v83.get("status")
              or v83.get("execution_status")
              or ""
          ).upper()

          outcome = v84.get("outcome") or {}

          outcome_status = str(
              outcome.get("status")
              or "UNKNOWN"
          )

          # ------------------------------------------------------------
          # 3. Freshly verify the selected post when possible
          # ------------------------------------------------------------

          source_verified = False
          post = {}
          context = {}

          if selected_post_id:
              post_response = requests.get(
                  f"{BASE}/posts/{selected_post_id}",
                  headers=headers,
                  timeout=30
              )

              if post_response.ok:
                  post = post_response.json()
                  source_verified = True

              context_response = requests.get(
                  f"{BASE}/posts/{selected_post_id}/context",
                  headers=headers,
                  timeout=30
              )

              if context_response.ok:
                  context = context_response.json()

          # ------------------------------------------------------------
          # 4. Reconstruct decision evidence
          # ------------------------------------------------------------

          post_text = (
              text(post.get("title"))
              + " "
              + text(post.get("body"))
          ).lower()

          evidence = {
              "explicit_request": contains(
                  post_text,
                  [
                      "need someone",
                      "looking for",
                      "i need",
                      "we need",
                      "request",
                      "hire",
                      "hiring",
                      "seeking"
                  ]
              ),
              "delegation": contains(
                  post_text,
                  [
                      "can someone",
                      "could someone",
                      "please build",
                      "please fix",
                      "please create",
                      "looking for an agent",
                      "looking for someone",
                      "who can"
                  ]
              ),
              "deliverable": contains(
                  post_text,
                  [
                      "deliver",
                      "deliverable",
                      "build",
                      "create",
                      "fix",
                      "implement",
                      "produce",
                      "submit"
                  ]
              ),
              "acceptance": contains(
                  post_text,
                  [
                      "acceptance",
                      "criteria",
                      "must include",
                      "requirements",
                      "definition of done",
                      "success criteria"
                  ]
              ),
              "reward": contains(
                  post_text,
                  [
                      "reward",
                      "paid",
                      "payment",
                      "bounty",
                      "sats",
                      "btc",
                      "usdc",
                      "tip"
                  ]
              ),
              "completion": contains(
                  post_text,
                  [
                      "completed",
                      "finished",
                      "done",
                      "delivered",
                      "already built",
                      "i built",
                      "we built"
                  ]
              ),
              "analysis_only": (
                  contains(
                      post_text,
                      [
                          "analysis",
                          "finding",
                          "observations",
                          "my view"
                      ]
                  )
                  and not contains(
                      post_text,
                      [
                          "need someone",
                          "looking for",
                          "i need",
                          "we need",
                          "hire"
                      ]
                  )
              )
          }

          # ------------------------------------------------------------
          # 5. Decision correctness analysis
          # ------------------------------------------------------------

          errors = []
          strengths = []

          if not source_verified:
              errors.append(
                  "The original post could not be freshly verified."
              )

          if evidence["completion"]:
              errors.append(
                  "The selected item contains completion evidence and should have been heavily deprioritized."
              )

          if evidence["analysis_only"] and not evidence["explicit_request"]:
              errors.append(
                  "The selected item resembles analysis/finding content without clear delegation."
              )

          if not evidence["explicit_request"]:
              errors.append(
                  "The selected item lacks a strong explicit request signal."
              )

          if evidence["explicit_request"]:
              strengths.append(
                  "An explicit request signal is present."
              )

          if evidence["delegation"]:
              strengths.append(
                  "A delegation signal is present."
              )

          if evidence["deliverable"]:
              strengths.append(
                  "A concrete deliverable signal is present."
              )

          if evidence["acceptance"]:
              strengths.append(
                  "Acceptance criteria are visible."
              )

          if evidence["reward"]:
              strengths.append(
                  "Compensation language is present, but it is not proof of payment."
              )

          # ------------------------------------------------------------
          # 6. Compare action with actual outcome
          # ------------------------------------------------------------

          outcome_effect = "UNRESOLVED"

          if outcome_status == "POTENTIAL_WORK_OPPORTUNITY":
              outcome_effect = "POSITIVE_DECISION_RESULT"

          elif outcome_status == "POSITIVE_SIGNAL":
              outcome_effect = "POSITIVE_INTERACTION"

          elif outcome_status == "NEGATIVE_SIGNAL":
              outcome_effect = "NEGATIVE_INTERACTION"

          elif outcome_status == "NO_RESPONSE":
              outcome_effect = "NO_OBSERVED_RESPONSE"

          elif outcome_status == "PAYMENT_SIGNAL":
              outcome_effect = "PAYMENT_SIGNAL_UNVERIFIED"

          elif outcome_status == "RESPONSE_RECEIVED":
              outcome_effect = "AMBIGUOUS_INTERACTION"

          # ------------------------------------------------------------
          # 7. Identify systematic decision weaknesses
          # ------------------------------------------------------------

          systematic_risks = []

          if not evidence["acceptance"]:
              systematic_risks.append(
                  "Acceptance criteria may be underweighted when selecting actionable work."
              )

          if not evidence["delegation"]:
              systematic_risks.append(
                  "Delegation evidence may be insufficient for autonomous action."
              )

          if evidence["reward"] and not evidence["acceptance"]:
              systematic_risks.append(
                  "Reward language may create false confidence without verifiable work structure."
              )

          if evidence["analysis_only"]:
              systematic_risks.append(
                  "Analysis/finding posts remain a known false-positive class."
              )

          if evidence["completion"]:
              systematic_risks.append(
                  "Completed work remains a critical exclusion signal."
              )

          if not systematic_risks:
              systematic_risks.append(
                  "No new systematic decision weakness was identified from the current case."
              )

          # ------------------------------------------------------------
          # 8. Generate autonomous improvement hypotheses
          # ------------------------------------------------------------

          improvement_hypotheses = []

          if not evidence["acceptance"]:
              improvement_hypotheses.append({
                  "hypothesis": "Increase the weight of verifiable acceptance criteria.",
                  "reason": "A request without a way to determine completion is harder to execute safely."
              })

          if evidence["reward"] and not evidence["acceptance"]:
              improvement_hypotheses.append({
                  "hypothesis": "Separate economic attractiveness from action readiness.",
                  "reason": "A reward does not establish that the task is executable or payable."
              })

          if evidence["analysis_only"]:
              improvement_hypotheses.append({
                  "hypothesis": "Strengthen the distinction between open work and informational content.",
                  "reason": "Analysis/finding language has repeatedly produced false positives."
              })

          improvement_hypotheses.append({
              "hypothesis": "Require convergence between request, delegation and executable deliverable before high-confidence autonomous action.",
              "reason": "Multiple independent structural signals should reduce false positives."
          })

          improvement_hypotheses.append({
              "hypothesis": "Use outcome history as a modifier rather than as the primary source of opportunity truth.",
              "reason": "Historical success cannot make a currently weak request genuine."
          })

          # ------------------------------------------------------------
          # 9. Determine self-assessment
          # ------------------------------------------------------------

          if errors and outcome_effect == "NEGATIVE_INTERACTION":
              self_assessment = "DECISION_NEEDS_CORRECTION"

          elif errors:
              self_assessment = "DECISION_HAS_WEAKNESSES"

          elif outcome_effect in (
              "POSITIVE_DECISION_RESULT",
              "POSITIVE_INTERACTION"
          ):
              self_assessment = "DECISION_SUPPORTED"

          elif outcome_effect == "NO_OBSERVED_RESPONSE":
              self_assessment = "DECISION_UNRESOLVED"

          else:
              self_assessment = "DECISION_PARTIALLY_SUPPORTED"

          # ------------------------------------------------------------
          # 10. Confidence
          # ------------------------------------------------------------

          if self_assessment == "DECISION_SUPPORTED":
              confidence = 0.86
          elif self_assessment == "DECISION_NEEDS_CORRECTION":
              confidence = 0.88
          elif self_assessment == "DECISION_HAS_WEAKNESSES":
              confidence = 0.82
          elif self_assessment == "DECISION_UNRESOLVED":
              confidence = 0.60
          else:
              confidence = 0.68

          # ------------------------------------------------------------
          # 11. Autonomous next-step recommendation
          # ------------------------------------------------------------

          if self_assessment == "DECISION_NEEDS_CORRECTION":
              next_strategy = "REDUCE_SIMILAR_ACTION_PRIORITY"

          elif self_assessment == "DECISION_HAS_WEAKNESSES":
              next_strategy = "INCREASE_VERIFICATION_REQUIREMENTS"

          elif self_assessment == "DECISION_SUPPORTED":
              next_strategy = "MAINTAIN_AND_TEST_SIMILAR_PATTERN"

          elif self_assessment == "DECISION_UNRESOLVED":
              next_strategy = "COLLECT_MORE_OUTCOME_EVIDENCE"

          else:
              next_strategy = "MAINTAIN_WITH_CAUTION"

          # ------------------------------------------------------------
          # 12. Build result
          # ------------------------------------------------------------

          result = {
              "version": "V88",
              "generated_at": now(),
              "mode": "autonomous_decision_error_analysis",
              "agent": {
                  "id": agent_id,
                  "username": username
              },
              "decision_under_analysis": {
                  "source_version": "V82",
                  "action_version": "V83",
                  "post_id": selected_post_id,
                  "selected_action": selected_action,
                  "selected_score": selected_score,
                  "execution_status": execution_status
              },
              "primary_source": {
                  "post_verified": source_verified,
                  "context_available": bool(context)
              },
              "decision_evidence": evidence,
              "outcome": {
                  "source_version": "V84",
                  "status": outcome_status,
                  "effect": outcome_effect
              },
              "self_assessment": {
                  "status": self_assessment,
                  "confidence": confidence
              },
              "decision_strengths": strengths,
              "decision_errors": errors,
              "systematic_risks": systematic_risks,
              "improvement_hypotheses": improvement_hypotheses,
              "autonomous_next_strategy": {
                  "recommendation": next_strategy,
                  "automatic_activation": False
              },
              "historical_learning": {
                  "v85_strategy_adaptation_available": bool(v85),
                  "v86_live_test_available": bool(v86),
                  "v87_refinement_available": bool(v87)
              },
              "learning": {
                  "core_conclusions": [
                      "NØX must evaluate why a decision was made, not only what happened afterward.",
                      "A positive outcome does not prove every part of the decision logic was correct.",
                      "A negative outcome should be traced to the weakest evidence component.",
                      "No response remains an unresolved result rather than a failure.",
                      "Historical success must not override current source evidence.",
                      "Decision errors should become reusable regression cases.",
                      "Systematic weaknesses can guide future strategy refinement."
                  ],
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V83-EXECUTION-RESULT-REQUIRES-PRIMARY-SOURCE",
                      "REG-V84-OUTCOME-MUST-BE-OBSERVED-BEFORE-ADAPTATION",
                      "REG-V85-STRATEGY-REQUIRES-LIVE-VALIDATION",
                      "REG-V86-LIVE-TEST-REQUIRES-REPEATED-EVIDENCE",
                      "REG-V87-ADAPTIVE-REFINEMENT-REQUIRES-ERROR-ANALYSIS"
                  ]
              },
              "decision": {
                  "answer_status": "SELF_DECISION_ANALYZED",
                  "confidence": confidence,
                  "automatic_rule_change": False,
                  "future_versions_may_use_learning": True
              },
              "autonomy": {
                  "self_evaluation": True,
                  "error_detection": True,
                  "systematic_error_detection": True,
                  "improvement_hypothesis_generation": True,
                  "automatic_rule_change": False,
                  "external_action": False
              },
              "next_stage": {
                  "version": "V89",
                  "purpose": "Compare decision hypotheses, historical outcomes and live evidence to select the most reliable strategy before V90."
              },
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          save(
              f"{MEMORY}/nox_v88_autonomous_decision_error_analysis.json",
              result
          )

          # ------------------------------------------------------------
          # 13. Markdown report
          # ------------------------------------------------------------

          md = []

          md.append("# NØX V88 — Autonomous Decision Error Analysis")
          md.append("")
          md.append(f"Generated: {result['generated_at']}")
          md.append("")
          md.append("## Decision analysed")
          md.append("")
          md.append("- Source: V82")
          md.append("- Execution: V83")
          md.append(f"- Post ID: {selected_post_id}")
          md.append(f"- Action: {selected_action}")
          md.append(f"- Selected score: {selected_score}")
          md.append("")
          md.append("## Primary source")
          md.append("")
          md.append(f"- Post verified: {source_verified}")
          md.append(f"- Context available: {bool(context)}")
          md.append("")
          md.append("## Decision evidence")
          md.append("")

          for key, value in evidence.items():
              md.append(f"- {key}: {value}")

          md.append("")
          md.append("## Outcome")
          md.append("")
          md.append(f"- Status: {outcome_status}")
          md.append(f"- Effect: {outcome_effect}")
          md.append("")
          md.append("## Self-assessment")
          md.append("")
          md.append(f"- Status: {self_assessment}")
          md.append(f"- Confidence: {confidence}")
          md.append("")
          md.append("## Decision strengths")
          md.append("")

          for item in strengths:
              md.append(f"- {item}")

          md.append("")
          md.append("## Decision errors")
          md.append("")

          if errors:
              for item in errors:
                  md.append(f"- {item}")
          else:
              md.append("- No direct decision error identified.")

          md.append("")
          md.append("## Systematic risks")
          md.append("")

          for item in systematic_risks:
              md.append(f"- {item}")

          md.append("")
          md.append("## Improvement hypotheses")
          md.append("")

          for item in improvement_hypotheses:
              md.append(
                  f"- {item['hypothesis']} — {item['reason']}"
              )

          md.append("")
          md.append("## Autonomous strategy recommendation")
          md.append("")
          md.append(f"- {next_strategy}")
          md.append("- Automatic activation: false")
          md.append("")
          md.append("## Core learning")
          md.append("")

          for item in result["learning"]["core_conclusions"]:
              md.append(f"- {item}")

          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V89 — Compare decision hypotheses, historical outcomes and live evidence to select the most reliable strategy before V90."
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v88_autonomous_decision_error_analysis.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V88
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v88_autonomous_decision_error_analysis.json
          git add memory/nox_v88_autonomous_decision_error_analysis.md

          git diff --cached --quiet || \
            git commit -m "NØX V88 autonomous decision error analysis"

          git push
