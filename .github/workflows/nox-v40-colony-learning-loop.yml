name: NØX Origin - V40 Colony Learning Loop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V40
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V40_COLONY_REPORT.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V40")
          print("Colony Learning Loop")
          print("===================================")

          # --------------------------------------------------
          # 1. API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=20
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  f"Authentication failed: "
                  f"{token_response.status_code} "
                  f"{token_response.text}"
              )

          token_data = token_response.json()
          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # 3. LOAD MEMORY
          # --------------------------------------------------

          if not memory_file.exists():
              raise RuntimeError(
                  "nox_memory.json does not exist."
              )

          memory = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if not isinstance(memory, dict):
              raise RuntimeError(
                  "Invalid memory structure."
              )

          memory.setdefault("observations", [])
          memory.setdefault("retrieval_log", [])
          memory.setdefault("verification_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("colony_activity_log", [])
          memory.setdefault("colony_interaction_log")
          memory.setdefault("colony_learning_log", [])

          # --------------------------------------------------
          # 4. GET PROFILE
          # --------------------------------------------------

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=20
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  f"Profile request failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text}"
              )

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "unknown"
          )

          karma = me.get("karma")

          print(f"NØX username: {username}")
          print(f"NØX karma: {karma}")

          # --------------------------------------------------
          # 5. READ RECENT ACTIVITY
          # --------------------------------------------------

          since_response = requests.get(
              f"{BASE}/since",
              headers=headers,
              timeout=30
          )

          since_data = {}

          if since_response.status_code == 200:
              since_data = since_response.json()

              if not isinstance(since_data, dict):
                  since_data = {}

              print("Recent activity retrieval: PASS")

          else:
              print(
                  "Recent activity endpoint unavailable; "
                  "continuing with interaction analysis."
              )

          notifications = since_data.get(
              "notifications",
              []
          )

          messages = since_data.get(
              "messages",
              []
          )

          recent_posts = since_data.get(
              "posts",
              []
          )

          if not isinstance(notifications, list):
              notifications = []

          if not isinstance(messages, list):
              messages = []

          if not isinstance(recent_posts, list):
              recent_posts = []

          # --------------------------------------------------
          # 6. GET CURRENT FEED
          # --------------------------------------------------

          feed_response = requests.get(
              f"{BASE}/feed/for-you",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"For-you feed failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text}"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, list):
              feed_items = feed_data
          elif isinstance(feed_data, dict):
              feed_items = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or feed_data.get("data")
                  or []
              )
          else:
              feed_items = []

          if not isinstance(feed_items, list):
              feed_items = []

          print(
              f"Current feed items: {len(feed_items)}"
          )

          # --------------------------------------------------
          # 7. GET SUGGESTIONS
          # --------------------------------------------------

          suggestions_response = requests.get(
              f"{BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          suggestions = []

          if suggestions_response.status_code == 200:

              suggestions_data = suggestions_response.json()

              if isinstance(suggestions_data, list):
                  suggestions = suggestions_data

              elif isinstance(suggestions_data, dict):
                  suggestions = (
                      suggestions_data.get("items")
                      or suggestions_data.get("suggestions")
                      or suggestions_data.get("data")
                      or []
                  )

              if not isinstance(suggestions, list):
                  suggestions = []

          print(
              f"Suggestions available: {len(suggestions)}"
          )

          # --------------------------------------------------
          # 8. ANALYSE V39 INTERACTIONS
          # --------------------------------------------------

          interactions = memory.get(
              "colony_interaction_log",
              []
          )

          if not isinstance(interactions, list):
              interactions = []

          v39_interactions = [
              item
              for item in interactions
              if isinstance(item, dict)
              and item.get("status") == "commented"
          ]

          latest_interaction = None

          if v39_interactions:
              latest_interaction = v39_interactions[-1]

          reaction_signal = {
              "status": "unknown",
              "reason": "No reliable reaction measurement available."
          }

          # --------------------------------------------------
          # 9. LOOK FOR A DIRECT SIGNAL
          # --------------------------------------------------

          if latest_interaction:

              post_id = latest_interaction.get(
                  "post_id"
              )

              author = latest_interaction.get(
                  "author",
                  "unknown"
              )

              print(
                  f"Latest V39 interaction: "
                  f"{post_id}"
              )

              # Check whether the post appears again in the feed.
              appeared_again = False

              for item in feed_items:

                  if not isinstance(item, dict):
                      continue

                  item_id = (
                      item.get("id")
                      or item.get("post_id")
                      or item.get("uuid")
                  )

                  if str(item_id) == str(post_id):
                      appeared_again = True
                      break

              if appeared_again:

                  reaction_signal = {
                      "status": "post_still_visible",
                      "reason": (
                          "The interacted post remains present "
                          "in the personalized feed."
                      )
                  }

              # Look for notifications related to the interaction.
              if notifications:

                  reaction_signal = {
                      "status": "activity_detected",
                      "reason": (
                          "New Colony notification activity was "
                          "detected after the previous interaction."
                      )
                  }

              print(
                  f"Reaction signal: "
                  f"{reaction_signal['status']}"
              )

          else:

              print(
                  "No previous V39 interaction found."
              )

          # --------------------------------------------------
          # 10. DO NOT FORCE A SUCCESSFUL OUTCOME
          # --------------------------------------------------

          learning_quality = {
              "interaction_completed": bool(
                  latest_interaction
              ),
              "reaction_confirmed": (
                  reaction_signal["status"]
                  == "activity_detected"
              ),
              "reaction_unknown": (
                  reaction_signal["status"]
                  == "unknown"
              ),
              "conclusion_strength": "low"
          }

          # V40 deliberately refuses to interpret
          # absence of evidence as failure or success.

          if reaction_signal["status"] == "activity_detected":
              learning_quality["conclusion_strength"] = "medium"

          # --------------------------------------------------
          # 11. STORE LEARNING RESULT
          # --------------------------------------------------

          learning_record = {
              "timestamp": now,
              "version": "V40",
              "interaction": latest_interaction,
              "reaction_signal": reaction_signal,
              "notifications_seen": len(notifications),
              "messages_seen": len(messages),
              "recent_posts_seen": len(recent_posts),
              "feed_items_seen": len(feed_items),
              "suggestions_seen": len(suggestions),
              "learning_quality": learning_quality
          }

          memory["colony_learning_log"].append(
              learning_record
          )

          # --------------------------------------------------
          # 12. STORE GENERAL LESSON
          # --------------------------------------------------

          memory["learning_log"].append({
              "timestamp": now,
              "lesson": (
                  "An interaction should not automatically be "
                  "considered successful. NØX must observe evidence "
                  "of a reaction before assigning a strong conclusion."
              ),
              "source": "V40 Colony Learning Loop",
              "confidence": 0.9
          })

          # --------------------------------------------------
          # 13. UPDATE ACTIVITY LOG
          # --------------------------------------------------

          memory["colony_activity_log"].append({
              "timestamp": now,
              "activity": "learning_loop",
              "feed_items": len(feed_items),
              "suggestions": len(suggestions),
              "notifications": len(notifications),
              "messages": len(messages),
              "recent_posts": len(recent_posts),
              "reaction_signal": reaction_signal["status"]
          })

          # --------------------------------------------------
          # 14. UPDATE MEMORY VERSION
          # --------------------------------------------------

          memory["version"] = "V40"
          memory["last_updated"] = now

          memory["colony_observer"] = {
              "enabled": True,
              "last_observation": now,
              "mode": "observation_interaction_learning"
          }

          # --------------------------------------------------
          # 15. WRITE MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 16. RELOAD AND VERIFY
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if loaded.get("version") != "V40":
              raise RuntimeError(
                  "V40 version persistence failed."
              )

          if not loaded.get("colony_learning_log"):
              raise RuntimeError(
                  "V40 learning log was not persisted."
              )

          if not loaded.get("colony_activity_log"):
              raise RuntimeError(
                  "Colony activity log was not persisted."
              )

          print("Memory persistence: PASS")
          print("Learning record persistence: PASS")
          print("Activity log persistence: PASS")

          # --------------------------------------------------
          # 17. REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V40 Colony Learning Loop",
              "",
              "## Session",
              "",
              f"- Timestamp: {now}",
              f"- NØX username: {username}",
              f"- Karma: {karma}",
              "",
              "## Colony Activity",
              "",
              f"- Feed items observed: {len(feed_items)}",
              f"- Suggestions observed: {len(suggestions)}",
              f"- Notifications observed: {len(notifications)}",
              f"- Messages observed: {len(messages)}",
              f"- Recent posts observed: {len(recent_posts)}",
              "",
              "## V39 Interaction",
              "",
              f"- Previous interaction found: "
              f"{'YES' if latest_interaction else 'NO'}",
              f"- Reaction signal: "
              f"{reaction_signal['status']}",
              f"- Conclusion strength: "
              f"{learning_quality['conclusion_strength']}",
              "",
              "## Learning Principle",
              "",
              "NØX does not automatically interpret an interaction "
              "as successful.",
              "",
              "Evidence must be observed before confidence increases.",
              "",
              "## Safety",
              "",
              "- New comment: NO",
              "- New post: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V40 Conclusion",
              "",
              "NØX now has the first complete observation → "
              "interaction → observation → learning loop.",
              "",
              "The next evolution can use accumulated interaction "
              "results to improve action selection."
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V40 COMPLETE")
          print("===================================")
          PY

      - name: Commit V40 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V40_COLONY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V40 - Colony Learning Loop"
            git push
          fi
