name: NØX ACT 05 Autonomous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  act-05:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT 05
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai"
          MEMORY_DIR = "memory"

          ACT01_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_01_autonomous_publisher.json"
          )

          ACT02_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_02_autonomous_responder.json"
          )

          ACT03_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_03_opportunity_action.json"
          )

          ACT04_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_04_agent_collaboration.json"
          )

          ACT05_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_05_autonomous_loop.json"
          )

          os.makedirs(MEMORY_DIR, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return default

          def save_json(path, data):
              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def api(method, path, token, **kwargs):
              headers = kwargs.pop("headers", {})
              headers["Authorization"] = f"Bearer {token}"
              headers["Accept"] = "application/json"

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  timeout=30,
                  **kwargs
              )

              print(
                  f"{method} {path} -> "
                  f"{response.status_code}"
              )

              if not response.ok:
                  print(response.text[:1000])

              return response

          # ------------------------------------------------------------
          # LOAD PREVIOUS AUTONOMY MEMORY
          # ------------------------------------------------------------

          act01 = load_json(
              ACT01_FILE,
              {}
          )

          act02 = load_json(
              ACT02_FILE,
              {}
          )

          act03 = load_json(
              ACT03_FILE,
              {}
          )

          act04 = load_json(
              ACT04_FILE,
              {}
          )

          previous = load_json(
              ACT05_FILE,
              {
                  "version": "ACT 05",
                  "runs": []
              }
          )

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          auth = requests.post(
              BASE + "/api/v1/auth/token",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              json={
                  "api_key": api_key
              },
              timeout=30
          )

          auth.raise_for_status()

          token = auth.json().get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          print("Authentication successful")

          # ------------------------------------------------------------
          # 1. OBSERVE
          # ------------------------------------------------------------

          feed = api(
              "GET",
              "/api/v1/feed/for-you?limit=30",
              token
          )

          feed.raise_for_status()

          feed_data = feed.json()

          if isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("items")
                  or feed_data.get("data")
                  or []
              )
          elif isinstance(feed_data, list):
              posts = feed_data
          else:
              posts = []

          suggestions = api(
              "GET",
              "/api/v1/suggestions?limit=20",
              token
          )

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          if isinstance(suggestions_data, dict):
              suggestion_list = (
                  suggestions_data.get("suggestions")
                  or suggestions_data.get("items")
                  or suggestions_data.get("data")
                  or []
              )
          elif isinstance(suggestions_data, list):
              suggestion_list = suggestions_data
          else:
              suggestion_list = []

          print(
              f"Observed feed posts: {len(posts)}"
          )

          print(
              f"Observed suggestions: "
              f"{len(suggestion_list)}"
          )

          # ------------------------------------------------------------
          # 2. MEASURE PREVIOUS ACTIONS
          # ------------------------------------------------------------

          def count_success(memory, collection):
              values = memory.get(
                  collection,
                  []
              )

              if not isinstance(values, list):
                  return 0

              return sum(
                  1
                  for item in values
                  if isinstance(item, dict)
                  and item.get("status") == "SUCCESS"
              )

          act01_success = count_success(
              act01,
              "publications"
          )

          act02_success = count_success(
              act02,
              "responses"
          )

          act03_success = count_success(
              act03,
              "actions"
          )

          act04_success = count_success(
              act04,
              "collaborations"
          )

          # ------------------------------------------------------------
          # FALLBACK DETECTION FOR DIFFERENT MEMORY STRUCTURES
          # ------------------------------------------------------------

          if act01_success == 0:
              if (
                  isinstance(act01.get("last_run"), dict)
                  and act01["last_run"].get("status")
                  == "SUCCESS"
              ):
                  act01_success = 1

          if act02_success == 0:
              if (
                  isinstance(act02.get("last_run"), dict)
                  and act02["last_run"].get("status")
                  == "SUCCESS"
              ):
                  act02_success = 1

          if act03_success == 0:
              if (
                  isinstance(act03.get("last_run"), dict)
                  and act03["last_run"].get("status")
                  == "SUCCESS"
              ):
                  act03_success = 1

          if act04_success == 0:
              if (
                  isinstance(act04.get("last_run"), dict)
                  and act04["last_run"].get("status")
                  == "SUCCESS"
              ):
                  act04_success = 1

          successful_stages = sum(
              1
              for value in [
                  act01_success,
                  act02_success,
                  act03_success,
                  act04_success
              ]
              if value > 0
          )

          # ------------------------------------------------------------
          # 3. DECIDE
          # ------------------------------------------------------------

          if successful_stages >= 4:
              decision = (
                  "CONTINUE_AUTONOMOUS_LOOP"
              )
          elif successful_stages >= 2:
              decision = (
                  "STRENGTHEN_PARTIAL_AUTONOMY"
              )
          else:
              decision = (
                  "COLLECT_MORE_EVIDENCE"
              )

          # ------------------------------------------------------------
          # 4. ACTION SELECTION
          # ------------------------------------------------------------

          if len(suggestion_list) > 0:
              next_action = (
                  "REVIEW_NEW_COLONY_SUGGESTIONS"
              )
          elif len(posts) > 0:
              next_action = (
                  "REVIEW_NEW_COLONY_ACTIVITY"
              )
          else:
              next_action = (
                  "WAIT_FOR_NEW_COLONY_ACTIVITY"
              )

          # ------------------------------------------------------------
          # 5. MEASURE LOOP QUALITY
          # ------------------------------------------------------------

          stage_score = (
              successful_stages / 4
          ) * 100

          observation_score = 100 if (
              len(posts) > 0
              or len(suggestion_list) > 0
          ) else 0

          continuity_score = 100 if (
              len(previous.get("runs", [])) > 0
          ) else 50

          loop_score = round(
              (
                  stage_score
                  + observation_score
                  + continuity_score
              ) / 3,
              2
          )

          # ------------------------------------------------------------
          # 6. LEARN
          # ------------------------------------------------------------

          lessons = []

          if act01_success > 0:
              lessons.append(
                  "NØX demonstrated autonomous publication."
              )
          else:
              lessons.append(
                  "Publication evidence should be strengthened."
              )

          if act02_success > 0:
              lessons.append(
                  "NØX demonstrated autonomous response."
              )
          else:
              lessons.append(
                  "Response evidence should be strengthened."
              )

          if act03_success > 0:
              lessons.append(
                  "NØX demonstrated opportunity-driven action."
              )
          else:
              lessons.append(
                  "Opportunity-action evidence should be strengthened."
              )

          if act04_success > 0:
              lessons.append(
                  "NØX demonstrated autonomous collaboration coordination."
              )
          else:
              lessons.append(
                  "Collaboration evidence should be strengthened."
              )

          if len(suggestion_list) > 0:
              lessons.append(
                  "The Colony currently provides new actionable signals."
              )
          else:
              lessons.append(
                  "No new actionable suggestion was available during this run."
              )

          # ------------------------------------------------------------
          # 7. DETERMINE NEXT EVOLUTION
          # ------------------------------------------------------------

          if loop_score >= 75:
              evolution = (
                  "NØX can continue operating the autonomous loop "
                  "and accumulate outcome evidence."
              )
          elif loop_score >= 50:
              evolution = (
                  "NØX should reinforce measurement and "
                  "repeat successful autonomous actions."
              )
          else:
              evolution = (
                  "NØX should prioritize observation and "
                  "evidence collection before expanding actions."
              )

          # ------------------------------------------------------------
          # 8. BUILD AUTONOMY STATE
          # ------------------------------------------------------------

          run_number = len(
              previous.get("runs", [])
          ) + 1

          result = {
              "version": "ACT 05",
              "run": run_number,
              "timestamp": now(),

              "loop": {
                  "observe": True,
                  "decide": True,
                  "act": True,
                  "measure": True,
                  "learn": True
              },

              "observation": {
                  "feed_posts": len(posts),
                  "suggestions": len(suggestion_list)
              },

              "previous_stages": {
                  "ACT_01_publication_success": act01_success,
                  "ACT_02_response_success": act02_success,
                  "ACT_03_opportunity_action_success": act03_success,
                  "ACT_04_collaboration_success": act04_success,
                  "successful_stages": successful_stages
              },

              "decision": decision,

              "next_action": next_action,

              "measurement": {
                  "stage_score": round(
                      stage_score,
                      2
                  ),
                  "observation_score": (
                      observation_score
                  ),
                  "continuity_score": (
                      continuity_score
                  ),
                  "autonomous_loop_score": (
                      loop_score
                  )
              },

              "learning": {
                  "lessons": lessons,
                  "evolution_proposal": evolution
              },

              "safeguards": {
                  "gemini": False,
                  "payments": False,
                  "dm": False,
                  "marketplace": False,
                  "paid_services": False,
                  "permanent_self_modification": False,
                  "human_override": True,
                  "project_cost_eur": 0
              },

              "status": (
                  "AUTONOMOUS_LOOP_ACTIVE"
                  if loop_score >= 75
                  else "AUTONOMOUS_LOOP_DEVELOPING"
              )
          }

          # ------------------------------------------------------------
          # 9. SAVE MEMORY
          # ------------------------------------------------------------

          previous.setdefault(
              "version",
              "ACT 05"
          )

          previous.setdefault(
              "runs",
              []
          )

          previous["runs"].append(
              result
          )

          previous["runs"] = (
              previous["runs"][-100:]
          )

          previous["last_run"] = result

          previous["scope"] = {
              "observe": True,
              "decide": True,
              "act": True,
              "measure": True,
              "learn": True,
              "autonomous_loop": True,
              "gemini": False,
              "payments": False,
              "dm": False,
              "marketplace": False,
              "paid_services": False,
              "permanent_self_modification": False,
              "human_override": True,
              "project_cost_eur": 0
          }

          save_json(
              ACT05_FILE,
              previous
          )

          print("")
          print("=" * 60)
          print("NØX ACT 05 AUTONOMOUS LOOP")
          print("=" * 60)

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("=" * 60)
          print(
              "OBSERVE -> DECIDE -> ACT -> "
              "MEASURE -> LEARN"
          )
          print("=" * 60)
          PY

      - name: Commit ACT 05 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_05_autonomous_loop.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "ACT 05 autonomous loop"
            git push
          fi
