name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: "memory/nox_core_memory.json"
  CORE_RUNTIME_FILE: "memory/nox_core_runtime.json"
  WORK_FILE: "memory/nox_work_factory.json"
  PRESENCE_FILE: "memory/nox_colony_presence.json"
  MAX_FEED_ITEMS: "20"
  MAX_NOTIFICATIONS: "20"
  MAX_CONVERSATIONS: "10"
  MAX_NEW_CASES_PER_RUN: "5"
  DM_MAX_AGE_HOURS: "72"
  MAX_CASES: "100"
  MAX_ACTIONS: "100"
  MAX_WORK_REQUESTS: "50"
  MAX_HISTORY: "150"
  AUTO_PUBLIC_REPLIES: "true"
  NOX_USERNAME: "nox_origine"
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Shared helpers for all NØX scripts (standard library only)."""
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from itertools import islice
          from pathlib import Path

          OWN_USERNAME = (os.environ.get("NOX_USERNAME") or "nox_origine").strip().lower()

          # ---------------------------------------------------------------- time / env
          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def parse_ts(value):
              if not value or not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          def env_flag(name, default=False):
              value = os.environ.get(name)
              if value is None or value.strip() == "":
                  return default
              return value.strip().lower() in {"1", "true", "yes", "on"}

          def check_policy():
              """Hard safety invariants: no spending, no payments, no external AI."""
              expected = {
                  "PROJECT_COST_EUR": "0",
                  "GEMINI_USED": "false",
                  "EXTERNAL_AI_USED": "false",
                  "AUTO_PAYMENT": "false",
                  "AUTO_SPENDING": "false",
              }
              for key, wanted in expected.items():
                  if os.environ.get(key, wanted).strip().lower() != wanted:
                      raise SystemExit(f"Unsafe policy: {key} must be {wanted}")

          # ---------------------------------------------------------------- json files
          def load_json(path, default=None):
              """Load a JSON object. Refuses to continue on corrupt files so that a
              parse error can never silently wipe the agent's state."""
              path = Path(path)
              default = {} if default is None else default
              if not path.exists():
                  return default
              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  return default
              try:
                  value = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {path} is not valid JSON ({exc}). "
                      "Restore it from git history; refusing to overwrite it."
                  )
              return value if isinstance(value, type(default)) else default

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(value, ensure_ascii=False, indent=2, default=str) + "\n"
              json.loads(payload)  # round-trip check
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          # ---------------------------------------------------------------- data utils
          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value, limit=None):
              if value is None:
                  out = ""
              elif isinstance(value, str):
                  out = value.strip()
              elif isinstance(value, dict):
                  out = ""
                  for key in ("content", "body", "text", "message", "title", "question"):
                      if value.get(key):
                          out = text(value[key])
                          break
                  if not out:
                      out = json.dumps(value, ensure_ascii=False, default=str)
              else:
                  out = str(value).strip()
              return out[:limit] if limit else out

          def collapse(value, limit=None):
              out = re.sub(r"\s+", " ", text(value)).strip()
              return out[:limit] if limit else out

          def clip(value, limit):
              out = text(value)
              return out if len(out) <= limit else out[: limit - 1].rstrip() + "…"

          def stable_id(prefix, *parts):
              raw = "|".join(str(p if p is not None else "") for p in parts)
              return f"{prefix}:{hashlib.sha256(raw.encode('utf-8')).hexdigest()[:16]}"

          def identity(item):
              """Stable identity of a stored item (id-like key, else content hash)."""
              if isinstance(item, dict):
                  for key in ("id", "action_id", "work_id", "result_id", "message_id", "post_id", "url"):
                      if item.get(key):
                          return f"{key}:{item[key]}"
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True, default=str)
              return "hash:" + hashlib.sha256(raw.encode("utf-8")).hexdigest()

          def dedupe_keep_last(items, limit=None):
              """Remove duplicates (keeping the most recent occurrence) and keep list
              order chronological (oldest first). Optionally keep only the last N."""
              seen, out = set(), []
              for item in reversed(items):
                  key = identity(item)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(item)
              out.reverse()
              return out[-limit:] if limit else out

          def bound(items, limit):
              items = as_list(items)
              return items[-limit:] if len(items) > limit else items

          def take(value, n=None):
              """Turn SDK results (list / dict / generator) into a bounded list."""
              if value is None:
                  return []
              if isinstance(value, dict):
                  for key in ("items", "data", "results", "posts", "notifications", "messages", "conversations"):
                      if isinstance(value.get(key), list):
                          value = value[key]
                          break
                  else:
                      return []
              if isinstance(value, (list, tuple)):
                  return list(value)[:n] if n else list(value)
              try:
                  iterator = iter(value)
              except TypeError:
                  return []
              return list(islice(iterator, n)) if n else list(iterator)

          def username_of(obj):
              """Lower-cased username of an object or of a nested author/sender."""
              if not isinstance(obj, dict):
                  return ""
              for key in ("username", "handle", "author_username", "sender_username"):
                  if obj.get(key):
                      return str(obj[key]).strip().lower()
              for key in ("author", "user", "sender", "bidder", "agent", "other_user"):
                  nested = obj.get(key)
                  if isinstance(nested, dict):
                      found = username_of(nested)
                      if found:
                          return found
                  elif isinstance(nested, str) and nested.strip():
                      return nested.strip().lower()
              return ""

          # ===== script =====
          """NØX Core: observe Colony, open research cases, turn research results into actions.

          Fixes vs. the old version:
          - processed_ids is now SAVED (no more reprocessing / duplicate actions)
          - own posts and own messages are ignored (no self-reply loops)
          - action ids closed by Presence are never regenerated
          - observation ids are unique (the old ones collided inside a run)
          - DM text is no longer sent raw to the web search engine
          - replies are built from sources and only produced when evidence is good enough
          """
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          check_policy()

          RUN_ID = "core-" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          NOW = now_iso()
          print("=== NØX CORE ===")
          print("RUN:", RUN_ID)

          MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])

          MAX_FEED = env_int("MAX_FEED_ITEMS", 20)
          MAX_NOTIF = env_int("MAX_NOTIFICATIONS", 20)
          MAX_CONV = env_int("MAX_CONVERSATIONS", 10)
          MAX_NEW_CASES = env_int("MAX_NEW_CASES_PER_RUN", 5)
          DM_MAX_AGE_H = env_int("DM_MAX_AGE_HOURS", 72)
          MAX_CASES = env_int("MAX_CASES", 100)
          MAX_ACTIONS = env_int("MAX_ACTIONS", 100)
          MAX_WORK_REQ = env_int("MAX_WORK_REQUESTS", 50)
          MAX_HISTORY = env_int("MAX_HISTORY", 150)
          PUBLIC_REPLIES = env_flag("AUTO_PUBLIC_REPLIES", True)

          memory = as_dict(load_json(MEMORY_FILE))
          runtime = as_dict(load_json(RUNTIME_FILE))
          work = as_dict(load_json(WORK_FILE))
          presence = as_dict(load_json(PRESENCE_FILE))

          for key in ("observations", "facts", "experiences", "hypotheses", "questions",
                      "results", "learnings", "sources", "actions", "cognitive_cases"):
              memory.setdefault(key, [])
          for key in ("observations", "decisions", "pending_actions", "work_requests", "processed_ids"):
              runtime.setdefault(key, [])
          for key in ("pending", "history", "results", "failed"):
              work.setdefault(key, [])
          presence.setdefault("outcomes", [])
          presence.setdefault("permanent_failures", [])
          presence.setdefault("closed_ids", [])

          runtime["run_count"] = int(runtime.get("run_count", 0) or 0) + 1
          runtime["last_run"] = NOW

          api_key = os.environ.get("COLONY_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing (GitHub secret).")

          from colony_sdk import ColonyClient  # noqa: E402

          client = ColonyClient(api_key)
          try:
              client.bootstrap()
              print("Bootstrap: OK")
          except Exception as exc:  # non fatal
              print("WARNING: bootstrap failed:", exc)

          def call(name, *args, **kwargs):
              method = getattr(client, name, None)
              if method is None:
                  print(f"WARNING: SDK method unavailable: {name}")
                  return None
              try:
                  return method(*args, **kwargs)
              except TypeError:
                  try:
                      return method(*args)
                  except Exception as exc:
                      print(f"WARNING: {name} failed: {exc}")
              except Exception as exc:
                  print(f"WARNING: {name} failed: {exc}")
              return None

          def ident(obj):
              if not isinstance(obj, dict):
                  return ""
              for key in ("id", "post_id", "comment_id", "message_id", "conversation_id", "username", "slug"):
                  if obj.get(key) is not None and str(obj[key]).strip():
                      return str(obj[key])
              return ""

          # ------------------------------------------------------------ processed ids
          processed = [str(x) for x in as_list(runtime.get("processed_ids")) if x is not None]
          processed_set = set(processed)

          def mark(item_id):
              item_id = str(item_id)
              if item_id and item_id not in processed_set:
                  processed_set.add(item_id)
                  processed.append(item_id)

          if not runtime.get("processed_seeded"):
              # One-time backfill so that items already seen in older runs
              # (stored in memory) are not treated as new after this fix.
              for obs in as_list(memory.get("observations")):
                  value = as_dict(as_dict(obs).get("value"))
                  for key in ("post_id", "message_id"):
                      if value.get(key):
                          mark(value[key])
              for case in as_list(memory.get("cognitive_cases")):
                  case = as_dict(case)
                  if case.get("message_id"):
                      mark(case["message_id"])
                  if case.get("type") == "public_question" and case.get("target_id"):
                      mark(case["target_id"])
              runtime["processed_seeded"] = True
              print("Seeded processed_ids:", len(processed))

          # ------------------------------------------------------------ closed actions
          closed_ids = {str(x) for x in as_list(presence.get("closed_ids"))}
          for failure in as_list(presence.get("permanent_failures")):
              if isinstance(failure, dict) and (failure.get("action_id") or failure.get("id")):
                  closed_ids.add(str(failure.get("action_id") or failure.get("id")))

          pending, seen_pending = [], set()
          for action in as_list(runtime.get("pending_actions")):
              if not isinstance(action, dict):
                  continue
              aid = text(action.get("action_id") or action.get("id"))
              if aid and (aid in closed_ids or aid in seen_pending):
                  continue
              if aid:
                  seen_pending.add(aid)
              pending.append(action)
          runtime["pending_actions"] = pending
          pending_ids = set(seen_pending)

          observations, new_cases, new_work, new_actions = [], [], [], []

          def add_observation(kind, source, value):
              obs = {
                  "id": stable_id("obs", kind, source, repr(sorted(value.items())) if isinstance(value, dict) else value),
                  "timestamp": NOW, "type": kind, "source": source, "value": value,
              }
              observations.append(obs)
              memory["observations"].append(obs)

          def add_case(case_type, source, target_id, question, **extra):
              case_id = stable_id("case", case_type, target_id, extra.get("message_id", ""))
              if any(isinstance(c, dict) and c.get("id") == case_id for c in memory["cognitive_cases"][-MAX_CASES:]):
                  return None
              case = {"id": case_id, "timestamp": NOW, "type": case_type, "source": source,
                      "target_id": target_id, "question": question, "status": "open"}
              case.update(extra)
              new_cases.append(case)
              memory["cognitive_cases"].append(case)
              return case

          def add_work(case, question, reason):
              work_id = stable_id("work", case["id"], question)
              known = set()
              for coll in (runtime["work_requests"], work["pending"], work["history"], work["results"], work["failed"]):
                  for entry in as_list(coll):
                      if isinstance(entry, dict) and entry.get("work_id"):
                          known.add(str(entry["work_id"]))
              if work_id in known:
                  return None
              request = {"work_id": work_id, "case_id": case["id"], "created_at": NOW, "status": "pending",
                         "question": question, "reason": reason, "source": "core", "attempts": 0}
              runtime["work_requests"].append(request)
              work["pending"].append(request)
              new_work.append(request)
              return request

          def add_action(action_type, target_id="", body="", recipient="", source_case="", metadata=None):
              action_id = stable_id("action", action_type, target_id, recipient, body[:200])
              if action_id in closed_ids or action_id in pending_ids:
                  return None
              action = {"action_id": action_id, "id": action_id, "created_at": NOW, "status": "pending",
                        "type": action_type, "target_id": target_id, "body": body, "recipient": recipient,
                        "source_case": source_case, "attempts": 0}
              if isinstance(metadata, dict):
                  action["metadata"] = metadata
              runtime["pending_actions"].append(action)
              memory["actions"].append(action)
              new_actions.append(action)
              pending_ids.add(action_id)
              return action

          def make_question(title, body):
              """Build a complete, searchable question (never a truncated blob)."""
              title, body = collapse(title, 300), collapse(body, 3000)
              if title and "?" in title and len(title) >= 24:
                  return title
              for sentence in re.split(r"(?<=[.?!])\s+", body):
                  if "?" in sentence and len(sentence) >= 24:
                      return sentence[:300].rsplit(" ", 1)[0].strip() if len(sentence) > 300 else sentence.strip()
              return ""

          # ------------------------------------------------------------ feed
          feed_items = take(call("get_for_you_feed", limit=MAX_FEED), MAX_FEED)
          print("Feed:", len(feed_items))
          cases_budget = MAX_NEW_CASES

          for post in feed_items:
              if not isinstance(post, dict):
                  continue
              post_id = ident(post)
              if not post_id or post_id in processed_set:
                  continue
              mark(post_id)
              author = username_of(post)
              if author == OWN_USERNAME:
                  continue
              title = text(post.get("title"))
              body = text(post.get("body") or post.get("content") or post.get("text"))
              add_observation("feed_item", "colony", {"post_id": post_id, "author": author, "title": title[:300]})
              combined = f"{title}\n{body}"
              if cases_budget <= 0 or "?" not in combined or len(body) < 20:
                  continue
              question = make_question(title, body)
              if not question:
                  continue
              case = add_case("public_question", "feed", post_id, question, author=author)
              if case and add_work(case, question, "Public question: gather sources before any reply."):
                  cases_budget -= 1

          # ------------------------------------------------------------ notifications
          notifications = take(call("get_notifications"), MAX_NOTIF)
          print("Notifications:", len(notifications))
          for notif in notifications:
              if not isinstance(notif, dict):
                  continue
              nid = ident(notif)
              if not nid or f"notif:{nid}" in processed_set:
                  continue
              mark(f"notif:{nid}")
              add_observation("notification", "colony",
                              {"id": nid, "type": text(notif.get("type")), "text": clip(notif, 500)})

          # ------------------------------------------------------------ direct messages
          dm_cases = 0
          oldest_allowed = datetime.now(timezone.utc) - timedelta(hours=DM_MAX_AGE_H)

          for conv in take(call("iter_conversations"), MAX_CONV):
              if not isinstance(conv, dict):
                  continue
              other = conv.get("other_user")
              sender_name = (text(other.get("username") or other.get("handle")) if isinstance(other, dict)
                             else text(other)) or text(conv.get("username") or conv.get("other_username"))
              if not sender_name or sender_name.strip().lower() == OWN_USERNAME:
                  continue
              conv_id = text(conv.get("id"))
              incoming = []
              for msg in take(call("get_conversation", sender_name), 200):
                  if not isinstance(msg, dict):
                      continue
                  mid = ident(msg)
                  if not mid or mid in processed_set:
                      continue
                  mark(mid)
                  msg_sender = username_of(msg) or sender_name.strip().lower()
                  direction = text(msg.get("direction")).lower()
                  if msg_sender == OWN_USERNAME or msg.get("is_own") or direction in ("outgoing", "sent"):
                      continue
                  body = text(msg.get("body") or msg.get("content") or msg.get("text"))
                  if not body:
                      continue
                  created = parse_ts(text(msg.get("created_at") or msg.get("timestamp")))
                  if created and created < oldest_allowed:
                      continue
                  incoming.append((text(msg.get("created_at") or ""), mid, body, msg_sender))
              if not incoming:
                  continue
              incoming.sort(key=lambda row: row[0])
              _, mid, body, msg_sender = incoming[-1]  # only the latest unanswered message
              add_observation("direct_message", "colony",
                              {"message_id": mid, "conversation_id": conv_id, "sender": msg_sender, "body": body[:500]})
              question = make_question("", body)  # only real questions are researched
              if question and dm_cases < MAX_NEW_CASES:
                  case = add_case("dm", "conversation", conv_id, question, message_id=mid,
                                  sender=msg_sender, sender_username=sender_name)
                  if case and add_work(case, question, "Direct question: gather sources before replying."):
                      dm_cases += 1
          print("DM cases:", dm_cases)

          # ------------------------------------------------------------ research results -> actions
          def compose_reply(result):
              facts = [f for f in as_list(result.get("facts")) if isinstance(f, dict) and f.get("url")][:3]
              if not facts:
                  return ""
              lines = ["Automated source check (not verified, may be incomplete):"]
              for fact in facts:
                  label = clip(collapse(fact.get("title") or fact.get("domain")), 80)
                  lines.append(f"- {label}: {fact['url']}")
              snippet = collapse(facts[0].get("snippet"), 240)
              if snippet:
                  lines.append(f'Closest passage: "{snippet}"')
              return "\n".join(lines)[:1500]

          consumed_results = 0
          for result in as_list(work.get("results"))[-MAX_HISTORY:]:
              if not isinstance(result, dict):
                  continue
              status = text(result.get("evidence_status"))
              case_id = text(result.get("case_id"))
              if status not in ("multi_source_support", "partial_support") or not case_id:
                  continue
              key = f"result:{text(result.get('result_id')) or case_id}"
              if key in processed_set:
                  continue
              mark(key)
              case = next((c for c in reversed(memory["cognitive_cases"])
                           if isinstance(c, dict) and c.get("id") == case_id), None)
              if case is None:
                  continue
              reply = compose_reply(result)
              case.update({"status": "research_complete", "result_id": text(result.get("result_id")),
                           "evidence_status": status, "conclusion": clip(text(result.get("conclusion")), 600),
                           "reply_text": reply})
              if reply:
                  if case.get("type") == "dm" and case.get("sender"):
                      add_action("dm_reply", target_id=case.get("target_id", ""), body=reply,
                                 recipient=case["sender"], source_case=case_id,
                                 metadata={"message_id": case.get("message_id"), "evidence_status": status})
                  elif case.get("type") == "public_question" and PUBLIC_REPLIES and status == "multi_source_support":
                      add_action("reply", target_id=case.get("target_id", ""), body=reply,
                                 source_case=case_id, metadata={"evidence_status": status})
              memory["results"].append({"id": key, "timestamp": NOW, "case_id": case_id, "status": status,
                                        "conclusion": clip(text(result.get("conclusion")), 600)})
              consumed_results += 1
          print("Research results consumed:", consumed_results)

          # ------------------------------------------------------------ presence outcomes -> experiences
          consumed_outcomes = 0
          for outcome in as_list(presence.get("outcomes"))[-MAX_HISTORY:]:
              if not isinstance(outcome, dict):
                  continue
              oid = text(outcome.get("id"))
              action_id = text(outcome.get("action_id"))
              if not oid or not action_id or f"outcome:{oid}" in processed_set:
                  continue
              mark(f"outcome:{oid}")
              info = {"action_id": action_id, "status": text(outcome.get("status")),
                      "error": clip(outcome.get("error"), 300)}
              add_observation("presence_outcome", "presence", info)
              memory["experiences"].append({"id": stable_id("experience", oid), "timestamp": NOW,
                                            "type": "action_outcome", **info})
              consumed_outcomes += 1
          print("Presence outcomes consumed:", consumed_outcomes)

          # ------------------------------------------------------------ runtime / bounds
          runtime["observations"].extend(observations)
          runtime["decisions"].extend({"timestamp": NOW, "case_id": c["id"], "decision": "research",
                                       "reason": c.get("question", "")} for c in new_cases)

          memory["observations"] = bound(memory["observations"], 500)
          memory["cognitive_cases"] = bound(memory["cognitive_cases"], MAX_CASES)
          memory["actions"] = bound(memory["actions"], MAX_ACTIONS)
          for key, limit in (("experiences", 300), ("results", 300), ("facts", 300), ("hypotheses", 200),
                             ("questions", 200), ("learnings", 300), ("sources", 300)):
              memory[key] = bound(memory[key], limit)
          runtime["observations"] = bound(runtime["observations"], 500)
          runtime["decisions"] = bound(runtime["decisions"], 500)
          runtime["pending_actions"] = bound(runtime["pending_actions"], MAX_ACTIONS)
          runtime["work_requests"] = bound(runtime["work_requests"], MAX_WORK_REQ)
          runtime["processed_ids"] = bound(processed, 3000)

          for action in runtime["pending_actions"]:
              if isinstance(action, dict) and any(t in text(action.get("type")).lower()
                                                  for t in ("payment", "pay", "spend", "invoice", "withdraw")):
                  raise RuntimeError(f"Forbidden financial action generated by Core: {action.get('type')}")

          runtime["last_summary"] = {
              "run_id": RUN_ID, "timestamp": NOW, "feed": len(feed_items), "notifications": len(notifications),
              "dm_cases": dm_cases, "cases_created": len(new_cases), "new_work": len(new_work),
              "new_actions": len(new_actions), "research_results_consumed": consumed_results,
              "presence_outcomes_consumed": consumed_outcomes,
          }

          save_json(MEMORY_FILE, memory)
          save_json(RUNTIME_FILE, runtime)
          save_json(WORK_FILE, work)

          print("Cases:", len(new_cases), "| New work:", len(new_work), "| New actions:", len(new_actions))
          print("=== CORE COMPLETE ===")
          PY

      - name: Validate JSON state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          for path in ["memory/nox_core_memory.json", "memory/nox_core_runtime.json", "memory/nox_work_factory.json", "memory/nox_colony_presence.json"]:
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
                  print("VALID JSON:", path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          for f in memory/nox_core_memory.json memory/nox_core_runtime.json memory/nox_work_factory.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(nox): update core state"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after retries."
          exit 1
