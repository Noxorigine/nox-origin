name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json

  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"
  MAX_PUBLISH_ACTIONS: "3"

  ENABLE_LIGHTNING_CHECK: "true"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          from colony_sdk import ColonyClient

          MEMORY_FILE = os.environ["MEMORY_FILE"]
          RUNTIME_FILE = os.environ["RUNTIME_FILE"]
          WORK_FILE = os.environ["WORK_FILE"]

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_CASE_HISTORY = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_ACTIONS = int(os.environ["MAX_PENDING_ACTIONS"])
          MAX_WORK = int(os.environ["MAX_WORK_REQUESTS"])
          MAX_PUBLISH = int(os.environ["MAX_PUBLISH_ACTIONS"])

          now = datetime.now(timezone.utc)
          now_iso = now.isoformat()
          run_id = "core-" + now.strftime("%Y%m%dT%H%M%SZ")

          def load(path, default):
              if not os.path.exists(path):
                  return default
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print("[WARN] read", path, exc)
                  return default

          def save(path, data):
              tmp = path + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              os.replace(tmp, path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def get(obj, *names):
              if isinstance(obj, dict):
                  for name in names:
                      if obj.get(name) is not None:
                          return obj.get(name)
              else:
                  for name in names:
                      value = getattr(obj, name, None)
                      if value is not None:
                          return value
              return None

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("body", "content", "text", "message"):
                      if value.get(key):
                          return str(value[key])
              return str(value)

          def ident(obj, *names):
              value = get(obj, *names)
              if value is None:
                  return None
              return str(value)

          def make_id(prefix, *parts):
              raw = "|".join("" if x is None else str(x) for x in parts)
              digest = hashlib.sha256(raw.encode()).hexdigest()[:20]
              return prefix + "-" + digest

          def items(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "posts",
                      "messages",
                      "notifications",
                      "suggestions",
                      "feed",
                  ):
                      if isinstance(value.get(key), list):
                          return value[key]
              return []

          memory = as_dict(load(MEMORY_FILE, {}))
          runtime = as_dict(load(RUNTIME_FILE, {}))
          work = as_dict(load(WORK_FILE, {}))

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "questions",
              "tests",
              "results",
              "learnings",
              "actions",
              "web_queries",
              "cognitive_cases",
              "seen_event_ids",
              "processed_post_ids",
              "processed_notification_ids",
              "processed_dm_ids",
              "runs",
          ):
              memory.setdefault(key, [])

          runtime.setdefault("pending_actions", [])
          runtime.setdefault("work_requests", [])
          runtime.setdefault("web_queries", [])

          work.setdefault("pending", [])
          work.setdefault("history", [])
          work.setdefault("results", [])

          memory["run_count"] = int(memory.get("run_count", 0)) + 1
          runtime["run_count"] = int(runtime.get("run_count", 0)) + 1
          work["run_count"] = int(work.get("run_count", 0)) + 1

          print("=== NØX CORE ===")
          print("RUN:", run_id)

          client = ColonyClient()

          try:
              bootstrap = getattr(client, "bootstrap", None)
              if bootstrap:
                  bootstrap()
                  print("Bootstrap: OK")
          except Exception as exc:
              print("Bootstrap warning:", exc)

          feed = []
          notifications = []
          dms = []

          try:
              method = getattr(client, "get_for_you_feed", None)
              if method:
                  try:
                      feed = items(method(max_results=MAX_FEED))
                  except TypeError:
                      feed = items(method())
                  feed = feed[:MAX_FEED]
          except Exception as exc:
              print("Feed warning:", exc)

          try:
              method = getattr(client, "get_notifications", None)
              if method:
                  try:
                      notifications = items(
                          method(max_results=MAX_NOTIFICATIONS)
                      )
                  except TypeError:
                      notifications = items(method())
                  notifications = notifications[:MAX_NOTIFICATIONS]
          except Exception as exc:
              print("Notifications warning:", exc)

          try:
              iterator = getattr(client, "iter_conversations", None)
              getter = getattr(client, "get_conversation", None)

              if iterator and getter:
                  conversations = list(iterator(max_results=50))

                  for conversation in conversations:
                      conversation_id = ident(
                          conversation,
                          "id",
                          "conversation_id",
                      )

                      if not conversation_id:
                          continue

                      try:
                          detail = getter(conversation_id)
                          messages = items(detail)
                          dms.extend(messages)
                      except Exception as exc:
                          print(
                              "Conversation warning:",
                              conversation_id,
                              exc,
                          )

                      if len(dms) >= MAX_DMS:
                          break

                  dms = dms[:MAX_DMS]

          except Exception as exc:
              print("DM warning:", exc)

          print("Feed:", len(feed))
          print("Notifications:", len(notifications))
          print("DMs:", len(dms))

          processed_posts = set(
              str(x)
              for x in as_list(memory["processed_post_ids"])
          )

          processed_notifications = set(
              str(x)
              for x in as_list(
                  memory["processed_notification_ids"]
              )
          )

          processed_dms = set(
              str(x)
              for x in as_list(memory["processed_dm_ids"])
          )

          cases = as_list(memory["cognitive_cases"])
          pending_actions = as_list(runtime["pending_actions"])
          work_requests = as_list(runtime["work_requests"])

          case_ids = set()
          for case in cases:
              if isinstance(case, dict) and case.get("id"):
                  case_ids.add(str(case["id"]))

          action_ids = set()
          for action in pending_actions:
              if isinstance(action, dict) and action.get("action_id"):
                  action_ids.add(str(action["action_id"]))

          memory_action_ids = set()
          for action in as_list(memory["actions"]):
              if isinstance(action, dict) and action.get("action_id"):
                  memory_action_ids.add(str(action["action_id"]))

          work_ids = set()
          for request in work_requests:
              if isinstance(request, dict) and request.get("request_id"):
                  work_ids.add(str(request["request_id"]))

          def observe(kind, source_id, data):
              memory["observations"].append(
                  {
                      "id": make_id(
                          "obs",
                          run_id,
                          kind,
                          source_id,
                      ),
                      "timestamp": now_iso,
                      "kind": kind,
                      "source_id": source_id,
                      "data": data,
                  }
              )

          def add_case(case):
              case_id = str(case["id"])

              if case_id in case_ids:
                  return False

              cases.append(case)
              case_ids.add(case_id)
              return True

          def add_work(case, reason):
              request_id = str(case["id"])

              if request_id in work_ids:
                  return False

              work_requests.append(
                  {
                      "request_id": request_id,
                      "case_id": request_id,
                      "created_at": now_iso,
                      "question": case.get("question", ""),
                      "reason": reason,
                      "status": "pending",
                      "priority": case.get("priority", "normal"),
                  }
              )

              work_ids.add(request_id)
              return True

          def add_action(action):
              action_id = str(action["action_id"])

              if action_id in action_ids:
                  return False

              if action_id in memory_action_ids:
                  return False

              pending_actions.append(action)
              action_ids.add(action_id)
              memory_action_ids.add(action_id)

              memory["actions"].append(
                  {
                      "action_id": action_id,
                      "created_at": now_iso,
                      "type": action.get("type"),
                      "case_id": action.get("case_id"),
                      "target_id": action.get("target_id"),
                      "status": "planned",
                  }
              )

              return True

          # ----------------------------------------------------------
          # FEED
          # ----------------------------------------------------------

          created = 0

          for post in feed:
              if created >= MAX_CASES:
                  break

              post_id = ident(post, "id", "post_id")

              if not post_id or post_id in processed_posts:
                  continue

              processed_posts.add(post_id)

              author = get(
                  post,
                  "author",
                  "user",
                  "creator",
              )

              author_id = ident(
                  author,
                  "id",
                  "user_id",
              )

              author_name = get(
                  author,
                  "username",
                  "name",
                  "handle",
              )

              title = text(get(post, "title"))
              body = text(
                  get(
                      post,
                      "body",
                      "content",
                      "text",
                  )
              )

              content = (
                  title + "\n" + body
                  if title
                  else body
              ).strip()

              observe(
                  "feed_post",
                  post_id,
                  {
                      "author_id": author_id,
                      "author": author_name,
                      "content": content[:2000],
                  },
              )

              lower = content.lower()

              question = (
                  "?" in content
                  or any(
                      marker in lower
                      for marker in (
                          "how do",
                          "how can",
                          "why ",
                          "what is",
                          "does ",
                          "can an agent",
                          "can agents",
                      )
                  )
              )

              evidence = any(
                  marker in lower
                  for marker in (
                      "i tested",
                      "we tested",
                      "works",
                      "doesn't work",
                      "failed",
                      "succeeded",
                      "verified",
                      "confirmed",
                      "according to",
                      "documentation says",
                  )
              )

              if not question and not evidence:
                  continue

              case_type = (
                  "public_question"
                  if question
                  else "evidence_claim"
              )

              case_id = make_id(
                  "case",
                  "post",
                  post_id,
                  content[:1000],
              )

              case = {
                  "id": case_id,
                  "created_at": now_iso,
                  "updated_at": now_iso,
                  "type": case_type,
                  "source": "feed",
                  "source_id": post_id,
                  "target_id": post_id,
                  "author_id": author_id,
                  "author": author_name,
                  "question": content[:3000],
                  "context": {
                      "title": title,
                      "body": body[:3000],
                  },
                  "status": "needs_research",
                  "priority": (
                      "high"
                      if question
                      else "normal"
                  ),
              }

              if add_case(case):
                  add_work(
                      case,
                      "public_question_or_evidence",
                  )
                  created += 1

          # ----------------------------------------------------------
          # NOTIFICATIONS
          # ----------------------------------------------------------

          for notification in notifications:
              notification_id = ident(
                  notification,
                  "id",
                  "notification_id",
              )

              if not notification_id:
                  continue

              if notification_id in processed_notifications:
                  continue

              processed_notifications.add(
                  notification_id
              )

              observe(
                  "notification",
                  notification_id,
                  {
                      "content": text(notification)[:1500],
                  },
              )

          # ----------------------------------------------------------
          # DIRECT MESSAGES
          # ----------------------------------------------------------

          for message in dms:
              message_id = ident(
                  message,
                  "id",
                  "message_id",
              )

              if not message_id:
                  continue

              if message_id in processed_dms:
                  continue

              processed_dms.add(message_id)

              sender = get(
                  message,
                  "sender",
                  "author",
                  "from_user",
              )

              sender_id = ident(
                  sender,
                  "id",
                  "user_id",
              )

              sender_name = get(
                  sender,
                  "username",
                  "name",
                  "handle",
              )

              body = text(
                  get(
                      message,
                      "body",
                      "content",
                      "text",
                      "message",
                  )
              ).strip()

              observe(
                  "direct_message",
                  message_id,
                  {
                      "sender_id": sender_id,
                      "sender": sender_name,
                      "content": body[:3000],
                  },
              )

              if not body:
                  continue

              case_id = make_id(
                  "case",
                  "dm",
                  message_id,
              )

              case = {
                  "id": case_id,
                  "created_at": now_iso,
                  "updated_at": now_iso,
                  "type": "dm_question",
                  "source": "dm",
                  "source_id": message_id,
                  "target_id": sender_id,
                  "author_id": sender_id,
                  "author": sender_name,
                  "question": body[:3000],
                  "context": {
                      "message_id": message_id,
                  },
                  "status": "needs_research",
                  "priority": "high",
              }

              if add_case(case):
                  add_work(
                      case,
                      "direct_message",
                  )

          # ----------------------------------------------------------
          # WORK FACTORY RESULTS
          # ----------------------------------------------------------

          research = {}

          for result in (
              as_list(work.get("history"))
              + as_list(work.get("results"))
          ):
              if not isinstance(result, dict):
                  continue

              request_id = (
                  result.get("request_id")
                  or result.get("case_id")
                  or result.get("id")
              )

              if request_id:
                  research[str(request_id)] = result

          consumed_research = 0

          for case in cases:
              if not isinstance(case, dict):
                  continue

              case_id = str(case.get("id", ""))

              if not case_id:
                  continue

              result = research.get(case_id)

              if not result:
                  continue

              status = result.get(
                  "evidence_status",
                  "unknown",
              )

              if status not in (
                  "multi_source_support",
                  "partial_support",
                  "insufficient_verification",
                  "no_evidence",
              ):
                  continue

              case["research"] = {
                  "consumed_at": now_iso,
                  "evidence_status": status,
                  "facts": as_list(
                      result.get("facts")
                  ),
                  "sources": as_list(
                      result.get("sources")
                  ),
                  "uncertainties": as_list(
                      result.get("uncertainties")
                  ),
                  "conflicts": as_list(
                      result.get("conflicts")
                  ),
                  "conclusion": text(
                      result.get("conclusion")
                  )[:5000],
              }

              case["updated_at"] = now_iso
              case["status"] = "research_complete"
              consumed_research += 1

          # ----------------------------------------------------------
          # PRESENCE OUTCOMES
          # ----------------------------------------------------------

          presence = as_dict(
              load(
                  "memory/nox_colony_presence.json",
                  {},
              )
          )

          outcomes = as_list(
              presence.get("outcomes")
          )

          outcome_map = {}

          for outcome in outcomes:
              if not isinstance(outcome, dict):
                  continue

              action_id = outcome.get("action_id")

              if action_id:
                  outcome_map[str(action_id)] = outcome

          remaining = []
          consumed_outcomes = 0

          for action in pending_actions:
              if not isinstance(action, dict):
                  continue

              action_id = action.get("action_id")

              if not action_id:
                  continue

              outcome = outcome_map.get(
                  str(action_id)
              )

              if outcome is None:
                  remaining.append(action)
                  continue

              consumed_outcomes += 1

              status = outcome.get(
                  "status",
                  "unknown",
              )

              for stored in memory["actions"]:
                  if (
                      isinstance(stored, dict)
                      and str(
                          stored.get("action_id")
                      ) == str(action_id)
                  ):
                      stored["status"] = status
                      stored["outcome"] = outcome
                      stored["completed_at"] = now_iso

              case_id = action.get("case_id")

              for case in cases:
                  if (
                      isinstance(case, dict)
                      and str(case.get("id"))
                      == str(case_id)
                  ):
                      case["last_outcome"] = outcome
                      case["updated_at"] = now_iso

                      if status == "success":
                          case["status"] = "completed"
                      else:
                          case["status"] = "action_failed"

              if status == "success":
                  memory["experiences"].append(
                      {
                          "id": make_id(
                              "experience",
                              action_id,
                              now_iso,
                          ),
                          "timestamp": now_iso,
                          "type": "action_outcome",
                          "action_id": action_id,
                          "case_id": action.get(
                              "case_id"
                          ),
                          "status": "success",
                          "observation": outcome,
                      }
                  )

          pending_actions = remaining

          # ----------------------------------------------------------
          # DECISIONS
          # ----------------------------------------------------------

          for case in cases:
              if not isinstance(case, dict):
                  continue

              if case.get("status") != "research_complete":
                  continue

              research_data = as_dict(
                  case.get("research")
              )

              evidence_status = research_data.get(
                  "evidence_status",
                  "unknown",
              )

              conclusion = text(
                  research_data.get(
                      "conclusion"
                  )
              ).strip()

              case_id = case.get("id")

              if not conclusion:
                  continue

              if evidence_status in (
                  "insufficient_verification",
                  "no_evidence",
              ):
                  case["status"] = "uncertain"

                  memory["questions"].append(
                      {
                          "id": make_id(
                              "question",
                              case_id,
                              conclusion,
                          ),
                          "timestamp": now_iso,
                          "case_id": case_id,
                          "question": case.get(
                              "question",
                              "",
                          ),
                          "reason": (
                              "insufficient_verification"
                          ),
                      }
                  )

                  continue

              if case.get("type") == "dm_question":
                  action_id = make_id(
                      "action",
                      "dm_reply",
                      case_id,
                      conclusion,
                  )

                  action = {
                      "action_id": action_id,
                      "case_id": case_id,
                      "type": "dm_reply",
                      "created_at": now_iso,
                      "target_id": case.get(
                          "author_id"
                      ),
                      "message_id": case.get(
                          "source_id"
                      ),
                      "question": case.get(
                          "question",
                          "",
                      ),
                      "reply_text": conclusion[:4000],
                      "research": research_data,
                      "status": "pending",
                  }

                  if add_action(action):
                      case["status"] = "action_planned"

              elif case.get("type") in (
                  "public_question",
                  "evidence_claim",
              ):
                  target_id = case.get(
                      "target_id"
                  )

                  if not target_id:
                      case["status"] = "missing_target"
                      continue

                  action_id = make_id(
                      "action",
                      "reply",
                      case_id,
                      conclusion,
                  )

                  action = {
                      "action_id": action_id,
                      "case_id": case_id,
                      "type": "reply",
                      "created_at": now_iso,
                      "target_id": target_id,
                      "post_id": target_id,
                      "question": case.get(
                          "question",
                          "",
                      ),
                      "reply_text": conclusion[:4000],
                      "research": research_data,
                      "status": "pending",
                  }

                  if add_action(action):
                      case["status"] = "action_planned"

          # ----------------------------------------------------------
          # OPTIONAL RESEARCH-BACKED PUBLIC POST
          # ----------------------------------------------------------

          published = 0

          for case in cases:
              if published >= MAX_PUBLISH:
                  break

              if not isinstance(case, dict):
                  continue

              if case.get("status") != "research_complete":
                  continue

              if case.get("type") != "evidence_claim":
                  continue

              research_data = as_dict(
                  case.get("research")
              )

              if research_data.get(
                  "evidence_status"
              ) != "multi_source_support":
                  continue

              conclusion = text(
                  research_data.get(
                      "conclusion"
                  )
              ).strip()

              if len(conclusion) < 100:
                  continue

              action_id = make_id(
                  "action",
                  "publish",
                  case.get("id"),
                  conclusion,
              )

              action = {
                  "action_id": action_id,
                  "case_id": case.get("id"),
                  "type": "publish",
                  "created_at": now_iso,
                  "title": "NØX research result",
                  "body": conclusion[:5000],
                  "research": research_data,
                  "status": "pending",
              }

              if add_action(action):
                  case["status"] = "action_planned"
                  published += 1

          # ----------------------------------------------------------
          # BOUNDS
          # ----------------------------------------------------------

          cases = cases[-MAX_CASE_HISTORY:]
          pending_actions = pending_actions[-MAX_ACTIONS:]
          work_requests = work_requests[-MAX_WORK:]

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "questions",
              "tests",
              "results",
              "learnings",
              "actions",
              "web_queries",
          ):
              memory[key] = as_list(
                  memory.get(key)
              )[-MAX_MEMORY:]

          memory["processed_post_ids"] = list(
              processed_posts
          )[-MAX_MEMORY:]

          memory["processed_notification_ids"] = list(
              processed_notifications
          )[-MAX_MEMORY:]

          memory["processed_dm_ids"] = list(
              processed_dms
          )[-MAX_MEMORY:]

          memory["seen_event_ids"] = list(
              dict.fromkeys(
                  list(processed_posts)
                  + list(processed_notifications)
                  + list(processed_dms)
              )
          )[-MAX_MEMORY:]

          memory["cognitive_cases"] = cases

          runtime["pending_actions"] = pending_actions
          runtime["work_requests"] = work_requests
          runtime["last_run"] = now_iso
          runtime["run_id"] = run_id

          runtime["stats"] = {
              "feed_items": len(feed),
              "notifications": len(notifications),
              "dms": len(dms),
              "cases": len(cases),
              "pending_actions": len(pending_actions),
              "work_requests": len(work_requests),
              "research_results_consumed": consumed_research,
              "presence_outcomes_consumed": consumed_outcomes,
          }

          memory["runs"].append(
              {
                  "run_id": run_id,
                  "timestamp": now_iso,
                  "stats": runtime["stats"],
              }
          )

          memory["runs"] = memory["runs"][-100:]

          # Validate objects before writing.
          json.dumps(memory, ensure_ascii=False)
          json.dumps(runtime, ensure_ascii=False)
          json.dumps(work, ensure_ascii=False)

          save(MEMORY_FILE, memory)
          save(RUNTIME_FILE, runtime)
          save(WORK_FILE, work)

          print("=== CORE RESULT ===")
          print("Feed:", len(feed))
          print("Notifications:", len(notifications))
          print("DMs:", len(dms))
          print("Cases:", len(cases))
          print("Pending actions:", len(pending_actions))
          print("Work requests:", len(work_requests))
          print("Research consumed:", consumed_research)
          print("Presence outcomes:", consumed_outcomes)
          print("===================")

          PY

      - name: Validate state files
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          files = [
              "memory/nox_core_memory.json",
              "memory/nox_core_runtime.json",
              "memory/nox_work_factory.json",
          ]

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  json.load(f)
              print("[OK]", path)

          PY

      - name: Check diff
        run: |
          set -euo pipefail
          git diff --check

      - name: Commit and push state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_core_memory.json \
            memory/nox_core_runtime.json \
            memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore(nox): update core state"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && \
               git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            sleep 3
          done

          echo "Unable to push state after 3 attempts."
          exit 1
