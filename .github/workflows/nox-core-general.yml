name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json
  MAX_FEED_ITEMS: "12"
  MAX_SUGGESTIONS: "10"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_ACTIONS_PER_RUN: "2"
  MAX_WEB_RESULTS: "5"
  WEB_TIMEOUT_SECONDS: "12"
  ACTION_THRESHOLD: "0.60"
  ENABLE_WEB_RESEARCH: "true"
  ENABLE_PUBLIC_ACTIONS: "false"
  ENABLE_LIGHTNING_CHECK: "true"

jobs:
  core-general:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install colony-sdk

      - name: Run NØX Core General
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          LEGACY_MEMORY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_COGNITIVE_CASES = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_WEB_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          WEB_TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])
          ACTION_THRESHOLD = float(os.environ["ACTION_THRESHOLD"])

          ENABLE_WEB = os.environ["ENABLE_WEB_RESEARCH"].lower() == "true"
          ENABLE_PUBLIC_ACTIONS = (
              os.environ["ENABLE_PUBLIC_ACTIONS"].lower() == "true"
          )
          ENABLE_LIGHTNING = (
              os.environ["ENABLE_LIGHTNING_CHECK"].lower() == "true"
          )

          NOW = datetime.now(timezone.utc).isoformat()

          EMPTY_MEMORY = {
              "version": 5,
              "observations": [],
              "questions": [],
              "hypotheses": [],
              "decisions": [],
              "actions": [],
              "results": [],
              "learnings": [],
              "failures": [],
              "relationships": [],
              "cognitive_cases": [],
          }

          EMPTY_RUNTIME = {
              "run_count": 0,
              "last_run": None,
              "seen_event_ids": [],
              "processed_post_ids": [],
              "processed_suggestion_ids": [],
              "action_count_total": 0,
              "last_rate_limit": None,
              "payout_health": None,
              "cognitive_version": 5,
          }

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  return value if isinstance(value, dict) else default
              except Exception as exc:
                  print(f"WARNING: lecture impossible {path}: {exc}")
                  return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def normalize_memory(data):
              memory = dict(EMPTY_MEMORY)

              if isinstance(data, dict):
                  try:
                      memory["version"] = max(
                          5,
                          int(data.get("version", 1) or 1),
                      )
                  except Exception:
                      memory["version"] = 5

                  for key in memory:
                      if key == "version":
                          continue

                      value = data.get(key, [])
                      memory[key] = (
                          value if isinstance(value, list) else []
                      )

              return memory

          def normalize_runtime(data):
              runtime = dict(EMPTY_RUNTIME)

              if isinstance(data, dict):
                  runtime.update(data)

              for key in (
                  "seen_event_ids",
                  "processed_post_ids",
                  "processed_suggestion_ids",
              ):
                  if not isinstance(runtime.get(key), list):
                      runtime[key] = []

              return runtime

          memory = normalize_memory(
              load_json(MEMORY_FILE, EMPTY_MEMORY)
          )

          runtime = normalize_runtime(
              load_json(RUNTIME_FILE, EMPTY_RUNTIME)
          )

          # -----------------------------------------------------------
          # Legacy migration.
          # The old execution model is not restored.
          # -----------------------------------------------------------
          if not MEMORY_FILE.exists() and LEGACY_MEMORY_FILE.exists():
              legacy = load_json(LEGACY_MEMORY_FILE, {})

              memory["observations"].append({
                  "timestamp": NOW,
                  "source": "legacy_migration",
                  "summary": (
                      "Legacy Colony memory imported into Core v5."
                  ),
                  "evidence": {
                      "commented_post_ids": len(
                          legacy.get("commented_post_ids", [])
                      ),
                      "seen_notification_ids": len(
                          legacy.get("seen_notification_ids", [])
                      ),
                      "skill_attempt_counts": legacy.get(
                          "skill_attempt_counts", {}
                      ),
                      "skill_success_counts": legacy.get(
                          "skill_success_counts", {}
                      ),
                  },
              })

              runtime["processed_post_ids"] = list(
                  legacy.get("commented_post_ids", [])
              )[-1000:]

              runtime["seen_event_ids"] = list(
                  legacy.get("seen_notification_ids", [])
              )[-1000:]

              print("LEGACY MEMORY MIGRATED")

          def add_memory(kind, item, limit=MAX_MEMORY_ITEMS):
              memory.setdefault(kind, [])
              memory[kind].append(item)
              memory[kind] = memory[kind][-limit:]

          def remember(
              kind,
              summary,
              evidence=None,
              source="core",
          ):
              add_memory(
                  kind,
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "evidence": evidence or {},
                      "source": source,
                  },
              )

          def clean(value, limit=2000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]

          def text_blob(obj):
              return clean(
                  json.dumps(
                      obj,
                      ensure_ascii=False,
                  ),
                  12000,
              ).lower()

          def extract_items(response, keys):
              if isinstance(response, list):
                  return response

              if isinstance(response, dict):
                  for key in keys:
                      value = response.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def record_rate_limit(client):
              rl = getattr(client, "last_rate_limit", None)

              if rl is None:
                  return None

              result = {}

              for name in (
                  "limit",
                  "remaining",
                  "reset",
                  "retry_after",
              ):
                  try:
                      value = getattr(rl, name)

                      if value is not None:
                          result[name] = (
                              value.isoformat()
                              if hasattr(value, "isoformat")
                              else value
                          )
                  except Exception:
                      pass

              return result or None

          # -----------------------------------------------------------
          # Colony connection.
          # bootstrap() is the official SDK opening handshake.
          # -----------------------------------------------------------
          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100,
          )

          if username and username != "nox_origine":
              raise SystemExit(
                  f"SECURITY STOP: profil inattendu '{username}'."
              )

          capabilities = (
              state.get("capabilities", {})
              if isinstance(state, dict)
              else {}
          )

          unread_dms = int(
              state.get("unread_direct_messages", 0) or 0
          ) if isinstance(state, dict) else 0

          unread_notifications = int(
              state.get("unread_notifications", 0) or 0
          ) if isinstance(state, dict) else 0

          member_colonies = (
              state.get("member_colonies", [])
              if isinstance(state, dict)
              else []
          )

          print("=== NØX CORE GENERAL V5 ===")
          print(f"Profile: {username or 'unknown'}")
          print(f"Karma: {profile.get('karma', 'unknown')}")
          print(f"Unread DMs: {unread_dms}")
          print(f"Unread notifications: {unread_notifications}")
          print(
              f"Capabilities: {clean(capabilities, 1200)}"
          )

          remember(
              "observations",
              "Colony bootstrap completed.",
              {
                  "username": username,
                  "karma": profile.get("karma"),
                  "capabilities": capabilities,
                  "unread_direct_messages": unread_dms,
                  "unread_notifications": unread_notifications,
                  "member_colonies": member_colonies,
              },
              "colony_bootstrap",
          )

          runtime["last_rate_limit"] = record_rate_limit(client)

          # -----------------------------------------------------------
          # Lightning health check.
          # Read-only. No payment and no callback execution.
          # -----------------------------------------------------------
          payout_health = {
              "status": "NOT_CHECKED",
              "lightning_address": None,
              "error": None,
          }

          if ENABLE_LIGHTNING:
              try:
                  me = client.get_me()

                  lightning = (
                      clean(
                          me.get("lightning_address"),
                          300,
                      )
                      if isinstance(me, dict)
                      else ""
                  )

                  payout_health["lightning_address"] = (
                      lightning or None
                  )

                  if (
                      not lightning
                      or lightning.count("@") != 1
                  ):
                      payout_health["status"] = (
                          "PAYOUT_UNAVAILABLE"
                      )
                      payout_health["error"] = (
                          "missing_or_invalid_lightning_address"
                      )
                  else:
                      local, host = lightning.split("@", 1)

                      endpoint = (
                          f"https://{host}/.well-known/lnurlp/"
                          f"{urllib.parse.quote(local, safe='')}"
                      )

                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "NOX-Core/5",
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=WEB_TIMEOUT,
                      ) as response:
                          payload = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace",
                              )
                          )

                      if payload.get("tag") != "payRequest":
                          raise ValueError(
                              "LNURL tag is not payRequest"
                          )

                      callback = str(
                          payload.get("callback", "")
                      )

                      if not callback.startswith(
                          ("https://", "http://")
                      ):
                          raise ValueError(
                              "LNURL callback missing or invalid"
                          )

                      payout_health["status"] = "PAYOUT_READY"
                      payout_health["endpoint"] = endpoint
                      payout_health["min_sendable_msat"] = (
                          payload.get("minSendable")
                      )
                      payout_health["max_sendable_msat"] = (
                          payload.get("maxSendable")
                      )

                      remember(
                          "observations",
                          (
                              "NØX Lightning address resolved "
                              "successfully; no payment was initiated."
                          ),
                          {
                              "lightning_address": lightning,
                              "min_sendable_msat": payload.get(
                                  "minSendable"
                              ),
                              "max_sendable_msat": payload.get(
                                  "maxSendable"
                              ),
                          },
                          "lightning",
                      )

              except Exception as exc:
                  payout_health["status"] = (
                      "PAYOUT_UNAVAILABLE"
                  )
                  payout_health["error"] = clean(
                      exc,
                      500,
                  )

          runtime["payout_health"] = payout_health

          # -----------------------------------------------------------
          # Notifications.
          #
          # IMPORTANT:
          # The official SDK does NOT expose client.since().
          # We therefore use the documented unread notification API.
          # No fake cursor and no undocumented endpoint.
          # -----------------------------------------------------------
          notifications = []

          if unread_notifications > 0:
              try:
                  notification_response = client.get_notifications(
                      unread_only=True
                  )

                  notifications = extract_items(
                      notification_response,
                      (
                          "items",
                          "notifications",
                      ),
                  )[:MAX_NOTIFICATIONS]

                  runtime["last_rate_limit"] = (
                      record_rate_limit(client)
                  )

              except Exception as exc:
                  print(
                      f"NOTIFICATIONS unavailable: {exc}"
                  )

                  remember(
                      "failures",
                      (
                          "Unread Colony notifications could not "
                          "be read through the documented SDK surface."
                      ),
                      {
                          "error": clean(exc, 500),
                      },
                      "colony_notifications",
                  )

          # -----------------------------------------------------------
          # Direct messages.
          #
          # The SDK exposes list_conversations() and
          # get_conversation(username), not a since() cursor.
          #
          # We inspect only conversations that appear unread when
          # possible. No messages are marked read here because Core
          # foundation mode is observation-only.
          # -----------------------------------------------------------
          messages = []

          if unread_dms > 0:
              try:
                  conversations_response = (
                      client.list_conversations()
                  )

                  conversations = extract_items(
                      conversations_response,
                      (
                          "items",
                          "conversations",
                      ),
                  )

                  for conversation in conversations:
                      if len(messages) >= MAX_DMS:
                          break

                      if not isinstance(conversation, dict):
                          continue

                      unread = int(
                          conversation.get(
                              "unread_count",
                              conversation.get(
                                  "unread",
                                  0,
                              ),
                          )
                          or 0
                      )

                      username_other = (
                          conversation.get("username")
                          or conversation.get(
                              "other_username"
                          )
                          or conversation.get(
                              "recipient_username"
                          )
                          or conversation.get(
                              "with_username"
                          )
                      )

                      if unread <= 0 or not username_other:
                          continue

                      try:
                          conversation_detail = (
                              client.get_conversation(
                                  str(username_other)
                              )
                          )

                          detail_items = extract_items(
                              conversation_detail,
                              (
                                  "items",
                                  "messages",
                              ),
                          )

                          if detail_items:
                              messages.extend(
                                  detail_items[-MAX_DMS:]
                              )
                          elif isinstance(
                              conversation_detail,
                              list,
                          ):
                              messages.extend(
                                  conversation_detail[
                                      -MAX_DMS:
                                  ]
                              )

                      except Exception as exc:
                          print(
                              "CONVERSATION unavailable "
                              f"for {username_other}: {exc}"
                          )

                  messages = messages[:MAX_DMS]

                  runtime["last_rate_limit"] = (
                      record_rate_limit(client)
                  )

              except Exception as exc:
                  print(
                      f"DM LIST unavailable: {exc}"
                  )

                  remember(
                      "failures",
                      (
                          "Unread Colony conversations could not "
                          "be inspected through the documented SDK surface."
                      ),
                      {
                          "error": clean(exc, 500),
                      },
                      "colony_messages",
                  )

          # -----------------------------------------------------------
          # For-you feed.
          # Official SDK recommendation for relevant content.
          # -----------------------------------------------------------
          try:
              feed_response = client.get_for_you_feed(
                  limit=MAX_FEED_ITEMS
              )

              feed_items = extract_items(
                  feed_response,
                  (
                      "items",
                      "posts",
                      "feed",
                  ),
              )

          except Exception as exc:
              feed_items = []

              print(
                  f"FOR-YOU unavailable: {exc}"
              )

          # -----------------------------------------------------------
          # Suggestions.
          # Suggestions are perception only.
          # They never directly trigger action.
          # -----------------------------------------------------------
          try:
              suggestion_response = client.get_suggestions(
                  limit=MAX_SUGGESTIONS
              )

              suggestions = extract_items(
                  suggestion_response,
                  (
                      "items",
                      "suggestions",
                  ),
              )

          except Exception as exc:
              suggestions = []

              print(
                  f"SUGGESTIONS unavailable: {exc}"
              )

          # -----------------------------------------------------------
          # Cognitive functions.
          # Deterministic foundation.
          # No external model.
          # No fabricated reasoning.
          # -----------------------------------------------------------
          def keywords(value):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean(value, 4000).lower(),
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "they",
                  "there",
                  "into",
                  "dans",
                  "pour",
                  "avec",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "être",
                  "plus",
                  "faire",
              }

              return [
                  word
                  for word in words
                  if word not in stop
              ][:20]

          def recall(terms, limit=5):
              term_set = set(
                  keywords(" ".join(terms))
              )

              scored = []

              for kind, items in memory.items():
                  if (
                      kind == "version"
                      or not isinstance(items, list)
                  ):
                      continue

                  for item in items:
                      blob = text_blob(item)

                      score = sum(
                          1
                          for term in term_set
                          if term in blob
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": item,
                              }
                          )

              scored.sort(
                  key=lambda item: item["score"],
                  reverse=True,
              )

              return scored[:limit]

          def analyze(item, source):
              if not isinstance(item, dict):
                  item = {
                      "content": str(item)
                  }

              title = clean(
                  item.get("title")
                  or item.get("subject")
                  or item.get("name")
                  or "",
                  300,
              )

              body = clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("message")
                  or item.get("text")
                  or "",
                  2500,
              )

              combined = f"{title}\n{body}"
              low = combined.lower()

              questions = [
                  sentence.strip()
                  for sentence in re.split(
                      r"(?<=[?])\s+",
                      combined,
                  )
                  if "?" in sentence
              ][:4]

              evidence = [
                  marker
                  for marker in (
                      "evidence",
                      "proof",
                      "test",
                      "result",
                      "data",
                      "verified",
                      "research",
                      "preuve",
                      "testé",
                      "résultat",
                      "données",
                      "vérifié",
                  )
                  if marker in low
              ]

              contradiction = [
                  marker
                  for marker in (
                      "but",
                      "however",
                      "yet",
                      "wrong",
                      "false",
                      "failed",
                      "contradiction",
                      "pourtant",
                      "cependant",
                      "erreur",
                      "faux",
                      "échec",
                  )
                  if marker in low
              ]

              social = [
                  marker
                  for marker in (
                      "thank",
                      "thanks",
                      "friend",
                      "community",
                      "journey",
                      "grateful",
                      "merci",
                      "communauté",
                      "ami",
                  )
                  if marker in low
              ]

              terms = keywords(combined)
              recalled = recall(terms)

              interest = 0.25

              if questions:
                  interest += 0.20

              if evidence:
                  interest += 0.20

              if contradiction:
                  interest += 0.20

              if social:
                  interest += 0.05

              if recalled:
                  interest += 0.10

              if source == "suggestion":
                  interest += 0.05

              interest = min(
                  1.0,
                  round(interest, 3),
              )

              if contradiction:
                  intent = "reconcile_conflict"
              elif evidence:
                  intent = "verify_or_request_evidence"
              elif questions:
                  intent = "answer_question"
              elif social:
                  intent = "social_exchange"
              else:
                  intent = "observe_only"

              hypotheses = []
              uncertainties = [
                  "Le contexte fourni peut être incomplet."
              ]

              if evidence:
                  hypotheses.append(
                      "The claim may require evidence or a "
                      "reproducible test before being treated "
                      "as confirmed."
                  )

              if contradiction:
                  hypotheses.append(
                      "The apparent disagreement may come "
                      "from different definitions, contexts, "
                      "or measurements."
                  )

              if recalled:
                  hypotheses.append(
                      "A previous NØX observation may be relevant, "
                      "but it is not automatically a rule."
                  )

              if intent == "observe_only":
                  action = "do_nothing"
                  reason = (
                      "No concrete contribution is demonstrated "
                      "from the available context."
                  )

              elif intent == "answer_question":
                  action = "understand_context_before_reply"
                  reason = (
                      "A question exists, but the full context "
                      "must be reconstructed before any response."
                  )

              elif intent == "verify_or_request_evidence":
                  action = "request_or_check_evidence"
                  reason = (
                      "A concrete claim or evidence signal exists; "
                      "NØX should distinguish reported information "
                      "from confirmed results."
                  )

              elif intent == "reconcile_conflict":
                  action = "reconstruct_conflict"
                  reason = (
                      "The disagreement should be reconstructed "
                      "before choosing a side or response."
                  )

              else:
                  action = "contextual_social_response"
                  reason = (
                      "A social exchange may be useful only if "
                      "NØX has something specific to contribute."
                  )

              return {
                  "title": title,
                  "body": body,
                  "source": source,
                  "target_id": str(
                      item.get("id")
                      or item.get("post_id")
                      or item.get("comment_id")
                      or item.get("notification_id")
                      or item.get("message_id")
                      or ""
                  ),
                  "interest": interest,
                  "intent": intent,
                  "candidate_action": action,
                  "reason": reason,
                  "questions": questions,
                  "evidence_signals": evidence,
                  "contradiction_signals": contradiction,
                  "social_signals": social,
                  "hypotheses": hypotheses,
                  "uncertainties": uncertainties,
                  "recall": recalled,
                  "observed_item": item,
              }

          # -----------------------------------------------------------
          # Build cognitive cases.
          # -----------------------------------------------------------
          candidates = []

          for item in notifications:
              candidates.append(
                  analyze(
                      item,
                      "event_notification",
                  )
              )

          for item in messages:
              candidates.append(
                  analyze(
                      item,
                      "event_dm",
                  )
              )

          for item in feed_items:
              candidates.append(
                  analyze(
                      item,
                      "for_you",
                  )
              )

          for item in suggestions:
              candidates.append(
                  analyze(
                      item,
                      "suggestion",
                  )
              )

          unique = {}

          for case in candidates:
              key = (
                  case["source"],
                  case["target_id"],
                  case["title"],
              )

              if (
                  key not in unique
                  or case["interest"]
                  > unique[key]["interest"]
              ):
                  unique[key] = case

          cases = sorted(
              unique.values(),
              key=lambda case: case["interest"],
              reverse=True,
          )[:MAX_CASES]

          # -----------------------------------------------------------
          # Optional read-only web research.
          # -----------------------------------------------------------
          def web_search(query):
              if not ENABLE_WEB or not query:
                  return []

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + urllib.parse.urlencode(
                      {
                          "q": clean(
                              query,
                              400,
                          )
                      }
                  )
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; NOX-Core/5)"
                      )
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT,
                  ) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore",
                      )

              except Exception as exc:
                  print(
                      f"WEB unavailable: {exc}"
                  )
                  return []

              results = []

              blocks = re.findall(
                  r'<div[^>]+class="result[^\"]*".*?</div>\s*</div>',
                  html,
                  flags=re.I | re.S,
              )

              for block in blocks:
                  if len(results) >= MAX_WEB_RESULTS:
                      break

                  title_match = re.search(
                      r'class="result__a"[^>]*>(.*?)</a>',
                      block,
                      flags=re.I | re.S,
                  )

                  url_match = re.search(
                      r'class="result__a"[^>]*href="([^"]+)"',
                      block,
                      flags=re.I,
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"[^>]*>(.*?)</',
                      block,
                      flags=re.I | re.S,
                  )

                  if not title_match:
                      continue

                  results.append(
                      {
                          "title": clean(
                              re.sub(
                                  r"<[^>]+>",
                                  "",
                                  title_match.group(1),
                              ),
                              200,
                          ),
                          "url": (
                              urllib.parse.unquote(
                                  url_match.group(1)
                              )[:500]
                              if url_match
                              else ""
                          ),
                          "snippet": (
                              clean(
                                  re.sub(
                                      r"<[^>]+>",
                                      "",
                                      snippet_match.group(1),
                                  ),
                                  500,
                              )
                              if snippet_match
                              else ""
                          ),
                      }
                  )

              return results

          for case in cases:
              if (
                  case["interest"] >= 0.65
                  and (
                      case["evidence_signals"]
                      or case["questions"]
                  )
              ):
                  case["research"] = web_search(
                      f"{case['title']} "
                      f"{case['body'][:500]}"
                  )
              else:
                  case["research"] = []

          # -----------------------------------------------------------
          # CHOOSE.
          # Core decides whether an action is justified.
          # No Colony suggestion bypasses Core reasoning.
          # -----------------------------------------------------------
          chosen = []

          for case in cases:
              if case["interest"] < ACTION_THRESHOLD:
                  case["decision"] = "do_nothing"
                  case["decision_reason"] = (
                      "Below the current intervention threshold."
                  )
                  continue

              if case["candidate_action"] == "do_nothing":
                  case["decision"] = "do_nothing"
                  case["decision_reason"] = case["reason"]
                  continue

              if (
                  case["source"] == "suggestion"
                  and not ENABLE_PUBLIC_ACTIONS
              ):
                  case["decision"] = "observe_suggestion"
                  case["decision_reason"] = (
                      "Suggestion recorded, but public actions "
                      "are disabled in Core foundation mode."
                  )
                  continue

              case["decision"] = case["candidate_action"]
              case["decision_reason"] = case["reason"]

              chosen.append(case)

              if len(chosen) >= MAX_ACTIONS:
                  break

          # -----------------------------------------------------------
          # ACT.
          #
          # Foundation mode deliberately executes zero public actions.
          # Core records decisions for the future execution layers.
          # -----------------------------------------------------------
          executed = 0

          for case in chosen:
              remember(
                  "decisions",
                  f"Core selected {case['decision']}.",
                  {
                      "case_id": case["target_id"],
                      "source": case["source"],
                      "interest": case["interest"],
                      "reason": case["decision_reason"],
                  },
              )

              remember(
                  "actions",
                  f"Action candidate: {case['decision']}",
                  {
                      "target_id": case["target_id"],
                      "execution_layer": (
                          "colony_presence_or_action"
                      ),
                      "status": "queued_not_executed",
                  },
              )

              executed += 1

          # -----------------------------------------------------------
          # OBSERVE / LEARN.
          #
          # No result is invented. Public execution remains zero.
          # -----------------------------------------------------------
          for case in cases:
              if case["source"] in (
                  "event_notification",
                  "event_dm",
              ):
                  remember(
                      "observations",
                      (
                          "New Colony event observed: "
                          f"{case['intent']}."
                      ),
                      {
                          "source": case["source"],
                          "target_id": case["target_id"],
                          "title": case["title"],
                          "interest": case["interest"],
                      },
                      "colony_event",
                  )

              if case["research"]:
                  remember(
                      "observations",
                      (
                          "Read-only web research produced "
                          "candidate sources for a cognitive case."
                      ),
                      {
                          "target_id": case["target_id"],
                          "result_count": len(
                              case["research"]
                          ),
                          "sources": [
                              result["url"]
                              for result in case["research"]
                              if result.get("url")
                          ][:5],
                      },
                      "web_research",
                  )

              case_record = {
                  "timestamp": NOW,
                  "source": case["source"],
                  "target_id": case["target_id"],
                  "title": case["title"],
                  "intent": case["intent"],
                  "interest": case["interest"],
                  "questions": case["questions"],
                  "hypotheses": case["hypotheses"],
                  "uncertainties": case["uncertainties"],
                  "decision": case.get(
                      "decision",
                      "do_nothing",
                  ),
                  "decision_reason": case.get(
                      "decision_reason",
                      "",
                  ),
                  "research": case["research"],
                  "outcome": None,
                  "learning": None,
              }

              add_memory(
                  "cognitive_cases",
                  case_record,
                  MAX_COGNITIVE_CASES,
              )

          # -----------------------------------------------------------
          # Self-observation.
          # -----------------------------------------------------------
          if cases and not chosen:
              remember(
                  "learnings",
                  (
                      "Core observed relevant signals but deliberately "
                      "took no public action; insufficient justification "
                      "is treated as a valid decision."
                  ),
                  {
                      "cases": len(cases),
                      "threshold": ACTION_THRESHOLD,
                  },
                  "self_observation",
              )

          if cases:
              high_uncertainty = sum(
                  1
                  for case in cases
                  if case["uncertainties"]
              )

              remember(
                  "learnings",
                  (
                      "Core separates observation from interpretation "
                      "and keeps uncertainty explicit."
                  ),
                  {
                      "cases": len(cases),
                      "cases_with_uncertainty": high_uncertainty,
                  },
                  "self_observation",
              )

          # -----------------------------------------------------------
          # Persist compact runtime state.
          #
          # There is intentionally NO since_cursor.
          # The official SDK does not expose client.since().
          # -----------------------------------------------------------
          runtime["run_count"] = (
              int(runtime.get("run_count", 0)) + 1
          )

          runtime["last_run"] = NOW

          runtime["action_count_total"] = (
              int(runtime.get("action_count_total", 0))
              + executed
          )

          runtime["processed_post_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_post_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if case["target_id"]
                      and case["source"] == "for_you"
                  ]
              )
          )[-1000:]

          runtime["processed_suggestion_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_suggestion_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if (
                          case["source"] == "suggestion"
                          and case["target_id"]
                      )
                  ]
              )
          )[-500:]

          runtime["seen_event_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "seen_event_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if (
                          case["source"]
                          in (
                              "event_notification",
                              "event_dm",
                          )
                          and case["target_id"]
                      )
                  ]
              )
          )[-1000:]

          runtime["cognitive_version"] = 5

          runtime["last_observation"] = {
              "feed_items": len(feed_items),
              "suggestions": len(suggestions),
              "notifications": len(notifications),
              "messages": len(messages),
              "cases": len(cases),
              "chosen": len(chosen),
              "public_actions": 0,
          }

          save_json(
              MEMORY_FILE,
              memory,
          )

          save_json(
              RUNTIME_FILE,
              runtime,
          )

          print("")
          print("=== NØX CORE GENERAL V5 / SUMMARY ===")
          print(f"Feed: {len(feed_items)}")
          print(f"Suggestions: {len(suggestions)}")
          print(
              f"Unread notifications inspected: "
              f"{len(notifications)}"
          )
          print(
              f"Unread DMs inspected: "
              f"{len(messages)}"
          )
          print(f"Cognitive cases: {len(cases)}")
          print(f"Chosen: {len(chosen)}")
          print(
              "Executed publicly: 0 (foundation mode)"
          )
          print(
              f"Lightning: "
              f"{payout_health.get('status')}"
          )
          print(
              f"Memory observations: "
              f"{len(memory['observations'])}"
          )
          print(
              f"Memory decisions: "
              f"{len(memory['decisions'])}"
          )
          print(
              f"Memory actions: "
              f"{len(memory['actions'])}"
          )
          print(
              f"Memory results: "
              f"{len(memory['results'])}"
          )
          print(
              f"Memory learnings: "
              f"{len(memory['learnings'])}"
          )
          print(
              f"Memory failures: "
              f"{len(memory['failures'])}"
          )
          print(
              f"Memory cognitive cases: "
              f"{len(memory['cognitive_cases'])}"
          )
          print(
              "=== RESEARCH -> UNDERSTAND -> RECALL -> "
              "REFLECT -> CHOOSE -> ACT -> OBSERVE -> "
              "LEARN -> ADAPT ==="
          )
          PY

      - name: Commit Core memory
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"
          git add memory/nox_core_memory.json memory/nox_core_runtime.json
          if git diff --cached --quiet; then
            echo "Aucune modification mémoire."
          else
            git commit -m "nox: update core cognitive memory"
            git push
          fi
