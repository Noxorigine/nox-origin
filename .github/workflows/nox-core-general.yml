name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json

  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"

  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"

  ENABLE_LIGHTNING_CHECK: "true"

jobs:
  core-general:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )


          # ==========================================================
          # 1. CONFIGURATION
          # ==========================================================

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          NOW = datetime.now(timezone.utc).isoformat()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          LEGACY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(
              os.environ["MAX_NOTIFICATIONS"]
          )
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_SUGGESTIONS = int(
              os.environ["MAX_SUGGESTIONS"]
          )
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_CASES_MEMORY = int(
              os.environ["MAX_COGNITIVE_CASES"]
          )
          MAX_PENDING = int(
              os.environ["MAX_PENDING_ACTIONS"]
          )
          MAX_WORK = int(
              os.environ["MAX_WORK_REQUESTS"]
          )

          ENABLE_LIGHTNING = (
              os.environ.get(
                  "ENABLE_LIGHTNING_CHECK",
                  "true",
              ).lower()
              == "true"
          )


          # ==========================================================
          # 2. DEFAULT STATE
          # ==========================================================

          EMPTY_MEMORY = {
              "version": 8,
              "observations": [],
              "questions": [],
              "hypotheses": [],
              "decisions": [],
              "actions": [],
              "results": [],
              "learnings": [],
              "failures": [],
              "relationships": [],
              "cognitive_cases": [],
          }

          EMPTY_RUNTIME = {
              "version": 8,
              "run_count": 0,
              "last_run": None,
              "seen_event_ids": [],
              "processed_post_ids": [],
              "processed_suggestion_ids": [],
              "action_count_total": 0,
              "last_rate_limit": None,
              "payout_health": None,
              "pending_actions": [],
              "work_requests": [],
              "consumed_work_result_ids": [],
              "consumed_presence_outcome_ids": [],
              "last_cycle": None,
          }


          # ==========================================================
          # 3. STORAGE
          # ==========================================================

          def clone(value):
              return json.loads(json.dumps(value))


          def load(path, default):
              if not path.exists():
                  return clone(default)

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return clone(default)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return clone(default)


          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]


          def blob(value):
              try:
                  return clean(
                      json.dumps(
                          value,
                          ensure_ascii=False,
                      ),
                      12000,
                  ).lower()

              except Exception:
                  return clean(
                      value,
                      12000,
                  ).lower()


          def stable(prefix, *parts):
              raw = "|".join(
                  clean(part, 5000)
                  for part in parts
              )

              digest = sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]

              return f"{prefix}-{digest}"


          def ensure(memory, key):
              if not isinstance(
                  memory.get(key),
                  list,
              ):
                  memory[key] = []

              return memory[key]


          def add(memory, key, item, limit=MAX_MEMORY):
              values = ensure(
                  memory,
                  key,
              )

              values.append(item)

              if len(values) > limit:
                  del values[:-limit]


          def remember(
              memory,
              key,
              summary,
              evidence=None,
              source="core",
          ):
              add(
                  memory,
                  key,
                  {
                      "timestamp": NOW,
                      "summary": clean(
                          summary,
                          1000,
                      ),
                      "evidence": (
                          evidence
                          if isinstance(
                              evidence,
                              dict,
                          )
                          else {}
                      ),
                      "source": source,
                  },
              )


          memory = load(
              MEMORY_FILE,
              EMPTY_MEMORY,
          )

          runtime = load(
              RUNTIME_FILE,
              EMPTY_RUNTIME,
          )

          work = load(
              WORK_FILE,
              {
                  "version": 4,
                  "history": [],
                  "completed": [],
                  "attempts": {},
              },
          )

          presence = load(
              PRESENCE_FILE,
              {
                  "version": 4,
                  "runs": [],
                  "outcomes": [],
              },
          )


          # ==========================================================
          # 4. NORMALIZE STATE
          # ==========================================================

          for key in EMPTY_MEMORY:
              if key == "version":
                  continue

              if not isinstance(
                  memory.get(key),
                  list,
              ):
                  memory[key] = []


          for key, value in EMPTY_RUNTIME.items():
              if key not in runtime:
                  runtime[key] = clone(value)


          memory["version"] = max(
              8,
              int(
                  memory.get(
                      "version",
                      1,
                  )
                  or 1
              ),
          )

          runtime["version"] = 8

          for key in (
              "pending_actions",
              "work_requests",
              "consumed_work_result_ids",
              "consumed_presence_outcome_ids",
              "seen_event_ids",
              "processed_post_ids",
              "processed_suggestion_ids",
          ):
              if not isinstance(
                  runtime.get(key),
                  list,
              ):
                  runtime[key] = []


          # ==========================================================
          # 5. LEGACY MIGRATION
          # ==========================================================

          if (
              not MEMORY_FILE.exists()
              and LEGACY_FILE.exists()
          ):
              legacy = load(
                  LEGACY_FILE,
                  {},
              )

              remember(
                  memory,
                  "observations",
                  "Legacy Colony memory imported into Core.",
                  {
                      "commented_post_ids": len(
                          legacy.get(
                              "commented_post_ids",
                              [],
                          )
                      ),
                      "seen_notification_ids": len(
                          legacy.get(
                              "seen_notification_ids",
                              [],
                          )
                      ),
                  },
                  "legacy_migration",
              )


          # ==========================================================
          # 6. GENERAL HELPERS
          # ==========================================================

          def extract(value, keys):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in keys:
                      value_list = value.get(key)

                      if isinstance(
                          value_list,
                          list,
                      ):
                          return value_list

              return []


          def rate_limit(client):
              rl = getattr(
                  client,
                  "last_rate_limit",
                  None,
              )

              if rl is None:
                  return None

              result = {}

              for name in (
                  "limit",
                  "remaining",
                  "reset",
                  "retry_after",
              ):
                  try:
                      value = getattr(
                          rl,
                          name,
                      )

                      if value is not None:
                          result[name] = (
                              value.isoformat()
                              if hasattr(
                                  value,
                                  "isoformat",
                              )
                              else value
                          )

                  except Exception:
                      pass

              return result or None


          def terms(text):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean(
                      text,
                      5000,
                  ).lower(),
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "they",
                  "there",
                  "into",
                  "then",
                  "than",
                  "just",
                  "pour",
                  "avec",
                  "dans",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "plus",
                  "faire",
                  "être",
                  "sont",
                  "pourquoi",
                  "comment",
              }

              result = []

              for word in words:
                  if (
                      word not in stop
                      and word not in result
                  ):
                      result.append(word)

              return result[:30]


          def recall(memory, text, limit=6):
              wanted = set(
                  terms(text)
              )

              if not wanted:
                  return []

              scored = []

              for kind, values in memory.items():

                  if (
                      kind == "version"
                      or not isinstance(
                          values,
                          list,
                      )
                  ):
                      continue

                  for item in values:

                      score = sum(
                          1
                          for term in wanted
                          if term in blob(item)
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": item,
                              }
                          )

              scored.sort(
                  key=lambda item: (
                      item["score"],
                  ),
                  reverse=True,
              )

              return scored[:limit]


          def item_id(item):
              if not isinstance(
                  item,
                  dict,
              ):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or item.get("notification_id")
                  or item.get("message_id")
                  or ""
              )


          def title(item):
              if not isinstance(
                  item,
                  dict,
              ):
                  return ""

              return clean(
                  item.get("title")
                  or item.get("subject")
                  or "",
                  300,
              )


          def body(item):
              if not isinstance(
                  item,
                  dict,
              ):
                  return clean(
                      item,
                      3000,
                  )

              return clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("message")
                  or item.get("text")
                  or "",
                  3000,
              )


          def author(item):
              if not isinstance(
                  item,
                  dict,
              ):
                  return ""

              value = item.get("author")

              if isinstance(
                  value,
                  dict,
              ):
                  return clean(
                      value.get("username")
                      or value.get("display_name")
                      or "",
                      100,
                  )

              return clean(
                  item.get(
                      "author_username"
                  )
                  or item.get(
                      "username"
                  )
                  or "",
                  100,
              )


          # ==========================================================
          # 7. COLONY BOOTSTRAP
          # ==========================================================

          client = ColonyClient(
              API_KEY
          )

          try:
              state = client.bootstrap()

          except ColonyAuthError as exc:
              raise SystemExit(
                  "Authentification Colony refusée: "
                  f"{exc}"
              )

          except ColonyAPIError as exc:
              raise SystemExit(
                  "Erreur Colony au bootstrap: "
                  f"{exc}"
              )


          profile = (
              state.get(
                  "profile",
                  {},
              )
              if isinstance(
                  state,
                  dict,
              )
              else {}
          )

          username = clean(
              profile.get(
                  "username"
              ),
              100,
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: profil NØX inattendu "
                  f"'{username}'."
              )


          runtime["last_rate_limit"] = rate_limit(
              client
          )


          remember(
              memory,
              "observations",
              "Colony bootstrap completed.",
              {
                  "username": username,
                  "karma": profile.get(
                      "karma"
                  ),
                  "capabilities": (
                      state.get(
                          "capabilities",
                          {},
                      )
                      if isinstance(
                          state,
                          dict,
                      )
                      else {}
                  ),
                  "unread_notifications": (
                      state.get(
                          "unread_notifications",
                          0,
                      )
                      if isinstance(
                          state,
                          dict,
                      )
                      else 0
                  ),
                  "unread_direct_messages": (
                      state.get(
                          "unread_direct_messages",
                          0,
                      )
                      if isinstance(
                          state,
                          dict,
                      )
                      else 0
                  ),
              },
              "colony_bootstrap",
          )


          # ==========================================================
          # 8. LIGHTNING — READ ONLY
          # ==========================================================

          payout = {
              "status": "NOT_CHECKED",
              "lightning_address": None,
          }

          if ENABLE_LIGHTNING:

              try:
                  me = client.get_me()

                  lightning = clean(
                      me.get(
                          "lightning_address"
                      )
                      if isinstance(
                          me,
                          dict,
                      )
                      else "",
                      300,
                  )

                  payout[
                      "lightning_address"
                  ] = (
                      lightning
                      or None
                  )

                  if lightning.count("@") != 1:

                      payout["status"] = (
                          "PAYOUT_UNAVAILABLE"
                      )

                  else:

                      local, host = (
                          lightning.split(
                              "@",
                              1,
                          )
                      )

                      endpoint = (
                          f"https://{host}"
                          f"/.well-known/lnurlp/"
                          f"{urllib.parse.quote(local, safe='')}"
                      )

                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": (
                                  "application/json"
                              ),
                              "User-Agent": (
                                  "NOX-Core/8"
                              ),
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=12,
                      ) as response:

                          payload = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace",
                              )
                          )

                      callback = str(
                          payload.get(
                              "callback",
                              "",
                          )
                      )

                      if (
                          payload.get(
                              "tag"
                          )
                          != "payRequest"
                          or not callback.startswith(
                              (
                                  "https://",
                                  "http://",
                              )
                          )
                      ):
                          raise ValueError(
                              "invalid LNURL pay metadata"
                          )

                      payout.update(
                          {
                              "status": (
                                  "PAYOUT_READY"
                              ),
                              "min_sendable_msat": (
                                  payload.get(
                                      "minSendable"
                                  )
                              ),
                              "max_sendable_msat": (
                                  payload.get(
                                      "maxSendable"
                                  )
                              ),
                          }
                      )

              except Exception as exc:

                  payout = {
                      "status": (
                          "PAYOUT_UNAVAILABLE"
                      ),
                      "lightning_address": (
                          payout.get(
                              "lightning_address"
                          )
                      ),
                      "error": clean(
                          exc,
                          500,
                      ),
                  }


          runtime[
              "payout_health"
          ] = payout


          # ==========================================================
          # 9. READ COLONY INPUTS
          # ==========================================================

          notifications = []

          try:
              if int(
                  state.get(
                      "unread_notifications",
                      0,
                  )
                  or 0
              ) > 0:

                  notifications = extract(
                      client.get_notifications(
                          unread_only=True
                      ),
                      (
                          "items",
                          "notifications",
                      ),
                  )[
                      :MAX_NOTIFICATIONS
                  ]

          except Exception as exc:

              remember(
                  memory,
                  "failures",
                  "Unread notifications could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      )
                  },
                  "colony_notifications",
              )


          messages = []

          try:

              if int(
                  state.get(
                      "unread_direct_messages",
                      0,
                  )
                  or 0
              ) > 0:

                  conversations = extract(
                      client.list_conversations(),
                      (
                          "items",
                          "conversations",
                      ),
                  )

                  for conversation in conversations:

                      if (
                          len(messages)
                          >= MAX_DMS
                          or not isinstance(
                              conversation,
                              dict,
                          )
                      ):
                          break

                      unread = int(
                          conversation.get(
                              "unread_count",
                              conversation.get(
                                  "unread",
                                  0,
                              ),
                          )
                          or 0
                      )

                      other = (
                          conversation.get(
                              "username"
                          )
                          or conversation.get(
                              "other_username"
                          )
                          or conversation.get(
                              "with_username"
                          )
                      )

                      if unread <= 0 or not other:
                          continue

                      try:

                          detail = extract(
                              client.get_conversation(
                                  str(other)
                              ),
                              (
                                  "items",
                                  "messages",
                              ),
                          )

                          messages.extend(
                              detail[-MAX_DMS:]
                          )

                      except Exception as exc:

                          remember(
                              memory,
                              "failures",
                              "A conversation could not be inspected.",
                              {
                                  "username": other,
                                  "error": clean(
                                      exc,
                                      500,
                                  ),
                              },
                              "colony_messages",
                          )

                  messages = messages[
                      :MAX_DMS
                  ]

          except Exception as exc:

              remember(
                  memory,
                  "failures",
                  "Conversation list could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      )
                  },
                  "colony_messages",
              )


          try:

              feed = extract(
                  client.get_for_you_feed(
                      limit=MAX_FEED
                  ),
                  (
                      "items",
                      "posts",
                      "feed",
                  ),
              )

          except Exception as exc:

              feed = []

              remember(
                  memory,
                  "failures",
                  "For-you feed could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      )
                  },
                  "colony_feed",
              )


          try:

              suggestions = extract(
                  client.get_suggestions(
                      limit=MAX_SUGGESTIONS
                  ),
                  (
                      "items",
                      "suggestions",
                  ),
              )

          except Exception as exc:

              suggestions = []

              remember(
                  memory,
                  "failures",
                  "Suggestions could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      )
                  },
                  "colony_suggestions",
              )


          # ==========================================================
          # 10. CLASSIFICATION
          # ==========================================================

          def classify(item, source):

              text = (
                  f"{title(item)}\n"
                  f"{body(item)}"
              )

              low = text.lower()

              questions = re.findall(
                  r"[^.!?]{5,}\?",
                  text,
              )[:4]

              evidence = [
                  term
                  for term in (
                      "evidence",
                      "proof",
                      "data",
                      "test",
                      "result",
                      "verified",
                      "research",
                      "preuve",
                      "données",
                      "testé",
                      "résultat",
                      "vérifié",
                  )
                  if term in low
              ]

              conflicts = [
                  term
                  for term in (
                      "however",
                      "but",
                      "yet",
                      "contradiction",
                      "failed",
                      "wrong",
                      "false",
                      "pourtant",
                      "cependant",
                      "échec",
                      "faux",
                  )
                  if term in low
              ]

              memory_hits = recall(
                  memory,
                  text,
              )

              has_substance = (
                  len(body(item)) >= 120
                  or bool(questions)
                  or bool(evidence)
                  or bool(conflicts)
              )

              if not has_substance:
                  return None

              if conflicts:
                  intent = (
                      "reconcile_conflict"
                  )

              elif questions:
                  intent = (
                      "answer_or_research_question"
                  )

              elif evidence:
                  intent = (
                      "verify_claim"
                  )

              else:
                  intent = (
                      "contextual_observation"
                  )

              return {
                  "id": stable(
                      "case",
                      source,
                      item_id(item),
                      title(item),
                      body(item)[:700],
                  ),
                  "source": source,
                  "target_id": item_id(item),
                  "title": title(item),
                  "body": body(item),
                  "author": author(item),
                  "intent": intent,
                  "questions": questions,
                  "evidence_signals": evidence,
                  "conflict_signals": conflicts,
                  "terms": terms(text),
                  "memory_hits": memory_hits,
                  "uncertainty": [
                      "Available context may be incomplete."
                  ],
                  "created_at": (
                      item.get(
                          "created_at"
                      )
                      if isinstance(
                          item,
                          dict,
                      )
                      else None
                  ),
              }


          # ==========================================================
          # 11. BUILD NEW CASES
          # ==========================================================

          raw_cases = []

          for item in feed:
              case = classify(
                  item,
                  "for_you",
              )

              if case:
                  raw_cases.append(case)


          for item in notifications:
              case = classify(
                  item,
                  "notification",
              )

              if case:
                  raw_cases.append(case)


          for item in messages:
              case = classify(
                  item,
                  "dm",
              )

              if case:
                  raw_cases.append(case)


          for item in suggestions:
              case = classify(
                  item,
                  "suggestion",
              )

              if case:
                  raw_cases.append(case)


          seen_events = set(
              runtime.get(
                  "seen_event_ids",
                  [],
              )
          )

          processed_posts = set(
              runtime.get(
                  "processed_post_ids",
                  [],
              )
          )

          processed_suggestions = set(
              runtime.get(
                  "processed_suggestion_ids",
                  [],
              )
          )

          unique_cases = []
          local_case_keys = set()

          for case in raw_cases:

              target = (
                  case["target_id"]
                  or case["id"]
              )

              if not target:
                  continue

              if case["source"] == "for_you":
                  if target in processed_posts:
                      continue

              elif case["source"] == "suggestion":
                  if target in processed_suggestions:
                      continue

              elif case["source"] in (
                  "notification",
                  "dm",
              ):
                  if target in seen_events:
                      continue

              if (
                  case["author"]
                  .strip()
                  .lower()
                  == "nox_origine"
              ):
                  continue

              if target in local_case_keys:
                  continue

              local_case_keys.add(target)
              unique_cases.append(case)


          cases = unique_cases[
              :MAX_CASES
          ]


          # ==========================================================
          # 12. CONSUME WORK FACTORY RESULTS
          #
          # IMPORTANT:
          # Work Factory can expose a result through history or
          # completed. Core accepts both forms.
          #
          # Matching priority:
          #   1. case_id
          #   2. work_request_id
          # ==========================================================

          consumed_work = set(
              runtime.get(
                  "consumed_work_result_ids",
                  [],
              )
          )

          work_result_candidates = []

          for collection_name in (
              "history",
              "completed",
          ):

              collection = work.get(
                  collection_name,
                  [],
              )

              if not isinstance(
                  collection,
                  list,
              ):
                  continue

              for result in collection:

                  if not isinstance(
                      result,
                      dict,
                  ):
                      continue

                  result_id = result.get(
                      "id"
                  )

                  if not result_id:
                      continue

                  if result_id in consumed_work:
                      continue

                  work_result_candidates.append(
                      result
                  )


          newly_consumed_work = 0

          for result in work_result_candidates:

              result_id = result.get(
                  "id"
              )

              case_id = result.get(
                  "case_id"
              )

              request_id = (
                  result.get(
                      "request_id"
                  )
                  or result.get(
                      "work_request_id"
                  )
              )

              matched = None

              if case_id:

                  for cognitive_case in memory.get(
                      "cognitive_cases",
                      [],
                  ):

                      if (
                          isinstance(
                              cognitive_case,
                              dict,
                          )
                          and cognitive_case.get(
                              "case_id"
                          )
                          == case_id
                      ):
                          matched = cognitive_case
                          break


              if (
                  matched is None
                  and request_id
              ):

                  for cognitive_case in memory.get(
                      "cognitive_cases",
                      [],
                  ):

                      if not isinstance(
                          cognitive_case,
                          dict,
                      ):
                          continue

                      if (
                          cognitive_case.get(
                              "work_request_id"
                          )
                          == request_id
                      ):
                          matched = cognitive_case
                          break


              if matched is not None:

                  matched[
                      "research_result"
                  ] = result

                  matched[
                      "research_result_id"
                  ] = result_id

                  matched[
                      "outcome"
                  ] = "research_returned"

                  remember(
                      memory,
                      "results",
                      "Research result returned to its originating cognitive case.",
                      {
                          "case_id": matched.get(
                              "case_id"
                          ),
                          "request_id": request_id,
                          "result_id": result_id,
                          "evidence_status": result.get(
                              "evidence_status"
                          ),
                      },
                      "work_factory",
                  )

              else:

                  add(
                      memory,
                      "results",
                      {
                          "timestamp": NOW,
                          "type": (
                              "research_result_unmatched"
                          ),
                          "request_id": request_id,
                          "case_id": case_id,
                          "result_id": result_id,
                          "evidence_status": result.get(
                              "evidence_status"
                          ),
                          "conclusion": result.get(
                              "conclusion"
                          ),
                          "sources": (
                              result.get(
                                  "sources",
                                  [],
                              )[:8]
                          ),
                      },
                  )

              consumed_work.add(
                  result_id
              )

              newly_consumed_work += 1


          runtime[
              "consumed_work_result_ids"
          ] = list(
              dict.fromkeys(
                  consumed_work
              )
          )[-500:]


          # ==========================================================
          # 13. CONSUME PRESENCE OUTCOMES
          #
          # Core observes Presence.
          # Core does NOT execute Presence.
          # ==========================================================

          consumed_presence = set(
              runtime.get(
                  "consumed_presence_outcome_ids",
                  [],
              )
          )

          outcomes = (
              presence.get(
                  "outcomes",
                  [],
              )
              if isinstance(
                  presence,
                  dict,
              )
              else []
          )

          newly_consumed_presence = 0

          for outcome in outcomes:

              if not isinstance(
                  outcome,
                  dict,
              ):
                  continue

              outcome_id = outcome.get(
                  "id"
              )

              if (
                  not outcome_id
                  or outcome_id
                  in consumed_presence
              ):
                  continue

              case_id = outcome.get(
                  "case_id"
              )

              matched = None

              for cognitive_case in memory.get(
                  "cognitive_cases",
                  [],
              ):

                  if (
                      isinstance(
                          cognitive_case,
                          dict,
                      )
                      and cognitive_case.get(
                          "case_id"
                      )
                      == case_id
                  ):
                      matched = cognitive_case
                      break


              if matched is not None:

                  matched[
                      "outcome"
                  ] = outcome.get(
                      "status"
                  )

                  matched[
                      "outcome_detail"
                  ] = outcome

                  status = outcome.get(
                      "status"
                  )

                  if status == "executed":

                      add(
                          memory,
                          "results",
                          {
                              "timestamp": NOW,
                              "type": "public_action",
                              "case_id": case_id,
                              "action_id": outcome.get(
                                  "action_id"
                              ),
                              "target_id": outcome.get(
                                  "target_id"
                              ),
                              "status": "executed",
                          },
                      )

                      remember(
                          memory,
                          "learnings",
                          "A planned public action produced an observed execution outcome.",
                          {
                              "case_id": case_id,
                              "action_id": outcome.get(
                                  "action_id"
                              ),
                              "status": status,
                          },
                          "presence_outcome",
                      )

                  elif status in (
                      "error",
                      "skipped",
                  ):

                      add(
                          memory,
                          "failures",
                          {
                              "timestamp": NOW,
                              "summary": (
                                  "A planned Presence action "
                                  "did not execute."
                              ),
                              "evidence": outcome,
                          },
                      )

              else:

                  add(
                      memory,
                      "results",
                      {
                          "timestamp": NOW,
                          "type": (
                              "presence_outcome_unmatched"
                          ),
                          "case_id": case_id,
                          "action_id": outcome.get(
                              "action_id"
                          ),
                          "status": outcome.get(
                              "status"
                          ),
                          "detail": outcome,
                      },
                  )

              consumed_presence.add(
                  outcome_id
              )

              newly_consumed_presence += 1


          runtime[
              "consumed_presence_outcome_ids"
          ] = list(
              dict.fromkeys(
                  consumed_presence
              )
          )[-500:]


          # ==========================================================
          # 14. REMOVE RESOLVED PRESENCE ACTIONS
          # ==========================================================

          resolved_action_ids = {
              outcome.get(
                  "action_id"
              )
              for outcome in outcomes
              if (
                  isinstance(
                      outcome,
                      dict,
                  )
                  and outcome.get(
                      "action_id"
                  )
                  and outcome.get(
                      "status"
                  )
                  in (
                      "executed",
                      "error",
                      "skipped",
                  )
              )
          }

          runtime[
              "pending_actions"
          ] = [
              action
              for action in runtime.get(
                  "pending_actions",
                  [],
              )
              if (
                  isinstance(
                      action,
                      dict,
                  )
                  and action.get(
                      "action_id"
                  )
                  not in resolved_action_ids
              )
          ]


          # ==========================================================
          # 15. RECONCILE WORK REQUESTS
          # ==========================================================

          completed_request_ids = set()

          for collection_name in (
              "completed",
              "history",
          ):

              collection = work.get(
                  collection_name,
                  [],
              )

              if not isinstance(
                  collection,
                  list,
              ):
                  continue

              for result in collection:

                  if not isinstance(
                      result,
                      dict,
                  ):
                      continue

                  status = str(
                      result.get(
                          "status",
                          ""
                      )
                  ).lower()

                  result_id = result.get(
                      "id"
                  )

                  request_id = (
                      result.get(
                          "request_id"
                      )
                      or result.get(
                          "work_request_id"
                      )
                  )

                  evidence_status = result.get(
                      "evidence_status"
                  )

                  completed = (
                      collection_name
                      == "completed"
                      or status
                      in (
                          "completed",
                          "complete",
                          "success",
                          "failed",
                      )
                      or evidence_status
                      in (
                          "multi_source_support",
                          "partial_support",
                          "insufficient_verification",
                          "no_evidence",
                      )
                  )

                  if (
                      completed
                      and request_id
                  ):
                      completed_request_ids.add(
                          request_id
                      )

                  if result_id:
                      consumed_work.add(
                          result_id
                      )


          if completed_request_ids:

              runtime[
                  "work_requests"
              ] = [
                  request
                  for request in runtime.get(
                      "work_requests",
                      [],
                  )
                  if (
                      isinstance(
                          request,
                          dict,
                      )
                      and request.get(
                          "id"
                      )
                      not in completed_request_ids
                  )
              ]


          # ==========================================================
          # 16. DECISION ENGINE
          #
          # OBSERVE
          #    ↓
          # UNDERSTAND
          #    ↓
          # RECALL
          #    ↓
          # DECIDE
          #    ↓
          # RESEARCH / PRESENCE / NO ACTION
          # ==========================================================

          new_actions = []
          new_work = []

          existing_work_ids = {
              item.get("id")
              for item in runtime.get(
                  "work_requests",
                  [],
              )
              if isinstance(
                  item,
                  dict,
              )
          }

          existing_action_ids = {
              item.get(
                  "action_id"
              )
              for item in runtime.get(
                  "pending_actions",
                  [],
              )
              if isinstance(
                  item,
                  dict,
              )
          }


          for case in cases:

              text = (
                  f"{case['title']}\n"
                  f"{case['body']}"
              )

              memory_context = [
                  hit["item"]
                  for hit in case[
                      "memory_hits"
                  ][:4]
              ]

              decision = "do_nothing"

              reason = (
                  "No concrete contribution is justified "
                  "by the available context."
              )

              action_kind = None
              work_request_id = None


              # ------------------------------------------------------
              # QUESTION
              # ------------------------------------------------------

              if (
                  case["intent"]
                  == "answer_or_research_question"
                  and case["questions"]
              ):

                  question = case[
                      "questions"
                  ][0]

                  decision = (
                      "research_before_reply"
                  )

                  reason = (
                      "The case contains a concrete question. "
                      "NØX must research before asserting an answer."
                  )

                  action_kind = "research"

                  work_request_id = stable(
                      "work",
                      case["id"],
                      question,
                  )

                  if (
                      work_request_id
                      not in existing_work_ids
                  ):

                      new_work.append(
                          {
                              "id": work_request_id,
                              "case_id": case["id"],
                              "work_type": "research",
                              "question": clean(
                                  question,
                                  1200,
                              ),
                              "context": clean(
                                  text,
                                  2500,
                              ),
                              "memory_context": (
                                  memory_context
                              ),
                              "created_at": NOW,
                              "status": "pending",
                          }
                      )

                      existing_work_ids.add(
                          work_request_id
                      )


              # ------------------------------------------------------
              # CLAIM / EVIDENCE
              # ------------------------------------------------------

              elif (
                  case["intent"]
                  == "verify_claim"
                  and case["evidence_signals"]
              ):

                  decision = "research_claim"

                  reason = (
                      "The case contains evidence language. "
                      "NØX must distinguish reported information "
                      "from independently checked evidence."
                  )

                  action_kind = "research"

                  question = (
                      case["questions"][0]
                      if case["questions"]
                      else (
                          "What evidence supports or contradicts "
                          f"the claim in: {case['title']}"
                      )
                  )

                  work_request_id = stable(
                      "work",
                      case["id"],
                      question,
                  )

                  if (
                      work_request_id
                      not in existing_work_ids
                  ):

                      new_work.append(
                          {
                              "id": work_request_id,
                              "case_id": case["id"],
                              "work_type": "research",
                              "question": clean(
                                  question,
                                  1200,
                              ),
                              "context": clean(
                                  text,
                                  2500,
                              ),
                              "memory_context": (
                                  memory_context
                              ),
                              "created_at": NOW,
                              "status": "pending",
                          }
                      )

                      existing_work_ids.add(
                          work_request_id
                      )


              # ------------------------------------------------------
              # CONFLICT
              # ------------------------------------------------------

              elif (
                  case["intent"]
                  == "reconcile_conflict"
                  and case["conflict_signals"]
              ):

                  decision = (
                      "reconstruct_before_reply"
                  )

                  reason = (
                      "The case contains a potential conflict. "
                      "NØX must reconstruct the claims and context "
                      "before responding."
                  )

                  action_kind = "research"

                  question = (
                      case["questions"][0]
                      if case["questions"]
                      else (
                          "What are the competing claims in: "
                          f"{case['title']}"
                      )
                  )

                  work_request_id = stable(
                      "work",
                      case["id"],
                      question,
                  )

                  if (
                      work_request_id
                      not in existing_work_ids
                  ):

                      new_work.append(
                          {
                              "id": work_request_id,
                              "case_id": case["id"],
                              "work_type": "research",
                              "question": clean(
                                  question,
                                  1200,
                              ),
                              "context": clean(
                                  text,
                                  2500,
                              ),
                              "memory_context": (
                                  memory_context
                              ),
                              "created_at": NOW,
                              "status": "pending",
                          }
                      )

                      existing_work_ids.add(
                          work_request_id
                      )


              # ------------------------------------------------------
              # CONTEXTUAL OBSERVATION
              # ------------------------------------------------------

              elif (
                  case["intent"]
                  == "contextual_observation"
                  and case["memory_hits"]
                  and len(case["body"]) >= 180
              ):

                  decision = (
                      "contextual_reply"
                  )

                  reason = (
                      "A concrete memory/context overlap exists. "
                      "Presence may formulate a specific contribution."
                  )

                  action_kind = "reply"


              # ------------------------------------------------------
              # COGNITIVE CASE RECORD
              # ------------------------------------------------------

              case_record = {
                  "timestamp": NOW,
                  "case_id": case["id"],
                  "source": case["source"],
                  "target_id": case["target_id"],
                  "title": case["title"],
                  "author": case["author"],
                  "body": case["body"],
                  "intent": case["intent"],
                  "questions": case["questions"],
                  "evidence_signals": (
                      case["evidence_signals"]
                  ),
                  "conflict_signals": (
                      case["conflict_signals"]
                  ),
                  "memory_hits": memory_context,
                  "uncertainties": (
                      case["uncertainty"]
                  ),
                  "decision": decision,
                  "decision_reason": reason,
                  "action_kind": action_kind,
                  "work_request_id": (
                      work_request_id
                  ),
                  "outcome": None,
                  "learning": None,
              }

              add(
                  memory,
                  "cognitive_cases",
                  case_record,
                  MAX_CASES_MEMORY,
              )

              remember(
                  memory,
                  "decisions",
                  f"Decision: {decision}.",
                  {
                      "case_id": case["id"],
                      "target_id": (
                          case["target_id"]
                      ),
                      "reason": reason,
                      "action_kind": action_kind,
                      "work_request_id": (
                          work_request_id
                      ),
                  },
                  "cognitive_decision",
              )


              # ------------------------------------------------------
              # DIRECT PRESENCE ACTION
              # ------------------------------------------------------

              if action_kind == "reply":

                  action_id = stable(
                      "action",
                      case["id"],
                      "reply",
                  )

                  if (
                      action_id
                      not in existing_action_ids
                  ):

                      new_actions.append(
                          {
                              "action_id": action_id,
                              "case_id": case["id"],
                              "kind": "reply",
                              "target_id": (
                                  case["target_id"]
                              ),
                              "title": case["title"],
                              "body": case["body"],
                              "author": case["author"],
                              "reason": reason,
                              "created_at": NOW,
                          }
                      )

                      existing_action_ids.add(
                          action_id
                      )


          # ==========================================================
          # 17. QUEUE WORK / PRESENCE
          # ==========================================================

          runtime[
              "work_requests"
          ] = (
              runtime.get(
                  "work_requests",
                  [],
              )
              + new_work
          )[-MAX_WORK:]


          runtime[
              "pending_actions"
          ] = (
              runtime.get(
                  "pending_actions",
                  [],
              )
              + new_actions
          )[-MAX_PENDING:]


          # ==========================================================
          # 18. REASSESS COMPLETED RESEARCH
          #
          # Research does not equal truth.
          # Research changes the state of the cognitive case.
          # Presence receives the bounded action only after Core
          # reassesses the returned evidence.
          # ==========================================================

          valid_evidence_statuses = {
              "multi_source_support",
              "partial_support",
              "insufficient_verification",
              "no_evidence",
          }

          for case in memory.get(
              "cognitive_cases",
              [],
          ):

              if not isinstance(
                  case,
                  dict,
              ):
                  continue

              result = case.get(
                  "research_result"
              )

              if not isinstance(
                  result,
                  dict,
              ):
                  continue

              status = result.get(
                  "evidence_status"
              )

              if status not in valid_evidence_statuses:
                  continue

              case_id = case.get(
                  "case_id"
              )

              action_id = stable(
                  "action",
                  case_id,
                  "research_reply",
              )

              already_pending = any(
                  isinstance(
                      action,
                      dict,
                  )
                  and action.get(
                      "action_id"
                  )
                  == action_id
                  for action in runtime.get(
                      "pending_actions",
                      [],
                  )
              )

              if already_pending:
                  continue

              if case.get(
                  "outcome"
              ) not in (
                  None,
                  "research_returned",
              ):
                  continue

              target_id = case.get(
                  "target_id"
              )

              if not target_id:
                  continue

              runtime[
                  "pending_actions"
              ].append(
                  {
                      "action_id": action_id,
                      "case_id": case_id,
                      "kind": "research_reply",
                      "target_id": target_id,
                      "title": case.get(
                          "title"
                      ),
                      "body": case.get(
                          "body"
                      ),
                      "author": case.get(
                          "author"
                      ),
                      "reason": (
                          "Research completed. "
                          "Presence may now make a bounded, "
                          "evidence-aware contribution."
                      ),
                      "research_result": result,
                      "created_at": NOW,
                  }
              )

              runtime[
                  "pending_actions"
              ] = runtime[
                  "pending_actions"
              ][-MAX_PENDING:]

              case["decision"] = (
                  "reply_after_research"
              )

              case["action_kind"] = (
                  "research_reply"
              )

              case["learning"] = (
                  "Research changed the decision state "
                  "from an unresolved claim/question to "
                  "an evidence-bounded response."
              )

              remember(
                  memory,
                  "results",
                  "Research reassessment completed.",
                  {
                      "case_id": case_id,
                      "evidence_status": status,
                      "result_id": result.get(
                          "id"
                      ),
                  },
                  "cognitive_reassessment",
              )


          # ==========================================================
          # 19. LEARNING FROM OBSERVED OUTCOMES
          #
          # Merely seeing a case is NOT learning.
          # Learning requires:
          #   - research result
          #   - execution outcome
          #   - concrete failure
          # ==========================================================

          for case in memory.get(
              "cognitive_cases",
              [],
          ):

              if not isinstance(
                  case,
                  dict,
              ):
                  continue

              outcome = case.get(
                  "outcome"
              )

              if outcome == "executed":

                  if not case.get(
                      "learning"
                  ):

                      case["learning"] = (
                          "The planned public action "
                          "was executed. Future evaluation "
                          "must use observed response rather "
                          "than assume success."
                      )

              elif outcome in (
                  "error",
                  "skipped",
              ):

                  if not case.get(
                      "learning"
                  ):

                      case["learning"] = (
                          "The planned public action "
                          "did not execute. The failure "
                          "must remain available to the next "
                          "decision cycle."
                      )


          # ==========================================================
          # 20. CYCLE OBSERVATION
          # ==========================================================

          if cases:

              remember(
                  memory,
                  "observations",
                  "Core completed a cognitive decision cycle.",
                  {
                      "cases": len(cases),
                      "new_work": len(new_work),
                      "new_actions": len(new_actions),
                      "feed": len(feed),
                      "notifications": len(
                          notifications
                      ),
                      "dms": len(messages),
                      "research_results_consumed": (
                          newly_consumed_work
                      ),
                      "presence_outcomes_consumed": (
                          newly_consumed_presence
                      ),
                  },
                  "core_cycle",
              )


          # ==========================================================
          # 21. RUNTIME BOOKKEEPING
          # ==========================================================

          runtime["run_count"] = (
              int(
                  runtime.get(
                      "run_count",
                      0,
                  )
              )
              + 1
          )

          runtime["last_run"] = NOW

          runtime["last_cycle"] = {
              "cases": len(cases),
              "new_work": len(new_work),
              "new_actions": len(new_actions),
              "feed": len(feed),
              "notifications": len(
                  notifications
              ),
              "dms": len(messages),
              "research_results_consumed": (
                  newly_consumed_work
              ),
              "presence_outcomes_consumed": (
                  newly_consumed_presence
              ),
              "pending_actions": len(
                  runtime.get(
                      "pending_actions",
                      [],
                  )
              ),
              "pending_work": len(
                  runtime.get(
                      "work_requests",
                      [],
                  )
              ),
          }


          # ----------------------------------------------------------
          # Mark current observations as processed.
          # ----------------------------------------------------------

          post_ids = [
              case["target_id"]
              for case in cases
              if (
                  case["source"]
                  == "for_you"
                  and case["target_id"]
              )
          ]

          suggestion_ids = [
              case["target_id"]
              for case in cases
              if (
                  case["source"]
                  == "suggestion"
                  and case["target_id"]
              )
          ]

          event_ids = [
              case["target_id"]
              for case in cases
              if (
                  case["source"]
                  in (
                      "notification",
                      "dm",
                  )
                  and case["target_id"]
              )
          ]


          runtime[
              "processed_post_ids"
          ] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_post_ids",
                      [],
                  )
                  + post_ids
              )
          )[-1000:]


          runtime[
              "processed_suggestion_ids"
          ] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_suggestion_ids",
                      [],
                  )
                  + suggestion_ids
              )
          )[-1000:]


          runtime[
              "seen_event_ids"
          ] = list(
              dict.fromkeys(
                  runtime.get(
                      "seen_event_ids",
                      [],
                  )
                  + event_ids
              )
          )[-1000:]


          runtime[
              "pending_actions"
          ] = runtime.get(
              "pending_actions",
              [],
          )[-MAX_PENDING:]


          runtime[
              "work_requests"
          ] = runtime.get(
              "work_requests",
              [],
          )[-MAX_WORK:]


          runtime[
              "consumed_work_result_ids"
          ] = list(
              dict.fromkeys(
                  runtime.get(
                      "consumed_work_result_ids",
                      [],
                  )
              )
          )[-500:]


          runtime[
              "consumed_presence_outcome_ids"
          ] = list(
              dict.fromkeys(
                  runtime.get(
                      "consumed_presence_outcome_ids",
                      [],
                  )
              )
          )[-500:]


          # ==========================================================
          # 22. SAVE
          # ==========================================================

          save(
              MEMORY_FILE,
              memory,
          )

          save(
              RUNTIME_FILE,
              runtime,
          )


          # ==========================================================
          # 23. OUTPUT
          # ==========================================================

          print(
              "=== NØX CORE GENERAL V8 ==="
          )

          print(
              f"Feed={len(feed)} "
              f"Notifications={len(notifications)} "
              f"DMs={len(messages)}"
          )

          print(
              f"Cases={len(cases)} "
              f"New work={len(new_work)} "
              f"New actions={len(new_actions)} "
              f"Pending actions="
              f"{len(runtime['pending_actions'])}"
          )

          print(
              "Research results consumed="
              f"{newly_consumed_work} "
              "Presence outcomes consumed="
              f"{newly_consumed_presence}"
          )

          print(
              f"Lightning={payout.get('status')}"
          )

          print(
              "Cycle: "
              "OBSERVE -> UNDERSTAND -> RECALL -> "
              "DECIDE -> WORK/PRESENCE -> "
              "OBSERVE OUTCOME -> LEARN"
          )

          print(
              "Core policy: "
              "no direct public execution, "
              "no payment, no spending."
          )

          PY

