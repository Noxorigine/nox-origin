name: NØX - Core General

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet imposé pour aujourd'hui (une question de recherche). Laisser vide en usage normal."
        required: false
        default: ""
      queue_followup:
        description: "Sujet de suivi à ajouter à la file (traité avant le sujet automatique du jour suivant)."
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json
  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"
  MAX_PUBLISH_ACTIONS: "3"
  COMMENT_SCAN_POSTS: "8"
  COMMENT_WINDOW_DAYS: "21"
  MAX_COMMENT_REPLIES_PER_RUN: "2"
  # Au premier passage, les commentaires déjà présents sont considérés comme traités,
  # sauf ceux publiés depuis moins de N heures (0 = aucun). À remettre à 0 après le premier passage.
  COMMENT_BACKFILL_HOURS: "0"
  DEFAULT_COLONY: "agent-economy"
  ENABLE_LIGHTNING_CHECK: "true"
  PROJECT_COST_EUR: "0"
  FREE_AI_ONLY: "true"
  ENABLE_RESEARCH_REPLY: "false"
  ENABLE_SELF_TOPICS: "true"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  core-general:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
          QUEUE_FOLLOWUP: ${{ github.event.inputs.queue_followup }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          NOW = datetime.now(timezone.utc).isoformat()
          policy = {
              "PROJECT_COST_EUR": "0", "FREE_AI_ONLY": "true",
              "AUTO_PAYMENT": "false", "AUTO_SPENDING": "false",
          }
          for key, expected in policy.items():
              if os.environ.get(key, expected).strip().lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          LEGACY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])
          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_CASES_MEMORY = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_PENDING = int(os.environ["MAX_PENDING_ACTIONS"])
          MAX_WORK = int(os.environ["MAX_WORK_REQUESTS"])
          MAX_PUBLISH = int(os.environ["MAX_PUBLISH_ACTIONS"])
          COMMENT_SCAN_POSTS = int(os.environ.get("COMMENT_SCAN_POSTS", "8"))
          COMMENT_WINDOW_DAYS = int(os.environ.get("COMMENT_WINDOW_DAYS", "21"))
          MAX_COMMENT_REPLIES = int(os.environ.get("MAX_COMMENT_REPLIES_PER_RUN", "2"))
          COMMENT_BACKFILL_HOURS = int(os.environ.get("COMMENT_BACKFILL_HOURS", "0") or 0)
          DEFAULT_COLONY = (os.environ.get("DEFAULT_COLONY", "agent-economy").strip() or "agent-economy")
          ENABLE_LIGHTNING = os.environ["ENABLE_LIGHTNING_CHECK"].lower() == "true"
          ENABLE_RESEARCH_REPLY = os.environ.get("ENABLE_RESEARCH_REPLY", "false").lower() == "true"
          ENABLE_SELF_TOPICS = os.environ.get("ENABLE_SELF_TOPICS", "true").lower() == "true"
          TOPIC_OVERRIDE = re.sub(r"\s+", " ", os.environ.get("TOPIC_OVERRIDE", "")).strip()[:300]
          QUEUE_FOLLOWUP = re.sub(r"\s+", " ", os.environ.get("QUEUE_FOLLOWUP", "")).strip()[:300]

          # Colonie de publication par domaine. Remplace les valeurs par les identifiants
          # (slugs) réels des colonies de The Colony quand tu veux router un domaine ailleurs.
          COLONY_BY_AREA = {
              "algorithms": DEFAULT_COLONY,
              "security": DEFAULT_COLONY,
              "agent_economy": DEFAULT_COLONY,
              "free_choice": DEFAULT_COLONY,
              "followup": DEFAULT_COLONY,
              "manual": DEFAULT_COLONY,
          }

          def colony_for_case(case):
              area = case.get("topic_area") if isinstance(case, dict) else None
              return COLONY_BY_AREA.get(area, DEFAULT_COLONY)

          EMPTY_MEMORY = {
              "version": 7,
              "observations": [], "questions": [], "hypotheses": [],
              "decisions": [], "actions": [], "results": [], "learnings": [],
              "failures": [], "relationships": [], "cognitive_cases": []
          }
          EMPTY_RUNTIME = {
              "version": 7, "run_count": 0, "last_run": None,
              "seen_event_ids": [], "processed_post_ids": [],
              "processed_suggestion_ids": [], "action_count_total": 0,
              "last_rate_limit": None, "payout_health": None,
              "pending_actions": [], "work_requests": [],
              "consumed_work_result_ids": [], "consumed_presence_outcome_ids": [],
              "seen_comment_ids": [], "comment_scan_initialized": False,
              "followups": [],
              "last_cycle": None
          }

          def load(path, default):
              if not path.exists():
                  return json.loads(json.dumps(default))
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"STATE SAFETY STOP: invalid JSON in {path}: {exc}")
              if not isinstance(value, dict):
                  raise SystemExit(f"STATE SAFETY STOP: {path} root must be a JSON object; refusing to overwrite it")
              return value

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(value, ensure_ascii=False, indent=2) + "\n"
              json.loads(payload)
              if len(payload.encode("utf-8")) > 90_000_000:
                  raise SystemExit(f"SIZE SAFETY STOP: {path} would exceed 90 MB; refusing to write it.")
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          def clean(value, limit=3000):
              return re.sub(r"\s+", " ", str(value or "")).strip()[:limit]

          def blob(value):
              return clean(json.dumps(value, ensure_ascii=False), 12000).lower()

          def stable(prefix, *parts):
              raw = "|".join(clean(p, 5000) for p in parts)
              return f"{prefix}-{sha256(raw.encode('utf-8')).hexdigest()[:20]}"

          def ensure(memory, key):
              if not isinstance(memory.get(key), list):
                  memory[key] = []
              return memory[key]

          def add(memory, key, item, limit=MAX_MEMORY):
              values = ensure(memory, key)
              values.append(item)
              del values[:-limit]

          def remember(memory, key, summary, evidence=None, source="core"):
              add(memory, key, {
                  "timestamp": NOW, "summary": clean(summary, 1000),
                  "evidence": evidence or {}, "source": source
              })

          def compact_item(item, limit=240):
              """Forme compacte et NON imbriquée d'un élément de mémoire. Sans cela, chaque cas
              recopiait des cas qui contenaient eux-mêmes des cas : taille x4 à chaque cycle."""
              if not isinstance(item, dict):
                  return {"summary": clean(item, limit)}
              summary = item.get("summary") or item.get("title") or item.get("decision_reason") or item.get("body") or ""
              out = {"summary": clean(summary, limit)}
              for key in ("case_id", "source", "timestamp"):
                  if item.get(key):
                      out[key] = clean(item.get(key), 80)
              return out

          def shrink_case(case):
              """Ramène un cas à une taille bornée (idempotent). Répare aussi les anciens fichiers gonflés."""
              if not isinstance(case, dict):
                  return
              hits = case.get("memory_hits")
              if isinstance(hits, list):
                  case["memory_hits"] = [compact_item(h) for h in hits[:4]]
              detail = case.get("outcome_detail")
              if isinstance(detail, dict):
                  keep = ("id", "action_id", "status", "kind", "reason", "timestamp", "post_id", "comment_id", "mode", "recipient")
                  case["outcome_detail"] = {k: (clean(v, 300) if isinstance(v, str) else v) for k, v in detail.items() if k in keep}
              result = case.get("research_result")
              if isinstance(result, dict):
                  result["sources"] = [
                      {k: clean(s.get(k), 300) for k in ("title", "url", "domain", "snippet") if k in s}
                      for s in (result.get("sources") or [])[:8] if isinstance(s, dict)
                  ]
              for key in ("body", "title"):
                  if key in case:
                      case[key] = clean(case.get(key), 3000)

          memory = load(MEMORY_FILE, EMPTY_MEMORY)
          runtime = load(RUNTIME_FILE, EMPTY_RUNTIME)
          work = load(WORK_FILE, {"version": 1, "history": [], "completed": []})
          presence = load(PRESENCE_FILE, {"version": 1, "runs": [], "outcomes": []})

          for key, value in EMPTY_MEMORY.items():
              if key != "version" and not isinstance(memory.get(key), list):
                  memory[key] = []
          for key, value in EMPTY_RUNTIME.items():
              if key not in runtime:
                  runtime[key] = json.loads(json.dumps(value))
          memory["version"] = max(7, int(memory.get("version", 1) or 1))
          runtime["version"] = 7

          # Réparation / garde-fou de taille de la mémoire (voir compact_item).
          for _case in memory.get("cognitive_cases", []):
              shrink_case(_case)
          def _memory_mb():
              return len(json.dumps(memory, ensure_ascii=False)) / 1e6
          _size = _memory_mb()
          while _size > 20 and memory.get("cognitive_cases"):
              del memory["cognitive_cases"][:10]
              _size = _memory_mb()
          print(f"Memory size after compaction: {_size:.2f} MB")
          VOLATILE =("run_count", "last_run", "last_rate_limit", "payout_health", "last_cycle")
          previous_payout_status = (runtime.get("payout_health") or {}).get("status") if isinstance(runtime.get("payout_health"), dict) else None

          if not MEMORY_FILE.exists() and LEGACY_FILE.exists():
              legacy = load(LEGACY_FILE, {})
              remember(memory, "observations", "Legacy Colony memory imported into Core.", {
                  "commented_post_ids": len(legacy.get("commented_post_ids", [])),
                  "seen_notification_ids": len(legacy.get("seen_notification_ids", []))
              }, "legacy_migration")

          def extract(value, keys):
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  for key in keys:
                      if isinstance(value.get(key), list):
                          return value[key]
              return []

          def rate_limit(client):
              rl = getattr(client, "last_rate_limit", None)
              if rl is None:
                  return None
              result = {}
              for name in ("limit", "remaining", "reset", "retry_after"):
                  try:
                      value = getattr(rl, name)
                      if value is not None:
                          result[name] = value.isoformat() if hasattr(value, "isoformat") else value
                  except Exception:
                      pass
              return result or None

          def terms(text):
              words = re.findall(r"[a-zA-ZÀ-ÿ0-9_-]{4,}", clean(text, 5000).lower())
              stop = {"this","that","with","from","have","what","when","where","which","would","could","about","your","their","they","there","into","then","than","just","pour","avec","dans","nous","vous","cela","cette","comme","mais","plus","faire","être","sont","pourquoi","comment"}
              out = []
              for word in words:
                  if word not in stop and word not in out:
                      out.append(word)
              return out[:30]

          def recall(memory, text, limit=6):
              wanted = set(terms(text))
              scored = []
              for kind, values in memory.items():
                  if kind == "version" or not isinstance(values, list):
                      continue
                  for item in values:
                      score = sum(1 for term in wanted if term in blob(item))
                      if score:
                          scored.append({"kind": kind, "score": score, "item": compact_item(item)})
              scored.sort(key=lambda x: x["score"], reverse=True)
              return scored[:limit]

          client = ColonyClient(API_KEY)
          try:
              state = client.bootstrap()
          except ColonyAuthError as exc:
              raise SystemExit(f"Authentification Colony refusée: {exc}")
          except ColonyAPIError as exc:
              raise SystemExit(f"Erreur Colony au bootstrap: {exc}")

          profile = state.get("profile", {}) if isinstance(state, dict) else {}
          username = clean(profile.get("username"), 100)
          if username and username != "nox_origine":
              raise SystemExit(f"SECURITY STOP: profil inattendu '{username}'.")
          runtime["last_rate_limit"] = rate_limit(client)

          # No per-run bootstrap observation: it changed the state file on every
          # run and caused a useless commit every 30 minutes.
          memory_before = json.dumps(memory, sort_keys=True, ensure_ascii=False)
          runtime_before = json.dumps({k: v for k, v in runtime.items() if k not in VOLATILE}, sort_keys=True, ensure_ascii=False)

          payout = {"status": "NOT_CHECKED", "lightning_address": None}
          if ENABLE_LIGHTNING:
              try:
                  me = client.get_me()
                  lightning = clean(me.get("lightning_address") if isinstance(me, dict) else "", 300)
                  payout["lightning_address"] = lightning or None
                  if lightning.count("@") != 1:
                      payout["status"] = "PAYOUT_UNAVAILABLE"
                  else:
                      local, host = lightning.split("@", 1)
                      endpoint = f"https://{host}/.well-known/lnurlp/{urllib.parse.quote(local, safe='')}"
                      req = urllib.request.Request(endpoint, headers={"Accept":"application/json","User-Agent":"NOX-Core/6"})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          payload = json.loads(response.read().decode("utf-8", errors="replace"))
                      callback = str(payload.get("callback", ""))
                      if payload.get("tag") != "payRequest" or not callback.startswith(("https://", "http://")):
                          raise ValueError("invalid LNURL pay metadata")
                      payout.update({"status":"PAYOUT_READY", "min_sendable_msat":payload.get("minSendable"), "max_sendable_msat":payload.get("maxSendable")})
              except Exception as exc:
                  payout = {"status":"PAYOUT_UNAVAILABLE", "lightning_address":payout.get("lightning_address"), "error":clean(exc,500)}
          runtime["payout_health"] = payout

          notifications = []
          if int(state.get("unread_notifications", 0) or 0) > 0:
              try:
                  notifications = extract(client.get_notifications(unread_only=True), ("items","notifications"))[:MAX_NOTIFICATIONS]
              except Exception as exc:
                  remember(memory, "failures", "Unread notifications could not be read.", {"error":clean(exc,500)}, "colony_notifications")

          # DM detection must inspect the actual conversation inbox.
          # bootstrap.unread_direct_messages is only a summary counter and is
          # not used as a gate. The SDK provides iter_conversations() for the
          # complete 1:1 inbox; get_conversation() then returns the thread and
          # marks it read, so detection happens before the thread is fetched.
          def message_sender(message):
              if not isinstance(message, dict):
                  return ""
              sender = message.get("sender") or message.get("author") or message.get("from")
              if isinstance(sender, dict):
                  return clean(sender.get("username") or sender.get("handle") or sender.get("name"), 100)
              return clean(
                  message.get("sender_username")
                  or message.get("author_username")
                  or message.get("from_username")
                  or sender,
                  100,
              )

          messages = []
          try:
              conversations = list(client.iter_conversations(max_results=50))
              for conversation in conversations:
                  if len(messages) >= MAX_DMS or not isinstance(conversation, dict):
                      break
                  other = (
                      conversation.get("username")
                      or conversation.get("other_username")
                      or conversation.get("with_username")
                      or conversation.get("partner_username")
                  )
                  if not other:
                      continue
                  try:
                      detail = client.get_conversation(str(other))
                      detail = extract(detail, ("items", "messages"))
                      for message in detail[-MAX_DMS:]:
                          if not isinstance(message, dict):
                              continue
                          # Only incoming messages are actionable. This also
                          # makes the detector independent of unread counters.
                          sender = message_sender(message)
                          if sender and sender == username:
                              continue
                          enriched = dict(message)
                          enriched["_conversation_username"] = str(other)
                          messages.append(enriched)
                          if len(messages) >= MAX_DMS:
                              break
                  except Exception as exc:
                      remember(memory, "failures", "A conversation could not be inspected.", {"username":other,"error":clean(exc,500)}, "colony_messages")
          except Exception as exc:
              remember(memory, "failures", "Conversation inbox could not be read.", {"error":clean(exc,500)}, "colony_messages")

          try:
              feed = extract(client.get_for_you_feed(limit=MAX_FEED, kinds="posts"), ("items","posts","feed"))
          except Exception as exc:
              feed = []
              remember(memory, "failures", "For-you feed could not be read.", {"error":clean(exc,500)}, "colony_feed")

          try:
              suggestions = extract(client.get_suggestions(limit=MAX_SUGGESTIONS), ("items","suggestions"))
          except Exception as exc:
              suggestions = []
              print(f"SUGGESTIONS unavailable: {exc}")

          def item_id(item):
              return str(item.get("id") or item.get("post_id") or item.get("notification_id") or item.get("message_id") or "") if isinstance(item, dict) else ""

          def target_id(item, source):
              if not isinstance(item, dict):
                  return ""
              if source == "dm":
                  return str(item.get("message_id") or item.get("id") or "")
              return str(item.get("post_id") or item.get("comment_id") or item.get("id") or item.get("notification_id") or "")

          def title(item):
              return clean(item.get("title") or item.get("subject") or "", 300) if isinstance(item, dict) else ""

          def body(item):
              return clean(item.get("body") or item.get("content") or item.get("message") or item.get("text") or "", 3000) if isinstance(item, dict) else clean(item,3000)

          def author(item):
              if not isinstance(item, dict):
                  return ""
              a = item.get("author")
              if isinstance(a, dict):
                  return clean(a.get("username") or a.get("display_name"), 100)
              return clean(item.get("author_username") or item.get("username"), 100)

          def classify(item, source):
              text = f"{title(item)}\n{body(item)}"
              low = text.lower()
              qs = re.findall(r"[^.!?]{5,}\?", text)[:4]
              evidence = [x for x in ("evidence","proof","data","test","result","verified","research","preuve","données","testé","résultat","vérifié") if x in low]
              conflicts = [x for x in ("however","but","yet","contradiction","failed","wrong","false","pourtant","cependant","contradiction","échec","faux") if x in low]
              memory_hits = recall(memory, text)
              has_substance = len(body(item)) >= 120 or bool(qs) or bool(evidence) or bool(conflicts)
              if not has_substance:
                  return None
              if conflicts:
                  intent = "reconcile_conflict"
              elif qs:
                  intent = "answer_or_research_question"
              elif len(evidence) >= 2:
                  intent = "verify_claim"
              else:
                  intent = "contextual_observation"
              return {
                  "id": stable("case", source, item_id(item), title(item), body(item)[:700]),
                  "source": source, "target_id": target_id(item, source), "title": title(item), "body": body(item),
                  "author": author(item),
                  "recipient": clean(item.get("_conversation_username") or item.get("recipient") or "", 100) if source == "dm" and isinstance(item, dict) else "",
                  "intent": intent, "questions": qs,
                  "evidence_signals": evidence, "conflict_signals": conflicts,
                  "terms": terms(text), "memory_hits": memory_hits,
                  "uncertainty": ["The available context may be incomplete."],
                  "created_at": item.get("created_at") if isinstance(item, dict) else None
              }

          # -----------------------------------------------------------
          # Comments received on NØX's own published posts. The post list comes
          # from the Presence file. Existing comments are marked as already
          # handled on the very first scan, so NØX never answers old threads
          # that were already handled by hand.
          # -----------------------------------------------------------
          def age_hours(value):
              try:
                  return (datetime.now(timezone.utc) - datetime.fromisoformat(str(value).replace("Z", "+00:00"))).total_seconds() / 3600
              except Exception:
                  return None

          own_comment_cases = []
          comment_ids_to_mark = []
          threads_ok = 0
          seen_comments = set(x for x in runtime.get("seen_comment_ids", []) if x)
          first_comment_scan = not runtime.get("comment_scan_initialized")
          cutoff_ts = datetime.now(timezone.utc).timestamp() - COMMENT_WINDOW_DAYS * 86400
          own_posts = []
          own_post_ids = set()
          for rec in reversed(presence.get("published_posts", []) if isinstance(presence, dict) else []):
              if not isinstance(rec, dict) or not rec.get("post_id"):
                  continue
              try:
                  rec_ts = datetime.fromisoformat(str(rec.get("timestamp")).replace("Z", "+00:00")).timestamp()
              except Exception:
                  continue
              if rec_ts < cutoff_ts or str(rec["post_id"]) in own_post_ids:
                  continue
              own_post_ids.add(str(rec["post_id"]))
              own_posts.append(rec)
              if len(own_posts) >= COMMENT_SCAN_POSTS:
                  break

          for rec in own_posts:
              post_id = str(rec["post_id"])
              try:
                  thread = client.get_all_comments(post_id)
                  thread = thread if isinstance(thread, list) else extract(thread, ("items", "comments"))
                  threads_ok += 1
              except Exception as exc:
                  remember(memory, "failures", "Comments of an own post could not be read.", {"post_id": post_id, "error": clean(exc, 300)}, "colony_comments")
                  continue
              nox_replied_to = set()
              for c in thread:
                  if isinstance(c, dict) and author(c) == username:
                      parent = str(c.get("parent_id") or c.get("parent_comment_id") or "")
                      if parent:
                          nox_replied_to.add(parent)
              for c in thread:
                  if not isinstance(c, dict):
                      continue
                  cid = str(c.get("id") or c.get("comment_id") or "")
                  commenter = author(c)
                  if not cid or cid in seen_comments or not commenter or commenter == username:
                      continue
                  if cid in nox_replied_to:
                      comment_ids_to_mark.append(cid)
                      continue
                  if first_comment_scan:
                      age = age_hours(c.get("created_at"))
                      recent = COMMENT_BACKFILL_HOURS > 0 and age is not None and age <= COMMENT_BACKFILL_HOURS
                      if not recent:
                          comment_ids_to_mark.append(cid)
                          continue
                  case = classify(c, "own_post_comment")
                  if not case:
                      comment_ids_to_mark.append(cid)
                      continue
                  case["id"] = stable("case", "own_post_comment", post_id, cid)
                  case["target_id"] = post_id
                  case["comment_id"] = cid
                  case["comment_author"] = commenter
                  case["post_title"] = clean(rec.get("title"), 300)
                  own_comment_cases.append(case)

          raw_cases = []
          # Comments on NØX's own posts come first: they are the people actually talking to NØX.
          raw_cases.extend(own_comment_cases)
          for item in feed:
              case = classify(item, "for_you")
              if case: raw_cases.append(case)
          for item in notifications:
              case = classify(item, "notification")
              if case: raw_cases.append(case)
          for item in messages:
              case = classify(item, "dm")
              if case: raw_cases.append(case)
          for item in suggestions:
              case = classify(item, "suggestion")
              if case: raw_cases.append(case)

          seen = set(runtime.get("seen_event_ids", []))
          processed = set(runtime.get("processed_post_ids", []))
          unique = []
          for case in raw_cases:
              key = case["target_id"] or case["id"]
              if key in seen and case["source"] in ("notification","dm"):
                  continue
              if key in processed and case["source"] == "for_you":
                  continue
              if case["author"] == "nox_origine":
                  continue
              unique.append(case)
          cases = unique[:MAX_CASES]

          # -----------------------------------------------------------
          # Close the previous cycle first: factory results and social
          # execution outcomes become inputs to the next decision.
          # -----------------------------------------------------------
          consumed_work = set(runtime.get("consumed_work_result_ids", []))
          history = work.get("history", []) if isinstance(work, dict) else []
          for result in history:
              if not isinstance(result, dict):
                  continue
              rid = result.get("id")
              if not rid or rid in consumed_work:
                  continue
              request_id = result.get("request_id")
              # Work Factory request IDs differ from the originating cognitive case ID.
              # Join on case_id first; request_id is retained as a legacy fallback.
              source_case_id = result.get("case_id")
              matched = None
              for case in memory.get("cognitive_cases", []):
                  if isinstance(case, dict) and case.get("case_id") in (source_case_id, request_id):
                      matched = case
                      break
              if matched:
                  matched["research_result"] = result
                  matched["outcome"] = "research_returned"
                  matched["learning"] = None
              else:
                  add(memory, "results", {
                      "timestamp": NOW, "type":"research_result", "request_id":request_id,
                      "result_id":rid, "evidence_status":result.get("evidence_status"),
                      "conclusion":result.get("conclusion"), "sources":result.get("sources",[])[:8]
                  })
              consumed_work.add(rid)
          runtime["consumed_work_result_ids"] = list(consumed_work)[-500:]

          consumed_presence = set(runtime.get("consumed_presence_outcome_ids", []))
          outcomes = presence.get("outcomes", []) if isinstance(presence, dict) else []
          for outcome in outcomes:
              if not isinstance(outcome, dict):
                  continue
              oid = outcome.get("id")
              if not oid or oid in consumed_presence:
                  continue
              for case in memory.get("cognitive_cases", []):
                  if isinstance(case, dict) and case.get("case_id") == outcome.get("case_id"):
                      case["outcome"] = outcome.get("status")
                      case["outcome_detail"] = outcome
                      if outcome.get("status") == "executed":
                          add(memory, "results", {"timestamp":NOW,"type":"public_action","case_id":case.get("case_id"),"action_id":outcome.get("action_id"),"target_id":outcome.get("target_id"),"status":"executed"})
                      elif outcome.get("status") in ("error","skipped","conflict"):
                          add(memory, "failures", {"timestamp":NOW,"summary":"A planned presence action did not execute.","evidence":outcome}, MAX_MEMORY)
                      break
              consumed_presence.add(oid)
          runtime["consumed_presence_outcome_ids"] = list(consumed_presence)[-500:]

          # Requests already completed or sent to manual review must never be
          # re-created, and must stop occupying the 20 slots of the queue.
          done_request_ids = {
              x.get("request_id") for key in ("completed", "manual_review")
              for x in (work.get(key, []) if isinstance(work, dict) else [])
              if isinstance(x, dict) and x.get("request_id")
          }
          runtime["work_requests"] = [
              w for w in runtime.get("work_requests", [])
              if isinstance(w, dict) and w.get("id") not in done_request_ids
          ]

          # Remove actions already resolved by Presence.
          pending = []
          # Every recorded Presence outcome is terminal for automatic execution.
          # Keep the status map so Core cannot recreate the same deterministic
          # action_id on the next cycle after removing it from pending_actions.
          outcome_status_by_action = {
              o.get("action_id"): o.get("status")
              for o in outcomes
              if isinstance(o, dict) and o.get("action_id") and o.get("status")
          }
          resolved_action_ids = set(outcome_status_by_action)
          for action in runtime.get("pending_actions", []):
              if isinstance(action, dict) and action.get("action_id") not in resolved_action_ids:
                  pending.append(action)
          runtime["pending_actions"] = pending[-MAX_PENDING:]

          # -----------------------------------------------------------
          # Decide. No generic social action is created. A public action
          # needs a concrete contribution and a traceable target.
          # -----------------------------------------------------------
          new_actions = []
          new_work = []
          for case in cases:
              text = f"{case['title']}\n{case['body']}"
              memory_context = [x["item"] for x in case["memory_hits"][:4]]
              decision = "do_nothing"
              reason = "No concrete contribution is justified by the available context."
              action_kind = None

              if case["source"] == "own_post_comment" and case["intent"] == "contextual_observation":
                  decision = "comment_reply_direct"
                  reason = "A substantive comment was left on NØX's own post and needs no new research; reply in the thread, without asserting new facts."
                  action_kind = "comment_reply"
              elif case["source"] == "dm" and case["intent"] == "answer_or_research_question" and case["questions"]:
                  question = case["questions"][0]
                  decision = "dm_reply"
                  reason = "A direct question was received in a DM; Core can answer from its observed memory without requiring public research first."
                  action_kind = "dm_reply"
              elif case["intent"] == "answer_or_research_question" and case["questions"]:
                  question = case["questions"][0]
                  decision = "research_before_reply"
                  reason = "The public post contains a concrete question; research is required before asserting an answer."
                  action_kind = "research"
                  work_id = stable("work", case["id"], question)
                  if work_id not in done_request_ids and not any(isinstance(w,dict) and w.get("id") == work_id for w in runtime["work_requests"]):
                      new_work.append({"id":work_id,"case_id":case["id"],"work_type":"research","question":clean(question,1200),"context":clean(text,2500),"memory_context":memory_context,"recipient":case.get("recipient",""),"created_at":NOW,"status":"pending"})
              elif case["intent"] == "verify_claim" and case["evidence_signals"]:
                  decision = "research_claim"
                  reason = "The claim uses evidence language; NØX will separate reported information from independently checked evidence."
                  action_kind = "research"
                  question = case["questions"][0] if case["questions"] else (case["title"] or clean(case["body"], 200))
                  work_id = stable("work", case["id"], question)
                  if work_id not in done_request_ids and not any(isinstance(w,dict) and w.get("id") == work_id for w in runtime["work_requests"]):
                      new_work.append({"id":work_id,"case_id":case["id"],"work_type":"research","question":clean(question,1200),"context":clean(text,2500),"memory_context":memory_context,"recipient":case.get("recipient",""),"created_at":NOW,"status":"pending"})
              elif case["intent"] == "reconcile_conflict" and case["conflict_signals"]:
                  decision = "reconstruct_before_reply"
                  reason = "The text contains a potential disagreement; NØX should reconstruct the claims before taking a position."
                  action_kind = "research"
                  question = case["questions"][0] if case["questions"] else (case["title"] or clean(case["body"], 200))
                  work_id = stable("work", case["id"], question)
                  if work_id not in done_request_ids and not any(isinstance(w,dict) and w.get("id") == work_id for w in runtime["work_requests"]):
                      new_work.append({"id":work_id,"case_id":case["id"],"work_type":"research","question":clean(question,1200),"context":clean(text,2500),"memory_context":memory_context,"recipient":case.get("recipient",""),"created_at":NOW,"status":"pending"})
              elif case["intent"] == "contextual_observation" and case["memory_hits"] and len(case["body"]) >= 180:
                  decision = "contextual_reply"
                  reason = "A specific memory/context overlap exists and can support a concrete contribution."
                  action_kind = "dm_reply" if case["source"] == "dm" else "reply"

              case_record = {
                  "timestamp":NOW,"case_id":case["id"],"source":case["source"],"target_id":case["target_id"],
                  "title":case["title"],"author":case["author"],"recipient":case.get("recipient",""),"body":case["body"],"intent":case["intent"],
                  "questions":case["questions"],"evidence_signals":case["evidence_signals"],"conflict_signals":case["conflict_signals"],
                  "memory_hits":memory_context,"uncertainties":case["uncertainty"],"decision":decision,"decision_reason":reason,
                  "action_kind":action_kind,"outcome":None,"learning":None,
                  "comment_id":case.get("comment_id",""),"comment_author":case.get("comment_author",""),"post_title":case.get("post_title","")
              }
              add(memory,"cognitive_cases",case_record,MAX_CASES_MEMORY)
              remember(memory,"decisions",f"Decision: {decision}.",{"case_id":case["id"],"target_id":case["target_id"],"reason":reason,"action_kind":action_kind},"cognitive_decision")

              if action_kind == "dm_reply":
                  action_id = stable("action", case["id"], "dm_reply")
                  if case.get("recipient") and not any(isinstance(a,dict) and a.get("action_id") == action_id for a in runtime["pending_actions"]):
                      new_actions.append({"action_id":action_id,"case_id":case["id"],"kind":"dm_reply","recipient":case["recipient"],"target_id":case["target_id"],"title":case["title"],"body":case["body"],"author":case["author"],"reason":reason,"created_at":NOW})
              elif action_kind == "reply":
                  action_id = stable("action", case["id"], "reply")
                  if not any(isinstance(a,dict) and a.get("action_id") == action_id for a in runtime["pending_actions"]):
                      new_actions.append({"action_id":action_id,"case_id":case["id"],"kind":"reply","target_id":case["target_id"],"title":case["title"],"body":case["body"],"author":case["author"],"reason":reason,"created_at":NOW})
              elif action_kind == "comment_reply":
                  action_id = stable("action", case["id"], "comment_reply")
                  if (case.get("comment_id") and action_id not in resolved_action_ids
                          and not any(isinstance(a,dict) and a.get("action_id") == action_id for a in runtime["pending_actions"])):
                      new_actions.append({"action_id":action_id,"case_id":case["id"],"kind":"comment_reply","target_id":case["target_id"],"comment_id":case["comment_id"],"comment_author":case.get("comment_author",""),"title":case.get("post_title",""),"reason":reason,"created_at":NOW})
              elif action_kind == "research":
                  pass

          # -----------------------------------------------------------
          # Self-chosen daily topic. NØX focuses on three domains, with a
          # small share of free-choice topics. One research request per UTC
          # day; the normal research -> quality gate -> publish path applies,
          # so an irrelevant or inconclusive result is never published.
          # Priority: manual topic (workflow_dispatch) > queued follow-up > topic wheel.
          # -----------------------------------------------------------
          FOCUS_TOPICS = {
              "algorithms": [
                  "How do evolutionary and search-based methods compare with hand-designed algorithms for discovering new sorting or optimization routines",
                  "How can LLM agents generate, test and verify new algorithms reliably",
                  "What techniques make automatically generated algorithms provably correct",
                  "How does program synthesis compare with LLM code generation for algorithm design",
                  "What are practical strategies for benchmarking an algorithm against existing baselines fairly",
                  "How do learned heuristics improve classic combinatorial optimization algorithms",
              ],
              "security": [
                  "How are vulnerability scanners used as gates in CI/CD pipelines and what are the trade-offs",
                  "What are the main attack surfaces of autonomous AI agents with tool access",
                  "How does prompt injection affect LLM agents and which defenses work in practice",
                  "What is the role of cybernetic feedback loops in adaptive security monitoring",
                  "How do software supply chain attacks work and how can they be detected early",
                  "What are best practices to store and rotate API secrets in automated workflows",
              ],
              "agent_economy": [
                  "How do AI agents earn and exchange value in virtual economies with Lightning micropayments",
                  "What mechanisms prevent spam and fraud in agent-to-agent marketplaces",
                  "How can reputation systems be designed for autonomous agents offering paid services",
                  "What pricing and bidding strategies work for AI agents competing for marketplace tasks",
                  "How do escrow and dispute resolution work in agent task marketplaces",
                  "What are the economic risks when autonomous agents can spend money on their own",
              ],
              "free_choice": [
                  "How do distributed systems reach consensus under unreliable networks",
                  "What makes open-source projects sustainable over many years",
                  "How do small teams keep automated systems observable and debuggable",
                  "What can biological swarms teach about decentralized coordination",
                  "How is formal verification used outside of aerospace and chips",
                  "What are the limits of current techniques for evaluating language models",
              ],
          }
          # ~85% focus (algorithms, security, agent economy equally), ~15% free choice.
          TOPIC_WHEEL = ["algorithms","security","agent_economy"] * 6 + ["free_choice"] * 3
          today_key = datetime.now(timezone.utc).strftime("%Y%m%d")
          self_topics = runtime.setdefault("self_topics", [])
          if not isinstance(self_topics, list):
              self_topics = runtime["self_topics"] = []
          followups = runtime.setdefault("followups", [])
          if not isinstance(followups, list):
              followups = runtime["followups"] = []
          if QUEUE_FOLLOWUP and not any(isinstance(f, dict) and f.get("topic") == QUEUE_FOLLOWUP for f in followups):
              followups.append({"id": stable("followup", QUEUE_FOLLOWUP), "topic": QUEUE_FOLLOWUP, "created_at": NOW, "status": "pending"})
              print(f"Follow-up queued: {QUEUE_FOLLOWUP}")
          pending_followup = next((f for f in followups if isinstance(f, dict) and f.get("status") == "pending"), None)
          topic_done_today = any(isinstance(t, dict) and t.get("day") == today_key for t in self_topics)
          work_capacity = len(runtime.get("work_requests", [])) + len(new_work) < MAX_WORK
          if ENABLE_SELF_TOPICS and work_capacity and (TOPIC_OVERRIDE or not topic_done_today):
              used = {t.get("topic") for t in self_topics if isinstance(t, dict)}
              if TOPIC_OVERRIDE:
                  topic, area = TOPIC_OVERRIDE.rstrip(" ?"), "manual"
              elif pending_followup:
                  topic, area = clean(pending_followup.get("topic"), 300).rstrip(" ?"), "followup"
                  pending_followup["status"] = "scheduled"
                  pending_followup["scheduled_at"] = NOW
              else:
                  area = TOPIC_WHEEL[int(sha256(today_key.encode()).hexdigest(), 16) % len(TOPIC_WHEEL)]
                  pool = [q for q in FOCUS_TOPICS[area] if q not in used] or FOCUS_TOPICS[area]
                  topic = pool[int(sha256(("t" + today_key).encode()).hexdigest(), 16) % len(pool)]
              if area in ("manual", "followup"):
                  self_case_id = f"self-topic-{today_key}-{sha256(topic.encode()).hexdigest()[:8]}"
              else:
                  self_case_id = f"self-topic-{today_key}"
              self_work_id = stable("work", self_case_id)
              already_queued = (self_work_id in done_request_ids
                                or any(isinstance(w, dict) and w.get("id") == self_work_id for w in runtime.get("work_requests", [])))
              if topic and not already_queued:
                  new_work.append({"id": self_work_id, "case_id": self_case_id, "work_type": "research", "question": topic,
                                   "context": "", "memory_context": [], "recipient": "", "created_at": NOW, "status": "pending"})
                  add(memory, "cognitive_cases", {
                      "timestamp": NOW, "case_id": self_case_id, "source": "self_topic", "target_id": "", "title": topic + "?",
                      "author": username, "recipient": "", "body": "", "intent": "self_chosen_topic", "questions": [topic],
                      "evidence_signals": [], "conflict_signals": [], "memory_hits": [], "uncertainties": [],
                      "decision": "research_self_topic", "decision_reason": f"Self-chosen topic ({area}).",
                      "action_kind": "research", "outcome": None, "learning": None, "topic_area": area
                  }, MAX_CASES_MEMORY)
                  self_topics.append({"day": today_key, "topic": topic, "area": area, "case_id": self_case_id})
                  runtime["self_topics"] = self_topics[-60:]
                  print(f"Self topic [{area}]: {topic}")
          runtime["followups"] = followups[-30:]

          runtime["work_requests"] = (runtime.get("work_requests", []) + new_work)[-MAX_WORK:]
          runtime["pending_actions"] = (runtime.get("pending_actions", []) + new_actions)[-MAX_PENDING:]

          # A completed research result can unlock either a reply or a public
          # post. Core decides. Publication is capped at three successful posts
          # in any rolling 24-hour window, with at most one new publish action
          # created by this Core run. The cap is a cadence control, not a ban.
          publish_actions_created = 0

          def recent_publications_24h():
              cutoff = datetime.now(timezone.utc).timestamp() - 86400
              count = 0
              if isinstance(presence, dict):
                  for item in presence.get("published_posts", []):
                      if not isinstance(item, dict):
                          continue
                      stamp = item.get("timestamp")
                      try:
                          if datetime.fromisoformat(str(stamp).replace("Z", "+00:00")).timestamp() >= cutoff:
                              count += 1
                      except Exception:
                          continue
              return count

          publications_24h = recent_publications_24h()

          # Recover exactly one publication attempt after a recorded HTTP 409.
          # The original publication may have come from either a researched case
          # or a learning. Reconstruct its payload from the stable source record;
          # never retry if the source cannot be reconstructed safely.
          retry_created = False
          cases_by_id = {
              c.get("case_id"): c for c in memory.get("cognitive_cases", [])
              if isinstance(c, dict) and c.get("case_id")
          }
          for previous in reversed(outcomes):
              if not isinstance(previous, dict):
                  continue
              if previous.get("status") != "conflict" or previous.get("kind") != "publish":
                  continue
              original_id = previous.get("action_id")
              if not original_id:
                  continue

              retry_title = None
              retry_body = None
              retry_case_id = previous.get("case_id")
              retry_result = None

              # First reconstruct a research-backed publication from its case.
              case = cases_by_id.get(retry_case_id)
              result = case.get("research_result") if isinstance(case, dict) else None
              if isinstance(result, dict) and result.get("evidence_status") in ("multi_source_support", "partial_support"):
                  conclusion = clean(result.get("conclusion"), 1800)
                  sources = [x for x in (result.get("sources") or []) if isinstance(x, dict) and (x.get("url") or x.get("title"))]
                  lower_conclusion = conclusion.lower()
                  meta_markers = (
                      "search coverage", "source coverage", "coverage found",
                      "found relevant results", "relevant results across",
                      "evidence coverage", "search results found", "do not contain", "does not contain", "no information", "not address", "unrelated", "remains unresolved", "remain unresolved", "cannot be determined", "no relevant", "do not provide", "does not provide", "irrelevant", "not enough information", "insufficient evidence", "you provided"
                  )
                  if len(conclusion) >= 180 and len(sources) >= 2 and not any(marker in lower_conclusion for marker in meta_markers):
                      source_lines = []
                      for source in sources[:4]:
                          label = clean(source.get("title") or source.get("url"), 220)
                          url = clean(source.get("url"), 500)
                          if label and url:
                              source_lines.append(f"- {label}: {url}")
                          elif label:
                              source_lines.append(f"- {label}")
                      retry_title = clean(case.get("title") or "NØX research finding", 220)
                      retry_body = (
                          f"NØX research finding\n\n{conclusion}\n\n"
                          f"Evidence status: {result.get('evidence_status')}.\n\n"
                          "This conclusion is bounded by the evidence currently available; it is not treated as universal proof.\n\n"
                          "Sources:\n" + "\n".join(source_lines)
                      )
                      retry_result = result

              # Learning-based publications have no case_id. Recreate the same
              # title/body from the learning whose deterministic ID matches the
              # conflict action; this also repairs the already-recorded old 409.
              if retry_body is None:
                  for learning in reversed(memory.get("learnings", [])):
                      if not isinstance(learning, dict):
                          continue
                      summary = clean(learning.get("summary"), 1200)
                      evidence = learning.get("evidence")
                      if len(summary) < 120 or not isinstance(evidence, dict) or not evidence:
                          continue
                      if clean(learning.get("source"), 100) in ("core_cycle", "colony_bootstrap"):
                          continue
                      learning_key = stable("learning_publish", learning.get("timestamp"), summary)
                      candidate_id = stable("action", learning_key, "publish")
                      if candidate_id != original_id:
                          continue
                      retry_title = "NØX learning from observed outcomes"
                      retry_body = (
                          "NØX observed a concrete outcome and recorded this learning:\n\n"
                          f"{summary}\n\n"
                          f"Evidence recorded: {clean(evidence, 900)}\n\n"
                          "This is a current working learning, not a universal claim. NØX will update it if later observations contradict it."
                      )
                      break

              if not retry_body or not retry_title:
                  print(f"Publication recovery unavailable: action={original_id} reason=source_payload_not_reconstructable")
                  continue

              retry_id = stable("action_retry", original_id, "publish", 1)
              if retry_id in resolved_action_ids or any(
                  isinstance(a, dict) and a.get("action_id") == retry_id
                  for a in runtime.get("pending_actions", [])
              ):
                  continue
              if publications_24h >= 3 or publish_actions_created >= min(1, MAX_PUBLISH):
                  break
              runtime["pending_actions"].append({
                  "action_id": retry_id, "retry_of": original_id,
                  "case_id": retry_case_id, "kind": "publish",
                  "title": retry_title, "body": retry_body,
                  "colony": previous.get("colony") or colony_for_case(case if isinstance(case, dict) else {}),
                  "reason": "Single controlled retry after HTTP 409; Presence must reconcile an existing identical post before creating anything.",
                  "research_result": retry_result, "created_at": NOW
              })
              publish_actions_created += 1
              retry_created = True
              print(f"Publication recovery queued: retry_of={original_id} attempt=1")
              break

          # A researched answer goes back to the person who asked, as a reply on
          # their post. A new standalone post is only the fallback.
          reply_actions_created = 0
          REPLY_META_MARKERS = (
              "search coverage", "source coverage", "coverage found",
              "found relevant results", "relevant results across",
              "evidence coverage", "search results found", "do not contain", "does not contain", "no information", "not address", "unrelated", "remains unresolved", "remain unresolved", "cannot be determined", "no relevant", "do not provide", "does not provide", "irrelevant", "not enough information", "insufficient evidence", "you provided"
          )
          if ENABLE_RESEARCH_REPLY:
              for case in reversed(memory.get("cognitive_cases", [])):
                  if reply_actions_created >= 2:
                      break
                  if not isinstance(case, dict) or not isinstance(case.get("research_result"), dict):
                      continue
                  result = case["research_result"]
                  if result.get("evidence_status") not in ("multi_source_support", "partial_support"):
                      continue
                  if case.get("source") not in ("for_you", "suggestion", "notification"):
                      continue
                  if not case.get("target_id") or case.get("author") == username:
                      continue
                  if case.get("outcome") not in (None, "research_returned"):
                      continue
                  conclusion = clean(result.get("conclusion"), 1800)
                  sources = [x for x in (result.get("sources") or []) if isinstance(x, dict) and (x.get("url") or x.get("title"))]
                  if len(conclusion) < 180 or len(sources) < 2:
                      continue
                  if any(marker in conclusion.lower() for marker in REPLY_META_MARKERS):
                      continue
                  reply_id = stable("action", case.get("case_id"), "research_reply")
                  if any(isinstance(a, dict) and a.get("action_id") == reply_id for a in runtime["pending_actions"]):
                      case["reply_queued"] = True
                      continue
                  if reply_id in resolved_action_ids:
                      continue
                  runtime["pending_actions"].append({
                      "action_id": reply_id, "case_id": case.get("case_id"), "kind": "research_reply",
                      "target_id": case.get("target_id"), "title": case.get("title"), "body": case.get("body"),
                      "author": case.get("author"), "question": (case.get("questions") or [None])[0],
                      "conclusion": conclusion, "sources": sources[:4], "research_result": result,
                      "reason": "A research result answers a question or claim from this post; reply where it was asked.",
                      "created_at": NOW
                  })
                  case["decision"] = "reply_after_research"
                  case["action_kind"] = "research_reply"
                  case["reply_queued"] = True
                  reply_actions_created += 1
                  print(f"Research reply queued: case={case.get('case_id')}")

          # Replies to comments left on NØX's own posts. Always on (independent of
          # ENABLE_RESEARCH_REPLY): these are people answering NØX in its own thread.
          # A reply built on research needs a bounded, multi-source conclusion;
          # otherwise NØX stays silent rather than answering without grounds.
          comment_replies_created = 0
          for case in reversed(memory.get("cognitive_cases", [])):
              if comment_replies_created >= MAX_COMMENT_REPLIES:
                  break
              if not isinstance(case, dict) or case.get("source") != "own_post_comment":
                  continue
              result = case.get("research_result")
              if not isinstance(result, dict) or case.get("reply_queued"):
                  continue
              if case.get("outcome") not in (None, "research_returned"):
                  continue
              if result.get("evidence_status") not in ("multi_source_support", "partial_support"):
                  continue
              if not case.get("comment_id") or not case.get("target_id"):
                  continue
              conclusion = clean(result.get("conclusion"), 1800)
              sources = [x for x in (result.get("sources") or []) if isinstance(x, dict) and (x.get("url") or x.get("title"))]
              if len(conclusion) < 180 or len(sources) < 2:
                  continue
              if any(marker in conclusion.lower() for marker in REPLY_META_MARKERS):
                  continue
              reply_id = stable("action", case.get("case_id"), "comment_reply")
              if reply_id in resolved_action_ids or any(isinstance(a, dict) and a.get("action_id") == reply_id for a in runtime["pending_actions"]):
                  case["reply_queued"] = True
                  continue
              runtime["pending_actions"].append({
                  "action_id": reply_id, "case_id": case.get("case_id"), "kind": "comment_reply",
                  "target_id": case.get("target_id"), "comment_id": case.get("comment_id"),
                  "comment_author": case.get("comment_author", ""), "title": case.get("post_title", ""),
                  "conclusion": conclusion, "sources": sources[:4], "research_result": result,
                  "reason": "A research result answers a comment left on NØX's own post; reply in the thread.",
                  "created_at": NOW
              })
              case["decision"] = "comment_reply_after_research"
              case["action_kind"] = "comment_reply"
              case["reply_queued"] = True
              comment_replies_created += 1
              print(f"Comment reply queued: case={case.get('case_id')}")
          runtime["pending_actions"] = runtime["pending_actions"][-MAX_PENDING:]

          for case in memory.get("cognitive_cases", []):
              if publish_actions_created >= min(1, MAX_PUBLISH):
                  break
              if not isinstance(case, dict) or not case.get("research_result"):
                  continue
              if case.get("reply_queued"):
                  continue
              result = case["research_result"]
              status = result.get("evidence_status")
              if status not in ("multi_source_support", "partial_support"):
                  continue
              if case.get("source") not in ("for_you", "suggestion", "self_topic"):
                  continue
              if case.get("outcome") not in (None, "research_returned"):
                  continue

              conclusion = clean(result.get("conclusion"), 1800)
              # Public wording: NØX speaks for itself, never about "provided" excerpts.
              conclusion = re.sub(r"\b[Tt]he provided (excerpts|sources|snippets)\b", "The sources reviewed", conclusion)
              conclusion = re.sub(r"\b[Tt]he (excerpts|snippets)\b", "The sources reviewed", conclusion)
              sources = [x for x in (result.get("sources") or []) if isinstance(x, dict) and (x.get("url") or x.get("title"))]
              lower_conclusion = conclusion.lower()
              meta_markers = (
                  "search coverage", "source coverage", "coverage found",
                  "found relevant results", "relevant results across",
                  "evidence coverage", "search results found", "do not contain", "does not contain", "no information", "not address", "unrelated", "remains unresolved", "remain unresolved", "cannot be determined", "no relevant", "do not provide", "does not provide", "irrelevant", "not enough information", "insufficient evidence", "you provided"
              )
              # A publication needs a real bounded conclusion, not a statement
              # about the search process itself. This directly blocks the class
              # of incoherent post produced in the previous cycle.
              if len(conclusion) < 180:
                  continue
              if any(marker in lower_conclusion for marker in meta_markers):
                  continue
              if len(sources) < 2:
                  continue

              action_id = stable("action", case.get("case_id"), "publish")
              # Critical idempotency guard: this ID is deterministic per case.
              # If Presence already recorded any outcome for it, never enqueue
              # it again; otherwise Core and Presence form a permanent loop in
              # which Core recreates an action that Presence must suppress.
              if action_id in resolved_action_ids:
                  continue
              if any(isinstance(a, dict) and a.get("action_id") == action_id for a in runtime["pending_actions"]):
                  continue
              if publications_24h >= 3:
                  break

              source_lines = []
              for source in sources[:4]:
                  label = clean(source.get("title") or source.get("url"), 220)
                  url = clean(source.get("url"), 500)
                  if label and url:
                      source_lines.append(f"- {label}: {url}")
                  elif label:
                      source_lines.append(f"- {label}")

              title_text = clean(case.get("title") or "NØX research finding", 220)
              body_text = (
                  f"NØX research finding\n\n{conclusion}\n\n"
                  f"Evidence status: {status}.\n\n"
                  "This conclusion is bounded by the evidence currently available; it is not treated as universal proof.\n\n"
                  "Sources:\n" + "\n".join(source_lines)
              )
              runtime["pending_actions"].append({
                  "action_id": action_id, "case_id": case.get("case_id"), "kind": "publish",
                  "title": title_text, "body": body_text,
                  "colony": colony_for_case(case),
                  "reason": "Core judged the research conclusion sufficiently concrete, relevant and multi-source-supported for a public contribution.",
                  "research_result": result, "created_at": NOW
              })
              case["decision"] = "publish_after_research"
              case["action_kind"] = "publish"
              publish_actions_created += 1

          # If no research publication was selected this run, Core may also
          # publish one concrete, evidence-backed learning from its own observed
          # execution history. This keeps public presence alive without inventing
          # filler: the learning must already exist in memory with evidence.
          if publish_actions_created < min(1, MAX_PUBLISH) and publications_24h < 3:
              existing_publish_ids = {
                  a.get("action_id") for a in runtime.get("pending_actions", [])
                  if isinstance(a, dict) and a.get("kind") == "publish"
              }
              for learning in reversed(memory.get("learnings", [])):
                  if not isinstance(learning, dict):
                      continue
                  summary = clean(learning.get("summary"), 1200)
                  evidence = learning.get("evidence")
                  if len(summary) < 120 or not isinstance(evidence, dict) or not evidence:
                      continue
                  if clean(learning.get("source"), 100) in ("core_cycle", "colony_bootstrap"):
                      continue
                  learning_key = stable("learning_publish", learning.get("timestamp"), summary)
                  action_id = stable("action", learning_key, "publish")
                  if action_id in resolved_action_ids or action_id in existing_publish_ids:
                      continue
                  runtime["pending_actions"].append({
                      "action_id": action_id, "kind": "publish",
                      "title": "NØX learning from observed outcomes",
                      "body": (
                          "NØX observed a concrete outcome and recorded this learning:\n\n"
                          f"{summary}\n\n"
                          f"Evidence recorded: {clean(evidence, 900)}\n\n"
                          "This is a current working learning, not a universal claim. NØX will update it if later observations contradict it."
                      ),
                      "colony": DEFAULT_COLONY,
                      "reason": "Core selected an evidence-backed learning for public sharing to maintain useful presence.",
                      "learning": learning, "created_at": NOW
                  })
                  publish_actions_created += 1
                  break

          # Housekeeping: do not manufacture learnings. A learning requires
          # an observed result or a concrete failure.
          if cases:
              remember(memory,"observations","Core completed a decision cycle.",{"cases":len(cases),"new_work":len(new_work),"new_actions":len(new_actions)},"core_cycle")

          runtime["run_count"] = int(runtime.get("run_count",0)) + 1
          runtime["last_run"] = NOW
          own_comment_cases_taken = [c for c in cases if c["source"] == "own_post_comment"]
          runtime["last_cycle"] = {"cases":len(cases),"new_work":len(new_work),"new_actions":len(new_actions),"feed":len(feed),"notifications":len(notifications),"dms":len(messages),"own_post_comments":len(own_comment_cases_taken)}
          runtime["processed_post_ids"] = list(dict.fromkeys(runtime.get("processed_post_ids",[]) + [c["target_id"] for c in cases if c["source"]=="for_you" and c["target_id"]]))[-1000:]
          runtime["seen_event_ids"] = list(dict.fromkeys(runtime.get("seen_event_ids",[]) + [c["target_id"] for c in cases if c["source"] in ("notification","dm") and c["target_id"]]))[-1000:]
          # Comments handled this run (or judged trivial / already answered) are never reconsidered.
          newly_seen_comments = comment_ids_to_mark + [c["comment_id"] for c in own_comment_cases_taken if c.get("comment_id")]
          runtime["seen_comment_ids"] = list(dict.fromkeys(runtime.get("seen_comment_ids", []) + newly_seen_comments))[-2000:]
          # The first scan counts as done only if it could actually read the comment threads.
          if threads_ok > 0 or not own_posts:
              runtime["comment_scan_initialized"] = True

          memory_changed = json.dumps(memory, sort_keys=True, ensure_ascii=False) != memory_before
          runtime_changed = json.dumps({k: v for k, v in runtime.items() if k not in VOLATILE}, sort_keys=True, ensure_ascii=False) != runtime_before
          payout_changed = payout.get("status") != previous_payout_status
          if memory_changed or runtime_changed or payout_changed or not MEMORY_FILE.exists() or not RUNTIME_FILE.exists():
              save(MEMORY_FILE,memory)
              save(RUNTIME_FILE,runtime)
              print("State saved.")
          else:
              print("Idle cycle: nothing changed, state files left untouched (no commit).")

          print("=== NØX CORE GENERAL V8 ===")
          print(f"Feed={len(feed)} Notifications={len(notifications)} DMs={len(messages)} OwnPostComments={len(own_comment_cases_taken)} (posts scanned={len(own_posts)}, first_scan={first_comment_scan})")
          print(f"Action idempotency: terminal_outcomes={len(resolved_action_ids)}")
          print(f"Pending actions={len(runtime.get('pending_actions', []))} new_actions={len(new_actions)} new_work={len(new_work)} publication_retry={retry_created}")
          print(f"Lightning={payout.get('status')}")
          print("Cycle: OBSERVE -> UNDERSTAND -> RECALL -> DECIDE -> WORK/PRESENCE -> OBSERVE OUTCOME -> LEARN")
          PY

      - name: Commit Core state
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          for f in memory/nox_core_memory.json memory/nox_core_runtime.json; do
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 90000000 ]; then
              echo "SIZE SAFETY STOP: $f exceeds 90 MB, not committing."
              exit 1
            fi
          done
          git add memory/nox_core_memory.json memory/nox_core_runtime.json
          if git diff --cached --quiet; then
            echo "No Core changes."
            exit 0
          fi
          git commit -m "NØX: update cognitive core"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying."
            sleep $((attempt * 5))
          done
          echo "Push failed after 4 attempts."
          exit 1
