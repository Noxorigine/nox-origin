name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json

  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"
  MAX_PUBLISH_ACTIONS: "3"

  ENABLE_LIGHTNING_CHECK: "true"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import uuid
          from datetime import datetime, timezone

          from colony_sdk import ColonyClient

          MEMORY_FILE = os.environ["MEMORY_FILE"]
          RUNTIME_FILE = os.environ["RUNTIME_FILE"]
          WORK_FILE = os.environ["WORK_FILE"]
          PRESENCE_FILE = os.environ["PRESENCE_FILE"]
          LEGACY_MEMORY_FILE = os.environ["LEGACY_MEMORY_FILE"]

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CASES_PER_RUN = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_COGNITIVE_CASES = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_PENDING_ACTIONS = int(os.environ["MAX_PENDING_ACTIONS"])
          MAX_WORK_REQUESTS = int(os.environ["MAX_WORK_REQUESTS"])
          MAX_PUBLISH_ACTIONS = int(os.environ["MAX_PUBLISH_ACTIONS"])

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()
          RUN_ID = (
              f"core-{NOW.strftime('%Y%m%dT%H%M%SZ')}-"
              f"{uuid.uuid4().hex[:8]}"
          )

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Cannot read {path}: {exc}")
                  return default

          def atomic_write_json(path, value):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(directory, exist_ok=True)

              tmp = f"{path}.tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
                  f.write("\n")

              os.replace(tmp, path)

          def safe_list(value):
              return value if isinstance(value, list) else []

          def safe_dict(value):
              return value if isinstance(value, dict) else {}

          def text_of(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "content",
                      "body",
                      "text",
                      "message",
                      "description",
                      "title",
                  ):
                      if value.get(key):
                          return str(value[key])

              return str(value)

          def obj_get(obj, key, default=None):
              if isinstance(obj, dict):
                  return obj.get(key, default)

              return getattr(obj, key, default)

          def normalize_id(value):
              if value is None:
                  return None

              return str(value)

          def first_id(obj, *keys):
              for key in keys:
                  value = obj_get(obj, key)

                  if value is not None:
                      return normalize_id(value)

              return None

          def stable_id(prefix, *parts):
              raw = "|".join(
                  "" if part is None else str(part)
                  for part in parts
              )

              digest = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]

              return f"{prefix}-{digest}"

          def trim_list(items, limit):
              if not isinstance(items, list):
                  return []

              return items[-limit:]

          def unique_by_id(items):
              result = []
              seen = set()

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  ident = (
                      item.get("id")
                      or item.get("action_id")
                      or item.get("case_id")
                      or item.get("request_id")
                  )

                  if ident is None:
                      result.append(item)
                      continue

                  ident = str(ident)

                  if ident in seen:
                      continue

                  seen.add(ident)
                  result.append(item)

              return result

          def extract_items(value):
              if value is None:
                  return []

              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "posts",
                      "notifications",
                      "suggestions",
                      "messages",
                      "conversations",
                      "feed",
                  ):
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

              return []

          def call_method(client, method_name, *args, **kwargs):
              method = getattr(client, method_name, None)

              if method is None:
                  raise AttributeError(
                      f"ColonyClient has no method {method_name}"
                  )

              return method(*args, **kwargs)

          def get_field(obj, *names):
              for name in names:
                  value = obj_get(obj, name)

                  if value is not None:
                      return value

              return None

          memory = safe_dict(load_json(MEMORY_FILE, {}))
          runtime = safe_dict(load_json(RUNTIME_FILE, {}))
          work = safe_dict(load_json(WORK_FILE, {}))
          presence = safe_dict(load_json(PRESENCE_FILE, {}))

          if not memory:
              legacy = load_json(
                  LEGACY_MEMORY_FILE,
                  {},
              )

              if isinstance(legacy, dict):
                  memory = legacy

          memory.setdefault("observations", [])
          memory.setdefault("reported_information", [])
          memory.setdefault("facts", [])
          memory.setdefault("experiences", [])
          memory.setdefault("hypotheses", [])
          memory.setdefault("questions", [])
          memory.setdefault("tests", [])
          memory.setdefault("results", [])
          memory.setdefault("learnings", [])
          memory.setdefault("actions", [])
          memory.setdefault("web_queries", [])
          memory.setdefault("cognitive_cases", [])
          memory.setdefault("seen_event_ids", [])
          memory.setdefault("processed_post_ids", [])
          memory.setdefault("processed_notification_ids", [])
          memory.setdefault("processed_dm_ids", [])
          memory.setdefault("runs", [])
          memory.setdefault("run_count", 0)

          runtime.setdefault("pending_actions", [])
          runtime.setdefault("work_requests", [])
          runtime.setdefault("web_queries", [])
          runtime.setdefault("last_run", None)
          runtime.setdefault("run_count", 0)

          work.setdefault("pending", [])
          work.setdefault("history", [])
          work.setdefault("results", [])
          work.setdefault("run_count", 0)

          presence.setdefault("outcomes", [])
          presence.setdefault("actions", [])
          presence.setdefault("runs", [])

          memory["run_count"] = int(
              memory.get("run_count", 0)
          ) + 1

          runtime["run_count"] = int(
              runtime.get("run_count", 0)
          ) + 1

          work["run_count"] = int(
              work.get("run_count", 0)
          ) + 1

          print(f"=== NØX CORE {RUN_ID} ===")

          client = ColonyClient()

          # ----------------------------------------------------------
          # Colony bootstrap
          # ----------------------------------------------------------

          try:
              bootstrap = getattr(
                  client,
                  "bootstrap",
                  None,
              )

              if bootstrap is not None:
                  try:
                      bootstrap()
                      print("[OK] Colony bootstrap")
                  except Exception as exc:
                      print(
                          f"[WARN] Bootstrap failed: {exc}"
                      )

          except Exception as exc:
              print(
                  f"[WARN] Bootstrap inspection failed: {exc}"
              )

          # ----------------------------------------------------------
          # Lightning status
          # ----------------------------------------------------------

          if os.environ.get(
              "ENABLE_LIGHTNING_CHECK",
              "true",
          ).lower() == "true":

              try:
                  payout = getattr(
                      client,
                      "get_payout_status",
                      None,
                  )

                  if payout is not None:
                      payout_status = payout()

                      runtime["lightning"] = {
                          "checked_at": NOW_ISO,
                          "status": text_of(
                              payout_status
                          )[:1000],
                      }

                      print(
                          "[OK] Lightning status checked"
                      )

                  else:
                      runtime["lightning"] = {
                          "checked_at": NOW_ISO,
                          "status": "method_unavailable",
                      }

                      print(
                          "[INFO] Lightning status "
                          "method unavailable"
                      )

              except Exception as exc:
                  runtime["lightning"] = {
                      "checked_at": NOW_ISO,
                      "status": "error",
                      "error": str(exc)[:500],
                  }

                  print(
                      f"[WARN] Lightning check failed: {exc}"
                  )

          # ----------------------------------------------------------
          # Colony observations
          # ----------------------------------------------------------

          feed = []
          notifications = []
          suggestions = []
          conversations = []
          dms = []

          try:
              result = call_method(
                  client,
                  "get_for_you_feed",
                  max_results=MAX_FEED_ITEMS,
              )

              feed = extract_items(result)[
                  :MAX_FEED_ITEMS
              ]

          except TypeError:

              try:
                  result = call_method(
                      client,
                      "get_for_you_feed",
                  )

                  feed = extract_items(result)[
                      :MAX_FEED_ITEMS
                  ]

              except Exception as exc:
                  print(
                      f"[WARN] Feed failed: {exc}"
                  )

          except Exception as exc:
              print(
                  f"[WARN] Feed failed: {exc}"
              )

          try:
              method = getattr(
                  client,
                  "get_notifications",
                  None,
              )

              if method is not None:
                  try:
                      result = method(
                          max_results=MAX_NOTIFICATIONS
                      )
                  except TypeError:
                      result = method()

                  notifications = extract_items(
                      result
                  )[:MAX_NOTIFICATIONS]

          except Exception as exc:
              print(
                  f"[WARN] Notifications failed: {exc}"
              )

          try:
              method = getattr(
                  client,
                  "get_suggestions",
                  None,
              )

              if method is not None:
                  try:
                      result = method(
                          max_results=MAX_SUGGESTIONS
                      )
                  except TypeError:
                      result = method()

                  suggestions = extract_items(
                      result
                  )[:MAX_SUGGESTIONS]

          except Exception as exc:
              print(
                  f"[WARN] Suggestions failed: {exc}"
              )

          # ----------------------------------------------------------
          # Direct message inspection
          # ----------------------------------------------------------

          try:
              iterator = getattr(
                  client,
                  "iter_conversations",
                  None,
              )

              if iterator is not None:
                  conversations = list(
                      iterator(max_results=50)
                  )[:50]

                  get_conversation = getattr(
                      client,
                      "get_conversation",
                      None,
                  )

                  if get_conversation is not None:

                      for conversation in conversations:
                          conversation_id = first_id(
                              conversation,
                              "id",
                              "conversation_id",
                          )

                          if not conversation_id:
                              continue

                          try:
                              detail = get_conversation(
                                  conversation_id
                              )

                              messages = extract_items(
                                  detail
                              )

                              for message in messages:
                                  dms.append(message)

                                  if len(dms) >= MAX_DMS:
                                      break

                          except Exception as exc:
                              print(
                                  "[WARN] Conversation "
                                  f"{conversation_id} failed: "
                                  f"{exc}"
                              )

                          if len(dms) >= MAX_DMS:
                              break

          except Exception as exc:
              print(
                  f"[WARN] DM inspection failed: {exc}"
              )

          print(
              f"Feed={len(feed)} "
              f"Notifications={len(notifications)} "
              f"Suggestions={len(suggestions)} "
              f"DMs={len(dms)}"
          )

          # ----------------------------------------------------------
          # Existing state
          # ----------------------------------------------------------

          seen_event_ids = set(
              str(x)
              for x in safe_list(
                  memory.get("seen_event_ids")
              )
          )

          processed_posts = set(
              str(x)
              for x in safe_list(
                  memory.get("processed_post_ids")
              )
          )

          processed_notifications = set(
              str(x)
              for x in safe_list(
                  memory.get(
                      "processed_notification_ids"
                  )
              )
          )

          processed_dms = set(
              str(x)
              for x in safe_list(
                  memory.get("processed_dm_ids")
              )
          )

          cognitive_cases = safe_list(
              memory.get("cognitive_cases")
          )

          pending_actions = unique_by_id(
              safe_list(
                  runtime.get("pending_actions")
              )
          )

          work_requests = unique_by_id(
              safe_list(
                  runtime.get("work_requests")
              )
          )

          def add_observation(
              kind,
              source,
              subject,
              data=None,
          ):
              observation = {
                  "id": stable_id(
                      "obs",
                      RUN_ID,
                      kind,
                      source,
                      subject,
                  ),
                  "timestamp": NOW_ISO,
                  "kind": kind,
                  "source": source,
                  "subject": subject,
                  "data": data or {},
              }

              memory["observations"].append(
                  observation
              )

          def add_case(case):
              case_id = case["id"]

              if any(
                  str(existing.get("id"))
                  == str(case_id)
                  for existing in cognitive_cases
                  if isinstance(existing, dict)
              ):
                  return False

              cognitive_cases.append(case)

              return True

          def add_work_request(case, reason):
              case_id = case["id"]

              if any(
                  str(item.get("request_id"))
                  == str(case_id)
                  for item in work_requests
                  if isinstance(item, dict)
              ):
                  return False

              request = {
                  "request_id": case_id,
                  "case_id": case_id,
                  "created_at": NOW_ISO,
                  "question": case.get(
                      "question",
                      "",
                  ),
                  "reason": reason,
                  "status": "pending",
                  "priority": case.get(
                      "priority",
                      "normal",
                  ),
              }

              work_requests.append(request)

              return True

          def add_action(action):
              action_id = action.get("action_id")

              if not action_id:
                  return False

              for existing in pending_actions:
                  if (
                      str(existing.get("action_id"))
                      == str(action_id)
                  ):
                      return False

              for existing in memory["actions"]:
                  if (
                      isinstance(existing, dict)
                      and str(
                          existing.get("action_id")
                      ) == str(action_id)
                  ):
                      return False

              pending_actions.append(action)

              memory["actions"].append(
                  {
                      "action_id": action_id,
                      "created_at": NOW_ISO,
                      "type": action.get("type"),
                      "status": "planned",
                      "target_id": action.get(
                          "target_id"
                      ),
                      "case_id": action.get(
                          "case_id"
                      ),
                  }
              )

              return True

          # ----------------------------------------------------------
          # Feed processing
          # ----------------------------------------------------------

          new_feed = 0
          cases_created = 0

          for item in feed:

              if cases_created >= MAX_CASES_PER_RUN:
                  break

              post_id = first_id(
                  item,
                  "id",
                  "post_id",
              )

              if not post_id:
                  continue

              if post_id in processed_posts:
                  continue

              processed_posts.add(post_id)
              new_feed += 1

              author = get_field(
                  item,
                  "author",
                  "user",
                  "creator",
              )

              author_id = first_id(
                  author,
                  "id",
                  "user_id",
              )

              author_name = get_field(
                  author,
                  "username",
                  "name",
                  "handle",
              )

              title = text_of(
                  get_field(
                      item,
                      "title",
                  )
              )

              body = text_of(
                  get_field(
                      item,
                      "body",
                      "content",
                      "text",
                  )
              )

              content = (
                  f"{title}\n{body}"
                  if title
                  else body
              ).strip()

              add_observation(
                  "feed_post",
                  "colony",
                  post_id,
                  {
                      "author_id": author_id,
                      "author": author_name,
                      "content": content[:2000],
                  },
              )

              text_lower = content.lower()

              is_question = (
                  "?" in content
                  or any(
                      marker in text_lower
                      for marker in (
                          "how do",
                          "how can",
                          "why ",
                          "what is",
                          "does ",
                          "can an agent",
                          "can agents",
                      )
                  )
              )

              is_evidence_claim = any(
                  marker in text_lower
                  for marker in (
                      "i tested",
                      "we tested",
                      "works",
                      "doesn't work",
                      "failed",
                      "succeeded",
                      "verified",
                      "confirmed",
                      "according to",
                      "documentation says",
                  )
              )

              if not (
                  is_question
                  or is_evidence_claim
              ):
                  continue

              case_type = (
                  "public_question"
                  if is_question
                  else "evidence_claim"
              )

              case_id = stable_id(
                  "case",
                  "post",
                  post_id,
                  content[:1000],
              )

              case = {
                  "id": case_id,
                  "created_at": NOW_ISO,
                  "updated_at": NOW_ISO,
                  "type": case_type,
                  "source": "feed",
                  "source_id": post_id,
                  "target_id": post_id,
                  "author_id": author_id,
                  "author": author_name,
                  "question": content[:3000],
                  "context": {
                      "title": title,
                      "body": body[:3000],
                  },
                  "status": "needs_research",
                  "priority": (
                      "high"
                      if case_type
                      == "public_question"
                      else "normal"
                  ),
              }

              if add_case(case):
                  add_work_request(
                      case,
                      "public_question_or_evidence",
                  )

                  cases_created += 1

          # ----------------------------------------------------------
          # Notifications
          # ----------------------------------------------------------

          for notification in notifications:

              notification_id = first_id(
                  notification,
                  "id",
                  "notification_id",
              )

              if not notification_id:
                  continue

              if (
                  notification_id
                  in processed_notifications
              ):
                  continue

              processed_notifications.add(
                  notification_id
              )

              add_observation(
                  "notification",
                  "colony",
                  notification_id,
                  {
                      "content": text_of(
                          notification
                      )[:1500],
                  },
              )

          # ----------------------------------------------------------
          # Direct messages
          # ----------------------------------------------------------

          for message in dms:

              message_id = first_id(
                  message,
                  "id",
                  "message_id",
              )

              if not message_id:
                  continue

              if message_id in processed_dms:
                  continue

              processed_dms.add(message_id)

              sender = get_field(
                  message,
                  "sender",
                  "author",
                  "from_user",
              )

              sender_id = first_id(
                  sender,
                  "id",
                  "user_id",
              )

              sender_name = get_field(
                  sender,
                  "username",
                  "name",
                  "handle",
              )

              body = text_of(
                  get_field(
                      message,
                      "body",
                      "content",
                      "text",
                      "message",
                  )
              ).strip()

              add_observation(
                  "direct_message",
                  "colony",
                  message_id,
                  {
                      "sender_id": sender_id,
                      "sender": sender_name,
                      "content": body[:3000],
                  },
              )

              if not body:
                  continue

              case_id = stable_id(
                  "case",
                  "dm",
                  message_id,
              )

              case = {
                  "id": case_id,
                  "created_at": NOW_ISO,
                  "updated_at": NOW_ISO,
                  "type": "dm_question",
                  "source": "dm",
                  "source_id": message_id,
                  "target_id": sender_id,
                  "author_id": sender_id,
                  "author": sender_name,
                  "question": body[:3000],
                  "context": {
                      "message_id": message_id,
                  },
                  "status": "needs_research",
                  "priority": "high",
              }

              if add_case(case):
                  add_work_request(
                      case,
                      "direct_message",
                  )

          # ----------------------------------------------------------
          # Consume Work Factory results
          # ----------------------------------------------------------

          history = safe_list(
              work.get("history")
          )

          results = safe_list(
              work.get("results")
          )

          all_research_results = (
              history + results
          )

          research_by_request = {}

          for result in all_research_results:

              if not isinstance(result, dict):
                  continue

              request_id = (
                  result.get("request_id")
                  or result.get("case_id")
                  or result.get("id")
              )

              if request_id:
                  research_by_request[
                      str(request_id)
                  ] = result

          consumed_results = 0

          for case in cognitive_cases:

              if not isinstance(case, dict):
                  continue

              case_id = str(
                  case.get("id", "")
              )

              if not case_id:
                  continue

              result = research_by_request.get(
                  case_id
              )

              if not result:
                  continue

              evidence_status = result.get(
                  "evidence_status",
                  "unknown",
              )

              if evidence_status not in (
                  "multi_source_support",
                  "partial_support",
                  "insufficient_verification",
                  "no_evidence",
              ):
                  continue

              case["research"] = {
                  "consumed_at": NOW_ISO,
                  "evidence_status": (
                      evidence_status
                  ),
                  "facts": safe_list(
                      result.get("facts")
                  ),
                  "sources": safe_list(
                      result.get("sources")
                  ),
                  "uncertainties": safe_list(
                      result.get("uncertainties")
                  ),
                  "conflicts": safe_list(
                      result.get("conflicts")
                  ),
                  "conclusion": text_of(
                      result.get("conclusion")
                  )[:5000],
              }

              case["updated_at"] = NOW_ISO
              case["status"] = (
                  "research_complete"
              )

              consumed_results += 1

          # ----------------------------------------------------------
          # Consume Presence outcomes
          # ----------------------------------------------------------

          outcomes = safe_list(
              presence.get("outcomes")
          )

          consumed_outcomes = 0
          outcome_by_action = {}

          for outcome in outcomes:

              if not isinstance(outcome, dict):
                  continue

              action_id = outcome.get(
                  "action_id"
              )

              if action_id:
                  outcome_by_action[
                      str(action_id)
                  ] = outcome

          remaining_actions = []

          for action in pending_actions:

              if not isinstance(action, dict):
                  continue

              action_id = action.get(
                  "action_id"
              )

              if not action_id:
                  continue

              outcome = outcome_by_action.get(
                  str(action_id)
              )

              if outcome is None:
                  remaining_actions.append(
                      action
                  )
                  continue

              consumed_outcomes += 1

              status = outcome.get(
                  "status",
                  "unknown",
              )

              for memory_action in memory[
                  "actions"
              ]:

                  if (
                      isinstance(
                          memory_action,
                          dict,
                      )
