name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_memory.json

  MAX_FEED_ITEMS: "20"
  MAX_NOTIFICATIONS: "20"
  MAX_CASES: "100"
  MAX_ACTIONS: "100"
  MAX_WORK_REQUESTS: "50"
  MAX_HISTORY: "150"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  core:
    name: core
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Verify Colony SDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from colony_sdk import ColonyClient
          import colony_sdk

          print("Colony SDK import: OK")
          print("Colony SDK module:", colony_sdk.__file__)
          print("ColonyClient:", ColonyClient)
          PY

      - name: Run NØX Core
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          print("=== NØX CORE ===")

          now = datetime.now(timezone.utc)
          run_id = "core-" + now.strftime("%Y%m%dT%H%M%SZ")
          print("RUN:", run_id)

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: cannot load {path}: {exc}")
                  return default

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
                  f.write("\n")

              tmp.replace(path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def get(obj, key, default=None):
              if isinstance(obj, dict):
                  return obj.get(key, default)
              return default

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "content",
                      "body",
                      "text",
                      "message",
                      "title",
                  ):
                      if value.get(key):
                          return text(value[key])

              return str(value).strip()

          def ident(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in (
                  "id",
                  "post_id",
                  "comment_id",
                  "message_id",
                  "conversation_id",
                  "username",
                  "slug",
              ):
                  value = obj.get(key)

                  if value is not None and str(value).strip():
                      return str(value)

              return ""

          def make_id(prefix, *values):
              raw = "|".join(str(v or "") for v in values)

              safe = re.sub(
                  r"[^A-Za-z0-9_.:-]+",
                  "-",
                  raw,
              )

              return f"{prefix}:{safe[:180]}"

          def items(value):
              if value is None:
                  return []

              if isinstance(value, list):
                  return value

              if isinstance(value, tuple):
                  return list(value)

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "posts",
                      "notifications",
                      "messages",
                  ):
                      if isinstance(value.get(key), list):
                          return value[key]

              try:
                  return list(value)
              except Exception:
                  return []

          memory = as_dict(load(MEMORY_FILE, {}))
          runtime = as_dict(load(RUNTIME_FILE, {}))
          work = as_dict(load(WORK_FILE, {}))
          presence = as_dict(load(PRESENCE_FILE, {}))

          memory.setdefault("observations", [])
          memory.setdefault("facts", [])
          memory.setdefault("experiences", [])
          memory.setdefault("hypotheses", [])
          memory.setdefault("questions", [])
          memory.setdefault("results", [])
          memory.setdefault("learnings", [])
          memory.setdefault("sources", [])
          memory.setdefault("actions", [])
          memory.setdefault("cognitive_cases", [])

          runtime.setdefault("run_count", 0)
          runtime.setdefault("observations", [])
          runtime.setdefault("decisions", [])
          runtime.setdefault("pending_actions", [])
          runtime.setdefault("work_requests", [])
          runtime.setdefault("processed_ids", [])
          runtime.setdefault("web_queries", [])
          runtime.setdefault("last_run", None)

          work.setdefault("pending", [])
          work.setdefault("history", [])
          work.setdefault("results", [])

          presence.setdefault("outcomes", [])

          runtime["run_count"] = int(
              runtime.get("run_count", 0)
          ) + 1

          runtime["last_run"] = now.isoformat()

          api_key = os.environ.get(
              "COLONY_API_KEY",
              "",
          ).strip()

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing. "
                  "Add the GitHub Actions secret COLONY_API_KEY."
              )

          # Official Colony SDK module.
          from colony_sdk import ColonyClient

          # API key is required by ColonyClient.
          client = ColonyClient(api_key)

          print("ColonyClient initialized")

          def call(method_name, *args, **kwargs):
              method = getattr(client, method_name, None)

              if method is None:
                  print(
                      f"WARNING: SDK method unavailable: "
                      f"{method_name}"
                  )
                  return None

              try:
                  return method(*args, **kwargs)

              except TypeError:
                  try:
                      return method(*args)
                  except Exception as exc:
                      print(
                          f"WARNING: {method_name} failed: "
                          f"{exc}"
                      )
                      return None

              except Exception as exc:
                  print(
                      f"WARNING: {method_name} failed: "
                      f"{exc}"
                  )
                  return None

          bootstrap = getattr(
              client,
              "bootstrap",
              None,
          )

          if callable(bootstrap):
              try:
                  bootstrap()
                  print("Bootstrap: OK")
              except Exception as exc:
                  print(
                      "WARNING: bootstrap failed:",
                      exc,
                  )

          observations = []
          cognitive_cases = []
          new_work = []
          new_actions = []

          processed_ids = set(
              str(x)
              for x in as_list(
                  runtime.get("processed_ids")
              )
              if x is not None
          )

          pending_action_ids = set(
              str(get(x, "action_id", ""))
              for x in as_list(
                  runtime.get("pending_actions")
              )
              if get(x, "action_id")
          )

          def add_observation(
              kind,
              source,
              value,
              **extra,
          ):
              obs = {
                  "id": make_id(
                      "obs",
                      run_id,
                      kind,
                      source,
                  ),
                  "timestamp": now.isoformat(),
                  "type": kind,
                  "source": source,
                  "value": value,
              }

              obs.update(extra)

              observations.append(obs)
              memory["observations"].append(obs)

              return obs

          def add_case(
              case_type,
              source,
              target_id="",
              question="",
              **extra,
          ):
              case = {
                  "id": make_id(
                      "case",
                      run_id,
                      case_type,
                      target_id,
                      question,
                  ),
                  "timestamp": now.isoformat(),
                  "type": case_type,
                  "source": source,
                  "target_id": target_id,
                  "question": question,
                  "status": "open",
              }

              case.update(extra)

              cognitive_cases.append(case)
              memory["cognitive_cases"].append(case)

              return case

          def add_work(
              case,
              query,
              reason,
          ):
              work_id = make_id(
                  "work",
                  case.get("id"),
                  query,
              )

              existing = set()

              for entry in as_list(
                  runtime.get("work_requests")
              ):
                  if isinstance(entry, dict):
                      existing.add(
                          str(entry.get("work_id", ""))
                      )

              for entry in as_list(
                  work.get("pending")
              ):
                  if isinstance(entry, dict):
                      existing.add(
                          str(entry.get("work_id", ""))
                      )

              for entry in as_list(
                  work.get("history")
              ):
                  if isinstance(entry, dict):
                      existing.add(
                          str(entry.get("work_id", ""))
                      )

              if work_id in existing:
                  return None

              request = {
                  "work_id": work_id,
                  "case_id": case.get("id"),
                  "created_at": now.isoformat(),
                  "status": "pending",
                  "question": query,
                  "reason": reason,
                  "source": "core",
              }

              runtime["work_requests"].append(
                  request
              )

              work["pending"].append(request)
              new_work.append(request)

              return request

          def add_action(
              action_type,
              target_id="",
              body="",
              recipient="",
              source_case="",
              metadata=None,
          ):
              action_id = make_id(
                  "action",
                  action_type,
                  target_id,
                  recipient,
                  body[:120],
              )

              if action_id in pending_action_ids:
                  return None

              action = {
                  "action_id": action_id,
                  "created_at": now.isoformat(),
                  "status": "pending",
                  "type": action_type,
                  "target_id": target_id,
                  "body": body,
                  "recipient": recipient,
                  "source_case": source_case,
                  "attempts": 0,
              }

              if isinstance(metadata, dict):
                  action["metadata"] = metadata

              runtime["pending_actions"].append(
                  action
              )

              memory["actions"].append(action)
              new_actions.append(action)

              pending_action_ids.add(action_id)

              return action

          # ============================================================
          # FEED
          # ============================================================

          feed = call(
              "get_for_you_feed",
              limit=int(
                  os.environ["MAX_FEED_ITEMS"]
              ),
          )

          feed_items = items(feed)[
              : int(os.environ["MAX_FEED_ITEMS"])
          ]

          print("Feed:", len(feed_items))

          for post in feed_items:
              if not isinstance(post, dict):
                  continue

              post_id = ident(post)

              if not post_id:
                  continue

              author = get(post, "author", {})

              author_name = (
                  text(get(author, "username"))
                  or text(get(post, "username"))
                  or text(
                      get(
                          post,
                          "author_username",
                      )
                  )
              )

              title = text(
                  get(post, "title")
              )

              body = text(
                  get(post, "body")
                  or get(post, "content")
                  or get(post, "text")
              )

              add_observation(
                  "feed_item",
                  "colony",
                  {
                      "post_id": post_id,
                      "author": author_name,
                      "title": title,
                  },
              )

              if post_id in processed_ids:
                  continue

              combined = (
                  f"{title}\n{body}"
              ).strip()

              lowered = combined.lower()

              question_markers = (
                  "how ",
                  "what ",
                  "why ",
                  "can ",
                  "does ",
                  "should ",
                  "would ",
                  "is ",
                  "are ",
              )

              is_question = (
                  "?" in combined
                  or any(
                      lowered.startswith(marker)
                      for marker in question_markers
                  )
              )

              if is_question and body:
                  case = add_case(
                      "public_question",
                      "feed",
                      post_id,
                      combined[:2000],
                      author=author_name,
                  )

                  add_work(
                      case,
                      combined[:2000],
                      "Public feed question requires evidence before response.",
                  )

              processed_ids.add(post_id)

          # ============================================================
          # NOTIFICATIONS
          # ============================================================

          notifications = call(
              "get_notifications"
          )

          notification_items = items(
              notifications
          )[: int(
              os.environ["MAX_NOTIFICATIONS"]
          )]

          print(
              "Notifications:",
              len(notification_items),
          )

          for notification in notification_items:
              if not isinstance(
                  notification,
                  dict,
              ):
                  continue

              notification_id = ident(
                  notification
              )

              if notification_id:
                  add_observation(
                      "notification",
                      "colony",
                      {
                          "id": notification_id,
                          "type": text(
                              get(
                                  notification,
                                  "type",
                              )
                          ),
                          "text": text(
                              notification
                          ),
                      },
                  )

          # ============================================================
          # DIRECT MESSAGES
          # ============================================================

          conversations = call(
              "iter_conversations"
          )

          conversation_items = items(
              conversations
          )

          dm_count = 0

          for conversation in conversation_items:
              if dm_count >= int(
                  os.environ["MAX_NOTIFICATIONS"]
              ):
                  break

              if isinstance(
                  conversation,
                  dict,
              ):
                  conversation_id = ident(
                      conversation
                  )
              else:
                  conversation_id = str(
                      conversation
                  )

              if not conversation_id:
                  continue

              conversation_data = call(
                  "get_conversation",
                  conversation_id,
              )

              messages = items(
                  conversation_data
              )

              for message in messages:
                  if not isinstance(
                      message,
                      dict,
                  ):
                      continue

                  message_id = ident(message)

                  if not message_id:
                      continue

                  if message_id in processed_ids:
                      continue

                  sender = get(
                      message,
                      "sender",
                      {},
                  )

                  sender_name = (
                      text(
                          get(
                              sender,
                              "username",
                          )
                      )
                      or text(
                          get(
                              message,
                              "sender_username",
                          )
                      )
                      or text(
                          get(
                              message,
                              "from",
                          )
                      )
                  )

                  body = text(
                      get(message, "body")
                      or get(message, "content")
                      or get(message, "text")
                  )

                  if not body:
                      continue

                  add_observation(
                      "direct_message",
                      "colony",
                      {
                          "message_id": message_id,
                          "conversation_id": conversation_id,
                          "sender": sender_name,
                          "body": body[:2000],
                      },
                  )

                  case = add_case(
                      "dm",
                      "conversation",
                      conversation_id,
                      body[:2000],
                      message_id=message_id,
                      sender=sender_name,
                  )

                  add_work(
                      case,
                      body[:2000],
                      "Incoming direct message requires contextual reasoning before reply.",
                  )

                  processed_ids.add(
                      message_id
                  )

                  dm_count += 1

          print("DMs:", dm_count)

          # ============================================================
          # WORK FACTORY RESULTS
          # ============================================================

          results = as_list(
              work.get("results")
          )

          consumed_results = 0

          for result in results[
              -int(os.environ["MAX_HISTORY"]):
          ]:
              if not isinstance(
                  result,
                  dict,
              ):
                  continue

              status = text(
                  get(
                      result,
                      "evidence_status",
                  )
              )

              if status not in (
                  "multi_source_support",
                  "partial_support",
              ):
                  continue

              case_id = text(
                  get(result, "case_id")
              )

              conclusion = text(
                  get(result, "conclusion")
              )

              if not case_id or not conclusion:
                  continue

              consumed_key = make_id(
                  "result",
                  case_id,
                  conclusion[:100],
              )

              if consumed_key in processed_ids:
                  continue

              case = None

              for candidate in reversed(
                  as_list(
                      memory.get(
                          "cognitive_cases"
                      )
                  )
              ):
                  if (
                      isinstance(
                          candidate,
                          dict,
                      )
                      and str(
                          candidate.get(
                              "id",
                              "",
                          )
                      ) == case_id
                  ):
                      case = candidate
                      break

              if case is None:
                  continue

              case["status"] = (
                  "research_complete"
              )

              case["result_id"] = text(
                  get(
                      result,
                      "result_id",
                  )
              )

              case["evidence_status"] = (
                  status
              )

              case["conclusion"] = (
                  conclusion
              )

              case["reply_text"] = (
                  conclusion
              )

              case_type = text(
                  get(case, "type")
              )

              target_id = text(
                  get(case, "target_id")
              )

              sender = text(
                  get(case, "sender")
              )

              if case_type == "dm":
                  add_action(
                      "dm_reply",
                      target_id=target_id,
                      body=conclusion,
                      recipient=sender,
                      source_case=case_id,
                      metadata={
                          "message_id": get(
                              case,
                              "message_id",
                          ),
                          "evidence_status": status,
                      },
                  )

              elif case_type in (
                  "public_question",
                  "evidence_claim",
              ):
                  add_action(
                      "reply",
                      target_id=target_id,
                      body=conclusion,
                      source_case=case_id,
                      metadata={
                          "evidence_status": status,
                      },
                  )

              memory["results"].append(
                  {
                      "id": consumed_key,
                      "timestamp": now.isoformat(),
                      "case_id": case_id,
                      "status": status,
                      "conclusion": conclusion,
                  }
              )

              processed_ids.add(
                  consumed_key
              )

              consumed_results += 1

          print(
              "Research results consumed:",
              consumed_results,
          )

          # ============================================================
          # PRESENCE OUTCOMES
          # ============================================================

          outcomes = as_list(
              presence.get("outcomes")
          )

          consumed_outcomes = 0

          for outcome in outcomes[
              -int(os.environ["MAX_HISTORY"]):
          ]:
              if not isinstance(
                  outcome,
                  dict,
              ):
                  continue

              outcome_id = ident(
                  outcome
              )

              if (
                  not outcome_id
                  or outcome_id in processed_ids
              ):
                  continue

              action_id = text(
                  get(
                      outcome,
                      "action_id",
                  )
              )

              status = text(
                  get(
                      outcome,
                      "status",
                  )
              )

              if not action_id:
                  continue

              add_observation(
                  "presence_outcome",
                  "presence",
                  {
                      "action_id": action_id,
                      "status": status,
                      "error": text(
                          get(
                              outcome,
                              "error",
                          )
                      ),
                  },
              )

              memory["experiences"].append(
                  {
                      "id": make_id(
                          "experience",
                          outcome_id,
                      ),
                      "timestamp": now.isoformat(),
                      "type": "action_outcome",
                      "action_id": action_id,
                      "status": status,
                      "error": text(
                          get(
                              outcome,
                              "error",
                          )
                      ),
                  }
              )

              processed_ids.add(
                  outcome_id
              )

              consumed_outcomes += 1

          print(
              "Presence outcomes consumed:",
              consumed_outcomes,
          )

          # ============================================================
          # RUNTIME DECISIONS
          # ============================================================

          if observations:
              runtime[
                  "observations"
              ].extend(observations)

          if cognitive_cases:
              runtime[
                  "decisions"
              ].extend(
                  {
                      "timestamp": now.isoformat(),
                      "case_id": case["id"],
                      "decision": "research",
                      "reason": case.get(
                          "question",
                          "",
                      ),
                  }
                  for case in cognitive_cases
              )

          # ============================================================
          # BOUNDS
          # ============================================================

          def bound_list(
              obj,
              key,
              limit,
          ):
              value = as_list(
                  obj.get(key)
              )

              if len(value) > limit:
                  obj[key] = value[-limit:]

          bound_list(
              memory,
              "observations",
              500,
          )

          bound_list(
              memory,
              "cognitive_cases",
              int(
                  os.environ["MAX_CASES"]
              ),
          )

          bound_list(
              memory,
              "actions",
              int(
                  os.environ["MAX_ACTIONS"]
              ),
          )

          bound_list(
              memory,
              "experiences",
              300,
          )

          bound_list(
              memory,
              "results",
              300,
          )

          bound_list(
              memory,
              "facts",
              300,
          )

          bound_list(
              memory,
              "hypotheses",
              200,
          )

          bound_list(
              memory,
              "questions",
              200,
          )

          bound_list(
              memory,
              "learnings",
              300,
          )

          bound_list(
              memory,
              "sources",
              300,
          )

          bound_list(
              runtime,
              "observations",
              500,
          )

          bound_list(
              runtime,
              "decisions",
              500,
          )

          bound_list(
              runtime,
              "pending_actions",
              int(
                  os.environ["MAX_ACTIONS"]
              ),
          )

          bound_list(
              runtime,
              "work_requests",
              int(
                  os.environ["MAX_WORK_REQUESTS"]
              ),
          )

          bound_list(
              runtime,
              "processed_ids",
              2000,
          )

          # ============================================================
          # FINANCIAL SAFETY
          # ============================================================

          forbidden = (
              "payment",
              "pay",
              "spend",
              "invoice",
              "withdraw",
          )

          for action in runtime[
              "pending_actions"
          ]:
              if not isinstance(
                  action,
                  dict,
              ):
                  continue

              action_type = text(
                  get(action, "type")
              ).lower()

              if any(
                  token in action_type
                  for token in forbidden
              ):
                  raise RuntimeError(
                      "Forbidden financial action "
                      f"generated by Core: {action_type}"
                  )

          # ============================================================
          # SUMMARY
          # ============================================================

          runtime["last_summary"] = {
              "run_id": run_id,
              "timestamp": now.isoformat(),
              "feed": len(feed_items),
              "notifications": len(
                  notification_items
              ),
              "dms": dm_count,
              "cases_created": len(
                  cognitive_cases
              ),
              "new_work": len(new_work),
              "new_actions": len(new_actions),
              "research_results_consumed": (
                  consumed_results
              ),
              "presence_outcomes_consumed": (
                  consumed_outcomes
              ),
          }

          save(
              MEMORY_FILE,
              memory,
          )

          save(
              RUNTIME_FILE,
              runtime,
          )

          save(
              WORK_FILE,
              work,
          )

          save(
              PRESENCE_FILE,
              presence,
          )

          print()
          print("=== CORE SUMMARY ===")
          print("RUN:", run_id)
          print("Feed:", len(feed_items))
          print(
              "Notifications:",
              len(notification_items),
          )
          print("DMs:", dm_count)
          print(
              "Cases:",
              len(cognitive_cases),
          )
          print(
              "New work:",
              len(new_work),
          )
          print(
              "New actions:",
              len(new_actions),
          )
          print(
              "Research results consumed:",
              consumed_results,
          )
          print(
              "Presence outcomes consumed:",
              consumed_outcomes,
          )
          print(
              "Policy: no payments / no spending"
          )
          print("=== CORE COMPLETE ===")
          PY

      - name: Validate state files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "memory/nox_core_memory.json",
              "memory/nox_core_runtime.json",
              "memory/nox_work_factory.json",
              "memory/nox_colony_presence.json",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Missing state file: {filename}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  json.load(f)

              print("VALID:", filename)

          print(
              "All Core state files valid."
          )
          PY

      - name: Commit and push state
        shell: bash
        run: |
          set -euo pipefail

          git add \
            memory/nox_core_memory.json \
            memory/nox_core_runtime.json \
            memory/nox_work_factory.json \
            memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "chore(nox): update core state"

          git pull --rebase origin main

          git push origin HEAD:main
