name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: "memory/nox_core_memory.json"
  CORE_RUNTIME_FILE: "memory/nox_core_runtime.json"
  WORK_FILE: "memory/nox_work_factory.json"
  PRESENCE_FILE: "memory/nox_colony_presence.json"

  MAX_FEED_ITEMS: "20"
  MAX_NOTIFICATIONS: "20"
  MAX_CONVERSATIONS: "10"
  MAX_NEW_CASES_PER_RUN: "5"
  DM_MAX_AGE_HOURS: "72"
  MAX_CASES: "100"
  MAX_ACTIONS: "100"
  MAX_WORK_REQUESTS: "50"
  MAX_HISTORY: "150"

  AUTO_PUBLIC_REPLIES: "true"
  NOX_USERNAME: "nox_origine"

  # Gemini and external generative AI are disabled.
  DM_AI_ENABLED: "false"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"

  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0" "PyYAML>=6.0,<7.0"

      - name: Run NØX Core
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from itertools import islice
          from pathlib import Path

          OWN_USERNAME = (
              os.environ.get("NOX_USERNAME") or "nox_origine"
          ).strip().lower()

          NOW_DT = datetime.now(timezone.utc)
          NOW = NOW_DT.isoformat()
          RUN_ID = "core-" + NOW_DT.strftime("%Y%m%dT%H%M%SZ")

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          def env_flag(name, default=False):
              value = os.environ.get(name)
              if value is None or not value.strip():
                  return default
              return value.strip().lower() in {
                  "1", "true", "yes", "on"
              }

          def check_policy():
              expected = {
                  "PROJECT_COST_EUR": "0",
                  "AUTO_PAYMENT": "false",
                  "AUTO_SPENDING": "false",
                  "DM_AI_ENABLED": "false",
                  "GEMINI_USED": "false",
                  "EXTERNAL_AI_USED": "false",
              }

              for key, wanted in expected.items():
                  actual = os.environ.get(key, wanted).strip().lower()
                  if actual != wanted:
                      raise SystemExit(
                          f"Unsafe policy: {key} must be {wanted}"
                      )

              if os.environ.get("GEMINI_API_KEY", "").strip():
                  raise SystemExit(
                      "Unsafe configuration: Gemini API key must not be "
                      "provided to Core."
                  )

          def load_json(path, default=None):
              path = Path(path)
              default = {} if default is None else default

              if not path.exists():
                  return default

              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  return default

              try:
                  value = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {path} is invalid JSON ({exc}); "
                      "refusing to overwrite"
                  )

              return value if isinstance(value, type(default)) else default

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(
                  value, ensure_ascii=False, indent=2, default=str
              ) + "\n"

              json.loads(payload)
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value, limit=None):
              if value is None:
                  out = ""
              elif isinstance(value, str):
                  out = value.strip()
              elif isinstance(value, dict):
                  out = ""
                  for key in (
                      "content", "body", "text", "message",
                      "title", "question"
                  ):
                      if value.get(key):
                          out = text(value[key])
                          break
                  if not out:
                      out = json.dumps(
                          value, ensure_ascii=False, default=str
                      )
              else:
                  out = str(value).strip()

              return out[:limit] if limit else out

          def collapse(value, limit=None):
              out = re.sub(r"\s+", " ", text(value)).strip()
              return out[:limit] if limit else out

          def clip(value, limit):
              out = text(value)
              return (
                  out if len(out) <= limit
                  else out[:limit - 1].rstrip() + "…"
              )

          def stable_id(prefix, *parts):
              raw = "|".join(
                  str(part if part is not None else "")
                  for part in parts
              )
              return f"{prefix}:{hashlib.sha256(raw.encode()).hexdigest()[:16]}"

          def identity(item):
              if isinstance(item, dict):
                  for key in (
                      "id", "action_id", "work_id", "result_id",
                      "message_id", "post_id", "url"
                  ):
                      if item.get(key):
                          return f"{key}:{item[key]}"

              return "hash:" + hashlib.sha256(
                  json.dumps(
                      item, sort_keys=True, ensure_ascii=False,
                      default=str
                  ).encode()
              ).hexdigest()

          def bound(items, limit):
              return as_list(items)[-limit:]

          def take(value, n=None):
              if value is None:
                  return []

              if isinstance(value, dict):
                  for key in (
                      "items", "data", "results", "posts",
                      "notifications", "messages", "conversations"
                  ):
                      if isinstance(value.get(key), list):
                          value = value[key]
                          break
                  else:
                      return []

              if isinstance(value, (list, tuple)):
                  return list(value)[:n] if n else list(value)

              try:
                  return (
                      list(islice(iter(value), n))
                      if n else list(iter(value))
                  )
              except TypeError:
                  return []

          def username_of(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in (
                  "username", "handle",
                  "author_username", "sender_username"
              ):
                  if obj.get(key):
                      return str(obj[key]).strip().lower()

              for key in (
                  "author", "user", "sender", "agent", "other_user"
              ):
                  value = obj.get(key)

                  if isinstance(value, dict):
                      found = username_of(value)
                      if found:
                          return found
                  elif isinstance(value, str) and value.strip():
                      return value.strip().lower()

              return ""

          def parse_ts(value):
              if not value or not isinstance(value, str):
                  return None

              try:
                  dt = datetime.fromisoformat(
                      value.strip().replace("Z", "+00:00")
                  )
              except ValueError:
                  return None

              return (
                  dt if dt.tzinfo
                  else dt.replace(tzinfo=timezone.utc)
              )

          check_policy()

          print("=== NØX CORE ===", RUN_ID)
          print("External generative AI: DISABLED")
          print("Gemini: DISABLED")
          print("Automatic payments: DISABLED")
          print("Automatic spending: DISABLED")

          MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])

          MAX_FEED = env_int("MAX_FEED_ITEMS", 20)
          MAX_NOTIF = env_int("MAX_NOTIFICATIONS", 20)
          MAX_CONV = env_int("MAX_CONVERSATIONS", 10)
          MAX_NEW_CASES = env_int("MAX_NEW_CASES_PER_RUN", 5)
          DM_MAX_AGE_H = env_int("DM_MAX_AGE_HOURS", 72)
          MAX_CASES = env_int("MAX_CASES", 100)
          MAX_ACTIONS = env_int("MAX_ACTIONS", 100)
          MAX_WORK_REQ = env_int("MAX_WORK_REQUESTS", 50)
          MAX_HISTORY = env_int("MAX_HISTORY", 150)
          PUBLIC_REPLIES = env_flag("AUTO_PUBLIC_REPLIES", True)

          memory = as_dict(load_json(MEMORY_FILE))
          runtime = as_dict(load_json(RUNTIME_FILE))
          work = as_dict(load_json(WORK_FILE))
          presence = as_dict(load_json(PRESENCE_FILE))

          for key in (
              "observations", "facts", "experiences", "hypotheses",
              "questions", "results", "learnings", "sources",
              "actions", "cognitive_cases"
          ):
              memory.setdefault(key, [])

          for key in (
              "observations", "decisions", "pending_actions",
              "work_requests", "processed_ids"
          ):
              runtime.setdefault(key, [])

          for key in ("pending", "history", "results", "failed"):
              work.setdefault(key, [])

          for key in ("outcomes", "permanent_failures", "closed_ids"):
              presence.setdefault(key, [])

          runtime["run_count"] = int(runtime.get("run_count", 0) or 0) + 1
          runtime["last_run"] = NOW

          api_key = os.environ.get("COLONY_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing")

          from colony_sdk import ColonyClient

          client = ColonyClient(api_key)

          try:
              client.bootstrap()
              print("Colony bootstrap: OK")
          except Exception as exc:
              print("WARNING bootstrap:", clip(exc, 300))

          def call(name, *args, **kwargs):
              method = getattr(client, name, None)

              if method is None:
                  print("WARNING SDK method unavailable:", name)
                  return None

              try:
                  return method(*args, **kwargs)
              except TypeError:
                  try:
                      return method(*args)
                  except Exception as exc:
                      print(f"WARNING {name}:", clip(exc, 300))
                      return None
              except Exception as exc:
                  print(f"WARNING {name}:", clip(exc, 300))
                  return None

          def ident(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in (
                  "id", "post_id", "comment_id", "message_id",
                  "conversation_id", "username", "slug"
              ):
                  if (
                      obj.get(key) is not None
                      and str(obj[key]).strip()
                  ):
                      return str(obj[key])

              return ""

          processed = [
              str(value)
              for value in as_list(runtime.get("processed_ids"))
              if value is not None
          ]
          processed_set = set(processed)

          def mark(item_id):
              item_id = str(item_id)
              if item_id and item_id not in processed_set:
                  processed_set.add(item_id)
                  processed.append(item_id)

          if not runtime.get("processed_seeded"):
              for obs in as_list(memory.get("observations")):
                  value = as_dict(as_dict(obs).get("value"))
                  for key in ("post_id", "message_id"):
                      if value.get(key):
                          mark(value[key])

              for case in as_list(memory.get("cognitive_cases")):
                  case = as_dict(case)

                  if case.get("message_id"):
                      mark(case["message_id"])

                  if (
                      case.get("type") == "public_question"
                      and case.get("target_id")
                  ):
                      mark(case["target_id"])

              runtime["processed_seeded"] = True

          closed_ids = {
              str(value) for value in as_list(presence.get("closed_ids"))
          }

          for failure in as_list(presence.get("permanent_failures")):
              if isinstance(failure, dict):
                  failure_id = failure.get("action_id") or failure.get("id")
                  if failure_id:
                      closed_ids.add(str(failure_id))

          pending = []
          pending_ids = set()

          for action in as_list(runtime.get("pending_actions")):
              if not isinstance(action, dict):
                  continue

              aid = text(action.get("action_id") or action.get("id"))

              if aid and (aid in closed_ids or aid in pending_ids):
                  continue

              if aid:
                  pending_ids.add(aid)

              pending.append(action)

          runtime["pending_actions"] = pending

          def add_observation(kind, source, value):
              obs = {
                  "id": stable_id(
                      "obs", kind, source,
                      repr(sorted(value.items()))
                      if isinstance(value, dict) else value
                  ),
                  "timestamp": NOW,
                  "type": kind,
                  "source": source,
                  "value": value,
              }

              runtime["observations"].append(obs)
              memory["observations"].append(obs)

          def add_case(case_type, source, target_id, question, **extra):
              case_id = stable_id(
                  "case", case_type, target_id,
                  extra.get("message_id", "")
              )

              if any(
                  isinstance(case, dict) and case.get("id") == case_id
                  for case in memory["cognitive_cases"][-MAX_CASES:]
              ):
                  return None

              case = {
                  "id": case_id,
                  "timestamp": NOW,
                  "type": case_type,
                  "source": source,
                  "target_id": target_id,
                  "question": question,
                  "status": "open",
              }

              case.update(extra)
              memory["cognitive_cases"].append(case)
              return case

          def add_work(case, question, reason):
              work_id = stable_id("work", case["id"], question)
              known = set()

              for collection in (
                  runtime["work_requests"], work["pending"],
                  work["history"], work["results"], work["failed"]
              ):
                  for entry in as_list(collection):
                      if isinstance(entry, dict) and entry.get("work_id"):
                          known.add(str(entry["work_id"]))

              if work_id in known:
                  return None

              request = {
                  "work_id": work_id,
                  "case_id": case["id"],
                  "created_at": NOW,
                  "status": "pending",
                  "question": question,
                  "reason": reason,
                  "source": "core",
                  "attempts": 0,
              }

              runtime["work_requests"].append(request)
              work["pending"].append(request)
              return request

          def add_action(
              action_type, target_id="", body="",
              recipient="", source_case="", metadata=None
          ):
              aid = stable_id(
                  "action", action_type, target_id,
                  recipient, body[:200]
              )

              if aid in closed_ids or aid in pending_ids:
                  return None

              action = {
                  "action_id": aid,
                  "id": aid,
                  "created_at": NOW,
                  "status": "pending",
                  "type": action_type,
                  "target_id": target_id,
                  "body": body,
                  "recipient": recipient,
                  "source_case": source_case,
                  "attempts": 0,
              }

              if isinstance(metadata, dict):
                  action["metadata"] = metadata

              runtime["pending_actions"].append(action)
              memory["actions"].append(action)
              pending_ids.add(aid)
              return action

          def make_question(title, body):
              title = collapse(title, 300)
              body = collapse(body, 3000)

              if "?" in title and len(title) >= 24:
                  return title

              for sentence in re.split(r"(?<=[.?!])\\s+", body):
                  if "?" in sentence and len(sentence) >= 24:
                      return sentence[:300]

              return ""

          # ---------------------------------------------------------
          # FEED: observe posts and create research work for questions.
          # ---------------------------------------------------------

          feed_items = take(
              call("get_for_you_feed", limit=MAX_FEED), MAX_FEED
          )
          print("Feed:", len(feed_items))

          cases_budget = MAX_NEW_CASES

          for post in feed_items:
              if not isinstance(post, dict):
                  continue

              pid = ident(post)
              if not pid or pid in processed_set:
                  continue

              mark(pid)
              author = username_of(post)

              if author == OWN_USERNAME:
                  continue

              title = text(post.get("title"))
              body = text(
                  post.get("body")
                  or post.get("content")
                  or post.get("text")
              )

              add_observation(
                  "feed_item", "colony",
                  {
                      "post_id": pid,
                      "author": author,
                      "title": title[:300],
                  }
              )

              if (
                  cases_budget <= 0
                  or "?" not in title + "\\n" + body
                  or len(body) < 20
              ):
                  continue

              question = make_question(title, body)
              if not question:
                  continue

              case = add_case(
                  "public_question", "feed", pid,
                  question, author=author
              )

              if case and add_work(
                  case, question,
                  "Public question: gather sources before any reply."
              ):
                  cases_budget -= 1

          # ---------------------------------------------------------
          # NOTIFICATIONS: record new notifications.
          # ---------------------------------------------------------

          notifications = take(call("get_notifications"), MAX_NOTIF)
          print("Notifications:", len(notifications))

          for notif in notifications:
              if not isinstance(notif, dict):
                  continue

              nid = ident(notif)
              if not nid or f"notif:{nid}" in processed_set:
                  continue

              mark(f"notif:{nid}")

              add_observation(
                  "notification", "colony",
                  {
                      "id": nid,
                      "type": text(notif.get("type")),
                      "text": clip(notif, 500),
                  }
              )

          # ---------------------------------------------------------
          # DIRECT MESSAGES: observe only.
          # No Gemini, no external generative AI, no auto-reply.
          # ---------------------------------------------------------

          cutoff = NOW_DT - timedelta(hours=DM_MAX_AGE_H)
          dm_observed = 0

          for conv in take(call("iter_conversations"), MAX_CONV):
              if not isinstance(conv, dict):
                  continue

              other = conv.get("other_user")

              sender_name = (
                  text(other.get("username") or other.get("handle"))
                  if isinstance(other, dict)
                  else text(other)
              ) or text(
                  conv.get("username") or conv.get("other_username")
              )

              sender = sender_name.strip().lower().lstrip("@")

              if not sender or sender == OWN_USERNAME:
                  continue

              conv_id = text(conv.get("id"))
              raw_messages = take(
                  call("get_conversation", sender_name), 200
              )

              messages = []

              for msg in raw_messages:
                  if not isinstance(msg, dict):
                      continue

                  mid = ident(msg)
                  if not mid:
                      continue

                  msg_sender = username_of(msg) or sender
                  direction = text(msg.get("direction")).lower()

                  own = (
                      msg_sender == OWN_USERNAME
                      or bool(msg.get("is_own"))
                      or direction in ("outgoing", "sent")
                  )

                  body = text(
                      msg.get("body")
                      or msg.get("content")
                      or msg.get("text")
                  )

                  ts_text = text(
                      msg.get("created_at") or msg.get("timestamp")
                  )
                  ts = parse_ts(ts_text)

                  if ts and ts < cutoff:
                      continue

                  messages.append({
                      "id": mid,
                      "sender": msg_sender,
                      "own": bool(own),
                      "body": body,
                      "timestamp": ts_text,
                      "dt": ts,
                  })

              messages.sort(
                  key=lambda msg: (
                      msg["dt"]
                      or datetime.min.replace(tzinfo=timezone.utc),
                      msg["id"],
                  )
              )

              if not messages:
                  continue

              latest = messages[-1]

              if latest["own"] or latest["id"] in processed_set:
                  continue

              if not latest["body"]:
                  mark(latest["id"])
                  continue

              add_observation(
                  "direct_message", "colony",
                  {
                      "message_id": latest["id"],
                      "conversation_id": conv_id,
                      "sender": sender,
                      "body": latest["body"][:500],
                      "response_status": "not_generated_ai_disabled",
                  }
              )

              dm_observed += 1

              # Mark as observed to avoid repeating the same observation.
              # This does not send or queue a reply.
              mark(latest["id"])

              print(
                  "DM observed; automatic reply disabled:",
                  sender, latest["id"]
              )

          print("DMs observed without AI replies:", dm_observed)

          # ---------------------------------------------------------
          # RESEARCH RESULTS: replies require supported evidence.
          # ---------------------------------------------------------

          def compose_reply(result):
              facts = [
                  fact for fact in as_list(result.get("facts"))
                  if isinstance(fact, dict) and fact.get("url")
              ][:3]

              if not facts:
                  return ""

              lines = [
                  "Automated source check "
                  "(not independently verified; may be incomplete):"
              ]

              for fact in facts:
                  title = clip(
                      collapse(fact.get("title") or fact.get("domain")),
                      80
                  )
                  lines.append(f"- {title}: {fact['url']}")

              snippet = collapse(facts[0].get("snippet"), 240)
              if snippet:
                  lines.append(f'Closest passage: "{snippet}"')

              return "\\n".join(lines)[:1500]

          consumed_results = 0

          for result in as_list(work.get("results"))[-MAX_HISTORY:]:
              if not isinstance(result, dict):
                  continue

              status = text(result.get("evidence_status"))
              case_id = text(result.get("case_id"))

              if status not in (
                  "multi_source_support", "partial_support"
              ) or not case_id:
                  continue

              key = (
                  f"result:{text(result.get('result_id')) or case_id}"
              )

              if key in processed_set:
                  continue

              case = next(
                  (
                      item for item in reversed(memory["cognitive_cases"])
                      if isinstance(item, dict)
                      and item.get("id") == case_id
                  ),
                  None,
              )

              if case is None:
                  mark(key)
                  continue

              reply = compose_reply(result)

              case.update({
                  "status": "research_complete",
                  "result_id": text(result.get("result_id")),
                  "evidence_status": status,
                  "conclusion": clip(
                      text(result.get("conclusion")), 600
                  ),
                  "reply_text": reply,
              })

              if (
                  reply
                  and case.get("type") == "public_question"
                  and PUBLIC_REPLIES
                  and status == "multi_source_support"
              ):
                  add_action(
                      "reply",
                      target_id=case.get("target_id", ""),
                      body=reply,
                      source_case=case_id,
                      metadata={"evidence_status": status},
                  )

              mark(key)

              memory["results"].append({
                  "id": key,
                  "timestamp": NOW,
                  "case_id": case_id,
                  "status": status,
                  "conclusion": clip(
                      text(result.get("conclusion")), 600
                  ),
              })

              consumed_results += 1

          print("Research results consumed:", consumed_results)

          # ---------------------------------------------------------
          # PRESENCE OUTCOMES: convert execution outcomes to learning.
          # ---------------------------------------------------------

          consumed_outcomes = 0

          for outcome in as_list(presence.get("outcomes"))[-MAX_HISTORY:]:
              if not isinstance(outcome, dict):
                  continue

              oid = text(outcome.get("id"))
              action_id = text(outcome.get("action_id"))

              if (
                  not oid
                  or not action_id
                  or f"outcome:{oid}" in processed_set
              ):
                  continue

              mark(f"outcome:{oid}")

              info = {
                  "action_id": action_id,
                  "status": text(outcome.get("status")),
                  "error": clip(outcome.get("error"), 300),
              }

              add_observation("presence_outcome", "presence", info)

              memory["experiences"].append({
                  "id": stable_id("experience", oid),
                  "timestamp": NOW,
                  "type": "action_outcome",
                  **info,
              })

              consumed_outcomes += 1

          print("Presence outcomes consumed:", consumed_outcomes)

          # ---------------------------------------------------------
          # BOUNDS, SAFETY CHECKS AND PERSISTENCE.
          # ---------------------------------------------------------

          runtime["decisions"].extend(
              {
                  "timestamp": NOW,
                  "case_id": case["id"],
                  "decision": "research",
                  "reason": case.get("question", ""),
              }
              for case in memory["cognitive_cases"]
              if (
                  isinstance(case, dict)
                  and case.get("timestamp") == NOW
                  and case.get("status") == "open"
              )
          )

          memory["observations"] = bound(memory["observations"], 500)
          memory["cognitive_cases"] = bound(
              memory["cognitive_cases"], MAX_CASES
          )
          memory["actions"] = bound(memory["actions"], MAX_ACTIONS)

          for key, limit in (
              ("experiences", 300),
              ("results", 300),
              ("facts", 300),
              ("hypotheses", 200),
              ("questions", 200),
              ("learnings", 300),
              ("sources", 300),
          ):
              memory[key] = bound(memory[key], limit)

          runtime["observations"] = bound(runtime["observations"], 500)
          runtime["decisions"] = bound(runtime["decisions"], 500)
          runtime["pending_actions"] = bound(
              runtime["pending_actions"], MAX_ACTIONS
          )
          runtime["work_requests"] = bound(
              runtime["work_requests"], MAX_WORK_REQ
          )
          runtime["processed_ids"] = bound(processed, 3000)

          forbidden_financial_terms = (
              "payment", "pay", "spend", "invoice",
              "withdraw", "transfer", "tip", "bid"
          )

          for action in runtime["pending_actions"]:
              if not isinstance(action, dict):
                  continue

              action_type = text(action.get("type")).lower()

              if any(term in action_type for term in forbidden_financial_terms):
                  raise RuntimeError(
                      "Forbidden financial action generated by Core: "
                      f"{action.get('type')}"
                  )

          runtime["last_summary"] = {
              "run_id": RUN_ID,
              "timestamp": NOW,
              "feed": len(feed_items),
              "notifications": len(notifications),
              "dm_observed_without_ai": dm_observed,
              "cases_created": sum(
                  1 for case in memory["cognitive_cases"]
                  if (
                      isinstance(case, dict)
                      and case.get("timestamp") == NOW
                  )
              ),
              "new_work": sum(
                  1 for item in work["pending"]
                  if (
                      isinstance(item, dict)
                      and item.get("created_at") == NOW
                  )
              ),
              "research_results_consumed": consumed_results,
              "presence_outcomes_consumed": consumed_outcomes,
              "gemini_used": False,
              "external_ai_used": False,
              "automatic_dm_replies": False,
              "automatic_payments": False,
              "automatic_spending": False,
          }

          save_json(MEMORY_FILE, memory)
          save_json(RUNTIME_FILE, runtime)
          save_json(WORK_FILE, work)

          print(
              "Cases:", runtime["last_summary"]["cases_created"],
              "| New work:", runtime["last_summary"]["new_work"],
          )
          print("Gemini calls: 0")
          print("External AI calls: 0")
          print("=== CORE COMPLETE ===")
          PY

      - name: Validate YAML and embedded Python
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import yaml

          path = Path(".github/workflows/nox-core-general.yml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8"))

          assert doc["env"]["AUTO_PUBLIC_REPLIES"] == "true"
          assert doc["env"]["AUTO_PAYMENT"] == "false"
          assert doc["env"]["AUTO_SPENDING"] == "false"
          assert doc["env"]["DM_AI_ENABLED"] == "false"
          assert doc["env"]["GEMINI_USED"] == "false"
          assert doc["env"]["EXTERNAL_AI_USED"] == "false"

          steps = doc["jobs"]["run"]["steps"]
          core_step = next(
              step for step in steps
              if step.get("name") == "Run NØX Core"
          )

          script = core_step["run"]
          embedded = script.split(
              "python3 - <<'PY'", 1
          )[1].split("\nPY", 1)[0]

          ast.parse(embedded)

          assert "generativelanguage.googleapis.com" not in embedded
          assert "GEMINI_API_KEY" not in core_step.get("env", {})

          print("VALID YAML")
          print("Embedded Python syntax OK")
          print("Gemini API endpoint absent")
          print("Gemini secret not passed to Core")
          PY

          python3 - <<'PY'
          import json
          import os

          for path in [
              "memory/nox_core_memory.json",
              "memory/nox_core_runtime.json",
              "memory/nox_work_factory.json",
              "memory/nox_colony_presence.json",
          ]:
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
                  print("VALID JSON:", path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          for file in \
            memory/nox_core_memory.json \
            memory/nox_core_runtime.json \
            memory/nox_work_factory.json
          do
            [ -e "$file" ] && git add -- "$file"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(nox): update core state"

          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo "Push failed after retries."
          exit 1
