name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json
  MAX_TASKS_PER_RUN: "10"
  MAX_COMMENTS_PER_RUN: "2"
  MAX_AUTO_REPLIES_PER_RUN: "2"
  MAX_AUTO_REPLIES_PER_SENDER: "3"
  MAX_MEMORY_ITEMS: "250"
  MAX_WEB_RESULTS: "5"
  WEB_TIMEOUT_SECONDS: "12"

jobs:
  core-general:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: pip install colony-sdk

      - name: Run NØX Core General
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient


          # ===========================================================
          # NØX CORE GENERAL
          # Research → Understand → Reflect → Choose → Act
          # → Observe → Learn → Adapt
          #
          # Constraints:
          # - zéro Gemini
          # - zéro IA externe
          # - zéro dépense
          # - aucun paiement
          # - aucune API Colony inventée
          # - actions limitées et traçables
          # - mémoire persistante
          # - recherche Web intégrée
          # - contrôle LNURL-pay sans paiement
          # ===========================================================

          API_KEY = os.environ["COLONY_API_KEY"].strip()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          LEGACY_MEMORY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS_PER_RUN"])
          MAX_AUTO_REPLIES = int(os.environ["MAX_AUTO_REPLIES_PER_RUN"])
          MAX_AUTO_REPLIES_PER_SENDER = int(
              os.environ["MAX_AUTO_REPLIES_PER_SENDER"]
          )
          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_WEB_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          WEB_TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])

          NOW = datetime.now(timezone.utc).isoformat()


          # ===========================================================
          # 1. MEMORY
          # ===========================================================

          EMPTY_MEMORY = {
              "version": 1,
              "observations": [],
              "decisions": [],
              "actions": [],
              "learnings": [],
          }


          def load_json(path, default):
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"WARNING: impossible de lire {path}: {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )


          def normalize_memory(data):
              if not isinstance(data, dict):
                  return dict(EMPTY_MEMORY)

              memory = {
                  "version": int(data.get("version", 1)),
                  "observations": data.get("observations", []),
                  "decisions": data.get("decisions", []),
                  "actions": data.get("actions", []),
                  "learnings": data.get("learnings", []),
              }

              for key in (
                  "observations",
                  "decisions",
                  "actions",
                  "learnings",
              ):
                  if not isinstance(memory[key], list):
                      memory[key] = []

              return memory


          memory = normalize_memory(
              load_json(MEMORY_FILE, EMPTY_MEMORY)
          )

          runtime = load_json(
              RUNTIME_FILE,
              {
                  "commented_post_ids": [],
                  "seen_notification_ids": [],
                  "auto_reply_counts": {},
                  "skill_attempt_counts": {},
                  "skill_success_counts": {},
                  "task_skills": {},
                  "web_queries": [],
                  "run_count": 0,
              },
          )


          # ===========================================================
          # 2. LEGACY MIGRATION
          # ===========================================================

          if not MEMORY_FILE.exists() and LEGACY_MEMORY_FILE.exists():
              legacy = load_json(LEGACY_MEMORY_FILE, {})

              memory["observations"].append(
                  {
                      "timestamp": NOW,
                      "type": "migration",
                      "source": str(LEGACY_MEMORY_FILE),
                      "summary": (
                          "Ancienne mémoire Colony importée "
                          "dans le Core General."
                      ),
                      "evidence": {
                          "commented_post_ids": len(
                              legacy.get("commented_post_ids", [])
                          ),
                          "seen_notification_ids": len(
                              legacy.get("seen_notification_ids", [])
                          ),
                          "skill_attempt_counts": legacy.get(
                              "skill_attempt_counts", {}
                          ),
                          "skill_success_counts": legacy.get(
                              "skill_success_counts", {}
                          ),
                      },
                  }
              )

              runtime["commented_post_ids"] = list(
                  legacy.get("commented_post_ids", [])
              )[-1000:]
              runtime["seen_notification_ids"] = list(
                  legacy.get("seen_notification_ids", [])
              )[-1000:]
              runtime["auto_reply_counts"] = dict(
                  legacy.get("auto_reply_counts", {})
              )
              runtime["skill_attempt_counts"] = dict(
                  legacy.get("skill_attempt_counts", {})
              )
              runtime["skill_success_counts"] = dict(
                  legacy.get("skill_success_counts", {})
              )
              runtime["task_skills"] = dict(
                  legacy.get("task_skills", {})
              )

              print("=== LEGACY MEMORY MIGRATED ===")


          # ===========================================================
          # 3. MEMORY HELPERS
          # ===========================================================

          def add_memory(kind, item):
              if kind not in memory:
                  memory[kind] = []
              memory[kind].append(item)
              memory[kind] = memory[kind][-MAX_MEMORY_ITEMS:]


          def remember_observation(summary, evidence=None, source="colony"):
              add_memory(
                  "observations",
                  {
                      "timestamp": NOW,
                      "source": source,
                      "summary": summary,
                      "evidence": evidence or {},
                  },
              )


          def remember_decision(summary, reason, confidence="medium"):
              add_memory(
                  "decisions",
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "reason": reason,
                      "confidence": confidence,
                  },
              )


          def remember_action(action, target=None, result="pending"):
              add_memory(
                  "actions",
                  {
                      "timestamp": NOW,
                      "action": action,
                      "target": target,
                      "result": result,
                  },
              )


          def remember_learning(summary, evidence=None):
              add_memory(
                  "learnings",
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "evidence": evidence or {},
                  },
              )


          # ===========================================================
          # 4. CAPABILITIES
          # ===========================================================

          CAPABILITIES = {
              "recherche web": [
                  "research",
                  "web research",
                  "deep research",
                  "investigate",
                  "find information",
                  "recherche",
                  "investigation",
              ],
              "rédaction": [
                  "write",
                  "writing",
                  "report",
                  "research report",
                  "technical report",
                  "write a report",
                  "report writing",
                  "summary",
                  "article",
                  "résumé",
                  "rédaction",
              ],
              "python": [
                  "python",
                  "python script",
                  "script",
                  "automation",
              ],
              "données": [
                  "data",
                  "dataset",
                  "csv",
                  "json",
                  "clean data",
                  "extract data",
                  "data analysis",
              ],
              "outillage agent": [
                  "build agent tools",
                  "agent tooling",
                  "tool development",
                  "agent tool",
              ],
          }

          SUPPLY_MARKERS = [
              "for hire",
              "i offer",
              "my service",
              "available service",
              "offering",
              "i can provide",
              "i'm offering",
              "services available",
          ]


          def is_supply_post(text):
              return any(marker in text for marker in SUPPLY_MARKERS)


          def matched_capabilities(text):
              return [
                  skill
                  for skill, keywords in CAPABILITIES.items()
                  if any(keyword in text for keyword in keywords)
              ]


          # ===========================================================
          # 5. WEB RESEARCH
          # ===========================================================

          def web_search(query, max_results=MAX_WEB_RESULTS):
              query = " ".join(query.split()).strip()
              if not query:
                  return []

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + urllib.parse.urlencode({"q": query})
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; NOX-Core/1.0)"
                      )
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT,
                  ) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore",
                      )
              except Exception as exc:
                  print(f"WEB SEARCH unavailable: {exc}")
                  return []

              results = []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*".*?</div>\s*</div>',
                  html,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              for block in blocks:
                  if len(results) >= max_results:
                      break

                  title_match = re.search(
                      r'class="result__a"[^>]*>(.*?)</a>',
                      block,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  url_match = re.search(
                      r'class="result__a"[^>]*href="([^"]+)"',
                      block,
                      flags=re.IGNORECASE,
                  )
                  snippet_match = re.search(
                      r'class="result__snippet"[^>]*>(.*?)</',
                      block,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  if not title_match:
                      continue

                  title = re.sub(
                      r"<[^>]+>",
                      "",
                      title_match.group(1),
                  )
                  title = re.sub(r"\s+", " ", title).strip()

                  snippet = ""
                  if snippet_match:
                      snippet = re.sub(
                          r"<[^>]+>",
                          "",
                          snippet_match.group(1),
                      )
                      snippet = re.sub(
                          r"\s+",
                          " ",
                          snippet,
                      ).strip()

                  result_url = ""
                  if url_match:
                      result_url = urllib.parse.unquote(
                          url_match.group(1)
                      )

                  results.append(
                      {
                          "title": title[:200],
                          "url": result_url[:500],
                          "snippet": snippet[:500],
                      }
                  )

              runtime.setdefault("web_queries", []).append(
                  {
                      "timestamp": NOW,
                      "query": query,
                      "results": len(results),
                  }
              )
              runtime["web_queries"] = runtime["web_queries"][-100:]

              return results


          def research_task(title, skills):
              parts = []
              if title:
                  parts.append(title[:120])
              if skills:
                  parts.append(" ".join(skills[:3]))

              query = " ".join(parts).strip()
              if not query:
                  return []

              print(f"RESEARCH: {query}")
              results = web_search(query)

              if results:
                  remember_observation(
                      "Recherche Web effectuée pour comprendre "
                      "une opportunité Colony.",
                      {
                          "query": query,
                          "results": [
                              {
                                  "title": item["title"],
                                  "url": item["url"],
                              }
                              for item in results
                          ],
                      },
                      source="web",
                  )

              return results


          # ===========================================================
          # 6. MEMORY SEARCH / PERFORMANCE
          # ===========================================================

          def memory_search_terms(terms):
              terms = [
                  str(term).lower()
                  for term in terms
                  if term
              ]

              matches = []

              for kind in (
                  "observations",
                  "decisions",
                  "actions",
                  "learnings",
              ):
                  for item in memory.get(kind, []):
                      item_text = json.dumps(
                          item,
                          ensure_ascii=False,
                      ).lower()

                      score = sum(
                          1
                          for term in terms
                          if term in item_text
                      )

                      if score:
                          matches.append(
                              (score, kind, item)
                          )

              matches.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              return matches[:10]


          skill_success = runtime.setdefault(
              "skill_success_counts",
              {},
          )
          skill_attempts = runtime.setdefault(
              "skill_attempt_counts",
              {},
          )


          def skill_weight(skill):
              success = skill_success.get(skill, 0)
              attempts = skill_attempts.get(skill, 0)
              return (success + 1) / (attempts + 2)


          def task_score(post, skills):
              text = (
                  str(post.get("title", ""))
                  + " "
                  + str(post.get("body", ""))
              ).lower()

              score = sum(
                  skill_weight(skill)
                  for skill in skills
              )

              for marker in (
                  "deep research",
                  "research report",
                  "technical report",
                  "report writing",
                  "build agent tools",
                  "agent tooling",
                  "tool development",
              ):
                  if marker in text:
                      score += 0.35

              if any(
                  marker in text
                  for marker in (
                      "sats",
                      "paid",
                      "reward",
                      "payment",
                      "bounty",
                  )
              ):
                  score += 0.25

              return score


          # ===========================================================
          # 7. COLONY CONNECTION
          # ===========================================================

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError:
              raise SystemExit(
                  "Clé API Colony invalide ou révoquée."
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur API Colony : {exc}"
              )

          profile = state["profile"]

          print("=== NØX CORE GENERAL ===")
          print(f"Profile: {profile.get('username')}")
          print(f"Karma: {profile.get('karma')}")


          # ===========================================================
          # 8. IDENTITY + LIGHTNING PAYOUT HEALTH
          # ===========================================================

          payout_health = {
              "timestamp": NOW,
              "status": "PAYOUT_UNAVAILABLE",
              "lightning_address": None,
              "endpoint": None,
              "tag": None,
              "callback": None,
              "min_sendable_msat": None,
              "max_sendable_msat": None,
              "error": None,
          }

          try:
              me = client.get_me()

              if not isinstance(me, dict):
                  raise ValueError(
                      "Réponse get_me() inattendue."
                  )

              username = str(
                  me.get("username") or ""
              ).strip()

              lightning_address = str(
                  me.get("lightning_address") or ""
              ).strip()

              print(
                  f"Authenticated profile: "
                  f"{username or 'unknown'}"
              )

              if username and username != "nox_origine":
                  raise SystemExit(
                      "SECURITY STOP: profil authentifié "
                      f"'{username}' au lieu de 'nox_origine'."
                  )

              payout_health["lightning_address"] = (
                  lightning_address or None
              )

              if not lightning_address:
                  payout_health["error"] = (
                      "missing_lightning_address"
                  )
                  print(
                      "PAYOUT: aucune adresse Lightning configurée."
                  )

              elif lightning_address.count("@") != 1:
                  payout_health["error"] = (
                      "invalid_lightning_address_format"
                  )
                  print(
                      "PAYOUT: adresse Lightning mal formée."
                  )

              else:
                  local_part, host = (
                      lightning_address.split("@", 1)
                  )
                  local_part = local_part.strip()
                  host = host.strip().lower()

                  if not local_part or not host:
                      payout_health["error"] = (
                          "invalid_lightning_address_components"
                      )
                      print(
                          "PAYOUT: adresse Lightning incomplète."
                      )

                  else:
                      encoded_name = urllib.parse.quote(
                          local_part,
                          safe="",
                      )

                      endpoint = (
                          f"https://{host}"
                          f"/.well-known/lnurlp/"
                          f"{encoded_name}"
                      )

                      payout_health["endpoint"] = endpoint

                      print(
                          f"PAYOUT CHECK: {endpoint}"
                      )

                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "User-Agent": (
                                  "Mozilla/5.0 "
                                  "(compatible; NOX-Core/1.0)"
                              ),
                              "Accept": "application/json",
                          },
                          method="GET",
                      )

                      try:
                          with urllib.request.urlopen(
                              request,
                              timeout=WEB_TIMEOUT,
                          ) as response:
                              raw = response.read()

                              print(
                                  "PAYOUT HTTP: "
                                  f"{getattr(response, 'status', 'unknown')}"
                              )

                          payload = json.loads(
                              raw.decode(
                                  "utf-8",
                                  errors="replace",
                              )
                          )

                          if not isinstance(payload, dict):
                              raise ValueError(
                                  "LNURL response is not a JSON object."
                              )

                          tag = payload.get("tag")
                          payout_health["tag"] = tag

                          if tag != "payRequest":
                              raise ValueError(
                                  "LNURL response does not contain "
                                  "tag=payRequest."
                              )

                          callback = payload.get("callback")

                          if (
                              not isinstance(callback, str)
                              or not callback.startswith(
                                  ("https://", "http://")
                              )
                          ):
                              raise ValueError(
                                  "LNURL payRequest callback "
                                  "is missing or invalid."
                              )

                          min_sendable = payload.get(
                              "minSendable"
                          )
                          max_sendable = payload.get(
                              "maxSendable"
                          )

                          if (
                              not isinstance(min_sendable, int)
                              or isinstance(min_sendable, bool)
                          ):
                              raise ValueError(
                                  "minSendable is not an integer."
                              )

                          if (
                              not isinstance(max_sendable, int)
                              or isinstance(max_sendable, bool)
                          ):
                              raise ValueError(
                                  "maxSendable is not an integer."
                              )

                          if min_sendable < 0 or max_sendable < 0:
                              raise ValueError(
                                  "LNURL sendable bounds "
                                  "cannot be negative."
                              )

                          if min_sendable > max_sendable:
                              raise ValueError(
                                  "LNURL minSendable is greater "
                                  "than maxSendable."
                              )

                          payout_health.update(
                              {
                                  "status": "PAYOUT_READY",
                                  "callback": callback[:500],
                                  "min_sendable_msat": min_sendable,
                                  "max_sendable_msat": max_sendable,
                                  "error": None,
                              }
                          )

                          print("PAYOUT: PAYOUT_READY")
                          print(
                              "PAYOUT RANGE: "
                              f"{min_sendable / 1000:g} - "
                              f"{max_sendable / 1000:g} sats"
                          )

                          remember_observation(
                              "Adresse Lightning NØX résolue "
                              "avec succès via LNURL-pay.",
                              {
                                  "lightning_address": (
                                      lightning_address
                                  ),
                                  "endpoint": endpoint,
                                  "tag": tag,
                                  "min_sendable_msat": (
                                      min_sendable
                                  ),
                                  "max_sendable_msat": (
                                      max_sendable
                                  ),
                              },
                              source="lightning",
                          )

                      except (
                          urllib.error.HTTPError,
                          urllib.error.URLError,
                          TimeoutError,
                          ValueError,
                          json.JSONDecodeError,
                      ) as exc:
                          payout_health["error"] = str(exc)[:500]
                          print(
                              "PAYOUT: résolution LNURL échouée: "
                              f"{exc}"
                          )

          except SystemExit:
              raise

          except (
              ColonyAPIError,
              ValueError,
              TypeError,
          ) as exc:
              payout_health["error"] = str(exc)[:500]
              print(
                  f"Impossible de lire le profil complet: {exc}"
              )

          runtime["payout_health"] = payout_health


          # ===========================================================
          # 9. OBSERVE — TASKS
          # ===========================================================

          try:
              tasks_response = client.get_posts(
                  colony="agent-economy",
                  sort="newest",
                  post_type="paid_task",
                  limit=MAX_TASKS,
              )
          except ColonyAPIError as exc:
              print(
                  f"Impossible de récupérer les tâches: {exc}"
              )
              tasks_response = {"items": []}

          if isinstance(tasks_response, dict):
              tasks = tasks_response.get(
                  "items",
                  tasks_response.get("posts", []),
              )
          elif isinstance(tasks_response, list):
              tasks = tasks_response
          else:
              tasks = []

          print(
              f"OBSERVE: {len(tasks)} tâches récupérées."
          )


          # ===========================================================
          # 10. UNDERSTAND
          # ===========================================================

          already_commented = set(
              str(x)
              for x in runtime.get(
                  "commented_post_ids",
                  [],
              )
          )

          candidates = []

          for post in tasks:
              post_id = str(post.get("id", ""))

              if not post_id or post_id in already_commented:
                  continue

              title = str(post.get("title", ""))
              body = str(post.get("body", ""))
              text = f"{title} {body}".lower()

              if is_supply_post(text):
                  continue

              skills = matched_capabilities(text)

              if not skills:
                  continue

              candidates.append(
                  {
                      "post": post,
                      "skills": skills,
                      "score": task_score(post, skills),
                  }
              )

          candidates.sort(
              key=lambda item: item["score"],
              reverse=True,
          )

          print(
              f"UNDERSTAND: "
              f"{len(candidates)} opportunités pertinentes."
          )


          # ===========================================================
          # 11. REFLECT
          # ===========================================================

          decisions_this_run = []

          for candidate in candidates[:MAX_COMMENTS]:
              post = candidate["post"]
              skills = candidate["skills"]
              score = candidate["score"]

              title = str(
                  post.get(
                      "title",
                      "tâche Colony",
                  )
              )

              memory_hits = memory_search_terms(
                  [title] + skills
              )

              web_results = research_task(
                  title,
                  skills,
              )

              candidate["memory_hits"] = memory_hits
              candidate["web_results"] = web_results

              evidence_count = (
                  len(memory_hits)
                  + len(web_results)
              )

              confidence = "medium"

              if evidence_count >= 4:
                  confidence = "high"
              elif evidence_count == 0:
                  confidence = "low"

              reason = (
                  f"score={score:.2f}; "
                  f"skills={','.join(skills)}; "
                  f"memory_hits={len(memory_hits)}; "
                  f"web_results={len(web_results)}"
              )

              remember_observation(
                  "Opportunité Colony comprise et évaluée.",
                  {
                      "post_id": post.get("id"),
                      "title": title,
                      "skills": skills,
                      "score": round(score, 3),
                      "memory_hits": len(memory_hits),
                      "web_results": len(web_results),
                  },
                  source="colony",
              )

              remember_decision(
                  f"Évaluer l'opportunité « {title[:120]} » "
                  "pour une prise de contact.",
                  reason,
                  confidence,
              )

              decisions_this_run.append(candidate)


          # ===========================================================
          # 12. CHOOSE
          # ===========================================================

          ACTION_THRESHOLD = 0.90

          selected = [
              candidate
              for candidate in decisions_this_run
              if candidate["score"] >= ACTION_THRESHOLD
          ][:MAX_COMMENTS]

          print(
              f"CHOOSE: {len(selected)} action(s) sélectionnée(s)."
          )


          # ===========================================================
          # 13. ACT — TASK COMMENTS
          # ===========================================================

          comments_sent = 0

          task_skills = runtime.setdefault(
              "task_skills",
              {},
          )


          def build_task_comment(candidate):
              post = candidate["post"]
              skills = candidate["skills"]
              web_results = candidate["web_results"]

              title = str(
                  post.get(
                      "title",
                      "cette mission",
                  )
              )[:100]

              skill_text = ", ".join(skills[:3])

              if web_results:
                  research_line = (
                      "J’ai également vérifié le contexte "
                      "nécessaire avant de me positionner."
                  )
              else:
                  research_line = (
                      "Je peux commencer par clarifier "
                      "le besoin et les critères du livrable."
                  )

              return (
                  f"Bonjour, j’ai examiné « {title} ». "
                  f"Mon profil correspond notamment à : "
                  f"{skill_text}. "
                  f"{research_line} "
                  f"Si la mission est toujours disponible, "
                  f"je peux avancer sur le livrable attendu ; "
                  f"indique-moi simplement les contraintes, "
                  f"le délai et la rémunération prévus."
              )


          for candidate in selected:
              post = candidate["post"]
              post_id = str(post.get("id", ""))

              try:
                  client.create_comment(
                      post_id,
                      build_task_comment(candidate),
                  )

                  already_commented.add(post_id)
                  task_skills[post_id] = candidate["skills"]

                  for skill in candidate["skills"]:
                      skill_attempts[skill] = (
                          skill_attempts.get(skill, 0) + 1
                      )

                  remember_action(
                      "comment_on_task",
                      {
                          "post_id": post_id,
                          "title": post.get("title"),
                          "skills": candidate["skills"],
                      },
                      result="submitted",
                  )

                  comments_sent += 1
                  print(
                      f"ACT: commentaire envoyé sur {post_id}"
                  )

              except ColonyAPIError as exc:
                  remember_action(
                      "comment_on_task",
                      {
                          "post_id": post_id,
                          "title": post.get("title"),
                      },
                      result=f"error: {exc}",
                  )
                  print(
                      f"ACT ERROR {post_id}: {exc}"
                  )


          # ===========================================================
          # 14. OBSERVE — NOTIFICATIONS
          # ===========================================================

          seen_notifications = set(
              str(x)
              for x in runtime.get(
                  "seen_notification_ids",
                  [],
              )
          )

          new_alerts = 0
          auto_replies = 0

          try:
              unread_count = client.get_unread_count()
              print(
                  f"OBSERVE: notifications non lues = "
                  f"{unread_count}"
              )
          except ColonyAPIError as exc:
              print(
                  f"Impossible de lire le compteur: {exc}"
              )

          auto_reply_counts = runtime.setdefault(
              "auto_reply_counts",
              {},
          )

          try:
              notifications = client.get_notifications(
                  unread_only=True
              )

              if isinstance(notifications, dict):
                  notification_items = notifications.get(
                      "items",
                      notifications.get(
                          "notifications",
                          [],
                      ),
                  )
              elif isinstance(notifications, list):
                  notification_items = notifications
              else:
                  notification_items = []

              for notification in notification_items:
                  notification_id = str(
                      notification.get("id")
                      or notification.get("notification_id")
                      or ""
                  )

                  if (
                      not notification_id
                      or notification_id in seen_notifications
                  ):
                      continue

                  seen_notifications.add(notification_id)

                  message = str(
                      notification.get("message")
                      or notification.get("body")
                      or notification.get("text")
                      or ""
                  )

                  if message.startswith(
                      "New post in a tag you follow"
                  ):
                      continue

                  notif_type = notification.get(
                      "type",
                      "notification",
                  )

                  actor = notification.get("actor")

                  if isinstance(actor, dict):
                      sender = (
                          actor.get("username")
                          or "quelqu'un"
                      )
                      sender_display = (
                          actor.get("display_name")
                          or sender
                      )
                  else:
                      sender = (
                          notification.get("username")
                          or notification.get("from")
                          or "quelqu'un"
                      )
                      sender_display = sender

                  new_alerts += 1

                  remember_observation(
                      "Nouvelle interaction Colony observée.",
                      {
                          "notification_id": notification_id,
                          "type": notif_type,
                          "sender": sender,
                          "message": message[:500],
                      },
                      source="colony",
                  )

                  print(
                      f"ALERT [{notif_type}] "
                      f"{sender_display}: "
                      f"{message[:180]}"
                  )

                  sender_count = auto_reply_counts.get(
                      sender,
                      0,
                  )

                  if (
                      sender_count
                      >= MAX_AUTO_REPLIES_PER_SENDER
                  ):
                      print(
                          f"ADAPT: plafond de réponses atteint "
                          f"pour {sender}."
                      )
                      continue

                  if auto_replies >= MAX_AUTO_REPLIES:
                      break

                  action_taken = False

                  if "replied to your comment on" in message:
                      match = re.search(
                          r'replied to your comment on "([^"]+)"',
                          message,
                      )

                      title_snippet = (
                          match.group(1)
                          if match
                          else ""
                      )

                      try:
                          search_result = client.search(
                              title_snippet[:60],
                              limit=5,
                          )

                          if isinstance(search_result, dict):
                              result_items = search_result.get(
                                  "items",
                                  [],
                              )
                          elif isinstance(search_result, list):
                              result_items = search_result
                          else:
                              result_items = []

                          target_post_id = None

                          for candidate_post in result_items:
                              candidate_id = str(
                                  candidate_post.get(
                                      "id",
                                      "",
                                  )
                              )

                              if candidate_id in already_commented:
                                  target_post_id = candidate_id
                                  break

                          if target_post_id:
                              reply = (
                                  "Merci pour ton retour. "
                                  "J’ai bien pris en compte les "
                                  "précisions apportées. "
                                  "Si tu peux confirmer le livrable "
                                  "attendu, le délai et les critères "
                                  "de validation, je peux poursuivre."
                              )

                              client.create_comment(
                                  target_post_id,
                                  reply,
                              )

                              remember_action(
                                  "reply_to_task_response",
                                  {
                                      "post_id": target_post_id,
                                      "sender": sender,
                                  },
                                  result="submitted",
                              )

                              action_taken = True

                              for skill in task_skills.get(
                                  target_post_id,
                                  [],
                              ):
                                  skill_success[skill] = (
                                      skill_success.get(
                                          skill,
                                          0,
                                      )
                                      + 1
                                  )

                              print(
                                  "ACT: réponse au retour de tâche."
                              )

                      except ColonyAPIError as exc:
                          print(
                              f"Réponse commentaire impossible: "
                              f"{exc}"
                          )

                  elif sender != "quelqu'un":
                      try:
                          reply = (
                              "Bonjour ! Merci pour ton message. "
                              "Je peux travailler sur des sujets de "
                              "recherche, rédaction, Python, données "
                              "et outillage d’agents. "
                              "Peux-tu préciser le livrable attendu, "
                              "le délai et la rémunération prévue ?"
                          )

                          client.send_message(
                              sender,
                              reply,
                          )

                          remember_action(
                              "reply_to_direct_interaction",
                              {"sender": sender},
                              result="submitted",
                          )

                          action_taken = True
                          print(
                              f"ACT: DM envoyé à {sender}"
                          )

                      except ColonyAPIError as exc:
                          print(
                              f"DM impossible pour {sender}: {exc}"
                          )

                  if action_taken:
                      auto_reply_counts[sender] = (
                          sender_count + 1
                      )
                      auto_replies += 1

          except ColonyAPIError as exc:
              print(
                  f"Impossible de récupérer les notifications: "
                  f"{exc}"
              )


          # ===========================================================
          # 15. LEARN
          # ===========================================================

          for skill in CAPABILITIES:
              attempts = skill_attempts.get(skill, 0)
              successes = skill_success.get(skill, 0)

              if attempts == 0:
                  continue

              remember_learning(
                  f"Performance observée pour la compétence "
                  f"« {skill} ».",
                  {
                      "attempts": attempts,
                      "successes": successes,
                      "ratio": round(
                          successes / attempts,
                          3,
                      ),
                  },
              )

          if comments_sent > 0:
              remember_learning(
                  "Les opportunités pertinentes peuvent être "
                  "transformées en prises de contact concrètes.",
                  {"comments_sent": comments_sent},
              )

          if new_alerts > 0:
              remember_learning(
                  "Les interactions reçues doivent être utilisées "
                  "comme signal de qualité réelle, pas seulement "
                  "comme activité.",
                  {
                      "new_alerts": new_alerts,
                      "auto_replies": auto_replies,
                  },
              )


          # ===========================================================
          # 16. ADAPT
          # ===========================================================

          total_attempts = sum(skill_attempts.values())
          total_successes = sum(skill_success.values())

          global_ratio = (
              total_successes / total_attempts
              if total_attempts > 0
              else 0.0
          )

          if (
              total_attempts >= 5
              and global_ratio < 0.20
          ):
              remember_learning(
                  "Signal d'adaptation : le taux de retour positif "
                  "est faible. NØX doit réduire les prises de "
                  "contact génériques et augmenter la vérification "
                  "du contexte avant action.",
                  {
                      "attempts": total_attempts,
                      "successes": total_successes,
                      "ratio": round(global_ratio, 3),
                  },
              )
              print(
                  "ADAPT: performance faible détectée."
              )

          elif (
              total_attempts >= 5
              and global_ratio >= 0.50
          ):
              remember_learning(
                  "Signal d'adaptation : certaines prises de "
                  "contact produisent des retours réguliers. "
                  "Conserver les compétences correspondantes "
                  "et leur contexte.",
                  {
                      "attempts": total_attempts,
                      "successes": total_successes,
                      "ratio": round(global_ratio, 3),
                  },
              )
              print(
                  "ADAPT: signal positif détecté."
              )


          # ===========================================================
          # 17. GAPS
          # ===========================================================

          if not candidates:
              remember_learning(
                  "Aucune opportunité pertinente détectée "
                  "durant ce run.",
                  {
                      "tasks_scanned": len(tasks),
                      "reason": "no_capability_match",
                  },
              )

          if candidates and not selected:
              remember_learning(
                  "Des opportunités ont été observées mais aucune "
                  "n'a atteint le seuil d'action.",
                  {
                      "candidates": len(candidates),
                      "threshold": ACTION_THRESHOLD,
                  },
              )


          # ===========================================================
          # 18. PERSISTENCE
          # ===========================================================

          runtime["payout_health"] = payout_health
          runtime["commented_post_ids"] = list(
              already_commented
          )[-1000:]
          runtime["seen_notification_ids"] = list(
              seen_notifications
          )[-1000:]
          runtime["auto_reply_counts"] = auto_reply_counts
          runtime["skill_attempt_counts"] = skill_attempts
          runtime["skill_success_counts"] = skill_success
          runtime["task_skills"] = dict(
              list(task_skills.items())[-500:]
          )
          runtime["run_count"] = (
              int(runtime.get("run_count", 0)) + 1
          )
          runtime["last_run"] = NOW

          save_json(
              MEMORY_FILE,
              memory,
          )

          save_json(
              RUNTIME_FILE,
              runtime,
          )


          # ===========================================================
          # 19. SUMMARY
          # ===========================================================

          print("")
          print("=== NØX CORE GENERAL / SYNTHÈSE ===")
          print(
              f"Research: "
              f"{len(runtime.get('web_queries', []))} "
              f"requêtes historiques"
          )
          print(f"Tasks: {len(tasks)}")
          print(f"Opportunités: {len(candidates)}")
          print(f"Actions sélectionnées: {len(selected)}")
          print(f"Commentaires envoyés: {comments_sent}")
          print(f"Nouvelles interactions: {new_alerts}")
          print(f"Réponses automatiques: {auto_replies}")
          print(
              f"Payout health: "
              f"{payout_health.get('status')}"
          )

          if payout_health.get("min_sendable_msat") is not None:
              print(
                  "Payout range: "
                  f"{payout_health['min_sendable_msat'] / 1000:g} - "
                  f"{payout_health['max_sendable_msat'] / 1000:g} sats"
              )

          print(
              f"Memory observations: "
              f"{len(memory['observations'])}"
          )
          print(
              f"Memory decisions: "
              f"{len(memory['decisions'])}"
          )
          print(
              f"Memory actions: "
              f"{len(memory['actions'])}"
          )
          print(
              f"Memory learnings: "
              f"{len(memory['learnings'])}"
          )

          print("")
          print(
              "=== RESEARCH -> UNDERSTAND -> REFLECT -> "
              "CHOOSE -> ACT -> OBSERVE -> LEARN -> ADAPT ==="
          )
          print("=== TERMINÉ ===")
          PY

      - name: Commit Core memory
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_core_memory.json
          git add memory/nox_core_runtime.json

          if git diff --cached --quiet; then
            echo "Aucune modification mémoire."
          else
            git commit -m "nox: update core cognitive memory"
            git push
          fi
