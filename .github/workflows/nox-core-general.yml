          def find_case_record(case_id):
              for record in reversed(
                  memory.get(
                      "cognitive_cases",
                      []
                  )
              ):
                  if (
                      isinstance(record, dict)
                      and record.get("case_id")
                      == case_id
                  ):
                      return record

              return None

          def valid_research_result(result):
              if not isinstance(result, dict):
                  return False

              conclusion = clean(
                  result.get("conclusion"),
                  1800
              )

              status = result.get(
                  "evidence_status"
              )

              sources = [
                  x
                  for x in (
                      result.get("sources")
                      or []
                  )
                  if (
                      isinstance(x, dict)
                      and (
                          x.get("url")
                          or x.get("title")
                      )
                  )
              ]

              if len(conclusion) < 80:
                  return False

              if status not in (
                  "multi_source_support",
                  "partial_support"
              ):
                  return False

              return bool(sources)

          def build_research_reply(case, result):
              conclusion = clean(
                  result.get("conclusion"),
                  1800
              )

              status = clean(
                  result.get(
                      "evidence_status"
                  ),
                  100
              )

              sources = [
                  x
                  for x in (
                      result.get("sources")
                      or []
                  )
                  if (
                      isinstance(x, dict)
                      and (
                          x.get("url")
                          or x.get("title")
                      )
                  )
              ]

              source_lines = []

              for source in sources[:3]:
                  label = clean(
                      source.get("title")
                      or source.get("url"),
                      180
                  )

                  url = clean(
                      source.get("url"),
                      500
                  )

                  if label and url:
                      source_lines.append(
                          f"- {label}: {url}"
                      )
                  elif label:
                      source_lines.append(
                          f"- {label}"
                      )

              prefix = ""

              if case.get("source") == "dm":
                  prefix = (
                      "I checked the question against "
                      "the available research.\n\n"
                  )

              else:
                  prefix = (
                      "I checked this against the "
                      "available evidence.\n\n"
                  )

              text = (
                  prefix
                  + conclusion
                  + f"\n\nEvidence status: {status}."
              )

              if source_lines:
                  text += (
                      "\n\nSources:\n"
                      + "\n".join(source_lines)
                  )

              text += (
                  "\n\nThis conclusion is bounded by "
                  "the evidence currently available."
              )

              return clean(text, 3500)

          def build_contextual_reply(case):
              hits = case.get(
                  "memory_hits",
                  []
              )

              if not hits:
                  return None

              useful = []

              for hit in hits[:2]:
                  item = hit.get("item")

                  if not isinstance(item, dict):
                      continue

                  summary = clean(
                      item.get("summary"),
                      700
                  )

                  if summary:
                      useful.append(summary)

              if not useful:
                  return None

              return (
                  "I have a relevant prior observation "
                  "on this point:\n\n"
                  + "\n".join(
                      f"- {x}"
                      for x in useful
                  )
                  + "\n\n"
                  "I am treating this as contextual evidence, "
                  "not as a universal conclusion."
              )

