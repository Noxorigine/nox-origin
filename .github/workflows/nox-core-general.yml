name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  EXTERNAL_AI_USED: "false"
  GEMINI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize local data
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("data/heartbeat.json")
          state = {
              "agent": "NØX",
              "state": "thinking",
              "detail": "Core démarré",
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Heartbeat initialisé.")
          PY

      - name: Validate Python modules if present
        run: |
          set -euo pipefail
          files=""
          for file in core.py self_evolution.py work_factory.py presence.py; do
            if [ -f "$file" ]; then
              files="$files $file"
            fi
          done

          if [ -n "$files" ]; then
            python -m py_compile $files
          else
            echo "Aucun module Python détecté ; validation ignorée."
          fi

      - name: Report execution policy
        run: |
          echo "=== NØX CORE ==="
          echo "External AI: DISABLED"
          echo "Gemini: DISABLED"
          echo "Project cost: 0 EUR"
          echo "Automatic payment: DISABLED"
          echo "Automatic spending: DISABLED"
          echo "Core validation completed."

      - name: Commit local state if changed
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox-agent@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "chore(nox): update core runtime state"
            git push
          else
            echo "Aucun changement à enregistrer."
          fi
