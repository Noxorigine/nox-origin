name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json

  MAX_FEED_ITEMS: "12"
  MAX_SUGGESTIONS: "10"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_POSTS: "12"
  MAX_CASES: "12"
  MAX_COGNITIVE_CASES: "150"
  MAX_MEMORY_ITEMS: "300"

  ACTION_THRESHOLD: "0.60"

  ENABLE_WEB_RESEARCH: "true"
  ENABLE_PUBLIC_ACTIONS: "false"
  ENABLE_LIGHTNING_CHECK: "true"

  WEB_TIMEOUT_SECONDS: "12"
  MAX_WEB_RESULTS: "5"

jobs:
  core-general:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install colony-sdk

      - name: Run NØX Core General
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from colony_sdk import ColonyClient


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = "https://thecolony.ai/api/v1"

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          LEGACY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_POSTS = int(os.environ["MAX_POSTS"])
          MAX_CASES = int(os.environ["MAX_CASES"])
          MAX_COGNITIVE_CASES = int(
              os.environ["MAX_COGNITIVE_CASES"]
          )
          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )

          ACTION_THRESHOLD = float(
              os.environ["ACTION_THRESHOLD"]
          )

          ENABLE_WEB = (
              os.environ["ENABLE_WEB_RESEARCH"].lower() == "true"
          )

          ENABLE_PUBLIC_ACTIONS = (
              os.environ["ENABLE_PUBLIC_ACTIONS"].lower() == "true"
          )

          ENABLE_LIGHTNING = (
              os.environ["ENABLE_LIGHTNING_CHECK"].lower() == "true"
          )

          WEB_TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          MAX_WEB_RESULTS = int(
              os.environ["MAX_WEB_RESULTS"]
          )

          NOW = datetime.now(timezone.utc).isoformat()


          # ============================================================
          # DEFAULT MEMORY / RUNTIME
          # ============================================================

          EMPTY_MEMORY = {
              "version": 4,
              "observations": [],
              "questions": [],
              "hypotheses": [],
              "decisions": [],
              "actions": [],
              "results": [],
              "learnings": [],
              "failures": [],
              "relationships": [],
              "cognitive_cases": [],
          }

          EMPTY_RUNTIME = {
              "version": 4,
              "run_count": 0,
              "last_run": None,
              "since_cursor": None,
              "since_error": None,
              "seen_event_ids": [],
              "processed_post_ids": [],
              "processed_suggestion_ids": [],
              "action_count_total": 0,
              "last_rate_limit": None,
              "payout_health": None,
          }


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  if isinstance(value, dict):
                      return value

                  return default

              except Exception as exc:
                  print(
                      f"WARNING: lecture impossible {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )


          def normalize_memory(data):
              memory = dict(EMPTY_MEMORY)

              if isinstance(data, dict):
                  try:
                      memory["version"] = max(
                          4,
                          int(data.get("version", 1) or 1),
                      )
                  except Exception:
                      memory["version"] = 4

                  for key in memory:
                      if key == "version":
                          continue

                      value = data.get(key, [])

                      memory[key] = (
                          value if isinstance(value, list)
                          else []
                      )

              return memory


          def normalize_runtime(data):
              runtime = dict(EMPTY_RUNTIME)

              if isinstance(data, dict):
                  runtime.update(data)

              for key in (
                  "seen_event_ids",
                  "processed_post_ids",
                  "processed_suggestion_ids",
              ):
                  if not isinstance(runtime.get(key), list):
                      runtime[key] = []

              return runtime


          memory = normalize_memory(
              load_json(MEMORY_FILE, EMPTY_MEMORY)
          )

          runtime = normalize_runtime(
              load_json(RUNTIME_FILE, EMPTY_RUNTIME)
          )


          # ============================================================
          # LEGACY MIGRATION
          # ============================================================

          if not MEMORY_FILE.exists() and LEGACY_FILE.exists():
              legacy = load_json(LEGACY_FILE, {})

              if isinstance(legacy, dict):
                  memory["observations"].append({
                      "timestamp": NOW,
                      "source": "legacy_migration",
                      "summary": (
                          "Legacy Colony memory imported into Core."
                      ),
                      "evidence": {
                          "commented_post_ids": len(
                              legacy.get(
                                  "commented_post_ids",
                                  [],
                              )
                          ),
                          "seen_notification_ids": len(
                              legacy.get(
                                  "seen_notification_ids",
                                  [],
                              )
                          ),
                          "skill_attempt_counts": (
                              legacy.get(
                                  "skill_attempt_counts",
                                  {},
                              )
                          ),
                          "skill_success_counts": (
                              legacy.get(
                                  "skill_success_counts",
                                  {},
                              )
                          ),
                      },
                  })

                  runtime["processed_post_ids"] = list(
                      legacy.get(
                          "commented_post_ids",
                          [],
                      )
                  )[-1000:]

                  runtime["seen_event_ids"] = list(
                      legacy.get(
                          "seen_notification_ids",
                          [],
                      )
                  )[-1000:]

                  print("LEGACY MEMORY MIGRATED")


          def add_memory(
              kind,
              item,
              limit=MAX_MEMORY_ITEMS,
          ):
              memory.setdefault(kind, [])
              memory[kind].append(item)
              memory[kind] = memory[kind][-limit:]


          def remember(
              kind,
              summary,
              evidence=None,
              source="core",
          ):
              add_memory(
                  kind,
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "evidence": evidence or {},
                      "source": source,
                  },
              )


          def clean(value, limit=2000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]


          def extract_items(response, keys):
              if isinstance(response, list):
                  return response

              if isinstance(response, dict):
                  for key in keys:
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

              return []


          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or item.get("comment_id")
                  or ""
              )


          def item_text(item):
              if not isinstance(item, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "subject",
                  "body",
                  "content",
                  "message",
                  "text",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      value = value.strip()

                      if value:
                          parts.append(value)

              return clean(
                  "\n".join(parts),
                  3000,
              )


          # ============================================================
          # RAW REST API
          #
          # Used only where the installed SDK version may differ.
          # Authentication is the documented Colony Bearer API key.
          # ============================================================

          def api_get(path, params=None):
              url = API_BASE + path

              if params:
                  url += "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": (
                          f"Bearer {API_KEY}"
                      ),
                      "Accept": "application/json",
                      "User-Agent": "Nox-Core-General/4",
                  },
                  method="GET",
              )

              with urllib.request.urlopen(
                  request,
                  timeout=WEB_TIMEOUT,
              ) as response:
                  payload = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

              return json.loads(payload)


          def rate_limit_snapshot(client):
              rate_limit = getattr(
                  client,
                  "last_rate_limit",
                  None,
              )

              if rate_limit is None:
                  return None

              result = {}

              for name in (
                  "limit",
                  "remaining",
                  "reset",
                  "retry_after",
              ):
                  try:
                      value = getattr(
                          rate_limit,
                          name,
                      )

                      if value is not None:
                          result[name] = (
                              value.isoformat()
                              if hasattr(
                                  value,
                                  "isoformat",
                              )
                              else value
                          )

                  except Exception:
                      pass

              return result or None


          # ============================================================
          # CONNECT / ORIENT
          # ============================================================

          client = ColonyClient(API_KEY)

          state = client.bootstrap()

          profile = {}

          if isinstance(state, dict):
              profile = state.get(
                  "profile",
                  {},
              )

          if not isinstance(profile, dict) or not profile:
              profile = client.get_me()

          username = clean(
              profile.get("username"),
              100,
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: "
                  f"profil inattendu '{username}'."
              )

          capabilities = (
              state.get("capabilities", {})
              if isinstance(state, dict)
              else {}
          )

          unread_dms = int(
              state.get(
                  "unread_direct_messages",
                  0,
              )
              if isinstance(state, dict)
              else 0
          )

          unread_notifications = int(
              state.get(
                  "unread_notifications",
                  0,
              )
              if isinstance(state, dict)
              else 0
          )

          print("=== NØX CORE GENERAL V4 ===")
          print(f"Profile: {username}")
          print(
              f"Karma: "
              f"{profile.get('karma', 'unknown')}"
          )
          print(
              f"Unread DMs: {unread_dms}"
          )
          print(
              "Unread notifications: "
              f"{unread_notifications}"
          )

          remember(
              "observations",
              "Colony bootstrap completed.",
              {
                  "username": username,
                  "karma": profile.get("karma"),
                  "capabilities": capabilities,
                  "unread_direct_messages": unread_dms,
                  "unread_notifications": unread_notifications,
              },
              "colony_bootstrap",
          )

          runtime["last_rate_limit"] = (
              rate_limit_snapshot(client)
          )


          # ============================================================
          # LIGHTNING — READ ONLY
          # ============================================================

          payout_health = {
              "status": "NOT_CHECKED",
              "lightning_address": None,
              "error": None,
          }

          if ENABLE_LIGHTNING:
              try:
                  me = client.get_me()

                  lightning = ""

                  if isinstance(me, dict):
                      lightning = (
                          me.get("lightning_address")
                          or me.get("lightningAddress")
                          or ""
                      )

                  if (
                      not isinstance(lightning, str)
                      or "@" not in lightning
                      or lightning.count("@") != 1
                  ):
                      payout_health["status"] = (
                          "PAYOUT_UNAVAILABLE"
                      )

                      payout_health["error"] = (
                          "missing_or_invalid_lightning_address"
                      )

                  else:
                      local, host = lightning.split(
                          "@",
                          1,
                      )

                      endpoint = (
                          f"https://{host}"
                          "/.well-known/lnurlp/"
                          f"{urllib.parse.quote(local, safe='')}"
                      )

                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": (
                                  "Nox-Core-General/4"
                              ),
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=WEB_TIMEOUT,
                      ) as response:
                          payload = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace",
                              )
                          )

                      if payload.get("tag") != "payRequest":
                          raise ValueError(
                              "LNURL tag is not payRequest"
                          )

                      callback = payload.get(
                          "callback",
                          "",
                      )

                      if not isinstance(
                          callback,
                          str,
                      ):
                          raise ValueError(
                              "LNURL callback missing"
                          )

                      if not callback.startswith(
                          (
                              "https://",
                              "http://",
                          )
                      ):
                          raise ValueError(
                              "LNURL callback invalid"
                          )

                      payout_health = {
                          "status": "PAYOUT_READY",
                          "lightning_address": lightning,
                          "min_sendable_msat": (
                              payload.get(
                                  "minSendable"
                              )
                          ),
                          "max_sendable_msat": (
                              payload.get(
                                  "maxSendable"
                              )
                          ),
                      }

                      remember(
                          "observations",
                          (
                              "NØX Lightning address "
                              "resolved successfully; "
                              "no payment initiated."
                          ),
                          {
                              "lightning_address": lightning,
                              "min_sendable_msat": (
                                  payload.get(
                                      "minSendable"
                                  )
                              ),
                              "max_sendable_msat": (
                                  payload.get(
                                      "maxSendable"
                                  )
                              ),
                          },
                          "lightning",
                      )

              except Exception as exc:
                  payout_health["status"] = (
                      "PAYOUT_UNAVAILABLE"
                  )
                  payout_health["error"] = clean(
                      exc,
                      500,
                  )

          runtime["payout_health"] = payout_health

          print(
              "Lightning: "
              f"{payout_health['status']}"
          )


          # ============================================================
          # INCREMENTAL ACTIVITY
          #
          # Official API:
          # GET /api/v1/since?since=<cursor>
          #
          # The previous next_cursor is reused exactly.
          #
          # We deliberately do NOT call client.since() here because the
          # Colony SDK version observed in NØX's previous run did not
          # expose that method.
          # ============================================================

          events = {
              "notifications": [],
              "messages": [],
              "posts": [],
          }

          previous_cursor = runtime.get(
              "since_cursor"
          )

          try:
              if previous_cursor:
                  since_value = previous_cursor
              else:
                  since_value = (
                      datetime.now(timezone.utc)
                      - timedelta(minutes=30)
                  ).isoformat()

              since_result = api_get(
                  "/since",
                  {
                      "since": since_value,
                  },
              )

              events["notifications"] = extract_items(
                  since_result,
                  (
                      "notifications",
                  ),
              )

              events["messages"] = extract_items(
                  since_result,
                  (
                      "messages",
                      "direct_messages",
                  ),
              )

              events["posts"] = extract_items(
                  since_result,
                  (
                      "posts",
                      "colony_posts",
                  ),
              )

              next_cursor = None

              if isinstance(
                  since_result,
                  dict,
              ):
                  next_cursor = (
                      since_result.get(
                          "next_cursor"
                      )
                      or since_result.get(
                          "cursor"
                      )
                  )

              if next_cursor:
                  runtime["since_cursor"] = (
                      next_cursor
                  )

              runtime["since_error"] = None

              print(
                  "SINCE: "
                  f"notifications="
                  f"{len(events['notifications'])} "
                  f"messages="
                  f"{len(events['messages'])} "
                  f"posts="
                  f"{len(events['posts'])}"
              )

          except Exception as exc:
              runtime["since_error"] = clean(
                  exc,
                  500,
              )

              remember(
                  "failures",
                  (
                      "Incremental Colony "
                      "activity could not be read."
                  ),
                  {
                      "error": clean(
                          exc,
                          500,
                      ),
                  },
                  "colony_since",
              )

              print(
                  f"SINCE_ERROR: {exc}"
              )


          # ============================================================
          # PERCEPTION
          # ============================================================

          try:
              feed_response = (
                  client.get_for_you_feed(
                      limit=MAX_FEED_ITEMS
                  )
              )

              feed_items = extract_items(
                  feed_response,
                  (
                      "items",
                      "posts",
                      "feed",
                  ),
              )

          except Exception as exc:
              feed_items = []

              remember(
                  "failures",
                  "For-you feed could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      ),
                  },
                  "colony_feed",
              )

              print(
                  f"FOR-YOU_ERROR: {exc}"
              )


          try:
              suggestion_response = (
                  client.get_suggestions(
                      limit=MAX_SUGGESTIONS
                  )
              )

              suggestions = extract_items(
                  suggestion_response,
                  (
                      "items",
                      "suggestions",
                  ),
              )

          except Exception as exc:
              suggestions = []

              remember(
                  "failures",
                  "Suggestions could not be read.",
                  {
                      "error": clean(
                          exc,
                          500,
                      ),
                  },
                  "colony_suggestions",
              )

              print(
                  f"SUGGESTIONS_ERROR: {exc}"
              )

          print(
              f"Feed: {len(feed_items)}"
          )

          print(
              f"Suggestions: {len(suggestions)}"
          )


          # ============================================================
          # RECALL
          # ============================================================

          def keywords(value):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean(
                      value,
                      4000,
                  ).lower(),
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "they",
                  "there",
                  "into",
                  "dans",
                  "pour",
                  "avec",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "être",
                  "plus",
                  "faire",
              }

              return [
                  word
                  for word in words
                  if word not in stop
              ][:20]


          def recall(
              terms,
              limit=5,
          ):
              wanted = set(
                  keywords(
                      " ".join(terms)
                  )
              )

              scored = []

              for kind, items in memory.items():
                  if (
                      kind == "version"
                      or not isinstance(
                          items,
                          list,
                      )
                  ):
                      continue

                  for item in items:
                      blob = clean(
                          json.dumps(
                              item,
                              ensure_ascii=False,
                          ),
                          12000,
                      ).lower()

                      score = sum(
                          1
                          for term in wanted
                          if term in blob
                      )

                      if score:
                          scored.append({
                              "kind": kind,
                              "score": score,
                              "item": item,
                          })

              scored.sort(
                  key=lambda value: value["score"],
                  reverse=True,
              )

              return scored[:limit]


          # ============================================================
          # UNDERSTAND / REFLECT
          # ============================================================

          def analyze(
              item,
              source,
          ):
              title = clean(
                  item.get("title")
                  or item.get("subject")
                  or item.get("name")
                  or "",
                  300,
              )

              body = item_text(item)[:2500]

              combined = (
                  f"{title}\n{body}"
              )

              low = combined.lower()

              questions = [
                  sentence.strip()
                  for sentence in re.split(
                      r"(?<=[?])\s+",
                      combined,
                  )
                  if "?" in sentence
              ][:4]

              evidence_signals = [
                  term
                  for term in (
                      "evidence",
                      "proof",
                      "test",
                      "result",
                      "data",
                      "verified",
                      "research",
                      "preuve",
                      "testé",
                      "résultat",
                      "données",
                      "vérifié",
                  )
                  if term in low
              ]

              contradiction_signals = [
                  term
                  for term in (
                      "but",
                      "however",
                      "yet",
                      "wrong",
                      "false",
                      "failed",
                      "contradiction",
                      "pourtant",
                      "cependant",
                      "erreur",
                      "faux",
                      "échec",
                  )
                  if term in low
              ]

              recalled = recall(
                  keywords(combined)
              )

              interest = 0.25

              if questions:
                  interest += 0.20

              if evidence_signals:
                  interest += 0.20

              if contradiction_signals:
                  interest += 0.20

              if recalled:
                  interest += 0.10

              if source == "suggestion":
                  interest += 0.05

              interest = min(
                  1.0,
                  round(
                      interest,
                      3,
                  ),
              )

              if contradiction_signals:
                  intent = (
                      "reconcile_conflict"
                  )
              elif evidence_signals:
                  intent = (
                      "verify_or_request_evidence"
                  )
              elif questions:
                  intent = (
                      "understand_question"
                  )
              else:
                  intent = "observe"

              hypotheses = []

              if evidence_signals:
                  hypotheses.append(
                      (
                          "The claim may require "
                          "evidence or a reproducible test."
                      )
                  )

              if contradiction_signals:
                  hypotheses.append(
                      (
                          "The disagreement may come "
                          "from different contexts or definitions."
                      )
                  )

              if recalled:
                  hypotheses.append(
                      (
                          "Previous NØX memory may be "
                          "relevant but is not automatically a rule."
                      )
                  )

              return {
                  "source": source,
                  "target_id": item_id(item),
                  "title": title,
                  "body": body,
                  "interest": interest,
                  "intent": intent,
                  "questions": questions,
                  "evidence_signals": evidence_signals,
                  "contradiction_signals": (
                      contradiction_signals
                  ),
                  "hypotheses": hypotheses,
                  "uncertainties": [
                      (
                          "The available context "
                          "may be incomplete."
                      )
                  ],
                  "recall": recalled,
              }


          candidates = []

          for item in events["notifications"][
              :MAX_NOTIFICATIONS
          ]:
              candidates.append(
                  analyze(
                      item,
                      "event_notification",
                  )
              )

          for item in events["messages"][
              :MAX_DMS
          ]:
              candidates.append(
                  analyze(
                      item,
                      "event_dm",
                  )
              )

          for item in events["posts"][
              :MAX_POSTS
          ]:
              candidates.append(
                  analyze(
                      item,
                      "event_post",
                  )
              )

          for item in feed_items[
              :MAX_FEED_ITEMS
          ]:
              candidates.append(
                  analyze(
                      item,
                      "for_you",
                  )
              )

          for item in suggestions[
              :MAX_SUGGESTIONS
          ]:
              candidates.append(
                  analyze(
                      item,
                      "suggestion",
                  )
              )


          # ============================================================
          # DEDUPLICATION
          # ============================================================

          unique = {}

          for case in candidates:
              key = (
                  case["source"],
                  case["target_id"],
                  case["title"],
              )

              if key not in unique:
                  unique[key] = case

              elif (
                  case["interest"]
                  > unique[key]["interest"]
              ):
                  unique[key] = case

          cases = sorted(
              unique.values(),
              key=lambda value: value["interest"],
              reverse=True,
          )[:MAX_CASES]


          # ============================================================
          # RESEARCH
          # ============================================================

          def web_search(query):
              if not ENABLE_WEB or not query:
                  return []

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + urllib.parse.urlencode({
                      "q": clean(
                          query,
                          400,
                      )
                  })
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; Nox-Core-General/4)"
                      )
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT,
                  ) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore",
                      )

              except Exception as exc:
                  print(
                      f"WEB_ERROR: {exc}"
                  )
                  return []

              results = []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*".*?</div>\s*</div>',
                  html,
                  flags=re.I | re.S,
              )

              for block in blocks:
                  if len(results) >= MAX_WEB_RESULTS:
                      break

                  title_match = re.search(
                      r'class="result__a"[^>]*>(.*?)</a>',
                      block,
                      flags=re.I | re.S,
                  )

                  url_match = re.search(
                      r'class="result__a"[^>]*href="([^"]+)"',
                      block,
                      flags=re.I,
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"[^>]*>(.*?)</',
                      block,
                      flags=re.I | re.S,
                  )

                  if not title_match:
                      continue

                  results.append({
                      "title": clean(
                          re.sub(
                              r"<[^>]+>",
                              "",
                              title_match.group(1),
                          ),
                          200,
                      ),
                      "url": (
                          urllib.parse.unquote(
                              url_match.group(1)
                          )[:500]
                          if url_match
                          else ""
                      ),
                      "snippet": (
                          clean(
                              re.sub(
                                  r"<[^>]+>",
                                  "",
                                  snippet_match.group(1),
                              ),
                              500,
                          )
                          if snippet_match
                          else ""
                      ),
                  })

              return results


          for case in cases:
              if (
                  case["interest"] >= 0.65
                  and (
                      case["questions"]
                      or case["evidence_signals"]
                  )
              ):
                  case["research"] = web_search(
                      (
                          f"{case['title']} "
                          f"{case['body'][:500]}"
                      )
                  )
              else:
                  case["research"] = []


          # ============================================================
          # CHOOSE
          # ============================================================

          chosen = []

          for case in cases:
              if case["interest"] < ACTION_THRESHOLD:
                  case["decision"] = "do_nothing"

                  case["decision_reason"] = (
                      "Below the current intervention threshold."
                  )

                  continue

              if case["intent"] == "observe":
                  case["decision"] = "do_nothing"

                  case["decision_reason"] = (
                      "No concrete contribution "
                      "is demonstrated from the available context."
                  )

                  continue

              if (
                  case["source"] == "suggestion"
                  and not ENABLE_PUBLIC_ACTIONS
              ):
                  case["decision"] = (
                      "observe_suggestion"
                  )

                  case["decision_reason"] = (
                      "Suggestion recorded; "
                      "public actions are disabled."
                  )

                  continue

              if (
                  case["intent"]
                  == "understand_question"
              ):
                  case["decision"] = (
                      "understand_context"
                  )

              elif (
                  case["intent"]
                  == "verify_or_request_evidence"
              ):
                  case["decision"] = (
                      "verify_evidence"
                  )

              elif (
                  case["intent"]
                  == "reconcile_conflict"
              ):
                  case["decision"] = (
                      "reconstruct_conflict"
                  )

              else:
                  case["decision"] = "observe"

              case["decision_reason"] = (
                  "Core selected the next cognitive step; "
                  "public execution is disabled in foundation mode."
              )

              chosen.append(case)


          # ============================================================
          # ACT
          #
          # Foundation mode:
          # - no post
          # - no comment
          # - no DM
          # - no vote
          # - no marketplace action
          #
          # The Core records its choice without pretending it executed it.
          # ============================================================

          for case in chosen:
              remember(
                  "decisions",
                  (
                      f"Core selected "
                      f"{case['decision']}."
                  ),
                  {
                      "case_id": case["target_id"],
                      "source": case["source"],
                      "interest": case["interest"],
                      "reason": (
                          case["decision_reason"]
                      ),
                  },
              )

              remember(
                  "actions",
                  (
                      f"Action candidate: "
                      f"{case['decision']}"
                  ),
                  {
                      "target_id": case["target_id"],
                      "execution_layer": (
                          "colony_presence_or_action"
                      ),
                      "status": (
                          "queued_not_executed"
                      ),
                  },
              )


          # ============================================================
          # OBSERVE / LEARN
          #
          # No public action was executed.
          # Therefore no result is invented and no learning is claimed.
          # ============================================================

          for case in cases:
              if case["source"].startswith(
                  "event_"
              ):
                  remember(
                      "observations",
                      (
                          "New Colony event observed: "
                          f"{case['intent']}."
                      ),
                      {
                          "source": case["source"],
                          "target_id": (
                              case["target_id"]
                          ),
                          "title": case["title"],
                          "interest": (
                              case["interest"]
                          ),
                      },
                      "colony_event",
                  )

              if case.get("research"):
                  remember(
                      "observations",
                      (
                          "Read-only web research "
                          "produced candidate sources."
                      ),
                      {
                          "target_id": (
                              case["target_id"]
                          ),
                          "result_count": len(
                              case["research"]
                          ),
                          "sources": [
                              result["url"]
                              for result in case["research"]
                              if result.get("url")
                          ][:MAX_WEB_RESULTS],
                      },
                      "web_research",
                  )

              add_memory(
                  "cognitive_cases",
                  {
                      "timestamp": NOW,
                      "source": case["source"],
                      "target_id": case["target_id"],
                      "title": case["title"],
                      "intent": case["intent"],
                      "interest": case["interest"],
                      "questions": case["questions"],
                      "hypotheses": (
                          case["hypotheses"]
                      ),
                      "uncertainties": (
                          case["uncertainties"]
                      ),
                      "decision": case.get(
                          "decision",
                          "do_nothing",
                      ),
                      "decision_reason": case.get(
                          "decision_reason",
                          "",
                      ),
                      "research": case.get(
                          "research",
                          [],
                      ),
                      "outcome": None,
                      "learning": None,
                  },
                  MAX_COGNITIVE_CASES,
              )


          # ============================================================
          # PERSISTENCE
          # ============================================================

          runtime["run_count"] = (
              int(
                  runtime.get(
                      "run_count",
                      0,
                  )
              ) + 1
          )

          runtime["last_run"] = NOW

          runtime["action_count_total"] = int(
              runtime.get(
                  "action_count_total",
                  0,
              )
          )

          runtime["processed_post_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_post_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if case["target_id"]
                  ]
              )
          )[-1000:]

          runtime["processed_suggestion_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "processed_suggestion_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if (
                          case["source"]
                          == "suggestion"
                          and case["target_id"]
                      )
                  ]
              )
          )[-500:]

          runtime["seen_event_ids"] = list(
              dict.fromkeys(
                  runtime.get(
                      "seen_event_ids",
                      [],
                  )
                  + [
                      case["target_id"]
                      for case in cases
                      if (
                          case["source"].startswith(
                              "event_"
                          )
                          and case["target_id"]
                      )
                  ]
              )
          )[-1000:]

          runtime["cognitive_version"] = 4

          runtime["last_observation"] = {
              "feed_items": len(feed_items),
              "suggestions": len(suggestions),
              "notifications": len(
                  events["notifications"]
              ),
              "messages": len(
                  events["messages"]
              ),
              "posts": len(
                  events["posts"]
              ),
              "cases": len(cases),
              "chosen": len(chosen),
              "executed_publicly": 0,
          }

          save_json(
              MEMORY_FILE,
              memory,
          )

          save_json(
              RUNTIME_FILE,
              runtime,
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          print("")
          print(
              "=== NØX CORE GENERAL V4 / SUMMARY ==="
          )
          print(
              f"Feed: {len(feed_items)}"
          )
          print(
              f"Suggestions: {len(suggestions)}"
          )
          print(
              "New notifications: "
              f"{len(events['notifications'])}"
          )
          print(
              f"New DMs: {len(events['messages'])}"
          )
          print(
              "New colony posts: "
              f"{len(events['posts'])}"
          )
          print(
              f"Cognitive cases: {len(cases)}"
          )
          print(
              f"Chosen: {len(chosen)}"
          )
          print(
              "Executed publicly: 0 "
              "(foundation mode)"
          )
          print(
              "Lightning: "
              f"{payout_health['status']}"
          )
          print(
              "Memory observations: "
              f"{len(memory['observations'])}"
          )
          print(
              "Memory decisions: "
              f"{len(memory['decisions'])}"
          )
          print(
              "Memory actions: "
              f"{len(memory['actions'])}"
          )
          print(
              "Memory results: "
              f"{len(memory['results'])}"
          )
          print(
              "Memory learnings: "
              f"{len(memory['learnings'])}"
          )
          print(
              "Memory failures: "
              f"{len(memory['failures'])}"
          )
          print(
              "Memory cognitive cases: "
              f"{len(memory['cognitive_cases'])}"
          )
          print(
              "=== RESEARCH -> UNDERSTAND -> RECALL -> "
              "REFLECT -> CHOOSE -> ACT -> OBSERVE -> "
              "LEARN -> ADAPT ==="
          )
          PY

      - name: Commit Core memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_core_memory.json \
            memory/nox_core_runtime.json

          if git diff --cached --quiet; then
            echo "Aucune modification mémoire."
          else
            git commit -m "nox: update core cognitive memory"
            git push
          fi
