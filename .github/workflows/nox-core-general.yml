name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json

  MAX_TASKS_PER_RUN: "10"
  MAX_COMMENTS_PER_RUN: "2"
  MAX_AUTO_REPLIES_PER_RUN: "2"
  MAX_AUTO_REPLIES_PER_SENDER: "3"

  MAX_MEMORY_ITEMS: "250"
  MAX_WEB_RESULTS: "5"
  WEB_TIMEOUT_SECONDS: "12"

jobs:
  core-general:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: pip install colony-sdk

      - name: Run NØX Core General
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          from colony_sdk import ColonyClient, ColonyAuthError, ColonyAPIError


          # ===========================================================
          # NØX CORE GENERAL
          #
          # Research
          #     ↓
          # Understand
          #     ↓
          # Reflect
          #     ↓
          # Choose
          #     ↓
          # Act
          #     ↓
          # Observe
          #     ↓
          # Learn
          #     ↓
          # Adapt
          #
          # Contraintes:
          # - zéro Gemini
          # - zéro IA externe
          # - zéro dépense
          # - aucune API Colony inventée
          # - actions limitées et traçables
          # - mémoire cognitive persistante
          # - vérification LNURL-pay sans paiement
          # ===========================================================


          API_KEY = os.environ["COLONY_API_KEY"].strip()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          LEGACY_MEMORY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS_PER_RUN"])
          MAX_AUTO_REPLIES = int(os.environ["MAX_AUTO_REPLIES_PER_RUN"])
          MAX_AUTO_REPLIES_PER_SENDER = int(
              os.environ["MAX_AUTO_REPLIES_PER_SENDER"]
          )

          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_WEB_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          WEB_TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])

          NOW = datetime.now(timezone.utc).isoformat()


          # ===========================================================
          # 1. MÉMOIRE COGNITIVE CENTRALE
          # ===========================================================

          EMPTY_MEMORY = {
              "version": 1,
              "observations": [],
              "decisions": [],
              "actions": [],
              "learnings": [],
          }


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"WARNING: impossible de lire {path}: {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )


          def normalize_memory(data):
              if not isinstance(data, dict):
                  return dict(EMPTY_MEMORY)

              memory = {
                  "version": int(data.get("version", 1)),
                  "observations": data.get("observations", []),
                  "decisions": data.get("decisions", []),
                  "actions": data.get("actions", []),
                  "learnings": data.get("learnings", []),
              }

              for key in (
                  "observations",
                  "decisions",
                  "actions",
                  "learnings",
              ):
                  if not isinstance(memory[key], list):
                      memory[key] = []

              return memory


          memory = normalize_memory(
              load_json(MEMORY_FILE, EMPTY_MEMORY)
          )

          runtime = load_json(
              RUNTIME_FILE,
              {
                  "commented_post_ids": [],
                  "seen_notification_ids": [],
                  "auto_reply_counts": {},
                  "skill_attempt_counts": {},
                  "skill_success_counts": {},
                  "task_skills": {},
                  "web_queries": [],
                  "run_count": 0,
              },
          )


          # ===========================================================
          # 2. MIGRATION DE L'ANCIENNE MÉMOIRE COLONY
          # ===========================================================

          if (
              not MEMORY_FILE.exists()
              and LEGACY_MEMORY_FILE.exists()
          ):
              legacy = load_json(LEGACY_MEMORY_FILE, {})

              migration_observation = {
                  "timestamp": NOW,
                  "type": "migration",
                  "source": str(LEGACY_MEMORY_FILE),
                  "summary": "Ancienne mémoire Colony importée dans le Core General.",
                  "evidence": {
                      "commented_post_ids": len(
                          legacy.get("commented_post_ids", [])
                      ),
                      "seen_notification_ids": len(
                          legacy.get("seen_notification_ids", [])
                      ),
                      "skill_attempt_counts": legacy.get(
                          "skill_attempt_counts", {}
                      ),
                      "skill_success_counts": legacy.get(
                          "skill_success_counts", {}
                      ),
                  },
              }

              memory["observations"].append(migration_observation)

              runtime["commented_post_ids"] = list(
                  legacy.get("commented_post_ids", [])
              )[-1000:]

              runtime["seen_notification_ids"] = list(
                  legacy.get("seen_notification_ids", [])
              )[-1000:]

              runtime["auto_reply_counts"] = dict(
                  legacy.get("auto_reply_counts", {})
              )

              runtime["skill_attempt_counts"] = dict(
                  legacy.get("skill_attempt_counts", {})
              )

              runtime["skill_success_counts"] = dict(
                  legacy.get("skill_success_counts", {})
              )

              runtime["task_skills"] = dict(
                  legacy.get("task_skills", {})
              )

              print("=== MIGRATION LEGACY MEMORY -> CORE ===")


          # ===========================================================
          # 3. UTILITAIRES MÉMOIRE
          # ===========================================================

          def add_memory(kind, item):
              if kind not in memory:
                  memory[kind] = []

              memory[kind].append(item)

              if len(memory[kind]) > MAX_MEMORY_ITEMS:
                  memory[kind] = memory[kind][-MAX_MEMORY_ITEMS:]


          def remember_observation(summary, evidence=None, source="colony"):
              add_memory(
                  "observations",
                  {
                      "timestamp": NOW,
                      "source": source,
                      "summary": summary,
                      "evidence": evidence or {},
                  },
              )


          def remember_decision(summary, reason, confidence="medium"):
              add_memory(
                  "decisions",
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "reason": reason,
                      "confidence": confidence,
                  },
              )


          def remember_action(action, target=None, result="pending"):
              add_memory(
                  "actions",
                  {
                      "timestamp": NOW,
                      "action": action,
                      "target": target,
                      "result": result,
                  },
              )


          def remember_learning(summary, evidence=None):
              add_memory(
                  "learnings",
                  {
                      "timestamp": NOW,
                      "summary": summary,
                      "evidence": evidence or {},
                  },
              )


          # ===========================================================
          # 4. CAPACITÉS DE NØX
          # ===========================================================

          CAPABILITIES = {
              "recherche web": [
                  "research",
                  "web research",
                  "deep research",
                  "investigate",
                  "find information",
                  "recherche",
                  "investigation",
              ],
              "rédaction": [
                  "write",
                  "writing",
                  "report",
                  "research report",
                  "technical report",
                  "write a report",
                  "report writing",
                  "summary",
                  "article",
                  "résumé",
                  "rédaction",
              ],
              "python": [
                  "python",
                  "python script",
                  "script",
                  "automation",
              ],
              "données": [
                  "data",
                  "dataset",
                  "csv",
                  "json",
                  "clean data",
                  "extract data",
                  "data analysis",
              ],
              "outillage agent": [
                  "build agent tools",
                  "agent tooling",
                  "tool development",
                  "agent tool",
              ],
          }


          SUPPLY_MARKERS = [
              "for hire",
              "i offer",
              "my service",
              "available service",
              "offering",
              "i can provide",
              "i'm offering",
              "services available",
          ]


          def is_supply_post(text):
              return any(marker in text for marker in SUPPLY_MARKERS)


          def matched_capabilities(text):
              result = []

              for skill, keywords in CAPABILITIES.items():
                  if any(keyword in text for keyword in keywords):
                      result.append(skill)

              return result


          # ===========================================================
          # 5. RECHERCHE WEB AUTONOME
          #
          # Recherche déterministe.
          # Aucun modèle externe.
          # Aucun Gemini.
          #
          # La recherche est une capacité du Core, pas un workflow.
          # ===========================================================

          def web_search(query, max_results=MAX_WEB_RESULTS):
              query = " ".join(query.split()).strip()

              if not query:
                  return []

              encoded = urllib.parse.urlencode({"q": query})
              url = (
                  "https://html.duckduckgo.com/html/?"
                  + encoded
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; NOX-Core/1.0)"
                      )
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT,
                  ) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore",
                      )
              except Exception as exc:
                  print(f"WEB SEARCH unavailable: {exc}")
                  return []

              results = []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*"'
                  r'.*?</div>\s*</div>',
                  html,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              for block in blocks:
                  if len(results) >= max_results:
                      break

                  title_match = re.search(
                      r'class="result__a"[^>]*>(.*?)</a>',
                      block,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  url_match = re.search(
                      r'class="result__a"[^>]*href="([^"]+)"',
                      block,
                      flags=re.IGNORECASE,
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"[^>]*>(.*?)</',
                      block,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  if not title_match:
                      continue

                  title = re.sub(
                      r"<[^>]+>",
                      "",
                      title_match.group(1),
                  ).strip()

                  title = re.sub(r"\s+", " ", title)

                  snippet = ""
                  if snippet_match:
                      snippet = re.sub(
                          r"<[^>]+>",
                          "",
                          snippet_match.group(1),
                      )
                      snippet = re.sub(
                          r"\s+",
                          " ",
                          snippet,
                      ).strip()

                  result_url = ""
                  if url_match:
                      result_url = urllib.parse.unquote(
                          url_match.group(1)
                      )

                  results.append(
                      {
                          "title": title[:200],
                          "url": result_url[:500],
                          "snippet": snippet[:500],
                      }
                  )

              runtime["web_queries"].append(
                  {
                      "timestamp": NOW,
                      "query": query,
                      "results": len(results),
                  }
              )

              runtime["web_queries"] = runtime[
                  "web_queries"
              ][-100:]

              return results


          def research_task(title, body, skills):
              # Recherche courte et ciblée.
              # Elle ne sert pas à inventer une réponse :
              # elle sert à donner du contexte au Core.

              query_parts = []

              if title:
                  query_parts.append(title[:120])

              if skills:
                  query_parts.append(
                      " ".join(skills[:3])
                  )

              query = " ".join(query_parts).strip()

              if not query:
                  return []

              print(f"RESEARCH: {query}")

              results = web_search(query)

              if results:
                  remember_observation(
                      "Recherche Web effectuée pour comprendre une opportunité Colony.",
                      {
                          "query": query,
                          "results": [
                              {
                                  "title": item["title"],
                                  "url": item["url"],
                              }
                              for item in results
                          ],
                      },
                      source="web",
                  )

              return results


          # ===========================================================
          # 6. CONNAISSANCE EXISTANTE
          # ===========================================================

          def memory_search_terms(terms):
              terms = [
                  term.lower()
                  for term in terms
                  if term
              ]

              matches = []

              for kind in (
                  "observations",
                  "decisions",
                  "actions",
                  "learnings",
              ):
                  for item in memory.get(kind, []):
                      text = json.dumps(
                          item,
                          ensure_ascii=False,
                      ).lower()

                      score = sum(
                          1
                          for term in terms
                          if term in text
                      )

                      if score:
                          matches.append(
                              (score, kind, item)
                          )

              matches.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              return matches[:10]


          # ===========================================================
          # 7. PERFORMANCE / ADAPTATION
          # ===========================================================

          skill_success = runtime.get(
              "skill_success_counts",
              {},
          )

          skill_attempts = runtime.get(
              "skill_attempt_counts",
              {},
          )


          def skill_weight(skill):
              success = skill_success.get(skill, 0)
              attempts = skill_attempts.get(skill, 0)

              # Laplace smoothing :
              # évite de déclarer une compétence bonne ou mauvaise
              # après un seul événement.
              return (success + 1) / (attempts + 2)


          def task_score(post, skills):
              title = post.get("title", "")
              body = post.get("body", "")

              text = (
                  title + " " + body
              ).lower()

              score = 0.0

              for skill in skills:
                  score += skill_weight(skill)

              # Les missions explicitement orientées recherche,
              # rapport, outils ou données sont légèrement favorisées.
              high_value_markers = [
                  "deep research",
                  "research report",
                  "technical report",
                  "report writing",
                  "build agent tools",
                  "agent tooling",
                  "tool development",
              ]

              for marker in high_value_markers:
                  if marker in text:
                      score += 0.35

              # Bonus modéré pour les tâches réellement rémunérées.
              reward_markers = [
                  "sats",
                  "paid",
                  "reward",
                  "payment",
                  "bounty",
              ]

              if any(
                  marker in text
                  for marker in reward_markers
              ):
                  score += 0.25

              return score


          # ===========================================================
          # 8. CONNEXION COLONY + PAYOUT HEALTH CHECK
          # ===========================================================

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError:
              raise SystemExit(
                  "Clé API Colony invalide ou révoquée."
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur API Colony : {exc}"
              )

          profile = state["profile"]

          print(
              "=== NØX CORE GENERAL ==="
          )
          print(
              f"Profile: {profile.get('username')}"
          )
          print(
              f"Karma: {profile.get('karma')}"
          )


          # ===========================================================
          # 8.1 IDENTITÉ + ADRESSE LIGHTNING
          # ===========================================================

          me = None

          payout_health = {
              "timestamp": NOW,
              "status": "PAYOUT_UNAVAILABLE",
              "lightning_address": None,
              "endpoint": None,
              "tag": None,
              "callback": None,
              "min_sendable_msat": None,
              "max_sendable_msat": None,
              "error": None,
          }


          try:
              me = client.get_me()

              if not isinstance(me, dict):
                  raise ValueError(
                      "Réponse get_me() inattendue."
                  )

              username = str(
                  me.get("username") or ""
              ).strip()

              lightning_address = str(
                  me.get("lightning_address") or ""
              ).strip()

              print(
                  f"Authenticated profile: {username or 'unknown'}"
              )

              if username and username != "nox_origine":
                  raise SystemExit(
                      "SECURITY STOP: le profil Colony authentifié "
                      f"est '{username}', pas 'nox_origine'."
                  )

              payout_health[
                  "lightning_address"
              ] = lightning_address or None

              if not lightning_address:
                  print(
                      "PAYOUT: aucune adresse Lightning configurée."
                  )

                  payout_health["error"] = (
                      "missing_lightning_address"
                  )

              else:
                  print(
                      f"Lightning: {lightning_address}"
                  )


                  # =====================================================
                  # 8.2 RÉSOLUTION LNURL-PAY
                  #
                  # Aucun paiement.
                  # Aucun invoice.
                  # Aucun appel Colony d'écriture.
                  #
                  # On vérifie uniquement que l'adresse publique
                  # annoncée par le profil peut être résolue.
                  # =====================================================

                  if (
                      lightning_address.count("@") != 1
                  ):
                      payout_health["error"] = (
                          "invalid_lightning_address_format"
                      )

                      print(
                          "PAYOUT: adresse Lightning mal formée."
                      )

                  else:
                      local_part, host = (
                          lightning_address.split("@", 1)
                      )

                      local_part = local_part.strip()
                      host = host.strip().lower()

                      if not local_part or not host:
                          payout_health["error"] = (
                              "invalid_lightning_address_components"
                          )

                          print(
                              "PAYOUT: adresse Lightning incomplète."
                          )

                      else:
                          encoded_name = urllib.parse.quote(
                              local_part,
                              safe="",
                          )

                          lnurl_endpoint = (
                              f"https://{host}"
                              f"/.well-known/lnurlp/"
                              f"{encoded_name}"
                          )

                          payout_health["endpoint"] = (
                              lnurl_endpoint
                          )

                          print(
                              f"PAYOUT CHECK: {lnurl_endpoint}"
                          )

                          request = urllib.request.Request(
                              lnurl_endpoint,
                              headers={
                                  "User-Agent": (
                                      "Mozilla/5.0 "
                                      "(compatible; NOX-Core/1.0)"
                                  ),
                                  "Accept": "application/json",
                              },
                              method="GET",
                          )

                          try:
                              with urllib.request.urlopen(
                                  request,
                                  timeout=WEB_TIMEOUT,
                              ) as response:
                                  status_code = getattr(
                                      response,
                                      "status",
                                      None,
                                  )

                                  raw = response.read()

                              if status_code is not None:
                                  print(
                                      f"PAYOUT HTTP: {status_code}"
                                  )

                              payload = json.loads(
