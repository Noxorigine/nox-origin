name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-core-general
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json
  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"
  ENABLE_LIGHTNING_CHECK: "true"

jobs:
  core-general:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient


          # ===========================================================
          # 1. CONFIGURATION
          # ===========================================================

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          NOW = datetime.now(timezone.utc).isoformat()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          LEGACY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_CASES_MEMORY = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_PENDING = int(os.environ["MAX_PENDING_ACTIONS"])
          MAX_WORK = int(os.environ["MAX_WORK_REQUESTS"])
          ENABLE_LIGHTNING = (
              os.environ["ENABLE_LIGHTNING_CHECK"].lower() == "true"
          )


          # ===========================================================
          # 2. DEFAULT MEMORY / RUNTIME
          # ===========================================================

          EMPTY_MEMORY = {
              "version": 7,
              "observations": [],
              "questions": [],
              "hypotheses": [],
              "decisions": [],
              "actions": [],
              "results": [],
              "learnings": [],
              "failures": [],
              "relationships": [],
              "cognitive_cases": []
          }

          EMPTY_RUNTIME = {
              "version": 7,
              "run_count": 0,
              "last_run": None,
              "seen_event_ids": [],
              "processed_post_ids": [],
              "processed_suggestion_ids": [],
              "action_count_total": 0,
              "last_rate_limit": None,
              "payout_health": None,
              "pending_actions": [],
              "work_requests": [],
              "consumed_work_result_ids": [],
              "consumed_presence_outcome_ids": [],
              "last_cycle": None
          }


          # ===========================================================
          # 3. STORAGE HELPERS
          # ===========================================================

          def load(path, default):
              if not path.exists():
                  return json.loads(json.dumps(default))

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  if isinstance(value, dict):
                      return value

                  return json.loads(json.dumps(default))

              except Exception as exc:
                  print(f"WARNING: cannot read {path}: {exc}")
                  return json.loads(json.dumps(default))


          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()[:limit]


          def blob(value):
              try:
                  return clean(
                      json.dumps(
                          value,
                          ensure_ascii=False
                      ),
                      12000
                  ).lower()
              except Exception:
                  return clean(value, 12000).lower()


          def stable(prefix, *parts):
              raw = "|".join(
                  clean(part, 5000)
                  for part in parts
              )

              digest = sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]

              return f"{prefix}-{digest}"


          def ensure(memory, key):
              if not isinstance(memory.get(key), list):
                  memory[key] = []

              return memory[key]


          def add(memory, key, item, limit=MAX_MEMORY):
              values = ensure(memory, key)
              values.append(item)

              if len(values) > limit:
                  del values[:-limit]


          def remember(
              memory,
              key,
              summary,
              evidence=None,
              source="core"
          ):
              add(
                  memory,
                  key,
                  {
                      "timestamp": NOW,
                      "summary": clean(summary, 1000),
                      "evidence": evidence or {},
                      "source": source
                  }
              )


          memory = load(
              MEMORY_FILE,
              EMPTY_MEMORY
          )

          runtime = load(
              RUNTIME_FILE,
              EMPTY_RUNTIME
          )

          work = load(
              WORK_FILE,
              {
                  "version": 4,
                  "history": [],
                  "completed": [],
                  "attempts": {}
              }
          )

          presence = load(
              PRESENCE_FILE,
              {
                  "version": 4,
                  "runs": [],
                  "outcomes": []
              }
          )


          # ===========================================================
          # 4. NORMALIZE STATE
          # ===========================================================

          for key in EMPTY_MEMORY:
              if key == "version":
                  continue

              if not isinstance(memory.get(key), list):
                  memory[key] = []


          for key, value in EMPTY_RUNTIME.items():
              if key not in runtime:
                  runtime[key] = json.loads(
                      json.dumps(value)
                  )


          memory["version"] = max(
              7,
              int(memory.get("version", 1) or 1)
          )

          runtime["version"] = 7

          if not isinstance(runtime.get("pending_actions"), list):
              runtime["pending_actions"] = []

          if not isinstance(runtime.get("work_requests"), list):
              runtime["work_requests"] = []

          if not isinstance(
              runtime.get("consumed_work_result_ids"),
              list
          ):
              runtime["consumed_work_result_ids"] = []

          if not isinstance(
              runtime.get("consumed_presence_outcome_ids"),
              list
          ):
              runtime["consumed_presence_outcome_ids"] = []


          # ===========================================================
          # 5. LEGACY MIGRATION
          # ===========================================================

          if not MEMORY_FILE.exists() and LEGACY_FILE.exists():
              legacy = load(
                  LEGACY_FILE,
                  {}
              )

              remember(
                  memory,
                  "observations",
                  "Legacy Colony memory imported into Core.",
                  {
                      "commented_post_ids": len(
                          legacy.get(
                              "commented_post_ids",
                              []
                          )
                      ),
                      "seen_notification_ids": len(
                          legacy.get(
                              "seen_notification_ids",
                              []
                          )
                      )
                  },
                  "legacy_migration"
              )


          # ===========================================================
          # 6. GENERAL HELPERS
          # ===========================================================

          def extract(value, keys):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in keys:
                      if isinstance(value.get(key), list):
                          return value[key]

              return []


          def rate_limit(client):
              rl = getattr(
                  client,
                  "last_rate_limit",
                  None
              )

              if rl is None:
                  return None

              result = {}

              for name in (
                  "limit",
                  "remaining",
                  "reset",
                  "retry_after"
              ):
                  try:
                      value = getattr(
                          rl,
                          name
                      )

                      if value is not None:
                          result[name] = (
                              value.isoformat()
                              if hasattr(value, "isoformat")
                              else value
                          )

                  except Exception:
                      pass

              return result or None


          def terms(text):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean(text, 5000).lower()
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "they",
                  "there",
                  "into",
                  "then",
                  "than",
                  "just",
                  "pour",
                  "avec",
                  "dans",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "plus",
                  "faire",
                  "être",
                  "sont",
                  "pourquoi",
                  "comment"
              }

              result = []

              for word in words:
                  if (
                      word not in stop
                      and word not in result
                  ):
                      result.append(word)

              return result[:30]


          def recall(memory, text, limit=6):
              wanted = set(terms(text))
              scored = []

              for kind, values in memory.items():

                  if (
                      kind == "version"
                      or not isinstance(values, list)
                  ):
                      continue

                  for item in values:
                      score = sum(
                          1
                          for term in wanted
                          if term in blob(item)
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": item
                              }
                          )

              scored.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              return scored[:limit]


          # ===========================================================
          # 7. COLONY BOOTSTRAP
          # ===========================================================

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()

          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )

          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )


          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: profil NØX inattendu "
                  f"'{username}'."
              )


          runtime["last_rate_limit"] = rate_limit(
              client
          )


          remember(
              memory,
              "observations",
              "Colony bootstrap completed.",
              {
                  "username": username,
                  "karma": profile.get("karma"),
                  "capabilities": (
                      state.get("capabilities", {})
                      if isinstance(state, dict)
                      else {}
                  ),
                  "unread_notifications": (
                      state.get(
                          "unread_notifications",
                          0
                      )
                      if isinstance(state, dict)
                      else 0
                  ),
                  "unread_direct_messages": (
                      state.get(
                          "unread_direct_messages",
                          0
                      )
                      if isinstance(state, dict)
                      else 0
                  )
              },
              "colony_bootstrap"
          )


          # ===========================================================
          # 8. LIGHTNING HEALTH CHECK
          # READ ONLY — NEVER SENDS MONEY
          # ===========================================================

          payout = {
              "status": "NOT_CHECKED",
              "lightning_address": None
          }

          if ENABLE_LIGHTNING:
              try:
                  me = client.get_me()

                  lightning = clean(
                      me.get("lightning_address")
                      if isinstance(me, dict)
                      else "",
                      300
                  )

                  payout["lightning_address"] = (
                      lightning or None
                  )

                  if lightning.count("@") != 1:
                      payout["status"] = (
                          "PAYOUT_UNAVAILABLE"
                      )

                  else:
                      local, host = lightning.split(
                          "@",
                          1
                      )

                      endpoint = (
                          f"https://{host}"
                          f"/.well-known/lnurlp/"
                          f"{urllib.parse.quote(local, safe='')}"
                      )

                      request = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "NOX-Core/7"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=12
                      ) as response:

                          payload = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                      callback = str(
                          payload.get(
                              "callback",
                              ""
                          )
                      )

                      if (
                          payload.get("tag")
                          != "payRequest"
                          or not callback.startswith(
                              ("https://", "http://")
                          )
                      ):
                          raise ValueError(
                              "invalid LNURL pay metadata"
                          )

                      payout.update(
                          {
                              "status": "PAYOUT_READY",
                              "min_sendable_msat": payload.get(
                                  "minSendable"
                              ),
                              "max_sendable_msat": payload.get(
                                  "maxSendable"
                              )
                          }
                      )

              except Exception as exc:
                  payout = {
                      "status": "PAYOUT_UNAVAILABLE",
                      "lightning_address": payout.get(
                          "lightning_address"
                      ),
                      "error": clean(exc, 500)
                  }

          runtime["payout_health"] = payout


          # ===========================================================
          # 9. READ CURRENT COLONY INPUTS
          # ===========================================================

          notifications = []

          if int(
              state.get(
                  "unread_notifications",
                  0
              )
              or 0
          ) > 0:

              try:
                  notifications = extract(
                      client.get_notifications(
                          unread_only=True
                      ),
                      (
                          "items",
                          "notifications"
                      )
                  )[:MAX_NOTIFICATIONS]

              except Exception as exc:
                  remember(
                      memory,
                      "failures",
                      "Unread notifications could not be read.",
                      {
                          "error": clean(exc, 500)
                      },
                      "colony_notifications"
                  )


          messages = []

          if int(
              state.get(
                  "unread_direct_messages",
                  0
              )
              or 0
          ) > 0:

              try:
                  conversations = extract(
                      client.list_conversations(),
                      (
                          "items",
                          "conversations"
                      )
                  )

                  for conversation in conversations:

                      if (
                          len(messages) >= MAX_DMS
                          or not isinstance(
                              conversation,
                              dict
                          )
                      ):
                          break

                      unread = int(
                          conversation.get(
                              "unread_count",
                              conversation.get(
                                  "unread",
                                  0
                              )
                          )
                          or 0
                      )

                      other = (
                          conversation.get("username")
                          or conversation.get(
                              "other_username"
                          )
                          or conversation.get(
                              "with_username"
                          )
                      )

                      if unread <= 0 or not other:
                          continue

                      try:
                          detail = extract(
                              client.get_conversation(
                                  str(other)
                              ),
                              (
                                  "items",
                                  "messages"
                              )
                          )

                          messages.extend(
                              detail[-MAX_DMS:]
                          )

                      except Exception as exc:
                          remember(
                              memory,
                              "failures",
                              "A conversation could not be inspected.",
                              {
                                  "username": other,
                                  "error": clean(
                                      exc,
                                      500
                                  )
                              },
                              "colony_messages"
                          )

                  messages = messages[:MAX_DMS]

              except Exception as exc:
                  remember(
                      memory,
                      "failures",
                      "Conversation list could not be read.",
                      {
                          "error": clean(exc, 500)
                      },
                      "colony_messages"
                  )


          try:
              feed = extract(
                  client.get_for_you_feed(
                      limit=MAX_FEED
                  ),
                  (
                      "items",
                      "posts",
                      "feed"
                  )
              )

          except Exception as exc:
              feed = []

              remember(
                  memory,
                  "failures",
                  "For-you feed could not be read.",
                  {
                      "error": clean(exc, 500)
                  },
                  "colony_feed"
              )


          try:
              suggestions = extract(
                  client.get_suggestions(
                      limit=MAX_SUGGESTIONS
                  ),
                  (
                      "items",
                      "suggestions"
                  )
              )

          except Exception as exc:
              suggestions = []

              remember(
                  memory,
                  "failures",
                  "Suggestions could not be read.",
                  {
                      "error": clean(exc, 500)
                  },
                  "colony_suggestions"
              )


          # ===========================================================
          # 10. NORMALIZE COLONY OBJECTS
          # ===========================================================

          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or item.get("notification_id")
                  or item.get("message_id")
                  or ""
              )


          def title(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("title")
                  or item.get("subject")
                  or "",
                  300
              )


          def body(item):
              if not isinstance(item, dict):
                  return clean(
                      item,
                      3000
                  )

              return clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("message")
                  or item.get("text")
                  or "",
                  3000
              )


          def author(item):
              if not isinstance(item, dict):
                  return ""

              value = item.get("author")

              if isinstance(value, dict):
                  return clean(
                      value.get("username")
                      or value.get("display_name"),
                      100
                  )

              return clean(
                  item.get("author_username")
                  or item.get("username"),
                  100
              )


          # ===========================================================
          # 11. COGNITIVE CLASSIFICATION
          # ===========================================================

          def classify(item, source):

              text = (
                  f"{title(item)}\n"
                  f"{body(item)}"
              )

              low = text.lower()

              questions = re.findall(
                  r"[^.!?]{5,}\?",
                  text
              )[:4]

              evidence = [
                  term
                  for term in (
                      "evidence",
                      "proof",
                      "data",
                      "test",
                      "result",
                      "verified",
                      "research",
                      "preuve",
                      "données",
                      "testé",
                      "résultat",
                      "vérifié"
                  )
                  if term in low
              ]

              conflicts = [
                  term
                  for term in (
                      "however",
                      "but",
                      "yet",
                      "contradiction",
                      "failed",
                      "wrong",
                      "false",
                      "pourtant",
                      "cependant",
                      "contradiction",
                      "échec",
                      "faux"
                  )
                  if term in low
              ]

              memory_hits = recall(
                  memory,
                  text
              )

              has_substance = (
                  len(body(item)) >= 120
                  or bool(questions)
                  or bool(evidence)
                  or bool(conflicts)
              )

              if not has_substance:
                  return None

              if conflicts:
                  intent = "reconcile_conflict"

              elif questions:
                  intent = "answer_or_research_question"

              elif evidence:
                  intent = "verify_claim"

              else:
                  intent = "contextual_observation"

              return {
                  "id": stable(
                      "case",
                      source,
                      item_id(item),
                      title(item),
                      body(item)[:700]
                  ),
                  "source": source,
                  "target_id": item_id(item),
                  "title": title(item),
                  "body": body(item),
                  "author": author(item),
                  "intent": intent,
                  "questions": questions,
                  "evidence_signals": evidence,
                  "conflict_signals": conflicts,
                  "terms": terms(text),
                  "memory_hits": memory_hits,
                  "uncertainty": [
                      "The available context may be incomplete."
                  ],
                  "created_at": (
                      item.get("created_at")
                      if isinstance(item, dict)
                      else None
                  )
              }


          # ===========================================================
          # 12. BUILD NEW COGNITIVE CASES
          # ===========================================================

          raw_cases = []

          for item in feed:
              case = classify(
                  item,
                  "for_you"
              )

              if case:
                  raw_cases.append(case)


          for item in notifications:
              case = classify(
                  item,
                  "notification"
              )

              if case:
                  raw_cases.append(case)


          for item in messages:
              case = classify(
                  item,
                  "dm"
              )

              if case:
                  raw_cases.append(case)


          for item in suggestions:
              case = classify(
                  item,
                  "suggestion"
              )

              if case:
                  raw_cases.append(case)


          seen = set(
              runtime.get(
                  "seen_event_ids",
                  []
              )
          )

          processed
