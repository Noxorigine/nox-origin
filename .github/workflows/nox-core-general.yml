name: NØX - Core General

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_core_memory.json
  RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  LEGACY_MEMORY_FILE: memory/nox_colony_state.json
  MAX_FEED_ITEMS: "12"
  MAX_NOTIFICATIONS: "20"
  MAX_DMS: "10"
  MAX_SUGGESTIONS: "10"
  MAX_CASES_PER_RUN: "12"
  MAX_MEMORY_ITEMS: "300"
  MAX_COGNITIVE_CASES: "150"
  MAX_PENDING_ACTIONS: "20"
  MAX_WORK_REQUESTS: "20"
  MAX_PUBLISH_ACTIONS: "3"
  ENABLE_LIGHTNING_CHECK: "true"

jobs:
  core-general:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("COLONY_API_KEY manquant.")

          NOW = datetime.now(timezone.utc).isoformat()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          LEGACY_FILE = Path(os.environ["LEGACY_MEMORY_FILE"])

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])
          MAX_DMS = int(os.environ["MAX_DMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CASES = int(os.environ["MAX_CASES_PER_RUN"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_CASES_MEMORY = int(os.environ["MAX_COGNITIVE_CASES"])
          MAX_PENDING = int(os.environ["MAX_PENDING_ACTIONS"])
          MAX_WORK = int(os.environ["MAX_WORK_REQUESTS"])
          MAX_PUBLISH = int(os.environ["MAX_PUBLISH_ACTIONS"])
          ENABLE_LIGHTNING = os.environ["ENABLE_LIGHTNING_CHECK"].lower() == "true"

          EMPTY_MEMORY = {
              "version": 7,
              "observations": [],
              "questions": [],
              "hypotheses": [],
              "decisions": [],
              "actions": [],
              "results": [],
              "learnings": [],
              "failures": [],
              "relationships": [],
              "cognitive_cases": []
          }

          EMPTY_RUNTIME = {
              "version": 7,
              "run_count": 0,
              "last_run": None,
              "seen_event_ids": [],
              "processed_post_ids": [],
              "processed_suggestion_ids": [],
              "action_count_total": 0,
              "last_rate_limit": None,
              "payout_health": None,
              "pending_actions": [],
              "work_requests": [],
              "consumed_work_result_ids": [],
              "consumed_presence_outcome_ids": [],
              "last_cycle": None
          }

          def load(path, default):
              if not path.exists():
                  return json.loads(json.dumps(default))
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else json.loads(json.dumps(default))
              except Exception as exc:
                  print(f"WARNING: cannot read {path}: {exc}")
                  return json.loads(json.dumps(default))

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          def clean(value, limit=3000):
              return re.sub(r"\s+", " ", str(value or "")).strip()[:limit]

          def blob(value):
              return clean(json.dumps(value, ensure_ascii=False), 12000).lower()

          def stable(prefix, *parts):
              raw = "|".join(clean(p, 5000) for p in parts)
              return f"{prefix}-{sha256(raw.encode('utf-8')).hexdigest()[:20]}"

          def ensure(memory, key):
              if not isinstance(memory.get(key), list):
                  memory[key] = []
              return memory[key]

          def add(memory, key, item, limit=MAX_MEMORY):
              values = ensure(memory, key)
              values.append(item)
              del values[:-limit]

          def remember(memory, key, summary, evidence=None, source="core"):
              add(
                  memory,
                  key,
                  {
                      "timestamp": NOW,
                      "summary": clean(summary, 1000),
                      "evidence": evidence or {},
                      "source": source
                  }
              )

          memory = load(MEMORY_FILE, EMPTY_MEMORY)
          runtime = load(RUNTIME_FILE, EMPTY_RUNTIME)
          work = load(
              WORK_FILE,
              {"version": 1, "history": [], "completed": []}
          )
          presence = load(
              PRESENCE_FILE,
              {"version": 1, "runs": [], "outcomes": []}
          )

          for key, value in EMPTY_MEMORY.items():
              if key != "version" and not isinstance(memory.get(key), list):
                  memory[key] = []

          for key, value in EMPTY_RUNTIME.items():
              if key not in runtime:
                  runtime[key] = json.loads(json.dumps(value))

          memory["version"] = max(
              7,
              int(memory.get("version", 1) or 1)
          )
          runtime["version"] = 7

          if not MEMORY_FILE.exists() and LEGACY_FILE.exists():
              legacy = load(LEGACY_FILE, {})
              remember(
                  memory,
                  "observations",
                  "Legacy Colony memory imported into Core.",
                  {
                      "commented_post_ids": len(
                          legacy.get("commented_post_ids", [])
                      ),
                      "seen_notification_ids": len(
                          legacy.get("seen_notification_ids", [])
                      )
                  },
                  "legacy_migration"
              )

          def extract(value, keys):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in keys:
                      if isinstance(value.get(key), list):
                          return value[key]

              return []

          def rate_limit(client):
              rl = getattr(client, "last_rate_limit", None)

              if rl is None:
                  return None

              result = {}

              for name in (
                  "limit",
                  "remaining",
                  "reset",
                  "retry_after"
              ):
                  try:
                      value = getattr(rl, name)

                      if value is not None:
                          result[name] = (
                              value.isoformat()
                              if hasattr(value, "isoformat")
                              else value
                          )
                  except Exception:
                      pass

              return result or None

          def terms(text):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean(text, 5000).lower()
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "they",
                  "there",
                  "into",
                  "then",
                  "than",
                  "just",
                  "pour",
                  "avec",
                  "dans",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "plus",
                  "faire",
                  "être",
                  "sont",
                  "pourquoi",
                  "comment"
              }

              out = []

              for word in words:
                  if word not in stop and word not in out:
                      out.append(word)

              return out[:30]

          def recall(memory, text, limit=6):
              wanted = set(terms(text))
              scored = []

              for kind, values in memory.items():
                  if kind == "version" or not isinstance(values, list):
                      continue

                  for item in values:
                      score = sum(
                          1
                          for term in wanted
                          if term in blob(item)
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": item
                              }
                          )

              scored.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              return scored[:limit]

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100
          )

          if username and username != "nox_origine":
              raise SystemExit(
                  f"SECURITY STOP: profil inattendu '{username}'."
              )

          runtime["last_rate_limit"] = rate_limit(client)

          remember(
              memory,
              "observations",
              "Colony bootstrap completed.",
              {
                  "username": username,
                  "karma": profile.get("karma"),
                  "capabilities": (
                      state.get("capabilities", {})
                      if isinstance(state, dict)
                      else {}
                  ),
                  "unread_notifications": (
                      state.get("unread_notifications", 0)
                      if isinstance(state, dict)
                      else 0
                  ),
                  "unread_direct_messages": (
                      state.get("unread_direct_messages", 0)
                      if isinstance(state, dict)
                      else 0
                  )
              },
              "colony_bootstrap"
          )

          payout = {
              "status": "NOT_CHECKED",
              "lightning_address": None
          }

          if ENABLE_LIGHTNING:
              try:
                  me = client.get_me()

                  lightning = clean(
                      me.get("lightning_address")
                      if isinstance(me, dict)
                      else "",
                      300
                  )

                  payout["lightning_address"] = (
                      lightning or None
                  )

                  if lightning.count("@") != 1:
                      payout["status"] = "PAYOUT_UNAVAILABLE"
                  else:
                      local, host = lightning.split("@", 1)

                      endpoint = (
                          f"https://{host}/"
                          f".well-known/lnurlp/"
                          f"{urllib.parse.quote(local, safe='')}"
                      )

                      req = urllib.request.Request(
                          endpoint,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "NOX-Core/7"
                          }
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=12
                      ) as response:
                          payload = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                      callback = str(
                          payload.get("callback", "")
                      )

                      if (
                          payload.get("tag") != "payRequest"
                          or not callback.startswith(
                              ("https://", "http://")
                          )
                      ):
                          raise ValueError(
                              "invalid LNURL pay metadata"
                          )

                      payout.update(
                          {
                              "status": "PAYOUT_READY",
                              "min_sendable_msat": payload.get(
                                  "minSendable"
                              ),
                              "max_sendable_msat": payload.get(
                                  "maxSendable"
                              )
                          }
                      )

              except Exception as exc:
                  payout = {
                      "status": "PAYOUT_UNAVAILABLE",
                      "lightning_address": payout.get(
                          "lightning_address"
                      ),
                      "error": clean(exc, 500)
                  }

          runtime["payout_health"] = payout

          notifications = []

          if int(
              state.get("unread_notifications", 0)
              or 0
          ) > 0:
              try:
                  notifications = extract(
                      client.get_notifications(
                          unread_only=True
                      ),
                      ("items", "notifications")
                  )[:MAX_NOTIFICATIONS]

              except Exception as exc:
                  remember(
                      memory,
                      "failures",
                      "Unread notifications could not be read.",
                      {"error": clean(exc, 500)},
                      "colony_notifications"
                  )

          # -----------------------------------------------------------
          # DIRECT MESSAGES
          #
          # Do not use unread_direct_messages as the actual detector.
          # Inspect conversations and use stable message IDs to avoid
          # replying twice to the same incoming message.
          # -----------------------------------------------------------

          def message_sender(message):
              if not isinstance(message, dict):
                  return ""

              sender = (
                  message.get("sender")
                  or message.get("author")
                  or message.get("from")
              )

              if isinstance(sender, dict):
                  return clean(
                      sender.get("username")
                      or sender.get("handle")
                      or sender.get("name"),
                      100
                  )

              return clean(
                  message.get("sender_username")
                  or message.get("author_username")
                  or message.get("from_username")
                  or sender,
                  100
              )

          messages = []

          try:
              conversations = list(
                  client.iter_conversations(
                      max_results=50
                  )
              )

              for conversation in conversations:
                  if (
                      len(messages) >= MAX_DMS
                      or not isinstance(conversation, dict)
                  ):
                      break

                  other = (
                      conversation.get("username")
                      or conversation.get("other_username")
                      or conversation.get("with_username")
                      or conversation.get("partner_username")
                  )

                  if not other:
                      continue

                  try:
                      detail = client.get_conversation(
                          str(other)
                      )

                      detail = extract(
                          detail,
                          ("items", "messages")
                      )

                      for message in detail[-MAX_DMS:]:
                          if not isinstance(message, dict):
                              continue

                          sender = message_sender(message)

                          if sender and sender == username:
                              continue

                          enriched = dict(message)

                          enriched[
                              "_conversation_username"
                          ] = str(other)

                          messages.append(enriched)

                          if len(messages) >= MAX_DMS:
                              break

                  except Exception as exc:
                      remember(
                          memory,
                          "failures",
                          "A conversation could not be inspected.",
                          {
                              "username": other,
                              "error": clean(exc, 500)
                          },
                          "colony_messages"
                      )

          except Exception as exc:
              remember(
                  memory,
                  "failures",
                  "Conversation inbox could not be read.",
                  {"error": clean(exc, 500)},
                  "colony_messages"
              )

          try:
              feed = extract(
                  client.get_for_you_feed(
                      limit=MAX_FEED,
                      kinds="posts"
                  ),
                  ("items", "posts", "feed")
              )

          except Exception as exc:
              feed = []

              remember(
                  memory,
                  "failures",
                  "For-you feed could not be read.",
                  {"error": clean(exc, 500)},
                  "colony_feed"
              )

          try:
              suggestions = extract(
                  client.get_suggestions(
                      limit=MAX_SUGGESTIONS
                  ),
                  ("items", "suggestions")
              )

          except Exception as exc:
              suggestions = []
              print(
                  f"SUGGESTIONS unavailable: {exc}"
              )

          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or item.get("notification_id")
                  or item.get("message_id")
                  or ""
              )

          # IMPORTANT:
          # For notifications, notification_id is an event ID.
          # The actual reply target must prefer comment_id/post_id.
          def target_id(item, source):
              if not isinstance(item, dict):
                  return ""

              if source == "dm":
                  return str(
                      item.get("message_id")
                      or item.get("id")
                      or ""
                  )

              return str(
                  item.get("comment_id")
                  or item.get("post_id")
                  or item.get("target_post_id")
                  or item.get("parent_post_id")
                  or item.get("id")
                  or ""
              )

          def event_id(item, source):
              if not isinstance(item, dict):
                  return ""

              if source == "dm":
                  return str(
                      item.get("message_id")
                      or item.get("id")
                      or ""
                  )

              if source == "notification":
                  return str(
                      item.get("notification_id")
                      or item.get("id")
                      or target_id(item, source)
                  )

              return target_id(item, source)

          def title(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("title")
                  or item.get("subject")
                  or "",
                  300
              )

          def body(item):
              if not isinstance(item, dict):
                  return clean(item, 3000)

              direct = (
                  item.get("body")
                  or item.get("content")
                  or item.get("message")
                  or item.get("text")
                  or ""
              )

              if isinstance(direct, dict):
                  direct = (
                      direct.get("body")
                      or direct.get("content")
                      or direct.get("text")
                      or direct.get("message")
                      or ""
                  )

              # Some notification payloads wrap the actual comment/post.
              nested = item.get("comment") or item.get("post")

              if not direct and isinstance(nested, dict):
                  direct = (
                      nested.get("body")
                      or nested.get("content")
                      or nested.get("text")
                      or nested.get("message")
                      or ""
                  )

              return clean(direct, 3000)

          def author(item):
              if not isinstance(item, dict):
                  return ""

              a = item.get("author")

              if isinstance(a, dict):
                  return clean(
                      a.get("username")
                      or a.get("display_name"),
                      100
                  )

              return clean(
                  item.get("author_username")
                  or item.get("username")
                  or item.get("sender_username")
                  or "",
                  100
              )

          def classify(item, source):
              text = (
                  f"{title(item)}\n"
                  f"{body(item)}"
              )

              low = text.lower()

              qs = re.findall(
                  r"[^.!?]{5,}\?",
                  text
              )[:4]

              evidence = [
                  x
                  for x in (
                      "evidence",
                      "proof",
                      "data",
                      "test",
                      "result",
                      "verified",
                      "research",
                      "preuve",
                      "données",
                      "testé",
                      "résultat",
                      "vérifié"
                  )
                  if x in low
              ]

              conflicts = [
                  x
                  for x in (
                      "however",
                      "but",
                      "yet",
                      "contradiction",
                      "failed",
                      "wrong",
                      "false",
                      "pourtant",
                      "cependant",
                      "échec",
                      "faux"
                  )
                  if x in low
              ]

              memory_hits = recall(
                  memory,
                  text
              )

              has_substance = (
                  len(body(item)) >= 80
                  or bool(qs)
                  or bool(evidence)
                  or bool(conflicts)
              )

              if not has_substance:
                  return None

              if conflicts:
                  intent = "reconcile_conflict"
              elif qs:
                  intent = "answer_or_research_question"
              elif evidence:
                  intent = "verify_claim"
              else:
                  intent = "contextual_observation"

              return {
                  "id": stable(
                      "case",
                      source,
                      event_id(item, source),
                      title(item),
                      body(item)[:700]
                  ),
                  "event_id": event_id(
                      item,
                      source
                  ),
                  "source": source,
                  "target_id": target_id(
                      item,
                      source
                  ),
                  "title": title(item),
                  "body": body(item),
                  "author": author(item),
                  "recipient": clean(
                      item.get("_conversation_username")
                      or item.get("recipient")
                      or "",
                      100
                  ) if (
                      source == "dm"
                      and isinstance(item, dict)
                  ) else "",
                  "intent": intent,
                  "questions": qs,
                  "evidence_signals": evidence,
                  "conflict_signals": conflicts,
                  "terms": terms(text),
                  "memory_hits": memory_hits,
                  "uncertainty": [
                      "The available context may be incomplete."
                  ],
                  "created_at": (
                      item.get("created_at")
                      if isinstance(item, dict)
                      else None
                  )
              }

          raw_cases = []

          for item in feed:
              case = classify(item, "for_you")
              if case:
                  raw_cases.append(case)

          for item in notifications:
              case = classify(
                  item,
                  "notification"
              )
              if case:
                  raw_cases.append(case)

          for item in messages:
              case = classify(item, "dm")
              if case:
                  raw_cases.append(case)

          for item in suggestions:
              case = classify(
                  item,
                  "suggestion"
              )
              if case:
                  raw_cases.append(case)

          seen = set(
              runtime.get(
                  "seen_event_ids",
                  []
              )
          )

          processed = set(
              runtime.get(
                  "processed_post_ids",
                  []
              )
          )

          unique = []
          local_seen = set()

          for case in raw_cases:
              event_key = (
                  case["event_id"]
                  or case["id"]
              )

              if event_key in local_seen:
                  continue

              if (
                  event_key in seen
                  and case["source"] in (
                      "notification",
                      "dm"
                  )
              ):
                  continue

              if (
                  case["target_id"] in processed
                  and case["source"] == "for_you"
              ):
                  continue

              if case["author"] == "nox_origine":
                  continue

              local_seen.add(event_key)
              unique.append(case)

          cases = unique[:MAX_CASES]

          # -----------------------------------------------------------
          # CLOSE PREVIOUS CYCLE
          # -----------------------------------------------------------

          consumed_work = set(
              runtime.get(
                  "consumed_work_result_ids",
                  []
              )
          )

          history = (
              work.get("history", [])
              if isinstance(work, dict)
              else []
          )

          for result in history:
              if not isinstance(result, dict):
                  continue

              rid = result.get("id")

              if not rid or rid in consumed_work:
                  continue

              request_id = result.get(
                  "request_id"
              )

              matched = None

              for case in memory.get(
                  "cognitive_cases",
                  []
              ):
                  if (
                      isinstance(case, dict)
                      and case.get("case_id")
                      == request_id
                  ):
                      matched = case
                      break

              if matched:
                  matched["research_result"] = result
                  matched["outcome"] = (
                      "research_returned"
                  )
                  matched["learning"] = None

              else:
                  add(
                      memory,
                      "results",
                      {
                          "timestamp": NOW,
                          "type": "research_result",
                          "request_id": request_id,
                          "result_id": rid,
                          "evidence_status": result.get(
                              "evidence_status"
                          ),
                          "conclusion": result.get(
                              "conclusion"
                          ),
                          "sources": (
                              result.get("sources", [])
                          )[:8]
                      }
                  )

              consumed_work.add(rid)

          runtime[
              "consumed_work_result_ids"
          ] = list(consumed_work)[-500:]

          consumed_presence = set(
              runtime.get(
                  "consumed_presence_outcome_ids",
                  []
              )
          )

          outcomes = (
              presence.get("outcomes", [])
              if isinstance(presence, dict)
              else []
          )

          for outcome in outcomes:
              if not isinstance(outcome, dict):
                  continue

              oid = outcome.get("id")

              if not oid or oid in consumed_presence:
                  continue

              for case in memory.get(
                  "cognitive_cases",
                  []
              ):
                  if (
                      isinstance(case, dict)
                      and case.get("case_id")
                      == outcome.get("case_id")
                  ):
                      case["outcome"] = (
                          outcome.get("status")
                      )

                      case["outcome_detail"] = outcome

                      if outcome.get(
                          "status"
                      ) == "executed":

                          add(
                              memory,
                              "results",
                              {
                                  "timestamp": NOW,
                                  "type": "public_action",
                                  "case_id": case.get(
                                      "case_id"
                                  ),
                                  "action_id": outcome.get(
                                      "action_id"
                                  ),
                                  "target_id": outcome.get(
                                      "target_id"
                                  ),
                                  "status": "executed"
                              }
                          )

                          remember(
                              memory,
                              "learnings",
                              "A planned public action executed successfully.",
                              {
                                  "case_id": case.get(
                                      "case_id"
                                  ),
                                  "action_id": outcome.get(
                                      "action_id"
                                  ),
                                  "target_id": outcome.get(
                                      "target_id"
                                  )
                              },
                              "presence_outcome"
                          )

                      elif outcome.get(
                          "status"
                      ) in (
                          "error",
                          "skipped"
                      ):

                          add(
                              memory,
                              "failures",
                              {
                                  "timestamp": NOW,
                                  "summary": (
                                      "A planned presence "
                                      "action did not execute."
                                  ),
                                  "evidence": outcome
                              },
                              MAX_MEMORY
                          )

                      break

              consumed_presence.add(oid)

          runtime[
              "consumed_presence_outcome_ids"
          ] = list(consumed_presence)[-500:]

          # Remove actions that Presence already resolved.
          resolved_action_ids = {
              o.get("action_id")
              for o in outcomes
              if (
                  isinstance(o, dict)
                  and o.get("status") in (
                      "executed",
                      "error",
                      "skipped"
                  )
              )
          }

          pending = []

          for action in runtime.get(
              "pending_actions",
              []
          ):
              if (
                  isinstance(action, dict)
                  and action.get("action_id")
                  not in resolved_action_ids
              ):
                  pending.append(action)

          runtime["pending_actions"] = (
              pending[-MAX_PENDING:]
          )

