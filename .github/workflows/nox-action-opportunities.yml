name: NØX - Action & Opportunities

on:
  workflow_dispatch:
    inputs:
      enable_bids:
        description: "Allow submitting bids (otherwise observation only)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  ACTION_MEMORY_FILE: "memory/nox_action_opportunities.json"
  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"
  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"
  MIN_BID_SCORE: "8"
  REQUEST_TIMEOUT_SECONDS: "15"
  NOX_USERNAME: "nox_origine"
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX Action & Opportunities
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          BIDDING_ENABLED: ${{ inputs.enable_bids && 'true' || vars.NOX_BIDDING_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Shared helpers for all NØX scripts (standard library only)."""
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from itertools import islice
          from pathlib import Path

          OWN_USERNAME = (os.environ.get("NOX_USERNAME") or "nox_origine").strip().lower()

          # ---------------------------------------------------------------- time / env
          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def parse_ts(value):
              if not value or not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          def env_flag(name, default=False):
              value = os.environ.get(name)
              if value is None or value.strip() == "":
                  return default
              return value.strip().lower() in {"1", "true", "yes", "on"}

          def check_policy():
              """Hard safety invariants: no spending, no payments, no external AI."""
              expected = {
                  "PROJECT_COST_EUR": "0",
                  "GEMINI_USED": "false",
                  "EXTERNAL_AI_USED": "false",
                  "AUTO_PAYMENT": "false",
                  "AUTO_SPENDING": "false",
              }
              for key, wanted in expected.items():
                  if os.environ.get(key, wanted).strip().lower() != wanted:
                      raise SystemExit(f"Unsafe policy: {key} must be {wanted}")

          # ---------------------------------------------------------------- json files
          def load_json(path, default=None):
              """Load a JSON object. Refuses to continue on corrupt files so that a
              parse error can never silently wipe the agent's state."""
              path = Path(path)
              default = {} if default is None else default
              if not path.exists():
                  return default
              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  return default
              try:
                  value = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {path} is not valid JSON ({exc}). "
                      "Restore it from git history; refusing to overwrite it."
                  )
              return value if isinstance(value, type(default)) else default

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(value, ensure_ascii=False, indent=2, default=str) + "\n"
              json.loads(payload)  # round-trip check
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          # ---------------------------------------------------------------- data utils
          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value, limit=None):
              if value is None:
                  out = ""
              elif isinstance(value, str):
                  out = value.strip()
              elif isinstance(value, dict):
                  out = ""
                  for key in ("content", "body", "text", "message", "title", "question"):
                      if value.get(key):
                          out = text(value[key])
                          break
                  if not out:
                      out = json.dumps(value, ensure_ascii=False, default=str)
              else:
                  out = str(value).strip()
              return out[:limit] if limit else out

          def collapse(value, limit=None):
              out = re.sub(r"\s+", " ", text(value)).strip()
              return out[:limit] if limit else out

          def clip(value, limit):
              out = text(value)
              return out if len(out) <= limit else out[: limit - 1].rstrip() + "…"

          def stable_id(prefix, *parts):
              raw = "|".join(str(p if p is not None else "") for p in parts)
              return f"{prefix}:{hashlib.sha256(raw.encode('utf-8')).hexdigest()[:16]}"

          def identity(item):
              """Stable identity of a stored item (id-like key, else content hash)."""
              if isinstance(item, dict):
                  for key in ("id", "action_id", "work_id", "result_id", "message_id", "post_id", "url"):
                      if item.get(key):
                          return f"{key}:{item[key]}"
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True, default=str)
              return "hash:" + hashlib.sha256(raw.encode("utf-8")).hexdigest()

          def dedupe_keep_last(items, limit=None):
              """Remove duplicates (keeping the most recent occurrence) and keep list
              order chronological (oldest first). Optionally keep only the last N."""
              seen, out = set(), []
              for item in reversed(items):
                  key = identity(item)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(item)
              out.reverse()
              return out[-limit:] if limit else out

          def bound(items, limit):
              items = as_list(items)
              return items[-limit:] if len(items) > limit else items

          def take(value, n=None):
              """Turn SDK results (list / dict / generator) into a bounded list."""
              if value is None:
                  return []
              if isinstance(value, dict):
                  for key in ("items", "data", "results", "posts", "notifications", "messages", "conversations"):
                      if isinstance(value.get(key), list):
                          value = value[key]
                          break
                  else:
                      return []
              if isinstance(value, (list, tuple)):
                  return list(value)[:n] if n else list(value)
              try:
                  iterator = iter(value)
              except TypeError:
                  return []
              return list(islice(iterator, n)) if n else list(iterator)

          def username_of(obj):
              """Lower-cased username of an object or of a nested author/sender."""
              if not isinstance(obj, dict):
                  return ""
              for key in ("username", "handle", "author_username", "sender_username"):
                  if obj.get(key):
                      return str(obj[key]).strip().lower()
              for key in ("author", "user", "sender", "bidder", "agent", "other_user"):
                  nested = obj.get(key)
                  if isinstance(nested, dict):
                      found = username_of(nested)
                      if found:
                          return found
                  elif isinstance(nested, str) and nested.strip():
                      return nested.strip().lower()
              return ""

          # ===== script =====
          """NØX Action & Opportunities (marketplace).

          Fixes vs. the old version:
          - bidding is controlled by an explicit switch (BIDDING_ENABLED), not by
            keyword matching on Core fields that Core never produced
          - only relevant tasks are bid on (minimum score), never on a task already bid on
          - reconciliation rotates through ALL open bids (oldest check first)
          - opportunities are deduplicated; the file is only rewritten when something changed
          - no payment / spending code path exists
          """
          import os
          import re
          from pathlib import Path

          import requests

          check_policy()
          BASE = "https://thecolony.cc/api/v1"
          MEM_FILE = Path(os.environ["ACTION_MEMORY_FILE"])
          KEY = os.environ.get("COLONY_API_KEY", "").strip()
          ENABLED = env_flag("BIDDING_ENABLED", False)
          MAXT, MAXB, MAXC = env_int("MAX_TASKS_PER_RUN", 50), env_int("MAX_BIDS_PER_RUN", 2), env_int("MAX_BID_CHECKS_PER_RUN", 10)
          MIN_SATS, FLOOR = env_int("MIN_OPPORTUNITY_SATS", 1), env_int("MIN_PLATFORM_BID_SATS", 21)
          MIN_SCORE, TRACKED, TIMEOUT = env_int("MIN_BID_SCORE", 8), env_int("MAX_TRACKED_ITEMS", 300), env_int("REQUEST_TIMEOUT_SECONDS", 15)
          if not KEY:
              raise SystemExit("COLONY_API_KEY is missing.")

          NOW = now_iso()
          mem = as_dict(load_json(MEM_FILE))
          mem.setdefault("version", 7)
          mem.setdefault("created_at", NOW)
          for k in ("opportunities", "bids", "runs", "learnings"):
              if not isinstance(mem.get(k), list):
                  mem[k] = []

          def http(method, path, token, payload=None, params=None):
              url = path if path.startswith("http") else BASE + path
              headers = {"Accept": "application/json", "Content-Type": "application/json", "User-Agent": "NOX-Action/7.0"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              try:
                  r = requests.request(method, url, headers=headers, json=payload, params=params, timeout=TIMEOUT)
              except requests.RequestException as exc:
                  raise RuntimeError(f"{method} {url}: {exc}")
              if r.status_code >= 400:
                  raise RuntimeError(f"{method} {url} -> {r.status_code}: {r.text[:500]}")
              if not r.content:
                  return {}
              try:
                  return r.json()
              except Exception:
                  return {"raw": r.text[:2000]}

          print("=== NØX ACTION & OPPORTUNITIES ===")
          print("Bidding enabled:", ENABLED, "| spending: false | payments: false")

          auth = http("POST", "/auth/token", "", {"api_key": KEY})
          token = auth.get("access_token") or auth.get("token") or auth.get("jwt")
          if not token:
              raise SystemExit("No marketplace access token.")
          me = http("GET", "/users/me", token)
          username = text(me.get("username") or me.get("handle") or me.get("name")).lower()
          if username != OWN_USERNAME:
              raise SystemExit(f"Identity mismatch: {username!r}")
          my_ids = {str(me.get(k)).lower() for k in ("id", "user_id", "userId", "agent_id", "agentId") if me.get(k) is not None}
          print("Identity verified: @" + username)

          def tid(t):
              return t.get("id") or t.get("task_id") or t.get("listing_id") or t.get("uuid") or t.get("_id")

          def title(t):
              return collapse(t.get("title") or t.get("name") or t.get("headline") or "Untitled", 300)

          def number(v):
              if isinstance(v, bool):
                  return None
              if isinstance(v, (int, float)) and v >= 0:
                  return int(v)
              if isinstance(v, str):
                  m = re.fullmatch(r"\s*(\d+(?:\.\d+)?)\s*", v.replace(",", ""))
                  return int(float(m.group(1))) if m else None
              return None

          MINK = {"budget_min_sats", "min_budget_sats", "minimum_budget_sats", "reward_min_sats", "min_reward_sats",
                  "min_bid_sats", "price_min_sats", "minimum_bid_sats", "bid_min_sats"}
          MAXK = {"budget_max_sats", "max_budget_sats", "maximum_budget_sats", "reward_max_sats", "max_reward_sats",
                  "max_bid_sats", "price_max_sats", "maximum_bid_sats", "bid_max_sats"}
          FIXK = {"reward_sats", "amount_sats", "payment_sats", "price_sats", "fixed_reward_sats", "fixed_budget_sats",
                  "fixed_price_sats", "fixed_amount_sats", "listed_rate_sats"}

          def walk(x):
              if isinstance(x, dict):
                  for k, v in x.items():
                      yield str(k).lower(), v
                      yield from walk(v)
              elif isinstance(x, list):
                  for v in x:
                      yield from walk(v)

          def budget(t):
              lo = hi = None
              for k, v in walk(t):
                  n = number(v)
                  if n is None:
                      continue
                  if k in FIXK:
                      lo = hi = n
                  elif k in MINK:
                      lo = n
                  elif k in MAXK:
                      hi = n
              if lo is not None or hi is not None:
                  return (lo if lo is not None else hi), (hi if hi is not None else lo)
              s = " ".join(text(t.get(k)) for k in ("title", "name", "description", "body", "content", "summary", "budget", "reward"))
              m = re.search(r"(\d[\d,]*)\s*(?:-|–|—|to)\s*(\d[\d,]*)\s*sats\b", s, re.I)
              if m:
                  return int(m.group(1).replace(",", "")), int(m.group(2).replace(",", ""))
              m = re.search(r"(\d[\d,]*)\s*sats\b", s, re.I)
              if m:
                  n = int(m.group(1).replace(",", ""))
                  return n, n
              return None, None

          DEMAND_TYPES = {"paid_task", "task", "bounty", "human_request", "human-request"}
          SUPPLY_TYPES = {"service", "service_offer", "service-offer", "for_hire", "for-hire", "offer"}
          SUPPLY = ("for hire", "for-hire", "available for", "my services", "service offer", "service listing",
                    "fixed-price service", "fixed price service", "hire me", "i can provide", "i offer")
          DEMAND = ("looking for", "need an agent", "need someone", "seeking agent", "seeking someone", "wanted", "request",
                    "bounty", "paid task", "human request", "i need", "we need", "build", "verify", "audit", "research",
                    "write", "develop", "create", "fix", "test", "analyze", "analyse", "deliver")

          def classify(t):
              typ = text(t.get("post_type") or t.get("type") or t.get("listing_type") or t.get("kind")).lower()
              if typ in DEMAND_TYPES:
                  return "demand"
              if typ in SUPPLY_TYPES:
                  return "supply"
              ti = title(t).lower()
              body = " ".join(text(t.get(k)) for k in ("title", "body", "description", "content", "summary")).lower()
              if any(x in ti for x in SUPPLY) or any(x in body for x in SUPPLY):
                  return "supply"
              if any(x in ti for x in DEMAND) or any(x in body for x in DEMAND):
                  return "demand"
              return "unknown"

          CAPS = {"research": 5, "deep research": 8, "research report": 8, "technical report": 8, "technical": 4,
                  "python": 6, "code": 4, "coding": 4, "software": 3, "data": 5, "dataset": 5, "json": 4, "csv": 4,
                  "verification": 7, "verify": 7, "audit": 7, "citation": 6, "citations": 6, "analysis": 5, "analyze": 5,
                  "test": 5, "testing": 5, "agent tooling": 8, "tool development": 8}

          def score(t, lo, hi):
              hay = " ".join(text(t.get(k)) for k in ("title", "name", "description", "body", "content", "summary")).lower()
              n = sum(p for k, p in CAPS.items() if re.search(rf"\b{re.escape(k)}\b", hay))
              if lo is not None:
                  n += 8 if lo >= 10000 else 6 if lo >= 5000 else 4 if lo >= 1000 else 2 if lo >= 500 else 0
              if hi is not None and hi >= 10000:
                  n += 3
              return n

          def is_mine(obj):
              if not isinstance(obj, dict):
                  return False
              for k in ("user_id", "agent_id", "owner_id", "bidder_id", "poster_id", "creator_id", "author_id", "requester_id"):
                  if obj.get(k) is not None and str(obj[k]).lower() in my_ids:
                      return True
              for k in ("username", "handle", "agent_username", "poster_username"):
                  if obj.get(k) is not None and text(obj[k]).lower() == OWN_USERNAME:
                      return True
              for k in ("bidder", "agent", "user", "poster", "author", "owner"):
                  v = obj.get(k)
                  if isinstance(v, dict):
                      if any(str(v.get(q)).lower() in my_ids for q in ("id", "user_id", "agent_id") if v.get(q) is not None):
                          return True
                      if any(text(v.get(q)).lower() == OWN_USERNAME for q in ("username", "handle", "name") if v.get(q) is not None):
                          return True
              return False

          def collection(x):
              if isinstance(x, list):
                  return x
              if isinstance(x, dict):
                  for k in ("bids", "items", "results", "data"):
                      v = x.get(k)
                      if isinstance(v, list):
                          return v
                      if isinstance(v, dict):
                          for q in ("bids", "items", "results"):
                              if isinstance(v.get(q), list):
                                  return v[q]
              return []

          def lifecycle(b):
              s = text(b.get("platform_status") or b.get("status") or b.get("state")).lower().replace("-", "_").replace(" ", "_")
              if s in {"accepted", "approved", "awarded", "won", "selected", "completed", "complete", "paid", "success"}:
                  return "won"
              if s in {"rejected", "declined", "denied", "lost", "expired", "cancelled", "canceled", "withdrawn"}:
                  return "closed"
              if s in {"pending", "submitted", "open", "active", "bidding", "under_review", "review", "in_review", "already_present"}:
                  return "pending"
              return "unknown"

          # ------------------------------------------------------------ fetch tasks
          raw = http("GET", "/marketplace/tasks", token, params={"status": "open", "sort": "new", "limit": MAXT, "offset": 0})
          tasks = raw if isinstance(raw, list) else (raw.get("tasks") or raw.get("items") or raw.get("results") or raw.get("data") or []) if isinstance(raw, dict) else []
          if isinstance(tasks, dict):
              tasks = tasks.get("tasks") or tasks.get("items") or tasks.get("results") or []
          tasks = tasks if isinstance(tasks, list) else []
          print("Marketplace tasks:", len(tasks))

          candidates = []
          for t in tasks:
              if not isinstance(t, dict) or not tid(t) or classify(t) != "demand" or is_mine(t):
                  continue
              if text(t.get("status") or t.get("state") or "open").lower() not in {"open", "unknown", ""}:
                  continue
              lo, hi = budget(t)
              if hi is not None and hi < MIN_SATS:
                  continue
              candidates.append({"id": str(tid(t)), "title": title(t), "status": "open", "budget_min_sats": lo,
                                 "budget_max_sats": hi, "score": score(t, lo, hi)})
          candidates.sort(key=lambda c: (c["score"], c["budget_max_sats"] or 0), reverse=True)
          print("Demand candidates:", len(candidates))

          changed = False

          # ------------------------------------------------------------ reconcile open bids (rotating)
          open_bids = [b for b in mem["bids"] if isinstance(b, dict) and b.get("task_id")
                       and b.get("lifecycle_state", "pending") in ("pending", "unknown")]
          open_bids.sort(key=lambda b: text(b.get("last_reconciled_at")))
          for b in open_bids[:MAXC]:
              try:
                  found = next((x for x in collection(http("GET", f"/marketplace/{b['task_id']}/bids", token)) if is_mine(x)), None)
                  b["last_reconciled_at"] = NOW
                  if found:
                      before = b.get("lifecycle_state")
                      b["platform_bid"] = found
                      b["bid_id"] = str(found.get("bid_id") or found.get("id") or b.get("bid_id") or "")
                      b["platform_status"] = found.get("status") or found.get("state") or b.get("platform_status")
                      b["lifecycle_state"] = lifecycle(b)
                      b["next_action"] = {"pending": "monitor_bid", "won": "await_task_or_delivery",
                                          "closed": "review_and_reassess"}.get(b["lifecycle_state"], "reconcile_again")
                      if b["lifecycle_state"] != before and b["lifecycle_state"] in ("won", "closed"):
                          mem["learnings"].append({"timestamp": NOW, "type": "bid_outcome", "task_id": b["task_id"],
                                                   "outcome": b["lifecycle_state"], "amount_sats": b.get("amount_sats")})
                      print("BID RECONCILED", b["task_id"], b["lifecycle_state"])
                  else:
                      b["lifecycle_state"] = "unknown"
                  changed = True
              except Exception as exc:
                  b["lifecycle_state"] = "unknown"
                  b["reconciliation_error"] = clip(exc, 300)
                  changed = True
                  print("BID RECONCILE ERROR", b["task_id"], exc)

          # ------------------------------------------------------------ bid
          existing = {str(b.get("task_id")) for b in mem["bids"] if isinstance(b, dict)}
          submitted = 0
          if ENABLED:
              for c in candidates:
                  if submitted >= MAXB:
                      break
                  if c["id"] in existing or c["score"] < MIN_SCORE:
                      continue
                  bid = max(FLOOR, c["budget_min_sats"] or FLOOR)
                  if c["budget_max_sats"] is not None and bid > c["budget_max_sats"]:
                      continue
                  payload = {"amount_sats": bid, "bid_sats": bid,
                             "message": (f'NØX proposes an evidence-first, reproducible approach to "{c["title"][:80]}". '
                                         "Verified findings and uncertainty will be reported separately and assumptions made explicit.")}
                  rec = {"task_id": c["id"], "task_title": c["title"], "amount_sats": bid, "submitted_at": NOW,
                         "status": "submitted", "expected_outcome": "bid_review", "actual_outcome": None,
                         "lifecycle_state": "pending", "next_action": "monitor_bid"}
                  try:
                      result = http("POST", f"/marketplace/{c['id']}/bids", token, payload)
                      if isinstance(result, dict):
                          rec["platform_status"] = result.get("status")
                          rec["bid_id"] = str(result.get("bid_id") or result.get("id") or "")
                      submitted += 1
                      print("BID SUBMITTED", c["id"], bid)
                  except Exception as exc:
                      msg = str(exc).lower()
                      if "409" in msg or "already" in msg:
                          rec["platform_status"] = "already_present"  # never retry this task
                      else:
                          mem["runs"].append({"timestamp": NOW, "event": "bid_failed", "task_id": c["id"], "error": clip(exc, 500)})
                          changed = True
                          print("BID FAILED", c["id"], exc)
                          continue
                  mem["bids"].append(rec)
                  existing.add(c["id"])
                  changed = True
          else:
              print("Bidding disabled (BIDDING_ENABLED=false): observation only.")

          # ------------------------------------------------------------ memory
          known = {o.get("id") for o in mem["opportunities"] if isinstance(o, dict)}
          fresh = [c for c in candidates[:50] if c["id"] not in known]
          if fresh:
              mem["opportunities"] += fresh
              changed = True
          if changed or submitted:
              mem["runs"].append({"timestamp": NOW, "bidding_enabled": ENABLED, "tasks_observed": len(tasks),
                                  "candidates": len(candidates), "new_opportunities": len(fresh),
                                  "bids_submitted": submitted, "spending": False, "payment": False})
              mem["opportunities"] = dedupe_keep_last(mem["opportunities"], TRACKED)
              for k in ("bids", "runs", "learnings"):
                  mem[k] = bound(mem[k], TRACKED)
              mem["updated_at"] = NOW
              save_json(MEM_FILE, mem)
              print("Action memory saved.")
          else:
              print("Nothing new; memory unchanged.")
          print("Submitted bids:", submitted)
          PY

      - name: Validate JSON state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          for path in ["memory/nox_action_opportunities.json"]:
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
                  print("VALID JSON:", path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          for f in memory/nox_action_opportunities.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "NØX: update action opportunities memory"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after retries."
          exit 1
