name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "15"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          ACTION_MEMORY_FILE = Path(os.environ["ACTION_MEMORY_FILE"])

          MAX_TASKS = int(
              os.environ.get("MAX_TASKS_PER_RUN", "50")
          )

          MAX_BIDS = int(
              os.environ.get("MAX_BIDS_PER_RUN", "2")
          )

          MAX_BID_CHECKS = int(
              os.environ.get("MAX_BID_CHECKS_PER_RUN", "10")
          )

          MAX_TRACKED = int(
              os.environ.get("MAX_TRACKED_ITEMS", "300")
          )

          MIN_OPPORTUNITY = int(
              os.environ.get("MIN_OPPORTUNITY_SATS", "1")
          )

          MIN_PLATFORM_BID = int(
              os.environ.get("MIN_PLATFORM_BID_SATS", "21")
          )

          TIMEOUT = int(
              os.environ.get("REQUEST_TIMEOUT_SECONDS", "15")
          )

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          print("=== NØX ACTION & OPPORTUNITIES ===")
          print("Policy: €0 / no spending / no payment / no Gemini / no external AI")
          print(f"Opportunity floor: {MIN_OPPORTUNITY} sat")
          print(f"Platform bid floor: {MIN_PLATFORM_BID} sat")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing.")
              sys.exit(1)

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)

              except Exception as exc:
                  print(
                      f"WARNING: failed to load {path}: {exc}"
                  )
                  return default

          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with tmp.open(
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              tmp.replace(path)

          def http_json(
              method,
              url,
              token=None,
              payload=None,
          ):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Action-Opportunities/3.3",
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              body = None

              if payload is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

                  body = json.dumps(
                      payload
                  ).encode("utf-8")

              request = Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method,
              )

              try:
                  with urlopen(
                      request,
                      timeout=TIMEOUT,
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)

                      except json.JSONDecodeError:
                          return {
                              "raw": raw
                          }

              except HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  try:
                      detail = json.loads(raw)

                  except Exception:
                      detail = raw

                  raise RuntimeError(
                      f"{method} {url} -> "
                      f"HTTP {exc.code}: {detail}"
                  )

              except URLError as exc:
                  raise RuntimeError(
                      f"{method} {url} -> "
                      f"network error: {exc}"
                  )

          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(
                  value,
                  (int, float),
              ):
                  return str(value)

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )

              except Exception:
                  return str(value)

          def normalize_text(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text_value(value).strip().lower(),
              )

          def task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("listing_id")
                  or task.get("uuid")
              )

          def task_title(task):
              return (
                  task.get("title")
                  or task.get("name")
                  or task.get("headline")
                  or "Untitled opportunity"
              )

          def task_status(task):
              return (
                  task.get("status")
                  or task.get("state")
                  or "unknown"
              )

          def recursive_values(
              obj,
              path="",
          ):
              if isinstance(obj, dict):

                  for key, value in obj.items():
                      current = (
                          f"{path}.{key}"
                          if path
                          else str(key)
                      )

                      yield current, key, value

                      yield from recursive_values(
                          value,
                          current,
                      )

              elif isinstance(obj, list):

                  for index, value in enumerate(obj):
                      current = (
                          f"{path}[{index}]"
                      )

                      yield (
                          current,
                          str(index),
                          value,
                      )

                      yield from recursive_values(
                          value,
                          current,
                      )

          MIN_KEYS = {
              "budget_min_sats",
              "min_budget_sats",
              "minimum_budget_sats",
              "reward_min_sats",
              "min_reward_sats",
              "min_bid_sats",
              "price_min_sats",
              "minimum_bid_sats",
              "bid_min_sats",
          }

          MAX_KEYS = {
              "budget_max_sats",
              "max_budget_sats",
              "maximum_budget_sats",
              "reward_max_sats",
              "max_reward_sats",
              "max_bid_sats",
              "price_max_sats",
              "maximum_bid_sats",
              "bid_max_sats",
          }

          FIXED_KEYS = {
              "reward_sats",
              "amount_sats",
              "payment_sats",
              "price_sats",
              "fixed_reward_sats",
              "fixed_budget_sats",
              "fixed_price_sats",
              "fixed_amount_sats",
              "listed_rate_sats",
          }

          def numeric_sats(value):
              if isinstance(value, bool):
                  return None

              if isinstance(
                  value,
                  (int, float),
              ):
                  if value >= 0:
                      return int(value)

                  return None

              if not isinstance(value, str):
                  return None

              cleaned = (
                  value
                  .strip()
                  .replace(",", "")
              )

              match = re.fullmatch(
                  r"(\d+(?:\.\d+)?)",
                  cleaned,
              )

              if not match:
                  return None

              try:
                  number = float(
                      match.group(1)
                  )

                  if number < 0:
                      return None

                  return int(number)

              except Exception:
                  return None

          def text_budget_candidates(task):
              texts = []

              for key in (
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "summary",
                  "budget",
                  "reward",
                  "payment",
                  "compensation",
              ):
                  if key in task:
                      texts.append(
                          text_value(
                              task[key]
                          )
                      )

              if not texts:
                  texts.append(
                      text_value(task)
                  )

              combined = " ".join(texts)

              ranges = re.findall(
                  r"(\d[\d,]*)\s*"
                  r"(?:-|–|—|to)\s*"
                  r"(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE,
              )

              if ranges:
                  low, high = ranges[0]

                  return (
                      int(
                          low.replace(",", "")
                      ),
                      int(
                          high.replace(",", "")
                      ),
                      "text-range",
                  )

              singles = re.findall(
                  r"(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE,
              )

              if singles:
                  value = int(
                      singles[0].replace(
                          ",",
                          "",
                      )
                  )

                  return (
                      value,
                      value,
                      "text-fixed",
                  )

              return None, None, None

          def extract_budget(task):
              lower = None
              upper = None
              source = None

              for path, key, value in recursive_values(
                  task
              ):
                  key_lower = str(
                      key
                  ).lower()

                  if key_lower in MIN_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          lower = number
                          source = (
                              f"explicit:{path}"
                          )

                  elif key_lower in MAX_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          upper = number

                  elif key_lower in FIXED_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          lower = number
                          upper = number
                          source = (
                              f"explicit:{path}"
                          )

              if (
                  lower is not None
                  or upper is not None
              ):
                  if lower is None:
                      lower = upper

                  if upper is None:
                      upper = lower

                  return (
                      lower,
                      upper,
                      source,
                  )

              return text_budget_candidates(
                  task
              )

          SUPPLY_MARKERS = (
              "for hire",
              "for-hire",
              "available for",
              "my services",
              "service offer",
              "service listing",
              "fixed-price service",
              "fixed price service",
              "hire me",
              "i can provide",
              "i offer",
              "offering",
          )

          DEMAND_MARKERS = (
              "looking for",
              "need an agent",
              "need someone",
              "seeking agent",
              "seeking someone",
              "wanted",
              "request",
              "bounty",
              "paid task",
              "human request",
              "i need",
              "we need",
              "build",
              "verify",
              "audit",
              "research",
              "write",
              "develop",
              "create",
              "fix",
              "test",
              "analyze",
              "analyse",
              "deliver",
          )

          EXPLICIT_DEMAND_TYPES = {
              "paid_task",
              "task",
              "bounty",
              "human_request",
              "human-request",
          }

          EXPLICIT_SUPPLY_TYPES = {
              "service",
              "service_offer",
              "service-offer",
              "for_hire",
              "for-hire",
              "offer",
          }

          def classify(task):
              explicit_type = normalize_text(
                  task.get("post_type")
                  or task.get("type")
                  or task.get("listing_type")
                  or task.get("kind")
                  or ""
              )

              if (
                  explicit_type
                  in EXPLICIT_DEMAND_TYPES
              ):
                  return (
                      "demand",
                      f"explicit:{explicit_type}",
                  )

              if (
                  explicit_type
                  in EXPLICIT_SUPPLY_TYPES
              ):
                  return (
                      "supply",
                      f"explicit:{explicit_type}",
                  )

              title = normalize_text(
                  task_title(task)
              )

              combined = normalize_text(
                  " ".join(
                      [
                          text_value(
                              task.get("title")
                          ),
                          text_value(
                              task.get("body")
                          ),
                          text_value(
                              task.get(
                                  "description"
                              )
                          ),
                          text_value(
                              task.get(
                                  "content"
                              )
                          ),
                          text_value(
                              task.get(
                                  "summary"
                              )
                          ),
                      ]
                  )
              )

              if any(
                  marker in title
                  for marker in SUPPLY_MARKERS
              ):
                  return (
                      "supply",
                      "title:supply-marker",
                  )

              if any(
                  marker in combined
                  for marker in SUPPLY_MARKERS
              ):
                  return (
                      "supply",
                      "body:supply-marker",
                  )

              if any(
                  marker in title
                  for marker in DEMAND_MARKERS
              ):
                  return (
                      "demand",
                      "title:demand-marker",
                  )

              if any(
                  marker in combined
                  for marker in DEMAND_MARKERS
              ):
                  return (
                      "demand",
                      "body:demand-marker",
                  )

              return (
                  "unknown",
                  "no-classifier-match",
              )

          CAPABILITY_KEYWORDS = {
              "research": 5,
              "deep research": 8,
              "research report": 8,
              "technical report": 8,
              "report writing": 7,
              "write a report": 7,
              "technical": 4,
              "python": 6,
              "code": 4,
              "coding": 4,
              "software": 3,
              "data": 5,
              "dataset": 5,
              "json": 4,
              "csv": 4,
              "verification": 7,
              "verify": 7,
              "receipt": 6,
              "audit": 7,
              "citation": 6,
              "citations": 6,
              "analysis": 5,
              "analyze": 5,
              "test": 5,
              "testing": 5,
              "agent tooling": 8,
              "build agent tools": 8,
              "tool development": 8,
          }

          def opportunity_score(
              task,
              lower,
              upper,
          ):
              text = normalize_text(task)
              score = 0

              for keyword, points in (
                  CAPABILITY_KEYWORDS.items()
              ):
                  if keyword in text:
                      score += points

              if lower is not None:
                  if lower >= 10000:
                      score += 8

                  elif lower >= 5000:
                      score += 6

                  elif lower >= 1000:
                      score += 4

                  elif lower >= 500:
                      score += 2

              if (
                  upper is not None
                  and upper >= 10000
              ):
                  score += 3

              return score

          def build_bid_description(
              task,
              score,
          ):
              return (
                  "NØX can contribute to this task "
                  "with an evidence-first and "
                  "reproducible workflow. "
                  "Relevant capabilities: research, "
                  "technical, python, data, receipt, "
                  "learning:test. "
                  f"Opportunity relevance score: {score}. "
                  "Delivery will clearly separate "
                  "verified results from uncertainty."
              )

          print(
              "AUTH: API key detected; "
              "exchanging for JWT."
          )

          auth_response = http_json(
              "POST",
              f"{API_BASE}/auth/token",
              payload={
                  "api_key": API_KEY
              },
          )

          token = (
              auth_response.get(
                  "access_token"
              )
              or auth_response.get(
                  "token"
              )
              or auth_response.get(
                  "jwt"
              )
          )

          if not token:
              print(
                  "ERROR: JWT missing from "
                  f"auth response: {auth_response}"
              )
              sys.exit(1)

          profile = http_json(
              "GET",
              f"{API_BASE}/users/me",
              token=token,
          )

          profile_name = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )

          print(
              f"Profile: {profile_name}"
          )

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )

          action_memory = load_json(
              ACTION_MEMORY_FILE,
              {
                  "version": 3,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              },
          )

          if not isinstance(
              action_memory,
              dict,
          ):
              action_memory = {
                  "version": 3,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              }

          action_memory["version"] = 3

          action_memory.setdefault(
              "opportunities",
              [],
          )

          action_memory.setdefault(
              "bids",
              [],
          )

          action_memory.setdefault(
              "runs",
              [],
          )

          action_memory.setdefault(
              "learnings",
              [],
          )

          marketplace_url = (
              f"{API_BASE}/marketplace/tasks"
              f"?status=open"
              f"&sort=new"
              f"&limit={MAX_TASKS}"
              f"&offset=0"
          )

          try:
              marketplace_response = http_json(
                  "GET",
                  marketplace_url,
                  token=token,
              )

          except Exception as exc:
              print(
                  "ERROR: marketplace fetch failed: "
                  f"{exc}"
              )
              sys.exit(1)

          if isinstance(
              marketplace_response,
              list,
          ):
              tasks = marketplace_response

          elif isinstance(
              marketplace_response,
              dict,
          ):
              tasks = (
                  marketplace_response.get(
                      "tasks"
                  )
                  or marketplace_response.get(
                      "items"
                  )
                  or marketplace_response.get(
                      "data"
                  )
                  or []
              )

              if isinstance(
                  tasks,
                  dict,
              ):
                  tasks = (
                      tasks.get("tasks")
                      or tasks.get("items")
                      or []
                  )

          else:
              tasks = []

          if not isinstance(
              tasks,
              list,
          ):
              tasks = []

          print(
              f"Marketplace tasks observed: "
              f"{len(tasks)}"
          )

          candidates = []
          supply_count = 0
          unknown_count = 0

          for task in tasks:

              if not isinstance(
                  task,
                  dict,
              ):
                  continue

              tid = task_id(task)

              if not tid:
                  continue

              (
                  classification,
                  classification_source,
              ) = classify(task)

              if classification == "supply":
                  supply_count += 1
                  continue

              if classification == "unknown":
                  unknown_count += 1
                  continue

              (
                  lower,
                  upper,
                  budget_source,
              ) = extract_budget(task)

              score = opportunity_score(
                  task,
                  lower,
                  upper,
              )

              if (
                  lower is not None
                  and upper is not None
                  and upper < MIN_OPPORTUNITY
              ):
                  continue

              candidates.append(
                  {
                      "id": str(tid),
                      "title": task_title(task),
                      "status": task_status(task),
                      "classification": classification,
                      "classification_source": (
                          classification_source
                      ),
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": budget_source,
                      "score": score,
                      "raw": task,
                  }
              )

          print(
              f"Relevant demand candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Supply listings skipped: "
              f"{supply_count}"
          )

          print(
              f"Unknown listing types: "
              f"{unknown_count}"
          )

          def find_existing_opportunity(
              tid
          ):
              for item in action_memory[
                  "opportunities"
              ]:
                  if str(
                      item.get("id")
                  ) == str(tid):
                      return item

              return None

          def find_existing_bid(tid):
              for item in action_memory[
                  "bids"
              ]:
                  if str(
                      item.get("task_id")
                  ) == str(tid):
                      return item

              return None

          def extract_bid_id(
              response
          ):
              if not isinstance(
                  response,
                  dict,
              ):
                  return None

              direct = (
                  response.get("bid_id")
                  or response.get("id")
              )

              if direct:
                  return str(direct)

              for key in (
                  "bid",
                  "data",
                  "result",
              ):
                  nested = response.get(key)

                  if isinstance(
                      nested,
                      dict,
                  ):
                      nested_id = (
                          nested.get(
                              "bid_id"
                          )
                          or nested.get(
                              "id"
                          )
                      )

                      if nested_id:
                          return str(
                              nested_id
                          )

              return None

          def extract_bid_status(
              response
          ):
              if not isinstance(
                  response,
                  dict,
              ):
                  return None

              for key in (
                  "status",
                  "state",
              ):
                  value = response.get(key)

                  if value:
                      return str(value)

              for key in (
                  "bid",
                  "data",
                  "result",
              ):
                  nested = response.get(key)

                  if isinstance(
                      nested,
                      dict,
                  ):
                      value = (
                          nested.get(
                              "status"
                          )
                          or nested.get(
                              "state"
                          )
                      )

                      if value:
                          return str(
                              value
                          )

              return None

          def normalize_bid_collection(
              response
          ):
              if isinstance(
                  response,
                  list,
              ):
                  return response

              if not isinstance(
                  response,
                  dict,
              ):
                  return []

              for key in (
                  "bids",
                  "items",
                  "data",
                  "results",
              ):
                  value = response.get(
                      key
                  )

                  if isinstance(
                      value,
                      list,
                  ):
                      return value

                  if isinstance(
                      value,
                      dict,
                  ):
                      for nested_key in (
                          "bids",
                          "items",
                          "results",
                      ):
                          nested = value.get(
                              nested_key
                          )

                          if isinstance(
