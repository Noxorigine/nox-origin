name: NØX - Action Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  RUNTIME_FILE: memory/nox_core_runtime.json
  MEMORY_FILE: memory/nox_core_memory.json
  OPPORTUNITIES_FILE: memory/nox_action_opportunities.json
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"

jobs:
  audit-opportunities:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and record opportunities without bidding or spending
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from hashlib import sha256

          for key, expected in {
              "PROJECT_COST_EUR":"0", "AUTO_PAYMENT":"false", "AUTO_SPENDING":"false",
              "GEMINI_USED":"false", "EXTERNAL_AI_USED":"false"
          }.items():
              if os.environ.get(key, expected).lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")

          now = datetime.now(timezone.utc).isoformat()
          path = Path(os.environ["OPPORTUNITIES_FILE"])
          runtime_path = Path(os.environ["RUNTIME_FILE"])
          memory_path = Path(os.environ["MEMORY_FILE"])
          def load(p, default):
              if not p.exists(): return default
              value = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(value, dict): raise SystemExit(f"Invalid JSON object: {p}")
              return value
          data = load(path, {"version":1,"opportunities":[],"history":[]})
          runtime = load(runtime_path, {"version":7,"pending_actions":[]})
          memory = load(memory_path, {"version":7,"observations":[]})
          data.setdefault("opportunities", [])
          data.setdefault("history", [])
          # Deliberately no API call and no bid submission: opportunity discovery is read-only
          # until an explicitly approved, cost-free execution policy and verified API contract exist.
          snapshot = {
              "id": "audit-" + sha256(now.encode()).hexdigest()[:16],
              "timestamp": now,
              "status": "READ_ONLY_AUDIT",
              "pending_actions_seen": len(runtime.get("pending_actions", [])) if isinstance(runtime.get("pending_actions"), list) else 0,
              "bids_submitted": 0,
              "payments_sent": 0,
              "spending_enabled": False,
              "note": "No opportunity API queried; no bid or payment submitted."
          }
          data["history"].append(snapshot)
          data["history"] = data["history"][-150:]
          data["last_run"] = now
          data["last_status"] = "READ_ONLY_AUDIT"
          path.parent.mkdir(parents=True, exist_ok=True)
          tmp = path.with_suffix(path.suffix + ".tmp")
          tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          json.loads(tmp.read_text(encoding="utf-8"))
          os.replace(tmp, path)
          memory.setdefault("observations", [])
          memory["observations"].append({"timestamp":now,"summary":"Action opportunities workflow ran in read-only mode; no bids or payments submitted.","evidence":snapshot,"source":"action_opportunities"})
          memory["observations"] = memory["observations"][-300:]
          memory_path.parent.mkdir(parents=True, exist_ok=True)
          mt = memory_path.with_suffix(memory_path.suffix+".tmp")
          mt.write_text(json.dumps(memory, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          json.loads(mt.read_text(encoding="utf-8")); os.replace(mt, memory_path)
          print("Action Opportunities: read-only audit; bids=0 payments=0 spending=false")
          PY
      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/nox_action_opportunities.json memory/nox_core_memory.json
          git diff --cached --quiet || git commit -m "chore(nox): record read-only opportunity audit"
          git push
