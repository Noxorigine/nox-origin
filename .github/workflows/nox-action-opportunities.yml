name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "15"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          ACTION_MEMORY_FILE = Path(os.environ["ACTION_MEMORY_FILE"])

          MAX_TASKS = int(os.environ.get("MAX_TASKS_PER_RUN", "50"))
          MAX_BIDS = int(os.environ.get("MAX_BIDS_PER_RUN", "2"))
          MAX_BID_CHECKS = int(os.environ.get("MAX_BID_CHECKS_PER_RUN", "10"))
          MAX_TRACKED = int(os.environ.get("MAX_TRACKED_ITEMS", "300"))

          MIN_OPPORTUNITY = int(os.environ.get("MIN_OPPORTUNITY_SATS", "1"))
          MIN_PLATFORM_BID = int(os.environ.get("MIN_PLATFORM_BID_SATS", "21"))
          TIMEOUT = int(os.environ.get("REQUEST_TIMEOUT_SECONDS", "15"))

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          print("=== NØX ACTION & OPPORTUNITIES ===")
          print("Policy: €0 / no spending / no payment / no Gemini / no external AI")
          print(f"Opportunity floor: {MIN_OPPORTUNITY} sat")
          print(f"Platform bid floor: {MIN_PLATFORM_BID} sat")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing.")
              sys.exit(1)

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path, default):
              try:
                  if not path.exists():
                      return default
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: failed to load {path}: {exc}")
                  return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              tmp.replace(path)

          def http_json(method, url, token=None, payload=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Action-Opportunities/3.1",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              body = None

              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode("utf-8")

              request = Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method,
              )

              try:
                  with urlopen(request, timeout=TIMEOUT) as response:
                      raw = response.read().decode("utf-8", errors="replace")

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)
                      except json.JSONDecodeError:
                          return {"raw": raw}

              except HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")

                  try:
                      detail = json.loads(raw)
                  except Exception:
                      detail = raw

                  raise RuntimeError(
                      f"{method} {url} -> HTTP {exc.code}: {detail}"
                  )

              except URLError as exc:
                  raise RuntimeError(
                      f"{method} {url} -> network error: {exc}"
                  )

          # ------------------------------------------------------------
          # AUTH
          # ------------------------------------------------------------

          print("AUTH: API key detected; exchanging for JWT.")

          auth_response = http_json(
              "POST",
              f"{API_BASE}/auth/token",
              payload={"api_key": API_KEY},
          )

          token = (
              auth_response.get("access_token")
              or auth_response.get("token")
              or auth_response.get("jwt")
          )

          if not token:
              print(f"ERROR: JWT missing from auth response: {auth_response}")
              sys.exit(1)

          # ------------------------------------------------------------
          # PROFILE
          # ------------------------------------------------------------

          profile = http_json(
              "GET",
              f"{API_BASE}/users/me",
              token=token,
          )

          profile_name = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )

          print(f"Profile: {profile_name}")

          # ------------------------------------------------------------
          # LOAD SHARED MEMORY
          # ------------------------------------------------------------

          core_memory = load_json(CORE_MEMORY_FILE, {})
          core_runtime = load_json(CORE_RUNTIME_FILE, {})
          knowledge = load_json(KNOWLEDGE_FILE, {})

          action_memory = load_json(
              ACTION_MEMORY_FILE,
              {
                  "version": 3,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              },
          )

          if not isinstance(action_memory, dict):
              action_memory = {
                  "version": 3,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              }

          action_memory["version"] = 3
          action_memory.setdefault("opportunities", [])
          action_memory.setdefault("bids", [])
          action_memory.setdefault("runs", [])
          action_memory.setdefault("learnings", [])

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float)):
                  return str(value)

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              except Exception:
                  return str(value)

          def normalize_text(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text_value(value).strip().lower(),
              )

          def task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("listing_id")
                  or task.get("uuid")
              )

          def task_title(task):
              return (
                  task.get("title")
                  or task.get("name")
                  or task.get("headline")
                  or "Untitled opportunity"
              )

          def task_status(task):
              return (
                  task.get("status")
                  or task.get("state")
                  or "unknown"
              )

          def recursive_values(obj, path=""):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current = f"{path}.{key}" if path else str(key)
                      yield current, key, value

                      yield from recursive_values(
                          value,
                          current,
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      current = f"{path}[{index}]"
                      yield current, str(index), value

                      yield from recursive_values(
                          value,
                          current,
                      )

          # ------------------------------------------------------------
          # BUDGET / REWARD EXTRACTION
          # ------------------------------------------------------------

          MIN_KEYS = {
              "budget_min_sats",
              "min_budget_sats",
              "minimum_budget_sats",
              "reward_min_sats",
              "min_reward_sats",
              "min_bid_sats",
              "price_min_sats",
              "minimum_bid_sats",
              "bid_min_sats",
          }

          MAX_KEYS = {
              "budget_max_sats",
              "max_budget_sats",
              "maximum_budget_sats",
              "reward_max_sats",
              "max_reward_sats",
              "max_bid_sats",
              "price_max_sats",
              "maximum_bid_sats",
              "bid_max_sats",
          }

          FIXED_KEYS = {
              "reward_sats",
              "amount_sats",
              "payment_sats",
              "price_sats",
              "fixed_reward_sats",
              "fixed_budget_sats",
              "fixed_price_sats",
              "fixed_amount_sats",
              "listed_rate_sats",
          }

          def numeric_sats(value):
              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  if value >= 0:
                      return int(value)
                  return None

              if not isinstance(value, str):
                  return None

              cleaned = value.strip().replace(",", "")

              match = re.fullmatch(
                  r"(\d+(?:\.\d+)?)",
                  cleaned,
              )

              if not match:
                  return None

              try:
                  number = float(match.group(1))

                  if number < 0:
                      return None

                  return int(number)

              except Exception:
                  return None

          def text_budget_candidates(task):
              texts = []

              for key in (
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "summary",
                  "budget",
                  "reward",
                  "payment",
                  "compensation",
              ):
                  if key in task:
                      texts.append(text_value(task[key]))

              if not texts:
                  texts.append(text_value(task))

              combined = " ".join(texts)

              ranges = re.findall(
                  r"(\d[\d,]*)\s*(?:-|–|—|to)\s*(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE,
              )

              if ranges:
                  low, high = ranges[0]

                  return (
                      int(low.replace(",", "")),
                      int(high.replace(",", "")),
                      "text-range",
                  )

              singles = re.findall(
                  r"(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE,
              )

              if singles:
                  value = int(singles[0].replace(",", ""))

                  return (
                      value,
                      value,
                      "text-fixed",
                  )

              return None, None, None

          def extract_budget(task):
              lower = None
              upper = None
              source = None

              for path, key, value in recursive_values(task):
                  key_lower = str(key).lower()

                  if key_lower in MIN_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          lower = number
                          source = f"explicit:{path}"

                  elif key_lower in MAX_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          upper = number

                  elif key_lower in FIXED_KEYS:
                      number = numeric_sats(value)

                      if number is not None:
                          lower = number
                          upper = number
                          source = f"explicit:{path}"

              if lower is not None or upper is not None:
                  if lower is None:
                      lower = upper

                  if upper is None:
                      upper = lower

                  return lower, upper, source

              return text_budget_candidates(task)

          # ------------------------------------------------------------
          # CLASSIFICATION
          # ------------------------------------------------------------

          SUPPLY_MARKERS = (
              "for hire",
              "for-hire",
              "available for",
              "my services",
              "service offer",
              "service listing",
              "fixed-price service",
              "fixed price service",
              "hire me",
              "i can provide",
              "i offer",
              "offering",
          )

          DEMAND_MARKERS = (
              "looking for",
              "need an agent",
              "need someone",
              "seeking agent",
              "seeking someone",
              "wanted",
              "request",
              "bounty",
              "paid task",
              "human request",
              "i need",
              "we need",
              "build",
              "verify",
              "audit",
              "research",
              "write",
              "develop",
              "create",
              "fix",
              "test",
              "analyze",
              "analyse",
              "deliver",
          )

          EXPLICIT_DEMAND_TYPES = {
              "paid_task",
              "task",
              "bounty",
              "human_request",
              "human-request",
          }

          EXPLICIT_SUPPLY_TYPES = {
              "service",
              "service_offer",
              "service-offer",
              "for_hire",
              "for-hire",
              "offer",
          }

          def classify(task):
              explicit_type = normalize_text(
                  task.get("post_type")
                  or task.get("type")
                  or task.get("listing_type")
                  or task.get("kind")
                  or ""
              )

              if explicit_type in EXPLICIT_DEMAND_TYPES:
                  return "demand", f"explicit:{explicit_type}"

              if explicit_type in EXPLICIT_SUPPLY_TYPES:
                  return "supply", f"explicit:{explicit_type}"

              title = normalize_text(task_title(task))

              combined = normalize_text(
                  " ".join(
                      [
                          text_value(task.get("title")),
                          text_value(task.get("body")),
                          text_value(task.get("description")),
                          text_value(task.get("content")),
                          text_value(task.get("summary")),
                      ]
                  )
              )

              if any(marker in title for marker in SUPPLY_MARKERS):
                  return "supply", "title:supply-marker"

              if any(marker in combined for marker in SUPPLY_MARKERS):
                  return "supply", "body:supply-marker"

              if any(marker in title for marker in DEMAND_MARKERS):
                  return "demand", "title:demand-marker"

              if any(marker in combined for marker in DEMAND_MARKERS):
                  return "demand", "body:demand-marker"

              return "unknown", "no-classifier-match"

          # ------------------------------------------------------------
          # OPPORTUNITY SCORING
          # ------------------------------------------------------------

          CAPABILITY_KEYWORDS = {
              "research": 5,
              "deep research": 8,
              "research report": 8,
              "technical report": 8,
              "report writing": 7,
              "write a report": 7,
              "technical": 4,
              "python": 6,
              "code": 4,
              "coding": 4,
              "software": 3,
              "data": 5,
              "dataset": 5,
              "json": 4,
              "csv": 4,
              "verification": 7,
              "verify": 7,
              "receipt": 6,
              "audit": 7,
              "citation": 6,
              "citations": 6,
              "analysis": 5,
              "analyze": 5,
              "test": 5,
              "testing": 5,
              "agent tooling": 8,
              "build agent tools": 8,
              "tool development": 8,
          }

          def opportunity_score(task, lower, upper):
              text = normalize_text(task)

              score = 0

              for keyword, points in CAPABILITY_KEYWORDS.items():
                  if keyword in text:
                      score += points

              if lower is not None:
                  if lower >= 10000:
                      score += 8
                  elif lower >= 5000:
                      score += 6
                  elif lower >= 1000:
                      score += 4
                  elif lower >= 500:
                      score += 2

              if upper is not None and upper >= 10000:
                  score += 3

              return score

          def build_bid_description(task, score):
              title = task_title(task)

              return (
                  "NØX can contribute to this task with an "
                  "evidence-first and reproducible workflow. "
                  f"Relevant capabilities: research, technical, python, "
                  f"data, receipt, learning:test. "
                  f"Opportunity relevance score: {score}. "
                  "Delivery will clearly separate verified results "
                  "from uncertainty."
              )

          # ------------------------------------------------------------
          # MARKETPLACE FETCH
          # ------------------------------------------------------------

          marketplace_url = (
              f"{API_BASE}/marketplace/tasks"
              f"?status=open"
              f"&sort=new"
              f"&limit={MAX_TASKS}"
              f"&offset=0"
          )

          try:
              marketplace_response = http_json(
                  "GET",
                  marketplace_url,
                  token=token,
              )
          except Exception as exc:
              print(f"ERROR: marketplace fetch failed: {exc}")
              sys.exit(1)

          if isinstance(marketplace_response, list):
              tasks = marketplace_response

          elif isinstance(marketplace_response, dict):
              tasks = (
                  marketplace_response.get("tasks")
                  or marketplace_response.get("items")
                  or marketplace_response.get("data")
                  or []
              )

              if isinstance(tasks, dict):
                  tasks = (
                      tasks.get("tasks")
                      or tasks.get("items")
                      or []
                  )

          else:
              tasks = []

          if not isinstance(tasks, list):
              tasks = []

          print(f"Marketplace tasks observed: {len(tasks)}")

          # ------------------------------------------------------------
          # CLASSIFY / SCORE
          # ------------------------------------------------------------

          candidates = []
          supply_count = 0
          unknown_count = 0

          for task in tasks:
              if not isinstance(task, dict):
                  continue

              tid = task_id(task)

              if not tid:
                  continue

              classification, classification_source = classify(task)

              if classification == "supply":
                  supply_count += 1
                  continue

              if classification == "unknown":
                  unknown_count += 1
                  continue

              lower, upper, budget_source = extract_budget(task)

              score = opportunity_score(
                  task,
                  lower,
                  upper,
              )

              if lower is not None and upper is not None:
                  if upper < MIN_OPPORTUNITY:
                      continue

              candidates.append(
                  {
                      "id": str(tid),
                      "title": task_title(task),
                      "status": task_status(task),
                      "classification": classification,
                      "classification_source": classification_source,
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": budget_source,
                      "score": score,
                      "raw": task,
                  }
              )

          print(f"Relevant demand candidates: {len(candidates)}")
          print(f"Supply listings skipped: {supply_count}")
          print(f"Unknown listing types: {unknown_count}")

          # ------------------------------------------------------------
          # EXISTING MEMORY HELPERS
          # ------------------------------------------------------------

          def find_existing_opportunity(tid):
              for item in action_memory["opportunities"]:
                  if str(item.get("id")) == str(tid):
                      return item
              return None

          def find_existing_bid(tid):
              for item in action_memory["bids"]:
                  if str(item.get("task_id")) == str(tid):
                      return item
              return None

          # ------------------------------------------------------------
          # OWN BID CHECK
          # ------------------------------------------------------------

          def has_own_bid(tid):
              url = f"{API_BASE}/marketplace/{tid}/bids"

              try:
                  response = http_json(
                      "GET",
                      url,
                      token=token,
                  )
              except Exception as exc:
                  print(f"BID CHECK ERROR: {tid}: {exc}")
                  return False

              if isinstance(response, list):
                  bids = response

              elif isinstance(response, dict):
                  bids = (
                      response.get("bids")
                      or response.get("items")
                      or response.get("data")
                      or []
                  )

                  if isinstance(bids, dict):
                      bids = (
                          bids.get("bids")
                          or bids.get("items")
                          or []
                      )

              else:
                  bids = []

              username = normalize_text(profile_name)

              for bid in bids:
                  if not isinstance(bid, dict):
                      continue

                  owner = normalize_text(
                      bid.get("username")
                      or bid.get("handle")
                      or bid.get("agent_username")
                      or bid.get("agent_handle")
                      or bid.get("user")
                      or ""
                  )

                  if owner and owner == username:
                      return True

                  bidder = bid.get("bidder")

                  if isinstance(bidder, dict):
                      bidder_name = normalize_text(
                          bidder.get("username")
                          or bidder.get("handle")
                          or ""
                      )

                      if bidder_name and bidder_name == username:
                          return True

              return False

          # ------------------------------------------------------------
          # BID SUBMISSION
          # ------------------------------------------------------------

          def submit_bid(tid, amount, description):
              url = f"{API_BASE}/marketplace/{tid}/bid"

              # IMPORTANT:
              # The Colony API expects bid_amount_sats and bid_description.
              payload = {
                  "bid_amount_sats": int(amount),
                  "bid_description": description,
              }

              return http_json(
                  "POST",
                  url,
                  token=token,
                  payload=payload,
              )

          # ------------------------------------------------------------
          # PROCESS CANDIDATES
          # ------------------------------------------------------------

          submitted = 0
          skipped = 0
          errors = 0
          tracked = 0
          bid_checks = 0

          for candidate in candidates:
              tid = candidate["id"]
              title = candidate["title"]

              lower = candidate["budget_min_sats"]
              upper = candidate["budget_max_sats"]
              source = candidate["budget_source"]
              status = candidate["status"]

              if lower is not None and upper is not None:
                  print(
                      f"OPPORTUNITY: {tid} | {title} | "
                      f"budget={lower}-{upper} | "
                      f"source={source} | "
                      f"status=bid_possible"
                  )
              else:
                  print(
                      f"OPPORTUNITY: {tid} | {title} | "
                      f"budget=None-None | "
                      f"source=unknown | "
                      f"status=tracked_no_bid"
                  )

              existing = find_existing_opportunity(tid)

              record = {
                  "id": tid,
                  "title": title,
                  "status": status,
                  "classification": candidate["classification"],
                  "classification_source": candidate["classification_source"],
                  "budget_min_sats": lower,
                  "budget_max_sats": upper,
                  "budget_source": source,
                  "score": candidate["score"],
                  "last_seen_at": now_iso(),
              }

              if existing:
                  existing.update(record)

              else:
                  action_memory["opportunities"].append(record)

              tracked += 1

              # No usable budget = track only.
              if lower is None or upper is None:
                  skipped += 1
                  continue

              # Platform floor.
              if upper < MIN_PLATFORM_BID:
                  skipped += 1
                  continue

              # Respect the opportunity floor.
              if upper < MIN_OPPORTUNITY:
                  skipped += 1
                  continue

              # Only bid when there is capacity in this run.
              if submitted >= MAX_BIDS:
                  skipped += 1
                  continue

              # Limit bid-check API calls.
              if bid_checks >= MAX_BID_CHECKS:
                  skipped += 1
                  continue

              bid_checks += 1

              try:
                  already_bid = has_own_bid(tid)

              except Exception as exc:
                  print(
                      f"BID CHECK ERROR: {tid}: {exc}"
                  )
                  errors += 1
                  continue

              if already_bid:
                  print(
                      f"BID SKIP: {tid}: existing NØX bid detected."
                  )

                  skipped += 1
                  continue

              # Bid at the minimum allowed amount while remaining
              # inside the task's declared budget.
              amount = max(
                  int(lower),
                  MIN_PLATFORM_BID,
              )

              if amount > int(upper):
                  print(
                      f"BID SKIP: {tid}: calculated bid "
                      f"{amount} exceeds upper budget {upper}."
                  )

                  skipped += 1
                  continue

              description = build_bid_description(
                  candidate["raw"],
                  candidate["score"],
              )

              print(
                  f"BID ATTEMPT: {tid} | "
                  f"amount={amount} sat | "
                  f"budget={lower}-{upper}"
              )

              try:
                  response = submit_bid(
                      tid,
                      amount,
                      description,
                  )

                  print(
                      f"BID SUBMITTED: {tid} | "
                      f"amount={amount} sat"
                  )

                  action_memory["bids"].append(
                      {
                          "task_id": tid,
                          "title": title,
                          "amount_sats": amount,
                          "submitted_at": now_iso(),
                          "status": "submitted",
                          "response": response,
                      }
                  )

                  submitted += 1

              except Exception as exc:
                  print(
                      f"BID ERROR: {tid}: {exc}"
                  )

                  action_memory["bids"].append(
                      {
                          "task_id": tid,
                          "title": title,
                          "amount_sats": amount,
                          "submitted_at": now_iso(),
                          "status": "error",
                          "error": str(exc),
                      }
                  )

                  errors += 1

              time.sleep(0.2)

          # ------------------------------------------------------------
          # RECONCILE RECENT BIDS
          # ------------------------------------------------------------

          reconciled = 0

          recent_bids = action_memory["bids"][-MAX_BID_CHECKS:]

          for bid_record in recent_bids:
              if bid_record.get("status") not in (
                  "submitted",
                  "accepted",
                  "pending",
              ):
                  continue

              tid = bid_record.get("task_id")

              if not tid:
                  continue

              try:
                  response = http_json(
                      "GET",
                      f"{API_BASE}/marketplace/{tid}/bids",
                      token=token,
                  )

                  if isinstance(response, list):
                      bids = response

                  elif isinstance(response, dict):
                      bids = (
                          response.get("bids")
                          or response.get("items")
                          or response.get("data")
                          or []
                      )

                  else:
                      bids = []

                  bid_record["last_reconciled_at"] = now_iso()

                  if isinstance(bids, list):
                      username = normalize_text(profile_name)

                      for bid in bids:
                          if not isinstance(bid, dict):
                              continue

                          owner = normalize_text(
                              bid.get("username")
                              or bid.get("handle")
                              or bid.get("agent_username")
                              or bid.get("agent_handle")
                              or ""
                          )

                          if owner and owner == username:
                              platform_status = (
                                  bid.get("status")
                                  or bid.get("state")
                              )

                              if platform_status:
                                  bid_record[
                                      "platform_status"
                                  ] = platform_status

                              platform_bid_id = (
                                  bid.get("id")
                                  or bid.get("bid_id")
                              )

                              if platform_bid_id:
                                  bid_record[
                                      "platform_bid_id"
                                  ] = platform_bid_id

                              reconciled += 1
                              break

              except Exception as exc:
                  print(
                      f"RECONCILE ERROR: {tid}: {exc}"
                  )

          # ------------------------------------------------------------
          # LEARNING
          # ------------------------------------------------------------

          action_memory["learnings"].append(
              {
                  "timestamp": now_iso(),
                  "type": "run_observation",
                  "observation": {
                      "tasks_observed": len(tasks),
                      "demand_candidates": len(candidates),
                      "supply_skipped": supply_count,
                      "unknown_listings": unknown_count,
                      "bids_submitted": submitted,
                      "bids_skipped": skipped,
                      "bid_errors": errors,
                      "bids_reconciled": reconciled,
                  },
                  "lesson": (
                      "Marketplace opportunities can expose their "
                      "budget through explicit metadata or textual "
                      "amounts. Bid submission must use the API "
                      "fields bid_amount_sats and bid_description."
                  ),
              }
          )

          # Keep memory bounded.
          action_memory["opportunities"] = (
              action_memory["opportunities"][-MAX_TRACKED:]
          )

          action_memory["bids"] = (
              action_memory["bids"][-MAX_TRACKED:]
          )

          action_memory["learnings"] = (
              action_memory["learnings"][-100:]
          )

          run_record = {
              "timestamp": now_iso(),
              "tasks_observed": len(tasks),
              "demand_candidates": len(candidates),
              "supply_skipped": supply_count,
              "unknown_listings": unknown_count,
              "bids_submitted": submitted,
              "bids_skipped": skipped,
              "bid_errors": errors,
              "bids_reconciled": reconciled,
              "policy": {
                  "project_cost_eur": 0,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "auto_payment": False,
                  "auto_spending": False,
              },
          }

          action_memory["runs"].append(run_record)
          action_memory["runs"] = action_memory["runs"][-100:]
          action_memory["updated_at"] = now_iso()

          # ------------------------------------------------------------
          # SAVE
          # ------------------------------------------------------------

          save_json(
              ACTION_MEMORY_FILE,
              action_memory,
          )

          # ------------------------------------------------------------
          # SUMMARY
          # ------------------------------------------------------------

          print("")
          print("=== NØX ACTION / OPPORTUNITIES SUMMARY ===")
          print(f"Tasks observed: {len(tasks)}")
          print(f"Demand candidates: {len(candidates)}")
          print(f"Bids submitted: {submitted}")
          print(f"Bids skipped: {skipped}")
          print(f"Bid errors: {errors}")
          print(f"Bids reconciled: {reconciled}")
          print(f"Tracked without bid: {tracked - submitted}")
          print("No automatic payment or spending performed.")
          print("No Gemini or external AI used.")
          print("=== NØX ACTION / OPPORTUNITIES TERMINÉ ===")
          PY

      - name: Commit action memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_action_opportunities.json

          if git diff --cached --quiet; then
            echo "No action memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update action opportunities memory"
          git push
