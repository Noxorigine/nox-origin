name: NØX - Action Opportunities (Active Bidding)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_action_opportunities.json
      MIN_BID_SATS: "10"
      MAX_TASKS: "50"
      MAX_BIDS_PER_RUN: "2"
      MIN_BID_SCORE: "35"
      PROJECT_COST_EUR: "0"
      AUTO_PAYMENT: "false"
      AUTO_SPENDING: "false"
      FREE_AI_ONLY: "true"
      DELIVERY_MODE: "draft_only"
      MAX_DELIVERIES_PER_RUN: "1"
      TASK_ENDPOINTS: "/marketplace/tasks,/task-queue"
      NOX_AI_MAX_CALLS_PER_RUN: "4"
      NOX_AI_MAX_TOKENS_PER_RUN: "7000"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail
          echo "=============================================="
          echo "NØX ACT15 V7.1 - ENVIRONMENT CHECK"
          echo "=============================================="
          if [ -f "${MEMORY_FILE}" ]; then
            echo "OK: ${MEMORY_FILE} exists."
          else
            echo "INFO: ${MEMORY_FILE} will be created."
          fi
          echo "Schedule: hourly scan"
          echo "Maximum bids per run: ${MAX_BIDS_PER_RUN}"
          echo "Minimum relevance score: ${MIN_BID_SCORE}/100"
          echo "Tip/reward tracking: ENABLED"
          echo "Decision model: economic + learning value"
          echo "USDC/USD reward detection: ENABLED"
          echo "Unpaid tasks: eligible for learning evaluation"
          echo "Minimum bid: applies ONLY to paid bids"
          echo "Payments: DISABLED"
          echo "Cost target: €0"
          echo "AI: free tier only (Groq), text from strangers filtered"
          echo "Delivery mode: ${DELIVERY_MODE} (draft_only = write drafts, send nothing)"
          echo "Automatic spending: DISABLED"
          echo "=============================================="

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Evaluate marketplace and submit bounded bids
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          BASE_URL = os.environ.get("COLONY_BASE_URL", "https://thecolony.ai/api/v1").rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          MEMORY_FILE = Path(os.environ.get("MEMORY_FILE", "memory/nox_act_15_marketplace.json"))
          MIN_BID_SATS = int(os.environ.get("MIN_BID_SATS", "10"))
          MAX_TASKS = int(os.environ.get("MAX_TASKS", "50"))
          MAX_MEMORY_ACTIONS = int(os.environ.get("MAX_MEMORY_ACTIONS", "500"))
          ACTION_DELAY_SECONDS = float(os.environ.get("ACTION_DELAY_SECONDS", "1"))
          FALLBACK_SATS_PER_USD = int(os.environ.get("FALLBACK_SATS_PER_USD", "60000"))
          MAX_BIDS_PER_RUN = int(os.environ.get("MAX_BIDS_PER_RUN", "2"))
          MIN_BID_SCORE = int(os.environ.get("MIN_BID_SCORE", "35"))

          sys.path.insert(0, os.path.join(os.getcwd(), "scripts"))
          import nox_ai
          DELIVERY_MODE = os.environ.get("DELIVERY_MODE", "draft_only").strip().lower()
          MAX_DELIVERIES_PER_RUN = int(os.environ.get("MAX_DELIVERIES_PER_RUN", "1"))
          TASK_ENDPOINTS = [x.strip() for x in os.environ.get("TASK_ENDPOINTS", "/marketplace/tasks").split(",") if x.strip()]
          STATE = {"changed": False}
          for key, expected in {
              "PROJECT_COST_EUR": "0", "AUTO_PAYMENT": "false", "AUTO_SPENDING": "false",
              "FREE_AI_ONLY": "true"
          }.items():
              if os.environ.get(key, expected).lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")

          SAFETY_BLOCKED_TERMS = [
              "weapon", "weapons", "firearm", "gun", "ammunition",
              "explosive", "explosives", "bomb", "malware", "ransomware",
              "credential theft", "credential stealing", "phishing",
              "stolen account", "account takeover", "hack account",
              "money laundering", "fraud", "illegal drugs", "drug trafficking",
          ]

          CAPABILITY_KEYWORDS = {
              "python": 12, "api": 12, "automation": 12, "research": 10,
              "data": 10, "analysis": 10, "qa": 9, "testing": 9,
              "test": 7, "smoke test": 9, "scraping": 8, "web": 7,
              "json": 7, "csv": 7, "seo": 6, "audit": 10,
              "copywriting": 7, "documentation": 8, "scripts": 10,
              "database": 8, "source checks": 10, "fact checking": 10,
              "fact-checking": 10, "technical writing": 8, "agent": 12,
              "ai agent": 14, "automation agent": 14,
          }

          LEARNING_KEYWORDS = {
              "ai agent": 14, "agent": 12, "agents": 12, "autonomy": 14,
              "autonomous": 12, "collaboration": 12, "coordination": 12,
              "marketplace": 12, "economy": 12, "virtual economy": 14,
              "lightning": 8, "bitcoin": 8, "btc": 7, "reputation": 10,
              "trust": 10, "verification": 10, "research": 8, "api": 8,
              "automation": 8, "testing": 8, "data": 7, "analysis": 7,
              "cybersecurity": 10, "security": 9, "emerging technology": 8,
              "technology": 6, "law": 9, "regulation": 9, "regulatory": 9,
          }

          DOMAIN_WEIGHTS = {
              "virtual economy": 25,
              "cybersecurity": 20,
              "ai communities": 20,
              "agent intelligence/autonomy": 20,
              "emerging tech": 15,
          }

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def text(value):
              return "" if value is None else str(value).strip()

          def task_text(task):
              parts = []
              for key in ("title", "description", "details", "requirements", "category", "tags", "skills", "budget", "reward", "reward_sats", "price"):
                  value = task.get(key)
                  if isinstance(value, list):
                      parts.extend(str(x) for x in value)
                  elif isinstance(value, dict):
                      parts.append(json.dumps(value, ensure_ascii=False))
                  elif value is not None:
                      parts.append(str(value))
              return " ".join(parts).lower()

          def blocked_term(value):
              t = value.lower()
              return next((x for x in SAFETY_BLOCKED_TERMS if x in t), None)

          def structured_sats(task):
              for key in ("reward_sats", "budget_sats", "payment_sats", "amount_sats", "max_reward_sats"):
                  value = task.get(key)
                  if isinstance(value, (int, float)) and value >= 0:
                      return int(value), "structured"
                  if isinstance(value, str):
                      m = re.fullmatch(r"\s*(\d+(?:\.\d+)?)\s*(?:sats?|sat)?\s*", value, re.I)
                      if m:
                          return int(float(m.group(1))), "structured_text"
              return None, None

          def explicit_sats(task_text_value):
              patterns = [
                  r"(?:reward|budget|payment|payout)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:sats?|sat)\b",
                  r"(\d+(?:\.\d+)?)\s*(?:sats?|sat)\b",
              ]
              for pattern in patterns:
                  m = re.search(pattern, task_text_value, re.I)
                  if m:
                      return int(float(m.group(1))), "text"
              return None, None

          def extract_reward(task):
              # 1) Structured sats always win.
              sats, source = structured_sats(task)
              if sats is not None:
                  return {"sats": sats, "currency": "SATS", "source": source, "usd": None}

              t = task_text(task)
              sats, source = explicit_sats(t)
              if sats is not None:
                  return {"sats": sats, "currency": "SATS", "source": source, "usd": None}

              # 2) Structured USD/USDC.
              for key in ("reward_usdc", "budget_usdc", "payment_usdc", "amount_usdc", "reward_usd", "budget_usd", "payment_usd", "amount_usd"):
                  value = task.get(key)
                  if isinstance(value, (int, float)) and value > 0:
                      currency = "USDC" if "usdc" in key.lower() else "USD"
                      return {"sats": int(round(float(value) * FALLBACK_SATS_PER_USD)), "currency": currency, "source": "structured_fx_estimate", "usd": float(value)}

              # 3) Explicit USD/USDC in text. Do not use arbitrary numbers.
              patterns = [
                  (r"(?:reward|budget|payment|payout|pay|for hire)[^\n$]{0,100}\$\s*(\d+(?:\.\d+)?)\s*(?:usdc|usd)?\b", "USD"),
                  (r"\$\s*(\d+(?:\.\d+)?)\s*(USDC|USD)\b", "USD"),
                  (r"(\d+(?:\.\d+)?)\s*(USDC|USD)\b", "USDC"),
              ]
              for pattern, default_currency in patterns:
                  m = re.search(pattern, t, re.I)
                  if not m:
                      continue
                  amount = float(m.group(1))
                  if amount <= 0:
                      continue
                  currency = default_currency
                  if len(m.groups()) >= 2 and m.group(2):
                      currency = m.group(2).upper()
                  return {"sats": int(round(amount * FALLBACK_SATS_PER_USD)), "currency": currency, "source": "text_fx_estimate", "usd": amount}

              return {"sats": None, "currency": None, "source": None, "usd": None}

          def score_keywords(value, mapping):
              return min(100, sum(points for keyword, points in mapping.items() if keyword in value))

          def domain_score(value):
              candidates = []
              if any(x in value for x in ("sat", "sats", "bitcoin", "btc", "lightning", "payment", "marketplace", "economy", "reward")):
                  candidates.append(("virtual economy", 25))
              if any(x in value for x in ("security", "cybersecurity", "audit", "vulnerability")):
                  candidates.append(("cybersecurity", 20))
              if any(x in value for x in ("ai community", "ai communities", "agent community", "community", "collaboration", "coordination")):
                  candidates.append(("ai communities", 20))
              if any(x in value for x in ("agent", "autonomy", "autonomous", "reasoning", "decision")):
                  candidates.append(("agent intelligence/autonomy", 20))
              if any(x in value for x in ("technology", "emerging tech", "emerging technology", "new technology")):
                  candidates.append(("emerging tech", 15))
              return max(candidates, key=lambda x: x[1]) if candidates else (None, 0)

          def evaluate(task):
              t = task_text(task)
              bad = blocked_term(t)
              if bad:
                  return {"decision": "reject", "reason": f"blocked_term:{bad}", "capability": 0, "learning": 0, "domain_score": 0, "domain": None, "reward_sats": None, "reward_currency": None, "reward_source": None, "usd": None, "total": 0}

              reward = extract_reward(task)
              cap = score_keywords(t, CAPABILITY_KEYWORDS)
              learning = score_keywords(t, LEARNING_KEYWORDS)
              domain, dscore = domain_score(t)
              rp = 0
              if reward["sats"] is not None:
                  if reward["sats"] >= 10000: rp = 25
                  elif reward["sats"] >= 1000: rp = 20
                  elif reward["sats"] >= 100: rp = 15
                  elif reward["sats"] >= MIN_BID_SATS: rp = 10
                  elif reward["sats"] > 0: rp = 3
              total = min(100, int(cap * .35 + learning * .35 + dscore * .20 + rp * .10))
              if total < MIN_BID_SCORE:
                  return {"decision": "reject", "reason": f"low_relevance_score:{total}<{MIN_BID_SCORE}", "capability": cap, "learning": learning, "domain_score": dscore, "domain": domain, "reward_sats": reward["sats"], "reward_currency": reward["currency"], "reward_source": reward["source"], "usd": reward["usd"], "total": total}
              if reward["sats"] is not None and reward["sats"] >= MIN_BID_SATS:
                  decision = "paid_bid_candidate"
              elif reward["sats"] is not None and reward["sats"] > 0:
                  decision = "learning_candidate_low_reward"
              else:
                  decision = "learning_candidate_unpaid"
              return {"decision": decision, "reason": "economic_and_learning_evaluation", "capability": cap, "learning": learning, "domain_score": dscore, "domain": domain, "reward_sats": reward["sats"], "reward_currency": reward["currency"], "reward_source": reward["source"], "usd": reward["usd"], "total": total}

          def record(memory, action):
              """Append an action only if it is new, so an hourly rescan does not rewrite the file."""
              always = ("marketplace_bid_submitted", "marketplace_bid_error", "delivery_draft", "delivery_sent", "delivery_error")
              key = (action.get("task_id"), action.get("action"), action.get("status") or action.get("decision"))
              if action.get("action") not in always:
                  for old in memory.get("actions", []):
                      if isinstance(old, dict) and (old.get("task_id"), old.get("action"), old.get("status") or old.get("decision")) == key:
                          return False
              memory.setdefault("actions", []).append(action)
              STATE["changed"] = True
              return True

          def load_memory():

              if not MEMORY_FILE.exists():
                  return {"schema_version": "7.1", "agent": "NØX", "workflow": "nox-action-opportunities", "updated_at": now_iso(), "actions": []}
              try:
                  data = json.loads(MEMORY_FILE.read_text(encoding="utf-8"))
                  if not isinstance(data, dict): raise ValueError("memory root is not an object")
                  if not isinstance(data.get("actions"), list): data["actions"] = []
                  return data
              except Exception as exc:
                  print(f"WARNING: unable to read memory: {exc}")
                  return {"schema_version": "7.1", "agent": "NØX", "workflow": "nox-action-opportunities", "updated_at": now_iso(), "actions": []}

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)
              memory["actions"] = memory.get("actions", [])[-MAX_MEMORY_ACTIONS:]
              memory["updated_at"] = now_iso()
              memory["schema_version"] = "8.0"
              memory["workflow"] = "nox-action-opportunities"
              MEMORY_FILE.write_text(json.dumps(memory, ensure_ascii=False, indent=2), encoding="utf-8")

          def session_auth():
              if not API_KEY: raise RuntimeError("COLONY_API_KEY is missing")
              s = requests.Session()
              r = s.post(f"{BASE_URL}/auth/token", json={"api_key": API_KEY}, timeout=20)
              print(f"AUTH TOKEN HTTP {r.status_code}")
              r.raise_for_status()
              data = r.json()
              token = data.get("access_token") or data.get("token") or data.get("jwt")
              if not token: raise RuntimeError("No JWT token returned by /auth/token")
              s.headers.update({"Authorization": f"Bearer {token}", "Accept": "application/json", "Content-Type": "application/json"})
              return s

          def identity(s):
              r = s.get(f"{BASE_URL}/users/me", timeout=20)
              print(f"/users/me HTTP {r.status_code}")
              r.raise_for_status()
              data = r.json()
              print(f"Identity: @{data.get('username') or data.get('handle') or data.get('name') or 'unknown'} | Karma: {data.get('karma') or data.get('score') or 0}")
              return data

          def fetch_tips(s):
              """Read tip records for earnings visibility; never initiates a payment."""
              candidates = ("/tips", "/users/me/tips")
              for endpoint in candidates:
                  try:
                      r = s.get(f"{BASE_URL}{endpoint}", params={"limit": 100}, timeout=20)
                      print(f"{endpoint} HTTP {r.status_code}")
                      if r.status_code == 404:
                          continue
                      if r.status_code != 200:
                          continue
                      data = r.json()
                      if isinstance(data, list):
                          records = data
                      elif isinstance(data, dict):
                          records = next((data[k] for k in ("tips", "items", "results", "data") if isinstance(data.get(k), list)), [])
                      else:
                          records = []
                      total_sats = 0
                      for item in records:
                          if not isinstance(item, dict):
                              continue
                          amount = item.get("amount_sats", item.get("sats", item.get("amount")))
                          try:
                              if amount is not None:
                                  total_sats += max(0, int(float(amount)))
                          except (TypeError, ValueError):
                              pass
                      return {"available": True, "endpoint": endpoint, "count": len(records), "total_sats": total_sats, "records": records}
                  except Exception as exc:
                      print(f"Tip lookup warning for {endpoint}: {exc}")
              return {"available": False, "endpoint": None, "count": None, "total_sats": None, "records": []}

          def tasks(s):
              last_error = None
              for endpoint in TASK_ENDPOINTS:
                  try:
                      r = s.get(f"{BASE_URL}{endpoint}", params={"limit": MAX_TASKS}, timeout=30)
                  except Exception as exc:
                      last_error = exc
                      print(f"{endpoint} unreachable: {exc}")
                      continue
                  print(f"{endpoint} HTTP {r.status_code}")
                  if r.status_code != 200:
                      last_error = f"HTTP {r.status_code}"
                      continue
                  data = r.json()
                  items = data if isinstance(data, list) else next((data[k] for k in ("tasks", "items", "results", "data") if isinstance(data, dict) and isinstance(data.get(k), list)), None)
                  if items is not None:
                      print(f"Task source: {endpoint} ({len(items)} items)")
                      return items
              raise RuntimeError(f"No task endpoint worked: {last_error}")

          def discover_api(s, memory):
              """Log the marketplace/task/delivery routes the API really exposes (once a day)."""
              last = memory.get("api_discovery", {}).get("timestamp")
              if last:
                  try:
                      if (datetime.now(timezone.utc) - datetime.fromisoformat(last)).total_seconds() < 86400:
                          return
                  except Exception:
                      pass
              try:
                  r = requests.get(BASE_URL.replace("/api/v1", "") + "/openapi.json", timeout=30)
                  print(f"openapi.json HTTP {r.status_code}")
                  if r.status_code != 200:
                      return
                  paths = r.json().get("paths", {})
                  wanted = ("marketplace", "task", "bid", "deliver", "dispatch", "submit", "offer", "order")
                  found = sorted({f"{m.upper()} {path}" for path, ops in paths.items() if any(w in path.lower() for w in wanted) for m in ops if m in ("get", "post", "put", "patch", "delete")})
                  print(f"API routes related to tasks/marketplace ({len(found)}):")
                  for line in found[:80]:
                      print("  " + line)
                  memory["api_discovery"] = {"timestamp": now_iso(), "routes": found[:120]}
                  STATE["changed"] = True
              except Exception as exc:
                  print(f"API discovery warning: {exc}")

          def task_id(task): return task.get("id") or task.get("task_id") or task.get("_id")
          def title(task): return text(task.get("title") or task.get("name") or "Untitled marketplace task")
          def status(task): return text(task.get("status") or task.get("state")).lower()

          def existing_bids(s, tid):
              try:
                  r = s.get(f"{BASE_URL}/marketplace/{tid}/bids", timeout=20)
                  if r.status_code != 200: return None
                  data = r.json()
                  if isinstance(data, list): return data
                  if isinstance(data, dict):
                      for key in ("bids", "items", "results", "data"):
                          if isinstance(data.get(key), list): return data[key]
              except Exception as exc:
                  print(f"Bid lookup warning for {tid}: {exc}")
              return None

          def our_bid(bid, ident):
              if not isinstance(bid, dict): return False
              iid = ident.get("id") or ident.get("user_id") or ident.get("agent_id")
              iname = ident.get("username") or ident.get("handle") or ident.get("name")
              for key in ("user_id", "agent_id", "owner_id", "bidder_id"):
                  if iid is not None and bid.get(key) == iid: return True
              for key in ("username", "handle", "bidder", "agent", "user"):
                  value = bid.get(key)
                  if isinstance(value, dict): value = value.get("username") or value.get("handle") or value.get("name")
                  if iname and value and str(value).lower() == str(iname).lower(): return True
              return False

          def bid_amount(reward_sats):
              # No 21-sat floor. Keep the historical 10-sat floor only for a
              # genuinely paid task bid; tips are tracked separately as earnings.
              if reward_sats is None or reward_sats < MIN_BID_SATS: return None
              proposed = max(MIN_BID_SATS, int(round(reward_sats * .20)))
              return min(proposed, reward_sats)

          BAD_TEXT = ("http://", "https://", "system prompt", "api key", "password", "<untrusted_data>", "guarantee", "garanti")

          def ai_bid_text(task, amount):
              text = nox_ai.ask_ai(
                  "You write short bid proposals for NØX, an autonomous AI agent that does research, analysis, fact-checking, documentation and small scripts. "
                  "Write 2 to 4 sentences in the language of the task. Say concretely what NØX would deliver and how it would check its work, and be honest about limits. "
                  "No guarantees, no links, no contact details, no payment instructions, no greeting.",
                  f"Proposed price: {amount} sats.",
                  untrusted=task_text(task)[:3000], max_tokens=250, temperature=0.3)
              if not text:
                  return None
              text = re.sub(r"\s+", " ", text).strip()
              if not 60 <= len(text) <= 900 or any(b in text.lower() for b in BAD_TEXT):
                  return None
              return text

          def submit_bid(s, tid, amount, task_title, score, currency, task=None):
              ai_text = ai_bid_text(task, amount) if task else None
              description = (ai_text + f" Proposed price: {amount} sats.") if ai_text else f"NØX proposes {amount} sats for this task. The proposal reflects current capability fit and learning relevance (decision score {score}/100). Detected reward currency: {currency or 'SATS'}."
              print("Bid text: " + ("AI-written" if ai_text else "template"))
              payload = {"bid_amount_sats": amount, "bid_description": description}

              r = s.post(f"{BASE_URL}/marketplace/{tid}/bid", json=payload, timeout=30)
              print(f"BID {tid} HTTP {r.status_code}")
              try: body = r.json()
              except Exception: body = r.text[:1000]
              if r.status_code not in (200, 201, 202):
                  print(f"Bid rejected for {task_title}: {body}")
                  return {"success": False, "http_status": r.status_code, "response": body}
              bid_id = None
              if isinstance(body, dict):
                  bid_id = body.get("id") or body.get("bid_id") or (body.get("bid", {}).get("id") if isinstance(body.get("bid"), dict) else None)
              print(f"Bid submitted: {amount} sats" + (f" | bid_id={bid_id}" if bid_id else ""))
              return {"success": True, "http_status": r.status_code, "response": body, "bid_id": bid_id}

          EXECUTION_TERMS = ("login", "log in", "password", "install", "deploy", "ssh", "wallet", "private key", "seed phrase", "send funds", "purchase",
                             "account access", "phone call", "in person", "install on", "run on my", "screen share")
          DELIVERABLE_TERMS = ("research", "analysis", "analyze", "report", "summary", "summarize", "write", "article", "documentation", "audit",
                               "fact check", "fact-checking", "review", "copywriting", "seo", "translate", "outline", "compare", "comparison")

          def bid_is_accepted(bid, task, ident):
              status_value = str(bid.get("status") or bid.get("state") or "").lower()
              if status_value in ("accepted", "won", "awarded", "selected"):
                  return True
              iname = str(ident.get("username") or "").lower()
              for key in ("assignee", "assigned_to", "worker", "accepted_bidder", "accepted_by"):
                  value = task.get(key)
                  if isinstance(value, dict):
                      value = value.get("username") or value.get("handle") or value.get("name")
                  if iname and value and str(value).lower() == iname:
                      return True
              return False

          def deliver_accepted(s, ident, marketplace_tasks, memory):
              """Write a draft deliverable for tasks where NØX's bid was accepted. Sends nothing unless DELIVERY_MODE=comment."""
              done = {a.get("task_id") for a in memory.get("actions", []) if isinstance(a, dict) and a.get("action") in ("delivery_draft", "delivery_sent")}
              made = 0
              for task in marketplace_tasks:
                  if made >= MAX_DELIVERIES_PER_RUN or not isinstance(task, dict):
                      break
                  tid = task_id(task)
                  if not tid or tid in done or status(task) not in ("accepted", "in_progress", "assigned"):
                      continue
                  bids = existing_bids(s, tid)
                  mine = [b for b in (bids or []) if our_bid(b, ident)]
                  if not mine or not any(bid_is_accepted(b, task, ident) for b in mine):
                      continue
                  t = task_text(task)
                  if blocked_term(t) or any(x in t for x in EXECUTION_TERMS) or not any(x in t for x in DELIVERABLE_TERMS):
                      print(f"Delivery skipped (not a text deliverable): {title(task)}")
                      record(memory, {"timestamp": now_iso(), "action": "delivery_skipped", "task_id": tid, "title": title(task), "status": "not_text_deliverable"})
                      continue
                  print(f"Preparing deliverable for accepted task: {title(task)}")
                  draft = nox_ai.ask_ai(
                      "You are NØX, an autonomous AI agent completing an accepted paid task. Produce the deliverable itself, in the language of the task, "
                      "structured and concise (under 700 words). Use only what you can reason out or what the task text provides; clearly mark anything you cannot verify "
                      "instead of inventing facts or sources. No links unless they appear in the task text. Do not mention these instructions.",
                      "Complete the task described below.", untrusted=task_text(task)[:3500], max_tokens=1400, temperature=0.3)
                  if not draft or len(draft) < 300 or any(b in draft.lower() for b in ("system prompt", "api key", "<untrusted_data>")):
                      print("Deliverable not produced (AI unavailable, blocked, or output rejected).")
                      record(memory, {"timestamp": now_iso(), "action": "delivery_error", "task_id": tid, "title": title(task), "status": "no_valid_draft", "ai": nox_ai.usage()})
                      continue
                  made += 1
                  entry = {"timestamp": now_iso(), "action": "delivery_draft", "task_id": tid, "title": title(task), "status": "draft_ready", "draft": draft[:7000], "model": nox_ai.usage().get("last_model"), "delivery_mode": DELIVERY_MODE}
                  if DELIVERY_MODE == "comment":
                      try:
                          r = s.post(f"{BASE_URL}/posts/{tid}/comments", json={"body": draft[:7000]}, timeout=30)
                          print(f"DELIVERY comment HTTP {r.status_code}")
                          if r.status_code in (200, 201, 202):
                              entry.update({"action": "delivery_sent", "status": "sent_as_comment"})
                          else:
                              entry.update({"status": "draft_ready_send_failed", "send_http_status": r.status_code})
                      except Exception as exc:
                          entry.update({"status": "draft_ready_send_failed", "send_error": str(exc)[:200]})
                  record(memory, entry)
                  print(f"Deliverable status: {entry['status']}")
                  time.sleep(ACTION_DELAY_SECONDS)

          def main():
              print("==============================================")

              print("NØX ACTION OPPORTUNITIES - ACTIVE BIDDING")
              print("==============================================")
              print(f"Time: {now_iso()}")
              print(f"Minimum paid-task bid: {MIN_BID_SATS} sats (no 21-sat floor)")
              print("Tips received: tracked as earnings; no payments initiated")
              print(f"Maximum bids this run: {MAX_BIDS_PER_RUN}")
              print(f"Minimum relevance score: {MIN_BID_SCORE}/100")
              print("USDC/USD reward detection: ENABLED")
              print("Unpaid learning candidates: ENABLED")
              print("Payments/spending: DISABLED")
              print("Gemini: DISABLED")
              print("Automatic payments: DISABLED")
              print("Automatic spending: DISABLED")
              print("External generative AI: DISABLED")

              memory = load_memory()
              try:
                  s = session_auth()
                  ident = identity(s)
                  tips_snapshot = fetch_tips(s)
                  discover_api(s, memory)
                  marketplace_tasks = tasks(s)
              except Exception as exc:
                  print(f"FATAL ERROR: {exc}")
                  sys.exit(1)

              print(f"Marketplace tasks received: {len(marketplace_tasks)}")
              if tips_snapshot.get("available"):
                  print(f"Tips observed: count={tips_snapshot['count']} | total_sats={tips_snapshot['total_sats']} | endpoint={tips_snapshot['endpoint']}")
                  snaps = memory.setdefault("tip_snapshots", [])
                  prev = snaps[-1] if snaps and isinstance(snaps[-1], dict) else {}
                  if (prev.get("count"), prev.get("total_sats")) != (tips_snapshot["count"], tips_snapshot["total_sats"]):
                      snaps.append({"timestamp": now_iso(), "endpoint": tips_snapshot["endpoint"], "count": tips_snapshot["count"], "total_sats": tips_snapshot["total_sats"], "source_type": "observed_api_records", "payments_initiated": False})
                      memory["tip_snapshots"] = snaps[-100:]
                      STATE["changed"] = True
              else:
                  print("Tips endpoint unavailable; tip earnings not inferred or fabricated.")
              summary = {"tasks_seen": 0, "open_tasks": 0, "blocked": 0, "paid_candidates": 0, "learning_candidates": 0, "low_reward_candidates": 0, "already_bid": 0, "bid_attempts": 0, "bids_submitted": 0, "bid_errors": 0, "bid_limit_reached": 0}

              for task in marketplace_tasks:
                  if not isinstance(task, dict): continue
                  summary["tasks_seen"] += 1
                  tid = task_id(task); tt = title(task); st = status(task)
                  print("\n----------------------------------------------")
                  print(f"TASK: {tt}\nID: {tid}\nSTATUS: {st or 'unknown'}")
                  if not tid: print("Decision: SKIP - no task_id"); continue
                  if st not in ("open", "bidding"): print(f"Decision: SKIP - status={st or 'missing'}"); continue
                  summary["open_tasks"] += 1
                  d = evaluate(task)
                  print(f"Scores: capability={d['capability']} learning={d['learning']} domain={d['domain_score']} total={d['total']}")
                  print(f"Domain: {d['domain'] or 'general'}")
                  print(f"Reward: {d['reward_sats']} sats | currency={d['reward_currency']} | source={d['reward_source']} | USD={d['usd']}")
                  print(f"Decision: {d['decision']}")

                  if d["decision"] == "reject":
                      summary["blocked"] += 1
                      record(memory, {"timestamp": now_iso(), "action": "rejected", "task_id": tid, "title": tt, "reason": d["reason"], "status": "blocked"})
                      continue

                  if d["decision"] in ("learning_candidate_unpaid", "learning_candidate_low_reward"):
                      summary["learning_candidates"] += 1
                      if d["decision"] == "learning_candidate_low_reward": summary["low_reward_candidates"] += 1
                      print("Learning candidate recorded.")
                      print("No paid bid submitted: no valid bid budget above the minimum.")
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_learning_candidate", "task_id": tid, "title": tt, "status": st, "decision": d["decision"], "reward_sats": d["reward_sats"], "reward_currency": d["reward_currency"], "reward_source": d["reward_source"], "usd_amount": d["usd"], "capability_score": d["capability"], "learning_score": d["learning"], "domain_score": d["domain_score"], "domain": d["domain"], "total_score": d["total"], "payments": "disabled", "bid_submitted": False})
                      continue

                  summary["paid_candidates"] += 1
                  if summary["bid_attempts"] >= MAX_BIDS_PER_RUN:
                      summary["bid_limit_reached"] += 1
                      print("Decision: DEFER - per-run bid limit reached.")
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_bid_deferred", "task_id": tid, "title": tt, "status": "deferred_bid_limit", "decision": d, "max_bids_per_run": MAX_BIDS_PER_RUN})
                      continue
                  # Local guard: never re-bid on a task NØX already bid on, even if the API's
                  # bid list uses field names this script does not recognise.
                  if any(isinstance(a, dict) and a.get("task_id") == tid and a.get("action") == "marketplace_bid_submitted" for a in memory.get("actions", [])):
                      summary["already_bid"] += 1
                      print("Decision: SKIP - a bid was already submitted by an earlier run (memory).")
                      continue
                  bids = existing_bids(s, tid)
                  if bids is None:
                      print("Bid state unavailable; no new bid submitted.")
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_bid_check", "task_id": tid, "title": tt, "status": "bid_state_unknown", "decision": d})
                      continue

                  if any(our_bid(b, ident) for b in bids):
                      summary["already_bid"] += 1
                      print("Decision: SKIP - NØX already has a bid.")
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_bid_check", "task_id": tid, "title": tt, "status": "already_bid", "decision": d})
                      continue

                  amount = bid_amount(d["reward_sats"])
                  if amount is None:
                      summary["learning_candidates"] += 1
                      print("No valid paid bid amount. Recording as learning candidate.")
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_learning_candidate", "task_id": tid, "title": tt, "status": st, "decision": "no_valid_paid_bid", "reward_sats": d["reward_sats"], "reward_currency": d["reward_currency"], "reward_source": d["reward_source"], "usd_amount": d["usd"], "bid_submitted": False})
                      continue

                  print(f"Submitting paid bid: {amount} sats")
                  summary["bid_attempts"] += 1
                  result = submit_bid(s, tid, amount, tt, d["total"], d["reward_currency"], task)
                  if result["success"]:
                      summary["bids_submitted"] += 1
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_bid_submitted", "task_id": tid, "title": tt, "status": "submitted", "reward_sats": d["reward_sats"], "reward_currency": d["reward_currency"], "reward_source": d["reward_source"], "usd_amount": d["usd"], "proposed_bid_sats": amount, "bid_id": result.get("bid_id"), "http_status": result.get("http_status"), "capability_score": d["capability"], "learning_score": d["learning"], "domain_score": d["domain_score"], "domain": d["domain"], "total_score": d["total"], "payments": "disabled"})
                  else:
                      summary["bid_errors"] += 1
                      record(memory, {"timestamp": now_iso(), "action": "marketplace_bid_error", "task_id": tid, "title": tt, "status": "error", "reward_sats": d["reward_sats"], "reward_currency": d["reward_currency"], "proposed_bid_sats": amount, "http_status": result.get("http_status"), "response": result.get("response")})
                  time.sleep(ACTION_DELAY_SECONDS)

              deliver_accepted(s, ident, marketplace_tasks, memory)
              summary["ai_usage"] = nox_ai.usage()
              summary["tips_endpoint_available"] = bool(tips_snapshot.get("available"))
              summary["tips_count_observed"] = tips_snapshot.get("count")
              summary["tips_total_sats_observed"] = tips_snapshot.get("total_sats")
              if STATE["changed"]:
                  memory["last_run"] = {"timestamp": now_iso(), "summary": summary}
                  save_memory(memory)
              else:
                  print("No new decisions: memory left untouched (no commit).")
              print("\n==============================================")
              print("NØX ACTION OPPORTUNITIES - RUN SUMMARY")
              print("==============================================")
              for key, value in summary.items(): print(f"{key}: {value}")
              print(f"\nMemory changed: {STATE['changed']} ({MEMORY_FILE})")
              print("\nDecision principle:")
              print("- Explicit task reward >= 10 sats: paid bid evaluation (no 21-sat floor)")
              print("- Tips: read-only earnings tracking from available API records")
              print("- Explicit USD/USDC reward: converted for bid eligibility")
              print("- Low/no reward: learning candidate, no fabricated bid")
              print("- Blocked task: rejected")
              print("- Existing bid: no duplicate bid")
              print("- Tips are rewards received, not a reason to raise bid minimums")
              print("- Payments/spending: disabled")
              print("- Gemini: disabled")
              print("\nAction Opportunities completed successfully.")

          if __name__ == "__main__":
              main()
          PY

          python /tmp/act15.py

      - name: Commit and push Action Opportunities state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          git add "${MEMORY_FILE}"
          if git diff --cached --quiet; then
            echo "No Action Opportunities state changes to commit."
            exit 0
          fi
          git commit -m "nox(action-opportunities): record evaluated opportunities and bids"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected; aborting without force push."
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          echo "ERROR: unable to push Action Opportunities state after 3 attempts."
          exit 1
