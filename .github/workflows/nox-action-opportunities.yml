name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"
  MAX_CORE_ACTIONS: "50"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "15"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0" requests

      - name: Verify Colony SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          from colony_sdk import ColonyClient

          required = (
              "bootstrap",
              "get_me",
          )

          missing = [
              name
              for name in required
              if not hasattr(ColonyClient, name)
          ]

          if missing:
              raise RuntimeError(
                  "Colony SDK is missing required methods: "
                  + ", ".join(missing)
              )

          print("Colony SDK import: OK")
          print("Required SDK methods: OK")
          print(
              "ColonyClient.bootstrap:",
              inspect.signature(ColonyClient.bootstrap),
          )
          print(
              "ColonyClient.get_me:",
              inspect.signature(ColonyClient.get_me),
          )
          PY

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          # ============================================================
          # NØX ACTION & OPPORTUNITIES
          #
          # Execution layer of the Core.
          #
          # Core:
          #   Research
          #   -> Understand
          #   -> Recall
          #   -> Reflect
          #   -> Choose
          #   -> Act
          #   -> Observe
          #   -> Learn
          #   -> Adapt
          #
          # This workflow:
          #   1. observes marketplace opportunities;
          #   2. reconstructs relevant context;
          #   3. checks Core decisions/actions;
          #   4. never bypasses an explicit Core decision;
          #   5. reconciles existing bids before acting;
          #   6. submits a bid only when the Core authorizes execution;
          #   7. records expected and actual outcomes;
          #   8. preserves uncertainty instead of inventing certainty.
          #
          # Policy:
          #   Gemini       = disabled
          #   External AI  = disabled
          #   Spending     = disabled
          #   Payments     = disabled
          #   Project cost = €0
          #
          # Marketplace operations use deterministic HTTP.
          # SDK is used for bootstrap and identity verification.
          # ============================================================

          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          ACTION_MEMORY_FILE = Path(
              os.environ["ACTION_MEMORY_FILE"]
          )

          MAX_TASKS = int(
              os.environ["MAX_TASKS_PER_RUN"]
          )
          MAX_BIDS = int(
              os.environ["MAX_BIDS_PER_RUN"]
          )
          MAX_BID_CHECKS = int(
              os.environ["MAX_BID_CHECKS_PER_RUN"]
          )
          MAX_TRACKED = int(
              os.environ["MAX_TRACKED_ITEMS"]
          )
          MAX_CORE_ACTIONS = int(
              os.environ["MAX_CORE_ACTIONS"]
          )

          MIN_OPPORTUNITY = int(
              os.environ["MIN_OPPORTUNITY_SATS"]
          )
          MIN_PLATFORM_BID = int(
              os.environ["MIN_PLATFORM_BID_SATS"]
          )
          TIMEOUT = int(
              os.environ["REQUEST_TIMEOUT_SECONDS"]
          )

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              "",
          ).strip()

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY is missing."
              )

          # ============================================================
          # BASIC UTILITIES
          # ============================================================

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return default

              except Exception as exc:
                  print(
                      f"WARNING: failed to load {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              temporary.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              temporary.replace(path)


          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(
                  value,
                  (int, float),
              ):
                  return str(value)

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              except Exception:
                  return str(value)


          def clean_text(
              value,
              limit=2000,
          ):
              return re.sub(
                  r"\s+",
                  " ",
                  text_value(value).strip(),
              )[:limit]


          def normalize(value):
              return clean_text(
                  value,
                  2000,
              ).lower()


          def stable_id(
              kind,
              value,
          ):
              raw = (
                  f"{kind}|"
                  f"{clean_text(value, 20000).lower()}"
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:16]


          def recursive_values(
              obj,
              path="",
          ):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current = (
                          f"{path}.{key}"
                          if path
                          else str(key)
                      )

                      yield (
                          current,
                          str(key),
                          value,
                      )

                      yield from recursive_values(
                          value,
                          current,
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      current = (
                          f"{path}[{index}]"
                      )

                      yield (
                          current,
                          str(index),
                          value,
                      )

                      yield from recursive_values(
                          value,
                          current,
                      )

          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Action-Opportunities/5.0",
          })


          def http_json(
              method,
              path,
              token="",
              payload=None,
              params=None,
          ):
              url = (
                  path
                  if path.startswith("http")
                  else f"{API_BASE}{path}"
              )

              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "NOX-Action-Opportunities/5.0",
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              try:
                  response = session.request(
                      method,
                      url,
                      headers=headers,
                      json=payload,
                      params=params,
                      timeout=TIMEOUT,
                  )

              except requests.RequestException as exc:
                  raise RuntimeError(
                      f"{method} {url}: "
                      f"network error: {exc}"
                  )

              if response.status_code >= 400:
                  try:
                      detail = response.json()
                  except Exception:
                      detail = response.text[:2000]

                  raise RuntimeError(
                      f"{method} {url} -> "
                      f"HTTP {response.status_code}: "
                      f"{detail}"
                  )

              if not response.content:
                  return {}

              try:
                  return response.json()

              except Exception:
                  return {
                      "raw": response.text[:5000]
                  }

          # ============================================================
          # LOAD SHARED COGNITIVE STATE
          # ============================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )

          action_memory = load_json(
              ACTION_MEMORY_FILE,
              {
                  "version": 6,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              },
          )

          if not isinstance(
              action_memory,
              dict,
          ):
              action_memory = {}

          action_memory.setdefault(
              "version",
              6,
          )

          action_memory.setdefault(
              "created_at",
              now_iso(),
          )

          action_memory.setdefault(
              "updated_at",
              now_iso(),
          )

          for key in (
              "opportunities",
              "bids",
              "runs",
              "learnings",
          ):
              if not isinstance(
                  action_memory.get(key),
                  list,
              ):
                  action_memory[key] = []

          # ============================================================
          # CORE AUTHORIZATION
          # ============================================================

          def extract_core_actions():
              actions = []

              raw_actions = core_memory.get(
                  "actions",
                  [],
              )

              if isinstance(
                  raw_actions,
                  list,
              ):
                  actions.extend(
                      item
                      for item in raw_actions
                      if isinstance(item, dict)
                  )

              decisions = core_memory.get(
                  "decisions",
                  [],
              )

              if isinstance(
                  decisions,
                  list,
              ):
                  actions.extend(
                      item
                      for item in decisions
                      if isinstance(item, dict)
                  )

              cognitive_cases = core_memory.get(
                  "cognitive_cases",
                  [],
              )

              if isinstance(
                  cognitive_cases,
                  list,
              ):
                  for case in cognitive_cases[
                      -MAX_CORE_ACTIONS:
                  ]:
                      if not isinstance(
                          case,
                          dict,
                      ):
                          continue

                      decision = case.get(
                          "decision"
                      )

                      if not decision:
                          continue

                      actions.append({
                          "timestamp": case.get(
                              "timestamp"
                          ),
                          "summary": (
                              f"Core decision: "
                              f"{decision}"
                          ),
                          "decision": decision,
                          "target_id": case.get(
                              "target_id"
                          ),
                          "execution_layer": (
                              case.get(
                                  "execution_layer"
                              )
                          ),
                          "decision_reason": (
                              case.get(
                                  "decision_reason"
                              )
                          ),
                          "interest": case.get(
                              "interest"
                          ),
                      })

              return actions[
                  -MAX_CORE_ACTIONS:
              ]


          MARKETPLACE_ACTION_MARKERS = (
              "marketplace",
              "opportunit",
              "bid",
              "bidding",
              "paid_task",
              "paid task",
              "submit_bid",
              "submit bid",
              "action_opportunities",
              "action / opportunities",
              "action and opportunities",
          )


          def is_marketplace_action(
              item,
          ):
              if not isinstance(
                  item,
                  dict,
              ):
                  return False

              execution_layer = normalize(
                  item.get(
                      "execution_layer"
                  )
              )

              decision = normalize(
                  item.get("decision")
                  or item.get("action")
                  or item.get("summary")
              )

              combined = (
                  f"{execution_layer} "
                  f"{decision}"
              )

              return any(
                  marker in combined
                  for marker in MARKETPLACE_ACTION_MARKERS
              )


          core_actions = extract_core_actions()

          authorized_core_actions = [
              item
              for item in core_actions
              if is_marketplace_action(item)
          ]


          def core_allows_marketplace():
              if not authorized_core_actions:
                  return False

              for item in reversed(
                  authorized_core_actions
              ):
                  decision = normalize(
                      item.get("decision")
                      or item.get("action")
                      or item.get("summary")
                  )

                  if (
                      "do_nothing" in decision
                      or "do nothing" in decision
                      or "observe" in decision
                      or "wait" in decision
                  ):
                      continue

                  return True

              return False


          marketplace_authorized = (
              core_allows_marketplace()
          )

          # ============================================================
          # SDK BOOTSTRAP / IDENTITY
          # ============================================================

          print("")
          print(
              "=== NØX ACTION & OPPORTUNITIES ==="
          )

          print(
              "Core authorization:",
              marketplace_authorized,
          )

          print("Gemini: false")
          print("External AI: false")
          print("Spending: false")
          print("Payments: false")
          print("Project cost: €0")

          try:
              sdk_client = ColonyClient(
                  API_KEY
              )

              try:
                  sdk_state = (
                      sdk_client.bootstrap()
                  )

              except ColonyAuthError as exc:
                  raise RuntimeError(
                      "Colony authentication refused: "
                      f"{exc}"
                  )

              except ColonyAPIError as exc:
                  raise RuntimeError(
                      "Colony bootstrap failed: "
                      f"{exc}"
                  )

              profile = {}

              if isinstance(
                  sdk_state,
                  dict,
              ):
                  profile = sdk_state.get(
                      "profile",
                      {},
                  )

              if not isinstance(
                  profile,
                  dict,
              ):
                  profile = {}

              username = (
                  profile.get("username")
                  or profile.get("handle")
                  or profile.get("name")
                  or ""
              )

              if not username:
                  try:
                      me_sdk = (
                          sdk_client.get_me()
                      )

                      if isinstance(
                          me_sdk,
                          dict,
                      ):
                          profile = me_sdk

                          username = (
                              me_sdk.get(
                                  "username"
                              )
                              or me_sdk.get(
                                  "handle"
                              )
                              or me_sdk.get(
                                  "name"
                              )
                              or ""
                          )

                  except Exception:
                      pass

              if username and normalize(
                  username
              ) != "nox_origine":
                  raise RuntimeError(
                      "SECURITY STOP: "
                      "unexpected Colony identity "
                      f"'{username}'."
                  )

              print(
                  f"Identity: "
                  f"@{username or 'unknown'}"
              )

          except Exception as exc:
              print(
                  f"SDK bootstrap error: {exc}"
              )
              sys.exit(1)

          # ============================================================
          # AUTH TOKEN
          # ============================================================

          try:
              auth = http_json(
                  "POST",
                  "/auth/token",
                  token="",
                  payload={
                      "api_key": API_KEY
                  },
              )

          except RuntimeError as exc:
              print(
                  f"Authentication failed: {exc}"
              )
              sys.exit(1)

          token = (
              auth.get("access_token")
              or auth.get("token")
              or auth.get("jwt")
          )

          if not token:
              raise SystemExit(
                  "ERROR: authentication succeeded "
                  "without an access token."
              )

          me = http_json(
              "GET",
              "/users/me",
              token,
          )

          profile_name = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or username
              or "unknown"
          )

          if normalize(
              profile_name
          ) != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: "
                  "marketplace identity mismatch: "
                  f"{profile_name}"
              )

          profile_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("userId")
              or me.get("agent_id")
              or me.get("agentId")
          )

          print(
              "Marketplace
