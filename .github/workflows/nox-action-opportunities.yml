name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json
  MAX_TASKS_PER_RUN: "20"
  MAX_BIDS_PER_RUN: "2"
  MAX_TRACKED_ITEMS: "250"
  MIN_OPPORTUNITY_SATS: "1"
  REQUEST_TIMEOUT_SECONDS: "15"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_API_TOKEN: ${{ secrets.COLONY_API_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API_BASE = "https://thecolony.cc/api/v1"
          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          ACTION_MEMORY_FILE = Path(os.environ["ACTION_MEMORY_FILE"])
          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_TRACKED = int(os.environ["MAX_TRACKED_ITEMS"])
          MIN_OPPORTUNITY = int(os.environ["MIN_OPPORTUNITY_SATS"])
          TIMEOUT = int(os.environ["REQUEST_TIMEOUT_SECONDS"])

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path, default):
              try:
                  if not path.exists():
                      return default
                  with path.open("r", encoding="utf-8") as f:
                      value = json.load(f)
                  return value
              except Exception as exc:
                  print(f"WARNING: cannot read {path}: {exc}")
                  return default

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(value, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              tmp.replace(path)

          def request(method, path, token=None, body=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Colony-Agent/1.0",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  API_BASE + path,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=TIMEOUT
                  ) as r:
                      raw = r.read().decode("utf-8")

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)
                      except json.JSONDecodeError:
                          return {"raw": raw}

              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"raw": raw}

                  detail = payload.get(
                      "detail",
                      payload
                  )

                  raise RuntimeError(
                      f"{method} {path} -> HTTP {exc.code}: "
                      f"{json.dumps(detail, ensure_ascii=False)}"
                  )

          def auth_token():
              api_key = os.environ.get(
                  "COLONY_API_KEY",
                  ""
              ).strip()

              token = os.environ.get(
                  "COLONY_API_TOKEN",
                  ""
              ).strip()

              credential = api_key or token

              if not credential:
                  raise RuntimeError(
                      "Missing COLONY_API_KEY/COLONY_API_TOKEN secret."
                  )

              if credential.startswith("col_"):
                  print(
                      "AUTH: API key detected; "
                      "exchanging for JWT."
                  )

                  payload = request(
                      "POST",
                      "/auth/token",
                      body={
                          "api_key": credential
                      },
                  )

                  jwt = payload.get(
                      "access_token"
                  )

                  if not jwt:
                      raise RuntimeError(
                          "Auth exchange returned no access_token."
                      )

                  return jwt

              print(
                  "AUTH: bearer token detected; "
                  "using it directly."
              )

              return credential

          def items(payload, keys):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in keys:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              for value in payload.values():
                  if isinstance(value, list):
                      return value

              return []

          def as_int(value):
              if isinstance(value, bool) or value is None:
                  return None

              if isinstance(value, int):
                  return value if value >= 0 else None

              if isinstance(value, float):
                  return int(value) if value >= 0 else None

              if isinstance(value, str):
                  text = (
                      value
                      .replace(",", "")
                      .replace(" ", "")
                  )

                  match = re.search(
                      r"(?<!\d)(\d+(?:\.\d+)?)(?!\d)",
                      text
                  )

                  if match:
                      number = int(
                          float(match.group(1))
                      )

                      return (
                          number
                          if number >= 0
                          else None
                      )

              return None

          def numbers(value):
              if (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
              ):
                  return [int(value)]

              if isinstance(value, str):
                  text = (
                      value
                      .replace(",", "")
                      .replace("–", "-")
                      .replace("—", "-")
                      .replace("−", "-")
                  )

                  return [
                      int(float(x))
                      for x in re.findall(
                          r"(?<!\d)(\d+(?:\.\d+)?)(?!\d)",
                          text,
                      )
                  ]

              return []

          def keynorm(key):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(key).lower()
              )

          def bounds_from_task(task):
              """
              Find a reliable bid interval without guessing.

              Priority:
              1. explicit min/max bid fields
              2. explicit bid/price/budget/reward ranges
              3. fixed amount when explicitly represented

              A 1-sat opportunity remains trackable, but is never
              blindly submitted as a bid.
              """

              mins = []
              maxs = []
              fixed = []

              def walk(
                  value,
                  key_path="",
                  parent_key=""
              ):
                  if isinstance(value, dict):

                      for key, child in value.items():
                          kn = keynorm(key)

                          path = (
                              f"{key_path}.{key}"
                              if key_path
                              else str(key)
                          )

                          relevant = any(
                              word in kn
                              for word in (
                                  "bid",
                                  "budget",
                                  "reward",
                                  "price",
                                  "amount",
                                  "payout",
                                  "compensation"
                              )
                          )

                          if relevant:
                              vals = numbers(child)

                              if (
                                  "min" in kn
                                  and vals
                              ):
                                  mins.append(
                                      vals[0]
                                  )

                              elif (
                                  "max" in kn
                                  and vals
                              ):
                                  maxs.append(
                                      vals[0]
                                  )

                              elif (
                                  any(
                                      x in kn
                                      for x in (
                                          "range",
                                          "interval"
                                      )
                                  )
                                  and len(vals) >= 2
                              ):
                                  mins.append(
                                      vals[0]
                                  )
                                  maxs.append(
                                      vals[1]
                                  )

                              elif (
                                  len(vals) >= 2
                                  and (
                                      "reward" in kn
                                      or "budget" in kn
                                      or "price" in kn
                                      or "bid" in kn
                                  )
                              ):
                                  mins.append(
                                      vals[0]
                                  )
                                  maxs.append(
                                      vals[1]
                                  )

                              elif (
                                  len(vals) == 1
                                  and (
                                      kn in {
                                          "fixedprice",
                                          "fixedpricesats",
                                          "rewardsats",
                                          "budgetsats",
                                          "pricesats",
                                          "amountsats",
                                          "paymentsats",
                                      }
                                      or kn.endswith(
                                          "fixedsats"
                                      )
                                  )
                              ):
                                  fixed.append(
                                      vals[0]
                                  )

                          walk(
                              child,
                              path,
                              kn
                          )

                  elif isinstance(value, list):

                      for index, child in enumerate(
                          value
                      ):
                          walk(
                              child,
                              f"{key_path}[{index}]",
                              parent_key
                          )

              walk(task)

              clean_mins = [
                  x
                  for x in mins
                  if x >= MIN_OPPORTUNITY
              ]

              clean_maxs = [
                  x
                  for x in maxs
                  if x >= MIN_OPPORTUNITY
              ]

              if clean_mins:
                  lower = min(clean_mins)

                  upper = (
                      min(clean_maxs)
                      if clean_maxs
                      else None
                  )

                  return (
                      lower,
                      upper,
                      "explicit/range"
                  )

              fixed_valid = sorted(
                  {
                      x
                      for x in fixed
                      if x >= max(
                          MIN_OPPORTUNITY,
                          21
                      )
                  }
              )

              if fixed_valid:
                  value = fixed_valid[0]

                  return (
                      value,
                      value,
                      "fixed_amount"
                  )

              for key in (
                  "min_bid_sats",
                  "minimum_bid_sats",
                  "min_bid",
                  "minimum_bid",
                  "min_price_sats",
                  "minimum_price_sats",
                  "min_budget_sats",
                  "minimum_budget_sats",
                  "min_reward_sats",
                  "minimum_reward_sats",
              ):
                  value = as_int(
                      task.get(key)
                  )

                  if (
                      value is not None
                      and value >= MIN_OPPORTUNITY
                  ):
                      upper = None

                      for max_key in (
                          "max_bid_sats",
                          "maximum_bid_sats",
                          "max_price_sats",
                          "maximum_price_sats",
                          "max_budget_sats",
                          "maximum_budget_sats",
                          "max_reward_sats",
                          "maximum_reward_sats",
                      ):
                          upper = as_int(
                              task.get(max_key)
                          )

                          if upper is not None:
                              break

                      return (
                          value,
                          upper,
                          key
                      )

              for key in (
                  "fixed_reward_sats",
                  "fixed_budget_sats",
                  "fixed_price_sats",
                  "fixed_amount_sats",
              ):
                  value = as_int(
                      task.get(key)
                  )

                  if (
                      value is not None
                      and value >= max(
                          MIN_OPPORTUNITY,
                          21
                      )
                  ):
                      return (
                          value,
                          value,
                          key
                      )

              return (
                  None,
                  None,
                  "unknown"
              )

          def task_id(task):
              for key in (
                  "id",
                  "task_id",
                  "uuid"
              ):
                  if task.get(key):
                      return str(
                          task[key]
                      )

              return None

          def title(task):
              for key in (
                  "title",
                  "name",
                  "task_title",
                  "description"
              ):
                  value = task.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      return value.strip()

              return "Untitled task"

          def reward(task):
              for key in (
                  "reward_sats",
                  "reward_amount_sats",
                  "amount_sats",
                  "payment_sats",
                  "price_sats",
                  "budget_sats",
                  "max_reward_sats",
              ):
                  value = as_int(
                      task.get(key)
                  )

                  if value is not None:
                      return value

              value = task.get(
                  "reward"
              )

              if isinstance(
                  value,
                  dict
              ):
                  for key in (
                      "sats",
                      "amount_sats",
                      "amount",
                      "value",
                      "reward_sats"
                  ):
                      value2 = as_int(
                          value.get(key)
                      )

                      if value2 is not None:
                          return value2

              return as_int(value)

          def score(
              task,
              core,
              knowledge
          ):
              text_parts = [
                  title(task).lower()
              ]

              for key in (
                  "description",
                  "details",
                  "requirements",
                  "skills",
                  "category",
                  "tags"
              ):
                  value = task.get(key)

                  if isinstance(
                      value,
                      str
                  ):
                      text_parts.append(
                          value.lower()
                      )

                  elif isinstance(
                      value,
                      list
                  ):
                      text_parts.extend(
                          str(x).lower()
                          for x in value
                      )

              text = " ".join(
                  text_parts
              )

              strong = (
                  "research",
                  "research report",
                  "deep research",
                  "technical report",
                  "report writing",
                  "write a report",
                  "analysis",
                  "technical",
                  "documentation",
                  "agent",
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "python",
                  "automation",
                  "data",
                  "verification",
                  "verify",
                  "receipt",
                  "evidence",
                  "testing"
              )

              learning = (
                  "learn",
                  "feedback",
                  "test",
                  "testing",
                  "review",
                  "verify",
                  "verification",
                  "experiment",
                  "documentation"
              )

              relation = (
                  "collaboration",
                  "collaborate",
                  "community",
                  "agent",
                  "discussion",
                  "contribution"
              )

              total = 0
              reasons = []

              for term in strong:
                  if term in text:
                      total += 5
                      reasons.append(term)

              for term in learning:
                  if term in text:
                      total += 2
                      reasons.append(
                          f"learning:{term}"
                      )

              for term in relation:
                  if term in text:
                      total += 1
                      reasons.append(
                          f"relation:{term}"
                      )

              task_reward = reward(
                  task
              )

              if task_reward is not None:

                  if task_reward >= 10000:
                      total += 6
                      reasons.append(
                          "high_reward"
                      )

                  elif task_reward >= 1000:
                      total += 4
                      reasons.append(
                          "paid"
                      )

                  elif task_reward >= 1:
                      total += 2
                      reasons.append(
                          "reward_present"
                      )

                  else:
                      reasons.append(
                          "zero_reward_possible_tip"
                      )

              context = (
                  json.dumps(
                      core,
                      ensure_ascii=False
                  ).lower()
                  +
                  json.dumps(
                      knowledge,
                      ensure_ascii=False
                  ).lower()
              )

              for term in (
                  "research",
                  "python",
                  "agent",
                  "verification",
                  "report",
                  "tool",
                  "documentation"
              ):
                  if (
                      term in text
                      and term in context
                  ):
                      total += 2
                      reasons.append(
                          f"context:{term}"
                      )

              return (
                  total,
                  list(
                      dict.fromkeys(
                          reasons
                      )
                  )
              )

          def has_own_bid(
              token,
              tid
          ):
              payload = request(
                  "GET",
                  f"/marketplace/{tid}/bids",
                  token=token,
              )

              for bid in items(
                  payload,
                  (
                      "bids",
                      "items",
                      "data"
                  )
              ):
                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  if (
                      bid.get("is_mine")
                      is True
                      or bid.get("mine")
                      is True
                      or bid.get("is_own")
                      is True
                  ):
                      return True

                  if (
                      str(
                          bid.get(
                              "username",
                              ""
                          )
                      ).lower()
                      == "nox_origine"
                  ):
                      return True

                  if (
                      str(
                          bid.get(
                              "bidder",
                              ""
                          )
                      ).lower()
                      == "nox_origine"
                  ):
                      return True

              return False

          def list_memory(
              value
          ):
              if isinstance(
                  value,
                  list
              ):
                  return value

              if isinstance(
                  value,
                  dict
              ):
                  return list(
                      value.values()
                  )

              return []

          core = load(
              CORE_MEMORY_FILE,
              {}
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          action = load(
              ACTION_MEMORY_FILE,
              {
                  "version": 1,
                  "opportunities": [],
                  "bids": [],
                  "runs": []
              }
          )

          if not isinstance(
              action,
              dict
          ):
              action = {
                  "version": 1,
                  "opportunities": [],
                  "bids": [],
                  "runs": []
              }

          action["opportunities"] = list_memory(
              action.get(
                  "opportunities"
              )
          )

          action["bids"] = list_memory(
              action.get(
                  "bids"
              )
          )

          action["runs"] = list_memory(
              action.get(
                  "runs"
              )
          )

          token = auth_token()

          try:
              profile = request(
                  "GET",
                  "/users/me",
                  token=token
              )

          except Exception as exc:
              print(
                  f"PROFILE ERROR: {exc}"
              )
              sys.exit(1)

          username = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )

          print(
              "=== NØX ACTION & OPPORTUNITIES ==="
          )

          print(
              f"Profile: {username}"
          )

          print(
              "Policy: €0 / no spending / "
              "no payment / no Gemini / "
              "no external AI"
          )

          print(
              f"Opportunity floor: "
              f"{MIN_OPPORTUNITY} sat"
          )

          print(
              "Bid floor: read from task data only; "
              "no arbitrary 1/10-sat fallback"
          )

          payload = request(
              "GET",
              (
                  "/marketplace/tasks"
                  f"?limit={MAX_TASKS}"
              ),
              token=token,
          )

          tasks = items(
              payload,
              (
                  "tasks",
                  "items",
                  "data"
              )
          )[:MAX_TASKS]

          print(
              f"Marketplace tasks observed: "
              f"{len(tasks)}"
          )

          candidates = []

          for task in tasks:

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              tid = task_id(
                  task
              )

              if not tid:
                  continue

              task_reward = reward(
                  task
              )

              task_score, reasons = score(
                  task,
                  core,
                  knowledge
              )

              if task_score <= 0:
                  continue

              candidates.append(
                  {
                      "task": task,
                      "task_id": tid,
                      "title": title(task),
                      "reward_sats": task_reward,
                      "score": task_score,
                      "reasons": reasons,
                  }
              )

          candidates.sort(
              key=lambda x: (
                  -x["score"],
                  -(
                      x["reward_sats"]
                      if x["reward_sats"]
                      is not None
                      else 0
                  ),
              )
          )

          print(
              f"Relevant candidates: "
              f"{len(candidates)}"
          )

          submitted = 0
          skipped = 0
          errors = 0

          for candidate in candidates:

              if submitted >= MAX_BIDS:
                  break

              tid = candidate[
                  "task_id"
              ]

              task = candidate[
                  "task"
              ]

              try:
                  if has_own_bid(
                      token,
                      tid
                  ):
                      print(
                          f"BID SKIP: already submitted "
                          f"-> {tid}"
                      )

                      skipped += 1
                      continue

              except Exception as exc:
                  print(
                      f"BID CHECK ERROR: "
                      f"{tid}: {exc}"
                  )

                  skipped += 1
                  continue

              lower, upper, source = (
                  bounds_from_task(
                      task
                  )
              )

              if lower is None:

                  print(
                      f"BID SKIP: {tid} -> "
                      "no reliable bid floor in task data; "
                      "opportunity remains tracked"
                  )

                  skipped += 1

                  action[
                      "opportunities"
                  ].append(
                      {
                          "task_id": tid,
                          "title": candidate[
                              "title"
                          ],
                          "reward_sats": candidate[
                              "reward_sats"
                          ],
                          "score": candidate[
                              "score"
                          ],
                          "reasons": candidate[
                              "reasons"
                          ],
                          "status": (
                              "tracked_no_bid"
                          ),
                          "bid_reason": (
                              "no_reliable_bid_floor"
                          ),
                          "tip_potential": True,
                          "observed_at": now(),
                      }
                  )

                  continue

              if (
                  upper is not None
                  and lower > upper
              ):

                  print(
                      f"BID SKIP: {tid} -> "
                      f"invalid range "
                      f"{lower}-{upper}; "
                      "opportunity remains tracked"
                  )

                  skipped += 1
                  continue

              amount = lower

              if amount < MIN_OPPORTUNITY:
                  print(
                      f"BID SKIP: {tid} -> "
                      "floor below opportunity floor"
                  )

                  skipped += 1
                  continue

              description = (
                  "NØX can contribute deterministically "
                  "to this task. Relevant signals: "
                  +
                  ", ".join(
                      candidate[
                          "reasons"
                      ][:5]
                  )
                  +
                  ". Evidence-based and traceable delivery."
              )

              range_text = (
                  f" max={upper}"
                  if upper is not None
                  else ""
              )

              print(
                  f"BID ATTEMPT: {tid} "
                  f"amount={amount} sat "
                  f"range_source={source}"
                  f"{range_text}"
              )

              try:

                  request(
                      "POST",
                      f"/marketplace/{tid}/bid",
                      token=token,
                      body={
                          "amount_sats": amount,
                          "description": description,
                      },
                  )

                  print(
                      f"BID SUCCESS: {tid} "
                      f"amount={amount} sat"
                  )

                  submitted += 1

                  action[
                      "bids"
                  ].append(
                      {
                          "task_id": tid,
                          "amount_sats": amount,
                          "status": "submitted",
                          "floor_source": source,
                          "submitted_at": now(),
                      }
                  )

                  action[
                      "opportunities"
                  ].append(
                      {
                          "task_id": tid,
                          "title": candidate[
                              "title"
                          ],
                          "reward_sats": candidate[
                              "reward_sats"
                          ],
                          "score": candidate[
                              "score"
                          ],
                          "reasons": candidate[
                              "reasons"
                          ],
                          "status": (
                              "bid_submitted"
                          ),
                          "bid_sats": amount,
                          "tip_potential": True,
                          "submitted_at": now(),
                      }
                  )

              except Exception as exc:

                  print(
                      f"BID ERROR: {tid}: "
                      f"{exc}"
                  )

                  errors += 1

                  action[
                      "bids"
                  ].append(
                      {
                          "task_id": tid,
                          "amount_sats": amount,
                          "status": "error",
                          "error": str(exc),
                          "observed_at": now(),
                      }
                  )

          action[
              "opportunities"
          ] = action[
              "opportunities"
          ][-MAX_TRACKED:]

          action[
              "bids"
          ] = action[
              "bids"
          ][-MAX_TRACKED:]

          action[
              "runs"
          ].append(
              {
                  "run_at": now(),
                  "tasks_observed": len(
                      tasks
                  ),
                  "candidates": len(
                      candidates
                  ),
                  "bids_submitted": submitted,
                  "bids_skipped": skipped,
                  "bid_errors": errors,
                  "policy": {
                      "project_cost_eur": 0,
                      "gemini_used": False,
                      "external_ai_used": False,
                      "auto_payment": False,
                      "auto_spending": False,
                  },
              }
          )

          action[
              "runs"
          ] = action[
              "runs"
          ][-100:]

          action["version"] = 1

          save(
              ACTION_MEMORY_FILE,
              action
          )

          print("")
          print(
              "=== NØX ACTION / OPPORTUNITIES SUMMARY ==="
          )

          print(
              f"Tasks observed: "
              f"{len(tasks)}"
          )

          print(
              f"Relevant candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Bids submitted: "
              f"{submitted}"
          )

          print(
              f"Bids skipped: "
              f"{skipped}"
          )

          print(
              f"Bid errors: "
              f"{errors}"
          )

          print(
              "Low-value opportunities remain tracked "
              "for learning/tip potential."
          )

          print(
              "No automatic payment or spending performed."
          )

          print(
              "=== NØX ACTION / OPPORTUNITIES TERMINÉ ==="
          )
          PY

      - name: Commit action memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

          git add memory/nox_action_opportunities.json

          if git diff --cached --quiet; then
            echo "No action-memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update action and opportunities memory"
          git push
