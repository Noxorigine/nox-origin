name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_TRACKED_ITEMS: "300"
  MAX_BID_CHECKS_PER_RUN: "10"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "20"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"


jobs:
  action-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_API_TOKEN: ${{ secrets.COLONY_API_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          # ==========================================================
          # NØX - ACTION & OPPORTUNITIES
          #
          # Position dans la chaîne:
          #
          # CORE
          #   ↓
          # MEMORY & KNOWLEDGE
          #   ↓
          # ACTION & OPPORTUNITIES
          #   ↓
          # OBSERVE / LEARN
          #   ↓
          # CORE
          #
          # Mission:
          # - détecter les opportunités réelles
          # - comprendre les contraintes avant d'agir
          # - déposer des bids uniquement lorsque les données
          #   permettent une action cohérente
          # - suivre les bids et leurs résultats
          # - conserver les opportunités non actionnables
          # - produire des signaux utilisables par le Core
          #
          # Interdictions:
          # - aucun paiement
          # - aucune dépense
          # - aucune IA externe
          # - aucun Gemini
          # - aucune décision financière externe
          # ==========================================================


          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )

          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          ACTION_MEMORY_FILE = Path(
              os.environ["ACTION_MEMORY_FILE"]
          )

          MAX_TASKS = int(
              os.environ["MAX_TASKS_PER_RUN"]
          )

          MAX_BIDS = int(
              os.environ["MAX_BIDS_PER_RUN"]
          )

          MAX_TRACKED = int(
              os.environ["MAX_TRACKED_ITEMS"]
          )

          MAX_BID_CHECKS = int(
              os.environ["MAX_BID_CHECKS_PER_RUN"]
          )

          MIN_OPPORTUNITY = int(
              os.environ["MIN_OPPORTUNITY_SATS"]
          )

          MIN_PLATFORM_BID = int(
              os.environ["MIN_PLATFORM_BID_SATS"]
          )

          TIMEOUT = int(
              os.environ["REQUEST_TIMEOUT_SECONDS"]
          )


          # ==========================================================
          # TEMPS
          # ==========================================================

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ==========================================================
          # MÉMOIRE
          # ==========================================================

          def load(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read "
                      f"{path}: {exc}"
                  )

                  return default


          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      value,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

                  handle.write("\n")

              temporary.replace(path)


          # ==========================================================
          # API
          # ==========================================================

          def request(
              method,
              path,
              token=None,
              body=None
          ):
              headers = {
                  "Accept": "application/json",
                  "User-Agent":
                      "NOX-Colony-Agent/2.0",
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              data = None

              if body is not None:
                  data = json.dumps(
                      body
                  ).encode("utf-8")

                  headers[
                      "Content-Type"
                  ] = "application/json"

              request_object = urllib.request.Request(
                  API_BASE + path,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request_object,
                      timeout=TIMEOUT
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      if not raw:
                          return {}

                      try:
                          return json.loads(
                              raw
                          )

                      except json.JSONDecodeError:
                          return {
                              "raw": raw
                          }

              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  try:
                      payload = json.loads(
                          raw
                      )

                  except Exception:
                      payload = {
                          "raw": raw
                      }

                  detail = payload.get(
                      "detail",
                      payload
                  )

                  raise RuntimeError(
                      f"{method} {path} -> "
                      f"HTTP {exc.code}: "
                      f"{json.dumps(detail, ensure_ascii=False)}"
                  )


          def auth_token():
              api_key = os.environ.get(
                  "COLONY_API_KEY",
                  ""
              ).strip()

              token = os.environ.get(
                  "COLONY_API_TOKEN",
                  ""
              ).strip()

              credential = (
                  api_key
                  or token
              )

              if not credential:
                  raise RuntimeError(
                      "Missing "
                      "COLONY_API_KEY/"
                      "COLONY_API_TOKEN."
                  )

              if credential.startswith(
                  "col_"
              ):
                  print(
                      "AUTH: API key detected; "
                      "exchanging for JWT."
                  )

                  payload = request(
                      "POST",
                      "/auth/token",
                      body={
                          "api_key": credential
                      }
                  )

                  jwt = payload.get(
                      "access_token"
                  )

                  if not jwt:
                      raise RuntimeError(
                          "Auth exchange returned "
                          "no access_token."
                      )

                  return jwt

              print(
                  "AUTH: bearer token detected; "
                  "using it directly."
              )

              return credential


          # ==========================================================
          # STRUCTURE HELPERS
          # ==========================================================

          def items(
              payload,
              keys
          ):
              if isinstance(
                  payload,
                  list
              ):
                  return payload

              if not isinstance(
                  payload,
                  dict
              ):
                  return []

              for key in keys:
                  value = payload.get(
                      key
                  )

                  if isinstance(
                      value,
                      list
                  ):
                      return value

              for value in payload.values():
                  if isinstance(
                      value,
                      list
                  ):
                      return value

              return []


          def as_int(value):
              if value is None:
                  return None

              if isinstance(
                  value,
                  bool
              ):
                  return None

              if isinstance(
                  value,
                  int
              ):
                  return (
                      value
                      if value >= 0
                      else None
                  )

              if isinstance(
                  value,
                  float
              ):
                  return (
                      int(value)
                      if value >= 0
                      else None
                  )

              if isinstance(
                  value,
                  str
              ):
                  text = (
                      value
                      .replace(",", "")
                      .replace(" ", "")
                  )

                  match = re.search(
                      r"(?<!\d)"
                      r"(\d+(?:\.\d+)?)"
                      r"(?!\d)",
                      text
                  )

                  if match:
                      number = int(
                          float(
                              match.group(1)
                          )
                      )

                      return (
                          number
                          if number >= 0
                          else None
                      )

              return None


          def keynorm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )


          # ==========================================================
          # TASK IDENTIFICATION
          # ==========================================================

          def task_id(task):
              for key in (
                  "id",
                  "task_id",
                  "uuid"
              ):
                  if task.get(key):
                      return str(
                          task[key]
                      )

              return None


          def title(task):
              for key in (
                  "title",
                  "name",
                  "task_title"
              ):
                  value = task.get(
                      key
                  )

                  if (
                      isinstance(
                          value,
                          str
                      )
                      and value.strip()
                  ):
                      return value.strip()

              return "Untitled task"


          def text_of(task):
              parts = [
                  title(task)
              ]

              for key in (
                  "description",
                  "body",
                  "details",
                  "requirements",
                  "skills",
                  "category",
                  "tags"
              ):
                  value = task.get(
                      key
                  )

                  if isinstance(
                      value,
                      str
                  ):
                      parts.append(
                          value
                      )

                  elif isinstance(
                      value,
                      list
                  ):
                      parts.extend(
                          str(x)
                          for x in value
                      )

              return " ".join(
                  parts
              )


          # ==========================================================
          # BUDGET / REWARD
          #
          # The Colony marketplace exposes task budgets using
          # budget_min_sats / budget_max_sats.
          #
          # We also accept equivalent explicit fields when present.
          # We NEVER invent a budget.
          # ==========================================================

          def budget_bounds(task):
              pairs = (
                  (
                      "budget_min_sats",
                      "budget_max_sats",
                      "budget"
                  ),
                  (
                      "min_budget_sats",
                      "max_budget_sats",
                      "budget"
                  ),
                  (
                      "reward_min_sats",
                      "reward_max_sats",
                      "reward"
                  ),
                  (
                      "min_reward_sats",
                      "max_reward_sats",
                      "reward"
                  ),
                  (
                      "min_bid_sats",
                      "max_bid_sats",
                      "bid"
                  ),
                  (
                      "minimum_bid_sats",
                      "maximum_bid_sats",
                      "bid"
                  )
              )

              for min_key, max_key, source in pairs:
                  lower = as_int(
                      task.get(min_key)
                  )

                  upper = as_int(
                      task.get(max_key)
                  )

                  if lower is not None:
                      if upper is None:
                          upper = lower

                      return (
                          lower,
                          upper,
                          source
                      )

              # Explicit fixed values only.
              for key in (
                  "fixed_reward_sats",
                  "fixed_budget_sats",
                  "fixed_price_sats",
                  "fixed_amount_sats",
                  "reward_sats",
                  "amount_sats",
                  "payment_sats",
                  "price_sats"
              ):
                  value = as_int(
                      task.get(key)
                  )

                  if value is not None:
                      return (
                          value,
                          value,
                          key
                      )

              return (
                  None,
                  None,
                  "unknown"
              )


          def reward(task):
              lower, upper, source = (
                  budget_bounds(task)
              )

              if lower is not None:
                  return lower

              value = task.get(
                  "reward"
              )

              if isinstance(
                  value,
                  dict
              ):
                  for key in (
                      "sats",
                      "amount_sats",
                      "amount",
                      "value",
                      "reward_sats"
                  ):
                      result = as_int(
                          value.get(key)
                      )

                      if result is not None:
                          return result

              return as_int(
                  value
              )


          # ==========================================================
          # DISTINGUER DEMANDE / OFFRE
          #
          # NØX doit candidater sur des demandes de travail,
          # pas acheter automatiquement les services d'autres agents.
          # ==========================================================

          SUPPLY_MARKERS = (
              "for hire",
              "for-hire",
              "available for",
              "available:",
              "my services",
              "our services",
              "services:",
              "service offer",
              "fixed-price service",
              "fixed price service",
              "i deliver",
              "we deliver",
              "i offer",
              "we offer",
              "hire me",
              "hire us",
              "same-day delivery",
              "same session delivery"
          )


          DEMAND_MARKERS = (
              "looking for",
              "need an agent",
              "need agents",
              "seeking agent",
              "seeking agents",
              "wanted",
              "request",
              "build",
              "verify",
              "audit",
              "research",
              "write",
              "develop",
              "create",
              "fix",
              "test",
              "analyze",
              "analyse",
              "deliver",
              "bounty",
              "paid task",
              "task:"
          )


          def classify_opportunity(task):
              text = text_of(
                  task
              ).lower()

              supply_hits = [
                  marker
                  for marker in SUPPLY_MARKERS
                  if marker in text
              ]

              demand_hits = [
                  marker
                  for marker in DEMAND_MARKERS
                  if marker in text
              ]

              if (
                  supply_hits
                  and not demand_hits
              ):
                  return (
                      "supply",
                      supply_hits,
                      demand_hits
                  )

              if (
                  demand_hits
                  and not supply_hits
              ):
                  return (
                      "demand",
                      supply_hits,
                      demand_hits
                  )

              # Explicit marketplace task metadata wins when available.
              for key in (
                  "type",
                  "task_type",
                  "listing_type",
                  "kind",
                  "post_type"
              ):
                  value = task.get(
                      key
                  )

                  if isinstance(
                      value,
                      str
                  ):
                      normalized = (
                          value.lower()
                          .replace("-", "_")
                      )

                      if normalized in (
                          "paid_task",
                          "task",
                          "bounty",
                          "human_request"
                      ):
                          return (
                              "demand",
                              supply_hits,
                              demand_hits
                          )

                      if normalized in (
                          "service",
                          "service_offer",
                          "for_hire",
                          "offer"
                      ):
                          return (
                              "supply",
                              supply_hits,
                              demand_hits
                          )

              return (
                  "unknown",
                  supply_hits,
                  demand_hits
              )


          # ==========================================================
          # SCORE
          # ==========================================================

          def score(
              task,
              core,
              knowledge
          ):
              text = text_of(
                  task
              ).lower()

              strong = (
                  "research",
                  "deep research",
                  "research report",
                  "technical report",
                  "report writing",
                  "write a report",
                  "analysis",
                  "technical",
                  "documentation",
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "python",
                  "automation",
                  "data",
                  "verification",
                  "verify",
                  "receipt",
                  "evidence",
                  "testing",
                  "qa"
              )

              learning = (
                  "learn",
                  "feedback",
                  "test",
                  "testing",
                  "review",
                  "verify",
                  "verification",
                  "experiment",
                  "documentation"
              )

              relation = (
                  "collaboration",
                  "collaborate",
                  "community",
                  "agent",
                  "discussion",
                  "contribution"
              )

              total = 0
              reasons = []

              for term in strong:
                  if term in text:
                      total += 5
                      reasons.append(
                          term
                      )

              for term in learning:
                  if term in text:
                      total += 2
                      reasons.append(
                          f"learning:{term}"
                      )

              for term in relation:
                  if term in text:
                      total += 1
                      reasons.append(
                          f"relation:{term}"
                      )

              task_reward = reward(
                  task
              )

              if task_reward is not None:
                  if task_reward >= 10000:
                      total += 6
                      reasons.append(
                          "high_reward"
                      )

                  elif task_reward >= 1000:
                      total += 4
                      reasons.append(
                          "paid"
                      )

                  elif task_reward >= 1:
                      total += 2
                      reasons.append(
                          "reward_present"
                      )

              context = (
                  json.dumps(
                      core,
                      ensure_ascii=False
                  ).lower()
                  +
                  json.dumps(
                      knowledge,
                      ensure_ascii=False
                  ).lower()
              )

              for term in (
                  "research",
                  "python",
                  "agent",
                  "verification",
                  "report",
                  "tool",
                  "documentation"
              ):
                  if (
                      term in text
                      and term in context
                  ):
                      total += 2
                      reasons.append(
                          f"context:{term}"
                      )

              return (
                  total,
                  list(
                      dict.fromkeys(
                          reasons
                      )
                  )
              )


          # ==========================================================
          # OWN BID DETECTION
          # ==========================================================

          def has_own_bid(
              token,
              task_id_value,
              username
          ):
              payload = request(
                  "GET",
                  f"/marketplace/"
                  f"{urllib.parse.quote(task_id_value, safe='')}"
                  "/bids",
                  token=token
              )

              bids = items(
                  payload,
                  (
                      "bids",
                      "items",
                      "data"
                  )
              )

              for bid in bids:
                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  if (
                      bid.get("is_mine")
                      is True
                      or bid.get("mine")
                      is True
                      or bid.get("is_own")
                      is True
                  ):
                      return True

                  for key in (
                      "username",
                      "bidder",
                      "agent_username"
                  ):
                      value = str(
                          bid.get(
                              key,
                              ""
                          )
                      ).lower()

                      if (
                          value
                          == username.lower()
                      ):
                          return True

              return False


          # ==========================================================
          # MEMORY NORMALIZATION
          # ==========================================================

          def list_memory(value):
              if isinstance(
                  value,
                  list
              ):
                  return value

              if isinstance(
                  value,
                  dict
              ):
                  return list(
                      value.values()
                  )

              return []


          core = load(
              CORE_MEMORY_FILE,
              {}
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          action = load(
              ACTION_MEMORY_FILE,
              {
                  "version": 2,
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": []
              }
          )

          if not isinstance(
              action,
              dict
          ):
              action = {
                  "version": 2,
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": []
              }

          for key in (
              "opportunities",
              "bids",
              "runs",
              "learnings"
          ):
              action[key] = list_memory(
                  action.get(key)
              )


          # ==========================================================
          # AUTH
          # ==========================================================

          token = auth_token()

          try:
              profile = request(
                  "GET",
                  "/users/me",
                  token=token
              )

          except Exception as exc:
              print(
                  f"PROFILE ERROR: {exc}"
              )
              sys.exit(1)

          username = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )


          print(
              "=== NØX ACTION & OPPORTUNITIES ==="
          )

          print(
              f"Profile: {username}"
          )

          print(
              "Policy: €0 / no spending / "
              "no payment / no Gemini / "
              "no external AI"
          )

          print(
              f"Opportunity floor: "
              f"{MIN_OPPORTUNITY} sat"
          )

          print(
              f"Platform bid floor: "
              f"{MIN_PLATFORM_BID} sat"
          )


          # ==========================================================
          # 1. MARKETPLACE DISCOVERY
          # ==========================================================

          payload = request(
              "GET",
              (
                  "/marketplace/tasks"
                  "?status=open"
                  "&sort=new"
                  f"&limit={MAX_TASKS}"
                  "&offset=0"
              ),
              token=token
          )

          tasks = items(
              payload,
              (
                  "tasks",
                  "items",
                  "data"
              )
          )[:MAX_TASKS]

          print(
              f"Marketplace tasks observed: "
              f"{len(tasks)}"
          )


          candidates = []
          supply_count = 0
          unknown_count = 0
          tracked_only_count = 0


          for task in tasks:
              if not isinstance(
                  task,
                  dict
              ):
                  continue

              tid = task_id(
                  task
              )

              if not tid:
                  continue

              listing_type, supply_hits, demand_hits = (
                  classify_opportunity(
                      task
                  )
              )

              if listing_type == "supply":
                  supply_count += 1

                  print(
                      f"SKIP SUPPLY: {tid} -> "
                      f"{title(task)[:100]}"
                  )

                  continue

              if listing_type == "unknown":
                  unknown_count += 1

              task_reward = reward(
                  task
              )

              lower, upper, budget_source = (
                  budget_bounds(
                      task
                  )
              )

              task_score, reasons = score(
                  task,
                  core,
                  knowledge
              )

              if task_score <= 0:
                  continue

              candidates.append(
                  {
                      "task": task,
                      "task_id": tid,
                      "title": title(task),
                      "reward_sats": task_reward,
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": budget_source,
                      "score": task_score,
                      "reasons": reasons,
                      "listing_type": listing_type,
                  }
              )


          candidates.sort(
              key=lambda item: (
                  -item["score"],
                  -(
                      item["reward_sats"]
                      if item["reward_sats"]
                      is not None
                      else 0
                  )
              )
          )


          print(
              f"Relevant demand candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Supply listings skipped: "
              f"{supply_count}"
          )

          print(
              f"Unknown listing types: "
              f"{unknown_count}"
          )


          # ==========================================================
          # 2. TRACK OPPORTUNITIES BEFORE ACTING
          # ==========================================================

          submitted = 0
          skipped = 0
          errors = 0
          bid_checks = 0

          seen_task_ids = set()

          for candidate in candidates:
              tid = candidate[
                  "task_id"
              ]

              if tid in seen_task_ids:
                  continue

              seen_task_ids.add(
                  tid
              )

              lower = candidate[
                  "budget_min_sats"
              ]

              upper = candidate[
                  "budget_max_sats"
              ]

              status = "observed"

              bid_reason = None

              if lower is None:
                  status = "tracked_no_bid"
                  bid_reason = (
                      "no_reliable_budget"
                  )

                  tracked_only_count += 1

              elif lower < MIN_OPPORTUNITY:
                  status = "tracked_no_bid"
                  bid_reason = (
                      "budget_below_opportunity_floor"
                  )

                  tracked_only_count += 1

              elif upper is not None and lower > upper:
                  status = "tracked_no_bid"
                  bid_reason = (
                      "invalid_budget_range"
                  )

                  tracked_only_count += 1

              elif upper is not None and upper < MIN_PLATFORM_BID:
                  status = "tracked_no_bid"
                  bid_reason = (
                      "platform_bid_floor_above_task_budget"
                  )

                  tracked_only_count += 1

              elif lower < MIN_PLATFORM_BID:
                  if upper is not None and upper >= MIN_PLATFORM_BID:
                      status = "bid_possible"
                      bid_reason = (
                          "task_min_below_platform_floor"
                      )

                  else:
                      status = "tracked_no_bid"
                      bid_reason = (
                          "task_budget_below_platform_floor"
                      )

                      tracked_only_count += 1

              else:
                  status = "bid_possible"


              action[
                  "opportunities"
              ].append(
                  {
                      "task_id": tid,
                      "title": candidate[
                          "title"
                      ],
                      "reward_sats": candidate[
                          "reward_sats"
                      ],
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": candidate[
                          "budget_source"
                      ],
                      "score": candidate[
                          "score"
                      ],
                      "reasons": candidate[
                          "reasons"
                      ],
                      "listing_type": candidate[
                          "listing_type"
                      ],
                      "status": status,
                      "bid_reason": bid_reason,
                      "tip_potential": True,
                      "observed_at": now()
                  }
              )


          # ==========================================================
          # 3. BID ACTION
          # ==========================================================

          for candidate in candidates:
              if submitted >= MAX_BIDS:
                  break

              tid = candidate[
                  "task_id"
              ]

              lower = candidate[
                  "budget_min_sats"
              ]

              upper = candidate[
                  "budget_max_sats"
              ]

              if lower is None:
                  continue

              if lower < MIN_OPPORTUNITY:
                  continue

              if (
                  upper is not None
                  and lower > upper
              ):
                  continue

              if (
                  upper is not None
                  and upper < MIN_PLATFORM_BID
              ):
                  continue

              # A bid must satisfy The Colony's minimum.
              # If the task minimum is below that floor, use the
              # platform minimum only when the task maximum permits it.
              amount = max(
                  lower,
                  MIN_PLATFORM_BID
              )

              if (
                  upper is not None
                  and amount > upper
              ):
                  continue

              if bid_checks >= MAX_BID_CHECKS:
                  print(
                      "BID CHECK LIMIT reached."
                  )
                  break

              bid_checks += 1

              try:
                  if has_own_bid(
                      token,
                      tid,
                      username
                  ):
                      print(
                          f"BID SKIP: already submitted "
                          f"-> {tid}"
                      )

                      skipped += 1
                      continue

              except Exception as exc:
                  print(
                      f"BID CHECK ERROR: "
                      f"{tid}: {exc}"
                  )

                  skipped += 1
                  continue


              description = (
                  "NØX can contribute to this task "
                  "with an evidence-first, "
                  "reproducible workflow. "
                  "Relevant signals: "
                  +
                  ", ".join(
                      candidate[
                          "reasons"
                      ][:6]
                  )
                  +
                  ". Delivery will preserve "
                  "observable evidence and clearly "
                  "separate verified results from "
                  "uncertainty."
              )


              print(
                  f"BID ATTEMPT: {tid} "
                  f"amount={amount} sat "
                  f"budget={lower}-{upper}"
              )


              try:
                  result = request(
                      "POST",
                      f"/marketplace/"
                      f"{urllib.parse.quote(tid, safe='')}"
                      "/bid",
                      token=token,
                      body={
                          "amount_sats": amount,
                          "description": description
                      }
                  )

                  submitted += 1

                  bid_record = {
                      "task_id": tid,
                      "amount_sats": amount,
                      "status": "submitted",
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": candidate[
                          "budget_source"
                      ],
                      "submitted_at": now()
                  }

                  if isinstance(
                      result,
                      dict
                  ):
                      for key in (
                          "id",
                          "bid_id"
                      ):
                          if result.get(key):
                              bid_record[
                                  "bid_id"
                              ] = str(
                                  result[key]
                              )
                              break

                  action[
                      "bids"
                  ].append(
                      bid_record
                  )

                  action[
                      "opportunities"
                  ].append(
                      {
                          "task_id": tid,
                          "title": candidate[
                              "title"
                          ],
                          "score": candidate[
                              "score"
                          ],
                          "status": (
                              "bid_submitted"
                          ),
                          "bid_sats": amount,
                          "submitted_at": now()
                      }
                  )

                  print(
                      f"BID SUCCESS: {tid} "
                      f"amount={amount} sat"
                  )

              except Exception as exc:
                  errors += 1

                  print(
                      f"BID ERROR: {tid}: "
                      f"{exc}"
                  )

                  action[
                      "bids"
                  ].append(
                      {
                          "task_id": tid,
                          "amount_sats": amount,
                          "status": "error",
                          "error": str(exc),
                          "observed_at": now()
                      }
                  )


          # ==========================================================
          # 4. RECONCILE RECENT BIDS
          #
          # L'action ne s'arrête pas au POST du bid.
          # NØX observe ensuite ce que devient son action.
          # ==========================================================

          recent_bids = action[
              "bids"
          ][-MAX_BID_CHECKS:]

          reconciled = 0

          for bid in recent_bids:
              tid = str(
                  bid.get(
                      "task_id",
                      ""
                  )
              )

              if not tid:
                  continue

              if bid.get(
                  "status"
              ) == "error":
                  continue

              try:
                  bid_payload = request(
                      "GET",
                      f"/marketplace/"
                      f"{urllib.parse.quote(tid, safe='')}"
                      "/bids",
                      token=token
                  )

                  bids = items(
                      bid_payload,
                      (
                          "bids",
                          "items",
                          "data"
                      )
                  )

                  own_bid = None

                  for remote_bid in bids:
                      if not isinstance(
                          remote_bid,
                          dict
                      ):
                          continue

                      mine = (
                          remote_bid.get(
                              "is_mine"
                          )
                          is True
                          or remote_bid.get(
                              "mine"
                          )
                          is True
                          or str(
                              remote_bid.get(
                                  "username",
                                  ""
                              )
                          ).lower()
                          == username.lower()
                          or str(
                              remote_bid.get(
                                  "bidder",
                                  ""
                              )
                          ).lower()
                          == username.lower()
                      )

                      if mine:
                          own_bid = remote_bid
                          break

                  if own_bid:
                      remote_status = (
                          own_bid.get(
                              "status"
                          )
                          or own_bid.get(
                              "state"
                          )
                      )

                      if remote_status:
                          bid[
                              "latest_status"
                          ] = str(
                              remote_status
                          )

                      bid[
                          "last_checked"
                      ] = now()

                      reconciled += 1

              except Exception as exc:
                  print(
                      f"RECONCILE ERROR "
                      f"{tid}: {exc}"
                  )


          # ==========================================================
          # 5. LEARNING SIGNAL
          # ==========================================================

          if submitted > 0:
              action[
                  "learnings"
              ].append(
                  {
                      "timestamp": now(),
                      "summary": (
                          "NØX a transformé des "
                          "opportunités marketplace "
                          "compatibles en actions "
                          "traçables."
                      ),
                      "bids_submitted": submitted,
                      "reconciled": reconciled
                  }
              )

          elif len(candidates) > 0:
              action[
                  "learnings"
              ].append(
                  {
                      "timestamp": now(),
                      "summary": (
                          "Des opportunités marketplace "
                          "ont été observées mais aucune "
                          "action n'a été déclenchée. "
                          "Les contraintes empêchant "
                          "l'action ont été conservées."
                      ),
                      "candidates": len(
                          candidates
                      ),
                      "tracked_only": tracked_only_count
                  }
              )

          else:
              action[
                  "learnings"
              ].append(
                  {
                      "timestamp": now(),
                      "summary": (
                          "Aucune opportunité marketplace "
                          "pertinente détectée durant ce run."
                      )
                  }
              )


          # ==========================================================
          # 6. RUN LEDGER
          # ==========================================================

          action[
              "runs"
          ].append(
              {
                  "run_at": now(),
                  "tasks_observed": len(
                      tasks
                  ),
                  "candidates": len(
                      candidates
                  ),
                  "supply_skipped": supply_count,
                  "unknown_listing_types": (
                      unknown_count
                  ),
                  "bids_submitted": submitted,
                  "bids_skipped": skipped,
                  "bid_errors": errors,
                  "reconciled_bids": reconciled,
                  "tracked_only": (
                      tracked_only_count
                  ),
                  "policy": {
                      "project_cost_eur": 0,
                      "gemini_used": False,
                      "external_ai_used": False,
                      "auto_payment": False,
                      "auto_spending": False
                  }
              }
          )


          # ==========================================================
          # 7. RETENTION
          # ==========================================================

          action[
              "opportunities"
          ] = action[
              "opportunities"
          ][-MAX_TRACKED:]

          action[
              "bids"
          ] = action[
              "bids"
          ][-MAX_TRACKED:]

          action[
              "runs"
          ] = action[
              "runs"
          ][-100:]

          action[
              "learnings"
          ] = action[
              "learnings"
          ][-100:]

          action[
              "version"
          ] = 2

          action[
              "last_run"
          ] = now()


          # ==========================================================
          # 8. PERSISTENCE
          # ==========================================================

          save(
              ACTION_MEMORY_FILE,
              action
          )


          # ==========================================================
          # SYNTHÈSE
          # ==========================================================

          print("")
          print(
              "=== NØX ACTION / OPPORTUNITIES SUMMARY ==="
          )

          print(
              f"Tasks observed: "
              f"{len(tasks)}"
          )

          print(
              f"Demand candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Supply skipped: "
              f"{supply_count}"
          )

          print(
              f"Bids submitted: "
              f"{submitted}"
          )

          print(
              f"Bids skipped: "
              f"{skipped}"
          )

          print(
              f"Bid errors: "
              f"{errors}"
          )

          print(
              f"Bids reconciled: "
              f"{reconciled}"
          )

          print(
              f"Tracked without bid: "
              f"{tracked_only_count}"
          )

          print(
              "No automatic payment or spending performed."
          )

          print(
              "No Gemini or external AI used."
          )

          print(
              "=== NØX ACTION / OPPORTUNITIES TERMINÉ ==="
          )
          PY

      - name: Commit action memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

          git add memory/nox_action_opportunities.json

          if git diff --cached --quiet; then
            echo "No action-memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update action and opportunities memory"
          git push
