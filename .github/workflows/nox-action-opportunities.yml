name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "20"
  MAX_BIDS_PER_RUN: "2"
  MAX_TRACKED_ITEMS: "250"

  # 1 sat reste le seuil conceptuel pour considérer
  # une opportunité.
  #
  # IMPORTANT:
  # ce seuil n'est jamais utilisé aveuglément comme montant
  # de bid envoyé à l'API.
  MIN_OPPORTUNITY_SATS: "1"

  REQUEST_TIMEOUT_SECONDS: "15"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_TOKEN: ${{ secrets.COLONY_API_TOKEN }}
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(
              os.environ.get(
                  "CORE_MEMORY_FILE",
                  "memory/nox_core_memory.json"
              )
          )

          CORE_RUNTIME_FILE = Path(
              os.environ.get(
                  "CORE_RUNTIME_FILE",
                  "memory/nox_core_runtime.json"
              )
          )

          KNOWLEDGE_FILE = Path(
              os.environ.get(
                  "KNOWLEDGE_FILE",
                  "memory/nox_knowledge.json"
              )
          )

          ACTION_MEMORY_FILE = Path(
              os.environ.get(
                  "ACTION_MEMORY_FILE",
                  "memory/nox_action_opportunities.json"
              )
          )

          MAX_TASKS_PER_RUN = int(
              os.environ.get("MAX_TASKS_PER_RUN", "20")
          )

          MAX_BIDS_PER_RUN = int(
              os.environ.get("MAX_BIDS_PER_RUN", "2")
          )

          MAX_TRACKED_ITEMS = int(
              os.environ.get("MAX_TRACKED_ITEMS", "250")
          )

          MIN_OPPORTUNITY_SATS = int(
              os.environ.get("MIN_OPPORTUNITY_SATS", "1")
          )

          REQUEST_TIMEOUT = int(
              os.environ.get("REQUEST_TIMEOUT_SECONDS", "15")
          )


          def utc_now():
              return datetime.now(timezone.utc).isoformat()


          def load_json(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open("r", encoding="utf-8") as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return default


          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temp.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      value,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )
                  handle.write("\n")

              temp.replace(path)


          def request(
              method,
              path,
              token=None,
              body=None
          ):
              url = API_BASE + path

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Colony-Agent/1.0"
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              data = None

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = (
                      "application/json"
                  )

              request_object = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request_object,
                      timeout=REQUEST_TIMEOUT
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)
                      except json.JSONDecodeError:
                          return {"raw": raw}

              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"raw": raw}

                  detail = payload.get(
                      "detail",
                      payload
                  )

                  raise RuntimeError(
                      f"{method} {path} -> HTTP "
                      f"{exc.code}: "
                      f"{json.dumps(detail, ensure_ascii=False)}"
                  )

              except Exception as exc:
                  raise RuntimeError(
                      f"{method} {path} -> {exc}"
                  )


          def exchange_api_key_for_jwt(api_key):
              """
              The Colony authentication flow:

              raw col_ API key
                  ->
              POST /auth/token
                  ->
              access_token JWT
                  ->
              Authorization: Bearer <JWT>
              """

              payload = request(
                  "POST",
                  "/auth/token",
                  body={
                      "api_key": api_key
                  }
              )

              access_token = payload.get(
                  "access_token"
              )

              if not access_token:
                  raise RuntimeError(
                      "POST /auth/token succeeded but "
                      "no access_token was returned."
                  )

              return access_token


          def get_access_token():
              """
              Supports both:
              - COLONY_API_KEY containing col_...
              - COLONY_API_TOKEN containing either
                col_... or an already-issued JWT.

              A raw API key is NEVER sent as Bearer.
              """

              api_key = os.environ.get(
                  "COLONY_API_KEY",
                  ""
              ).strip()

              token_value = os.environ.get(
                  "COLONY_API_TOKEN",
                  ""
              ).strip()

              credential = api_key or token_value

              if not credential:
                  raise RuntimeError(
                      "No COLONY_API_KEY or "
                      "COLONY_API_TOKEN secret found."
                  )

              if credential.startswith("col_"):
                  print(
                      "AUTH: API key detected; "
                      "exchanging for JWT."
                  )

                  return exchange_api_key_for_jwt(
                      credential
                  )

              print(
                  "AUTH: bearer token detected; "
                  "using it directly."
              )

              return credential


          def extract_items(payload, keys):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in keys:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              for value in payload.values():
                  if isinstance(value, list):
                      return value

              return []


          def as_int(value):
              if value is None:
                  return None

              if isinstance(value, bool):
                  return None

              if isinstance(value, int):
                  return value if value >= 0 else None

              if isinstance(value, float):
                  return int(value) if value >= 0 else None

              if isinstance(value, str):
                  text = value.strip()
                  text = text.replace(",", "")
                  text = text.replace(" ", "")

                  match = re.search(
                      r"(\d+(?:\.\d+)?)",
                      text
                  )

                  if not match:
                      return None

                  try:
                      number = float(
                          match.group(1)
                      )

                      if number < 0:
                          return None

                      return int(number)

                  except Exception:
                      return None

              return None


          def extract_task_id(task):
              for key in (
                  "id",
                  "task_id",
                  "uuid"
              ):
                  value = task.get(key)

                  if value:
                      return str(value)

              return None


          def task_title(task):
              for key in (
                  "title",
                  "name",
                  "task_title",
                  "description"
              ):
                  value = task.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      return value.strip()

              return "Untitled task"


          def extract_reward_sats(task):
              direct_keys = (
                  "reward_sats",
                  "reward_amount_sats",
                  "amount_sats",
                  "payment_sats",
                  "price_sats",
                  "budget_sats",
                  "max_reward_sats"
              )

              for key in direct_keys:
                  value = as_int(
                      task.get(key)
                  )

                  if value is not None:
                      return value

              reward = task.get("reward")

              if isinstance(reward, dict):
                  for key in (
                      "sats",
                      "amount",
                      "amount_sats",
                      "value",
                      "reward_sats"
                  ):
                      value = as_int(
                          reward.get(key)
                      )

                      if value is not None:
                          return value

              if isinstance(reward, str):
                  return as_int(reward)

              if isinstance(reward, int):
                  return reward

              return None


          def normalize_key(key):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(key).lower()
              )


          def find_bid_minimum(obj):
              """
              Search only for explicitly named minimum
              bid/price/amount fields.

              There is intentionally NO fallback to 1 sat.
              """

              candidates = []

              def walk(value, path=""):
                  if isinstance(value, dict):

                      for key, child in value.items():
                          normalized = normalize_key(
                              key
                          )

                          current_path = (
                              f"{path}.{key}"
                              if path
                              else str(key)
                          )

                          if (
                              "min" in normalized
                              and (
                                  "bid" in normalized
                                  or "price" in normalized
                                  or "amount" in normalized
                              )
                          ):
                              number = as_int(child)

                              if number is not None:
                                  candidates.append(
                                      (
                                          number,
                                          current_path
                                      )
                                  )

                          walk(
                              child,
                              current_path
                          )

                  elif isinstance(value, list):

                      for index, child in enumerate(
                          value
                      ):
                          walk(
                              child,
                              f"{path}[{index}]"
                          )

              walk(obj)

              valid = [
                  item
                  for item in candidates
                  if item[0] >= MIN_OPPORTUNITY_SATS
              ]

              if not valid:
                  return None

              valid.sort(
                  key=lambda item: len(item[1])
              )

              return valid[0]


          def find_bid_maximum(obj):
              candidates = []

              def walk(value, path=""):
                  if isinstance(value, dict):

                      for key, child in value.items():
                          normalized = normalize_key(
                              key
                          )

                          current_path = (
                              f"{path}.{key}"
                              if path
                              else str(key)
                          )

                          if (
                              "max" in normalized
                              and (
                                  "bid" in normalized
                                  or "price" in normalized
                                  or "amount" in normalized
                              )
                          ):
                              number = as_int(child)

                              if number is not None:
                                  candidates.append(
                                      (
                                          number,
                                          current_path
                                      )
                                  )

                          walk(
                              child,
                              current_path
                          )

                  elif isinstance(value, list):

                      for index, child in enumerate(
                          value
                      ):
                          walk(
                              child,
                              f"{path}[{index}]"
                          )

              walk(obj)

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda item: len(item[1])
              )

              return candidates[0]


          def opportunity_score(
              task,
              core,
              knowledge
          ):
              text_parts = [
                  task_title(task).lower()
              ]

              for key in (
                  "description",
                  "details",
                  "requirements",
                  "skills",
                  "category",
                  "tags"
              ):
                  value = task.get(key)

                  if isinstance(value, str):
                      text_parts.append(
                          value.lower()
                      )

                  elif isinstance(value, list):
                      text_parts.extend(
                          str(item).lower()
                          for item in value
                      )

              text = " ".join(text_parts)

              score = 0
              reasons = []

              strong_terms = (
                  "research",
                  "research report",
                  "deep research",
                  "technical report",
                  "report writing",
                  "write a report",
                  "analysis",
                  "technical",
                  "documentation",
                  "agent",
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "python",
                  "automation",
                  "data",
                  "verification",
                  "verify",
                  "receipt",
                  "evidence",
                  "testing"
              )

              learning_terms = (
                  "learn",
                  "feedback",
                  "test",
                  "testing",
                  "review",
                  "verify",
                  "verification",
                  "experiment",
                  "documentation"
              )

              relation_terms = (
                  "collaboration",
                  "collaborate",
                  "community",
                  "agent",
                  "discussion",
                  "contribution"
              )

              for term in strong_terms:
                  if term in text:
                      score += 5
                      reasons.append(term)

              for term in learning_terms:
                  if term in text:
                      score += 2
                      reasons.append(
                          f"learning:{term}"
                      )

              for term in relation_terms:
                  if term in text:
                      score += 1
                      reasons.append(
                          f"relation:{term}"
                      )

              reward = extract_reward_sats(task)

              if reward is not None:

                  if reward >= 10000:
                      score += 6
                      reasons.append(
                          "high_reward"
                      )

                  elif reward >= 1000:
                      score += 4
                      reasons.append(
                          "paid"
                      )

                  elif reward >= 1:
                      score += 2
                      reasons.append(
                          "reward_present"
                      )

                  else:
                      reasons.append(
                          "zero_reward_possible_tip"
                      )

              core_text = json.dumps(
                  core,
                  ensure_ascii=False
              ).lower()

              knowledge_text = json.dumps(
                  knowledge,
                  ensure_ascii=False
              ).lower()

              context_terms = (
                  "research",
                  "python",
                  "agent",
                  "verification",
                  "report",
                  "tool",
                  "documentation"
              )

              for term in context_terms:
                  if (
                      term in text
                      and (
                          term in core_text
                          or term in knowledge_text
                      )
                  ):
                      score += 2
                      reasons.append(
                          f"context:{term}"
                      )

              return (
                  score,
                  list(
                      dict.fromkeys(reasons)
                  )
              )


          def task_already_tracked(
              memory,
              task_id
          ):
              for item in memory.get(
                  "opportunities",
                  []
              ):
                  if (
                      item.get("task_id")
                      == task_id
                  ):
                      return item

              return None


          def task_has_existing_bid(
              token,
              task_id
          ):
              try:
                  payload = request(
                      "GET",
                      f"/marketplace/{task_id}/bids",
                      token=token
                  )

                  bids = extract_items(
                      payload,
                      (
                          "bids",
                          "items",
                          "data"
                      )
                  )

                  for bid in bids:

                      if not isinstance(
                          bid,
                          dict
                      ):
                          continue

                      if (
                          bid.get("is_mine")
                          is True
                          or bid.get("mine")
                          is True
                          or bid.get("is_own")
                          is True
                      ):
                          return True

                      username = str(
                          bid.get(
                              "username",
                              ""
                          )
                      ).lower()

                      bidder = str(
                          bid.get(
                              "bidder",
                              ""
                          )
                      ).lower()

                      if (
                          username
                          == "nox_origine"
                          or bidder
                          == "nox_origine"
                      ):
                          return True

                  return False

              except Exception as exc:
                  print(
                      f"BID CHECK WARNING: "
                      f"{task_id}: {exc}"
                  )

                  return False


          def choose_bid_amount(task):
              """
              Determine a technically valid bid without
              inventing a platform minimum.

              A 1-sat opportunity is still kept and tracked.
              """

              minimum = find_bid_minimum(task)
              maximum = find_bid_maximum(task)
              reward = extract_reward_sats(task)

              if minimum is None:
                  return (
                      None,
                      "no_explicit_minimum_bid_found"
                  )

              bid = minimum

              if maximum is not None:
                  if bid > maximum:
                      return (
                          None,
                          "minimum_above_maximum"
                      )

              if bid < MIN_OPPORTUNITY_SATS:
                  return (
                      None,
                      "minimum_below_opportunity_floor"
                  )

              if (
                  reward is not None
                  and reward > 0
                  and bid > reward
              ):
                  return (
                      None,
                      "minimum_bid_above_reward"
                  )

              return (
                  bid,
                  f"explicit_minimum:{minimum}"
              )


          def build_bid_description(
              candidate
          ):
              reasons = ", ".join(
                  candidate["reasons"][:5]
              )

              return (
                  "NØX can contribute deterministically "
                  "to this task. "
                  f"Relevant signals: "
                  f"{reasons or 'task relevance'}. "
                  "I can provide evidence-based work "
                  "and keep the result traceable."
              )


          def submit_bid(
              token,
              task_id,
              amount,
              description
          ):
              return request(
                  "POST",
                  f"/marketplace/{task_id}/bid",
                  token=token,
                  body={
                      "amount_sats": amount,
                      "description": description
                  }
              )


          def payment_status(
              token,
              task_id
          ):
              try:
                  return request(
                      "GET",
                      f"/marketplace/{task_id}/payment",
                      token=token
                  )

              except Exception as exc:
                  return {
                      "error": str(exc)
                  }


          # =========================================================
          # MEMORY
          # =========================================================

          core = load_json(
              CORE_MEMORY_FILE,
              {
                  "version": 1,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }
          )

          runtime = load_json(
              CORE_RUNTIME_FILE,
              {
                  "version": 1,
                  "commented_post_ids": [],
                  "seen_notification_ids": [],
                  "auto_reply_counts": {},
                  "skill_attempt_counts": {},
                  "skill_success_counts": {},
                  "task_skills": {},
                  "web_queries": [],
                  "run_count": 0
              }
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {
                  "version": 1,
                  "facts": [],
                  "experiences": [],
                  "learnings": [],
                  "sources": []
              }
          )

          action_memory = load_json(
              ACTION_MEMORY_FILE,
              {
                  "version": 1,
                  "opportunities": [],
                  "bids": [],
                  "runs": []
              }
          )

          if not isinstance(
              action_memory,
              dict
          ):
              action_memory = {
                  "version": 1,
                  "opportunities": [],
                  "bids": [],
                  "runs": []
              }

          action_memory.setdefault(
              "opportunities",
              []
          )

          action_memory.setdefault(
              "bids",
              []
          )

          action_memory.setdefault(
              "runs",
              []
          )


          # =========================================================
          # AUTHENTICATION
          # =========================================================

          try:
              token = get_access_token()

          except Exception as exc:
              print(
                  f"AUTH ERROR: {exc}"
              )
              sys.exit(1)


          # =========================================================
          # PROFILE
          # =========================================================

          try:
              profile = request(
                  "GET",
                  "/users/me",
                  token=token
              )

          except Exception as exc:
              print(
                  f"PROFILE ERROR: {exc}"
              )
              sys.exit(1)

          username = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )

          print(
              "=== NØX ACTION & OPPORTUNITIES ==="
          )

          print(
              f"Profile: {username}"
          )

          print(
              "Policy: €0 / no spending / "
              "no payment / no Gemini / "
              "no external AI"
          )

          print(
              f"Opportunity floor: "
              f"{MIN_OPPORTUNITY_SATS} sat"
          )

          print(
              "Bid floor: determined from task data; "
              "no arbitrary fallback"
          )


          # =========================================================
          # MARKETPLACE
          # =========================================================

          try:
              payload = request(
                  "GET",
                  (
                      "/marketplace/tasks"
                      f"?limit={MAX_TASKS_PER_RUN}"
                  ),
                  token=token
              )

          except Exception as exc:
              print(
                  f"TASK FETCH ERROR: {exc}"
              )
              sys.exit(1)

          tasks = extract_items(
              payload,
              (
                  "tasks",
                  "items",
                  "data"
              )
          )

          tasks = tasks[:MAX_TASKS_PER_RUN]

          print(
              f"Marketplace tasks observed: "
              f"{len(tasks)}"
          )


          # =========================================================
          # EVALUATE
          # =========================================================

          candidates = []

          for task in tasks:

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              task_id = extract_task_id(
                  task
              )

              if not task_id:
                  continue

              reward = extract_reward_sats(
                  task
              )

              if (
                  reward is not None
                  and reward < MIN_OPPORTUNITY_SATS
              ):
                  print(
                      f"OPPORTUNITY LOW VALUE: "
                      f"{task_id} reward={reward} sat; "
                      "kept for learning/tip potential"
                  )

              score, reasons = opportunity_score(
                  task,
                  core,
                  knowledge
              )

              if score <= 0:
                  continue

              candidates.append(
                  {
                      "task": task,
                      "task_id": task_id,
                      "title": task_title(task),
                      "reward_sats": reward,
                      "score": score,
                      "reasons": reasons
                  }
              )

          candidates.sort(
              key=lambda item: (
                  -item["score"],
                  -(
                      item["reward_sats"]
                      if item["reward_sats"]
                      is not None
                      else 0
                  )
              )
          )

          print(
              f"Relevant candidates: "
              f"{len(candidates)}"
          )


          # =========================================================
          # BIDS
          # =========================================================

          bids_submitted = 0
          bids_skipped = 0
          bid_errors = 0

          for candidate in candidates:

              if (
                  bids_submitted
                  >= MAX_BIDS_PER_RUN
              ):
                  break

              task = candidate["task"]
              task_id = candidate["task_id"]

              if task_has_existing_bid(
                  token,
                  task_id
              ):
                  print(
                      f"BID SKIP: already submitted "
                      f"-> {task_id}"
                  )

                  bids_skipped += 1
                  continue

              amount, amount_reason = (
                  choose_bid_amount(task)
              )

              if amount is None:

                  print(
                      f"BID SKIP: {task_id} -> "
                      f"{amount_reason}; "
                      "opportunity remains tracked"
                  )

                  bids_skipped += 1

                  existing = (
                      task_already_tracked(
                          action_memory,
                          task_id
                      )
                  )

                  if existing is None:
                      action_memory[
                          "opportunities"
                      ].append(
                          {
                              "task_id": task_id,
                              "title": candidate[
                                  "title"
                              ],
                              "reward_sats": candidate[
                                  "reward_sats"
                              ],
                              "score": candidate[
                                  "score"
                              ],
                              "reasons": candidate[
                                  "reasons"
                              ],
                              "status": (
                                  "tracked_no_bid"
                              ),
                              "bid_reason": (
                                  amount_reason
                              ),
                              "tip_potential": True,
                              "observed_at": utc_now()
                          }
                      )

                  continue

              description = (
                  build_bid_description(
                      candidate
                  )
              )

              print(
                  f"BID ATTEMPT: {task_id} "
                  f"amount={amount} sat "
                  f"reason={amount_reason}"
              )

              try:

                  submit_bid(
                      token,
                      task_id,
                      amount,
                      description
                  )

                  print(
                      f"BID SUCCESS: {task_id} "
                      f"amount={amount} sat"
                  )

                  bids_submitted += 1

                  action_memory[
                      "bids"
                  ].append(
                      {
                          "task_id": task_id,
                          "amount_sats": amount,
                          "status": "submitted",
                          "submitted_at": utc_now()
                      }
                  )

                  action_memory[
                      "opportunities"
                  ].append(
                      {
                          "task_id": task_id,
                          "title": candidate[
                              "title"
                          ],
                          "reward_sats": candidate[
                              "reward_sats"
                          ],
                          "score": candidate[
                              "score"
                          ],
                          "reasons": candidate[
                              "reasons"
                          ],
                          "status": (
                              "bid_submitted"
                          ),
                          "bid_sats": amount,
                          "tip_potential": True,
                          "submitted_at": utc_now()
                      }
                  )

              except Exception as exc:

                  error_text = str(exc)

                  print(
                      f"BID ERROR: {task_id}: "
                      f"{error_text}"
                  )

                  bid_errors += 1

                  action_memory[
                      "bids"
                  ].append(
                      {
                          "task_id": task_id,
                          "amount_sats": amount,
                          "status": "error",
                          "error": error_text,
                          "observed_at": utc_now()
                      }
                  )

                  action_memory[
                      "opportunities"
                  ].append(
                      {
                          "task_id": task_id,
                          "title": candidate[
                              "title"
                          ],
                          "reward_sats": candidate[
                              "reward_sats"
                          ],
                          "score": candidate[
                              "score"
                          ],
                          "reasons": candidate[
                              "reasons"
                          ],
                          "status": "bid_error",
                          "bid_sats": amount,
                          "tip_potential": True,
                          "error": error_text,
                          "observed_at": utc_now()
                      }
                  )


          # =========================================================
          # PAYMENT OBSERVATION
          # =========================================================

          for item in action_memory[
              "bids"
          ][-20:]:

              task_id = item.get(
                  "task_id"
              )

              if not task_id:
                  continue

              item[
                  "payment_observation"
              ] = payment_status(
                  token,
                  task_id
              )

              item[
                  "payment_checked_at"
              ] = utc_now()


          # =========================================================
          # MEMORY LIMITS
          # =========================================================

          action_memory[
              "opportunities"
          ] = action_memory[
              "opportunities"
          ][-MAX_TRACKED_ITEMS:]

          action_memory[
              "bids"
          ] = action_memory[
              "bids"
          ][-MAX_TRACKED_ITEMS:]

          action_memory[
              "runs"
          ].append(
              {
                  "run_at": utc_now(),
                  "tasks_observed": len(
                      tasks
                  ),
                  "candidates": len(
                      candidates
                  ),
                  "bids_submitted": (
                      bids_submitted
                  ),
                  "bids_skipped": (
                      bids_skipped
                  ),
                  "bid_errors": (
                      bid_errors
                  ),
                  "policy": {
                      "project_cost_eur": 0,
                      "gemini_used": False,
                      "external_ai_used": False,
                      "auto_payment": False,
                      "auto_spending": False
                  }
              }
          )

          action_memory[
              "runs"
          ] = action_memory[
              "runs"
          ][-100:]

          action_memory["version"] = 1

          save_json(
              ACTION_MEMORY_FILE,
              action_memory
          )


          # =========================================================
          # SUMMARY
          # =========================================================

          print("")
          print(
              "=== NØX ACTION / OPPORTUNITIES SUMMARY ==="
          )

          print(
              f"Tasks observed: {len(tasks)}"
          )

          print(
              f"Relevant candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Bids submitted: "
              f"{bids_submitted}"
          )

          print(
              f"Bids skipped: "
              f"{bids_skipped}"
          )

          print(
              f"Bid errors: "
              f"{bid_errors}"
          )

          print(
              "Low-value opportunities remain "
              "trackable for learning/tip potential."
          )

          print(
              "No automatic payment or spending performed."
          )

          print("")
          print(
              "=== NØX ACTION / OPPORTUNITIES TERMINÉ ==="
          )
          PY

      - name: Commit action memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

          git add memory/nox_action_opportunities.json

          if git diff --cached --quiet; then
            echo "No action-memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update action and opportunities memory"
          git push
