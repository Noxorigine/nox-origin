name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"
  MAX_CORE_ACTIONS: "50"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "15"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0" requests

      - name: Verify Colony SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          from colony_sdk import ColonyClient

          required = (
              "bootstrap",
              "get_me",
          )

          missing = [
              name for name in required
              if not hasattr(ColonyClient, name)
          ]

          if missing:
              raise RuntimeError(
                  "Colony SDK is missing required methods: "
                  + ", ".join(missing)
              )

          print("Colony SDK import: OK")
          print("Required SDK methods: OK")
          print("ColonyClient.bootstrap:", inspect.signature(ColonyClient.bootstrap))
          print("ColonyClient.get_me:", inspect.signature(ColonyClient.get_me))
          PY

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient


          # ============================================================
          # NØX ACTION & OPPORTUNITIES
          #
          # Execution layer of the Core.
          #
          # Core:
          #   Research -> Understand -> Recall -> Reflect -> Choose
          #   -> Act -> Observe -> Learn -> Adapt
          #
          # This workflow:
          #   1. observes marketplace opportunities;
          #   2. reconstructs relevant context;
          #   3. checks Core decisions/actions;
          #   4. never bypasses an explicit Core decision;
          #   5. reconciles existing bids before acting;
          #   6. submits a bid only when the Core has authorized
          #      an Action / Opportunities execution;
          #   7. records expected and actual outcomes;
          #   8. preserves uncertainty instead of inventing certainty.
          #
          # Policy:
          #   Gemini       = disabled
          #   External AI  = disabled
          #   Spending     = disabled
          #   Payments     = disabled
          #   Project cost = €0
          #
          # Marketplace API operations are deterministic HTTP calls
          # because the currently verified SDK surface does not expose
          # marketplace bid operations. SDK is still used for Colony
          # bootstrap / identity verification.
          # ============================================================


          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          ACTION_MEMORY_FILE = Path(os.environ["ACTION_MEMORY_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_BID_CHECKS = int(os.environ["MAX_BID_CHECKS_PER_RUN"])
          MAX_TRACKED = int(os.environ["MAX_TRACKED_ITEMS"])
          MAX_CORE_ACTIONS = int(os.environ["MAX_CORE_ACTIONS"])

          MIN_OPPORTUNITY = int(os.environ["MIN_OPPORTUNITY_SATS"])
          MIN_PLATFORM_BID = int(os.environ["MIN_PLATFORM_BID_SATS"])
          TIMEOUT = int(os.environ["REQUEST_TIMEOUT_SECONDS"])

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing.")


          # ============================================================
          # BASIC UTILITIES
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  if isinstance(value, dict):
                      return value

                  return default

              except Exception as exc:
                  print(
                      f"WARNING: failed to load {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              temporary.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              temporary.replace(path)


          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float)):
                  return str(value)

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  return str(value)


          def clean_text(value, limit=2000):
              return re.sub(
                  r"\s+",
                  " ",
                  text_value(value).strip()
              )[:limit]


          def normalize(value):
              return clean_text(
                  value,
                  2000
              ).lower()


          def stable_id(kind, value):
              raw = (
                  f"{kind}|"
                  f"{clean_text(value, 20000).lower()}"
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:16]


          def recursive_values(obj, path=""):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current = (
                          f"{path}.{key}"
                          if path
                          else str(key)
                      )

                      yield current, str(key), value

                      yield from recursive_values(
                          value,
                          current
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      current = (
                          f"{path}[{index}]"
                      )

                      yield current, str(index), value

                      yield from recursive_values(
                          value,
                          current
                      )


          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Action-Opportunities/4.0",
          })


          def http_json(
              method,
              path,
              token,
              payload=None,
              params=None
          ):
              url = (
                  path
                  if path.startswith("http")
                  else f"{API_BASE}{path}"
              )

              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "NOX-Action-Opportunities/4.0",
                  "Authorization": f"Bearer {token}",
              }

              try:
                  response = session.request(
                      method,
                      url,
                      headers=headers,
                      json=payload,
                      params=params,
                      timeout=TIMEOUT
                  )

              except requests.RequestException as exc:
                  raise RuntimeError(
                      f"{method} {url}: network error: {exc}"
                  )

              if response.status_code >= 400:
                  try:
                      detail = response.json()
                  except Exception:
                      detail = response.text[:2000]

                  raise RuntimeError(
                      f"{method} {url} -> "
                      f"HTTP {response.status_code}: {detail}"
                  )

              if not response.content:
                  return {}

              try:
                  return response.json()
              except Exception:
                  return {
                      "raw": response.text[:5000]
                  }


          # ============================================================
          # LOAD SHARED COGNITIVE STATE
          # ============================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          action_memory = load_json(
              ACTION_MEMORY_FILE,
              {
                  "version": 5,
                  "created_at": now_iso(),
                  "updated_at": now_iso(),
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": [],
              }
          )

          if not isinstance(action_memory, dict):
              action_memory = {}

          action_memory.setdefault(
              "version",
              5
          )

          action_memory.setdefault(
              "created_at",
              now_iso()
          )

          action_memory.setdefault(
              "opportunities",
              []
          )

          action_memory.setdefault(
              "bids",
              []
          )

          action_memory.setdefault(
              "runs",
              []
          )

          action_memory.setdefault(
              "learnings",
              [])


          for key in (
              "opportunities",
              "bids",
              "runs",
              "learnings"
          ):
              if not isinstance(
                  action_memory.get(key),
                  list
              ):
                  action_memory[key] = []


          # ============================================================
          # CORE AUTHORIZATION
          # ============================================================

          def extract_core_actions():
              actions = []

              raw_actions = core_memory.get(
                  "actions",
                  []
              )

              if isinstance(raw_actions, list):
                  actions.extend(
                      item
                      for item in raw_actions
                      if isinstance(item, dict)
                  )

              decisions = core_memory.get(
                  "decisions",
                  []
              )

              if isinstance(decisions, list):
                  actions.extend(
                      item
                      for item in decisions
                      if isinstance(item, dict)
                  )

              cognitive_cases = core_memory.get(
                  "cognitive_cases",
                  []
              )

              if isinstance(cognitive_cases, list):
                  for case in cognitive_cases[-MAX_CORE_ACTIONS:]:
                      if not isinstance(case, dict):
                          continue

                      decision = case.get(
                          "decision"
                      )

                      if not decision:
                          continue

                      actions.append({
                          "timestamp": case.get(
                              "timestamp"
                          ),
                          "summary": (
                              f"Core decision: {decision}"
                          ),
                          "decision": decision,
                          "target_id": case.get(
                              "target_id"
                          ),
                          "execution_layer": (
                              case.get(
                                  "execution_layer"
                              )
                          ),
                          "decision_reason": case.get(
                              "decision_reason"
                          ),
                          "interest": case.get(
                              "interest"
                          ),
                      })

              return actions[-MAX_CORE_ACTIONS:]


          core_actions = extract_core_actions()


          MARKETPLACE_ACTION_MARKERS = (
              "marketplace",
              "opportunit",
              "bid",
              "bidding",
              "paid_task",
              "paid task",
              "submit_bid",
              "submit bid",
              "action_opportunities",
              "action / opportunities",
              "action and opportunities",
          )


          def is_marketplace_action(item):
              if not isinstance(item, dict):
                  return False

              execution_layer = normalize(
                  item.get("execution_layer")
              )

              decision = normalize(
                  item.get("decision")
                  or item.get("action")
                  or item.get("summary")
              )

              combined = (
                  f"{execution_layer} "
                  f"{decision}"
              )

              return any(
                  marker in combined
                  for marker in MARKETPLACE_ACTION_MARKERS
              )


          authorized_core_actions = [
              item
              for item in core_actions
              if is_marketplace_action(item)
          ]


          def core_allows_marketplace():
              if not authorized_core_actions:
                  return False

              for item in reversed(
                  authorized_core_actions
              ):
                  decision = normalize(
                      item.get("decision")
                      or item.get("action")
                      or item.get("summary")
                  )

                  if (
                      "do_nothing" in decision
                      or "observe" in decision
                      or "wait" in decision
                  ):
                      continue

                  return True

              return False


          marketplace_authorized = (
              core_allows_marketplace()
          )


          # ============================================================
          # SDK BOOTSTRAP / IDENTITY
          # ============================================================

          print("")
          print("=== NØX ACTION & OPPORTUNITIES ===")
          print("Core authorization:", marketplace_authorized)
          print("Gemini: false")
          print("External AI: false")
          print("Spending: false")
          print("Payments: false")
          print("Project cost: €0")

          try:
              sdk_client = ColonyClient(
                  API_KEY
              )

              try:
                  sdk_state = sdk_client.bootstrap()
              except ColonyAuthError as exc:
                  raise RuntimeError(
                      f"Colony authentication refused: {exc}"
                  )
              except ColonyAPIError as exc:
                  raise RuntimeError(
                      f"Colony bootstrap failed: {exc}"
                  )

              profile = {}

              if isinstance(
                  sdk_state,
                  dict
              ):
                  profile = sdk_state.get(
                      "profile",
                      {}
                  )

              if not isinstance(
                  profile,
                  dict
              ):
                  profile = {}

              username = (
                  profile.get("username")
                  or profile.get("handle")
                  or profile.get("name")
                  or ""
              )

              if not username:
                  try:
                      me = sdk_client.get_me()

                      if isinstance(
                          me,
                          dict
                      ):
                          profile = me
                          username = (
                              me.get("username")
                              or me.get("handle")
                              or me.get("name")
                              or ""
                          )

                  except Exception:
                      pass

              if username and normalize(
                  username
              ) != "nox_origine":
                  raise RuntimeError(
                      "SECURITY STOP: unexpected Colony "
                      f"identity '{username}'."
                  )

              print(
                  f"Identity: @{username or 'unknown'}"
              )

          except Exception as exc:
              print(
                  f"SDK bootstrap error: {exc}"
              )
              sys.exit(1)


          # ============================================================
          # AUTH TOKEN FOR MARKETPLACE API
          # ============================================================

          try:
              auth = http_json(
                  "POST",
                  "/auth/token",
                  token="",
                  payload={
                      "api_key": API_KEY
                  }
              )
          except RuntimeError as exc:
              print(
                  f"Authentication failed: {exc}"
              )
              sys.exit(1)

          token = (
              auth.get("access_token")
              or auth.get("token")
              or auth.get("jwt")
          )

          if not token:
              print(
                  "ERROR: authentication succeeded "
                  "without an access token."
              )
              sys.exit(1)

          me = http_json(
              "GET",
              "/users/me",
              token
          )

          profile_name = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or username
              or "unknown"
          )

          if normalize(
              profile_name
          ) != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: marketplace identity mismatch: "
                  f"{profile_name}"
              )

          profile_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("userId")
              or me.get("agent_id")
              or me.get("agentId")
          )

          print(
              f"Marketplace identity verified: @{profile_name}"
          )


          # ============================================================
          # MARKETPLACE EXTRACTION
          # ============================================================

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("listing_id")
                  or task.get("uuid")
                  or task.get("_id")
              )


          def task_title(task):
              return clean_text(
                  task.get("title")
                  or task.get("name")
                  or task.get("headline")
                  or "Untitled opportunity",
                  300
              )


          def task_status(task):
              return clean_text(
                  task.get("status")
                  or task.get("state")
                  or "unknown",
                  100
              )


          def numeric_sats(value):
              if isinstance(
                  value,
                  bool
              ):
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  if value >= 0:
                      return int(value)

                  return None

              if not isinstance(
                  value,
                  str
              ):
                  return None

              cleaned = (
                  value
                  .strip()
                  .replace(",", "")
              )

              match = re.fullmatch(
                  r"(\d+(?:\.\d+)?)",
                  cleaned
              )

              if not match:
                  return None

              try:
                  number = float(
                      match.group(1)
                  )

                  if number < 0:
                      return None

                  return int(number)

              except Exception:
                  return None


          MIN_KEYS = {
              "budget_min_sats",
              "min_budget_sats",
              "minimum_budget_sats",
              "reward_min_sats",
              "min_reward_sats",
              "min_bid_sats",
              "price_min_sats",
              "minimum_bid_sats",
              "bid_min_sats",
          }


          MAX_KEYS = {
              "budget_max_sats",
              "max_budget_sats",
              "maximum_budget_sats",
              "reward_max_sats",
              "max_reward_sats",
              "max_bid_sats",
              "price_max_sats",
              "maximum_bid_sats",
              "bid_max_sats",
          }


          FIXED_KEYS = {
              "reward_sats",
              "amount_sats",
              "payment_sats",
              "price_sats",
              "fixed_reward_sats",
              "fixed_budget_sats",
              "fixed_price_sats",
              "fixed_amount_sats",
              "listed_rate_sats",
          }


          def text_budget_candidates(task):
              texts = []

              for key in (
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "summary",
                  "budget",
                  "reward",
                  "payment",
                  "compensation",
              ):
                  if key in task:
                      texts.append(
                          text_value(
                              task[key]
                          )
                      )

              combined = " ".join(texts)

              ranges = re.findall(
                  r"(\d[\d,]*)\s*"
                  r"(?:-|–|—|to)\s*"
                  r"(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE
              )

              if ranges:
                  low, high = ranges[0]

                  return (
                      int(low.replace(",", "")),
                      int(high.replace(",", "")),
                      "text-range"
                  )

              singles = re.findall(
                  r"(\d[\d,]*)\s*sats\b",
                  combined,
                  flags=re.IGNORECASE
              )

              if singles:
                  value = int(
                      singles[0].replace(
                          ",",
                          ""
                      )
                  )

                  return (
                      value,
                      value,
                      "text-fixed"
                  )

              return (
                  None,
                  None,
                  None
              )


          def extract_budget(task):
              lower = None
              upper = None
              source = None

              for path, key, value in recursive_values(task):
                  key_lower = key.lower()

                  if key_lower in MIN_KEYS:
                      number = numeric_sats(
                          value
                      )

                      if number is not None:
                          lower = number
                          source = (
                              f"explicit:{path}"
                          )

                  elif key_lower in MAX_KEYS:
                      number = numeric_sats(
                          value
                      )

                      if number is not None:
                          upper = number

                  elif key_lower in FIXED_KEYS:
                      number = numeric_sats(
                          value
                      )

                      if number is not None:
                          lower = number
                          upper = number
                          source = (
                              f"explicit:{path}"
                          )

              if (
                  lower is not None
                  or upper is not None
              ):
                  if lower is None:
                      lower = upper

                  if upper is None:
                      upper = lower

                  return (
                      lower,
                      upper,
                      source
                  )

              return text_budget_candidates(
                  task
              )


          EXPLICIT_DEMAND_TYPES = {
              "paid_task",
              "task",
              "bounty",
              "human_request",
              "human-request",
          }


          EXPLICIT_SUPPLY_TYPES = {
              "service",
              "service_offer",
              "service-offer",
              "for_hire",
              "for-hire",
              "offer",
          }


          SUPPLY_MARKERS = (
              "for hire",
              "for-hire",
              "available for",
              "my services",
              "service offer",
              "service listing",
              "fixed-price service",
              "fixed price service",
              "hire me",
              "i can provide",
              "i offer",
          )


          DEMAND_MARKERS = (
              "looking for",
              "need an agent",
              "need someone",
              "seeking agent",
              "seeking someone",
              "wanted",
              "request",
              "bounty",
              "paid task",
              "human request",
              "i need",
              "we need",
              "build",
              "verify",
              "audit",
              "research",
              "write",
              "develop",
              "create",
              "fix",
              "test",
              "analyze",
              "analyse",
              "deliver",
          )


          def classify(task):
              explicit_type = normalize(
                  task.get("post_type")
                  or task.get("type")
                  or task.get("listing_type")
                  or task.get("kind")
                  or ""
              )

              if explicit_type in (
                  EXPLICIT_DEMAND_TYPES
              ):
                  return (
                      "demand",
                      f"explicit:{explicit_type}"
                  )

              if explicit_type in (
                  EXPLICIT_SUPPLY_TYPES
              ):
                  return (
                      "supply",
                      f"explicit:{explicit_type}"
                  )

              title = normalize(
                  task_title(task)
              )

              combined = normalize(
                  " ".join([
                      text_value(
                          task.get("title")
                      ),
                      text_value(
                          task.get("body")
                      ),
                      text_value(
                          task.get("description")
                      ),
                      text_value(
                          task.get("content")
                      ),
                      text_value(
                          task.get("summary")
                      ),
                  ])
              )

              if any(
                  marker in title
                  for marker in SUPPLY_MARKERS
              ):
                  return (
                      "supply",
                      "title:supply-marker"
                  )

              if any(
                  marker in combined
                  for marker in SUPPLY_MARKERS
              ):
                  return (
                      "supply",
                      "body:supply-marker"
                  )

              if any(
                  marker in title
                  for marker in DEMAND_MARKERS
              ):
                  return (
                      "demand",
                      "title:demand-marker"
                  )

              if any(
                  marker in combined
                  for marker in DEMAND_MARKERS
              ):
                  return (
                      "demand",
                      "body:demand-marker"
                  )

              return (
                  "unknown",
                  "no-classifier-match"
              )


          # ============================================================
          # CAPABILITY / COGNITIVE RELEVANCE
          # ============================================================

          CAPABILITY_KEYWORDS = {
              "research": 5,
              "deep research": 8,
              "research report": 8,
              "technical report": 8,
              "report writing": 7,
              "technical": 4,
              "python": 6,
              "code": 4,
              "coding": 4,
              "software": 3,
              "data": 5,
              "dataset": 5,
              "json": 4,
              "csv": 4,
              "verification": 7,
              "verify": 7,
              "audit": 7,
              "citation": 6,
              "citations": 6,
              "analysis": 5,
              "analyze": 5,
              "test": 5,
              "testing": 5,
              "agent tooling": 8,
              "tool development": 8,
          }


          def opportunity_score(
              task,
              lower,
              upper
          ):
              text = normalize(
                  task
              )

              score = 0

              for keyword, points in (
                  CAPABILITY_KEYWORDS.items()
              ):
                  if keyword in text:
                      score += points

              if lower is not None:
                  if lower >= 10000:
                      score += 8
                  elif lower >= 5000:
                      score += 6
                  elif lower >= 1000:
                      score += 4
                  elif lower >= 500:
                      score += 2

              if (
                  upper is not None
                  and upper >= 10000
              ):
                  score += 3

              return score


          def build_bid_description(
              candidate
          ):
              return (
                  "NØX proposes an evidence-first, "
                  "reproducible approach. Relevant capabilities "
                  "will be applied according to the task context. "
                  "Results will distinguish verified findings "
                  "from uncertainty, with assumptions made explicit."
              )


          # ============================================================
          # MARKETPLACE READ
          # ============================================================

          marketplace_response = http_json(
              "GET",
              "/marketplace/tasks",
              token,
              params={
                  "status": "open",
                  "sort": "new",
                  "limit": MAX_TASKS,
                  "offset": 0,
              }
          )

          if isinstance(
              marketplace_response,
              list
          ):
              tasks = marketplace_response

          elif isinstance(
              marketplace_response,
              dict
          ):
              tasks = (
                  marketplace_response.get(
                      "tasks"
                  )
                  or marketplace_response.get(
                      "items"
                  )
                  or marketplace_response.get(
                      "results"
                  )
                  or marketplace_response.get(
                      "data"
                  )
                  or []
              )

              if isinstance(
                  tasks,
                  dict
              ):
                  tasks = (
                      tasks.get("tasks")
                      or tasks.get("items")
                      or tasks.get("results")
                      or []
                  )

          else:
              tasks = []

          if not isinstance(
              tasks,
              list
          ):
              tasks = []

          print(
              f"Marketplace tasks observed: {len(tasks)}"
          )


          # ============================================================
          # CANDIDATES
          # ============================================================

          candidates = []

          supply_count = 0
          unknown_count = 0

          for task in tasks:
              if not isinstance(
                  task,
                  dict
              ):
                  continue

              tid = task_id(task)

              if not tid:
                  continue

              classification, classification_source = classify(
                  task
              )

              if classification == "supply":
                  supply_count += 1
                  continue

              if classification == "unknown":
                  unknown_count += 1
                  continue

              lower, upper, budget_source = extract_budget(
                  task
              )

              if (
                  upper is not None
                  and upper < MIN_OPPORTUNITY
              ):
                  continue

              score = opportunity_score(
                  task,
                  lower,
                  upper
              )

              candidates.append({
                  "id": str(tid),
                  "title": task_title(task),
                  "status": task_status(task),
                  "classification": classification,
                  "classification_source": classification_source,
                  "budget_min_sats": lower,
                  "budget_max_sats": upper,
                  "budget_source": budget_source,
                  "score": score,
                  "raw": task,
              })


          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["budget_max_sats"] or 0
              ),
              reverse=True
          )


          print(
              f"Demand candidates: {len(candidates)}"
          )
          print(
              f"Supply listings skipped: {supply_count}"
          )
          print(
              f"Unknown listings skipped: {unknown_count}"
          )


          # ============================================================
          # ACTION MEMORY HELPERS
          # ============================================================

          def find_opportunity(tid):
              for item in reversed(
                  action_memory["opportunities"]
              ):
                  if str(
                      item.get("id")
                  ) == str(tid):
                      return item

              return None


          def find_local_bid(tid):
              for item in reversed(
                  action_memory["bids"]
              ):
                  if str(
                      item.get("task_id")
                  ) == str(tid):
                      return item

              return None


          # ============================================================
          # BID STATUS
          # ============================================================

          def normalize_bid_status(value):
              return (
                  normalize(value)
                  .replace("-", "_")
                  .replace(" ", "_")
              )


          def bid_state(record):
              if not isinstance(
                  record,
                  dict
              ):
                  return "unknown"

              raw = (
                  record.get("platform_status")
                  or record.get("status")
                  or record.get("state")
                  or ""
              )

              status = normalize_bid_status(
                  raw
              )

              if status in {
                  "accepted",
                  "approved",
                  "awarded",
                  "won",
                  "selected",
                  "completed",
                  "complete",
                  "paid",
                  "success",
              }:
                  return "won"

              if status in {
                  "rejected",
                  "declined",
                  "denied",
                  "lost",
                  "expired",
                  "cancelled",
                  "canceled",
                  "withdrawn",
              }:
                  return "closed"

              if status in {
                  "pending",
                  "submitted",
                  "open",
                  "active",
                  "bidding",
                  "under_review",
                  "review",
                  "in_review",
                  "already_present",
              }:
                  return "pending"

              return "unknown"


          def normalize_bid_collection(response):
              if isinstance(
                  response,
                  list
              ):
                  return response

              if not isinstance(
                  response,
                  dict
              ):
                  return []

              for key in (
                  "bids",
                  "items",
                  "results",
                  "data"
              ):
                  value = response.get(
                      key
                  )

                  if isinstance(
                      value,
                      list
                  ):
                      return value

                  if isinstance(
                      value,
                      dict
                  ):
                      for nested_key in (
                          "bids",
                          "items",
                          "results"
                      ):
                          nested = value.get(
                              nested_key
                          )

                          if isinstance(
                              nested,
                              list
                          ):
                              return nested

              return []


          def bid_belongs_to_nox(
              bid
          ):
              if not isinstance(
                  bid,
                  dict
              ):
                  return False

              identity_values = set()

              for value in (
                  profile_id,
                  me.get("id"),
                  me.get("user_id"),
                  me.get("userId"),
                  me.get("agent_id"),
                  me.get("agentId"),
              ):
                  if value is not None:
                      identity_values.add(
                          str(value).lower()
                      )

              username_values = {
                  normalize(profile_name),
                  normalize(username),
                  "nox_origine",
              }

              for key in (
                  "user_id",
                  "agent_id",
                  "owner_id",
                  "bidder_id",
              ):
                  value = bid.get(
                      key
                  )

                  if (
                      value is not None
                      and str(value).lower()
                      in identity_values
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "agent_username",
                  "agent_handle",
              ):
                  value = bid.get(
                      key
                  )

                  if (
                      value is not None
                      and normalize(value)
                      in username_values
                  ):
                      return True

              for key in (
                  "bidder",
                  "agent",
                  "user"
              ):
                  nested = bid.get(
                      key
                  )

                  if isinstance(
                      nested,
                      dict
                  ):
                      for nested_key in (
                          "id",
                          "user_id",
                          "agent_id"
                      ):
                          value = nested.get(
                              nested_key
                          )

                          if (
                              value is not None
                              and str(value).lower()
                              in identity_values
                          ):
                              return True

                      for nested_key in (
                          "username",
                          "handle",
                          "name"
                      ):
                          value = nested.get(
                              nested_key
                          )

                          if (
                              value is not None
                              and normalize(value)
                              in username_values
                          ):
                              return True

              return False


          def extract_bid_id(response):
              if not isinstance(
                  response,
                  dict
              ):
                  return None

              direct = (
                  response.get("bid_id")
                  or response.get("id")
              )

              if direct:
                  return str(direct)

              for key in (
                  "bid",
                  "data",
                  "result"
              ):
                  nested = response.get(
                      key
                  )

                  if isinstance(
                      nested,
                      dict
                  ):
                      nested_id = (
                          nested.get("bid_id")
                          or nested.get("id")
                      )

                      if nested_id:
                          return str(nested_id)

              return None


          def extract_bid_status(response):
              if not isinstance(
                  response,
                  dict
              ):
                  return None

              for key in (
                  "status",
                  "state",
                  "bid_status",
                  "bidStatus"
              ):
                  value = response.get(
                      key
                  )

                  if value:
                      return str(value)

              for key in (
                  "bid",
                  "data",
                  "result"
              ):
                  nested = response.get(
                      key
                  )

                  if isinstance(
                      nested,
                      dict
                  ):
                      value = (
                          nested.get("status")
                          or nested.get("state")
                          or nested.get("bid_status")
                          or nested.get("bidStatus")
                      )

                      if value:
                          return str(value)

              return None


          # ============================================================
          # RECONCILE EXISTING BIDS FIRST
          # ============================================================

          reconciled = 0
          reconciliation_unknown = 0
          bid_checks = 0

          recent_bids = [
              item
              for item in action_memory["bids"]
              if isinstance(item, dict)
          ][-MAX_BID_CHECKS:]


          for bid_record in recent_bids:
              tid = bid_record.get(
                  "task_id"
              )

              if not tid:
                  continue

              if bid_checks >= MAX_BID_CHECKS:
                  break

              bid_checks += 1

              try:
                  response = http_json(
                      "GET",
                      f"/marketplace/{tid}/bids",
                      token
                  )

                  platform_bids = normalize_bid_collection(
                      response
                  )

                  matching = None

                  for bid in platform_bids:
                      if bid_belongs_to_nox(
                          bid
                      ):
                          matching = bid
                          break

                  bid_record[
                      "last_reconciled_at"
                  ] = now_iso()

                  if matching:
                      matched_id = (
                          matching.get("bid_id")
                          or matching.get("id")
                      )

                      if matched_id:
                          bid_record[
                              "bid_id"
                          ] = str(
                              matched_id
                          )

                      platform_status = (
                          matching.get("status")
                          or matching.get("state")
                          or matching.get("bid_status")
                          or matching.get("bidStatus")
                      )

                      if platform_status:
                          bid_record[
                              "platform_status"
                          ] = platform_status

                          bid_record[
                              "status"
                          ] = str(
                              platform_status
                          )

                      bid_record[
                          "platform_bid"
                      ] = matching

                      lifecycle = bid_state(
                          bid_record
                      )

                      bid_record[
                          "lifecycle_state"
                      ] = lifecycle

                      if lifecycle == "pending":
                          bid_record[
                              "next_action"
                          ] = "monitor_bid"

                      elif lifecycle == "won":
                          bid_record[
                              "next_action"
                          ] = "await_task_or_delivery"

                      elif lifecycle == "closed":
                          bid_record[
                              "next_action"
                          ] = "review_and_reassess"

                      else:
                          bid_record[
                              "next_action"
                          ] = "reconcile_again"

                      reconciled += 1

                      print(
                          "BID RECONCILED:",
                          tid,
                          "| state=",
                          lifecycle,
                          "| platform_status=",
                          platform_status or "unknown"
                      )

                  else:
                      reconciliation_unknown += 1

                      bid_record[
                          "lifecycle_state"
                      ] = "unknown"

                      bid_record[
                          "next_action"
                      ] = "reconcile_again"

                      print(
                          "BID RECONCILIATION UNCERTAIN:",
                          tid
                      )

              except Exception as exc:
                  reconciliation_unknown += 1

                  print(
                      f"BID RECONCILE ERROR: {tid}: {exc}"
                  )


          # ============================================================
         
