name: NØX - Action & Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-action-opportunities
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  ACTION_MEMORY_FILE: memory/nox_action_opportunities.json

  MAX_TASKS_PER_RUN: "50"
  MAX_BIDS_PER_RUN: "2"
  MAX_BID_CHECKS_PER_RUN: "10"
  MAX_TRACKED_ITEMS: "300"

  MIN_OPPORTUNITY_SATS: "1"
  MIN_PLATFORM_BID_SATS: "21"

  REQUEST_TIMEOUT_SECONDS: "20"

  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  action-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.27.0"

      - name: Run NØX Action & Opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_API_TOKEN: ${{ secrets.COLONY_API_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API_BASE = "https://thecolony.cc/api/v1"

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          ACTION_MEMORY_FILE = Path(os.environ["ACTION_MEMORY_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_BID_CHECKS = int(os.environ["MAX_BID_CHECKS_PER_RUN"])
          MAX_TRACKED = int(os.environ["MAX_TRACKED_ITEMS"])

          MIN_OPPORTUNITY = int(os.environ["MIN_OPPORTUNITY_SATS"])
          MIN_PLATFORM_BID = int(os.environ["MIN_PLATFORM_BID_SATS"])
          TIMEOUT = int(os.environ["REQUEST_TIMEOUT_SECONDS"])


          # ==========================================================
          # TIME
          # ==========================================================

          def now():
              return datetime.now(timezone.utc).isoformat()


          # ==========================================================
          # JSON MEMORY
          # ==========================================================

          def load(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)

              except Exception as exc:
                  print(f"WARNING: cannot read {path}: {exc}")
                  return default


          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
                  f.write("\n")

              tmp.replace(path)


          # ==========================================================
          # HTTP API
          # ==========================================================

          def request(method, path, token=None, body=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Colony-Agent/3.0"
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  API_BASE + path,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=TIMEOUT
                  ) as response:

                      raw = response.read().decode("utf-8")

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)
                      except json.JSONDecodeError:
                          return {"raw": raw}

              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"raw": raw}

                  detail = payload.get(
                      "detail",
                      payload
                  )

                  raise RuntimeError(
                      f"{method} {path} -> HTTP {exc.code}: "
                      f"{json.dumps(detail, ensure_ascii=False)}"
                  )


          def auth_token():
              api_key = os.environ.get(
                  "COLONY_API_KEY",
                  ""
              ).strip()

              bearer = os.environ.get(
                  "COLONY_API_TOKEN",
                  ""
              ).strip()

              credential = api_key or bearer

              if not credential:
                  raise RuntimeError(
                      "Missing COLONY_API_KEY/COLONY_API_TOKEN."
                  )

              if credential.startswith("col_"):
                  print("AUTH: API key detected; exchanging for JWT.")

                  payload = request(
                      "POST",
                      "/auth/token",
                      body={"api_key": credential}
                  )

                  jwt = payload.get("access_token")

                  if not jwt:
                      raise RuntimeError(
                          "Auth exchange returned no access_token."
                      )

                  return jwt

              print(
                  "AUTH: bearer token detected; using it directly."
              )

              return credential


          # ==========================================================
          # STRUCTURE HELPERS
          # ==========================================================

          def items(payload, keys):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in keys:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def as_int(value):
              if value is None or isinstance(value, bool):
                  return None

              if isinstance(value, int):
                  return value if value >= 0 else None

              if isinstance(value, float):
                  return int(value) if value >= 0 else None

              if isinstance(value, str):
                  text = (
                      value
                      .replace(",", "")
                      .replace(" ", "")
                  )

                  match = re.search(
                      r"(?<!\d)(\d+(?:\.\d+)?)(?!\d)",
                      text
                  )

                  if match:
                      number = int(
                          float(match.group(1))
                      )

                      return number if number >= 0 else None

              return None


          def numbers_from_text(value):
              if not isinstance(value, str):
                  return []

              text = (
                  value
                  .replace(",", "")
                  .replace("–", "-")
                  .replace("—", "-")
                  .replace("−", "-")
              )

              return [
                  int(float(x))
                  for x in re.findall(
                      r"(?<!\d)(\d+(?:\.\d+)?)(?!\d)",
                      text
                  )
              ]


          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def task_id(task):
              for key in (
                  "id",
                  "task_id",
                  "uuid"
              ):
                  if task.get(key):
                      return str(task[key])

              nested = task.get("task")

              if isinstance(nested, dict):
                  for key in (
                      "id",
                      "task_id",
                      "uuid"
                  ):
                      if nested.get(key):
                          return str(nested[key])

              return None


          def title(task):
              for key in (
                  "title",
                  "name",
                  "task_title",
                  "subject"
              ):
                  value = task.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      return value.strip()

              return "Untitled task"


          def task_text(task):
              values = []

              def walk(value):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          key_name = str(key).lower()

                          if any(
                              marker in key_name
                              for marker in (
                                  "title",
                                  "name",
                                  "description",
                                  "body",
                                  "content",
                                  "requirement",
                                  "skill",
                                  "category",
                                  "tag",
                                  "summary",
                                  "text"
                              )
                          ):
                              if isinstance(child, str):
                                  values.append(child)

                          if isinstance(child, (dict, list)):
                              walk(child)

                  elif isinstance(value, list):
                      for child in value:
                          walk(child)

              walk(task)

              return " ".join(
                  clean_text(x)
                  for x in values
                  if clean_text(x)
              )


          # ==========================================================
          # BUDGET EXTRACTION
          #
          # Important:
          # Do not assume one exact JSON representation.
          #
          # We first check explicit sat fields, then nested objects,
          # then textual budget/range representations.
          # ==========================================================

          MIN_KEYS = (
              "budget_min_sats",
              "min_budget_sats",
              "minimum_budget_sats",
              "reward_min_sats",
              "min_reward_sats",
              "minimum_reward_sats",
              "min_bid_sats",
              "minimum_bid_sats",
              "price_min_sats",
              "min_price_sats"
          )

          MAX_KEYS = (
              "budget_max_sats",
              "max_budget_sats",
              "maximum_budget_sats",
              "reward_max_sats",
              "max_reward_sats",
              "maximum_reward_sats",
              "max_bid_sats",
              "maximum_bid_sats",
              "price_max_sats",
              "max_price_sats"
          )

          FIXED_KEYS = (
              "reward_sats",
              "amount_sats",
              "payment_sats",
              "price_sats",
              "fixed_reward_sats",
              "fixed_budget_sats",
              "fixed_price_sats",
              "fixed_amount_sats",
              "listed_rate_sats"
          )


          def recursive_values(task):
              values = []

              def walk(value, path=""):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          child_path = (
                              f"{path}.{key}"
                              if path
                              else str(key)
                          )

                          values.append(
                              (
                                  str(key),
                                  child,
                                  child_path
                              )
                          )

                          if isinstance(
                              child,
                              (dict, list)
                          ):
                              walk(
                                  child,
                                  child_path
                              )

                  elif isinstance(value, list):
                      for index, child in enumerate(value):
                          child_path = (
                              f"{path}[{index}]"
                          )

                          if isinstance(
                              child,
                              (dict, list)
                          ):
                              walk(
                                  child,
                                  child_path
                              )

              walk(task)

              return values


          def budget_bounds(task):
              entries = recursive_values(task)

              # ------------------------------------------------------
              # 1. Exact explicit fields anywhere in the object.
              # ------------------------------------------------------

              minimums = []
              maximums = []
              fixed = []

              for key, value, path in entries:
                  normalized = (
                      key.lower()
                      .replace("-", "_")
                  )

                  if normalized in MIN_KEYS:
                      number = as_int(value)

                      if number is not None:
                          minimums.append(
                              (
                                  number,
                                  path
                              )
                          )

                  elif normalized in MAX_KEYS:
                      number = as_int(value)

                      if number is not None:
                          maximums.append(
                              (
                                  number,
                                  path
                              )
                          )

                  elif normalized in FIXED_KEYS:
                      number = as_int(value)

                      if number is not None:
                          fixed.append(
                              (
                                  number,
                                  path
                              )
                          )

              if minimums:
                  lower, lower_path = min(
                      minimums,
                      key=lambda x: x[0]
                  )

                  upper = None
                  upper_path = None

                  if maximums:
                      upper, upper_path = min(
                          maximums,
                          key=lambda x: x[0]
                      )

                  if upper is None:
                      upper = lower

                  return (
                      lower,
                      upper,
                      f"explicit:{lower_path}"
                  )

              if fixed:
                  value, path = min(
                      fixed,
                      key=lambda x: x[0]
                  )

                  return (
                      value,
                      value,
                      f"fixed:{path}"
                  )

              # ------------------------------------------------------
              # 2. Search textual fields for:
              #    "2,000–50,000 sats"
              #    "2000-10000 sats"
              #    "5000 sats"
              # ------------------------------------------------------

              text_candidates = []

              for key, value, path in entries:
                  if not isinstance(value, str):
                      continue

                  key_lower = key.lower()

                  if not any(
                      marker in key_lower
                      for marker in (
                          "title",
                          "description",
                          "body",
                          "content",
                          "budget",
                          "reward",
                          "price",
                          "amount",
                          "payment",
                          "summary"
                      )
                  ):
                      continue

                  lower_value = value.lower()

                  if not any(
                      marker in lower_value
                      for marker in (
                          "sat",
                          "sats",
                          "satoshi",
                          "lightning"
                      )
                  ):
                      continue

                  text_candidates.append(
                      (
                          value,
                          path
                      )
                  )

              for value, path in text_candidates:
                  text = (
                      value
                      .replace(",", "")
                      .replace("–", "-")
                      .replace("—", "-")
                      .replace("−", "-")
                  )

                  range_match = re.search(
                      r"(\d+(?:\.\d+)?)"
                      r"\s*-\s*"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sat|sats|satoshi|satoshis)\b",
                      text,
                      flags=re.IGNORECASE
                  )

                  if range_match:
                      lower = int(
                          float(
                              range_match.group(1)
                          )
                      )

                      upper = int(
                          float(
                              range_match.group(2)
                          )
                      )

                      return (
                          lower,
                          upper,
                          f"text-range:{path}"
                      )

              for value, path in text_candidates:
                  single_match = re.search(
                      r"(?<!\d)"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sat|sats|satoshi|satoshis)\b",
                      value,
                      flags=re.IGNORECASE
                  )

                  if single_match:
                      number = int(
                          float(
                              single_match.group(1)
                          )
                      )

                      return (
                          number,
                          number,
                          f"text-fixed:{path}"
                      )

              # ------------------------------------------------------
              # 3. No reliable budget.
              # ------------------------------------------------------

              return (
                  None,
                  None,
                  "unknown"
              )


          # ==========================================================
          # SUPPLY / DEMAND CLASSIFICATION
          # ==========================================================

          SUPPLY_MARKERS = (
              "for hire",
              "for-hire",
              "available for",
              "my services",
              "our services",
              "service offer",
              "fixed-price service",
              "fixed price service",
              "hire me",
              "hire us",
              "i offer",
              "we offer"
          )

          DEMAND_MARKERS = (
              "looking for",
              "need an agent",
              "need agents",
              "seeking agent",
              "seeking agents",
              "wanted",
              "request",
              "build",
              "verify",
              "audit",
              "research",
              "write",
              "develop",
              "create",
              "fix",
              "test",
              "analyze",
              "analyse",
              "deliver",
              "bounty",
              "paid task"
          )


          def classify(task):
              text = (
                  title(task)
                  + " "
                  + task_text(task)
              ).lower()

              supply_hits = [
                  x
                  for x in SUPPLY_MARKERS
                  if x in text
              ]

              demand_hits = [
                  x
                  for x in DEMAND_MARKERS
                  if x in text
              ]

              for key in (
                  "type",
                  "task_type",
                  "listing_type",
                  "kind",
                  "post_type"
              ):
                  value = task.get(key)

                  if isinstance(
                      value,
                      str
                  ):
                      normalized = (
                          value
                          .lower()
                          .replace("-", "_")
                      )

                      if normalized in (
                          "paid_task",
                          "task",
                          "bounty",
                          "human_request"
                      ):
                          return "demand"

                      if normalized in (
                          "service",
                          "service_offer",
                          "for_hire",
                          "offer"
                      ):
                          return "supply"

              if supply_hits and not demand_hits:
                  return "supply"

              if demand_hits:
                  return "demand"

              return "unknown"


          # ==========================================================
          # OPPORTUNITY SCORE
          # ==========================================================

          def score(task, core, knowledge):
              text = (
                  title(task)
                  + " "
                  + task_text(task)
              ).lower()

              strong = (
                  "research",
                  "deep research",
                  "research report",
                  "technical report",
                  "report writing",
                  "write a report",
                  "analysis",
                  "technical",
                  "documentation",
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "python",
                  "automation",
                  "data",
                  "verification",
                  "verify",
                  "receipt",
                  "evidence",
                  "testing",
                  "qa"
              )

              learning = (
                  "learn",
                  "feedback",
                  "test",
                  "testing",
                  "review",
                  "verify",
                  "verification",
                  "experiment",
                  "documentation"
              )

              total = 0
              reasons = []

              for term in strong:
                  if term in text:
                      total += 5
                      reasons.append(term)

              for term in learning:
                  if term in text:
                      total += 2
                      reasons.append(
                          f"learning:{term}"
                      )

              lower_context = (
                  json.dumps(
                      core,
                      ensure_ascii=False
                  ).lower()
                  +
                  json.dumps(
                      knowledge,
                      ensure_ascii=False
                  ).lower()
              )

              for term in (
                  "research",
                  "python",
                  "agent",
                  "verification",
                  "report",
                  "tool",
                  "documentation"
              ):
                  if (
                      term in text
                      and term in lower_context
                  ):
                      total += 2
                      reasons.append(
                          f"context:{term}"
                      )

              reward_lower, reward_upper, _ = (
                  budget_bounds(task)
              )

              reward_value = reward_lower

              if reward_value is not None:
                  if reward_value >= 10000:
                      total += 6
                      reasons.append("high_reward")

                  elif reward_value >= 1000:
                      total += 4
                      reasons.append("paid")

                  elif reward_value >= 1:
                      total += 2
                      reasons.append("reward_present")

              return (
                  total,
                  list(
                      dict.fromkeys(
                          reasons
                      )
                  )
              )


          # ==========================================================
          # OWN BID
          # ==========================================================

          def has_own_bid(
              token,
              task_id_value,
              username
          ):
              encoded = urllib.parse.quote(
                  task_id_value,
                  safe=""
              )

              payload = request(
                  "GET",
                  f"/marketplace/{encoded}/bids",
                  token=token
              )

              bids = items(
                  payload,
                  (
                      "bids",
                      "items",
                      "data"
                  )
              )

              for bid in bids:
                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  if (
                      bid.get("is_mine") is True
                      or bid.get("mine") is True
                      or bid.get("is_own") is True
                  ):
                      return True

                  for key in (
                      "username",
                      "bidder",
                      "agent_username"
                  ):
                      if (
                          str(
                              bid.get(
                                  key,
                                  ""
                              )
                          ).lower()
                          == username.lower()
                      ):
                          return True

              return False


          # ==========================================================
          # LOAD MEMORY
          # ==========================================================

          core = load(
              CORE_MEMORY_FILE,
              {}
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          action = load(
              ACTION_MEMORY_FILE,
              {
                  "version": 3,
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": []
              }
          )

          if not isinstance(
              action,
              dict
          ):
              action = {
                  "version": 3,
                  "opportunities": [],
                  "bids": [],
                  "runs": [],
                  "learnings": []
              }

          for key in (
              "opportunities",
              "bids",
              "runs",
              "learnings"
          ):
              if not isinstance(
                  action.get(key),
                  list
              ):
                  action[key] = []


          # ==========================================================
          # AUTH
          # ==========================================================

          token = auth_token()

          try:
              profile = request(
                  "GET",
                  "/users/me",
                  token=token
              )

          except Exception as exc:
              print(
                  f"PROFILE ERROR: {exc}"
              )
              sys.exit(1)

          username = (
              profile.get("username")
              or profile.get("handle")
              or profile.get("name")
              or "unknown"
          )


          print("=== NØX ACTION & OPPORTUNITIES ===")
          print(f"Profile: {username}")
          print(
              "Policy: €0 / no spending / "
              "no payment / no Gemini / no external AI"
          )
          print(
              f"Opportunity floor: "
              f"{MIN_OPPORTUNITY} sat"
          )
          print(
              f"Platform bid floor: "
              f"{MIN_PLATFORM_BID} sat"
          )


          # ==========================================================
          # DISCOVERY
          # ==========================================================

          payload = request(
              "GET",
              (
                  "/marketplace/tasks"
                  "?status=open"
                  "&sort=new"
                  f"&limit={MAX_TASKS}"
                  "&offset=0"
              ),
              token=token
          )

          tasks = items(
              payload,
              (
                  "tasks",
                  "items",
                  "data"
              )
          )[:MAX_TASKS]

          print(
              f"Marketplace tasks observed: "
              f"{len(tasks)}"
          )


          candidates = []
          supply_count = 0
          unknown_count = 0


          for task in tasks:
              if not isinstance(
                  task,
                  dict
              ):
                  continue

              tid = task_id(task)

              if not tid:
                  continue

              listing_type = classify(task)

              if listing_type == "supply":
                  supply_count += 1

                  print(
                      f"SKIP SUPPLY: {tid} -> "
                      f"{title(task)[:100]}"
                  )

                  continue

              if listing_type == "unknown":
                  unknown_count += 1

              lower, upper, source = (
                  budget_bounds(task)
              )

              task_score, reasons = score(
                  task,
                  core,
                  knowledge
              )

              if task_score <= 0:
                  continue

              candidates.append(
                  {
                      "task": task,
                      "task_id": tid,
                      "title": title(task),
                      "listing_type": listing_type,
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": source,
                      "score": task_score,
                      "reasons": reasons
                  }
              )


          candidates.sort(
              key=lambda x: (
                  -x["score"],
                  -(
                      x["budget_max_sats"]
                      if x["budget_max_sats"] is not None
                      else 0
                  )
              )
          )


          print(
              f"Relevant demand candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Supply listings skipped: "
              f"{supply_count}"
          )

          print(
              f"Unknown listing types: "
              f"{unknown_count}"
          )


          # ==========================================================
          # TRACK + DIAGNOSE
          # ==========================================================

          tracked_only = 0

          for candidate in candidates:
              lower = candidate[
                  "budget_min_sats"
              ]

              upper = candidate[
                  "budget_max_sats"
              ]

              source = candidate[
                  "budget_source"
              ]

              if lower is None:
                  status = "tracked_no_bid"
                  reason = "no_reliable_budget"
                  tracked_only += 1

              elif upper is not None and lower > upper:
                  status = "tracked_no_bid"
                  reason = "invalid_budget_range"
                  tracked_only += 1

              elif upper < MIN_PLATFORM_BID:
                  status = "tracked_no_bid"
                  reason = "budget_below_platform_floor"
                  tracked_only += 1

              else:
                  status = "bid_possible"
                  reason = None

              print(
                  "OPPORTUNITY: "
                  f"{candidate['task_id']} | "
                  f"{candidate['title'][:90]} | "
                  f"budget={lower}-{upper} | "
                  f"source={source} | "
                  f"status={status}"
              )

              action["opportunities"].append(
                  {
                      "task_id": candidate["task_id"],
                      "title": candidate["title"],
                      "listing_type": candidate[
                          "listing_type"
                      ],
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": source,
                      "score": candidate["score"],
                      "reasons": candidate["reasons"],
                      "status": status,
                      "bid_reason": reason,
                      "tip_potential": True,
                      "observed_at": now()
                  }
              )


          # ==========================================================
          # BID
          # ==========================================================

          submitted = 0
          skipped = 0
          errors = 0
          bid_checks = 0
          reconciled = 0


          for candidate in candidates:
              if submitted >= MAX_BIDS:
                  break

              if bid_checks >= MAX_BID_CHECKS:
                  print(
                      "BID CHECK LIMIT reached."
                  )
                  break

              lower = candidate[
                  "budget_min_sats"
              ]

              upper = candidate[
                  "budget_max_sats"
              ]

              if lower is None:
                  continue

              if upper is None:
                  upper = lower

              if lower > upper:
                  continue

              if upper < MIN_PLATFORM_BID:
                  continue

              amount = max(
                  lower,
                  MIN_PLATFORM_BID
              )

              if amount > upper:
                  continue

              tid = candidate[
                  "task_id"
              ]

              bid_checks += 1

              try:
                  if has_own_bid(
                      token,
                      tid,
                      username
                  ):
                      print(
                          f"BID SKIP: already submitted -> "
                          f"{tid}"
                      )

                      skipped += 1
                      continue

              except Exception as exc:
                  print(
                      f"BID CHECK ERROR: "
                      f"{tid}: {exc}"
                  )

                  skipped += 1
                  continue


              description = (
                  "NØX can contribute to this task "
                  "with an evidence-first and "
                  "reproducible workflow. "
                  "Relevant capabilities: "
                  +
                  ", ".join(
                      candidate["reasons"][:6]
                  )
                  +
                  ". Delivery will clearly separate "
                  "verified results from uncertainty."
              )


              print(
                  f"BID ATTEMPT: {tid} | "
                  f"amount={amount} sat | "
                  f"budget={lower}-{upper}"
              )


              try:
                  result = request(
                      "POST",
                      (
                          "/marketplace/"
                          +
                          urllib.parse.quote(
                              tid,
                              safe=""
                          )
                          +
                          "/bid"
                      ),
                      token=token,
                      body={
                          "amount_sats": amount,
                          "description": description
                      }
                  )

                  submitted += 1

                  bid_record = {
                      "task_id": tid,
                      "amount_sats": amount,
                      "budget_min_sats": lower,
                      "budget_max_sats": upper,
                      "budget_source": candidate[
                          "budget_source"
                      ],
                      "status": "submitted",
                      "submitted_at": now()
                  }

                  if isinstance(
                      result,
                      dict
                  ):
                      for key in (
                          "id",
                          "bid_id"
                      ):
                          if result.get(key):
                              bid_record[
                                  "bid_id"
                              ] = str(
                                  result[key]
                              )
                              break

                  action["bids"].append(
                      bid_record
                  )

                  print(
                      f"BID SUCCESS: {tid} "
                      f"amount={amount} sat"
                  )

              except Exception as exc:
                  errors += 1

                  print(
                      f"BID ERROR: {tid}: {exc}"
                  )

                  action["bids"].append(
                      {
                          "task_id": tid,
                          "amount_sats": amount,
                          "status": "error",
                          "error": str(exc),
                          "observed_at": now()
                      }
                  )


          # ==========================================================
          # RECONCILIATION
          # ==========================================================

          for bid in action["bids"][-MAX_BID_CHECKS:]:
              tid = str(
                  bid.get(
                      "task_id",
                      ""
                  )
              )

              if not tid:
                  continue

              if bid.get("status") == "error":
                  continue

              try:
                  encoded = urllib.parse.quote(
                      tid,
                      safe=""
                  )

                  payload = request(
                      "GET",
                      f"/marketplace/{encoded}/bids",
                      token=token
                  )

                  remote_bids = items(
                      payload,
                      (
                          "bids",
                          "items",
                          "data"
                      )
                  )

                  for remote in remote_bids:
                      if not isinstance(
                          remote,
                          dict
                      ):
                          continue

                      mine = (
                          remote.get(
                              "is_mine"
                          ) is True
                          or remote.get(
                              "mine"
                          ) is True
                          or str(
                              remote.get(
                                  "username",
                                  ""
                              )
                          ).lower()
                          == username.lower()
                          or str(
                              remote.get(
                                  "bidder",
                                  ""
                              )
                          ).lower()
                          == username.lower()
                      )

                      if not mine:
                          continue

                      status = (
                          remote.get(
                              "status"
                          )
                          or remote.get(
                              "state"
                          )
                      )

                      if status:
                          bid[
                              "latest_status"
                          ] = str(status)

                      bid[
                          "last_checked"
                      ] = now()

                      reconciled += 1
                      break

              except Exception as exc:
                  print(
                      f"RECONCILE ERROR {tid}: {exc}"
                  )


          # ==========================================================
          # LEARNING
          # ==========================================================

          if submitted > 0:
              learning = (
                  "NØX identified actionable "
                  "marketplace demand and submitted "
                  "traceable bids."
              )

          elif candidates:
              learning = (
                  "NØX identified marketplace "
                  "opportunities but no bid was "
                  "submitted; constraints were "
                  "recorded for the next cognitive cycle."
              )

          else:
              learning = (
                  "No relevant marketplace opportunity "
                  "was identified during this run."
              )

          action["learnings"].append(
              {
                  "timestamp": now(),
                  "summary": learning,
                  "tasks_observed": len(tasks),
                  "candidates": len(candidates),
                  "bids_submitted": submitted,
                  "tracked_only": tracked_only
              }
          )


          # ==========================================================
          # RUN LEDGER
          # ==========================================================

          action["runs"].append(
              {
                  "run_at": now(),
                  "tasks_observed": len(tasks),
                  "candidates": len(candidates),
                  "supply_skipped": supply_count,
                  "unknown_listing_types": unknown_count,
                  "bids_submitted": submitted,
                  "bids_skipped": skipped,
                  "bid_errors": errors,
                  "reconciled_bids": reconciled,
                  "tracked_only": tracked_only,
                  "policy": {
                      "project_cost_eur": 0,
                      "gemini_used": False,
                      "external_ai_used": False,
                      "auto_payment": False,
                      "auto_spending": False
                  }
              }
          )


          # ==========================================================
          # RETENTION
          # ==========================================================

          action["opportunities"] = (
              action["opportunities"][-MAX_TRACKED:]
          )

          action["bids"] = (
              action["bids"][-MAX_TRACKED:]
          )

          action["runs"] = (
              action["runs"][-100:]
          )

          action["learnings"] = (
              action["learnings"][-100:]
          )

          action["version"] = 3
          action["last_run"] = now()


          # ==========================================================
          # SAVE
          # ==========================================================

          save(
              ACTION_MEMORY_FILE,
              action
          )


          # ==========================================================
          # SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX ACTION / OPPORTUNITIES SUMMARY ==="
          )

          print(
              f"Tasks observed: {len(tasks)}"
          )

          print(
              f"Demand candidates: {len(candidates)}"
          )

          print(
              f"Supply skipped: {supply_count}"
          )

          print(
              f"Bids submitted: {submitted}"
          )

          print(
              f"Bids skipped: {skipped}"
          )

          print(
              f"Bid errors: {errors}"
          )

          print(
              f"Bids reconciled: {reconciled}"
          )

          print(
              f"Tracked without bid: {tracked_only}"
          )

          print(
              "No automatic payment or spending performed."
          )

          print(
              "No Gemini or external AI used."
          )

          print(
              "=== NØX ACTION / OPPORTUNITIES TERMINÉ ==="
          )
          PY

      - name: Commit action memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

          git add memory/nox_action_opportunities.json

          if git diff --cached --quiet; then
            echo "No action-memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update action and opportunities memory"
          git push
