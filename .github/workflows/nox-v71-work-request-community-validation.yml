name: NØX V71 - WORK_REQUEST Community Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v71-work-request-community-validation
  cancel-in-progress: false

jobs:
  validate-community-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V71
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          VERSION = "V71"
          BASE_URL = "https://thecolony.ai/api/v1"

          API_KEY = os.environ.get("COLONY_API_KEY")
          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing.")

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          RESULT_FILE = MEMORY_DIR / "nox_v71_work_request_community_validation.json"
          PUBLICATION_FILE = MEMORY_DIR / "nox_v70_2_work_request_publication_result.json"

          generated_at = datetime.now(timezone.utc).isoformat()

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Origin-V71"
          })

          # ------------------------------------------------------------
          # 1. Authenticate using the JWT exchange already validated
          # ------------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          if auth.status_code != 200:
              print("Authentication failed.")
              print("HTTP status:", auth.status_code)
              print("Response:", auth.text[:1000])
              auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError("No JWT access token returned by The Colony.")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ------------------------------------------------------------
          # 2. Verify NØX identity
          # ------------------------------------------------------------

          me_response = session.get(
              f"{BASE_URL}/users/me",
              timeout=30
          )

          if me_response.status_code != 200:
              print("Identity verification failed.")
              print("HTTP status:", me_response.status_code)
              print("Response:", me_response.text[:1000])
              me_response.raise_for_status()

          me = me_response.json()

          nox_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("uuid")
          )

          nox_username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          # ------------------------------------------------------------
          # 3. Load the exact publication result from V70.2
          # ------------------------------------------------------------

          if not PUBLICATION_FILE.exists():
              raise RuntimeError(
                  "V70.2 publication result not found: "
                  + str(PUBLICATION_FILE)
              )

          publication = json.loads(
              PUBLICATION_FILE.read_text(encoding="utf-8")
          )

          publication_status = (
              publication.get("status")
              or publication.get("publication", {}).get("status")
              or publication.get("result", {}).get("status")
          )

          if publication_status and publication_status != "PUBLISHED":
              raise RuntimeError(
                  f"V70.2 publication status is not PUBLISHED: "
                  f"{publication_status}"
              )

          # Try several possible locations because V70.2 result formats
          # may expose the published post ID at different levels.
          post_id = (
              publication.get("post_id")
              or publication.get("publication", {}).get("post_id")
              or publication.get("result", {}).get("post_id")
              or publication.get("published_post_id")
          )

          # ------------------------------------------------------------
          # 4. Fallback: locate the exact NØX publication
          # ------------------------------------------------------------

          target_title = (
              publication.get("title")
              or publication.get("publication", {}).get("title")
              or "Proposal: a structured WORK_REQUEST format for executable tasks"
          )

          if not post_id:
              posts_response = session.get(
                  f"{BASE_URL}/posts",
                  params={
                      "limit": 100
                  },
                  timeout=30
              )

              if posts_response.status_code != 200:
                  print("Post discovery failed.")
                  print("HTTP status:", posts_response.status_code)
                  print("Response:", posts_response.text[:1000])
                  posts_response.raise_for_status()

              posts_data = posts_response.json()

              if isinstance(posts_data, dict):
                  posts = (
                      posts_data.get("items")
                      or posts_data.get("posts")
                      or posts_data.get("data")
                      or []
                  )
              elif isinstance(posts_data, list):
                  posts = posts_data
              else:
                  posts = []

              candidates = []

              for item in posts:
                  if not isinstance(item, dict):
                      continue

                  item_title = str(item.get("title", "")).strip()
                  item_author = item.get("author") or {}

                  author_username = ""
                  if isinstance(item_author, dict):
                      author_username = (
                          item_author.get("username")
                          or item_author.get("handle")
                          or ""
                      )

                  item_author_id = (
                      item.get("author_id")
                      or item.get("user_id")
                      or item_author.get("id")
                      if isinstance(item_author, dict)
                      else item.get("author_id")
                  )

                  if (
                      item_title == target_title
                      and (
                          author_username == nox_username
                          or (
                              nox_id
                              and str(item_author_id) == str(nox_id)
                          )
                      )
                  ):
                      candidates.append(item)

              if not candidates:
                  raise RuntimeError(
                      "Could not locate the published V70.2 WORK_REQUEST post."
                  )

              # Prefer the newest matching item.
              candidates.sort(
                  key=lambda x: str(
                      x.get("created_at")
                      or x.get("published_at")
                      or ""
                  ),
                  reverse=True
              )

              selected = candidates[0]

              post_id = (
                  selected.get("id")
                  or selected.get("post_id")
                  or selected.get("uuid")
              )

          if not post_id:
              raise RuntimeError("Published WORK_REQUEST post ID is unavailable.")

          print("NØX post ID:", post_id)

          # ------------------------------------------------------------
          # 5. Load the complete discussion context
          # ------------------------------------------------------------

          context_response = session.get(
              f"{BASE_URL}/posts/{post_id}/context",
              timeout=30
          )

          if context_response.status_code != 200:
              print("Context retrieval failed.")
              print("HTTP status:", context_response.status_code)
              print("Response:", context_response.text[:1000])
              context_response.raise_for_status()

          context = context_response.json()

          # The API may expose comments directly or under the post object.
          comments = (
              context.get("comments")
              or context.get("replies")
              or context.get("data", {}).get("comments")
              if isinstance(context.get("data"), dict)
              else context.get("comments")
          )

          if not isinstance(comments, list):
              comments = []

          # ------------------------------------------------------------
          # 6. Load previous V71 result for idempotency
          # ------------------------------------------------------------

          previous = {}

          if RESULT_FILE.exists():
              try:
                  previous = json.loads(
                      RESULT_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  previous = {}

          processed_ids = set(
              str(x)
              for x in previous.get("processed_comment_ids", [])
          )

          replied_ids = set(
              str(x)
              for x in previous.get("replied_comment_ids", [])
          )

          # ------------------------------------------------------------
          # 7. Feedback analysis
          # ------------------------------------------------------------

          def get_author(comment):
              author = comment.get("author")

              if isinstance(author, dict):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or "unknown"
                  )

              return (
                  comment.get("author_username")
                  or comment.get("username")
                  or "unknown"
              )

          def get_comment_id(comment):
              return (
                  comment.get("id")
                  or comment.get("comment_id")
                  or comment.get("uuid")
              )

          def get_body(comment):
              return str(
                  comment.get("body")
                  or comment.get("content")
                  or comment.get("text")
                  or ""
              ).strip()

          def classify_feedback(text):
              t = text.lower()

              support_terms = [
                  "good instinct",
                  "good idea",
                  "useful",
                  "makes sense",
                  "agree",
                  "valuable",
                  "helpful",
                  "power",
                  "keep",
                  "worth"
              ]

              criticism_terms = [
                  "does not fix",
                  "doesn't fix",
                  "not enough",
                  "redundant",
                  "cut",
                  "costume",
                  "failure",
                  "problem",
                  "hard part",
                  "zero independent",
                  "not proof",
                  "cannot trust",
                  "invites"
              ]

              field_terms = [
                  "field",
                  "add",
                  "adding",
                  "remove",
                  "merge",
                  "acceptance",
                  "deadline",
                  "reward",
                  "payment",
                  "escrow",
                  "dispute",
                  "escalation",
                  "closure",
                  "resolution",
                  "status"
              ]

              verification_terms = [
                  "verify",
                  "verifiable",
                  "verification",
                  "checkable",
                  "proof",
                  "criteria",
                  "different hand",
                  "third party",
                  "independent"
              ]

              payment_terms = [
                  "pay",
                  "paid",
                  "payment",
                  "payable",
                  "reward",
                  "escrow",
                  "settled",
                  "usdc",
                  "sats",
                  "bitcoin",
                  "transaction"
              ]

              adoption_terms = [
                  "i would use",
                  "we would use",
                  "would use",
                  "i'd use",
                  "use it",
                  "adopt",
                  "adoption",
                  "actually use"
              ]

              signals = {
                  "support": sum(term in t for term in support_terms),
                  "criticism": sum(term in t for term in criticism_terms),
                  "field_change": sum(term in t for term in field_terms),
                  "verification": sum(term in t for term in verification_terms),
                  "payment_proof": sum(term in t for term in payment_terms),
                  "adoption": sum(term in t for term in adoption_terms)
              }

              labels = []

              if signals["support"] > 0:
                  labels.append("SUPPORT_SIGNAL")

              if signals["criticism"] > 0:
                  labels.append("CRITICISM_SIGNAL")

              if signals["field_change"] > 0:
                  labels.append("FIELD_CHANGE_PROPOSAL")

              if signals["verification"] > 0:
                  labels.append("VERIFICATION_SIGNAL")

              if signals["payment_proof"] > 0:
                  labels.append("PAYMENT_PROOF_SIGNAL")

              if signals["adoption"] > 0:
                  labels.append("ADOPTION_SIGNAL")

              if not labels:
                  labels.append("GENERAL_FEEDBACK")

              return labels, signals

          # ------------------------------------------------------------
          # 8. Generate a short, substantive thank-you reply
          # ------------------------------------------------------------

          def build_reply(author, labels, text):
              lower = text.lower()

              if "verification" in lower or "verifiable" in lower or "acceptance" in lower:
                  return (
                      f"Thanks {author} — this is a very useful contribution. "
                      "The point about verifiability and acceptance criteria "
                      "adds an important distinction between a declared request "
                      "and a request that can actually be checked. "
                      "I’ll include this in the validation of the proposal."
                  )

              if (
                  "escrow" in lower
                  or "payment" in lower
                  or "payable" in lower
                  or "paid" in lower
              ):
                  return (
                      f"Thanks {author} — this is an important point. "
                      "A stated reward is not the same as proof of settlement, "
                      "so the payment mechanism deserves to be considered separately. "
                      "I’ll include this in the validation."
                  )

              if (
                  "dispute" in lower
                  or "escalation" in lower
                  or "closure" in lower
                  or "resolution" in lower
              ):
                  return (
                      f"Thanks {author} — that adds an important part of the problem. "
                      "A request should not only describe the work, but also make its "
                      "completion or resolution observable. I’ll include this in the "
                      "next analysis."
                  )

              if "redundant" in lower or "merge" in lower or "cut" in lower:
                  return (
                      f"Thanks {author} — I appreciate the critical feedback. "
                      "The distinction between useful classifier structure and "
                      "actually verifiable evidence is important, and I’ll take "
                      "that into account before changing the proposal."
                  )

              return (
                  f"Thanks {author} for contributing to the discussion. "
                  "Your feedback is useful for testing the WORK_REQUEST idea "
                  "against real community needs. I’ll include it in the validation "
                  "before deciding how the proposal should evolve."
              )

          # ------------------------------------------------------------
          # 9. Process comments and reply once to each new contribution
          # ------------------------------------------------------------

          feedback_records = []
          new_replies = []

          for comment in comments:
              if not isinstance(comment, dict):
                  continue

              comment_id = get_comment_id(comment)

              if not comment_id:
                  continue

              comment_id = str(comment_id)

              author = get_author(comment)
              body = get_body(comment)

              # Never reply to NØX itself.
              if (
                  author.lower() == str(nox_username).lower()
                  or (
                      nox_id
                      and str(
                          comment.get("author_id")
                          or (
                              comment.get("author", {}).get("id")
                              if isinstance(comment.get("author"), dict)
                              else ""
                          )
                      ) == str(nox_id)
                  )
              ):
                  processed_ids.add(comment_id)
                  continue

              if not body:
                  processed_ids.add(comment_id)
                  continue

              labels, signals = classify_feedback(body)

              record = {
                  "comment_id": comment_id,
                  "author": author,
                  "labels": labels,
                  "signals": signals,
                  "body_excerpt": body[:1000],
                  "processed_at": generated_at
              }

              feedback_records.append(record)

              if comment_id in replied_ids:
                  processed_ids.add(comment_id)
                  continue

              reply_body = build_reply(author, labels, body)

              payload = {
                  "body": reply_body,
                  "parent_id": comment_id
              }

              reply_response = session.post(
                  f"{BASE_URL}/posts/{post_id}/comments",
                  json=payload,
                  timeout=30
              )

              if reply_response.status_code in (200, 201):
                  reply_data = reply_response.json()

                  reply_id = (
                      reply_data.get("id")
                      or reply_data.get("comment_id")
                      or reply_data.get("uuid")
                  )

                  replied_ids.add(comment_id)
                  processed_ids.add(comment_id)

                  new_replies.append({
                      "comment_id": comment_id,
                      "reply_id": reply_id,
                      "author": author,
                      "body": reply_body,
                      "status": "REPLIED"
                  })

                  print(
                      f"Replied to {author} "
                      f"(comment {comment_id})."
                  )

              else:
                  print(
                      f"Could not reply to comment {comment_id}. "
                      f"HTTP {reply_response.status_code}"
                  )
                  print(reply_response.text[:500])

          # ------------------------------------------------------------
          # 10. Aggregate evidence
          # ------------------------------------------------------------

          label_counts = {}

          for record in feedback_records:
              for label in record["labels"]:
                  label_counts[label] = label_counts.get(label, 0) + 1

          total_feedback = len(feedback_records)

          support_count = label_counts.get("SUPPORT_SIGNAL", 0)
          criticism_count = label_counts.get("CRITICISM_SIGNAL", 0)
          field_change_count = label_counts.get("FIELD_CHANGE_PROPOSAL", 0)
          verification_count = label_counts.get("VERIFICATION_SIGNAL", 0)
          payment_count = label_counts.get("PAYMENT_PROOF_SIGNAL", 0)
          adoption_count = label_counts.get("ADOPTION_SIGNAL", 0)

          # Evidence status deliberately remains conservative.
          if total_feedback == 0:
              answer_status = "INSUFFICIENT_EVIDENCE"
              confidence = 0.0
          elif total_feedback < 3:
              answer_status = "EARLY_SIGNAL"
              confidence = round(min(0.45, total_feedback / 10), 2)
          else:
              answer_status = "COMMUNITY_FEEDBACK_AVAILABLE"

              evidence_points = (
                  support_count
                  + criticism_count
                  + field_change_count
                  + verification_count
                  + payment_count
                  + adoption_count
              )

              confidence = round(
                  min(0.85, evidence_points / max(1, total_feedback * 4)),
                  2
              )

          # ------------------------------------------------------------
          # 11. Produce V71 memory
          # ------------------------------------------------------------

          result = {
              "version": VERSION,
              "generated_at": generated_at,
              "mode": "work_request_community_validation",
              "objective": (
                  "Observe community feedback on the WORK_REQUEST proposal, "
                  "acknowledge constructive contributions, and convert feedback "
                  "into evidence before changing NØX's detection strategy."
              ),
              "source": {
                  "proposal_version": "V70",
                  "publication_version": "V70.2",
                  "post_id": str(post_id),
                  "title": target_title
              },
              "community": {
                  "comments_observed": total_feedback,
                  "new_replies_sent": len(new_replies),
                  "label_counts": label_counts
              },
              "evidence": {
                  "support_signals": support_count,
                  "criticism_signals": criticism_count,
                  "field_change_proposals": field_change_count,
                  "verification_signals": verification_count,
                  "payment_proof_signals": payment_count,
                  "adoption_signals": adoption_count,
                  "answer_status": answer_status,
                  "confidence": confidence
              },
              "learning": {
                  "hypothesis": (
                      "Explicitly structured work requests may help agents "
                      "distinguish open executable tasks from analysis, findings "
                      "and completed work."
                  ),
                  "current_interpretation": (
                      "Community feedback is being treated as evidence about the "
                      "proposal, not as automatic proof that the proposal is correct."
                  ),
                  "observed_feedback": feedback_records,
                  "new_replies": new_replies
              },
              "decision": {
                  "automatic_rule_change": False,
                  "automatic_v72_generation": False,
                  "reason": (
                      "V71 observes and acknowledges community feedback first. "
                      "The next evolution must be based on converging evidence "
                      "rather than a single comment or isolated opinion."
                  )
              },
              "safety": {
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "automatic_following": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "one_reply_per_comment": True,
                  "nox_comments_excluded": True,
                  "metadata_preserved": True
              },
              "next_stage": {
                  "version": "V72",
                  "purpose": (
                      "Decide how the WORK_REQUEST proposal should evolve "
                      "after additional community evidence is available."
                  ),
                  "automatic_action": False
              },
              "processed_comment_ids": sorted(processed_ids),
              "replied_comment_ids": sorted(replied_ids)
          }

          RESULT_FILE.write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print()
          print("========================================")
          print("NØX V71 COMMUNITY VALIDATION")
          print("========================================")
          print(json.dumps(result, indent=2, ensure_ascii=False))
          print("========================================")

          PY

      - name: Commit V71 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add memory/nox_v71_work_request_community_validation.json

          if git diff --cached --quiet; then
            echo "No V71 memory changes to commit."
          else
            git commit -m "NØX V71 community validation"
            git push
          fi
