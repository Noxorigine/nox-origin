name: NØX LEDGER 01 - Knowledge & Autonomous Research

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Optional research query"
        required: false
        type: string
        default: ""
      force_research:
        description: "Force external research"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "07 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  knowledge-research:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      INPUT_QUERY: ${{ inputs.query }}
      INPUT_FORCE_RESEARCH: ${{ inputs.force_research }}

      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json

      MAX_FEED_ITEMS: "30"
      MAX_RESEARCH_QUERIES: "3"
      MAX_WEB_RESULTS: "5"
      MAX_SOURCE_CHARS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run LEDGER 01
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import html
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from html.parser import HTMLParser

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]
          FILE = Path(os.environ["KNOWLEDGE_FILE"])

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_QUERIES = int(os.environ["MAX_RESEARCH_QUERIES"])
          MAX_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          MAX_SOURCE_CHARS = int(os.environ["MAX_SOURCE_CHARS"])

          FORCE_RESEARCH = (
              os.getenv(
                  "INPUT_FORCE_RESEARCH",
                  "false"
              ).lower() == "true"
          )

          MANUAL_QUERY = os.getenv(
              "INPUT_QUERY",
              ""
          ).strip()

          now = datetime.now(
              timezone.utc
          ).isoformat()

          # =========================================================
          # JSON HELPERS
          # =========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"WARNING: unable to load "
                      f"{path}: {exc}"
                  )
                  return default

          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          memory = load_json(
              FILE,
              {
                  "version": "1.0",
                  "updated_at": None,
                  "knowledge": [],
                  "research_runs": [],
                  "attention": [],
                  "gaps": [],
                  "stats": {}
              }
          )

          # Ensure expected structures exist even if an older
          # or partially written file is encountered.
          if not isinstance(
              memory.get("knowledge"),
              list
          ):
              memory["knowledge"] = []

          if not isinstance(
              memory.get("research_runs"),
              list
          ):
              memory["research_runs"] = []

          if not isinstance(
              memory.get("attention"),
              list
          ):
              memory["attention"] = []

          if not isinstance(
              memory.get("gaps"),
              list
          ):
              memory["gaps"] = []

          # =========================================================
          # HTTP SESSION
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {KEY}",
              "Accept": "application/json",
              "User-Agent": (
                  "NOX-Ledger-Research/1.0"
              )
          })

          def authenticate():
              try:
                  response = session.post(
                      BASE + "/api/v1/auth/token",
                      json={
                          "api_key": KEY
                      },
                      timeout=15
                  )

                  if response.ok:
                      data = response.json()

                      token = data.get(
                          "access_token"
                      )

                      if token:
                          session.headers[
                              "Authorization"
                          ] = f"Bearer {token}"

                          return True

              except Exception as exc:
                  print(
                      f"AUTH ERROR: {exc}"
                  )

              return False

          def get(path, params=None, timeout=20):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=timeout
                  )

                  if response.status_code == 401:
                      if authenticate():
                          response = session.get(
                              BASE + path,
                              params=params,
                              timeout=timeout
                          )

                  if response.ok:
                      return response.json()

                  print(
                      f"GET {path}: "
                      f"HTTP {response.status_code}"
                  )

              except Exception as exc:
                  print(
                      f"GET ERROR {path}: {exc}"
                  )

              return None

          authenticate()

          # =========================================================
          # TEXT HELPERS
          # =========================================================

          def text_of(value):
              if isinstance(value, str):
                  return value

              if isinstance(value, dict):
                  return " ".join(
                      text_of(v)
                      for v in value.values()
                  )

              if isinstance(value, list):
                  return " ".join(
                      text_of(v)
                      for v in value
                  )

              return str(value or "")

          def tokens(text):
              ignored = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "about",
                  "what",
                  "which",
                  "their",
                  "there",
                  "would",
                  "could",
                  "agent",
                  "agents",
                  "nox"
              }

              return {
                  token.lower()
                  for token in re.findall(
                      r"[A-Za-zÀ-ÿ0-9_]{4,}",
                      text
                  )
                  if token.lower()
                  not in ignored
              }

          def fingerprint(text):
              normalized = " ".join(
                  text.lower().split()
              )

              return hashlib.sha256(
                  normalized.encode(
                      "utf-8"
                  )
              ).hexdigest()[:20]

          # =========================================================
          # IDENTITY
          # =========================================================

          me = get(
              "/api/v1/users/me"
          ) or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          print(
              f"IDENTITY: {username}"
          )

          # =========================================================
          # COLONY ATTENTION
          # =========================================================

          feed = get(
              "/api/v1/feed/for-you",
              {"limit": MAX_FEED}
          ) or {}

          suggestions = get(
              "/api/v1/suggestions",
              {"limit": 20}
          ) or {}

          if isinstance(feed, dict):
              feed_items = feed.get(
                  "items",
                  feed.get("posts", [])
              )
          else:
              feed_items = feed

          if isinstance(
              suggestions,
              dict
          ):
              suggestion_items = suggestions.get(
                  "items",
                  suggestions.get("suggestions", [])
              )
          else:
              suggestion_items = suggestions

          if not isinstance(
              feed_items,
              list
          ):
              feed_items = []

          if not isinstance(
              suggestion_items,
              list
          ):
              suggestion_items = []

          attention = []

          for item in feed_items:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              raw = text_of(item)
              low = raw.lower()

              score = 0

              if any(
                  keyword in low
                  for keyword in [
                      "research",
                      "evidence",
                      "knowledge",
                      "marketplace",
                      "task",
                      "agent",
                      "autonomy",
                      "lightning",
                      "colony",
                      "reputation",
                      "trust"
                  ]
              ):
                  score += 20

              if any(
                  keyword in low
                  for keyword in [
                      "question",
                      "problem",
                      "how",
                      "why",
                      "looking for",
                      "need help",
                      "unclear"
                  ]
              ):
                  score += 15

              if len(raw) > 500:
                  score += 5

              if len(raw) > 1500:
                  score += 5

              if score >= 20:
                  attention.append({
                      "score": score,
                      "content": raw[:3000],
                      "id": item.get("id"),
                      "kind": "feed"
                  })

          for item in suggestion_items:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              raw = text_of(item)

              if any(
                  keyword in raw.lower()
                  for keyword in [
                      "question",
                      "research",
                      "reply",
                      "claim",
                      "task",
                      "evidence"
                  ]
              ):
                  attention.append({
                      "score": 25,
                      "content": raw[:3000],
                      "id": item.get("id"),
                      "kind": "suggestion"
                  })

          attention.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          attention = attention[:10]

          print(
              f"ATTENTION ITEMS: "
              f"{len(attention)}"
          )

          # =========================================================
          # RESEARCH QUERY GENERATION
          # =========================================================

          queries = []

          # Manual query has priority.
          if MANUAL_QUERY:
              queries.append(
                  MANUAL_QUERY
              )

          # Convert high-attention Colony signals
          # into research questions.
          for item in attention:

              item_tokens = list(
                  tokens(
                      item["content"]
                  )
              )

              if item_tokens:
                  query = " ".join(
                      item_tokens[:8]
                  )

                  queries.append(
                      query
                  )

          # Strategic baseline research.
          queries.extend([
              (
                  "AI agents marketplace tasks "
                  "reputation evidence autonomous agents"
              ),
              (
                  "The Colony AI agents "
                  "marketplace tasks bids tips"
              )
          ])

          unique_queries = []
          seen_queries = set()

          for query in queries:

              query = " ".join(
                  query.split()
              ).strip()

              if not query:
                  continue

              key = query.lower()

              if key in seen_queries:
                  continue

              seen_queries.add(key)
              unique_queries.append(
                  query
              )

          # Manual/forced research gets the configured maximum.
          # Normal scheduled runs stay lightweight.
          if (
              not FORCE_RESEARCH
              and not MANUAL_QUERY
          ):
              unique_queries = unique_queries[:2]
          else:
              unique_queries = unique_queries[
                  :MAX_QUERIES
              ]

          print(
              f"RESEARCH QUERIES: "
              f"{len(unique_queries)}"
          )

          for index, query in enumerate(
              unique_queries,
              start=1
          ):
              print(
                  f"QUERY {index}: {query}"
              )

          # =========================================================
          # HTML PARSER
          # =========================================================

          class PageParser(
              HTMLParser
          ):
              def __init__(self):
                  super().__init__()

                  self.parts = []
                  self.skip_depth = 0

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):
                  if tag.lower() in {
                      "script",
                      "style",
                      "noscript",
                      "svg"
                  }:
                      self.skip_depth += 1

              def handle_endtag(
                  self,
                  tag
              ):
                  if tag.lower() in {
                      "script",
                      "style",
                      "noscript",
                      "svg"
                  }:
                      self.skip_depth = max(
                          0,
                          self.skip_depth - 1
                      )

              def handle_data(
                  self,
                  data
              ):
                  if self.skip_depth:
                      return

                  value = " ".join(
                      data.split()
                  )

                  if value:
                      self.parts.append(
                          value
                      )

          # =========================================================
          # WEB PAGE FETCH
          # =========================================================

          def fetch_page(url):
              try:
                  response = requests.get(
                      url,
                      timeout=15,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "Nox-Ledger-Research/1.0"
                          )
                      }
                  )

                  if not response.ok:
                      return ""

                  parser = PageParser()

                  parser.feed(
                      response.text
                  )

                  text = " ".join(
                      parser.parts
                  )

                  return text[
                      :MAX_SOURCE_CHARS
                  ]

              except Exception as exc:
                  print(
                      f"SOURCE FETCH ERROR "
                      f"{url}: {exc}"
                  )

                  return ""

          # =========================================================
          # DUCKDUCKGO SEARCH
          # =========================================================

          research_results = []

          for query in unique_queries:

              print(
                  f"RESEARCH: {query}"
              )

              search_url = (
                  "https://html.duckduckgo.com/"
                  "html/?q="
                  + quote(query)
              )

              try:
                  response = requests.get(
                      search_url,
                      timeout=20,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "Nox-Ledger-Research/1.0"
                          )
                      }
                  )

                  search_html = (
                      response.text
                      if response.ok
                      else ""
                  )

              except Exception as exc:
                  print(
                      f"SEARCH ERROR: {exc}"
                  )

                  search_html = ""

              links = re.findall(
                  r'class="result__a"'
                  r'[^>]+href="([^"]+)"'
                  r'[^>]*>(.*?)</a>',
                  search_html,
                  re.I | re.S
              )

              if not links:
                  print(
                      "No search results."
                  )

              for raw_url, raw_title in links[
                  :MAX_RESULTS
              ]:

                  title = re.sub(
                      r"<.*?>",
                      "",
                      raw_title
                  )

                  title = html.unescape(
                      " ".join(
                          title.split()
                      )
                  )

                  url = html.unescape(
                      raw_url
                  )

                  if url.startswith("//"):
                      url = "https:" + url

                  parsed = urlparse(
                      url
                  )

                  if parsed.scheme not in {
                      "http",
                      "https"
                  }:
                      continue

                  source_text = fetch_page(
                      url
                  )

                  if not source_text:
                      continue

                  result = {
                      "query": query,
                      "title": title[:300],
                      "url": url[:1000],
                      "domain": parsed.netloc,
                      "excerpt": source_text[:1800],
                      "fingerprint": fingerprint(
                          title
                          + url
                          + source_text[:1000]
                      )
                  }

                  research_results.append(
                      result
                  )

                  time.sleep(
                      0.4
                  )

          print(
              f"WEB SOURCES FOUND: "
              f"{len(research_results)}"
          )

          # =========================================================
          # KNOWLEDGE STORAGE
          # =========================================================

          existing_fingerprints = {
              item.get("fingerprint")
              for item in memory[
                  "knowledge"
              ]
                  if isinstance(
                      item,
                      dict
                  )
          }

          added = 0
          duplicates = 0

          for result in research_results:

              if (
                  result["fingerprint"]
                  in existing_fingerprints
              ):
                  duplicates += 1
                  continue

              entry = {
                  "id": (
                      "knowledge-"
                      + result["fingerprint"]
                  ),
                  "created_at": now,
                  "topic": result["query"],
                  "claim": result["title"],
                  "evidence": result["excerpt"],
                  "source_url": result["url"],
                  "source_domain": result["domain"],
                  "confidence": 0.55,
                  "status": (
                      "UNVERIFIED_EXTERNAL_SOURCE"
                  ),
                  "requires_cross_check": True,
                  "fingerprint": result[
                      "fingerprint"
                  ]
              }

              memory[
                  "knowledge"
              ].append(
                  entry
              )

              existing_fingerprints.add(
                  result["fingerprint"]
              )

              added += 1

          # Keep the knowledge store bounded.
          memory["knowledge"] = memory[
              "knowledge"
          ][-500:]

          # =========================================================
          # KNOWLEDGE GAPS
          # =========================================================

          new_gaps = []

          for item in attention:

              content = item[
                  "content"
              ]

              low = content.lower()

              if any(
                  keyword in low
                  for keyword in [
                      "why",
                      "how",
                      "unclear",
                      "unknown",
                      "does anyone know",
                      "looking for",
                      "need help",
                      "not sure"
                  ]
              ):
                  new_gaps.append({
                      "created_at": now,
                      "question": content[
                          :1000
                      ],
                      "status": "OPEN"
                  })

          memory["gaps"] = (
              memory.get(
                  "gaps",
                  []
              )
              + new_gaps
          )[-100:]

          # =========================================================
          # RESEARCH RUN RECORD
          # =========================================================

          memory[
              "research_runs"
          ] = (
              memory.get(
                  "research_runs",
                  []
              )
              + [{
                  "timestamp": now,
                  "queries": unique_queries,
                  "sources_found": len(
                      research_results
                  ),
                  "knowledge_added": added,
                  "duplicates": duplicates,
                  "forced": FORCE_RESEARCH,
                  "manual_query": bool(
                      MANUAL_QUERY
                  ),
                  "external_ai_used": False,
                  "gemini_used": False,
                  "project_cost_eur": 0
              }]
          )[-100:]

          # =========================================================
          # STATS
          # =========================================================

          open_gaps = [
              item
              for item in memory[
                  "gaps"
              ]
              if item.get(
                  "status"
              ) == "OPEN"
          ]

          memory[
              "attention"
          ] = attention

          memory[
              "updated_at"
          ] = now

          memory[
              "stats"
          ] = {
              "knowledge_entries": len(
                  memory["knowledge"]
              ),
              "open_gaps": len(
                  open_gaps
              ),
              "attention_items": len(
                  attention
              ),
              "research_queries": len(
                  unique_queries
              ),
              "research_sources_this_run": len(
                  research_results
              ),
              "knowledge_added_this_run": added,
              "duplicates_this_run": duplicates,
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0
          }

          save_json(
              FILE,
              memory
          )

          # =========================================================
          # DIAGNOSTIC
          # =========================================================

          print("")
          print(
              "================================"
          )
          print(
              "=== NØX LEDGER 01 COMPLETE ==="
          )
          print(
              "================================"
          )
          print(
              f"Identity: {username}"
          )
          print(
              f"Attention: {len(attention)}"
          )
          print(
              f"Research queries: "
              f"{len(unique_queries)}"
          )
          print(
              f"Web sources: "
              f"{len(research_results)}"
          )
          print(
              f"Knowledge added: {added}"
          )
          print(
              f"Duplicates: {duplicates}"
          )
          print(
              f"Knowledge total: "
              f"{len(memory['knowledge'])}"
          )
          print(
              f"Open gaps: "
              f"{len(open_gaps)}"
          )
          print(
              f"Manual query: "
              f"{'YES' if MANUAL_QUERY else 'NO'}"
          )
          print(
              f"Forced research: "
              f"{'YES' if FORCE_RESEARCH else 'NO'}"
          )
          print(
              "Gemini: False"
          )
          print(
              "External AI: False"
          )
          print(
              "Payments: False"
          )
          print(
              "Spending: False"
          )
          print(
              "Project cost: €0"
          )
          print(
              "================================"
          )
          PY

      - name: Commit knowledge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_ledger_knowledge.json

          if git diff --cached --quiet; then
            echo "No knowledge changes."
            exit 0
          fi

          git commit \
            -m "ledger01: update knowledge and research"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep 2
          done

          echo "Push failed after 3 attempts."
          exit 1
