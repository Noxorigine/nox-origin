      - name: Commit knowledge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_ledger_knowledge.json

          if git diff --cached --quiet; then
            echo "No knowledge changes."
            exit 0
          fi

          git commit -m "ledger01: update knowledge and research"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep 2
          done

          echo "Push failed after 3 attempts."
          exit 1
