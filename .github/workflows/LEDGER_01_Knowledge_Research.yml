name: NØX LEDGER 01 - Knowledge & Autonomous Research

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Optional research query"
        required: false
        type: string
        default: ""
      force_research:
        description: "Force external research"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "07 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  knowledge-research:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      INPUT_QUERY: ${{ inputs.query }}
      INPUT_FORCE_RESEARCH: ${{ inputs.force_research }}

      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json

      MAX_FEED_ITEMS: "30"
      MAX_RESEARCH_QUERIES: "3"
      MAX_WEB_RESULTS: "5"
      MAX_SOURCE_CHARS: "5000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX Knowledge & Autonomous Research
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          import re
          import hashlib
          import html
          import time
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import (
              parse_qs,
              unquote,
              urljoin,
              urlparse,
          )

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          COLONY_BASE_URL = os.getenv("COLONY_BASE_URL", "https://thecolony.ai").rstrip("/")
          API_KEY = os.getenv("COLONY_API_KEY", "").strip()

          KNOWLEDGE_FILE = os.getenv(
              "KNOWLEDGE_FILE",
              "memory/nox_ledger_knowledge.json"
          )

          MAX_FEED_ITEMS = int(os.getenv("MAX_FEED_ITEMS", "30"))
          MAX_RESEARCH_QUERIES = int(os.getenv("MAX_RESEARCH_QUERIES", "3"))
          MAX_WEB_RESULTS = int(os.getenv("MAX_WEB_RESULTS", "5"))
          MAX_SOURCE_CHARS = int(os.getenv("MAX_SOURCE_CHARS", "5000"))

          INPUT_QUERY = os.getenv("INPUT_QUERY", "").strip()
          INPUT_FORCE_RESEARCH = (
              os.getenv("INPUT_FORCE_RESEARCH", "false").lower() == "true"
          )

          GEMINI_ENABLED = False
          EXTERNAL_AI_ENABLED = False
          PAYMENTS_ENABLED = False
          SPENDING_ENABLED = False
          PROJECT_COST_EUR = 0


          # ============================================================
          # HTTP SESSIONS
          # ============================================================

          api_session = requests.Session()
          api_session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-Research/1.0",
          })

          web_session = requests.Session()
          web_session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,"
                  "*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9,fr;q=0.8",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          })


          # ============================================================
          # GENERIC HELPERS
          # ============================================================

          def utc_now():
              return datetime.now(timezone.utc).isoformat()


          def safe_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, (int, float, bool)):
                  return str(value)

              return ""


          def clean_text(value):
              value = html.unescape(safe_text(value))
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def fingerprint(*parts):
              raw = " | ".join(clean_text(str(p)).lower() for p in parts)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()


          def ensure_memory_structure(memory):
              if not isinstance(memory, dict):
                  memory = {}

              memory.setdefault("version", "1.0")
              memory.setdefault("updated_at", utc_now())
              memory.setdefault("knowledge", [])
              memory.setdefault("gaps", [])
              memory.setdefault("research_runs", [])
              memory.setdefault("metadata", {})

              if not isinstance(memory["knowledge"], list):
                  memory["knowledge"] = []

              if not isinstance(memory["gaps"], list):
                  memory["gaps"] = []

              if not isinstance(memory["research_runs"], list):
                  memory["research_runs"] = []

              if not isinstance(memory["metadata"], dict):
                  memory["metadata"] = {}

              return memory


          def load_memory():
              if not os.path.exists(KNOWLEDGE_FILE):
                  return ensure_memory_structure({})

              try:
                  with open(KNOWLEDGE_FILE, "r", encoding="utf-8") as f:
                      return ensure_memory_structure(json.load(f))
              except Exception as exc:
                  print(f"MEMORY LOAD WARNING: {exc}")
                  return ensure_memory_structure({})


          def save_memory(memory):
              memory["updated_at"] = utc_now()

              directory = os.path.dirname(KNOWLEDGE_FILE)
              if directory:
                  os.makedirs(directory, exist_ok=True)

              temporary = KNOWLEDGE_FILE + ".tmp"

              with open(temporary, "w", encoding="utf-8") as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=False
                  )

              os.replace(temporary, KNOWLEDGE_FILE)


          # ============================================================
          # COLONY API
          # ============================================================

          def authenticate():
              if not API_KEY:
                  print("AUTH: no COLONY_API_KEY configured")
                  return False

              endpoints = [
                  "/api/v1/auth/token",
                  "/api/v1/auth/login",
              ]

              for endpoint in endpoints:
                  try:
                      response = requests.post(
                          COLONY_BASE_URL + endpoint,
                          json={"api_key": API_KEY},
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "NOX-Ledger-Research/1.0",
                          },
                          timeout=20,
                      )

                      if response.ok:
                          payload = response.json()

                          token = (
                              payload.get("token")
                              or payload.get("access_token")
                              or payload.get("data", {}).get("token")
                              if isinstance(payload, dict)
                              else None
                          )

                          if token:
                              api_session.headers["Authorization"] = (
                                  f"Bearer {token}"
                              )

                          print(f"AUTH: success via {endpoint}")
                          return True

                  except Exception as exc:
                      print(f"AUTH WARNING {endpoint}: {exc}")

              print("AUTH: direct API key mode")
              return True


          def api_get(path, params=None):
              url = (
                  path
                  if path.startswith("http")
                  else COLONY_BASE_URL + path
              )

              try:
                  response = api_session.get(
                      url,
                      params=params or {},
                      timeout=25,
                  )

                  if response.status_code == 401:
                      if authenticate():
                          response = api_session.get(
                              url,
                              params=params or {},
                              timeout=25,
                          )

                  if not response.ok:
                      print(
                          f"API GET {path}: "
                          f"HTTP {response.status_code}"
                      )
                      return None

                  return response.json()

              except Exception as exc:
                  print(f"API GET WARNING {path}: {exc}")
                  return None


          def normalize_items(payload):
              if payload is None:
                  return []

              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "feed",
                  "data",
                  "results",
                  "suggestions",
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = normalize_items(value)
                      if nested:
                          return nested

              return []


          def extract_semantic_text(item):
              if isinstance(item, str):
                  return clean_text(item)

              if not isinstance(item, dict):
                  return ""

              preferred_fields = [
                  "content",
                  "body",
                  "text",
                  "message",
                  "comment",
                  "reply",
                  "description",
                  "question",
                  "title",
                  "summary",
                  "caption",
              ]

              parts = []

              for field in preferred_fields:
                  value = item.get(field)

                  if isinstance(value, str) and value.strip():
                      parts.append(value)

              for nested_key in (
                  "post",
                  "comment",
                  "reply",
                  "activity",
                  "data",
              ):
                  nested = item.get(nested_key)

                  if isinstance(nested, dict):
                      nested_text = extract_semantic_text(nested)

                      if nested_text:
                          parts.append(nested_text)

              return clean_text(" ".join(parts))


          def get_identity():
              payload = api_get("/api/v1/users/me")

              if isinstance(payload, dict):
                  candidates = [
                      payload,
                      payload.get("data"),
                      payload.get("user"),
                  ]

                  for candidate in candidates:
                      if isinstance(candidate, dict):
                          handle = (
                              candidate.get("handle")
                              or candidate.get("username")
                              or candidate.get("name")
                          )

                          if handle:
                              return clean_text(handle)

              return "unknown"


          def get_attention_items():
              feed_payload = api_get(
                  "/api/v1/feed/for-you",
                  {"limit": MAX_FEED_ITEMS},
              )

              suggestions_payload = api_get(
                  "/api/v1/suggestions",
                  {"limit": 20},
              )

              feed = normalize_items(feed_payload)
              suggestions = normalize_items(suggestions_payload)

              combined = []

              for item in feed + suggestions:
                  semantic = extract_semantic_text(item)

                  if semantic:
                      combined.append({
                          "semantic_text": semantic,
                          "raw": item,
                      })

              return combined


          # ============================================================
          # ATTENTION / RELEVANCE
          # ============================================================

          INTEREST_TERMS = [
              "research",
              "evidence",
              "knowledge",
              "marketplace",
              "task",
              "agent",
              "autonomy",
              "lightning",
              "colony",
              "reputation",
              "trust",
              "communication",
              "contribution",
              "payment",
              "tip",
          ]

          QUESTION_TERMS = [
              "question",
              "problem",
              "how",
              "why",
              "looking for",
              "need help",
              "unclear",
              "unknown",
              "does anyone",
              "not sure",
          ]


          def attention_score(text):
              lower = text.lower()

              score = 0

              for term in INTEREST_TERMS:
                  if term in lower:
                      score += 2

              for term in QUESTION_TERMS:
                  if term in lower:
                      score += 3

              if "?" in text:
                  score += 2

              if len(text) > 120:
                  score += 1

              return score


          def select_attention(items):
              scored = []

              for item in items:
                  text = item["semantic_text"]
                  score = attention_score(text)

                  if score > 0:
                      scored.append({
                          "score": score,
                          "text": text,
                      })

              scored.sort(
                  key=lambda x: (-x["score"], x["text"])
              )

              return scored[:10]


          # ============================================================
          # RESEARCH QUERY GENERATION
          # ============================================================

          STOPWORDS = {
              "the", "and", "for", "that", "this", "with",
              "from", "have", "has", "are", "was", "were",
              "about", "into", "then", "than", "they", "their",
              "there", "what", "when", "where", "which", "will",
              "would", "could", "should", "does", "did",
              "been", "being", "your", "you", "our", "out",
              "not", "but", "can", "all", "its", "it's",
              "just", "more", "some", "only", "very",
              "comment", "reply", "post", "user", "agent",
          }


          def meaningful_tokens(text):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9_-]{2,}",
                  text.lower(),
              )

              result = []

              for word in words:
                  if word in STOPWORDS:
                      continue

                  if word.isdigit():
                      continue

                  if word not in result:
                      result.append(word)

              return result


          def build_research_query(text):
              tokens = meaningful_tokens(text)

              if not tokens:
                  return ""

              selected = tokens[:10]

              query = " ".join(selected)

              query = re.sub(r"\s+", " ", query).strip()

              return query[:180]


          def build_queries(attention):
              queries = []

              if INPUT_QUERY:
                  queries.append(clean_text(INPUT_QUERY))

              for item in attention:
                  query = build_research_query(item["text"])

                  if not query:
                      continue

                  if query.lower() not in {
                      q.lower() for q in queries
                  }:
                      queries.append(query)

                  if len(queries) >= MAX_RESEARCH_QUERIES:
                      break

              return queries[:MAX_RESEARCH_QUERIES]


          # ============================================================
          # DUCKDUCKGO HTML PARSER
          # ============================================================

          class DuckDuckGoParser(HTMLParser):
              """
              Robust parser for DDG HTML/Lite results.

              We intentionally do not depend on attribute ordering.
              """

              def __init__(self, max_results=5):
                  super().__init__(convert_charrefs=True)

                  self.max_results = max_results
                  self.results = []

                  self.in_result_link = False
                  self.in_snippet = False

                  self.current_url = ""
                  self.current_title = []
                  self.current_snippet = []

                  self.current_link_depth = 0
                  self.current_snippet_depth = 0

                  self.seen_urls = set()

              @staticmethod
              def class_list(attrs):
                  classes = ""

                  for key, value in attrs:
                      if key.lower() == "class" and value:
                          classes = value
                          break

                  return set(
                      part.strip()
                      for part in classes.split()
                      if part.strip()
                  )

              @staticmethod
              def attr_value(attrs, wanted):
                  for key, value in attrs:
                      if key.lower() == wanted.lower():
                          return value or ""

                  return ""

              def handle_starttag(self, tag, attrs):
                  if len(self.results) >= self.max_results:
                      return

                  classes = self.class_list(attrs)

                  if tag.lower() == "a":
                      href = self.attr_value(attrs, "href")

                      if "result__a" in classes and href:
                          self.in_result_link = True
                          self.current_link_depth = 1
                          self.current_url = href
                          self.current_title = []
                          return

                      if "result__snippet" in classes:
                          self.in_snippet = True
                          self.current_snippet_depth = 1
                          self.current_snippet = []
                          return

                  if self.in_result_link:
                      self.current_link_depth += 1

                  if self.in_snippet:
                      self.current_snippet_depth += 1

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if self.in_result_link:
                      if tag == "a":
                          self.current_link_depth -= 1

                          if self.current_link_depth <= 0:
                              self.in_result_link = False

                              title = clean_text(
                                  " ".join(self.current_title)
                              )

                              href = clean_text(self.current_url)

                              if href and title:
                                  self.results.append({
                                      "url": href,
                                      "title": title,
                                      "snippet": "",
                                  })

                                  self.seen_urls.add(href)

                              self.current_url = ""
                              self.current_title = []

                      return

                  if self.in_snippet:
                      if tag == "a":
                          self.current_snippet_depth -= 1

                          if self.current_snippet_depth <= 0:
                              self.in_snippet = False

                              snippet = clean_text(
                                  " ".join(self.current_snippet)
                              )

                              if self.results:
                                  self.results[-1]["snippet"] = snippet

                              self.current_snippet = []

              def handle_data(self, data):
                  if self.in_result_link:
                      self.current_title.append(data)

                  elif self.in_snippet:
                      self.current_snippet.append(data)


          def resolve_ddg_url(url):
              if not url:
                  return ""

              url = html.unescape(url.strip())

              if url.startswith("//"):
                  url = "https:" + url

              parsed = urlparse(url)

              query = parse_qs(parsed.query)

              if "uddg" in query and query["uddg"]:
                  return unquote(query["uddg"][0])

              return url


          # ============================================================
          # WEB SEARCH
          # ============================================================

          def parse_duckduckgo(response, max_results):
              parser = DuckDuckGoParser(
                  max_results=max_results
              )

              try:
                  parser.feed(response.text)
                  parser.close()
              except Exception as exc:
                  print(f"DDG PARSER WARNING: {exc}")
                  return []

              results = []

              for result in parser.results:
                  target = resolve_ddg_url(
                      result.get("url", "")
                  )

                  if not target:
                      continue

                  parsed = urlparse(target)

                  if parsed.scheme not in ("http", "https"):
                      continue

                  if target in {
                      item["url"] for item in results
                  }:
                      continue

                  results.append({
                      "url": target,
                      "title": clean_text(
                          result.get("title", "")
                      ),
                      "snippet": clean_text(
                          result.get("snippet", "")
                      ),
                  })

                  if len(results) >= max_results:
                      break

              return results


          def search_duckduckgo_html(query):
              url = "https://html.duckduckgo.com/html/"

              headers = {
                  "Referer": "https://html.duckduckgo.com/",
                  "Sec-Fetch-Dest": "document",
                  "Sec-Fetch-Mode": "navigate",
                  "Sec-Fetch-Site": "same-origin",
                  "Sec-Fetch-User": "?1",
                  "Upgrade-Insecure-Requests": "1",
              }

              try:
                  response = web_session.post(
                      url,
                      data={
                          "q": query,
                          "b": "",
                      },
                      headers=headers,
                      timeout=25,
                  )

                  print(
                      f"DDG HTML: HTTP {response.status_code}, "
                      f"bytes={len(response.text)}"
                  )

                  if not response.ok:
                      return []

                  results = parse_duckduckgo(
                      response,
                      MAX_WEB_RESULTS,
                  )

                  if results:
                      return results

                  lower = response.text.lower()

                  result_markers = (
                      "result__a",
                      "web-result",
                      "result__snippet",
                  )

                  if any(
                      marker in lower
                      for marker in result_markers
                  ):
                      print(
                          "DDG HTML WARNING: "
                          "result-like markup detected but "
                          "no results were parsed."
                      )

                  if (
                      "captcha" in lower
                      or "bot" in lower
                      or "automated" in lower
                  ):
                      print(
                          "DDG HTML WARNING: "
                          "possible anti-bot response."
                      )

                  return []

              except Exception as exc:
                  print(f"DDG HTML SEARCH WARNING: {exc}")
                  return []


          def search_duckduckgo_lite(query):
              url = "https://lite.duckduckgo.com/lite/"

              headers = {
                  "Referer": "https://lite.duckduckgo.com/",
                  "Sec-Fetch-Dest": "document",
                  "Sec-Fetch-Mode": "navigate",
                  "Sec-Fetch-Site": "same-origin",
                  "Sec-Fetch-User": "?1",
                  "Upgrade-Insecure-Requests": "1",
              }

              try:
                  response = web_session.post(
                      url,
                      data={"q": query},
                      headers=headers,
                      timeout=25,
                  )

                  print(
                      f"DDG LITE: HTTP {response.status_code}, "
                      f"bytes={len(response.text)}"
                  )

                  if not response.ok:
                      return []

                  results = parse_duckduckgo(
                      response,
                      MAX_WEB_RESULTS,
                  )

                  return results

              except Exception as exc:
                  print(f"DDG LITE SEARCH WARNING: {exc}")
                  return []


          def web_search(query):
              print(f"RESEARCH: {query}")

              results = search_duckduckgo_html(query)

              if results:
                  print(
                      f"DDG HTML RESULTS: {len(results)}"
                  )
                  return results

              print(
                  "DDG HTML returned no parsed results; "
                  "trying Lite fallback."
              )

              results = search_duckduckgo_lite(query)

              if results:
                  print(
                      f"DDG LITE RESULTS: {len(results)}"
                  )
                  return results

              print("No search results.")

              return []


          # ============================================================
          # SOURCE FETCHING
          # ============================================================

          def extract_visible_text(raw_html):
              text = re.sub(
                  r"(?is)<script[^>]*>.*?</script>",
                  " ",
                  raw_html,
              )

              text = re.sub(
                  r"(?is)<style[^>]*>.*?</style>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"(?is)<noscript[^>]*>.*?</noscript>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  text,
              )

              text = html.unescape(text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def fetch_page(url):
              try:
                  response = web_session.get(
                      url,
                      timeout=25,
                      allow_redirects=True,
                      headers={
                          "Referer": "https://html.duckduckgo.com/",
                          "Accept": (
                              "text/html,application/xhtml+xml,"
                              "application/xml;q=0.9,*/*;q=0.8"
                          ),
                      },
                  )

                  if not response.ok:
                      print(
                          f"SOURCE HTTP {response.status_code}: "
                          f"{url}"
                      )
                      return None

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      ).lower()
                  )

                  if (
                      "text/html" not in content_type
                      and "application/xhtml+xml" not in content_type
                  ):
                      print(
                          f"SOURCE SKIP non-HTML: "
                          f"{url} [{content_type}]"
                      )
                      return None

                  text = extract_visible_text(
                      response.text
                  )

                  if not text:
                      return None

                  return {
                      "url": response.url,
                      "domain": urlparse(
                          response.url
                      ).netloc.lower(),
                      "text": text[:MAX_SOURCE_CHARS],
                  }

              except Exception as exc:
                  print(
                      f"SOURCE FETCH WARNING {url}: {exc}"
                  )
                  return None


          # ============================================================
          # KNOWLEDGE STORAGE
          # ============================================================

          def add_knowledge(
              memory,
              query,
              search_result,
              source_page,
          ):
              target_url = source_page["url"]
              domain = source_page["domain"]

              excerpt = source_page["text"]

              title = clean_text(
                  search_result.get("title", "")
              )

              snippet = clean_text(
                  search_result.get("snippet", "")
              )

              claim = title or snippet or query

              fp = fingerprint(
                  domain,
                  target_url,
                  claim,
                  excerpt[:1000],
              )

              for existing in memory["knowledge"]:
                  if existing.get("fingerprint") == fp:
                      return False

              entry = {
                  "id": fp[:16],
                  "created_at": utc_now(),
                  "updated_at": utc_now(),
                  "query": query,
                  "claim": claim,
                  "title": title,
                  "source_url": target_url,
                  "source_domain": domain,
                  "excerpt": excerpt,
                  "confidence": 0.55,
                  "verification_status": "UNVERIFIED_EXTERNAL_SOURCE",
                  "requires_cross_check": True,
                  "evidence_type": "web_research",
                  "fingerprint": fp,
              }

              memory["knowledge"].append(entry)

              return True


          def add_gap(memory, query, reason):
              fp = fingerprint(query, reason)

              for existing in memory["gaps"]:
                  if existing.get("fingerprint") == fp:
                      return

              memory["gaps"].append({
                  "id": fp[:16],
                  "created_at": utc_now(),
                  "query": query,
                  "reason": reason,
                  "status": "open",
                  "fingerprint": fp,
              })


          def add_research_run(
              memory,
              query,
              result_count,
              source_count,
              added_count,
          ):
              memory["research_runs"].append({
                  "timestamp": utc_now(),
                  "query": query,
                  "web_results": result_count,
                  "sources_fetched": source_count,
                  "knowledge_added": added_count,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "payments_enabled": False,
                  "spending_enabled": False,
                  "project_cost_eur": 0,
              })


          # ============================================================
          # MAIN
          # ============================================================

          print("=== NØX LEDGER 01 - KNOWLEDGE & AUTONOMOUS RESEARCH ===")

          memory = load_memory()

          authenticate()

          identity = get_identity()

          print(f"IDENTITY: {identity}")

          attention_items = get_attention_items()

          attention = select_attention(
              attention_items
          )

          print(
              f"ATTENTION ITEMS: {len(attention)}"
          )

          queries = build_queries(attention)

          if INPUT_FORCE_RESEARCH and not queries:
              queries = [
                  "AI agents autonomous research knowledge"
              ]

          print(
              f"RESEARCH QUERIES: {len(queries)}"
          )

          for index, query in enumerate(
              queries,
              start=1,
          ):
              print(
                  f"QUERY {index}: {query}"
              )

          total_web_results = 0
          total_sources = 0
          total_added = 0
          duplicate_count = 0

          for query in queries:
              results = web_search(query)

              total_web_results += len(results)

              if not results:
                  add_gap(
                      memory,
                      query,
                      "No usable web search result returned."
                  )

                  add_research_run(
                      memory,
                      query,
                      0,
                      0,
                      0,
                  )

                  continue

              source_count = 0
              added_count = 0

              for result in results[:MAX_WEB_RESULTS]:
                  url = result.get("url", "").strip()

                  if not url:
                      continue

                  print(
                      f"SOURCE: {url}"
                  )

                  page = fetch_page(url)

                  if not page:
                      continue

                  source_count += 1
                  total_sources += 1

                  added = add_knowledge(
                      memory,
                      query,
                      result,
                      page,
                  )

                  if added:
                      added_count += 1
                      total_added += 1
                  else:
                      duplicate_count += 1

                  time.sleep(0.5)

              if source_count == 0:
                  add_gap(
                      memory,
                      query,
                      "Search results existed but no source page "
                      "could be fetched as usable HTML."
                  )

              add_research_run(
                  memory,
                  query,
                  len(results),
                  source_count,
                  added_count,
              )

          # ============================================================
          # MEMORY LIMITS
          # ============================================================

          memory["knowledge"] = memory["knowledge"][-500:]
          memory["gaps"] = memory["gaps"][-100:]
          memory["research_runs"] = memory["research_runs"][-100:]

          memory["metadata"] = {
              "identity": identity,
              "last_attention_count": len(attention),
              "last_query_count": len(queries),
              "last_web_results": total_web_results,
              "last_sources_fetched": total_sources,
              "last_knowledge_added": total_added,
              "last_duplicates": duplicate_count,
              "knowledge_total": len(memory["knowledge"]),
              "open_gaps": sum(
                  1
                  for gap in memory["gaps"]
                  if gap.get("status") == "open"
              ),
              "manual_query": bool(INPUT_QUERY),
              "forced_research": INPUT_FORCE_RESEARCH,
              "gemini_used": GEMINI_ENABLED,
              "external_ai_used": EXTERNAL_AI_ENABLED,
              "payments_enabled": PAYMENTS_ENABLED,
              "spending_enabled": SPENDING_ENABLED,
              "project_cost_eur": PROJECT_COST_EUR,
              "last_run": utc_now(),
          }

          save_memory(memory)

          # ============================================================
          # DIAGNOSTICS
          # ============================================================

          print("")
          print("=== RESEARCH DIAGNOSTICS ===")
          print(f"Identity: {identity}")
          print(f"Attention items: {len(attention)}")
          print(f"Research queries: {len(queries)}")
          print(f"WEB sources found: {total_web_results}")
          print(f"Source pages fetched: {total_sources}")
          print(f"Knowledge added: {total_added}")
          print(f"Duplicates: {duplicate_count}")
          print(
              f"Knowledge total: "
              f"{len(memory['knowledge'])}"
          )
          print(
              "Open gaps: "
              f"{memory['metadata']['open_gaps']}"
          )
          print(f"Manual query: {bool(INPUT_QUERY)}")
          print(f"Forced research: {INPUT_FORCE_RESEARCH}")
          print(f"Gemini: {GEMINI_ENABLED}")
          print(f"External AI: {EXTERNAL_AI_ENABLED}")
          print(f"Payments: {PAYMENTS_ENABLED}")
          print(f"Spending: {SPENDING_ENABLED}")
          print(f"Project cost: €{PROJECT_COST_EUR}")
          print("")
          print("=== END LEDGER 01 ===")
          PY

      - name: Commit knowledge changes
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_ledger_knowledge.json

          if git diff --cached --quiet; then
            echo "No knowledge changes to commit."
            exit 0
          fi

          git commit -m "NØX LEDGER 01: update knowledge research"

      - name: Rebase and push
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase failed."
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 3
          done

          echo "Push failed after 3 attempts."
          exit 1
