name: NØX LEDGER 01 - Knowledge & Autonomous Research

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Optional research query"
        required: false
        type: string
        default: ""
      force_research:
        description: "Force external research"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "07 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  knowledge-research:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      INPUT_QUERY: ${{ inputs.query }}
      INPUT_FORCE_RESEARCH: ${{ inputs.force_research }}

      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json

      MAX_FEED_ITEMS: "30"
      MAX_RESEARCH_QUERIES: "3"
      MAX_WEB_RESULTS: "5"
      MAX_SOURCE_CHARS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run LEDGER 01
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import html
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote, urlparse
          from html.parser import HTMLParser

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_RESEARCH_QUERIES = int(os.environ["MAX_RESEARCH_QUERIES"])
          MAX_WEB_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          MAX_SOURCE_CHARS = int(os.environ["MAX_SOURCE_CHARS"])

          MANUAL_QUERY = os.environ.get("INPUT_QUERY", "").strip()
          FORCE_RESEARCH = (
              os.environ.get("INPUT_FORCE_RESEARCH", "false").lower() == "true"
          )

          NOW = datetime.now(timezone.utc).isoformat()

          GEMINI_USED = False
          EXTERNAL_AI_USED = False
          PAYMENTS_ENABLED = False
          SPENDING_ENABLED = False
          PROJECT_COST_EUR = 0

          print("================================")
          print("=== NØX LEDGER 01 START ===")
          print("================================")

          # ------------------------------------------------------------
          # JSON HELPERS
          # ------------------------------------------------------------

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as file:
                      data = json.load(file)
                  return data if isinstance(data, dict) else default
              except Exception as error:
                  print(f"WARNING: Could not load {path}: {error}")
                  return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary_path = path.with_suffix(path.suffix + ".tmp")

              with temporary_path.open("w", encoding="utf-8") as file:
                  json.dump(data, file, ensure_ascii=False, indent=2)
                  file.write("\n")

              temporary_path.replace(path)

          memory = load_json(
              KNOWLEDGE_FILE,
              {
                  "version": "1.0",
                  "created_at": NOW,
                  "updated_at": NOW,
                  "knowledge": [],
                  "research_runs": [],
                  "attention": [],
                  "gaps": [],
                  "stats": {},
              },
          )

          for key in ("knowledge", "research_runs", "attention", "gaps"):
              if not isinstance(memory.get(key), list):
                  memory[key] = []

          # ------------------------------------------------------------
          # HTTP CLIENT
          # ------------------------------------------------------------

          session = requests.Session()
          session.headers.update(
              {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Ledger-Research/1.0",
              }
          )

          if API_KEY:
              session.headers["Authorization"] = f"Bearer {API_KEY}"

          def authenticate():
              if not API_KEY:
                  return False

              endpoints = [
                  "/api/v1/auth/token",
                  "/api/v1/auth/login",
              ]

              for endpoint in endpoints:
                  try:
                      response = session.post(
                          BASE_URL + endpoint,
                          json={"api_key": API_KEY},
                          timeout=20,
                      )

                      if response.ok:
                          payload = response.json()

                          token = (
                              payload.get("access_token")
                              or payload.get("token")
                              or payload.get("data", {}).get("access_token")
                          )

                          if token:
                              session.headers["Authorization"] = f"Bearer {token}"
                              return True

                  except Exception:
                      continue

              return False

          def api_get(path, params=None, timeout=25):
              url = BASE_URL + path

              try:
                  response = session.get(
                      url,
                      params=params or {},
                      timeout=timeout,
                  )

                  if response.status_code == 401 and authenticate():
                      response = session.get(
                          url,
                          params=params or {},
                          timeout=timeout,
                      )

                  if not response.ok:
                      print(
                          f"WARNING: GET {path} returned "
                          f"HTTP {response.status_code}"
                      )
                      return {}

                  try:
                      return response.json()
                  except ValueError:
                      return {}

              except requests.RequestException as error:
                  print(f"WARNING: GET {path} failed: {error}")
                  return {}

          authenticate()

          # ------------------------------------------------------------
          # GENERAL TEXT HELPERS
          # ------------------------------------------------------------

          STOP_WORDS = {
              "this",
              "that",
              "with",
              "from",
              "have",
              "about",
              "what",
              "which",
              "their",
              "there",
              "would",
              "could",
              "should",
              "these",
              "those",
              "agent",
              "agents",
              "nox",
              "comment",
              "reply",
              "posted",
              "following",
              "follow",
              "the",
              "and",
              "for",
              "are",
              "was",
              "were",
              "been",
              "being",
              "into",
              "than",
              "then",
              "them",
              "they",
              "you",
              "your",
              "our",
              "ours",
              "their",
              "its",
              "it's",
              "just",
              "like",
              "really",
              "very",
              "more",
              "some",
              "any",
              "also",
              "only",
              "still",
              "here",
              "there",
              "where",
              "when",
              "will",
              "can",
              "cannot",
              "could",
              "would",
              "should",
              "might",
              "must",
              "does",
              "did",
              "doing",
              "done",
              "has",
              "had",
              "having",
              "not",
              "but",
              "because",
              "while",
              "after",
              "before",
              "through",
              "over",
              "under",
              "between",
              "against",
              "about",
              "one",
              "two",
              "three",
              "first",
              "second",
              "yes",
              "no",
          }

          def clean_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  text = value
              elif isinstance(value, (int, float, bool)):
                  text = str(value)
              else:
                  return ""

              text = html.unescape(text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def text_of(value):
              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(text_of(item) for item in value)

              if isinstance(value, dict):
                  return " ".join(text_of(item) for item in value.values())

              return ""

          def fingerprint(text):
              normalized = re.sub(
                  r"\s+",
                  " ",
                  clean_text(text).lower(),
              ).strip()

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:20]

          def extract_identifier(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "id",
                  "uuid",
                  "post_id",
                  "comment_id",
                  "activity_id",
                  "suggestion_id",
              ):
                  value = item.get(key)

                  if value is not None:
                      return str(value)

              return ""

          # ------------------------------------------------------------
          # TARGETED TEXT EXTRACTION
          # ------------------------------------------------------------

          def extract_semantic_text(item):
              """
              Extract only meaningful human-readable content.

              Metadata such as IDs, scores, timestamps, URLs,
              e-mail addresses and complete profile objects are excluded.
              """

              if not isinstance(item, dict):
                  return clean_text(item)

              preferred_fields = (
                  "content",
                  "body",
                  "text",
                  "message",
                  "comment",
                  "reply",
                  "description",
                  "question",
                  "title",
                  "summary",
                  "caption",
              )

              parts = []

              for field in preferred_fields:
                  value = item.get(field)

                  if isinstance(value, str):
                      value = clean_text(value)

                      if value and value not in parts:
                          parts.append(value)

              nested_objects = (
                  item.get("post"),
                  item.get("comment"),
                  item.get("reply"),
                  item.get("activity"),
                  item.get("data"),
              )

              for nested in nested_objects:
                  if isinstance(nested, dict):
                      nested_text = extract_semantic_text(nested)

                      if nested_text and nested_text not in parts:
                          parts.append(nested_text)

              if not parts:
                  return ""

              result = " ".join(parts)
              result = re.sub(r"\s+", " ", result).strip()

              return result[:3000]

          def extract_author(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "author",
                  "username",
                  "handle",
                  "user",
                  "creator",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      return clean_text(value)

                  if isinstance(value, dict):
                      for nested_key in (
                          "username",
                          "handle",
                          "name",
                      ):
                          nested_value = value.get(nested_key)

                          if nested_value:
                              return clean_text(nested_value)

              return ""

          # ------------------------------------------------------------
          # RESEARCH QUERY EXTRACTION
          # ------------------------------------------------------------

          def build_research_query(content):
              """
              Convert conversational content into a short thematic
              keyword query.

              This deliberately avoids sending complete comments,
              profiles, IDs, dates or conversational filler to search.
              """

              text = clean_text(content)

              if not text:
                  return ""

              # Remove URLs.
              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text,
                  flags=re.IGNORECASE,
              )

              # Remove e-mail addresses.
              text = re.sub(
                  r"\b[\w.+-]+@[\w.-]+\.[a-z]{2,}\b",
                  " ",
                  text,
                  flags=re.IGNORECASE,
              )

              # Remove UUIDs / long hexadecimal identifiers.
              text = re.sub(
                  r"\b[0-9a-f]{8,}\b",
                  " ",
                  text,
                  flags=re.IGNORECASE,
              )

              # Remove timestamps and dates.
              text = re.sub(
                  r"\b\d{4}-\d{2}-\d{2}"
                  r"(?:t|\s)\d{2}:\d{2}:\d{2}"
                  r"(?:\.\d+)?z?\b",
                  " ",
                  text,
                  flags=re.IGNORECASE,
              )

              text = re.sub(
                  r"\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b",
                  " ",
                  text,
              )

              # Remove common metadata expressions.
              text = re.sub(
                  r"\b(?:score|karma|followers?|following|"
                  r"created_at|updated_at|timestamp|"
                  r"avatar|email|handle|username|"
                  r"comment|reply|post|activity)"
                  r"\s*[:=]?\s*[\w.@:/-]+",
                  " ",
                  text,
                  flags=re.IGNORECASE,
              )

              # Remove Markdown emphasis / code punctuation.
              text = re.sub(
                  r"[*_`~]+",
                  " ",
                  text,
              )

              # Keep letters/numbers and useful separators only.
              text = re.sub(
                  r"[^A-Za-z0-9À-ÖØ-öø-ÿ' -]+",
                  " ",
                  text,
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text,
              ).strip()

              if len(text) < 20:
                  return ""

              # Tokenize.
              words = re.findall(
                  r"[A-Za-zÀ-ÖØ-öø-ÿ0-9][A-Za-zÀ-ÖØ-öø-ÿ0-9'-]*",
                  text.lower(),
              )

              selected = []
              seen = set()

              for word in words:
                  word = word.strip("-'")

                  if not word:
                      continue

                  if word in STOP_WORDS:
                      continue

                  if len(word) < 4 and not word.isdigit():
                      continue

                  if word.isdigit():
                      continue

                  if word in seen:
                      continue

                  seen.add(word)
                  selected.append(word)

                  if len(selected) >= 10:
                      break

              if len(selected) < 3:
                  return ""

              return " ".join(selected)

          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          identity = api_get("/api/v1/users/me")

          if not isinstance(identity, dict):
              identity = {}

          username = (
              identity.get("username")
              or identity.get("handle")
              or "nox_origine"
          )

          print(f"IDENTITY: {username}")

          # ------------------------------------------------------------
          # ATTENTION COLLECTION
          # ------------------------------------------------------------

          feed_response = api_get(
              "/api/v1/feed/for-you",
              {"limit": MAX_FEED_ITEMS},
          )

          suggestions_response = api_get(
              "/api/v1/suggestions",
              {"limit": 20},
          )

          def normalize_items(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "feed",
                  "data",
                  "results",
                  "suggestions",
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = normalize_items(value)

                      if nested:
                          return nested

              return []

          feed_items = normalize_items(feed_response)
          suggestion_items = normalize_items(suggestions_response)

          attention = []

          interest_terms = (
              "research",
              "evidence",
              "knowledge",
              "marketplace",
              "task",
              "agent",
              "autonomy",
              "lightning",
              "colony",
              "reputation",
              "trust",
              "communication",
              "contribution",
              "payment",
              "tip",
          )

          question_terms = (
              "question",
              "problem",
              "how",
              "why",
              "looking for",
              "need help",
              "unclear",
              "unknown",
              "does anyone",
              "not sure",
          )

          for item in feed_items:
              if not isinstance(item, dict):
                  continue

              semantic_text = extract_semantic_text(item)

              if not semantic_text:
                  continue

              lowered = semantic_text.lower()
              score = 0

              if any(term in lowered for term in interest_terms):
                  score += 20

              if any(term in lowered for term in question_terms):
                  score += 15

              if len(semantic_text) > 500:
                  score += 5

              if len(semantic_text) > 1500:
                  score += 5

              if score >= 20:
                  attention.append(
                      {
                          "id": extract_identifier(item),
                          "kind": "feed",
                          "author": extract_author(item),
                          "content": semantic_text,
                          "score": score,
                      }
                  )

          for item in suggestion_items:
              if not isinstance(item, dict):
                  continue

              semantic_text = extract_semantic_text(item)

              if not semantic_text:
                  continue

              lowered = semantic_text.lower()

              if any(
                  term in lowered
                  for term in (
                      "question",
                      "research",
                      "reply",
                      "claim",
                      "task",
                      "evidence",
                      "problem",
                  )
              ):
                  attention.append(
                      {
                          "id": extract_identifier(item),
                          "kind": "suggestion",
                          "author": extract_author(item),
                          "content": semantic_text,
                          "score": 25,
                      }
                  )

          attention.sort(
              key=lambda entry: entry.get("score", 0),
              reverse=True,
          )

          attention = attention[:10]

          print(f"ATTENTION ITEMS: {len(attention)}")

          # ------------------------------------------------------------
          # RESEARCH QUERY GENERATION
          # ------------------------------------------------------------

          queries = []

          if MANUAL_QUERY:
              queries.append(MANUAL_QUERY)

          for item in attention:
              query = build_research_query(
                  item.get("content", "")
              )

              if query:
                  queries.append(query)

          queries.extend(
              [
                  (
                      "AI agent marketplaces useful tasks "
                      "reputation evidence performance"
                  ),
                  (
                      "The Colony AI agent marketplace "
                      "tasks bids contributions tips"
                  ),
              ]
          )

          unique_queries = []
          seen_queries = set()

          for query in queries:
              query = clean_text(query)

              if not query:
                  continue

              normalized = query.lower()

              if normalized in seen_queries:
                  continue

              seen_queries.add(normalized)
              unique_queries.append(query)

          # Keep the existing query limit.
          if not FORCE_RESEARCH and not MANUAL_QUERY:
              unique_queries = unique_queries[:2]
          else:
              unique_queries = unique_queries[:MAX_RESEARCH_QUERIES]

          print(f"RESEARCH QUERIES: {len(unique_queries)}")

          for index, query in enumerate(unique_queries, start=1):
              print(f"QUERY {index}: {query}")

          # ------------------------------------------------------------
          # HTML PARSER
          # ------------------------------------------------------------

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip_depth = 0

              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {
                      "script",
                      "style",
                      "noscript",
                      "svg",
                  }:
                      self.skip_depth += 1

              def handle_endtag(self, tag):
                  if tag.lower() in {
                      "script",
                      "style",
                      "noscript",
                      "svg",
                  } and self.skip_depth > 0:
                      self.skip_depth -= 1

              def handle_data(self, data):
                  if self.skip_depth == 0:
                      text = clean_text(data)

                      if text:
                          self.parts.append(text)

              def get_text(self):
                  return " ".join(self.parts)

          def fetch_page(url):
              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "(compatible; NOX-Research/1.0)"
                          )
                      },
                      timeout=20,
                  )

                  if not response.ok:
                      return ""

                  parser = PageParser()
                  parser.feed(response.text)

                  text = parser.get_text()

                  return text[:MAX_SOURCE_CHARS]

              except requests.RequestException:
                  return ""

          # ------------------------------------------------------------
          # DUCKDUCKGO RESEARCH
          # ------------------------------------------------------------

          research_results = []

          for query in unique_queries:
              print(f"RESEARCH: {query}")

              search_url = (
                  "https://html.duckduckgo.com/html/?q="
                  + quote(query)
              )

              try:
                  response = requests.get(
                      search_url,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "(compatible; NOX-Research/1.0)"
                          )
                      },
                      timeout=25,
                  )

                  if not response.ok:
                      print("No search results.")
                      continue

                  matches = re.findall(
                      r'class="result__a"[^>]+href="([^"]+)"'
                      r'[^>]*>(.*?)</a>',
                      response.text,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  if not matches:
                      print("No search results.")
                      continue

                  collected_for_query = 0

                  for raw_url, raw_title in matches:
                      if collected_for_query >= MAX_WEB_RESULTS:
                          break

                      url = html.unescape(raw_url).strip()

                      title = re.sub(
                          r"<[^>]+>",
                          " ",
                          html.unescape(raw_title),
                      )

                      title = clean_text(title)

                      if not url.startswith(
                          ("http://", "https://")
                      ):
                          continue

                      parsed_url = urlparse(url)
                      domain = parsed_url.netloc.lower()

                      if not domain:
                          continue

                      excerpt = fetch_page(url)

                      if not excerpt:
                          continue

                      research_results.append(
                          {
                              "query": query,
                              "title": title[:500],
                              "url": url,
                              "domain": domain,
                              "excerpt": excerpt,
                              "fingerprint": fingerprint(
                                  url + excerpt
                              ),
                          }
                      )

                      collected_for_query += 1
                      time.sleep(0.4)

              except requests.RequestException as error:
                  print(
                      f"Research request failed: {error}"
                  )

          print(
              f"WEB SOURCES FOUND: {len(research_results)}"
          )

          # ------------------------------------------------------------
          # KNOWLEDGE STORAGE
          # ------------------------------------------------------------

          existing_fingerprints = {
              entry.get("fingerprint")
              for entry in memory["knowledge"]
              if isinstance(entry, dict)
          }

          knowledge_added = 0
          duplicates = 0

          for result in research_results:
              result_fingerprint = result["fingerprint"]

              if result_fingerprint in existing_fingerprints:
                  duplicates += 1
                  continue

              entry = {
                  "id": f"knowledge-{result_fingerprint}",
                  "created_at": NOW,
                  "topic": result["query"],
                  "claim": result["title"],
                  "evidence": result["excerpt"],
                  "source_url": result["url"],
                  "source_domain": result["domain"],
                  "confidence": 0.55,
                  "status": "UNVERIFIED_EXTERNAL_SOURCE",
                  "requires_cross_check": True,
                  "fingerprint": result_fingerprint,
              }

              memory["knowledge"].append(entry)
              existing_fingerprints.add(result_fingerprint)
              knowledge_added += 1

          memory["knowledge"] = memory["knowledge"][-500:]

          # ------------------------------------------------------------
          # KNOWLEDGE GAPS
          # ------------------------------------------------------------

          gap_terms = (
              "why",
              "how",
              "unclear",
              "unknown",
              "does anyone know",
              "looking for",
              "need help",
              "not sure",
              "question",
              "problem",
          )

          for item in attention:
              content = clean_text(
                  item.get("content", "")
              )

              if not content:
                  continue

              lowered = content.lower()

              if any(
                  term in lowered
                  for term in gap_terms
              ):
                  memory["gaps"].append(
                      {
                          "created_at": NOW,
                          "question": content[:1000],
                          "status": "OPEN",
                          "source_id": item.get("id", ""),
                      }
                  )

          memory["gaps"] = memory["gaps"][-100:]

          # ------------------------------------------------------------
          # RESEARCH RUN RECORD
          # ------------------------------------------------------------

          memory["research_runs"].append(
              {
                  "timestamp": NOW,
                  "queries": unique_queries,
                  "sources_found": len(research_results),
                  "knowledge_added": knowledge_added,
                  "duplicates": duplicates,
                  "forced": FORCE_RESEARCH,
                  "manual_query": bool(MANUAL_QUERY),
                  "external_ai_used": EXTERNAL_AI_USED,
                  "gemini_used": GEMINI_USED,
                  "project_cost_eur": PROJECT_COST_EUR,
              }
          )

          memory["research_runs"] = (
              memory["research_runs"][-100:]
          )

          open_gaps = sum(
              1
              for gap in memory["gaps"]
              if isinstance(gap, dict)
              and gap.get("status") == "OPEN"
          )

          memory["attention"] = attention
          memory["updated_at"] = NOW

          memory["stats"] = {
              "knowledge_entries": len(
                  memory["knowledge"]
              ),
              "open_gaps": open_gaps,
              "attention_items": len(attention),
              "research_queries": len(unique_queries),
              "research_sources_this_run": len(
