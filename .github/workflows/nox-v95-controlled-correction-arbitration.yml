name: NØX V95 — Controlled Correction Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v95-controlled-correction-arbitration
  cancel-in-progress: false

jobs:
  correction-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V95
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          MEMORY = "memory"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(name):
              path = os.path.join(MEMORY, name)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(name, data):
              os.makedirs(MEMORY, exist_ok=True)
              with open(
                  os.path.join(MEMORY, name),
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          # ---------------------------------------------------------
          # LOAD PREVIOUS STAGES
          # ---------------------------------------------------------

          v92 = load(
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          v93 = load(
              "nox_v93_autonomous_self_correction_validation.json"
          )

          v94 = load(
              "nox_v94_controlled_live_comparison.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          v88 = load(
              "nox_v88_autonomous_decision_error_analysis.json"
          )

          # ---------------------------------------------------------
          # SELECTED CORRECTION
          # ---------------------------------------------------------

          selected = v92.get(
              "selected_correction",
              {}
          )

          if not isinstance(selected, dict):
              selected = {}

          correction_id = text(
              selected.get("id")
          )

          correction_name = text(
              selected.get("name")
          )

          correction_score = number(
              selected.get("score"),
              0
          )

          # ---------------------------------------------------------
          # V93 SIMULATION RESULT
          # ---------------------------------------------------------

          v93_validation = v93.get(
              "validation",
              {}
          )

          if not isinstance(v93_validation, dict):
              v93_validation = {}

          v93_status = text(
              v93_validation.get(
                  "status"
              )
          )

          v93_confidence = number(
              v93_validation.get(
                  "confidence"
              ),
              0
          )

          # ---------------------------------------------------------
          # V94 LIVE RESULT
          # ---------------------------------------------------------

          v94_validation = v94.get(
              "live_validation",
              {}
          )

          if not isinstance(v94_validation, dict):
              v94_validation = {}

          v94_status = text(
              v94_validation.get(
                  "status"
              )
          )

          v94_confidence = number(
              v94_validation.get(
                  "confidence"
              ),
              0
          )

          v94_comparison = v94.get(
              "comparison",
              {}
          )

          if not isinstance(v94_comparison, dict):
              v94_comparison = {}

          decisions_changed = number(
              v94_comparison.get(
                  "decisions_changed"
              ),
              0
          )

          useful_changes = number(
              v94_comparison.get(
                  "potentially_useful_changes"
              ),
              0
          )

          harmful_changes = number(
              v94_comparison.get(
                  "harmful_changes"
              ),
              0
          )

          baseline_high = number(
              v94_comparison.get(
                  "baseline_high_confidence"
              ),
              0
          )

          shadow_high = number(
              v94_comparison.get(
                  "shadow_high_confidence"
              ),
              0
          )

          baseline_atypical = number(
              v94_comparison.get(
                  "baseline_atypical"
              ),
              0
          )

          shadow_atypical = number(
              v94_comparison.get(
                  "shadow_atypical"
              ),
              0
          )

          baseline_completed = number(
              v94_comparison.get(
                  "baseline_completed_excluded"
              ),
              0
          )

          shadow_completed = number(
              v94_comparison.get(
                  "shadow_completed_excluded"
              ),
              0
          )

          # ---------------------------------------------------------
          # STABILITY CONTEXT
          # ---------------------------------------------------------

          v91_metrics = v91.get(
              "metrics",
              {}
          )

          if not isinstance(v91_metrics, dict):
              v91_metrics = {}

          overall_stability = number(
              v91_metrics.get(
                  "overall_stability"
              ),
              0
          )

          evidence_stability = number(
              v91_metrics.get(
                  "evidence_stability"
              ),
              0
          )

          strategy_stability = number(
              v91_metrics.get(
                  "strategy_stability"
              ),
              0
          )

          # ---------------------------------------------------------
          # ARBITRATION SCORE
          # ---------------------------------------------------------

          score = 0
          reasons = []

          if v93_status == (
              "CORRECTION_VALIDATED_IN_SIMULATION"
          ):
              score += 20
              reasons.append(
                  "V93 simulation validated the correction."
              )

          if v94_status == (
              "CORRECTION_SHOWS_LIVE_BENEFIT_SIGNAL"
          ):
              score += 30
              reasons.append(
                  "V94 detected a useful signal on live data."
              )

          elif v94_status == (
              "CORRECTION_LIVE_NEUTRAL"
          ):
              score += 5
              reasons.append(
                  "V94 was neutral on live data."
              )

          elif v94_status == (
              "INSUFFICIENT_LIVE_EVIDENCE"
          ):
              score -= 10
              reasons.append(
                  "V94 did not provide enough live evidence."
              )

          if harmful_changes == 0:
              score += 20
              reasons.append(
                  "No harmful live changes were detected."
              )
          else:
              score -= 35
              reasons.append(
                  "Harmful live changes were detected."
              )

          if useful_changes > 0:
              score += 15
              reasons.append(
                  "At least one potentially useful "
                  "live decision change was detected."
              )

          if shadow_completed >= baseline_completed:
              score += 5
              reasons.append(
                  "Completed-work exclusion was preserved."
              )
          else:
              score -= 15
              reasons.append(
                  "Completed-work exclusion weakened."
              )

          if shadow_atypical >= baseline_atypical:
              score += 5
              reasons.append(
                  "Atypical opportunity preservation was maintained."
              )

          if overall_stability >= 0.70:
              score += 5
              reasons.append(
                  "Decision stability is sufficiently mature."
              )

          if evidence_stability >= 0.70:
              score += 5
              reasons.append(
                  "Evidence stability is sufficiently mature."
              )

          if strategy_stability >= 0.70:
              score += 5
              reasons.append(
                  "Strategy stability is sufficiently mature."
              )

          score = max(
              0,
              min(
                  100,
                  score
              )
          )

          # ---------------------------------------------------------
          # ARBITRATION DECISION
          # ---------------------------------------------------------

          if (
              score >= 80
              and harmful_changes == 0
              and useful_changes > 0
          ):
              arbitration = (
                  "CLEAR_CONTROLLED_DEPLOYMENT_CANDIDATE"
              )

          elif (
              score >= 65
              and harmful_changes == 0
          ):
              arbitration = (
                  "PROMISING_BUT_MORE_EVIDENCE_REQUIRED"
              )

          elif harmful_changes > 0:
              arbitration = (
                  "CORRECTION_REJECTED_FOR_NOW"
              )

          else:
              arbitration = (
                  "CORRECTION_UNRESOLVED"
              )

          # ---------------------------------------------------------
          # DEPLOYMENT AUTHORITY
          # ---------------------------------------------------------

          if arbitration == (
              "CLEAR_CONTROLLED_DEPLOYMENT_CANDIDATE"
          ):
              authority = (
                  "READY_FOR_V96_CONTROLLED_DEPLOYMENT"
              )

              next_stage = "V96"

          elif arbitration == (
              "PROMISING_BUT_MORE_EVIDENCE_REQUIRED"
          ):
              authority = (
                  "MORE_LIVE_EVIDENCE_REQUIRED"
              )

              next_stage = "V96"

          elif arbitration == (
              "CORRECTION_REJECTED_FOR_NOW"
          ):
              authority = (
                  "DO_NOT_DEPLOY"
              )

              next_stage = "V96_CORRECTION_REFINEMENT"

          else:
              authority = (
                  "CONTINUE_VALIDATION"
              )

              next_stage = "V96"

          # ---------------------------------------------------------
          # CONFIDENCE
          # ---------------------------------------------------------

          confidence = (
              score / 100.0
          )

          confidence = min(
              round(confidence, 3),
              0.95
          )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V95",
              "generated_at": now(),
              "mode": "controlled_correction_arbitration",

              "correction": {
                  "id": correction_id,
                  "name": correction_name,
                  "v92_proposal_score": correction_score
              },

              "evidence_chain": {
                  "v93_simulation_status": v93_status,
                  "v93_confidence": v93_confidence,
                  "v94_live_status": v94_status,
                  "v94_confidence": v94_confidence,
                  "v94_decisions_changed": decisions_changed,
                  "v94_useful_changes": useful_changes,
                  "v94_harmful_changes": harmful_changes
              },

              "live_effect": {
                  "baseline_high_confidence": baseline_high,
                  "shadow_high_confidence": shadow_high,
                  "baseline_atypical": baseline_atypical,
                  "shadow_atypical": shadow_atypical,
                  "baseline_completed_excluded": (
                      baseline_completed
                  ),
                  "shadow_completed_excluded": (
                      shadow_completed
                  )
              },

              "stability": {
                  "overall": overall_stability,
                  "evidence": evidence_stability,
                  "strategy": strategy_stability
              },

              "arbitration": {
                  "score": score,
                  "status": arbitration,
                  "confidence": confidence,
                  "reasons": reasons
              },

              "authority": {
                  "status": authority,
                  "automatic_deployment": False,
                  "permanent_rule_change": False,
                  "rollback_required_for_future_deployment": True
              },

              "next_stage": {
                  "version": next_stage,
                  "purpose": (
                      "Move toward a reversible controlled deployment "
                      "only if the correction remains supported by "
                      "evidence."
                  )
              },

              "autonomy": {
                  "evidence_arbitration_by_nox": True,
                  "correction_selection_by_nox": True,
                  "deployment_decision_by_nox": True,
                  "automatic_permanent_deployment": False,
                  "rollback_protection": True,
                  "human_override": True
              },

              "safety": {
                  "gemini_disabled": True,
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "production_rules_changed": False,
                  "zero_cost_constraint": True,
                  "human_override": True
              },

              "answer_status": arbitration
          }

          # ---------------------------------------------------------
          # SAVE JSON
          # ---------------------------------------------------------

          save(
              "nox_v95_controlled_correction_arbitration.json",
              result
          )

          # ---------------------------------------------------------
          # SAVE MARKDOWN
          # ---------------------------------------------------------

          lines = []

          lines.append(
              "# NØX V95 — Controlled Correction Arbitration"
          )
          lines.append("")
          lines.append(
              "Generated: "
              + text(result["generated_at"])
          )
          lines.append("")

          lines.append("## Correction")
          lines.append("")
          lines.append(
              "- ID: " + correction_id
          )
          lines.append(
              "- Name: " + correction_name
          )
          lines.append(
              "- V92 proposal score: "
              + str(correction_score)
          )
          lines.append("")

          lines.append("## Evidence chain")
          lines.append("")
          lines.append(
              "- V93 simulation: "
              + v93_status
          )
          lines.append(
              "- V93 confidence: "
              + str(v93_confidence)
          )
          lines.append(
              "- V94 live result: "
              + v94_status
          )
          lines.append(
              "- V94 confidence: "
              + str(v94_confidence)
          )
          lines.append("")

          lines.append("## Live effect")
          lines.append("")
          lines.append(
              "- Decisions changed: "
              + str(decisions_changed)
          )
          lines.append(
              "- Useful changes: "
              + str(useful_changes)
          )
          lines.append(
              "- Harmful changes: "
              + str(harmful_changes)
          )
          lines.append(
              "- Baseline high-confidence: "
              + str(baseline_high)
          )
          lines.append(
              "- Shadow high-confidence: "
              + str(shadow_high)
          )
          lines.append(
              "- Baseline atypical: "
              + str(baseline_atypical)
          )
          lines.append(
              "- Shadow atypical: "
              + str(shadow_atypical)
          )
          lines.append(
              "- Baseline completed excluded: "
              + str(baseline_completed)
          )
          lines.append(
              "- Shadow completed excluded: "
              + str(shadow_completed)
          )
          lines.append("")

          lines.append("## Arbitration")
          lines.append("")
          lines.append(
              "- Score: "
              + str(score)
              + "/100"
          )
          lines.append(
              "- Status: "
              + arbitration
          )
          lines.append(
              "- Confidence: "
              + str(confidence)
          )
          lines.append("")

          lines.append("### Reasons")
          lines.append("")

          for reason in reasons:
              lines.append(
                  "- " + reason
              )

          lines.append("")
          lines.append("## Authority")
          lines.append("")
          lines.append(
              "- Authority: "
              + authority
          )
          lines.append(
              "- Automatic deployment: false"
          )
          lines.append(
              "- Permanent rule change: false"
          )
          lines.append(
              "- Rollback protection: true"
          )
          lines.append("")

          lines.append("## Next stage")
          lines.append("")
          lines.append(
              "- " + next_stage
          )
          lines.append(
              "NØX will only move toward deployment "
              "through a reversible controlled step."
          )
          lines.append("")

          lines.append("## Safety")
          lines.append("")
          lines.append("- Gemini: disabled")
          lines.append("- External action: disabled")
          lines.append("- Contact: disabled")
          lines.append("- Bidding: disabled")
          lines.append("- Payments: disabled")
          lines.append("- Production rules changed: false")
          lines.append("- Project cost: €0")
          lines.append("- Human override: enabled")

          with open(
              os.path.join(
                  MEMORY,
                  "nox_v95_controlled_correction_arbitration.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          print(
              json.dumps(
                  {
                      "version": "V95",
                      "status": arbitration,
                      "score": score,
                      "confidence": confidence,
                      "correction": correction_id,
                      "next_stage": next_stage
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V95 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v95_controlled_correction_arbitration.json
          git add memory/nox_v95_controlled_correction_arbitration.md

          git diff --cached --quiet || \
            git commit -m "NØX V95 controlled correction arbitration"

          git push
