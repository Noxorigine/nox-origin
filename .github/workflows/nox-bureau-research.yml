name: NØX - Bureau Research Case

on:
  workflow_dispatch:
    inputs:
      research_question:
        description: "Question to investigate using two public sources"
        required: true
        type: string
      learner_task:
        description: "Intended learner or task this research should support"
        required: true
        type: string
      source_a_url:
        description: "Public HTTPS URL for source A"
        required: true
        type: string
      source_a_excerpt:
        description: "Relevant text excerpt from source A (not a URL)"
        required: true
        type: string
      source_b_url:
        description: "Public HTTPS URL for source B"
        required: true
        type: string
      source_b_excerpt:
        description: "Relevant text excerpt from source B (not a URL)"
        required: true
        type: string
      useful_result:
        description: "What a useful, checkable result would look like"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  BUREAU_RESEARCH_FILE: memory/nox_bureau_research.json
  MAX_BUREAU_CASES: "100"

jobs:
  research-sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: false

      - name: Validate script syntax
        run: python3 -m py_compile .github/scripts/nox_bureau_research.py

      - name: Fetch sources and build evidence packet
        env:
          RESEARCH_QUESTION: ${{ inputs.research_question }}
          LEARNER_TASK: ${{ inputs.learner_task }}
          SOURCE_A_URL: ${{ inputs.source_a_url }}
          SOURCE_A_EXCERPT: ${{ inputs.source_a_excerpt }}
          SOURCE_B_URL: ${{ inputs.source_b_url }}
          SOURCE_B_EXCERPT: ${{ inputs.source_b_excerpt }}
          USEFUL_RESULT: ${{ inputs.useful_result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .github/scripts/nox_bureau_research.py

      - name: Validate memory JSON and required safety flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("memory/nox_bureau_research.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert isinstance(data, dict)
          assert isinstance(data.get("cases"), list)
          assert data.get("schema_version", 0) >= 2

          latest = max(
              data["cases"],
              key=lambda c: c.get("updated_at", c.get("created_at", ""))
          )

          assert latest.get("external_ai_used") is False
          assert latest.get("published") is False
          assert latest.get("
