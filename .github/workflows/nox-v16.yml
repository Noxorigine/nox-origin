name: NØX Origin - V16 Action Planning

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"

permissions:
  contents: write

jobs:
  nox-v16:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V16
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v15_file = memory_dir / "nox_v15_scores.json"
          v16_file = memory_dir / "nox_v16_action_plans.json"

          print("======================================")
          print("NØX ORIGIN - V16 ACTION PLANNING")
          print("======================================")

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text()
                  )
              except Exception:
                  return default

          # ==========================================
          # 1. LOAD NØX KNOWLEDGE
          # ==========================================

          print("")
          print("[1/6] Loading NØX knowledge...")

          memory = load_json(
              memory_file,
              {}
          )

          v15_history = load_json(
              v15_file,
              []
          )

          if not v15_history:
              raise RuntimeError(
                  "No V15 scoring data found"
              )

          latest_v15 = v15_history[-1]

          ranking = latest_v15.get(
              "ranking",
              []
          )

          print(
              f"V15 opportunities: "
              f"{len(ranking)}"
          )

          # ==========================================
          # 2. SELECT TOP OPPORTUNITIES
          # ==========================================

          print("")
          print("[2/6] Selecting priority opportunities...")

          selected = ranking[:3]

          print(
              f"Selected opportunities: "
              f"{len(selected)}"
          )

          # ==========================================
          # 3. BUILD ACTION PLANS
          # ==========================================

          print("")
          print("[3/6] Building action plans...")

          templates = {

              "automation_service": {
                  "objective":
                      "Identify a repetitive task that can be automated for agents.",
                  "target":
                      "Agents facing repetitive or manual workflows.",
                  "resources": [
                      "Problem description",
                      "Example workflow",
                      "Possible automation method",
                      "Test environment"
                  ],
                  "steps": [
                      "Identify the exact repetitive task.",
                      "Measure how often the task occurs.",
                      "Define a minimal automation.",
                      "Test the automation on a small sample.",
                      "Measure time saved and reliability."
                  ],
                  "success_metrics": [
                      "Task completion rate",
                      "Time saved",
                      "Error rate",
                      "Number of agents interested"
                  ],
                  "economic_model":
                      "Potential future subscription, service fee, or usage-based model."
              },

              "information_service": {
                  "objective":
                      "Identify an information gap that can be solved with structured research.",
                  "target":
                      "Agents searching for reliable information or analysis.",
                  "resources": [
                      "Relevant public data",
                      "Research sources",
                      "Structured database",
                      "Validation method"
                  ],
                  "steps": [
                      "Define the information gap.",
                      "Identify reliable sources.",
                      "Collect and structure the information.",
                      "Create a small prototype.",
                      "Measure usefulness and repeat demand."
                  ],
                  "success_metrics": [
                      "Information accuracy",
                      "Usage frequency",
                      "User interest",
                      "Time saved"
                  ],
                  "economic_model":
                      "Potential future research service, premium information product, or API."
              },

              "collaboration_service": {
                  "objective":
                      "Identify agents with complementary capabilities and a common objective.",
                  "target":
                      "Agents seeking partners or collaborators.",
                  "resources": [
                      "Agent profiles",
                      "Capabilities",
                      "Shared objectives",
                      "Communication channel"
                  ],
                  "steps": [
                      "Identify the required capabilities.",
                      "Find compatible agents.",
                      "Compare objectives.",
                      "Define a small collaborative experiment.",
                      "Measure the result."
                  ],
                  "success_metrics": [
                      "Number of compatible agents",
                      "Response rate",
                      "Successful collaborations",
                      "Repeat collaborations"
                  ],
                  "economic_model":
                      "Potential future coordination, matchmaking, or collaboration service."
              },

              "technical_service": {
                  "objective":
                      "Identify a recurring technical problem that can be solved systematically.",
                  "target":
                      "Agents requiring technical assistance.",
                  "resources": [
                      "Problem reports",
                      "Technical documentation",
                      "Code or API examples",
                      "Testing environment"
                  ],
                  "steps": [
                      "Define the technical problem.",
                      "Identify recurring causes.",
                      "Design a minimal solution.",
                      "Test the solution.",
                      "Measure reliability and demand."
                  ],
                  "success_metrics": [
                      "Successful resolutions",
                      "Resolution time",
                      "Failure rate",
                      "Repeat demand"
                  ],
                  "economic_model":
                      "Potential future technical support, automation, or development service."
              },

              "agent_support": {
                  "objective":
                      "Identify a recurring need specifically affecting AI agents.",
                  "target":
                      "Autonomous or semi-autonomous agents.",
                  "resources": [
                      "Agent discussions",
                      "Observed problems",
                      "Existing tools",
                      "Prototype environment"
                  ],
                  "steps": [
                      "Identify the recurring agent problem.",
                      "Estimate how many agents are affected.",
                      "Design a minimal solution.",
                      "Test it with a limited group.",
                      "Measure usefulness and repeat demand."
                  ],
                  "success_metrics": [
                      "Agents affected",
                      "Adoption rate",
                      "Successful outcomes",
                      "Repeat usage"
                  ],
                  "economic_model":
                      "Potential future agent-focused service or infrastructure."
              },

              "marketplace_opportunity": {
                  "objective":
                      "Determine whether a recurring marketplace need can support a useful service.",
                  "target":
                      "Agents buying, selling, or requesting services.",
                  "resources": [
                      "Marketplace observations",
                      "Demand signals",
                      "Supply signals",
                      "Pricing observations"
                  ],
                  "steps": [
                      "Identify the recurring demand.",
                      "Identify available supply.",
                      "Compare demand and supply.",
                      "Design a minimal test.",
                      "Measure actual interest."
                  ],
                  "success_metrics": [
                      "Demand frequency",
                      "Supply availability",
                      "Conversion interest",
                      "Repeat demand"
                  ],
                  "economic_model":
                      "Potential future marketplace or coordination service."
              },

              "financial_opportunity": {
                  "objective":
                      "Study whether an observed financial need corresponds to a legitimate useful service.",
                  "target":
                      "Agents with recurring financial or revenue-related needs.",
                  "resources": [
                      "Public information",
                      "Observed demand",
                      "Risk assessment",
                      "Non-financial prototype"
                  ],
                  "steps": [
                      "Define the underlying problem.",
                      "Separate genuine utility from speculation.",
                      "Identify a non-financial test.",
                      "Measure demand.",
                      "Evaluate risks before considering monetization."
                  ],
                  "success_metrics": [
                      "Demand frequency",
                      "User interest",
                      "Risk level",
                      "Potential utility"
                  ],
                  "economic_model":
                      "Potential future legitimate service; no capital deployment at this stage."
              }
          }

          generic_template = {
              "objective":
                  "Investigate whether the observed opportunity represents a real recurring need.",
              "target":
                  "Agents affected by the observed need.",
              "resources": [
                  "Public information",
                  "Observed discussions",
                  "Simple prototype",
                  "Measurement method"
              ],
              "steps": [
                  "Define the problem precisely.",
                  "Measure recurrence.",
                  "Design a minimal test.",
                  "Run the test without financial commitment.",
                  "Measure the result."
              ],
              "success_metrics": [
                  "Demand",
                  "Usefulness",
                  "Reliability",
                  "Repeat interest"
              ],
              "economic_model":
                  "Potential future service if evidence supports it."
          }

          action_plans = []

          for item in selected:

              category = item.get(
                  "opportunity",
                  "unknown"
              )

              template = templates.get(
                  category,
                  generic_template
              )

              plan = {
                  "rank":
                      len(action_plans) + 1,

                  "opportunity":
                      category,

                  "score":
                      item.get(
                          "total_score",
                          0
                      ),

                  "priority":
                      item.get(
                          "priority",
                          "UNKNOWN"
                      ),

                  "persistence":
                      item.get(
                          "persistence",
                          "UNKNOWN"
                      ),

                  "objective":
                      template["objective"],

                  "target":
                      template["target"],

                  "resources":
                      template["resources"],

                  "steps":
                      template["steps"],

                  "success_metrics":
                      template["success_metrics"],

                  "economic_model":
                      template["economic_model"],

                  "status":
                      "OBSERVATION_ONLY"
              }

              action_plans.append(
                  plan
              )

          # ==========================================
          # 4. ADD VALIDATION RULES
          # ==========================================

          print("")
          print("[4/6] Applying validation rules...")

          validation_rules = [
              "No financial transaction.",
              "No capital deployment.",
              "No paid service.",
              "No external commitment.",
              "Test must remain reversible.",
              "Evidence must be measurable.",
              "Opportunity must be validated before execution."
          ]

          for plan in action_plans:
              plan["validation_rules"] = (
                  validation_rules
              )

          # ==========================================
          # 5. SAVE V16 REPORT
          # ==========================================

          print("")
          print("[5/6] Saving V16 action plans...")

          report = {
              "version": "V16",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source":
                  "NØX V15 Opportunity Scoring",
              "plans_created":
                  len(action_plans),
              "status":
                  "PLANNING_ONLY",
              "plans":
                  action_plans
          }

          history = load_json(
              v16_file,
              []
          )

          history.append(
              report
          )

          history = history[-20:]

          v16_file.write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # 6. UPDATE MEMORY
          # ==========================================

          print("")
          print("[6/6] Updating NØX memory...")

          memory["last_v16_analysis"] = (
              report["timestamp"]
          )

          memory["v16"] = {
              "plans_created":
                  len(action_plans),

              "top_opportunities": [
                  plan["opportunity"]
                  for plan in action_plans
              ],

              "status":
                  "PLANNING_ONLY"
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("======================================")
          print("NØX V16 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Plans created: "
              f"{len(action_plans)}"
          )

          print("")
          print("ACTION PLANS:")

          for plan in action_plans:

              print(
                  f"{plan['rank']}. "
                  f"{plan['opportunity']} | "
                  f"score={plan['score']} | "
                  f"priority={plan['priority']} | "
                  f"status={plan['status']}"
              )

          print("")
          print("Validation:")
          print("- No financial transaction")
          print("- No capital deployment")
          print("- No paid service")
          print("- Observation and testing only")

          PY

      - name: Commit NØX V16 knowledge
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v16_action_plans.json

          if git diff --cached --quiet; then
            echo "No new V16 knowledge to commit."
          else
            git commit -m "NØX V16 action planning"
            git push
          fi
