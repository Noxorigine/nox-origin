name: NØX Origin - V41 Colony Intelligent Selection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V41
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V41_COLONY_SELECTION.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V41")
          print("COLONY INTELLIGENT SELECTION")
          print("===================================")

          # --------------------------------------------------
          # 1. API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=20
          )

          print(
              f"Authentication status: "
              f"{token_response.status_code}"
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  f"Authentication failed: "
                  f"{token_response.status_code} "
                  f"{token_response.text}"
              )

          token_data = token_response.json()

          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # 3. LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "retrieval_log",
              []
          )

          memory.setdefault(
              "verification_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []
          )

          memory.setdefault(
              "colony_activity_log",
              []
          )

          memory.setdefault(
              "colony_interaction_log",
              []
          )

          memory.setdefault(
              "colony_learning_log",
              []
          )

          memory.setdefault(
              "colony_selection_log",
              []
          )

          # --------------------------------------------------
          # 4. PROFILE
          # --------------------------------------------------

          profile_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=20
          )

          if profile_response.status_code != 200:
              raise RuntimeError(
                  f"Profile request failed: "
                  f"{profile_response.status_code} "
                  f"{profile_response.text}"
              )

          profile = profile_response.json()

          username = (
              profile.get("username")
              or profile.get("user", {}).get("username")
              or "unknown"
          )

          karma = (
              profile.get("karma")
              or profile.get("user", {}).get("karma")
          )

          print(f"NØX username: {username}")
          print(f"NØX karma: {karma}")

          # --------------------------------------------------
          # 5. GET FOR-YOU FEED
          # --------------------------------------------------

          feed_response = requests.get(
              f"{BASE}/feed/for-you",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Feed status: "
              f"{feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"Feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text}"
              )

          feed_data = feed_response.json()

          if not isinstance(feed_data, dict):
              raise RuntimeError(
                  "Unexpected feed response format."
              )

          raw_items = feed_data.get("items", [])

          if not isinstance(raw_items, list):
              raise RuntimeError(
                  "Feed 'items' is not a list."
              )

          print(
              f"Feed candidates received: "
              f"{len(raw_items)}"
          )

          # --------------------------------------------------
          # 6. EXISTING INTERACTIONS
          # --------------------------------------------------

          interacted_post_ids = set()

          for item in memory[
              "colony_interaction_log"
          ]:

              if not isinstance(item, dict):
                  continue

              post_id = item.get("post_id")

              if post_id:
                  interacted_post_ids.add(
                      str(post_id)
                  )

          # Also include previously selected posts.
          selected_post_ids = set()

          for item in memory[
              "colony_selection_log"
          ]:

              if not isinstance(item, dict):
                  continue

              post_id = item.get("post_id")

              if post_id:
                  selected_post_ids.add(
                      str(post_id)
                  )

          # --------------------------------------------------
          # 7. NORMALIZE CANDIDATES
          # --------------------------------------------------

          candidates = []

          for index, item in enumerate(raw_items):

              if not isinstance(item, dict):
                  continue

              post = item.get("post")

              if not isinstance(post, dict):
                  continue

              post_id = post.get("id")

              if not post_id:
                  continue

              post_id = str(post_id)

              author = post.get("author")

              if not isinstance(author, dict):
                  author = {}

              author_username = (
                  author.get("username")
                  or author.get("display_name")
                  or "unknown"
              )

              # Never select NØX's own publication.
              if (
                  str(author_username).lower()
                  == str(username).lower()
              ):
                  continue

              # Never select a post already interacted with.
              if post_id in interacted_post_ids:
                  continue

              # Never repeatedly select the same candidate.
              if post_id in selected_post_ids:
                  continue

              title = str(
                  post.get("title") or ""
              ).strip()

              body = str(
                  post.get("body") or ""
              ).strip()

              reason = str(
                  item.get("reason") or ""
              ).strip()

              post_type = str(
                  post.get("post_type")
                  or "unknown"
              )

              colony_name = str(
                  post.get("colony_name")
                  or ""
              ).strip()

              match_score = item.get(
                  "match_score",
                  0
              )

              try:
                  match_score = float(
                      match_score
                  )
              except Exception:
                  match_score = 0.0

              # --------------------------------------------------
              # 8. SELECTION SCORE
              # --------------------------------------------------

              score = match_score

              if title:
                  score += 0.25

              if len(body) >= 100:
                  score += 0.25

              if len(body) >= 300:
                  score += 0.25

              if reason:
                  score += 0.15

              if post_type == "discussion":
                  score += 0.15

              # Slight preference for actual agent authors.
              if author.get("user_type") == "agent":
                  score += 0.10

              candidates.append({
                  "index": index,
                  "post_id": post_id,
                  "author": author_username,
                  "author_karma": author.get(
                      "karma"
                  ),
                  "title": title,
                  "body": body,
                  "reason": reason,
                  "match_score": match_score,
                  "selection_score": round(
                      score,
                      3
                  ),
                  "post_type": post_type,
                  "colony_name": colony_name
              })

          print(
              f"Usable candidates: "
              f"{len(candidates)}"
          )

          # --------------------------------------------------
          # 9. SELECT BEST CANDIDATE
          # --------------------------------------------------

          candidates.sort(
              key=lambda x: x[
                  "selection_score"
              ],
              reverse=True
          )

          selected = (
              candidates[0]
              if candidates
              else None
          )

          # --------------------------------------------------
          # 10. NO CANDIDATE
          # --------------------------------------------------

          if selected is None:

              print(
                  "No suitable candidate found."
              )

              selection_record = {
                  "timestamp": now,
                  "status": "no_selection",
                  "candidates_received": len(
                      raw_items
                  ),
                  "usable_candidates": 0
              }

              memory[
                  "colony_selection_log"
              ].append(
                  selection_record
              )

              memory[
                  "colony_activity_log"
              ].append({
                  "timestamp": now,
                  "version": "V41",
                  "activity": (
                      "intelligent_selection"
                  ),
                  "feed_items": len(
                      raw_items
                  ),
                  "usable_candidates": 0,
                  "selected_post": None
              })

              memory["version"] = "V41"
              memory["last_updated"] = now

              memory_file.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              report_file.write_text(
                  "# NØX Origin — V41 Colony Selection\n\n"
                  "No suitable publication was selected.\n\n"
                  f"- Feed candidates: {len(raw_items)}\n"
                  "- Usable candidates: 0\n"
                  "- Public action: NONE\n",
                  encoding="utf-8"
              )

              print("V41 completed without action.")
              raise SystemExit(0)

          # --------------------------------------------------
          # 11. DISPLAY SELECTION
          # --------------------------------------------------

          print("-----------------------------------")
          print("SELECTED PUBLICATION")
          print("-----------------------------------")

          print(
              f"Post ID: "
              f"{selected['post_id']}"
          )

          print(
              f"Author: "
              f"{selected['author']}"
          )

          print(
              f"Colony: "
              f"{selected['colony_name']}"
          )

          print(
              f"Title: "
              f"{selected['title']}"
          )

          print(
              f"Reason: "
              f"{selected['reason']}"
          )

          print(
              f"Match score: "
              f"{selected['match_score']}"
          )

          print(
              f"NØX selection score: "
              f"{selected['selection_score']}"
          )

          # --------------------------------------------------
          # 12. RETRIEVE FULL CONTEXT
          # --------------------------------------------------

          context_response = requests.get(
              f"{BASE}/posts/"
              f"{selected['post_id']}/context",
              headers=headers,
              timeout=30
          )

          context_status = (
              context_response.status_code
          )

          print(
              f"Context status: "
              f"{context_status}"
          )

          context_available = (
              context_status == 200
          )

          if context_available:
              context = context_response.json()
          else:
              context = None

          # IMPORTANT:
          # V41 does NOT publish anything.
          # Context retrieval is for selection validation.

          # --------------------------------------------------
          # 13. STORE SELECTION
          # --------------------------------------------------

          selection_record = {
              "timestamp": now,
              "version": "V41",
              "status": "selected",
              "post_id": selected["post_id"],
              "author": selected["author"],
              "author_karma": selected[
                  "author_karma"
              ],
              "colony_name": selected[
                  "colony_name"
              ],
              "post_type": selected[
                  "post_type"
              ],
              "title": selected["title"],
              "reason": selected["reason"],
              "match_score": selected[
                  "match_score"
              ],
              "selection_score": selected[
                  "selection_score"
              ],
              "context_retrieved": (
                  context_available
              ),
              "action_taken": False,
              "action": "selection_only"
          }

          memory[
              "colony_selection_log"
          ].append(
              selection_record
          )

          # --------------------------------------------------
          # 14. STORE OBSERVATION
          # --------------------------------------------------

          observation_id = (
              "v41_selection_"
              + selected["post_id"]
          )

          if not any(
              isinstance(item, dict)
              and item.get("id")
              == observation_id
              for item in memory[
                  "observations"
              ]
          ):

              memory[
                  "observations"
              ].append({
                  "id": observation_id,
                  "content": (
                      "NØX selected a Colony publication "
                      "as a high-relevance candidate for "
                      "future interaction."
                  ),
                  "source": "The Colony",
                  "source_type": (
                      "intelligent_selection"
                  ),
                  "colony_post_id": selected[
                      "post_id"
                  ],
                  "author": selected[
                      "author"
                  ],
                  "colony_name": selected[
                      "colony_name"
                  ],
                  "reason": selected[
                      "reason"
                  ],
                  "match_score": selected[
                      "match_score"
                  ],
                  "selection_score": selected[
                      "selection_score"
                  ],
                  "verification_status": (
                      "context_retrieved"
                      if context_available
                      else "context_unavailable"
                  ),
                  "confidence": 0.8,
                  "created_at": now
              })

          # --------------------------------------------------
          # 15. LEARNING RECORD
          # --------------------------------------------------

          memory[
              "learning_log"
          ].append({
              "timestamp": now,
              "version": "V41",
              "lesson": (
                  "The Colony's match score and reason "
                  "can be combined with content characteristics "
                  "to prioritize potentially useful publications."
              ),
              "source": "V41 intelligent selection",
              "confidence": 0.8
          })

          # --------------------------------------------------
          # 16. ACTIVITY LOG
          # --------------------------------------------------

          memory[
              "colony_activity_log"
          ].append({
              "timestamp": now,
              "version": "V41",
              "activity": (
                  "intelligent_selection"
              ),
              "feed_items": len(raw_items),
              "usable_candidates": len(
                  candidates
              ),
              "selected_post": selected[
                  "post_id"
              ],
              "selection_score": selected[
                  "selection_score"
              ],
              "context_retrieved": (
                  context_available
              ),
              "public_action": False
          })

          # --------------------------------------------------
          # 17. UPDATE VERSION
          # --------------------------------------------------

          memory["version"] = "V41"
          memory["last_updated"] = now

          memory[
              "colony_observer"
          ] = {
              "enabled": True,
              "last_observation": now,
              "mode": (
                  "observation_selection_learning"
              )
          }

          # --------------------------------------------------
          # 18. WRITE MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 19. VERIFY PERSISTENCE
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if loaded.get("version") != "V41":
              raise RuntimeError(
                  "V41 version persistence failed."
              )

          if not loaded.get(
              "colony_selection_log"
          ):
              raise RuntimeError(
                  "Selection log persistence failed."
              )

          last_selection = loaded[
              "colony_selection_log"
          ][-1]

          if last_selection.get(
              "post_id"
          ) != selected["post_id"]:
              raise RuntimeError(
                  "Selected post persistence failed."
              )

          print("Memory persistence: PASS")
          print("Selection persistence: PASS")

          # --------------------------------------------------
          # 20. REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V41 Colony Intelligent Selection",
              "",
              "## Session",
              "",
              f"- Timestamp: {now}",
              f"- Username: {username}",
              f"- Karma: {karma}",
              "",
              "## Feed",
              "",
              f"- Candidates received: "
              f"{len(raw_items)}",
              f"- Usable candidates: "
              f"{len(candidates)}",
              "",
              "## Selected Publication",
              "",
              f"- Post ID: "
              f"{selected['post_id']}",
              f"- Author: "
              f"{selected['author']}",
              f"- Author karma: "
              f"{selected['author_karma']}",
              f"- Colony: "
              f"{selected['colony_name']}",
              f"- Post type: "
              f"{selected['post_type']}",
              f"- Title: "
              f"{selected['title']}",
              f"- Colony reason: "
              f"{selected['reason']}",
              f"- Colony match score: "
              f"{selected['match_score']}",
              f"- NØX selection score: "
              f"{selected['selection_score']}",
              f"- Full context retrieved: "
              f"{'YES' if context_available else 'NO'}",
              "",
              "## Public Activity",
              "",
              "- New post: NO",
              "- New comment: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V41 Principle",
              "",
              "NØX is learning to choose before it acts.",
              "",
              "The selection combines Colony relevance "
              "signals with basic content characteristics.",
              "",
              "No public action was performed."
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V41 COMPLETE")
          print("===================================")
          print(
              f"Selected: "
              f"{selected['post_id']}"
          )
          print(
              f"Selection score: "
              f"{selected['selection_score']}"
          )
          print("Public action: NONE")
          print("===================================")
          PY

      - name: Commit V41 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V41_COLONY_SELECTION.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V41 - Intelligent Colony Selection"
            git push
          fi
