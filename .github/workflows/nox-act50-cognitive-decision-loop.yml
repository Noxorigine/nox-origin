name: NØX ACT50 - Cognitive Decision Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "07 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act50-cognitive-decision-loop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT50
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY = Path("memory")

          REQUIRED_SOURCES = {
              "ACT40": MEMORY / "nox_act_40_action_selection.json",
              "ACT41": MEMORY / "nox_act_41_action_outcome_evaluation.json",
              "ACT42": MEMORY / "nox_act_42_empirical_action_learning.json",
              "ACT43": MEMORY / "nox_act_43_generalization_of_empirical_learning.json",
              "ACT44": MEMORY / "nox_act_44_strategy_failure_detection.json",
              "ACT45": MEMORY / "nox_act_45_adaptive_strategy_selection.json",
              "ACT46": MEMORY / "nox_act_46_strategy_arbitration.json",
              "ACT47": MEMORY / "nox_act_47_strategy_combination.json",
              "ACT48": MEMORY / "nox_act_48_strategy_planning.json",
              "ACT49": MEMORY / "nox_act_49_uncertainty_management.json",
          }

          OUTPUT_JSON = MEMORY / "nox_act_50_cognitive_decision_loop.json"
          OUTPUT_MD = MEMORY / "nox_act_50_cognitive_decision_loop.md"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def verify_identity(data, act):
              if not isinstance(data, dict):
                  return False
              return data.get("act") == act

          sources = {}
          source_status = {}

          for act, path in REQUIRED_SOURCES.items():
              data = load_json(path)
              sources[act] = data

              source_status[act] = {
                  "file": str(path),
                  "exists": path.exists(),
                  "valid_json": data is not None,
                  "identity_verified": verify_identity(data, act),
              }

          all_sources_verified = all(
              item["exists"]
              and item["valid_json"]
              and item["identity_verified"]
              for item in source_status.values()
          )

          # ------------------------------------------------------------
          # Extract only explicit states from each cognitive layer.
          # ACT50 does not invent missing information.
          # ------------------------------------------------------------

          act40 = sources["ACT40"] or {}
          act41 = sources["ACT41"] or {}
          act42 = sources["ACT42"] or {}
          act43 = sources["ACT43"] or {}
          act44 = sources["ACT44"] or {}
          act45 = sources["ACT45"] or {}
          act46 = sources["ACT46"] or {}
          act47 = sources["ACT47"] or {}
          act48 = sources["ACT48"] or {}
          act49 = sources["ACT49"] or {}

          action_selection = act40.get("selection")
          outcome_evaluation = act41.get("evaluation")
          empirical_learning = act42.get("learning")
          generalization = act43.get("generalization")
          failure_detection = act44.get("failure_detection")
          adaptive_selection = act45.get("selection")
          arbitration = act46.get("arbitration")
          combination = act47.get("planning") or act47.get("combination")
          planning = act48.get("planning")
          uncertainty = act49.get("uncertainty")

          # ACT49 is the final gate.
          # ACT50 may synthesize the chain, but it cannot override an
          # unresolved uncertainty state.
          can_advance = (
              isinstance(uncertainty, dict)
              and uncertainty.get("can_advance") is True
          )

          uncertainty_decision = (
              uncertainty.get("decision")
              if isinstance(uncertainty, dict)
              else None
          )

          # ------------------------------------------------------------
          # Detect explicit decision/action evidence.
          #
          # No score is calculated here.
          # No hidden weighting is applied.
          # No "best guess" is generated.
          # ------------------------------------------------------------

          decision_supported = False
          decision_reason = ""

          if not all_sources_verified:
              decision_reason = (
                  "The complete ACT40-ACT49 cognitive chain could not "
                  "be verified. ACT50 refuses to construct a decision."
              )

          elif not can_advance:
              decision_reason = (
                  "ACT49 explicitly states that the current uncertainty "
                  "does not justify advancing. ACT50 therefore cannot "
                  "override the uncertainty gate."
              )

          elif planning is None:
              decision_reason = (
                  "ACT48 does not expose a valid planning state. "
                  "ACT50 cannot construct a decision."
              )

          elif not planning.get("order_supported", False):
              decision_reason = (
                  "ACT48 does not provide a supported execution order. "
                  "ACT50 cannot manufacture one."
              )

          elif not planning.get("selected_plan"):
              decision_reason = (
                  "ACT48 has no selected plan. ACT50 cannot invent a plan."
              )

          else:
              decision_supported = True
              decision_reason = (
                  "The upstream cognitive chain is verified and ACT49 "
                  "explicitly permits advancement with a supported ACT48 plan."
              )

          # ------------------------------------------------------------
          # Build an auditable synthesis.
          # ------------------------------------------------------------

          synthesis = {
              "perception_and_selection": {
                  "act40_present": action_selection is not None,
                  "state": action_selection,
              },
              "outcome_evaluation": {
                  "act41_present": outcome_evaluation is not None,
                  "state": outcome_evaluation,
              },
              "empirical_learning": {
                  "act42_present": empirical_learning is not None,
                  "state": empirical_learning,
              },
              "generalization": {
                  "act43_present": generalization is not None,
                  "state": generalization,
              },
              "failure_detection": {
                  "act44_present": failure_detection is not None,
                  "state": failure_detection,
              },
              "adaptive_strategy_selection": {
                  "act45_present": adaptive_selection is not None,
                  "state": adaptive_selection,
              },
              "strategy_arbitration": {
                  "act46_present": arbitration is not None,
                  "state": arbitration,
              },
              "strategy_combination": {
                  "act47_present": combination is not None,
                  "state": combination,
              },
              "strategy_planning": {
                  "act48_present": planning is not None,
                  "state": planning,
              },
              "uncertainty_management": {
                  "act49_present": uncertainty is not None,
                  "state": uncertainty,
              },
          }

          if decision_supported:
              decision = "DECISION_SUPPORTED"
              action = planning.get("selected_plan")
              confidence = None
              next_step = (
                  "A supported plan exists and ACT49 permits advancement. "
                  "The plan can proceed to the next operational layer."
              )
          else:
              decision = "NO_DEFENSIBLE_DECISION"
              action = None
              confidence = None
              next_step = (
                  "Do not act. Continue learning and evidence collection "
                  "until the upstream cognitive chain provides sufficient "
                  "support for a defensible decision."
              )

          result = {
              "act": "ACT50",
              "version": "V1",
              "title": "Cognitive Decision Loop",
              "question": (
                  "Je rassemble tout ce que j’ai appris pour construire "
                  "la meilleure décision possible."
              ),
              "timestamp_utc": now(),

              "cognitive_chain": {
                  "start": "ACT40",
                  "end": "ACT49",
                  "ordered_acts": list(REQUIRED_SOURCES.keys()),
                  "all_sources_verified": all_sources_verified,
              },

              "source_status": source_status,

              "synthesis": synthesis,

              "decision": {
                  "status": decision,
                  "supported": decision_supported,
                  "selected_action": action,
                  "numeric_confidence": confidence,
                  "reason": decision_reason,
              },

              "uncertainty_gate": {
                  "act49_decision": uncertainty_decision,
                  "can_advance": can_advance,
                  "overridden": False,
              },

              "safety": {
                  "decision_invented": False,
                  "strategy_invented": False,
                  "plan_invented": False,
                  "confidence_invented": False,
                  "score_invented": False,
                  "upstream_state_overridden": False,
                  "fallback_action_used": False,
                  "external_information_used": False,
              },

              "constraints": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "payments": False,
                  "spending": False,
                  "cost_eur": 0,
                  "python": "3.11",
              },

              "integrity": {
                  "all_sources_verified": all_sources_verified,
                  "act40_verified": source_status["ACT40"]["identity_verified"],
                  "act41_verified": source_status["ACT41"]["identity_verified"],
                  "act42_verified": source_status["ACT42"]["identity_verified"],
                  "act43_verified": source_status["ACT43"]["identity_verified"],
                  "act44_verified": source_status["ACT44"]["identity_verified"],
                  "act45_verified": source_status["ACT45"]["identity_verified"],
                  "act46_verified": source_status["ACT46"]["identity_verified"],
                  "act47_verified": source_status["ACT47"]["identity_verified"],
                  "act48_verified": source_status["ACT48"]["identity_verified"],
                  "act49_verified": source_status["ACT49"]["identity_verified"],
                  "gemini_used": False,
                  "external_ai_used": False,
                  "external_api_used": False,
                  "payments_used": False,
                  "spending_used": False,
              },

              "next_step": next_step,
          }

          MEMORY.mkdir(parents=True, exist_ok=True)

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")

          md = f"""# NØX ACT50 — Cognitive Decision Loop

          **Version:** V1  
          **Question:** Je rassemble tout ce que j’ai appris pour construire la meilleure décision possible.  
          **Decision:** `{decision}`  
          **Supported:** `{decision_supported}`  
          **Timestamp UTC:** `{result["timestamp_utc"]}`

          ## Cognitive chain

          ACT40 → ACT41 → ACT42 → ACT43 → ACT44 → ACT45 → ACT46 → ACT47 → ACT48 → ACT49 → **ACT50**

          All required sources verified: `{all_sources_verified}`

          ## ACT49 uncertainty gate

          - Decision: `{uncertainty_decision}`
          - Can advance: `{can_advance}`
          - Overridden: `false`

          ## Final decision

          **{decision}**

          {decision_reason}

          ### Selected action

          ```json
          {json.dumps(action, ensure_ascii=False, indent=2)}
          ```

          ## Principle

          ACT50 does not create a decision merely because all previous
          cognitive layers exist.

          It synthesizes their explicit states while respecting the
          strongest constraint in the chain: unresolved uncertainty.

          Therefore:

          - no invented strategy;
          - no invented plan;
          - no invented confidence;
          - no hidden score;
          - no arbitrary fallback;
          - no override of ACT49;
          - no external AI;
          - no Gemini;
          - no external API;
          - no spending;
          - no payments.

          ## Next step

          {next_step}
          """

          with OUTPUT_MD.open("w", encoding="utf-8") as f:
              f.write(md)

          print("=== NØX ACT50 V1 ===")
          print(f"All sources verified: {all_sources_verified}")
          print(f"ACT49 decision: {uncertainty_decision}")
          print(f"ACT49 can advance: {can_advance}")
          print(f"Decision: {decision}")
          print(f"Decision supported: {decision_supported}")
          print(f"Selected action: {json.dumps(action, ensure_ascii=False)}")
          print("Numeric confidence: null")
          print("Decision invented: false")
          print("Plan invented: false")
          print("ACT49 overridden: false")
          print("Gemini: false")
          print("External AI: false")
          print("External API: false")
          print("Payments: false")
          print("Spending: false")
          print("Cost EUR: 0")

          PY

      - name: Commit ACT50 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_50_cognitive_decision_loop.json \
                  memory/nox_act_50_cognitive_decision_loop.md

          if git diff --cached --quiet; then
            echo "No ACT50 changes to commit."
          else
            git commit -m "ACT50: add cognitive decision loop"
            git push
          fi
