name: NØX ACT 38 - Evidence Fusion & Contradiction Handling

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evidence-fusion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT38
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          MEMORY_DIR = "memory"
          os.makedirs(MEMORY_DIR, exist_ok=True)

          ACT37_PATH = os.path.join(
              MEMORY_DIR,
              "nox_act_37_cognitive_signal_reliability.json"
          )

          ACT36_PATH = os.path.join(
              MEMORY_DIR,
              "nox_act_36_self_audit.json"
          )

          def load_json(path):
              if not os.path.isfile(path):
                  return None
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          act37 = load_json(ACT37_PATH)
          act36 = load_json(ACT36_PATH)

          if act37 is None:
              raise SystemExit("ACT38 requires ACT37 memory.")

          if not isinstance(act37.get("signals"), list):
              raise SystemExit("ACT38 requires ACT37 signals.")

          signals = act37["signals"]

          def clamp(value, low=0.0, high=100.0):
              return max(low, min(high, float(value)))

          def reliability_weight(signal):
              measurement = clamp(
                  signal.get("measurement_reliability_score", 0)
              )

              empirical = clamp(
                  signal.get("empirical_validity_score", 0)
              )

              # Measurement reliability determines whether we can trust
              # the signal as a correctly read internal value.
              #
              # Empirical validity determines whether the signal has
              # demonstrated correspondence with reality.
              #
              # We deliberately do not collapse these two dimensions.
              #
              # For evidence fusion, both matter.
              combined = (
                  measurement * 0.60
                  + empirical * 0.40
              )

              return round(combined, 2)

          enriched = []

          for signal in signals:
              item = dict(signal)
              item["fusion_weight"] = reliability_weight(signal)

              if item["measurement_reliability_score"] < 50:
                  item["fusion_status"] = "excluded"
              elif item["measurement_reliability_score"] < 70:
                  item["fusion_status"] = "cautious"
              elif item["empirical_validity_score"] < 25:
                  item["fusion_status"] = "structural_only"
              else:
                  item["fusion_status"] = "usable"

              enriched.append(item)

          # ------------------------------------------------------------
          # Evidence classes
          # ------------------------------------------------------------

          structural_only = [
              s["signal_id"]
              for s in enriched
              if s["fusion_status"] == "structural_only"
          ]

          usable_signals = [
              s["signal_id"]
              for s in enriched
              if s["fusion_status"] in {"usable", "structural_only"}
          ]

          excluded_signals = [
              s["signal_id"]
              for s in enriched
              if s["fusion_status"] == "excluded"
          ]

          cautious_signals = [
              s["signal_id"]
              for s in enriched
              if s["fusion_status"] == "cautious"
          ]

          # ------------------------------------------------------------
          # Semantic evidence groups
          #
          # These groups do not claim that signals are independent.
          # They are used to compare different representations of
          # related cognitive states.
          # ------------------------------------------------------------

          evidence_groups = {
              "prediction_and_anticipation": [
                  "prediction_count",
                  "scenario_count"
              ],
              "decision_confidence": [
                  "strategy_confidence",
                  "strategy_score",
                  "self_awareness"
              ],
              "empirical_validation": [
                  "observed_outcomes",
                  "comparable_outcomes",
                  "evidence_quality"
              ],
              "resource_and_goal_management": [
                  "allocation_quality",
                  "goal_quality"
              ],
              "experimental_process": [
                  "experiment_count",
                  "experiment_priority"
              ],
              "attention_and_monitoring": [
                  "attention_selection",
                  "monitoring_selection"
              ],
              "self_improvement": [
                  "improvement_state",
                  "audit_quality"
              ],
              "relational_model": [
                  "relationship_count"
              ]
          }

          signal_map = {
              s["signal_id"]: s for s in enriched
          }

          # ------------------------------------------------------------
          # Contradiction detection
          # ------------------------------------------------------------

          contradictions = []

          def add_contradiction(
              contradiction_id,
              signals_involved,
              severity,
              description,
              effect,
              resolution
          ):
              contradictions.append({
                  "contradiction_id": contradiction_id,
                  "signals": signals_involved,
                  "severity": severity,
                  "description": description,
                  "effect_on_confidence": effect,
                  "resolution": resolution
              })

          # C01 — high structural measurement + no empirical validation.
          # This is not a logical contradiction, but an epistemic tension.
          high_structure_low_empirical = []

          for s in enriched:
              if (
                  s["measurement_reliability_score"] >= 85
                  and s["empirical_validity_score"] < 25
              ):
                  high_structure_low_empirical.append(s["signal_id"])

          if high_structure_low_empirical:
              add_contradiction(
                  "C01",
                  high_structure_low_empirical,
                  "moderate",
                  (
                      "Several signals are measured reliably internally "
                      "but have little or no empirical validation."
                  ),
                  "lower_confidence_in_real_world_claims",
                  (
                      "Allow these signals to describe internal state, "
                      "but do not treat them as strong evidence about reality."
                  )
              )

          # C02 — ACT35 improvement state vs lack of empirical outcomes.
          add_contradiction(
              "C02",
              ["improvement_state", "observed_outcomes", "comparable_outcomes"],
              "high",
              (
                  "NØX has a self-improvement process, but ACT31 still "
                  "reports zero observed and comparable outcomes."
              ),
              "block_improvement_claims",
              (
                  "Treat improvement as unproven until real comparable "
                  "outcomes exist."
              )
          )

          # C03 — ACT30 confidence vs ACT31 validation state.
          add_contradiction(
              "C03",
              ["strategy_confidence", "strategy_score", "comparable_outcomes"],
              "high",
              (
                  "Internal strategy confidence is substantial while "
                  "strategy validation remains inconclusive."
              ),
              "reduce_decision_confidence",
              (
                  "Confidence may guide exploration but cannot validate "
                  "the strategy."
              )
          )

          # C04 — ACT26 attention source unavailable.
          add_contradiction(
              "C04",
              ["attention_selection", "monitoring_selection"],
              "moderate",
              (
                  "Monitoring is measurable while the authoritative "
                  "attention-selection signal remains unavailable."
              ),
              "reduce_attention_based_confidence",
              (
                  "Do not infer attention quality from monitoring alone."
              )
          )

          # C05 — ACT32 priority propagation failure.
          add_contradiction(
              "C05",
              ["experiment_priority", "allocation_quality"],
              "high",
              (
                  "Experiment priority was lost in ACT32 while downstream "
                  "allocation remains structurally valid."
              ),
              "exclude_priority_from_allocation_reasoning",
              (
                  "Repair priority propagation before allowing experiment "
                  "priority to influence autonomous allocation."
              )
          )

          # C06 — ACT35 baseline vs ACT36 measurement reliability.
          add_contradiction(
              "C06",
              ["improvement_state", "audit_quality"],
              "moderate",
              (
                  "ACT35 established a baseline, but ACT37 could not reliably "
                  "retrieve the improvement-state field from its memory."
              ),
              "lower_confidence_in_downstream_ingestion",
              (
                  "Repair the ACT35 data contract without changing the "
                  "underlying ACT35 conclusion."
              )
          )

          # ------------------------------------------------------------
          # Independence analysis
          # ------------------------------------------------------------

          duplicated_information = []

          for group_name, ids in evidence_groups.items():
              present = [
                  signal_map[x]
                  for x in ids
                  if x in signal_map
              ]

              if len(present) >= 2:
                  duplicated_information.append({
                      "group": group_name,
                      "signals": [x["signal_id"] for x in present],
                      "independence_status": (
                          "unknown_not_proven"
                      ),
                      "rule": (
                          "Multiple internal signals must not be treated "
                          "as independent evidence unless independence "
                          "is demonstrated."
                      )
                  })

          # ------------------------------------------------------------
          # Evidence fusion examples
          #
          # These are state assessments, not claims about external reality.
          # ------------------------------------------------------------

          fused_assessments = []

          def fused_score(ids):
              selected = [
                  signal_map[x]
                  for x in ids
                  if x in signal_map
                  and signal_map[x]["fusion_status"] != "excluded"
              ]

              if not selected:
                  return None

              total_weight = sum(
                  max(s["fusion_weight"], 1.0)
                  for s in selected
              )

              weighted = sum(
                  s["fusion_weight"]
                  * (
                      1.0
                      if s["empirical_validity_score"] >= 40
                      else 0.5
                  )
                  for s in selected
              )

              return round(
                  weighted / total_weight * 100,
                  2
              )

          # Assessment 1: prediction readiness
          prediction_ids = [
              "prediction_count",
              "scenario_count",
              "relationship_count"
          ]

          prediction_fusion = fused_score(prediction_ids)

          fused_assessments.append({
              "assessment_id": "F01",
              "topic": "prediction_readiness",
              "signals": prediction_ids,
              "fusion_score": prediction_fusion,
              "status": "structurally_supported_but_unvalidated",
              "conclusion": (
                  "NØX has a coherent prediction-generation structure, "
                  "but prediction quality cannot yet be established."
              ),
              "confidence_ceiling": 55
          })

          # Assessment 2: strategy validation
          strategy_ids = [
              "strategy_confidence",
              "strategy_score",
              "observed_outcomes",
              "comparable_outcomes",
              "evidence_quality"
          ]

          strategy_fusion = fused_score(strategy_ids)

          fused_assessments.append({
              "assessment_id": "F02",
              "topic": "strategy_validation",
              "signals": strategy_ids,
              "fusion_score": strategy_fusion,
              "status": "inconclusive",
              "conclusion": (
                  "Internal strategy signals are available, but the "
                  "absence of observed and comparable outcomes prevents "
                  "validation."
              ),
              "confidence_ceiling": 35
          })

          # Assessment 3: resource/goal coherence
          resource_ids = [
              "allocation_quality",
              "goal_quality",
              "experiment_count"
          ]

          resource_fusion = fused_score(resource_ids)

          fused_assessments.append({
              "assessment_id": "F03",
              "topic": "resource_goal_coherence",
              "signals": resource_ids,
              "fusion_score": resource_fusion,
              "status": "structurally_supported",
              "conclusion": (
                  "Goal and allocation structures are coherent internally, "
                  "but their real-world effectiveness remains unvalidated."
              ),
              "confidence_ceiling": 60
          })

          # Assessment 4: attention reliability
          attention_ids = [
              "attention_selection",
              "monitoring_selection"
          ]

          attention_fusion = fused_score(attention_ids)

          fused_assessments.append({
              "assessment_id": "F04",
              "topic": "attention_reliability",
              "signals": attention_ids,
              "fusion_score": attention_fusion,
              "status": "partially_observable",
              "conclusion": (
                  "Monitoring is measurable, but the authoritative "
                  "attention-selection signal is missing."
              ),
              "confidence_ceiling": 35
          })

          # Assessment 5: self-improvement
          improvement_ids = [
              "improvement_state",
              "observed_outcomes",
              "comparable_outcomes",
              "audit_quality"
          ]

          improvement_fusion = fused_score(improvement_ids)

          fused_assessments.append({
              "assessment_id": "F05",
              "topic": "self_improvement",
              "signals": improvement_ids,
              "fusion_score": improvement_fusion,
              "status": "not_demonstrated",
              "conclusion": (
                  "NØX has a self-improvement mechanism and an audit layer, "
                  "but real improvement has not yet been demonstrated."
              ),
              "confidence_ceiling": 30
          })

          # ------------------------------------------------------------
          # Contradiction impact
          # ------------------------------------------------------------

          high_contradictions = [
              c for c in contradictions
              if c["severity"] == "high"
          ]

          moderate_contradictions = [
              c for c in contradictions
              if c["severity"] == "moderate"
          ]

          global_confidence_penalty = (
              len(high_contradictions) * 12
              + len(moderate_contradictions) * 5
          )

          global_confidence_penalty = min(
              global_confidence_penalty,
              60
          )

          baseline_fusion_confidence = 70.0

          fusion_confidence = round(
              max(
                  10.0,
                  baseline_fusion_confidence
                  - global_confidence_penalty
              ),
              2
          )

          # ------------------------------------------------------------
          # Decision policy
          # ------------------------------------------------------------

          decision_policy = [
              "Evidence from excluded signals must not influence autonomous decisions.",
              "Cautious signals may inform monitoring but must not dominate a decision.",
              "Structural-only evidence may describe internal state but cannot establish external truth.",
              "Observed outcomes receive priority over predictions and confidence scores.",
              "Comparable outcomes are required before claiming strategy validation.",
              "Multiple signals are not automatically independent evidence.",
              "Repeated copies of the same upstream signal must not multiply confidence.",
              "Contradictions reduce confidence rather than being silently resolved.",
              "Missing evidence lowers confidence; it does not become negative evidence.",
              "A measured zero remains valid when the source explicitly defines zero.",
              "When evidence remains insufficient, the correct conclusion is inconclusive.",
              "Signal reliability must constrain decision confidence.",
              "No fused assessment grants execution, payment or spending permission."
          ]

          # ------------------------------------------------------------
          # Decision readiness
          # ------------------------------------------------------------

          decision_readiness = {
              "status": "limited",
              "autonomous_decision_confidence_ceiling": 35,
              "reason": (
                  "NØX can fuse internal evidence, but empirical validity "
                  "remains low and several important contradictions remain."
              ),
              "requirements_for_higher_readiness": [
                  "real observed outcomes",
                  "comparable outcomes",
                  "repaired attention signal",
                  "repaired experiment priority propagation",
                  "repaired ACT35 improvement-state ingestion",
                  "repeated evidence across independent observations"
              ]
          }

          # ------------------------------------------------------------
          # Repair queue
          # ------------------------------------------------------------

          repair_queue = [
              {
                  "priority": "high",
                  "issue": "attention_selection",
                  "action": (
                      "Create one canonical structured ACT26 attention list "
                      "and preserve it unchanged for downstream ACTs."
                  )
              },
              {
                  "priority": "high",
                  "issue": "experiment_priority",
                  "action": (
                      "Preserve ACT31 experiment priority when generating "
                      "ACT32 experiment records."
                  )
              },
              {
                  "priority": "medium",
                  "issue": "improvement_state",
                  "action": (
                      "Expose ACT35 improvement_state as a canonical field "
                      "and preserve it for ACT36/ACT37/ACT38 ingestion."
                  )
              },
              {
                  "priority": "high",
                  "issue": "empirical_outcomes",
                  "action": (
                      "Begin collecting real outcomes for predictions and "
                      "strategies before increasing autonomous confidence."
                  )
              }
          ]

          output = {
              "act": "ACT38",
              "name": "Evidence Fusion & Contradiction Handling",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Combine multiple cognitive signals according to their "
                  "reliability while detecting contradictions, duplicated "
                  "evidence and unsupported confidence."
              ),

              "principle": (
                  "More signals do not automatically mean more evidence. "
                  "Evidence becomes stronger when signals are reliable, "
                  "relevant, sufficiently independent and empirically supported."
              ),

              "source_acts": [
                  "ACT37",
                  "ACT36"
              ],

              "source_completeness": {
                  "ACT37": bool(act37),
                  "ACT36": bool(act36)
              },

              "evidence_model": {
                  "measurement_reliability": (
                      "How reliably the signal was read and preserved."
                  ),
                  "empirical_validity": (
                      "How strongly the signal has been supported by real outcomes."
                  ),
                  "fusion_weight": (
                      "A combined weight used to prevent weak signals "
                      "from dominating stronger evidence."
                  ),
                  "independence": (
                      "Multiple signals are not assumed to be independent."
                  ),
                  "contradiction": (
                      "Conflicting evidence reduces confidence and remains "
                      "explicitly recorded."
                  )
              },

              "signals": enriched,

              "evidence_groups": evidence_groups,

              "duplicated_information": duplicated_information,

              "contradictions": contradictions,

              "fused_assessments": fused_assessments,

              "global_confidence": {
                  "baseline": baseline_fusion_confidence,
                  "high_contradictions": len(high_contradictions),
                  "moderate_contradictions": len(moderate_contradictions),
                  "penalty": global_confidence_penalty,
                  "result": fusion_confidence,
                  "interpretation": (
                      "This is a confidence in the evidence-fusion process, "
                      "not a probability that a conclusion is true."
                  )
              },

              "decision_readiness": decision_readiness,

              "decision_policy": decision_policy,

              "repair_queue": repair_queue,

              "epistemic_rules": [
                  "more_signals_do_not_automatically_mean_more_evidence",
                  "duplicated_evidence_must_not_be_double_counted",
                  "contradictions_reduce_confidence",
                  "missing_evidence_is_not_negative_evidence",
                  "zero_is_not_missing",
                  "prediction_is_not_outcome",
                  "confidence_is_not_accuracy",
                  "structural_consistency_is_not_empirical_truth",
                  "internal_state_is_not_external_validation",
                  "real_outcomes_have_priority_over_internal_scores",
                  "inconclusive_is_a_valid_conclusion",
                  "fusion_does_not_create_evidence_that_does_not_exist"
              ],

              "lessons": [
                  "NØX must learn to combine evidence without double-counting it.",
                  "Contradictions are information and must remain visible.",
                  "Confidence must fall when important evidence is missing or conflicting.",
                  "Independent observations are more valuable than repeated internal calculations.",
                  "A coherent internal model can still be empirically wrong.",
                  "Evidence fusion is useful only when the quality of its inputs is understood."
              ],

              "metrics": {
                  "signals_received": len(enriched),
                  "usable_signals": len(usable_signals),
                  "cautious_signals": len(cautious_signals),
                  "excluded_signals": len(excluded_signals),
                  "evidence_groups": len(evidence_groups),
                  "duplicated_information_groups": len(duplicated_information),
                  "contradictions": len(contradictions),
                  "high_contradictions": len(high_contradictions),
                  "moderate_contradictions": len(moderate_contradictions),
                  "fused_assessments": len(fused_assessments),
                  "fusion_confidence": fusion_confidence,
                  "decision_confidence_ceiling": 35
              },

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT38 may combine evidence and reduce or increase "
                      "confidence, but it does not grant permission to "
                      "execute actions, spend funds or make payments."
                  )
              },

              "next_action": (
                  "collect_real_outcomes_and_repair_data_contracts"
              ),

              "next_cognitive_step": (
                  "ACT39 should calibrate confidence against repeated "
                  "observed outcomes and learn whether NØX's confidence "
                  "tracks actual accuracy."
              )
          }

          output_path = os.path.join(
              MEMORY_DIR,
              "nox_act_38_evidence_fusion.json"
          )

          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("")
          print("==============================================")
          print("NØX ACT38 - EVIDENCE FUSION")
          print("==============================================")
          print(f"Signals received: {len(enriched)}")
          print(f"Usable signals: {len(usable_signals)}")
          print(f"Cautious signals: {len(cautious_signals)}")
          print(f"Excluded signals: {len(excluded_signals)}")
          print(f"Evidence groups: {len(evidence_groups)}")
          print(f"Duplicated-information groups: {len(duplicated_information)}")
          print(f"Contradictions: {len(contradictions)}")
          print(f"High contradictions: {len(high_contradictions)}")
          print(f"Fused assessments: {len(fused_assessments)}")
          print(f"Fusion confidence: {fusion_confidence}")
          print("Decision confidence ceiling: 35")
          print("")
          print("CONTRADICTIONS:")
          for contradiction in contradictions:
              print(
                  f" - {contradiction['contradiction_id']} "
                  f"[{contradiction['severity']}] "
                  f"{contradiction['description']}"
              )

          print("")
          print("FUSED ASSESSMENTS:")
          for assessment in fused_assessments:
              print(
                  f" - {assessment['assessment_id']} "
                  f"{assessment['topic']} "
                  f"score={assessment['fusion_score']} "
                  f"status={assessment['status']}"
              )

          print("")
          print("REPAIR QUEUE:")
          for item in repair_queue:
              print(
                  f" - {item['priority']} "
                  f"{item['issue']}"
              )

          print("")
          print(
              "Next action: "
              "collect_real_outcomes_and_repair_data_contracts"
          )
          print(f"Memory written: {output_path}")
          PY

      - name: Validate ACT38 memory
        run: |
          python - <<'PY'
          import json

          path = "memory/nox_act_38_evidence_fusion.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "act",
              "name",
              "signals",
              "evidence_groups",
              "duplicated_information",
              "contradictions",
              "fused_assessments",
              "global_confidence",
              "decision_readiness",
              "decision_policy",
              "repair_queue",
              "epistemic_rules",
              "metrics",
              "autonomy_rule",
              "next_action"
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "ACT38 validation failed. Missing: "
                  + ", ".join(missing)
              )

          if data["act"] != "ACT38":
              raise SystemExit("Wrong ACT identifier.")

          if data["gemini_used"] is not False:
              raise SystemExit("Gemini must remain false.")

          if data["project_cost_eur"] != 0:
              raise SystemExit("Project cost must remain 0 EUR.")

          if data["autonomy_rule"]["execution_permission"] is not False:
              raise SystemExit("Execution permission must remain false.")

          if data["autonomy_rule"]["financial_permission"] is not False:
              raise SystemExit("Financial permission must remain false.")

          if data["autonomy_rule"]["payment_permission"] is not False:
              raise SystemExit("Payment permission must remain false.")

          if data["autonomy_rule"]["spending_permission"] is not False:
              raise SystemExit("Spending permission must remain false.")

          if not data["signals"]:
              raise SystemExit("No signals were fused.")

          if not data["contradictions"]:
              raise SystemExit(
                  "ACT38 validation failed: contradiction handling "
                  "must be represented."
              )

          for assessment in data["fused_assessments"]:
              score = assessment["fusion_score"]
              if score is not None and not 0 <= score <= 100:
                  raise SystemExit(
                      f"Invalid fusion score: {assessment['assessment_id']}"
                  )

          ceiling = data["decision_readiness"][
              "autonomous_decision_confidence_ceiling"
          ]

          if ceiling > 35:
              raise SystemExit(
                  "ACT38 decision ceiling unexpectedly increased."
              )

          print("ACT38 validation: PASS")
          print(f"Signals: {len(data['signals'])}")
          print(f"Contradictions: {len(data['contradictions'])}")
          print(f"Assessments: {len(data['fused_assessments'])}")
          print(
              "Decision confidence ceiling:",
              ceiling
          )
          PY

      - name: Commit ACT38
        run: |
          git config user.name "NØX"
          git config user.email "nox@noreply.local"

          git add .github/workflows/ACT38_Evidence_Fusion.yml
          git add memory/nox_act_38_evidence_fusion.json

          if git diff --cached --quiet; then
            echo "No ACT38 changes to commit."
            exit 0
          fi

          git commit -m "Add NØX ACT38 evidence fusion"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected. Rebasing against latest main..."

            git fetch origin main

            if git rebase origin/main; then
              sleep $((attempt * 2))
            else
              echo "Rebase conflict detected."
              git rebase --abort
              sleep $((attempt * 3))
            fi
          done

          echo "Unable to push ACT38 after retries."
          exit 1
