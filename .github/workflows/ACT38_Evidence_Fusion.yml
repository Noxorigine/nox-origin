name: NØX ACT 38 V2 - Evidence Fusion & Contradiction Handling

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evidence-fusion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT38 V2
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(exist_ok=True)

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def recursive_find(obj, keys):
              wanted = {str(k).lower() for k in keys}

              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if str(k).lower() in wanted:
                          return v
                  for v in obj.values():
                      result = recursive_find(v, keys)
                      if result is not None:
                          return result

              elif isinstance(obj, list):
                  for item in obj:
                      result = recursive_find(item, keys)
                      if result is not None:
                          return result

              return None

          def recursive_find_all(obj, keys):
              wanted = {str(k).lower() for k in keys}
              found = []

              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if str(k).lower() in wanted:
                          found.append(v)
                      found.extend(recursive_find_all(v, keys))

              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(recursive_find_all(item, keys))

              return found

          def first_number(obj, keys):
              value = recursive_find(obj, keys)

              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  return float(value)

              if isinstance(value, str):
                  match = re.search(r"-?\d+(?:\.\d+)?", value)
                  if match:
                      try:
                          return float(match.group(0))
                      except Exception:
                          return None

              return None

          def first_string(obj, keys):
              value = recursive_find(obj, keys)
              if isinstance(value, str):
                  return value
              return None

          def load_act(number, preferred_names):
              candidates = []

              for name in preferred_names:
                  candidates.append(MEMORY / name)

              candidates.extend(sorted(MEMORY.glob(f"*act_{number}_*.json")))
              candidates.extend(sorted(MEMORY.glob(f"*ACT{number}*.json")))

              seen = set()

              for path in candidates:
                  if str(path) in seen:
                      continue
                  seen.add(str(path))

                  if path.exists():
                      data = load_json(path)
                      if data:
                          return data, str(path)

              return {}, None

          act37, act37_path = load_act(
              37,
              [
                  "nox_act_37_cognitive_signal_reliability.json",
                  "nox_act_37_cognitive_signal_reliability_v2.json",
              ],
          )

          act36, act36_path = load_act(
              36,
              [
                  "nox_act_36_self_audit.json",
              ],
          )

          act35, act35_path = load_act(
              35,
              [
                  "nox_act_35_self_improvement_loop.json",
              ],
          )

          source_acts = {
              "ACT37": act37,
              "ACT36": act36,
              "ACT35": act35,
          }

          source_completeness = round(
              sum(bool(v) for v in source_acts.values())
              / len(source_acts)
              * 100,
              2,
          )

          # ------------------------------------------------------------
          # 1. Recover ACT37 signal information
          # ------------------------------------------------------------

          signals = []

          possible_signal_lists = [
              act37.get("signals"),
              act37.get("signal_assessments"),
              act37.get("evaluated_signals"),
              act37.get("cognitive_signals"),
          ]

          for candidate in possible_signal_lists:
              if isinstance(candidate, list):
                  signals = candidate
                  break

          if not signals:
              recursive_lists = recursive_find_all(
                  act37,
                  [
                      "signals",
                      "signal_assessments",
                      "evaluated_signals",
                      "cognitive_signals",
                  ],
              )

              for candidate in recursive_lists:
                  if isinstance(candidate, list):
                      signals = candidate
                      break

          # Fallback to the known ACT37 signal contract.
          if not signals:
              known_signals = [
                  ("attention_selection", 35.0, "low", "excluded"),
                  ("monitoring_selection", 78.0, "moderate", "cautious"),
                  ("relationship_count", 92.0, "high", "usable"),
                  ("prediction_count", 94.0, "high", "structural"),
                  ("scenario_count", 94.0, "high", "structural"),
                  ("self_awareness", 82.0, "moderate", "structural"),
                  ("strategy_confidence", 84.0, "moderate", "structural"),
                  ("strategy_score", 82.0, "moderate", "structural"),
                  ("observed_outcomes", 96.0, "high", "structural"),
                  ("comparable_outcomes", 96.0, "high", "structural"),
                  ("evidence_quality", 88.0, "high", "structural"),
                  ("experiment_priority", 38.0, "low", "excluded"),
                  ("experiment_count", 94.0, "high", "structural"),
                  ("allocation_quality", 88.0, "high", "structural"),
                  ("goal_quality", 88.0, "high", "structural"),
                  ("improvement_state", 35.0, "low", "excluded"),
                  ("audit_quality", 86.0, "high", "structural"),
              ]

              for name, reliability, level, status in known_signals:
                  signals.append(
                      {
                          "signal": name,
                          "reliability": reliability,
                          "reliability_level": level,
                          "decision_status": status,
                      }
                  )

          normalized_signals = []

          for item in signals:
              if not isinstance(item, dict):
                  continue

              name = (
                  item.get("signal")
                  or item.get("name")
                  or item.get("signal_name")
                  or item.get("metric")
              )

              if not name:
                  continue

              reliability = (
                  item.get("reliability")
                  if item.get("reliability") is not None
                  else item.get("measurement_reliability")
              )

              try:
                  reliability = float(reliability)
              except Exception:
                  reliability = None

              status = (
                  item.get("decision_status")
                  or item.get("status")
                  or item.get("decision_eligibility")
                  or "unknown"
              )

              normalized_signals.append(
                  {
                      "signal": name,
                      "reliability": reliability,
                      "status": status,
                      "measurement_reliability": reliability,
                      "empirical_validity": item.get(
                          "empirical_validity",
                          item.get("empirical_reliability"),
                      ),
                  }
              )

          # Remove duplicate signal names while preserving the first useful record.
          unique = {}

          for item in normalized_signals:
              name = item["signal"]
              if name not in unique:
                  unique[name] = item

          normalized_signals = list(unique.values())

          # ------------------------------------------------------------
          # 2. Evidence grouping
          # ------------------------------------------------------------

          evidence_groups = {
              "prediction_and_anticipation": [
                  "prediction_count",
                  "scenario_count",
              ],
              "decision_confidence": [
                  "strategy_confidence",
                  "strategy_score",
              ],
              "empirical_validation": [
                  "observed_outcomes",
                  "comparable_outcomes",
                  "evidence_quality",
              ],
              "resource_and_goal_management": [
                  "allocation_quality",
                  "goal_quality",
              ],
              "experimental_process": [
                  "experiment_count",
                  "experiment_priority",
              ],
              "attention_and_monitoring": [
                  "attention_selection",
                  "monitoring_selection",
              ],
              "self_improvement": [
                  "improvement_state",
                  "self_awareness",
              ],
              "relational_model": [
                  "relationship_count",
              ],
          }

          duplicated_information_groups = []

          for group_name, members in evidence_groups.items():
              present = [
                  member
                  for member in members
                  if any(
                      s["signal"] == member
                      for s in normalized_signals
                  )
              ]

              if len(present) >= 2:
                  duplicated_information_groups.append(
                      {
                          "group": group_name,
                          "signals": present,
                          "independence": "unknown_not_proven",
                      }
                  )

          # ------------------------------------------------------------
          # 3. Contradictions
          # ------------------------------------------------------------

          contradictions = [
              {
                  "id": "C01",
                  "severity": "high",
                  "description": "Reliable internal measures exist while empirical validation remains weak or absent.",
                  "effect": "lower_confidence_in_real_world_claims",
              },
              {
                  "id": "C02",
                  "severity": "high",
                  "description": "A self-improvement mechanism exists while observed and comparable outcomes remain zero.",
                  "effect": "block_self_improvement_claims",
              },
              {
                  "id": "C03",
                  "severity": "high",
                  "description": "Internal strategy confidence is substantial while strategy validation remains inconclusive.",
                  "effect": "reduce_decision_confidence",
              },
              {
                  "id": "C04",
                  "severity": "moderate",
                  "description": "Monitoring is measurable while the canonical attention signal remains unavailable.",
                  "effect": "do_not_infer_attention_quality_from_monitoring",
              },
              {
                  "id": "C05",
                  "severity": "high",
                  "description": "ACT32 experiment priority is not reliably preserved while allocation remains structurally valid.",
                  "effect": "exclude_experiment_priority_from_allocation",
              },
              {
                  "id": "C06",
                  "severity": "moderate",
                  "description": "ACT35 contains a baseline state but downstream ingestion previously failed to recover it.",
                  "effect": "repair_improvement_state_contract",
              },
          ]

          # ------------------------------------------------------------
          # 4. Fusion weights
          # ------------------------------------------------------------

          fusion_weights = {
              "attention_selection": 21.0,
              "monitoring_selection": 46.8,
              "relationship_count": 65.2,
              "prediction_count": 60.4,
              "scenario_count": 60.4,
              "self_awareness": 55.2,
              "strategy_confidence": 54.4,
              "strategy_score": 53.2,
              "observed_outcomes": 57.6,
              "comparable_outcomes": 57.6,
              "evidence_quality": 60.8,
              "experiment_priority": 22.8,
              "experiment_count": 62.4,
              "allocation_quality": 58.8,
              "goal_quality": 58.8,
              "improvement_state": 23.0,
              "audit_quality": 59.6,
          }

          fused_signals = []

          for item in normalized_signals:
              name = item["signal"]
              weight = fusion_weights.get(name, 50.0)

              if name in {
                  "attention_selection",
                  "experiment_priority",
                  "improvement_state",
              }:
                  fusion_status = "excluded"
              elif name == "monitoring_selection":
                  fusion_status = "structural_only"
              else:
                  fusion_status = "structural_only"

              fused_signals.append(
                  {
                      "signal": name,
                      "measurement_reliability": item[
                          "measurement_reliability"
                      ],
                      "empirical_validity": item[
                          "empirical_validity"
                      ],
                      "fusion_weight": weight,
                      "independence": "unknown_not_proven",
                      "fusion_status": fusion_status,
                  }
              )

          # ------------------------------------------------------------
          # 5. Fused assessments
          # ------------------------------------------------------------

          fused_assessments = [
              {
                  "assessment": "prediction_readiness",
                  "score": 50.0,
                  "confidence_ceiling": 55.0,
                  "reason": "Predictions are structurally available but lack observed outcome validation.",
              },
              {
                  "assessment": "strategy_validation",
                  "score": 50.0,
                  "confidence_ceiling": 35.0,
                  "reason": "Strategy selection exists but ACT31 remains inconclusive.",
              },
              {
                  "assessment": "resource_goal_coherence",
                  "score": 50.0,
                  "confidence_ceiling": 60.0,
                  "reason": "Allocation and goal structures are internally coherent but not empirically validated.",
              },
              {
                  "assessment": "attention_reliability",
                  "score": 50.0,
                  "confidence_ceiling": 35.0,
                  "reason": "The canonical ACT26 attention signal remains unavailable.",
              },
              {
                  "assessment": "self_improvement",
                  "score": 50.0,
                  "confidence_ceiling": 30.0,
                  "reason": "Self-improvement cannot be validated without observed outcomes.",
              },
          ]

          high_contradictions = sum(
              1
              for c in contradictions
              if c["severity"] == "high"
          )

          moderate_contradictions = sum(
              1
              for c in contradictions
              if c["severity"] == "moderate"
          )

          contradiction_penalty = (
              high_contradictions * 13
              + moderate_contradictions * 10
          )

          global_fusion_confidence = max(
              0.0,
              min(
                  100.0,
                  70.0 - contradiction_penalty,
              ),
          )

          decision_confidence_ceiling = 35.0

          # ------------------------------------------------------------
          # 6. Recover upstream values explicitly
          # ------------------------------------------------------------

          observed_outcomes = first_number(
              act37,
              [
                  "observed_outcomes",
                  "actual_observed_outcomes",
              ],
          )

          comparable_outcomes = first_number(
              act37,
              [
                  "comparable_outcomes",
                  "actual_comparable_outcomes",
              ],
          )

          if observed_outcomes is None:
              observed_outcomes = 0.0

          if comparable_outcomes is None:
              comparable_outcomes = 0.0

          # ------------------------------------------------------------
          # 7. Canonical output contract
          # ------------------------------------------------------------

          timestamp = datetime.now(timezone.utc).isoformat()

          output = {
              "act": "ACT38",
              "version": "V2",
              "name": "Evidence Fusion & Contradiction Handling",
              "timestamp": timestamp,
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Combine multiple cognitive signals according to their "
                  "reliability while detecting contradictions, duplicated "
                  "evidence and unsupported confidence."
              ),

              "principle": (
                  "More signals do not automatically mean more evidence. "
                  "Strong evidence requires reliable, relevant, sufficiently "
                  "independent and empirically supported signals."
              ),

              "source_acts": [
                  "ACT35",
                  "ACT36",
                  "ACT37",
              ],

              "source_files": {
                  "ACT35": act35_path,
                  "ACT36": act36_path,
                  "ACT37": act37_path,
              },

              "source_completeness": source_completeness,

              "signals_received": len(normalized_signals),

              "signals": fused_signals,

              "evidence_groups": evidence_groups,

              "duplicated_information_groups": duplicated_information_groups,

              "contradictions": contradictions,

              "fused_assessments": fused_assessments,

              # --------------------------------------------------------
              # Canonical stable metrics for downstream ACTs.
              # These fields MUST remain at the top level.
              # --------------------------------------------------------
              "canonical_metrics": {
                  "fusion_confidence": global_fusion_confidence,
                  "decision_confidence_ceiling": decision_confidence_ceiling,
                  "observed_outcomes": observed_outcomes,
                  "comparable_outcomes": comparable_outcomes,
                  "high_contradictions": high_contradictions,
                  "moderate_contradictions": moderate_contradictions,
                  "contradiction_penalty": contradiction_penalty,
                  "usable_signals": sum(
                      1
                      for s in fused_signals
                      if s["fusion_status"] != "excluded"
                  ),
                  "excluded_signals": sum(
                      1
                      for s in fused_signals
                      if s["fusion_status"] == "excluded"
                  ),
                  "duplicated_information_group_count": len(
                      duplicated_information_groups
                  ),
              },

              # Backward-compatible top-level aliases.
              "fusion_confidence": global_fusion_confidence,
              "decision_confidence_ceiling": decision_confidence_ceiling,

              "global_confidence": {
                  "baseline": 70.0,
                  "high_contradictions": high_contradictions,
                  "moderate_contradictions": moderate_contradictions,
                  "contradiction_penalty": contradiction_penalty,
                  "result": global_fusion_confidence,
                  "interpretation": (
                      "Confidence in the evidence-fusion process, not "
                      "a probability that the resulting conclusions are true."
                  ),
              },

              "decision_readiness": {
                  "status": "limited",
                  "confidence_ceiling": decision_confidence_ceiling,
                  "reason": (
                      "Real observed outcomes and comparable outcomes are "
                      "still absent, while several measurement contracts "
                      "remain under repair."
                  ),
              },

              "requirements_for_higher_readiness": [
                  "real_observed_outcomes",
                  "comparable_outcomes",
                  "repaired_attention_signal",
                  "repaired_experiment_priority",
                  "repaired_ACT35_improvement_state",
                  "repeated_evidence_across_independent_observations",
              ],

              "decision_policy": [
                  "Excluded signals must not influence autonomous decisions.",
                  "Cautious signals must remain monitoring inputs.",
                  "Structural evidence cannot establish external truth.",
                  "Observed outcomes receive priority over internal confidence.",
                  "Comparable outcomes are required for meaningful validation.",
                  "Duplicated information must not be double-counted.",
                  "Contradictions reduce confidence rather than being hidden.",
                  "Missing data is not negative evidence.",
                  "Zero remains a valid measured value.",
                  "Inconclusive is a valid epistemic state.",
                  "Evidence fusion cannot create evidence that does not exist.",
              ],

              "repair_queue": [
                  {
                      "priority": "high",
                      "issue": "attention_selection",
                      "action": (
                          "Create and preserve a canonical structured ACT26 "
                          "attention list field."
                      ),
                  },
                  {
                      "priority": "high",
                      "issue": "experiment_priority",
                      "action": (
                          "Preserve experiment priority from ACT31 through ACT32."
                      ),
                  },
                  {
                      "priority": "medium",
                      "issue": "improvement_state",
                      "action": (
                          "Preserve the canonical ACT35 improvement_state field."
                      ),
                  },
                  {
                      "priority": "high",
                      "issue": "empirical_outcomes",
                      "action": (
                          "Begin collecting real prediction outcomes before "
                          "increasing confidence."
                      ),
                  },
              ],

              "lessons": [
                  "More internal signals do not automatically create stronger evidence.",
                  "Duplicated signals must not be counted as independent evidence.",
                  "Contradictions should lower confidence instead of being hidden.",
                  "Structural consistency is not empirical truth.",
                  "Real outcomes remain the missing foundation for calibration.",
                  "Data-contract reliability is itself part of NØX cognition.",
                  "Confidence ceilings should remain conservative when validation is absent.",
              ],

              "metrics": {
                  "signals_received": len(normalized_signals),
                  "usable_signals": sum(
                      1
                      for s in fused_signals
                      if s["fusion_status"] != "excluded"
                  ),
                  "cautious_signals": sum(
                      1
                      for s in fused_signals
                      if s["fusion_status"] == "cautious"
                  ),
                  "excluded_signals": sum(
                      1
                      for s in fused_signals
                      if s["fusion_status"] == "excluded"
                  ),
                  "evidence_groups": len(evidence_groups),
                  "duplicated_information_groups": len(
                      duplicated_information_groups
                  ),
                  "contradictions": len(contradictions),
                  "high_contradictions": high_contradictions,
                  "moderate_contradictions": moderate_contradictions,
                  "fused_assessments": len(fused_assessments),
                  "fusion_confidence": global_fusion_confidence,
                  "decision_confidence_ceiling": decision_confidence_ceiling,
              },

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT38 may fuse evidence and identify contradictions, "
                      "but cannot grant execution or financial authority."
                  ),
              },

              "next_action": "collect_real_outcomes_and_repair_data_contracts",

              "next_cognitive_step": (
                  "ACT39 should calibrate confidence against repeated "
                  "observed outcomes and determine whether NØX confidence "
                  "tracks actual prediction accuracy."
              ),
          }

          out_path = MEMORY / "nox_act_38_evidence_fusion.json"

          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print("")
          print("==============================================")
          print("NØX ACT38 V2 - EVIDENCE FUSION")
          print("==============================================")
          print(f"Source completeness: {source_completeness}%")
          print(f"Signals received: {len(normalized_signals)}")
          print(f"Duplicated groups: {len(duplicated_information_groups)}")
          print(f"Contradictions: {len(contradictions)}")
          print(f"High contradictions: {high_contradictions}")
          print(f"Moderate contradictions: {moderate_contradictions}")
          print("")
          print("CANONICAL METRICS:")
          print(f"Fusion confidence: {global_fusion_confidence}")
          print(f"Decision confidence ceiling: {decision_confidence_ceiling}")
          print(f"Observed outcomes: {observed_outcomes}")
          print(f"Comparable outcomes: {comparable_outcomes}")
          print("")
          print("DATA CONTRACT:")
          print("canonical_metrics.fusion_confidence = "
                f"{global_fusion_confidence}")
          print("canonical_metrics.decision_confidence_ceiling = "
                f"{decision_confidence_ceiling}")
          print("")
          print("gemini_used: false")
          print("project_cost_eur: 0")
          print("execution_permission: false")
          print("financial_permission: false")
          print("")
          print(f"Memory written: {out_path}")
          print("==============================================")
          PY

      - name: Commit ACT38 V2 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_38_evidence_fusion.json

          if git diff --cached --quiet; then
            echo "No ACT38 V2 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT38 V2 evidence fusion contract"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              continue
            }

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push failed on attempt $attempt. Retrying..."
            sleep 3
          done

          echo "Unable to push after 3 attempts."
          exit 1
