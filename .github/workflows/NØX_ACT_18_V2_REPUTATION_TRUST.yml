name: NØX ACT 18 V2 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 V2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          INPUT = "memory/nox_knowledge_core.json"
          OUTPUT = "memory/nox_reputation_trust.json"

          if not os.path.exists(INPUT):
              raise SystemExit(f"Missing input file: {INPUT}")

          with open(INPUT, "r", encoding="utf-8") as f:
              data = json.load(f)

          now = datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # ACT18 V2
          #
          # Architecture:
          #
          #   REAL ACT17 STRUCTURE
          #          ↓
          #   SCHEMA DISCOVERY
          #          ↓
          #   IDENTITY
          #          ↓
          #   INTERACTION
          #          ↓
          #   BEHAVIOR
          #          ↓
          #   EXPLICIT RESULT
          #          ↓
          #   DOMAIN TRUST
          #
          # Core rule:
          # Presence of a name is NEVER sufficient.
          # Presence of SUCCESS is NEVER sufficient.
          # source_agent is NEVER automatically the subject agent.
          # ------------------------------------------------------------

          GENERIC_TOKENS = {
              "agent",
              "agents",
              "unknown",
              "none",
              "null",
              "n/a",
              "na",
              "follow",
              "following",
              "follower",
              "comment",
              "comments",
              "reply",
              "replies",
              "response",
              "responses",
              "post",
              "posts",
              "proposal",
              "proposals",
              "discussion",
              "measurement",
              "receipts",
              "the",
              "them",
              "pay",
              "payment",
              "success",
              "failure",
              "successful",
              "failed",
              "action",
              "actions",
              "executed",
              "execution",
              "interaction",
              "behavior",
              "behaviour",
              "result",
              "results",
              "evidence",
              "information",
              "memory",
              "knowledge",
              "machine-native payments",
              "coinos.io",
              "wiener",
              "hermes",
              "deep-seeker",
              "deep seeker",
              "adaptive balanced",
              "evidence-first",
              "strong_stability",
              "unresolved",
              "not_evaluable",
              "untested",
          }

          IDENTITY_KEYS = {
              "agent",
              "agent_id",
              "agent_uuid",
              "username",
              "handle",
              "subject_agent",
              "subject_agent_id",
              "subject_agent_uuid",
              "target_agent",
              "target_agent_id",
              "target_agent_uuid",
              "external_agent",
              "external_agent_id",
              "external_agent_uuid",
              "actor",
              "actor_id",
              "actor_uuid",
              "author",
              "author_id",
              "author_uuid",
              "responder",
              "responder_id",
              "responder_uuid",
          }

          SOURCE_KEYS = {
              "source_agent",
              "source",
              "created_by",
              "generated_by",
              "recorded_by",
              "stored_by",
          }

          INTERACTION_WORDS = {
              "follow",
              "followed",
              "following",
              "comment",
              "commented",
              "reply",
              "replied",
              "response",
              "responded",
              "responding",
              "interact",
              "interacted",
              "interaction",
              "mentioned",
              "mention",
          }

          BEHAVIOR_WORDS = {
              "published",
              "posted",
              "created",
              "built",
              "implemented",
              "answered",
              "commented",
              "replied",
              "responded",
              "proposed",
              "explained",
              "provided",
              "verified",
              "tested",
              "demonstrated",
              "completed",
              "delivered",
              "solved",
              "analyzed",
              "analysed",
              "contributed",
              "developed",
              "documented",
              "identified",
              "discovered",
          }

          RESULT_VALUES = {
              "success",
              "successful",
              "completed",
              "failure",
              "failed",
              "error",
              "partial",
          }

          N0X_NAMES = {
              "nox",
              "nox origin",
              "nox_origine",
              "@nox_origine",
          }

          # ------------------------------------------------------------
          # Utility functions
          # ------------------------------------------------------------

          def norm(value):
              if value is None:
                  return ""
              return str(value).strip().lower()

          def clean_agent(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()
              if not value:
                  return None

              v = value.lower().strip()
              v = v.replace("https://", "").replace("http://", "")
              v = v.rstrip("/")

              if v in GENERIC_TOKENS:
                  return None

              if v in N0X_NAMES:
                  return None

              if len(v) < 3 or len(v) > 80:
                  return None

              # Reject sentences / obvious non-agent values.
              if any(ch in v for ch in ["\n", "\r", "{", "}", "[", "]"]):
                  return None

              if " " in v and len(v.split()) > 5:
                  return None

              if v.endswith(".") and len(v.split()) > 1:
                  return None

              # Domain-like values are not automatically agents.
              if re.fullmatch(r"[a-z0-9_-]+\.(com|io|ai|org|net|dev)", v):
                  return None

              return value

          def is_probable_uuid(value):
              if not isinstance(value, str):
                  return False
              return bool(
                  re.fullmatch(
                      r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}",
                      value.strip(),
                  )
              )

          def path_to_string(path):
              if not path:
                  return "$"
              out = "$"
              for p in path:
                  if isinstance(p, int):
                      out += f"[{p}]"
                  else:
                      out += f".{p}"
              return out

          def scalar_text(value):
              if isinstance(value, (str, int, float, bool)):
                  return str(value)
              return ""

          def walk(obj, path=()):
              yield path, obj

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      yield from walk(value, path + (str(key),))

              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      yield from walk(value, path + (i,))

          def all_strings(obj):
              result = []
              for path, value in walk(obj):
                  if isinstance(value, str):
                      result.append((path, value))
              return result

          # ------------------------------------------------------------
          # Locate knowledge records without assuming exact schema.
          # ------------------------------------------------------------

          if isinstance(data, dict):
              knowledge = data.get("knowledge")
              if not isinstance(knowledge, list):
                  # Fallback: locate the largest list of dictionaries.
                  candidates = []
                  for key, value in data.items():
                      if isinstance(value, list):
                          dict_count = sum(isinstance(x, dict) for x in value)
                          if dict_count:
                              candidates.append((dict_count, key, value))

                  if candidates:
                      candidates.sort(reverse=True)
                      knowledge = candidates[0][2]
                  else:
                      knowledge = []
          elif isinstance(data, list):
              knowledge = data
          else:
              knowledge = []

          knowledge = [x for x in knowledge if isinstance(x, dict)]

          # ------------------------------------------------------------
          # REAL SCHEMA DISCOVERY
          # ------------------------------------------------------------

          key_counter = Counter()
          path_counter = Counter()
          value_examples = defaultdict(list)

          for entry in knowledge:
              for path, value in walk(entry):
                  if path:
                      path_counter[path_to_string(path)] += 1

                  if isinstance(value, dict):
                      for key in value.keys():
                          key_counter[str(key)] += 1

                  if isinstance(value, str):
                      if len(value) <= 120:
                          p = path_to_string(path)
                          if len(value_examples[p]) < 3:
                              value_examples[p].append(value)

          observed_identity_paths = []
          observed_source_paths = []
          observed_result_paths = []
          observed_interaction_paths = []

          for path, count in path_counter.items():
              last = path.split(".")[-1].split("[")[0].lower()

              if last in IDENTITY_KEYS:
                  observed_identity_paths.append((path, count))

              if last in SOURCE_KEYS:
                  observed_source_paths.append((path, count))

              if last in {"result", "status", "outcome", "action_result"}:
                  observed_result_paths.append((path, count))

              if last in {"action", "interaction", "activity", "type", "event"}:
                  observed_interaction_paths.append((path, count))

          # ------------------------------------------------------------
          # Agent candidates from ACT17's actual structured identity data.
          # ------------------------------------------------------------

          identity_candidates = defaultdict(list)

          def add_identity(candidate, evidence):
              agent = clean_agent(candidate)
              if not agent:
                  return

              key = norm(agent)

              if key not in identity_candidates:
                  identity_candidates[key] = []

              identity_candidates[key].append(evidence)

          # Known handles are NOT used as an allowlist.
          # They are only used if the actual record explicitly exposes
          # an identity field or an explicit identity context.
          for index, entry in enumerate(knowledge):
              for path, value in walk(entry):

                  if isinstance(value, dict):
                      for key, val in value.items():
                          k = str(key).lower()

                          if k in IDENTITY_KEYS:
                              if isinstance(val, str):
                                  if not is_probable_uuid(val):
                                      add_identity(
                                          val,
                                          {
                                              "type": "structured_identity",
                                              "field": k,
                                              "path": path_to_string(path + (key,)),
                                              "entry_index": index,
                                          },
                                      )

                          elif isinstance(val, dict):
                              for subkey, subval in val.items():
                                  if str(subkey).lower() in IDENTITY_KEYS:
                                      if isinstance(subval, str) and not is_probable_uuid(subval):
                                          add_identity(
                                              subval,
                                              {
                                                  "type": "nested_structured_identity",
                                                  "field": str(subkey),
                                                  "path": path_to_string(path + (key, subkey)),
                                                  "entry_index": index,
                                              },
                                          )

                  # sources[] is frequently used by ACT17.
                  if isinstance(value, list):
                      for item_index, item in enumerate(value):
                          if isinstance(item, dict):
                              for key, val in item.items():
                                  if str(key).lower() in IDENTITY_KEYS:
                                      if isinstance(val, str) and not is_probable_uuid(val):
                                          add_identity(
                                              val,
                                              {
                                                  "type": "source_identity",
                                                  "field": str(key),
                                                  "path": path_to_string(path + (item_index, key)),
                                                  "entry_index": index,
                                              },
                                          )

          # ------------------------------------------------------------
          # Explicit identity context inside free text.
          #
          # IMPORTANT:
          # A name alone is insufficient.
          # We require an identity phrase.
          # ------------------------------------------------------------

          explicit_identity_patterns = [
              r"\bfollowed\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bfollowing\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bcommented\s+(?:by|from|to|on)\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\breplied\s+(?:by|from|to)\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bresponse\s+from\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\breply\s+from\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bauthor\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\busername\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\bagent\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\bposted\s+by\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bcreated\s+by\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\binteraction\s+with\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\binteracted\s+with\s+@?([A-Za-z0-9_-]{3,50})\b",
          ]

          for index, entry in enumerate(knowledge):
              for path, text in all_strings(entry):
                  if len(text) > 5000:
                      continue

                  for pattern in explicit_identity_patterns:
                      for match in re.finditer(pattern, text, flags=re.I):
                          candidate = clean_agent(match.group(1))
                          if candidate:
                              add_identity(
                                  candidate,
                                  {
                                      "type": "explicit_text_identity",
                                      "pattern": pattern,
                                      "path": path_to_string(path),
                                      "entry_index": index,
                                  },
                              )

          # ------------------------------------------------------------
          # Build records around candidates.
          # ------------------------------------------------------------

          profiles = {}

          def get_profile(agent):
              key = norm(agent)

              if key not in profiles:
                  profiles[key] = {
                      "agent": agent,
                      "domains": Counter(),
                      "identity_observations": [],
                      "interaction_observations": [],
                      "behavioral_evidence": [],
                      "results": [],
                      "successes": 0,
                      "failures": 0,
                      "unknown_results": 0,
                  }

              return profiles[key]

          # ------------------------------------------------------------
          # Domain extraction
          # ------------------------------------------------------------

          def entry_domain(entry):
              domain = entry.get("domain")

              if isinstance(domain, str) and domain.strip():
                  return domain.strip()

              info = entry.get("information")
              if isinstance(info, str):
                  m = re.search(
                      r"\bdomain\s*[:=]\s*([A-Za-z0-9_ -]{3,80})",
                      info,
                      flags=re.I,
                  )
                  if m:
                      return m.group(1).strip()

              return "unknown"

          # ------------------------------------------------------------
          # Determine whether a record explicitly refers to an agent.
          # ------------------------------------------------------------

          def candidate_occurrences(entry, agent):
              target = norm(agent)
              occurrences = []

              for path, value in walk(entry):
                  if isinstance(value, str):
                      txt = value.lower()
                      if target and target in txt:
                          occurrences.append(path_to_string(path))

              return occurrences

          def structured_subject_link(entry, agent):
              target = norm(agent)

              for path, value in walk(entry):
                  if not isinstance(value, dict):
                      continue

                  for key, val in value.items():
                      k = str(key).lower()

                      if k not in IDENTITY_KEYS:
                          continue

                      if isinstance(val, str) and norm(val) == target:
                          return {
                              "field": k,
                              "path": path_to_string(path + (key,)),
                          }

              return None

          def explicit_interaction(entry, agent):
              target = norm(agent)

              # Structured interaction/action records.
              for path, value in walk(entry):
                  if isinstance(value, dict):
                      interaction_value = None

                      for key, val in value.items():
                          k = str(key).lower()

                          if k in {"action", "interaction", "activity", "event", "type"}:
                              if isinstance(val, str):
                                  interaction_value = norm(val)

                      if interaction_value in INTERACTION_WORDS:
                          link = structured_subject_link(value, agent)

                          if link:
                              return {
                                  "method": "structured_interaction",
                                  "path": path_to_string(path),
                                  "action": interaction_value,
                                  "identity_link": link,
                              }

              # Explicit textual relationship.
              patterns = [
                  rf"\b(?:followed|following|commented|replied|responded|interacted|mentioned)\b.{{0,80}}\b{re.escape(target)}\b",
                  rf"\b{re.escape(target)}\b.{{0,80}}\b(?:commented|replied|responded|followed|interacted)\b",
              ]

              for path, value in walk(entry):
                  if not isinstance(value, str):
                      continue

                  txt = value.lower()

                  for pattern in patterns:
                      if re.search(pattern, txt, flags=re.I):
                          return {
                              "method": "explicit_text_interaction",
                              "path": path_to_string(path),
                          }

              return None

          # ------------------------------------------------------------
          # Behavioral evidence
          #
          # The agent must be explicitly linked to the record AND the
          # record must describe an actual behavior.
          # ------------------------------------------------------------

          def explicit_behavior(entry, agent):
              target = norm(agent)

              link = structured_subject_link(entry, agent)

              if link:
                  for path, value in walk(entry):
                      if isinstance(value, str):
                          txt = value.lower()

                          for word in BEHAVIOR_WORDS:
                              if re.search(r"\b" + re.escape(word) + r"\b", txt):
                                  return {
                                      "method": "structured_actor_behavior",
                                      "path": path_to_string(path),
                                      "behavior_word": word,
                                      "identity_link": link,
                                  }

              # Strong explicit natural-language authorship only.
              patterns = [
                  rf"\b{re.escape(target)}\b\s+(?:published|posted|created|built|implemented|answered|commented|replied|responded|proposed|explained|provided|verified|tested|demonstrated|completed|delivered|solved|analyzed|analysed|contributed)\b",
                  rf"\b(?:published|posted|created|built|implemented|answered|commented|replied|responded|proposed|explained|provided|verified|tested|demonstrated|completed|delivered|solved|analyzed|analysed|contributed)\b\s+by\s+{re.escape(target)}\b",
              ]

              for path, value in walk(entry):
                  if not isinstance(value, str):
                      continue

                  for pattern in patterns:
                      m = re.search(pattern, value, flags=re.I)

                      if m:
                          return {
                              "method": "explicit_authored_behavior",
                              "path": path_to_string(path),
                              "matched": m.group(0),
                          }

              return None

          # ------------------------------------------------------------
          # Explicit result attribution.
          #
          # NEVER infer:
          # agent + SUCCESS = agent success
          # ------------------------------------------------------------

          def explicit_result(entry, agent):
              target = norm(agent)

              # result object
              for path, value in walk(entry):
                  if not isinstance(value, dict):
                      continue

                  result_value = None
                  actor_match = False

                  for key, val in value.items():
                      k = str(key).lower()

                      if k in {"result", "status", "outcome"}:
                          if isinstance(val, str) and norm(val) in RESULT_VALUES:
                              result_value = norm(val)

                      if k in IDENTITY_KEYS:
                          if isinstance(val, str) and norm(val) == target:
                              actor_match = True

                  if result_value and actor_match:
                      return {
                          "result": result_value,
                          "method": "structured_result_actor",
                          "path": path_to_string(path),
                      }

              # Top-level explicit attribution fields.
              actor_fields = {
                  "result_agent",
                  "result_subject",
                  "outcome_agent",
                  "outcome_subject",
                  "result_actor",
                  "outcome_actor",
              }

              actor_found = False

              for key, value in entry.items():
                  if str(key).lower() in actor_fields:
                      if isinstance(value, str) and norm(value) == target:
                          actor_found = True

              if actor_found:
                  for key, value in entry.items():
                      if str(key).lower() in {"result", "status", "outcome"}:
                          if isinstance(value, str) and norm(value) in RESULT_VALUES:
                              return {
                                  "result": norm(value),
                                  "method": "top_level_explicit_result_actor",
                                  "path": "$." + str(key),
                              }

              return None

          # ------------------------------------------------------------
          # Scan each knowledge record.
          # ------------------------------------------------------------

          unattributed_result_candidates = 0
          rejected_result_candidates = 0
          accepted_result_count = 0

          observations = []

          for index, entry in enumerate(knowledge):
              domain = entry_domain(entry)

              # Agents explicitly found in this record.
              local_agents = set()

              # Structured identities.
              for path, value in walk(entry):
                  if isinstance(value, dict):
                      for key, val in value.items():
                          if str(key).lower() in IDENTITY_KEYS:
                              if isinstance(val, str):
                                  agent = clean_agent(val)
                                  if agent:
                                      local_agents.add(agent)

                  elif isinstance(value, list):
                      for item in value:
                          if isinstance(item, dict):
                              for key, val in item.items():
                                  if str(key).lower() in IDENTITY_KEYS:
                                      if isinstance(val, str):
                                          agent = clean_agent(val)
                                          if agent:
                                              local_agents.add(agent)

              # Text identity candidates from this record.
              for candidate_key, evidences in identity_candidates.items():
                  candidate = evidences[0]["path"] if False else None

                  # Recover canonical spelling from evidence by looking at
                  # the original candidate inventory.
                  for evidence in evidences:
                      if evidence.get("entry_index") == index:
                          # Candidate key is enough for normalized matching.
                          local_agents.add(candidate_key)

              # Normalize candidate names back to stable display values.
              display_names = {}

              for key in local_agents:
                  for candidate_key, evidences in identity_candidates.items():
                      if candidate_key == norm(key):
                          display_names[key] = evidences[0].get("agent", key)

                  if key not in display_names:
                      display_names[key] = key

              # Also inspect every globally discovered candidate when it
              # explicitly appears in this entry.
              for candidate_key, evidences in identity_candidates.items():
                  display = evidences[0].get("agent", candidate_key)

                  if candidate_key in {norm(x) for x in local_agents}:
                      continue

                  if candidate_key and candidate_key in norm(
                      json.dumps(entry, ensure_ascii=False)
                  ):
                      # Presence alone is NOT evidence, but allows the
                      # subsequent explicit tests to decide.
                      display_names[candidate_key] = display

              # Evaluate each candidate independently.
              for candidate_key, display in list(display_names.items()):
                  agent = display

                  if not clean_agent(agent):
                      continue

                  # NØX can never become an external agent.
                  if norm(agent) in N0X_NAMES:
                      continue

                  occurrences = candidate_occurrences(entry, agent)

                  if not occurrences:
                      continue

                  profile = get_profile(agent)
                  profile["domains"][domain] += 1

                  # Identity.
                  identity_evidence = None

                  link = structured_subject_link(entry, agent)

                  if link:
                      identity_evidence = {
                          "type": "structured_identity",
                          "method": link["field"],
                          "path": link["path"],
                          "entry_index": index,
                      }

                  elif candidate_key in identity_candidates:
                      matching = [
                          e for e in identity_candidates[candidate_key]
                          if e.get("entry_index") == index
                      ]

                      if matching:
                          identity_evidence = matching[0].copy()

                  if identity_evidence:
                      profile["identity_observations"].append(identity_evidence)

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "IDENTITY",
                          "evidence": identity_evidence,
                      })

                  # Interaction.
                  interaction = explicit_interaction(entry, agent)

                  if interaction:
                      profile["interaction_observations"].append(interaction)

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "INTERACTION",
                          "evidence": interaction,
                      })

                  # Behavior.
                  behavior = explicit_behavior(entry, agent)

                  if behavior:
                      profile["behavioral_evidence"].append(behavior)

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "BEHAVIOR",
                          "evidence": behavior,
                      })

                  # Result.
                  result = explicit_result(entry, agent)

                  if result:
                      accepted_result_count += 1

                      if result["result"] in {"success", "successful", "completed"}:
                          profile["successes"] += 1

                      elif result["result"] in {"failure", "failed", "error"}:
                          profile["failures"] += 1

                      else:
                          profile["unknown_results"] += 1

                      profile["results"].append(result)

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "RESULT",
                          "result": result["result"],
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": result["method"],
                              "path": result["path"],
                          },
                      })

              # Detect generic results which have no explicit actor.
              for path, value in walk(entry):
                  if isinstance(value, str):
                      if norm(value) in {"success", "successful", "failure", "failed"}:
                          if not explicit_result(entry, "__NO_MATCH__"):
                              unattributed_result_candidates += 1
                              rejected_result_candidates += 1

          # ------------------------------------------------------------
          # Remove impossible profiles and calculate trust.
          # ------------------------------------------------------------

          final_profiles = {}

          for key, profile in profiles.items():
              agent = profile["agent"]

              if not clean_agent(agent):
                  continue

              if norm(agent) in N0X_NAMES:
                  continue

              identity_count = len(profile["identity_observations"])
              interaction_count = len(profile["interaction_observations"])
              behavior_count = len(profile["behavioral_evidence"])
              success_count = profile["successes"]
              failure_count = profile["failures"]
              result_count = len(profile["results"])

              # Trust is deliberately impossible without behavioral/result
              # evidence.
              if behavior_count == 0 and result_count == 0:
                  trust_level = "UNKNOWN"
                  trust_score = 0.0
                  trust_basis = "IDENTITY_OR_INTERACTION_ONLY"

              else:
                  success_rate = (
                      success_count / result_count
                      if result_count
                      else 0.0
                  )

                  score = 0.20

                  score += min(0.30, behavior_count * 0.10)

                  if result_count:
                      score += min(0.50, success_rate * 0.50)

                  score -= min(0.30, failure_count * 0.15)

                  score = max(0.0, min(1.0, score))

                  if (
                      score >= 0.80
                      and success_count >= 3
                      and failure_count == 0
                  ):
                      trust_level = "HIGH"

                  elif score >= 0.60 and success_count >= 2:
                      trust_level = "MEDIUM"

                  else:
                      trust_level = "LOW"

                  trust_score = round(score, 4)

                  trust_basis = "BEHAVIOR_AND_OR_EXPLICIT_RESULTS"

              final_profiles[key] = {
                  "agent": agent,
                  "domains": dict(profile["domains"]),
                  "identity_observations": identity_count,
                  "interaction_observations": interaction_count,
                  "behavioral_evidence": behavior_count,
                  "results": result_count,
                  "successes": success_count,
                  "failures": failure_count,
                  "unknown_results": profile["unknown_results"],
                  "trust_score": trust_score,
                  "trust_level": trust_level,
                  "trust_basis": trust_basis,
              }

          # ------------------------------------------------------------
          # Statistics.
          # ------------------------------------------------------------

          identity_count = sum(
              p["identity_observations"] for p in final_profiles.values()
          )

          interaction_count = sum(
              p["interaction_observations"] for p in final_profiles.values()
          )

          behavior_count = sum(
              p["behavioral_evidence"] for p in final_profiles.values()
          )

          result_count = sum(
              p["results"] for p in final_profiles.values()
          )

          success_count = sum(
              p["successes"] for p in final_profiles.values()
          )

          failure_count = sum(
              p["failures"] for p in final_profiles.values()
          )

          high_count = sum(
              1 for p in final_profiles.values()
              if p["trust_level"] == "HIGH"
          )

          medium_count = sum(
              1 for p in final_profiles.values()
              if p["trust_level"] == "MEDIUM"
          )

          low_count = sum(
              1 for p in final_profiles.values()
              if p["trust_level"] == "LOW"
          )

          unknown_count = sum(
              1 for p in final_profiles.values()
              if p["trust_level"] == "UNKNOWN"
          )

          # ------------------------------------------------------------
          # Detection audit.
          # ------------------------------------------------------------

          detection_audit = {
              "schema_discovery": {
                  "knowledge_entries": len(knowledge),
                  "observed_identity_paths": [
                      {"path": p, "count": c}
                      for p, c in sorted(
                          observed_identity_paths,
                          key=lambda x: (-x[1], x[0])
                      )[:50]
                  ],
                  "observed_source_paths": [
                      {"path": p, "count": c}
                      for p, c in sorted(
                          observed_source_paths,
                          key=lambda x: (-x[1], x[0])
                      )[:50]
                  ],
                  "observed_result_paths": [
                      {"path": p, "count": c}
                      for p, c in sorted(
                          observed_result_paths,
                          key=lambda x: (-x[1], x[0])
                      )[:50]
                  ],
                  "observed_interaction_paths": [
                      {"path": p, "count": c}
                      for p, c in sorted(
                          observed_interaction_paths,
                          key=lambda x: (-x[1], x[0])
                      )[:50]
                  ],
                  "top_keys": [
                      {"key": k, "count": c}
                      for k, c in key_counter.most_common(50)
                  ],
              },
              "candidate_inventory": {
                  "candidate_count": len(identity_candidates),
                  "candidates": [
                      {
                          "agent": evidences[0].get("agent", key),
                          "normalized": key,
                          "evidence_count": len(evidences),
                          "evidence_types": sorted(
                              set(e.get("type", "unknown") for e in evidences)
                          ),
                      }
                      for key, evidences in sorted(
                          identity_candidates.items()
                      )
                  ][:100],
              },
              "result_audit": {
                  "explicit_result_attributions": accepted_result_count,
                  "unattributed_result_candidates": unattributed_result_candidates,
                  "rejected_result_candidates": rejected_result_candidates,
              },
          }

          # ------------------------------------------------------------
          # Self-tests.
          #
          # These directly protect against historical ACT18 failures.
          # ------------------------------------------------------------

          self_tests = []

          def test_clean_generic_tokens():
              bad = [
                  "follow",
                  "proposal",
                  "coinos.io",
                  "wiener",
                  "agent",
                  "SUCCESS",
                  "measurement",
              ]

              return all(clean_agent(x) is None for x in bad)

          self_tests.append({
              "name": "generic_tokens_rejected",
              "passed": test_clean_generic_tokens(),
          })

          def test_nox_rejected():
              return (
                  clean_agent("nox_origine") is None
                  and clean_agent("@nox_origine") is None
                  and clean_agent("NØX") is None
              )

          self_tests.append({
              "name": "nox_rejected",
              "passed": test_nox_rejected(),
          })

          def test_result_requires_actor():
              sample = {
                  "information": "agentpedia discussed the subject",
                  "result": "SUCCESS",
              }

              return explicit_result(sample, "agentpedia") is None

          self_tests.append({
              "name": "generic_success_not_attributed",
              "passed": test_result_requires_actor(),
          })

          def test_multi_agent_no_inheritance():
              sample = {
                  "agent": "agentpedia",
                  "other_agent": "exori",
                  "result": {
                      "agent": "agentpedia",
                      "status": "SUCCESS",
                  },
              }

              first = explicit_result(sample, "agentpedia")
              second = explicit_result(sample, "exori")

              return first is not None and second is None

          self_tests.append({
              "name": "multi_agent_result_isolated",
              "passed": test_multi_agent_no_inheritance(),
          })

          def test_source_agent_not_subject():
              sample = {
                  "source_agent": "nox_origine",
                  "information": "agentpedia published a post",
              }

              # There is no structured agent attribution here.
              return explicit_behavior(sample, "agentpedia") is None

          self_tests.append({
              "name": "source_agent_not_subject_agent",
              "passed": test_source_agent_not_subject(),
          })

          def test_structured_result():
              sample = {
                  "result": {
                      "agent": "agentpedia",
                      "status": "SUCCESS",
                  }
              }

              result = explicit_result(sample, "agentpedia")

              return (
                  result is not None
                  and result["result"] == "success"
              )

          self_tests.append({
              "name": "structured_result_accepted",
              "passed": test_structured_result(),
          })

          if not all(test["passed"] for test in self_tests):
              failed = [
                  test["name"]
                  for test in self_tests
                  if not test["passed"]
              ]

              raise SystemExit(
                  "ACT18 V2 SELF-TEST FAILED: " + ", ".join(failed)
              )

          # ------------------------------------------------------------
          # Final validation.
          # ------------------------------------------------------------

          validation_errors = []

          for key, profile in final_profiles.items():
              agent = profile["agent"]

              if norm(agent) in N0X_NAMES:
                  validation_errors.append(
                      f"NØX incorrectly classified as external: {agent}"
                  )

              if clean_agent(agent) is None:
                  validation_errors.append(
                      f"Invalid agent in final profiles: {agent}"
                  )

              if profile["trust_level"] != "UNKNOWN":
                  if (
                      profile["behavioral_evidence"] == 0
                      and profile["results"] == 0
                  ):
                      validation_errors.append(
                          f"Trust without behavior/result: {agent}"
                      )

          # Every result observation must contain explicit attribution.
          for observation in observations:
              if observation["type"] == "RESULT":
                  attribution = observation.get("attribution", {})

                  if attribution.get("status") != "EXPLICIT":
                      validation_errors.append(
                          f"Result without explicit attribution: "
                          f"{observation.get('agent')}"
                      )

          if validation_errors:
              raise SystemExit(
                  "ACT18 V2 VALIDATION FAILED:\n- "
                  + "\n- ".join(validation_errors)
              )

          # ------------------------------------------------------------
          # Output.
          # ------------------------------------------------------------

          output = {
              "version": "ACT18-V2-FINAL",
              "generated_at": now,

              "source": {
                  "file": INPUT,
                  "knowledge_entries_processed": len(knowledge),
              },

              "statistics": {
                  "knowledge_entries": len(knowledge),
                  "identity_observations": identity_count,
                  "interaction_observations": interaction_count,
                  "behavioral_evidence_observations": behavior_count,
                  "result_observations": result_count,
                  "successful_results": success_count,
                  "failed_results": failure_count,
                  "unattributed_result_candidates": unattributed_result_candidates,
                  "rejected_result_candidates": rejected_result_candidates,
                  "external_agents": len(final_profiles),
                  "agent_profiles": len(final_profiles),
                  "HIGH": high_count,
                  "MEDIUM": medium_count,
                  "LOW": low_count,
                  "UNKNOWN": unknown_count,
              },

              "profiles": final_profiles,

              "observations": observations[:1000],

              "detection_audit": detection_audit,

              "self_tests": {
                  "status": "PASSED",
                  "tests": self_tests,
              },

              "trust_policy": {
                  "version": "V2-FINAL",

                  "principle":
                      "Trust is earned only from explicit behavioral "
                      "evidence and explicitly attributed results.",

                  "schema_discovery_used": True,

                  "identity_is_not_trust": True,
                  "interaction_is_not_trust": True,
                  "evidence_array_alone_is_not_behavior": True,

                  "name_presence_is_not_identity": True,
                  "name_presence_is_not_behavior": True,

                  "natural_language_result_attribution": False,

                  "generic_result_without_actor_rejected": True,

                  "source_agent_is_not_subject_agent": True,

                  "multi_agent_result_inheritance": False,

                  "unknown_preferred_over_false_trust": True,

                  "karma_used_for_trust": False,
                  "post_count_used_for_trust": False,
                  "follower_count_used_for_trust": False,

                  "external_api_used": False,
                  "gemini_used": False,
                  "cost_eur": 0,
              },

              "validation": {
                  "status": "PASSED",

                  "rules": [
                      "real_act17_schema_discovery",
                      "identity_requires_explicit_structure_or_identity_context",
                      "identity_is_not_trust",
                      "interaction_requires_explicit_relationship",
                      "interaction_is_not_trust",
                      "behavior_requires_explicit_actor_link",
                      "evidence_array_alone_is_not_behavior",
                      "result_requires_explicit_actor_attribution",
                      "generic_success_not_attributed",
                      "natural_language_result_attribution_forbidden",
                      "multi_agent_result_inheritance_forbidden",
                      "source_agent_not_used_as_subject_agent",
                      "nox_not_classified_as_external_agent",
                      "generic_tokens_rejected",
                      "trust_requires_behavior_or_result",
                      "karma_not_used_for_trust",
                      "post_count_not_used_for_trust",
                      "follower_count_not_used_for_trust",
                      "gemini_disabled",
                      "external_api_disabled",
                      "zero_cost",
                  ],
              },

              "last_run": now,
          }

          os.makedirs(os.path.dirname(OUTPUT), exist_ok=True)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("")
          print("========================================")
          print("NØX ACT18 V2")
          print("========================================")
          print(f"Knowledge entries : {len(knowledge)}")
          print(f"External agents   : {len(final_profiles)}")
          print(f"Identities        : {identity_count}")
          print(f"Interactions      : {interaction_count}")
          print(f"Behavior          : {behavior_count}")
          print(f"Results           : {result_count}")
          print(f"Successes         : {success_count}")
          print(f"Failures          : {failure_count}")
          print(f"HIGH              : {high_count}")
          print(f"MEDIUM            : {medium_count}")
          print(f"LOW               : {low_count}")
          print(f"UNKNOWN           : {unknown_count}")
          print(f"Unattributed      : {unattributed_result_candidates}")
          print("Self-tests        : PASSED")
          print("Validation        : PASSED")
          print("========================================")

          PY

      - name: Verify ACT18 V2 output
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          path = "memory/nox_reputation_trust.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["version"] == "ACT18-V2-FINAL"
          assert data["validation"]["status"] == "PASSED"
          assert data["self_tests"]["status"] == "PASSED"

          policy = data["trust_policy"]

          assert policy["identity_is_not_trust"] is True
          assert policy["interaction_is_not_trust"] is True
          assert policy["natural_language_result_attribution"] is False
          assert policy["multi_agent_result_inheritance"] is False
          assert policy["source_agent_is_not_subject_agent"] is True
          assert policy["karma_used_for_trust"] is False
          assert policy["post_count_used_for_trust"] is False
          assert policy["follower_count_used_for_trust"] is False
          assert policy["gemini_used"] is False
          assert policy["external_api_used"] is False
          assert policy["cost_eur"] == 0

          for observation in data["observations"]:
              if observation["type"] == "RESULT":
                  attribution = observation.get("attribution", {})
                  assert attribution.get("status") == "EXPLICIT"

          for key, profile in data["profiles"].items():
              if profile["trust_level"] != "UNKNOWN":
                  assert (
                      profile["behavioral_evidence"] > 0
                      or profile["results"] > 0
                  )

          print("ACT18 V2 OUTPUT VALIDATION: PASSED")
          print(
              "Agents:",
              data["statistics"]["external_agents"],
              "| Behavior:",
              data["statistics"]["behavioral_evidence_observations"],
              "| Results:",
              data["statistics"]["result_observations"],
              "| Trust:",
              (
                  data["statistics"]["HIGH"],
                  data["statistics"]["MEDIUM"],
                  data["statistics"]["LOW"],
                  data["statistics"]["UNKNOWN"],
              ),
          )
          PY

      - name: Commit ACT18 V2
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 V2 changes to commit."
            exit 0
          fi

          git commit -m "ACT18 V2 final reputation and trust"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
