name: NØX ACT 18 V2 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 V2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          INPUT = "memory/nox_knowledge_core.json"
          OUTPUT = "memory/nox_reputation_trust.json"

          if not os.path.exists(INPUT):
              raise SystemExit(f"Missing input file: {INPUT}")

          with open(INPUT, "r", encoding="utf-8") as f:
              data = json.load(f)

          now = datetime.now(timezone.utc).isoformat()

          # ============================================================
          # ACT18 V2
          #
          # REAL DATA -> SCHEMA DISCOVERY -> IDENTITY -> INTERACTION
          # -> BEHAVIOR -> EXPLICIT RESULT -> DOMAIN TRUST
          #
          # Absolute rules:
          # - name alone is not identity evidence
          # - identity alone is never trust
          # - interaction alone is never trust
          # - source_agent is not subject_agent
          # - SUCCESS/FAILURE without actor is rejected
          # - no result inheritance between agents
          # - no karma/post/follower trust
          # - UNKNOWN is preferable to false trust
          # ============================================================

          GENERIC_TOKENS = {
              "agent",
              "agents",
              "unknown",
              "none",
              "null",
              "n/a",
              "na",
              "follow",
              "following",
              "follower",
              "followers",
              "comment",
              "comments",
              "reply",
              "replies",
              "response",
              "responses",
              "post",
              "posts",
              "proposal",
              "proposals",
              "discussion",
              "measurement",
              "receipts",
              "the",
              "them",
              "pay",
              "payment",
              "success",
              "failure",
              "successful",
              "failed",
              "action",
              "actions",
              "executed",
              "execution",
              "interaction",
              "behavior",
              "behaviour",
              "result",
              "results",
              "evidence",
              "information",
              "memory",
              "knowledge",
              "machine-native payments",
              "coinos.io",
              "wiener",
              "hermes",
              "deep-seeker",
              "deep seeker",
              "adaptive balanced",
              "evidence-first",
              "strong_stability",
              "unresolved",
              "not_evaluable",
              "untested",
          }

          NOX_NAMES = {
              "nox",
              "nøx",
              "nox origin",
              "nøx origin",
              "nox_origine",
              "@nox_origine",
          }

          IDENTITY_KEYS = {
              "agent",
              "agent_id",
              "agent_uuid",
              "username",
              "handle",
              "subject_agent",
              "subject_agent_id",
              "subject_agent_uuid",
              "target_agent",
              "target_agent_id",
              "target_agent_uuid",
              "external_agent",
              "external_agent_id",
              "external_agent_uuid",
              "actor",
              "actor_id",
              "actor_uuid",
              "author",
              "author_id",
              "author_uuid",
              "responder",
              "responder_id",
              "responder_uuid",
          }

          SOURCE_KEYS = {
              "source_agent",
              "source",
              "created_by",
              "generated_by",
              "recorded_by",
              "stored_by",
          }

          INTERACTION_KEYS = {
              "action",
              "interaction",
              "activity",
              "event",
              "type",
          }

          INTERACTION_WORDS = {
              "follow",
              "followed",
              "following",
              "comment",
              "commented",
              "reply",
              "replied",
              "response",
              "responded",
              "interact",
              "interacted",
              "interaction",
              "mentioned",
              "mention",
          }

          BEHAVIOR_WORDS = {
              "published",
              "posted",
              "created",
              "built",
              "implemented",
              "answered",
              "commented",
              "replied",
              "responded",
              "proposed",
              "explained",
              "provided",
              "verified",
              "tested",
              "demonstrated",
              "completed",
              "delivered",
              "solved",
              "analyzed",
              "analysed",
              "contributed",
              "developed",
              "documented",
              "identified",
              "discovered",
          }

          RESULT_VALUES = {
              "success",
              "successful",
              "completed",
              "failure",
              "failed",
              "error",
              "partial",
          }

          def norm(value):
              if value is None:
                  return ""
              return str(value).strip().lower()

          def clean_agent(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()
              if not value:
                  return None

              v = norm(value)

              if v in GENERIC_TOKENS:
                  return None

              if v in NOX_NAMES:
                  return None

              if len(v) < 3 or len(v) > 80:
                  return None

              if any(ch in v for ch in ["\n", "\r", "{", "}", "[", "]"]):
                  return None

              if len(v.split()) > 5:
                  return None

              if re.fullmatch(
                  r"[a-z0-9_-]+\.(com|io|ai|org|net|dev)",
                  v
              ):
                  return None

              return value

          def is_uuid(value):
              if not isinstance(value, str):
                  return False

              return bool(
                  re.fullmatch(
                      r"[0-9a-fA-F]{8}-"
                      r"[0-9a-fA-F]{4}-"
                      r"[1-5][0-9a-fA-F]{3}-"
                      r"[89abAB][0-9a-fA-F]{3}-"
                      r"[0-9a-fA-F]{12}",
                      value.strip()
                  )
              )

          def path_string(path):
              result = "$"

              for part in path:
                  if isinstance(part, int):
                      result += f"[{part}]"
                  else:
                      result += "." + str(part)

              return result

          def walk(obj, path=()):
              yield path, obj

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      yield from walk(value, path + (str(key),))

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      yield from walk(value, path + (index,))

          def string_values(obj):
              for path, value in walk(obj):
                  if isinstance(value, str):
                      yield path, value

          # ============================================================
          # LOCATE ACT17 KNOWLEDGE
          # ============================================================

          if isinstance(data, dict):
              knowledge = data.get("knowledge")

              if not isinstance(knowledge, list):
                  candidates = []

                  for key, value in data.items():
                      if isinstance(value, list):
                          count = sum(
                              1 for item in value
                              if isinstance(item, dict)
                          )

                          if count:
                              candidates.append((count, key, value))

                  candidates.sort(
                      key=lambda x: x[0],
                      reverse=True
                  )

                  knowledge = (
                      candidates[0][2]
                      if candidates
                      else []
                  )

          elif isinstance(data, list):
              knowledge = data

          else:
              knowledge = []

          knowledge = [
              item for item in knowledge
              if isinstance(item, dict)
          ]

          # ============================================================
          # REAL SCHEMA DISCOVERY
          # ============================================================

          key_counter = Counter()
          path_counter = Counter()

          for entry in knowledge:
              for path, value in walk(entry):
                  if path:
                      path_counter[path_string(path)] += 1

                  if isinstance(value, dict):
                      for key in value:
                          key_counter[str(key)] += 1

          observed_identity_paths = []
          observed_source_paths = []
          observed_result_paths = []
          observed_interaction_paths = []

          for path, count in path_counter.items():
              last = path.split(".")[-1]
              last = re.sub(r"\[\d+\]$", "", last).lower()

              if last in IDENTITY_KEYS:
                  observed_identity_paths.append((path, count))

              if last in SOURCE_KEYS:
                  observed_source_paths.append((path, count))

              if last in {"result", "status", "outcome", "action_result"}:
                  observed_result_paths.append((path, count))

              if last in INTERACTION_KEYS:
                  observed_interaction_paths.append((path, count))

          # ============================================================
          # EXPLICIT IDENTITY CANDIDATES
          # ============================================================

          identity_candidates = defaultdict(list)

          def register_identity(value, evidence):
              agent = clean_agent(value)

              if not agent:
                  return

              key = norm(agent)

              identity_candidates[key].append({
                  "agent": agent,
                  **evidence,
              })

          for index, entry in enumerate(knowledge):

              for path, value in walk(entry):

                  if isinstance(value, dict):

                      for key, val in value.items():

                          key_norm = str(key).lower()

                          if key_norm in IDENTITY_KEYS:

                              if isinstance(val, str) and not is_uuid(val):
                                  register_identity(
                                      val,
                                      {
                                          "type": "structured_identity",
                                          "field": key_norm,
                                          "path": path_string(
                                              path + (key,)
                                          ),
                                          "entry_index": index,
                                      }
                                  )

                  elif isinstance(value, list):

                      for item_index, item in enumerate(value):

                          if not isinstance(item, dict):
                              continue

                          for key, val in item.items():

                              key_norm = str(key).lower()

                              if key_norm in IDENTITY_KEYS:

                                  if (
                                      isinstance(val, str)
                                      and not is_uuid(val)
                                  ):
                                      register_identity(
                                          val,
                                          {
                                              "type": "nested_identity",
                                              "field": key_norm,
                                              "path": path_string(
                                                  path + (
                                                      item_index,
                                                      key
                                                  )
                                              ),
                                              "entry_index": index,
                                          }
                                      )

          # Explicit textual identity only.
          TEXT_IDENTITY_PATTERNS = [
              r"\bfollowed\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bfollowing\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bresponse\s+from\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\breply\s+from\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bauthor\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\busername\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\bagent\s*:\s*@?([A-Za-z0-9_-]{3,50})\b",
              r"\bposted\s+by\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\bcreated\s+by\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\binteraction\s+with\s+@?([A-Za-z0-9_-]{3,50})\b",
              r"\binteracted\s+with\s+@?([A-Za-z0-9_-]{3,50})\b",
          ]

          for index, entry in enumerate(knowledge):

              for path, text in string_values(entry):

                  if len(text) > 5000:
                      continue

                  for pattern in TEXT_IDENTITY_PATTERNS:

                      for match in re.finditer(
                          pattern,
                          text,
                          flags=re.I
                      ):
                          register_identity(
                              match.group(1),
                              {
                                  "type": "explicit_text_identity",
                                  "pattern": pattern,
                                  "path": path_string(path),
                                  "entry_index": index,
                              }
                          )

          # ============================================================
          # PROFILE STORAGE
          # ============================================================

          profiles = {}

          def profile_for(agent):

              key = norm(agent)

              if key not in profiles:
                  profiles[key] = {
                      "agent": agent,
                      "domains": Counter(),
                      "identity": [],
                      "interaction": [],
                      "behavior": [],
                      "results": [],
                      "successes": 0,
                      "failures": 0,
                      "unknown_results": 0,
                  }

              return profiles[key]

          def entry_domain(entry):

              value = entry.get("domain")

              if isinstance(value, str) and value.strip():
                  return value.strip()

              information = entry.get("information")

              if isinstance(information, str):

                  match = re.search(
                      r"\bdomain\s*[:=]\s*([A-Za-z0-9_ -]{3,80})",
                      information,
                      flags=re.I
                  )

                  if match:
                      return match.group(1).strip()

              return "unknown"

          # ============================================================
          # STRUCTURED SUBJECT LINK
          #
          # IMPORTANT:
          # source_agent is deliberately excluded.
          # ============================================================

          def subject_link(obj, agent):

              target = norm(agent)

              for path, value in walk(obj):

                  if not isinstance(value, dict):
                      continue

                  for key, val in value.items():

                      key_norm = str(key).lower()

                      if key_norm not in IDENTITY_KEYS:
                          continue

                      if isinstance(val, str):
                          if (
                              norm(val) == target
                              and key_norm not in SOURCE_KEYS
                          ):
                              return {
                                  "field": key_norm,
                                  "path": path_string(
                                      path + (key,)
                                  ),
                              }

              return None

          # ============================================================
          # INTERACTION
          # ============================================================

          def find_interaction(entry, agent):

              link = subject_link(entry, agent)

              # Structured interaction.
              for path, value in walk(entry):

                  if not isinstance(value, dict):
                      continue

                  action = None

                  for key, val in value.items():

                      if str(key).lower() in INTERACTION_KEYS:

                          if isinstance(val, str):
                              action = norm(val)

                  if action in INTERACTION_WORDS and link:

                      return {
                          "method": "structured_interaction",
                          "action": action,
                          "path": path_string(path),
                          "identity_link": link,
                      }

              # Explicit text relation.
              target = re.escape(norm(agent))

              patterns = [
                  rf"\b(?:followed|following|commented|replied|responded|interacted|mentioned)\b.{{0,80}}\b{target}\b",
                  rf"\b{target}\b.{{0,80}}\b(?:commented|replied|responded|followed|interacted)\b",
              ]

              for path, text in string_values(entry):

                  lowered = text.lower()

                  for pattern in patterns:

                      if re.search(
                          pattern,
                          lowered,
                          flags=re.I
                      ):
                          return {
                              "method": "explicit_text_interaction",
                              "path": path_string(path),
                          }

              return None

          # ============================================================
          # BEHAVIOR
          #
          # Explicit actor link OR explicit authored-behavior phrase.
          # Mere name + behavior somewhere in same entry is NOT enough.
          # ============================================================

          def find_behavior(entry, agent):

              link = subject_link(entry, agent)

              if link:

                  for path, text in string_values(entry):

                      lowered = text.lower()

                      for word in BEHAVIOR_WORDS:

                          if re.search(
                              r"\b" + re.escape(word) + r"\b",
                              lowered
                          ):
                              return {
                                  "method": "structured_actor_behavior",
                                  "behavior": word,
                                  "path": path_string(path),
                                  "identity_link": link,
                              }

              target = re.escape(norm(agent))

              patterns = [
                  rf"\b{target}\b\s+(?:published|posted|created|built|implemented|answered|commented|replied|responded|proposed|explained|provided|verified|tested|demonstrated|completed|delivered|solved|analyzed|analysed|contributed)\b",

                  rf"\b(?:published|posted|created|built|implemented|answered|commented|replied|responded|proposed|explained|provided|verified|tested|demonstrated|completed|delivered|solved|analyzed|analysed|contributed)\b\s+by\s+{target}\b",
              ]

              for path, text in string_values(entry):

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          text,
                          flags=re.I
                      )

                      if match:

                          return {
                              "method": "explicit_authored_behavior",
                              "path": path_string(path),
                              "matched": match.group(0),
                          }

              return None

          # ============================================================
          # EXPLICIT RESULT
          #
          # No actor = no result attribution.
          # ============================================================

          def find_result(entry, agent):

              target = norm(agent)

              for path, value in walk(entry):

                  if not isinstance(value, dict):
                      continue

                  result_value = None
                  actor_match = False

                  for key, val in value.items():

                      key_norm = str(key).lower()

                      if key_norm in {
                          "result",
                          "status",
                          "outcome",
                          "action_result",
                      }:

                          if (
                              isinstance(val, str)
                              and norm(val) in RESULT_VALUES
                          ):
                              result_value = norm(val)

                      if key_norm in IDENTITY_KEYS:

                          if (
                              isinstance(val, str)
                              and norm(val) == target
                              and key_norm not in SOURCE_KEYS
                          ):
                              actor_match = True

                  if result_value and actor_match:

                      return {
                          "result": result_value,
                          "method": "structured_result_actor",
                          "path": path_string(path),
                      }

              # Explicit top-level actor fields.
              actor_fields = {
                  "result_agent",
                  "result_subject",
                  "outcome_agent",
                  "outcome_subject",
                  "result_actor",
                  "outcome_actor",
              }

              actor_found = False

              for key, value in entry.items():

                  if str(key).lower() in actor_fields:

                      if (
                          isinstance(value, str)
                          and norm(value) == target
                      ):
                          actor_found = True

              if actor_found:

                  for key, value in entry.items():

                      if str(key).lower() in {
                          "result",
                          "status",
                          "outcome",
                          "action_result",
                      }:

                          if (
                              isinstance(value, str)
                              and norm(value) in RESULT_VALUES
                          ):

                              return {
                                  "result": norm(value),
                                  "method": (
                                      "top_level_explicit_result_actor"
                                  ),
                                  "path": "$." + str(key),
                              }

              return None

          # ============================================================
          # SCAN ACT17
          # ============================================================

          observations = []

          unattributed_results = 0
          rejected_results = 0
          accepted_results = 0

          for index, entry in enumerate(knowledge):

              domain = entry_domain(entry)

              # Candidates explicitly connected to this entry.
              local_candidates = {}

              for key, evidences in identity_candidates.items():

                  matches = [
                      evidence
                      for evidence in evidences
                      if evidence.get("entry_index") == index
                  ]

                  if matches:
                      local_candidates[key] = (
                          matches[0].get("agent", key)
                      )

              # Structured identities discovered directly.
              for path, value in walk(entry):

                  if isinstance(value, dict):

                      for key, val in value.items():

                          key_norm = str(key).lower()

                          if key_norm in IDENTITY_KEYS:

                              if (
                                  isinstance(val, str)
                                  and not is_uuid(val)
                                  and key_norm not in SOURCE_KEYS
                              ):

                                  agent = clean_agent(val)

                                  if agent:
                                      local_candidates[
                                          norm(agent)
                                      ] = agent

                  elif isinstance(value, list):

                      for item in value:

                          if not isinstance(item, dict):
                              continue

                          for key, val in item.items():

                              key_norm = str(key).lower()

                              if key_norm in IDENTITY_KEYS:

                                  if (
                                      isinstance(val, str)
                                      and not is_uuid(val)
                                      and key_norm not in SOURCE_KEYS
                                  ):

                                      agent = clean_agent(val)

                                      if agent:
                                          local_candidates[
                                              norm(agent)
                                          ] = agent

              for candidate_key, agent in local_candidates.items():

                  if not clean_agent(agent):
                      continue

                  if norm(agent) in NOX_NAMES:
                      continue

                  profile = profile_for(agent)
                  profile["domains"][domain] += 1

                  # Identity.
                  identity_evidence = None

                  link = subject_link(entry, agent)

                  if link:

                      identity_evidence = {
                          "type": "structured_identity",
                          "method": link["field"],
                          "path": link["path"],
                          "entry_index": index,
                      }

                  else:

                      for evidence in identity_candidates.get(
                          candidate_key,
                          []
                      ):

                          if evidence.get("entry_index") == index:

                              identity_evidence = dict(evidence)
                              break

                  if identity_evidence:

                      profile["identity"].append(
                          identity_evidence
                      )

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "IDENTITY",
                          "evidence": identity_evidence,
                      })

                  # Interaction.
                  interaction = find_interaction(
                      entry,
                      agent
                  )

                  if interaction:

                      profile["interaction"].append(
                          interaction
                      )

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "INTERACTION",
                          "evidence": interaction,
                      })

                  # Behavior.
                  behavior = find_behavior(
                      entry,
                      agent
                  )

                  if behavior:

                      profile["behavior"].append(
                          behavior
                      )

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "BEHAVIOR",
                          "evidence": behavior,
                      })

                  # Result.
                  result = find_result(
                      entry,
                      agent
                  )

                  if result:

                      accepted_results += 1

                      profile["results"].append(result)

                      if result["result"] in {
                          "success",
                          "successful",
                          "completed",
                      }:

                          profile["successes"] += 1

                      elif result["result"] in {
                          "failure",
                          "failed",
                          "error",
                      }:

                          profile["failures"] += 1

                      else:

                          profile["unknown_results"] += 1

                      observations.append({
                          "agent": agent,
                          "domain": domain,
                          "claim_id": entry.get("claim_id"),
                          "type": "RESULT",
                          "result": result["result"],
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": result["method"],
                              "path": result["path"],
                          },
                      })

              # Generic SUCCESS/FAILURE is deliberately not assigned
              # to anyone.
              for path, value in string_values(entry):

                  if norm(value) in {
                      "success",
                      "successful",
                      "failure",
                      "failed",
                  }:

                      has_any_explicit_actor = False

                      for candidate_key in local_candidates:

                          agent = local_candidates[candidate_key]

                          if find_result(
                              entry,
                              agent
                          ):

                              has_any_explicit_actor = True
                              break

                      if not has_any_explicit_actor:

                          unattributed_results += 1
                          rejected_results += 1

          # ============================================================
          # TRUST CALCULATION
          # ============================================================

          final_profiles = {}

          for key, profile in profiles.items():

              agent = profile["agent"]

              if not clean_agent(agent):
                  continue

              if norm(agent) in NOX_NAMES:
                  continue

              identity_count = len(
                  profile["identity"]
              )

              interaction_count = len(
                  profile["interaction"]
              )

              behavior_count = len(
                  profile["behavior"]
              )

              result_count = len(
                  profile["results"]
              )

              success_count = profile["successes"]
              failure_count = profile["failures"]

              if (
                  behavior_count == 0
                  and result_count == 0
              ):

                  trust_score = 0.0
                  trust_level = "UNKNOWN"
                  trust_basis = (
                      "IDENTITY_OR_INTERACTION_ONLY"
                  )

              else:

                  success_rate = (
                      success_count / result_count
                      if result_count
                      else 0.0
                  )

                  score = 0.20

                  score += min(
                      0.30,
                      behavior_count * 0.10
                  )

                  score += min(
                      0.50,
                      success_rate * 0.50
                  )

                  score -= min(
                      0.30,
                      failure_count * 0.15
                  )

                  score = max(
                      0.0,
                      min(1.0, score)
                  )

                  if (
                      score >= 0.80
                      and success_count >= 3
                      and failure_count == 0
                  ):

                      trust_level = "HIGH"

                  elif (
                      score >= 0.60
                      and success_count >= 2
                  ):

                      trust_level = "MEDIUM"

                  else:

                      trust_level = "LOW"

                  trust_score = round(
                      score,
                      4
                  )

                  trust_basis = (
                      "BEHAVIOR_AND_OR_EXPLICIT_RESULTS"
                  )

              final_profiles[key] = {
                  "agent": agent,
                  "domains": dict(
                      profile["domains"]
                  ),
                  "identity_observations":
                      identity_count,
                  "interaction_observations":
                      interaction_count,
                  "behavioral_evidence":
                      behavior_count,
                  "results":
                      result_count,
                  "successes":
                      success_count,
                  "failures":
                      failure_count,
                  "unknown_results":
                      profile["unknown_results"],
                  "trust_score":
                      trust_score,
                  "trust_level":
                      trust_level,
                  "trust_basis":
                      trust_basis,
              }

          # ============================================================
          # STATISTICS
          # ============================================================

          identity_count = sum(
              p["identity_observations"]
              for p in final_profiles.values()
          )

          interaction_count = sum(
              p["interaction_observations"]
              for p in final_profiles.values()
          )

          behavior_count = sum(
              p["behavioral_evidence"]
              for p in final_profiles.values()
          )

          result_count = sum(
              p["results"]
              for p in final_profiles.values()
          )

          success_count = sum(
              p["successes"]
              for p in final_profiles.values()
          )

          failure_count = sum(
              p["failures"]
              for p in final_profiles.values()
          )

          high_count = sum(
              1
              for p in final_profiles.values()
              if p["trust_level"] == "HIGH"
          )

          medium_count = sum(
              1
              for p in final_profiles.values()
              if p["trust_level"] == "MEDIUM"
          )

          low_count = sum(
              1
              for p in final_profiles.values()
              if p["trust_level"] == "LOW"
          )

          unknown_count = sum(
              1
              for p in final_profiles.values()
              if p["trust_level"] == "UNKNOWN"
          )

          # ============================================================
          # SELF TESTS
          # ============================================================

          self_tests = []

          # Test 1: generic false agents rejected.
          generic_test_values = [
              "follow",
              "proposal",
              "coinos.io",
              "wiener",
              "agent",
              "SUCCESS",
              "measurement",
              "Hermes",
          ]

          generic_passed = all(
              clean_agent(value) is None
              for value in generic_test_values
          )

          self_tests.append({
              "name": "generic_tokens_rejected",
              "passed": generic_passed,
          })

          # Test 2: every NØX spelling rejected.
          nox_test_values = [
              "nox",
              "NØX",
              "nøx",
              "Nox Origin",
              "NØX Origin",
              "nox_origine",
              "@nox_origine",
          ]

          nox_passed = all(
              clean_agent(value) is None
              for value in nox_test_values
          )

          self_tests.append({
              "name": "nox_rejected",
              "passed": nox_passed,
          })

          # Test 3: source_agent alone cannot create subject behavior.
          source_only_sample = {
              "source_agent": "nox_origine",
              "information": "internal memory record",
          }

          source_only_passed = (
              find_behavior(
                  source_only_sample,
                  "nox_origine"
              ) is None
          )

          self_tests.append({
              "name": "source_agent_not_subject_agent",
              "passed": source_only_passed,
          })

          # Test 4: external name + generic SUCCESS is rejected.
          generic_success_sample = {
              "information": "agentpedia discussed the subject",
              "result": "SUCCESS",
          }

          generic_success_passed = (
              find_result(
                  generic_success_sample,
                  "agentpedia"
              ) is None
          )

          self_tests.append({
              "name": "generic_success_not_attributed",
              "passed": generic_success_passed,
          })

          # Test 5: multiple agents cannot inherit the same result.
          multi_agent_sample = {
              "agent": "agentpedia",
              "other_agent": "exori",
              "result": {
                  "agent": "agentpedia",
                  "status": "SUCCESS",
              },
          }

          first_result = find_result(
              multi_agent_sample,
              "agentpedia"
          )

          second_result = find_result(
              multi_agent_sample,
              "exori"
          )

          multi_agent_passed = (
              first_result is not None
              and second_result is None
          )

          self_tests.append({
              "name": "multi_agent_result_isolated",
              "passed": multi_agent_passed,
          })

          # Test 6: identity alone does not produce trust.
          identity_only_sample = {
              "agent": "agentpedia",
              "domain": "ai_communities",
          }

          identity_only_behavior = find_behavior(
              identity_only_sample,
              "agentpedia"
          )

          identity_only_result = find_result(
              identity_only_sample,
              "agentpedia"
          )

          identity_only_passed = (
              identity_only_behavior is None
              and identity_only_result is None
          )

          self_tests.append({
              "name": "identity_alone_not_trust",
              "passed": identity_only_passed,
          })

          # Test 7: explicit structured result is accepted.
          structured_result_sample = {
              "result": {
                  "agent": "agentpedia",
                  "status": "SUCCESS",
              }
          }

          structured_result = find_result(
              structured_result_sample,
              "agentpedia"
          )

          structured_result_passed = (
              structured_result is not None
              and structured_result["result"] == "success"
          )

          self_tests.append({
              "name": "structured_result_accepted",
              "passed": structured_result_passed,
          })

          # Test 8: source_agent must never become another agent.
          source_identity_sample = {
              "source_agent": "nox_origine",
              "information": "agentpedia",
          }

          source_identity_passed = (
              find_result(
                  source_identity_sample,
                  "nox_origine"
              ) is None
              and find_behavior(
                  source_identity_sample,
                  "nox_origine"
              ) is None
          )

          self_tests.append({
              "name": "source_agent_never_subject",
              "passed": source_identity_passed,
          })

          # Test 9: name appearing near behavior is insufficient.
          proximity_sample = {
              "information": (
                  "agentpedia was discussed. "
                  "Another agent published a post."
              )
          }

          proximity_passed = (
              find_behavior(
                  proximity_sample,
                  "agentpedia"
              ) is None
          )

          self_tests.append({
              "name": "name_proximity_not_behavior",
              "passed": proximity_passed,
          })

          # Test 10: explicit authorship behavior accepted.
          explicit_behavior_sample = {
              "information": (
                  "agentpedia published a technical analysis."
              )
          }

          explicit_behavior_result = find_behavior(
              explicit_behavior_sample,
              "agentpedia"
          )

          explicit_behavior_passed = (
              explicit_behavior_result is not None
          )

          self_tests.append({
              "name": "explicit_authored_behavior_accepted",
              "passed": explicit_behavior_passed,
          })

          failed_tests = [
              test["name"]
              for test in self_tests
              if not test["passed"]
          ]

          if failed_tests:
              raise SystemExit(
                  "ACT18 V2 SELF-TEST FAILED: "
                  + ", ".join(failed_tests)
              )

          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          validation_errors = []

          for key, profile in final_profiles.items():

              agent = profile["agent"]

              if norm(agent) in NOX_NAMES:
                  validation_errors.append(
                      f"NØX classified as external: {agent}"
                  )

              if clean_agent(agent) is None:
                  validation_errors.append(
                      f"Invalid agent: {agent}"
                  )

              if profile["trust_level"] != "UNKNOWN":

                  if (
                      profile["behavioral_evidence"] == 0
                      and profile["results"] == 0
                  ):
                      validation_errors.append(
                          f"Trust without evidence: {agent}"
                      )

          for observation in observations:

              if observation["type"] == "RESULT":

                  attribution = observation.get(
                      "attribution",
                      {}
                  )

                  if attribution.get("status") != "EXPLICIT":
                      validation_errors.append(
                          "RESULT without explicit attribution"
                      )

          if validation_errors:
              raise SystemExit(
                  "ACT18 V2 VALIDATION FAILED:\n- "
                  + "\n- ".join(validation_errors)
              )

          # ============================================================
          # OUTPUT
          # ============================================================

          output = {
              "version": "ACT18-V2-FINAL",

              "generated_at": now,

              "source": {
                  "file": INPUT,
                  "knowledge_entries_processed":
                      len(knowledge),
              },

              "statistics": {
                  "knowledge_entries":
                      len(knowledge),
                  "identity_observations":
                      identity_count,
                  "interaction_observations":
                      interaction_count,
                  "behavioral_evidence_observations":
                      behavior_count,
                  "result_observations":
                      result_count,
                  "successful_results":
                      success_count,
                  "failed_results":
                      failure_count,
                  "unattributed_result_candidates":
                      unattributed_results,
                  "rejected_result_candidates":
                      rejected_results,
                  "external_agents":
                      len(final_profiles),
                  "agent_profiles":
                      len(final_profiles),
                  "HIGH":
                      high_count,
                  "MEDIUM":
                      medium_count,
                  "LOW":
                      low_count,
                  "UNKNOWN":
                      unknown_count,
              },

              "profiles":
                  final_profiles,

              "observations":
                  observations[:1000],

              "detection_audit": {
                  "schema_discovery": {
                      "knowledge_entries":
                          len(knowledge),

                      "observed_identity_paths": [
                          {
                              "path": path,
                              "count": count,
                          }
                          for path, count in sorted(
                              observed_identity_paths,
                              key=lambda x: (-x[1], x[0])
                          )[:50]
                      ],

                      "observed_source_paths": [
                          {
                              "path": path,
                              "count": count,
                          }
                          for path, count in sorted(
                              observed_source_paths,
                              key=lambda x: (-x[1], x[0])
                          )[:50]
                      ],

                      "observed_result_paths": [
                          {
                              "path": path,
                              "count": count,
                          }
                          for path, count in sorted(
                              observed_result_paths,
                              key=lambda x: (-x[1], x[0])
                          )[:50]
                      ],

                      "observed_interaction_paths": [
                          {
                              "path": path,
                              "count": count,
                          }
                          for path, count in sorted(
                              observed_interaction_paths,
                              key=lambda x: (-x[1], x[0])
                          )[:50]
                      ],

                      "top_keys": [
                          {
                              "key": key,
                              "count": count,
                          }
                          for key, count in key_counter.most_common(50)
                      ],
                  },

                  "candidate_inventory": {
                      "candidate_count":
                          len(identity_candidates),

                      "candidates": [
                          {
                              "agent":
                                  evidences[0].get(
                                      "agent",
                                      key
                                  ),

                              "normalized":
                                  key,

                              "evidence_count":
                                  len(evidences),

                              "evidence_types":
                                  sorted(
                                      set(
                                          evidence.get(
                                              "type",
                                              "unknown"
                                          )
                                          for evidence
                                          in evidences
                                      )
                                  ),
                          }

                          for key, evidences
                          in sorted(
                              identity_candidates.items()
                          )
                      ][:100],
                  },

                  "result_audit": {
                      "explicit_result_attributions":
                          accepted_results,

                      "unattributed_result_candidates":
                          unattributed_results,

                      "rejected_result_candidates":
                          rejected_results,
                  },
              },

              "self_tests": {
                  "status": "PASSED",
                  "tests": self_tests,
              },

              "trust_policy": {
                  "version": "V2-FINAL",

                  "principle":
                      "Trust is earned only from explicit behavioral "
                      "evidence and explicitly attributed results.",

                  "real_act17_schema_discovery":
                      True,

                  "identity_is_not_trust":
                      True,

                  "interaction_is_not_trust":
                      True,

                  "evidence_array_alone_is_not_behavior":
                      True,

                  "name_presence_is_not_identity":
                      True,

                  "name_presence_is_not_behavior":
                      True,

                  "name_proximity_is_not_behavior":
                      True,

                  "natural_language_result_attribution":
                      False,

                  "generic_result_without_actor_rejected":
                      True,

                  "source_agent_is_not_subject_agent":
                      True,

                  "multi_agent_result_inheritance":
                      False,

                  "unknown_preferred_over_false_trust":
                      True,

                  "karma_used_for_trust":
                      False,

                  "post_count_used_for_trust":
                      False,

                  "follower_count_used_for_trust":
                      False,

                  "external_api_used":
                      False,

                  "gemini_used":
                      False,

                  "cost_eur":
                      0,
              },

              "validation": {
                  "status": "PASSED",

                  "rules": [
                      "real_act17_schema_discovery",
                      "identity_requires_explicit_structure_or_identity_context",
                      "identity_is_not_trust",
                      "interaction_requires_explicit_relationship",
                      "interaction_is_not_trust",
                      "behavior_requires_explicit_actor_link",
                      "name_proximity_not_behavior",
                      "evidence_array_alone_is_not_behavior",
                      "result_requires_explicit_actor_attribution",
                      "generic_success_not_attributed",
                      "natural_language_result_attribution_forbidden",
                      "multi_agent_result_inheritance_forbidden",
                      "source_agent_not_used_as_subject_agent",
                      "nox_not_classified_as_external_agent",
                      "generic_tokens_rejected",
                      "trust_requires_behavior_or_result",
                      "karma_not_used_for_trust",
                      "post_count_not_used_for_trust",
                      "follower_count_not_used_for_trust",
                      "gemini_disabled",
                      "external_api_disabled",
                      "zero_cost",
                  ],
              },

              "last_run": now,
          }

          os.makedirs(
              os.path.dirname(OUTPUT),
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("========================================")
          print("NØX ACT18 V2")
          print("========================================")
          print(
              f"Knowledge entries : {len(knowledge)}"
          )
          print(
              f"External agents   : {len(final_profiles)}"
          )
          print(
              f"Identities        : {identity_count}"
          )
          print(
              f"Interactions      : {interaction_count}"
          )
          print(
              f"Behavior          : {behavior_count}"
          )
          print(
              f"Results           : {result_count}"
          )
          print(
              f"Successes         : {success_count}"
          )
          print(
              f"Failures          : {failure_count}"
          )
          print(
              f"HIGH              : {high_count}"
          )
          print(
              f"MEDIUM            : {medium_count}"
          )
          print(
              f"LOW               : {low_count}"
          )
          print(
              f"UNKNOWN           : {unknown_count}"
          )
          print(
              f"Unattributed      : {unattributed_results}"
          )
          print(
              "Self-tests        : PASSED"
          )
          print(
              "Validation        : PASSED"
          )
          print("========================================")

          PY

      - name: Verify ACT18 V2 output
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          path = "memory/nox_reputation_trust.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["version"] == "ACT18-V2-FINAL"
          assert data["validation"]["status"] == "PASSED"
          assert data["self_tests"]["status"] == "PASSED"

          policy = data["trust_policy"]

          assert policy["identity_is_not_trust"] is True
          assert policy["interaction_is_not_trust"] is True
          assert policy["natural_language_result_attribution"] is False
          assert policy["generic_result_without_actor_rejected"] is True
          assert policy["source_agent_is_not_subject_agent"] is True
          assert policy["multi_agent_result_inheritance"] is False
          assert policy["karma_used_for_trust"] is False
          assert policy["post_count_used_for_trust"] is False
          assert policy["follower_count_used_for_trust"] is False
          assert policy["gemini_used"] is False
          assert policy["external_api_used"] is False
          assert policy["cost_eur"] == 0

          for observation in data["observations"]:

              if observation["type"] == "RESULT":

                  assert (
                      observation
                      .get("attribution", {})
                      .get("status")
                      == "EXPLICIT"
                  )

          for profile in data["profiles"].values():

              if profile["trust_level"] != "UNKNOWN":

                  assert (
                      profile["behavioral_evidence"] > 0
                      or profile["results"] > 0
                  )

          print(
              "ACT18 V2 OUTPUT VALIDATION: PASSED"
          )

          print(
              "Agents:",
              data["statistics"]["external_agents"],
              "| Identity:",
              data["statistics"]["identity_observations"],
              "| Interaction:",
              data["statistics"]["interaction_observations"],
              "| Behavior:",
              data["statistics"]["behavioral_evidence_observations"],
              "| Results:",
              data["statistics"]["result_observations"],
              "| Success:",
              data["statistics"]["successful_results"],
              "| Failure:",
              data["statistics"]["failed_results"],
              "| Trust:",
              (
                  data["statistics"]["HIGH"],
                  data["statistics"]["MEDIUM"],
                  data["statistics"]["LOW"],
                  data["statistics"]["UNKNOWN"],
              ),
          )
          PY

      - name: Commit ACT18 V2
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 V2 changes to commit."
            exit 0
          fi

          git commit -m "ACT18 V2 final reputation and trust"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
