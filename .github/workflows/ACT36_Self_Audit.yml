      - name: Commit ACT36 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_36_self_audit.json

          git diff --cached --quiet && exit 0

          git commit -m "Add NØX ACT36 self audit"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main

              git add memory/nox_act_36_self_audit.json
              git commit -m "Add NØX ACT36 self audit" || true
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after retries."
          exit 1
