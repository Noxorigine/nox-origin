name: NØX ACT36 - Self Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  self-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT36 self audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = Path("memory")
          BASE.mkdir(parents=True, exist_ok=True)

          def load_json(path, default=None):
              if default is None:
                  default = {}
              path = Path(path)

              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def number(value, default=0.0):
              try:
                  if value is None:
                      return default
                  return float(value)
              except Exception:
                  return default

          def is_list(value):
              return isinstance(value, list)

          def is_dict(value):
              return isinstance(value, dict)

          def first_number(*values, default=0.0):
              for value in values:
                  try:
                      if value is not None:
                          return float(value)
                  except Exception:
                      pass
              return default

          def clamp(value, low=0.0, high=100.0):
              return max(low, min(high, number(value)))

          # ============================================================
          # LOAD COGNITIVE HISTORY
          # ============================================================

          files = {
              "ACT26": BASE / "nox_act_26_active_attention.json",
              "ACT27": BASE / "nox_act_27_relational_understanding.json",
              "ACT28": BASE / "nox_act_28_anticipation_simulation.json",
              "ACT29": BASE / "nox_act_29_metacognition.json",
              "ACT30": BASE / "nox_act_30_adaptive_strategy_selection.json",
              "ACT31": BASE / "nox_act_31_strategy_evaluation.json",
              "ACT32": BASE / "nox_act_32_experiment_designer.json",
              "ACT33": BASE / "nox_act_33_resource_allocation.json",
              "ACT34": BASE / "nox_act_34_goal_formation.json",
              "ACT35": BASE / "nox_act_35_self_improvement.json",
          }

          data = {
              act: load_json(path, {})
              for act, path in files.items()
          }

          # ============================================================
          # FILE / SOURCE INTEGRITY
          # ============================================================

          source_integrity = {}

          for act, path in files.items():
              source_integrity[act] = {
                  "exists": path.exists(),
                  "readable": bool(data[act]),
                  "path": str(path)
              }

          # ============================================================
          # ACT26 AUDIT
          #
          # Important: distinguish:
          # - actual list data
          # - derived count
          # - missing field
          # - contradictory count
          # ============================================================

          act26 = data["ACT26"]

          selected_candidates = [
              act26.get("attention_items"),
              act26.get("selected_items"),
              act26.get("selected"),
              act26.get("attention")
          ]

          selected_list = next(
              (x for x in selected_candidates if is_list(x)),
              None
          )

          monitor_candidates = [
              act26.get("monitoring_items"),
              act26.get("monitored_items"),
              act26.get("monitor"),
              act26.get("monitoring")
          ]

          monitor_list = next(
              (x for x in monitor_candidates if is_list(x)),
              None
          )

          actual_attention_count = (
              len(selected_list)
              if selected_list is not None
              else None
          )

          actual_monitor_count = (
              len(monitor_list)
              if monitor_list is not None
              else None
          )

          reported_attention_count = first_number(
              act26.get("attention_count"),
              act26.get("selected_count"),
              act26.get("items_selected"),
              default=None
          )

          reported_monitor_count = first_number(
              act26.get("monitor_count"),
              act26.get("monitored_count"),
              default=None
          )

          act26_audit = {
              "attention_list_found": selected_list is not None,
              "monitor_list_found": monitor_list is not None,
              "actual_attention_count": actual_attention_count,
              "actual_monitor_count": actual_monitor_count,
              "reported_attention_count": reported_attention_count,
              "reported_monitor_count": reported_monitor_count,
              "attention_count_consistent": (
                  reported_attention_count is None
                  or actual_attention_count is None
                  or int(reported_attention_count)
                  == actual_attention_count
              ),
              "monitor_count_consistent": (
                  reported_monitor_count is None
                  or actual_monitor_count is None
                  or int(reported_monitor_count)
                  == actual_monitor_count
              )
          }

          # ============================================================
          # ACT27 AUDIT
          # ============================================================

          act27 = data["ACT27"]

          relationship_list = act27.get("relationships", [])
          strongest_relationships = act27.get(
              "strongest_relationships",
              []
          )
          relation_counts = act27.get(
              "relation_counts",
              {}
          )

          relationship_list_count = (
              len(relationship_list)
              if is_list(relationship_list)
              else None
          )

          relation_count_sum = (
              sum(
                  number(v)
                  for v in relation_counts.values()
              )
              if is_dict(relation_counts)
              else None
          )

          reported_relationship_count = first_number(
              act27.get("relationships_found"),
              act27.get("relationship_count"),
              default=None
          )

          act27_audit = {
              "relationship_list_count": relationship_list_count,
              "strongest_relationship_count": (
                  len(strongest_relationships)
                  if is_list(strongest_relationships)
                  else None
              ),
              "relation_count_sum": relation_count_sum,
              "reported_relationship_count":
                  reported_relationship_count,
              "relationship_evidence_present": (
                  relationship_list_count is not None
                  or relation_count_sum is not None
                  or reported_relationship_count is not None
              )
          }

          # ============================================================
          # ACT28 AUDIT
          # ============================================================

          act28 = data["ACT28"]

          predictions = act28.get("predictions", [])
          scenarios = act28.get("scenarios", [])
          verification_targets = act28.get(
              "verification_targets",
              []
          )

          prediction_count = (
              len(predictions)
              if is_list(predictions)
              else first_number(
                  act28.get("prediction_count"),
                  default=0.0
              )
          )

          scenario_count = (
              len(scenarios)
              if is_list(scenarios)
              else first_number(
                  act28.get("scenario_count"),
                  default=0.0
              )
          )

          verification_count = (
              len(verification_targets)
              if is_list(verification_targets)
              else first_number(
                  act28.get("verification_target_count"),
                  default=0.0
              )
          )

          act28_audit = {
              "prediction_count": prediction_count,
              "scenario_count": scenario_count,
              "verification_target_count": verification_count,
              "predictions_are_structured": all(
                  is_dict(x)
                  for x in predictions
              ) if is_list(predictions) else False,
              "scenarios_are_structured": all(
                  is_dict(x)
                  for x in scenarios
              ) if is_list(scenarios) else False
          }

          # ============================================================
          # ACT29 AUDIT
          # ============================================================

          act29 = data["ACT29"]

          self_awareness = first_number(
              act29.get("self_awareness_score"),
              act29.get("metrics", {}).get(
                  "self_awareness_score"
              ),
              default=None
          )

          metacognitive_gaps = (
              act29.get("metacognitive_gaps", [])
          )

          act29_audit = {
              "self_awareness_score": self_awareness,
              "self_awareness_score_valid_range": (
                  self_awareness is not None
                  and 0 <= self_awareness <= 100
              ),
              "metacognitive_gaps": (
                  len(metacognitive_gaps)
                  if is_list(metacognitive_gaps)
                  else None
              ),
              "self_knowledge_present": bool(
                  act29.get("self_knowledge")
              )
          }

          # ============================================================
          # ACT30 AUDIT
          # ============================================================

          act30 = data["ACT30"]

          preferred_strategy = act30.get(
              "preferred_strategy",
              act30.get("selected_strategy", {})
          )

          strategy_score = first_number(
              preferred_strategy.get("score")
              if is_dict(preferred_strategy)
              else None,
              default=None
          )

          decision_confidence = first_number(
              preferred_strategy.get("decision_confidence")
              if is_dict(preferred_strategy)
              else None,
              act30.get("decision_confidence"),
              default=None
          )

          act30_audit = {
              "strategy_present": is_dict(
                  preferred_strategy
              ) and bool(preferred_strategy),
              "strategy_score": strategy_score,
              "decision_confidence": decision_confidence,
              "confidence_valid_range": (
                  decision_confidence is not None
                  and 0 <= decision_confidence <= 100
              ),
              "switch_conditions_present": bool(
                  preferred_strategy.get("switch_conditions", [])
              ) if is_dict(preferred_strategy) else False
          }

          # ============================================================
          # ACT31 AUDIT
          # ============================================================

          act31 = data["ACT31"]

          observed_outcomes = first_number(
              act31.get("observed_outcome_count"),
              default=None
          )

          comparable_outcomes = first_number(
              act31.get("comparable_outcomes"),
              default=None
          )

          evidence_quality = first_number(
              act31.get("evidence_quality"),
              default=None
          )

          evaluation_status = act31.get(
              "evaluation_status"
          )

          act31_audit = {
              "observed_outcomes": observed_outcomes,
              "comparable_outcomes": comparable_outcomes,
              "evidence_quality": evidence_quality,
              "evaluation_status": evaluation_status,
              "epistemically_consistent": (
                  evaluation_status == "inconclusive"
                  and (
                      observed_outcomes == 0
                      or comparable_outcomes == 0
                  )
              )
          }

          # ============================================================
          # ACT32 AUDIT
          # ============================================================

          act32 = data["ACT32"]

          experiments = act32.get(
              "candidate_experiments",
              []
          )

          selected_experiment = act32.get(
              "selected_experiment",
              {}
          )

          act32_audit = {
              "candidate_experiment_count": (
                  len(experiments)
                  if is_list(experiments)
                  else first_number(
                      act32.get("candidate_experiment_count"),
                      default=0.0
                  )
              ),
              "selected_experiment_present": bool(
                  selected_experiment
              ),
              "selected_experiment_has_question": bool(
                  selected_experiment.get("question")
              ) if is_dict(selected_experiment) else False,
              "selected_experiment_has_hypothesis": bool(
                  selected_experiment.get("hypothesis")
              ) if is_dict(selected_experiment) else False,
              "required_evidence_defined": bool(
                  selected_experiment.get("required_evidence")
              ) if is_dict(selected_experiment) else False
          }

          # ============================================================
          # ACT33 AUDIT
          # ============================================================

          act33 = data["ACT33"]

          allocation_quality = first_number(
              act33.get("allocation_quality"),
              default=None
          )

          selected_allocation = act33.get(
              "selected_allocation",
              {}
          )

          act33_audit = {
              "allocation_quality": allocation_quality,
              "allocation_quality_valid_range": (
                  allocation_quality is not None
                  and 0 <= allocation_quality <= 100
              ),
              "selected_allocation_present": bool(
                  selected_allocation
              ),
              "allocation_not_execution": (
                  act33.get(
                      "execution_not_granted",
                      False
                  )
                  is True
              ),
              "reserve_protected": (
                  number(
                      act33.get("reserve_percent"),
                      0
                  ) > 0
              )
          }

          # ============================================================
          # ACT34 AUDIT
          # ============================================================

          act34 = data["ACT34"]

          goal_quality = first_number(
              act34.get("goal_quality"),
              default=None
          )

          selected_goal = act34.get(
              "selected_goal",
              {}
          )

          act34_audit = {
              "goal_quality": goal_quality,
              "goal_quality_valid_range": (
                  goal_quality is not None
                  and 0 <= goal_quality <= 100
              ),
              "selected_goal_present": bool(
                  selected_goal
              ),
              "success_condition_present": bool(
                  selected_goal.get("success_condition")
              ) if is_dict(selected_goal) else False,
              "failure_condition_present": bool(
                  selected_goal.get("failure_condition")
              ) if is_dict(selected_goal) else False,
              "goal_is_provisional": (
                  act34.get(
                      "goal_is_provisional",
                      False
                  )
                  is True
              ),
              "execution_not_granted": (
                  act34.get(
                      "execution_not_granted",
                      False
                  )
                  is True
              )
          }

          # ============================================================
          # ACT35 AUDIT
          # ============================================================

          act35 = data["ACT35"]

          current_metrics = act35.get(
              "current_metrics",
              {}
          )

          act35_audit = {
              "baseline_available": (
                  act35.get(
                      "baseline",
                      {}
                  ).get(
                      "available",
                      False
                  )
              ),
              "improvement_state": act35.get(
                  "improvement_state"
              ),
              "empirical_evidence_available": (
                  act35.get(
                      "empirical_evidence_available",
                      False
                  )
              ),
              "capability_gain_not_assumed": (
                  act35.get(
                      "capability_gain_is_not_assumed",
                      False
                  )
              ),
              "provisional": (
                  act35.get(
                      "self_improvement_is_provisional",
                      False
                  )
              )
          }

          # ============================================================
          # CROSS-ACT CONSISTENCY TESTS
          # ============================================================

          inconsistencies = []
          warnings = []
          verified = []

          def verify(name, condition, message):
              if condition:
                  verified.append({
                      "check": name,
                      "status": "pass",
                      "message": message
                  })
              else:
                  inconsistencies.append({
                      "check": name,
                      "status": "fail",
                      "message": message
                  })

          # ACT26: actual selected list should be preferred
          # over an absent or stale numeric count.
          verify(
              "ACT26_attention_source",
              (
                  actual_attention_count is not None
                  or reported_attention_count is not None
              ),
              "ACT26 contains an identifiable attention source."
          )

          if (
              actual_attention_count is not None
              and reported_attention_count is not None
              and int(reported_attention_count)
              != actual_attention_count
          ):
              inconsistencies.append({
                  "check": "ACT26_attention_count",
                  "status": "fail",
                  "message": (
                      "Reported attention count differs from "
                      "the count of the stored attention list."
                  )
              })

          if (
              actual_monitor_count is not None
              and reported_monitor_count is not None
              and int(reported_monitor_count)
              != actual_monitor_count
          ):
              inconsistencies.append({
                  "check": "ACT26_monitor_count",
                  "status": "fail",
                  "message": (
                      "Reported monitor count differs from "
                      "the count of the stored monitor list."
                  )
              })

          # ACT28 must contain predictions before ACT29/30 can
          # legitimately reason about them.
          verify(
              "ACT28_prediction_chain",
              prediction_count > 0,
              "ACT28 contains prediction evidence."
          )

          verify(
              "ACT28_scenario_chain",
              scenario_count > 0,
              "ACT28 contains scenario evidence."
          )

          # ACT29 must not claim certainty from unobserved predictions.
          verify(
              "ACT29_uncertainty",
              bool(
                  act29.get(
                      "knows_that_predictions_are_hypotheses",
                      False
                  )
                  or act29.get(
                      "self_knowledge",
                      {}
                  )
              ),
              "ACT29 contains explicit metacognitive awareness."
          )

          # ACT30 must contain switch conditions.
          verify(
              "ACT30_switch_conditions",
              act30_audit[
                  "switch_conditions_present"
              ],
              "ACT30 defines conditions under which strategy selection changes."
          )

          # ACT31 must not validate without outcomes.
          if observed_outcomes == 0:
              verify(
                  "ACT31_no_false_validation",
                  evaluation_status == "inconclusive",
                  "ACT31 remains inconclusive when no outcomes exist."
              )

          # ACT32 must define what evidence would count.
          verify(
              "ACT32_evidence_definition",
              act32_audit[
                  "required_evidence_defined"
              ],
              "ACT32 defines required experimental evidence."
          )

          # ACT33 must not confuse allocation with permission.
          verify(
              "ACT33_execution_boundary",
              act33_audit[
                  "allocation_not_execution"
              ],
              "ACT33 keeps resource allocation separate from execution."
          )

          # ACT34 must keep goals measurable and revisable.
          verify(
              "ACT34_goal_measurability",
              (
                  act34_audit[
                      "success_condition_present"
                  ]
                  and act34_audit[
                      "failure_condition_present"
                  ]
              ),
              "ACT34 goal contains measurable success and failure conditions."
          )

          # ACT35 must not claim improvement without evidence.
          if not act35_audit[
              "empirical_evidence_available"
          ]:
              verify(
                  "ACT35_no_false_improvement",
                  act35.get("improvement_state")
                  in (
                      "baseline_established",
                      "no_material_change",
                      "insufficient_evidence"
                  ),
                  "ACT35 does not claim unsupported improvement."
              )

          # ============================================================
          # DETECT MEASUREMENT QUALITY PROBLEMS
          # ============================================================

          measurement_problems = []

          if actual_attention_count == 0:
              measurement_problems.append({
                  "source": "ACT26",
                  "problem": "attention_count_zero_or_unrecoverable",
                  "severity": "medium",
                  "meaning": (
                      "The current reader cannot establish the "
                      "actual attention selection count."
                  )
              })

          if actual_monitor_count == 0:
              measurement_problems.append({
                  "source": "ACT26",
                  "problem": "monitor_count_zero_or_unrecoverable",
                  "severity": "medium",
                  "meaning": (
                      "The current reader cannot establish the "
                      "actual monitoring count."
                  )
              })

          if act32.get(
              "selected_experiment",
              {}
          ).get("priority", None) == 0.0:
              measurement_problems.append({
                  "source": "ACT32",
                  "problem": "experiment_priority_zero",
                  "severity": "low",
                  "meaning": (
                      "ACT32 may have lost upstream priority information."
                  )
              })

          if act35.get(
              "current_metrics",
              {}
          ).get("attention_count", None) == 0.0:
              measurement_problems.append({
                  "source": "ACT35",
                  "problem": "attention_metric_underreported",
                  "severity": "medium",
                  "meaning": (
                      "ACT35 inherited an attention count of zero "
                      "despite earlier ACT26 evidence indicating "
                      "selected attention items."
                  )
              })

          # ============================================================
          # SOURCE QUALITY
          # ============================================================

          total_sources = len(source_integrity)
          valid_sources = sum(
              1
              for item in source_integrity.values()
              if item["exists"] and item["readable"]
          )

          source_completeness = (
              (valid_sources / total_sources) * 100.0
              if total_sources
              else 0.0
          )

          consistency_count = len(verified)
          inconsistency_count = len(inconsistencies)

          consistency_score = (
              consistency_count
              / max(
                  consistency_count
                  + inconsistency_count,
                  1
              )
              * 100.0
          )

          measurement_penalty = min(
              40.0,
              len(measurement_problems) * 8.0
          )

          audit_quality = clamp(
              (
                  source_completeness * 0.30
                  + consistency_score * 0.40
                  + 100.0 * 0.30
                  - measurement_penalty
              )
          )

          # ============================================================
          # TRUST LEVEL
          # ============================================================

          if audit_quality >= 90:
              trust_level = "high"
          elif audit_quality >= 75:
              trust_level = "moderate"
          elif audit_quality >= 50:
              trust_level = "limited"
          else:
              trust_level = "low"

          # ============================================================
          # SELF-AUDIT LESSONS
          # ============================================================

          lessons = [
              (
                  "A measurement is not trustworthy merely because "
                  "a workflow produced it."
              ),
              (
                  "NØX must distinguish zero from missing, unreadable "
                  "or incorrectly parsed data."
              ),
              (
                  "Internal capability scores describe state but do "
                  "not prove real-world improvement."
              ),
              (
                  "A downstream ACT must preserve the semantic meaning "
                  "of upstream evidence."
              ),
              (
                  "Cross-ACT consistency is itself a source of evidence "
                  "about system reliability."
              )
          ]

          if measurement_problems:
              lessons.append(
                  "Known measurement inconsistencies should become "
                  "future engineering targets rather than being silently ignored."
              )

          # ============================================================
          # REPAIR PRIORITIES
          # ============================================================

          repair_priorities = []

          if any(
              x["source"] == "ACT26"
              for x in measurement_problems
          ):
              repair_priorities.append({
                  "priority": 1,
                  "target": "ACT26_data_contract",
                  "reason": (
                      "Make attention and monitoring counts "
                      "explicit and machine-readable."
                  )
              })

          if any(
              x["source"] == "ACT35"
              for x in measurement_problems
          ):
              repair_priorities.append({
                  "priority": 2,
                  "target": "ACT35_metric_ingestion",
                  "reason": (
                      "Ensure ACT35 reads the authoritative ACT26 "
                      "attention state rather than a missing alias."
                  )
              })

          if any(
              x["source"] == "ACT32"
              for x in measurement_problems
          ):
              repair_priorities.append({
                  "priority": 3,
                  "target": "ACT32_priority_propagation",
                  "reason": (
                      "Preserve upstream experiment priority "
                      "when creating the experiment object."
                  )
              })

          if not repair_priorities:
              repair_priorities.append({
                  "priority": 1,
                  "target": "continuous_measurement_validation",
                  "reason": (
                      "No critical inconsistency detected. "
                      "Continue auditing measurements before using "
                      "them for self-modification."
                  )
              })

          # ============================================================
          # WHAT NØX MAY TRUST
          # ============================================================

          trusted_measurements = [
              "ACT27 relationship evidence",
              "ACT28 prediction and scenario counts",
              "ACT29 explicit metacognitive statements",
              "ACT30 strategy and switch conditions",
              "ACT31 absence of observed outcomes",
              "ACT32 experiment structure",
              "ACT33 allocation boundary",
              "ACT34 goal success and failure conditions"
          ]

          measurements_requiring_caution = [
              "ACT26 attention count",
              "ACT26 monitor count",
              "ACT32 experiment priority",
              "ACT35 inherited attention metric"
          ]

          # ============================================================
          # FEEDBACK TO THE COGNITIVE LOOP
          # ============================================================

          feedback = {
              "ACT29_metacognition": {
                  "message": (
                      "Add measurement reliability to self-knowledge: "
                      "NØX should know not only what it knows, but "
                      "how trustworthy the measurement supporting that "
                      "knowledge is."
                  )
              },
              "ACT30_strategy_selection": {
                  "message": (
                      "Do not use a metric as a strong decision input "
                      "when ACT36 marks its source as unreliable."
                  )
              },
              "ACT31_strategy_evaluation": {
                  "message": (
                      "Expected-versus-observed comparisons must use "
                      "audited measurements."
                  )
              },
              "ACT32_experiment_design": {
                  "message": (
                      "Every future experiment should define not only "
                      "what will be measured, but how measurement quality "
                      "will be checked."
                  )
              },
              "ACT33_resource_allocation": {
                  "message": (
                      "Do not allocate heavily toward evidence streams "
                      "whose measurements are known to be unreliable."
                  )
              },
              "ACT34_goal_formation": {
                  "message": (
                      "Goal success must depend on trustworthy evidence, "
                      "not merely on internal completion metrics."
                  )
              },
              "ACT35_self_improvement": {
                  "message": (
                      "Self-improvement claims should be confidence-weighted "
                      "by the reliability of the measurements used."
                  )
              }
          }

          # ============================================================
          # RESULT
          # ============================================================

          result = {
              "act": "ACT36",
              "name": "Self Audit",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,
