name: NØX Origin - V32 Controlled Interaction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-interaction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NØX observes The Colony
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          api_key = os.getenv("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY secret is missing")

          BASE_URL = "https://thecolony.ai/api/v1"

          # ---------------------------------------------------------
          # 1. Authentification The Colony
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print(f"Authentication status: {auth_response.status_code}")

          if auth_response.status_code != 200:
              raise SystemExit(
                  f"Authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:500]}"
              )

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise SystemExit("No access token returned by The Colony")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # ---------------------------------------------------------
          # 2. Récupération du flux
          # ---------------------------------------------------------

          feed_response = requests.get(
              f"{BASE_URL}/posts",
              headers=headers,
              timeout=30
          )

          print(f"Feed status: {feed_response.status_code}")

          if feed_response.status_code != 200:
              raise SystemExit(
                  f"Feed retrieval failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:500]}"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, list):
              posts = feed_data
          elif isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("items")
                  or feed_data.get("data")
                  or []
              )
          else:
              posts = []

          if not isinstance(posts, list):
              posts = []

          # ---------------------------------------------------------
          # 3. Limiter l'observation
          #
          # V32 ne publie rien.
          # V32 observe uniquement.
          # ---------------------------------------------------------

          posts = posts[:20]

          now = datetime.now(timezone.utc).isoformat()

          observations = memory.get("observations", [])
          interaction_log = memory.get("interaction_log", [])

          if not isinstance(observations, list):
              observations = []

          if not isinstance(interaction_log, list):
              interaction_log = []

          # ---------------------------------------------------------
          # 4. Analyse locale des publications
          # ---------------------------------------------------------

          topic_keywords = {
              "memory": [
                  "memory",
                  "context",
                  "kv cache",
                  "state",
                  "history"
              ],
              "verification": [
                  "verification",
                  "validate",
                  "validation",
                  "evidence",
                  "proof",
                  "replication"
              ],
              "autonomy": [
                  "autonomy",
                  "autonomous",
                  "agent",
                  "permission",
                  "capability"
              ],
              "security": [
                  "security",
                  "trust",
                  "attack",
                  "boundary",
                  "authentication"
              ],
              "efficiency": [
                  "latency",
                  "compute",
                  "efficient",
                  "resource",
                  "cost",
                  "performance"
              ],
              "learning": [
                  "learning",
                  "learn",
                  "feedback",
                  "trajectory",
                  "reinforcement"
              ]
          }

          new_observations = 0
          topic_counts = {}

          for post in posts:

              if not isinstance(post, dict):
                  continue

              author = (
                  post.get("author")
                  or post.get("username")
                  or post.get("agent")
                  or "unknown"
              )

              text = (
                  post.get("content")
                  or post.get("body")
                  or post.get("text")
                  or ""
              )

              title = post.get("title") or ""

              combined = f"{title}\n{text}".strip()

              if not combined:
                  continue

              normalized = re.sub(
                  r"\s+",
                  " ",
                  combined.lower()
              )

              detected_topics = []

              for topic, keywords in topic_keywords.items():

                  matches = [
                      keyword
                      for keyword in keywords
                      if keyword in normalized
                  ]

                  if matches:
                      detected_topics.append(topic)
                      topic_counts[topic] = (
                          topic_counts.get(topic, 0) + 1
                      )

              # Une publication sans signal exploitable
              # n'est pas ajoutée comme observation.
              if not detected_topics:
                  continue

              observation = {
                  "author": str(author),
                  "text": combined[:4000],
                  "topics": detected_topics,
                  "observed_at": now,
                  "source": "the_colony_v32"
              }

              observations.append(observation)
              new_observations += 1

          # ---------------------------------------------------------
          # 5. Journal d'interaction
          # ---------------------------------------------------------

          interaction_log.append({
              "version": "V32",
              "timestamp": now,
              "posts_seen": len(posts),
              "new_observations": new_observations,
              "topics_detected": topic_counts,
              "action": "observe_only",
              "published": False,
              "replied": False,
              "gemini_used": False,
              "cost_eur": 0
          })

          # Garder une taille raisonnable.
          observations = observations[-500:]
          interaction_log = interaction_log[-100:]

          # ---------------------------------------------------------
          # 6. Mise à jour de la mémoire
          # ---------------------------------------------------------

          memory["version"] = "V32"
          memory["updated_at"] = now
          memory["observations"] = observations
          memory["interaction_log"] = interaction_log

          history = memory.get("history", [])

          if not isinstance(history, list):
              history = []

          history.append({
              "version": "V32",
              "timestamp": now,
              "observations_total": len(observations),
              "posts_seen": len(posts),
              "new_observations": new_observations,
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_controlled_interaction"
          })

          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 7. Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V32")
          print("==========================================")
          print(f"Posts observed       : {len(posts)}")
          print(f"New observations     : {new_observations}")
          print(f"Memory observations  : {len(observations)}")
          print("------------------------------------------")
          print("Action               : OBSERVE ONLY")
          print("Publication          : NO")
          print("Reply                : NO")
          print("Gemini               : NOT USED")
          print("Cost                 : 0 EUR")
          print("------------------------------------------")
          print("Detected topics:")

          if topic_counts:
              for topic, count in sorted(
                  topic_counts.items(),
                  key=lambda item: (-item[1], item[0])
              ):
                  print(f"  - {topic}: {count}")
          else:
              print("  - none")

          print("==========================================")
          PY

      - name: Commit V32 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || \
            git commit -m "NØX V32 controlled interaction"

          git push
