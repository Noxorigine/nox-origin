name: NØX ACT50 - Schema Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect ACT50 structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("memory/nox_act_50_cognitive_decision_loop.json")

          print("=" * 72)
          print("NØX ACT50 - SCHEMA DIAGNOSTIC")
          print("=" * 72)

          if not path.exists():
              raise SystemExit(f"ERROR: missing file: {path}")

          data = json.loads(path.read_text(encoding="utf-8"))

          print()
          print("ROOT KEYS")
          print("-" * 72)

          for key in data:
              value = data[key]
              print(f"- {key}: {type(value).__name__}")

          print()
          print("ACT IDENTITY")
          print("-" * 72)
          print(repr(data.get("act")))

          print()
          print("DECISION / STATE / ACTION / PLAN RELATED FIELDS")
          print("-" * 72)

          keywords = (
              "decision",
              "state",
              "action",
              "plan",
              "support",
              "advance",
              "uncertainty",
          )

          def inspect(prefix, value, depth=0):
              if depth > 5:
                  return

              if isinstance(value, dict):
                  for key, child in value.items():
                      key_lower = str(key).lower()
                      child_prefix = f"{prefix}.{key}" if prefix else str(key)

                      if any(word in key_lower for word in keywords):
                          if isinstance(child, (dict, list)):
                              print(
                                  f"{child_prefix} = "
                                  f"{json.dumps(child, ensure_ascii=False)[:2000]}"
                              )
                          else:
                              print(f"{child_prefix} = {child!r}")

                      if isinstance(child, (dict, list)):
                          inspect(child_prefix, child, depth + 1)

              elif isinstance(value, list):
                  for index, child in enumerate(value[:20]):
                      inspect(f"{prefix}[{index}]", child, depth + 1)

          inspect("", data)

          print()
          print("TOP-LEVEL VALUES")
          print("-" * 72)

          for key, value in data.items():
              if isinstance(value, (str, int, float, bool)) or value is None:
                  print(f"{key} = {value!r}")

          print()
          print("=" * 72)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 72)
          PY
