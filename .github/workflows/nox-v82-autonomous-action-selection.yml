name: NØX V82 — Autonomous Action Selection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v82-autonomous-action-selection
  cancel-in-progress: false

jobs:
  autonomous-action-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V82
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          NOW = datetime.now(timezone.utc).isoformat()

          api = requests.Session()
          api.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Origin-V82"
          })

          api_key = os.environ.get("COLONY_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          # --------------------------------------------------
          # AUTHENTICATION
          # --------------------------------------------------

          token_response = api.post(
              BASE + "/auth/token",
              json={"api_key": api_key},
              timeout=30
          )
          token_response.raise_for_status()

          token_data = token_response.json()

          access_token = (
              token_data.get("access_token")
              or token_data.get("token")
              or token_data.get("data", {}).get("access_token")
          )

          if not access_token:
              raise RuntimeError("No access token returned")

          api.headers.update({
              "Authorization": f"Bearer {access_token}"
          })

          me_response = api.get(
              BASE + "/users/me",
              timeout=30
          )
          me_response.raise_for_status()

          me_data = me_response.json()
          me = me_data.get("data", me_data)

          nox_id = str(
              me.get("id")
              or me.get("user_id")
              or ""
          )

          nox_username = str(
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          ).lower().lstrip("@")

          # --------------------------------------------------
          # HELPERS
          # --------------------------------------------------

          def load_json(filename):
              path = MEMORY / filename

              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def api_get(path, params=None):
              response = api.get(
                  BASE + path,
                  params=params,
                  timeout=30
              )
              response.raise_for_status()
              return response.json()

          def unwrap(value):
              if isinstance(value, dict):
                  for key in (
                      "data",
                      "items",
                      "results",
                      "posts",
                      "suggestions"
                  ):
                      if isinstance(value.get(key), list):
                          return value[key]

              return value if isinstance(value, list) else []

          def post_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or ""
              )

          def author_of(item):
              if not isinstance(item, dict):
                  return {}

              if isinstance(item.get("author"), dict):
                  return item["author"]

              if isinstance(item.get("user"), dict):
                  return item["user"]

              return {}

          def is_nox(item):
              author = author_of(item)

              author_id = str(
                  author.get("id")
                  or author.get("user_id")
                  or item.get("author_id")
                  or ""
              )

              username = str(
                  author.get("username")
                  or author.get("handle")
                  or ""
              ).lower().lstrip("@")

              return (
                  author_id == nox_id
                  or username == nox_username
              )

          def lower_text(item):
              if not isinstance(item, dict):
                  return ""

              title = str(
                  item.get("title")
                  or ""
              )

              body = str(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or ""
              )

              return (title + " " + body).lower()

          # --------------------------------------------------
          # LOAD PREVIOUS VERSIONS
          # --------------------------------------------------

          v75 = load_json(
              "nox_v75_evidence_weighted_opportunity_detector.json"
          )

          v76 = load_json(
              "nox_v76_contextual_opportunity_verifier.json"
          )

          v77 = load_json(
              "nox_v77_action_readiness_engine.json"
          )

          v79 = load_json(
              "nox_v79_action_result_learning.json"
          )

          v80 = load_json(
              "nox_v80_adaptive_decision_learning.json"
          )

          v81 = load_json(
              "nox_v81_adaptive_action_prioritization.json"
          )

          # --------------------------------------------------
          # CURRENT SIGNALS
          # --------------------------------------------------

          feed_response = api_get(
              "/feed/for-you",
              {"limit": 7}
          )

          suggestions_response = api_get(
              "/suggestions",
              {"limit": 10}
          )

          posts_response = api_get(
              "/posts",
              {"limit": 10}
          )

          feed_items = unwrap(feed_response)
          suggestions = unwrap(suggestions_response)
          public_posts = unwrap(posts_response)

          # --------------------------------------------------
          # BUILD CANDIDATES
          # --------------------------------------------------

          candidates = {}

          for item in feed_items:
              if not isinstance(item, dict):
                  continue

              if is_nox(item):
                  continue

              pid = post_id(item)

              if pid:
                  candidates[pid] = item

          for item in public_posts:
              if not isinstance(item, dict):
                  continue

              if is_nox(item):
                  continue

              pid = post_id(item)

              if pid:
                  candidates[pid] = item

          # Suggestions are only supplementary signals.
          for suggestion in suggestions:
              if not isinstance(suggestion, dict):
                  continue

              possible = (
                  suggestion.get("post")
                  or suggestion.get("item")
                  or suggestion.get("target")
              )

              if not isinstance(possible, dict):
                  continue

              if is_nox(possible):
                  continue

              pid = post_id(possible)

              if pid and pid not in candidates:
                  candidates[pid] = possible

          # --------------------------------------------------
          # V81 INFORMATION
          # --------------------------------------------------

          v81_candidates = []

          for key in (
              "ranked_opportunities",
              "opportunities",
              "candidates",
              "ranked_candidates",
              "decisions"
          ):
              value = v81.get(key)

              if isinstance(value, list):
                  v81_candidates.extend(value)

          v81_by_id = {}

          for item in v81_candidates:
              if not isinstance(item, dict):
                  continue

              pid = str(
                  item.get("post_id")
                  or item.get("id")
                  or ""
              )

              if pid:
                  v81_by_id[pid] = item

          # --------------------------------------------------
          # EVIDENCE SCORING
          # --------------------------------------------------

          def score(item):
              body = lower_text(item)

              points = 0
              evidence = []

              request_signal = any(
                  phrase in body
                  for phrase in (
                      "i need",
                      "i'm looking for",
                      "looking for someone",
                      "need someone",
                      "can someone",
                      "who can",
                      "seeking",
                      "wanted",
                      "hire",
                      "hiring",
                      "request"
                  )
              )

              delegation_signal = any(
                  phrase in body
                  for phrase in (
                      "someone to build",
                      "someone to fix",
                      "someone to create",
                      "someone to research",
                      "someone to audit",
                      "someone to complete",
                      "for someone to"
                  )
              )

              deliverable_signal = any(
                  word in body
                  for word in (
                      "deliverable",
                      "deliver",
                      "report",
                      "prototype",
                      "parser",
                      "script",
                      "dataset",
                      "implementation"
                  )
              )

              acceptance_signal = any(
                  phrase in body
                  for phrase in (
                      "acceptance criteria",
                      "acceptance",
                      "requirements",
                      "criteria",
                      "must pass"
                  )
              )

              reward_signal = any(
                  word in body
                  for word in (
                      "reward",
                      "paid",
                      "payment",
                      "pay",
                      "sats",
                      "sat",
                      "btc",
                      "usdc",
                      "bounty",
                      "compensation"
                  )
              )

              deadline_signal = any(
                  word in body
                  for word in (
                      "deadline",
                      "due",
                      "by tomorrow",
                      "by friday"
                  )
              )

              application_signal = any(
                  phrase in body
                  for phrase in (
                      "apply",
                      "application",
                      "reply here",
                      "comment below",
                      "submit",
                      "dm me"
                  )
              )

              completion_signal = any(
                  phrase in body
                  for phrase in (
                      "completed",
                      "finished",
                      "already done",
                      "delivered",
                      "settled",
                      "paid out"
                  )
              )

              analysis_type = item.get("post_type") in (
                  "analysis",
                  "finding"
              )

              if request_signal:
                  points += 35
                  evidence.append("EXPLICIT_REQUEST")

              if delegation_signal:
                  points += 20
                  evidence.append("DELEGATION")

              if deliverable_signal:
                  points += 15
                  evidence.append("DELIVERABLE")

              if acceptance_signal:
                  points += 15
                  evidence.append("ACCEPTANCE_CRITERIA")

              if reward_signal:
                  points += 10
                  evidence.append("REWARD_SIGNAL")

              if deadline_signal:
                  points += 5
                  evidence.append("DEADLINE")

              if application_signal:
                  points += 5
                  evidence.append("APPLICATION_ROUTE")

              if completion_signal:
                  points -= 35
                  evidence.append("COMPLETED_WORK")

              if analysis_type and not request_signal:
                  points -= 20
                  evidence.append("ANALYSIS_OR_FINDING")

              return points, evidence

          # --------------------------------------------------
          # SCORE ALL CURRENT POSTS
          # --------------------------------------------------

          scored = []

          for pid, item in candidates.items():

              base_score, evidence = score(item)

              previous = v81_by_id.get(pid, {})

              previous_score = previous.get("score")

              if isinstance(previous_score, (int, float)):
                  base_score = max(
                      base_score,
                      int(previous_score)
                  )

              adaptive_modifier = 0

              adaptation = str(
                  v80.get("adaptation", {}).get("direction")
                  or v80.get("adaptation_direction")
                  or ""
              ).upper()

              if adaptation == "INCREASE_PRIORITY":
                  adaptive_modifier = 5

              elif adaptation == "DECREASE_PRIORITY":
                  adaptive_modifier = -5

              adaptive_score = (
                  base_score + adaptive_modifier
              )

              scored.append({
                  "post_id": pid,
                  "title": item.get("title", ""),
                  "post_type": item.get("post_type", ""),
                  "base_score": base_score,
                  "adaptive_modifier": adaptive_modifier,
                  "adaptive_score": adaptive_score,
                  "evidence": evidence
              })

          scored.sort(
              key=lambda item: item["adaptive_score"],
              reverse=True
          )

          # --------------------------------------------------
          # VERIFY TOP CANDIDATES
          # --------------------------------------------------

          verified = []

          for candidate in scored[:5]:

              pid = candidate["post_id"]

              try:
                  context_response = api_get(
                      f"/posts/{pid}/context"
                  )

                  context_text = json.dumps(
                      context_response,
                      ensure_ascii=False
                  ).lower()

                  context_bonus = 0

                  if "acceptance" in context_text:
                      context_bonus += 5

                  if "deliverable" in context_text:
                      context_bonus += 5

                  if "application" in context_text:
                      context_bonus += 3

                  candidate["context_retrieved"] = True
                  candidate["context_bonus"] = context_bonus

              except Exception as exc:
                  candidate["context_retrieved"] = False
                  candidate["context_bonus"] = 0
                  candidate["context_error"] = str(exc)

              candidate["final_score"] = (
                  candidate["adaptive_score"]
                  + candidate["context_bonus"]
              )

              verified.append(candidate)

          verified.sort(
              key=lambda item: item["final_score"],
              reverse=True
          )

          # --------------------------------------------------
          # AUTONOMOUS ARBITRATION
          # --------------------------------------------------

          selected = None

          for candidate in verified:

              evidence = set(
                  candidate.get("evidence", [])
              )

              final_score = candidate["final_score"]

              has_request = (
                  "EXPLICIT_REQUEST" in evidence
              )

              has_delegation = (
                  "DELEGATION" in evidence
              )

              completed = (
                  "COMPLETED_WORK" in evidence
              )

              analysis_only = (
                  "ANALYSIS_OR_FINDING" in evidence
                  and not has_request
              )

              if completed:
                  continue

              if analysis_only:
                  continue

              if final_score >= 75 and (
                  has_request or has_delegation
              ):
                  selected = candidate
                  break

              if final_score >= 55 and has_request:
                  selected = candidate
                  break

          # --------------------------------------------------
          # SELECT ACTION
          # --------------------------------------------------

          selected_action = "OBSERVE"

          reason = (
              "No sufficiently strong opportunity was found "
              "for autonomous action selection."
          )

          if selected:

              evidence = set(
                  selected.get("evidence", [])
              )

              has_request = (
                  "EXPLICIT_REQUEST" in evidence
              )

              has_delegation = (
                  "DELEGATION" in evidence
              )

              has_acceptance = (
                  "ACCEPTANCE_CRITERIA" in evidence
              )

              has_route = (
                  "APPLICATION_ROUTE" in evidence
              )

              if (
                  has_request
                  and has_delegation
                  and has_acceptance
                  and has_route
              ):
                  selected_action = "COMMENT_APPLICATION"

                  reason = (
                      "The opportunity contains explicit demand, "
                      "delegation, acceptance information and "
                      "an identifiable application route."
                  )

              elif has_request and not has_acceptance:
                  selected_action = (
                      "REQUEST_ACCEPTANCE_CRITERIA"
                  )

                  reason = (
                      "The request appears actionable, but "
                      "acceptance criteria should be clarified."
                  )

              elif has_request or has_delegation:
                  selected_action = "SUBSTANTIVE_COMMENT"

                  reason = (
                      "The opportunity contains actionable demand "
                      "but does not yet justify direct application."
                  )

              else:
                  selected_action = "VERIFY_CONTEXT"

                  reason = (
                      "The signal is promising but still requires "
                      "additional contextual verification."
                  )

          # --------------------------------------------------
          # CONFIDENCE
          # --------------------------------------------------

          if selected:

              final_score = selected["final_score"]

              if final_score >= 85:
                  confidence = 0.90
              elif final_score >= 75:
                  confidence = 0.82
              elif final_score >= 65:
                  confidence = 0.74
              elif final_score >= 55:
                  confidence = 0.64
              else:
                  confidence = 0.50

          else:
              confidence = 0.35

          # --------------------------------------------------
          # FINAL DECISION
          # --------------------------------------------------

          decision = {
              "version": "V82",
              "generated_at": NOW,
              "mode": "autonomous_action_selection",

              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },

              "sources": {
                  "personalized_feed": len(feed_items),
                  "suggestions": len(suggestions),
                  "public_posts": len(public_posts),
                  "candidate_posts": len(candidates),
                  "verified_candidates": len(verified)
              },

              "selection": {
                  "selected": bool(selected),
                  "post_id": (
                      selected["post_id"]
                      if selected else None
                  ),
                  "title": (
                      selected["title"]
                      if selected else None
                  ),
                  "post_type": (
                      selected["post_type"]
                      if selected else None
                  ),
                  "score": (
                      selected["final_score"]
                      if selected else 0
                  ),
                  "evidence": (
                      selected["evidence"]
                      if selected else []
                  ),
                  "action": selected_action,
                  "reason": reason,
                  "confidence": confidence
              },

              "autonomy": {
                  "opportunity_selection": True,
                  "action_selection": True,
                  "arbitration": True,
                  "execution": False,
                  "automatic_rule_deployment": False
              },

              "execution_boundary": {
                  "public_comment": False,
                  "application": False,
                  "dm": False,
                  "bid": False,
                  "payment": False
              },

              "learning": {
                  "v75_loaded": bool(v75),
                  "v76_loaded": bool(v76),
                  "v77_loaded": bool(v77),
                  "v79_loaded": bool(v79),
                  "v80_loaded": bool(v80),
                  "v81_loaded": bool(v81)
              },

              "regression_cases": [
                  "REG-V62-GENERIC-DEMAND",
                  "REG-V64-ANALYSIS-FALSE-POSITIVE",
                  "REG-V67-OVER-PRUNING",
                  "REG-V69-TASK-WITHOUT-DEMAND",
                  "REG-V72-INPUT-RECOVERY",
                  "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                  "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                  "REG-V80-ADAPTATION-MUST-NOT-OVERRIDE-EVIDENCE"
              ],

              "next_stage": {
                  "version": "V83",
                  "purpose": (
                      "Execute the action selected autonomously "
                      "by V82 when the action is externally safe "
                      "and sufficiently supported by evidence."
                  )
              },

              "safety": {
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "automatic_payment": False,
                  "automatic_bidding": False,
                  "automatic_dm": False,
                  "automatic_marketplace_action": False
              }
          }

          # --------------------------------------------------
          # WRITE JSON
          # --------------------------------------------------

          json_path = (
              MEMORY /
              "nox_v82_autonomous_action_selection.json"
          )

          json_path.write_text(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # WRITE MARKDOWN
          # --------------------------------------------------

          md_lines = [
              "# NØX Origin — V82 Autonomous Action Selection",
              "",
              f"Generated: {NOW}",
              "",
              "## Objective",
              "",
              "V82 autonomously selects the opportunity and action "
              "that deserve priority for the next cycle.",
              "",
              "## Sources",
              "",
              f"- Personalized feed: {len(feed_items)}",
              f"- Suggestions: {len(suggestions)}",
              f"- Public posts: {len(public_posts)}",
              f"- Candidates: {len(candidates)}",
              f"- Context verified: {len(verified)}",
              "",
              "## Autonomous selection",
              ""
          ]

          if selected:
              md_lines.extend([
                  f"- Post ID: {selected['post_id']}",
                  f"- Title: {selected['title']}",
                  f"- Score: {selected['final_score']}",
                  f"- Action: {selected_action}",
                  f"- Confidence: {confidence}",
                  "- Evidence: "
                  + ", ".join(selected["evidence"]),
                  "",
                  reason
              ])
          else:
              md_lines.append(
                  "No opportunity reached the threshold for "
                  "autonomous action selection."
              )

          md_lines.extend([
              "",
              "## Autonomy",
              "",
              "Opportunity selection: autonomous",
              "Action selection: autonomous",
              "Arbitration: autonomous",
              "Execution: deferred",
              "",
              "## External actions",
              "",
              "Public comment: NO",
              "Application: NO",
              "DM: NO",
              "Bid: NO",
              "Payment: NO",
              "",
              "## Status",
              "",
              (
                  "AUTONOMOUS_SELECTION_COMPLETED"
                  if selected
                  else "NO_ACTION_SELECTED"
              ),
              "",
              f"Confidence: {confidence}",
              "Gemini: disabled",
              "Project cost: €0",
              "",
              "## Next stage",
              "",
              "V83 — Execute the action selected by NØX."
          ])

          md_path = (
              MEMORY /
              "nox_v82_autonomous_action_selection.md"
          )

          md_path.write_text(
              "\n".join(md_lines) + "\n",
              encoding="utf-8"
          )

          print(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

      - name: Commit V82 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_v82_autonomous_action_selection.json \
            memory/nox_v82_autonomous_action_selection.md

          if git diff --cached --quiet; then
            echo "No V82 memory changes to commit."
          else
            git commit -m "NØX V82 autonomous action selection"
            git push
          fi
