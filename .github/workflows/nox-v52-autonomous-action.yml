name: NØX Origin - V52 Autonomous Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX V52 - Autonomous Action
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v52_agent.py <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          API_BASE = "https://thecolony.ai/api/v1"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          now = datetime.now(
              timezone.utc
          ).isoformat()

          print("=== NØX Origin V52 ===")
          print("AUTONOMOUS ACTION")
          print()

          # =========================================================
          # 1. AUTHENTICATION
          # =========================================================

          print("[1] Authenticating with The Colony...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              "Authentication HTTP status:",
              auth.status_code
          )

          if auth.status_code != 200:
              print(auth.text[:5000])
              raise RuntimeError(
                  "Authentication failed"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # =========================================================
          # 2. IDENTITY
          # =========================================================

          print()
          print("[2] Checking NØX identity...")

          identity_response = session.get(
              f"{API_BASE}/users/me",
              timeout=30,
          )

          print(
              "Identity HTTP status:",
              identity_response.status_code
          )

          if identity_response.status_code != 200:
              print(
                  identity_response.text[:5000]
              )
              raise RuntimeError(
                  "Identity verification failed"
              )

          identity = identity_response.json()

          username = (
              identity.get("username")
              or identity.get("name")
              or "nox_origine"
          )

          print(
              "Authenticated agent:",
              username
          )

          print("Identity verification: PASS")

          # =========================================================
          # 3. READ SUGGESTIONS
          # =========================================================

          print()
          print("[3] Reading The Colony suggestions...")

          suggestions_response = session.get(
              f"{API_BASE}/suggestions",
              params={
                  "limit": 20
              },
              timeout=30,
          )

          print(
              "Suggestions HTTP status:",
              suggestions_response.status_code
          )

          if suggestions_response.status_code != 200:
              print(
                  suggestions_response.text[:5000]
              )
              raise RuntimeError(
                  "Suggestions request failed"
              )

          suggestions_data = (
              suggestions_response.json()
          )

          if isinstance(
              suggestions_data,
              dict
          ):

              if isinstance(
                  suggestions_data.get(
                      "items"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data["items"]
                  )

              elif isinstance(
                  suggestions_data.get(
                      "suggestions"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data["suggestions"]
                  )

              elif isinstance(
                  suggestions_data.get(
                      "actions"
                  ),
                  list
              ):
                  suggestions = (
                      suggestions_data["actions"]
                  )

              else:
                  suggestions = []

          elif isinstance(
              suggestions_data,
              list
          ):

              suggestions = suggestions_data

          else:

              suggestions = []

          print(
              "Suggestions received:",
              len(suggestions)
          )

          # =========================================================
          # 4. BUILD CANDIDATES
          # =========================================================

          print()
          print("[4] Evaluating available actions...")

          candidates = []

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              kind = suggestion.get(
                  "kind"
              )

              category = suggestion.get(
                  "category"
              )

              title = suggestion.get(
                  "title"
              )

              score = suggestion.get(
                  "score",
                  0
              )

              action = suggestion.get(
                  "action"
              )

              if not isinstance(
                  action,
                  dict
              ):
                  continue

              api_method = action.get(
                  "api_method"
              )

              api_path = action.get(
                  "api_path"
              )

              api_body = action.get(
                  "api_body"
              )

              # -----------------------------------------------------
              # Only accept known safe actions.
              # -----------------------------------------------------

              allowed = False
              priority = 999

              # Highest priority:
              # meaningful content interaction.
              if kind in [
                  "answer_question",
                  "reply_to_post",
                  "comment",
                  "respond"
              ]:

                  allowed = True
                  priority = 1

              # Profile housekeeping is allowed only when
              # values are already known. This is checked later.
              elif kind == "complete_profile":

                  allowed = True
                  priority = 2

              # Following a suggested agent is a limited,
              # reversible network action.
              elif kind == "follow_user":

                  allowed = True
                  priority = 3

              # Following a tag is also reversible, but lower
              # priority than following a relevant agent.
              elif kind == "follow_tag":

                  allowed = True
                  priority = 4

              # Editing NØX's own post is safe but the supplied
              # placeholder tags must NEVER be published.
              elif kind == "tag_own_post":

                  tags = None

                  if isinstance(
                      api_body,
                      dict
                  ):
                      tags = api_body.get(
                          "tags"
                      )

                  valid_tags = (
                      isinstance(
                          tags,
                          list
                      )
                      and len(tags) > 0
                      and all(
                          isinstance(
                              tag,
                              str
                          )
                          and tag.strip()
                          and "<" not in tag
                          and ">" not in tag
                          for tag in tags
                      )
                  )

                  if valid_tags:
                      allowed = True
                      priority = 5

              if not allowed:
                  continue

              # -----------------------------------------------------
              # Validate API method/path.
              # -----------------------------------------------------

              if api_method not in [
                  "POST",
                  "PUT"
              ]:
                  continue

              if not isinstance(
                  api_path,
                  str
              ):
                  continue

              if not api_path.startswith(
                  "/api/v1/"
              ):
                  continue

              candidates.append({
                  "index": index,
                  "kind": kind,
                  "category": category,
                  "title": title,
                  "score": score,
                  "priority": priority,
                  "api_method": api_method,
                  "api_path": api_path,
                  "api_body": api_body,
                  "raw": suggestion,
              })

          # =========================================================
          # 5. REMOVE UNSAFE PROFILE PLACEHOLDERS
          # =========================================================

          filtered = []

          for candidate in candidates:

              if candidate["kind"] == "complete_profile":

                  body = candidate.get(
                      "api_body"
                  )

                  if not isinstance(
                      body,
                      dict
                  ):
                      continue

                  model = body.get(
                      "current_model"
                  )

                  harness = body.get(
                      "harness"
                  )

                  # Never publish example placeholders.
                  if not model or not harness:
                      continue

                  if (
                      "<" in str(model)
                      or ">" in str(model)
                      or "<" in str(harness)
                      or ">" in str(harness)
                  ):
                      continue

              filtered.append(
                  candidate
              )

          candidates = filtered

          # =========================================================
          # 6. AUTONOMOUS SELECTION
          # =========================================================

          candidates.sort(
              key=lambda item: (
                  item["priority"],
                  -float(
                      item["score"]
                      or 0
                  )
              )
          )

          print()
          print(
              "Valid autonomous candidates:",
              len(candidates)
          )

          for candidate in candidates:

              print()
              print(
                  f"Candidate #{candidate['index']}"
              )

              print(
                  "  kind:",
                  candidate["kind"]
              )

              print(
                  "  category:",
                  candidate["category"]
              )

              print(
                  "  title:",
                  candidate["title"]
              )

              print(
                  "  score:",
                  candidate["score"]
              )

              print(
                  "  priority:",
                  candidate["priority"]
              )

              print(
                  "  method:",
                  candidate["api_method"]
              )

              print(
                  "  path:",
                  candidate["api_path"]
              )

          # =========================================================
          # 7. SAFETY GUARD
          # =========================================================

          result = {

              "version": "V52",

              "generated_at": now,

              "agent": username,

              "gemini": False,

              "suggestions_received":
                  len(suggestions),

              "candidates_found":
                  len(candidates),

              "action_taken": False,

              "action": None,

              "response": None,

              "safety": {
                  "maximum_actions": 1,
                  "actions_attempted": 0,
                  "publication": False,
                  "comment": False,
                  "vote": False,
                  "follow": False,
                  "dm": False,
                  "purchase": False,
                  "spending": False,
              }
          }

          if not candidates:

              print()
              print(
                  "NO SAFE AUTONOMOUS ACTION FOUND."
              )

              result["reason"] = (
                  "The Colony suggestions did not "
                  "contain a valid executable action "
                  "that passed V52 safety validation."
              )

          else:

              selected = candidates[0]

              print()
              print(
                  "================================================"
              )

              print(
                  "NØX AUTONOMOUS DECISION"
              )

              print(
                  "================================================"
              )

              print(
                  "Selected:",
                  selected["kind"]
              )

              print(
                  "Title:",
                  selected["title"]
              )

              print(
                  "Score:",
                  selected["score"]
              )

              print(
                  "API method:",
                  selected["api_method"]
              )

              print(
                  "API path:",
                  selected["api_path"]
              )

              # -----------------------------------------------------
              # Only execute the exact API instruction supplied by
              # The Colony.
              # -----------------------------------------------------

              path = selected[
                  "api_path"
              ]

              method = selected[
                  "api_method"
              ]

              body = selected.get(
                  "api_body"
              )

              url = (
                  "https://thecolony.ai"
                  + path
                  if path.startswith("/")
                  else path
              )

              print()
              print(
                  "Executing ONE autonomous action..."
              )

              if method == "POST":

                  response = session.post(
                      url,
                      json=body,
                      timeout=30,
                  )

              elif method == "PUT":

                  response = session.put(
                      url,
                      json=body,
                      timeout=30,
                  )

              else:

                  raise RuntimeError(
                      "Unsupported method"
                  )

              print(
                  "Action HTTP status:",
                  response.status_code
              )

              print(
                  "Response:",
                  response.text[:5000]
              )

              result[
                  "safety"
              ][
                  "actions_attempted"
              ] = 1

              result[
                  "action"
              ] = {
                  "index":
                      selected["index"],
                  "kind":
                      selected["kind"],
                  "category":
                      selected["category"],
                  "title":
                      selected["title"],
                  "score":
                      selected["score"],
                  "api_method":
                      method,
                  "api_path":
                      path,
                  "api_body":
                      body,
              }

              try:
                  response_data = (
                      response.json()
                  )
              except Exception:
                  response_data = {
                      "raw":
                          response.text
                  }

              result[
                  "response"
              ] = response_data

              if 200 <= response.status_code < 300:

                  result[
                      "action_taken"
                  ] = True

                  result[
                      "reason"
                  ] = (
                      "NØX selected the highest-priority "
                      "safe action returned by The Colony "
                      "and executed exactly the API "
                      "instruction supplied by the platform."
                  )

                  kind = selected[
                      "kind"
                  ]

                  if kind in [
                      "comment",
                      "reply_to_post",
                      "answer_question",
                      "respond"
                  ]:
                      result[
                          "safety"
                      ][
                          "comment"
                      ] = True

                  elif kind == "follow_user":
                      result[
                          "safety"
                      ][
                          "follow"
                      ] = True

                  elif kind == "follow_tag":
                      result[
                          "safety"
                      ][
                          "follow"
                      ] = True

                  print()
                  print(
                      "AUTONOMOUS ACTION: SUCCESS"
                  )

              else:

                  result[
                      "reason"
                  ] = (
                      "The selected action was "
                      "rejected by The Colony."
                  )

                  print()
                  print(
                      "AUTONOMOUS ACTION: FAILED"
                  )

          # =========================================================
          # 8. SAVE MEMORY
          # =========================================================

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              "memory/nox_v52_action.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================================================
          # 9. HUMAN REPORT
          # =========================================================

          report = []

          report.append(
              "# NØX Origin — V52 Autonomous Action"
          )

          report.append("")

          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append("## Status")
          report.append("")

          report.append(
              "- Authentication: PASS"
          )

          report.append(
              "- Identity: PASS"
          )

          report.append(
              "- Suggestions: READ"
          )

          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")

          report.append("## Autonomous Decision")
          report.append("")

          if result[
              "action_taken"
          ]:

              action = result[
                  "action"
              ]

              report.append(
                  "NØX performed one autonomous action."
              )

              report.append("")

              report.append(
                  f"- Kind: `{action['kind']}`"
              )

              report.append(
                  f"- Category: `{action['category']}`"
              )

              report.append(
                  f"- Title: {action['title']}"
              )

              report.append(
                  f"- Score: `{action['score']}`"
              )

              report.append(
                  f"- Method: `{action['api_method']}`"
              )

              report.append(
                  f"- Path: `{action['api_path']}`"
              )

          else:

              report.append(
                  "NØX performed NO external action."
              )

              report.append("")

              report.append(
                  f"Reason: {result.get('reason')}"
              )

          report.append("")

          report.append("## Safety")
          report.append("")

          report.append(
              "- Maximum actions per run: 1"
          )

          report.append(
              f"- Actions attempted: "
              f"{result['safety']['actions_attempted']}"
          )

          report.append(
              "- No purchase."
          )

          report.append(
              "- No spending."
          )

          report.append(
              "- Gemini disabled."
          )

          report.append("")

          report.append("## Evolution")
          report.append("")

          report.append(
              "V49: feed structure diagnosed."
          )

          report.append(
              "V50: feed observed and structured."
          )

          report.append(
              "V51: first controlled action attempted."
          )

          report.append(
              "V51.1: exact Colony actions discovered."
          )

          report.append(
              "V52: autonomous action selection."
          )

          with open(
              "NØX_V52_AUTONOMOUS_ACTION.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(report)
              )

          print()
          print(
              "=== NØX V52 COMPLETE ==="
          )

          print(
              "Action taken:",
              result["action_taken"]
          )

          print(
              "Memory:",
              "memory/nox_v52_action.json"
          )

          print(
              "Report:",
              "NØX_V52_AUTONOMOUS_ACTION.md"
          )

          PY

          python v52_agent.py

      - name: Commit V52 memory and report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v52_action.json
          git add NØX_V52_AUTONOMOUS_ACTION.md

          if git diff --cached --quiet; then
            echo "No V52 changes to commit."
          else
            git commit -m "NØX V52 autonomous action"
            git push
          fi
