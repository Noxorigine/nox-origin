name: NØX ACT49 - Uncertainty Management

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act49-uncertainty-management:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT49
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY = Path("memory")

          SOURCE = MEMORY / "nox_act_48_strategy_planning.json"
          OUTPUT_JSON = MEMORY / "nox_act_49_uncertainty_management.json"
          OUTPUT_MD = MEMORY / "nox_act_49_uncertainty_management.md"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          source = load_json(SOURCE)

          source_exists = SOURCE.exists()
          source_valid = source is not None

          integrity = {
              "source_exists": source_exists,
              "source_valid_json": source_valid,
              "source_is_act48": False,

              "uncertainty_invented": False,
              "confidence_invented": False,
              "threshold_invented": False,
              "decision_invented": False,
              "fallback_decision_used": False,

              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "payments_used": False,
              "spending_used": False,
          }

          if isinstance(source, dict):
              integrity["source_is_act48"] = (
                  source.get("act") == "ACT48"
                  and source.get("version") == "V1"
                  and source.get("title") == "Strategy Planning"
              )

          planning = {}
          upstream_state = {}

          if isinstance(source, dict):
              planning = source.get("planning") or {}
              upstream_state = source.get("upstream_state") or {}

          planning_decision = planning.get("decision")
          order_supported = planning.get("order_supported")
          selected_plan = planning.get("selected_plan")

          available_count = upstream_state.get(
              "available_strategy_count",
              0
          )

          explicit_order_count = upstream_state.get(
              "explicit_sequence_count",
              0
          )

          # ACT49 does not manufacture a confidence score.
          # It determines whether ACT48 contains enough explicit evidence
          # to justify moving forward.
          #
          # Important:
          # - no arbitrary numerical confidence
          # - no invented threshold
          # - no "probably enough"
          # - no fallback approval
          #
          # The only safe progression is based on explicit upstream state.

          decision = "INSUFFICIENT_EVIDENCE"
          can_advance = False
          uncertainty_level = "UNRESOLVED"
          reason = ""

          if not source_exists:
              decision = "SOURCE_MISSING"
              uncertainty_level = "UNKNOWN"
              reason = (
                  "ACT48 V1 memory is missing. ACT49 cannot evaluate "
                  "whether the decision state is sufficiently supported."
              )

          elif not source_valid:
              decision = "INVALID_SOURCE"
              uncertainty_level = "UNKNOWN"
              reason = (
                  "ACT48 V1 memory is invalid JSON. ACT49 refuses to "
                  "estimate certainty from an invalid source."
              )

          elif not integrity["source_is_act48"]:
              decision = "INVALID_UPSTREAM"
              uncertainty_level = "UNKNOWN"
              reason = (
                  "The upstream memory does not identify itself as ACT48 V1. "
                  "ACT49 refuses to evaluate uncertainty from an unverified "
                  "upstream state."
              )

          elif (
              planning_decision in {
                  "INSUFFICIENT_EVIDENCE",
                  "INSUFFICIENT_ORDER_EVIDENCE",
                  "SOURCE_MISSING",
                  "INVALID_SOURCE",
                  "INVALID_UPSTREAM",
              }
          ):
              decision = "INSUFFICIENT_CERTAINTY"
              can_advance = False
              uncertainty_level = "HIGH"

              reason = (
                  "ACT48 does not provide sufficient explicit evidence for "
                  "a supported strategy plan. ACT49 therefore cannot justify "
                  "advancing to a decision/action state."
              )

          elif (
              planning_decision in {
                  "PLAN_SUPPORTED",
                  "PLAN_SUPPORTED_BY_DEPENDENCIES",
              }
              and order_supported is True
              and selected_plan is not None
          ):
              decision = "CERTAINTY_SUPPORTED"
              can_advance = True
              uncertainty_level = "MANAGED"

              reason = (
                  "ACT48 provides an explicitly supported strategy plan. "
                  "ACT49 can therefore mark uncertainty as managed without "
                  "inventing a numerical confidence value."
              )

          else:
              decision = "INSUFFICIENT_CERTAINTY"
              can_advance = False
              uncertainty_level = "UNRESOLVED"

              reason = (
                  "ACT48 state is not sufficiently explicit to justify "
                  "advancement. ACT49 refuses to infer certainty."
              )

          result = {
              "act": "ACT49",
              "version": "V1",
              "title": "Uncertainty Management",
              "question": "Ai-je suffisamment de certitude pour avancer ?",
              "timestamp_utc": now(),

              "source": {
                  "file": str(SOURCE),
                  "required_upstream": "ACT48 V1",
                  "verified": (
                      source_exists
                      and source_valid
                      and integrity["source_is_act48"]
                  ),
              },

              "upstream_state": {
                  "planning_decision": planning_decision,
                  "order_supported": order_supported,
                  "selected_plan_present": selected_plan is not None,
                  "available_strategy_count": available_count,
                  "explicit_order_evidence": explicit_order_count,
              },

              "uncertainty": {
                  "decision": decision,
                  "uncertainty_level": uncertainty_level,
                  "can_advance": can_advance,
                  "reason": reason,

                  "numeric_confidence": None,
                  "confidence_threshold": None,
                  "threshold_basis": None,
              },

              "safety": {
                  "confidence_fabricated": False,
                  "threshold_fabricated": False,
                  "uncertainty_fabricated": False,
                  "decision_fabricated": False,
                  "fallback_approval_used": False,
                  "external_information_used": False,
              },

              "constraints": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "payments": False,
                  "spending": False,
                  "cost_eur": 0,
                  "python": "3.11",
              },

              "integrity": integrity,

              "next_step": (
                  "Advance to ACT50 only when the decision state is "
                  "supported by sufficient explicit evidence."
                  if can_advance
                  else
                  "Remain in ACT49 until upstream evidence is sufficient "
                  "to justify advancement."
              ),
          }

          MEMORY.mkdir(parents=True, exist_ok=True)

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          md = f"""# NØX ACT49 — Uncertainty Management

          **Version:** V1  
          **Question:** Ai-je suffisamment de certitude pour avancer ?  
          **Decision:** `{decision}`  
          **Uncertainty level:** `{uncertainty_level}`  
          **Can advance:** `{can_advance}`  
          **Timestamp UTC:** `{result["timestamp_utc"]}`

          ## Upstream

          - Source: `memory/nox_act_48_strategy_planning.json`
          - Required: ACT48 V1
          - Source verified: `{result["source"]["verified"]}`
          - ACT48 decision: `{planning_decision}`
          - Order supported: `{order_supported}`
          - Selected plan present: `{selected_plan is not None}`
          - Available strategies: `{available_count}`
          - Explicit order evidence: `{explicit_order_count}`

          ## Uncertainty decision

          **{decision}**

          **Level:** `{uncertainty_level}`

          **Can advance:** `{can_advance}`

          {reason}

          ## Confidence

          ACT49 deliberately does not create a numerical confidence value.

          - Numeric confidence: `null`
          - Confidence threshold: `null`
          - Threshold basis: `null`

          A number without an evidence-based calibration mechanism would be
          artificial and would create false certainty.

          ## Safety

          ACT49 does **not**:

          - invent confidence;
          - invent thresholds;
          - invent evidence;
          - transform insufficient evidence into approval;
          - use arbitrary probabilities;
          - use external AI;
          - use Gemini;
          - use external APIs;
          - spend money;
          - perform payments.

          ## Next step

          {result["next_step"]}
          """

          with OUTPUT_MD.open("w", encoding="utf-8") as f:
              f.write(md)

          print("=== NØX ACT49 V1 ===")
          print(f"Source exists: {source_exists}")
          print(f"Source valid JSON: {source_valid}")
          print(f"ACT48 verified: {integrity['source_is_act48']}")
          print(f"ACT48 decision: {planning_decision}")
          print(f"Order supported: {order_supported}")
          print(f"Selected plan present: {selected_plan is not None}")
          print(f"Available strategies: {available_count}")
          print(f"Explicit order evidence: {explicit_order_count}")
          print(f"Decision: {decision}")
          print(f"Uncertainty level: {uncertainty_level}")
          print(f"Can advance: {can_advance}")
          print("Numeric confidence: null")
          print("Confidence threshold: null")
          print("Gemini: false")
          print("External AI: false")
          print("External API: false")
          print("Payments: false")
          print("Spending: false")
          print("Cost EUR: 0")

          PY

      - name: Commit ACT49 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_49_uncertainty_management.json \
                  memory/nox_act_49_uncertainty_management.md

          if git diff --cached --quiet; then
            echo "No ACT49 changes to commit."
          else
            git commit -m "ACT49: add uncertainty management memory"
            git push
          fi
