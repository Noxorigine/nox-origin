name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "12"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade ddgs colony-sdk

      - name: Run NØX Work Factory
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          from ddgs import DDGS
          from colony_sdk import (
              ColonyAPIError,
              ColonyClient,
              ColonyNetworkError,
              ColonyRateLimitError,
          )


          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )

          MAX_WORK_ITEMS_PER_RUN = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )
          MAX_WEB_RESULTS_PER_QUERY = int(
              os.environ["MAX_WEB_RESULTS_PER_QUERY"]
          )
          MAX_TOTAL_WEB_RESULTS = int(
              os.environ["MAX_TOTAL_WEB_RESULTS"]
          )
          MAX_KNOWLEDGE_CONTEXT = int(
              os.environ["MAX_KNOWLEDGE_CONTEXT"]
          )
          WEB_TIMEOUT_SECONDS = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )
          MAX_HISTORY_ITEMS = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          COLONY_API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          )


          # ==========================================================
          # BASIC IO
          # ==========================================================

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).replace(
                  microsecond=0
              ).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(
                      f"LOAD FAILED: {path} | {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )
                  handle.write("\n")

              temporary.replace(path)


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          def clean_text(value, limit=None):
              if value is None:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              if limit:
                  text = text[:limit]

              return text


          def stable_id(prefix, value):
              normalized = re.sub(
                  r"\s+",
                  " ",
                  str(value).strip().lower()
              )

              digest = hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:16]

              return f"{prefix}-{digest}"


          # ==========================================================
          # WORK DISCOVERY
          # ==========================================================

          def normalize_work_item(
              item,
              source
          ):
              if isinstance(
                  item,
                  str
              ):
                  question = clean_text(
                      item,
                      600
                  )

                  if not question:
                      return None

                  return {
                      "request_id": stable_id(
                          "work",
                          question
                      ),
                      "question": question,
                      "priority": 0,
                      "source": source,
                      "original": item
                  }

              if not isinstance(
                  item,
                  dict
              ):
                  return None

              question = ""

              for key in (
                  "question",
                  "research_question",
                  "query",
                  "problem",
                  "objective",
                  "task",
                  "title",
                  "description"
              ):
                  value = item.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      question = clean_text(
                          value,
                          600
                      )
                      break

              if not question:
                  return None

              request_id = (
                  item.get("request_id")
                  or item.get("id")
                  or stable_id(
                      "work",
                      question
                  )
              )

              try:
                  priority = int(
                      item.get(
                          "priority",
                          0
                      )
                  )
              except Exception:
                  priority = 0

              return {
                  "request_id": str(
                      request_id
                  ),
                  "question": question,
                  "priority": priority,
                  "source": source,
                  "original": item
              }


          def collect_candidates(
              core_memory,
              core_runtime
          ):
              candidates = []

              for key in (
                  "work_requests",
                  "research_requests",
                  "web_queries"
              ):
                  values = core_runtime.get(
                      key,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      normalized = (
                          normalize_work_item(
                              item,
                              key
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              cases = core_memory.get(
                  "cognitive_cases",
                  []
              )

              if isinstance(
                  cases,
                  list
              ):
                  for case in cases:
                      if not isinstance(
                          case,
                          dict
                      ):
                          continue

                      status = clean_text(
                          case.get(
                              "status",
                              ""
                          )
                      ).lower()

                      if status in {
                          "closed",
                          "completed",
                          "resolved",
                          "discarded"
                      }:
                          continue

                      normalized = (
                          normalize_work_item(
                              case,
                              "cognitive_case"
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              deduped = {}

              for candidate in candidates:
                  request_id = candidate[
                      "request_id"
                  ]

                  existing = deduped.get(
                      request_id
                  )

                  if existing is None:
                      deduped[
                          request_id
                      ] = candidate

                  elif (
                      candidate[
                          "priority"
                      ]
                      > existing[
                          "priority"
                      ]
                  ):
                      deduped[
                          request_id
                      ] = candidate

              return list(
                  deduped.values()
              )


          # ==========================================================
          # COGNITIVE CLASSIFICATION
          #
          # Classification happens BEFORE selecting a tool.
          #
          # RESEARCH:
          #   information-seeking work.
          #
          # VERIFY:
          #   explicit checking/verification.
          #
          # ACTION:
          #   explicit Colony action.
          #
          # UNKNOWN:
          #   insufficiently clear. No tool is executed.
          # ==========================================================

          ACTION_PATTERNS = (
              r"^\s*join\s+(?:c/)?([a-z0-9][a-z0-9_-]*)\s*$",
              r"^\s*join\s+colony\s+([a-z0-9][a-z0-9_-]*)\s*$",
          )

          VERIFY_PATTERNS = (
              r"\bverify\b",
              r"\bverification\b",
              r"\bcheck whether\b",
              r"\bcheck if\b",
              r"\bvalidate\b",
              r"\bvalidation\b",
              r"\bconfirm whether\b",
              r"\bconfirm if\b",
              r"\bcitation checker\b",
              r"\bcheck the paper\b",
              r"\bcheck the source\b",
          )

          RESEARCH_PATTERNS = (
              r"\bresearch\b",
              r"\bfind out\b",
              r"\binvestigate\b",
              r"\blook up\b",
              r"\bwhat is\b",
              r"\bwhat are\b",
              r"\bhow does\b",
              r"\bhow do\b",
              r"\bwhy does\b",
              r"\bwhy do\b",
              r"\bwhich\b",
              r"\bwho is\b",
              r"\bcompare\b",
              r"\bpaper\b",
              r"\bdata\b",
              r"\bevidence\b",
              r"\bsource\b",
          )


          def classify_work(
              question,
              original,
              source
          ):
              text = clean_text(
                  question
              )

              lowered = text.lower()

              # ------------------------------------------------------
              # Explicit structured type has priority over text.
              # ------------------------------------------------------

              if isinstance(
                  original,
                  dict
              ):
                  explicit_type = clean_text(
                      original.get(
                          "type"
                      )
                      or original.get(
                          "work_type"
                      )
                      or original.get(
                          "kind"
                      )
                  ).lower()

                  aliases = {
                      "research": "research",
                      "research_request": "research",
                      "web_query": "research",
                      "verify": "verify",
                      "verification": "verify",
                      "action": "action",
                      "colony_action": "action",
                  }

                  if explicit_type in aliases:
                      work_type = aliases[
                          explicit_type
                      ]

                      return {
                          "type": work_type,
                          "confidence": "explicit",
                          "reason": (
                              "Explicit work type "
                              "provided by source."
                          ),
                          "tool": (
                              "web"
                              if work_type
                              in {
                                  "research",
                                  "verify"
                              }
                              else "colony_sdk"
                          )
                      }

              # ------------------------------------------------------
              # Exact safe Colony action recognition.
              #
              # We deliberately keep this narrow.
              # Unknown actions are NOT guessed.
              # ------------------------------------------------------

              for pattern in ACTION_PATTERNS:
                  match = re.search(
                      pattern,
                      lowered
                  )

                  if match:
                      colony = match.group(
                          1
                      )

                      return {
                          "type": "action",
                          "confidence": "high",
                          "reason": (
                              "Explicit Colony "
                              "join action."
                          ),
                          "tool": "colony_sdk",
                          "action": "join_colony",
                          "colony": colony
                      }

              # ------------------------------------------------------
              # Verification takes precedence over generic research.
              # ------------------------------------------------------

              for pattern in VERIFY_PATTERNS:
                  if re.search(
                      pattern,
                      lowered
                  ):
                      return {
                          "type": "verify",
                          "confidence": "high",
                          "reason": (
                              "Explicit verification "
                              "intent detected."
                          ),
                          "tool": "web"
                      }

              # ------------------------------------------------------
              # Generic research.
              # ------------------------------------------------------

              for pattern in RESEARCH_PATTERNS:
                  if re.search(
                      pattern,
                      lowered
                  ):
                      return {
                          "type": "research",
                          "confidence": "medium",
                          "reason": (
                              "Information-seeking "
                              "intent detected."
                          ),
                          "tool": "web"
                      }

              # ------------------------------------------------------
              # Source names are not sufficient evidence of research.
              # Do not turn arbitrary Colony tasks into web queries.
              # ------------------------------------------------------

              return {
                  "type": "unknown",
                  "confidence": "low",
                  "reason": (
                      "No supported work type "
                      "could be determined safely."
                  ),
                  "tool": "none"
              }


          # ==========================================================
          # KNOWLEDGE CONTEXT
          # ==========================================================

          def build_knowledge_context(
              knowledge
          ):
              context = []

              for category in (
                  "facts",
                  "experiences",
                  "hypotheses",
                  "results",
                  "learnings"
              ):
                  values = knowledge.get(
                      category,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      if isinstance(
                          item,
                          str
                      ):
                          text = item.strip()

                      elif isinstance(
                          item,
                          dict
                      ):
                          text = (
                              item.get(
                                  "text"
                              )
                              or item.get(
                                  "content"
                              )
                              or item.get(
                                  "summary"
                              )
                              or item.get(
                                  "claim"
                              )
                              or item.get(
                                  "learning"
                              )
                              or ""
                          )

                          text = clean_text(
                              text
                          )

                      else:
                          continue

                      if not text:
                          continue

                      context.append(
                          {
                              "type": category,
                              "text": text
                          }
                      )

                      if (
                          len(context)
                          >= MAX_KNOWLEDGE_CONTEXT
                      ):
                          return context

              return context


          # ==========================================================
          # WEB SEARCH
          # ==========================================================

          def normalize_search_result(
              result
          ):
              if not isinstance(
                  result,
                  dict
              ):
                  return None

              title = clean_text(
                  result.get(
                      "title"
                  )
              )

              url = (
                  result.get(
                      "href"
                  )
                  or result.get(
                      "url"
                  )
                  or ""
              )

              url = str(url).strip()

              snippet = clean_text(
                  result.get(
                      "body"
                  )
                  or result.get(
                      "snippet"
                  )
                  or ""
              )

              if not title or not url:
                  return None

              if not url.startswith(
                  (
                      "http://",
                      "https://"
                  )
              ):
                  return None

              try:
                  domain = urlparse(
                      url
                  ).netloc.lower()

                  if domain.startswith(
                      "www."
                  ):
                      domain = domain[4:]

              except Exception:
                  domain = ""

              return {
                  "title": title,
                  "url": url,
                  "snippet": snippet,
                  "domain": domain
              }


          def search_web(
              query,
              max_results
          ):
              print(
                  f"WEB QUERY: {query}"
              )

              try:
                  ddgs = DDGS(
                      timeout=WEB_TIMEOUT_SECONDS
                  )

                  raw_results = ddgs.text(
                      query=query,
                      region="us-en",
                      safesearch="moderate",
                      max_results=max_results,
                      page=1,
                      backend="auto"
                  )

              except Exception as exc:
                  print(
                      "WEB SEARCH FAILED: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )
                  return []

              if not isinstance(
                  raw_results,
                  list
              ):
                  print(
                      "WEB SEARCH INVALID: "
                      "expected result list"
                  )
                  return []

              print(
                  "WEB RAW RESULTS: "
                  f"{len(raw_results)}"
              )

              results = []
              seen_urls = set()

              for raw_result in raw_results:
                  result = (
                      normalize_search_result(
                          raw_result
                      )
                  )

                  if not result:
                      continue

                  url = result[
                      "url"
                  ]

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )
                  results.append(
                      result
                  )

                  if (
                      len(results)
                      >= max_results
                  ):
                      break

              print(
                  "WEB NORMALIZED RESULTS: "
                  f"{len(results)}"
              )

              for index, result in enumerate(
                  results,
                  start=1
              ):
                  print(
                      f"WEB SOURCE {index}: "
                      f"{result['domain']} | "
                      f"{result['title']}"
                  )

              return results


          # ==========================================================
          # EVIDENCE
          # ==========================================================

          def tokens(text):
              return set(
                  re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      str(text).lower()
                  )
              )


          def overlap_score(
              question,
              result
          ):
              question_tokens = tokens(
                  question
              )

              result_text = (
                  f"{result.get('title', '')} "
                  f"{result.get('snippet', '')}"
              )

              result_tokens = tokens(
                  result_text
              )

              if not question_tokens:
                  return 0.0

              return round(
                  len(
                      question_tokens
                      & result_tokens
                  )
                  / len(question_tokens),
                  3
              )


          def evidence_assessment(
              question,
              results
          ):
              domains = {
                  result.get(
                      "domain"
                  )
                  for result in results
                  if result.get(
                      "domain"
                  )
              }

              strong_matches = [
                  result
                  for result in results
                  if overlap_score(
                      question,
                      result
                  ) >= 0.20
              ]

              if (
                  len(domains) >= 3
                  and len(strong_matches) >= 2
              ):
                  status = (
                      "multi_source_support"
                  )

              elif (
                  len(domains) >= 2
                  and strong_matches
              ):
                  status = (
                      "partial_support"
                  )

              elif results:
                  status = (
                      "insufficient_verification"
                  )

              else:
                  status = "no_evidence"

              return {
                  "status": status,
                  "source_count": len(
                      results
                  ),
                  "domain_count": len(
                      domains
                  ),
                  "strong_match_count": len(
                      strong_matches
                  ),
                  "domains": sorted(
                      domains
                  )
              }


          # ==========================================================
          # COLONY ACTION
          #
          # Only explicitly supported, non-financial action is
          # executed here.
          #
          # No payment / bid / settlement operation is implemented.
          # ==========================================================

          def execute_colony_action(
              classification
          ):
              action = classification.get(
                  "action"
              )

              colony = classification.get(
                  "colony"
              )

              if action != "join_colony":
                  return {
                      "status": "action_not_supported",
                      "success": False,
                      "action": action
                  }

              if not colony:
                  return {
                      "status": "missing_colony",
                      "success": False,
                      "action": action
                  }

              if not COLONY_API_KEY:
                  return {
                      "status": (
                          "missing_colony_api_key"
                      ),
                      "success": False,
                      "action": action,
                      "colony": colony
                  }

              print(
                  f"COLONY ACTION: "
                  f"join_colony({colony})"
              )

              try:
                  client = ColonyClient(
                      COLONY_API_KEY
                  )

                  state = client.bootstrap()

                  print(
                      "COLONY BOOTSTRAP: "
                      "success"
                  )

                  member_colonies = (
                      state.get(
                          "member_colonies",
                          []
                      )
                      if isinstance(
                          state,
                          dict
                      )
                      else []
                  )

                  # --------------------------------------------------
                  # Do not call join if the server already reports
                  # the colony as an approved membership.
                  # --------------------------------------------------

                  existing_names = set()

                  if isinstance(
                      member_colonies,
                      list
                  ):
                      for item in (
                          member_colonies
                      ):
                          if isinstance(
                              item,
                              str
                          ):
                              existing_names.add(
                                  item.lower()
                              )

                          elif isinstance(
                              item,
                              dict
                          ):
                              for key in (
                                  "name",
                                  "slug",
                                  "colony",
                                  "id"
                              ):
                                  value = item.get(
                                      key
                                  )

                                  if value:
                                      existing_names.add(
                                          str(
                                              value
                                          ).lower()
                                      )

                  if (
                      colony.lower()
                      in existing_names
                  ):
                      print(
                          "COLONY ACTION: "
                          "already a member"
                      )

                      return {
                          "status": (
                              "already_member"
                          ),
                          "success": True,
                          "action": action,
                          "colony": colony
                      }

                  result = client.join_colony(
                      colony
                  )

                  print(
                      "COLONY ACTION: "
                      "join request sent"
                  )

                  return {
                      "status": (
                          "join_requested"
                      ),
                      "success": True,
                      "action": action,
                      "colony": colony,
                      "response": result
                  }

              except ColonyRateLimitError as exc:
                  return {
                      "status": "rate_limited",
                      "success": False,
                      "action": action,
                      "colony": colony,
                      "retry_after": getattr(
                          exc,
                          "retry_after",
                          None
                      )
                  }

              except ColonyNetworkError as exc:
                  return {
                      "status": "network_error",
                      "success": False,
                      "action": action,
                      "colony": colony,
                      "error": str(exc)
                  }

              except ColonyAPIError as exc:
                  return {
                      "status": "colony_api_error",
                      "success": False,
                      "action": action,
                      "colony": colony,
                      "status_code": getattr(
                          exc,
                          "status",
                          None
                      ),
                      "code": getattr(
                          exc,
                          "code",
                          None
                      ),
                      "error": str(exc)
                  }

              except Exception as exc:
                  return {
                      "status": "unexpected_error",
                      "success": False,
                      "action": action,
                      "colony": colony,
                      "error": (
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )
                  }


          # ==========================================================
          # LOAD STATE
          # ==========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          work_state = load_json(
              WORK_FILE,
              {}
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = {}

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}

          if not isinstance(
              work_state,
              dict
          ):
              work_state = {}

          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures"
          ):
              ensure_list(
                  core_memory,
                  key
              )

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              ensure_list(
                  knowledge,
                  key
              )

          completed = ensure_list(
              work_state,
              "completed"
          )

          history = ensure_list(
              work_state,
              "history"
          )

          # ==========================================================
          # DISCOVER AND SELECT WORK
          # ==========================================================

          candidates = collect_candidates(
              core_memory,
              core_runtime
          )

          completed_ids = {
              str(
                  item.get(
                      "request_id"
                  )
              )
              for item in completed
              if (
                  isinstance(
                      item,
                      dict
                  )
                  and item.get(
                      "request_id"
                  )
              )
          }

          pending = [
              candidate
              for candidate in candidates
              if candidate[
                  "request_id"
              ] not in completed_ids
          ]

          pending.sort(
              key=lambda item: (
                  -item.get(
                      "priority",
                      0
                  ),
                  item.get(
                      "request_id",
                      ""
                  )
              )
          )

          selected = pending[
              :MAX_WORK_ITEMS_PER_RUN
          ]

          knowledge_context = (
              build_knowledge_context(
                  knowledge
              )
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )

          completed_now = 0
          retry_now = 0
          unknown_now = 0

          # ==========================================================
          # EXECUTION LOOP
          # ==========================================================

          for work in selected:
              request_id = work[
                  "request_id"
              ]

              question = work[
                  "question"
              ]

              print("")
              print(
                  f"WORK START: {question}"
              )

              classification = classify_work(
                  question,
                  work.get(
                      "original"
                  ),
                  work.get(
                      "source"
                  )
              )

              work_type = classification[
                  "type"
              ]

              print(
                  "WORK CLASSIFICATION: "
                  f"{work_type} | "
                  f"confidence="
                  f"{classification['confidence']} | "
                  f"tool="
                  f"{classification['tool']}"
              )

              result = None
              terminal = False

              # ------------------------------------------------------
              # UNKNOWN
              # ------------------------------------------------------

              if work_type == "unknown":
                  unknown_now += 1

                  result = {
                      "status": "unknown",
                      "success": False,
                      "reason": (
                          classification[
                              "reason"
                          ]
                      )
                  }

                  print(
                      "WORK DEFERRED: "
                      "unknown work type"
                  )

              # ------------------------------------------------------
              # RESEARCH / VERIFY
              # ------------------------------------------------------

              elif work_type in {
                  "research",
                  "verify"
              }:
                  results = search_web(
                      question,
                      MAX_WEB_RESULTS_PER_QUERY
                  )

                  if (
                      len(results)
                      > MAX_TOTAL_WEB_RESULTS
                  ):
                      results = results[
                          :MAX_TOTAL_WEB_RESULTS
                      ]

                  evidence = (
                      evidence_assessment(
                          question,
                          results
                      )
                  )

                  status = evidence[
                      "status"
                  ]

                  if (
                      status
                      == "multi_source_support"
                  ):
                      conclusion = (
                          "The available search "
                          "evidence supports the "
                          "question across multiple "
                          "independent domains."
                      )

                      next_step = (
                          "Review the underlying "
                          "sources before promoting "
                          "the finding to confirmed "
                          "knowledge."
                      )

                  elif (
                      status
                      == "partial_support"
                  ):
                      conclusion = (
                          "Relevant evidence was "
                          "found, but independent "
                          "source coverage remains "
                          "limited."
                      )

                      next_step = (
                          "Keep the work open and "
                          "seek additional evidence."
                      )

                  elif (
                      status
                      == "insufficient_verification"
                  ):
                      conclusion = (
                          "Search results were found, "
                          "but the available evidence "
                          "is insufficient for reliable "
                          "verification."
                      )

                      next_step = (
                          "Keep the work open; do not "
                          "promote the result to a "
                          "confirmed fact."
                      )

                  else:
                      conclusion = (
                          "No usable search evidence "
                          "was retrieved."
                      )

                      next_step = (
                          "Retry later or refine the "
                          "research question."
                      )

                  result = {
                      "status": status,
                      "success": (
                          status
                          in {
                              "multi_source_support",
                              "partial_support"
                          }
                      ),
                      "evidence": evidence,
                      "sources": results,
                      "conclusion": conclusion,
                      "next_step": next_step
                  }

                  if status in {
                      "multi_source_support",
                      "partial_support"
                  }:
                      terminal = True
                  else:
                      retry_now += 1

              # ------------------------------------------------------
              # ACTION
              # ------------------------------------------------------

              elif work_type == "action":
                  result = execute_colony_action(
                      classification
                  )

                  if result.get(
                      "success"
                  ):
                      terminal = True
                      completed_now += 1
                  else:
                      retry_now += 1

              # ------------------------------------------------------
              # Persist the observed work result.
              # ------------------------------------------------------

              result_id = stable_id(
                  "result",
                  (
                      request_id
                      + "|"
                      + now_iso()
                  )
              )

              work_result = {
                  "result_id": result_id,
                  "request_id": request_id,
                  "timestamp": now_iso(),
                  "question": question,
                  "source": work.get(
                      "source"
                  ),
                  "priority": work.get(
                      "priority",
                      0
                  ),
                  "classification": classification,
                  "result": result,
                  "knowledge_context_used": (
                      knowledge_context
                  )
              }

              history.append(
                  work_result
              )

              # ------------------------------------------------------
              # Only terminally successful work becomes completed.
              # Unknown and failed work remains retryable.
              # ------------------------------------------------------

              if terminal:
                  completed.append(
                      {
                          "request_id": request_id,
                          "timestamp": now_iso(),
                          "status": (
                              result.get(
                                  "status",
                                  "completed"
                              )
                              if isinstance(
                                  result,
                                  dict
                              )
                              else "completed"
                          ),
                          "result_id": result_id,
                          "work_type": work_type
                      }
                  )

                  if work_type in {
                      "research",
                      "verify"
                  }:
                      completed_now += 1

              elif work_type == "unknown":
                  pass

              print(
                  "WORK RESULT: "
                  f"type={work_type} | "
                  f"status="
                  f"{result.get('status') if isinstance(result, dict) else 'none'}"
              )

          # ==========================================================
          # LIMIT HISTORY
          # ==========================================================

          if len(history) > MAX_HISTORY_ITEMS:
              history[:] = history[
                  -MAX_HISTORY_ITEMS:
              ]

          if len(completed) > MAX_HISTORY_ITEMS:
              completed[:] = completed[
                  -MAX_HISTORY_ITEMS:
              ]

          work_state[
              "version"
          ] = 5

          work_state[
              "last_run"
          ] = now_iso()

          work_state[
              "run_count"
          ] = int(
              work_state.get(
                  "run_count",
                  0
              )
          ) + 1

          work_state[
              "last_summary"
          ] = {
              "timestamp": now_iso(),
              "candidates": len(
                  candidates
              ),
              "selected": len(
                  selected
              ),
              "completed": completed_now,
              "retry_pending": retry_now,
              "unknown_deferred": unknown_now,
              "history_size": len(
                  history
              )
          }

          # ----------------------------------------------------------
          # The factory owns only its own state.
          # Memory & Knowledge remains the consolidation layer.
          # ----------------------------------------------------------

          save_json(
              WORK_FILE,
              work_state
          )

          # ==========================================================
          # SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX WORK FACTORY ==="
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )

          print(
              f"Work completed: "
              f"{completed_now}"
          )

          print(
              f"Work retry pending: "
              f"{retry_now}"
          )

          print(
              f"Work unknown/deferred: "
              f"{unknown_now}"
          )

          print(
              f"History size: "
              f"{len(history)}"
          )

          print("")
          print(
              "=== CLASSIFY -> "
              "CHOOSE TOOL -> "
              "EXECUTE -> "
              "OBSERVE -> RESULT ==="
          )

          print(
              "=== NØX WORK FACTORY TERMINÉ ==="
          )
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: evolve work factory classification"
          git push
