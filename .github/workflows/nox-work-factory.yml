name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "12"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX Work Factory
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])

          MAX_WORK_ITEMS_PER_RUN = int(os.environ["MAX_WORK_ITEMS_PER_RUN"])
          MAX_WEB_RESULTS_PER_QUERY = int(os.environ["MAX_WEB_RESULTS_PER_QUERY"])
          MAX_TOTAL_WEB_RESULTS = int(os.environ["MAX_TOTAL_WEB_RESULTS"])
          MAX_KNOWLEDGE_CONTEXT = int(os.environ["MAX_KNOWLEDGE_CONTEXT"])
          WEB_TIMEOUT_SECONDS = int(os.environ["WEB_TIMEOUT_SECONDS"])
          MAX_HISTORY_ITEMS = int(os.environ["MAX_HISTORY_ITEMS"])


          def now_iso():
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as handle:
                      data = json.load(handle)
                  return data
              except Exception as exc:
                  print(f"LOAD FAILED: {path} | {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              temp_path = path.with_suffix(path.suffix + ".tmp")

              with temp_path.open("w", encoding="utf-8") as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                  )
                  handle.write("\n")

              temp_path.replace(path)


          def ensure_list(container, key):
              value = container.get(key)

              if not isinstance(value, list):
                  container[key] = []

              return container[key]


          def clean_text(value):
              if value is None:
                  return ""

              value = html.unescape(str(value))
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def stable_id(prefix, value):
              import hashlib

              normalized = re.sub(r"\s+", " ", str(value).strip().lower())

              digest = hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:16]

              return f"{prefix}-{digest}"


          def normalize_work_item(item, source):
              if isinstance(item, str):
                  question = item.strip()

                  if not question:
                      return None

                  return {
                      "request_id": stable_id("work", question),
                      "question": question,
                      "priority": 0,
                      "source": source,
                  }

              if not isinstance(item, dict):
                  return None

              question = ""

              for key in (
                  "question",
                  "research_question",
                  "query",
                  "problem",
                  "objective",
                  "task",
                  "title",
                  "description",
              ):
                  value = item.get(key)

                  if isinstance(value, str) and value.strip():
                      question = value.strip()
                      break

              if not question:
                  return None

              request_id = (
                  item.get("request_id")
                  or item.get("id")
                  or stable_id("work", question)
              )

              try:
                  priority = int(item.get("priority", 0))
              except Exception:
                  priority = 0

              return {
                  "request_id": str(request_id),
                  "question": question,
                  "priority": priority,
                  "source": source,
                  "original": item,
              }


          def collect_candidates(core_memory, core_runtime):
              candidates = []

              for key in (
                  "work_requests",
                  "research_requests",
                  "web_queries",
              ):
                  values = core_runtime.get(key, [])

                  if not isinstance(values, list):
                      continue

                  for item in values:
                      normalized = normalize_work_item(item, key)

                      if normalized:
                          candidates.append(normalized)

              cognitive_cases = core_memory.get("cognitive_cases", [])

              if isinstance(cognitive_cases, list):
                  for case in cognitive_cases:
                      if not isinstance(case, dict):
                          continue

                      status = str(case.get("status", "")).lower()

                      if status in {
                          "closed",
                          "completed",
                          "resolved",
                          "discarded",
                      }:
                          continue

                      normalized = normalize_work_item(
                          case,
                          "cognitive_case",
                      )

                      if normalized:
                          candidates.append(normalized)

              deduped = {}
              for candidate in candidates:
                  request_id = candidate["request_id"]

                  if request_id not in deduped:
                      deduped[request_id] = candidate
                      continue

                  existing = deduped[request_id]

                  if candidate["priority"] > existing["priority"]:
                      deduped[request_id] = candidate

              return list(deduped.values())


          def build_knowledge_context(knowledge):
              context = []

              for category in (
                  "facts",
                  "experiences",
                  "hypotheses",
                  "results",
                  "learnings",
              ):
                  values = knowledge.get(category, [])

                  if not isinstance(values, list):
                      continue

                  for item in values:
                      if isinstance(item, str):
                          text = item.strip()

                      elif isinstance(item, dict):
                          text = (
                              item.get("text")
                              or item.get("content")
                              or item.get("summary")
                              or item.get("claim")
                              or item.get("learning")
                              or ""
                          )

                          if not isinstance(text, str):
                              text = str(text)

                          text = text.strip()

                      else:
                          continue

                      if not text:
                          continue

                      context.append(
                          {
                              "type": category,
                              "text": text,
                          }
                      )

                      if len(context) >= MAX_KNOWLEDGE_CONTEXT:
                          return context

              return context


          def unwrap_duckduckgo_url(raw_url):
              raw_url = html.unescape(raw_url or "").strip()

              if not raw_url:
                  return ""

              if raw_url.startswith("//"):
                  raw_url = "https:" + raw_url

              try:
                  parsed = urllib.parse.urlparse(raw_url)

                  if (
                      parsed.netloc.lower() == "duckduckgo.com"
                      and parsed.path.startswith("/l/")
                  ):
                      target = urllib.parse.parse_qs(
                          parsed.query
                      ).get("uddg", [None])[0]

                      if target:
                          raw_url = urllib.parse.unquote(target)

              except Exception:
                  pass

              return raw_url.strip()


          def search_duckduckgo(query, max_results):
              search_url = (
                  "https://html.duckduckgo.com/html/?"
                  + urllib.parse.urlencode({"q": query})
              )

              request = urllib.request.Request(
                  search_url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; NOX-Work-Factory/1.0)"
                      ),
                      "Accept": "text/html,application/xhtml+xml",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT_SECONDS,
                  ) as response:
                      html_body = response.read().decode(
                          "utf-8",
                          errors="ignore",
                      )

              except Exception as exc:
                  print(f"WEB SEARCH FAILED: {exc}")
                  return []

              results = []
              seen_urls = set()

              link_pattern = re.compile(
                  r'<a\b'
                  r'(?=[^>]*\bclass=["\'][^"\']*\bresult__a\b[^"\']*["\'])'
                  r'[^>]*\bhref=["\']([^"\']+)["\']'
                  r'[^>]*>'
                  r'(.*?)'
                  r'</a>',
                  flags=re.IGNORECASE | re.DOTALL,
              )

              snippet_pattern = re.compile(
                  r'<(?:a|div)\b'
                  r'(?=[^>]*\bclass=["\'][^"\']*\bresult__snippet\b[^"\']*["\'])'
                  r'[^>]*>'
                  r'(.*?)'
                  r'</(?:a|div)>',
                  flags=re.IGNORECASE | re.DOTALL,
              )

              snippets = [
                  clean_text(match.group(1))
                  for match in snippet_pattern.finditer(html_body)
              ]

              for index, match in enumerate(
                  link_pattern.finditer(html_body)
              ):
                  raw_url = match.group(1)
                  raw_title = match.group(2)

                  url = unwrap_duckduckgo_url(raw_url)

                  if not url.startswith(("http://", "https://")):
                      continue

                  if url in seen_urls:
                      continue

                  title = clean_text(raw_title)

                  if not title:
                      continue

                  snippet = (
                      snippets[index]
                      if index < len(snippets)
                      else ""
                  )

                  try:
                      domain = urllib.parse.urlparse(url).netloc.lower()

                      if domain.startswith("www."):
                          domain = domain[4:]

                  except Exception:
                      domain = ""

                  results.append(
                      {
                          "title": title,
                          "url": url,
                          "snippet": snippet,
                          "domain": domain,
                      }
                  )

                  seen_urls.add(url)

                  if len(results) >= max_results:
                      break

              return results


          def tokens(text):
              return set(
                  re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      str(text).lower(),
                  )
              )


          def overlap_score(question, result):
              question_tokens = tokens(question)

              result_text = (
                  f"{result.get('title', '')} "
                  f"{result.get('snippet', '')}"
              )

              result_tokens = tokens(result_text)

              if not question_tokens:
                  return 0.0

              return len(
                  question_tokens.intersection(result_tokens)
              ) / len(question_tokens)


          def evidence_assessment(question, results):
              domains = {
                  result.get("domain")
                  for result in results
                  if result.get("domain")
              }

              strong_matches = [
                  result
                  for result in results
                  if overlap_score(question, result) >= 0.20
              ]

              if len(domains) >= 3 and len(strong_matches) >= 2:
                  status = "multi_source_support"

              elif len(domains) >= 2 and strong_matches:
                  status = "partial_support"

              elif results:
                  status = "insufficient_verification"

              else:
                  status = "no_evidence"

              return {
                  "status": status,
                  "source_count": len(results),
                  "domain_count": len(domains),
                  "strong_match_count": len(strong_matches),
                  "domains": sorted(domains),
              }


          core_memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )

          work_state = load_json(
              WORK_FILE,
              {},
          )

          if not isinstance(core_memory, dict):
              core_memory = {}

          if not isinstance(core_runtime, dict):
              core_runtime = {}

          if not isinstance(knowledge, dict):
              knowledge = {}

          if not isinstance(work_state, dict):
              work_state = {}

          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures",
          ):
              ensure_list(core_memory, key)

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources",
          ):
              ensure_list(knowledge, key)

          completed = ensure_list(
              work_state,
              "completed",
          )

          history = ensure_list(
              work_state,
              "history",
          )

          candidates = collect_candidates(
              core_memory,
              core_runtime,
          )

          completed_ids = {
              str(item.get("request_id"))
              for item in completed
              if isinstance(item, dict)
              and item.get("request_id")
          }

          pending = [
              candidate
              for candidate in candidates
              if candidate["request_id"] not in completed_ids
          ]

          pending.sort(
              key=lambda item: (
                  -item.get("priority", 0),
                  item.get("request_id", ""),
              )
          )

          selected = pending[:MAX_WORK_ITEMS_PER_RUN]

          knowledge_context = build_knowledge_context(
              knowledge
          )

          print(f"Work candidates: {len(candidates)}")
          print(f"Work selected: {len(selected)}")

          completed_now = 0
          retry_now = 0

          for work in selected:
              request_id = work["request_id"]
              question = work["question"]

              print("")
              print(f"WORK START: {question}")

              queries = [question]

              results = []

              for query in queries:
                  remaining = (
                      MAX_TOTAL_WEB_RESULTS
                      - len(results)
                  )

                  if remaining <= 0:
                      break

                  query_results = search_duckduckgo(
                      query,
                      min(
                          MAX_WEB_RESULTS_PER_QUERY,
                          remaining,
                      ),
                  )

                  existing_urls = {
                      item.get("url")
                      for item in results
                  }

                  for result in query_results:
                      if result.get("url") in existing_urls:
                          continue

                      results.append(result)
                      existing_urls.add(result.get("url"))

                      if len(results) >= MAX_TOTAL_WEB_RESULTS:
                          break

              evidence = evidence_assessment(
                  question,
                  results,
              )

              status = evidence["status"]

              if status == "multi_source_support":
                  conclusion = (
                      "The available search evidence supports "
                      "the research question across multiple "
                      "independent domains."
                  )

                  next_step = (
                      "Consolidate the supported finding into "
                      "Memory & Knowledge after source review."
                  )

              elif status == "partial_support":
                  conclusion = (
                      "The search found relevant evidence, but "
                      "the result is not fully verified across "
                      "independent sources."
                  )

                  next_step = (
                      "Keep the work open and seek additional "
                      "independent evidence before treating the "
                      "finding as confirmed."
                  )

              elif status == "insufficient_verification":
                  conclusion = (
                      "Search results were found, but the "
                      "available evidence is insufficient for "
                      "reliable verification."
                  )

                  next_step = (
                      "Retry with broader or more specific "
                      "research before considering the work "
                      "resolved."
                  )

              else:
                  conclusion = (
                      "No usable search evidence was retrieved "
                      "for this work item."
                  )

                  next_step = (
                      "Retry the research later; the absence of "
                      "evidence is not treated as a completed "
                      "result."
                  )

              result_id = stable_id(
                  "result",
                  f"{request_id}:{now_iso()}",
              )

              work_result = {
                  "result_id": result_id,
                  "request_id": request_id,
                  "timestamp": now_iso(),
                  "question": question,
                  "source": work.get("source"),
                  "priority": work.get("priority", 0),
                  "evidence": evidence,
                  "sources": results,
                  "knowledge_context_used": knowledge_context,
                  "conclusion": conclusion,
                  "next_step": next_step,
                  "status": status,
              }

              history.append(work_result)

              if status in {
                  "multi_source_support",
                  "partial_support",
              }:
                  completed.append(
                      {
                          "request_id": request_id,
                          "timestamp": now_iso(),
                          "status": "completed",
                          "result_id": result_id,
                      }
                  )

                  completed_now += 1

              else:
                  retry_now += 1

              print(
                  "WORK RESULT: "
                  f"{status} | "
                  f"sources={evidence['source_count']} | "
                  f"domains={evidence['domain_count']}"
              )

          if len(history) > MAX_HISTORY_ITEMS:
              history[:] = history[-MAX_HISTORY_ITEMS:]

          if len(completed) > MAX_HISTORY_ITEMS:
              completed[:] = completed[-MAX_HISTORY_ITEMS:]

          work_state["version"] = 2
          work_state["last_run"] = now_iso()
          work_state["run_count"] = int(
              work_state.get("run_count", 0)
          ) + 1

          work_state["last_summary"] = {
              "candidates": len(candidates),
              "selected": len(selected),
              "completed": completed_now,
              "retry_pending": retry_now,
              "history_size": len(history),
          }

          save_json(
              WORK_FILE,
              work_state,
          )

          print("")
          print("=== NØX WORK FACTORY ===")
          print(f"Work candidates: {len(candidates)}")
          print(f"Work selected: {len(selected)}")
          print(f"Work completed: {completed_now}")
          print(f"Work retry pending: {retry_now}")
          print(f"History size: {len(history)}")
          print("")
          print("=== QUESTION -> RESEARCH -> EVIDENCE -> RESULT ===")
          print("=== NØX WORK FACTORY TERMINÉ ===")
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update work factory"
          git push
