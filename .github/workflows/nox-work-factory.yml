name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json
  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_RESULTS: "15"
  MAX_HISTORY: "150"
  MAX_ATTEMPTS_PER_REQUEST: "3"
  WEB_TIMEOUT_SECONDS: "20"
  MAX_FETCH_PAGES: "3"
  FETCH_TIMEOUT_SECONDS: "15"
  MAX_PAGE_BYTES: "300000"
  EXCERPT_CHARS: "700"
  PROJECT_COST_EUR: "0"
  FREE_AI_ONLY: "true"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  NOX_AI_MAX_CALLS_PER_RUN: "5"
  NOX_AI_MAX_TOKENS_PER_RUN: "12000"
  NOX_AI_MAX_GUARD_CALLS_PER_RUN: "30"

jobs:
  work-factory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9.16.0,<10.0.0" requests

      - name: Run Work Factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from html import unescape
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from ddgs import DDGS

          sys.path.insert(0, "scripts")
          import nox_ai

          # Garde-fou : si scripts/nox_ai.py est absent, tronqué ou incomplet, l'IA est désactivée et les
          # gabarits prennent le relais. Une panne de l'assistant IA ne doit JAMAIS bloquer la publication.
          if not all(callable(getattr(nox_ai, _n, None)) for _n in ("available", "ask_ai", "usage")) or not hasattr(nox_ai, "MODELS"):
              print("WARNING: scripts/nox_ai.py is incomplete or invalid -> AI disabled, templates used.")
              class nox_ai:
                  MODELS = []
                  @staticmethod
                  def available(): return False
                  @staticmethod
                  def ask_ai(*args, **kwargs): return None
                  @staticmethod
                  def usage(): return {"calls": 0, "guard_calls": 0, "tokens": 0, "last_model": None, "last_error": "module_incomplete"}

          NOW = datetime.now(timezone.utc).isoformat()
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          MAX_ITEMS = int(os.environ["MAX_WORK_ITEMS_PER_RUN"])
          MAX_RESULTS = int(os.environ["MAX_RESULTS_PER_QUERY"])
          MAX_TOTAL = int(os.environ["MAX_TOTAL_RESULTS"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_ATTEMPTS = max(1, int(os.environ["MAX_ATTEMPTS_PER_REQUEST"]))
          TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])
          MAX_FETCH_PAGES = int(os.environ.get("MAX_FETCH_PAGES", "3"))
          FETCH_TIMEOUT = int(os.environ.get("FETCH_TIMEOUT_SECONDS", "15"))
          MAX_PAGE_BYTES = int(os.environ.get("MAX_PAGE_BYTES", "300000"))
          EXCERPT_CHARS = int(os.environ.get("EXCERPT_CHARS", "700"))

          for key, expected in {"PROJECT_COST_EUR":"0","FREE_AI_ONLY":"true","AUTO_PAYMENT":"false","AUTO_SPENDING":"false"}.items():
              if os.environ.get(key, expected).strip().lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")

          def load(path, default):
              if not path.exists(): return json.loads(json.dumps(default))
              try:
                  value=json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"STATE SAFETY STOP: invalid JSON in {path}: {exc}")
              if not isinstance(value,dict):
                  raise SystemExit(f"STATE SAFETY STOP: {path} root must be a JSON object; refusing to overwrite it")
              return value

          def save(path,value):
              path.parent.mkdir(parents=True,exist_ok=True)
              tmp=path.with_suffix(path.suffix+".tmp")
              payload=json.dumps(value,ensure_ascii=False,indent=2)+"\n"
              json.loads(payload)
              tmp.write_text(payload,encoding="utf-8")
              os.replace(tmp,path)

          def clean(v,n=3000): return re.sub(r"\s+"," ",str(v or "")).strip()[:n]
          def terms(v):
              stop={"this","that","with","from","have","what","when","where","which","would","could","about","your","their","there","then","than","pour","avec","dans","nous","vous","cela","cette","comme","mais","plus","faire","être","sont"}
              out=[]
              for w in re.findall(r"[a-zA-ZÀ-ÿ0-9_-]{4,}",clean(v,5000).lower()):
                  if w not in stop and w not in out: out.append(w)
              return out[:30]
          def stable(*parts): return hashlib.sha256("|".join(clean(x,5000) for x in parts).encode()).hexdigest()[:24]

          runtime=load(CORE_RUNTIME_FILE,{"work_requests":[]})
          memory=load(CORE_MEMORY_FILE,{})
          knowledge=load(KNOWLEDGE_FILE,{})
          state=load(WORK_FILE,{"version":4,"history":[],"completed":[],"attempts":{}})
          state.setdefault("history",[]); state.setdefault("completed",[]); state.setdefault("attempts",{}); state.setdefault("manual_review",[])
          if not isinstance(state["history"],list): state["history"]=[]
          if not isinstance(state["completed"],list): state["completed"]=[]
          if not isinstance(state["attempts"],dict): state["attempts"]={}
          if not isinstance(state["manual_review"],list): state["manual_review"]=[]

          completed={x.get("request_id") for x in state["completed"] if isinstance(x,dict)}
          reviewed={x.get("request_id") for x in state["manual_review"] if isinstance(x,dict)}
          requests_to_run=[]
          for item in runtime.get("work_requests",[]):
              if not isinstance(item,dict): continue
              if item.get("status") not in (None,"pending","retry"):
                  continue
              if not item.get("id") or item.get("id") in completed or item.get("id") in reviewed:
                  continue
              rid = item.get("id")
              attempts = int(state["attempts"].get(rid, 0) or 0)
              if attempts >= MAX_ATTEMPTS:
                  review_record={"request_id":rid,"case_id":item.get("case_id"),"timestamp":NOW,"status":"manual_review","attempts":attempts,"reason":"retry_limit_reached_without_sufficient_evidence"}
                  state["manual_review"].append(review_record)
                  reviewed.add(rid)
                  state["history"].append({**review_record,"id":f"review-{stable(rid, attempts)}"})
                  continue
              if item.get("work_type") != "research":
                  state["history"].append({"id":stable("deferred",item.get("id")),"request_id":item.get("id"),"timestamp":NOW,"status":"deferred","reason":"unsupported_work_type"})
                  continue
              requests_to_run.append(item)
              if len(requests_to_run)>=MAX_ITEMS: break

          # --- relevance guards -------------------------------------------------
          # Words from the research template itself must never count as topic matches:
          # they made unrelated "evidence supports claim" pages look relevant.
          GENERIC_TERMS = {"evidence","supports","support","supported","contradicts","contradict","claim","claims","competing","proof","verify","verified",
                           "research","result","results","data","study","studies","what","does","answer","question","about","between","using","used","uses","into","over","under"}
          DENY_DOMAINS = ("fiveable.me","quizlet.com","coursehero.com","brainly.com","chegg.com","studocu.com")
          SENSITIVE_SOURCE_TERMS = ("jewish famil","zionist","great replacement","white genocide","illuminati","new world order","holocaust denial","qanon","q-anon")
          NON_ANSWER_MARKERS = ("do not contain", "does not contain", "no information", "not address", "unrelated", "remains unresolved", "remain unresolved", "cannot be determined", "no relevant", "do not provide", "does not provide", "irrelevant", "not enough information", "insufficient evidence", "you provided")
          PREFIX_RE = re.compile(r"^\s*(what evidence supports or contradicts(?: claims that)?|what are the competing claims in)\s*:?\s*", re.I)

          def topic_of(question):
              """The real subject of a question, without the research-template wording."""
              topic = PREFIX_RE.sub("", clean(question, 1200)).strip(" :?")
              topic = re.sub(r"^(new post in a tag you follow|new post from [^:]{0,60}|new comment on [^:]{0,60})\s*:\s*", "", topic, flags=re.I)
              topic = re.sub(r"\s+by\s+[\w .-]{2,40}$", "", topic).strip(" :?\"'")
              return topic or clean(question, 1200)

          def topic_terms(question):
              return [t for t in terms(topic_of(question)) if t not in GENERIC_TERMS]

          def search(query):
              try:
                  raw=DDGS(timeout=TIMEOUT).text(query,max_results=MAX_RESULTS,backend="auto")
              except Exception as exc:
                  return [],clean(exc,500)
              results=[]
              for item in raw or []:
                  if not isinstance(item,dict): continue
                  url=clean(item.get("href") or item.get("url"),1000)
                  if not url: continue
                  domain=urlparse(url).netloc.lower().split(":")[0]
                  if any(domain==d or domain.endswith("."+d) for d in DENY_DOMAINS): continue
                  blob=(clean(item.get("title"),300)+" "+clean(item.get("body") or item.get("snippet"),1200)).lower()
                  if any(t in blob and t not in query.lower() for t in SENSITIVE_SOURCE_TERMS): continue
                  results.append({"title":clean(item.get("title"),300),"url":url,"domain":domain,"snippet":clean(item.get("body") or item.get("snippet"),1200)})
              return results,None

          def assess(question,results):
              q=set(topic_terms(question))
              need=2 if len(q)>=3 else 1
              scored=[]
              for r in results:
                  text=set(terms((r.get("title","")+" "+r.get("snippet",""))))
                  shared=q & text
                  overlap=len(shared)/max(1,len(q))
                  relevant=overlap>=0.18 and len(shared)>=need
                  scored.append({**r,"query_overlap":round(overlap,3),"shared_terms":sorted(shared)[:8],"relevant":relevant})
              strong=[r for r in scored if r["relevant"]]
              domains={r.get("domain") for r in strong if r.get("domain")}
              if len(domains)>=3 and len(strong)>=2: status="multi_source_support"
              elif len(domains)>=2 and len(strong)>=1: status="partial_support"
              elif scored: status="insufficient_verification"
              else: status="no_evidence"
              return status,scored,len(domains)

          # --- lecture des pages (texte non fiable) ------------------------------
          FETCH_HEADERS={"User-Agent":"Mozilla/5.0 (compatible; NOX-Research/1.0)","Accept":"text/html,application/xhtml+xml"}
          IP_LITERAL=re.compile(r"^\d{1,3}(\.\d{1,3}){3}$|^\[?[0-9a-f:]+\]?$", re.I)

          def host_allowed(url):
              parsed=urlparse(url)
              host=parsed.netloc.lower().split(":")[0]
              return parsed.scheme=="https" and bool(host) and host!="localhost" and not IP_LITERAL.match(host)

          def fetch_excerpt(url):
              """Extrait court (résumé ou premiers paragraphes) d'une page. Chaîne vide en cas d'échec.
              Le contenu est traité comme non fiable : il ne va jamais ailleurs que dans le canal filtré."""
              if not host_allowed(url):
                  return ""
              parsed=urlparse(url)
              target=url
              if parsed.netloc.lower().endswith("arxiv.org"):
                  m=re.match(r"^/pdf/(\d{4}\.\d{4,5})(v\d+)?(\.pdf)?$", parsed.path)
                  if m: target=f"https://arxiv.org/abs/{m.group(1)}"
              try:
                  response=requests.get(target,headers=FETCH_HEADERS,timeout=FETCH_TIMEOUT,stream=True)
                  if not host_allowed(response.url):
                      return ""
                  ctype=response.headers.get("content-type","").lower()
                  if response.status_code!=200 or "html" not in ctype:
                      return ""
                  raw=b""
                  for chunk in response.iter_content(8192):
                      raw+=chunk
                      if len(raw)>=MAX_PAGE_BYTES: break
                  page=raw.decode(response.encoding or "utf-8",errors="replace")
              except Exception:
                  return ""
              for name in ("citation_abstract","og:description","description","twitter:description"):
                  found=re.search(r'<meta[^>]+(?:name|property)=["\']'+re.escape(name)+r'["\'][^>]*content=["\']([^"\']{150,})["\']',page,re.I)
                  if found:
                      return clean(unescape(found.group(1)),EXCERPT_CHARS)
              body=re.sub(r"(?is)<(script|style|nav|header|footer|aside)[^>]*>.*?</\1>"," ",page)
              paragraphs=[clean(unescape(re.sub(r"<[^>]+>"," ",p)),800) for p in re.findall(r"(?is)<p[^>]*>(.*?)</p>",body)]
              paragraphs=[p for p in paragraphs if len(p)>=120]
              return clean(" ".join(paragraphs[:4]),EXCERPT_CHARS)

          # Mots que Core refuse dans une conclusion publiable (phrase sur la recherche elle-même).
          META_MARKERS = ("search coverage","source coverage","coverage found","found relevant results","relevant results across","evidence coverage","search results found")

          def ai_conclusion(question, status, scored, limits, excerpts):
              """Conclusion rédigée par l'IA à partir des extraits. None si indisponible ou invalide."""
              if status not in ("multi_source_support","partial_support"):
                  return None
              ranked=sorted([r for r in scored if r.get("relevant")],key=lambda r:r.get("query_overlap",0),reverse=True)[:4]
              if len(ranked)<2: return "INSUFFICIENT"
              blocks=[]
              for i,r in enumerate(ranked):
                  block=f"[{i+1}] {clean(r.get('title'),160)} ({r.get('domain')}): {clean(r.get('snippet'),300)}"
                  page=excerpts.get(r.get("url"))
                  if page:
                      block+=f"\n    Page excerpt: {clean(page,EXCERPT_CHARS)}"
                  blocks.append(block)
              untrusted=f"Question: {clean(question,500)}\n\nSource excerpts:\n"+"\n".join(blocks)
              if limits:
                  untrusted+="\n\nExcerpts about limitations or criticism:\n"+"\n".join(
                      f"- {clean(r.get('title'),140)} ({r.get('domain')}): {clean(r.get('snippet'),300)}" for r in limits[:2])
              text=nox_ai.ask_ai(
                  system=("You are NØX's research summarizer. Using ONLY the excerpts provided, write a careful, "
                          "bounded conclusion of 3 to 5 sentences (between 260 and 750 characters) that answers the question. "
                          "Say what the sources support, quote one concrete figure, named method or benchmark if the excerpts contain one, "
                          "and state at least one explicit limitation or open point (use the limitations excerpts if present). Never claim certainty. "
                          "If the excerpts do not actually address the question, reply with exactly the single word INSUFFICIENT. "
                          "Write as NØX's own finding: never say 'the sources you provided', 'the provided excerpts' or 'the excerpts'; say 'the sources reviewed' instead, and never address the reader as having supplied anything. "
                          "Do not mention searching, search results or coverage. Reply in the language of the question. "
                          "Output plain text only, no title, no list."),
                  user="Write the conclusion for the question and sources below.",
                  untrusted=untrusted,
                  max_tokens=800,
              )
              if not text: return None
              text=clean(text,950)
              if text.upper().startswith("INSUFFICIENT") or any(m in text.lower() for m in NON_ANSWER_MARKERS):
                  print("AI conclusion: sources do not address the question -> insufficient (nothing will be published).")
                  return "INSUFFICIENT"
              if len(text)<180 or any(m in text.lower() for m in META_MARKERS):
                  print("AI conclusion rejected: too short or meta wording; using template.")
                  return None
              return text

          ai_ok = nox_ai.available()
          print(f"AI helper: {'enabled' if ai_ok else 'disabled (no GROQ_API_KEY)'} | models={nox_ai.MODELS}")

          for request in requests_to_run:
              rid=request["id"]; question=clean(request.get("question"),1200)
              queries=[]
              topic=topic_of(question)
              if topic: queries.append(topic)
              context=clean(request.get("context"),1500)
              if context and len(queries)<3:
                  queries.append(clean(f"{topic} {context[:600]}",1400))
              # NB : la mémoire interne (memory_context) n'est volontairement JAMAIS ajoutée
              # aux requêtes : elles partent vers un moteur de recherche tiers.
              dedup=[]
              for q in queries:
                  if q and q not in dedup: dedup.append(q)

              results=[]; seen_urls=set(); errors=[]
              for q in dedup:
                  found,error=search(q)
                  if error: errors.append(error)
                  for r in found:
                      if r["url"] in seen_urls: continue
                      seen_urls.add(r["url"]); r["query"]=q; results.append(r)
                      if len(results)>=MAX_TOTAL: break
                  if len(results)>=MAX_TOTAL: break

              status,scored,domain_count=assess(question,results)

              # Requête dédiée aux limites / critiques du sujet (n'influence pas le statut).
              limits=[]
              if status in ("multi_source_support","partial_support") and topic:
                  limit_query=clean(f"{topic} limitations challenges criticism",300)
                  found,error=search(limit_query)
                  if error: errors.append(error)
                  _,limit_scored,_=assess(question,[r for r in found if r["url"] not in seen_urls])
                  limits=[r for r in limit_scored if r.get("relevant")][:2]

              # Lecture de la page des meilleures sources pertinentes.
              excerpts={}
              if ai_ok and status in ("multi_source_support","partial_support"):
                  for r in sorted([x for x in scored if x.get("relevant")],key=lambda x:x.get("query_overlap",0),reverse=True)[:MAX_FETCH_PAGES]:
                      page=fetch_excerpt(r["url"])
                      if len(page)>=150:
                          excerpts[r["url"]]=page

              if status=="multi_source_support":
                  conclusion="Search coverage found relevant results across multiple domains. This is evidence coverage, not proof of truth."
                  next_step="Compare the underlying sources before treating the claim as confirmed."
              elif status=="partial_support":
                  conclusion="Relevant evidence was found, but independent coverage is limited."
                  next_step="Keep the claim provisional and seek another independent source or a targeted test."
              elif status=="insufficient_verification":
                  conclusion="Search results exist, but their coverage is insufficient for verification."
                  next_step="Do not promote the claim to a confirmed fact."
              else:
                  conclusion="No usable web evidence was retrieved."
                  next_step="Refine the question or retry later."

              conclusion_source="template"
              written=ai_conclusion(question,status,scored,limits,excerpts) if ai_ok else None
              # Si le filtre a signalé un extrait de page, on réessaie une fois avec les seuls extraits de recherche.
              if written is None and ai_ok and excerpts and str(nox_ai.usage().get("last_error") or "").endswith(":flagged"):
                  print("Guard flagged a page excerpt: retrying with search snippets only.")
                  excerpts={}
                  written=ai_conclusion(question,status,scored,limits,excerpts)
              if written=="INSUFFICIENT":
                  status="insufficient_verification"
                  conclusion="The sources found do not address the question; nothing is published."
                  next_step="Do not promote the claim to a confirmed fact."
                  conclusion_source="ai_insufficient"
                  written=None
              if written:
                  conclusion=written; conclusion_source="ai:"+str(nox_ai.usage().get("last_model"))

              result_id=f"result-{stable(rid,json.dumps(scored,ensure_ascii=False,sort_keys=True))}"
              result={
                  "id":result_id,"request_id":rid,"case_id":request.get("case_id"),"timestamp":NOW,
                  "question":question,"work_type":"research","queries":dedup,"evidence_status":status,
                  "source_count":len(scored),"unique_domains":domain_count,"sources":([r for r in scored if r.get("relevant")] if status in ("multi_source_support","partial_support") else scored)[:MAX_TOTAL],
                  "limits_sources":[{"title":r.get("title"),"url":r.get("url")} for r in limits],
                  "pages_read":len(excerpts),
                  "conclusion":conclusion,"conclusion_source":conclusion_source,
                  "uncertainty":"Search snippets and page excerpts are discovery evidence only; they do not establish truth.",
                  "next_step":next_step,"errors":errors
              }
              state["history"].append(result)
              if status=="multi_source_support":
                  state["completed"].append({"request_id":rid,"case_id":request.get("case_id"),"timestamp":NOW,"status":status,"result_id":result_id})
              else:
                  state["attempts"][rid]=int(state["attempts"].get(rid,0))+1

              print(f"WORK RESULT: {question} | {status} | sources={len(scored)} | domains={domain_count} | pages_read={len(excerpts)} | limits={len(limits)} | conclusion={conclusion_source}")

          state["history"]=state["history"][-MAX_HISTORY:]
          state["completed"]=state["completed"][-MAX_HISTORY:]
          state["manual_review"]=state["manual_review"][-MAX_HISTORY:]
          state["version"]=5; state["last_run"]=NOW
          state["last_summary"]={"timestamp":NOW,"work_candidates":len(runtime.get("work_requests",[])),"research_selected":len(requests_to_run),"completed":sum(1 for x in state["history"][-len(requests_to_run):] if isinstance(x,dict) and x.get("evidence_status")=="multi_source_support") if requests_to_run else 0,"ai_usage":nox_ai.usage()}
          save(WORK_FILE,state)
          print(f"=== NØX WORK FACTORY V6 === candidates={len(runtime.get('work_requests',[]))} selected={len(requests_to_run)} history={len(state['history'])}")
          print("CORE WORK REQUEST -> RESEARCH + PAGE EXCERPTS + LIMITS -> AI-WRITTEN CONCLUSION (free tier, template fallback) -> CORE REASSESSMENT")
          print(f"AI usage this run: {nox_ai.usage()}")
          print(f"Manual review queue: {len(state['manual_review'])}; retry limit: {MAX_ATTEMPTS}")
          PY

      - name: Commit Work Factory state
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          git add memory/nox_work_factory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NØX: update work factory"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after retries."
          exit 1
