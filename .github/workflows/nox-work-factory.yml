name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "15"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX Work Factory
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )

          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )

          MAX_WORK_ITEMS = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )

          MAX_RESULTS_PER_QUERY = int(
              os.environ["MAX_WEB_RESULTS_PER_QUERY"]
          )

          MAX_TOTAL_RESULTS = int(
              os.environ["MAX_TOTAL_WEB_RESULTS"]
          )

          MAX_KNOWLEDGE_CONTEXT = int(
              os.environ["MAX_KNOWLEDGE_CONTEXT"]
          )

          WEB_TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          MAX_HISTORY = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          NOW = datetime.now(
              timezone.utc
          ).isoformat()


          # ==========================================================
          # BASIC IO
          # ==========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              temporary.replace(path)


          def clean_text(value, limit=1200):
              if value is None:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              return text[:limit]


          def stable_id(kind, value):
              raw = (
                  f"{kind}|{value}"
                  .strip()
                  .lower()
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]


          def first_value(item, keys):
              if not isinstance(item, dict):
                  return ""

              for key in keys:
                  value = clean_text(
                      item.get(key)
                  )

                  if value:
                      return value

              return ""


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          # ==========================================================
          # LOAD STATE
          # ==========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = {}


          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}


          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}


          work_state = load_json(
              WORK_FILE,
              {}
          )

          if not isinstance(
              work_state,
              dict
          ):
              work_state = {}


          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures"
          ):
              ensure_list(
                  core_memory,
                  key
              )


          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              ensure_list(
                  knowledge,
                  key
              )


          for key in (
              "completed",
              "history"
          ):
              ensure_list(
                  work_state,
                  key
              )


          # ==========================================================
          # WORK TYPE CLASSIFICATION
          #
          # IMPORTANT:
          # The Work Factory is a research/evidence subsystem.
          #
          # It MUST NOT consume ordinary Colony actions such as:
          #   - reply
          #   - follow
          #   - join
          #   - vote
          #   - DM
          #
          # Those belong to the action/presence layer.
          # ==========================================================

          RESEARCH_TYPES = {
              "research",
              "research_request",
              "web_research",
              "verification",
              "verify",
              "question",
              "analysis",
              "fact_check",
              "factcheck",
              "investigation"
          }


          ACTION_TYPES = {
              "action",
              "reply",
              "comment",
              "follow",
              "join",
              "vote",
              "dm",
              "message",
              "post",
              "publish",
              "react",
              "echo",
              "social"
          }


          ACTION_PREFIXES = (
              "reply ",
              "reply to ",
              "answer @",
              "follow ",
              "join ",
              "vote ",
              "dm ",
              "send message ",
              "comment on ",
              "react to ",
              "echo "
          )


          RESEARCH_PREFIXES = (
              "research ",
              "verify ",
              "verification ",
              "fact check ",
              "fact-check ",
              "investigate ",
              "check whether ",
              "check if ",
              "determine whether ",
              "determine if ",
              "find out whether ",
              "find out if "
          )


          def normalize_type(value):
              return clean_text(
                  value,
                  80
              ).lower().replace(
                  "-",
                  "_"
              ).replace(
                  " ",
                  "_"
              )


          def looks_like_action_text(text):
              lowered = clean_text(
                  text,
                  500
              ).lower()

              return any(
                  lowered.startswith(prefix)
                  for prefix in ACTION_PREFIXES
              )


          def looks_like_research_text(text):
              lowered = clean_text(
                  text,
                  500
              ).lower()

              return any(
                  lowered.startswith(prefix)
                  for prefix in RESEARCH_PREFIXES
              )


          def classify_work(item, source_type):
              explicit_type = normalize_type(
                  first_value(
                      item,
                      (
                          "work_type",
                          "task_type",
                          "intent",
                          "type",
                          "kind"
                      )
                  )
              )

              if explicit_type in ACTION_TYPES:
                  return (
                      "action",
                      "high",
                      "non_research_action"
                  )

              if explicit_type in RESEARCH_TYPES:
                  return (
                      explicit_type,
                      "high",
                      "explicit_research"
                  )

              question = first_value(
                  item,
                  (
                      "question",
                      "research_question",
                      "query",
                      "problem",
                      "objective",
                      "task"
                  )
              )

              if looks_like_action_text(question):
                  return (
                      "action",
                      "high",
                      "action_language"
                  )

              if looks_like_research_text(question):
                  return (
                      "research",
                      "medium",
                      "research_language"
                  )

              # A cognitive case is accepted only when it explicitly
              # declares that it requires research.
              if source_type == "cognitive_case":
                  research_flag = str(
                      item.get(
                          "needs_research",
                          ""
                      )
                  ).lower()

                  if research_flag in {
                      "true",
                      "1",
                      "yes"
                  }:
                      return (
                          "research",
                          "high",
                          "explicit_case_research"
                      )

              return (
                  "unknown",
                  "low",
                  "no_explicit_research_intent"
              )


          # ==========================================================
          # CANDIDATE DISCOVERY
          # ==========================================================

          candidates = []


          def add_candidate(
              item,
              source_type
          ):
              if isinstance(item, dict):
                  question = first_value(
                      item,
                      (
                          "question",
                          "research_question",
                          "query",
                          "problem",
                          "objective",
                          "task"
                      )
                  )

                  if not question:
                      return

                  work_id = clean_text(
                      item.get("id"),
                      200
                  )

                  priority = item.get(
                      "priority",
                      0
                  )

                  try:
                      priority = int(
                          priority or 0
                      )
                  except Exception:
                      priority = 0

                  work_type, confidence, reason = (
                      classify_work(
                          item,
                          source_type
                      )
                  )

                  candidates.append(
                      {
                          "question": clean_text(
                              question,
                              500
                          ),
                          "source_type": source_type,
                          "source_id": work_id,
                          "priority": priority,
                          "work_type": work_type,
                          "confidence": confidence,
                          "classification_reason": reason,
                          "context": item
                      }
                  )

              else:
                  question = clean_text(
                      item,
                      500
                  )

                  if not question:
                      return

                  temporary = {
                      "question": question
                  }

                  work_type, confidence, reason = (
                      classify_work(
                          temporary,
                          source_type
                      )
                  )

                  candidates.append(
                      {
                          "question": question,
                          "source_type": source_type,
                          "source_id": "",
                          "priority": 0,
                          "work_type": work_type,
                          "confidence": confidence,
                          "classification_reason": reason,
                          "context": {}
                      }
                  )


          def consume_collection(
              value,
              source_type
          ):
              if not isinstance(
                  value,
                  list
              ):
                  return

              for item in value:
                  add_candidate(
                      item,
                      source_type
                  )


          consume_collection(
              core_runtime.get(
                  "work_requests"
              ),
              "work_request"
          )

          consume_collection(
              core_runtime.get(
                  "research_requests"
              ),
              "research_request"
          )

          consume_collection(
              core_runtime.get(
                  "web_queries"
              ),
              "web_query"
          )


          # ==========================================================
          # COGNITIVE CASES
          # ==========================================================

          for case in reversed(
              core_memory.get(
                  "cognitive_cases",
                  []
              )
          ):
              if not isinstance(
                  case,
                  dict
              ):
                  continue

              status = clean_text(
                  case.get(
                      "status",
                      ""
                  )
              ).lower()

              if status in {
                  "closed",
                  "completed",
                  "resolved",
                  "discarded"
              }:
                  continue

              question = first_value(
                  case,
                  (
                      "question",
                      "research_question",
                      "problem",
                      "query"
                  )
              )

              if not question:
                  continue

              add_candidate(
                  case,
                  "cognitive_case"
              )


          # ==========================================================
          # COMPLETION / RETRY STATE
          # ==========================================================

          completed_ids = {
              clean_text(
                  item.get(
                      "request_id"
                  )
              )
              for item in work_state["completed"]
              if isinstance(
                  item,
                  dict
              )
          }


          # ==========================================================
          # NORMALIZE / DEDUPLICATE
          # ==========================================================

          unique = {}

          for candidate in candidates:
              work_id = stable_id(
                  "work",
                  candidate["question"]
              )

              if work_id in completed_ids:
                  continue

              candidate["id"] = work_id

              existing = unique.get(
                  work_id
              )

              if (
                  existing is None
                  or candidate["priority"]
                  > existing["priority"]
              ):
                  unique[work_id] = candidate


          ordered = sorted(
              unique.values(),
              key=lambda item: (
                  -item["priority"],
                  item["id"]
              )
          )


          # ==========================================================
          # SELECT ONLY RESEARCH WORK
          #
          # Actions and unknown intents are deliberately excluded.
          # They are not failures of the factory.
          # ==========================================================

          research_candidates = [
              item
              for item in ordered
              if item["work_type"]
              in RESEARCH_TYPES
              or item["work_type"] == "research"
          ]


          deferred_actions = [
              item
              for item in ordered
              if item["work_type"] == "action"
          ]


          deferred_unknown = [
              item
              for item in ordered
              if item["work_type"] == "unknown"
          ]


          work_items = research_candidates[
              :MAX_WORK_ITEMS
          ]


          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Research candidates: "
              f"{len(research_candidates)}"
          )

          print(
              f"Research selected: "
              f"{len(work_items)}"
          )

          print(
              f"Actions deferred: "
              f"{len(deferred_actions)}"
          )

          print(
              f"Unknown deferred: "
              f"{len(deferred_unknown)}"
          )


          # ==========================================================
          # KNOWLEDGE CONTEXT
          #
          # Existing knowledge is contextual evidence only.
          # It is never treated as proof.
          # ==========================================================

          context_items = []

          for kind in (
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings"
          ):
              for item in reversed(
                  knowledge.get(kind, [])
              ):
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  summary = first_value(
                      item,
                      (
                          "summary",
                          "result",
                          "lesson",
                          "learning",
                          "action"
                      )
                  )

                  if not summary:
                      continue

                  context_items.append(
                      {
                          "kind": kind,
                          "summary": summary,
                          "evidence": item.get(
                              "evidence",
                              {}
                          )
                      }
                  )

                  if (
                      len(context_items)
                      >= MAX_KNOWLEDGE_CONTEXT
                  ):
                      break

              if (
                  len(context_items)
                  >= MAX_KNOWLEDGE_CONTEXT
              ):
                  break


          # ==========================================================
          # TOKENIZATION
          # ==========================================================

          def tokens(text):
              return set(
                  word.lower()
                  for word in re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      text,
                      flags=re.IGNORECASE
                  )
              )


          def overlap_score(
              question,
              result
          ):
              question_tokens = tokens(
                  question
              )

              result_text = (
                  result.get(
                      "title",
                      ""
                  )
                  + " "
                  + result.get(
                      "snippet",
                      ""
                  )
              )

              result_tokens = tokens(
                  result_text
              )

              if (
                  not question_tokens
                  or not result_tokens
              ):
                  return 0.0

              return round(
                  len(
                      question_tokens
                      & result_tokens
                  )
                  / len(question_tokens),
                  3
              )


          # ==========================================================
          # SEARCH QUERY BUILDING
          #
          # Never turn a social action into a web query.
          # ==========================================================

          def build_queries(work):
              question = clean_text(
                  work["question"],
                  500
              )

              context = work.get(
                  "context",
                  {}
              )

              queries = []

              explicit_queries = context.get(
                  "search_queries"
              )

              if isinstance(
                  explicit_queries,
                  list
              ):
                  for query in explicit_queries:
                      query = clean_text(
                          query,
                          500
                      )

                      if query:
                          queries.append(
                              query
                          )

              if question:
                  queries.append(
                      question
                  )

              # A verification request benefits from an exact
              # phrase search when the requester supplied one.
              claim = first_value(
                  context,
                  (
                      "claim",
                      "claim_text",
                      "target",
                      "paper_title",
                      "source_title"
                  )
              )

              if claim:
                  queries.append(
                      claim
                  )

              unique = []

              seen = set()

              for query in queries:
                  key = query.lower()

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(query)

              return unique[:3]


          # ==========================================================
          # DUCKDUCKGO HTML SEARCH
          # ==========================================================

          def web_search(query):
              encoded = urllib.parse.urlencode(
                  {
                      "q": query
                  }
              )

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + encoded
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; "
                          "NOX-Work-Factory/2.0)"
                      ),
                      "Accept": (
                          "text/html,"
                          "application/xhtml+xml"
                      )
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT
                  ) as response:
                      status_code = response.status

                      html_body = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                  print(
                      f"WEB QUERY: {query}"
                  )

                  print(
                      f"WEB HTTP: "
                      f"{status_code} "
                      f"bytes={len(html_body)}"
                  )

              except Exception as exc:
                  print(
                      f"WEB SEARCH FAILED: {exc}"
                  )
                  return []

              # DuckDuckGo challenge / non-result pages
              # must never be interpreted as evidence.
              challenge_markers = (
                  "anomaly",
                  "captcha",
                  "challenge",
                  "robot",
                  "unusual traffic"
              )

              lower_html = html_body.lower()

              if any(
                  marker in lower_html
                  for marker in challenge_markers
              ):
                  print(
                      "WEB SEARCH: possible challenge "
                      "page; ignoring response"
                  )
                  return []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*"'
                  r'.*?</div>\s*</div>',
                  html_body,
                  flags=(
                      re.IGNORECASE
                      | re.DOTALL
                  )
              )

              results = []

              seen_urls = set()

              for block in blocks:
                  if (
                      len(results)
                      >= MAX_RESULTS_PER_QUERY
                  ):
                      break

                  title_match = re.search(
                      r'class="result__a"'
                      r'[^>]*>(.*?)</a>',
                      block,
                      flags=(
                          re.IGNORECASE
                          | re.DOTALL
                      )
                  )

                  url_match = re.search(
                      r'class="result__a"'
                      r'[^>]*href="([^"]+)"',
                      block,
                      flags=re.IGNORECASE
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"'
                      r'[^>]*>(.*?)</',
                      block,
                      flags=(
                          re.IGNORECASE
                          | re.DOTALL
                      )
                  )

                  if (
                      not title_match
                      or not url_match
                  ):
                      continue

                  title = clean_text(
                      html.unescape(
                          re.sub(
                              r"<[^>]+>",
                              "",
                              title_match.group(1)
                          )
                      ),
                      300
                  )

                  snippet = ""

                  if snippet_match:
                      snippet = clean_text(
                          html.unescape(
                              re.sub(
                                  r"<[^>]+>",
                                  "",
                                  snippet_match.group(1)
                              )
                          ),
                          600
                      )

                  result_url = urllib.parse.unquote(
                      url_match.group(1)
                  )

                  if not result_url.startswith(
                      (
                          "http://",
                          "https://"
                      )
                  ):
                      continue

                  if result_url in seen_urls:
                      continue

                  seen_urls.add(
                      result_url
                  )

                  parsed = urllib.parse.urlparse(
                      result_url
                  )

                  domain = (
                      parsed.netloc
                      .lower()
                      .split("@")[-1]
                      .split(":")[0]
                  )

                  if domain.startswith(
                      "www."
                  ):
                      domain = domain[4:]

                  results.append(
                      {
                          "title": title,
                          "url": clean_text(
                              result_url,
                              600
                          ),
                          "snippet": snippet,
                          "domain": domain
                      }
                  )

              print(
                  f"WEB RESULTS: "
                  f"{len(results)}"
              )

              return results


          # ==========================================================
          # EVIDENCE ASSESSMENT
          #
          # This does NOT establish truth.
          # It measures search coverage only.
          # ==========================================================

          def evidence_assessment(
              question,
              results
          ):
              domains = {
                  item.get(
                      "domain"
                  )
                  for item in results
                  if item.get(
                      "domain"
                  )
              }

              scored = []

              for item in results:
                  copy = dict(item)

                  copy["query_overlap"] = (
                      overlap_score(
                          question,
                          item
                      )
                  )

                  scored.append(
                      copy
                  )

              strong = [
                  item
                  for item in scored
                  if item[
                      "query_overlap"
                  ] >= 0.20
              ]

              if (
                  len(domains) >= 3
                  and len(strong) >= 2
              ):
                  status = (
                      "multi_source_support"
                  )

              elif (
                  len(domains) >= 2
                  and strong
              ):
                  status = (
                      "partial_support"
                  )

              elif results:
                  status = (
                      "insufficient_verification"
                  )

              else:
                  status = "no_evidence"

              return {
                  "status": status,
                  "source_count": len(
                      results
                  ),
                  "unique_domains": len(
                      domains
                  ),
                  "strong_matches": len(
                      strong
                  ),
                  "results": scored
              }


          # ==========================================================
          # EXECUTE RESEARCH
          # ==========================================================

          completed_now = 0
          retry_pending_now = 0


          for work in work_items:
              work_id = work["id"]
              question = work["question"]

              print("")
              print(
                  f"WORK START: {question}"
              )

              print(
                  "WORK CLASSIFICATION: "
                  f"{work['work_type']} | "
                  f"confidence={work['confidence']}"
              )

              queries = build_queries(
                  work
              )

              if not queries:
                  print(
                      "WORK DEFERRED: "
                      "missing research query"
                  )

                  work_state["history"].append(
                      {
                          "id": stable_id(
                              "deferred",
                              work_id
                          ),
                          "request_id": work_id,
                          "timestamp": NOW,
                          "question": question,
                          "type": work[
                              "work_type"
                          ],
                          "status": "deferred",
                          "reason": (
                              "missing_research_query"
                          )
                      }
                  )

                  retry_pending_now += 1
                  continue


              results = []
              seen_urls = set()

              for query in queries:
                  query_results = web_search(
                      query
                  )

                  for result in query_results:
                      url = result["url"]

                      if url in seen_urls:
                          continue

                      seen_urls.add(
                          url
                      )

                      result["query"] = query

                      results.append(
                          result
                      )

                      if (
                          len(results)
                          >= MAX_TOTAL_RESULTS
                      ):
                          break

                  if (
                      len(results)
                      >= MAX_TOTAL_RESULTS
                  ):
                      break


              evidence = evidence_assessment(
                  question,
                  results
              )


              source_domains = sorted(
                  {
                      item.get(
                          "domain"
                      )
                      for item in results
                      if item.get(
                          "domain"
                      )
                  }
              )


              if (
                  evidence["status"]
                  == "multi_source_support"
              ):
                  conclusion = (
                      "Multiple independent domains "
                      "returned evidence relevant to "
                      "the research question. This "
                      "measures evidence coverage only "
                      "and does not establish truth."
                  )

                  next_step = (
                      "Inspect the underlying sources "
                      "directly and compare their claims "
                      "before recording a confirmed fact."
                  )

                  terminal = True

              elif (
                  evidence["status"]
                  == "partial_support"
              ):
                  conclusion = (
                      "Relevant evidence was found, "
                      "but independent source coverage "
                      "is limited."
                  )

                  next_step = (
                      "Collect additional independent "
                      "sources or perform a targeted test."
                  )

                  terminal = False

              elif (
                  evidence["status"]
                  == "insufficient_verification"
              ):
                  conclusion = (
                      "Search results were found, but "
                      "the evidence is insufficient to "
                      "verify the research question."
                  )

                  next_step = (
                      "Do not promote this result to a "
                      "confirmed fact."
                  )

                  terminal = False

              else:
                  conclusion = (
                      "No usable web evidence was "
                      "retrieved."
                  )

                  next_step = (
                      "Refine the research question or "
                      "retry the research later."
                  )

                  terminal = False


              result_id = stable_id(
                  "result",
                  work_id
                  + "|"
                  + json.dumps(
                      evidence,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )


              work_result = {
                  "id": result_id,
                  "request_id": work_id,
                  "timestamp": NOW,
                  "question": question,
                  "type": work[
                      "work_type"
                  ],
                  "confidence": work[
                      "confidence"
                  ],
                  "source_type": work[
                      "source_type"
                  ],
                  "source_id": work[
                      "source_id"
                  ],
                  "queries": queries,
                  "evidence_status": evidence[
                      "status"
                  ],
                  "source_count": evidence[
                      "source_count"
                  ],
                  "unique_domains": evidence[
                      "unique_domains"
                  ],
                  "sources": results,
                  "conclusion": conclusion,
                  "uncertainty": (
                      "Web search results and snippets "
                      "are discovery evidence only. "
                      "This workflow does not promote "
                      "claims to verified facts."
                  ),
                  "next_step": next_step
              }


              work_state["history"].append(
                  work_result
              )


              if terminal:
                  work_state["completed"].append(
                      {
                          "request_id": work_id,
                          "timestamp": NOW,
                          "status": evidence[
                              "status"
                          ],
                          "result_id": result_id
                      }
                  )

                  completed_now += 1

              else:
                  retry_pending_now += 1


              print(
                  "WORK RESULT: "
                  f"type={work['work_type']} | "
                  f"status={evidence['status']} | "
                  f"sources={len(results)} | "
                  f"domains={len(source_domains)}"
              )


          # ==========================================================
          # RECORD DEFERRED ACTIONS / UNKNOWN WORK
          #
          # They are recorded for observability, but never marked
          # completed and never sent to the web researcher.
          # ==========================================================

          for item in (
              deferred_actions
              + deferred_unknown
          ):
              status = (
                  "action_deferred"
                  if item["work_type"]
                  == "action"
                  else "unknown_deferred"
              )

              work_state["history"].append(
                  {
                      "id": stable_id(
                          "deferred",
                          item["id"]
                          + "|"
                          + status
                      ),
                      "request_id": item["id"],
                      "timestamp": NOW,
                      "question": item[
                          "question"
                      ],
                      "type": item[
                          "work_type"
                      ],
                      "confidence": item[
                          "confidence"
                      ],
                      "status": status,
                      "reason": item[
                          "classification_reason"
                      ]
                  }
              )

              print("")
              print(
                  f"WORK DEFERRED: "
                  f"{item['question']}"
              )

              print(
                  f"WORK DEFERRED REASON: "
                  f"{item['classification_reason']}"
              )


          # ==========================================================
          # LIMIT HISTORY
          # ==========================================================

          work_state["history"] = (
              work_state["history"]
              [-MAX_HISTORY:]
          )

          work_state["completed"] = (
              work_state["completed"]
              [-MAX_HISTORY:]
          )


          # ==========================================================
          # STATE
          # ==========================================================

          work_state["version"] = 2

          work_state["last_run"] = NOW

          work_state["run_count"] = (
              int(
                  work_state.get(
                      "run_count",
                      0
                  )
              )
              + 1
          )

          work_state["last_summary"] = {
              "timestamp": NOW,
              "work_candidates": len(
                  candidates
              ),
              "research_candidates": len(
                  research_candidates
              ),
              "research_selected": len(
                  work_items
              ),
              "work_completed": completed_now,
              "work_retry_pending": retry_pending_now,
              "actions_deferred": len(
                  deferred_actions
              ),
              "unknown_deferred": len(
                  deferred_unknown
              )
          }


          # ==========================================================
          # PERSIST ONLY FACTORY STATE
          #
          # Memory & Knowledge remains the consolidation layer.
          # ==========================================================

          save_json(
              WORK_FILE,
              work_state
          )


          # ==========================================================
          # FINAL SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX WORK FACTORY ==="
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Research selected: "
              f"{len(work_items)}"
          )

          print(
              f"Work completed: "
              f"{completed_now}"
          )

          print(
              f"Work retry pending: "
              f"{retry_pending_now}"
          )

          print(
              f"Actions deferred: "
              f"{len(deferred_actions)}"
          )

          print(
              f"Unknown deferred: "
              f"{len(deferred_unknown)}"
          )

          print(
              f"History size: "
              f"{len(work_state['history'])}"
          )

          print("")
          print(
              "=== CLASSIFY -> "
              "RESEARCH ONLY -> "
              "WEB EVIDENCE -> "
              "RESULT ==="
          )

          print(
              "=== NØX WORK FACTORY TERMINÉ ==="
          )
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update work factory"
          git push
