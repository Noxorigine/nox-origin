name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "20"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Web Research Engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -U ddgs

      - name: Run NØX Work Factory
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from ddgs import DDGS


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )

          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )

          MAX_WORK_ITEMS = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )

          MAX_RESULTS_PER_QUERY = int(
              os.environ["MAX_WEB_RESULTS_PER_QUERY"]
          )

          MAX_TOTAL_RESULTS = int(
              os.environ["MAX_TOTAL_WEB_RESULTS"]
          )

          MAX_KNOWLEDGE_CONTEXT = int(
              os.environ["MAX_KNOWLEDGE_CONTEXT"]
          )

          WEB_TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          MAX_HISTORY = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          NOW = datetime.now(
              timezone.utc
          ).isoformat()


          # ==========================================================
          # BASIC IO
          # ==========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              temporary.replace(path)


          def clean_text(value, limit=1200):
              if value is None:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              return text[:limit]


          def stable_id(kind, value):
              raw = (
                  f"{kind}|{value}"
                  .strip()
                  .lower()
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]


          def first_value(item, keys):
              if not isinstance(item, dict):
                  return ""

              for key in keys:
                  value = clean_text(
                      item.get(key)
                  )

                  if value:
                      return value

              return ""


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          def as_bool(value):
              if isinstance(value, bool):
                  return value

              return str(
                  value
              ).strip().lower() in {
                  "true",
                  "1",
                  "yes",
                  "y"
              }


          # ==========================================================
          # LOAD STATE
          # ==========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = {}


          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}


          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}


          work_state = load_json(
              WORK_FILE,
              {}
          )

          if not isinstance(
              work_state,
              dict
          ):
              work_state = {}


          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures"
          ):
              ensure_list(
                  core_memory,
                  key
              )


          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              ensure_list(
                  knowledge,
                  key
              )


          for key in (
              "completed",
              "history"
          ):
              ensure_list(
                  work_state,
                  key
              )


          # ==========================================================
          # WORK CLASSIFICATION
          #
          # The Work Factory is a research/evidence subsystem.
          #
          # It MUST NOT transform ordinary Colony actions into
          # research simply because their text contains words such
          # as "verification".
          # ==========================================================

          RESEARCH_TYPES = {
              "research",
              "research_request",
              "web_research",
              "verification",
              "verify",
              "question",
              "analysis",
              "fact_check",
              "factcheck",
              "investigation"
          }


          ACTION_TYPES = {
              "action",
              "reply",
              "comment",
              "follow",
              "join",
              "vote",
              "dm",
              "message",
              "post",
              "publish",
              "react",
              "echo",
              "social"
          }


          ACTION_PREFIXES = (
              "reply ",
              "reply to ",
              "answer @",
              "follow ",
              "join ",
              "vote ",
              "dm ",
              "send message ",
              "comment on ",
              "react to ",
              "echo "
          )


          RESEARCH_PREFIXES = (
              "research ",
              "verify ",
              "verification ",
              "fact check ",
              "fact-check ",
              "investigate ",
              "check whether ",
              "check if ",
              "determine whether ",
              "determine if ",
              "find out whether ",
              "find out if "
          )


          def normalize_type(value):
              return (
                  clean_text(
                      value,
                      100
                  )
                  .lower()
                  .replace(
                      "-",
                      "_"
                  )
                  .replace(
                      " ",
                      "_"
                  )
              )


          def looks_like_action_text(text):
              lowered = clean_text(
                  text,
                  500
              ).lower()

              return any(
                  lowered.startswith(prefix)
                  for prefix in ACTION_PREFIXES
              )


          def looks_like_research_text(text):
              lowered = clean_text(
                  text,
                  500
              ).lower()

              return any(
                  lowered.startswith(prefix)
                  for prefix in RESEARCH_PREFIXES
              )


          def explicit_research_flag(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return False

              return as_bool(
                  item.get(
                      "needs_research",
                      False
                  )
              )


          def classify_external_work(item):
              """
              Classification for explicit runtime work requests.

              Text heuristics are allowed here because these are
              actual work requests, not cognitive cases generated
              by Core.
              """

              explicit_type = normalize_type(
                  first_value(
                      item,
                      (
                          "work_type",
                          "task_type",
                          "type",
                          "kind"
                      )
                  )
              )

              if explicit_type in ACTION_TYPES:
                  return (
                      "action",
                      "high",
                      "explicit_action"
                  )

              if explicit_type in RESEARCH_TYPES:
                  return (
                      "research",
                      "high",
                      "explicit_research"
                  )

              question = first_value(
                  item,
                  (
                      "question",
                      "research_question",
                      "query",
                      "problem",
                      "objective",
                      "task"
                  )
              )

              if looks_like_action_text(
                  question
              ):
                  return (
                      "action",
                      "high",
                      "action_language"
                  )

              if looks_like_research_text(
                  question
              ):
                  return (
                      "research",
                      "medium",
                      "research_language"
                  )

              return (
                  "unknown",
                  "low",
                  "no_explicit_intent"
              )


          def cognitive_question(case):
              """
              Core V5 stores questions as a list.

              Older formats are also accepted for compatibility.
              """

              questions = case.get(
                  "questions"
              )

              if isinstance(
                  questions,
                  list
              ):
                  for value in questions:
                      text = clean_text(
                          value,
                          1000
                      )

                      if text:
                          return text

              elif isinstance(
                  questions,
                  str
              ):
                  text = clean_text(
                      questions,
                      1000
                  )

                  if text:
                      return text

              return first_value(
                  case,
                  (
                      "question",
                      "research_question",
                      "query",
                      "problem"
                  )
              )


          def cognitive_research_query(case):
              """
              Extract an explicit research query from the Core case.
              """

              research = case.get(
                  "research"
              )

              if isinstance(
                  research,
                  list
              ):
                  for item in research:
                      if isinstance(
                          item,
                          str
                      ):
                          text = clean_text(
                              item,
                              1000
                          )
                          if text:
                              return text

                      if isinstance(
                          item,
                          dict
                      ):
                          text = first_value(
                              item,
                              (
                                  "query",
                                  "question",
                                  "research_question",
                                  "objective",
                                  "claim"
                              )
                          )

                          if text:
                              return text

              if isinstance(
                  research,
                  dict
              ):
                  return first_value(
                      research,
                      (
                          "query",
                          "question",
                          "research_question",
                          "objective",
                          "claim"
                      )
                  )

              return ""


          def classify_cognitive_case(case):
              """
              Core's structured cognitive state has priority.

              A cognitive case becomes research work only when:

              1. Core explicitly sets needs_research=true; OR
              2. Core provides an explicit research payload; OR
              3. Core has an evidence/verification intent AND
                 an actual question AND the case is not a
                 do_nothing decision.

              Text such as "Follow #verification" is NEVER enough.
              """

              intent = normalize_type(
                  case.get(
                      "intent",
                      ""
                  )
              )

              decision = normalize_type(
                  case.get(
                      "decision",
                      ""
                  )
              )

              question = cognitive_question(
                  case
              )

              research_query = cognitive_research_query(
                  case
              )

              if explicit_research_flag(
                  case
              ):
                  if question or research_query:
                      return (
                          "research",
                          "high",
                          "explicit_case_research"
                      )

              if research_query:
                  return (
                      "research",
                      "high",
                      "case_research_payload"
                  )

              if (
                  intent
                  in {
                      "verify_or_request_evidence",
                      "verify",
                      "verification",
                      "fact_check",
                      "investigate",
                      "investigation"
                  }
                  and question
                  and decision
                  not in {
                      "do_nothing",
                      "ignore",
                      "discard",
                      "observe_only"
                  }
              ):
                  return (
                      "research",
                      "high",
                      "structured_verification_intent"
                  )

              if (
                  intent
                  in {
                      "answer_question",
                      "question"
                  }
                  and explicit_research_flag(
                      case
                  )
                  and question
              ):
                  return (
                      "research",
                      "high",
                      "question_requires_research"
                  )

              return (
                  "unknown",
                  "low",
                  "no_explicit_case_research"
              )


          # ==========================================================
          # CANDIDATE DISCOVERY
          # ==========================================================

          candidates = []


          def add_external_candidate(
              item,
              source_type
          ):
              if not isinstance(
                  item,
                  dict
              ):
                  return

              question = first_value(
                  item,
                  (
                      "question",
                      "research_question",
                      "query",
                      "problem",
                      "objective",
                      "task"
                  )
              )

              if not question:
                  return

              (
                  work_type,
                  confidence,
                  reason
              ) = classify_external_work(
                  item
              )

              priority = item.get(
                  "priority",
                  0
              )

              try:
                  priority = int(
                      priority or 0
                  )
              except Exception:
                  priority = 0

              candidates.append(
                  {
                      "question": clean_text(
                          question,
                          800
                      ),
                      "source_type": source_type,
                      "source_id": clean_text(
                          item.get(
                              "id",
                              ""
                          ),
                          200
                      ),
                      "priority": priority,
                      "work_type": work_type,
                      "confidence": confidence,
                      "classification_reason": reason,
                      "context": item
                  }
              )


          def add_cognitive_candidate(
              case
          ):
              if not isinstance(
                  case,
                  dict
              ):
                  return

              status = clean_text(
                  case.get(
                      "status",
                      ""
                  )
              ).lower()

              if status in {
                  "closed",
                  "completed",
                  "resolved",
                  "discarded"
              }:
                  return

              (
                  work_type,
                  confidence,
                  reason
              ) = classify_cognitive_case(
                  case
              )

              if work_type != "research":
                  return

              question = cognitive_question(
                  case
              )

              research_query = cognitive_research_query(
                  case
              )

              if not question and not research_query:
                  return

              effective_question = (
                  research_query
                  or question
              )

              priority = case.get(
                  "priority",
                  0
              )

              try:
                  priority = int(
                      priority or 0
                  )
              except Exception:
                  priority = 0

              candidates.append(
                  {
                      "question": clean_text(
                          effective_question,
                          800
                      ),
                      "source_type": "cognitive_case",
                      "source_id": clean_text(
                          case.get(
                              "target_id",
                              case.get(
                                  "id",
                                  ""
                              )
                          ),
                          200
                      ),
                      "priority": priority,
                      "work_type": "research",
                      "confidence": confidence,
                      "classification_reason": reason,
                      "context": case
                  }
              )


          def consume_collection(
              value,
              source_type
          ):
              if not isinstance(
                  value,
                  list
              ):
                  return

              for item in value:
                  add_external_candidate(
                      item,
                      source_type
                  )


          # ----------------------------------------------------------
          # Explicit runtime work requests
          # ----------------------------------------------------------

          consume_collection(
              core_runtime.get(
                  "work_requests"
              ),
              "work_request"
          )

          consume_collection(
              core_runtime.get(
                  "research_requests"
              ),
              "research_request"
          )

          consume_collection(
              core_runtime.get(
                  "web_queries"
              ),
              "web_query"
          )


          # ----------------------------------------------------------
          # Core V5 cognitive cases
          # ----------------------------------------------------------

          for case in reversed(
              core_memory.get(
                  "cognitive_cases",
                  []
              )
          ):
              add_cognitive_candidate(
                  case
              )


          # ==========================================================
          # COMPLETION / RETRY STATE
          # ==========================================================

          completed_ids = {
              clean_text(
                  item.get(
                      "request_id"
                  )
              )
              for item in work_state[
                  "completed"
              ]
              if isinstance(
                  item,
                  dict
              )
          }


          # ==========================================================
          # NORMALIZE / DEDUPLICATE
          # ==========================================================

          unique = {}

          for candidate in candidates:
              work_id = stable_id(
                  "work",
                  candidate["question"]
              )

              if work_id in completed_ids:
                  continue

              candidate["id"] = work_id

              existing = unique.get(
                  work_id
              )

              if (
                  existing is None
                  or candidate["priority"]
                  > existing["priority"]
              ):
                  unique[
                      work_id
                  ] = candidate


          ordered = sorted(
              unique.values(),
              key=lambda item: (
                  -item["priority"],
                  item["id"]
              )
          )


          # ==========================================================
          # SELECT ONLY RESEARCH
          # ==========================================================

          research_candidates = [
              item
              for item in ordered
              if item["work_type"]
              == "research"
          ]


          deferred_actions = [
              item
              for item in ordered
              if item["work_type"]
              == "action"
          ]


          deferred_unknown = [
              item
              for item in ordered
              if item["work_type"]
              == "unknown"
          ]


          work_items = research_candidates[
              :MAX_WORK_ITEMS
          ]


          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Research candidates: "
              f"{len(research_candidates)}"
          )

          print(
              f"Research selected: "
              f"{len(work_items)}"
          )

          print(
              f"Actions deferred: "
              f"{len(deferred_actions)}"
          )

          print(
              f"Unknown deferred: "
              f"{len(deferred_unknown)}"
          )


          # ==========================================================
          # KNOWLEDGE CONTEXT
          #
          # Existing knowledge is context, never proof.
          # ==========================================================

          context_items = []

          for kind in (
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings"
          ):
              for item in reversed(
                  knowledge.get(
                      kind,
                      []
                  )
              ):
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  summary = first_value(
                      item,
                      (
                          "summary",
                          "result",
                          "lesson",
                          "learning",
                          "action"
                      )
                  )

                  if not summary:
                      continue

                  context_items.append(
                      {
                          "kind": kind,
                          "summary": summary,
                          "evidence": item.get(
                              "evidence",
                              {}
                          )
                      }
                  )

                  if (
                      len(context_items)
                      >= MAX_KNOWLEDGE_CONTEXT
                  ):
                      break

              if (
                  len(context_items)
                  >= MAX_KNOWLEDGE_CONTEXT
              ):
                  break


          # ==========================================================
          # TOKENIZATION / RELEVANCE
          # ==========================================================

          def tokens(text):
              return set(
                  word.lower()
                  for word in re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      text,
                      flags=re.IGNORECASE
                  )
              )


          def overlap_score(
              question,
              result
          ):
              question_tokens = tokens(
                  question
              )

              result_text = (
                  result.get(
                      "title",
                      ""
                  )
                  + " "
                  + result.get(
                      "snippet",
                      ""
                  )
              )

              result_tokens = tokens(
                  result_text
              )

              if (
                  not question_tokens
                  or not result_tokens
              ):
                  return 0.0

              return round(
                  len(
                      question_tokens
                      & result_tokens
                  )
                  / len(
                      question_tokens
                  ),
                  3
              )


          # ==========================================================
          # SEARCH QUERY BUILDING
          # ==========================================================

          def build_queries(work):
              question = clean_text(
                  work["question"],
                  800
              )

              context = work.get(
                  "context",
                  {}
              )

              queries = []

              explicit_queries = context.get(
                  "search_queries"
              )

              if isinstance(
                  explicit_queries,
                  list
              ):
                  for query in explicit_queries:
                      query = clean_text(
                          query,
                          500
                      )

                      if query:
                          queries.append(
                              query
                          )

              research_query = cognitive_research_query(
                  context
              )

              if research_query:
                  queries.append(
                      research_query
                  )

              if question:
                  queries.append(
                      question
                  )

              claim = first_value(
                  context,
                  (
                      "claim",
                      "claim_text",
                      "target",
                      "paper_title",
                      "source_title"
                  )
              )

              if claim:
                  queries.append(
                      claim
                  )

              unique = []

              seen = set()

              for query in queries:
                  key = clean_text(
                      query,
                      500
                  ).lower()

                  if not key:
                      continue

                  if key in seen:
                      continue

                  seen.add(
                      key
                  )

                  unique.append(
                      clean_text(
                          query,
                          500
                      )
                  )

              return unique[:3]


          # ==========================================================
          # WEB SEARCH
          #
          # Uses ddgs rather than the fragile DDG HTML parser.
          # backend="auto" allows the library to use alternative
          # search providers when one is temporarily unavailable.
          # ==========================================================

          def web_search(query):
              print(
                  f"WEB QUERY: {query}"
              )

              try:
                  engine = DDGS(
                      timeout=WEB_TIMEOUT
                  )

                  raw_results = engine.text(
                      query,
                      max_results=MAX_RESULTS_PER_QUERY,
                      backend="auto"
                  )

              except Exception as exc:
                  print(
                      f"WEB SEARCH FAILED: {exc}"
                  )
                  return []

              results = []

              seen_urls = set()

              for item in (
                  raw_results
                  or []
              ):
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  title = clean_text(
                      item.get(
                          "title",
                          ""
                      ),
                      300
                  )

                  url = clean_text(
                      item.get(
                          "href",
                          item.get(
                              "url",
                              ""
                          )
                      ),
                      800
                  )

                  snippet = clean_text(
                      item.get(
                          "body",
                          item.get(
                              "snippet",
                              ""
                          )
                      ),
                      700
                  )

                  if not url.startswith(
                      (
                          "http://",
                          "https://"
                      )
                  ):
                      continue

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  domain_match = re.match(
                      r"^(?:https?://)?"
                      r"(?:www\.)?"
                      r"([^/]+)",
                      url.lower()
                  )

                  domain = (
                      domain_match.group(1)
                      if domain_match
                      else ""
                  )

                  results.append(
                      {
                          "title": title,
                          "url": url,
                          "snippet": snippet,
                          "domain": domain
                      }
                  )

              print(
                  f"WEB RESULTS: "
                  f"{len(results)}"
              )

              return results


          # ==========================================================
          # EVIDENCE ASSESSMENT
          #
          # This measures search coverage.
          # It does NOT establish truth.
          # ==========================================================

          def evidence_assessment(
              question,
              results
          ):
              domains = {
                  item.get(
                      "domain"
                  )
                  for item in results
                  if item.get(
                      "domain"
                  )
              }

              scored = []

              for item in results:
                  copy = dict(
                      item
                  )

                  copy[
                      "query_overlap"
                  ] = overlap_score(
                      question,
                      item
                  )

                  scored.append(
                      copy
                  )

              strong = [
                  item
                  for item in scored
                  if item[
                      "query_overlap"
                  ] >= 0.20
              ]

              if (
                  len(domains) >= 3
                  and len(strong) >= 2
              ):
                  status = (
                      "multi_source_support"
                  )

              elif (
                  len(domains) >= 2
                  and len(strong) >= 1
              ):
                  status = (
                      "partial_support"
                  )

              elif results:
                  status = (
                      "insufficient_verification"
                  )

              else:
                  status = (
                      "no_evidence"
                  )

              return {
                  "status": status,
                  "source_count": len(
                      results
                  ),
                  "unique_domains": len(
                      domains
                  ),
                  "strong_matches": len(
                      strong
                  ),
                  "results": scored
              }


          # ==========================================================
          # EXECUTE RESEARCH
          # ==========================================================

          completed_now = 0
          retry_pending_now = 0


          for work in work_items:

              work_id = work[
                  "id"
              ]

              question = work[
                  "question"
              ]

              print("")
              print(
                  f"WORK START: {question}"
              )

              print(
                  "WORK CLASSIFICATION: "
                  f"{work['work_type']} | "
                  f"confidence={work['confidence']} | "
                  f"reason={work['classification_reason']}"
              )

              queries = build_queries(
                  work
              )

              if not queries:
                  print(
                      "WORK DEFERRED: "
                      "missing research query"
                  )

                  work_state[
                      "history"
                  ].append(
                      {
                          "id": stable_id(
                              "deferred",
                              work_id
                          ),
                          "request_id": work_id,
                          "timestamp": NOW,
                          "question": question,
                          "type": work[
                              "work_type"
                          ],
                          "status": "deferred",
                          "reason": (
                              "missing_research_query"
                          )
                      }
                  )

                  retry_pending_now += 1
                  continue


              results = []
              seen_urls = set()


              for query in queries:

                  query_results = web_search(
                      query
                  )

                  for result in query_results:

                      url = result[
                          "url"
                      ]

                      if url in seen_urls:
                          continue

                      seen_urls.add(
                          url
                      )

                      result[
                          "query"
                      ] = query

                      results.append(
                          result
                      )

                      if (
                          len(results)
                          >= MAX_TOTAL_RESULTS
                      ):
                          break

                  if (
                      len(results)
                      >= MAX_TOTAL_RESULTS
                  ):
                      break


              evidence = evidence_assessment(
                  question,
                  results
              )


              source_domains = sorted(
                  {
                      item.get(
                          "domain"
                      )
                      for item in results
                      if item.get(
                          "domain"
                      )
                  }
              )


              if (
                  evidence["status"]
                  == "multi_source_support"
              ):

                  conclusion = (
                      "Multiple independent "
                      "domains returned evidence "
                      "relevant to the research "
                      "question. This measures "
                      "evidence coverage only and "
                      "does not establish truth."
                  )

                  next_step = (
                      "Inspect the underlying "
                      "sources directly and compare "
                      "their claims before recording "
                      "a confirmed fact."
                  )

                  terminal = True


              elif (
                  evidence["status"]
                  == "partial_support"
              ):

                  conclusion = (
                      "Relevant evidence was found, "
                      "but independent source "
                      "coverage is limited."
                  )

                  next_step = (
                      "Collect additional independent "
                      "sources or perform a targeted "
                      "test."
                  )

                  terminal = False


              elif (
                  evidence["status"]
                  == "insufficient_verification"
              ):

                  conclusion = (
                      "Search results were found, "
                      "but the evidence is insufficient "
                      "to verify the research question."
                  )

                  next_step = (
                      "Do not promote this result "
                      "to a confirmed fact."
                  )

                  terminal = False


              else:

                  conclusion = (
                      "No usable web evidence "
                      "was retrieved."
                  )

                  next_step = (
                      "Refine the research question "
                      "or retry the research later."
                  )

                  terminal = False


              result_id = stable_id(
                  "result",
                  work_id
                  + "|"
                  + json.dumps(
                      evidence,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )


              work_result = {
                  "id": result_id,
                  "request_id": work_id,
                  "timestamp": NOW,
                  "question": question,
                  "type": work[
                      "work_type"
                  ],
                  "confidence": work[
                      "confidence"
                  ],
                  "classification_reason": work[
                      "classification_reason"
                  ],
                  "source_type": work[
                      "source_type"
                  ],
                  "source_id": work[
                      "source_id"
                  ],
                  "queries": queries,
                  "evidence_status": evidence[
                      "status"
                  ],
                  "source_count": evidence[
                      "source_count"
                  ],
                  "unique_domains": evidence[
                      "unique_domains"
                  ],
                  "sources": results,
                  "conclusion": conclusion,
                  "uncertainty": (
                      "Web search results and "
                      "snippets are discovery "
                      "evidence only. This workflow "
                      "does not promote claims to "
                      "verified facts."
                  ),
                  "next_step": next_step
              }


              work_state[
                  "history"
              ].append(
                  work_result
              )


              if terminal:

                  work_state[
                      "completed"
                  ].append(
                      {
                          "request_id": work_id,
                          "timestamp": NOW,
                          "status": evidence[
                              "status"
                          ],
                          "result_id": result_id
                      }
                  )

                  completed_now += 1

              else:
                  retry_pending_now += 1


              print(
                  "WORK RESULT: "
                  f"type={work['work_type']} | "
                  f"status={evidence['status']} | "
                  f"sources={len(results)} | "
                  f"domains={len(source_domains)}"
              )


          # ==========================================================
          # RECORD DEFERRED ITEMS
          #
          # They remain observable but are never sent to Web.
          # ==========================================================

          for item in (
              deferred_actions
              + deferred_unknown
          ):

              status = (
                  "action_deferred"
                  if item[
                      "work_type"
                  ] == "action"
                  else "unknown_deferred"
              )

              work_state[
                  "history"
              ].append(
                  {
                      "id": stable_id(
                          "deferred",
                          item["id"]
                          + "|"
                          + status
                      ),
                      "request_id": item[
                          "id"
                      ],
                      "timestamp": NOW,
                      "question": item[
                          "question"
                      ],
                      "type": item[
                          "work_type"
                      ],
                      "confidence": item[
                          "confidence"
                      ],
                      "status": status,
                      "reason": item[
                          "classification_reason"
                      ]
                  }
              )

              print("")
              print(
                  f"WORK DEFERRED: "
                  f"{item['question']}"
              )

              print(
                  f"WORK DEFERRED REASON: "
                  f"{item['classification_reason']}"
              )


          # ==========================================================
          # LIMIT HISTORY
          # ==========================================================

          work_state[
              "history"
          ] = work_state[
              "history"
          ][-MAX_HISTORY:]


          work_state[
              "completed"
          ] = work_state[
              "completed"
          ][-MAX_HISTORY:]


          # ==========================================================
          # STATE
          # ==========================================================

          work_state[
              "version"
          ] = 3

          work_state[
              "last_run"
          ] = NOW

          work_state[
              "run_count"
          ] = int(
              work_state.get(
                  "run_count",
                  0
              )
          ) + 1

          work_state[
              "last_summary"
          ] = {
              "timestamp": NOW,
              "work_candidates": len(
                  candidates
              ),
              "research_candidates": len(
                  research_candidates
              ),
              "research_selected": len(
                  work_items
              ),
              "work_completed": completed_now,
              "work_retry_pending": retry_pending_now,
              "actions_deferred": len(
                  deferred_actions
              ),
              "unknown_deferred": len(
                  deferred_unknown
              )
          }


          # ==========================================================
          # PERSIST ONLY FACTORY STATE
          #
          # Memory & Knowledge remains the consolidation layer.
          # ==========================================================

          save_json(
              WORK_FILE,
              work_state
          )


          # ==========================================================
          # FINAL SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX WORK FACTORY ==="
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Research candidates: "
              f"{len(research_candidates)}"
          )

          print(
              f"Research selected: "
              f"{len(work_items)}"
          )

          print(
              f"Work completed: "
              f"{completed_now}"
          )

          print(
              f"Work retry pending: "
              f"{retry_pending_now}"
          )

          print(
              f"Actions deferred: "
              f"{len(deferred_actions)}"
          )

          print(
              f"Unknown deferred: "
              f"{len(deferred_unknown)}"
          )

          print(
              f"History size: "
              f"{len(work_state['history'])}"
          )

          print("")
          print(
              "=== CORE COGNITION "
              "-> RESEARCH INTENT "
              "-> WEB EVIDENCE "
              "-> FACTORY RESULT ==="
          )

          print(
              "=== NØX WORK FACTORY TERMINÉ ==="
          )
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update work factory"
          git push
