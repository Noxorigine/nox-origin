name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json
  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_RESULTS: "15"
  MAX_HISTORY: "150"
  WEB_TIMEOUT_SECONDS: "20"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install search dependency
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9.16.0,<10.0.0"

      - name: Run Work Factory
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          from ddgs import DDGS

          NOW = datetime.now(timezone.utc).isoformat()
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          MAX_ITEMS = int(os.environ["MAX_WORK_ITEMS_PER_RUN"])
          MAX_RESULTS = int(os.environ["MAX_RESULTS_PER_QUERY"])
          MAX_TOTAL = int(os.environ["MAX_TOTAL_RESULTS"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])

          def load(path, default):
              if not path.exists(): return json.loads(json.dumps(default))
              try:
                  value=json.loads(path.read_text(encoding="utf-8")); return value if isinstance(value,dict) else json.loads(json.dumps(default))
              except Exception: return json.loads(json.dumps(default))

          def save(path,value):
              path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding="utf-8")

          def clean(v,n=3000): return re.sub(r"\s+"," ",str(v or "")).strip()[:n]
          def terms(v):
              stop={"this","that","with","from","have","what","when","where","which","would","could","about","your","their","there","then","than","pour","avec","dans","nous","vous","cela","cette","comme","mais","plus","faire","être","sont"}
              out=[]
              for w in re.findall(r"[a-zA-ZÀ-ÿ0-9_-]{4,}",clean(v,5000).lower()):
                  if w not in stop and w not in out: out.append(w)
              return out[:30]
          def stable(*parts): return hashlib.sha256("|".join(clean(x,5000) for x in parts).encode()).hexdigest()[:24]

          runtime=load(CORE_RUNTIME_FILE,{"work_requests":[]})
          memory=load(CORE_MEMORY_FILE,{})
          knowledge=load(KNOWLEDGE_FILE,{})
          state=load(WORK_FILE,{"version":4,"history":[],"completed":[],"attempts":{}})
          state.setdefault("history",[]); state.setdefault("completed",[]); state.setdefault("attempts",{})

          completed={x.get("request_id") for x in state["completed"] if isinstance(x,dict)}
          requests=[]
          for item in runtime.get("work_requests",[]):
              if not isinstance(item,dict): continue
              if item.get("status") not in (None,"pending","retry"):
                  continue
              if not item.get("id") or item.get("id") in completed:
                  continue
              if item.get("work_type") != "research":
                  state["history"].append({"id":stable("deferred",item.get("id")),"request_id":item.get("id"),"timestamp":NOW,"status":"deferred","reason":"unsupported_work_type"})
                  continue
              requests.append(item)
              if len(requests)>=MAX_ITEMS: break

          def search(query):
              try:
                  raw=DDGS(timeout=TIMEOUT).text(query,max_results=MAX_RESULTS,backend="auto")
              except Exception as exc:
                  return [],clean(exc,500)
              results=[]
              for item in raw or []:
                  if not isinstance(item,dict): continue
                  url=clean(item.get("href") or item.get("url"),1000)
                  if not url: continue
                  domain=urlparse(url).netloc.lower().split(":")[0]
                  results.append({"title":clean(item.get("title"),300),"url":url,"domain":domain,"snippet":clean(item.get("body") or item.get("snippet"),1200)})
              return results,None

          def assess(question,results):
              q=set(terms(question))
              scored=[]
              for r in results:
                  text=set(terms((r.get("title","")+" "+r.get("snippet",""))))
                  overlap=len(q & text)/max(1,len(q))
                  scored.append({**r,"query_overlap":round(overlap,3)})
              domains={r.get("domain") for r in scored if r.get("domain")}
              strong=[r for r in scored if r["query_overlap"]>=0.18]
              if len(domains)>=3 and len(strong)>=2: status="multi_source_support"
              elif len(domains)>=2 and len(strong)>=1: status="partial_support"
              elif scored: status="insufficient_verification"
              else: status="no_evidence"
              return status,scored,len(domains)

          for request in requests:
              rid=request["id"]; question=clean(request.get("question"),1200)
              queries=[]
              if question: queries.append(question)
              context=clean(request.get("context"),1500)
              if context and len(queries)<3:
                  queries.append(clean(f"{question} {context[:600]}",1400))
              if request.get("memory_context") and len(queries)<3:
                  queries.append(clean(f"{question} {json.dumps(request['memory_context'],ensure_ascii=False)[:600]}",1400))
              dedup=[]
              for q in queries:
                  if q and q not in dedup: dedup.append(q)

              results=[]; seen_urls=set(); errors=[]
              for q in dedup:
                  found,error=search(q)
                  if error: errors.append(error)
                  for r in found:
                      if r["url"] in seen_urls: continue
                      seen_urls.add(r["url"]); r["query"]=q; results.append(r)
                      if len(results)>=MAX_TOTAL: break
                  if len(results)>=MAX_TOTAL: break

              status,scored,domain_count=assess(question,results)
              if status=="multi_source_support":
                  conclusion="Search coverage found relevant results across multiple domains. This is evidence coverage, not proof of truth."
                  next_step="Compare the underlying sources before treating the claim as confirmed."
              elif status=="partial_support":
                  conclusion="Relevant evidence was found, but independent coverage is limited."
                  next_step="Keep the claim provisional and seek another independent source or a targeted test."
              elif status=="insufficient_verification":
                  conclusion="Search results exist, but their coverage is insufficient for verification."
                  next_step="Do not promote the claim to a confirmed fact."
              else:
                  conclusion="No usable web evidence was retrieved."
                  next_step="Refine the question or retry later."

              result_id=f"result-{stable(rid,json.dumps(scored,ensure_ascii=False,sort_keys=True))}"
              result={
                  "id":result_id,"request_id":rid,"case_id":request.get("case_id"),"timestamp":NOW,
                  "question":question,"work_type":"research","queries":dedup,"evidence_status":status,
                  "source_count":len(scored),"unique_domains":domain_count,"sources":scored[:MAX_TOTAL],
                  "conclusion":conclusion,"uncertainty":"Search snippets are discovery evidence only; they do not establish truth.",
                  "next_step":next_step,"errors":errors
              }
              state["history"].append(result)
              if status=="multi_source_support":
                  state["completed"].append({"request_id":rid,"case_id":request.get("case_id"),"timestamp":NOW,"status":status,"result_id":result_id})
              else:
                  state["attempts"][rid]=int(state["attempts"].get(rid,0))+1

              print(f"WORK RESULT: {question} | {status} | sources={len(scored)} | domains={domain_count}")

          state["history"]=state["history"][-MAX_HISTORY:]
          state["completed"]=state["completed"][-MAX_HISTORY:]
          state["version"]=4; state["last_run"]=NOW
          state["last_summary"]={"timestamp":NOW,"work_candidates":len(runtime.get("work_requests",[])),"research_selected":len(requests),"completed":sum(1 for x in state["history"][-len(requests):] if isinstance(x,dict) and x.get("evidence_status")=="multi_source_support") if requests else 0}
          save(WORK_FILE,state)
          print(f"=== NØX WORK FACTORY V4 === candidates={len(runtime.get('work_requests',[]))} selected={len(requests)} history={len(state['history'])}")
          print("CORE WORK REQUEST -> RESEARCH -> EVIDENCE COVERAGE -> CORE REASSESSMENT")
          PY

      - name: Commit Work Factory state
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          git add memory/nox_work_factory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NØX: update work factory"
          git pull --rebase origin main
          git push
