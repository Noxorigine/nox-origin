name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "12"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade ddgs colony-sdk

      - name: Run NØX Work Factory
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          from ddgs import DDGS

          from colony_sdk import (
              ColonyAPIError,
              ColonyClient,
              ColonyNetworkError,
              ColonyRateLimitError,
          )


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )

          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )

          MAX_WORK_ITEMS = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )

          MAX_RESULTS_PER_QUERY = int(
              os.environ["MAX_WEB_RESULTS_PER_QUERY"]
          )

          MAX_TOTAL_RESULTS = int(
              os.environ["MAX_TOTAL_WEB_RESULTS"]
          )

          MAX_KNOWLEDGE_CONTEXT = int(
              os.environ["MAX_KNOWLEDGE_CONTEXT"]
          )

          WEB_TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          MAX_HISTORY = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          COLONY_API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          )


          # ==========================================================
          # TIME
          # ==========================================================

          def now_iso():
              return (
                  datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
              )


          # ==========================================================
          # BASIC IO
          # ==========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"LOAD FAILED: {path} | {exc}"
                  )

                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

                  handle.write("\n")

              temporary.replace(path)


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          def clean_text(
              value,
              limit=None
          ):
              if value is None:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              if limit:
                  return text[:limit]

              return text


          def stable_id(
              prefix,
              value
          ):
              normalized = re.sub(
                  r"\s+",
                  " ",
                  str(value).strip().lower()
              )

              digest = hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:16]

              return f"{prefix}-{digest}"


          # ==========================================================
          # WORK DISCOVERY
          # ==========================================================

          def first_nonempty(
              item,
              keys
          ):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              for key in keys:
                  value = item.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      return clean_text(
                          value,
                          800
                      )

              return ""


          def normalize_work_item(
              item,
              source
          ):
              if isinstance(
                  item,
                  str
              ):
                  question = clean_text(
                      item,
                      800
                  )

                  if not question:
                      return None

                  return {
                      "request_id": stable_id(
                          "work",
                          question
                      ),
                      "question": question,
                      "priority": 0,
                      "source": source,
                      "original": item,
                  }

              if not isinstance(
                  item,
                  dict
              ):
                  return None

              question = first_nonempty(
                  item,
                  (
                      "question",
                      "research_question",
                      "query",
                      "problem",
                      "objective",
                      "task",
                      "title",
                      "description",
                      "text",
                  )
              )

              if not question:
                  return None

              request_id = (
                  item.get("request_id")
                  or item.get("id")
                  or stable_id(
                      "work",
                      question
                  )
              )

              try:
                  priority = int(
                      item.get(
                          "priority",
                          0
                      )
                  )
              except Exception:
                  priority = 0

              return {
                  "request_id": str(
                      request_id
                  ),
                  "question": question,
                  "priority": priority,
                  "source": source,
                  "original": item,
              }


          def collect_candidates(
              core_memory,
              core_runtime
          ):
              candidates = []

              for key in (
                  "work_requests",
                  "research_requests",
                  "web_queries",
              ):
                  values = core_runtime.get(
                      key,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      normalized = (
                          normalize_work_item(
                              item,
                              key
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              cases = core_memory.get(
                  "cognitive_cases",
                  []
              )

              if isinstance(
                  cases,
                  list
              ):
                  for case in cases:
                      if not isinstance(
                          case,
                          dict
                      ):
                          continue

                      status = clean_text(
                          case.get(
                              "status",
                              ""
                          )
                      ).lower()

                      if status in {
                          "closed",
                          "completed",
                          "resolved",
                          "discarded",
                      }:
                          continue

                      normalized = (
                          normalize_work_item(
                              case,
                              "cognitive_case"
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              deduped = {}

              for candidate in candidates:
                  request_id = candidate[
                      "request_id"
                  ]

                  existing = deduped.get(
                      request_id
                  )

                  if existing is None:
                      deduped[
                          request_id
                      ] = candidate

                  elif (
                      candidate["priority"]
                      > existing["priority"]
                  ):
                      deduped[
                          request_id
                      ] = candidate

              return list(
                  deduped.values()
              )


          # ==========================================================
          # STRUCTURED ACTION EXTRACTION
          #
          # ACTIONS ARE TESTED BEFORE RESEARCH/VERIFY.
          #
          # This is critical:
          #
          # "Follow #verification"
          #
          # contains the word "verification", but the leading intent
          # is FOLLOW_TAG. It must NEVER reach the Web classifier.
          # ==========================================================

          def extract_explicit_action(
              text,
              original
          ):
              lowered = clean_text(
                  text
              ).lower()

              # ------------------------------------------------------
              # Explicit structured type from Core.
              # ------------------------------------------------------

              if isinstance(
                  original,
                  dict
              ):
                  explicit_type = clean_text(
                      original.get("type")
                      or original.get("work_type")
                      or original.get("kind")
                      or original.get("action")
                  ).lower()

                  aliases = {
                      "action": "action",
                      "colony_action": "action",
                      "join": "join_colony",
                      "join_colony": "join_colony",
                      "follow": "follow_user",
                      "follow_user": "follow_user",
                      "follow_tag": "follow_tag",
                      "reply": "reply",
                      "comment": "comment",
                      "create_comment": "comment",
                      "post": "create_post",
                      "create_post": "create_post",
                  }

                  if explicit_type in aliases:
                      action = aliases[
                          explicit_type
                      ]

                      if action == "action":
                          action = ""

                      if action:
                          return action

              # ------------------------------------------------------
              # JOIN COLONY
              # ------------------------------------------------------

              if re.fullmatch(
                  r"join\s+(?:c/)?"
                  r"[a-z0-9][a-z0-9_-]*",
                  lowered
              ):
                  return "join_colony"

              if re.fullmatch(
                  r"join\s+colony\s+"
                  r"[a-z0-9][a-z0-9_-]*",
                  lowered
              ):
                  return "join_colony"

              # ------------------------------------------------------
              # FOLLOW TAG
              #
              # "Follow #verification"
              # "follow tag #verification"
              # ------------------------------------------------------

              if re.fullmatch(
                  r"follow\s+#?[a-z0-9_-]+",
                  lowered
              ):
                  return "follow_tag"

              if re.fullmatch(
                  r"follow\s+tag\s+#?[a-z0-9_-]+",
                  lowered
              ):
                  return "follow_tag"

              # ------------------------------------------------------
              # FOLLOW USER
              #
              # "Follow @agent"
              # "follow user @agent"
              # ------------------------------------------------------

              if re.fullmatch(
                  r"follow\s+@[a-z0-9_-]+",
                  lowered
              ):
                  return "follow_user"

              if re.fullmatch(
                  r"follow\s+user\s+@[a-z0-9_-]+",
                  lowered
              ):
                  return "follow_user"

              # ------------------------------------------------------
              # REPLY / COMMENT
              #
              # Textual replies are actions, not research.
              # Execution requires an identifiable target and body.
              # ------------------------------------------------------

              if re.search(
                  r"^\s*reply\b",
                  lowered
              ):
                  return "reply"

              if re.search(
                  r"^\s*respond\b",
                  lowered
              ):
                  return "reply"

              if re.search(
                  r"^\s*comment\b",
                  lowered
              ):
                  return "comment"

              # ------------------------------------------------------
              # CREATE POST
              # ------------------------------------------------------

              if re.search(
                  r"^\s*(create|write|publish|make)"
                  r"\s+(a\s+)?post\b",
                  lowered
              ):
                  return "create_post"

              if re.search(
                  r"^\s*post\s+to\b",
                  lowered
              ):
                  return "create_post"

              return None


          # ==========================================================
          # RESEARCH CLASSIFICATION
          # ==========================================================

          VERIFY_PATTERNS = (
              r"\bverify\s+whether\b",
              r"\bverify\s+if\b",
              r"\bverify\s+that\b",
              r"\bverification\s+of\b",
              r"\bcheck\s+whether\b",
              r"\bcheck\s+if\b",
              r"\bcheck\s+that\b",
              r"\bvalidate\s+whether\b",
              r"\bvalidate\s+if\b",
              r"\bconfirm\s+whether\b",
              r"\bconfirm\s+if\b",
              r"\bconfirm\s+that\b",
              r"\bcheck\s+the\s+paper\b",
              r"\bcheck\s+the\s+source\b",
              r"\bcheck\s+the\s+claim\b",
              r"\bcitation\s+accuracy\b",
              r"^verify\b",
          )


          RESEARCH_PATTERNS = (
              r"^research\b",
              r"\bresearch\s+whether\b",
              r"\bresearch\s+how\b",
              r"\bresearch\s+why\b",
              r"\binvestigate\b",
              r"\bfind\s+out\b",
              r"\blook\s+up\b",
              r"\bwhat\s+is\b",
              r"\bwhat\s+are\b",
              r"\bhow\s+does\b",
              r"\bhow\s+do\b",
              r"\bwhy\s+does\b",
              r"\bwhy\s+do\b",
              r"\bcompare\b",
              r"\bfind\s+evidence\b",
          )


          def classify_work(
              question,
              original,
              source
          ):
              text = clean_text(
                  question,
                  800
              )

              lowered = text.lower()

              # ------------------------------------------------------
              # 1. ACTIONS FIRST.
              #
              # This prevents words such as "verification" inside
              # tags/usernames from hijacking the classification.
              # ------------------------------------------------------

              action = extract_explicit_action(
                  text,
                  original
              )

              if action:
                  action_details = {
                      "type": "action",
                      "action": action,
                      "confidence": "high",
                      "tool": "colony_sdk",
                      "reason": (
                          "Explicit Colony/social "
                          "action detected before "
                          "research classification."
                      ),
                  }

                  # Extract action parameters.
                  if action == "join_colony":
                      match = re.search(
                          r"join(?:\s+colony)?\s+"
                          r"(?:c/)?"
                          r"([a-z0-9][a-z0-9_-]*)",
                          lowered
                      )

                      if match:
                          action_details[
                              "colony"
                          ] = match.group(1)

                  elif action == "follow_tag":
                      match = re.search(
                          r"(?:follow(?:\s+tag)?)\s+"
                          r"#?([a-z0-9_-]+)",
                          lowered
                      )

                      if match:
                          action_details[
                              "tag"
                          ] = match.group(1)

                  elif action == "follow_user":
                      match = re.search(
                          r"(?:follow(?:\s+user)?)\s+"
                          r"@([a-z0-9_-]+)",
                          lowered
                      )

                      if match:
                          action_details[
                              "username"
                          ] = match.group(1)

                  return action_details

              # ------------------------------------------------------
              # 2. Only now inspect research language.
              #
              # A bare "#verification" no longer qualifies.
              # ------------------------------------------------------

              for pattern in VERIFY_PATTERNS:
                  if re.search(
                      pattern,
                      lowered
                  ):
                      return {
                          "type": "verify",
                          "confidence": "high",
                          "tool": "web",
                          "reason": (
                              "Explicit verification "
                              "intent detected."
                          ),
                      }

              for pattern in RESEARCH_PATTERNS:
                  if re.search(
                      pattern,
                      lowered
                  ):
                      return {
                          "type": "research",
                          "confidence": "medium",
                          "tool": "web",
                          "reason": (
                              "Explicit information-"
                              "seeking intent detected."
                          ),
                      }

              # ------------------------------------------------------
              # 3. Unknown is safer than guessing.
              # ------------------------------------------------------

              return {
                  "type": "unknown",
                  "confidence": "low",
                  "tool": "none",
                  "reason": (
                      "No supported work intent "
                      "could be established safely."
                  ),
              }


          # ==========================================================
          # KNOWLEDGE CONTEXT
          # ==========================================================

          def build_knowledge_context(
              knowledge
          ):
              context = []

              for category in (
                  "facts",
                  "experiences",
                  "hypotheses",
                  "results",
                  "learnings",
              ):
                  values = knowledge.get(
                      category,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      if isinstance(
                          item,
                          str
                      ):
                          text = clean_text(
                              item
                          )

                      elif isinstance(
                          item,
                          dict
                      ):
                          text = clean_text(
                              item.get(
                                  "summary"
                              )
                              or item.get(
                                  "text"
                              )
                              or item.get(
                                  "content"
                              )
                              or item.get(
                                  "claim"
                              )
                              or item.get(
                                  "learning"
                              )
                              or ""
                          )

                      else:
                          continue

                      if not text:
                          continue

                      context.append(
                          {
                              "type": category,
                              "text": text,
                          }
                      )

                      if (
                          len(context)
                          >= MAX_KNOWLEDGE_CONTEXT
                      ):
                          return context

              return context


          # ==========================================================
          # WEB SEARCH
          # ==========================================================

          def normalize_search_result(
              result
          ):
              if not isinstance(
                  result,
                  dict
              ):
                  return None

              title = clean_text(
                  result.get(
                      "title"
                  )
              )

              url = (
                  result.get(
                      "href"
                  )
                  or result.get(
                      "url"
                  )
                  or ""
              )

              url = str(url).strip()

              snippet = clean_text(
                  result.get(
                      "body"
                  )
                  or result.get(
                      "snippet"
                  )
                  or ""
              )

              if not title or not url:
                  return None

              if not url.startswith(
                  (
                      "http://",
                      "https://",
                  )
              ):
                  return None

              try:
                  domain = urlparse(
                      url
                  ).netloc.lower()

                  if domain.startswith(
                      "www."
                  ):
                      domain = domain[4:]

              except Exception:
                  domain = ""

              return {
                  "title": title,
                  "url": url,
                  "snippet": snippet,
                  "domain": domain,
              }


          def search_web(
              query
          ):
              print(
                  f"WEB QUERY: {query}"
              )

              try:
                  client = DDGS(
                      timeout=WEB_TIMEOUT
                  )

                  raw_results = client.text(
                      query=query,
                      region="us-en",
                      safesearch="moderate",
                      max_results=(
                          MAX_RESULTS_PER_QUERY
                      ),
                      page=1,
                      backend="auto",
                  )

              except Exception as exc:
                  print(
                      "WEB SEARCH FAILED: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )

                  return []

              if not isinstance(
                  raw_results,
                  list
              ):
                  print(
                      "WEB SEARCH INVALID"
                  )

                  return []

              print(
                  "WEB RAW RESULTS: "
                  f"{len(raw_results)}"
              )

              results = []
              seen = set()

              for raw in raw_results:
                  result = (
                      normalize_search_result(
                          raw
                      )
                  )

                  if not result:
                      continue

                  if result["url"] in seen:
                      continue

                  seen.add(
                      result["url"]
                  )

                  results.append(
                      result
                  )

                  if len(results) >= (
                      MAX_RESULTS_PER_QUERY
                  ):
                      break

              print(
                  "WEB NORMALIZED RESULTS: "
                  f"{len(results)}"
              )

              for index, result in enumerate(
                  results,
                  start=1
              ):
                  print(
                      f"WEB SOURCE {index}: "
                      f"{result['domain']} | "
                      f"{result['title']}"
                  )

              return results


          # ==========================================================
          # EVIDENCE
          # ==========================================================

          def tokens(text):
              return set(
                  re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      str(text).lower()
                  )
              )


          def overlap_score(
              question,
              result
          ):
              q = tokens(
                  question
              )

              r = tokens(
                  (
                      result.get(
                          "title",
                          ""
                      )
                      + " "
                      + result.get(
                          "snippet",
                          ""
                      )
                  )
              )

              if not q:
                  return 0.0

              return round(
                  len(q & r) / len(q),
                  3
              )


          def evidence_assessment(
              question,
              results
          ):
              domains = {
                  result.get(
                      "domain"
                  )
                  for result in results
                  if result.get(
                      "domain"
                  )
              }

              strong = [
                  result
                  for result in results
                  if overlap_score(
                      question,
                      result
                  ) >= 0.20
              ]

              if (
                  len(domains) >= 3
                  and len(strong) >= 2
              ):
                  status = (
                      "multi_source_support"
                  )

              elif (
                  len(domains) >= 2
                  and strong
              ):
                  status = (
                      "partial_support"
                  )

              elif results:
                  status = (
                      "insufficient_verification"
                  )

              else:
                  status = "no_evidence"

              return {
                  "status": status,
                  "source_count": len(
                      results
                  ),
                  "domain_count": len(
                      domains
                  ),
                  "strong_match_count": len(
                      strong
                  ),
                  "domains": sorted(
                      domains
                  ),
              }


          # ==========================================================
          # COLONY CLIENT
          # ==========================================================

          def get_client():
              if not COLONY_API_KEY:
                  return None

              return ColonyClient(
                  COLONY_API_KEY
              )


          # ==========================================================
          # ACTION PARAMETER EXTRACTION
          # ==========================================================

          def original_value(
              original,
              keys
          ):
              if not isinstance(
                  original,
                  dict
              ):
                  return ""

              for key in keys:
                  value = original.get(
                      key
                  )

                  if value is not None:
                      text = clean_text(
                          value
                      )

                      if text:
                          return text

              return ""


          def resolve_action_parameters(
              classification,
              question,
              original
          ):
              action = classification.get(
                  "action"
              )

              params = {}

              if action == "join_colony":
                  colony = (
                      classification.get(
                          "colony"
                      )
                      or original_value(
                          original,
                          (
                              "colony",
                              "colony_name",
                          )
                      )
                  )

                  if colony:
                      params[
                          "colony"
                      ] = colony

              elif action == "follow_tag":
                  tag = (
                      classification.get(
                          "tag"
                      )
                      or original_value(
                          original,
                          (
                              "tag",
                              "topic",
                          )
                      )
                  )

                  if tag:
                      params[
                          "tag"
                      ] = tag.lstrip("#")

              elif action == "follow_user":
                  username = (
                      classification.get(
                          "username"
                      )
                      or original_value(
                          original,
                          (
                              "username",
                              "handle",
                              "user",
                          )
                      )
                  )

                  if username:
                      params[
                          "username"
                      ] = username.lstrip("@")

              elif action in {
                  "reply",
                  "comment",
              }:
                  post_id = original_value(
                      original,
                      (
                          "post_id",
                          "parent_id",
                          "target_post_id",
                      )
                  )

                  body = original_value(
                      original,
                      (
                          "body",
                          "reply",
                          "response",
                          "comment",
                          "message",
                          "content",
                      )
                  )

                  params[
                      "post_id"
                  ] = post_id

                  params[
                      "body"
                  ] = body

              elif action == "create_post":
                  title = original_value(
                      original,
                      (
                          "title",
                      )
                  )

                  body = original_value(
                      original,
                      (
                          "body",
                          "content",
                          "text",
                      )
                  )

                  colony = original_value(
                      original,
                      (
                          "colony",
                          "colony_name",
                      )
                  )

                  params[
                      "title"
                  ] = title

                  params[
                      "body"
                  ] = body

                  params[
                      "colony"
                  ] = colony

              return params


          # ==========================================================
          # COLONY ACTION EXECUTION
          #
          # No guessed endpoints.
          # No raw HTTP.
          # No payment/bid/settlement.
          # ==========================================================

          def execute_action(
              classification,
              question,
              original
          ):
              action = classification.get(
                  "action"
              )

              params = resolve_action_parameters(
                  classification,
                  question,
                  original
              )

              # ------------------------------------------------------
              # Missing API key.
              # ------------------------------------------------------

              if not COLONY_API_KEY:
                  return {
                      "status": (
                          "missing_colony_api_key"
                      ),
                      "success": False,
                      "terminal": False,
                      "action": action,
                  }

              # ------------------------------------------------------
              # JOIN
              # ------------------------------------------------------

              if action == "join_colony":
                  colony = params.get(
                      "colony"
                  )

                  if not colony:
                      return {
                          "status": (
                              "missing_colony"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                      }

                  try:
                      client = get_client()

                      state = client.bootstrap()

                      member_colonies = (
                          state.get(
                              "member_colonies",
                              []
                          )
                          if isinstance(
                              state,
                              dict
                          )
                          else []
                      )

                      names = set()

                      if isinstance(
                          member_colonies,
                          list
                      ):
                          for item in (
                              member_colonies
                          ):
                              if isinstance(
                                  item,
                                  str
                              ):
                                  names.add(
                                      item.lower()
                                  )

                              elif isinstance(
                                  item,
                                  dict
                              ):
                                  for key in (
                                      "name",
                                      "slug",
                                      "colony",
                                      "id",
                                  ):
                                      value = (
                                          item.get(
                                              key
                                          )
                                      )

                                      if value:
                                          names.add(
                                              str(
                                                  value
                                              ).lower()
                                          )

                      if (
                          colony.lower()
                          in names
                      ):
                          return {
                              "status": (
                                  "already_member"
                              ),
                              "success": True,
                              "terminal": True,
                              "action": action,
                              "colony": colony,
                          }

                      response = (
                          client.join_colony(
                              colony
                          )
                      )

                      return {
                          "status": (
                              "join_requested"
                          ),
                          "success": True,
                          "terminal": True,
                          "action": action,
                          "colony": colony,
                          "response": response,
                      }

                  except ColonyRateLimitError as exc:
                      return {
                          "status": "rate_limited",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "colony": colony,
                          "retry_after": getattr(
                              exc,
                              "retry_after",
                              None
                          ),
                      }

                  except ColonyNetworkError as exc:
                      return {
                          "status": "network_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "error": str(exc),
                      }

                  except ColonyAPIError as exc:
                      return {
                          "status": "colony_api_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "status_code": getattr(
                              exc,
                              "status",
                              None
                          ),
                          "code": getattr(
                              exc,
                              "code",
                              None
                          ),
                          "error": str(exc),
                      }

              # ------------------------------------------------------
              # FOLLOW TAG
              # ------------------------------------------------------

              if action == "follow_tag":
                  tag = params.get(
                      "tag"
                  )

                  if not tag:
                      return {
                          "status": (
                              "missing_tag"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                      }

                  try:
                      client = get_client()

                      response = (
                          client.follow_tag(
                              tag
                          )
                      )

                      return {
                          "status": (
                              "tag_followed"
                          ),
                          "success": True,
                          "terminal": True,
                          "action": action,
                          "tag": tag,
                          "response": response,
                      }

                  except ColonyRateLimitError as exc:
                      return {
                          "status": "rate_limited",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "retry_after": getattr(
                              exc,
                              "retry_after",
                              None
                          ),
                      }

                  except ColonyAPIError as exc:
                      return {
                          "status": "colony_api_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "status_code": getattr(
                              exc,
                              "status",
                              None
                          ),
                          "code": getattr(
                              exc,
                              "code",
                              None
                          ),
                          "error": str(exc),
                      }

              # ------------------------------------------------------
              # FOLLOW USER
              # ------------------------------------------------------

              if action == "follow_user":
                  username = params.get(
                      "username"
                  )

                  if not username:
                      return {
                          "status": (
                              "missing_username"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                      }

                  try:
                      client = get_client()

                      response = (
                          client.follow_by_username(
                              username
                          )
                      )

                      return {
                          "status": (
                              "user_followed"
                          ),
                          "success": True,
                          "terminal": True,
                          "action": action,
                          "username": username,
                          "response": response,
                      }

                  except ColonyRateLimitError as exc:
                      return {
                          "status": "rate_limited",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "retry_after": getattr(
                              exc,
                              "retry_after",
                              None
                          ),
                      }

                  except ColonyAPIError as exc:
                      return {
                          "status": "colony_api_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "status_code": getattr(
                              exc,
                              "status",
                              None
                          ),
                          "code": getattr(
                              exc,
                              "code",
                              None
                          ),
                          "error": str(exc),
                      }

              # ------------------------------------------------------
              # COMMENT / REPLY
              #
              # The official SDK uses create_comment(post_id, body).
              #
              # We do NOT guess a target from a username or free text.
              # ------------------------------------------------------

              if action in {
                  "reply",
                  "comment",
              }:
                  post_id = params.get(
                      "post_id"
                  )

                  body = params.get(
                      "body"
                  )

                  if not post_id:
                      return {
                          "status": (
                              "missing_post_id"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "reason": (
                              "A reply target "
                              "must be supplied "
                              "explicitly."
                          ),
                      }

                  if not body:
                      return {
                          "status": (
                              "missing_reply_body"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "reason": (
                              "Reply content must "
                              "be supplied explicitly."
                          ),
                      }

                  try:
                      client = get_client()

                      response = (
                          client.create_comment(
                              post_id,
                              body
                          )
                      )

                      return {
                          "status": (
                              "comment_created"
                          ),
                          "success": True,
                          "terminal": True,
                          "action": action,
                          "post_id": post_id,
                          "response": response,
                      }

                  except ColonyRateLimitError as exc:
                      return {
                          "status": "rate_limited",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "retry_after": getattr(
                              exc,
                              "retry_after",
                              None
                          ),
                      }

                  except ColonyAPIError as exc:
                      return {
                          "status": "colony_api_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "status_code": getattr(
                              exc,
                              "status",
                              None
                          ),
                          "code": getattr(
                              exc,
                              "code",
                              None
                          ),
                          "error": str(exc),
                      }

              # ------------------------------------------------------
              # CREATE POST
              #
              # Supported by the official SDK, but only execute when
              # all required content is explicitly available.
              # ------------------------------------------------------

              if action == "create_post":
                  title = params.get(
                      "title"
                  )

                  body = params.get(
                      "body"
                  )

                  colony = params.get(
                      "colony"
                  )

                  if not title or not body:
                      return {
                          "status": (
                              "missing_post_content"
                          ),
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "reason": (
                              "Title and body "
                              "must be supplied "
                              "explicitly."
                          ),
                      }

                  try:
                      client = get_client()

                      kwargs = {
                          "title": title,
                          "body": body,
                      }

                      if colony:
                          kwargs[
                              "colony"
                          ] = colony

                      response = (
                          client.create_post(
                              **kwargs
                          )
                      )

                      return {
                          "status": (
                              "post_created"
                          ),
                          "success": True,
                          "terminal": True,
                          "action": action,
                          "response": response,
                      }

                  except ColonyRateLimitError as exc:
                      return {
                          "status": "rate_limited",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "retry_after": getattr(
                              exc,
                              "retry_after",
                              None
                          ),
                      }

                  except ColonyAPIError as exc:
                      return {
                          "status": "colony_api_error",
                          "success": False,
                          "terminal": False,
                          "action": action,
                          "status_code": getattr(
                              exc,
                              "status",
                              None
                          ),
                          "code": getattr(
                              exc,
                              "code",
                              None
                          ),
                          "error": str(exc),
                      }

              # ------------------------------------------------------
              # Nothing supported.
              # ------------------------------------------------------

              return {
                  "status": (
                      "unsupported_action"
                  ),
                  "success": False,
                  "terminal": False,
                  "action": action,
              }


          # ==========================================================
          # LOAD STATE
          # ==========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          work_state = load_json(
              WORK_FILE,
              {}
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = {}

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}

          if not isinstance(
              work_state,
              dict
          ):
              work_state = {}

          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures",
          ):
              ensure_list(
                  core_memory,
                  key
              )

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources",
          ):
              ensure_list(
                  knowledge,
                  key
              )

          completed = ensure_list(
              work_state,
              "completed"
          )

          history = ensure_list(
              work_state,
              "history"
          )


          # ==========================================================
          # SELECT WORK
          # ==========================================================

          candidates = collect_candidates(
              core_memory,
              core_runtime
          )

          completed_ids = {
              str(
                  item.get(
                      "request_id"
                  )
              )
              for item in completed
              if (
                  isinstance(
                      item,
                      dict
                  )
                  and item.get(
                      "request_id"
                  )
              )
          }

          pending = [
              item
              for item in candidates
              if item[
                  "request_id"
              ] not in completed_ids
          ]

          pending.sort(
              key=lambda item: (
                  -item.get(
                      "priority",
                      0
                  ),
                  item.get(
                      "request_id",
                      ""
                  )
              )
          )

          selected = pending[
              :MAX_WORK_ITEMS
          ]

          knowledge_context = (
              build_knowledge_context(
                  knowledge
              )
          )


          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )


          completed_now = 0
          retry_now = 0
          unknown_now = 0
          deferred_now = 0


          # ==========================================================
          # EXECUTION LOOP
          # ==========================================================

          for work in selected:
              request_id = work[
                  "request_id"
              ]

              question = work[
                  "question"
              ]

              original = work.get(
                  "original"
              )

              print("")
              print(
                  f"WORK START: {question}"
              )

              classification = (
                  classify_work(
                      question,
                      original,
                      work.get(
                          "source"
                      )
                  )
              )

              work_type = classification[
                  "type"
              ]

              print(
                  "WORK CLASSIFICATION: "
                  f"{work_type}"
                  + (
                      f" / {classification.get('action')}"
                      if classification.get(
                          "action"
                      )
                      else ""
                  )
                  + " | "
                  f"confidence="
                  f"{classification['confidence']} | "
                  f"tool="
                  f"{classification['tool']}"
              )


              result = None
              terminal = False


              # ======================================================
              # UNKNOWN
              # ======================================================

              if work_type == "unknown":
                  unknown_now += 1

                  result = {
                      "status": "unknown",
                      "success": False,
                      "reason": classification[
                          "reason"
                      ],
                  }


                  print(
                      "WORK DEFERRED: "
                      "unknown intent"
                  )


              # ======================================================
              # ACTION
              # ======================================================

              elif work_type == "action":
                  result = execute_action(
                      classification,
                      question,
                      original
                  )

                  terminal = bool(
                      result.get(
                          "terminal"
                      )
                  )

                  if terminal:
                      completed_now += 1

                  else:
                      deferred_now += 1
                      retry_now += 1


              # ======================================================
              # RESEARCH / VERIFY
              # ======================================================

              elif work_type in {
                  "research",
                  "verify",
              }:
                  results = search_web(
                      question
                  )

                  if len(results) > (
                      MAX_TOTAL_RESULTS
                  ):
                      results = results[
                          :MAX_TOTAL_RESULTS
                      ]

                  evidence = (
                      evidence_assessment(
                          question,
                          results
                      )
                  )

                  status = evidence[
                      "status"
                  ]

                  if (
                      status
                      == "multi_source_support"
                  ):
                      conclusion = (
                          "Relevant evidence "
                          "was found across "
                          "multiple independent "
                          "domains."
                      )

                      next_step = (
                          "Inspect the underlying "
                          "sources before treating "
                          "the claim as confirmed."
                      )

                  elif (
                      status
                      == "partial_support"
                  ):
                      conclusion = (
                          "Relevant evidence "
                          "was found, but "
                          "independent coverage "
                          "remains limited."
                      )

                      next_step = (
                          "Seek additional "
                          "independent evidence."
                      )

                  elif (
                      status
                      == "insufficient_verification"
                  ):
                      conclusion = (
                          "Search results were "
                          "found, but they are "
                          "insufficient for reliable "
                          "verification."
                      )

                      next_step = (
                          "Keep the work unresolved."
                      )

                  else:
                      conclusion = (
                          "No usable Web evidence "
                          "was retrieved."
                      )

                      next_step = (
                          "Retry later or refine "
                          "the research question."
                      )

                  result = {
                      "status": status,
                      "success": (
                          status
                          in {
                              "multi_source_support",
                              "partial_support",
                          }
                      ),
                      "evidence": evidence,
                      "sources": results,
                      "conclusion": conclusion,
                      "next_step": next_step,
                  }

                  if status in {
                      "multi_source_support",
                      "partial_support",
                  }:
                      terminal = True
                      completed_now += 1

                  else:
                      retry_now += 1


              # ======================================================
              # OBSERVATION RECORD
              # ======================================================

              result_id = stable_id(
                  "result",
                  (
                      request_id
                      + "|"
                      + now_iso()
                  )
              )

              work_result = {
                  "result_id": result_id,
                  "request_id": request_id,
                  "timestamp": now_iso(),
                  "question": question,
                  "source": work.get(
                      "source"
                  ),
                  "priority": work.get(
                      "priority",
                      0
                  ),
                  "classification": classification,
                  "result": result,
                  "knowledge_context_used": (
                      knowledge_context
                  ),
              }

              history.append(
                  work_result
              )


              # ======================================================
              # COMPLETION RULE
              #
              # A deferred/unknown/failed action is NOT completed.
              # A successful action is completed.
              # A research result is completed only when evidence
              # crossed the current deterministic threshold.
              # ======================================================

              if terminal:
                  completed.append(
                      {
                          "request_id": request_id,
                          "timestamp": now_iso(),
                          "status": (
                              result.get(
                                  "status",
                                  "completed"
                              )
                              if isinstance(
                                  result,
                                  dict
                              )
                              else "completed"
                          ),
                          "result_id": result_id,
                          "work_type": work_type,
                      }
                  )


              print(
                  "WORK RESULT: "
                  f"type={work_type} | "
                  f"status="
                  f"{result.get('status') if isinstance(result, dict) else 'none'}"
              )


          # ==========================================================
          # HISTORY LIMIT
          # ==========================================================

          if len(history) > MAX_HISTORY:
              history[:] = history[
                  -MAX_HISTORY:
              ]

          if len(completed) > MAX_HISTORY:
              completed[:] = completed[
                  -MAX_HISTORY:
              ]


          # ==========================================================
          # STATE
          # ==========================================================

          work_state[
              "version"
          ] = 6

          work_state[
              "last_run"
          ] = now_iso()

          work_state[
              "run_count"
          ] = int(
              work_state.get(
                  "run_count",
                  0
              )
          ) + 1

          work_state[
              "last_summary"
          ] = {
              "timestamp": now_iso(),
              "candidates": len(
                  candidates
              ),
              "selected": len(
                  selected
              ),
              "completed": completed_now,
              "retry_pending": retry_now,
              "unknown_deferred": unknown_now,
              "action_deferred": deferred_now,
              "history_size": len(
                  history
              ),
          }


          # ==========================================================
          # FACTORY OWNS ONLY ITS OWN STATE
          # ==========================================================

          save_json(
              WORK_FILE,
              work_state
          )


          # ==========================================================
          # SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX WORK FACTORY ==="
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )

          print(
              f"Work completed: "
              f"{completed_now}"
          )

          print(
              f"Work retry pending: "
              f"{retry_now}"
          )

          print(
              f"Work unknown/deferred: "
              f"{unknown_now}"
          )

          print(
              f"Work action deferred: "
              f"{deferred_now}"
          )

          print(
              f"History size: "
              f"{len(history)}"
          )

          print("")
          print(
              "=== CLASSIFY -> "
              "CHOOSE TOOL -> "
              "EXECUTE -> "
              "OBSERVE -> RESULT ==="
          )

          print(
              "=== NØX WORK FACTORY TERMINÉ ==="
          )
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: fix work action classification"
          git push
