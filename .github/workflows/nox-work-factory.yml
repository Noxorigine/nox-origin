name: NØX - Work Factory

on:
workflow_dispatch:
schedule:
- cron: "43 */3 * * *"

permissions:
contents: write

concurrency:
group: nox-work-factory
cancel-in-progress: false

env:
CORE_MEMORY_FILE: memory/nox_core_memory.json
CORE_RUNTIME_FILE: memory/nox_core_runtime.json
KNOWLEDGE_FILE: memory/nox_knowledge.json
WORK_FILE: memory/nox_work_factory.json

MAX_WORK_ITEMS_PER_RUN: "3"
MAX_WEB_RESULTS_PER_QUERY: "5"
MAX_TOTAL_WEB_RESULTS: "12"
MAX_KNOWLEDGE_CONTEXT: "20"
WEB_TIMEOUT_SECONDS: "12"
MAX_HISTORY_ITEMS: "100"

jobs:
work-factory:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Run NØX Work Factory
    run: |
      set -euo pipefail

      python3 <<'PY'
      import hashlib
      import html
      import json
      import os
      import re
      import urllib.parse
      import urllib.request
      from collections import Counter
      from datetime import datetime, timezone
      from pathlib import Path


      CORE_MEMORY_FILE = Path(
          os.environ["CORE_MEMORY_FILE"]
      )
      CORE_RUNTIME_FILE = Path(
          os.environ["CORE_RUNTIME_FILE"]
      )
      KNOWLEDGE_FILE = Path(
          os.environ["KNOWLEDGE_FILE"]
      )
      WORK_FILE = Path(
          os.environ["WORK_FILE"]
      )

      MAX_WORK_ITEMS = int(
          os.environ["MAX_WORK_ITEMS_PER_RUN"]
      )
      MAX_RESULTS_PER_QUERY = int(
          os.environ["MAX_WEB_RESULTS_PER_QUERY"]
      )
      MAX_TOTAL_RESULTS = int(
          os.environ["MAX_TOTAL_WEB_RESULTS"]
      )
      MAX_KNOWLEDGE_CONTEXT = int(
          os.environ["MAX_KNOWLEDGE_CONTEXT"]
      )
      WEB_TIMEOUT = int(
          os.environ["WEB_TIMEOUT_SECONDS"]
      )
      MAX_HISTORY = int(
          os.environ["MAX_HISTORY_ITEMS"]
      )

      NOW = datetime.now(timezone.utc).isoformat()


      # ==========================================================
      # BASIC IO
      # ==========================================================

      def load_json(path, default):
          if not path.exists():
              return default

          try:
              with path.open(
                  "r",
                  encoding="utf-8"
              ) as handle:
                  return json.load(handle)
          except Exception as exc:
              print(
                  f"WARNING: cannot read {path}: {exc}"
              )
              return default


      def save_json(path, data):
          path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          temporary = path.with_suffix(
              path.suffix + ".tmp"
          )

          with temporary.open(
              "w",
              encoding="utf-8"
          ) as handle:
              json.dump(
                  data,
                  handle,
                  ensure_ascii=False,
                  indent=2
              )

          temporary.replace(path)


      def clean_text(value, limit=1200):
          if value is None:
              return ""

          text = re.sub(
              r"\s+",
              " ",
              str(value)
          ).strip()

          return text[:limit]


      def stable_id(kind, value):
          raw = (
              f"{kind}|{value}"
              .strip()
              .lower()
          )

          return hashlib.sha256(
              raw.encode("utf-8")
          ).hexdigest()[:20]


      def first_value(item, keys):
          if not isinstance(item, dict):
              return ""

          for key in keys:
              value = clean_text(
                  item.get(key)
              )

              if value:
                  return value

          return ""


      def ensure_list(container, key):
          if not isinstance(
              container.get(key),
              list
          ):
              container[key] = []

          return container[key]


      # ==========================================================
      # LOAD STATE
      # ==========================================================

      core_memory = load_json(
          CORE_MEMORY_FILE,
          {}
      )

      if not isinstance(
          core_memory,
          dict
      ):
          core_memory = {}

      core_runtime = load_json(
          CORE_RUNTIME_FILE,
          {}
      )

      if not isinstance(
          core_runtime,
          dict
      ):
          core_runtime = {}

      knowledge = load_json(
          KNOWLEDGE_FILE,
          {}
      )

      if not isinstance(
          knowledge,
          dict
      ):
          knowledge = {}

      work_state = load_json(
          WORK_FILE,
          {}
      )

      if not isinstance(
          work_state,
          dict
      ):
          work_state = {}


      for key in (
          "observations",
          "decisions",
          "actions",
          "learnings",
          "cognitive_cases",
          "beliefs",
          "failures"
      ):
          ensure_list(
              core_memory,
              key
          )

      for key in (
          "observations",
          "facts",
          "experiences",
          "hypotheses",
          "results",
          "learnings",
          "sources"
      ):
          ensure_list(
              knowledge,
              key
          )

      ensure_list(
          work_state,
          "completed"
      )

      ensure_list(
          work_state,
          "history"
      )


      # ==========================================================
      # WORK REQUEST DISCOVERY
      #
      # The factory does not invent arbitrary research.
      #
      # It consumes explicit work signals produced by Core:
      #   - work_requests
      #   - research_requests
      #   - web_queries
      #
      # It can also recover an unresolved question from an
      # explicit cognitive case.
      # ==========================================================

      candidates = []


      def add_candidate(
          question,
          source_type,
          source_id="",
          priority=0,
          context=None
      ):
          question = clean_text(
              question,
              500
          )

          if not question:
              return

          candidates.append(
              {
                  "question": question,
                  "source_type": source_type,
                  "source_id": clean_text(
                      source_id,
                      200
                  ),
                  "priority": int(
                      priority or 0
                  ),
                  "context": (
                      context
                      if isinstance(
                          context,
                          dict
                      )
                      else {}
                  )
              }
          )


      def consume_request_collection(
          value,
          source_type
      ):
          if not isinstance(
              value,
              list
          ):
              return

          for item in value:
              if isinstance(
                  item,
                  dict
              ):
                  question = first_value(
                      item,
                      (
                          "question",
                          "query",
                          "task",
                          "problem",
                          "objective"
                      )
                  )

                  add_candidate(
                      question,
                      source_type,
                      item.get("id"),
                      item.get(
                          "priority",
                          0
                      ),
                      item
                  )

              else:
                  add_candidate(
                      item,
                      source_type
                  )


      consume_request_collection(
          core_runtime.get(
              "work_requests"
          ),
          "work_request"
      )

      consume_request_collection(
          core_runtime.get(
              "research_requests"
          ),
          "research_request"
      )

      consume_request_collection(
          core_runtime.get(
              "web_queries"
          ),
          "web_query"
      )


      # ==========================================================
      # COGNITIVE CASES
      #
      # Only unresolved cases with an explicit question/research
      # signal enter the factory.
      # ==========================================================

      for case in reversed(
          core_memory.get(
              "cognitive_cases",
              []
          )
      ):
          if not isinstance(
              case,
              dict
          ):
              continue

          status = clean_text(
              case.get(
                  "status",
                  ""
              )
          ).lower()

          if status in {
              "closed",
              "completed",
              "resolved",
              "discarded"
          }:
              continue

          question = first_value(
              case,
              (
                  "question",
                  "research_question",
                  "problem",
                  "query"
              )
          )

          if not question:
              continue

          add_candidate(
              question,
              "cognitive_case",
              case.get("id"),
              case.get(
                  "priority",
                  0
              ),
              case
          )


      # ==========================================================
      # NORMALIZE / DEDUPLICATE
      # ==========================================================

      completed_ids = {
          clean_text(item.get("request_id"))
          for item in work_state["completed"]
          if isinstance(item, dict)
      }

      unique = {}

      for candidate in candidates:
          work_id = stable_id(
              "work",
              candidate["question"]
          )

          if work_id in completed_ids:
              continue

          existing = unique.get(
              work_id
          )

          if (
              existing is None
              or candidate["priority"]
              > existing["priority"]
          ):
              candidate["id"] = work_id
              unique[work_id] = candidate

      ordered = sorted(
          unique.values(),
          key=lambda item: (
              -item["priority"],
              item["id"]
          )
      )

      work_items = ordered[
          :MAX_WORK_ITEMS
      ]


      # ==========================================================
      # KNOWLEDGE CONTEXT
      #
      # Context is used only to compare new evidence with what NØX
      # already knows. Existing knowledge is not treated as proof.
      # ==========================================================

      context_items = []

      for kind in (
          "facts",
          "experiences",
          "hypotheses",
          "results",
          "learnings"
      ):
          for item in reversed(
              knowledge.get(kind, [])
          ):
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              summary = first_value(
                  item,
                  (
                      "summary",
                      "result",
                      "lesson",
                      "learning",
                      "action"
                  )
              )

              if not summary:
                  continue

              context_items.append(
                  {
                      "kind": kind,
                      "summary": summary,
                      "evidence": item.get(
                          "evidence",
                          {}
                      )
                  }
              )

              if (
                  len(context_items)
                  >= MAX_KNOWLEDGE_CONTEXT
              ):
                  break

          if (
              len(context_items)
              >= MAX_KNOWLEDGE_CONTEXT
          ):
              break


      # ==========================================================
      # WEB SEARCH
      # ==========================================================

      def web_search(query):
          encoded = urllib.parse.urlencode(
              {"q": query}
          )

          url = (
              "https://html.duckduckgo.com/html/?"
              + encoded
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; "
                      "NOX-Work-Factory/1.0)"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=WEB_TIMEOUT
              ) as response:
                  html_body = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
          except Exception as exc:
              print(
                  f"WEB SEARCH FAILED: {exc}"
              )
              return []

          blocks = re.findall(
              r'<div[^>]+class="result[^"]*"'
              r'.*?</div>\s*</div>',
              html_body,
              flags=(
                  re.IGNORECASE
                  | re.DOTALL
              )
          )

          results = []
          seen_urls = set()

          for block in blocks:
              if (
                  len(results)
                  >= MAX_RESULTS_PER_QUERY
              ):
                  break

              title_match = re.search(
                  r'class="result__a"'
                  r'[^>]*>(.*?)</a>',
                  block,
                  flags=(
                      re.IGNORECASE
                      | re.DOTALL
                  )
              )

              url_match = re.search(
                  r'class="result__a"'
                  r'[^>]*href="([^"]+)"',
                  block,
                  flags=re.IGNORECASE
              )

              snippet_match = re.search(
                  r'class="result__snippet"'
                  r'[^>]*>(.*?)</',
                  block,
                  flags=(
                      re.IGNORECASE
                      | re.DOTALL
                  )
              )

              if (
                  not title_match
                  or not url_match
              ):
                  continue

              title = clean_text(
                  html.unescape(
                      re.sub(
                          r"<[^>]+>",
                          "",
                          title_match.group(1)
                      )
                  ),
                  300
              )

              snippet = ""

              if snippet_match:
                  snippet = clean_text(
                      html.unescape(
                          re.sub(
                              r"<[^>]+>",
                              "",
                              snippet_match.group(1)
                          )
                      ),
                      600
                  )

              result_url = urllib.parse.unquote(
                  url_match.group(1)
              )

              if not result_url.startswith(
                  ("http://", "https://")
              ):
                  continue

              if result_url in seen_urls:
                  continue

              seen_urls.add(
                  result_url
              )

              parsed = urllib.parse.urlparse(
                  result_url
              )

              domain = (
                  parsed.netloc
                  .lower()
                  .split("@")[-1]
                  .split(":")[0]
              )

              if domain.startswith(
                  "www."
              ):
                  domain = domain[4:]

              results.append(
                  {
                      "title": title,
                      "url": clean_text(
                          result_url,
                          600
                      ),
                      "snippet": snippet,
                      "domain": domain
                  }
              )

          return results


      # ==========================================================
      # TEXTUAL SIGNALS
      #
      # This is deliberately deterministic.
      # The factory does not claim semantic verification from
      # snippets. It measures evidence coverage and uncertainty.
      # ==========================================================

      def tokens(text):
          return set(
              word.lower()
              for word in re.findall(
                  r"[a-zà-ÿ0-9_-]{4,}",
                  text,
                  flags=re.IGNORECASE
              )
          )


      def overlap_score(
          question,
          result
      ):
          q = tokens(question)

          text = (
              result.get("title", "")
              + " "
              + result.get("snippet", "")
          )

          r = tokens(text)

          if not q or not r:
              return 0.0

          return round(
              len(q & r) / len(q),
              3
          )


      def evidence_assessment(
          question,
          results
      ):
          domains = {
              item.get("domain")
              for item in results
              if item.get("domain")
          }

          scored = []

          for item in results:
              score = overlap_score(
                  question,
                  item
              )

              copy = dict(item)
              copy["query_overlap"] = score
              scored.append(copy)

          strong = [
              item
              for item in scored
              if item["query_overlap"] >= 0.20
          ]

          if len(domains) >= 3 and len(strong) >= 2:
              status = "multi_source_support"

          elif len(domains) >= 2 and strong:
              status = "partial_support"

          elif results:
              status = "insufficient_verification"

          else:
              status = "no_evidence"

          return {
              "status": status,
              "source_count": len(results),
              "unique_domains": len(domains),
              "strong_matches": len(strong),
              "results": scored
          }


      # ==========================================================
      # EXECUTE WORK
      # ==========================================================

      completed_now = 0
      skipped_now = 0

      for work in work_items:
          work_id = work["id"]
          question = work["question"]

          print("")
          print(
              f"WORK START: {question}"
          )

          queries = [question]

          context_terms = []

          for item in context_items:
              summary = item["summary"]

              if (
                  len(context_terms) >= 2
              ):
                  break

              if overlap_score(
                  question,
                  {
                      "title": summary,
                      "snippet": summary
                  }
              ) > 0:
                  context_terms.append(
                      summary
                  )

          results = []
          seen_urls = set()

          for query in queries:
              for result in web_search(
                  query
              ):
                  url = result["url"]

                  if url in seen_urls:
                      continue

                  seen_urls.add(url)
                  results.append(result)

                  if (
                      len(results)
                      >= MAX_TOTAL_RESULTS
                  ):
                      break

              if (
                  len(results)
                  >= MAX_TOTAL_RESULTS
              ):
                  break

          evidence = evidence_assessment(
              question,
              results
          )

          source_domains = sorted(
              {
                  item.get("domain")
                  for item in results
                  if item.get("domain")
              }
          )

          # ------------------------------------------------------
          # Deterministic conclusion.
          #
          # The factory does not invent a factual answer.
          # It reports what the collected evidence supports.
          # ------------------------------------------------------

          if (
              evidence["status"]
              == "multi_source_support"
          ):
              conclusion = (
                  "Multiple independent domains "
                  "returned evidence relevant to "
                  "the question. This is evidence "
                  "coverage, not proof of truth."
              )

              next_step = (
                  "Compare the underlying sources "
                  "directly before treating the "
                  "claim as confirmed."
              )

          elif (
              evidence["status"]
              == "partial_support"
          ):
              conclusion = (
                  "Relevant evidence was found, "
                  "but source coverage is limited."
              )

              next_step = (
                  "Obtain additional independent "
                  "sources or run a targeted test."
              )

          elif (
              evidence["status"]
              == "insufficient_verification"
          ):
              conclusion = (
                  "Search results exist, but the "
                  "available evidence is insufficient "
                  "for verification."
              )

              next_step = (
                  "Do not promote the result to a "
                  "verified fact."
              )

          else:
              conclusion = (
                  "No usable web evidence was "
                  "retrieved."
              )

              next_step = (
                  "Retry later, refine the question, "
                  "or mark the work as unresolved."
              )

          result_id = stable_id(
              "result",
              work_id
              + "|"
              + json.dumps(
                  evidence,
                  ensure_ascii=False,
                  sort_keys=True
              )
          )

          work_result = {
              "id": result_id,
              "request_id": work_id,
              "timestamp": NOW,
              "question": question,
              "source_type": work[
                  "source_type"
              ],
              "source_id": work[
                  "source_id"
              ],
              "context": context_terms,
              "evidence_status": evidence[
                  "status"
              ],
              "source_count": evidence[
                  "source_count"
              ],
              "unique_domains": evidence[
                  "unique_domains"
              ],
              "sources": results,
              "conclusion": conclusion,
              "uncertainty": (
                  "Search-result snippets are "
                  "discovery evidence only. "
                  "No claim is promoted to a "
                  "verified fact by this workflow."
              ),
              "next_step": next_step
          }

          work_state["history"].append(
              work_result
          )

          work_state["completed"].append(
              {
                  "request_id": work_id,
                  "timestamp": NOW,
                  "status": evidence[
                      "status"
                  ],
                  "result_id": result_id
              }
          )

          completed_now += 1

          print(
              f"WORK RESULT: "
              f"{evidence['status']} | "
              f"sources={len(results)} | "
              f"domains={len(source_domains)}"
          )

      if not work_items:
          print(
              "No new explicit work request "
              "available."
          )


      # ==========================================================
      # LIMIT HISTORY
      # ==========================================================

      work_state["history"] = (
          work_state["history"]
          [-MAX_HISTORY:]
      )

      work_state["completed"] = (
          work_state["completed"]
          [-MAX_HISTORY:]
      )

      work_state["version"] = 1
      work_state["last_run"] = NOW
      work_state["run_count"] = (
          int(
              work_state.get(
                  "run_count",
                  0
              )
          )
          + 1
      )

      work_state["last_summary"] = {
          "timestamp": NOW,
          "work_available": len(
              work_items
          ),
          "work_completed": completed_now,
          "work_skipped": skipped_now
      }


      # ==========================================================
      # PERSIST ONLY THE FACTORY STATE
      #
      # Knowledge is intentionally NOT mutated here.
      #
      # Memory & Knowledge remains the consolidation layer.
      # This prevents two workflows from independently writing
      # the same knowledge library.
      # ==========================================================

      save_json(
          WORK_FILE,
          work_state
      )


      # ==========================================================
      # SUMMARY
      # ==========================================================

      print("")
      print(
          "=== NØX WORK FACTORY ==="
      )
      print(
          f"Work candidates: "
          f"{len(candidates)}"
      )
      print(
          f"Work selected: "
          f"{len(work_items)}"
      )
      print(
          f"Work completed: "
          f"{completed_now}"
      )
      print(
          f"History size: "
          f"{len(work_state['history'])}"
      )
      print("")
      print(
          "=== QUESTION -> RESEARCH -> "
          "EVIDENCE -> RESULT ==="
      )
      print(
          "=== NØX WORK FACTORY TERMINÉ ==="
      )
      PY

  - name: Commit Work Factory State
    run: |
      set -euo pipefail

      git config user.name "NØX"
      git config user.email "nox@users.noreply.github.com"

      git add memory/nox_work_factory.json

      if git diff --cached --quiet; then
        echo "No Work Factory changes to commit."
        exit 0
      fi

      git commit -m "NØX: update work factory"
      git push
