name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  EXTERNAL_AI_USED: "false"
  GEMINI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate modules
        run: |
          set -euo pipefail

          found=0
          for file in core.py self_evolution.py work_factory.py presence.py; do
            if [ -f "$file" ]; then
              python -m py_compile "$file"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "Aucun module Python détecté."
            exit 0
          fi

      - name: Run repository tests if available
        run: |
          set -euo pipefail

          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          elif [ -f test_core.py ]; then
            python -m unittest -v test_core
          else
            echo "Aucun test automatisé trouvé."
          fi

      - name: Report work factory policy
        run: |
          echo "=== NØX WORK FACTORY ==="
          echo "Python syntax checks completed."
          echo "External AI disabled."
          echo "No payment or spending operations."
          echo "No source files generated automatically."
