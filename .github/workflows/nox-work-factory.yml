name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_RESULTS: "15"
  MAX_HISTORY: "150"
  WEB_TIMEOUT_SECONDS: "20"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  work-factory:
    name: work-factory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "ddgs>=9.16.0,<10.0.0"

      - name: Run Work Factory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          from ddgs import DDGS

          print("=== NØX WORK FACTORY ===")

          NOW = datetime.now(timezone.utc)
          RUN_ID = "work-" + NOW.strftime("%Y%m%dT%H%M%SZ")

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )

          MAX_WORK = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )
          MAX_RESULTS = int(
              os.environ["MAX_RESULTS_PER_QUERY"]
          )
          MAX_TOTAL_RESULTS = int(
              os.environ["MAX_TOTAL_RESULTS"]
          )
          MAX_HISTORY = int(
              os.environ["MAX_HISTORY"]
          )
          TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8",
                  ) as f:
                      value = json.load(f)

                  return value

              except Exception as exc:
                  print(
                      f"WARNING: cannot load {path}: {exc}"
                  )
                  return default

          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with tmp.open(
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
                  f.write("\n")

              tmp.replace(path)

          def as_dict(value):
              if isinstance(value, dict):
                  return value
              return {}

          def as_list(value):
              if isinstance(value, list):
                  return value
              return []

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "question",
                      "content",
                      "body",
                      "text",
                      "title",
                      "message",
                  ):
                      if value.get(key):
                          return text(
                              value[key]
                          )

              return str(value).strip()

          def stable_id(prefix, value):
              digest = hashlib.sha256(
                  str(value).encode(
                      "utf-8"
                  )
              ).hexdigest()[:20]

              return f"{prefix}-{digest}"

          def normalize_question(value):
              question = text(value)

              question = re.sub(
                  r"\s+",
                  " ",
                  question,
              ).strip()

              question = question.strip(
                  "\"' "
              )

              return question

          def question_is_valid(question):
              """
              Reject malformed or obviously truncated research questions.

              Examples rejected:
                What are the competing claims in:
                Why does:
                What is:
                How can:
                competing claims in:
              """

              if not question:
                  return False, "empty_question"

              if len(question) < 24:
                  return False, "question_too_short"

              lowered = question.lower().strip()

              bad_exact = {
                  "what is",
                  "what are",
                  "why does",
                  "why do",
                  "why is",
                  "why are",
                  "how does",
                  "how do",
                  "how can",
                  "how should",
                  "what does",
                  "what do",
                  "which are",
                  "which is",
                  "can you explain",
              }

              if lowered.rstrip(":?. ") in bad_exact:
                  return False, "incomplete_question"

              incomplete_endings = (
                  " in:",
                  " about:",
                  " on:",
                  " for:",
                  " of:",
                  " with:",
                  " to:",
                  " from:",
                  " between:",
                  " regarding:",
                  " because:",
                  " that:",
                  " why:",
                  " how:",
                  " what:",
                  " which:",
                  " is:",
                  " are:",
                  " does:",
                  " do:",
                  " can:",
                  " should:",
              )

              for ending in incomplete_endings:
                  if lowered.endswith(ending):
                      return False, "truncated_question"

              if lowered.endswith(
                  (
                      " what",
                      " why",
                      " how",
                      " which",
                      " where",
                      " when",
                      " who",
                      " because",
                      " and",
                      " or",
                      " but",
                      " in",
                      " on",
                      " of",
                      " to",
                      " for",
                      " with",
                      " between",
                  )
              ):
                  return False, "truncated_question"

              words = lowered.split()

              if len(words) < 5:
                  return False, "too_few_words"

              return True, "valid"

          def normalize_url(url):
              if not url:
                  return ""

              try:
                  parsed = urlparse(
                      str(url).strip()
                  )

                  if parsed.scheme not in (
                      "http",
                      "https",
                  ):
                      return ""

                  if not parsed.netloc:
                      return ""

                  return (
                      parsed.scheme
                      + "://"
                      + parsed.netloc
                      + parsed.path
                  )

              except Exception:
                  return ""

          def extract_result_url(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "href",
                  "url",
                  "link",
              ):
                  value = normalize_url(
                      item.get(key)
                  )

                  if value:
                      return value

              return ""

          def extract_title(item):
              if not isinstance(item, dict):
                  return ""

              return text(
                  item.get("title")
                  or item.get("heading")
              )

          def extract_snippet(item):
              if not isinstance(item, dict):
                  return ""

              return text(
                  item.get("body")
                  or item.get("snippet")
                  or item.get("description")
              )

          def domain(url):
              try:
                  return urlparse(
                      url
                  ).netloc.lower()
              except Exception:
                  return ""

          def source_quality(url):
              host = domain(url)

              if not host:
                  return 0

              official_markers = (
                  ".gov",
                  ".edu",
                  "docs.",
                  "developer.",
                  "github.com",
                  "wikipedia.org",
              )

              if any(
                  marker in host
                  for marker in official_markers
              ):
                  return 3

              return 1

          def search_web(query):
              results = []

              try:
                  with DDGS(
                      timeout=TIMEOUT
                  ) as ddgs:

                      raw_results = ddgs.text(
                          query,
                          max_results=MAX_RESULTS,
                      )

                      for item in raw_results:
                          if not isinstance(
                              item,
                              dict,
                          ):
                              continue

                          url = extract_result_url(
                              item
                          )

                          title = extract_title(
                              item
                          )

                          snippet = extract_snippet(
                              item
                          )

                          if not url:
                              continue

                          results.append(
                              {
                                  "title": title[:500],
                                  "url": url,
                                  "domain": domain(
                                      url
                                  ),
                                  "snippet": snippet[
                                      :1500
                                  ],
                                  "quality": source_quality(
                                      url
                                  ),
                              }
                          )

              except Exception as exc:
                  print(
                      "WARNING: web search failed:",
                      exc,
                  )

              return results

          def unique_results(results):
              output = []
              seen = set()

              for item in results:
                  url = item.get("url", "")

                  key = (
                      url.lower()
                      if url
                      else (
                          item.get(
                              "title",
                              "",
                          ).lower()
                      )
                  )

                  if not key:
                      continue

                  if key in seen:
                      continue

                  seen.add(key)
                  output.append(item)

              return output

          def result_score(item):
              title = text(
                  item.get("title")
              ).lower()

              snippet = text(
                  item.get("snippet")
              ).lower()

              score = int(
                  item.get(
                      "quality",
                      0,
                  )
              )

              if title:
                  score += 1

              if snippet:
                  score += 1

              if len(snippet) >= 200:
                  score += 1

              return score

          def classify_evidence(
              results,
              question,
          ):
              if not results:
                  return (
                      "no_evidence",
                      [],
                  )

              good = [
                  item
                  for item in results
                  if result_score(item) >= 2
              ]

              domains = set(
                  item.get(
                      "domain",
                      "",
                  )
                  for item in good
                  if item.get("domain")
              )

              if len(good) >= 3 and len(
                  domains
              ) >= 2:
                  return (
                      "multi_source_support",
                      good,
                  )

              if len(good) >= 2:
                  return (
                      "partial_support",
                      good,
                  )

              return (
                  "insufficient_verification",
                  good,
              )

          def detect_conflicts(
              results,
          ):
              """
              Conservative conflict detection.

              It does not infer contradiction merely because
              sources discuss different aspects of a topic.
              """

              conflicts = []

              if len(results) < 2:
                  return conflicts

              for index, first in enumerate(
                  results
              ):
                  first_text = (
                      text(
                          first.get(
                              "snippet"
                          )
                      ).lower()
                  )

                  if not first_text:
                      continue

                  for second in results[
                      index + 1:
                  ]:
                      second_text = (
                          text(
                              second.get(
                                  "snippet"
                              )
                          ).lower()
                      )

                      if not second_text:
                          continue

                      negation_pairs = (
                          (
                              "supports",
                              "does not support",
                          ),
                          (
                              "supported",
                              "not supported",
                          ),
                          (
                              "increases",
                              "decreases",
                          ),
                          (
                              "increase",
                              "decrease",
                          ),
                          (
                              "allowed",
                              "not allowed",
                          ),
                          (
                              "required",
                              "not required",
                          ),
                      )

                      found = False

                      for positive, negative in (
                          negation_pairs
                      ):
                          if (
                              positive
                              in first_text
                              and negative
                              in second_text
                          ) or (
                              negative
                              in first_text
                              and positive
                              in second_text
                          ):
                              found = True
                              break

                      if found:
                          conflicts.append(
                              {
                                  "source_a": first.get(
                                      "url"
                                  ),
                                  "source_b": second.get(
                                      "url"
                                  ),
                                  "reason": (
                                      "Potentially "
                                      "contradictory "
                                      "claims require "
                                      "manual verification."
                                  ),
                              }
                          )

              return conflicts[:10]

          def build_conclusion(
              question,
              evidence_status,
              results,
              conflicts,
          ):
              if evidence_status == "no_evidence":
                  return (
                      "No sufficiently relevant evidence "
                      "was found for this question. "
                      "No substantive conclusion should "
                      "be asserted."
                  )

              if evidence_status == (
                  "insufficient_verification"
              ):
                  return (
                      "The available search results are "
                      "insufficient to establish a reliable "
                      "answer. The claim should remain "
                      "unverified."
                  )

              relevant = []

              for item in results[:5]:
                  snippet = text(
                      item.get("snippet")
                  )

                  if snippet:
                      relevant.append(
                          snippet
                      )

              if not relevant:
                  return (
                      "Relevant sources were found, "
                      "but their available text was "
                      "insufficient to establish a "
                      "grounded conclusion."
                  )

              strongest = relevant[0]

              if conflicts:
                  return (
                      "Multiple sources provide relevant "
                      "evidence, but at least one potential "
                      "conflict was detected. The evidence "
                      "supports only a bounded conclusion; "
                      "the conflicting claim remains "
                      "uncertain. Strongest directly relevant "
                      f"evidence: {strongest}"
                  )

              if evidence_status == (
                  "partial_support"
              ):
                  return (
                      "The available evidence provides "
                      "partial support for a bounded answer. "
                      "The result should not be treated as "
                      "fully verified. Strongest directly "
                      f"relevant evidence: {strongest}"
                  )

              return (
                  "The available evidence supports a "
                  "bounded answer to the question. "
                  "The strongest directly relevant "
                  f"evidence found indicates: {strongest}"
              )

          core_memory = as_dict(
              load_json(
                  CORE_MEMORY_FILE,
                  {},
              )
          )

          runtime = as_dict(
              load_json(
                  CORE_RUNTIME_FILE,
                  {},
              )
          )

          knowledge = as_dict(
              load_json(
                  KNOWLEDGE_FILE,
                  {},
              )
          )

          work = as_dict(
              load_json(
                  WORK_FILE,
                  {},
              )
          )

          work.setdefault(
              "pending",
              [],
          )

          work.setdefault(
              "history",
              [],
          )

          work.setdefault(
              "results",
              [],
          )

          work.setdefault(
              "failed",
              [],
          )

          work.setdefault(
              "run_count",
              0,
          )

          work["run_count"] = int(
              work.get(
                  "run_count",
                  0,
              )
          ) + 1

          pending = [
              item
              for item in as_list(
                  work.get("pending")
              )
              if isinstance(
                  item,
                  dict,
              )
          ]

          runtime_requests = [
              item
              for item in as_list(
                  runtime.get(
                      "work_requests"
                  )
              )
              if isinstance(
                  item,
                  dict,
              )
          ]

          existing_ids = set()

          for collection_name in (
              "pending",
              "history",
              "results",
              "failed",
          ):
              for item in as_list(
                  work.get(
                      collection_name
                  )
              ):
                  if isinstance(
                      item,
                      dict,
                  ):
                      work_id = text(
                          item.get(
                              "work_id"
                          )
                      )

                      if work_id:
                          existing_ids.add(
                              work_id
                          )

          # Import Core requests into Work Factory pending.
          for request in runtime_requests:
              work_id = text(
                  request.get(
                      "work_id"
                  )
              )

              if not work_id:
                  continue

              if work_id in existing_ids:
                  continue

              question = normalize_question(
                  request.get(
                      "question"
                  )
              )

              pending.append(
                  {
                      "work_id": work_id,
                      "case_id": text(
                          request.get(
                              "case_id"
                          )
                      ),
                      "created_at": text(
                          request.get(
                              "created_at"
                          )
                      )
                      or NOW.isoformat(),
                      "status": "pending",
                      "question": question,
                      "reason": text(
                          request.get(
                              "reason"
                          )
                      ),
                      "source": "core",
                  }
              )

              existing_ids.add(
                  work_id
              )

          work["pending"] = pending

          # ------------------------------------------------------------
          # Candidate selection
          # ------------------------------------------------------------

          candidates = []

          for item in work["pending"]:
              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              status = text(
                  item.get("status")
              )

              if status not in (
                  "",
                  "pending",
                  "retry",
                  "failed",
                  "needs_retry",
              ):
                  continue

              candidates.append(
                  item
              )

          # Oldest first.
          candidates.sort(
              key=lambda item: text(
                  item.get(
                      "created_at"
                  )
              )
          )

          selected = candidates[
              :MAX_WORK
          ]

          print(
              "Research candidates="
              + str(len(candidates))
              + " selected="
              + str(len(selected))
          )

          completed_ids = set()

          for result in as_list(
              work.get("results")
          ):
              if not isinstance(
                  result,
                  dict,
              ):
                  continue

              work_id = text(
                  result.get(
                      "work_id"
                  )
              )

              if work_id:
                  completed_ids.add(
                      work_id
                  )

          # ------------------------------------------------------------
          # Research
          # ------------------------------------------------------------

          for item in selected:

              work_id = text(
                  item.get(
                      "work_id"
                  )
              )

              question = normalize_question(
                  item.get(
                      "question"
                  )
              )

              print()
              print(
                  "=== RESEARCH "
                  + work_id
                  + " ==="
              )

              print(
                  "Question:",
                  question,
              )

              # --------------------------------------------------------
              # HARD INPUT VALIDATION
              # --------------------------------------------------------

              valid, validation_reason = (
                  question_is_valid(
                      question
                  )
              )

              if not valid:
                  print(
                      "Research status:",
                      "invalid_input",
                  )

                  print(
                      "Reason:",
                      validation_reason,
                  )

                  item["status"] = (
                      "needs_retry"
                  )

                  item["last_attempt"] = (
                      NOW.isoformat()
                  )

                  item["validation_error"] = (
                      validation_reason
                  )

                  item["error"] = (
                      "Research question is "
                      "empty, incomplete, or "
                      "truncated. No search "
                      "was performed."
                  )

                  failed_entry = {
                      "work_id": work_id,
                      "case_id": text(
                          item.get(
                              "case_id"
                          )
                      ),
                      "timestamp": NOW.isoformat(),
                      "status": "invalid_input",
                      "question": question,
                      "reason": validation_reason,
                      "retryable": True,
                  }

                  work["failed"].append(
                      failed_entry
                  )

                  # Keep the original pending item.
                  # The Core must repair/reissue it.
                  continue

              # --------------------------------------------------------
              # SEARCH QUERIES
              # --------------------------------------------------------

              queries = [
                  question,
                  (
                      question
                      + " verification "
                      "independent sources"
                  ),
                  (
                      question
                      + " official documentation "
                      "research"
                  ),
              ]

              clean_queries = []

              for query in queries:
                  query = normalize_question(
                      query
                  )

                  if not query:
                      continue

                  if query in clean_queries:
                      continue

                  clean_queries.append(
                      query
                  )

              all_results = []

              for query in clean_queries:
                  print(
                      "Search:",
                      query,
                  )

                  search_results = (
                      search_web(
                          query
                      )
                  )

                  all_results.extend(
                      search_results
                  )

                  if len(
                      all_results
                  ) >= MAX_TOTAL_RESULTS:
                      break

                  time.sleep(0.4)

              all_results = unique_results(
                  all_results
              )[:MAX_TOTAL_RESULTS]

              evidence_status, evidence = (
                  classify_evidence(
                      all_results,
                      question,
                  )
              )

              conflicts = (
                  detect_conflicts(
                      evidence
                  )
              )

              conclusion = build_conclusion(
                  question,
                  evidence_status,
                  evidence,
                  conflicts,
              )

              print(
                  "Research status:",
                  evidence_status,
              )

              print(
                  "Conclusion:",
                  conclusion,
              )

              # --------------------------------------------------------
              # RESULT
              # --------------------------------------------------------

              result_id = stable_id(
                  "result",
                  work_id,
              )

              result = {
                  "result_id": result_id,
                  "work_id": work_id,
                  "case_id": text(
                      item.get(
                          "case_id"
                      )
                  ),
                  "created_at": NOW.isoformat(),
                  "question": question,
                  "queries": clean_queries,
                  "evidence_status": (
                      evidence_status
                  ),
                  "facts": [
                      {
                          "title": text(
                              source.get(
                                  "title"
                              )
                          ),
                          "url": source.get(
                              "url"
                          ),
                          "domain": source.get(
                              "domain"
                          ),
                          "snippet": text(
                              source.get(
                                  "snippet"
                              )
                          ),
                      }
                      for source in evidence[
                          :10
                      ]
                  ],
                  "sources": [
                      source.get(
                          "url"
                      )
                      for source in evidence[
                          :10
                      ]
                      if source.get(
                          "url"
                      )
                  ],
                  "conflicts": conflicts,
                  "uncertainties": (
                      [
                          "Potential source conflict "
                          "requires additional verification."
                      ]
                      if conflicts
                      else (
                          [
                              "Evidence is partial."
                          ]
                          if evidence_status
                          == "partial_support"
                          else []
                      )
                  ),
                  "conclusion": conclusion,
                  "run_id": RUN_ID,
              }

              # --------------------------------------------------------
              # IMPORTANT:
              # Weak or invalid research is NOT completed.
              # --------------------------------------------------------

              if evidence_status in (
                  "multi_source_support",
                  "partial_support",
              ):
                  item["status"] = (
                      "completed"
                  )

                  item["completed_at"] = (
                      NOW.isoformat()
                  )

                  item["result_id"] = (
                      result_id
                  )

                  work["results"].append(
                      result
                  )

                  completed_ids.add(
                      work_id
                  )

              else:
                  item["status"] = (
                      "needs_retry"
                  )

                  item["last_attempt"] = (
                      NOW.isoformat()
                  )

                  item["result_id"] = (
                      result_id
                  )

                  item["retry_reason"] = (
                      evidence_status
                  )

                  work["failed"].append(
                      result
                  )

                  print(
                      "Weak evidence: "
                      "keeping work item "
                      "retryable."
                  )

          # ------------------------------------------------------------
          # Remove only completed pending items.
          # Invalid/weak items remain for retry.
          # ------------------------------------------------------------

          new_pending = []

          for item in work["pending"]:
              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              work_id = text(
                  item.get(
                      "work_id"
                  )
              )

              if work_id in completed_ids:
                  continue

              new_pending.append(
                  item
              )

          work["pending"] = new_pending

          # ------------------------------------------------------------
          # Bounds
          # ------------------------------------------------------------

          def bound(
              collection,
              limit,
          ):
              if not isinstance(
                  collection,
                  list,
              ):
                  return []

              if len(collection) <= limit:
                  return collection

              return collection[-limit:]

          work["pending"] = bound(
              work["pending"],
              MAX_HISTORY,
          )

          work["history"] = bound(
              work["history"],
              MAX_HISTORY,
          )

          work["results"] = bound(
              work["results"],
              MAX_HISTORY,
          )

          work["failed"] = bound(
              work["failed"],
              MAX_HISTORY,
          )

          # ------------------------------------------------------------
          # History entry
          # ------------------------------------------------------------

          work["history"].append(
              {
                  "run_id": RUN_ID,
                  "timestamp": NOW.isoformat(),
                  "candidates": len(
                      candidates
                  ),
                  "selected": len(
                      selected
                  ),
                  "results": len(
                      work["results"]
                  ),
                  "pending": len(
                      work["pending"]
                  ),
              }
          )

          work["history"] = bound(
              work["history"],
              MAX_HISTORY,
          )

          # ------------------------------------------------------------
          # Policy safety
          # ------------------------------------------------------------

          if os.environ.get(
              "AUTO_PAYMENT"
          ) != "false":
              raise RuntimeError(
                  "AUTO_PAYMENT policy is not false."
              )

          if os.environ.get(
              "AUTO_SPENDING"
          ) != "false":
              raise RuntimeError(
                  "AUTO_SPENDING policy is not false."
              )

          if os.environ.get(
              "EXTERNAL_AI_USED"
          ) != "false":
              raise RuntimeError(
                  "EXTERNAL_AI_USED policy is not false."
              )

          if os.environ.get(
              "GEMINI_USED"
          ) != "false":
              raise RuntimeError(
                  "GEMINI_USED policy is not false."
              )

          # ------------------------------------------------------------
          # Persist
          # ------------------------------------------------------------

          save_json(
              WORK_FILE,
              work,
          )

          print()
          print(
              "=== NØX WORK FACTORY V5 ==="
          )
          print(
              "Runs="
              + str(work["run_count"])
              + " Candidates="
              + str(len(candidates))
              + " Selected="
              + str(len(selected))
              + " Research results="
              + str(len(work["results"]))
          )

          print(
              "Pending="
              + str(len(work["pending"]))
              + " Failed/retry="
              + str(len(work["failed"]))
          )

          print(
              "Research pipeline: "
              "QUESTION -> VALIDATION -> SEARCH -> "
              "EVIDENCE -> CONFLICT CHECK -> "
              "CONCLUSION -> UNCERTAINTY -> RESULT"
          )

          print("=== WORK FACTORY COMPLETE ===")
          PY

      - name: Validate Work Factory state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "memory/nox_work_factory.json",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Missing state file: {filename}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              if not isinstance(
                  data,
                  dict,
              ):
                  raise SystemExit(
                      f"Invalid JSON object: {filename}"
                  )

              print(
                  "VALID:",
                  filename,
              )

          print(
              "Work Factory state valid."
          )
          PY

      - name: Check YAML and whitespace
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

      - name: Commit and push state
        shell: bash
        run: |
          set -euo pipefail

          git add \
            memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory state changes."
            exit 0
          fi

          git commit -m "chore(nox): update work factory state"

          git pull --rebase origin main

          git push origin HEAD:main
