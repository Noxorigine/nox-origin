name: NØX - Work Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-work-factory
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  WORK_FILE: memory/nox_work_factory.json

  MAX_WORK_ITEMS_PER_RUN: "3"
  MAX_WEB_RESULTS_PER_QUERY: "5"
  MAX_TOTAL_WEB_RESULTS: "12"
  MAX_KNOWLEDGE_CONTEXT: "20"
  WEB_TIMEOUT_SECONDS: "12"
  MAX_HISTORY_ITEMS: "100"

jobs:
  work-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install search dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade ddgs

      - name: Run NØX Work Factory
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          from ddgs import DDGS


          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])

          MAX_WORK_ITEMS_PER_RUN = int(
              os.environ["MAX_WORK_ITEMS_PER_RUN"]
          )
          MAX_WEB_RESULTS_PER_QUERY = int(
              os.environ["MAX_WEB_RESULTS_PER_QUERY"]
          )
          MAX_TOTAL_WEB_RESULTS = int(
              os.environ["MAX_TOTAL_WEB_RESULTS"]
          )
          MAX_KNOWLEDGE_CONTEXT = int(
              os.environ["MAX_KNOWLEDGE_CONTEXT"]
          )
          WEB_TIMEOUT_SECONDS = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )
          MAX_HISTORY_ITEMS = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )


          def now_iso():
              return datetime.now(
                  timezone.utc
              ).replace(
                  microsecond=0
              ).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(
                      f"LOAD FAILED: {path} | {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temp_path = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temp_path.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )
                  handle.write("\n")

              temp_path.replace(path)


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          def clean_text(value):
              if value is None:
                  return ""

              value = str(value)
              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def stable_id(prefix, value):
              normalized = re.sub(
                  r"\s+",
                  " ",
                  str(value).strip().lower()
              )

              digest = hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:16]

              return f"{prefix}-{digest}"


          def normalize_work_item(item, source):
              if isinstance(item, str):
                  question = item.strip()

                  if not question:
                      return None

                  return {
                      "request_id": stable_id(
                          "work",
                          question
                      ),
                      "question": question,
                      "priority": 0,
                      "source": source
                  }

              if not isinstance(item, dict):
                  return None

              question = ""

              for key in (
                  "question",
                  "research_question",
                  "query",
                  "problem",
                  "objective",
                  "task",
                  "title",
                  "description"
              ):
                  value = item.get(key)

                  if (
                      isinstance(value, str)
                      and value.strip()
                  ):
                      question = value.strip()
                      break

              if not question:
                  return None

              request_id = (
                  item.get("request_id")
                  or item.get("id")
                  or stable_id(
                      "work",
                      question
                  )
              )

              try:
                  priority = int(
                      item.get(
                          "priority",
                          0
                      )
                  )
              except Exception:
                  priority = 0

              return {
                  "request_id": str(
                      request_id
                  ),
                  "question": question,
                  "priority": priority,
                  "source": source,
                  "original": item
              }


          def collect_candidates(
              core_memory,
              core_runtime
          ):
              candidates = []

              for key in (
                  "work_requests",
                  "research_requests",
                  "web_queries"
              ):
                  values = core_runtime.get(
                      key,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      normalized = (
                          normalize_work_item(
                              item,
                              key
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              cognitive_cases = (
                  core_memory.get(
                      "cognitive_cases",
                      []
                  )
              )

              if isinstance(
                  cognitive_cases,
                  list
              ):
                  for case in cognitive_cases:
                      if not isinstance(
                          case,
                          dict
                      ):
                          continue

                      status = str(
                          case.get(
                              "status",
                              ""
                          )
                      ).lower()

                      if status in {
                          "closed",
                          "completed",
                          "resolved",
                          "discarded"
                      }:
                          continue

                      normalized = (
                          normalize_work_item(
                              case,
                              "cognitive_case"
                          )
                      )

                      if normalized:
                          candidates.append(
                              normalized
                          )

              deduped = {}

              for candidate in candidates:
                  request_id = (
                      candidate[
                          "request_id"
                      ]
                  )

                  if request_id not in deduped:
                      deduped[
                          request_id
                      ] = candidate
                      continue

                  existing = deduped[
                      request_id
                  ]

                  if (
                      candidate[
                          "priority"
                      ]
                      > existing[
                          "priority"
                      ]
                  ):
                      deduped[
                          request_id
                      ] = candidate

              return list(
                  deduped.values()
              )


          def build_knowledge_context(
              knowledge
          ):
              context = []

              for category in (
                  "facts",
                  "experiences",
                  "hypotheses",
                  "results",
                  "learnings"
              ):
                  values = knowledge.get(
                      category,
                      []
                  )

                  if not isinstance(
                      values,
                      list
                  ):
                      continue

                  for item in values:
                      if isinstance(
                          item,
                          str
                      ):
                          text = item.strip()

                      elif isinstance(
                          item,
                          dict
                      ):
                          text = (
                              item.get("text")
                              or item.get("content")
                              or item.get("summary")
                              or item.get("claim")
                              or item.get("learning")
                              or ""
                          )

                          if not isinstance(
                              text,
                              str
                          ):
                              text = str(text)

                          text = text.strip()

                      else:
                          continue

                      if not text:
                          continue

                      context.append(
                          {
                              "type": category,
                              "text": text
                          }
                      )

                      if (
                          len(context)
                          >= MAX_KNOWLEDGE_CONTEXT
                      ):
                          return context

              return context


          def normalize_search_result(
              result
          ):
              if not isinstance(
                  result,
                  dict
              ):
                  return None

              title = clean_text(
                  result.get("title")
              )

              url = (
                  result.get("href")
                  or result.get("url")
                  or ""
              )

              url = str(url).strip()

              snippet = clean_text(
                  result.get("body")
                  or result.get("snippet")
                  or ""
              )

              if not title or not url:
                  return None

              if not url.startswith(
                  (
                      "http://",
                      "https://"
                  )
              ):
                  return None

              try:
                  domain = urlparse(
                      url
                  ).netloc.lower()

                  if domain.startswith(
                      "www."
                  ):
                      domain = domain[4:]

              except Exception:
                  domain = ""

              return {
                  "title": title,
                  "url": url,
                  "snippet": snippet,
                  "domain": domain
              }


          def search_web(
              query,
              max_results
          ):
              print(
                  f"WEB QUERY: {query}"
              )

              try:
                  ddgs = DDGS(
                      timeout=WEB_TIMEOUT_SECONDS
                  )

                  raw_results = ddgs.text(
                      query=query,
                      region="us-en",
                      safesearch="moderate",
                      max_results=max_results,
                      page=1,
                      backend="auto"
                  )

              except Exception as exc:
                  print(
                      "WEB SEARCH FAILED: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )
                  return []

              if not isinstance(
                  raw_results,
                  list
              ):
                  print(
                      "WEB SEARCH INVALID: "
                      "backend did not return a list"
                  )
                  return []

              print(
                  "WEB RAW RESULTS: "
                  f"{len(raw_results)}"
              )

              results = []
              seen_urls = set()

              for raw_result in raw_results:
                  result = (
                      normalize_search_result(
                          raw_result
                      )
                  )

                  if not result:
                      continue

                  url = result["url"]

                  if url in seen_urls:
                      continue

                  seen_urls.add(url)
                  results.append(result)

                  if (
                      len(results)
                      >= max_results
                  ):
                      break

              print(
                  "WEB NORMALIZED RESULTS: "
                  f"{len(results)}"
              )

              for index, result in enumerate(
                  results,
                  start=1
              ):
                  print(
                      f"WEB SOURCE {index}: "
                      f"{result['domain']} | "
                      f"{result['title']}"
                  )

              return results


          def tokens(text):
              return set(
                  re.findall(
                      r"[a-zà-ÿ0-9_-]{4,}",
                      str(text).lower()
                  )
              )


          def overlap_score(
              question,
              result
          ):
              question_tokens = tokens(
                  question
              )

              result_text = (
                  f"{result.get('title', '')} "
                  f"{result.get('snippet', '')}"
              )

              result_tokens = tokens(
                  result_text
              )

              if not question_tokens:
                  return 0.0

              return len(
                  question_tokens.intersection(
                      result_tokens
                  )
              ) / len(question_tokens)


          def evidence_assessment(
              question,
              results
          ):
              domains = {
                  result.get("domain")
                  for result in results
                  if result.get("domain")
              }

              strong_matches = [
                  result
                  for result in results
                  if overlap_score(
                      question,
                      result
                  ) >= 0.20
              ]

              if (
                  len(domains) >= 3
                  and len(strong_matches) >= 2
              ):
                  status = (
                      "multi_source_support"
                  )

              elif (
                  len(domains) >= 2
                  and strong_matches
              ):
                  status = "partial_support"

              elif results:
                  status = (
                      "insufficient_verification"
                  )

              else:
                  status = "no_evidence"

              return {
                  "status": status,
                  "source_count": len(
                      results
                  ),
                  "domain_count": len(
                      domains
                  ),
                  "strong_match_count": len(
                      strong_matches
                  ),
                  "domains": sorted(
                      domains
                  )
              }


          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          work_state = load_json(
              WORK_FILE,
              {}
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = {}

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}

          if not isinstance(
              work_state,
              dict
          ):
              work_state = {}

          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings",
              "cognitive_cases",
              "beliefs",
              "failures"
          ):
              ensure_list(
                  core_memory,
                  key
              )

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              ensure_list(
                  knowledge,
                  key
              )

          completed = ensure_list(
              work_state,
              "completed"
          )

          history = ensure_list(
              work_state,
              "history"
          )

          candidates = collect_candidates(
              core_memory,
              core_runtime
          )

          completed_ids = {
              str(
                  item.get(
                      "request_id"
                  )
              )
              for item in completed
              if (
                  isinstance(
                      item,
                      dict
                  )
                  and item.get(
                      "request_id"
                  )
              )
          }

          pending = [
              candidate
              for candidate in candidates
              if candidate[
                  "request_id"
              ] not in completed_ids
          ]

          pending.sort(
              key=lambda item: (
                  -item.get(
                      "priority",
                      0
                  ),
                  item.get(
                      "request_id",
                      ""
                  )
              )
          )

          selected = pending[
              :MAX_WORK_ITEMS_PER_RUN
          ]

          knowledge_context = (
              build_knowledge_context(
                  knowledge
              )
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )

          completed_now = 0
          retry_now = 0

          for work in selected:
              request_id = work[
                  "request_id"
              ]

              question = work[
                  "question"
              ]

              print("")
              print(
                  f"WORK START: {question}"
              )

              results = search_web(
                  question,
                  MAX_WEB_RESULTS_PER_QUERY
              )

              if (
                  len(results)
                  > MAX_TOTAL_WEB_RESULTS
              ):
                  results = results[
                      :MAX_TOTAL_WEB_RESULTS
                  ]

              evidence = (
                  evidence_assessment(
                      question,
                      results
                  )
              )

              status = evidence[
                  "status"
              ]

              if (
                  status
                  == "multi_source_support"
              ):
                  conclusion = (
                      "The available search "
                      "evidence supports the "
                      "research question across "
                      "multiple independent "
                      "domains."
                  )

                  next_step = (
                      "Consolidate the supported "
                      "finding into Memory & "
                      "Knowledge after source "
                      "review."
                  )

              elif (
                  status
                  == "partial_support"
              ):
                  conclusion = (
                      "The search found relevant "
                      "evidence, but the result "
                      "is not fully verified "
                      "across independent sources."
                  )

                  next_step = (
                      "Keep the work open and "
                      "seek additional independent "
                      "evidence before treating "
                      "the finding as confirmed."
                  )

              elif (
                  status
                  == "insufficient_verification"
              ):
                  conclusion = (
                      "Search results were found, "
                      "but the available evidence "
                      "is insufficient for reliable "
                      "verification."
                  )

                  next_step = (
                      "Retry with broader or more "
                      "specific research before "
                      "considering the work resolved."
                  )

              else:
                  conclusion = (
                      "No usable search evidence "
                      "was retrieved for this work "
                      "item."
                  )

                  next_step = (
                      "Retry the research later; "
                      "the absence of evidence is "
                      "not treated as a completed "
                      "result."
                  )

              result_id = stable_id(
                  "result",
                  f"{request_id}:"
                  f"{now_iso()}"
              )

              work_result = {
                  "result_id": result_id,
                  "request_id": request_id,
                  "timestamp": now_iso(),
                  "question": question,
                  "source": work.get(
                      "source"
                  ),
                  "priority": work.get(
                      "priority",
                      0
                  ),
                  "evidence": evidence,
                  "sources": results,
                  "knowledge_context_used": (
                      knowledge_context
                  ),
                  "conclusion": conclusion,
                  "next_step": next_step,
                  "status": status
              }

              history.append(
                  work_result
              )

              if status in {
                  "multi_source_support",
                  "partial_support"
              }:
                  completed.append(
                      {
                          "request_id": (
                              request_id
                          ),
                          "timestamp": now_iso(),
                          "status": "completed",
                          "result_id": result_id
                      }
                  )

                  completed_now += 1

              else:
                  retry_now += 1

              print(
                  "WORK RESULT: "
                  f"{status} | "
                  f"sources="
                  f"{evidence['source_count']} | "
                  f"domains="
                  f"{evidence['domain_count']}"
              )

          if len(history) > MAX_HISTORY_ITEMS:
              history[:] = history[
                  -MAX_HISTORY_ITEMS:
              ]

          if len(completed) > MAX_HISTORY_ITEMS:
              completed[:] = completed[
                  -MAX_HISTORY_ITEMS:
              ]

          work_state["version"] = 4

          work_state["last_run"] = now_iso()

          work_state["run_count"] = int(
              work_state.get(
                  "run_count",
                  0
              )
          ) + 1

          work_state["last_summary"] = {
              "candidates": len(
                  candidates
              ),
              "selected": len(
                  selected
              ),
              "completed": completed_now,
              "retry_pending": retry_now,
              "history_size": len(
                  history
              )
          }

          save_json(
              WORK_FILE,
              work_state
          )

          print("")
          print(
              "=== NØX WORK FACTORY ==="
          )

          print(
              f"Work candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Work selected: "
              f"{len(selected)}"
          )

          print(
              f"Work completed: "
              f"{completed_now}"
          )

          print(
              f"Work retry pending: "
              f"{retry_now}"
          )

          print(
              f"History size: "
              f"{len(history)}"
          )

          print("")
          print(
              "=== QUESTION -> RESEARCH "
              "-> EVIDENCE -> RESULT ==="
          )

          print(
              "=== NØX WORK FACTORY TERMINÉ ==="
          )
          PY

      - name: Commit Work Factory State
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_work_factory.json

          if git diff --cached --quiet; then
            echo "No Work Factory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update work factory"
          git push
