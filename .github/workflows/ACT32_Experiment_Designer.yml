name: NØX ACT32 - Experiment Designer

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  experiment-designer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Design experiments
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load_json(path):
              try:
                  if not path.exists():
                      print(f"WARNING: missing memory file: {path}")
                      return {}
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: unable to read {path}: {exc}")
                  return {}

          def num(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          def text(value):
              return str(value).strip().lower() if value is not None else ""

          def items(value):
              return value if isinstance(value, list) else []

          act26 = load_json(
              MEMORY / "nox_act_26_active_attention.json"
          )
          act27 = load_json(
              MEMORY / "nox_act_27_relational_understanding.json"
          )
          act28 = load_json(
              MEMORY / "nox_act_28_anticipation_simulation.json"
          )
          act29 = load_json(
              MEMORY / "nox_act_29_metacognition.json"
          )
          act30 = load_json(
              MEMORY / "nox_act_30_adaptive_strategy_selection.json"
          )
          act31 = load_json(
              MEMORY / "nox_act_31_strategy_evaluation.json"
          )

          timestamp = datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # SOURCE STATE
          # ------------------------------------------------------------

          predictions = items(act28.get("predictions"))
          scenarios = items(act28.get("scenarios"))
          verification_targets = items(
              act28.get("verification_targets")
          )

          expected_outcomes = items(
              act31.get("expected_outcomes")
          )

          observed_outcomes = items(
              act31.get("observed_outcomes")
          )

          strategy_state = text(
              act31.get("strategy_state")
          )

          evaluation_status = text(
              act31.get("evaluation_status")
          )

          # ------------------------------------------------------------
          # EXPERIMENT DESIGN PRINCIPLE
          # ------------------------------------------------------------
          #
          # ACT32 does NOT claim that an experiment has happened.
          #
          # It designs an observation plan capable of producing evidence.
          #
          # Each experiment contains:
          #   - question
          #   - hypothesis
          #   - trigger
          #   - expected outcome
          #   - observation variables
          #   - comparison rule
          #   - stopping condition
          #   - evidence required by ACT31
          #
          # This makes ACT32 an active-learning layer rather than
          # another prediction generator.
          # ------------------------------------------------------------

          experiment_templates = {
              "relevant_task_detected": {
                  "domain": "marketplace",
                  "question": (
                      "When a task is judged relevant, does it actually "
                      "create a useful action opportunity for NØX?"
                  ),
                  "hypothesis": (
                      "A sufficiently relevant task creates a concrete "
                      "opportunity that can be evaluated for action."
                  ),
                  "observation_variables": [
                      "task_detected",
                      "relevance_score",
                      "task_requirements",
                      "eligibility",
                      "action_possible",
                      "action_taken",
                      "action_result",
                  ],
                  "comparison": (
                      "Compare predicted action opportunity with the "
                      "actual existence and quality of the opportunity."
                  ),
                  "stopping": (
                      "Stop after enough independent relevant-task "
                      "observations exist to compare predicted and actual "
                      "opportunities."
                  ),
                  "evidence": [
                      "task_observation",
                      "relevance_assessment",
                      "actual_actionability",
                      "result_if_action_taken",
                  ],
              },

              "change_in_motivation_or_reward": {
                  "domain": "agent_behavior",
                  "question": (
                      "Does a meaningful change in reward or motivation "
                      "correspond with an observable behavior change?"
                  ),
                  "hypothesis": (
                      "A sufficiently clear reward or motivation change "
                      "may alter participation or work behavior."
                  ),
                  "observation_variables": [
                      "baseline_behavior",
                      "reward_or_motivation_signal",
                      "post_change_behavior",
                      "behavior_difference",
                      "alternative_explanations",
                  ],
                  "comparison": (
                      "Compare behavior before and after the observed "
                      "change while recording plausible alternative causes."
                  ),
                  "stopping": (
                      "Stop when a clear before/after comparison exists "
                      "or when the observation cannot distinguish the "
                      "hypothesis from alternative explanations."
                  ),
                  "evidence": [
                      "baseline",
                      "trigger",
                      "post_trigger_observation",
                      "confounding_factors",
                  ],
              },

              "new_learning_retained": {
                  "domain": "learning",
                  "question": (
                      "Does information retained in memory produce a "
                      "measurable improvement in a later response or decision?"
                  ),
                  "hypothesis": (
                      "Retained useful information can improve a future "
                      "response when the same or related situation appears."
                  ),
                  "observation_variables": [
                      "information_acquired",
                      "memory_recorded",
                      "later_related_situation",
                      "response_before_learning",
                      "response_after_learning",
                      "improvement",
                  ],
                  "comparison": (
                      "Compare the later response with the earlier state "
                      "and determine whether the retained information "
                      "actually contributed to the change."
                  ),
                  "stopping": (
                      "Stop after a later related situation allows a "
                      "before/after comparison."
                  ),
                  "evidence": [
                      "learning_event",
                      "memory_entry",
                      "later_application",
                      "response_change",
                  ],
              },

              "related_domain_event": {
                  "domain": "knowledge",
                  "question": (
                      "Does a shared domain actually make two events "
                      "contextually relevant to one another?"
                  ),
                  "hypothesis": (
                      "Events sharing a domain may deserve joint attention, "
                      "but shared domain alone does not prove relevance "
                      "or causation."
                  ),
                  "observation_variables": [
                      "event_a",
                      "event_b",
                      "shared_domain",
                      "explicit_relation",
                      "independent_evidence",
                      "useful_contextual_link",
                  ],
                  "comparison": (
                      "Compare domain similarity with independently "
                      "supported contextual relationships."
                  ),
                  "stopping": (
                      "Stop when enough paired events exist to determine "
                      "whether shared-domain selection produces useful "
                      "context or excessive false connections."
                  ),
                  "evidence": [
                      "paired_events",
                      "domain_match",
                      "independent_relation",
                      "usefulness_assessment",
                  ],
              },

              "reward_or_incentive_change": {
                  "domain": "work_behavior",
                  "question": (
                      "Does an observable change in incentive correspond "
                      "with a measurable change in work participation?"
                  ),
                  "hypothesis": (
                      "A meaningful incentive change may alter work "
                      "participation or prioritization."
                  ),
                  "observation_variables": [
                      "baseline_participation",
                      "incentive_change",
                      "post_change_participation",
                      "task_selection_change",
                      "alternative_causes",
                  ],
                  "comparison": (
                      "Compare participation and task selection before "
                      "and after the incentive change."
                  ),
                  "stopping": (
                      "Stop when the relationship is either supported by "
                      "repeated observations or remains indistinguishable "
                      "from alternative explanations."
                  ),
                  "evidence": [
                      "baseline_behavior",
                      "incentive_signal",
                      "post_change_behavior",
                      "alternative_explanations",
                  ],
              },

              "agent_communication": {
                  "domain": "agent_collaboration",
                  "question": (
                      "Does successful communication actually increase "
                      "the possibility of coordination?"
                  ),
                  "hypothesis": (
                      "Clear information exchange can create an observable "
                      "coordination opportunity."
                  ),
                  "observation_variables": [
                      "communication_attempt",
                      "message_received",
                      "information_shared",
                      "response",
                      "coordination_attempt",
                      "coordination_result",
                  ],
                  "comparison": (
                      "Compare communication events with subsequent "
                      "coordination outcomes."
                  ),
                  "stopping": (
                      "Stop after enough communication events exist to "
                      "separate successful information transfer from "
                      "actual coordination."
                  ),
                  "evidence": [
                      "message_event",
                      "delivery_or_response",
                      "coordination_attempt",
                      "coordination_result",
                  ],
              },

              "new_relevant_information": {
                  "domain": "knowledge_update",
                  "question": (
                      "Does new relevant information actually change "
                      "NØX's understanding or decision?"
                  ),
                  "hypothesis": (
                      "Relevant new information should sometimes produce "
                      "a measurable belief, priority or strategy update."
                  ),
                  "observation_variables": [
                      "prior_understanding",
                      "new_information",
                      "relevance",
                      "post_information_understanding",
                      "belief_update",
                      "decision_update",
                  ],
                  "comparison": (
                      "Compare the recorded state before and after "
                      "the information was integrated."
                  ),
                  "stopping": (
                      "Stop after a clear information-to-update chain "
                      "has been observed."
                  ),
                  "evidence": [
                      "prior_state",
                      "information_event",
                      "updated_state",
                      "reason_for_update",
                  ],
              },

              "interaction_with_another_agent": {
                  "domain": "agent_learning",
                  "question": (
                      "Does interaction with another agent produce "
                      "information that changes later understanding?"
                  ),
                  "hypothesis": (
                      "Useful interaction can produce information that "
                      "changes a future response, model or priority."
                  ),
                  "observation_variables": [
                      "interaction",
                      "information_received",
                      "information_quality",
                      "memory_update",
                      "later_application",
                      "learning_result",
                  ],
                  "comparison": (
                      "Compare the state before interaction with the "
                      "state after the information is retained and used."
                  ),
                  "stopping": (
                      "Stop after at least one interaction produces a "
                      "traceable later application or fails to do so."
                  ),
                  "evidence": [
                      "interaction_event",
                      "new_information",
                      "memory_update",
                      "later_use",
                  ],
              },

              "security_constraint": {
                  "domain": "security",
                  "question": (
                      "Does a security or authorization constraint "
                      "actually prevent or alter execution?"
                  ),
                  "hypothesis": (
                      "A genuine security constraint can change the "
                      "available action space."
                  ),
                  "observation_variables": [
                      "intended_action",
                      "constraint",
                      "authorization_state",
                      "blocked_or_modified",
                      "alternative_action",
                  ],
                  "comparison": (
                      "Compare intended action with the action actually "
                      "permitted after the constraint is applied."
                  ),
                  "stopping": (
                      "Stop after the constraint produces a documented "
                      "blocked, modified or permitted outcome."
                  ),
                  "evidence": [
                      "intended_action",
                      "constraint",
                      "actual_permission",
                      "actual_result",
                  ],
              },

              "communication_event": {
                  "domain": "information_transfer",
                  "question": (
                      "Does successful communication make information "
                      "available for later interpretation or action?"
                  ),
                  "hypothesis": (
                      "Successful communication can create an information "
                      "state that did not previously exist."
                  ),
                  "observation_variables": [
                      "communication_event",
                      "message_content",
                      "delivery",
                      "information_received",
                      "later_use",
                  ],
                  "comparison": (
                      "Compare information available before communication "
                      "with information available afterward."
                  ),
                  "stopping": (
                      "Stop when information transfer and its later "
                      "availability can be explicitly demonstrated."
                  ),
                  "evidence": [
                      "before_information_state",
                      "communication",
                      "after_information_state",
                      "later_use",
                  ],
              },
          }

          # ------------------------------------------------------------
          # BUILD CANDIDATE EXPERIMENTS
          # ------------------------------------------------------------

          candidates = []

          for index, prediction in enumerate(predictions, start=1):
              if not isinstance(prediction, dict):
                  continue

              prediction_id = (
                  prediction.get("prediction_id")
                  or f"P{index:03d}"
              )

              trigger = (
                  prediction.get("trigger_to_watch")
                  or prediction.get("trigger")
                  or ""
              )

              expected = (
                  prediction.get("expected_consequence")
                  or prediction.get("expected_outcome")
                  or ""
              )

              prediction_text = (
                  prediction.get("prediction")
                  or prediction.get("description")
                  or ""
              )

              priority = num(
                  prediction.get("priority"),
                  0.0,
              )

              template = experiment_templates.get(trigger)

              if template is None:
                  template = {
                      "domain": "general",
                      "question": (
                          "Can this prediction be tested through "
                          "direct observation?"
                      ),
                      "hypothesis": prediction_text,
                      "observation_variables": [
                          "trigger",
                          "expected_consequence",
                          "actual_outcome",
                          "alternative_explanations",
                      ],
                      "comparison": (
                          "Compare the expected consequence with the "
                          "actual observed consequence."
                      ),
                      "stopping": (
                          "Stop when an explicit expected-versus-actual "
                          "comparison can be recorded."
                      ),
                      "evidence": [
                          "trigger",
                          "expected_outcome",
                          "actual_outcome",
                      ],
                  }

              candidate = {
                  "experiment_id": f"EXP{index:03d}",
                  "prediction_id": prediction_id,
                  "priority": priority,
                  "trigger_to_watch": trigger,
                  "expected_consequence": expected,
                  "prediction": prediction_text,
                  "domain": template["domain"],
                  "question": template["question"],
                  "hypothesis": template["hypothesis"],
                  "observation_variables": template[
                      "observation_variables"
                  ],
                  "comparison_rule": template["comparison"],
                  "stopping_condition": template["stopping"],
                  "required_evidence": template["evidence"],
                  "reversibility": "high",
                  "cost": "zero",
                  "requires_payment": False,
                  "requires_gemini": False,
                  "requires_external_paid_ai": False,
              }

              candidates.append(candidate)

          # ------------------------------------------------------------
          # EXPERIMENT PRIORITIZATION
          # ------------------------------------------------------------

          def experiment_score(exp):
              score = 0.0

              # Prediction priority.
              score += min(
                  30.0,
                  num(exp.get("priority")) * 0.30
              )

              # Evidence gap is currently large because ACT31 has no
              # observed outcomes.
              if not observed_outcomes:
                  score += 25.0

              # Prefer experiments that can be observed directly.
              direct_domains = {
                  "marketplace",
                  "agent_collaboration",
                  "knowledge_update",
                  "agent_learning",
                  "information_transfer",
              }

              if exp["domain"] in direct_domains:
                  score += 20.0

              # High reversibility.
              if exp["reversibility"] == "high":
                  score += 10.0

              # Zero cost.
              if exp["cost"] == "zero":
                  score += 10.0

              # No external paid AI.
              if not exp["requires_external_paid_ai"]:
                  score += 5.0

              return round(score, 2)

          for candidate in candidates:
              candidate["experiment_score"] = experiment_score(
                  candidate
              )

          candidates.sort(
              key=lambda item: (
                  item["experiment_score"],
                  item["priority"],
              ),
              reverse=True,
          )

          # Assign ranks after sorting.
          for rank, candidate in enumerate(candidates, start=1):
              candidate["rank"] = rank

          # ------------------------------------------------------------
          # SELECT BEST EXPERIMENT
          # ------------------------------------------------------------

          selected_experiment = (
              candidates[0]
              if candidates
              else None
          )

          # ------------------------------------------------------------
          # DESIGN QUALITY
          # ------------------------------------------------------------

          design_quality_checks = []

          for candidate in candidates:
              design_quality_checks.append(
                  bool(candidate.get("question"))
              )
              design_quality_checks.append(
                  bool(candidate.get("hypothesis"))
              )
              design_quality_checks.append(
                  bool(candidate.get("observation_variables"))
              )
              design_quality_checks.append(
                  bool(candidate.get("comparison_rule"))
              )
              design_quality_checks.append(
                  bool(candidate.get("stopping_condition"))
              )
              design_quality_checks.append(
                  bool(candidate.get("required_evidence"))
              )

          if design_quality_checks:
              design_quality = round(
                  100.0
                  * sum(design_quality_checks)
                  / len(design_quality_checks),
                  2,
              )
          else:
              design_quality = 0.0

          # ------------------------------------------------------------
          # EXPERIMENTAL RULES
          # ------------------------------------------------------------

          experimental_rules = [
              "an_experiment_design_is_not_an_experiment_result",
              "a_prediction_is_not_evidence",
              "an_observation_must_be_recorded_before_evaluation",
              "expected_and_actual_outcomes_must_be_distinguishable",
              "alternative_explanations_should_be_recorded",
              "experiments_should_be_reversible_when_possible",
              "experiments_should_not_require_spending",
              "experiments_should_not_require_gemini",
          ]

          # ------------------------------------------------------------
          # LEARNING
          # ------------------------------------------------------------

          learning = [
              (
                  "NØX can identify missing evidence instead of "
                  "pretending that existing predictions are sufficient."
              ),
              (
                  "NØX can transform an epistemic gap into a concrete "
                  "observation plan."
              ),
              (
                  "A useful experiment needs a question, hypothesis, "
                  "observable variables, comparison rule and stopping condition."
              ),
          ]

          if selected_experiment:
              learning.append(
                  (
                      "NØX can prioritize experiments according to "
                      "expected learning value, evidence gap, reversibility "
                      "and zero-cost constraints."
                  )
              )

          # ------------------------------------------------------------
          # NEXT STEP
          # ------------------------------------------------------------

          if selected_experiment:
              next_action = "execute_or_collect_selected_experiment"
          else:
              next_action = "collect_more_testable_predictions"

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          memory = {
              "act": "ACT32",
              "name": "Experiment Designer",
              "timestamp": timestamp,
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Design controlled, observable and reversible "
                  "experiments that generate the missing evidence "
                  "identified by ACT31."
              ),

              "principle": (
                  "When evidence is missing, NØX should not guess. "
                  "It should design an experiment capable of producing "
                  "the evidence required for evaluation."
              ),

              "source_act": "ACT31",

              "starting_state": {
                  "strategy": act31.get("selected_strategy"),
                  "strategy_state": strategy_state,
                  "evaluation_status": evaluation_status,
                  "observed_outcomes": len(observed_outcomes),
                  "expected_outcomes": len(expected_outcomes),
                  "evidence_quality": num(
                      act31.get("evidence_quality")
                  ),
              },

              "predictions_available": len(predictions),
              "scenarios_available": len(scenarios),
              "verification_targets_available": len(
                  verification_targets
              ),

              "candidate_experiments": candidates,

              "candidate_experiment_count": len(candidates),

              "selected_experiment": selected_experiment,

              "selection_logic": {
                  "primary_factors": [
                      "evidence_gap",
                      "prediction_priority",
                      "direct_observability",
                      "learning_value",
                      "reversibility",
                      "zero_cost",
                  ],
                  "selection_is_provisional": True,
              },

              "design_quality": design_quality,

              "experimental_rules": experimental_rules,

              "learning": learning,

              "next_action": next_action,

              "next_cognitive_step": (
                  "The selected experiment should produce explicit "
                  "observations that ACT31 can compare with the expected "
                  "outcome."
              ),
          }

          output = (
              MEMORY /
              "nox_act_32_experiment_designer.json"
          )

          with output.open("w", encoding="utf-8") as f:
              json.dump(
                  memory,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )

          # ------------------------------------------------------------
          # CONSOLE REPORT
          # ------------------------------------------------------------

          print("")
          print("========================================")
          print("NØX ACT32 - EXPERIMENT DESIGNER")
          print("========================================")

          print("")
          print("INPUT STATE:")
          print(
              f"- ACT31 strategy state: "
              f"{strategy_state or 'unknown'}"
          )
          print(
              f"- ACT31 evaluation: "
              f"{evaluation_status or 'unknown'}"
          )
          print(
              f"- Expected outcomes: "
              f"{len(expected_outcomes)}"
          )
          print(
              f"- Observed outcomes: "
              f"{len(observed_outcomes)}"
          )

          print("")
          print("EXPERIMENT DESIGN:")
          print(
              f"- Predictions analysed: "
              f"{len(predictions)}"
          )
          print(
              f"- Candidate experiments: "
              f"{len(candidates)}"
          )
          print(
              f"- Design quality: "
              f"{design_quality:.2f}"
          )

          if selected_experiment:
              print("")
              print("SELECTED EXPERIMENT:")
              print(
                  f"- ID: "
                  f"{selected_experiment['experiment_id']}"
              )
              print(
                  f"- Prediction: "
                  f"{selected_experiment['prediction_id']}"
              )
              print(
                  f"- Domain: "
                  f"{selected_experiment['domain']}"
              )
              print(
                  f"- Score: "
                  f"{selected_experiment['experiment_score']:.2f}"
              )
              print(
                  f"- Question: "
                  f"{selected_experiment['question']}"
              )
              print(
                  f"- Expected: "
                  f"{selected_experiment['expected_consequence']}"
              )

          print("")
          print("NEXT ACTION:")
          print(f"- {next_action}")

          print("")
          print("RULE:")
          print(
              "- ACT32 designs the experiment; "
              "it does not pretend the experiment already happened."
          )

          print("")
          print(
              f"Memory written: {output}"
          )
          print("ACT32 COMPLETE")
          PY

      - name: Commit ACT32 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_32_experiment_designer.json

          if git diff --cached --quiet; then
            echo "No ACT32 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT32 Experiment Designer"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              git reset --hard origin/main

              git add memory/nox_act_32_experiment_designer.json

              git commit \
                -m "NØX ACT32 Experiment Designer" || true
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep $((attempt * 3))
          done

          echo "ERROR: unable to push ACT32 after retries."
          exit 1
