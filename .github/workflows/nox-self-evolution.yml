name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  EVOLUTION_FILE: "memory/nox_self_evolution.json"
  CORE_RUNTIME_FILE: "memory/nox_core_runtime.json"
  WORK_FILE: "memory/nox_work_factory.json"
  PRESENCE_FILE: "memory/nox_colony_presence.json"
  MAX_HISTORY: "200"
  MIN_REPEATED_FAILURES: "2"
  PENDING_BACKLOG_ALERT: "50"
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run self evolution diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Shared helpers for all NØX scripts (standard library only)."""
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from itertools import islice
          from pathlib import Path

          OWN_USERNAME = (os.environ.get("NOX_USERNAME") or "nox_origine").strip().lower()

          # ---------------------------------------------------------------- time / env
          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def parse_ts(value):
              if not value or not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          def env_flag(name, default=False):
              value = os.environ.get(name)
              if value is None or value.strip() == "":
                  return default
              return value.strip().lower() in {"1", "true", "yes", "on"}

          def check_policy():
              """Hard safety invariants: no spending, no payments, no external AI."""
              expected = {
                  "PROJECT_COST_EUR": "0",
                  "GEMINI_USED": "false",
                  "EXTERNAL_AI_USED": "false",
                  "AUTO_PAYMENT": "false",
                  "AUTO_SPENDING": "false",
              }
              for key, wanted in expected.items():
                  if os.environ.get(key, wanted).strip().lower() != wanted:
                      raise SystemExit(f"Unsafe policy: {key} must be {wanted}")

          # ---------------------------------------------------------------- json files
          def load_json(path, default=None):
              """Load a JSON object. Refuses to continue on corrupt files so that a
              parse error can never silently wipe the agent's state."""
              path = Path(path)
              default = {} if default is None else default
              if not path.exists():
                  return default
              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  return default
              try:
                  value = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {path} is not valid JSON ({exc}). "
                      "Restore it from git history; refusing to overwrite it."
                  )
              return value if isinstance(value, type(default)) else default

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(value, ensure_ascii=False, indent=2, default=str) + "\n"
              json.loads(payload)  # round-trip check
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          # ---------------------------------------------------------------- data utils
          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value, limit=None):
              if value is None:
                  out = ""
              elif isinstance(value, str):
                  out = value.strip()
              elif isinstance(value, dict):
                  out = ""
                  for key in ("content", "body", "text", "message", "title", "question"):
                      if value.get(key):
                          out = text(value[key])
                          break
                  if not out:
                      out = json.dumps(value, ensure_ascii=False, default=str)
              else:
                  out = str(value).strip()
              return out[:limit] if limit else out

          def collapse(value, limit=None):
              out = re.sub(r"\s+", " ", text(value)).strip()
              return out[:limit] if limit else out

          def clip(value, limit):
              out = text(value)
              return out if len(out) <= limit else out[: limit - 1].rstrip() + "…"

          def stable_id(prefix, *parts):
              raw = "|".join(str(p if p is not None else "") for p in parts)
              return f"{prefix}:{hashlib.sha256(raw.encode('utf-8')).hexdigest()[:16]}"

          def identity(item):
              """Stable identity of a stored item (id-like key, else content hash)."""
              if isinstance(item, dict):
                  for key in ("id", "action_id", "work_id", "result_id", "message_id", "post_id", "url"):
                      if item.get(key):
                          return f"{key}:{item[key]}"
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True, default=str)
              return "hash:" + hashlib.sha256(raw.encode("utf-8")).hexdigest()

          def dedupe_keep_last(items, limit=None):
              """Remove duplicates (keeping the most recent occurrence) and keep list
              order chronological (oldest first). Optionally keep only the last N."""
              seen, out = set(), []
              for item in reversed(items):
                  key = identity(item)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(item)
              out.reverse()
              return out[-limit:] if limit else out

          def bound(items, limit):
              items = as_list(items)
              return items[-limit:] if len(items) > limit else items

          def take(value, n=None):
              """Turn SDK results (list / dict / generator) into a bounded list."""
              if value is None:
                  return []
              if isinstance(value, dict):
                  for key in ("items", "data", "results", "posts", "notifications", "messages", "conversations"):
                      if isinstance(value.get(key), list):
                          value = value[key]
                          break
                  else:
                      return []
              if isinstance(value, (list, tuple)):
                  return list(value)[:n] if n else list(value)
              try:
                  iterator = iter(value)
              except TypeError:
                  return []
              return list(islice(iterator, n)) if n else list(iterator)

          def username_of(obj):
              """Lower-cased username of an object or of a nested author/sender."""
              if not isinstance(obj, dict):
                  return ""
              for key in ("username", "handle", "author_username", "sender_username"):
                  if obj.get(key):
                      return str(obj[key]).strip().lower()
              for key in ("author", "user", "sender", "bidder", "agent", "other_user"):
                  nested = obj.get(key)
                  if isinstance(nested, dict):
                      found = username_of(nested)
                      if found:
                          return found
                  elif isinstance(nested, str) and nested.strip():
                      return nested.strip().lower()
              return ""

          # ===== script =====
          """NØX Self Evolution (diagnostic mode).

          The old version tried to patch .github/workflows files. That can never be pushed
          with the default GITHUB_TOKEN (needs a PAT with `workflow` scope), and its rules
          targeted fields that no longer exist. This version is deliberately safe:
          it reads the real failure signals, groups repeated problems, and records
          concrete recommendations. It never edits code or workflows.
          """
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          check_policy()
          NOW = now_iso()
          EVO = Path(os.environ["EVOLUTION_FILE"])
          PRESENCE = Path(os.environ["PRESENCE_FILE"])
          WORK = Path(os.environ["WORK_FILE"])
          RUNTIME = Path(os.environ["CORE_RUNTIME_FILE"])
          MIN_REPEATED = env_int("MIN_REPEATED_FAILURES", 2)
          MAX_HISTORY = env_int("MAX_HISTORY", 200)
          BACKLOG_LIMIT = env_int("PENDING_BACKLOG_ALERT", 50)

          evolution = as_dict(load_json(EVO))
          evolution.setdefault("version", 6)
          evolution.setdefault("history", [])
          evolution.setdefault("runs", [])
          presence, work, runtime = (as_dict(load_json(p)) for p in (PRESENCE, WORK, RUNTIME))

          signals = []
          for o in as_list(presence.get("outcomes"))[-200:]:
              if isinstance(o, dict) and not o.get("success"):
                  signals.append(("presence", text(o.get("status")), text(o.get("error"))))
          for f in as_list(work.get("failed"))[-200:]:
              if isinstance(f, dict):
                  signals.append(("work", text(f.get("status") or f.get("evidence_status")), text(f.get("reason"))))

          groups = {}
          for source, status, error in signals:
              norm_err = re.sub(r"\d+", "#", error.lower())[:80]
              key = f"{source}|{status}|{norm_err}"
              groups[key] = groups.get(key, 0) + 1

          ADVICE = [
              (("duplicate", "409", "already_replied"), "Duplicate publication attempts: check that Core ids are stable and that presence.closed_ids is being filled."),
              (("self_reply", "self_message"), "NØX tried to answer itself: check OWN username filtering in Core."),
              (("invalid_input", "truncated", "too_short", "too_few_words"), "Core produces incomplete research questions: review make_question in Core."),
              (("no_evidence", "insufficient_verification", "weak_evidence"), "Searches return little relevant evidence: questions may be too vague or the search backend is degraded."),
              (("permanent_failure", "not found", "404", "403", "forbidden"), "Targets deleted or forbidden: expected occasionally; investigate only if frequent."),
              (("429", "rate"), "Rate limiting: lower MAX_PUBLIC_PER_HOUR / MAX_ACTIONS_PER_RUN."),
              (("missing_body", "missing_recipient", "missing_post_target"), "Core generates incomplete actions: check add_action inputs."),
          ]

          findings = []
          for key, count in sorted(groups.items(), key=lambda kv: -kv[1]):
              if count < MIN_REPEATED:
                  continue
              source, status, err = key.split("|", 2)
              advice = next((a for words, a in ADVICE if any(w in key.lower() for w in words)),
                            "Repeated failure without a known rule; inspect the workflow logs.")
              findings.append({"source": source, "status": status, "error": err, "count": count, "recommendation": advice})

          pending = [a for a in as_list(runtime.get("pending_actions")) if isinstance(a, dict)]
          if len(pending) > BACKLOG_LIMIT:
              findings.append({"source": "runtime", "status": "backlog", "error": "", "count": len(pending),
                               "recommendation": "Action backlog is growing: Core creates more actions than Presence executes. "
                                                 "Lower MAX_NEW_CASES_PER_RUN or raise MAX_ACTIONS_PER_RUN."})

          signature = hashlib.sha256(json.dumps([(f["source"], f["status"], f["error"]) for f in findings]).encode()).hexdigest()[:16]
          last = as_list(evolution["runs"])[-1] if evolution["runs"] else {}
          if isinstance(last, dict) and last.get("signature") == signature:
              print("Findings unchanged; nothing to record.")
              raise SystemExit(0)

          run = {"timestamp": NOW, "status": "observed" if findings else "no_candidate", "signature": signature,
                 "decision": "RECOMMENDATIONS_ONLY" if findings else "NO_EVOLUTION", "findings": findings}
          evolution["runs"] = bound(evolution["runs"] + [run], MAX_HISTORY)
          if findings:
              evolution["history"] = bound(evolution["history"] + [run], MAX_HISTORY)
          evolution["updated_at"] = NOW
          save_json(EVO, evolution)
          print("=== NØX SELF EVOLUTION ===")
          for f in findings:
              print(f"- [{f['count']}x] {f['source']}/{f['status']}: {f['recommendation']}")
          print("RESULT:", run["decision"])
          PY

      - name: Validate JSON state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          for path in ["memory/nox_self_evolution.json"]:
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
                  print("VALID JSON:", path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          for f in memory/nox_self_evolution.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(nox): self evolution diagnostics"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after retries."
          exit 1
