name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  EXTERNAL_AI_USED: "false"
  GEMINI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  evolution-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit and record findings
        run: |
          set -euo pipefail
          mkdir -p memory

          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path(".")
          files = [
              Path(name)
              for name in (
                  "core.py",
                  "self_evolution.py",
                  "work_factory.py",
                  "presence.py",
              )
              if Path(name).is_file()
          ]

          signatures = {}
          for path in files:
              signatures[str(path)] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          report = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "files_detected": [str(path) for path in files],
              "sha256": signatures,
              "external_ai_used": False,
              "project_cost_eur": 0,
              "automatic_payment": False,
              "automatic_spending": False,
              "source_changes_require_human_approval": True,
              "status": "audit_completed",
          }

          destination = Path("memory/nox_evolution_audit.json")
          destination.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          found=0
          for file in core.py self_evolution.py work_factory.py presence.py; do
            if [ -f "$file" ]; then
              python -m py_compile "$file"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "Aucun module Python à vérifier."
          fi

      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox-agent@users.noreply.github.com"

          git add memory/nox_evolution_audit.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(nox): record self evolution audit"
            git push
          else
            echo "Rapport inchangé."
          fi
