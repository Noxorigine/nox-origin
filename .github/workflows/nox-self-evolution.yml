
name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

jobs:
  self-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract lessons and proposals
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          FACTORY_PATH = ROOT / "memory/nox_work_factory.json"
          PRESENCE_PATH = ROOT / "memory/nox_colony_presence.json"
          RUNTIME_PATH = ROOT / "memory/nox_core_runtime.json"
          EVOLUTION_PATH = ROOT / "memory/nox_self_evolution.json"
          NOW = datetime.now(timezone.utc).isoformat(timespec="seconds")
          MAX_ITEMS = 500

          def read_object(path):
              if not path.exists():
                  return {}
              with path.open("r", encoding="utf-8") as file:
                  value = json.load(file)
              if not isinstance(value, dict):
                  raise ValueError(f"{path}: la racine JSON doit être un objet")
              return value

          def write_object(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_suffix(path.suffix + ".tmp")
              with temporary.open("w", encoding="utf-8") as file:
                  json.dump(value, file, ensure_ascii=False, indent=2)
                  file.write("\n")
              temporary.replace(path)

          def fingerprint(value):
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, default=str
              )
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:24]

          factory = read_object(FACTORY_PATH)
          presence = read_object(PRESENCE_PATH)
          runtime = read_object(RUNTIME_PATH)
          evolution = read_object(EVOLUTION_PATH)

          for key in ("lessons", "proposals", "processed_signatures", "runs"):
              if not isinstance(evolution.get(key), list):
                  evolution[key] = []

          known = set(evolution["processed_signatures"])
          new_lessons = 0
          new_proposals = 0

          history = factory.get("history", [])
          if not isinstance(history, list):
              history = []

          for entry in history[-200:]:
              if not isinstance(entry, dict):
                  continue

              status = str(entry.get("status", "unknown"))
              task_id = entry.get("task_id") or (
                  entry.get("task", {}).get("id")
                  if isinstance(entry.get("task"), dict) else None
              )
              signature = fingerprint({
                  "source": "work_factory",
                  "task_id": task_id,
                  "status": status,
                  "error": entry.get("error"),
                  "result_id": entry.get("result_id"),
              })

              if signature in known:
                  continue

              known.add(signature)

              if status == "completed":
                  lesson = {
                      "id": "lesson_" + signature,
                      "timestamp": NOW,
                      "source": "work_factory",
                      "category": "successful_algorithm",
                      "task_id": task_id,
                      "lesson": (
                          "La recherche a terminé sans erreur. "
                          "Conserver la requête, les sources et le résultat "
                          "pour pouvoir reproduire et vérifier cette méthode."
                      ),
                      "evidence": {
                          "source_count": entry.get("source_count"),
                          "result_id": entry.get("result_id"),
                      },
                      "confidence": "limited",
                  }
                  evolution["lessons"].append(lesson)
                  new_lessons += 1

              elif status == "failed":
                  lesson = {
                      "id": "lesson_" + signature,
                      "timestamp": NOW,
                      "source": "work_factory",
                      "category": "error",
                      "task_id": task_id,
                      "lesson": (
                          "La tâche a échoué. Examiner le message d'erreur "
                          "avant de réessayer ; ne pas considérer l'échec "
                          "comme un résultat de recherche."
                      ),
                      "error": str(entry.get("error", "Erreur non détaillée"))[:500],
                      "confidence": "observed",
                  }
                  evolution["lessons"].append(lesson)
                  new_lessons += 1

                  proposal_id = "proposal_" + signature
                  if not any(
                      item.get("id") == proposal_id
                      for item in evolution["proposals"]
                      if isinstance(item, dict)
                  ):
                      evolution["proposals"].append({
                          "id": proposal_id,
                          "created_at": NOW,
                          "status": "pending_human_review",
                          "source": "work_factory",
                          "problem": lesson["error"],
                          "suggestion": (
                              "Analyser la cause de l'échec et proposer "
                              "un test de régression avant toute modification."
                          ),
                          "requires_human_approval": True,
                          "code_modified": False,
                      })
                      new_proposals += 1

          presence_errors = presence.get("errors", [])
          if isinstance(presence_errors, list):
              for error in presence_errors[-100:]:
                  if not isinstance(error, dict):
                      continue

                  signature = fingerprint({
                      "source": "presence",
                      "error": error,
                  })
                  if signature in known:
                      continue
                  known.add(signature)

                  evolution["lessons"].append({
                      "id": "lesson_" + signature,
                      "timestamp": NOW,
                      "source": "presence",
                      "category": "error",
                      "lesson": (
                          "Une opération de présence a signalé une erreur. "
                          "Examiner le contexte et vérifier si elle se répète."
                      ),
                      "evidence": error,
                      "confidence": "observed",
                  })
                  new_lessons += 1

          # Détecter les répétitions sans prétendre connaître leur cause.
          error_counts = {}
          for lesson in evolution["lessons"]:
              if not isinstance(lesson, dict):
                  continue
              if lesson.get("category") != "error":
                  continue
              message = str(
                  lesson.get("error")
                  or lesson.get("evidence", {}).get("error", "")
              ).strip()
              if message:
                  error_counts[message] = error_counts.get(message, 0) + 1

          for message, count in error_counts.items():
              if count < 3:
                  continue

              signature = fingerprint({
                  "repeated_error": message,
                  "count_threshold": 3,
              })
              proposal_id = "proposal_" + signature

              if any(
                  item.get("id") == proposal_id
                  for item in evolution["proposals"]
                  if isinstance(item, dict)
              ):
                  continue

              evolution["proposals"].append({
                  "id": proposal_id,
                  "created_at": NOW,
                  "status": "pending_human_review",
                  "source": "repeated_error_analysis",
                  "problem": message[:500],
                  "occurrences": count,
                  "suggestion": (
                      "Reproduire l'erreur, identifier sa cause et ajouter "
                      "un test de régression avant de proposer un correctif."
                  ),
                  "requires_human_approval": True,
                  "code_modified": False,
              })
              new_proposals += 1

          evolution["processed_signatures"] = list(known)[-MAX_ITEMS:]
          evolution["lessons"] = evolution["lessons"][-MAX_ITEMS:]
          evolution["proposals"] = evolution["proposals"][-MAX_ITEMS:]

          run = {
              "timestamp": NOW,
              "status": "success",
              "new_lessons": new_lessons,
              "new_proposals": new_proposals,
              "core_last_status": runtime.get("last_status"),
              "external_ai_used": False,
              "code_modified": False,
              "requires_human_approval": True,
          }
          evolution["runs"].append(run)
          evolution["runs"] = evolution["runs"][-100:]
          evolution["last_run"] = run

          write_object(EVOLUTION_PATH, evolution)

          print("=== NØX SELF EVOLUTION ===")
          print("Nouvelles leçons:", new_lessons)
          print("Nouvelles propositions:", new_proposals)
          print("Modifications de code: aucune")
          print("Validation humaine: obligatoire")
          PY

      - name: Commit evolution memory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/nox_self_evolution.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle leçon à enregistrer."
            exit 0
          fi
          git commit -m "chore(nox): record evolution lessons"
          git push
