name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-self-evolution
  cancel-in-progress: false

env:
  EVOLUTION_FILE: memory/nox_self_evolution.json
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json

  GEMINI_MODEL: gemini-3.7-flash

  MAX_HISTORY: "200"
  MAX_PATCHES: "8"
  MAX_CONTEXT_CHARS: "24000"
  MAX_FILE_CHARS: "500000"

jobs:
  self-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evolution dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "google-genai>=1.0.0,<2.0.0" "pyyaml>=6.0,<7.0"

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git diff --check

      - name: Run NØX Self Evolution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          try:
              from google import genai
          except Exception:
              genai = None

          ROOT = Path.cwd()
          NOW = datetime.now(timezone.utc).isoformat()

          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_PATCHES = int(os.environ["MAX_PATCHES"])
          MAX_CONTEXT_CHARS = int(os.environ["MAX_CONTEXT_CHARS"])
          MAX_FILE_CHARS = int(os.environ["MAX_FILE_CHARS"])

          GEMINI_API_KEY = os.environ.get(
              "GEMINI_API_KEY",
              "",
          ).strip()

          GEMINI_MODEL = os.environ[
              "GEMINI_MODEL"
          ]

          EVOLUTION_FILE = Path(
              os.environ["EVOLUTION_FILE"]
          )
          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          PRESENCE_FILE = Path(
              os.environ["PRESENCE_FILE"]
          )

          # ============================================================
          # SELF-EVOLUTION PERIMETER
          # ============================================================

          ALLOWED_TARGETS = {
              ".github/workflows/nox-core-general.yml",
              ".github/workflows/nox-work-factory.yml",
              ".github/workflows/nox-colony-presence.yml",
              ".github/workflows/nox-evolution-monitor.yml",
              "memory/nox_core_memory.json",
              "memory/nox_core_runtime.json",
              "memory/nox_work_factory.json",
              "memory/nox_knowledge.json",
              "memory/nox_colony_presence.json",
              "memory/nox_evolution_report.md",
          }

          FORBIDDEN_TARGETS = {
              ".github/workflows/nox-self-evolution.yml",
              ".github/workflows/nox-action-opportunities.yml",
          }

          # ============================================================
          # UTILITIES
          # ============================================================

          def clean(value, limit=6000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]


          def stable(*parts):
              raw = "|".join(
                  clean(part, 12000)
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def load_json(path, default):
              if not path.exists():
                  return json.loads(
                      json.dumps(default)
                  )

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return json.loads(
                      json.dumps(default)
                  )

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )

                  return json.loads(
                      json.dumps(default)
                  )


          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          def read_full(path):
              if not path.exists():
                  return ""

              size = path.stat().st_size

              if size > MAX_FILE_CHARS:
                  raise RuntimeError(
                      f"Target file exceeds safety limit: "
                      f"{path} ({size} bytes)"
                  )

              return path.read_text(
                  encoding="utf-8"
              )


          def read_for_context(path):
              """
              Large memory files are NOT copied in full into the
              reasoning prompt.

              This is critical because Presence memory grows over time.
              The complete file remains available for exact patch
              validation, while the reasoning engine receives a bounded
              representation.
              """

              if not path.exists():
                  return ""

              text = path.read_text(
                  encoding="utf-8"
              )

              if len(text) <= MAX_CONTEXT_CHARS:
                  return text

              head_size = MAX_CONTEXT_CHARS // 3
              tail_size = (
                  MAX_CONTEXT_CHARS
                  - head_size
              )

              head = text[:head_size]
              tail = text[-tail_size:]

              return (
                  head
                  + "\n\n"
                  + "[... MIDDLE OF FILE OMITTED "
                  "FROM REASONING CONTEXT ...]\n\n"
                  + tail
              )


          def file_hash(path):
              if not path.exists():
                  return None

              return hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()


          def run_git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  capture_output=True,
                  check=False,
              )

              if (
                  check
                  and result.returncode != 0
              ):
                  raise RuntimeError(
                      f"git {' '.join(args)} failed: "
                      f"{result.stdout[-2000:]} "
                      f"{result.stderr[-2000:]}"
                  )

              return result


          def safe_target(path):
              normalized = (
                  str(path)
                  .replace("\\", "/")
                  .lstrip("./")
              )

              if normalized in FORBIDDEN_TARGETS:
                  return False

              if normalized not in ALLOWED_TARGETS:
                  return False

              candidate = (
                  ROOT / normalized
              ).resolve()

              try:
                  candidate.relative_to(ROOT)
              except ValueError:
                  return False

              return True


          # ============================================================
          # LOAD NØX STATE
          # ============================================================

          memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          work = load_json(
              WORK_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )

          presence = load_json(
              PRESENCE_FILE,
              {},
          )

          evolution = load_json(
              EVOLUTION_FILE,
              {
                  "version": 1,
                  "history": [],
                  "runs": [],
              },
          )

          evolution.setdefault(
              "version",
              1,
          )

          evolution.setdefault(
              "history",
              [],
          )

          evolution.setdefault(
              "runs",
              [],
          )

          # ============================================================
          # DETECTION
          # ============================================================

          signals = []

          for item in memory.get(
              "failures",
              [],
          )[-40:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "core_failure",
                          "data": item,
                      }
                  )

          for item in memory.get(
              "learnings",
              [],
          )[-40:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "core_learning",
                          "data": item,
                      }
                  )

          for item in runtime.get(
              "evolution_requests",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "evolution_request",
                          "data": item,
                      }
                  )

          for item in runtime.get(
              "cognitive_gaps",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "cognitive_gap",
                          "data": item,
                      }
                  )

          for item in work.get(
              "history",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  status = str(
                      item.get(
                          "evidence_status",
                          "",
                      )
                  ).lower()

                  if status in {
                      "insufficient_verification",
                      "partial_support",
                  }:
                      signals.append(
                          {
                              "source": "work_factory",
                              "data": item,
                          }
                      )

          for item in presence.get(
              "outcomes",
              [],
          )[-30:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "presence_outcome",
                          "data": item,
                      }
                  )

          known_signatures = {
              item.get(
                  "signal_signature"
              )
              for item in evolution[
                  "history"
              ]
              if isinstance(item, dict)
          }

          candidates = []

          for signal in signals:
              signature = stable(
                  signal.get(
                      "source"
                  ),
                  json.dumps(
                      signal.get(
                          "data",
                          {},
                      ),
                      ensure_ascii=False,
                      sort_keys=True,
                  ),
              )

              if signature in known_signatures:
                  continue

              candidates.append(
                  {
                      **signal,
                      "signature": signature,
                  }
              )

          print(
              f"Detected signals: {len(signals)}"
          )

          print(
              f"New evolution candidates: "
              f"{len(candidates)}"
          )

          # ============================================================
          # NO NEW EVOLUTION
          # ============================================================

          if not candidates:
              evolution["runs"].append(
                  {
                      "timestamp": NOW,
                      "status": (
                          "no_new_candidate"
                      ),
                      "signals": len(signals),
                  }
              )

              evolution["runs"] = (
                  evolution["runs"]
              )[-MAX_HISTORY:]

              evolution[
                  "updated_at"
              ] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution,
              )

              print(
                  "No modification required."
              )

              sys.exit(0)

          candidate = candidates[0]

          # ============================================================
          # REASONING CONTEXT
          # ============================================================

          context_files = {}

          for target in sorted(
              ALLOWED_TARGETS
          ):
              path = ROOT / target

              if not path.exists():
                  continue

              if target == str(
                  EVOLUTION_FILE
              ):
                  continue

              context_files[target] = (
                  read_for_context(path)
              )

          reasoning_context = {
              "timestamp": NOW,
              "candidate": candidate,
              "recent_failures": memory.get(
                  "failures",
                  [],
              )[-15:],
              "recent_learnings": memory.get(
                  "learnings",
                  [],
              )[-15:],
              "recent_cognitive_cases": memory.get(
                  "cognitive_cases",
                  [],
              )[-15:],
              "work_factory_history": work.get(
                  "history",
                  [],
              )[-10:],
              "knowledge": knowledge,
              "presence_recent_outcomes": presence.get(
                  "outcomes",
                  [],
              )[-10:],
              "runtime": {
                  "run_count": runtime.get(
                      "run_count"
                  ),
                  "last_run": runtime.get(
                      "last_run"
                  ),
                  "evolution_requests": runtime.get(
                      "evolution_requests",
                      [],
                  )[-10:],
              },
              "files": context_files,
          }

          # ============================================================
          # GEMINI DECISION
          # ============================================================

          prompt = {
              "role": (
                  "NØX Self Evolution Engine"
              ),
              "mission": (
                  "Diagnose one concrete weakness "
                  "from evidence and, only when "
                  "justified, prepare the smallest "
                  "safe repository modification."
              ),
              "context": reasoning_context,
              "rules": [
                  "Use evidence, not assumptions.",
                  "If evidence is insufficient, do not evolve.",
                  "One evolution case per run.",
                  "Maximum 3 target files.",
                  "Maximum 8 patches.",
                  "Never modify the Self Evolution workflow.",
                  "Never modify Action & Opportunities.",
                  "Never modify secrets or credentials.",
                  "Never modify repository settings.",
                  "Never introduce automatic spending or payment.",
                  "Preserve working behavior.",
                  "Prefer a precise patch to a rewrite.",
                  "Every old patch string must occur exactly once.",
                  "Every patch must have a reason.",
                  "Every change must have a test.",
                  "The result must remain reversible through git history.",
              ],
              "allowed_targets": sorted(
                  ALLOWED_TARGETS
              ),
              "output": {
                  "should_evolve": "boolean",
                  "problem": "string",
                  "hypothesis": "string",
                  "decision": "string",
                  "expected_result": "string",
                  "targets": [
                      "string"
                  ],
                  "patches": [
                      {
                          "path": "string",
                          "old": "string",
                          "new": "string",
                          "reason": "string",
                      }
                  ],
                  "tests": [
                      "string"
                  ],
                  "learning": "string",
              },
          }

          plan = None
          planner_error = None

          if (
              genai is not None
              and GEMINI_API_KEY
          ):
              try:
                  client = genai.Client(
                      api_key=GEMINI_API_KEY
                  )

                  response = (
                      client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=json.dumps(
                              prompt,
                              ensure_ascii=False,
                          ),
                          config={
                              "temperature": 0.1,
                              "response_mime_type": (
                                  "application/json"
                              ),
                          },
                      )
                  )

                  plan = json.loads(
                      response.text
                  )

              except Exception as exc:
                  planner_error = clean(
                      exc,
                      2000,
                  )

          if not isinstance(
              plan,
              dict,
          ):
              plan = {
                  "should_evolve": False,
                  "problem": "",
                  "hypothesis": "",
                  "decision": (
                      "No valid evolution "
                      "decision was produced."
                  ),
                  "expected_result": "",
                  "targets": [],
                  "patches": [],
                  "tests": [],
                  "learning": "",
              }

          patches = plan.get(
              "patches",
              [],
          )

          if not isinstance(
              patches,
              list,
          ):
              patches = []

          # ============================================================
          # DECISION: NO EVOLUTION
          # ============================================================

          if (
              plan.get(
                  "should_evolve"
              )
              is not True
              or not patches
          ):
              evolution_id = stable(
                  NOW,
                  candidate[
                      "signature"
                  ],
              )

              evolution["history"].append(
                  {
                      "id": evolution_id,
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "signal_signature": (
                          candidate[
                              "signature"
                          ]
                      ),
                      "problem": clean(
                          plan.get(
                              "problem"
                          ),
                          4000,
                      ),
                      "hypothesis": clean(
                          plan.get(
                              "hypothesis"
                          ),
                          4000,
                      ),
                      "decision": clean(
                          plan.get(
                              "decision"
                          ),
                          4000,
                      ),
                      "planner_error": (
                          planner_error
                      ),
                  }
              )

              evolution["history"] = (
                  evolution["history"]
              )[-MAX_HISTORY:]

              evolution["runs"].append(
                  {
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "evolution_id": (
                          evolution_id
                      ),
                  }
              )

              evolution["runs"] = (
                  evolution["runs"]
              )[-MAX_HISTORY:]

              evolution[
                  "updated_at"
              ] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution,
              )

              print(
                  "Decision: NO EVOLUTION"
              )

              sys.exit(0)

          # ============================================================
          # PATCH VALIDATION
          # ============================================================

          if len(patches) > MAX_PATCHES:
              raise RuntimeError(
                  "Too many patches."
              )

          normalized = []

          for patch in patches:
              if not isinstance(
                  patch,
                  dict,
              ):
                  raise RuntimeError(
                      "Invalid patch object."
                  )

              path = (
                  str(
                      patch.get(
                          "path",
                          "",
                      )
                  )
                  .replace("\\", "/")
                  .lstrip("./")
              )

              old = str(
                  patch.get(
                      "old",
                      "",
                  )
              )

              new = str(
                  patch.get(
                      "new",
                      "",
                  )
              )

              reason = clean(
                  patch.get(
                      "reason",
                      "",
                  ),
                  3000,
              )

              if not safe_target(path):
                  raise RuntimeError(
                      f"Forbidden target: {path}"
                  )

              if not old.strip():
                  raise RuntimeError(
                      f"Empty old patch: {path}"
                  )

              if old == new:
                  raise RuntimeError(
                      f"No-op patch: {path}"
                  )

              current = read_full(
                  ROOT / path
              )

              occurrences = current.count(
                  old
              )

              if occurrences != 1:
                  raise RuntimeError(
                      f"Patch for {path} "
                      f"has {occurrences} matches; "
                      f"exactly 1 required."
                  )

              normalized.append(
                  {
                      "path": path,
                      "old": old,
                      "new": new,
                      "reason": reason,
                  }
              )

          target_paths = sorted(
              {
                  item["path"]
                  for item in normalized
              }
          )

          if len(target_paths) > 3:
              raise RuntimeError(
                  "More than 3 target files."
              )

          evolution_id = stable(
              NOW,
              candidate[
                  "signature"
              ],
              json.dumps(
                  normalized,
                  ensure_ascii=False,
                  sort_keys=True,
              ),
          )

          before_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # APPLY EXACT PATCHES
          # ============================================================

          for patch in normalized:
              path = ROOT / patch["path"]

              current = path.read_text(
                  encoding="utf-8"
              )

              updated = current.replace(
                  patch["old"],
                  patch["new"],
                  1,
              )

              if updated == current:
                  raise RuntimeError(
                      f"No change produced: "
                      f"{patch['path']}"
                  )

              path.write_text(
                  updated,
                  encoding="utf-8",
              )

          # ============================================================
          # TEST 1 — YAML
          # ============================================================

          for path in target_paths:
              if path.endswith(
                  (".yml", ".yaml")
              ):
                  with open(
                      ROOT / path,
                      "r",
                      encoding="utf-8",
                  ) as handle:
                      yaml.safe_load(handle)

          # ============================================================
          # TEST 2 — EMBEDDED PYTHON
          # ============================================================

          for path in target_paths:
              if not path.endswith(
                  (".yml", ".yaml")
              ):
                  continue

              text = read_full(
                  ROOT / path
              )

              blocks = re.findall(
                  r"""python3\s+-\s+<<['"]?PY['"]?\s*\n(.*?)\n\s*PY\s*$""",
                  text,
                  flags=(
                      re.MULTILINE
                      | re.DOTALL
                  ),
              )

              for index, block in enumerate(
                  blocks,
                  1,
              ):
                  compile(
                      block,
                      (
                          f"{path}:"
                          f"embedded-python:"
                          f"{index}"
                      ),
                      "exec",
                  )

          # ============================================================
          # TEST 3 — JSON
          # ============================================================

          for path in target_paths:
              if path.endswith(
                  ".json"
              ):
                  json.loads(
                      read_full(
                          ROOT / path
                      )
                  )

          # ============================================================
          # TEST 4 — SECURITY POLICIES
          # ============================================================

          for path in target_paths:
              text = read_full(
                  ROOT / path
              )

              lowered = text.lower()

              if (
                  "auto_payment"
                  in lowered
                  and "auto_payment: true"
                  in lowered
              ):
                  raise RuntimeError(
                      f"Payment policy enabled: {path}"
                  )

              if (
                  "auto_spending"
                  in lowered
                  and "auto_spending: true"
                  in lowered
              ):
                  raise RuntimeError(
                      f"Spending policy enabled: {path}"
                  )

          # ============================================================
          # TEST 5 — GIT DIFF
          # ============================================================

          run_git(
              "diff",
              "--check",
          )

          diff = run_git(
              "diff",
              "--",
              *target_paths,
          ).stdout

          if not diff.strip():
              raise RuntimeError(
                  "Evolution produced no diff."
              )

          if len(diff) > 120000:
              raise RuntimeError(
                  "Evolution diff is too large."
              )

          after_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # RECORD TESTED EVOLUTION
          # ============================================================

          evolution["history"].append(
              {
                  "id": evolution_id,
                  "timestamp": NOW,
                  "status": "tested",
                  "signal_signature": (
                      candidate[
                          "signature"
                      ]
                  ),
                  "problem": clean(
                      plan.get(
                          "problem",
                          "",
                      ),
                      4000,
                  ),
                  "hypothesis": clean(
                      plan.get(
                          "hypothesis",
                          "",
                      ),
                      4000,
                  ),
                  "decision": clean(
                      plan.get(
                          "decision",
                          "",
                      ),
                      4000,
                  ),
                  "expected_result": clean(
                      plan.get(
                          "expected_result",
                          "",
                      ),
                      4000,
                  ),
                  "targets": target_paths,
                  "patches": [
                      {
                          "path": item[
                              "path"
                          ],
                          "reason": item[
                              "reason"
                          ],
                      }
                      for item in normalized
                  ],
                  "before_hashes": (
                      before_hashes
                  ),
                  "after_hashes": (
                      after_hashes
                  ),
                  "tests": {
                      "yaml": "passed",
                      "embedded_python": (
                          "passed"
                      ),
                      "json": "passed",
                      "security": "passed",
                      "git_diff_check": (
                          "passed"
                      ),
                  },
                  "learning": clean(
                      plan.get(
                          "learning",
                          "",
                      ),
                      4000,
                  ),
              }
          )

          evolution["history"] = (
              evolution["history"]
          )[-MAX_HISTORY:]

          evolution[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
              evolution,
          )

          # ============================================================
          # COMMIT MODIFICATION
          # ============================================================

          run_git(
              "config",
              "user.name",
              "NØX",
          )

          run_git(
              "config",
              "user.email",
              "nox@users.noreply.github.com",
          )

          run_git(
              "add",
              *target_paths,
              str(EVOLUTION_FILE),
          )

          staged = run_git(
              "diff",
              "--cached",
              "--quiet",
              check=False,
          )

          if staged.returncode == 0:
              raise RuntimeError(
                  "Nothing staged after evolution."
              )

          run_git(
              "commit",
              "-m",
              (
                  "NØX: self evolution "
                  f"{evolution_id}"
              ),
          )

          run_git(
              "push",
              "origin",
              "HEAD:main",
          )

          commit_sha = run_git(
              "rev-parse",
              "HEAD",
          ).stdout.strip()

          # ============================================================
          # FINAL RESULT
          # ============================================================

          evolution = load_json(
              EVOLUTION_FILE,
              {
                  "version": 1,
                  "history": [],
                  "runs": [],
              },
          )

          for entry in reversed(
              evolution.get(
                  "history",
                  [],
              )
          ):
              if entry.get(
                  "id"
              ) == evolution_id:
                  entry[
                      "status"
                  ] = "committed"

                  entry[
                      "commit"
                  ] = commit_sha

                  entry[
                      "result"
                  ] = (
                      "modification_committed"
                  )

                  break

          evolution.setdefault(
              "runs",
              [],
          )

          evolution["runs"].append(
              {
                  "timestamp": NOW,
                  "status": "committed",
                  "evolution_id": (
                      evolution_id
                  ),
                  "commit": commit_sha,
                  "changed_paths": (
                      target_paths
                  ),
              }
          )

          evolution["runs"] = (
              evolution["runs"]
          )[-MAX_HISTORY:]

          evolution[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
              evolution,
          )

          run_git(
              "add",
              str(EVOLUTION_FILE),
          )

          staged_result = run_git(
              "diff",
              "--cached",
              "--quiet",
              check=False,
          )

          if staged_result.returncode != 0:
              run_git(
                  "commit",
                  "-m",
                  (
                      "NØX: record self evolution "
                      f"result {evolution_id}"
                  ),
              )

              run_git(
                  "push",
                  "origin",
                  "HEAD:main",
              )

          print("")
          print(
              "=== NØX SELF EVOLUTION ==="
          )
          print(
              f"Evolution ID: {evolution_id}"
          )
          print(
              "Changed files: "
              + ", ".join(
                  target_paths
              )
          )
          print(
              "YAML: PASSED"
          )
          print(
              "Embedded Python: PASSED"
          )
          print(
              "JSON: PASSED"
          )
          print(
              "Security: PASSED"
          )
          print(
              "Git diff: PASSED"
          )
          print(
              f"Commit: {commit_sha}"
          )
          print(
              "RESULT: MODIFICATION COMMITTED"
          )
          print(
              "CYCLE: "
              "DETECT -> RESEARCH -> DECIDE -> "
              "MODIFY -> TEST -> RESULT -> LEARN"
          )
          PY
