name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-self-evolution
  cancel-in-progress: false

env:
  EVOLUTION_FILE: memory/nox_self_evolution.json
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json

  GEMINI_MODEL: gemini-3.7-flash

  MAX_HISTORY: "200"
  MAX_PATCHES: "8"
  MAX_CONTEXT_CHARS: "24000"
  MAX_FILE_CHARS: "500000"

  # Structural health thresholds.
  MAX_RUNTIME_BYTES: "400000"
  MAX_PRESENCE_BYTES: "400000"
  MAX_WORK_BYTES: "400000"
  MAX_MEMORY_BYTES: "400000"
  MAX_KNOWLEDGE_BYTES: "400000"

  MAX_PENDING_ACTIONS: "30"
  MAX_WORK_REQUESTS: "150"
  MAX_CASES: "150"
  MAX_MEMORY_CONTEXT_CHARS: "30000"

  DUPLICATE_PUBLISH_THRESHOLD: "2"
  DUPLICATE_WORK_REQUEST_THRESHOLD: "3"

  COLLECTION_WARNING_RATIO: "0.90"

jobs:
  self-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evolution dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "google-genai>=1.0.0,<2.0.0" "pyyaml>=6.0,<7.0"

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git diff --check

      - name: Run NØX Self Evolution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          try:
              from google import genai
          except Exception:
              genai = None

          ROOT = Path.cwd()
          NOW = datetime.now(timezone.utc).isoformat()

          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_PATCHES = int(os.environ["MAX_PATCHES"])
          MAX_CONTEXT_CHARS = int(
              os.environ["MAX_CONTEXT_CHARS"]
          )
          MAX_FILE_CHARS = int(
              os.environ["MAX_FILE_CHARS"]
          )

          MAX_RUNTIME_BYTES = int(
              os.environ["MAX_RUNTIME_BYTES"]
          )
          MAX_PRESENCE_BYTES = int(
              os.environ["MAX_PRESENCE_BYTES"]
          )
          MAX_WORK_BYTES = int(
              os.environ["MAX_WORK_BYTES"]
          )
          MAX_MEMORY_BYTES = int(
              os.environ["MAX_MEMORY_BYTES"]
          )
          MAX_KNOWLEDGE_BYTES = int(
              os.environ["MAX_KNOWLEDGE_BYTES"]
          )

          MAX_PENDING_ACTIONS = int(
              os.environ["MAX_PENDING_ACTIONS"]
          )
          MAX_WORK_REQUESTS = int(
              os.environ["MAX_WORK_REQUESTS"]
          )
          MAX_CASES = int(
              os.environ["MAX_CASES"]
          )
          MAX_MEMORY_CONTEXT_CHARS = int(
              os.environ["MAX_MEMORY_CONTEXT_CHARS"]
          )

          DUPLICATE_PUBLISH_THRESHOLD = int(
              os.environ[
                  "DUPLICATE_PUBLISH_THRESHOLD"
              ]
          )
          DUPLICATE_WORK_REQUEST_THRESHOLD = int(
              os.environ[
                  "DUPLICATE_WORK_REQUEST_THRESHOLD"
              ]
          )

          COLLECTION_WARNING_RATIO = float(
              os.environ[
                  "COLLECTION_WARNING_RATIO"
              ]
          )

          GEMINI_API_KEY = os.environ.get(
              "GEMINI_API_KEY",
              "",
          ).strip()

          GEMINI_MODEL = os.environ[
              "GEMINI_MODEL"
          ]

          EVOLUTION_FILE = Path(
              os.environ["EVOLUTION_FILE"]
          )
          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          WORK_FILE = Path(
              os.environ["WORK_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          PRESENCE_FILE = Path(
              os.environ["PRESENCE_FILE"]
          )

          # ============================================================
          # SELF-EVOLUTION PERIMETER
          # ============================================================

          ALLOWED_TARGETS = {
              ".github/workflows/nox-core-general.yml",
              ".github/workflows/nox-work-factory.yml",
              ".github/workflows/nox-colony-presence.yml",
              ".github/workflows/nox-evolution-monitor.yml",
              "memory/nox_core_memory.json",
              "memory/nox_core_runtime.json",
              "memory/nox_work_factory.json",
              "memory/nox_knowledge.json",
              "memory/nox_colony_presence.json",
              "memory/nox_evolution_report.md",
          }

          FORBIDDEN_TARGETS = {
              ".github/workflows/nox-self-evolution.yml",
              ".github/workflows/nox-action-opportunities.yml",
          }

          # ============================================================
          # UTILITIES
          # ============================================================

          def clean(value, limit=6000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]


          def stable(*parts):
              raw = "|".join(
                  clean(part, 12000)
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def load_json(path, default):
              if not path.exists():
                  return json.loads(
                      json.dumps(default)
                  )

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return json.loads(
                      json.dumps(default)
                  )

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )

                  return json.loads(
                      json.dumps(default)
                  )


          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          def read_full(path):
              if not path.exists():
                  return ""

              size = path.stat().st_size

              if size > MAX_FILE_CHARS:
                  raise RuntimeError(
                      f"Target file exceeds safety limit: "
                      f"{path} ({size} bytes)"
                  )

              return path.read_text(
                  encoding="utf-8"
              )


          def bounded_text(value, limit):
              text = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
              )

              if len(text) <= limit:
                  return value

              if isinstance(value, list):
                  result = []

                  for item in value:
                      candidate = result + [item]

                      if len(
                          json.dumps(
                              candidate,
                              ensure_ascii=False,
                          )
                      ) > limit:
                          break

                      result.append(item)

                  return {
                      "truncated": True,
                      "items_returned": len(result),
                      "items_total": len(value),
                      "items": result,
                  }

              if isinstance(value, dict):
                  result = {}

                  for key, item in value.items():
                      candidate = dict(result)
                      candidate[key] = item

                      if len(
                          json.dumps(
                              candidate,
                              ensure_ascii=False,
                          )
                      ) > limit:
                          break

                      result[key] = item

                  return {
                      "truncated": True,
                      "keys_returned": len(result),
                      "keys_total": len(value),
                      "data": result,
                  }

              return clean(value, limit)


          def read_for_context(path):
              """
              Large files are represented structurally rather than by
              copying an arbitrary middle/edge slice into the prompt.
              """

              if not path.exists():
                  return ""

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(data, dict):
                      summary = {
                          "file": str(path),
                          "keys": list(
                              data.keys()
                          ),
                          "collections": {},
                      }

                      for key, value in data.items():
                          if isinstance(
                              value,
                              list,
                          ):
                              summary[
                                  "collections"
                              ][key] = {
                                  "count": len(
                                      value
                                  ),
                                  "recent": value[
                                      -5:
                                  ],
                              }

                      return json.dumps(
                          bounded_text(
                              summary,
                              MAX_CONTEXT_CHARS,
                          ),
                          ensure_ascii=False,
                          indent=2,
                      )

              except Exception:
                  pass

              text = path.read_text(
                  encoding="utf-8"
              )

              if len(text) <= MAX_CONTEXT_CHARS:
                  return text

              head_size = (
                  MAX_CONTEXT_CHARS // 2
              )

              tail_size = (
                  MAX_CONTEXT_CHARS
                  - head_size
              )

              return (
                  text[:head_size]
                  + "\n\n"
                  + "[... TEXT CONTEXT OMITTED ...]\n\n"
                  + text[-tail_size:]
              )


          def file_hash(path):
              if not path.exists():
                  return None

              return hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()


          def run_git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  capture_output=True,
                  check=False,
              )

              if (
                  check
                  and result.returncode != 0
              ):
                  raise RuntimeError(
                      f"git {' '.join(args)} failed: "
                      f"{result.stdout[-2000:]} "
                      f"{result.stderr[-2000:]}"
                  )

              return result


          def safe_target(path):
              normalized = (
                  str(path)
                  .replace("\\", "/")
                  .lstrip("./")
              )

              if normalized in FORBIDDEN_TARGETS:
                  return False

              if normalized not in ALLOWED_TARGETS:
                  return False

              candidate = (
                  ROOT / normalized
              ).resolve()

              try:
                  candidate.relative_to(ROOT)
              except ValueError:
                  return False

              return True


          def recursive_string_size(value):
              if isinstance(value, str):
                  return len(value)

              if isinstance(value, dict):
                  return sum(
                      recursive_string_size(k)
                      + recursive_string_size(v)
                      for k, v in value.items()
                  )

              if isinstance(value, list):
                  return sum(
                      recursive_string_size(item)
                      for item in value
                  )

              return 0


          def count_collection(value):
              if isinstance(value, list):
                  return len(value)

              if isinstance(value, dict):
                  return len(value)

              return 0


          def duplicate_signatures(items, signature_fn):
              signatures = []

              for item in items:
                  try:
                      signature = signature_fn(
                          item
                      )
                  except Exception:
                      continue

                  if signature:
                      signatures.append(
                          signature
                      )

              counts = Counter(signatures)

              return {
                  signature: count
                  for signature, count in counts.items()
                  if count >= 2
              }


          # ============================================================
          # LOAD NØX STATE
          # ============================================================

          memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          work = load_json(
              WORK_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )

          presence = load_json(
              PRESENCE_FILE,
              {},
          )

          evolution = load_json(
              EVOLUTION_FILE,
              {
                  "version": 2,
                  "history": [],
                  "runs": [],
              },
          )

          evolution.setdefault(
              "version",
              2,
          )

          evolution.setdefault(
              "history",
              [],
          )

          evolution.setdefault(
              "runs",
              [],
          )

          # ============================================================
          # STRUCTURAL HEALTH ANALYSIS
          # ============================================================

          file_objects = {
              "core_memory": (
                  CORE_MEMORY_FILE,
                  memory,
                  MAX_MEMORY_BYTES,
              ),
              "core_runtime": (
                  CORE_RUNTIME_FILE,
                  runtime,
                  MAX_RUNTIME_BYTES,
              ),
              "work_factory": (
                  WORK_FILE,
                  work,
                  MAX_WORK_BYTES,
              ),
              "knowledge": (
                  KNOWLEDGE_FILE,
                  knowledge,
                  MAX_KNOWLEDGE_BYTES,
              ),
              "presence": (
                  PRESENCE_FILE,
                  presence,
                  MAX_PRESENCE_BYTES,
              ),
          }

          structural = {
              "files": {},
              "collections": {},
              "duplicates": {},
              "warnings": [],
          }

          for name, (
              path,
              data,
              max_bytes,
          ) in file_objects.items():
              size = (
                  path.stat().st_size
                  if path.exists()
                  else 0
              )

              structural["files"][name] = {
                  "path": str(path),
                  "bytes": size,
                  "lines": (
                      path.read_text(
                          encoding="utf-8"
                      ).count("\n")
                      if path.exists()
                      else 0
                  ),
                  "max_bytes": max_bytes,
              }

              if size > max_bytes:
                  structural[
                      "warnings"
                  ].append(
                      {
                          "type": "file_size",
                          "file": name,
                          "bytes": size,
                          "threshold": max_bytes,
                      }
                  )

          runtime_pending = runtime.get(
              "pending_actions",
              [],
          )

          if not isinstance(
              runtime_pending,
              list,
          ):
              runtime_pending = []

          work_requests = runtime.get(
              "work_requests",
              [],
          )

          if not isinstance(
              work_requests,
              list,
          ):
              work_requests = []

          cases = memory.get(
              "cognitive_cases",
              [],
          )

          if not isinstance(
              cases,
              list,
          ):
              cases = []

          structural[
              "collections"
          ]["pending_actions"] = len(
              runtime_pending
          )

          structural[
              "collections"
          ]["work_requests"] = len(
              work_requests
          )

          structural[
              "collections"
          ]["cognitive_cases"] = len(
              cases
          )

          for name, data in (
              (
                  "runtime_evolution_requests",
                  runtime.get(
                      "evolution_requests",
                      [],
                  ),
              ),
              (
                  "runtime_cognitive_gaps",
                  runtime.get(
                      "cognitive_gaps",
                      [],
                  ),
              ),
              (
                  "memory_failures",
                  memory.get(
                      "failures",
                      [],
                  ),
              ),
              (
                  "memory_learnings",
                  memory.get(
                      "learnings",
                      [],
                  ),
              ),
              (
                  "presence_outcomes",
                  presence.get(
                      "outcomes",
                      [],
                  ),
              ),
              (
                  "presence_notifications",
                  presence.get(
                      "notifications",
                      [],
                  ),
              ),
              (
                  "presence_observed_posts",
                  presence.get(
                      "observed_posts",
                      [],
                  ),
              ),
              (
                  "presence_replied_posts",
                  presence.get(
                      "replied_posts",
                      [],
                  ),
              ),
              (
                  "presence_published_posts",
                  presence.get(
                      "published_posts",
                      [],
                  ),
              ),
          ):
              structural[
                  "collections"
              ][name] = count_collection(
                  data
              )

          # ============================================================
          # DUPLICATE ACTION DETECTION
          # ============================================================

          publish_duplicates = duplicate_signatures(
              [
                  item
                  for item in runtime_pending
                  if isinstance(item, dict)
                  and item.get("kind")
                  == "publish"
              ],
              lambda item: stable(
                  item.get("kind"),
                  item.get("title"),
                  item.get("body"),
              ),
          )

          if publish_duplicates:
              structural[
                  "duplicates"
              ]["pending_publish"] = (
                  publish_duplicates
              )

              for signature, count in (
                  publish_duplicates.items()
              ):
                  if (
                      count
                      >= DUPLICATE_PUBLISH_THRESHOLD
                  ):
                      structural[
                          "warnings"
                      ].append(
                          {
                              "type": (
                                  "duplicate_publish"
                              ),
                              "signature": signature,
                              "count": count,
                          }
                      )

          work_duplicates = duplicate_signatures(
              work_requests,
              lambda item: stable(
                  item.get("target_id"),
                  item.get("intent"),
                  json.dumps(
                      item.get(
                          "queries",
                          [],
                      ),
                      ensure_ascii=False,
                      sort_keys=True,
                  ),
              ),
          )

          if work_duplicates:
              structural[
                  "duplicates"
              ]["work_requests"] = (
                  work_duplicates
              )

              for signature, count in (
                  work_duplicates.items()
              ):
                  if (
                      count
                      >= DUPLICATE_WORK_REQUEST_THRESHOLD
                  ):
                      structural[
                          "warnings"
                      ].append(
                          {
                              "type": (
                                  "duplicate_work_request"
                              ),
                              "signature": signature,
                              "count": count,
                          }
                      )

          # ============================================================
          # MEMORY CONTEXT ANALYSIS
          # ============================================================

          memory_context_sizes = []

          for request in work_requests:
              if not isinstance(
                  request,
                  dict,
              ):
                  continue

              context = request.get(
                  "memory_context"
              )

              if context is None:
                  continue

              size = recursive_string_size(
                  context
              )

              memory_context_sizes.append(
                  size
              )

          structural[
              "memory_context"
          ] = {
              "requests_with_context": len(
                  memory_context_sizes
              ),
              "max_chars": max(
                  memory_context_sizes,
                  default=0,
              ),
              "total_chars": sum(
                  memory_context_sizes
              ),
          }

          if (
              structural[
                  "memory_context"
              ]["max_chars"]
              > MAX_MEMORY_CONTEXT_CHARS
          ):
              structural[
                  "warnings"
              ].append(
                  {
                      "type": (
                          "oversized_memory_context"
                      ),
                      "max_chars": structural[
                          "memory_context"
                      ]["max_chars"],
                      "threshold": (
                          MAX_MEMORY_CONTEXT_CHARS
                      ),
                  }
              )

          # ============================================================
          # COLLECTION CAPACITY ANALYSIS
          # ============================================================

          known_caps = {
              "presence_outcomes": 500,
              "presence_observed_posts": 500,
              "presence_replied_posts": 500,
              "presence_published_posts": 500,
              "presence_notifications": 500,
              "runtime_pending_actions": 500,
          }

          for name, cap in known_caps.items():
              collection_name = name

              if name == "runtime_pending_actions":
                  count = len(
                      runtime_pending
                  )
              else:
                  count = structural[
                      "collections"
                  ].get(
                      collection_name,
                      0,
                  )

              ratio = (
                  count / cap
                  if cap
                  else 0
              )

              if ratio >= COLLECTION_WARNING_RATIO:
                  structural[
                      "warnings"
                  ].append(
                      {
                          "type": (
                              "collection_near_capacity"
                          ),
                          "collection": name,
                          "count": count,
                          "cap": cap,
                          "ratio": ratio,
                      }
                  )

          # ============================================================
          # OPERATIONAL PRESSURE ANALYSIS
          # ============================================================

          if (
              len(runtime_pending)
              > MAX_PENDING_ACTIONS
          ):
              structural[
                  "warnings"
              ].append(
                  {
                      "type": (
                          "pending_actions_pressure"
                      ),
                      "count": len(
                          runtime_pending
                      ),
                      "threshold": (
                          MAX_PENDING_ACTIONS
                      ),
                  }
              )

          if (
              len(work_requests)
              > MAX_WORK_REQUESTS
          ):
              structural[
                  "warnings"
              ].append(
                  {
                      "type": (
                          "work_request_pressure"
                      ),
                      "count": len(
                          work_requests
                      ),
                      "threshold": (
                          MAX_WORK_REQUESTS
                      ),
                  }
              )

          if (
              len(cases)
              > MAX_CASES
          ):
              structural[
                  "warnings"
              ].append(
                  {
                      "type": "case_pressure",
                      "count": len(cases),
                      "threshold": MAX_CASES,
                  }
              )

          # ============================================================
          # DETECTION
          # ============================================================

          signals = []

          for item in memory.get(
              "failures",
              [],
          )[-40:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "core_failure",
                          "data": item,
                      }
                  )

          for item in memory.get(
              "learnings",
              [],
          )[-40:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "core_learning",
                          "data": item,
                      }
                  )

          for item in runtime.get(
              "evolution_requests",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "evolution_request",
                          "data": item,
                      }
                  )

          for item in runtime.get(
              "cognitive_gaps",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "cognitive_gap",
                          "data": item,
                      }
                  )

          for item in work.get(
              "history",
              [],
          )[-20:]:
              if isinstance(item, dict):
                  status = str(
                      item.get(
                          "evidence_status",
                          "",
                      )
                  ).lower()

                  if status in {
                      "insufficient_verification",
                      "partial_support",
                  }:
                      signals.append(
                          {
                              "source": "work_factory",
                              "data": item,
                          }
                      )

          for item in presence.get(
              "outcomes",
              [],
          )[-30:]:
              if isinstance(item, dict):
                  signals.append(
                      {
                          "source": "presence_outcome",
                          "data": item,
                      }
                  )

          # Structural health is now a first-class evolution source.
          for warning in structural[
              "warnings"
          ]:
              signals.append(
                  {
                      "source": "structural_health",
                      "data": warning,
                  }
              )

          # Add a complete structural snapshot when a pressure
          # condition exists. This lets Self Evolution reason about
          # the relationship between several related metrics.
          if structural[
              "warnings"
          ]:
              signals.append(
                  {
                      "source": "system_health_snapshot",
                      "data": {
                          "files": structural[
                              "files"
                          ],
                          "collections": structural[
                              "collections"
                          ],
                          "duplicates": structural[
                              "duplicates"
                          ],
                          "memory_context": structural[
                              "memory_context"
                          ],
                          "warnings": structural[
                              "warnings"
                          ],
                      },
                  }
              )

          known_signatures = {
              item.get(
                  "signal_signature"
              )
              for item in evolution[
                  "history"
              ]
              if isinstance(item, dict)
          }

          candidates = []

          for signal in signals:
              signature = stable(
                  signal.get(
                      "source"
                  ),
                  json.dumps(
                      signal.get(
                          "data",
                          {},
                      ),
                      ensure_ascii=False,
                      sort_keys=True,
                  ),
              )

              if signature in known_signatures:
                  continue

              candidates.append(
                  {
                      **signal,
                      "signature": signature,
                  }
              )

          # Structural problems are prioritized because they can
          # degrade several other workflows simultaneously.
          priority = {
              "system_health_snapshot": 0,
              "structural_health": 1,
              "core_failure": 2,
              "presence_outcome": 3,
              "evolution_request": 4,
              "cognitive_gap": 5,
              "work_factory": 6,
              "core_learning": 7,
          }

          candidates.sort(
              key=lambda item: priority.get(
                  item.get(
                      "source"
                  ),
                  99,
              )
          )

          print(
              f"Detected signals: {len(signals)}"
          )

          print(
              f"New evolution candidates: "
              f"{len(candidates)}"
          )

          print(
              "Structural warnings: "
              f"{len(structural['warnings'])}"
          )

          print(
              "Pending actions: "
              f"{len(runtime_pending)}"
          )

          print(
              "Work requests: "
              f"{len(work_requests)}"
          )

          print(
              "Runtime bytes: "
              f"{structural['files']['core_runtime']['bytes']}"
          )

          print(
              "Presence bytes: "
              f"{structural['files']['presence']['bytes']}"
          )

          if structural[
              "warnings"
          ]:
              print(
                  "Structural warnings detail:"
              )

              for warning in structural[
                  "warnings"
              ][:20]:
                  print(
                      " - "
                      + json.dumps(
                          warning,
                          ensure_ascii=False,
                      )
                  )

          # ============================================================
          # NO NEW EVOLUTION
          # ============================================================

          if not candidates:
              evolution["runs"].append(
                  {
                      "timestamp": NOW,
                      "status": (
                          "no_new_candidate"
                      ),
                      "signals": len(signals),
                      "structural_warnings": len(
                          structural[
                              "warnings"
                          ]
                      ),
                  }
              )

              evolution["runs"] = (
                  evolution["runs"]
              )[-MAX_HISTORY:]

              evolution[
                  "updated_at"
              ] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution,
              )

              print(
                  "No modification required."
              )

              sys.exit(0)

          candidate = candidates[0]

          # ============================================================
          # REASONING CONTEXT
          # ============================================================

          context_files = {}

          for target in sorted(
              ALLOWED_TARGETS
          ):
              path = ROOT / target

              if not path.exists():
                  continue

              if target == str(
                  EVOLUTION_FILE
              ):
                  continue

              context_files[target] = (
                  read_for_context(path)
              )

          reasoning_context = {
              "timestamp": NOW,
              "candidate": candidate,
              "structural_health": structural,
              "recent_failures": memory.get(
                  "failures",
                  [],
              )[-15:],
              "recent_learnings": memory.get(
                  "learnings",
                  [],
              )[-15:],
              "recent_cognitive_cases": memory.get(
                  "cognitive_cases",
                  [],
              )[-15:],
              "work_factory_history": work.get(
                  "history",
                  [],
              )[-10:],
              "knowledge": bounded_text(
                  knowledge,
                  MAX_CONTEXT_CHARS // 2,
              ),
              "presence_recent_outcomes": presence.get(
                  "outcomes",
                  [],
              )[-10:],
              "runtime": {
                  "run_count": runtime.get(
                      "run_count"
                  ),
                  "last_run": runtime.get(
                      "last_run"
                  ),
                  "evolution_requests": runtime.get(
                      "evolution_requests",
                      [],
                  )[-10:],
                  "pending_actions": runtime_pending[
                      -20:
                  ],
                  "work_requests": work_requests[
                      -20:
                  ],
              },
              "files": context_files,
          }

          # ============================================================
          # GEMINI DECISION
          # ============================================================

          prompt = {
              "role": (
                  "NØX Self Evolution Engine"
              ),
              "mission": (
                  "Diagnose one concrete weakness "
                  "from evidence and, only when "
                  "justified, prepare the smallest "
                  "safe repository modification."
              ),
              "context": reasoning_context,
              "rules": [
                  "Use evidence, not assumptions.",
                  "Structural health warnings are evidence, not proof of the correct fix.",
                  "Determine the root cause before proposing cleanup.",
                  "Do not confuse file size with actual capacity exhaustion.",
                  "If a collection is large, inspect its structure and duplication before deleting data.",
                  "If evidence is insufficient, do not evolve.",
                  "One evolution case per run.",
                  "Maximum 3 target files.",
                  "Maximum 8 patches.",
                  "Never modify the Self Evolution workflow.",
                  "Never modify Action & Opportunities.",
                  "Never modify secrets or credentials.",
                  "Never modify repository settings.",
                  "Never introduce automatic spending or payment.",
                  "Preserve working behavior.",
                  "Prefer bounded reads, compaction, deduplication, stale-item handling, or precise logic fixes when evidence supports them.",
                  "Do not delete current operational state merely because it is old.",
                  "Do not delete evidence that is required to understand previous outcomes.",
                  "Do not remove pending actions unless the target action is demonstrably obsolete, duplicated, invalid, or already completed.",
                  "Do not automatically publish internal diagnostics.",
                  "Every old patch string must occur exactly once.",
                  "Every patch must have a reason.",
                  "Every change must have a test.",
                  "The result must remain reversible through git history.",
              ],
              "allowed_targets": sorted(
                  ALLOWED_TARGETS
              ),
              "output": {
                  "should_evolve": "boolean",
                  "problem": "string",
                  "hypothesis": "string",
                  "decision": "string",
                  "expected_result": "string",
                  "targets": [
                      "string"
                  ],
                  "patches": [
                      {
                          "path": "string",
                          "old": "string",
                          "new": "string",
                          "reason": "string",
                      }
                  ],
                  "tests": [
                      "string"
                  ],
                  "learning": "string",
              },
          }

          plan = None
          planner_error = None

          if (
              genai is not None
              and GEMINI_API_KEY
          ):
              try:
                  client = genai.Client(
                      api_key=GEMINI_API_KEY
                  )

                  response = (
                      client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=json.dumps(
                              prompt,
                              ensure_ascii=False,
                          ),
                          config={
                              "temperature": 0.1,
                              "response_mime_type": (
                                  "application/json"
                              ),
                          },
                      )
                  )

                  plan = json.loads(
                      response.text
                  )

              except Exception as exc:
                  planner_error = clean(
                      exc,
                      2000,
                  )

          if not isinstance(
              plan,
              dict,
          ):
              plan = {
                  "should_evolve": False,
                  "problem": "",
                  "hypothesis": "",
                  "decision": (
                      "No valid evolution "
                      "decision was produced."
                  ),
                  "expected_result": "",
                  "targets": [],
                  "patches": [],
                  "tests": [],
                  "learning": "",
              }

          patches = plan.get(
              "patches",
              [],
          )

          if not isinstance(
              patches,
              list,
          ):
              patches = []

          # ============================================================
          # DECISION: NO EVOLUTION
          # ============================================================

          if (
              plan.get(
                  "should_evolve"
              )
              is not True
              or not patches
          ):
              evolution_id = stable(
                  NOW,
                  candidate[
                      "signature"
                  ],
              )

              evolution["history"].append(
                  {
                      "id": evolution_id,
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "signal_signature": (
                          candidate[
                              "signature"
                          ]
                      ),
                      "source": candidate.get(
                          "source"
                      ),
                      "problem": clean(
                          plan.get(
                              "problem"
                          ),
                          4000,
                      ),
                      "hypothesis": clean(
                          plan.get(
                              "hypothesis"
                          ),
                          4000,
                      ),
                      "decision": clean(
                          plan.get(
                              "decision"
                          ),
                          4000,
                      ),
                      "planner_error": (
                          planner_error
                      ),
                  }
              )

              evolution["history"] = (
                  evolution["history"]
              )[-MAX_HISTORY:]

              evolution["runs"].append(
                  {
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "evolution_id": (
                          evolution_id
                      ),
                  }
              )

              evolution["runs"] = (
                  evolution["runs"]
              )[-MAX_HISTORY:]

              evolution[
                  "updated_at"
              ] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution,
              )

              print(
                  "Decision: NO EVOLUTION"
              )

              sys.exit(0)

          # ============================================================
          # PATCH VALIDATION
          # ============================================================

          if len(patches) > MAX_PATCHES:
              raise RuntimeError(
                  "Too many patches."
              )

          normalized = []

          for patch in patches:
              if not isinstance(
                  patch,
                  dict,
              ):
                  raise RuntimeError(
                      "Invalid patch object."
                  )

              path = (
                  str(
                      patch.get(
                          "path",
                          "",
                      )
                  )
                  .replace("\\", "/")
                  .lstrip("./")
              )

              old = str(
                  patch.get(
                      "old",
                      "",
                  )
              )

              new = str(
                  patch.get(
                      "new",
                      "",
                  )
              )

              reason = clean(
                  patch.get(
                      "reason",
                      "",
                  ),
                  3000,
              )

              if not safe_target(path):
                  raise RuntimeError(
                      f"Forbidden target: {path}"
                  )

              if not old.strip():
                  raise RuntimeError(
                      f"Empty old patch: {path}"
                  )

              if old == new:
                  raise RuntimeError(
                      f"No-op patch: {path}"
                  )

              current = read_full(
                  ROOT / path
              )

              occurrences = current.count(
                  old
              )

              if occurrences != 1:
                  raise RuntimeError(
                      f"Patch for {path} "
                      f"has {occurrences} matches; "
                      f"exactly 1 required."
                  )

              normalized.append(
                  {
                      "path": path,
                      "old": old,
                      "new": new,
                      "reason": reason,
                  }
              )

          target_paths = sorted(
              {
                  item["path"]
                  for item in normalized
              }
          )

          if len(target_paths) > 3:
              raise RuntimeError(
                  "More than 3 target files."
              )

          evolution_id = stable(
              NOW,
              candidate[
                  "signature"
              ],
              json.dumps(
                  normalized,
                  ensure_ascii=False,
                  sort_keys=True,
              ),
          )

          before_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # APPLY EXACT PATCHES
          # ============================================================

          for patch in normalized:
              path = ROOT / patch["path"]

              current = path.read_text(
                  encoding="utf-8"
              )

              updated = current.replace(
                  patch["old"],
                  patch["new"],
                  1,
              )

              if updated == current:
                  raise RuntimeError(
                      f"No change produced: "
                      f"{patch['path']}"
                  )

              path.write_text(
                  updated,
                  encoding="utf-8",
              )

          # ============================================================
          # TEST 1 — YAML
          # ============================================================

          for path in target_paths:
              if path.endswith(
                  (".yml", ".yaml")
              ):
                  with open(
                      ROOT / path,
                      "r",
                      encoding="utf-8",
                  ) as handle:
                      yaml.safe_load(handle)

          # ============================================================
          # TEST 2 — EMBEDDED PYTHON
          # ============================================================

          for path in target_paths:
              if not path.endswith(
                  (".yml", ".yaml")
              ):
                  continue

              text = read_full(
                  ROOT / path
              )

              blocks = re.findall(
                  r"""python3\s+-\s+<<['"]?PY['"]?\s*\n(.*?)\n\s*PY\s*$""",
                  text,
                  flags=(
                      re.MULTILINE
                      | re.DOTALL
                  ),
              )

              for index, block in enumerate(
                  blocks,
                  1,
              ):
                  compile(
                      block,
                      (
                          f"{path}:"
                          f"embedded-python:"
                          f"{index}"
                      ),
                      "exec",
                  )

          # ============================================================
          # TEST 3 — JSON
          # ============================================================

          for path in target_paths:
              if path.endswith(
                  ".json"
              ):
                  json.loads(
                      read_full(
                          ROOT / path
                      )
                  )

          # ============================================================
          # TEST 4 — SECURITY POLICIES
          # ============================================================

          for path in target_paths:
              text = read_full(
                  ROOT / path
              )

              lowered = text.lower()

              if (
                  "auto_payment"
                  in lowered
                  and "auto_payment: true"
                  in lowered
              ):
                  raise RuntimeError(
                      f"Payment policy enabled: {path}"
                  )

              if (
                  "auto_spending"
                  in lowered
                  and "auto_spending: true"
                  in lowered
              ):
                  raise RuntimeError(
                      f"Spending policy enabled: {path}"
                  )

          # ============================================================
          # TEST 5 — SELF-EVOLUTION PERIMETER
          # ============================================================

          for path in target_paths:
              if path in FORBIDDEN_TARGETS:
                  raise RuntimeError(
                      f"Forbidden self-modification: {path}"
                  )

          # ============================================================
          # TEST 6 — GIT DIFF
          # ============================================================

          run_git(
              "diff",
              "--check",
          )

          diff = run_git(
              "diff",
              "--",
              *target_paths,
          ).stdout

          if not diff.strip():
              raise RuntimeError(
                  "Evolution produced no diff."
              )

          if len(diff) > 120000:
              raise RuntimeError(
                  "Evolution diff is too large."
              )

          after_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # RECORD TESTED EVOLUTION
          # ============================================================

          evolution["history"].append(
              {
                  "id": evolution_id,
                  "timestamp": NOW,
                  "status": "tested",
                  "signal_signature": (
                      candidate[
                          "signature"
                      ]
                  ),
                  "source": candidate.get(
                      "source"
                  ),
                  "problem": clean(
                      plan.get(
                          "problem",
                          "",
                      ),
                      4000,
                  ),
                  "hypothesis": clean(
                      plan.get(
                          "hypothesis",
                          "",
                      ),
                      4000,
                  ),
                  "decision": clean(
                      plan.get(
                          "decision",
                          "",
                      ),
                      4000,
                  ),
                  "expected_result": clean(
                      plan.get(
                          "expected_result",
                          "",
                      ),
                      4000,
                  ),
                  "targets": target_paths,
                  "patches": [
                      {
                          "path": item[
                              "path"
                          ],
                          "reason": item[
                              "reason"
                          ],
                      }
                      for item in normalized
                  ],
                  "tests": {
                      "yaml": "passed",
                      "embedded_python": (
                          "passed"
                      ),
                      "json": "passed",
                      "security": "passed",
                      "perimeter": "passed",
                      "git_diff_check": (
                          "passed"
                      ),
                  },
                  "learning": clean(
                      plan.get(
                          "learning",
                          "",
                      ),
                      4000,
                  ),
              }
          )

          evolution["history"] = (
              evolution["history"]
          )[-MAX_HISTORY:]

          evolution[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
              evolution,
          )

          # ============================================================
          # COMMIT MODIFICATION
          # ============================================================

          run_git(
              "config",
              "user.name",
              "NØX",
          )

          run_git(
              "config",
              "user.email",
              "nox@users.noreply.github.com",
          )

          run_git(
              "add",
              *target_paths,
              str(EVOLUTION_FILE),
          )

          staged = run_git(
              "diff",
              "--cached",
              "--quiet",
              check=False,
          )

          if staged.returncode == 0:
              raise RuntimeError(
                  "Nothing staged after evolution."
              )

          run_git(
              "commit",
              "-m",
              (
                  "NØX: self evolution "
                  f"{evolution_id}"
              ),
          )

          run_git(
              "push",
              "origin",
              "HEAD:main",
          )

          commit_sha = run_git(
              "rev-parse",
              "HEAD",
          ).stdout.strip()

          # ============================================================
          # FINAL RESULT
          # ============================================================

          evolution = load_json(
              EVOLUTION_FILE,
              {
                  "version": 2,
                  "history": [],
                  "runs": [],
              },
          )

          for entry in reversed(
              evolution.get(
                  "history",
                  [],
              )
          ):
              if entry.get(
                  "id"
              ) == evolution_id:
                  entry[
                      "status"
                  ] = "committed"

                  entry[
                      "commit"
                  ] = commit_sha

                  entry[
                      "result"
                  ] = (
                      "modification_committed"
                  )

                  break

          evolution.setdefault(
              "runs",
              [],
          )

          evolution["runs"].append(
              {
                  "timestamp": NOW,
                  "status": "committed",
                  "evolution_id": (
                      evolution_id
                  ),
                  "commit": commit_sha,
                  "changed_paths": (
                      target_paths
                  ),
              }
          )

          evolution["runs"] = (
              evolution["runs"]
          )[-MAX_HISTORY:]

          evolution[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
              evolution,
          )

          run_git(
              "add",
              str(EVOLUTION_FILE),
          )

          staged_result = run_git(
              "diff",
              "--cached",
              "--quiet",
              check=False,
          )

          if staged_result.returncode != 0:
              run_git(
                  "commit",
                  "-m",
                  (
                      "NØX: record self evolution "
                      f"result {evolution_id}"
                  ),
              )

              run_git(
                  "push",
                  "origin",
                  "HEAD:main",
              )

          print("")
          print(
              "=== NØX SELF EVOLUTION V2 ==="
          )
          print(
              f"Evolution ID: {evolution_id}"
          )
          print(
              "Candidate source: "
              + str(
                  candidate.get(
                      "source"
                  )
              )
          )
          print(
              "Changed files: "
              + ", ".join(
                  target_paths
              )
          )
          print(
              "Structural warnings: "
              + str(
                  len(
                      structural[
                          "warnings"
                      ]
                  )
              )
          )
          print(
              "YAML: PASSED"
          )
          print(
              "Embedded Python: PASSED"
          )
          print(
              "JSON: PASSED"
          )
          print(
              "Security: PASSED"
          )
          print(
              "Perimeter: PASSED"
          )
          print(
              "Git diff: PASSED"
          )
          print(
              f"Commit: {commit_sha}"
          )
          print(
              "RESULT: MODIFICATION COMMITTED"
          )
          print(
              "CYCLE: "
              "DETECT -> RESEARCH -> DECIDE -> "
              "MODIFY -> TEST -> RESULT -> LEARN"
          )
          PY
