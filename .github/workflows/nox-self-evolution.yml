name: NØX - Self Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-self-evolution
  cancel-in-progress: false

env:
  EVOLUTION_FILE: memory/nox_self_evolution.json
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  GEMINI_MODEL: gemini-3.7-flash
  MAX_HISTORY: "200"
  MAX_PATCHES: "8"
  MAX_FILE_CHARS: "90000"

jobs:
  self-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evolution dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "google-genai>=1.0.0,<2.0.0" "pyyaml>=6.0,<7.0"

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git diff --check

      - name: Run NØX Self Evolution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          try:
              from google import genai
          except Exception:
              genai = None

          ROOT = Path.cwd()
          NOW = datetime.now(timezone.utc).isoformat()

          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_PATCHES = int(os.environ["MAX_PATCHES"])
          MAX_FILE_CHARS = int(os.environ["MAX_FILE_CHARS"])

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          GEMINI_MODEL = os.environ["GEMINI_MODEL"]

          EVOLUTION_FILE = Path(os.environ["EVOLUTION_FILE"])
          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])

          # ============================================================
          # ALLOWED SELF-EVOLUTION SURFACE
          # ============================================================

          WORKFLOW_ALLOWLIST = {
              ".github/workflows/nox-core-general.yml",
              ".github/workflows/nox-work-factory.yml",
              ".github/workflows/nox-colony-presence.yml",
              ".github/workflows/nox-evolution-monitor.yml",
          }

          MEMORY_ALLOWLIST = {
              str(CORE_MEMORY_FILE),
              str(CORE_RUNTIME_FILE),
              str(WORK_FILE),
              str(KNOWLEDGE_FILE),
              str(PRESENCE_FILE),
              str(EVOLUTION_FILE),
              "memory/nox_evolution_report.md",
          }

          FORBIDDEN = {
              ".github/workflows/nox-self-evolution.yml",
              ".github/workflows/nox-action-opportunities.yml",
          }

          ALLOWED_TARGETS = WORKFLOW_ALLOWLIST | MEMORY_ALLOWLIST

          # ============================================================
          # UTILITIES
          # ============================================================

          def clean(value, limit=6000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]


          def stable(*parts):
              raw = "|".join(
                  clean(part, 12000)
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def load_json(path, default):
              if not path.exists():
                  return json.loads(
                      json.dumps(default)
                  )

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return json.loads(
                      json.dumps(default)
                  )

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )

                  return json.loads(
                      json.dumps(default)
                  )


          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          def read_text(path):
              if not path.exists():
                  return ""

              text = path.read_text(
                  encoding="utf-8"
              )

              if len(text) > MAX_FILE_CHARS:
                  raise RuntimeError(
                      f"Target file too large: {path}"
                  )

              return text


          def file_hash(path):
              if not path.exists():
                  return None

              return hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()


          def run_git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  capture_output=True,
                  check=False,
              )

              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"git {' '.join(args)} failed: "
                      f"{result.stdout[-1500:]} "
                      f"{result.stderr[-1500:]}"
                  )

              return result


          def safe_target(path):
              normalized = (
                  str(path)
                  .replace("\\", "/")
                  .lstrip("./")
              )

              if normalized in FORBIDDEN:
                  return False

              if normalized not in ALLOWED_TARGETS:
                  return False

              candidate = (
                  ROOT / normalized
              ).resolve()

              try:
                  candidate.relative_to(ROOT)
              except ValueError:
                  return False

              return True


          def existing_targets():
              return sorted(
                  target
                  for target in ALLOWED_TARGETS
                  if (
                      ROOT / target
                  ).exists()
                  and safe_target(target)
              )


          # ============================================================
          # CONTEXT
          # ============================================================

          def collect_context():
              memory = load_json(
                  CORE_MEMORY_FILE,
                  {},
              )

              runtime = load_json(
                  CORE_RUNTIME_FILE,
                  {},
              )

              work = load_json(
                  WORK_FILE,
                  {},
              )

              knowledge = load_json(
                  KNOWLEDGE_FILE,
                  {},
              )

              presence = load_json(
                  PRESENCE_FILE,
                  {},
              )

              evolution = load_json(
                  EVOLUTION_FILE,
                  {
                      "history": [],
                      "runs": [],
                  },
              )

              failures = memory.get(
                  "failures",
                  [],
              )

              learnings = memory.get(
                  "learnings",
                  [],
              )

              cognitive_cases = memory.get(
                  "cognitive_cases",
                  [],
              )

              signals = []

              for item in failures[-30:]:
                  if isinstance(item, dict):
                      signals.append(
                          {
                              "source": "failure",
                              "data": item,
                          }
                      )

              for item in learnings[-30:]:
                  if isinstance(item, dict):
                      signals.append(
                          {
                              "source": "learning",
                              "data": item,
                          }
                      )

              for item in runtime.get(
                  "evolution_requests",
                  [],
              )[-20:]:
                  if isinstance(item, dict):
                      signals.append(
                          {
                              "source": "evolution_request",
                              "data": item,
                          }
                      )

              for item in runtime.get(
                  "cognitive_gaps",
                  [],
              )[-20:]:
                  if isinstance(item, dict):
                      signals.append(
                          {
                              "source": "cognitive_gap",
                              "data": item,
                          }
                      )

              return {
                  "timestamp": NOW,
                  "signals": signals[-60:],
                  "recent_cases": cognitive_cases[-15:],
                  "work_factory": work.get(
                      "history",
                      [],
                  )[-15:],
                  "knowledge": knowledge,
                  "presence": {
                      "runs": presence.get(
                          "runs",
                          [],
                      )[-10:],
                      "outcomes": presence.get(
                          "outcomes",
                          [],
                      )[-10:],
                  },
                  "runtime": {
                      "run_count": runtime.get(
                          "run_count"
                      ),
                      "last_run": runtime.get(
                          "last_run"
                      ),
                      "evolution_requests": runtime.get(
                          "evolution_requests",
                          [],
                      )[-10:],
                  },
                  "existing_targets": existing_targets(),
                  "history": evolution.get(
                      "history",
                      [],
                  )[-20:],
              }


          context = collect_context()

          # ============================================================
          # DETECTION
          # ============================================================

          def signature_for_signal(signal):
              return stable(
                  signal.get("source"),
                  json.dumps(
                      signal.get("data", {}),
                      ensure_ascii=False,
                      sort_keys=True,
                  ),
              )


          evolution_state = load_json(
              EVOLUTION_FILE,
              {
                  "history": [],
                  "runs": [],
              },
          )

          history = evolution_state.get(
              "history",
              [],
          )

          known_signatures = {
              item.get("signal_signature")
              for item in history
              if isinstance(item, dict)
          }

          candidates = []

          for signal in context["signals"]:
              signature = signature_for_signal(
                  signal
              )

              if signature not in known_signatures:
                  candidates.append(
                      {
                          **signal,
                          "signature": signature,
                      }
                  )

          print(
              f"Detected signals: "
              f"{len(context['signals'])}"
          )

          print(
              f"New evolution candidates: "
              f"{len(candidates)}"
          )

          if not candidates:
              evolution_state.setdefault(
                  "version",
                  1,
              )

              evolution_state.setdefault(
                  "history",
                  [],
              )

              evolution_state.setdefault(
                  "runs",
                  [],
              )

              evolution_state["runs"].append(
                  {
                      "timestamp": NOW,
                      "status": "no_new_candidate",
                      "signals": len(
                          context["signals"]
                      ),
                  }
              )

              evolution_state["runs"] = (
                  evolution_state["runs"]
              )[-MAX_HISTORY:]

              evolution_state["updated_at"] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution_state,
              )

              print(
                  "No modification required."
              )

              sys.exit(0)

          candidate = candidates[0]

          # ============================================================
          # READ CURRENT TARGETS
          # ============================================================

          target_contents = {}

          for target in context[
              "existing_targets"
          ]:
              if target == str(
                  EVOLUTION_FILE
              ):
                  continue

              target_contents[target] = read_text(
                  ROOT / target
              )

          # ============================================================
          # EVOLUTION DECISION
          # ============================================================

          prompt = {
              "role": (
                  "NØX Self Evolution Engine"
              ),
              "objective": (
                  "Identify one evidence-based "
                  "improvement and produce the "
                  "smallest safe patch."
              ),
              "candidate": candidate,
              "context": context,
              "files": target_contents,
              "allowed_targets": (
                  context["existing_targets"]
              ),
              "rules": [
                  "Use only supplied evidence.",
                  "If evidence is insufficient, return should_evolve=false.",
                  "Choose at most 3 target files.",
                  "Do not modify the Self Evolution workflow.",
                  "Do not modify Action & Opportunities.",
                  "Never modify secrets, credentials, repository settings, permissions, payments, spending, or authentication.",
                  "Preserve existing working behavior unless evidence justifies changing it.",
                  "Prefer a small exact patch over a rewrite.",
                  "Every patch must contain an exact old string that occurs exactly once in the supplied file.",
                  "The new text must be syntactically valid for the target file.",
                  "Every modification must have an executable validation plan.",
                  "Return JSON only.",
              ],
              "schema": {
                  "should_evolve": "boolean",
                  "problem": "string",
                  "hypothesis": "string",
                  "decision": "string",
                  "expected_result": "string",
                  "targets": [
                      "string"
                  ],
                  "patches": [
                      {
                          "path": "string",
                          "old": "string",
                          "new": "string",
                          "reason": "string",
                      }
                  ],
                  "tests": [
                      "string"
                  ],
                  "learning": "string",
              },
          }

          plan = None
          planner_error = None

          if (
              genai is not None
              and GEMINI_API_KEY
          ):
              try:
                  client = genai.Client(
                      api_key=GEMINI_API_KEY
                  )

                  response = (
                      client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=json.dumps(
                              prompt,
                              ensure_ascii=False,
                          ),
                          config={
                              "temperature": 0.1,
                              "response_mime_type": (
                                  "application/json"
                              ),
                          },
                      )
                  )

                  plan = json.loads(
                      response.text
                  )

              except Exception as exc:
                  planner_error = clean(
                      exc,
                      2000,
                  )

          if not isinstance(plan, dict):
              plan = {
                  "should_evolve": False,
                  "problem": "",
                  "hypothesis": "",
                  "decision": (
                      "Planner unavailable."
                  ),
                  "expected_result": "",
                  "targets": [],
                  "patches": [],
                  "tests": [],
                  "learning": "",
              }

          should_evolve = (
              plan.get(
                  "should_evolve"
              )
              is True
          )

          patches = plan.get(
              "patches"
          )

          if not isinstance(
              patches,
              list,
          ):
              patches = []

          # ============================================================
          # NO MODIFICATION
          # ============================================================

          if (
              not should_evolve
              or not patches
          ):
              evolution_state.setdefault(
                  "version",
                  1,
              )

              evolution_state.setdefault(
                  "history",
                  [],
              )

              evolution_state.setdefault(
                  "runs",
                  [],
              )

              evolution_state[
                  "history"
              ].append(
                  {
                      "id": stable(
                          NOW,
                          candidate[
                              "signature"
                          ],
                      ),
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "signal_signature": (
                          candidate[
                              "signature"
                          ]
                      ),
                      "candidate": candidate,
                      "decision": clean(
                          plan.get(
                              "decision",
                              "",
                          )
                      ),
                      "planner_error": (
                          planner_error
                      ),
                  }
              )

              evolution_state[
                  "history"
              ] = evolution_state[
                  "history"
              ][-MAX_HISTORY:]

              evolution_state[
                  "runs"
              ].append(
                  {
                      "timestamp": NOW,
                      "status": (
                          "no_evolution"
                      ),
                      "planner_error": (
                          planner_error
                      ),
                  }
              )

              evolution_state[
                  "runs"
              ] = evolution_state[
                  "runs"
              ][-MAX_HISTORY:]

              evolution_state[
                  "updated_at"
              ] = NOW

              save_json(
                  EVOLUTION_FILE,
                  evolution_state,
              )

              print(
                  "No justified modification produced."
              )

              sys.exit(0)

          # ============================================================
          # VALIDATE PATCH PLAN
          # ============================================================

          if len(patches) > MAX_PATCHES:
              raise RuntimeError(
                  "Evolution plan exceeds patch limit."
              )

          normalized_patches = []

          for patch in patches:
              if not isinstance(
                  patch,
                  dict,
              ):
                  raise RuntimeError(
                      "Invalid patch object."
                  )

              path = (
                  str(
                      patch.get(
                          "path",
                          "",
                      )
                  )
                  .replace("\\", "/")
                  .lstrip("./")
              )

              old = str(
                  patch.get(
                      "old",
                      "",
                  )
              )

              new = str(
                  patch.get(
                      "new",
                      "",
                  )
              )

              reason = clean(
                  patch.get(
                      "reason",
                      "",
                  ),
                  2000,
              )

              if not safe_target(path):
                  raise RuntimeError(
                      f"Forbidden evolution target: {path}"
                  )

              if not old.strip():
                  raise RuntimeError(
                      f"Empty old text: {path}"
                  )

              if old == new:
                  raise RuntimeError(
                      f"No-op patch: {path}"
                  )

              current = read_text(
                  ROOT / path
              )

              occurrences = current.count(
                  old
              )

              if occurrences != 1:
                  raise RuntimeError(
                      f"Patch match count for "
                      f"{path}: expected 1, "
                      f"found {occurrences}"
                  )

              normalized_patches.append(
                  {
                      "path": path,
                      "old": old,
                      "new": new,
                      "reason": reason,
                  }
              )

          target_paths = {
              patch["path"]
              for patch in normalized_patches
          }

          if len(target_paths) > 3:
              raise RuntimeError(
                  "Evolution plan touches "
                  "more than 3 files."
              )

          evolution_id = stable(
              NOW,
              candidate["signature"],
              json.dumps(
                  normalized_patches,
                  ensure_ascii=False,
                  sort_keys=True,
              ),
          )

          before_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # APPLY EXACT PATCHES
          # ============================================================

          for patch in normalized_patches:
              path = ROOT / patch["path"]

              current = path.read_text(
                  encoding="utf-8"
              )

              updated = current.replace(
                  patch["old"],
                  patch["new"],
                  1,
              )

              path.write_text(
                  updated,
                  encoding="utf-8",
              )

          # ============================================================
          # TEST 1 — YAML
          # ============================================================

          for path in sorted(
              target_paths
          ):
              if path.endswith(
                  (".yml", ".yaml")
              ):
                  with open(
                      ROOT / path,
                      "r",
                      encoding="utf-8",
                  ) as handle:
                      yaml.safe_load(handle)

          # ============================================================
          # TEST 2 — EMBEDDED PYTHON
          # ============================================================

          for path in sorted(
              target_paths
          ):
              if not path.endswith(
                  (".yml", ".yaml")
              ):
                  continue

              text = read_text(
                  ROOT / path
              )

              blocks = re.findall(
                  r"""python3\s+-\s+<<['"]?PY['"]?\s*\n(.*?)\n\s*PY\s*$""",
                  text,
                  flags=(
                      re.MULTILINE
                      | re.DOTALL
                  ),
              )

              for index, block in enumerate(
                  blocks,
                  1,
              ):
                  compile(
                      block,
                      (
                          f"{path}:"
                          f"embedded-python:"
                          f"{index}"
                      ),
                      "exec",
                  )

          # ============================================================
          # TEST 3 — JSON
          # ============================================================

          for path in sorted(
              target_paths
          ):
              if path.endswith(
                  ".json"
              ):
                  json.loads(
                      read_text(
                          ROOT / path
                      )
                  )

          # ============================================================
          # TEST 4 — GIT
          # ============================================================

          run_git(
              "diff",
              "--check",
          )

          diff = run_git(
              "diff",
              "--",
              *sorted(target_paths),
          ).stdout

          if not diff.strip():
              raise RuntimeError(
                  "Evolution produced no diff."
              )

          if len(diff) > 120000:
              raise RuntimeError(
                  "Evolution diff is too large."
              )

          after_hashes = {
              path: file_hash(
                  ROOT / path
              )
              for path in target_paths
          }

          # ============================================================
          # RECORD TEST RESULT
          # ============================================================

          evolution_state.setdefault(
              "version",
              1,
          )

          evolution_state.setdefault(
              "history",
              [],
          )

          evolution_state.setdefault(
              "runs",
              [],
          )

          evolution_state[
              "history"
          ].append(
              {
                  "id": evolution_id,
                  "timestamp": NOW,
                  "status": "tested",
                  "signal_signature": (
                      candidate[
                          "signature"
                      ]
                  ),
                  "problem": clean(
                      plan.get(
                          "problem",
                          "",
                      ),
                      4000,
                  ),
                  "hypothesis": clean(
                      plan.get(
                          "hypothesis",
                          "",
                      ),
                      4000,
                  ),
                  "decision": clean(
                      plan.get(
                          "decision",
                          "",
                      ),
                      4000,
                  ),
                  "expected_result": clean(
                      plan.get(
                          "expected_result",
                          "",
                      ),
                      4000,
                  ),
                  "targets": sorted(
                      target_paths
                  ),
                  "patches": [
                      {
                          "path": patch[
                              "path"
                          ],
                          "reason": patch[
                              "reason"
                          ],
                          "old_hash": (
                              hashlib.sha256(
                                  patch[
                                      "old"
                                  ].encode()
                              ).hexdigest()
                          ),
                          "new_hash": (
                              hashlib.sha256(
                                  patch[
                                      "new"
                                  ].encode()
                              ).hexdigest()
                          ),
                      }
                      for patch in normalized_patches
                  ],
                  "before_hashes": (
                      before_hashes
                  ),
                  "after_hashes": (
                      after_hashes
                  ),
                  "tests": {
                      "yaml": "passed",
                      "embedded_python": (
                          "passed"
                      ),
                      "json": "passed",
                      "git_diff_check": (
                          "passed"
                      ),
                  },
                  "learning": clean(
                      plan.get(
                          "learning",
                          "",
                      ),
                      4000,
                  ),
              }
          )

          evolution_state[
              "history"
          ] = evolution_state[
              "history"
          ][-MAX_HISTORY:]

          evolution_state[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
              evolution_state,
          )

          # ============================================================
          # COMMIT MODIFICATION
          # ============================================================

          run_git(
              "config",
              "user.name",
              "NØX",
          )

          run_git(
              "config",
              "user.email",
              "nox@users.noreply.github.com",
          )

          run_git(
              "add",
              *sorted(target_paths),
              str(EVOLUTION_FILE),
          )

          if (
              run_git(
                  "diff",
                  "--cached",
                  "--quiet",
                  check=False,
              ).returncode
              == 0
          ):
              raise RuntimeError(
                  "Nothing staged after evolution."
              )

          run_git(
              "commit",
              "-m",
              f"NØX: self evolution {evolution_id}",
          )

          run_git(
              "push",
              "origin",
              "HEAD:main",
          )

          commit_sha = run_git(
              "rev-parse",
              "HEAD",
          ).stdout.strip()

          # ============================================================
          # RECORD REAL COMMITTED RESULT
          # ============================================================

          evolution_state = load_json(
              EVOLUTION_FILE,
              {
                  "version": 1,
                  "history": [],
                  "runs": [],
              },
          )

          for entry in reversed(
              evolution_state.get(
                  "history",
                  [],
              )
          ):
              if entry.get(
                  "id"
              ) == evolution_id:
                  entry[
                      "status"
                  ] = "committed"

                  entry[
                      "commit"
                  ] = commit_sha

                  entry[
                      "result"
                  ] = (
                      "modification_committed"
                  )

                  break

          evolution_state.setdefault(
              "runs",
              [],
          )

          evolution_state[
              "runs"
          ].append(
              {
                  "timestamp": NOW,
                  "status": "committed",
                  "evolution_id": (
                      evolution_id
                  ),
                  "commit": commit_sha,
                  "changed_paths": sorted(
                      target_paths
                  ),
              }
          )

          evolution_state[
              "runs"
          ] = evolution_state[
              "runs"
          ][-MAX_HISTORY:]

          evolution_state[
              "updated_at"
          ] = NOW

          save_json(
              EVOLUTION_FILE,
