name: NØX V89 Autonomous Strategy Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v89-autonomous-strategy-arbitration
  cancel-in-progress: false

jobs:
  arbitrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V89
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          # ------------------------------------------------------------
          # 1. Authenticate
          # ------------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing")

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )
          token_response.raise_for_status()

          token = token_response.json().get("access_token")

          if not token:
              raise SystemExit("No access_token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )
          me_response.raise_for_status()

          me = me_response.json()

          agent_id = str(
              me.get("id")
              or me.get("user_id")
              or ""
          )

          username = str(
              me.get("username")
              or ""
          )

          # ------------------------------------------------------------
          # 2. Load the complete learning chain
          # ------------------------------------------------------------

          v80 = load(
              f"{MEMORY}/nox_v80_adaptive_decision_learning.json"
          )

          v81 = load(
              f"{MEMORY}/nox_v81_adaptive_action_prioritization.json"
          )

          v82 = load(
              f"{MEMORY}/nox_v82_autonomous_action_selection.json"
          )

          v83 = load(
              f"{MEMORY}/nox_v83_autonomous_action_execution.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json"
          )

          v86 = load(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.json"
          )

          v87 = load(
              f"{MEMORY}/nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              f"{MEMORY}/nox_v88_autonomous_decision_error_analysis.json"
          )

          # ------------------------------------------------------------
          # 3. Extract evidence from previous versions
          # ------------------------------------------------------------

          v84_outcome = str(
              (v84.get("outcome") or {}).get("status")
              or v84.get("outcome_status")
              or "UNKNOWN"
          )

          v88_status = str(
              (v88.get("self_assessment") or {}).get("status")
              or "UNKNOWN"
          )

          v88_confidence = number(
              (v88.get("self_assessment") or {}).get("confidence"),
              0.0
          )

          v88_recommendation = str(
              (v88.get("autonomous_next_strategy") or {}).get(
                  "recommendation"
              )
              or "MAINTAIN_WITH_CAUTION"
          )

          live = v86.get("live_test") or v86.get("results") or {}

          high_count = int(
              number(
                  live.get("high_confidence_count")
                  or live.get("high_confidence_opportunities"),
                  0
              )
          )

          strong_count = int(
              number(
                  live.get("strong_candidate_count")
                  or live.get("strong_opportunity_candidates"),
                  0
              )
          )

          contextual_count = int(
              number(
                  live.get("contextual_count")
                  or live.get("contextual_opportunities"),
                  0
              )
          )

          low_count = int(
              number(
                  live.get("low_priority_count")
                  or live.get("low_priority_signals"),
                  0
              )
          )

          average_score = number(
              live.get("average_score")
              or live.get("mean_score"),
              0
          )

          over_pruning = bool(
              live.get("over_pruning")
              or live.get("over_pruning_detected")
              or False
          )

          # ------------------------------------------------------------
          # 4. Build strategy candidates
          # ------------------------------------------------------------

          strategies = [
              {
                  "id": "STRATEGY_A_EVIDENCE_FIRST",
                  "name": "Evidence-first",
                  "description": (
                      "Prioritize independent convergence between explicit "
                      "request, delegation, deliverable and verification."
                  ),
                  "strengths": [
                      "Strong false-positive protection",
                      "Uses primary evidence",
                      "Compatible with V88 error analysis"
                  ],
                  "weaknesses": [
                      "Can become too conservative",
                      "May miss atypical delegated opportunities"
                  ]
              },
              {
                  "id": "STRATEGY_B_OPPORTUNITY_FIRST",
                  "name": "Opportunity-first",
                  "description": (
                      "Favor potentially executable opportunities earlier "
                      "and verify them through context."
                  ),
                  "strengths": [
                      "Higher discovery sensitivity",
                      "Better recovery of atypical opportunities",
                      "Less risk of excessive pruning"
                  ],
                  "weaknesses": [
                      "Higher false-positive risk",
                      "Requires stronger contextual verification"
                  ]
              },
              {
                  "id": "STRATEGY_C_ADAPTIVE_BALANCED",
                  "name": "Adaptive balanced",
                  "description": (
                      "Combine evidence convergence, historical outcomes, "
                      "live testing and self-detected errors without allowing "
                      "history to override current evidence."
                  ),
                  "strengths": [
                      "Balances precision and discovery",
                      "Uses V86 live evidence",
                      "Uses V88 self-correction",
                      "Preserves atypical opportunities"
                  ],
                  "weaknesses": [
                      "More complex arbitration",
                      "Requires continued measurement"
                  ]
              }
          ]

          # ------------------------------------------------------------
          # 5. Score strategy candidates
          # ------------------------------------------------------------

          scores = {}

          for strategy in strategies:
              sid = strategy["id"]
              score = 50.0
              reasons = []

              if sid == "STRATEGY_A_EVIDENCE_FIRST":
                  score += 15
                  reasons.append(
                      "Strong protection against known false-positive classes."
                  )

                  if over_pruning:
                      score -= 15
                      reasons.append(
                          "Live testing indicates possible over-pruning."
                      )

                  if contextual_count > 0:
                      score += 5

              elif sid == "STRATEGY_B_OPPORTUNITY_FIRST":
                  score += 10
                  reasons.append(
                      "Preserves discovery sensitivity and atypical signals."
                  )

                  if over_pruning:
                      score += 10
                      reasons.append(
                          "Opportunity-first is useful when excessive pruning is detected."
                      )

                  if low_count > high_count + strong_count:
                      score -= 10
                      reasons.append(
                          "Low-signal volume currently dominates stronger opportunities."
                      )

              elif sid == "STRATEGY_C_ADAPTIVE_BALANCED":
                  score += 15
                  reasons.append(
                      "Combines evidence, outcomes, live testing and self-analysis."
                  )

                  if v88_status in (
                      "DECISION_HAS_WEAKNESSES",
                      "DECISION_NEEDS_CORRECTION"
                  ):
                      score += 8
                      reasons.append(
                          "V88 identified weaknesses that should influence future arbitration."
                      )

                  if over_pruning:
                      score += 8
                      reasons.append(
                          "Balanced adaptation can reduce over-pruning without abandoning evidence."
                      )

                  if v88_confidence >= 0.80:
                      score += 5
                      reasons.append(
                          "V88 self-analysis has strong confidence."
                      )

              scores[sid] = {
                  "score": round(score, 2),
                  "reasons": reasons
              }

          # ------------------------------------------------------------
          # 6. Select preferred strategy
          # ------------------------------------------------------------

          preferred_id = max(
              scores,
              key=lambda key: scores[key]["score"]
          )

          preferred = next(
              item for item in strategies
              if item["id"] == preferred_id
          )

          preferred_score = scores[preferred_id]["score"]

          # ------------------------------------------------------------
          # 7. Arbitration quality
          # ------------------------------------------------------------

          ordered = sorted(
              [
                  (sid, data["score"])
                  for sid, data in scores.items()
              ],
              key=lambda item: item[1],
              reverse=True
          )

          margin = 0.0

          if len(ordered) >= 2:
              margin = round(
                  ordered[0][1] - ordered[1][1],
                  2
              )

          if margin >= 10:
              arbitration_status = "CLEAR_PREFERENCE"

          elif margin >= 5:
              arbitration_status = "MODERATE_PREFERENCE"

          else:
              arbitration_status = "CLOSE_ARBITRATION"

          # ------------------------------------------------------------
          # 8. Future autonomy authority
          # ------------------------------------------------------------

          if (
              preferred_score >= 75
              and margin >= 10
              and v88_confidence >= 0.80
          ):
              authority = "READY_FOR_CONTROLLED_USE"

          elif preferred_score >= 65:
              authority = "USE_AS_STRATEGIC_SIGNAL"

          else:
              authority = "CONTINUE_OBSERVATION"

          # ------------------------------------------------------------
          # 9. Autonomous recommendations
          # ------------------------------------------------------------

          recommendations = [
              "Keep primary-source verification as a hard evidence priority.",
              "Do not interpret reward language as proof of settlement.",
              "Do not penalize a decision solely because nobody responded.",
              "Preserve atypical opportunities instead of filtering them automatically.",
              "Use historical outcomes to modify priority, not to establish truth.",
              "Use V88 decision errors as correction signals for future arbitration.",
              "Prefer strategies that improve both precision and opportunity recovery."
          ]

          # ------------------------------------------------------------
          # 10. Prepare V90 transition
          # ------------------------------------------------------------

          v90_readiness = {
              "decision_autonomy": True,
              "strategy_arbitration": True,
              "self_error_analysis": True,
              "adaptive_learning": True,
              "live_validation": True,
              "automatic_rule_deployment": False,
              "external_action": False,
              "human_override": True,
              "recommended_entry": (
                  "V90_AUTONOMOUS_DECISION_FRAMEWORK"
              )
          }

          # ------------------------------------------------------------
          # 11. Result
          # ------------------------------------------------------------

          result = {
              "version": "V89",
              "generated_at": now(),
              "mode": "autonomous_strategy_arbitration",
              "agent": {
                  "id": agent_id,
                  "username": username
              },
              "inputs": {
                  "v80": bool(v80),
                  "v81": bool(v81),
                  "v82": bool(v82),
                  "v83": bool(v83),
                  "v84": bool(v84),
                  "v85": bool(v85),
                  "v86": bool(v86),
                  "v87": bool(v87),
                  "v88": bool(v88)
              },
              "observed_learning": {
                  "v84_outcome": v84_outcome,
                  "v88_self_assessment": v88_status,
                  "v88_confidence": v88_confidence,
                  "v88_recommendation": v88_recommendation,
                  "v86_high_confidence": high_count,
                  "v86_strong_candidates": strong_count,
                  "v86_contextual": contextual_count,
                  "v86_low_priority": low_count,
                  "v86_average_score": average_score,
                  "v86_over_pruning": over_pruning
              },
              "strategy_candidates": strategies,
              "strategy_scores": scores,
              "arbitration": {
                  "preferred_strategy": preferred_id,
                  "preferred_name": preferred["name"],
                  "preferred_score": preferred_score,
                  "margin_over_second": margin,
                  "status": arbitration_status
              },
              "preferred_strategy": {
                  "id": preferred_id,
                  "name": preferred["name"],
                  "description": preferred["description"],
                  "reason": (
                      "This strategy currently provides the best balance "
                      "between evidence quality, opportunity discovery, "
                      "adaptation and self-correction."
                  )
              },
              "recommendations": recommendations,
              "authority": {
                  "status": authority,
                  "automatic_strategy_deployment": False,
                  "automatic_rule_change": False
              },
              "learning": {
                  "conclusions": [
                      "NØX can now compare competing strategies rather than relying on one fixed policy.",
                      "Strategy quality must be judged against both false positives and missed opportunities.",
                      "Live evidence and self-detected errors are stronger signals than intuition.",
                      "A strategy should not become permanent because of one successful or unsuccessful case.",
                      "The preferred strategy must remain revisable when new evidence contradicts it.",
                      "The arbitration process itself should become measurable in V90+."
                  ],
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V88-SYSTEMATIC-DECISION-ERROR"
                  ]
              },
              "v90_transition": v90_readiness,
              "decision": {
                  "answer_status": "STRATEGY_ARBITRATED",
                  "confidence": round(
                      min(
                          0.95,
                          0.60
                          + (preferred_score / 100.0) * 0.20
                          + min(v88_confidence, 0.95) * 0.15
                      ),
                      3
                  )
              },
              "autonomy": {
                  "strategy_comparison": True,
                  "strategy_arbitration": True,
                  "self_correction_input": True,
                  "preferred_strategy_selection": True,
                  "automatic_rule_deployment": False,
                  "external_action": False
              },
              "next_stage": {
                  "version": "V90",
                  "purpose": (
                      "Begin the autonomous decision framework: "
                      "NØX evaluates evidence, priorities, strategy and "
                      "past results as one decision system."
                  )
              },
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          # ------------------------------------------------------------
          # 12. Save JSON
          # ------------------------------------------------------------

          save(
              f"{MEMORY}/nox_v89_autonomous_strategy_arbitration.json",
              result
          )

          # ------------------------------------------------------------
          # 13. Save Markdown
          # ------------------------------------------------------------

          md = []

          md.append("# NØX V89 — Autonomous Strategy Arbitration")
          md.append("")
          md.append(f"Generated: {result['generated_at']}")
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Compare competing strategies using historical learning, "
              "live testing and NØX self-analysis."
          )
          md.append("")
          md.append("## Strategies")
          md.append("")

          for strategy in strategies:
              sid = strategy["id"]
              md.append(
                  f"### {strategy['name']} — "
                  f"{scores[sid]['score']}/100"
              )
              md.append("")
              md.append(strategy["description"])
              md.append("")
              for reason in scores[sid]["reasons"]:
                  md.append(f"- {reason}")
              md.append("")

          md.append("## Arbitration")
          md.append("")
          md.append(
              f"- Preferred strategy: {preferred['name']}"
          )
          md.append(
              f"- Score: {preferred_score}/100"
          )
          md.append(
              f"- Margin over second strategy: {margin}"
          )
          md.append(
              f"- Arbitration status: {arbitration_status}"
          )
          md.append("")
          md.append("## Authority")
          md.append("")
          md.append(
              f"- Status: {authority}"
          )
          md.append(
              "- Automatic strategy deployment: false"
          )
          md.append(
              "- Automatic rule change: false"
          )
          md.append("")
          md.append("## V90 readiness")
          md.append("")
          md.append(
              "NØX is ready to enter an autonomous decision framework "
              "where evidence, priority, strategy, historical results "
              "and self-detected errors are evaluated together."
          )
          md.append("")
          md.append("## Core principles")
          md.append("")

          for item in result["learning"]["conclusions"]:
              md.append(f"- {item}")

          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v89_autonomous_strategy_arbitration.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V89
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v89_autonomous_strategy_arbitration.json
          git add memory/nox_v89_autonomous_strategy_arbitration.md

          git diff --cached --quiet || \
            git commit -m "NØX V89 autonomous strategy arbitration"

          git push
