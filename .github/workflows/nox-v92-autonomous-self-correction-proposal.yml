name: NØX V92 — Autonomous Self-Correction Proposal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v92-autonomous-self-correction-proposal
  cancel-in-progress: false

jobs:
  self-correction-proposal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V92
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          BASE = "memory"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(filename):
              path = os.path.join(BASE, filename)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(filename, data):
              os.makedirs(BASE, exist_ok=True)
              path = os.path.join(BASE, filename)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, bool):
                  return str(value)
              if isinstance(value, (int, float)):
                  return str(value)
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def boolean(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  return value.lower() in [
                      "true",
                      "1",
                      "yes"
                  ]
              return bool(value)

          # ---------------------------------------------------------
          # LOAD HISTORY
          # ---------------------------------------------------------

          v80 = load(
              "nox_v80_adaptive_decision_learning.json"
          )

          v84 = load(
              "nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              "nox_v85_autonomous_strategy_adaptation.json"
          )

          v87 = load(
              "nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              "nox_v88_autonomous_decision_error_analysis.json"
          )

          v89 = load(
              "nox_v89_autonomous_strategy_arbitration.json"
          )

          v90 = load(
              "nox_v90_autonomous_decision_framework.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          # ---------------------------------------------------------
          # V91 METRICS
          # ---------------------------------------------------------

          metrics = v91.get("metrics", {})

          if not isinstance(metrics, dict):
              metrics = {}

          overall_stability = number(
              metrics.get("overall_stability", 0)
          )

          decision_stability = number(
              metrics.get("decision_stability", 0)
          )

          evidence_stability = number(
              metrics.get("evidence_stability", 0)
          )

          strategy_stability = number(
              metrics.get("strategy_stability", 0)
          )

          reversal_rate = number(
              metrics.get("reversal_rate", 0)
          )

          over_pruning = boolean(
              metrics.get("over_pruning_signal", False)
          )

          under_pruning = boolean(
              metrics.get("under_pruning_signal", False)
          )

          self_correction_signal = boolean(
              metrics.get("self_correction_signal", False)
          )

          quality_profile = text(
              v91.get("quality_profile")
              or v91.get("quality")
              or "UNKNOWN"
          )

          # ---------------------------------------------------------
          # CURRENT STRATEGY
          # ---------------------------------------------------------

          preferred_strategy = (
              v89.get("preferred_strategy")
              or v89.get("selected_strategy")
              or "STRATEGY_C_ADAPTIVE_BALANCED"
          )

          preferred_strategy_text = text(
              preferred_strategy
          )

          adaptive_direction = text(
              v80.get("adaptive_direction")
              or "NO_CHANGE"
          )

          # ---------------------------------------------------------
          # WEAKNESS DETECTION
          # ---------------------------------------------------------

          weaknesses = []

          if reversal_rate > 0:
              weaknesses.append({
                  "id": "W_DECISION_REVERSAL",
                  "severity": "HIGH",
                  "description": (
                      "Decision classification changed across "
                      "observations."
                  )
              })

          if decision_stability < 0.70:
              weaknesses.append({
                  "id": "W_DECISION_STABILITY",
                  "severity": "HIGH",
                  "description": (
                      "Decision stability is below the target."
                  )
              })

          if evidence_stability < 0.80:
              weaknesses.append({
                  "id": "W_EVIDENCE_STABILITY",
                  "severity": "MEDIUM",
                  "description": (
                      "Evidence supporting decisions is not "
                      "sufficiently stable."
                  )
              })

          if strategy_stability < 0.80:
              weaknesses.append({
                  "id": "W_STRATEGY_DRIFT",
                  "severity": "MEDIUM",
                  "description": (
                      "Strategic preference is not fully stable."
                  )
              })

          if over_pruning:
              weaknesses.append({
                  "id": "W_OVER_PRUNING",
                  "severity": "HIGH",
                  "description": (
                      "Too many candidates may be discarded "
                      "as low priority."
                  )
              })

          if under_pruning:
              weaknesses.append({
                  "id": "W_COMPLETION_FILTER",
                  "severity": "MEDIUM",
                  "description": (
                      "Completed-work exclusion requires "
                      "continued attention."
                  )
              })

          if not weaknesses:
              weaknesses.append({
                  "id": "W_NO_MAJOR_FAILURE",
                  "severity": "LOW",
                  "description": (
                      "No major measurable weakness was detected."
                  )
              })

          # ---------------------------------------------------------
          # CORRECTION OPTIONS
          # ---------------------------------------------------------

          corrections = [
              {
                  "id": "CORR_A_EVIDENCE_CONVERGENCE",
                  "name": "Strengthen evidence convergence",
                  "target": [
                      "request",
                      "delegation",
                      "deliverable",
                      "acceptance"
                  ],
                  "change": (
                      "Increase the importance of converging "
                      "work-request signals before high-confidence "
                      "action."
                  ),
                  "benefit": (
                      "Reduce false positives created by isolated "
                      "request-like language."
                  ),
                  "risk": (
                      "Could reduce sensitivity to unusual genuine "
                      "opportunities."
                  ),
                  "matched_ids": [
                      "W_DECISION_REVERSAL",
                      "W_EVIDENCE_STABILITY",
                      "W_DECISION_STABILITY"
                  ]
              },
              {
                  "id": "CORR_B_ATYPICAL_RECOVERY",
                  "name": "Protect atypical opportunities",
                  "target": [
                      "atypical_signal",
                      "deliverable",
                      "reward"
                  ],
                  "change": (
                      "Keep unusual opportunity patterns as "
                      "separate candidates instead of discarding "
                      "them automatically."
                  ),
                  "benefit": (
                      "Reduce over-pruning and preserve potentially "
                      "genuine non-standard work."
                  ),
                  "risk": (
                      "Creates more candidates requiring verification."
                  ),
                  "matched_ids": [
                      "W_OVER_PRUNING"
                  ]
              },
              {
                  "id": "CORR_C_ACCEPTANCE_PRIORITY",
                  "name": "Increase acceptance evidence",
                  "target": [
                      "acceptance",
                      "verification"
                  ],
                  "change": (
                      "Increase the importance of explicit acceptance "
                      "criteria and verifiable completion conditions."
                  ),
                  "benefit": (
                      "Improve distinction between declared work "
                      "and executable checkable work."
                  ),
                  "risk": (
                      "Some genuine requests may not contain formal "
                      "acceptance criteria."
                  ),
                  "matched_ids": [
                      "W_EVIDENCE_STABILITY",
                      "W_DECISION_REVERSAL"
                  ]
              },
              {
                  "id": "CORR_D_COMPLETION_EXCLUSION",
                  "name": "Strengthen completion exclusion",
                  "target": [
                      "completion",
                      "settlement"
                  ],
                  "change": (
                      "Maintain strong exclusion of completed work "
                      "while separating payment language from "
                      "verified settlement."
                  ),
                  "benefit": (
                      "Reduce pursuit of work that is already finished."
                  ),
                  "risk": (
                      "Completion language can occasionally refer "
                      "to partial or unrelated work."
                  ),
                  "matched_ids": [
                      "W_COMPLETION_FILTER"
                  ]
              },
              {
                  "id": "CORR_E_HISTORY_AS_MODIFIER",
                  "name": "Constrain historical adaptation",
                  "target": [
                      "history",
                      "adaptive_direction"
                  ],
                  "change": (
                      "Historical learning remains a modifier only "
                      "and never overrides current primary evidence."
                  ),
                  "benefit": (
                      "Prevent past outcomes from distorting "
                      "current opportunity evaluation."
                  ),
                  "risk": (
                      "Historical learning will influence decisions "
                      "more slowly."
                  ),
                  "matched_ids": [
                      "W_DECISION_STABILITY",
                      "W_STRATEGY_DRIFT"
                  ]
              }
          ]

          # ---------------------------------------------------------
          # SCORE CORRECTIONS
          # ---------------------------------------------------------

          for correction in corrections:

              score = 50
              matched = []

              for weakness in weaknesses:

                  weakness_id = text(
                      weakness.get("id")
                  )

                  if (
                      weakness_id
                      in correction["matched_ids"]
                  ):

                      matched.append(
                          weakness_id
                      )

                      severity = text(
                          weakness.get("severity")
                      )

                      if severity == "HIGH":
                          score += 20

                      elif severity == "MEDIUM":
                          score += 12

                      else:
                          score += 5

              if (
                  correction["id"]
                  == "CORR_B_ATYPICAL_RECOVERY"
                  and over_pruning
              ):
                  score += 10

              if (
                  correction["id"]
                  == "CORR_C_ACCEPTANCE_PRIORITY"
                  and evidence_stability < 0.80
              ):
                  score += 8

              if (
                  correction["id"]
                  == "CORR_D_COMPLETION_EXCLUSION"
                  and under_pruning
              ):
                  score += 8

              if (
                  correction["id"]
                  == "CORR_E_HISTORY_AS_MODIFIER"
                  and adaptive_direction
                  != "NO_CHANGE"
              ):
                  score += 6

              correction["score"] = min(
                  int(score),
                  100
              )

              correction["matched_weaknesses"] = matched

          corrections.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          selected = corrections[0]

          if len(corrections) > 1:
              second = corrections[1]
              score_gap = (
                  selected["score"]
                  - second["score"]
              )
          else:
              score_gap = selected["score"]

          # ---------------------------------------------------------
          # ARBITRATION
          # ---------------------------------------------------------

          if (
              selected["score"] >= 80
              and score_gap >= 10
          ):
              arbitration = (
                  "CLEAR_CORRECTION_PREFERENCE"
              )

          elif selected["score"] >= 65:
              arbitration = (
                  "MODERATE_CORRECTION_PREFERENCE"
              )

          else:
              arbitration = (
                  "CORRECTION_PREFERENCE_UNCERTAIN"
              )

          # ---------------------------------------------------------
          # SELF-CORRECTION MATURITY
          # ---------------------------------------------------------

          if (
              selected["score"] >= 80
              and overall_stability >= 0.70
          ):
              maturity = (
                  "EMERGING_SELF_CORRECTION_CAPABILITY"
              )

          elif selected["score"] >= 65:
              maturity = (
                  "EARLY_SELF_CORRECTION_CAPABILITY"
              )

          else:
              maturity = (
                  "SELF_CORRECTION_NOT_YET_STABLE"
              )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V92",
              "generated_at": now(),
              "mode": "autonomous_self_correction_proposal",

              "source_versions": [
                  "V80",
                  "V84",
                  "V85",
                  "V87",
                  "V88",
                  "V89",
                  "V90",
                  "V91"
              ],

              "strategic_state": {
                  "preferred_strategy": preferred_strategy,
                  "preferred_strategy_text": preferred_strategy_text,
                  "adaptive_direction": adaptive_direction,
                  "v91_quality_profile": quality_profile
              },

              "stability_metrics": {
                  "overall_stability": overall_stability,
                  "decision_stability": decision_stability,
                  "evidence_stability": evidence_stability,
                  "strategy_stability": strategy_stability,
                  "reversal_rate": reversal_rate,
                  "over_pruning_signal": over_pruning,
                  "under_pruning_signal": under_pruning,
                  "self_correction_signal": self_correction_signal
              },

              "weaknesses": weaknesses,

              "correction_options": corrections,

              "selected_correction": selected,

              "arbitration": {
                  "status": arbitration,
                  "score_gap": score_gap,
                  "autonomous_selection": True
              },

              "self_correction": {
                  "maturity": maturity,
                  "proposal_only": True,
                  "automatic_rule_deployment": False,
                  "human_override": True
              },

              "principles": [
                  "Current primary evidence remains authoritative.",
                  "Historical learning is a modifier, not truth.",
                  "A single observation cannot justify permanent rule deployment.",
                  "False positives remain regression evidence.",
                  "Atypical opportunities must not be erased by over-pruning.",
                  "Payment language is not proof of settlement.",
                  "Completion evidence requires contextual verification.",
                  "Every correction must be measurable and reversible."
              ],

              "next_stage": {
                  "version": "V93",
                  "purpose": (
                      "Validate the selected correction against "
                      "fresh evidence before any rule deployment."
                  ),
                  "automatic_rule_deployment": False,
                  "external_action": False
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "human_override": True
              },

              "answer_status": (
                  "SELF_CORRECTION_PROPOSAL_GENERATED"
              ),

              "confidence": round(
                  selected["score"] / 100.0,
                  3
              )
          }

          # ---------------------------------------------------------
          # SAVE JSON
          # ---------------------------------------------------------

          save(
              "nox_v92_autonomous_self_correction_proposal.json",
              result
          )

          # ---------------------------------------------------------
          # SAVE MARKDOWN
          # ---------------------------------------------------------

          lines = []

          lines.append(
              "# NØX V92 — Autonomous Self-Correction Proposal"
          )
          lines.append("")
          lines.append(
              "Generated: "
              + text(result["generated_at"])
          )
          lines.append("")

          lines.append("## Objective")
          lines.append("")
          lines.append(
              "NØX analyses measured weaknesses and autonomously "
              "proposes and ranks possible corrections."
          )
          lines.append("")

          lines.append("## Strategic state")
          lines.append("")
          lines.append(
              "- Preferred strategy: "
              + preferred_strategy_text
          )
          lines.append(
              "- Adaptive direction: "
              + text(adaptive_direction)
          )
          lines.append(
              "- V91 quality: "
              + text(quality_profile)
          )
          lines.append("")

          lines.append("## Stability")
          lines.append("")
          lines.append(
              "- Overall stability: "
              + str(round(overall_stability, 3))
          )
          lines.append(
              "- Decision stability: "
              + str(round(decision_stability, 3))
          )
          lines.append(
              "- Evidence stability: "
              + str(round(evidence_stability, 3))
          )
          lines.append(
              "- Strategy stability: "
              + str(round(strategy_stability, 3))
          )
          lines.append(
              "- Reversal rate: "
              + str(round(reversal_rate, 3))
          )
          lines.append(
              "- Over-pruning: "
              + str(over_pruning)
          )
          lines.append(
              "- Under-pruning: "
              + str(under_pruning)
          )
          lines.append("")

          lines.append("## Detected weaknesses")
          lines.append("")

          for weakness in weaknesses:
              lines.append(
                  "- "
                  + text(weakness.get("id"))
                  + " ["
                  + text(weakness.get("severity"))
                  + "]: "
                  + text(weakness.get("description"))
              )

          lines.append("")
          lines.append("## Correction options")
          lines.append("")

          for correction in corrections:
              lines.append(
                  "### "
                  + text(correction.get("id"))
                  + " — "
                  + text(correction.get("name"))
              )
              lines.append("")
              lines.append(
                  "- Score: "
                  + str(correction.get("score", 0))
                  + "/100"
              )
              lines.append(
                  "- Change: "
                  + text(correction.get("change"))
              )
              lines.append(
                  "- Benefit: "
                  + text(correction.get("benefit"))
              )
              lines.append(
                  "- Risk: "
                  + text(correction.get("risk"))
              )

              matched = correction.get(
                  "matched_weaknesses",
                  []
              )

              if not isinstance(matched, list):
                  matched = [matched]

              matched_text = ", ".join(
                  text(item)
                  for item in matched
              )

              if not matched_text:
                  matched_text = "none"

              lines.append(
                  "- Matched weaknesses: "
                  + matched_text
              )
              lines.append("")

          lines.append("## Selected correction")
          lines.append("")
          lines.append(
              "- ID: "
              + text(selected.get("id"))
          )
          lines.append(
              "- Name: "
              + text(selected.get("name"))
          )
          lines.append(
              "- Score: "
              + str(selected.get("score", 0))
              + "/100"
          )
          lines.append("")

          lines.append("## Arbitration")
          lines.append("")
          lines.append(
              "- Status: "
              + text(arbitration)
          )
          lines.append(
              "- Score gap: "
              + str(score_gap)
          )
          lines.append(
              "- Autonomous selection: enabled"
          )
          lines.append("")

          lines.append("## Self-correction maturity")
          lines.append("")
          lines.append(
              "- "
              + text(maturity)
          )
          lines.append(
              "- Proposal only: true"
          )
          lines.append(
              "- Automatic rule deployment: false"
          )
          lines.append(
              "- Human override: true"
          )
          lines.append("")

          lines.append("## Next stage")
          lines.append("")
          lines.append(
              "V93 will validate the selected correction against "
              "fresh evidence before any future increase in "
              "decision authority."
          )
          lines.append("")

          lines.append("## Safety")
          lines.append("")
          lines.append("- Gemini: disabled")
          lines.append("- External contact: disabled")
          lines.append("- Bidding: disabled")
          lines.append("- Payments: disabled")
          lines.append("- Project cost: €0")
          lines.append("- Human override: enabled")

          with open(
              os.path.join(
                  BASE,
                  "nox_v92_autonomous_self_correction_proposal.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          # ---------------------------------------------------------
          # FINAL CONSOLE OUTPUT
          # ---------------------------------------------------------

          print(
              json.dumps(
                  {
                      "version": "V92",
                      "status": result["answer_status"],
                      "selected_correction": text(
                          selected.get("id")
                      ),
                      "score": selected.get("score", 0),
                      "maturity": maturity,
                      "next_stage": "V93"
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V92 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v92_autonomous_self_correction_proposal.json
          git add memory/nox_v92_autonomous_self_correction_proposal.md

          git diff --cached --quiet || \
            git commit -m "NØX V92 autonomous self correction proposal"

          git push
