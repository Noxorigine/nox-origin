name: NØX V92 — Autonomous Self-Correction Proposal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v92-autonomous-self-correction-proposal
  cancel-in-progress: false

jobs:
  self-correction-proposal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run V92
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          # ---------------------------------------------------------
          # 1. LOAD AUTONOMOUS DECISION HISTORY
          # ---------------------------------------------------------

          v80 = load(
              "memory/nox_v80_adaptive_decision_learning.json"
          )

          v84 = load(
              "memory/nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              "memory/nox_v85_autonomous_strategy_adaptation.json"
          )

          v87 = load(
              "memory/nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              "memory/nox_v88_autonomous_decision_error_analysis.json"
          )

          v89 = load(
              "memory/nox_v89_autonomous_strategy_arbitration.json"
          )

          v90 = load(
              "memory/nox_v90_autonomous_decision_framework.json"
          )

          v91 = load(
              "memory/nox_v91_autonomous_decision_stability.json"
          )

          # ---------------------------------------------------------
          # 2. EXTRACT OBSERVED WEAKNESSES
          # ---------------------------------------------------------

          metrics = v91.get("metrics", {})

          quality_profile = (
              v91.get("quality_profile")
              or "UNKNOWN"
          )

          overall_stability = float(
              metrics.get(
                  "overall_stability",
                  v91.get("confidence", 0.0) or 0.0
              )
          )

          decision_stability = float(
              metrics.get(
                  "decision_stability",
                  0.0
              )
          )

          evidence_stability = float(
              metrics.get(
                  "evidence_stability",
                  0.0
              )
          )

          strategy_stability = float(
              metrics.get(
                  "strategy_stability",
                  0.0
              )
          )

          reversal_rate = float(
              metrics.get(
                  "reversal_rate",
                  0.0
              )
          )

          over_pruning = bool(
              metrics.get(
                  "over_pruning_signal",
                  False
              )
          )

          under_pruning = bool(
              metrics.get(
                  "under_pruning_signal",
                  False
              )
          )

          self_correction_signal = bool(
              metrics.get(
                  "self_correction_signal",
                  False
              )
          )

          # ---------------------------------------------------------
          # 3. READ V88 SELF-ASSESSMENT
          # ---------------------------------------------------------

          assessment = (
              v88.get("self_assessment")
              or v88.get("assessment")
              or {}
          )

          if isinstance(assessment, dict):
              assessment_status = (
                  assessment.get("status")
                  or "UNKNOWN"
              )
          else:
              assessment_status = "UNKNOWN"

          # ---------------------------------------------------------
          # 4. READ CURRENT STRATEGY
          # ---------------------------------------------------------

          strategic_state = v90.get(
              "strategic_state",
              {}
          )

          current_strategy = (
              strategic_state.get(
                  "preferred_strategy"
              )
              or v89.get("preferred_strategy")
              or v89.get("selected_strategy")
              or "STRATEGY_C_ADAPTIVE_BALANCED"
          )

          adaptive_direction = (
              strategic_state.get(
                  "adaptive_direction"
              )
              or v80.get("adaptive_direction")
              or "NO_CHANGE"
          )

          # ---------------------------------------------------------
          # 5. BUILD WEAKNESS MAP
          # ---------------------------------------------------------

          weaknesses = []

          if reversal_rate > 0:
              weaknesses.append(
                  {
                      "id": "W_DECISION_REVERSAL",
                      "severity": "HIGH",
                      "description": (
                          "A decision crossed a confidence "
                          "threshold between observations."
                      )
                  }
              )

          if decision_stability < 0.70:
              weaknesses.append(
                  {
                      "id": "W_DECISION_STABILITY",
                      "severity": "HIGH",
                      "description": (
                          "Decision stability is below the "
                          "desired autonomous threshold."
                      )
                  }
              )

          if evidence_stability < 0.80:
              weaknesses.append(
                  {
                      "id": "W_EVIDENCE_STABILITY",
                      "severity": "MEDIUM",
                      "description": (
                          "Evidence supporting decisions "
                          "is not sufficiently stable."
                      )
                  }
              )

          if strategy_stability < 0.80:
              weaknesses.append(
                  {
                      "id": "W_STRATEGY_DRIFT",
                      "severity": "MEDIUM",
                      "description": (
                          "The preferred strategy changed "
                          "or remains insufficiently stable."
                      )
                  }
              )

          if over_pruning:
              weaknesses.append(
                  {
                      "id": "W_OVER_PRUNING",
                      "severity": "HIGH",
                      "description": (
                          "Too many live items may be classified "
                          "as low priority."
                      )
                  }
              )

          if under_pruning:
              weaknesses.append(
                  {
                      "id": "W_COMPLETION_FILTER",
                      "severity": "MEDIUM",
                      "description": (
                          "Completed-work signals require "
                          "continued strong exclusion."
                      )
                  }
              )

          if not weaknesses:
              weaknesses.append(
                  {
                      "id": "W_NO_MAJOR_FAILURE",
                      "severity": "LOW",
                      "description": (
                          "No major measurable weakness was "
                          "detected in the current sample."
                      }
                  }
              )

          # ---------------------------------------------------------
          # 6. GENERATE CORRECTION OPTIONS
          # ---------------------------------------------------------

          corrections = []

          # Correction A
          corrections.append(
              {
                  "id": "CORR_A_EVIDENCE_CONVERGENCE",
                  "name": "Strengthen evidence convergence",
                  "target": [
                      "request",
                      "delegation",
                      "deliverable",
                      "acceptance"
                  ],
                  "change": (
                      "Increase the relative importance of "
                      "converging independent work-request signals "
                      "before high-confidence action."
                  ),
                  "benefit": (
                      "Reduce false positives caused by isolated "
                      "request-like language."
                  ),
                  "risk": (
                      "May reduce sensitivity to atypical but "
                      "genuine opportunities."
                  ),
                  "best_for": [
                      "W_DECISION_REVERSAL",
                      "W_EVIDENCE_STABILITY",
                      "W_DECISION_STABILITY"
                  ]
              }
          )

          # Correction B
          corrections.append(
              {
                  "id": "CORR_B_ATYPICAL_RECOVERY",
                  "name": "Protect atypical opportunities",
                  "target": [
                      "atypical_signal",
                      "deliverable",
                      "reward"
                  ],
                  "change": (
                      "Preserve unusual opportunity patterns as "
                      "separate candidates instead of discarding "
                      "them when standard request language is absent."
                  ),
                  "benefit": (
                      "Reduce the risk of over-pruning and recover "
                      "non-standard genuine work."
                  ),
                  "risk": (
                      "May increase the number of candidates "
                      "requiring verification."
                  ),
                  "best_for": [
                      "W_OVER_PRUNING"
                  ]
              }
          )

          # Correction C
          corrections.append(
              {
                  "id": "CORR_C_ACCEPTANCE_PRIORITY",
                  "name": "Increase acceptance evidence",
                  "target": [
                      "acceptance",
                      "verification"
                  ],
                  "change": (
                      "Give stronger priority to explicit acceptance "
                      "criteria and verifiable completion conditions."
                  ),
                  "benefit": (
                      "Improve distinction between a declared task "
                      "and an executable, checkable task."
                  ),
                  "risk": (
                      "Some legitimate requests may lack formal "
                      "acceptance criteria."
                  ),
                  "best_for": [
                      "W_EVIDENCE_STABILITY",
                      "W_DECISION_REVERSAL"
                  ]
              }
          )

          # Correction D
          corrections.append(
              {
                  "id": "CORR_D_COMPLETION_EXCLUSION",
                  "name": "Strengthen completion exclusion",
                  "target": [
                      "completion",
                      "settlement"
                  ],
                  "change": (
                      "Maintain strong exclusion of completed work "
                      "while separating payment language from "
                      "verified settlement."
                  ),
                  "benefit": (
                      "Reduce pursuit of work that is already finished."
                  ),
                  "risk": (
                      "A completion phrase can occasionally refer "
                      "to a partial or unrelated task."
                  ),
                  "best_for": [
                      "W_COMPLETION_FILTER"
                  ]
              }
          )

          # Correction E
          corrections.append(
              {
                  "id": "CORR_E_ADAPTIVE_MODIFIER",
                  "name": "Constrain historical adaptation",
                  "target": [
                      "history",
                      "adaptive_direction"
                  ],
                  "change": (
                      "Keep historical learning as a modifier only; "
                      "never allow it to override current primary evidence."
                  ),
                  "benefit": (
                      "Prevent past outcomes from distorting "
                      "current opportunity evaluation."
                  ),
                  "risk": (
                      "Historical learning becomes slower to influence "
                      "future prioritization."
                  ),
                  "best_for": [
                      "W_DECISION_STABILITY",
                      "W_STRATEGY_DRIFT"
                  ]
              }
          )

          # ---------------------------------------------------------
          # 7. SCORE CORRECTIONS AUTONOMOUSLY
          # ---------------------------------------------------------

          for correction in corrections:

              score = 50
              matched = []

              for weakness in weaknesses:
                  if weakness["id"] in correction["best_for"]:
                      if weakness["severity"] == "HIGH":
                          score += 20
                      elif weakness["severity"] == "MEDIUM":
                          score += 12
                      else:
                          score += 5

                      matched.append(
                          weakness["id"]
                      )

              if (
                  correction["id"]
                  == "CORR_B_ATYPICAL_RECOVERY"
                  and over_pruning
              ):
                  score += 10

              if (
                  correction["id"]
                  == "CORR_C_ACCEPTANCE_PRIORITY"
                  and evidence_stability < 0.80
              ):
                  score += 8

              if (
                  correction["id"]
                  == "CORR_D_COMPLETION_EXCLUSION"
                  and under_pruning
              ):
                  score += 8

              if (
                  correction["id"]
                  == "CORR_E_ADAPTIVE_MODIFIER"
                  and adaptive_direction
                  != "NO_CHANGE"
              ):
                  score += 6

              correction["score"] = min(
                  100,
                  score
              )

              correction["matched_weaknesses"] = matched

          corrections.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # ---------------------------------------------------------
          # 8. AUTONOMOUS ARBITRATION
          # ---------------------------------------------------------

          selected_correction = corrections[0]

          second_correction = (
              corrections[1]
              if len(corrections) > 1
              else None
          )

          score_gap = (
              selected_correction["score"]
              - second_correction["score"]
              if second_correction
              else selected_correction["score"]
          )

          if (
              selected_correction["score"] >= 80
              and score_gap >= 10
          ):
              arbitration_status = (
                  "CLEAR_CORRECTION_PREFERENCE"
              )

          elif (
              selected_correction["score"] >= 65
          ):
              arbitration_status = (
                  "MODERATE_CORRECTION_PREFERENCE"
              )

          else:
              arbitration_status = (
                  "CORRECTION_PREFERENCE_UNCERTAIN"
              )

          # ---------------------------------------------------------
          # 9. DEPLOYMENT AUTHORITY
          # ---------------------------------------------------------

          deployment_authority = (
              "PROPOSAL_ONLY"
          )

          if quality_profile == "STRONG_STABILITY":
              proposal_authority = (
                  "HIGH_CONFIDENCE_PROPOSAL"
              )

          elif quality_profile == "STABLE_WITH_MINOR_VARIATION":
              proposal_authority = (
                  "CONTROLLED_PROPOSAL"
              )

          else:
              proposal_authority = (
                  "CAUTIOUS_PROPOSAL"
              )

          # ---------------------------------------------------------
          # 10. SELF-CORRECTION MATURITY
          # ---------------------------------------------------------

          if (
              selected_correction["score"] >= 80
              and overall_stability >= 0.70
          ):
              maturity = (
                  "EMERGING_SELF_CORRECTION_CAPABILITY"
              )

          elif selected_correction["score"] >= 65:
              maturity = (
                  "EARLY_SELF_CORRECTION_CAPABILITY"
              )

          else:
              maturity = (
                  "SELF_CORRECTION_NOT_YET_STABLE"
              )

          # ---------------------------------------------------------
          # 11. LEARNING PRINCIPLES
          # ---------------------------------------------------------

          principles = [
              "Current primary evidence remains authoritative.",
              "Historical adaptation is a modifier, not truth.",
              "A single observation cannot justify permanent rule deployment.",
              "False positives remain regression evidence.",
              "Atypical opportunities must not be erased by over-pruning.",
              "Payment language is not proof of settlement.",
              "Completion language remains exclusion evidence but requires context.",
              "Self-correction proposals must be measurable and reversible."
          ]

          # ---------------------------------------------------------
          # 12. RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V92",
              "generated_at": now(),
              "mode": "autonomous_self_correction_proposal",

              "source_versions": [
                  "V80",
                  "V84",
                  "V85",
                  "V87",
                  "V88",
                  "V89",
                  "V90",
                  "V91"
              ],

              "strategic_state": {
                  "current_strategy": current_strategy,
                  "adaptive_direction": adaptive_direction,
                  "v88_assessment": assessment_status,
                  "v91_quality_profile": quality_profile
              },

              "stability_metrics": {
                  "overall_stability": overall_stability,
                  "decision_stability": decision_stability,
                  "evidence_stability": evidence_stability,
                  "strategy_stability": strategy_stability,
                  "reversal_rate": reversal_rate,
                  "over_pruning_signal": over_pruning,
                  "under_pruning_signal": under_pruning,
                  "self_correction_signal": self_correction_signal
              },

              "weaknesses": weaknesses,

              "correction_options": corrections,

              "selected_correction": selected_correction,

              "arbitration": {
                  "status": arbitration_status,
                  "score_gap": score_gap,
                  "autonomous_selection": True
              },

              "self_correction": {
                  "maturity": maturity,
                  "proposal_authority": proposal_authority,
                  "deployment_authority": deployment_authority,
                  "automatic_rule_deployment": False
              },

              "learning_principles": principles,

              "next_stage": {
                  "version": "V93",
                  "purpose": (
                      "Controlled validation of NØX self-correction "
                      "proposals against fresh live evidence."
                  ),
                  "automatic_rule_deployment": False,
                  "external_action": False
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "human_override": True,
                  "proposal_only": True
              },

              "answer_status": (
                  "SELF_CORRECTION_PROPOSAL_GENERATED"
              ),

              "confidence": round(
                  min(
                      1.0,
                      (
                          selected_correction["score"]
                          / 100.0
                      )
                  ),
                  3
              )
          }

          # ---------------------------------------------------------
          # 13. SAVE JSON
          # ---------------------------------------------------------

          json_path = (
              "memory/"
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          save(
              json_path,
              result
          )

          # ---------------------------------------------------------
          # 14. SAVE MARKDOWN
          # ---------------------------------------------------------

          md = []

          md.append(
              "# NØX V92 — Autonomous Self-Correction Proposal"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "NØX analyses its own measured weaknesses and "
              "autonomously proposes and ranks possible corrections."
          )
          md.append("")
          md.append("## Current strategy")
          md.append("")
          md.append(
              f"- Strategy: {current_strategy}"
          )
          md.append(
              f"- Adaptive direction: {adaptive_direction}"
          )
          md.append(
              f"- V91 quality: {quality_profile}"
          )
          md.append("")
          md.append("## Stability")
          md.append("")
          md.append(
              f"- Overall stability: {overall_stability:.3f}"
          )
          md.append(
              f"- Decision stability: {decision_stability:.3f}"
          )
          md.append(
              f"- Evidence stability: {evidence_stability:.3f}"
          )
          md.append(
              f"- Strategy stability: {strategy_stability:.3f}"
          )
          md.append(
              f"- Reversal rate: {reversal_rate:.3f}"
          )
          md.append(
              f"- Over-pruning: {over_pruning}"
          )
          md.append(
              f"- Under-pruning: {under_pruning}"
          )
          md.append("")
          md.append("## Weaknesses")
          md.append("")

          for weakness in weaknesses:
              md.append(
                  f"- {weakness['id']} "
                  f"({weakness['severity']}): "
                  f"{weakness['description']}"
              )

          md.append("")
          md.append("## Correction options")
          md.append("")

          for correction in corrections:
              md.append(
                  f"### {correction['id']} — "
                  f"{correction['name']}"
              )
              md.append("")
              md.append(
                  f"- Score: {correction['score']}/100"
              )
              md.append(
                  f"- Change: {correction['change']}"
              )
              md.append(
                  f"- Benefit: {correction['benefit']}"
              )
              md.append(
                  f"- Risk: {correction['risk']}"
              )
              md.append(
                  "- Matched weaknesses: "
                  + (
                      ", ".join(
                          correction[
                              "matched_weaknesses"
                          ]
                      )
                      if correction[
                          "matched_weaknesses"
                      ]
                      else "none"
                  )
              )
              md.append("")

          md.append("## Selected correction")
          md.append("")
          md.append(
              f"- {selected_correction['id']}"
          )
          md.append(
              f"- {selected_correction['name']}"
          )
          md.append(
              f"- Score: {selected_correction['score']}/100"
          )
          md.append("")
          md.append("## Arbitration")
          md.append("")
          md.append(
              f"- Status: {arbitration_status}"
          )
          md.append(
              f"- Score gap: {score_gap}"
          )
          md.append(
              "- Autonomous selection: enabled"
          )
          md.append("")
          md.append("## Authority")
          md.append("")
          md.append(
              f"- Self-correction maturity: {maturity}"
          )
          md.append(
              f"- Proposal authority: {proposal_authority}"
          )
          md.append(
              "- Automatic rule deployment: disabled"
          )
          md.append(
              "- External action: disabled"
          )
          md.append("")
          md.append("## Learning principles")
          md.append("")

          for principle in principles:
              md.append(
                  f"- {principle}"
              )

          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V93 will test the selected correction against "
              "fresh evidence before any future increase in "
              "decision authority."
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append(
              "- Gemini: disabled"
          )
          md.append(
              "- External contact: disabled"
          )
          md.append(
              "- Bidding: disabled"
          )
          md.append(
              "- Payments: disabled"
          )
          md.append(
              "- Project cost: €0"
          )
          md.append(
              "- Human override: enabled"
          )

          md_path = (
              "memory/"
              "nox_v92_autonomous_self_correction_proposal.md"
          )

          with open(
              md_path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(md)
              )

          print(
              json.dumps(
                  {
                      "version": "V92",
                      "status": result["answer_status"],
                      "selected_correction": (
                          selected_correction["id"]
                      ),
                      "score": (
                          selected_correction["score"]
                      ),
