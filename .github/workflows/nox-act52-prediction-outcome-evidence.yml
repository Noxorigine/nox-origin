name: NØX ACT52 - Prediction Outcome Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  act52:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT52 - Prediction Outcome Evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT50_FILE = MEMORY_DIR / "nox_act_50_cognitive_decision_loop.json"
          ACT52_JSON = MEMORY_DIR / "nox_act_52_prediction_outcome_evidence.json"
          ACT52_MD = MEMORY_DIR / "nox_act_52_prediction_outcome_evidence.md"

          now = datetime.now(timezone.utc).isoformat()

          print("=" * 64)
          print("NØX ACT52 V1 - PREDICTION OUTCOME EVIDENCE")
          print("=" * 64)

          if not ACT50_FILE.exists():
              raise RuntimeError(
                  f"Required ACT50 memory not found: {ACT50_FILE}"
              )

          with ACT50_FILE.open("r", encoding="utf-8") as f:
              act50 = json.load(f)

          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  f"ACT50 identity check failed: "
                  f"expected ACT50, got {act50.get('act')!r}"
              )

          decision = act50.get("decision") or {}
          synthesis = act50.get("synthesis") or {}

          perception = (
              synthesis.get("perception_and_selection") or {}
          )
          perception_state = perception.get("state") or {}

          selected_action = perception_state.get("selected_action")
          selected_action_id = perception_state.get("selected_action_id")

          decision_status = decision.get("status")
          decision_supported = decision.get("supported")
          selected_decision_action = decision.get("selected_action")

          uncertainty_gate = act50.get("uncertainty_gate") or {}
          can_advance = uncertainty_gate.get("can_advance")

          print()
          print("ACT50 CURRENT STATE")
          print("-" * 64)
          print(f"decision status:          {decision_status!r}")
          print(f"decision supported:       {decision_supported!r}")
          print(f"decision action:          {selected_decision_action!r}")
          print(f"uncertainty can advance:  {can_advance!r}")
          print()
          print("ACT50 SELECTED EVIDENCE ACTION")
          print("-" * 64)
          print(f"action id:                {selected_action_id!r}")
          print(f"action:                   {selected_action!r}")

          # ACT52 does not invent prediction results.
          #
          # It creates an evidence record describing whether a real,
          # machine-observable prediction/outcome pair is currently
          # available in NØX's existing cognitive memory.
          #
          # No external AI, API, payment, marketplace action or Colony
          # creation is performed.

          outcome_evidence = []

          for filename in MEMORY_DIR.glob("*.json"):
              try:
                  with filename.open("r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception:
                  continue

              if not isinstance(data, dict):
                  continue

              # Explicit prediction/outcome structures only.
              predictions = data.get("predictions")
              outcomes = data.get("outcomes")

              if isinstance(predictions, list) and isinstance(outcomes, list):
                  for prediction in predictions:
                      if not isinstance(prediction, dict):
                          continue

                      prediction_id = prediction.get("prediction_id")

                      for outcome in outcomes:
                          if not isinstance(outcome, dict):
                              continue

                          if prediction_id and (
                              outcome.get("prediction_id") == prediction_id
                          ):
                              outcome_evidence.append({
                                  "source_file": str(filename),
                                  "prediction_id": prediction_id,
                                  "prediction": prediction,
                                  "outcome": outcome,
                              })

          matched_count = len(outcome_evidence)

          if matched_count > 0:
              status = "REAL_OUTCOME_EVIDENCE_AVAILABLE"
              learning_ready = True
              reason = (
                  "At least one explicit prediction/outcome pair was found "
                  "in NØX persistent memory."
              )
          else:
              status = "WAITING_FOR_REAL_OUTCOME_EVIDENCE"
              learning_ready = False
              reason = (
                  "No explicit prediction/outcome pair is currently available. "
                  "ACT52 will not invent or simulate an outcome."
              )

          record = {
              "act": "ACT52",
              "version": "V1",
              "title": "Prediction Outcome Evidence",
              "question": (
                  "Je confronte mes prédictions aux résultats réels "
                  "pour savoir si elles étaient justes."
              ),
              "timestamp_utc": now,

              "status": status,
              "learning_ready": learning_ready,

              "source": {
                  "act50_status": decision_status,
                  "act50_supported": decision_supported,
                  "act50_selected_action": selected_decision_action,
                  "act50_uncertainty_can_advance": can_advance,
                  "perception_selected_action_id": selected_action_id,
                  "perception_selected_action": selected_action,
              },

              "evidence": {
                  "matched_prediction_outcome_pairs": matched_count,
                  "pairs": outcome_evidence,
                  "real_only": True,
                  "simulated_outcomes": False,
                  "invented_outcomes": False,
              },

              "learning_gate": {
                  "real_evidence_available": matched_count > 0,
                  "can_calibrate_prediction": matched_count > 0,
                  "requires_more_observations": matched_count == 0,
              },

              "safety": {
                  "prediction_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
              },

              "reason": reason,

              "next_step": (
                  "Use real prediction/outcome pairs for evaluation and learning."
                  if matched_count > 0
                  else
                  "Continue collecting observable prediction outcomes; "
                  "do not fabricate evidence."
              ),
          }

          with ACT52_JSON.open("w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False, indent=2)

          markdown = f"""# NØX ACT52 V1 — Prediction Outcome Evidence

          ## Question

          > Je confronte mes prédictions aux résultats réels pour savoir si elles étaient justes.

          ## Status

          **{status}**

          ## Evidence

          - Matched prediction/outcome pairs: **{matched_count}**
          - Real evidence only: **True**
          - Simulated outcomes: **False**
          - Invented outcomes: **False**

          ## ACT50 context

          - Decision status: `{decision_status}`
          - Decision supported: `{decision_supported}`
          - Selected decision action: `{selected_decision_action}`
          - ACT49 uncertainty clearance: `{can_advance}`
          - Selected evidence action: `{selected_action!r}`

          ## Interpretation

          {reason}

          ## Safety

          ACT52 V1 does not invent predictions or outcomes.

          It does not use Gemini or another external AI.
          It does not make payments or spend money.
          It does not perform marketplace actions.
          It does not create a Colony.

          ## Next step

          {record["next_step"]}

          Generated: `{now}`
          """

          ACT52_MD.write_text(markdown, encoding="utf-8")

          print()
          print("=" * 64)
          print("ACT52 RESULT")
          print("=" * 64)
          print(f"status:                    {status}")
          print(f"matched prediction/outcome: {matched_count}")
          print(f"learning ready:            {learning_ready}")
          print()
          print(reason)
          print()
          print("[OK] ACT52 memory written.")
          PY

      - name: Commit and push ACT52 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_52_prediction_outcome_evidence.json
          git add memory/nox_act_52_prediction_outcome_evidence.md

          if git diff --cached --quiet; then
            echo "[INFO] No ACT52 changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT52 prediction outcome evidence"
          git push origin HEAD:main
