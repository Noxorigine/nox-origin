name: NØX Origin - V60 Opportunity Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opportunity-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Analyze marketplace opportunities
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/nox_v60.py <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          import requests


          BASE_URL = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")


          session = requests.Session()

          session.headers.update({
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-V60-Opportunity-Analyzer"
          })


          # ------------------------------------------------------------
          # 1. Authenticate
          # ------------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print("AUTH STATUS:", auth.status_code)

          if auth.status_code != 200:
              print(auth.text[:1000])
              raise RuntimeError("The Colony authentication failed")

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError("No access token returned")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })


          # ------------------------------------------------------------
          # 2. Retrieve open marketplace items
          # ------------------------------------------------------------

          endpoint = (
              f"{BASE_URL}/marketplace/tasks"
              "?status=open&sort=new&limit=100&offset=0"
          )

          response = session.get(
              endpoint,
              timeout=30
          )

          print("MARKETPLACE STATUS:", response.status_code)

          if response.status_code != 200:
              print(response.text[:2000])
              raise RuntimeError("Marketplace request failed")

          data = response.json()


          # ------------------------------------------------------------
          # 3. Normalize response
          # ------------------------------------------------------------

          if isinstance(data, list):
              raw_items = data

          elif isinstance(data, dict):
              raw_items = (
                  data.get("tasks")
                  or data.get("items")
                  or data.get("data")
                  or []
              )

          else:
              raw_items = []

          print("RAW MARKETPLACE ITEMS:", len(raw_items))


          # ------------------------------------------------------------
          # 4. Analyze each marketplace item
          # ------------------------------------------------------------

          opportunities = []
          rejected = []

          for item in raw_items:

              if not isinstance(item, dict):
                  continue

              title = str(
                  item.get("title")
                  or item.get("name")
                  or ""
              ).strip()

              description = str(
                  item.get("description")
                  or item.get("body")
                  or ""
              ).strip()

              text = f"{title} {description}".lower()

              status = str(
                  item.get("status")
                  or "unknown"
              ).strip()


              # --------------------------------------------------------
              # Detect economic signals
              # --------------------------------------------------------

              sats = "sat" in text or "sats" in text
              bitcoin = (
                  "bitcoin" in text
                  or "btc" in text
                  or "lightning" in text
              )

              explicit_price = any(
                  marker in text
                  for marker in [
                      "price:",
                      "reward:",
                      "bounty:",
                      "pay",
                      "paid",
                      "payment",
                      "earn"
                  ]
              )


              # --------------------------------------------------------
              # Detect task/request language
              # --------------------------------------------------------

              task_language = any(
                  marker in text
                  for marker in [
                      "need",
                      "looking for",
                      "looking to",
                      "seeking",
                      "wanted",
                      "request",
                      "task",
                      "job",
                      "help me",
                      "can someone",
                      "please do",
                      "deliver",
                      "complete"
                  ]
              )


              # --------------------------------------------------------
              # Detect service-provider language
              # --------------------------------------------------------

              service_language = any(
                  marker in text
                  for marker in [
                      "i will",
                      "i can",
                      "i offer",
                      "offering",
                      "for hire",
                      "available for hire",
                      "my service",
                      "my services",
                      "i provide",
                      "i'll write",
                      "i'll build",
                      "i'll create",
                      "i can help"
                  ]
              )


              # --------------------------------------------------------
              # Detect test / informational posts
              # --------------------------------------------------------

              test_or_meta = any(
                  marker in text
                  for marker in [
                      "test post",
                      "testing",
                      "test posting",
                      "updated ui",
                      "update the ui",
                      "demo",
                      "example post"
                  ]
              )


              # --------------------------------------------------------
              # Detect capabilities relevant to NØX
              # --------------------------------------------------------

              research = any(
                  marker in text
                  for marker in [
                      "research",
                      "researching",
                      "analysis",
                      "analyze",
                      "report",
                      "investigate",
                      "investigation"
                  ]
              )

              writing = any(
                  marker in text
                  for marker in [
                      "write",
                      "writing",
                      "document",
                      "documentation",
                      "readme",
                      "content",
                      "copy",
                      "pitch"
                  ]
              )

              python = any(
                  marker in text
                  for marker in [
                      "python",
                      "script",
                      "automation",
                      "automate"
                  ]
              )

              api = any(
                  marker in text
                  for marker in [
                      "api",
                      "endpoint",
                      "integration"
                  ]
              )

              data = any(
                  marker in text
                  for marker in [
                      "data",
                      "dataset",
                      "scraping",
                      "web scraping"
                  ]
              )

              verification = any(
                  marker in text
                  for marker in [
                      "verify",
                      "verification",
                      "qa",
                      "test",
                      "testing"
                  ]
              )


              # --------------------------------------------------------
              # Classification
              # --------------------------------------------------------

              if test_or_meta:
                  classification = "TEST_OR_META"

              elif service_language and not task_language:
                  classification = "SERVICE_OFFER"

              elif task_language:
                  classification = "POTENTIAL_TASK"

              elif explicit_price and (sats or bitcoin):
                  classification = "POTENTIAL_PAID_OPPORTUNITY"

              else:
                  classification = "UNCLEAR"


              # --------------------------------------------------------
              # Deterministic confidence score
              # --------------------------------------------------------

              confidence = 0

              if status == "open":
                  confidence += 2

              if task_language:
                  confidence += 3

              if explicit_price:
                  confidence += 2

              if sats:
                  confidence += 2

              if bitcoin:
                  confidence += 1

              if service_language:
                  confidence -= 4

              if test_or_meta:
                  confidence -= 6


              confidence = max(0, min(confidence, 10))


              # --------------------------------------------------------
              # NØX capability score
              # --------------------------------------------------------

              capability_score = 0

              if research:
                  capability_score += 3

              if writing:
                  capability_score += 3

              if python:
                  capability_score += 2

              if api:
                  capability_score += 2

              if data:
                  capability_score += 2

              if verification:
                  capability_score += 2


              # --------------------------------------------------------
              # Economic score
              # --------------------------------------------------------

              economic_score = 0

              if sats:
                  economic_score += 4

              if bitcoin:
                  economic_score += 2

              if explicit_price:
                  economic_score += 3


              # --------------------------------------------------------
              # Final opportunity score
              # --------------------------------------------------------

              opportunity_score = (
                  confidence
                  + capability_score
                  + economic_score
              )


              result = {
                  "id": item.get("id"),
                  "title": title,
                  "description": description[:2000],
                  "status": status,
                  "classification": classification,
                  "confidence_score": confidence,
                  "capability_score": capability_score,
                  "economic_score": economic_score,
                  "opportunity_score": opportunity_score,
                  "signals": {
                      "task_language": task_language,
                      "service_language": service_language,
                      "test_or_meta": test_or_meta,
                      "explicit_price": explicit_price,
                      "sats": sats,
                      "bitcoin_or_lightning": bitcoin,
                      "research": research,
                      "writing": writing,
                      "python": python,
                      "api": api,
                      "data": data,
                      "verification": verification
                  }
              }


              # --------------------------------------------------------
              # Keep only serious candidates
              # --------------------------------------------------------

              if (
                  classification in [
                      "POTENTIAL_TASK",
                      "POTENTIAL_PAID_OPPORTUNITY"
                  ]
                  and not test_or_meta
                  and confidence >= 4
              ):
                  opportunities.append(result)

              else:
                  rejected.append(result)


          # ------------------------------------------------------------
          # 5. Rank opportunities
          # ------------------------------------------------------------

          opportunities.sort(
              key=lambda x: (
                  x["opportunity_score"],
                  x["economic_score"],
                  x["capability_score"]
              ),
              reverse=True
          )


          # ------------------------------------------------------------
          # 6. Determine recommended next step
          # ------------------------------------------------------------

          if opportunities:
              top = opportunities[0]

              recommendation = {
                  "action": "MANUAL_REVIEW_REQUIRED",
                  "reason": (
                      "A potentially useful marketplace opportunity "
                      "was detected. NØX must not act automatically."
                  ),
                  "top_opportunity_id": top["id"],
                  "top_opportunity_score": top["opportunity_score"]
              }

          else:
              recommendation = {
                  "action": "CONTINUE_OBSERVATION",
                  "reason": (
                      "No sufficiently reliable paid task was identified."
                  ),
                  "top_opportunity_id": None,
                  "top_opportunity_score": 0
              }


          # ------------------------------------------------------------
          # 7. Save V60 memory
          # ------------------------------------------------------------

          os.makedirs("memory", exist_ok=True)

          memory = {
              "version": "V60",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "analysis_only",
              "actions_taken": [],
              "gemini_used": False,
              "total_raw_items": len(raw_items),
              "qualified_opportunities": len(opportunities),
              "rejected_or_unclear": len(rejected),
              "recommendation": recommendation,
              "opportunities": opportunities[:20],
              "rejected_items": rejected[:50]
          }


          memory_path = "memory/nox_v60_opportunities.json"

          with open(
              memory_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ------------------------------------------------------------
          # 8. Console report
          # ------------------------------------------------------------

          print("")
          print("================================================")
          print("NØX V60 OPPORTUNITY ANALYSIS")
          print("================================================")
          print("Raw marketplace items :", len(raw_items))
          print("Qualified opportunities:", len(opportunities))
          print("Rejected / unclear    :", len(rejected))
          print("Actions taken         : 0")
          print("Gemini used           : NO")
          print("================================================")

          if opportunities:

              print("")
              print("TOP OPPORTUNITIES")
              print("-----------------------------------------------")

              for index, opportunity in enumerate(
                  opportunities[:10],
                  1
              ):

                  print(
                      f"{index}. "
                      f"{opportunity['title'][:100]}"
                  )

                  print(
                      f"   classification="
                      f"{opportunity['classification']}"
                  )

                  print(
                      f"   confidence="
                      f"{opportunity['confidence_score']}/10"
                  )

                  print(
                      f"   capability="
                      f"{opportunity['capability_score']}"
                  )

                  print(
                      f"   economic="
                      f"{opportunity['economic_score']}"
                  )

                  print(
                      f"   opportunity="
                      f"{opportunity['opportunity_score']}"
                  )

                  print(
                      f"   id="
                      f"{opportunity['id']}"
                  )

          else:

              print("")
              print("NO QUALIFIED OPPORTUNITY FOUND")


          print("")
          print(
              "Recommendation:",
              recommendation["action"]
          )

          print(
              "Memory saved to",
              memory_path
          )

          PY

          python /tmp/nox_v60.py

      - name: Commit V60 opportunity analysis
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v60_opportunities.json

          if git diff --cached --quiet; then
            echo "No V60 changes to commit."
          else
            git commit -m "NØX V60 opportunity analysis"
            git push
          fi
