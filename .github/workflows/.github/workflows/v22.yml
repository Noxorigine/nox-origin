name: NØX Origin - V22 Hypothesis Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hypothesis-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V22 local reasoning
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          principles = memory.get("principles", [])
          hypotheses = memory.get("hypotheses", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(contradictions, list):
              contradictions = []

          now = datetime.now(timezone.utc).isoformat()

          def clean(text):
              return re.sub(r"\s+", " ", str(text).strip().lower())

          # ---------------------------------------------------------
          # 1. Construire un index des thèmes actifs
          # ---------------------------------------------------------

          active_topics = {
              p.get("topic")
              for p in patterns
              if p.get("topic")
          }

          # ---------------------------------------------------------
          # 2. Générer des hypothèses testables
          # ---------------------------------------------------------

          candidate_hypotheses = []

          if "memory" in active_topics and "efficiency" in active_topics:
              candidate_hypotheses.append({
                  "topic": "memory_efficiency",
                  "hypothesis":
                      "An agent's useful memory horizon is constrained by the computational cost of retained context.",
                  "test":
                      "Compare task performance while progressively increasing retained context under a fixed compute budget.",
                  "status": "untested",
                  "source": "V22_local_reasoning"
              })

          if "verification" in active_topics and "security" in active_topics:
              candidate_hypotheses.append({
                  "topic": "verification_security",
                  "hypothesis":
                      "Explicit verification gates reduce the probability of false-positive autonomous actions.",
                  "test":
                      "Compare autonomous actions with and without an explicit verification gate.",
                  "status": "untested",
                  "source": "V22_local_reasoning"
              })

          if "autonomy" in active_topics and "security" in active_topics:
              candidate_hypotheses.append({
                  "topic": "bounded_autonomy",
                  "hypothesis":
                      "Autonomy becomes more reliable when capabilities are paired with explicit operational boundaries.",
                  "test":
                      "Compare failure rates between unrestricted and boundary-constrained agent workflows.",
                  "status": "untested",
                  "source": "V22_local_reasoning"
              })

          if "learning" in active_topics and "verification" in active_topics:
              candidate_hypotheses.append({
                  "topic": "verified_learning",
                  "hypothesis":
                      "Learning from verified successful trajectories produces more reliable improvements than learning from unverified outcomes.",
                  "test":
                      "Compare learning updates derived from verified versus unverified trajectories.",
                  "status": "untested",
                  "source": "V22_local_reasoning"
              })

          # ---------------------------------------------------------
          # 3. Déduplication
          # ---------------------------------------------------------

          existing_h = {
              clean(h.get("hypothesis", ""))
              for h in hypotheses
              if isinstance(h, dict)
          }

          new_hypotheses = []

          for candidate in candidate_hypotheses:
              key = clean(candidate["hypothesis"])

              if key not in existing_h:
                  candidate["created_at"] = now
                  hypotheses.append(candidate)
                  new_hypotheses.append(candidate)
                  existing_h.add(key)

          # ---------------------------------------------------------
          # 4. Recherche de contradictions potentielles
          # ---------------------------------------------------------

          contradiction_pairs = []

          # Tension mémoire / efficacité
          if "memory" in active_topics and "efficiency" in active_topics:
              contradiction_pairs.append({
                  "topics": ["memory", "efficiency"],
                  "description":
                      "Retaining more context can improve continuity while increasing computational and latency costs.",
                  "status": "tension_to_test",
                  "source": "V22_local_reasoning"
              })

          # Tension autonomie / sécurité
          if "autonomy" in active_topics and "security" in active_topics:
              contradiction_pairs.append({
                  "topics": ["autonomy", "security"],
                  "description":
                      "Increasing agent autonomy can expand the operational attack or failure surface unless capabilities remain bounded.",
                  "status": "tension_to_test",
                  "source": "V22_local_reasoning"
              })

          existing_c = {
              clean(c.get("description", ""))
              for c in contradictions
              if isinstance(c, dict)
          }

          new_contradictions = []

          for candidate in contradiction_pairs:
              key = clean(candidate["description"])

              if key not in existing_c:
                  candidate["created_at"] = now
                  contradictions.append(candidate)
                  new_contradictions.append(candidate)
                  existing_c.add(key)

          # ---------------------------------------------------------
          # 5. Générer un résumé interne de raisonnement
          # ---------------------------------------------------------

          reasoning_state = {
              "updated_at": now,
              "active_topics": sorted(active_topics),
              "hypotheses_total": len(hypotheses),
              "contradictions_total": len(contradictions),
              "new_hypotheses": len(new_hypotheses),
              "new_contradictions": len(new_contradictions),
              "method": "local_symbolic_reasoning"
          }

          # ---------------------------------------------------------
          # 6. Historique V22
          # ---------------------------------------------------------

          history.append({
              "version": "V22",
              "timestamp": now,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "hypotheses_total": len(hypotheses),
              "contradictions_total": len(contradictions),
              "new_hypotheses": len(new_hypotheses),
              "new_contradictions": len(new_contradictions),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_symbolic_reasoning"
          })

          # ---------------------------------------------------------
          # 7. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V22"
          memory["updated_at"] = now
          memory["hypotheses"] = hypotheses
          memory["contradictions"] = contradictions
          memory["reasoning_state"] = reasoning_state
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 8. Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V22")
          print("==========================================")
          print(f"Observations       : {len(observations)}")
          print(f"Patterns           : {len(patterns)}")
          print(f"Knowledge          : {len(knowledge)}")
          print(f"Principles         : {len(principles)}")
          print(f"Hypotheses         : {len(hypotheses)}")
          print(f"New hypotheses     : {len(new_hypotheses)}")
          print(f"Contradictions     : {len(contradictions)}")
          print(f"New contradictions : {len(new_contradictions)}")
          print("Reasoning          : LOCAL")
          print("Gemini             : NON REQUIS")
          print("Cost               : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V22 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V22 hypothesis engine"

          git push
