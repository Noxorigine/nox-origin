name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create V48 script
        shell: bash
        run: |
          cat > nox_v48.py <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")


          # --------------------------------------------------
          # FILES
          # --------------------------------------------------

          previous_report = Path("V47_MULTI_SOURCE_RESEARCH.md")

          if not previous_report.exists():
              raise RuntimeError(
                  "V47_MULTI_SOURCE_RESEARCH.md not found."
              )

          text = previous_report.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------
          # RESEARCH QUESTION
          # --------------------------------------------------

          question_match = re.search(
              r"Research Question\s*\n\s*(.*?)(?:\n\n|$)",
              text,
              re.S | re.I,
          )

          if question_match:
              research_question = (
                  question_match.group(1)
                  .strip()
                  .replace("\n", " ")
              )
          else:
              research_question = (
                  "What information is supported by the discovered sources?"
              )


          print(
              f"Research question: "
              f"{research_question[:200]}"
          )


          # --------------------------------------------------
          # SOURCE EXTRACTION
          #
          # Do NOT depend on the exact V47 section layout.
          # Search the complete report for real source blocks.
          # Ignore summary/statistics lines such as:
          # "- Total: 9"
          # --------------------------------------------------

          sources = []

          source_pattern = re.compile(
              r"(?:^|\n)"
              r"(?:#{1,6}\s*)?"
              r"(?P<title>[^\n]+)"
              r"\n\s*Category:\s*(?P<category>[^\n]*)"
              r"(?:\n[^\n]*)*?"
              r"\n\s*URL:\s*(?P<url>\S+)",
              re.I,
          )

          for match in source_pattern.finditer(text):

              title = match.group("title").strip()
              category = match.group("category").strip()
              url = match.group("url").strip()

              # Ignore metadata/statistical lines.
              if not title:
                  continue

              if title.startswith("-"):
                  continue

              if title.lower().startswith("total:"):
                  continue

              if title.lower().startswith("sources discovered"):
                  continue

              if title.lower().startswith("research question"):
                  continue

              # Ignore obvious section headings.
              if title.startswith("#"):
                  continue

              # A source needs at least a meaningful title
              # or a URL. Prefer both.
              if len(title) < 4 and not url:
                  continue

              source = {
                  "title": title,
                  "category": category,
                  "url": url,
              }

              # Prevent duplicates.
              if source not in sources:
                  sources.append(source)


          # --------------------------------------------------
          # FALLBACK URL-BASED EXTRACTION
          #
          # If the normal block format is absent, search for
          # URL lines and recover nearby information.
          # --------------------------------------------------

          if not sources:

              lines = text.splitlines()

              for index, line in enumerate(lines):

                  if not re.match(
                      r"^\s*URL:\s*\S+",
                      line,
                      re.I,
                  ):
                      continue

                  url = re.sub(
                      r"^\s*URL:\s*",
                      "",
                      line,
                      flags=re.I,
                  ).strip()

                  title = ""
                  category = ""

                  # Look backwards for nearby metadata.
                  for previous in reversed(
                      lines[max(0, index - 8):index]
                  ):
                      candidate = previous.strip()

                      if not candidate:
                          continue

                      if candidate.startswith("-"):
                          continue

                      if re.match(
                          r"^Category:",
                          candidate,
                          re.I,
                      ):
                          category = re.sub(
                              r"^Category:\s*",
                              "",
                              candidate,
                              flags=re.I,
                          ).strip()
                          continue

                      if re.match(
                          r"^(Title|Source):",
                          candidate,
                          re.I,
                      ):
                          title = re.sub(
                              r"^(Title|Source):\s*",
                              "",
                              candidate,
                              flags=re.I,
                          ).strip()
                          break

                      if not title and len(candidate) >= 4:
                          title = candidate

                  if title:
                      source = {
                          "title": title,
                          "category": category,
                          "url": url,
                      }

                      if source not in sources:
                          sources.append(source)


          print(
              f"Candidate sources detected: "
              f"{len(sources)}"
          )


          if sources:
              for number, source in enumerate(
                  sources,
                  start=1,
              ):
                  print(
                      f"  {number}. "
                      f"{source['title'][:100]}"
                  )


          if not sources:
              raise RuntimeError(
                  "V48 could not identify any real source "
                  "entries in V47. The report format must "
                  "be inspected before continuing."
              )


          # --------------------------------------------------
          # GEMINI API
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )


          prompt = f"""
You are NØX Origin.

Your task is to evaluate the relevance and evidentiary
value of discovered sources.

DO NOT answer the research question.

Research question:

{research_question}

Evaluate every source independently.

Rules:

1. Keyword overlap is not evidence.
2. A source title is not evidence.
3. An unrelated source must receive a very low score.
4. Background information must be distinguished from direct evidence.
5. Never invent information not present in the supplied source data.
6. Missing source context means uncertainty.
7. Academic metadata without accessible content is not
   substantive evidence.
8. Prefer precision over optimism.
9. Evaluate every source independently.
10. A source can be relevant without providing direct evidence.
11. Do not upgrade a source merely because its title sounds scientific.
12. If the supplied information is insufficient, reduce the score.
13. Never treat a metadata artifact as a real source.

Relevance scale:

0.00-0.19 = irrelevant
0.20-0.39 = weak contextual relevance
0.40-0.59 = potentially useful
0.60-0.79 = relevant
0.80-1.00 = directly relevant

Evidence strength:

none
contextual
indirect
substantive
direct

Return ONLY valid JSON.

Format:

{{
  "evaluations": [
    {{
      "index": 1,
      "relevance_score": 0.00,
      "classification": "irrelevant",
      "reason": "short explanation",
      "evidence_strength": "none"
    }}
  ]
}}

Sources:

{json.dumps(
    sources,
    ensure_ascii=False,
    indent=2
)}
"""


          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.6-flash:generateContent"
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "responseMimeType": "application/json",
              },
          }


          try:

              response = requests.post(
                  endpoint,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                  },
                  json=payload,
                  timeout=(15, 60),
              )

          except requests.RequestException as exc:

              raise RuntimeError(
                  f"Gemini connection failed: {exc}"
              )


          print(
              f"Gemini status: "
              f"{response.status_code}"
          )


          if response.status_code != 200:

              raise RuntimeError(
                  f"Gemini request failed: "
                  f"{response.status_code} "
                  f"{response.text[:1000]}"
              )


          try:

              result = response.json()

          except ValueError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid HTTP JSON: {exc}"
              )


          try:

              raw_text = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

          except (
              KeyError,
              IndexError,
              TypeError,
          ) as exc:

              raise RuntimeError(
                  f"Unexpected Gemini response: {exc}"
              )


          try:

              evaluations = json.loads(
                  raw_text
              )

          except json.JSONDecodeError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid "
                  f"evaluation JSON: {exc}"
              )


          if not isinstance(
              evaluations,
              dict,
          ):

              raise RuntimeError(
                  "Gemini evaluation is not "
                  "a JSON object."
              )


          # --------------------------------------------------
          # VALIDATE EVALUATIONS
          # --------------------------------------------------

          evaluated_sources = []

          allowed_classifications = {
              "irrelevant",
              "weak contextual relevance",
              "potentially useful",
              "relevant",
              "directly relevant",
          }

          allowed_evidence = {
              "none",
              "contextual",
              "indirect",
              "substantive",
              "direct",
          }


          for item in evaluations.get(
              "evaluations",
              [],
          ):

              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              index = item.get("index")

              if not isinstance(
                  index,
                  int,
              ):
                  continue

              if index < 1 or index > len(sources):
                  continue

              source = dict(
                  sources[index - 1]
              )


              try:

                  score = float(
                      item.get(
                          "relevance_score",
                          0.0,
                      )
                  )

              except (
                  TypeError,
                  ValueError,
              ):

                  score = 0.0


              score = max(
                  0.0,
                  min(1.0, score),
              )


              classification = item.get(
                  "classification",
                  "unknown",
              )

              if classification not in (
                  allowed_classifications
              ):
                  classification = "unknown"


              evidence_strength = item.get(
                  "evidence_strength",
                  "none",
              )

              if evidence_strength not in (
                  allowed_evidence
              ):
                  evidence_strength = "none"


              source["relevance_score"] = score

              source["classification"] = (
                  classification
              )

              source["reason"] = str(
                  item.get(
                      "reason",
                      "",
                  )
              ).strip()

              source["evidence_strength"] = (
                  evidence_strength
              )


              evaluated_sources.append(
                  source
              )


          if not evaluated_sources:

              raise RuntimeError(
                  "Gemini returned no usable evaluations."
              )


          # --------------------------------------------------
          # CLASSIFICATION
          # --------------------------------------------------

          direct = [
              s
              for s in evaluated_sources
              if s["relevance_score"] >= 0.80
          ]

          relevant = [
              s
              for s in evaluated_sources
              if 0.60 <= s["relevance_score"] < 0.80
          ]

          contextual = [
              s
              for s in evaluated_sources
              if 0.20 <= s["relevance_score"] < 0.60
          ]

          irrelevant = [
              s
              for s in evaluated_sources
              if s["relevance_score"] < 0.20
          ]


          average_score = round(
              sum(
                  s["relevance_score"]
                  for s in evaluated_sources
              )
              / len(evaluated_sources),
              3,
          )


          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()

          memory_dir = Path(
              "nox_memory"
          )

          memory_dir.mkdir(
              exist_ok=True
          )


          memory = {
              "version": "V48",
              "created_at": now,
              "research_question": research_question,
              "source_count": len(
                  evaluated_sources
              ),
              "direct_sources": len(direct),
              "relevant_sources": len(relevant),
              "contextual_sources": len(contextual),
              "irrelevant_sources": len(irrelevant),
              "average_relevance": average_score,
              "sources": evaluated_sources,
              "learning": {
                  "keyword_match_is_not_evidence": True,
                  "title_is_not_proof": True,
                  "metadata_is_not_evidence": True,
                  "missing_context_is_uncertainty": True,
                  "false_positive_filtering": True,
                  "precision_over_optimism": True,
                  "source_structure_validation": True,
              },
              "last_updated": now,
          }


          Path(
              "nox_memory/nox_memory_v48.json"
          ).write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              research_question,
              "",
              "## Results",
              "",
              f"- Candidates evaluated: "
              f"{len(evaluated_sources)}",
              f"- Directly relevant: "
              f"{len(direct)}",
              f"- Relevant: "
              f"{len(relevant)}",
              f"- Contextual: "
              f"{len(contextual)}",
              f"- Irrelevant: "
              f"{len(irrelevant)}",
              f"- Average relevance: "
              f"{average_score}",
              "",
              "## Evaluated Sources",
              "",
          ]


          for number, source in enumerate(
              evaluated_sources,
              start=1,
          ):

              report.extend(
                  [
                      f"### Source {number}",
                      "",
                      f"**Title:** "
                      f"{source['title']}",
                      "",
                      f"**Category:** "
                      f"{source['category']}",
                      "",
                      f"**Relevance:** "
                      f"{source['relevance_score']:.2f}",
                      "",
                      f"**Classification:** "
                      f"{source['classification']}",
                      "",
                      f"**Evidence strength:** "
                      f"{source['evidence_strength']}",
                      "",
                      f"**Reason:** "
                      f"{source['reason']}",
                      "",
                      f"**URL:** "
                      f"{source['url']}",
                      "",
                  ]
              )


          report.extend(
              [
                  "## V48 Learning",
                  "",
                  "NØX now distinguishes source relevance "
                  "from evidentiary strength.",
                  "",
                  "Keyword overlap is not evidence.",
                  "",
                  "A source title is not evidence.",
                  "",
                  "Academic metadata is not substantive evidence.",
                  "",
                  "Missing context remains uncertainty.",
                  "",
                  "False positives must be filtered "
                  "before knowledge is strengthened.",
                  "",
                  "Source structure must be validated "
                  "before analysis.",
                  "",
                  "## V48 Principle",
                  "",
                  "NØX does not ask only whether it found "
                  "a source.",
                  "",
                  "It asks whether that source deserves "
                  "to influence its knowledge.",
              ]
          )


          Path(
              "V48_SOURCE_FILTER.md"
          ).write_text(
              "\n".join(report),
              encoding="utf-8",
          )


          # --------------------------------------------------
          # FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V48 SOURCE FILTER RESULT")
          print("===================================")
          print(
              f"Sources evaluated: "
              f"{len(evaluated_sources)}"
          )
          print(
              f"Directly relevant: "
              f"{len(direct)}"
          )
          print(
              f"Relevant: "
              f"{len(relevant)}"
          )
          print(
              f"Contextual: "
              f"{len(contextual)}"
          )
          print(
              f"Irrelevant: "
              f"{len(irrelevant)}"
          )
          print(
              f"Average relevance: "
              f"{average_score}"
          )
          print(
              "Source structure validation: PASS"
          )
          print(
              "False-positive filtering: PASS"
          )
          print(
              "Memory written: PASS"
          )
          print(
              "Report written: PASS"
          )
          print("===================================")

          PY

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python nox_v48.py

      - name: Commit V48 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"
          git add nox_memory/ V48_SOURCE_FILTER.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
