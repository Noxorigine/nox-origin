name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-relevance-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import requests
          from pathlib import Path
          from datetime import datetime, timezone


          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")


          # --------------------------------------------------
          # TIME
          # --------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()


          # --------------------------------------------------
          # FILES
          # --------------------------------------------------

          memory_file = Path(
              "nox_memory.json"
          )

          report_file = Path(
              "V48_SOURCE_FILTER.md"
          )


          # --------------------------------------------------
          # LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():

              try:

                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  memory = {}

          else:

              memory = {}


          if not isinstance(
              memory,
              dict
          ):

              memory = {}


          memory.setdefault(
              "question_log",
              []
          )

          memory.setdefault(
              "source_log",
              []
          )

          memory.setdefault(
              "knowledge_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []

          )


          # --------------------------------------------------
          # FIND OPEN QUESTION
          # --------------------------------------------------

          open_questions = [
              q
              for q in memory["question_log"]
              if isinstance(q, dict)
              and q.get("status") == "open"
          ]


          if not open_questions:

              raise RuntimeError(
                  "No open curiosity question found."
              )


          question_record = open_questions[-1]


          question = str(
              question_record.get(
                  "question",
                  ""
              )
          ).strip()


          subject = str(
              question_record.get(
                  "subject",
                  ""
              )
          ).strip()


          if not question:

              raise RuntimeError(
                  "Open question is empty."
              )


          print(
              "Subject:",
              subject
          )

          print(
              "Question:",
              question
          )


          # --------------------------------------------------
          # GEMINI CONFIGURATION
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )


          if not api_key:

              raise RuntimeError(
                  "GEMINI_API_KEY is missing."
              )


          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )


          headers = {
              "Content-Type":
                  "application/json",
              "x-goog-api-key":
                  api_key
          }


          # --------------------------------------------------
          # GEMINI REQUEST
          # --------------------------------------------------

          def gemini_request(prompt):

              for attempt in range(1, 4):

                  try:

                      response = requests.post(
                          gemini_url,
                          headers=headers,
                          json={
                              "model":
                                  "gemini-3.6-flash",
                              "input":
                                  prompt
                          },
                          timeout=(20, 120)
                      )


                      print(
                          "Gemini status:",
                          response.status_code
                      )


                      if response.status_code == 200:

                          return response.json()


                      if response.status_code in (
                          408,
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt < 3:

                              time.sleep(
                                  attempt * 5
                              )

                              continue


                      raise RuntimeError(
                          "Gemini request failed: "
                          f"{response.status_code} "
                          f"{response.text[:1500]}"
                      )


                  except requests.exceptions.Timeout:

                      print(
                          "Gemini timeout."
                      )


                      if attempt < 3:

                          time.sleep(
                              attempt * 5
                          )

                          continue


                      raise RuntimeError(
                          "Gemini request timed out."
                      )


          def extract_text(result):

              if isinstance(
                  result.get(
                      "output_text"
                  ),
                  str
              ):

                  return result[
                      "output_text"
                  ].strip()


              text_parts = []


              for step in result.get(
                  "steps",
                  []
              ):

                  if not isinstance(
                      step,
                      dict
                  ):

                      continue


                  if step.get(
                      "type"
                  ) != "model_output":

                      continue


                  for part in step.get(
                      "content",
                      []
                  ):

                      if (
                          isinstance(
                              part,
                              dict
                          )
                          and part.get(
                              "type"
                          ) == "text"
                      ):

                          text_parts.append(
                              str(
                                  part.get(
                                      "text",
                                      ""
                                  )
                              )
                          )


              return "\n".join(
                  text_parts
              ).strip()


          # --------------------------------------------------
          # SOURCE RECORDS FROM V47
          # --------------------------------------------------

          previous_source_logs = [
              item
              for item in memory["source_log"]
              if isinstance(
                  item,
                  dict
              )
          ]


          if not previous_source_logs:

              raise RuntimeError(
                  "No V47 source research found."
              )


          latest_source_log = (
              previous_source_logs[-1]
          )


          raw_sources = latest_source_log.get(
              "sources",
              []
          )


          if not isinstance(
              raw_sources,
              list
          ):

              raw_sources = []


          # --------------------------------------------------
          # BACKWARD COMPATIBILITY
          # --------------------------------------------------
          # V47 may have stored only source counts
          # instead of complete source records.
          # In that case reconstruct a minimal source
          # record from the available analysis metadata.

          if not raw_sources:

              discovered_count = latest_source_log.get(
                  "sources_discovered",
                  0
              )

              raw_sources = [
                  {
                      "category":
                          "metadata_only",
                      "title":
                          f"- Total: {discovered_count}",
                      "url":
                          "",
                      "context":
                          "",
                      "context_available":
                          False
                  }
              ]


          print(
              "Sources available for filtering:",
              len(raw_sources)
          )


          # --------------------------------------------------
          # NORMALIZE SOURCES
          # --------------------------------------------------

          sources = []


          for index, source in enumerate(
              raw_sources,
              start=1
          ):

              if not isinstance(
                  source,
                  dict
              ):

                  continue


              title = str(
                  source.get(
                      "title",
                      ""
                  )
              ).strip()


              category = str(
                  source.get(
                      "category",
                      "unknown"
                  )
              ).strip()


              url = str(
                  source.get(
                      "url",
                      ""
                  )
              ).strip()


              context = str(
                  source.get(
                      "context",
                      ""
                  )
              ).strip()


              context_available = bool(
                  source.get(
                      "context_available",
                      bool(context)
                  )
              )


              if len(context) > 4000:

                  context = (
                      context[:4000]
                      + "..."
                  )


              sources.append(
                  {
                      "source_number":
                          index,
                      "category":
                          category,
                      "title":
                          title,
                      "url":
                          url,
                      "context":
                          context,
                      "context_available":
                          context_available
                  }
              )


          if not sources:

              raise RuntimeError(
                  "No usable source records found."
              )


          # --------------------------------------------------
          # SOURCE FILTER PROMPT
          # --------------------------------------------------

          source_payload = json.dumps(
              sources,
              ensure_ascii=False,
              indent=2
          )


          filter_prompt = f"""
          You are NØX Origin.

          Your task is SOURCE RELEVANCE FILTERING.

          Research subject:
          {subject}

          Research question:
          {question}

          The supplied sources come from a previous
          multi-source research step.

          Your job is NOT to answer the research question.

          Your job is to determine whether each source
          deserves to influence future knowledge.

          STRICT RULES:

          1. A title alone is NOT evidence.
          2. Keyword overlap is NOT evidence.
          3. Metadata alone is NOT substantive evidence.
          4. A missing or empty context means the source
             cannot be considered directly evidentiary.
          5. Never invent source content.
          6. Never infer facts that are not present
             in the supplied source record.
          7. If a source is only a count, metadata artifact,
             search signal, or empty record, classify it
             as irrelevant or contextual with low confidence.
          8. Direct relevance requires actual supplied
             content that meaningfully addresses the
             research question.
          9. A source can be useful context without
             providing evidence.
          10. When uncertain, prefer a lower relevance
              classification rather than a false positive.

          RELEVANCE LEVELS:

          directly_relevant:
          The supplied source content directly addresses
          the research question.

          relevant:
          The supplied content is meaningfully related,
          but does not directly establish the answer.

          contextual:
          The source provides background but cannot
          materially answer the question.

          irrelevant:
          The source does not provide useful evidence
          or meaningful context for the question.

          For every source provide:

          - source_number
          - relevance
          - relevance_score from 0.0 to 1.0
          - evidence_strength
          - reason
          - content_supported
          - should_influence_knowledge

          EVIDENCE_STRENGTH must be one of:

          strong
          moderate
          weak
          none

          content_supported must be:

          true

          only when the supplied content itself supports
          the relevance judgment.

          Otherwise use:

          false

          should_influence_knowledge must be:

          true

          only when the source contains enough substantive
          information to legitimately influence future
          knowledge.

          Return ONLY valid JSON.

          Required format:

          {{
            "evaluated_sources": [
              {{
                "source_number": 1,
                "relevance": "directly_relevant|relevant|contextual|irrelevant",
                "relevance_score": 0.0,
                "evidence_strength": "strong|moderate|weak|none",
                "reason": "why",
                "content_supported": false,
                "should_influence_knowledge": false
              }}
            ],
            "summary": "short summary",
            "false_positive_warning": "short warning",
            "filter_principle": "short principle"
          }}

          SOURCES:

          {source_payload}
          """


          # --------------------------------------------------
          # RUN FILTER
          # --------------------------------------------------

          print(
              "Starting V48 source relevance filter..."
          )


          result = gemini_request(
              filter_prompt
          )


          raw_analysis = extract_text(
              result
          )


          if not raw_analysis:

              raise RuntimeError(
                  "Empty V48 filter response."
              )


          raw_analysis = raw_analysis.strip()


          if raw_analysis.startswith(
              "```json"
          ):

              raw_analysis = raw_analysis[
                  7:
              ].strip()


          elif raw_analysis.startswith(
              "```"
          ):

              raw_analysis = raw_analysis[
                  3:
              ].strip()


          if raw_analysis.endswith(
              "```"
          ):

              raw_analysis = raw_analysis[
                  :-3
              ].strip()


          try:

              filter_result = json.loads(
                  raw_analysis
              )

          except json.JSONDecodeError as exc:

              print(
                  "Gemini raw filter response:"
              )

              print(
                  raw_analysis[:5000]
              )

              raise RuntimeError(
                  "Invalid V48 filter JSON: "
                  f"{exc}"
              )


          if not isinstance(
              filter_result,
              dict
          ):

              raise RuntimeError(
                  "V48 filter result is not a JSON object."
              )


          evaluated_sources = filter_result.get(
              "evaluated_sources",
              []
          )


          if not isinstance(
              evaluated_sources,
              list
          ):

              evaluated_sources = []


          # --------------------------------------------------
          # VALIDATE FILTER RESULTS
          # --------------------------------------------------

          allowed_relevance = {
              "directly_relevant",
              "relevant",
              "contextual",
              "irrelevant"
          }


          allowed_strength = {
              "strong",
              "moderate",
              "weak",
              "none"
          }


          valid_results = []


          for item in evaluated_sources:

              if not isinstance(
                  item,
                  dict
              ):

                  continue


              try:

                  source_number = int(
                      item.get(
                          "source_number"
                      )
                  )

              except (
                  TypeError,
                  ValueError
              ):

                  continue


              if (
                  source_number < 1
                  or source_number > len(sources)
              ):

                  continue


              relevance = item.get(
                  "relevance",
                  "irrelevant"
              )


              if relevance not in allowed_relevance:

                  relevance = "irrelevant"


              evidence_strength = item.get(
                  "evidence_strength",
                  "none"
              )


              if evidence_strength not in allowed_strength:

                  evidence_strength = "none"


              try:

                  relevance_score = float(
                      item.get(
                          "relevance_score",
                          0.0
                      )
                  )

              except (
                  TypeError,
                  ValueError
              ):

                  relevance_score = 0.0


              relevance_score = max(
                  0.0,
                  min(
                      1.0,
                      relevance_score
                  )
              )


              reason = str(
                  item.get(
                      "reason",
                      ""
                  )
              ).strip()


              content_supported = bool(
                  item.get(
                      "content_supported",
                      False
                  )
              )


              should_influence = bool(
                  item.get(
                      "should_influence_knowledge",
                      False
                  )
              )


              # --------------------------------------------
              # SAFETY OVERRIDE
              # --------------------------------------------
              # A source without actual supplied context
              # cannot become evidentiary merely because
              # Gemini classified it as relevant.

              source = sources[
                  source_number - 1
              ]


              if not source.get(
                  "context_available",
                  False
              ):

                  if relevance == "directly_relevant":

                      relevance = "contextual"


                  if evidence_strength != "none":

                      evidence_strength = "none"


                  content_supported = False
                  should_influence = False


              if not source.get(
                  "context",
                  ""
              ).strip():

                  should_influence = False


              if (
                  relevance == "irrelevant"
                  and relevance_score > 0.5
              ):

                  relevance_score = 0.5


              valid_results.append(
                  {
                      "source_number":
                          source_number,
                      "title":
                          source.get(
                              "title",
                              ""
                          ),
                      "category":
                          source.get(
                              "category",
                              "unknown"
                          ),
                      "url":
                          source.get(
                              "url",
                              ""
                          ),
                      "relevance":
                          relevance,
                      "relevance_score":
                          round(
                              relevance_score,
                              3
                          ),
                      "evidence_strength":
                          evidence_strength,
                      "reason":
                          reason,
                      "content_supported":
                          content_supported,
                      "should_influence_knowledge":
                          should_influence
                  }
              )


          # --------------------------------------------------
          # HANDLE MISSING GEMINI RESULTS
          # --------------------------------------------------

          evaluated_numbers = {
              item["source_number"]
              for item in valid_results
          }


          for source in sources:

              if source["source_number"] in evaluated_numbers:

                  continue


              valid_results.append(
                  {
                      "source_number":
                          source["source_number"],
                      "title":
                          source.get(
                              "title",
                              ""
                          ),
                      "category":
                          source.get(
                              "category",
                              "unknown"
                          ),
                      "url":
                          source.get(
                              "url",
                              ""
                          ),
                      "relevance":
                          "irrelevant",
                      "relevance_score":
                          0.0,
                      "evidence_strength":
                          "none",
                      "reason":
                          "No valid filter classification was returned.",
                      "content_supported":
                          False,
                      "should_influence_knowledge":
                          False
                  }
              )


          valid_results.sort(
              key=lambda x:
                  x["source_number"]
          )


          # --------------------------------------------------
          # STATISTICS
          # --------------------------------------------------

          directly_relevant = sum(
              1
              for item in valid_results
              if item["relevance"]
              == "directly_relevant"
          )


          relevant = sum(
              1
              for item in valid_results
              if item["relevance"]
              == "relevant"
          )


          contextual = sum(
              1
              for item in valid_results
              if item["relevance"]
              == "contextual"
          )


          irrelevant = sum(
              1
              for item in valid_results
              if item["relevance"]
              == "irrelevant"
          )


          influenceable = sum(
              1
              for item in valid_results
              if item[
                  "should_influence_knowledge"
              ]
          )


          if valid_results:

              average_relevance = (
                  sum(
                      item[
                          "relevance_score"
                      ]
                      for item in valid_results
                  )
                  / len(valid_results)
              )

          else:

              average_relevance = 0.0


          print(
              "Directly relevant:",
              directly_relevant
          )

          print(
              "Relevant:",
              relevant
          )

          print(
              "Contextual:",
              contextual
          )

          print(
              "Irrelevant:",
              irrelevant
          )

          print(
              "Allowed to influence knowledge:",
              influenceable
          )


          # --------------------------------------------------
          # STORE V48 SOURCE FILTER
          # --------------------------------------------------

          filter_record = {
              "timestamp":
                  now,
              "version":
                  "V48",
              "subject":
                  subject,
              "question":
                  question,
              "candidates_evaluated":
                  len(valid_results),
              "directly_relevant":
                  directly_relevant,
              "relevant":
                  relevant,
              "contextual":
                  contextual,
              "irrelevant":
                  irrelevant,
              "average_relevance":
                  round(
                      average_relevance,
                      3
                  ),
              "sources":
                  valid_results,
              "summary":
                  str(
                      filter_result.get(
                          "summary",
                          ""
                      )
                  ).strip(),
              "false_positive_warning":
                  str(
                      filter_result.get(
                          "false_positive_warning",
                          ""
                      )
                  ).strip(),
              "filter_principle":
                  str(
                      filter_result.get(
                          "filter_principle",
                          ""
                      )
                  ).strip(),
              "knowledge_influence_allowed":
                  influenceable,
              "learning":
                  {
                      "keyword_overlap_is_not_evidence":
                          True,
                      "title_is_not_evidence":
                          True,
                      "metadata_is_not_evidence":
                          True,
                      "missing_context_is_uncertainty":
                          True,
                      "source_relevance_is_filtered":
                          True,
                      "false_positives_are_rejected":
                          True
                  }
          }


          memory.setdefault(
              "source_filter_log",
              []
          )


          if not isinstance(
              memory["source_filter_log"],
              list
          ):

              memory["source_filter_log"] = []


          memory["source_filter_log"].append(
              filter_record
          )


          memory["learning_log"].append(
              {
                  "timestamp":
                      now,
                  "version":
                      "V48",
                  "lesson":
                      (
                          "A source must contain "
                          "substantive relevant content "
                          "before it can influence knowledge."
                      ),
                  "principle":
                      (
                          "Relevance is not established "
                          "by keyword overlap, titles or metadata."
                      )
              }
          )


          memory["version"] = "V48"

          memory["last_updated"] = now


          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # MEMORY RELOAD TEST
          # --------------------------------------------------

          reloaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )


          if not reloaded.get(
              "source_filter_log"
          ):

              raise RuntimeError(
                  "V48 memory persistence check failed."
              )


          print(
              "Memory persistence: PASS"
          )


          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              question,
              "",
              "## Filter Mission",
              "",
              "V48 evaluates whether discovered sources "
              "deserve to influence NØX knowledge.",
              "",
              "A source title is not evidence.",
              "",
              "Keyword overlap is not evidence.",
              "",
              "Metadata is not substantive evidence.",
              "",
              "Missing source context remains uncertainty.",
              "",
              "## Results",
              "",
              f"- Candidates evaluated: "
              f"{len(valid_results)}",
              f"- Directly relevant: "
              f"{directly_relevant}",
              f"- Relevant: "
              f"{relevant}",
              f"- Contextual: "
              f"{contextual}",
              f"- Irrelevant: "
              f"{irrelevant}",
              f"- Average relevance: "
              f"{average_relevance:.3f}",
              f"- Allowed to influence knowledge: "
              f"{influenceable}",
              "",
              "## Evaluated Sources",
              ""
          ]


          for item in valid_results:

              report.extend(
                  [
                      f"### Source "
                      f"{item['source_number']}",
                      "",
                      f"**Title:** "
                      f"{item['title']}",
                      "",
                      f"**Category:** "
                      f"{item['category']}",
                      "",
                      f"**Relevance:** "
                      f"{item['relevance_score']:.2f}",
                      "",
                      f"**Classification:** "
                      f"{item['relevance']}",
                      "",
                      f"**Evidence strength:** "
                      f"{item['evidence_strength']}",
                      "",
                      f"**Content supported:** "
                      f"{item['content_supported']}",
                      "",
                      f"**Influence knowledge:** "
                      f"{item['should_influence_knowledge']}",
                      "",
                      f"**Reason:** "
                      f"{item['reason']}",
                      "",
                      f"**URL:** "
                      f"{item['url']}",
                      ""
                  ]
              )


          report.extend(
              [
                  "## V48 Learning",
                  "",
                  "NØX has learned to distinguish source "
                  "relevance from evidentiary strength.",
                  "",
                  "Keyword overlap is not evidence.",
                  "",
                  "A source title is not evidence.",
                  "",
                  "Academic metadata is not substantive evidence.",
                  "",
                  "Missing context remains uncertainty.",
                  "",
                  "False positives must be filtered before "
                  "knowledge is strengthened.",
                  "",
                  "## V48 Principle",
                  "",
                  "NØX does not ask only whether it found a source.",
                  "",
                  "It asks whether that source deserves "
                  "to influence its knowledge.",
                  "",
                  "## Public Colony Activity",
                  "",
                  "- New post: NO",
                  "- New comment: NO",
                  "- Vote: NO",
                  "- DM: NO",
                  "- Follow: NO",
                  "",
                  "## Safety Boundary",
                  "",
                  "V48 does not publish automatically.",
                  "",
                  "V48 does not spend money.",
                  "",
                  "V48 does not execute external actions."
              ]
          )


          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V48 SOURCE FILTER COMPLETE")
          print("===================================")

          print(
              "Candidates evaluated:",
              len(valid_results)
          )

          print(
              "Directly relevant:",
              directly_relevant
          )

          print(
              "Relevant:",
              relevant
          )

          print(
              "Contextual:",
              contextual
          )

          print(
              "Irrelevant:",
              irrelevant
          )

          print(
              "Knowledge influence allowed:",
              influenceable
          )

          print(
              "Memory persistence: PASS"
          )

          print(
              "Report written: PASS"
          )

          print(
              "Public Colony activity: NONE"
          )

          print("===================================")

          PY

      - name: Commit V48
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V48_SOURCE_FILTER.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
