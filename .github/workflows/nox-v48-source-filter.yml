name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Create V48 script
        shell: bash
        run: |
          cat > nox_v48.py <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")


          previous_report = Path(
              "V47_MULTI_SOURCE_RESEARCH.md"
          )


          if not previous_report.exists():
              raise RuntimeError(
                  "V47_MULTI_SOURCE_RESEARCH.md not found."
              )


          text = previous_report.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------
          # Extract research question
          # --------------------------------------------------

          question_match = re.search(
              r"Research Question\s*\n(.*?)(?:\n\n|$)",
              text,
              re.S,
          )


          if question_match:
              research_question = (
                  question_match.group(1).strip()
              )
          else:
              research_question = (
                  "What information is supported by "
                  "the discovered sources?"
              )


          # --------------------------------------------------
          # Extract Sources Discovered section
          # --------------------------------------------------

          source_match = re.search(
              r"Sources Discovered\s*\n(.*?)(?=\nNØX Analysis|\nKnowledge Status|\Z)",
              text,
              re.S,
          )


          if source_match:
              source_text = source_match.group(1)
          else:
              source_text = ""


          print(
              f"Source section characters: "
              f"{len(source_text)}"
          )


          # --------------------------------------------------
          # Parse sources line by line
          # --------------------------------------------------

          sources = []

          lines = [
              line.strip()
              for line in source_text.splitlines()
          ]


          current_title = None
          current_category = ""
          current_url = ""


          def save_current_source():
              global current_title
              global current_category
              global current_url

              if current_title:
                  sources.append(
                      {
                          "title": current_title,
                          "category": current_category,
                          "url": current_url,
                      }
                  )

              current_title = None
              current_category = ""
              current_url = ""


          for line in lines:

              if not line:
                  continue


              if line.startswith("Total:"):
                  continue


              if line.startswith("Context retrieved:"):
                  continue


              if line.startswith("Institutional search signal"):
                  save_current_source()
                  continue


              if line.startswith("Category:"):

                  if current_title is not None:
                      current_category = line.split(
                          ":",
                          1
                      )[1].strip()

                  continue


              if line.startswith("URL:"):

                  if current_title is not None:
                      current_url = line.split(
                          ":",
                          1
                      )[1].strip()

                  continue


              # A new title normally appears before Category.
              if (
                  current_title is None
                  and not line.startswith("Source")
              ):
                  current_title = line
                  continue


              # If a complete source already exists and another
              # non-metadata line appears, start a new source.
              if (
                  current_title is not None
                  and current_category
                  and current_url
              ):
                  save_current_source()
                  current_title = line


          save_current_source()


          # --------------------------------------------------
          # Remove accidental duplicate / invalid entries
          # --------------------------------------------------

          clean_sources = []
          seen = set()


          for source in sources:

              title = source["title"].strip()
              category = source["category"].strip()
              url = source["url"].strip()

              if not title:
                  continue

              key = (
                  title.lower(),
                  url.lower(),
              )

              if key in seen:
                  continue

              seen.add(key)

              clean_sources.append(
                  {
                      "title": title,
                      "category": category,
                      "url": url,
                  }
              )


          sources = clean_sources


          print(
              f"Research question: "
              f"{research_question[:150]}"
          )

          print(
              f"Candidate sources detected: "
              f"{len(sources)}"
          )


          for number, source in enumerate(
              sources,
              start=1,
          ):
              print(
                  f"  Source {number}: "
                  f"{source['title']}"
              )


          if not sources:
              raise RuntimeError(
                  "No candidate sources found in V47. "
                  "The V47 source section could not be parsed."
              )


          # --------------------------------------------------
          # Gemini configuration
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )


          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )


          prompt = f"""
          You are NØX Origin.

          Your task is to evaluate the relevance and evidentiary
          value of discovered sources.

          Do NOT answer the research question.

          Research question:

          {research_question}

          Rules:

          1. Keyword overlap is not evidence.
          2. A source title is not evidence.
          3. Unrelated sources must receive a very low score.
          4. Background information must be distinguished from direct evidence.
          5. Never invent information.
          6. Missing source context means uncertainty.
          7. Academic metadata without accessible content is not substantive evidence.
          8. Prefer precision over optimism.
          9. Evaluate every source independently.
          10. A source can be relevant without providing direct evidence.
          11. Do not assume a scientific-looking title is relevant.
          12. Do not treat a DOI or academic category as proof of relevance.
          13. The supplied source information is the maximum available evidence.

          Relevance scale:

          0.00-0.19 = irrelevant
          0.20-0.39 = weak contextual relevance
          0.40-0.59 = potentially useful
          0.60-0.79 = relevant
          0.80-1.00 = directly relevant

          Evidence strength:

          none
          contextual
          indirect
          substantive
          direct

          Return ONLY valid JSON.

          Expected structure:

          {{
            "evaluations": [
              {{
                "index": 1,
                "relevance_score": 0.00,
                "classification": "irrelevant",
                "reason": "short explanation",
                "evidence_strength": "none"
              }}
            ]
          }}

          Sources:

          {json.dumps(
              sources,
              ensure_ascii=False,
              indent=2,
          )}
          """


          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.6-flash:generateContent"
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "responseMimeType": "application/json",
              },
          }


          # --------------------------------------------------
          # Gemini request
          # --------------------------------------------------

          try:

              response = requests.post(
                  endpoint,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                  },
                  json=payload,
                  timeout=(15, 60),
              )

          except requests.RequestException as exc:

              raise RuntimeError(
                  f"Gemini connection failed: {exc}"
              )


          print(
              f"Gemini status: "
              f"{response.status_code}"
          )


          if response.status_code != 200:

              raise RuntimeError(
                  "Gemini request failed: "
                  f"{response.status_code} "
                  f"{response.text[:1000]}"
              )


          try:

              result = response.json()

          except ValueError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid HTTP JSON: {exc}"
              )


          try:

              raw_text = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

          except (
              KeyError,
              IndexError,
              TypeError,
          ) as exc:

              raise RuntimeError(
                  f"Unexpected Gemini response: {exc}"
              )


          try:

              evaluations = json.loads(
                  raw_text
              )

          except json.JSONDecodeError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid JSON: {exc}"
              )


          if not isinstance(
              evaluations,
              dict,
          ):

              raise RuntimeError(
                  "Gemini evaluation is not a JSON object."
              )


          # --------------------------------------------------
          # Validate evaluations
          # --------------------------------------------------

          evaluated_sources = []


          allowed_classifications = {
              "irrelevant",
              "weak contextual relevance",
              "potentially useful",
              "relevant",
              "directly relevant",
          }


          allowed_evidence = {
              "none",
              "contextual",
              "indirect",
              "substantive",
              "direct",
          }


          for item in evaluations.get(
              "evaluations",
              [],
          ):

              if not isinstance(
                  item,
                  dict,
              ):
                  continue


              index = item.get("index")


              if not isinstance(
                  index,
                  int,
              ):
                  continue


              if index < 1 or index > len(sources):
                  continue


              source = dict(
                  sources[index - 1]
              )


              try:

                  score = float(
                      item.get(
                          "relevance_score",
                          0.0,
                      )
                  )

              except (
                  TypeError,
                  ValueError,
              ):

                  score = 0.0


              score = max(
                  0.0,
                  min(
                      1.0,
                      score,
                  ),
              )


              classification = item.get(
                  "classification",
                  "unknown",
              )


              if classification not in allowed_classifications:

                  classification = "unknown"


              evidence_strength = item.get(
                  "evidence_strength",
                  "none",
              )


              if evidence_strength not in allowed_evidence:

                  evidence_strength = "none"


              source["relevance_score"] = score

              source["classification"] = (
                  classification
              )

              source["reason"] = str(
                  item.get(
                      "reason",
                      "",
                  )
              ).strip()

              source["evidence_strength"] = (
                  evidence_strength
              )


              evaluated_sources.append(
                  source
              )


          if not evaluated_sources:

              raise RuntimeError(
                  "Gemini returned no usable evaluations."
              )


          # --------------------------------------------------
          # Statistics
          # --------------------------------------------------

          direct = [
              s
              for s in evaluated_sources
              if s["relevance_score"] >= 0.80
          ]


          relevant = [
              s
              for s in evaluated_sources
              if 0.60 <= s["relevance_score"] < 0.80
          ]


          contextual = [
              s
              for s in evaluated_sources
              if 0.20 <= s["relevance_score"] < 0.60
          ]


          irrelevant = [
              s
              for s in evaluated_sources
              if s["relevance_score"] < 0.20
          ]


          average_score = round(
              sum(
                  s["relevance_score"]
                  for s in evaluated_sources
              )
              / len(evaluated_sources),
              3,
          )


          now = datetime.now(
              timezone.utc
          ).isoformat()


          # --------------------------------------------------
          # Memory
          # --------------------------------------------------

          memory_dir = Path(
              "nox_memory"
          )

          memory_dir.mkdir(
              exist_ok=True
          )


          memory = {
              "version": "V48",
              "created_at": now,
              "research_question": research_question,
              "source_count": len(
                  evaluated_sources
              ),
              "direct_sources": len(direct),
              "relevant_sources": len(relevant),
              "contextual_sources": len(contextual),
              "irrelevant_sources": len(irrelevant),
              "average_relevance": average_score,
              "sources": evaluated_sources,
              "learning": {
                  "keyword_match_is_not_evidence": True,
                  "title_is_not_proof": True,
                  "metadata_is_not_evidence": True,
                  "missing_context_is_uncertainty": True,
                  "false_positive_filtering": True,
                  "precision_over_optimism": True,
              },
              "last_updated": now,
          }


          Path(
              "nox_memory/nox_memory_v48.json"
          ).write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # --------------------------------------------------
          # Report
          # --------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              research_question,
              "",
              "## Results",
              "",
              f"- Candidates evaluated: {len(evaluated_sources)}",
              f"- Directly relevant: {len(direct)}",
              f"- Relevant: {len(relevant)}",
              f"- Contextual: {len(contextual)}",
              f"- Irrelevant: {len(irrelevant)}",
              f"- Average relevance: {average_score}",
              "",
              "## Evaluated Sources",
              "",
          ]


          for number, source in enumerate(
              evaluated_sources,
              start=1,
          ):

              report.extend(
                  [
                      f"### Source {number}",
                      "",
                      f"**Title:** {source['title']}",
                      "",
                      f"**Category:** {source['category']}",
                      "",
                      f"**Relevance:** "
                      f"{source['relevance_score']:.2f}",
                      "",
                      f"**Classification:** "
                      f"{source['classification']}",
                      "",
                      f"**Evidence strength:** "
                      f"{source['evidence_strength']}",
                      "",
                      f"**Reason:** {source['reason']}",
                      "",
                      f"**URL:** {source['url']}",
                      "",
                  ]
              )


          report.extend(
              [
                  "## V48 Learning",
                  "",
                  "NØX has learned to distinguish source relevance "
                  "from evidentiary strength.",
                  "",
                  "Keyword overlap is not evidence.",
                  "",
                  "A source title is not evidence.",
                  "",
                  "Academic metadata is not substantive evidence.",
                  "",
                  "Missing context remains uncertainty.",
                  "",
                  "False positives must be filtered before knowledge "
                  "is strengthened.",
                  "",
                  "## V48 Principle",
                  "",
                  "NØX does not ask only whether it found a source.",
                  "",
                  "It asks whether that source deserves to influence "
                  "its knowledge.",
              ]
          )


          Path(
              "V48_SOURCE_FILTER.md"
          ).write_text(
              "\n".join(report),
              encoding="utf-8",
          )


          print("===================================")
          print("V48 SOURCE FILTER RESULT")
          print("===================================")
          print(
              f"Sources evaluated: "
              f"{len(evaluated_sources)}"
          )
          print(
              f"Directly relevant: "
              f"{len(direct)}"
          )
          print(
              f"Relevant: "
              f"{len(relevant)}"
          )
          print(
              f"Contextual: "
              f"{len(contextual)}"
          )
          print(
              f"Irrelevant: "
              f"{len(irrelevant)}"
          )
          print(
              f"Average relevance: "
              f"{average_score}"
          )
          print(
              "False-positive filtering: PASS"
          )
          print(
              "Memory written: PASS"
          )
          print(
              "Report written: PASS"
          )
          print("===================================")
          PY

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python nox_v48.py

      - name: Commit V48 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/ V48_SOURCE_FILTER.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
