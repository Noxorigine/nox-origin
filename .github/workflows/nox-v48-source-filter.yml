name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")

          folder = Path("nox_memory")
          folder.mkdir(exist_ok=True)

          memory_file = folder / "nox_memory_v48.json"
          report_file = Path("V48_SOURCE_FILTER.md")

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # Load previous curiosity/research state
          # --------------------------------------------------

          previous_report = Path("V47_MULTI_SOURCE_RESEARCH.md")

          if not previous_report.exists():
              raise RuntimeError(
                  "V47 research report not found. "
                  "V48 requires the previous research state."
              )

          previous_text = previous_report.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------
          # Extract research question
          # --------------------------------------------------

          question_match = re.search(
              r"Research Question\s*\n(.*?)(?:\n\n|$)",
              previous_text,
              re.S
          )

          if question_match:
              research_question = question_match.group(1).strip()
          else:
              research_question = (
                  "What evidence supports the current research question?"
              )

          # --------------------------------------------------
          # Extract discovered sources
          # --------------------------------------------------

          source_section_match = re.search(
              r"Sources Discovered\s*\n(.*?)(?:\nNØX Analysis|\nKnowledge Status)",
              previous_text,
              re.S
          )

          source_text = (
              source_section_match.group(1).strip()
              if source_section_match
              else ""
          )

          # --------------------------------------------------
          # Parse source blocks
          # --------------------------------------------------

          sources = []

          blocks = re.split(
              r"\n(?=[A-Z][^\n]+\nCategory:)",
              source_text
          )

          for block in blocks:
              lines = [
                  line.strip()
                  for line in block.splitlines()
                  if line.strip()
              ]

              if not lines:
                  continue

              title = lines[0]

              category = ""
              url = ""

              for line in lines:
                  if line.startswith("Category:"):
                      category = line.split(
                          ":", 1
                      )[1].strip()

                  if line.startswith("URL:"):
                      url = line.split(
                          ":", 1
                      )[1].strip()

              if title and (
                  category or url
              ):
                  sources.append({
                      "title": title,
                      "category": category,
                      "url": url
                  })

          print(
              f"Previous research question loaded: "
              f"{research_question[:120]}"
          )

          print(
              f"Candidate sources detected: {len(sources)}"
          )

          if not sources:
              raise RuntimeError(
                  "No candidate sources could be parsed from V47."
              )

          # --------------------------------------------------
          # Gemini relevance evaluation
          # --------------------------------------------------

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          prompt = f"""
          You are NØX Origin, an experimental AI agent.

          Your task is NOT to answer the research question.

          Your task is to evaluate whether each discovered source
          is actually relevant to the research question.

          Research question:
          {research_question}

          Evaluate each source independently.

          Important rules:

          1. Never treat a matching keyword as proof of relevance.
          2. A source about an unrelated subject must receive a very low score.
          3. A source may be indirectly useful as background but must not
             be classified as direct evidence.
          4. The title alone is insufficient to establish evidence.
          5. If the source context is unavailable, reduce confidence.
          6. Never invent information about a source.
          7. Distinguish relevance from evidentiary strength.

          Relevance scale:

          0.00-0.19 = irrelevant
          0.20-0.39 = weak contextual relevance
          0.40-0.59 = potentially useful
          0.60-0.79 = relevant
          0.80-1.00 = directly relevant

          Return ONLY valid JSON in this format:

          {{
            "evaluations": [
              {{
                "index": 1,
                "relevance_score": 0.00,
                "classification": "irrelevant",
                "reason": "short explanation",
                "evidence_strength": "none"
              }}
            ]
          }}

          Evidence strength must be one of:

          "none"
          "contextual"
          "indirect"
          "substantive"
          "direct"

          Sources:

          {json.dumps(sources, ensure_ascii=False, indent=2)}
          """

          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.6-flash:generateContent"
          )

          response = requests.post(
              endpoint,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              json={
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.1,
                      "responseMimeType": "application/json"
                  }
              },
              timeout=60
          )

          print(
              f"Gemini status: {response.status_code}"
          )

          if response.status_code != 200:
              raise RuntimeError(
                  "Gemini request failed: "
                  f"{response.status_code} "
                  f"{response.text[:1000]}"
              )

          result = response.json()

          raw_text = (
              result["candidates"][0]["content"]["parts"][0]["text"]
          )

          evaluations = json.loads(raw_text)

          # --------------------------------------------------
          # Merge evaluations with source data
          # --------------------------------------------------

          evaluated_sources = []

          for item in evaluations.get("evaluations", []):
              index = item.get("index")

              if not isinstance(index, int):
                  continue

              if index < 1 or index > len(sources):
                  continue

              source = dict(sources[index - 1])

              source["relevance_score"] = float(
                  item.get("relevance_score", 0)
              )

              source["classification"] = item.get(
                  "classification",
                  "unknown"
              )

              source["reason"] = item.get(
                  "reason",
                  ""
              )

              source["evidence_strength"] = item.get(
                  "evidence_strength",
                  "none"
              )

              evaluated_sources.append(source)

          if not evaluated_sources:
              raise RuntimeError(
                  "Gemini returned no usable source evaluations."
              )

          # --------------------------------------------------
          # Calculate filtering results
          # --------------------------------------------------

          direct = [
              s for s in evaluated_sources
              if s["relevance_score"] >= 0.80
          ]

          relevant = [
              s for s in evaluated_sources
              if 0.60 <= s["relevance_score"] < 0.80
          ]

          contextual = [
              s for s in evaluated_sources
              if 0.20 <= s["relevance_score"] < 0.60
          ]

          irrelevant = [
              s for s in evaluated_sources
              if s["relevance_score"] < 0.20
          ]

          usable = direct + relevant

          average_score = round(
              sum(
                  s["relevance_score"]
                  for s in evaluated_sources
              ) / len(evaluated_sources),
              3
          )

          # --------------------------------------------------
          # Memory
          # --------------------------------------------------

          memory = {
              "version": "V48",
              "created_at": now,
              "research_question": research_question,
              "source_count": len(evaluated_sources),
              "direct_sources": len(direct),
              "relevant_sources": len(relevant),
              "contextual_sources": len(contextual),
              "irrelevant_sources": len(irrelevant),
              "average_relevance": average_score,
              "sources": evaluated_sources,
              "learning": {
                  "lesson": (
                      "A source containing relevant keywords is not "
                      "automatically relevant evidence."
                  ),
                  "false_positive_filtering": True,
                  "title_is_not_proof": True,
                  "missing_context_is_uncertainty": True
              },
              "last_updated": now
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # Report
          # --------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              research_question,
              "",
              "## Source Filtering",
              "",
              f"- Candidates evaluated: {len(evaluated_sources)}",
              f"- Directly relevant: {len(direct)}",
              f"- Relevant: {len(relevant)}",
              f"- Contextual: {len(contextual)}",
              f"- Irrelevant: {len(irrelevant)}",
              f"- Average relevance: {average_score}",
              "",
              "## Evaluated Sources",
              ""
          ]

          for number, source in enumerate(
              evaluated_sources,
              start=1
          ):
              report.extend([
                  f"### Source {number}",
                  "",
                  f"**Title:** {source['title']}",
                  "",
                  f"**Category:** {source['category']}",
                  "",
                  f"**Relevance:** "
                  f"{source['relevance_score']:.2f}",
                  "",
                  f"**Classification:** "
                  f"{source['classification']}",
                  "",
                  f"**Evidence strength:** "
                  f"{source['evidence_strength']}",
                  "",
                  f"**Reason:** {source['reason']}",
                  "",
                  f"**URL:** {source['url']}",
                  ""
              ])

          report.extend([
              "## V48 Learning",
              "",
              "NØX has begun evaluating the quality of its own "
              "research results instead of counting every search "
              "result as useful knowledge.",
              "",
              "A keyword match is not evidence.",
              "",
              "A source title is not evidence.",
              "",
              "Missing source context remains uncertainty.",
              "",
              "## V48 Principle",
              "",
              "NØX does not ask only whether it found a source.",
              "",
              "It asks whether the source deserves to influence "
              "its knowledge.",
              "",
              "Filtering false positives is part of learning."
          ])

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print("===================================")
          print("V48 SOURCE FILTER RESULT")
          print("===================================")
          print(
              f"Sources evaluated: {len(evaluated_sources)}"
          )
          print(
              f"Directly relevant: {len(direct)}"
          )
          print(
              f"Relevant: {len(relevant)}"
          )
          print(
              f"Contextual: {len(contextual)}"
          )
          print(
              f"Irrelevant: {len(irrelevant)}"
          )
          print(
              f"Average relevance: {average_score}"
          )
          print("False-positive filtering: PASS")
          print("Memory written: PASS")
          print("===================================")
          PY

      - name: Commit V48 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/ V48_SOURCE_FILTER.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
