name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create V48 script
        shell: bash
        run: |
          cat > nox_v48.py <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")

          REPORT_PATH = Path("V47_MULTI_SOURCE_RESEARCH.md")
          MEMORY_PATH = Path("nox_memory/nox_memory_v48.json")
          OUTPUT_PATH = Path("V48_SOURCE_FILTER.md")

          if not REPORT_PATH.exists():
              raise RuntimeError(
                  "V47_MULTI_SOURCE_RESEARCH.md not found."
              )

          text = REPORT_PATH.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # 1. Extract research question
          # ---------------------------------------------------------

          research_question = ""

          question_patterns = [
              r"##\s*Research Question\s*\n\s*(.+?)(?=\n\s*##|\Z)",
              r"Research Question\s*\n\s*(.+?)(?=\n\s*##|\Z)",
              r"Research question:\s*\n?\s*(.+?)(?=\n\s*##|\Z)",
          ]

          for pattern in question_patterns:
              match = re.search(pattern, text, re.IGNORECASE | re.DOTALL)
              if match:
                  research_question = match.group(1).strip()
                  break

          if not research_question:
              research_question = (
                  "What information is supported by the discovered sources?"
              )

          # Remove accidental markdown noise.
          research_question = re.sub(
              r"\s+",
              " ",
              research_question,
          ).strip()

          print(
              "Research question:"
              f" {research_question[:200]}"
          )

          # ---------------------------------------------------------
          # 2. Locate source section
          # ---------------------------------------------------------

          source_text = text

          source_section_patterns = [
              r"##\s*Sources Discovered\s*\n(.*?)(?=\n\s*##\s+|\Z)",
              r"Sources Discovered\s*\n(.*?)(?=\n\s*##\s+|\Z)",
              r"##\s*Sources\s*\n(.*?)(?=\n\s*##\s+|\Z)",
          ]

          for pattern in source_section_patterns:
              match = re.search(
                  pattern,
                  text,
                  re.IGNORECASE | re.DOTALL,
              )
              if match:
                  source_text = match.group(1)
                  break

          # ---------------------------------------------------------
          # 3. Parse sources robustly
          # ---------------------------------------------------------

          sources = []

          def clean(value):
              value = re.sub(r"\s+", " ", value)
              return value.strip(" -*\t\r\n")

          def add_source(title="", category="", url=""):
              title = clean(title)
              category = clean(category)
              url = clean(url)

              # Reject obvious metadata/statistics.
              rejected_titles = {
                  "total",
                  "sources",
                  "source",
                  "count",
                  "results",
                  "total sources",
                  "number of sources",
              }

              if title.lower() in rejected_titles:
                  return

              if re.fullmatch(
                  r"[-*]?\s*(total|count|sources?)\s*:\s*\d+",
                  title,
                  re.IGNORECASE,
              ):
                  return

              if not title and not url:
                  return

              # A real URL is useful even if title is missing.
              if title or url:
                  candidate = {
                      "title": title or "Untitled source",
                      "category": category,
                      "url": url,
                  }

                  # Avoid duplicates.
                  for existing in sources:
                      if (
                          existing["title"] == candidate["title"]
                          and existing["url"] == candidate["url"]
                      ):
                          return

                  sources.append(candidate)

          lines = source_text.splitlines()

          current = {
              "title": "",
              "category": "",
              "url": "",
          }

          def flush_current():
              if (
                  current["title"]
                  or current["category"]
                  or current["url"]
              ):
                  add_source(
                      current["title"],
                      current["category"],
                      current["url"],
                  )

              current["title"] = ""
              current["category"] = ""
              current["url"] = ""

          for raw_line in lines:
              line = raw_line.strip()

              if not line:
                  continue

              # Ignore markdown separators.
              if re.fullmatch(r"[-*_]{3,}", line):
                  continue

              # URL line.
              url_match = re.match(
                  r"^(?:[-*]\s*)?(?:URL|Link|Source URL)\s*:\s*(.+)$",
                  line,
                  re.IGNORECASE,
              )

              if url_match:
                  current["url"] = url_match.group(1).strip()
                  continue

              # Category line.
              category_match = re.match(
                  r"^(?:[-*]\s*)?Category\s*:\s*(.+)$",
                  line,
                  re.IGNORECASE,
              )

              if category_match:
                  current["category"] = category_match.group(1).strip()
                  continue

              # Explicit title line.
              title_match = re.match(
                  r"^(?:[-*]\s*)?(?:Title|Source|Name)\s*:\s*(.+)$",
                  line,
                  re.IGNORECASE,
              )

              if title_match:
                  if current["title"] or current["url"]:
                      flush_current()

                  current["title"] = title_match.group(1).strip()
                  continue

              # Markdown heading is usually a source title.
              heading_match = re.match(
                  r"^#{2,6}\s+(.+)$",
                  line,
              )

              if heading_match:
                  heading = clean(heading_match.group(1))

                  if heading.lower() in {
                      "sources discovered",
                      "sources",
                      "source filtering",
                      "results",
                      "knowledge status",
                      "nøx analysis",
                      "nox analysis",
                  }:
                      continue

                  if current["title"] or current["url"]:
                      flush_current()

                  current["title"] = heading
                  continue

              # Numbered source.
              numbered_match = re.match(
                  r"^\d+[\.\)]\s+(.+)$",
                  line,
              )

              if numbered_match:
                  if current["title"] or current["url"]:
                      flush_current()

                  current["title"] = numbered_match.group(1)
                  continue

              # Bullet with a URL.
              bullet_url_match = re.match(
                  r"^[-*]\s+(.+?)\s+(https?://\S+)$",
                  line,
              )

              if bullet_url_match:
                  if current["title"] or current["url"]:
                      flush_current()

                  current["title"] = bullet_url_match.group(1)
                  current["url"] = bullet_url_match.group(2)
                  continue

              # Standalone URL.
              if re.match(r"^https?://\S+$", line):
                  current["url"] = line
                  continue

              # If nothing has been started yet, a normal line can
              # be a source title, but only when it looks meaningful.
              if (
                  not current["title"]
                  and len(line) >= 8
                  and not re.search(
                      r"^(total|count|number)\s*:",
                      line,
                      re.IGNORECASE,
                  )
              ):
                  current["title"] = line

          flush_current()

          # ---------------------------------------------------------
          # 4. Fallback parser for V47 source blocks
          # ---------------------------------------------------------

          if not sources:
              print(
                  "Primary parser found no sources."
              )
              print(
                  "Running fallback source detection..."
              )

              urls = re.findall(
                  r"https?://[^\s)\]>]+",
                  text,
              )

              for index, url in enumerate(urls, start=1):
                  clean_url = url.rstrip(".,;")

                  # Ignore obvious non-source URLs.
                  if any(
                      bad in clean_url.lower()
                      for bad in [
                          "github.com/actions/",
                          "github.com/features/",
                      ]
                  ):
                      continue

                  add_source(
                      title=f"Source {index}",
                      category="discovered",
                      url=clean_url,
                  )

          print(
              f"Candidate sources detected: {len(sources)}"
          )

          if not sources:
              raise RuntimeError(
                  "V47 contains no parseable sources. "
                  "The V48 filter cannot evaluate evidence "
                  "without source records."
              )

          # Limit prompt size to avoid unnecessary token usage.
          MAX_SOURCES = 20

          if len(sources) > MAX_SOURCES:
              print(
                  f"V47 contains {len(sources)} sources. "
                  f"Limiting evaluation to first {MAX_SOURCES} "
                  "sources to control Gemini usage."
              )
              sources = sources[:MAX_SOURCES]

          print(
              f"Sources sent to Gemini: {len(sources)}"
          )

          # ---------------------------------------------------------
          # 5. Gemini configuration
          # ---------------------------------------------------------

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          prompt = f"""
You are NØX Origin.

Evaluate the relevance and evidentiary value of each supplied source.

DO NOT answer the research question.

Research question:
{research_question}

Important limitation:

You only have the source metadata supplied below.
You do NOT have permission to invent or assume source content.

Rules:

1. Keyword overlap is not evidence.
2. A source title is not evidence.
3. Metadata is not evidence.
4. An unrelated source must receive a very low relevance score.
5. Background information must be distinguished from direct evidence.
6. Never invent information not present in the supplied data.
7. Missing source context means uncertainty.
8. Academic-looking metadata does not prove relevance.
9. Academic metadata without accessible content cannot be classified as substantive evidence.
10. Prefer precision over optimism.
11. Evaluate every source independently.
12. Relevance and evidentiary strength are separate concepts.
13. If there is insufficient information to establish relevance, lower the score.
14. Do not manufacture reasons based only on the title.
15. A source may be relevant without providing direct evidence.

Relevance scale:

0.00-0.19 = irrelevant
0.20-0.39 = weak contextual relevance
0.40-0.59 = potentially useful
0.60-0.79 = relevant
0.80-1.00 = directly relevant

Evidence strength must be exactly one of:

none
contextual
indirect
substantive
direct

Return ONLY valid JSON.

Expected structure:

{{
  "evaluations": [
    {{
      "index": 1,
      "relevance_score": 0.00,
      "classification": "irrelevant",
      "reason": "short explanation",
      "evidence_strength": "none"
    }}
  ]
}}

Sources:

{json.dumps(
    sources,
    ensure_ascii=False,
    indent=2,
)}
"""

          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.6-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt,
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "responseMimeType": "application/json",
              },
          }

          try:
              response = requests.post(
                  endpoint,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                  },
                  json=payload,
                  timeout=(15, 60),
              )
          except requests.RequestException as exc:
              raise RuntimeError(
                  f"Gemini connection failed: {exc}"
              )

          print(
              f"Gemini status: {response.status_code}"
          )

          if response.status_code != 200:
              raise RuntimeError(
                  "Gemini request failed: "
                  f"{response.status_code} "
                  f"{response.text[:1000]}"
              )

          try:
              result = response.json()
          except ValueError as exc:
              raise RuntimeError(
                  f"Gemini returned invalid HTTP JSON: {exc}"
              )

          try:
              raw_text = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )
          except (KeyError, IndexError, TypeError) as exc:
              raise RuntimeError(
                  f"Unexpected Gemini response: {exc}"
              )

          try:
              evaluations = json.loads(raw_text)
          except json.JSONDecodeError as exc:
              raise RuntimeError(
                  f"Gemini returned invalid evaluation JSON: {exc}"
              )

          if not isinstance(evaluations, dict):
              raise RuntimeError(
                  "Gemini evaluation is not a JSON object."
              )

          # ---------------------------------------------------------
          # 6. Validate Gemini evaluations
          # ---------------------------------------------------------

          evaluated_sources = []

          allowed_classifications = {
              "irrelevant",
              "weak contextual relevance",
              "potentially useful",
              "relevant",
              "directly relevant",
          }

          allowed_evidence = {
              "none",
              "contextual",
              "indirect",
              "substantive",
              "direct",
          }

          seen_indexes = set()

          for item in evaluations.get(
              "evaluations",
              [],
          ):

              if not isinstance(item, dict):
                  continue

              index = item.get("index")

              if not isinstance(index, int):
                  continue

              if index < 1 or index > len(sources):
                  continue

              if index in seen_indexes:
                  continue

              seen_indexes.add(index)

              source = dict(
                  sources[index - 1]
              )

              try:
                  score = float(
                      item.get(
                          "relevance_score",
                          0.0,
                      )
                  )
              except (TypeError, ValueError):
                  score = 0.0

              score = max(
                  0.0,
                  min(1.0, score),
              )

              classification = item.get(
                  "classification",
                  "unknown",
              )

              if classification not in allowed_classifications:
                  classification = "unknown"

              evidence_strength = item.get(
                  "evidence_strength",
                  "none",
              )

              if evidence_strength not in allowed_evidence:
                  evidence_strength = "none"

              source["relevance_score"] = score
              source["classification"] = classification
              source["reason"] = str(
                  item.get(
                      "reason",
                      "",
                  )
              ).strip()
              source["evidence_strength"] = evidence_strength

              evaluated_sources.append(source)

          if not evaluated_sources:
              raise RuntimeError(
                  "Gemini returned no usable evaluations."
              )

          # ---------------------------------------------------------
          # 7. Statistics
          # ---------------------------------------------------------

          direct = [
              s
              for s in evaluated_sources
              if s["relevance_score"] >= 0.80
          ]

          relevant = [
              s
              for s in evaluated_sources
              if 0.60 <= s["relevance_score"] < 0.80
          ]

          contextual = [
              s
              for s in evaluated_sources
              if 0.20 <= s["relevance_score"] < 0.60
          ]

          irrelevant = [
              s
              for s in evaluated_sources
              if s["relevance_score"] < 0.20
          ]

          average_score = round(
              sum(
                  s["relevance_score"]
                  for s in evaluated_sources
              )
              / len(evaluated_sources),
              3,
          )

          now = datetime.now(
              timezone.utc
          ).isoformat()

          # ---------------------------------------------------------
          # 8. Write memory
          # ---------------------------------------------------------

          MEMORY_PATH.parent.mkdir(
              exist_ok=True
          )

          memory = {
              "version": "V48",
              "created_at": now,
              "research_question": research_question,
              "source_count": len(evaluated_sources),
              "direct_sources": len(direct),
              "relevant_sources": len(relevant),
              "contextual_sources": len(contextual),
              "irrelevant_sources": len(irrelevant),
              "average_relevance": average_score,
              "sources": evaluated_sources,
              "learning": {
                  "keyword_match_is_not_evidence": True,
                  "title_is_not_proof": True,
                  "metadata_is_not_evidence": True,
                  "missing_context_is_uncertainty": True,
                  "false_positive_filtering": True,
                  "precision_over_optimism": True,
                  "relevance_differs_from_evidence": True,
              },
              "last_updated": now,
          }

          MEMORY_PATH.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # ---------------------------------------------------------
          # 9. Write report
          # ---------------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              research_question,
              "",
              "## Results",
              "",
              f"- Candidates evaluated: {len(evaluated_sources)}",
              f"- Directly relevant: {len(direct)}",
              f"- Relevant: {len(relevant)}",
              f"- Contextual: {len(contextual)}",
              f"- Irrelevant: {len(irrelevant)}",
              f"- Average relevance: {average_score}",
              "",
              "## Evaluated Sources",
              "",
          ]

          for number, source in enumerate(
              evaluated_sources,
              start=1,
          ):
              report.extend(
                  [
                      f"### Source {number}",
                      "",
                      f"**Title:** {source['title']}",
                      "",
                      f"**Category:** {source['category']}",
                      "",
                      f"**Relevance:** "
                      f"{source['relevance_score']:.2f}",
                      "",
                      f"**Classification:** "
                      f"{source['classification']}",
                      "",
                      f"**Evidence strength:** "
                      f"{source['evidence_strength']}",
                      "",
                      f"**Reason:** {source['reason']}",
                      "",
                      f"**URL:** {source['url']}",
                      "",
                  ]
              )

          report.extend(
              [
                  "## V48 Learning",
                  "",
                  "NØX has learned to distinguish source relevance "
                  "from evidentiary strength.",
                  "",
                  "Keyword overlap is not evidence.",
                  "",
                  "A source title is not evidence.",
                  "",
                  "Academic metadata is not substantive evidence.",
                  "",
                  "Missing context remains uncertainty.",
                  "",
                  "False positives must be filtered before knowledge "
                  "is strengthened.",
                  "",
                  "## V48 Principle",
                  "",
                  "NØX does not ask only whether it found a source.",
                  "",
                  "It asks whether that source deserves to influence "
                  "its knowledge.",
                  "",
                  "Filtering false positives is part of learning.",
              ]
          )

          OUTPUT_PATH.write_text(
              "\n".join(report),
              encoding="utf-8",
          )

          print("===================================")
          print("V48 SOURCE FILTER RESULT")
          print("===================================")
          print(
              f"Sources evaluated: "
              f"{len(evaluated_sources)}"
          )
          print(
              f"Directly relevant: "
              f"{len(direct)}"
          )
          print(
              f"Relevant: "
              f"{len(relevant)}"
          )
          print(
              f"Contextual: "
              f"{len(contextual)}"
          )
          print(
              f"Irrelevant: "
              f"{len(irrelevant)}"
          )
          print(
              f"Average relevance: "
              f"{average_score}"
          )
          print(
              "False-positive filtering: PASS"
          )
          print(
              "Memory written: PASS"
          )
          print(
              "Report written: PASS"
          )
          print("===================================")
          PY

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python nox_v48.py

      - name: Commit V48 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/ V48_SOURCE_FILTER.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
