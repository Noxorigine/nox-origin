name: NØX Origin - V48 Source Relevance Filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create V48 script
        shell: bash
        run: |
          cat > nox_v48.py <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          print("===================================")
          print("NØX ORIGIN V48")
          print("SOURCE RELEVANCE FILTER")
          print("===================================")


          # --------------------------------------------------
          # FILES
          # --------------------------------------------------

          previous_report = Path("V47_MULTI_SOURCE_RESEARCH.md")

          if not previous_report.exists():
              raise RuntimeError(
                  "V47_MULTI_SOURCE_RESEARCH.md not found."
              )

          text = previous_report.read_text(
              encoding="utf-8"
          )

          lines = text.splitlines()


          # --------------------------------------------------
          # RESEARCH QUESTION
          # --------------------------------------------------

          research_question = ""

          question_patterns = [
              r"Research Question\s*[:\-]?\s*\n\s*(.*?)(?:\n\n|$)",
              r"##\s*Research Question\s*\n\s*(.*?)(?:\n##|\Z)",
              r"\*\*Research Question:\*\*\s*(.*)",
          ]

          for pattern in question_patterns:
              match = re.search(
                  pattern,
                  text,
                  re.I | re.S
              )

              if match:
                  research_question = (
                      match.group(1)
                      .strip()
                      .replace("\n", " ")
                  )
                  break

          if not research_question:
              research_question = (
                  "What information is supported by the "
                  "discovered sources?"
              )

          print(
              f"Research question: "
              f"{research_question[:300]}"
          )


          # --------------------------------------------------
          # SOURCE EXTRACTION
          #
          # V48 deliberately uses URL-first extraction.
          # This avoids depending on the exact formatting
          # generated by V47.
          # --------------------------------------------------

          sources = []

          url_pattern = re.compile(
              r"https?://[^\s\]\)<>\"']+",
              re.I
          )


          def clean_url(url):
              return url.rstrip(
                  ".,;:!?)]}>\"'"
              )


          def clean_text(value):
              value = value.strip()

              value = re.sub(
                  r"^[-*•]\s*",
                  "",
                  value
              )

              value = re.sub(
                  r"^#+\s*",
                  "",
                  value
              )

              return value.strip()


          def is_metadata_line(value):
              lower = value.lower().strip()

              metadata = [
                  "total:",
                  "sources discovered",
                  "research question",
                  "candidate sources",
                  "sources:",
                  "results:",
                  "summary:",
                  "statistics:",
                  "categories:",
              ]

              if any(
                  lower.startswith(item)
                  for item in metadata
              ):
                  return True

              return False


          # --------------------------------------------------
          # FIND EVERY REAL URL
          # --------------------------------------------------

          url_locations = []

          for index, line in enumerate(lines):

              matches = url_pattern.findall(line)

              for url in matches:

                  url = clean_url(url)

                  if not url:
                      continue

                  # Ignore local/internal URLs.
                  if url.startswith(
                      "https://github.com/"
                  ) and "nox-origin" in url.lower():
                      continue

                  url_locations.append(
                      (index, url)
                  )


          print(
              f"URLs detected in V47: "
              f"{len(url_locations)}"
          )


          # --------------------------------------------------
          # RECONSTRUCT SOURCE INFORMATION
          # --------------------------------------------------

          for index, url in url_locations:

              title = ""
              category = ""

              start = max(
                  0,
                  index - 10
              )

              nearby = lines[start:index]


              # Search backwards.
              for candidate in reversed(nearby):

                  candidate = clean_text(candidate)

                  if not candidate:
                      continue

                  if is_metadata_line(candidate):
                      continue

                  # Explicit category.
                  category_match = re.match(
                      r"(?:Category|Type|Source Type)\s*:\s*(.*)",
                      candidate,
                      re.I
                  )

                  if category_match:
                      category = (
                          category_match.group(1)
                          .strip()
                      )
                      continue

                  # Explicit title.
                  title_match = re.match(
                      r"(?:Title|Source|Name)\s*:\s*(.*)",
                      candidate,
                      re.I
                  )

                  if title_match:
                      title = (
                          title_match.group(1)
                          .strip()
                      )
                      break

                  # Ignore obvious technical metadata.
                  if re.match(
                      r"^(URL|Link|Website)\s*:",
                      candidate,
                      re.I
                  ):
                      continue

                  if re.match(
                      r"^(Date|Published|Author|Score|Relevance)\s*:",
                      candidate,
                      re.I
                  ):
                      continue

                  # Use the nearest meaningful heading/text.
                  if not title and len(candidate) >= 8:
                      title = candidate


              # --------------------------------------------------
              # SECOND TITLE STRATEGY
              # --------------------------------------------------

              if not title:

                  # Look forward a few lines.
                  for candidate in lines[
                      index + 1:min(
                          len(lines),
                          index + 5
                      )
                  ]:

                      candidate = clean_text(candidate)

                      if not candidate:
                          continue

                      if is_metadata_line(candidate):
                          continue

                      if re.match(
                          r"^(URL|Link|Website|Category)\s*:",
                          candidate,
                          re.I
                      ):
                          continue

                      if len(candidate) >= 8:
                          title = candidate
                          break


              # --------------------------------------------------
              # FINAL TITLE FALLBACK
              # --------------------------------------------------

              if not title:
                  title = url


              if not category:
                  category = "unknown"


              source = {
                  "title": title,
                  "category": category,
                  "url": url,
              }


              # --------------------------------------------------
              # REMOVE OBVIOUS NON-SOURCES
              # --------------------------------------------------

              lower_title = title.lower()

              invalid_title = (
                  lower_title.startswith("total") or
                  lower_title.startswith("research question") or
                  lower_title.startswith("sources discovered") or
                  lower_title.startswith("candidate sources") or
                  lower_title == "url" or
                  lower_title == "link"
              )

              if invalid_title:
                  continue


              # --------------------------------------------------
              # DEDUPLICATION
              # --------------------------------------------------

              normalized_url = url.lower().rstrip("/")

              duplicate = any(
                  existing["url"]
                  .lower()
                  .rstrip("/") == normalized_url
                  for existing in sources
              )

              if duplicate:
                  continue


              sources.append(source)


          # --------------------------------------------------
          # SOURCE COUNT
          # --------------------------------------------------

          print(
              f"Candidate sources detected: "
              f"{len(sources)}"
          )


          if sources:

              for number, source in enumerate(
                  sources,
                  start=1
              ):

                  print(
                      f"  {number}. "
                      f"{source['title'][:100]}"
                  )

                  print(
                      f"     {source['url']}"
                  )


          if not sources:

              print("===================================")
              print("V48 EXTRACTION DEBUG")
              print("===================================")

              for number, line in enumerate(
                  lines,
                  start=1
              ):

                  if (
                      "http://" in line
                      or "https://" in line
                  ):

                      print(
                          f"{number}: {line[:300]}"
                      )

              print("===================================")

              raise RuntimeError(
                  "V48 could not identify any real "
                  "source URLs in V47."
              )


          # --------------------------------------------------
          # GEMINI API
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )


          prompt = f"""
You are NØX Origin.

Your task is to evaluate the relevance and evidentiary
value of discovered sources.

DO NOT answer the research question.

Research question:

{research_question}

Evaluate every source independently.

Rules:

1. Keyword overlap is not evidence.
2. A source title is not evidence.
3. An unrelated source must receive a very low score.
4. Background information must be distinguished from
   direct evidence.
5. Never invent information not present in the supplied
   source data.
6. Missing source context means uncertainty.
7. Academic metadata without accessible content is not
   substantive evidence.
8. Prefer precision over optimism.
9. Evaluate every source independently.
10. A source can be relevant without providing direct
    evidence.
11. Do not upgrade a source merely because its title
    sounds scientific.
12. If the supplied information is insufficient,
    reduce the score.
13. Never treat a metadata artifact as a real source.
14. URL presence alone does not prove relevance.
15. Do not assume the content of a URL that was not
    supplied.

Relevance scale:

0.00-0.19 = irrelevant
0.20-0.39 = weak contextual relevance
0.40-0.59 = potentially useful
0.60-0.79 = relevant
0.80-1.00 = directly relevant

Evidence strength:

none
contextual
indirect
substantive
direct

Return ONLY valid JSON.

Format:

{{
  "evaluations": [
    {{
      "index": 1,
      "relevance_score": 0.00,
      "classification": "irrelevant",
      "reason": "short explanation",
      "evidence_strength": "none"
    }}
  ]
}}

Sources:

{json.dumps(
    sources,
    ensure_ascii=False,
    indent=2
)}
"""


          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.6-flash:generateContent"
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.1,
                  "responseMimeType": "application/json",
              },
          }


          try:

              response = requests.post(
                  endpoint,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key,
                  },
                  json=payload,
                  timeout=(15, 60),
              )

          except requests.RequestException as exc:

              raise RuntimeError(
                  f"Gemini connection failed: {exc}"
              )


          print(
              f"Gemini status: "
              f"{response.status_code}"
          )


          if response.status_code != 200:

              raise RuntimeError(
                  f"Gemini request failed: "
                  f"{response.status_code} "
                  f"{response.text[:1000]}"
              )


          try:

              result = response.json()

          except ValueError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid HTTP JSON: {exc}"
              )


          try:

              raw_text = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

          except (
              KeyError,
              IndexError,
              TypeError,
          ) as exc:

              raise RuntimeError(
                  f"Unexpected Gemini response: {exc}"
              )


          try:

              evaluations = json.loads(
                  raw_text
              )

          except json.JSONDecodeError as exc:

              raise RuntimeError(
                  f"Gemini returned invalid "
                  f"evaluation JSON: {exc}"
              )


          if not isinstance(
              evaluations,
              dict
          ):

              raise RuntimeError(
                  "Gemini evaluation is not "
                  "a JSON object."
              )


          # --------------------------------------------------
          # VALIDATE EVALUATIONS
          # --------------------------------------------------

          evaluated_sources = []

          allowed_classifications = {
              "irrelevant",
              "weak contextual relevance",
              "potentially useful",
              "relevant",
              "directly relevant",
          }

          allowed_evidence = {
              "none",
              "contextual",
              "indirect",
              "substantive",
              "direct",
          }


          for item in evaluations.get(
              "evaluations",
              []
          ):

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              index = item.get("index")

              if not isinstance(
                  index,
                  int
              ):
                  continue

              if index < 1 or index > len(sources):
                  continue

              source = dict(
                  sources[index - 1]
              )


              try:

                  score = float(
                      item.get(
                          "relevance_score",
                          0.0
                      )
                  )

              except (
                  TypeError,
                  ValueError,
              ):

                  score = 0.0


              score = max(
                  0.0,
                  min(1.0, score)
              )


              classification = item.get(
                  "classification",
                  "unknown"
              )

              if classification not in (
                  allowed_classifications
              ):
                  classification = "unknown"


              evidence_strength = item.get(
                  "evidence_strength",
                  "none"
              )

              if evidence_strength not in (
                  allowed_evidence
              ):
                  evidence_strength = "none"


              source["relevance_score"] = score

              source["classification"] = (
                  classification
              )

              source["reason"] = str(
                  item.get(
                      "reason",
                      ""
                  )
              ).strip()

              source["evidence_strength"] = (
                  evidence_strength
              )


              evaluated_sources.append(
                  source
              )


          if not evaluated_sources:

              raise RuntimeError(
                  "Gemini returned no usable evaluations."
              )


          # --------------------------------------------------
          # CLASSIFICATION
          # --------------------------------------------------

          direct = [
              s
              for s in evaluated_sources
              if s["relevance_score"] >= 0.80
          ]

          relevant = [
              s
              for s in evaluated_sources
              if 0.60 <= s["relevance_score"] < 0.80
          ]

          contextual = [
              s
              for s in evaluated_sources
              if 0.20 <= s["relevance_score"] < 0.60
          ]

          irrelevant = [
              s
              for s in evaluated_sources
              if s["relevance_score"] < 0.20
          ]


          average_score = round(
              sum(
                  s["relevance_score"]
                  for s in evaluated_sources
              )
              / len(evaluated_sources),
              3
          )


          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()

          memory_dir = Path(
              "nox_memory"
          )

          memory_dir.mkdir(
              exist_ok=True
          )


          memory = {
              "version": "V48",
              "created_at": now,
              "research_question": research_question,
              "source_count": len(
                  evaluated_sources
              ),
              "direct_sources": len(direct),
              "relevant_sources": len(relevant),
              "contextual_sources": len(contextual),
              "irrelevant_sources": len(irrelevant),
              "average_relevance": average_score,
              "sources": evaluated_sources,
              "learning": {
                  "keyword_match_is_not_evidence": True,
                  "title_is_not_proof": True,
                  "metadata_is_not_evidence": True,
                  "missing_context_is_uncertainty": True,
                  "false_positive_filtering": True,
                  "precision_over_optimism": True,
                  "source_structure_validation": True,
                  "url_first_extraction": True,
                  "source_deduplication": True,
              },
              "last_updated": now,
          }


          Path(
              "nox_memory/nox_memory_v48.json"
          ).write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V48 Source Relevance Filter",
              "",
              "## Research Question",
              "",
              research_question,
              "",
              "## Results",
              "",
              f"- Candidates evaluated: "
              f"{len(evaluated_sources)}",
              f"- Directly relevant: "
              f"{len(direct)}",
              f"- Relevant: "
              f"{len(relevant)}",
              f"- Contextual: "
              f"{len(contextual)}",
              f"- Irrelevant: "
              f"{len(irrelevant)}",
              f"- Average relevance: "
              f"{average_score}",
              "",
              "## Evaluated Sources",
              "",
          ]


          for number, source in enumerate(
              evaluated_sources,
              start=1
          ):

              report.extend(
                  [
                      f"### Source {number}",
                      "",
                      f"**Title:** "
                      f"{source['title']}",
                      "",
                      f"**Category:** "
                      f"{source['category']}",
                      "",
                      f"**Relevance:** "
                      f"{source['relevance_score']:.2f}",
                      "",
                      f"**Classification:** "
                      f"{source['classification']}",
                      "",
                      f"**Evidence strength:** "
                      f"{source['evidence_strength']}",
                      "",
                      f"**Reason:** "
                      f"{source['reason']}",
                      "",
                      f"**URL:** "
                      f"{source['url']}",
                      "",
                  ]
              )


          report.extend(
              [
                  "## V48 Learning",
                  "",
                  "NØX now distinguishes source relevance "
                  "from evidentiary strength.",
                  "",
                  "Keyword overlap is not evidence.",
                  "",
                  "A source title is not evidence.",
                  "",
                  "Academic metadata is not substantive evidence.",
                  "",
                  "Missing context remains uncertainty.",
                  "",
                  "False positives must be filtered "
                  "before knowledge is strengthened.",
                  "",
                  "Source structure must be validated "
                  "before analysis.",
                  "",
                  "URL-first extraction reduces dependence "
                  "on the exact V47 report format.",
                  "",
                  "Duplicate URLs are removed before "
                  "evaluation.",
                  "",
                  "## V48 Principle",
                  "",
                  "NØX does not ask only whether it found "
                  "a source.",
                  "",
                  "It asks whether that source deserves "
                  "to influence its knowledge.",
              ]
          )


          Path(
              "V48_SOURCE_FILTER.md"
          ).write_text(
              "\n".join(report),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V48 SOURCE FILTER RESULT")
          print("===================================")
          print(
              f"Sources evaluated: "
              f"{len(evaluated_sources)}"
          )
          print(
              f"Directly relevant: "
              f"{len(direct)}"
          )
          print(
              f"Relevant: "
              f"{len(relevant)}"
          )
          print(
              f"Contextual: "
              f"{len(contextual)}"
          )
          print(
              f"Irrelevant: "
              f"{len(irrelevant)}"
          )
          print(
              f"Average relevance: "
              f"{average_score}"
          )
          print(
              "Source structure validation: PASS"
          )
          print(
              "False-positive filtering: PASS"
          )
          print(
              "Memory written: PASS"
          )
          print(
              "Report written: PASS"
          )
          print("===================================")

          PY

      - name: Run NØX V48
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python nox_v48.py

      - name: Commit V48 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/ V48_SOURCE_FILTER.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V48 - Source Relevance Filter"
            git push
          fi
