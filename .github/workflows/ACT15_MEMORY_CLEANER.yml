name: NØX ACT15 Memory Cleaner - Weekly V2

"on":
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 0"

permissions:
  contents: write

concurrency:
  group: nox-marketplace-memory-maintenance
  cancel-in-progress: false

env:
  MEMORY_FILE: memory/nox_act_15_marketplace.json
  MAX_TASKS: 250
  MAX_OPPORTUNITIES: 200
  MAX_HISTORY: 20

jobs:
  clean-act15-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync main before cleaning
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Compact ACT15 memory
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          MEMORY_FILE = os.environ["MEMORY_FILE"]
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_OPPORTUNITIES = int(
              os.environ["MAX_OPPORTUNITIES"]
          )
          MAX_HISTORY = int(
              os.environ["MAX_HISTORY"]
          )

          print("=== NØX ACT15 MEMORY CLEANER V2 ===")
          print("Mode: WEEKLY COMPACTION")
          print("Payments: False")
          print("Spending: False")
          print("Gemini: False")
          print("External AI: False")
          print("Cost: €0")
          print()

          if not os.path.exists(MEMORY_FILE):
              raise SystemExit(
                  f"Memory file not found: {MEMORY_FILE}"
              )

          with open(
              MEMORY_FILE,
              "r",
              encoding="utf-8",
          ) as handle:
              original = json.load(handle)

          if not isinstance(original, dict):
              raise SystemExit(
                  "Memory root is not a JSON object."
              )

          original_size = os.path.getsize(
              MEMORY_FILE
          )

          actions = original.get(
              "actions",
              [],
          )

          if not isinstance(actions, list):
              actions = []

          print(
              f"Original size: "
              f"{original_size:,} bytes"
          )

          print(
              f"Original actions: "
              f"{len(actions):,}"
          )

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def norm(value):
              if value is None:
                  return ""

              return str(value).strip().lower()

          def first(obj, keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  value = obj.get(key)

                  if value not in (
                      None,
                      "",
                  ):
                      return value

              return None

          def task_id(obj):
              return first(
                  obj,
                  (
                      "task_id",
                      "taskId",
                  ),
              )

          def bid_id(obj):
              return first(
                  obj,
                  (
                      "bid_id",
                      "bidId",
                  ),
              )

          def title(obj):
              return first(
                  obj,
                  (
                      "title",
                      "task_title",
                      "name",
                  ),
              )

          def timestamp(obj):
              return first(
                  obj,
                  (
                      "timestamp_utc",
                      "timestamp",
                      "updated_at",
                      "created_at",
                  ),
              ) or ""

          def status(obj):
              return first(
                  obj,
                  (
                      "status",
                      "bid_status",
                      "bidStatus",
                      "reward_state",
                  ),
              )

          def action(obj):
              return first(
                  obj,
                  (
                      "action",
                  ),
              )

          def amount(obj):
              return first(
                  obj,
                  (
                      "proposed_bid_sats",
                      "bid_amount_sats",
                      "bidAmountSats",
                      "bid_amount",
                      "bidAmount",
                      "amount_sats",
                      "amountSats",
                  ),
              )

          def reward(obj):
              return first(
                  obj,
                  (
                      "reward_sats",
                      "rewardSats",
                  ),
              )

          def score(obj):
              return first(
                  obj,
                  (
                      "opportunity_score",
                      "total_score",
                      "score",
                  ),
              )

          def fingerprint(obj):
              raw = json.dumps(
                  obj,
                  sort_keys=True,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")

              return hashlib.sha256(
                  raw
              ).hexdigest()

          # --------------------------------------------------
          # 1. Remove exact duplicates.
          # --------------------------------------------------

          unique = []
          seen = set()
          duplicates = 0

          for item in actions:
              fp = fingerprint(item)

              if fp in seen:
                  duplicates += 1
                  continue

              seen.add(fp)
              unique.append(item)

          print(
              f"Exact duplicates removed: "
              f"{duplicates}"
          )

          # --------------------------------------------------
          # 2. Group all actions by explicit task_id.
          # --------------------------------------------------

          task_actions = defaultdict(list)
          orphan_actions = []

          for item in unique:
              tid = task_id(item)

              if tid:
                  task_actions[str(tid)].append(
                      item
                  )
              else:
                  orphan_actions.append(item)

          # --------------------------------------------------
          # 3. Sort task history chronologically.
          # --------------------------------------------------

          for tid in task_actions:
              task_actions[tid].sort(
                  key=timestamp
              )

          # --------------------------------------------------
          # 4. Determine important state.
          # --------------------------------------------------

          active_statuses = {
              "pending",
              "submitted",
              "active",
              "open",
              "bidding",
              "already_bid",
              "accepted",
              "approved",
              "won",
              "selected",
          }

          important_actions = {
              "marketplace_bid",
              "marketplace_bid_check",
              "marketplace_bid_error",
              "marketplace_bid_submitted",
              "marketplace_payment_check",
              "marketplace_payment",
              "marketplace_task_accepted",
              "marketplace_learning_candidate",
              "marketplace_opportunity",
          }

          protected_tasks = set()

          for tid, history in task_actions.items():

              latest = history[-1]

              latest_status = norm(
                  status(latest)
              )

              if (
                  latest_status
                  in active_statuses
              ):
                  protected_tasks.add(tid)
                  continue

              if any(
                  norm(action(item))
                  in important_actions
                  for item in history[-10:]
              ):
                  protected_tasks.add(tid)
                  continue

              if any(
                  bid_id(item)
                  or amount(item) is not None
                  for item in history[-10:]
              ):
                  protected_tasks.add(tid)

          # Most recently seen tasks first.
          ordered_tasks = sorted(
              task_actions.keys(),
              key=lambda tid:
                  timestamp(
                      task_actions[tid][-1]
                  ),
              reverse=True,
          )

          ordered_protected = [
              tid
              for tid in ordered_tasks
              if tid in protected_tasks
          ]

          ordered_other = [
              tid
              for tid in ordered_tasks
              if tid not in protected_tasks
          ]

          selected_tasks = (
              ordered_protected
              + ordered_other
          )[:MAX_TASKS]

          print(
              f"Tasks discovered: "
              f"{len(task_actions)}"
          )

          print(
              f"Protected tasks: "
              f"{len(protected_tasks)}"
          )

          print(
              f"Tasks retained: "
              f"{len(selected_tasks)}"
          )

          # --------------------------------------------------
          # 5. Compact each task into a small state record.
          # --------------------------------------------------

          compact_tasks = []

          for tid in selected_tasks:

              history = task_actions[tid]

              latest = history[-1]

              # Start with the latest useful scalar state.
              compact = {
                  "task_id": str(tid),
                  "last_seen": timestamp(latest),
              }

              task_title = title(latest)

              if task_title:
                  compact["title"] = task_title

              latest_action = action(latest)

              if latest_action:
                  compact["last_action"] = (
                      latest_action
                  )

              latest_status = status(latest)

              if latest_status is not None:
                  compact["status"] = (
                      latest_status
                  )

              bid = bid_id(latest)

              if bid:
                  compact["bid_id"] = str(bid)

              bid_amount = amount(latest)

              if bid_amount is not None:
                  compact["bid_amount_sats"] = (
                      bid_amount
                  )

              reward_value = reward(latest)

              if reward_value is not None:
                  compact["reward_sats"] = (
                      reward_value
                  )

              reward_source = first(
                  latest,
                  (
                      "reward_source",
                  ),
              )

              if reward_source:
                  compact["reward_source"] = (
                      reward_source
                  )

              reward_state = first(
                  latest,
                  (
                      "reward_state",
                  ),
              )

              if reward_state:
                  compact["reward_state"] = (
                      reward_state
                  )

              opportunity = first(
                  latest,
                  (
                      "opportunity_score",
                  ),
              )

              if opportunity is not None:
                  compact[
                      "opportunity_score"
                  ] = opportunity

              capability = first(
                  latest,
                  (
                      "capability_score",
                  ),
              )

              if capability is not None:
                  compact[
                      "capability_score"
                  ] = capability

              learning = first(
                  latest,
                  (
                      "learning_score",
                  ),
              )

              if learning is not None:
                  compact[
                      "learning_score"
                  ] = learning

              tip_score = first(
                  latest,
                  (
                      "tip_score",
                  ),
              )

              if tip_score is not None:
                  compact[
                      "tip_score"
                  ] = tip_score

              # Preserve explicit decision.
              decision = latest.get(
                  "decision"
              )

              if isinstance(
                  decision,
                  dict,
              ):
                  decision_compact = {}

                  for key in (
                      "decision",
                      "direction",
                      "direction_confidence",
                      "reason",
                      "direction_reason",
                      "total",
                      "capability",
                      "domain",
                      "domain_score",
                      "learning",
                      "reward_sats",
                      "reward_currency",
                  ):
                      if key in decision:
                          decision_compact[
                              key
                          ] = decision[key]

                  if decision_compact:
                      compact[
                          "decision"
                      ] = decision_compact

              # Preserve the latest error in a small form.
              response = latest.get(
                  "response"
              )

              if isinstance(
                  response,
                  dict,
              ):
                  detail = response.get(
                      "detail"
                  )

                  if isinstance(
                      detail,
                      dict,
                  ):
                      error = {}

                      for key in (
                          "code",
                          "message",
                      ):
                          if key in detail:
                              error[key] = (
                                  detail[key]
                              )

                      if error:
                          compact[
                              "error"
                          ] = error

              http_status = first(
                  latest,
                  (
                      "http_status",
                  ),
              )

              if http_status is not None:
                  compact[
                      "http_status"
                  ] = http_status

              # Preserve the latest meaningful event count.
              compact[
                  "observations_count"
              ] = len(history)

              # Keep last bid-related event separately when it
              # contains information absent from latest state.
              bid_events = [
                  item
                  for item in history
                  if (
                      bid_id(item)
                      or amount(item) is not None
                      or "bid" in norm(
                          action(item)
                      )
                  )
              ]

              if bid_events:
                  latest_bid = bid_events[-1]

                  latest_bid_id = bid_id(
                      latest_bid
                  )

                  if (
                      latest_bid_id
                      and "bid_id" not in compact
                  ):
                      compact[
                          "bid_id"
                      ] = str(
                          latest_bid_id
                      )

                  latest_bid_amount = amount(
                      latest_bid
                  )

                  if (
                      latest_bid_amount
                      is not None
                      and "bid_amount_sats"
                      not in compact
                  ):
                      compact[
                          "bid_amount_sats"
                      ] = latest_bid_amount

              compact_tasks.append(
                  compact
              )

          # --------------------------------------------------
          # 6. Preserve orphan actions only when important.
          # --------------------------------------------------

          compact_orphans = []

          for item in orphan_actions:

              act = norm(
                  action(item)
              )

              if act in important_actions:

                  compact = {
                      "last_seen":
                          timestamp(item),
                      "action":
                          action(item),
                  }

                  for key in (
                      "status",
                      "proposed_bid_sats",
                      "reward_sats",
                      "http_status",
                      "reward_state",
                  ):
                      if key in item:
                          compact[key] = (
                              item[key]
                          )

                  compact_orphans.append(
                      compact
                  )

          # Keep only recent orphan events.
          compact_orphans.sort(
              key=lambda x:
                  x.get(
                      "last_seen",
                      "",
                  ),
              reverse=True,
          )

          compact_orphans = (
              compact_orphans[:50]
          )

          # --------------------------------------------------
          # 7. Compact opportunity lists.
          # --------------------------------------------------

          def compact_opportunities(
              key
          ):
              source = original.get(
                  key,
                  [],
              )

              if not isinstance(
                  source,
                  list,
              ):
                  return []

              by_task = {}

              for item in source:

                  if not isinstance(
                      item,
                      dict,
                  ):
                      continue

                  tid = task_id(item)

                  if not tid:
                      continue

                  compact = {
                      "task_id": str(tid),
                  }

                  for field in (
                      "title",
                      "status",
                      "reward_sats",
                      "reward_source",
                      "reward_state",
                      "capability_score",
                      "domain_score",
                      "economic_score",
                      "learning_score",
                      "opportunity_score",
                      "tip_score",
                      "bid_submitted",
                      "decision",
                      "timestamp",
                  ):
                      if field in item:
                          value = item[field]

                          if field == "decision":
                              if isinstance(
                                  value,
                                  dict,
                              ):
                                  small = {}

                                  for dk in (
                                      "decision",
                                      "direction",
                                      "direction_confidence",
                                      "reason",
                                      "total",
                                  ):
                                      if dk in value:
                                          small[dk] = (
                                              value[dk]
                                          )

                                  if small:
                                      compact[
                                          field
                                      ] = small
                          else:
                              compact[field] = (
                                  value
                              )

                  by_task[str(tid)] = compact

              result = list(
                  by_task.values()
              )

              result.sort(
                  key=lambda x:
                      str(
                          x.get(
                              "timestamp",
                              "",
                          )
                      ),
                  reverse=True,
              )

              return result[
                  :MAX_OPPORTUNITIES
              ]

          unknown_reward = compact_opportunities(
              "unknown_reward_opportunities"
          )

          # --------------------------------------------------
          # 8. Build compact statistics.
          # --------------------------------------------------

          action_counts = Counter()
          status_counts = Counter()
          error_counts = Counter()

          for item in unique:

              act = action(item)

              if act:
                  action_counts[
                      str(act)
                  ] += 1

              st = status(item)

              if st:
                  status_counts[
                      str(st)
                  ] += 1

              response = item.get(
                  "response"
              )

              if isinstance(
                  response,
                  dict,
              ):
                  detail = response.get(
                      "detail"
                  )

                  if isinstance(
                      detail,
                      dict,
                  ):
                      code = detail.get(
                          "code"
                      )

                      message = detail.get(
                          "message"
                      )

                      if code or message:
                          signature = (
                              str(
                                  code
                                  or "UNKNOWN"
                              )
                              + ": "
                              + str(
                                  message
                                  or "UNKNOWN"
                              )
                          )

                          error_counts[
                              signature
                          ] += 1

          # --------------------------------------------------
          # 9. Construct cleaned memory.
          # --------------------------------------------------

          cleaned = copy.deepcopy(
              original
          )

          # Replace huge detailed action log.
          cleaned["actions"] = (
              compact_tasks
              + compact_orphans
          )

          cleaned[
              "unknown_reward_opportunities"
          ] = unknown_reward

          cleaned[
              "memory_compaction"
          ] = {
              "version": "V2",
              "timestamp_utc": now_iso(),
              "source_actions":
                  len(actions),
              "unique_actions":
                  len(unique),
              "tasks_discovered":
                  len(task_actions),
              "tasks_retained":
                  len(compact_tasks),
              "protected_tasks":
                  len(protected_tasks),
              "orphan_events_retained":
                  len(compact_orphans),
              "unknown_reward_opportunities":
                  len(unknown_reward),
          }

          cleaned[
              "memory_statistics"
          ] = {
              "action_counts":
                  dict(
                      action_counts.most_common(
                          50
                      )
                  ),
              "status_counts":
                  dict(
                      status_counts.most_common(
                          50
                      )
                  ),
              "error_counts":
                  dict(
                      error_counts.most_common(
                          50
                      )
                  ),
          }

          old_history = original.get(
              "cleaner_history",
              [],
          )

          if not isinstance(
              old_history,
              list,
          ):
              old_history = []

          old_history.append(
              cleaned[
                  "memory_compaction"
              ]
          )

          cleaned[
              "cleaner_history"
          ] = old_history[
              -MAX_HISTORY:
          ]

          cleaned[
              "updated_at"
          ] = now_iso()

          cleaned[
              "cleaner_version"
          ] = "V2"

          # --------------------------------------------------
          # 10. Validation in temporary file.
          # --------------------------------------------------

          fd, temp_path = tempfile.mkstemp(
              prefix="act15_compact_",
              suffix=".json",
          )

          os.close(fd)

          try:

              with open(
                  temp_path,
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      cleaned,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                  )
                  handle.write("\n")

              with open(
                  temp_path,
                  "r",
                  encoding="utf-8",
              ) as handle:
                  validated = json.load(
                      handle
                  )

              if not isinstance(
                  validated,
                  dict,
              ):
                  raise RuntimeError(
                      "Validation failed."
                  )

              if not isinstance(
                  validated.get(
                      "actions",
                      [],
                  ),
                  list,
              ):
                  raise RuntimeError(
                      "Validation failed: actions."
                  )

              # ------------------------------------------------
              # 11. Safety validation.
              #
              # Every protected task must still exist.
              # ------------------------------------------------

              retained_task_ids = {
                  str(item["task_id"])
                  for item
                  in validated.get(
                      "actions",
                      [],
                  )
                  if isinstance(
                      item,
                      dict,
                  )
                  and item.get("task_id")
              }

              missing = (
                  protected_tasks
                  - retained_task_ids
              )

              if missing:
                  raise RuntimeError(
                      "SAFETY FAILURE: "
                      f"{len(missing)} protected "
                      "task IDs disappeared."
                  )

              # ------------------------------------------------
              # 12. Ensure important existing root structures
              #     were not accidentally removed.
              # ------------------------------------------------

              for key in (
                  "act",
                  "version",
                  "workflow",
              ):
                  if (
                      key in original
                      and key not in validated
                  ):
                      raise RuntimeError(
                          f"SAFETY FAILURE: "
                          f"root key '{key}' disappeared."
                      )

              cleaned_size = os.path.getsize(
                  temp_path
              )

              reduction = (
                  100.0
                  * (
                      1.0
                      - (
                          cleaned_size
                          / max(
                              original_size,
                              1,
                          )
                      )
                  )
              )

              print()
              print(
                  "=== V2 CLEANER REPORT ==="
              )

              print(
                  f"Original size: "
                  f"{original_size:,} bytes"
              )

              print(
                  f"Compacted size: "
                  f"{cleaned_size:,} bytes"
              )

              print(
                  f"Size reduction: "
                  f"{reduction:.1f}%"
              )

              print(
                  f"Original actions: "
                  f"{len(actions):,}"
              )

              print(
                  f"Tasks retained: "
                  f"{len(compact_tasks):,}"
              )

              print(
                  f"Protected tasks: "
                  f"{len(protected_tasks):,}"
              )

              print(
                  f"Unknown reward opportunities: "
                  f"{len(unknown_reward):,}"
              )

              # If compaction somehow makes the file larger,
              # refuse replacement.
              if cleaned_size >= original_size:
                  print()
                  print(
                      "COMPACTION SKIPPED: "
                      "result is not smaller."
                  )
                  raise SystemExit(0)

              # ------------------------------------------------
              # 13. Backup before atomic replacement.
              # ------------------------------------------------

              backup_path = (
                  MEMORY_FILE
                  + ".preclean.bak"
              )

              shutil.copy2(
                  MEMORY_FILE,
                  backup_path,
              )

              os.replace(
                  temp_path,
                  MEMORY_FILE,
              )

              # ------------------------------------------------
              # 14. Final validation.
              # ------------------------------------------------

              with open(
                  MEMORY_FILE,
                  "r",
                  encoding="utf-8",
              ) as handle:
                  final_data = json.load(
                      handle
                  )

              if not isinstance(
                  final_data,
                  dict,
              ):
                  raise RuntimeError(
                      "Final JSON validation failed."
                  )

              final_tasks = {
                  str(item["task_id"])
                  for item in final_data.get(
                      "actions",
                      [],
                  )
                  if isinstance(
                      item,
                      dict,
                  )
                  and item.get("task_id")
              }

              if not protected_tasks.issubset(
                  final_tasks
              ):
                  raise RuntimeError(
                      "Final safety validation failed."
                  )

              os.remove(
                  backup_path
              )

              print()
              print(
                  "MEMORY REPLACEMENT: OK"
              )

          finally:

              if os.path.exists(
                  temp_path
              ):
                  os.remove(
                      temp_path
                  )

          print()
          print(
              "ACT15_MEMORY_CLEANER_V2: SUCCESS"
          )
          PY

      - name: Commit cleaned ACT15 memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          if git diff --cached --quiet; then
            echo "No ACT15 memory changes."
            exit 0
          fi

          git commit -m "NØX ACT15: compact marketplace memory"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "ACT15 MEMORY CLEANER V2: PUSHED"
