name: NØX V99 Autonomous Policy Stabilization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v99-autonomous-policy-stabilization
  cancel-in-progress: false

jobs:
  stabilize-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V99 autonomous policy stabilization
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load_json(name, default=None):
              path = MEMORY / name
              if not path.exists():
                  return default if default is not None else {}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default if default is not None else {}

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def integer(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def clamp(value, low=0.0, high=100.0):
              return max(low, min(high, value))

          v98 = load_json(
              "nox_v98_autonomous_correction_arbitration.json",
              {}
          )

          v97 = load_json(
              "nox_v97_deployment_result_learning.json",
              {}
          )

          v96 = load_json(
              "nox_v96_controlled_correction_deployment.json",
              {}
          )

          v95 = load_json(
              "nox_v95_controlled_correction_arbitration.json",
              {}
          )

          v94 = load_json(
              "nox_v94_controlled_live_comparison.json",
              {}
          )

          v93 = load_json(
              "nox_v93_autonomous_self_correction_validation.json",
              {}
          )

          v92 = load_json(
              "nox_v92_autonomous_self_correction_proposal.json",
              {}
          )

          v91 = load_json(
              "nox_v91_autonomous_decision_stability.json",
              {}
          )

          generated_at = datetime.now(timezone.utc).isoformat()

          decision = str(
              v98.get("autonomous_decision")
              or v98.get("decision")
              or v98.get("arbitration", {}).get("decision")
              or "COLLECT_MORE_EVIDENCE"
          )

          arbitration_quality = str(
              v98.get("arbitration_quality")
              or v98.get("arbitration", {}).get("quality")
              or "UNCERTAIN"
          )

          v98_confidence = number(
              v98.get("confidence")
              or v98.get("arbitration", {}).get("confidence"),
              0.25
          )

          v98_score = number(
              v98.get("arbitration_score")
              or v98.get("score")
              or v98.get("arbitration", {}).get("score"),
              0
          )

          correction_id = str(
              v98.get("correction_id")
              or v96.get("correction_id")
              or v92.get("selected_correction", {}).get("id")
              or "NONE"
          )

          correction_name = str(
              v98.get("correction_name")
              or v96.get("correction_name")
              or v92.get("selected_correction", {}).get("name")
              or "NONE"
          )

          live_validation = v97.get("live_validation", {})
          measurement = v97.get("measurement", {})
          signals = v97.get("signals", {})

          total_measured = integer(
              live_validation.get("total_measured")
              or measurement.get("total_measured"),
              0
          )

          decisions_changed = integer(
              measurement.get("decisions_changed")
              or live_validation.get("decisions_changed"),
              0
          )

          useful_changes = integer(
              signals.get("useful_changes")
              or measurement.get("useful_changes"),
              0
          )

          harmful_changes = integer(
              signals.get("harmful_changes")
              or measurement.get("harmful_changes"),
              0
          )

          atypical_preserved = integer(
              signals.get("atypical_preserved")
              or measurement.get("atypical_preserved"),
              0
          )

          completed_excluded = integer(
              signals.get("completed_excluded")
              or measurement.get("completed_excluded"),
              0
          )

          over_pruning = bool(
              measurement.get("over_pruning")
              or live_validation.get("over_pruning")
          )

          under_pruning = bool(
              measurement.get("under_pruning")
              or live_validation.get("under_pruning")
          )

          deployment_health = str(
              v97.get("deployment_health")
              or measurement.get("deployment_health")
              or "UNKNOWN"
          )

          v91_overall = number(
              v91.get("metrics", {}).get("overall_stability")
              or v91.get("overall_stability"),
              0
          )

          v91_evidence = number(
              v91.get("metrics", {}).get("evidence_stability")
              or v91.get("evidence_stability"),
              0
          )

          v91_strategy = number(
              v91.get("metrics", {}).get("strategy_stability")
              or v91.get("strategy_stability"),
              0
          )

          previous = load_json(
              "nox_v99_autonomous_policy_stabilization.json",
              {}
          )

          previous_cycle = integer(
              previous.get("stabilization_cycle"),
              0
          )

          previous_state = str(
              previous.get("policy_state")
              or "NO_PREVIOUS_STATE"
          )

          previous_decision = str(
              previous.get("decision")
              or "NO_PREVIOUS_DECISION"
          )

          previous_confidence = number(
              previous.get("confidence"),
              0
          )

          previous_correction = str(
              previous.get("correction_id")
              or "NONE"
          )

          same_correction = (
              correction_id != "NONE"
              and correction_id == previous_correction
          )

          decision_consistent = (
              decision == previous_decision
              and previous_decision != "NO_PREVIOUS_DECISION"
          )

          confidence_consistent = (
              previous_confidence == 0
              or abs(v98_confidence - previous_confidence) <= 0.15
          )

          evidence_quality = 0

          if total_measured >= 3:
              evidence_quality += 25

          if total_measured >= 5:
              evidence_quality += 15

          if harmful_changes == 0:
              evidence_quality += 20

          if completed_excluded > 0:
              evidence_quality += 10

          if atypical_preserved > 0:
              evidence_quality += 10

          if not over_pruning:
              evidence_quality += 10

          if not under_pruning:
              evidence_quality += 10

          evidence_quality = clamp(evidence_quality)

          stability_score = (
              (v98_confidence * 100.0 * 0.30)
              + (v91_overall * 100.0 * 0.20)
              + (v91_evidence * 100.0 * 0.15)
              + (v91_strategy * 100.0 * 0.10)
              + (evidence_quality * 0.25)
          )

          if decision_consistent:
              stability_score += 5

          if same_correction:
              stability_score += 5

          if not confidence_consistent:
              stability_score -= 10

          if harmful_changes > 0:
              stability_score -= 30

          if over_pruning or under_pruning:
              stability_score -= 15

          stability_score = clamp(stability_score)

          if harmful_changes > 0:
              stabilization_status = "ROLLBACK_READY"

          elif over_pruning or under_pruning:
              stabilization_status = "POLICY_REQUIRES_REFINEMENT"

          elif decision == "RETAIN" and stability_score >= 80:
              stabilization_status = "POLICY_STABILIZED"

          elif decision == "MAINTAIN_AND_OBSERVE":
              stabilization_status = "STABLE_OBSERVATION"

          elif decision == "COLLECT_MORE_EVIDENCE":
              stabilization_status = "EVIDENCE_COLLECTION_REQUIRED"

          elif decision == "REFINE":
              stabilization_status = "REFINEMENT_REQUIRED"

          elif stability_score >= 70:
              stabilization_status = "STABILIZATION_IN_PROGRESS"

          else:
              stabilization_status = "INSUFFICIENT_STABILITY"

          if stabilization_status == "POLICY_STABILIZED":
              policy_state = "CONTROLLED_POLICY_STABLE"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS"

          elif stabilization_status == "ROLLBACK_READY":
              policy_state = "CONTROLLED_POLICY_ROLLBACK_READY"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS_WITH_ROLLBACK"

          elif stabilization_status == "POLICY_REQUIRES_REFINEMENT":
              policy_state = "CONTROLLED_POLICY_REFINEMENT_REQUIRED"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS"

          elif stabilization_status == "REFINEMENT_REQUIRED":
              policy_state = "CONTROLLED_POLICY_REFINEMENT_REQUIRED"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS"

          elif stabilization_status == "EVIDENCE_COLLECTION_REQUIRED":
              policy_state = "CONTROLLED_POLICY_UNDER_OBSERVATION"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS"

          else:
              policy_state = "CONTROLLED_POLICY_UNDER_OBSERVATION"
              next_stage = "V100_FINAL_AUTONOMY_SYNTHESIS"

          if stabilization_status == "POLICY_STABILIZED":
              authority = "READY_FOR_FINAL_AUTONOMY_SYNTHESIS"

          elif stabilization_status == "ROLLBACK_READY":
              authority = "FINAL_SYNTHESIS_MUST_PRESERVE_ROLLBACK"

          elif stabilization_status in {
              "STABLE_OBSERVATION",
              "STABILIZATION_IN_PROGRESS"
          }:
              authority = "AUTONOMOUS_POLICY_USE_WITH_CONTINUED_MONITORING"

          else:
              authority = "AUTONOMOUS_LEARNING_ONLY"

          stabilization_cycle = previous_cycle + 1

          result = {
              "version": "V99",
              "generated_at": generated_at,
              "mode": "autonomous_policy_stabilization",

              "objective": (
                  "Stabilize the best validated correction policy through "
                  "measured evidence before the final V100 autonomy synthesis."
              ),

              "stabilization_cycle": stabilization_cycle,

              "decision_input": {
                  "source_version": "V98",
                  "decision": decision,
                  "arbitration_quality": arbitration_quality,
                  "arbitration_score": round(v98_score, 2),
                  "confidence": round(v98_confidence, 3),
                  "correction_id": correction_id,
                  "correction_name": correction_name
              },

              "live_evidence": {
                  "total_measured": total_measured,
                  "decisions_changed": decisions_changed,
                  "useful_changes": useful_changes,
                  "harmful_changes": harmful_changes,
                  "atypical_preserved": atypical_preserved,
                  "completed_excluded": completed_excluded,
                  "over_pruning": over_pruning,
                  "under_pruning": under_pruning,
                  "deployment_health": deployment_health
              },

              "historical_stability": {
                  "overall": round(v91_overall, 3),
                  "evidence": round(v91_evidence, 3),
                  "strategy": round(v91_strategy, 3)
              },

              "continuity": {
                  "previous_state": previous_state,
                  "previous_decision": previous_decision,
                  "previous_confidence": round(previous_confidence, 3),
                  "same_correction": same_correction,
                  "decision_consistent": decision_consistent,
                  "confidence_consistent": confidence_consistent
              },

              "stabilization": {
                  "evidence_quality": round(evidence_quality, 2),
                  "stability_score": round(stability_score, 2),
                  "status": stabilization_status,
                  "policy_state": policy_state,
                  "authority": authority
              },

              "autonomous_capabilities": {
                  "evidence_arbitration": True,
                  "policy_selection": True,
                  "policy_stability_evaluation": True,
                  "correction_retention_decision": decision == "RETAIN",
                  "rollback_readiness_detection": harmful_changes > 0,
                  "refinement_detection": (
                      stabilization_status == "POLICY_REQUIRES_REFINEMENT"
                      or stabilization_status == "REFINEMENT_REQUIRED"
                  ),
                  "human_override": True,
                  "permanent_self_modification": False
              },

              "policy": {
                  "baseline": "V90_BASELINE",
                  "controlled_correction": correction_id,
                  "controlled_policy_state": policy_state,
                  "permanent": False,
                  "rollback_available": True,
                  "automatic_external_action": False
              },

              "next_stage": {
                  "version": next_stage,
                  "purpose": (
                      "Synthesize the complete autonomous decision architecture "
                      "and determine the final V100 autonomy state."
                  )
              },

              "scope": {
                  "external_action": False,
                  "publication": False,
                  "contact": False,
                  "bidding": False,
                  "payments": False,
                  "gemini": False,
                  "project_cost_eur": 0
              },

              "safety": {
                  "zero_cost_constraint": True,
                  "gemini_disabled": True,
                  "baseline_preserved": True,
                  "rollback_available": True,
                  "no_irreversible_change": True,
                  "no_automatic_payment": True,
                  "no_automatic_bidding": True,
                  "no_automatic_dm": True
              }
          }

          json_path = MEMORY / "nox_v99_autonomous_policy_stabilization.json"
          md_path = MEMORY / "nox_v99_autonomous_policy_stabilization.md"

          json_path.write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          md = f"""# NØX Origin — V99 Autonomous Policy Stabilization

Generated: {generated_at}

## Decision inherited from V98

Decision: {decision}

Arbitration quality: {arbitration_quality}

V98 score: {v98_score:.2f}

V98 confidence: {v98_confidence:.3f}

Correction: {correction_id}

Correction name: {correction_name}

## Live evidence

Total measured: {total_measured}

Decisions changed: {decisions_changed}

Useful changes: {useful_changes}

Harmful changes: {harmful_changes}

Atypical opportunities preserved: {atypical_preserved}

Completed work excluded: {completed_excluded}

Over-pruning: {over_pruning}

Under-pruning: {under_pruning}

Deployment health: {deployment_health}

## Historical stability

Overall stability: {v91_overall:.3f}

Evidence stability: {v91_evidence:.3f}

Strategy stability: {v91_strategy:.3f}

## Stabilization

Cycle: {stabilization_cycle}

Evidence quality: {evidence_quality:.2f}

Stability score: {stability_score:.2f}

Status: {stabilization_status}

Policy state: {policy_state}

Authority: {authority}

## Autonomous continuity

Same correction as previous cycle: {same_correction}

Decision consistent with previous cycle: {decision_consistent}

Confidence consistent with previous cycle: {confidence_consistent}

## Interpretation

V99 does not create a new permanent rule.

It determines whether the controlled correction activated through V96 and
arbitrated by V98 is stable enough to become part of the final autonomous
decision architecture.

A harmful live regression keeps rollback available.

Over-pruning or under-pruning keeps the policy in refinement.

A stable validated policy progresses toward V100.

## Next stage

{next_stage}

## Autonomy

Evidence arbitration: ENABLED

Policy selection: ENABLED

Policy stability evaluation: ENABLED

Rollback readiness detection: ENABLED

Refinement detection: ENABLED

Permanent self-modification: DISABLED

Human override: ENABLED

## Scope

External action: DISABLED

Publication: DISABLED

Contact: DISABLED

Bidding: DISABLED

Payments: DISABLED

Gemini: DISABLED

Project cost: €0
"""

          md_path.write_text(md, encoding="utf-8")

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V99 stabilization result
        shell: bash
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v99_autonomous_policy_stabilization.json
          git add memory/nox_v99_autonomous_policy_stabilization.md

          git diff --cached --quiet || git commit -m "NØX V99 autonomous policy stabilization"

          git push
