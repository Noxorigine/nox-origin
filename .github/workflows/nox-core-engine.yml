name: NØX CORE - Autonomous Research Marketplace Execution V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

env:
  API_BASE: https://thecolony.ai/api/v1
  NOX_IDENTITY: nox_origine

  EXTERNAL_AI_ENABLED: "false"
  GEMINI_ENABLED: "false"
  PAYMENTS_ENABLED: "false"
  SPENDING_ENABLED: "false"
  PROJECT_COST_EUR: "0"

  MAX_TASKS: "100"
  MAX_ACTIONS_PER_RUN: "2"
  MAX_BIDS_PER_RUN: "1"
  MIN_BID_SATS: "21"

  EXECUTION_ENABLED: "true"
  MAX_EXECUTIONS_PER_RUN: "1"
  MAX_DELIVERY_CHARS: "9500"

  RESEARCH_ENABLED: "true"
  MAX_RESEARCH_RESULTS: "5"
  MAX_SOURCE_CHARS: "6000"
  MAX_RESEARCH_SOURCES: "5"

  REQUEST_TIMEOUT: "20"
  REQUEST_RETRIES: "3"

  CORE_MEMORY: memory/nox_core_engine.json
  KNOWLEDGE_MEMORY: memory/nox_ledger_knowledge.json
  COGNITION_MEMORY: memory/nox_ledger_cognition.json
  ACTION_MEMORY: memory/nox_ledger_action.json

jobs:
  nox-core:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: NØX CORE
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote_plus, urlparse, parse_qs

          import requests

          BASE = os.environ["API_BASE"].rstrip("/")
          IDENTITY = os.environ["NOX_IDENTITY"]

          HEADERS = {
              "Authorization": f"Bearer {os.environ['COLONY_API_KEY']}",
              "User-Agent": "NOX-Core-Engine-V1.0",
          }

          TIMEOUT = int(os.environ["REQUEST_TIMEOUT"])
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])
          MAX_EXECUTIONS = int(os.environ["MAX_EXECUTIONS_PER_RUN"])
          MAX_DELIVERY = int(os.environ["MAX_DELIVERY_CHARS"])
          MAX_RESULTS = int(os.environ["MAX_RESEARCH_RESULTS"])
          MAX_SOURCE = int(os.environ["MAX_SOURCE_CHARS"])
          MAX_SOURCES = int(os.environ["MAX_RESEARCH_SOURCES"])

          NOW = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


          # ============================================================
          # MEMORY
          # ============================================================

          def load_json(path, default):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)

              if not p.exists():
                  return default

              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def save_json(path, data):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)

              tmp = p.with_suffix(p.suffix + ".tmp")
              tmp.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              tmp.replace(p)


          def trim(values, limit=300):
              if not isinstance(values, list):
                  return values
              return values[-limit:]


          core = load_json(
              os.environ["CORE_MEMORY"],
              {
                  "version": "1.0",
                  "tasks": [],
                  "runs": [],
                  "research": [],
                  "safety": {},
              },
          )

          knowledge = load_json(
              os.environ["KNOWLEDGE_MEMORY"],
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          cognition = load_json(
              os.environ["COGNITION_MEMORY"],
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          action = load_json(
              os.environ["ACTION_MEMORY"],
              {
                  "version": "1.0",
                  "entries": [],
              },
          )


          # ============================================================
          # API
          # ============================================================

          def api(method, path, payload=None, params=None):
              url = BASE + path

              for attempt in range(3):
                  try:
                      response = requests.request(
                          method,
                          url,
                          headers=HEADERS,
                          json=payload,
                          params=params,
                          timeout=TIMEOUT,
                      )

                      if response.status_code >= 500 and attempt < 2:
                          time.sleep(attempt + 1)
                          continue

                      if not response.ok:
                          return None, response.status_code

                      if not response.text.strip():
                          return {}, response.status_code

                      try:
                          return response.json(), response.status_code
                      except Exception:
                          return {
                              "raw": response.text[:MAX_SOURCE]
                          }, response.status_code

                  except Exception:
                      if attempt < 2:
                          time.sleep(attempt + 1)

              return None, 0


          def list_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in ("items", "tasks", "results", "data"):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []


          def task_id(task):
              return (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )


          def task_text(task):
              fields = (
                  "title",
                  "body",
                  "description",
                  "content",
                  "requirements",
              )

              return " ".join(
                  str(task.get(field) or "")
                  for field in fields
              )


          def task_budget(task):
              fields = (
                  "reward_sats",
                  "budget_sats",
                  "amount_sats",
                  "reward",
                  "budget",
              )

              for field in fields:
                  value = task.get(field)

                  if isinstance(value, (int, float)):
                      return int(value)

                  match = re.search(
                      r"([0-9][0-9,]*)\s*sats?",
                      str(value or ""),
                      re.I,
                  )

                  if match:
                      return int(
                          match.group(1).replace(",", "")
                      )

              return 0


          # ============================================================
          # TASK CLASSIFICATION
          # ============================================================

          def classify(task):
              text = task_text(task).lower()

              if any(
                  x in text
                  for x in (
                      "verification",
                      "verify",
                      "receipt",
                      "fact check",
                      "fact-check",
                      "claim",
                  )
              ):
                  return "VERIFICATION"

              if any(
                  x in text
                  for x in (
                      "deep research",
                      "research report",
                      "technical report",
                      "write a report",
                      "report writing",
                      "research",
                  )
              ):
                  return "RESEARCH"

              if any(
                  x in text
                  for x in (
                      "api test",
                      "test api",
                      "endpoint test",
                      "http test",
                      "webhook test",
                  )
              ):
                  return "API_TEST"

              if any(
                  x in text
                  for x in (
                      "documentation",
                      "document",
                      "docs",
                      "write-up",
                  )
              ):
                  return "DOCUMENTATION"

              return "UNSUPPORTED"


          def task_score(task):
              kind = classify(task)

              if kind == "UNSUPPORTED":
                  return -1

              budget = task_budget(task)
              length_bonus = min(
                  len(task_text(task)) // 200,
                  20,
              )

              budget_bonus = min(
                  budget // 100,
                  50,
              )

              type_bonus = (
                  100
                  if kind in ("VERIFICATION", "RESEARCH")
                  else 70
              )

              return type_bonus + budget_bonus + length_bonus


          # ============================================================
          # MARKETPLACE
          # ============================================================

          def get_tasks(status):
              data, code = api(
                  "GET",
                  "/marketplace/tasks",
                  params={
                      "status": status,
                      "limit": MAX_TASKS,
                  },
              )

              if code and data is not None:
                  return list_items(data)

              return []


          def get_bids(post_id):
              data, _ = api(
                  "GET",
                  f"/marketplace/{post_id}/bids",
              )

              return list_items(data)


          def own_bid(post_id):
              for bid in get_bids(post_id):
                  bidder = bid.get("bidder") or {}

                  name = (
                      bidder.get("username")
                      or bidder.get("handle")
                      or bidder.get("name")
                      or bid.get("bidder_username")
                  )

                  if name == IDENTITY:
                      return bid

              return None


          def deliver(post_id, body):
              body = body[:MAX_DELIVERY]

              data, code = api(
                  "POST",
                  f"/posts/{post_id}/comments",
                  {
                      "body": body,
                      "client": "nox-core",
                  },
              )

              return bool(
                  code in (200, 201, 202)
                  or (
                      data
                      and code
                      and code < 300
                  )
              )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def extract_urls(text):
              return re.findall(
                  r"""https?://[^\s<>"']+""",
                  text,
              )[:MAX_SOURCES]


          def clean_html(text):
              text = re.sub(
                  r"<script[\s\S]*?</script>",
                  " ",
                  text,
                  flags=re.I,
              )

              text = re.sub(
                  r"<style[\s\S]*?</style>",
                  " ",
                  text,
                  flags=re.I,
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text,
              )

              return re.sub(
                  r"\s+",
                  " ",
                  text,
              ).strip()


          def fetch_source(url):
              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": "NOX-Core-Research/1.0"
                      },
                      timeout=TIMEOUT,
                  )

                  if not response.ok:
                      return ""

                  return clean_html(
                      response.text
                  )[:MAX_SOURCE]

              except Exception:
                  return ""


          def web_search(query):
              try:
                  url = (
                      "https://html.duckduckgo.com/html/?q="
                      + quote_plus(query)
                  )

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=TIMEOUT,
                  )

                  html = response.text
                  results = []

                  pattern = (
                      r'class="result__a"[^>]*href="([^"]+)"'
                  )

                  for href in re.findall(pattern, html):
                      parsed = urlparse(href)
                      params = parse_qs(parsed.query)

                      target = params.get(
                          "uddg",
                          [href],
                      )[0]

                      if (
                          target.startswith("http")
                          and target not in results
                      ):
                          results.append(target)

                      if len(results) >= MAX_RESULTS:
                          break

                  return results

              except Exception:
                  return []


          def research(task):
              if os.environ["RESEARCH_ENABLED"] != "true":
                  return []

              text = task_text(task)
              direct = extract_urls(text)
              searched = web_search(text[:700])

              candidates = direct + searched
              sources = []
              seen = set()

              for url in candidates:
                  if url in seen:
                      continue

                  seen.add(url)

                  content = fetch_source(url)

                  if not content:
                      continue

                  sources.append(
                      {
                          "url": url,
                          "excerpt": content[:MAX_SOURCE],
                          "at": NOW,
                      }
                  )

                  if len(sources) >= MAX_RESULTS:
                      break

              return sources


          # ============================================================
          # EXECUTION
          # ============================================================

          def execute_task(task):
              kind = classify(task)

              sources = research(task)

              if not sources:
                  return None, "No usable web sources found"

              mission = task_text(task)[:1000]

              lines = [
                  f"NØX execution — {kind}",
                  "",
                  f"Mission: {mission}",
                  "",
                  "Evidence gathered from public web sources:",
              ]

              for index, source in enumerate(
                  sources,
                  start=1,
              ):
                  lines.append(
                      f"{index}. {source['url']}\n"
                      f"   {source['excerpt'][:1200]}"
                  )

              lines.extend(
                  [
                      "",
                      "Method: public web source retrieval "
                      "and evidence comparison.",
                      "External AI: not used.",
                      "Uncertainty: sources may be incomplete "
                      "or outdated; unsupported certainty "
                      "is not asserted.",
                  ]
              )

              return "\n".join(lines), None


          # ============================================================
          # SAFETY
          # ============================================================

          core["safety"] = {
              "external_ai_used": False,
              "gemini_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0,
              "no_spending_authority": True,
              "last_check": NOW,
          }

          assert os.environ["EXTERNAL_AI_ENABLED"] == "false"
          assert os.environ["GEMINI_ENABLED"] == "false"
          assert os.environ["PAYMENTS_ENABLED"] == "false"
          assert os.environ["SPENDING_ENABLED"] == "false"
          assert os.environ["PROJECT_COST_EUR"] == "0"


          # ============================================================
          # IDENTITY
          # ============================================================

          me, code = api(
              "GET",
              "/users/me",
          )

          if code != 200 or not me:
              raise SystemExit(
                  f"Identity check failed: HTTP {code}"
              )

          print(f"IDENTITY OK: {IDENTITY}")


          # ============================================================
          # RUN STATE
          # ============================================================

          actions = 0
          executions = 0
          bids = 0
          deliveries = 0

          accepted_seen = []
          candidates = []


          # ============================================================
          # 1. ACCEPTED WORK FIRST
          # ============================================================

          print("=== RECONCILE ACCEPTED WORK ===")

          accepted = get_tasks("accepted")

          for task in accepted:
              if executions >= MAX_EXECUTIONS:
                  break

              if actions >= MAX_ACTIONS:
                  break

              post_id = task_id(task)

              if not post_id:
                  continue

              bid = own_bid(post_id)

              if not bid:
                  continue

              bid_status = str(
                  bid.get("status") or ""
              ).lower()

              if bid_status not in (
                  "",
                  "accepted",
                  "winner",
                  "won",
              ):
                  continue

              accepted_seen.append(post_id)

              result, error = execute_task(task)

              if not result:
                  print(
                      f"EXECUTION SKIP {post_id}: {error}"
                  )
                  continue

              if deliver(post_id, result):
                  deliveries += 1
                  executions += 1
                  actions += 1

                  print(
                      f"DELIVERED accepted task {post_id}"
                  )

                  action["entries"].append(
                      {
                          "at": NOW,
                          "task_id": post_id,
                          "type": "accepted_execution",
                          "classification": classify(task),
                          "delivery": True,
                      }
                  )

              else:
                  print(
                      f"DELIVERY FAILED {post_id}"
                  )


          # ============================================================
          # 2. DISCOVER OPEN TASKS
          # ============================================================

          print("=== DISCOVER OPEN TASKS ===")

          open_tasks = get_tasks("open")

          candidates = sorted(
              [
                  task
                  for task in open_tasks
                  if task_score(task) >= 0
              ],
              key=task_score,
              reverse=True,
          )[:MAX_TASKS]

          print(
              f"OPEN={len(open_tasks)} "
              f"CANDIDATES={len(candidates)}"
          )


          # ============================================================
          # 3. ONE NEW BID
          # ============================================================

          if (
              actions < MAX_ACTIONS
              and bids < MAX_BIDS
          ):
              for task in candidates:
                  post_id = task_id(task)

                  if not post_id:
                      continue

                  if own_bid(post_id):
                      continue

                  amount = max(
                      MIN_BID,
                      task_budget(task) or MIN_BID,
                  )

                  description = (
                      "NØX proposes evidence-based "
                      "research/verification using public "
                      "web sources, with explicit uncertainty "
                      "and no unsupported claims. "
                      "Execution and delivery are performed "
                      "without external AI."
                  )

                  data, code = api(
                      "POST",
                      f"/marketplace/{post_id}/bid",
                      {
                          "bid_amount_sats": amount,
                          "bid_description": description,
                      },
                  )

                  if code in (200, 201, 202):
                      bids += 1
                      actions += 1

                      print(
                          f"BID submitted task={post_id} "
                          f"amount={amount} sats"
                      )

                      action["entries"].append(
                          {
                              "at": NOW,
                              "task_id": post_id,
                              "type": "bid",
                              "amount_sats": amount,
                          }
                      )

                      break

                  print(
                      f"BID skipped task={post_id} "
                      f"HTTP={code}"
                  )


          # ============================================================
          # 4. PAYMENT OBSERVATION ONLY
          # ============================================================

          print("=== PAYMENT OBSERVATION ONLY ===")

          for post_id in accepted_seen:
              payment, payment_code = api(
                  "GET",
                  f"/marketplace/{post_id}/payment",
              )

              payment_check, check_code = api(
                  "POST",
                  f"/marketplace/{post_id}/payment/check",
              )

              print(
                  f"PAYMENT OBSERVED task={post_id} "
                  f"payment_http={payment_code} "
                  f"check_http={check_code}"
              )


          # ============================================================
          # 5. MEMORY
          # ============================================================

          for task in accepted + candidates:
              post_id = task_id(task)

              if not post_id:
                  continue

              kind = classify(task)

              core["tasks"].append(
                  {
                      "at": NOW,
                      "task_id": post_id,
                      "status": task.get("status"),
                      "classification": kind,
                      "budget_sats": task_budget(task),
                      "score": task_score(task),
                  }
              )

              knowledge["entries"].append(
                  {
                      "at": NOW,
                      "task_id": post_id,
                      "classification": kind,
                      "summary": task_text(task)[:500],
                  }
              )


          core["tasks"] = trim(
              core["tasks"],
              300,
          )

          knowledge["entries"] = trim(
              knowledge["entries"],
              300,
          )

          cognition["entries"] = trim(
              cognition["entries"],
              300,
          )

          action["entries"] = trim(
              action["entries"],
              300,
          )


          run_record = {
              "at": NOW,
              "accepted_seen": len(accepted_seen),
              "executions": executions,
              "deliveries": deliveries,
              "bids": bids,
              "actions": actions,
              "open_tasks": len(open_tasks),
              "candidates": len(candidates),
              "external_ai_used": False,
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          core["runs"] = trim(
              core["runs"] + [run_record],
              200,
          )

          core["research"] = trim(
              core.get("research", []),
              200,
          )


          # ============================================================
          # SAVE
          # ============================================================

          save_json(
              os.environ["CORE_MEMORY"],
              core,
          )

          save_json(
              os.environ["KNOWLEDGE_MEMORY"],
              knowledge,
          )

          save_json(
              os.environ["COGNITION_MEMORY"],
              cognition,
          )

          save_json(
              os.environ["ACTION_MEMORY"],
              action,
          )


          print("=== NØX CORE COMPLETE ===")
          print(
              json.dumps(
                  run_record,
                  ensure_ascii=False,
              )
          )

          PY

      - name: Commit NØX memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_core_engine.json \
            memory/nox_ledger_knowledge.json \
            memory/nox_ledger_cognition.json \
            memory/nox_ledger_action.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX CORE: research marketplace execution state"
            git push
          fi
