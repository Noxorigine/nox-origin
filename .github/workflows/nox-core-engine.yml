name: NØX CORE - Autonomous Research Marketplace Execution V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

env:
  API_BASE: https://thecolony.ai/api/v1
  NOX_IDENTITY: nox_origine

  EXTERNAL_AI_ENABLED: "false"
  GEMINI_ENABLED: "false"
  PAYMENTS_ENABLED: "false"
  SPENDING_ENABLED: "false"
  PROJECT_COST_EUR: "0"

  MAX_TASKS: "100"
  MAX_ACTIONS_PER_RUN: "2"
  MAX_BIDS_PER_RUN: "1"
  MIN_BID_SATS: "21"

  EXECUTION_ENABLED: "true"
  MAX_EXECUTIONS_PER_RUN: "1"
  MAX_DELIVERY_CHARS: "9500"

  RESEARCH_ENABLED: "true"
  MAX_RESEARCH_RESULTS: "5"
  MAX_SOURCE_CHARS: "6000"

  REQUEST_TIMEOUT: "20"

  CORE_MEMORY: memory/nox_core_engine.json
  KNOWLEDGE_MEMORY: memory/nox_ledger_knowledge.json
  COGNITION_MEMORY: memory/nox_ledger_cognition.json
  ACTION_MEMORY: memory/nox_ledger_action.json

jobs:
  nox-core:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: NØX CORE
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote_plus, urlparse, parse_qs

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"].strip()
          IDENTITY = os.environ["NOX_IDENTITY"]

          TIMEOUT = int(os.environ["REQUEST_TIMEOUT"])
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])
          MAX_EXEC = int(os.environ["MAX_EXECUTIONS_PER_RUN"])
          MAX_DELIVERY = int(os.environ["MAX_DELIVERY_CHARS"])
          MAX_RESULTS = int(os.environ["MAX_RESEARCH_RESULTS"])
          MAX_SOURCE = int(os.environ["MAX_SOURCE_CHARS"])

          NOW = time.strftime(
              "%Y-%m-%dT%H:%M:%SZ",
              time.gmtime(),
          )


          # ============================================================
          # SAFETY
          # ============================================================

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is empty")

          if os.environ["EXTERNAL_AI_ENABLED"] != "false":
              raise SystemExit("External AI must remain disabled")

          if os.environ["GEMINI_ENABLED"] != "false":
              raise SystemExit("Gemini must remain disabled")

          if os.environ["PAYMENTS_ENABLED"] != "false":
              raise SystemExit("Payments must remain disabled")

          if os.environ["SPENDING_ENABLED"] != "false":
              raise SystemExit("Spending must remain disabled")

          if os.environ["PROJECT_COST_EUR"] != "0":
              raise SystemExit("Project cost must remain 0 EUR")


          # ============================================================
          # MEMORY
          # ============================================================

          def load(path, default):
              p = Path(path)
              p.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              if not p.exists():
                  return default

              try:
                  return json.loads(
                      p.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return default


          def save(path, data):
              p = Path(path)
              p.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              tmp = p.with_suffix(
                  p.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              tmp.replace(p)


          def trim(items, limit=300):
              if not isinstance(items, list):
                  return []

              return items[-limit:]


          core = load(
              os.environ["CORE_MEMORY"],
              {
                  "version": "1.1",
                  "tasks": [],
                  "runs": [],
                  "research": [],
                  "safety": {},
              },
          )

          knowledge = load(
              os.environ["KNOWLEDGE_MEMORY"],
              {
                  "version": "1.1",
                  "entries": [],
              },
          )

          cognition = load(
              os.environ["COGNITION_MEMORY"],
              {
                  "version": "1.1",
                  "entries": [],
              },
          )

          action = load(
              os.environ["ACTION_MEMORY"],
              {
                  "version": "1.1",
                  "entries": [],
              },
          )


          # ============================================================
          # HTTP SESSION + JWT AUTHENTICATION
          # ============================================================

          session = requests.Session()

          session.headers.update(
              {
                  "User-Agent": "NOX-Core-Engine-V1.1",
              }
          )


          def auth_token():
              response = session.post(
                  f"{BASE}/auth/token",
                  json={
                      "api_key": API_KEY,
                  },
                  timeout=TIMEOUT,
              )

              if not response.ok:
                  raise SystemExit(
                      "Authentication exchange failed: "
                      f"HTTP {response.status_code} "
                      f"{response.text[:300]}"
                  )

              data = response.json()

              token = data.get(
                  "access_token"
              )

              if not token:
                  raise SystemExit(
                      "Authentication exchange returned "
                      "no access_token"
                  )

              return token


          TOKEN = auth_token()


          def request(
              method,
              path,
              payload=None,
              params=None,
              retry_auth=True,
          ):
              global TOKEN

              headers = {
                  "Authorization": (
                      f"Bearer {TOKEN}"
                  )
              }

              for attempt in range(3):
                  try:
                      response = session.request(
                          method,
                          BASE + path,
                          headers=headers,
                          json=payload,
                          params=params,
                          timeout=TIMEOUT,
                      )

                      if (
                          response.status_code == 401
                          and retry_auth
                      ):
                          TOKEN = auth_token()

                          return request(
                              method,
                              path,
                              payload,
                              params,
                              False,
                          )

                      if (
                          response.status_code >= 500
                          and attempt < 2
                      ):
                          time.sleep(
                              attempt + 1
                          )
                          continue

                      try:
                          data = response.json()
                      except Exception:
                          data = {
                              "raw": response.text[:1000]
                          }

                      return (
                          data,
                          response.status_code,
                      )

                  except requests.RequestException:
                      if attempt == 2:
                          return None, 0

                      time.sleep(
                          attempt + 1
                      )

              return None, 0


          # ============================================================
          # IDENTITY
          # ============================================================

          me, code = request(
              "GET",
              "/users/me",
          )

          if code != 200 or not me:
              raise SystemExit(
                  f"Identity check failed: HTTP {code}"
              )

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
          )

          if (
              username
              and username != IDENTITY
          ):
              raise SystemExit(
                  "Identity mismatch: "
                  f"expected {IDENTITY}, "
                  f"got {username}"
              )

          print(
              f"IDENTITY OK: {IDENTITY}"
          )


          # ============================================================
          # GENERIC HELPERS
          # ============================================================

          def items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "tasks",
                      "results",
                      "data",
                  ):
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []


          def task_id(task):
              return (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )


          def task_text(task):
              return " ".join(
                  str(task.get(key) or "")
                  for key in (
                      "title",
                      "body",
                      "description",
                      "content",
                      "requirements",
                  )
              ).strip()


          def task_budget(task):
              for key in (
                  "reward_sats",
                  "budget_sats",
                  "amount_sats",
                  "reward",
                  "budget",
              ):
                  value = task.get(key)

                  if isinstance(
                      value,
                      (int, float),
                  ):
                      return int(value)

                  match = re.search(
                      r"([0-9][0-9,]*)\s*sats?",
                      str(value or ""),
                      re.I,
                  )

                  if match:
                      return int(
                          match.group(1)
                          .replace(",", "")
                      )

              match = re.search(
                  r"([0-9][0-9,]*)\s*sats?",
                  task_text(task),
                  re.I,
              )

              if match:
                  return int(
                      match.group(1)
                      .replace(",", "")
                  )

              return 0


          # ============================================================
          # TASK CLASSIFICATION
          # ============================================================

          def classify(task):
              text = task_text(
                  task
              ).lower()

              if any(
                  value in text
                  for value in (
                      "verification",
                      "verify",
                      "receipt",
                      "fact check",
                      "fact-check",
                      "claim",
                  )
              ):
                  return "VERIFICATION"

              if any(
                  value in text
                  for value in (
                      "deep research",
                      "research report",
                      "technical report",
                      "write a report",
                      "report writing",
                      "research",
                  )
              ):
                  return "RESEARCH"

              if any(
                  value in text
                  for value in (
                      "api test",
                      "test api",
                      "endpoint test",
                      "http test",
                      "webhook test",
                  )
              ):
                  return "API_TEST"

              if any(
                  value in text
                  for value in (
                      "documentation",
                      "document",
                      "docs",
                      "write-up",
                  )
              ):
                  return "DOCUMENTATION"

              return "UNSUPPORTED"


          def score(task):
              kind = classify(task)

              if kind == "UNSUPPORTED":
                  return -1

              type_score = (
                  100
                  if kind in (
                      "VERIFICATION",
                      "RESEARCH",
                  )
                  else 70
              )

              budget_score = min(
                  task_budget(task) // 100,
                  50,
              )

              length_score = min(
                  len(task_text(task)) // 200,
                  20,
              )

              return (
                  type_score
                  + budget_score
                  + length_score
              )


          # ============================================================
          # MARKETPLACE
          # ============================================================

          def get_tasks(status):
              data, code = request(
                  "GET",
                  "/marketplace/tasks",
                  params={
                      "status": status,
                      "limit": MAX_TASKS,
                  },
              )

              if code != 200:
                  return []

              return items(data)


          def get_bids(post_id):
              data, code = request(
                  "GET",
                  f"/marketplace/{post_id}/bids",
              )

              if code != 200:
                  return []

              return items(data)


          def own_bid(post_id):
              for bid in get_bids(post_id):
                  bidder = (
                      bid.get("bidder")
                      or {}
                  )

                  name = (
                      bidder.get("username")
                      or bidder.get("handle")
                      or bidder.get("name")
                      or bid.get(
                          "bidder_username"
                      )
                  )

                  if name == IDENTITY:
                      return bid

              return None


          def deliver(post_id, body):
              data, code = request(
                  "POST",
                  f"/posts/{post_id}/comments",
                  {
                      "body": body[
                          :MAX_DELIVERY
                      ],
                      "client": "nox-core",
                  },
              )

              return (
                  200 <= code < 300
              )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def fetch_source(url):
              try:
                  response = session.get(
                      url,
                      headers={
                          "User-Agent":
                              "NØX-Core-Research/1.1"
                      },
                      timeout=TIMEOUT,
                  )

                  if not response.ok:
                      return ""

                  text = re.sub(
                      r"<script[\s\S]*?</script>"
                      r"|<style[\s\S]*?</style>"
                      r"|<[^>]+>",
                      " ",
                      response.text,
                      flags=re.I,
                  )

                  return re.sub(
                      r"\s+",
                      " ",
                      text,
                  ).strip()[:MAX_SOURCE]

              except requests.RequestException:
                  return ""


          def research(task):
              if (
                  os.environ[
                      "RESEARCH_ENABLED"
                  ]
                  != "true"
              ):
                  return []

              text = task_text(task)

              urls = re.findall(
                  r"""https?://[^\s<>"']+""",
                  text,
              )

              try:
                  search_url = (
                      "https://html.duckduckgo.com/html/"
                      "?q="
                      + quote_plus(text[:700])
                  )

                  response = session.get(
                      search_url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0"
                      },
                      timeout=TIMEOUT,
                  )

                  for href in re.findall(
                      r'class="result__a"'
                      r'[^>]*href="([^"]+)"',
                      response.text,
                  ):
                      parsed = urlparse(
                          href
                      )

                      target = parse_qs(
                          parsed.query
                      ).get(
                          "uddg",
                          [href],
                      )[0]

                      if target.startswith(
                          "http"
                      ):
                          urls.append(target)

                      if (
                          len(urls)
                          >= MAX_RESULTS
                      ):
                          break

              except requests.RequestException:
                  pass

              sources = []
              seen = set()

              for url in urls:
                  if url in seen:
                      continue

                  seen.add(url)

                  excerpt = fetch_source(
                      url
                  )

                  if not excerpt:
                      continue

                  sources.append(
                      {
                          "url": url,
                          "excerpt": excerpt,
                          "at": NOW,
                      }
                  )

                  if (
                      len(sources)
                      >= MAX_RESULTS
                  ):
                      break

              return sources


          # ============================================================
          # TASK EXECUTION
          # ============================================================

          def execute(task):
              sources = research(
                  task
              )

              if not sources:
                  return None

              lines = [
                  (
                      "NØX execution — "
                      f"{classify(task)}"
                  ),
                  "",
                  (
                      "Mission: "
                      f"{task_text(task)[:1200]}"
                  ),
                  "",
                  (
                      "Evidence gathered from "
                      "public web sources:"
                  ),
              ]

              for index, source in enumerate(
                  sources,
                  start=1,
              ):
                  lines.append(
                      f"{index}. "
                      f"{source['url']}\n"
                      f"   "
                      f"{source['excerpt'][:1200]}"
                  )

              lines.extend(
                  [
                      "",
                      (
                          "Method: public web "
                          "retrieval and evidence "
                          "comparison."
                      ),
                      "External AI: not used.",
                      (
                          "Uncertainty: sources may "
                          "be incomplete or outdated."
                      ),
                  ]
              )

              return "\n".join(
                  lines
              )


          # ============================================================
          # SAFETY STATE
          # ============================================================

          core["safety"] = {
              "external_ai_used": False,
              "gemini_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0,
              "no_spending_authority": True,
              "last_check": NOW,
          }


          # ============================================================
          # RUN STATE
          # ============================================================

          actions = 0
          executions = 0
          bids = 0
          deliveries = 0

          accepted_seen = []
          open_tasks = []
          candidates = []


          # ============================================================
          # 1. ACCEPTED WORK FIRST
          # ============================================================

          print(
              "=== RECONCILE ACCEPTED WORK ==="
          )

          accepted = get_tasks(
              "accepted"
          )

          for task in accepted:

              if (
                  executions >= MAX_EXEC
                  or actions >= MAX_ACTIONS
              ):
                  break

              post_id = task_id(
                  task
              )

              if not post_id:
                  continue

              bid = own_bid(
                  post_id
              )

              if not bid:
                  continue

              bid_status = str(
                  bid.get("status") or ""
              ).lower()

              if bid_status not in (
                  "",
                  "accepted",
                  "winner",
                  "won",
              ):
                  continue

              accepted_seen.append(
                  post_id
              )

              if (
                  os.environ[
                      "EXECUTION_ENABLED"
                  ]
                  != "true"
              ):
                  print(
                      f"EXECUTION DISABLED "
                      f"{post_id}"
                  )
                  continue

              result = execute(
                  task
              )

              if not result:
                  print(
                      f"NO RESEARCH RESULT "
                      f"{post_id}"
                  )
                  continue

              if deliver(
                  post_id,
                  result,
              ):
                  executions += 1
                  deliveries += 1
                  actions += 1

                  action[
                      "entries"
                  ].append(
                      {
                          "at": NOW,
                          "task_id": post_id,
                          "type":
                              "accepted_execution",
                          "classification":
                              classify(task),
                      }
                  )

                  print(
                      "DELIVERED accepted "
                      f"task {post_id}"
                  )

              else:
                  print(
                      "DELIVERY FAILED "
                      f"{post_id}"
                  )


          # ============================================================
          # 2. DISCOVER OPEN TASKS
          # ============================================================

          print(
              "=== DISCOVER OPEN TASKS ==="
          )

          open_tasks = get_tasks(
              "open"
          )

          candidates = sorted(
              [
                  task
                  for task in open_tasks
                  if score(task) >= 0
              ],
              key=score,
              reverse=True,
          )[:MAX_TASKS]

          print(
              f"OPEN={len(open_tasks)} "
              f"CANDIDATES={len(candidates)}"
          )


          # ============================================================
          # 3. ONE NEW BID
          # ============================================================

          if (
              actions < MAX_ACTIONS
              and bids < MAX_BIDS
          ):

              for task in candidates:

                  post_id = task_id(
                      task
                  )

                  if not post_id:
                      continue

                  if own_bid(post_id):
                      continue

                  amount = max(
                      MIN_BID,
                      task_budget(task)
                      or MIN_BID,
                  )

                  description = (
                      "NØX proposes "
                      "evidence-based "
                      "research/verification "
                      "using public web sources, "
                      "with explicit uncertainty "
                      "and no external AI."
                  )

                  data, code = request(
                      "POST",
                      (
                          f"/marketplace/"
                          f"{post_id}/bid"
                      ),
                      {
                          "bid_amount_sats":
                              amount,
                          "bid_description":
                              description,
                      },
                  )

                  if 200 <= code < 300:

                      bids += 1
                      actions += 1

                      action[
                          "entries"
                      ].append(
                          {
                              "at": NOW,
                              "task_id":
                                  post_id,
                              "type": "bid",
                              "amount_sats":
                                  amount,
                          }
                      )

                      print(
                          "BID submitted "
                          f"task={post_id} "
                          f"amount={amount}"
                      )

                      break

                  print(
                      "BID skipped "
                      f"task={post_id} "
                      f"HTTP={code}"
                  )


          # ============================================================
          # 4. PAYMENT OBSERVATION ONLY
          # ============================================================

          print(
              "=== PAYMENT OBSERVATION ONLY ==="
          )

          for post_id in accepted_seen:

              payment, payment_code = request(
                  "GET",
                  (
                      f"/marketplace/"
                      f"{post_id}/payment"
                  ),
              )

              payment_check, check_code = request(
                  "POST",
                  (
                      f"/marketplace/"
                      f"{post_id}/payment/check"
                  ),
              )

              print(
                  f"PAYMENT OBSERVED "
                  f"task={post_id} "
                  f"payment_http={payment_code} "
                  f"check_http={check_code}"
              )


          # ============================================================
          # 5. MEMORY
          # ============================================================

          for task in (
              accepted + candidates
          ):

              post_id = task_id(
                  task
              )

              if not post_id:
                  continue

              kind = classify(
                  task
              )

              core[
                  "tasks"
              ].append(
                  {
                      "at": NOW,
                      "task_id": post_id,
                      "status":
                          task.get("status"),
                      "classification":
                          kind,
                      "budget_sats":
                          task_budget(task),
                      "score":
                          score(task),
                  }
              )

              knowledge[
                  "entries"
              ].append(
                  {
                      "at": NOW,
                      "task_id": post_id,
                      "classification":
                          kind,
                      "summary":
                          task_text(task)[:500],
                  }
              )


          action["entries"] = trim(
              action["entries"]
          )

          knowledge["entries"] = trim(
              knowledge["entries"]
          )

          cognition["entries"] = trim(
              cognition["entries"]
          )

          core["tasks"] = trim(
              core["tasks"]
          )

          core["research"] = trim(
              core.get(
                  "research",
                  [],
              )
          )


          # ============================================================
          # RUN RECORD
          # ============================================================

          run = {
              "at": NOW,
              "accepted_seen":
                  len(accepted_seen),
              "executions":
                  executions,
              "deliveries":
                  deliveries,
              "bids":
                  bids,
              "actions":
                  actions,
              "open_tasks":
                  len(open_tasks),
              "candidates":
                  len(candidates),
              "external_ai_used":
                  False,
              "gemini_used":
                  False,
              "project_cost_eur":
                  0,
          }

          core["runs"] = trim(
              core["runs"] + [run],
              200,
          )


          # ============================================================
          # SAVE
          # ============================================================

          save(
              os.environ["CORE_MEMORY"],
              core,
          )

          save(
              os.environ["KNOWLEDGE_MEMORY"],
              knowledge,
          )

          save(
              os.environ["COGNITION_MEMORY"],
              cognition,
          )

          save(
              os.environ["ACTION_MEMORY"],
              action,
          )


          # ============================================================
          # FINAL LOG
          # ============================================================

          print(
              "=== NØX CORE COMPLETE ==="
          )

          print(
              json.dumps(
                  run,
                  ensure_ascii=False,
              )
          )

          PY

      - name: Commit NØX memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_core_engine.json \
            memory/nox_ledger_knowledge.json \
            memory/nox_ledger_cognition.json \
            memory/nox_ledger_action.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit \
              -m "NØX CORE: research marketplace execution state"
            git push
          fi
