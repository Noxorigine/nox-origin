name: NØX CORE - Autonomous Research Marketplace Execution V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  nox-core:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      EXTERNAL_AI_ENABLED: "false"
      GEMINI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_ACTIONS_PER_RUN: "2"
      MAX_BIDS_PER_RUN: "1"
      MIN_BID_SATS: "21"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "1"
      MAX_DELIVERY_CHARS: "9500"

      RESEARCH_ENABLED: "true"
      MAX_RESEARCH_RESULTS: "5"
      MAX_SOURCE_CHARS: "6000"
      MAX_RESEARCH_SOURCES: "5"

      MAX_MEMORY_ITEMS: "1000"
      HTTP_TIMEOUT: "20"
      HTTP_RETRIES: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NØX CORE
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote_plus

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          IDENTITY = os.environ["NOX_IDENTITY"]
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])
          MAX_EXECUTIONS = int(os.environ["MAX_EXECUTIONS_PER_RUN"])
          MAX_DELIVERY = int(os.environ["MAX_DELIVERY_CHARS"])
          MAX_RESULTS = int(os.environ["MAX_RESEARCH_RESULTS"])
          MAX_SOURCE_CHARS = int(os.environ["MAX_SOURCE_CHARS"])
          MAX_SOURCES = int(os.environ["MAX_RESEARCH_SOURCES"])
          MAX_MEMORY = int(os.environ["MAX_MEMORY_ITEMS"])
          TIMEOUT = int(os.environ["HTTP_TIMEOUT"])
          RETRIES = int(os.environ["HTTP_RETRIES"])

          NOW = datetime.now(timezone.utc).isoformat()

          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          CORE_FILE = MEMORY / "nox_core_engine.json"
          KNOWLEDGE_FILE = MEMORY / "nox_ledger_knowledge.json"
          COGNITION_FILE = MEMORY / "nox_ledger_cognition.json"
          ACTION_FILE = MEMORY / "nox_ledger_action.json"


          # ============================================================
          # LOG
          # ============================================================

          def log(message):
              print(message, flush=True)


          log("============================================================")
          log("NØX CORE ENGINE V1.1")
          log("ACCEPTED WORK FIRST")
          log("RECONCILE -> EXECUTE -> DELIVER -> VERIFY")
          log("-> PAYMENT CHECK -> DISCOVER -> BID")
          log("============================================================")
          log("External AI: DISABLED")
          log("Gemini: DISABLED")
          log("Payments: DISABLED")
          log("Spending: DISABLED")
          log("Project cost: €0")
          log("")


          # ============================================================
          # SAFETY
          # ============================================================

          if os.environ["EXTERNAL_AI_ENABLED"].lower() != "false":
              raise RuntimeError("External AI must remain disabled")

          if os.environ["GEMINI_ENABLED"].lower() != "false":
              raise RuntimeError("Gemini must remain disabled")

          if os.environ["PAYMENTS_ENABLED"].lower() != "false":
              raise RuntimeError("Payments must remain disabled")

          if os.environ["SPENDING_ENABLED"].lower() != "false":
              raise RuntimeError("Spending must remain disabled")


          # ============================================================
          # MEMORY
          # ============================================================

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  log(f"MEMORY WARNING {path}: {exc}")
                  return default


          def save(path, data):
              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              tmp.replace(path)


          core = load(
              CORE_FILE,
              {
                  "version": "1.1",
                  "identity": IDENTITY,
                  "tasks": [],
                  "actions": [],
                  "observations": [],
                  "lessons": [],
                  "failures": [],
                  "research": [],
                  "runs": [],
                  "stats": {},
              },
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          cognition = load(
              COGNITION_FILE,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          action_memory = load(
              ACTION_FILE,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )


          for key in [
              "tasks",
              "actions",
              "observations",
              "lessons",
              "failures",
              "research",
              "runs",
          ]:
              if not isinstance(core.get(key), list):
                  core[key] = []

          for obj in [
              knowledge,
              cognition,
              action_memory,
          ]:
              if not isinstance(obj.get("entries"), list):
                  obj["entries"] = []


          def add_memory(key, value):
              core[key].append(value)
              core[key] = core[key][-MAX_MEMORY:]


          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update(
              {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Core-Engine-V1.0",
              }
          )

          if API_KEY:
              session.headers["Authorization"] = (
                  f"Bearer {API_KEY}"
              )


          def api(
              method,
              path,
              params=None,
              payload=None,
              headers=None,
          ):
              url = path

              if not path.startswith("http"):
                  url = f"{API_BASE}{path}"

              last_error = None

              for attempt in range(1, RETRIES + 1):
                  try:
                      response = session.request(
                          method,
                          url,
                          params=params,
                          json=payload,
                          headers=headers,
                          timeout=TIMEOUT,
                      )

                      if response.ok:
                          if not response.content:
                              return {}

                          try:
                              return response.json()
                          except Exception:
                              return {
                                  "raw": response.text
                              }

                      last_error = RuntimeError(
                          f"{method} {url} -> "
                          f"{response.status_code}: "
                          f"{response.text[:400]}"
                      )

                  except Exception as exc:
                      last_error = exc

                  if attempt < RETRIES:
                      time.sleep(attempt)

              raise last_error


          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def get_id(task):
              if not isinstance(task, dict):
                  return ""

              for key in (
                  "id",
                  "post_id",
                  "task_id",
              ):
                  if task.get(key) is not None:
                      return str(task[key])

              return ""


          def text(task):
              if not isinstance(task, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "name",
                  "body",
                  "description",
                  "details",
                  "requirements",
                  "deliverable",
              ):
                  value = task.get(key)

                  if value:
                      parts.append(str(value))

              return "\n".join(parts).strip()


          def budget(task):
              if not isinstance(task, dict):
                  return 0

              values = []

              for key in (
                  "reward_sats",
                  "budget_sats",
                  "amount_sats",
                  "price_sats",
                  "reward",
                  "budget",
                  "amount",
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      values.append(int(value))

                  elif isinstance(value, str):
                      for number in re.findall(
                          r"\d[\d,\s]*",
                          value,
                      ):
                          clean = re.sub(
                              r"[^\d]",
                              "",
                              number,
                          )

                          if clean:
                              values.append(int(clean))

              return max(values) if values else 0


          def classify(task):
              value = text(task).lower()

              if any(
                  x in value
                  for x in (
                      "verification",
                      "verify",
                      "receipt",
                      "proof",
                      "fact check",
                      "fact-check",
                      "validate",
                      "claim",
                  )
              ):
                  return "VERIFICATION"

              if any(
                  x in value
                  for x in (
                      "api test",
                      "test api",
                      "endpoint test",
                      "http test",
                      "webhook test",
                  )
              ):
                  return "API_TEST"

              if any(
                  x in value
                  for x in (
                      "deep research",
                      "research report",
                      "technical research",
                      "market research",
                      "research",
                      "investigate",
                      "investigation",
                  )
              ):
                  return "RESEARCH"

              if any(
                  x in value
                  for x in (
                      "documentation",
                      "document",
                      "readme",
                      "write a report",
                      "report writing",
                      "technical report",
                  )
              ):
                  return "DOCUMENTATION"

              return "UNSUPPORTED"


          def score(task):
              kind = classify(task)

              if kind == "UNSUPPORTED":
                  return 0

              value = text(task).lower()

              result = 50

              if kind == "VERIFICATION":
                  result += 15

              elif kind == "RESEARCH":
                  result += 12

              elif kind == "DOCUMENTATION":
                  result += 8

              elif kind == "API_TEST":
                  result += 5

              if "receipt" in value:
                  result += 10

              if "evidence" in value:
                  result += 5

              if "source" in value:
                  result += 5

              return min(result, 100)


          # ============================================================
          # MARKETPLACE
          # ============================================================

          def tasks(status=None):
              params = {
                  "limit": MAX_TASKS
              }

              if status:
                  params["status"] = status

              data = api(
                  "GET",
                  "/marketplace/tasks",
                  params=params,
              )

              if isinstance(data, list):
                  return data

              for key in (
                  "tasks",
                  "items",
                  "results",
                  "data",
              ):
                  if isinstance(data.get(key), list):
                      return data[key]

              return []


          def post(post_id):
              return api(
                  "GET",
                  f"/posts/{post_id}",
              )


          def bids(post_id):
              data = api(
                  "GET",
                  f"/marketplace/{post_id}/bids",
              )

              if isinstance(data, list):
                  return data

              for key in (
                  "bids",
                  "items",
                  "results",
                  "data",
              ):
                  if isinstance(data.get(key), list):
                      return data[key]

              return []


          def bidder_name(bid):
              bidder = bid.get("bidder")

              if isinstance(bidder, dict):
                  for key in (
                      "username",
                      "handle",
                      "name",
                      "agent_id",
                      "id",
                  ):
                      if bidder.get(key) is not None:
                          return str(bidder[key])

              for key in (
                  "bidder_username",
                  "bidder_handle",
                  "username",
                  "agent_id",
                  "bidder_id",
              ):
                  if bid.get(key) is not None:
                      return str(bid[key])

              return ""


          def own_bid(post_id):
              for bid in bids(post_id):
                  if (
                      bidder_name(bid).lower()
                      == IDENTITY.lower()
                  ):
                      return bid

              return None


          def payment(post_id):
              try:
                  return api(
                      "GET",
                      f"/marketplace/{post_id}/payment",
                  )
              except Exception as exc:
                  return {
                      "error": str(exc)
                  }


          def payment_check(post_id):
              try:
                  return api(
                      "POST",
                      f"/marketplace/{post_id}/payment/check",
                  )
              except Exception as exc:
                  return {
                      "error": str(exc)
                  }


          def deliver(post_id, body):
              digest = hashlib.sha256(
                  body.encode("utf-8")
              ).hexdigest()[:20]

              headers = {
                  "Idempotency-Key":
                      f"nox-delivery-{post_id}-{digest}"
              }

              return api(
                  "POST",
                  f"/posts/{post_id}/comments",
                  payload={
                      "body": body,
                      "client": "nox-core-v1.1",
                  },
                  headers=headers,
              )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def urls(value):
              found = re.findall(
                  r"https?://[^\s<>\"]+",
                  value or "",
              )

              result = []

              for url in found:
                  url = url.rstrip(
                      ".,);]}>"
                  )

                  if url not in result:
                      result.append(url)

              return result[:MAX_SOURCES]


          def clean_html(value):
              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S,
              )

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S,
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value,
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value,
              ).strip()


          def fetch(url):
              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              "NOX-Core-Engine-V1.0"
                      },
                      timeout=TIMEOUT,
                  )

                  body = response.text

                  if "html" in response.headers.get(
                      "content-type",
                      "",
                  ).lower():
                      body = clean_html(body)

                  return {
                      "url": url,
                      "status": response.status_code,
                      "text": body[:MAX_SOURCE_CHARS],
                  }

              except Exception as exc:
                  return {
                      "url": url,
                      "status": None,
                      "text": "",
                      "error": str(exc),
                  }


          def search_web(query):
              try:
                  response = requests.get(
                      "https://html.duckduckgo.com/html/",
                      params={"q": query},
                      headers={
                          "User-Agent":
                              "NOX-Core-Engine-V1.0"
                      },
                      timeout=TIMEOUT,
                  )

                  found = re.findall(
                      r'nuddg="([^"]+)"',
                      response.text,
                  )

                  result = []

                  for url in found:
                      if url not in result:
                          result.append(url)

                  return result[:MAX_RESULTS]

              except Exception as exc:
                  log(
                      f"WEB SEARCH WARNING: {exc}"
                  )
                  return []


          def research(task):
              query = text(task)
              sources = []

              for url in urls(query):
                  result = fetch(url)

                  if result.get("status") is not None:
                      sources.append(result)

              if len(sources) < MAX_RESULTS:
                  search_query = (
                      task.get("title")
                      or query[:400]
                  )

                  for url in search_web(
                      str(search_query)
                  ):
                      if len(sources) >= MAX_RESULTS:
                          break

                      if any(
                          item["url"] == url
                          for item in sources
                      ):
                          continue

                      result = fetch(url)

                      if result.get("status") is not None:
                          sources.append(result)

              compact = []

              for item in sources:
                  compact.append({
                      "url": item["url"],
                      "status": item["status"],
                      "excerpt": item.get(
                          "text",
                          "",
                      )[:1200],
                  })

              record = {
                  "timestamp": NOW,
                  "task_id": get_id(task),
                  "query": str(
                      task.get("title")
                      or query[:300]
                  ),
                  "sources": compact,
                  "external_ai_used": False,
                  "gemini_used": False,
              }

              core["research"].append(record)

              return compact


          # ============================================================
          # EXECUTION
          # ============================================================

          def execute(task):
              kind = classify(task)

              if kind == "UNSUPPORTED":
                  return None

              sources = research(task)

              if kind == "VERIFICATION":
                  if sources:
                      summary = (
                          f"{len(sources)} source(s) "
                          "were collected for the claim. "
                          "Evidence is presented below "
                          "without fabricated certainty."
                      )
                  else:
                      summary = (
                          "No independently accessible "
                          "source was obtained. "
                          "Verification remains inconclusive."
                      )

              elif kind == "API_TEST":
                  summary = (
                      f"{len(sources)} accessible "
                      "source/endpoint result(s) collected."
                  )

              elif kind == "DOCUMENTATION":
                  summary = (
                      f"{len(sources)} source(s) "
                      "collected for documentation."
                  )

              else:
                  summary = (
                      f"{len(sources)} source(s) "
                      "collected during research."
                  )

              lines = [
                  "NØX — DELIVERY",
                  "",
                  f"Mission: {task.get('title', '')}",
                  f"Type: {kind}",
                  "",
                  "Result:",
                  summary,
                  "",
              ]

              if sources:
                  lines.append("Sources:")

                  for index, source in enumerate(
                      sources,
                      1,
                  ):
                      lines.append(
                          f"{index}. {source['url']}"
                      )
                      lines.append(
                          f"   HTTP: {source['status']}"
                      )

                      excerpt = re.sub(
                          r"\s+",
                          " ",
                          source.get(
                              "excerpt",
                              "",
                          ),
                      )

                      if excerpt:
                          lines.append(
                              "   Evidence: "
                              + excerpt[:800]
                          )

              lines.extend([
                  "",
                  "Method:",
                  "Direct web research only.",
                  "No Gemini.",
                  "No external AI.",
                  "No spending.",
                  "No payment creation.",
                  "",
                  "NØX / nox_origine",
                  "nox-core-v1.1",
              ])

              return "\n".join(lines)[
                  :MAX_DELIVERY
              ]


          # ============================================================
          # IDENTITY
          # ============================================================

          log("=== VERIFY IDENTITY ===")

          me = api(
              "GET",
              "/users/me",
          )

          log(
              "Identity response received."
          )


          # ============================================================
          # ACCEPTED WORK FIRST
          # ============================================================

          log("")
          log("=== RECONCILE ACCEPTED WORK ===")

          accepted = tasks("accepted")

          log(
              f"ACCEPTED TASKS: {len(accepted)}"
          )

          executions = 0
          deliveries = 0
          payment_observations = 0
          actions = 0

          for task in accepted:

              if executions >= MAX_EXECUTIONS:
                  break

              post_id = get_id(task)

              if not post_id:
                  continue

              bid = own_bid(post_id)

              if not bid:
                  continue

              status = str(
                  bid.get("status", "")
              ).lower()

              if status not in {
                  "",
                  "accepted",
                  "winner",
                  "won",
              }:
                  continue

              kind = classify(task)

              if kind == "UNSUPPORTED":
                  add_memory(
                      "failures",
                      {
                          "timestamp": NOW,
                          "task_id": post_id,
                          "failure":
                              "Accepted task unsupported",
                      },
                  )
                  continue

              executions += 1

              log(
                  f"EXECUTING ACCEPTED: {post_id}"
              )

              try:
                  delivery_body = execute(task)

                  if not delivery_body:
                      continue

                  deliver(
                      post_id,
                      delivery_body,
                  )

                  deliveries += 1
                  actions += 1

                  add_memory(
                      "actions",
                      {
                          "timestamp": NOW,
                          "action":
                              "execute_and_deliver",
                          "task_id": post_id,
                          "type": kind,
                          "success": True,
                      },
                  )

                  log(
                      f"DELIVERED: {post_id}"
                  )

              except Exception as exc:
                  add_memory(
                      "failures",
                      {
                          "timestamp": NOW,
                          "task_id": post_id,
                          "failure": str(exc),
                      },
                  )

                  log(
                      f"ACCEPTED EXECUTION ERROR: "
                      f"{post_id}: {exc}"
                  )

              payment_data = payment_check(
                  post_id
              )

              if payment_data and not payment_data.get(
                  "error"
              ):
                  payment_observations += 1

                  add_memory(
                      "observations",
                      {
                          "timestamp": NOW,
                          "task_id": post_id,
                          "type": "payment_check",
                          "data": payment_data,
                      },
                  )


          # ============================================================
          # DISCOVERY ONLY AFTER ACCEPTED WORK
          # ============================================================

          log("")
          log("=== DISCOVER OPEN TASKS ===")

          open_tasks = tasks("open")

          log(
              f"OPEN TASKS: {len(open_tasks)}"
          )

          candidates = []

          for task in open_tasks[:MAX_TASKS]:

              post_id = get_id(task)

              if not post_id:
                  continue

              kind = classify(task)

              if kind == "UNSUPPORTED":
                  continue

              value = score(task)

              if value < 55:
                  continue

              candidates.append(
                  {
                      "score": value,
                      "budget": budget(task),
                      "task": task,
                  }
              )

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["budget"],
              ),
              reverse=True,
          )

          log(
              f"FEASIBLE CANDIDATES: "
              f"{len(candidates)}"
          )


          # ============================================================
          # ONE BID
          # ============================================================

          log("")
          log("=== BID ===")

          bids_sent = 0

          for candidate in candidates:

              if bids_sent >= MAX_BIDS:
                  break

              if actions >= MAX_ACTIONS:
                  break

              task = candidate["task"]
              post_id = get_id(task)

              try:
                  existing = own_bid(post_id)
              except Exception as exc:
                  log(
                      f"BID LOOKUP ERROR {post_id}: "
                      f"{exc}"
                  )
                  continue

              if existing:
                  continue

              amount = max(
                  MIN_BID,
                  candidate["budget"]
                  or MIN_BID,
              )

              description = (
                  "NØX can execute this mission through "
                  "direct web research, evidence gathering, "
                  "source comparison and structured delivery. "
                  "No external AI or Gemini is used. "
                  "No spending authority is required."
              )

              digest = hashlib.sha256(
                  (
                      f"{post_id}:"
                      f"{amount}:"
                      f"{IDENTITY}"
                  ).encode()
              ).hexdigest()[:20]

              headers = {
                  "Idempotency-Key":
                      f"nox-bid-{post_id}-{digest}"
              }

              try:
                  response = api(
                      "POST",
                      f"/marketplace/{post_id}/bid",
                      payload={
                          "bid_amount_sats": int(amount),
                          "bid_description": description,
                      },
                      headers=headers,
                  )

                  bids_sent += 1
                  actions += 1

                  add_memory(
                      "actions",
                      {
                          "timestamp": NOW,
                          "action": "submit_bid",
                          "task_id": post_id,
                          "amount_sats": amount,
                          "response": response,
                      },
                  )

                  log(
                      f"BID SUBMITTED: "
                      f"{post_id} / {amount} sats"
                  )

              except Exception as exc:
                  add_memory(
                      "failures",
                      {
                          "timestamp": NOW,
                          "task_id": post_id,
                          "failure":
                              f"Bid failed: {exc}",
                      },
                  )

                  log(
                      f"BID ERROR: {post_id}: {exc}"
                  )

              break


          # ============================================================
          # OBSERVE PAYMENTS
          # ============================================================

          log("")
          log("=== PAYMENT OBSERVATION ===")

          observed_ids = set()

          for task in accepted:
              post_id = get_id(task)

              if not post_id:
                  continue

              if post_id in observed_ids:
                  continue

              observed_ids.add(post_id)

              try:
                  data = payment(post_id)

                  if data and not data.get("error"):
                      payment_observations += 1

                      add_memory(
                          "observations",
                          {
                              "timestamp": NOW,
                              "task_id": post_id,
                              "type":
                                  "payment_observation",
                              "data": data,
                          },
                      )

              except Exception as exc:
                  log(
                      f"PAYMENT OBSERVATION ERROR: "
                      f"{post_id}: {exc}"
                  )


          # ============================================================
          # LEARNING
          # ============================================================

          if accepted:
              lesson = (
                  "Accepted work is reconciled before "
                  "new task discovery."
              )

              add_memory(
                  "lessons",
                  {
                      "timestamp": NOW,
                      "lesson": lesson,
                  },
              )

              cognition["entries"].append({
                  "timestamp": NOW,
                  "type": "priority",
                  "lesson": lesson,
              })

          if candidates:
              knowledge["entries"].append({
                  "timestamp": NOW,
                  "type": "marketplace_discovery",
                  "candidates": len(candidates),
              })

          action_memory["entries"].append({
              "timestamp": NOW,
              "accepted_first": True,
              "executions": executions,
              "deliveries": deliveries,
              "bids": bids_sent,
          })


          # ============================================================
          # RUN RECORD
          # ============================================================

          core["runs"].append({
              "timestamp": NOW,
              "workflow":
                  "NØX CORE - Autonomous Research "
                  "Marketplace Execution V1.1",
              "accepted_first": True,
              "accepted_tasks": len(accepted),
              "open_tasks": len(open_tasks),
              "candidates": len(candidates),
              "executions": executions,
              "deliveries": deliveries,
              "bids": bids_sent,
              "payment_observations":
                  payment_observations,
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0,
              "status": "completed",
          })

          core["runs"] = core["runs"][-MAX_MEMORY:]


          # ============================================================
          # STATS
          # ============================================================

          stats = core.setdefault(
              "stats",
              {},
          )

          stats["last_run"] = NOW
          stats["total_runs"] = len(
              core["runs"]
          )

          stats["total_bids"] = (
              stats.get("total_bids", 0)
              + bids_sent
          )

          stats["total_executions"] = (
              stats.get("total_executions", 0)
              + executions
          )

          stats["total_deliveries"] = (
              stats.get("total_deliveries", 0)
              + deliveries
          )

          stats["gemini_used"] = False
          stats["external_ai_used"] = False
          stats["project_cost_eur"] = 0


          # ============================================================
          # SAFETY STATE
          # ============================================================

          core["version"] = "1.1"
          core["identity"] = IDENTITY

          core["safety"] = {
              "external_ai_enabled": False,
              "gemini_enabled": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0
