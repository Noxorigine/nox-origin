name: NØX CORE - Autonomous Research Marketplace Execution V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  nox-core:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      # ============================================================
      # HARD SAFETY / COST CONSTRAINTS
      # ============================================================

      EXTERNAL_AI_ENABLED: "false"
      GEMINI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # ============================================================
      # DISCOVERY
      # ============================================================

      MAX_TASKS: "100"
      MAX_ACTIONS_PER_RUN: "2"
      MAX_BIDS_PER_RUN: "1"

      # 21 sats is the Colony technical bid floor.
      # It is NOT an economic minimum.
      MIN_BID_SATS: "21"

      # ============================================================
      # EXECUTION
      # ============================================================

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "1"
      MAX_DELIVERY_CHARS: "9500"

      # ============================================================
      # RESEARCH
      # ============================================================

      RESEARCH_ENABLED: "true"
      MAX_RESEARCH_RESULTS: "5"
      MAX_SOURCE_CHARS: "6000"
      MAX_RESEARCH_SOURCES: "5"

      # ============================================================
      # MEMORY
      # ============================================================

      MAX_KNOWLEDGE: "500"
      MAX_ACTIONS: "500"
      MAX_OBSERVATIONS: "500"
      MAX_LESSONS: "300"
      MAX_FAILURES: "300"
      MAX_TASK_HISTORY: "500"

      HTTP_TIMEOUT_SECONDS: "20"
      MAX_RETRIES: "3"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # CORE ENGINE
      # ============================================================

      - name: NØX CORE engine
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from html import unescape
          from urllib.parse import quote, urlparse

          import requests

          # ==========================================================
          # CONFIG
          # ==========================================================

          API = os.environ["API_BASE"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]
          IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])

          MIN_BID = int(os.environ["MIN_BID_SATS"])

          EXECUTION_ENABLED = (
              os.environ["EXECUTION_ENABLED"].lower() == "true"
          )

          MAX_EXECUTIONS = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )

          MAX_DELIVERY = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          RESEARCH_ENABLED = (
              os.environ["RESEARCH_ENABLED"].lower() == "true"
          )

          MAX_RESEARCH_RESULTS = int(
              os.environ["MAX_RESEARCH_RESULTS"]
          )

          MAX_SOURCE_CHARS = int(
              os.environ["MAX_SOURCE_CHARS"]
          )

          MAX_RESEARCH_SOURCES = int(
              os.environ["MAX_RESEARCH_SOURCES"]
          )

          TIMEOUT = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )

          MAX_RETRIES = int(
              os.environ["MAX_RETRIES"]
          )

          MEMORY_DIR = "memory"

          CORE_FILE = os.path.join(
              MEMORY_DIR,
              "nox_core_engine.json"
          )

          KNOWLEDGE_FILE = os.path.join(
              MEMORY_DIR,
              "nox_ledger_knowledge.json"
          )

          COGNITION_FILE = os.path.join(
              MEMORY_DIR,
              "nox_ledger_cognition.json"
          )

          ACTION_FILE = os.path.join(
              MEMORY_DIR,
              "nox_ledger_action.json"
          )

          MARKET_FILE = os.path.join(
              MEMORY_DIR,
              "nox_ledger_marketplace.json"
          )

          os.makedirs(
              MEMORY_DIR,
              exist_ok=True
          )

          # ==========================================================
          # UTILITIES
          # ==========================================================

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def load(path, default):
              try:
                  with open(
                      path,
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception:
                  return default

          def save(path, data):
              temporary = path + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )

          def text(value):
              if isinstance(
                  value,
                  (dict, list)
              ):
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )

              if value is None:
                  return ""

              return str(value)

          def compact(
              value,
              limit=5000
          ):
              value = re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()

              return value[:limit]

          def integer(
              value,
              default=0
          ):
              try:
                  return int(
                      float(
                          str(value)
                          .replace(",", "")
                      )
                  )
              except Exception:
                  return default

          def fingerprint(value):
              return hashlib.sha256(
                  compact(
                      value,
                      20000
                  ).lower().encode(
                      "utf-8",
                      errors="ignore"
                  )
              ).hexdigest()

          # ==========================================================
          # LOAD MEMORY
          # ==========================================================

          core = load(
              CORE_FILE,
              {}
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          cognition = load(
              COGNITION_FILE,
              {}
          )

          action_memory = load(
              ACTION_FILE,
              {}
          )

          marketplace = load(
              MARKET_FILE,
              {}
          )

          if not isinstance(core, dict):
              core = {}

          if not isinstance(knowledge, dict):
              knowledge = {}

          if not isinstance(cognition, dict):
              cognition = {}

          if not isinstance(action_memory, dict):
              action_memory = {}

          if not isinstance(marketplace, dict):
              marketplace = {}

          core.setdefault(
              "version",
              "1.0"
          )

          core.setdefault(
              "tasks",
              []
          )

          core.setdefault(
              "actions",
              []
          )

          core.setdefault(
              "observations",
              []
          )

          core.setdefault(
              "lessons",
              []
          )

          core.setdefault(
              "failures",
              []
          )

          core.setdefault(
              "research",
              []
          )

          core.setdefault(
              "earnings",
              []
          )

          core.setdefault(
              "stats",
              {}
          )

          # ==========================================================
          # LOG
          # ==========================================================

          print("")
          print(
              "============================================================"
          )
          print(
              "NØX CORE ENGINE V1.1"
          )
          print(
              "ACCEPTED WORK FIRST"
          )
          print(
              "RECONCILE -> EXECUTE -> DELIVER -> VERIFY"
          )
          print(
              "-> PAYMENT CHECK -> DISCOVER -> BID"
          )
          print(
              "============================================================"
          )

          print(
              "External AI: DISABLED"
          )

          print(
              "Gemini: DISABLED"
          )

          print(
              "Payments: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )

          print(
              "Project cost: €0"
          )

          # ==========================================================
          # HTTP SESSION
          # ==========================================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "NOX-Core-Engine-V1.0",
          })

          def api_get(
              path,
              params=None
          ):
              return session.get(
                  API + path,
                  params=params,
                  timeout=TIMEOUT
              )

          def api_post(
              path,
              payload=None,
              headers=None
          ):
              return session.post(
                  API + path,
                  json=payload or {},
                  headers=headers or {},
                  timeout=TIMEOUT
              )

          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          print("")
          print("=== AUTHENTICATION ===")

          auth = api_post(
              "/auth/token",
              {
                  "api_key": KEY
              }
          )

          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "Authentication succeeded without JWT."
              )

          session.headers[
              "Authorization"
          ] = f"Bearer {token}"

          print(
              "JWT obtained: YES"
          )

          # ==========================================================
          # IDENTITY
          # ==========================================================

          me = api_get(
              "/users/me"
          )

          me.raise_for_status()

          me_data = me.json()

          identity_values = {
              str(
                  me_data.get(key)
              ).strip().lower()
              for key in (
                  "username",
                  "handle",
                  "agent_id",
                  "agentId",
                  "id",
                  "name",
              )
              if me_data.get(key) is not None
          }

          if (
              IDENTITY.lower()
              not in identity_values
          ):
              raise RuntimeError(
                  "Identity mismatch."
              )

          print(
              f"IDENTITY: {IDENTITY}"
          )

          # ==========================================================
          # CAPABILITIES
          # ==========================================================

          capabilities = {
              "research": (
                  "research",
                  "web research",
                  "deep research",
                  "fact checking",
                  "source verification",
                  "investigate",
                  "analysis",
                  "audit",
                  "verification",
              ),
              "api_test": (
                  "api",
                  "endpoint",
                  "http",
                  "https",
                  "webhook",
                  "rest",
                  "json",
                  "api test",
                  "smoke test",
              ),
              "python": (
                  "python",
                  "script",
                  "automation",
                  "automate",
              ),
              "coding": (
                  "code",
                  "coding",
                  "programming",
                  "developer",
                  "software",
                  "implementation",
              ),
              "testing": (
                  "test",
                  "testing",
                  "qa",
                  "debug",
                  "bug",
                  "validation",
              ),
              "documentation": (
                  "documentation",
                  "document",
                  "report",
                  "write a report",
                  "report writing",
                  "readme",
              ),
              "data": (
                  "data",
                  "dataset",
                  "spreadsheet",
                  "csv",
                  "json",
                  "data analysis",
              ),
              "github": (
                  "github",
                  "repository",
                  "repo",
                  "pull request",
                  "issue",
                  "workflow",
              ),
              "agent_tooling": (
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "ai agent",
                  "agent tool",
              ),
          }

          BLOCKED = (
              "ransomware",
              "malware",
              "credential theft",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos",
              "explosive",
              "weapon",
              "financial fraud",
              "money laundering",
          )

          HUMAN_ONLY = (
              "in person",
              "physical delivery",
              "visit my house",
              "meet in person",
              "on-site physical",
          )

          def task_text(task):
              fields = (
                  "title",
                  "name",
                  "body",
                  "description",
                  "details",
                  "requirements",
                  "deliverable",
                  "tags",
                  "metadata",
              )

              return compact(
                  " ".join(
                      text(task.get(field))
                      for field in fields
                      if (
                          isinstance(task, dict)
                          and task.get(field) is not None
                      )
                  ),
                  20000
              )

          def capabilities_for(value):
              lowered = value.lower()

              return [
                  group
                  for group, terms in capabilities.items()
                  if any(
                      term in lowered
                      for term in terms
                  )
              ]

          def blocked(value):
              lowered = value.lower()

              return (
                  any(
                      term in lowered
                      for term in BLOCKED
                  )
                  or any(
                      term in lowered
                      for term in HUMAN_ONLY
                  )
              )

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in (
                  "id",
                  "task_id",
                  "taskId",
                  "post_id",
                  "postId",
              ):
                  if task.get(key) is not None:
                      return str(task[key])

              return None

          def budget(task):
              metadata = task.get(
                  "metadata",
                  {}
              )

              if not isinstance(
                  metadata,
                  dict
              ):
                  metadata = {}

              low = (
                  task.get("budget_min_sats")
                  or task.get("reward_low")
                  or metadata.get("budget_min_sats")
                  or metadata.get("reward_low")
                  or 0
              )

              high = (
                  task.get("budget_max_sats")
                  or task.get("reward_high")
                  or metadata.get("budget_max_sats")
                  or metadata.get("reward_high")
                  or 0
              )

              low = integer(low)
              high = integer(high)

              values = [
                  integer(value)
                  for value in re.findall(
                      r"(?<!\d)(\d[\d,]*)\s*"
                      r"(?:sats?|sat|satoshi)\b",
                      task_text(task),
                      re.I
                  )
              ]

              if not low and values:
                  low = min(values)

              if not high and values:
                  high = max(values)

              return (
                  max(0, low),
                  max(0, high)
              )

          # ==========================================================
          # TASK CLASSIFICATION
          # ==========================================================

          def classify_task(task):
              content = task_text(task)
              lowered = content.lower()

              if blocked(content):
                  return "BLOCKED"

              if any(
                  term in lowered
                  for term in (
                      "verify",
                      "verification",
                      "fact check",
                      "fact-check",
                      "audit",
                      "validate",
                      "validation",
                      "receipt",
                      "proof",
                  )
              ):
                  return "VERIFICATION"

              if any(
                  term in lowered
                  for term in (
                      "api smoke",
                      "api test",
                      "endpoint test",
                      "http test",
                      "webhook test",
                      "health check",
              )):
                  return "API_TEST"

              if any(
                  term in lowered
                  for term in (
                      "research",
                      "research report",
                      "deep research",
                      "market research",
                      "technical research",
                      "source verification",
                      "investigate",
                      "analysis",
                      "audit report",
              )):
                  return "RESEARCH"

              if any(
                  term in lowered
                  for term in (
                      "documentation",
                      "documentation",
                      "readme",
                      "write a report",
                      "report writing",
              )):
                  return "DOCUMENTATION"

              if any(
                  term in lowered
                  for term in (
                      "python",
                      "script",
                      "automation",
                      "api client",
                      "connector",
              )):
                  return "PYTHON"

              if any(
                  term in lowered
                  for term in (
                      "code",
                      "coding",
                      "software",
                      "developer",
                      "programming",
              )):
                  return "CODING"

              return "UNSUPPORTED"

          # ==========================================================
          # FEASIBILITY
          # ==========================================================

          def feasibility(
              task,
              matches,
              task_type
          ):
              if task_type in (
                  "BLOCKED",
                  "UNSUPPORTED",
              ):
                  return 0

              score = 50

              score += min(
                  25,
                  len(matches) * 5
              )

              if task_type in (
                  "VERIFICATION",
                  "API_TEST",
                  "RESEARCH",
                  "DOCUMENTATION",
              ):
                  score += 15

              low, high = budget(task)

              if low or high:
                  score += 5

              if (
                  high
                  and high < MIN_BID
              ):
                  return 0

              return min(
                  100,
                  score
              )

          # ==========================================================
          # RESEARCH ENGINE
          # ==========================================================

          def extract_urls(value):
              urls = re.findall(
                  r"https?://[^\s<>\"]+",
                  value
              )

              clean = []

              for url in urls:
                  url = url.rstrip(
                      ".,);]}>"
                  )

                  if url not in clean:
                      clean.append(url)

              return clean[:MAX_RESEARCH_SOURCES]

          def html_text(html):
              html = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  html,
                  flags=re.I | re.S
              )

              html = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  html,
                  flags=re.I | re.S
              )

              html = re.sub(
                  r"<[^>]+>",
                  " ",
                  html
              )

              html = unescape(html)

              return compact(
                  html,
                  MAX_SOURCE_CHARS
              )

          def fetch_url(url):
              try:
                  started = time.time()

                  response = requests.get(
                      url,
                      timeout=TIMEOUT,
                      headers={
                          "User-Agent":
                              "NOX-Core-Engine-V1.0"
                      },
                      allow_redirects=True
                  )

                  latency = int(
                      (time.time() - started) * 1000
                  )

                  body = ""

                  content_type = (
                      response.headers.get(
                          "content-type",
                          ""
                      ).lower()
                  )

                  if (
                      "text" in content_type
                      or "json" in content_type
                      or "xml" in content_type
                      or not content_type
                  ):
                      body = html_text(
                          response.text
                      )

                  return {
                      "url": url,
                      "final_url":
                          response.url,
                      "domain":
                          urlparse(
                              response.url
                          ).netloc,
                      "status":
                          response.status_code,
                      "latency_ms":
                          latency,
                      "content_type":
                          content_type,
                      "excerpt":
                          body,
                      "ok":
                          200 <= response.status_code < 400,
                  }

              except Exception as exc:
                  return {
                      "url": url,
                      "status": None,
                      "ok": False,
                      "error": compact(
                          str(exc),
                          500
                      ),
                  }

          def ddg_search(query):
              if not RESEARCH_ENABLED:
                  return []

              try:
                  response = requests.get(
                      "https://html.duckduckgo.com/html/",
                      params={
                          "q": query
                      },
                      timeout=TIMEOUT,
                      headers={
                          "User-Agent":
                              "NOX-Core-Engine-V1.0"
                      }
                  )

                  if response.status_code >= 400:
                      return []

                  html = response.text

                  results = []

                  pattern = re.compile(
                      r'class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)</a>',
                      re.I | re.S
                  )

                  for match in pattern.finditer(
                      html
                  ):
                      url = unescape(
                          match.group(1)
                      )

                      title = re.sub(
                          r"<[^>]+>",
                          "",
                          unescape(
                              match.group(2)
                          )
                      )

                      if url.startswith(
                          "//"
                      ):
                          url = "https:" + url

                      if not url.startswith(
                          "http"
                      ):
                          continue

                      item = {
                          "title":
                              compact(
                                  title,
                                  300
                              ),
                          "url":
                              url,
                      }

                      if item not in results:
                          results.append(
                              item
                          )

                      if (
                          len(results)
                          >= MAX_RESEARCH_RESULTS
                      ):
                          break

                  return results

              except Exception:
                  return []

          def research_task(task):
              content = task_text(task)

              urls = extract_urls(
                  content
              )

              sources = []

              # Direct task URLs first.
              for url in urls
