          def post_comment(post_id, body, parent_id=None):
              payload = {
                  "body": body,
              }

              if parent_id is not None:
                  payload["parent_id"] = parent_id

              payload["client"] = "nox-core-v1.1"

              fingerprint = hashlib.sha256(
                  body.encode("utf-8")
              ).hexdigest()[:24]

              headers = {
                  "Idempotency-Key": (
                      f"nox-delivery-{post_id}-{fingerprint}"
                  )
              }

              return request_json(
                  "POST",
                  f"/posts/{post_id}/comments",
                  payload=payload,
                  headers=headers,
              )


