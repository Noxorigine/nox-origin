name: NØX CORE - Autonomous Research Marketplace Execution V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  nox-core:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      EXTERNAL_AI_ENABLED: "false"
      GEMINI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_ACTIONS_PER_RUN: "2"
      MAX_BIDS_PER_RUN: "1"
      MIN_BID_SATS: "21"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "1"
      MAX_DELIVERY_CHARS: "9500"

      RESEARCH_ENABLED: "true"
      MAX_RESEARCH_RESULTS: "5"
      MAX_SOURCE_CHARS: "6000"
      MAX_RESEARCH_SOURCES: "5"

      MAX_MEMORY_TASKS: "1000"
      MAX_MEMORY_ACTIONS: "1000"
      MAX_MEMORY_OBSERVATIONS: "1000"
      MAX_MEMORY_LESSONS: "1000"
      MAX_MEMORY_FAILURES: "1000"
      MAX_MEMORY_RESEARCH: "1000"
      MAX_MEMORY_RUNS: "500"

      HTTP_TIMEOUT: "20"
      HTTP_RETRIES: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NØX CORE
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import hashlib
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote_plus, urlparse

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          IDENTITY = os.environ["NOX_IDENTITY"]

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          EXTERNAL_AI_ENABLED = os.environ.get(
              "EXTERNAL_AI_ENABLED", "false"
          ).lower() == "true"

          GEMINI_ENABLED = os.environ.get(
              "GEMINI_ENABLED", "false"
          ).lower() == "true"

          PAYMENTS_ENABLED = os.environ.get(
              "PAYMENTS_ENABLED", "false"
          ).lower() == "true"

          SPENDING_ENABLED = os.environ.get(
              "SPENDING_ENABLED", "false"
          ).lower() == "true"

          PROJECT_COST_EUR = 0

          MAX_TASKS = int(os.environ.get("MAX_TASKS", "100"))
          MAX_ACTIONS_PER_RUN = int(
              os.environ.get("MAX_ACTIONS_PER_RUN", "2")
          )
          MAX_BIDS_PER_RUN = int(
              os.environ.get("MAX_BIDS_PER_RUN", "1")
          )
          MIN_BID_SATS = int(
              os.environ.get("MIN_BID_SATS", "21")
          )

          EXECUTION_ENABLED = os.environ.get(
              "EXECUTION_ENABLED", "true"
          ).lower() == "true"

          MAX_EXECUTIONS_PER_RUN = int(
              os.environ.get("MAX_EXECUTIONS_PER_RUN", "1")
          )

          MAX_DELIVERY_CHARS = int(
              os.environ.get("MAX_DELIVERY_CHARS", "9500")
          )

          RESEARCH_ENABLED = os.environ.get(
              "RESEARCH_ENABLED", "true"
          ).lower() == "true"

          MAX_RESEARCH_RESULTS = int(
              os.environ.get("MAX_RESEARCH_RESULTS", "5")
          )

          MAX_SOURCE_CHARS = int(
              os.environ.get("MAX_SOURCE_CHARS", "6000")
          )

          MAX_RESEARCH_SOURCES = int(
              os.environ.get("MAX_RESEARCH_SOURCES", "5")
          )

          MAX_MEMORY_TASKS = int(
              os.environ.get("MAX_MEMORY_TASKS", "1000")
          )
          MAX_MEMORY_ACTIONS = int(
              os.environ.get("MAX_MEMORY_ACTIONS", "1000")
          )
          MAX_MEMORY_OBSERVATIONS = int(
              os.environ.get("MAX_MEMORY_OBSERVATIONS", "1000")
          )
          MAX_MEMORY_LESSONS = int(
              os.environ.get("MAX_MEMORY_LESSONS", "1000")
          )
          MAX_MEMORY_FAILURES = int(
              os.environ.get("MAX_MEMORY_FAILURES", "1000")
          )
          MAX_MEMORY_RESEARCH = int(
              os.environ.get("MAX_MEMORY_RESEARCH", "1000")
          )
          MAX_MEMORY_RUNS = int(
              os.environ.get("MAX_MEMORY_RUNS", "500")
          )

          HTTP_TIMEOUT = int(
              os.environ.get("HTTP_TIMEOUT", "20")
          )

          HTTP_RETRIES = int(
              os.environ.get("HTTP_RETRIES", "3")
          )

          NOW = datetime.now(timezone.utc).isoformat()

          MEMORY_DIR = Path("memory")
          CORE_FILE = MEMORY_DIR / "nox_core.json"
          LEDGER_01 = MEMORY_DIR / "ledger_01_knowledge_research.json"
          LEDGER_02 = MEMORY_DIR / "ledger_02_cognition_communication.json"
          LEDGER_03 = MEMORY_DIR / "ledger_03_action_observation_learning.json"


          # ============================================================
          # LOGGING
          # ============================================================

          def log(message):
              print(message, flush=True)


          log("=== NØX CORE V1.1 ===")
          log(f"TIME: {NOW}")
          log(f"IDENTITY: {IDENTITY}")
          log(f"API: {API_BASE}")
          log(f"EXTERNAL_AI_ENABLED: {EXTERNAL_AI_ENABLED}")
          log(f"GEMINI_ENABLED: {GEMINI_ENABLED}")
          log(f"PAYMENTS_ENABLED: {PAYMENTS_ENABLED}")
          log(f"SPENDING_ENABLED: {SPENDING_ENABLED}")
          log(f"PROJECT_COST_EUR: {PROJECT_COST_EUR}")
          log("")


          # ============================================================
          # SAFETY ASSERTIONS
          # ============================================================

          if EXTERNAL_AI_ENABLED:
              raise RuntimeError(
                  "External AI must remain disabled."
              )

          if GEMINI_ENABLED:
              raise RuntimeError(
                  "Gemini must remain disabled."
              )

          if PAYMENTS_ENABLED:
              raise RuntimeError(
                  "Payment creation must remain disabled."
              )

          if SPENDING_ENABLED:
              raise RuntimeError(
                  "Spending must remain disabled."
              )

          if PROJECT_COST_EUR != 0:
              raise RuntimeError(
                  "Project cost must remain zero."
              )


          # ============================================================
          # MEMORY
          # ============================================================

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as handle:
                      data = json.load(handle)

                  return data

              except Exception as exc:
                  log(
                      f"MEMORY LOAD WARNING: {path}: {exc}"
                  )
                  return default


          core = load_json(
              CORE_FILE,
              {
                  "version": "1.0",
                  "identity": IDENTITY,
                  "tasks": [],
                  "actions": [],
                  "observations": [],
                  "lessons": [],
                  "failures": [],
                  "research": [],
                  "runs": [],
                  "stats": {},
              },
          )

          ledger_01 = load_json(
              LEDGER_01,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          ledger_02 = load_json(
              LEDGER_02,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )

          ledger_03 = load_json(
              LEDGER_03,
              {
                  "version": "1.0",
                  "entries": [],
              },
          )


          def ensure_list(container, key):
              value = container.get(key)

              if not isinstance(value, list):
                  container[key] = []

              return container[key]


          for key in [
              "tasks",
              "actions",
              "observations",
              "lessons",
              "failures",
              "research",
              "runs",
          ]:
              ensure_list(core, key)

          ensure_list(ledger_01, "entries")
          ensure_list(ledger_02, "entries")
          ensure_list(ledger_03, "entries")


          # ============================================================
          # MEMORY HELPERS
          # ============================================================

          def trim_memory():
              limits = {
                  "tasks": MAX_MEMORY_TASKS,
                  "actions": MAX_MEMORY_ACTIONS,
                  "observations": MAX_MEMORY_OBSERVATIONS,
                  "lessons": MAX_MEMORY_LESSONS,
                  "failures": MAX_MEMORY_FAILURES,
                  "research": MAX_MEMORY_RESEARCH,
                  "runs": MAX_MEMORY_RUNS,
              }

              for key, limit in limits.items():
                  values = core.get(key, [])

                  if len(values) > limit:
                      core[key] = values[-limit:]


          def save_json(path, data):
              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=False,
                  )

              temporary.replace(path)


          def remember_task(task, extra=None):
              item = {
                  "timestamp": NOW,
                  "task_id": task_id(task),
                  "post_id": task_id(task),
                  "title": task.get("title", ""),
                  "status": task.get("status", ""),
                  "task_type": classify_task(task),
                  "budget": task_budget(task),
                  "source": "marketplace",
              }

              if extra:
                  item.update(extra)

              core["tasks"].append(item)


          def remember_action(action, task=None, result=None):
              item = {
                  "timestamp": NOW,
                  "action": action,
                  "actor": IDENTITY,
              }

              if task is not None:
                  item["task_id"] = task_id(task)

              if result is not None:
                  item["result"] = result

              core["actions"].append(item)


          def remember_observation(observation, task=None):
              item = {
                  "timestamp": NOW,
                  "observation": observation,
              }

              if task is not None:
                  item["task_id"] = task_id(task)

              core["observations"].append(item)


          def remember_lesson(lesson, task=None):
              item = {
                  "timestamp": NOW,
                  "lesson": lesson,
              }

              if task is not None:
                  item["task_id"] = task_id(task)

              core["lessons"].append(item)


          def remember_failure(failure, task=None):
              item = {
                  "timestamp": NOW,
                  "failure": failure,
              }

              if task is not None:
                  item["task_id"] = task_id(task)

              core["failures"].append(item)


          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update(
              {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Core-Engine-V1.0",
              }
          )

          if API_KEY:
              session.headers.update(
                  {
                      "Authorization": f"Bearer {API_KEY}",
                  }
              )


          def request(
              method,
              path,
              *,
              params=None,
              payload=None,
              headers=None,
              allow_status=None,
          ):
              url = (
                  path
                  if path.startswith("http")
                  else f"{API_BASE}{path}"
              )

              last_error = None

              for attempt in range(1, HTTP_RETRIES + 1):
                  try:
                      response = session.request(
                          method,
                          url,
                          params=params,
                          json=payload,
                          headers=headers,
                          timeout=HTTP_TIMEOUT,
                      )

                      if allow_status and response.status_code in allow_status:
                          return response

                      if response.ok:
                          return response

                      last_error = RuntimeError(
                          f"{method} {url} -> "
                          f"{response.status_code}: "
                          f"{response.text[:500]}"
                      )

                  except Exception as exc:
                      last_error = exc

                  if attempt < HTTP_RETRIES:
                      time.sleep(attempt)

              raise last_error or RuntimeError(
                  f"Request failed: {method} {url}"
              )


          def request_json(
              method,
              path,
              *,
              params=None,
              payload=None,
              headers=None,
              allow_status=None,
          ):
              response = request(
                  method,
                  path,
                  params=params,
                  payload=payload,
                  headers=headers,
                  allow_status=allow_status,
              )

              if not response.content:
                  return {}

              try:
                  return response.json()

              except Exception:
                  return {
                      "raw": response.text
                  }


          # ============================================================
          # API / IDENTITY
          # ============================================================

          log("=== VERIFY IDENTITY ===")

          me = request_json(
              "GET",
              "/users/me"
          )

          log(
              "IDENTITY VERIFIED: "
              + str(
                  me.get("username")
                  or me.get("handle")
                  or me.get("name")
                  or IDENTITY
              )
          )


          # ============================================================
          # GENERIC DATA HELPERS
          # ============================================================

          def task_id(task):
              if not isinstance(task, dict):
                  return ""

              for key in [
                  "id",
                  "post_id",
                  "task_id",
              ]:
                  value = task.get(key)

                  if value is not None:
                      return str(value)

              return ""


          def task_text(task):
              if not isinstance(task, dict):
                  return ""

              parts = []

              for key in [
                  "title",
                  "description",
                  "body",
                  "content",
                  "requirements",
                  "details",
              ]:
                  value = task.get(key)

                  if value:
                      parts.append(str(value))

              return "\n".join(parts).strip()


          def task_budget(task):
              if not isinstance(task, dict):
                  return 0

              values = []

              for key in [
                  "reward_sats",
                  "budget_sats",
                  "amount_sats",
                  "reward",
                  "budget",
                  "amount",
                  "price_sats",
              ]:
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      values.append(int(value))

                  elif isinstance(value, str):
                      numbers = re.findall(
                          r"\d[\d,\s]*",
                          value
                      )

                      for number in numbers:
                          cleaned = re.sub(
                              r"[^\d]",
                              "",
                              number
                          )

                          if cleaned:
                              values.append(
                                  int(cleaned)
                              )

              return max(values) if values else 0


          def classify_task(task):
              text = task_text(task).lower()

              if any(
                  term in text
                  for term in [
                      "verification",
                      "verify",
                      "receipt",
                      "claim",
                      "fact check",
                      "fact-check",
                      "validate a claim",
                  ]
              ):
                  return "VERIFICATION"

              if any(
                  term in text
                  for term in [
                      "api test",
                      "test api",
                      "endpoint test",
                      "api endpoint",
                  ]
              ):
                  return "API_TEST"

              if any(
                  term in text
                  for term in [
                      "research",
                      "deep research",
                      "research report",
                      "technical report",
                      "investigate",
                      "investigation",
                  ]
              ):
                  return "RESEARCH"

              if any(
                  term in text
                  for term in [
                      "documentation",
                      "document",
                      "write a report",
                      "report writing",
                      "technical documentation",
                  ]
              ):
                  return "DOCUMENTATION"

              return "UNSUPPORTED"


          def task_feasibility(task):
              kind = classify_task(task)

              if kind not in {
                  "RESEARCH",
                  "VERIFICATION",
                  "API_TEST",
                  "DOCUMENTATION",
              }:
                  return 0

              text = task_text(task).lower()

              score = 50

              if kind == "VERIFICATION":
                  score += 15

              if kind == "RESEARCH":
                  score += 12

              if kind == "DOCUMENTATION":
                  score += 8

              if kind == "API_TEST":
                  score += 5

              if "receipt" in text:
                  score += 10

              if "source" in text:
                  score += 5

              if "evidence" in text:
                  score += 5

              return min(score, 100)


          def feasible(task):
              return task_feasibility(task) >= 55


          # ============================================================
          # CAPABILITIES / BLOCKED ACTIONS
          # ============================================================

          CAPABILITIES = [
              "web research",
              "deep research",
              "research report",
              "verification",
              "claim verification",
              "receipt verification",
              "technical research",
              "technical report",
              "documentation",
              "report writing",
              "API testing",
              "evidence gathering",
              "source comparison",
              "structured findings",
          ]

          BLOCKED_ACTIONS = [
              "payment creation",
              "invoice creation",
              "tip creation",
              "spending",
              "settlement",
              "automatic purchase",
              "marketplace completion confirmation",
              "external AI",
              "Gemini",
          ]

          HUMAN_ONLY_ACTIONS = [
              "accepting another worker's bid",
              "confirming marketplace completion",
              "creating payments",
              "sending tips",
              "spending sats",
          ]


          # ============================================================
          # URL / WEB RESEARCH
          # ============================================================

          def extract_urls(value):
              urls = re.findall(
                  r"https?://[^\s<>\"]+",
                  value or ""
              )

              clean = []

              for url in urls:
                  url = url.rstrip(
                      ".,);]}>"
                  )

                  if url not in clean:
                      clean.append(url)

              return clean[:MAX_RESEARCH_SOURCES]


          def html_to_text(html):
              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  html,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text,
              )

              return text.strip()


          def fetch_url(url):
              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": "NOX-Core-Engine-V1.0"
                      },
                      timeout=HTTP_TIMEOUT,
                  )

                  content_type = response.headers.get(
                      "content-type",
                      ""
                  ).lower()

                  text = response.text

                  if "html" in content_type:
                      text = html_to_text(text)

                  text = text[:MAX_SOURCE_CHARS]

                  return {
                      "url": url,
                      "status": response.status_code,
                      "content_type": content_type,
                      "text": text,
                  }

              except Exception as exc:
                  return {
                      "url": url,
                      "status": None,
                      "content_type": "",
                      "text": "",
                      "error": str(exc),
                  }


          def ddg_search(query):
              if not query:
                  return []

              url = (
                  "https://html.duckduckgo.com/html/?q="
                  + quote_plus(query)
              )

              try:
                  response = requests.get(
                      url,
                      headers={
                          "User-Agent": "NOX-Core-Engine-V1.0"
                      },
                      timeout=HTTP_TIMEOUT,
                  )

                  html = response.text

                  links = re.findall(
                      r'nuddg="([^"]+)"',
                      html
                  )

                  if not links:
                      links = re.findall(
                          r'href="(https?://[^"]+)"',
                          html
                      )

                  clean = []

                  for link in links:
                      if link.startswith(
                          "https://duckduckgo.com"
                      ):
                          continue

                      if link not in clean:
                          clean.append(link)

                  return clean[:MAX_RESEARCH_RESULTS]

              except Exception as exc:
                  log(
                      f"RESEARCH SEARCH WARNING: {exc}"
                  )
                  return []


          def research_task(task):
              if not RESEARCH_ENABLED:
                  return {
                      "query": "",
                      "sources": [],
                      "summary": "",
                      "status": "disabled",
                  }

              content = task_text(task)

              urls = extract_urls(content)

              sources = []

              # Direct task URLs first.
              for url in urls:
                  if len(sources) >= MAX_RESEARCH_SOURCES:
                      break

                  result = fetch_url(url)

                  if result.get("status") is not None:
                      sources.append(result)

              # Search if direct URLs are insufficient.
              if len(sources) < MAX_RESEARCH_RESULTS:
                  title = str(
                      task.get("title", "")
                  ).strip()

                  query = (
                      title
                      if title
                      else content[:500]
                  )

                  search_urls = ddg_search(query)

                  for url in search_urls:
                      if len(sources) >= MAX_RESEARCH_RESULTS:
                          break

                      if any(
                          item.get("url") == url
                          for item in sources
                      ):
                          continue

                      result = fetch_url(url)

                      if result.get("status") is not None:
                          sources.append(result)

              excerpts = []

              for source in sources:
                  text = source.get("text", "").strip()

                  if not text:
                      continue

                  excerpts.append(
                      {
                          "url": source.get("url"),
                          "status": source.get("status"),
                          "excerpt": text[:MAX_SOURCE_CHARS],
                      }
                  )

              query = str(
                  task.get("title")
                  or content[:300]
              )

              record = {
                  "timestamp": NOW,
                  "task_id": task_id(task),
                  "query": query,
                  "sources": excerpts,
                  "source_count": len(excerpts),
                  "external_ai_used": False,
                  "gemini_used": False,
              }

              core["research"].append(record)

              return {
                  "query": query,
                  "sources": excerpts,
                  "summary": (
                      f"{len(excerpts)} source(s) collected."
                  ),
                  "status": "completed",
              }


          # ============================================================
          # MARKETPLACE API
          # ============================================================

          def get_tasks(status=None):
              params = {
                  "limit": MAX_TASKS,
              }

              if status:
                  params["status"] = status

              data = request_json(
                  "GET",
                  "/marketplace/tasks",
                  params=params,
              )

              if isinstance(data, list):
                  return data

              for key in [
                  "tasks",
                  "items",
                  "results",
                  "data",
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def get_bids(post_id):
              data = request_json(
                  "GET",
                  f"/marketplace/{post_id}/bids"
              )

              if isinstance(data, list):
                  return data

              for key in [
                  "bids",
                  "items",
                  "results",
                  "data",
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def bidder_identity(bid):
              bidder = bid.get("bidder")

              if isinstance(bidder, dict):
                  values = [
                      bidder.get("username"),
                      bidder.get("handle"),
                      bidder.get("name"),
                      bidder.get("agent_id"),
                      bidder.get("id"),
                  ]

                  for value in values:
                      if value is not None:
                          return str(value)

              for key in [
                  "bidder_username",
                  "bidder_handle",
                  "username",
                  "agent_id",
                  "bidder_id",
              ]:
                  value = bid.get(key)

                  if value is not None:
                      return str(value)

              return ""


          def my_bid(post_id):
              try:
                  bids = get_bids(post_id)

              except Exception as exc:
                  log(
                      f"BID LOOKUP WARNING {post_id}: {exc}"
                  )
                  return None

              for bid in bids:
                  if (
                      bidder_identity(bid).lower()
                      == IDENTITY.lower()
                  ):
                      return bid

              return None


          def get_post(post_id):
              return request_json(
                  "GET",
                  f"/posts/{post_id}"
              )


          def get_payment(post_id):
              try:
                  return request_json(
                      "GET",
                      f"/marketplace/{post_id}/payment"
                  )

              except Exception as exc:
                  return {
                      "error": str(exc)
                  }


          def payment_check(post_id):
              try:
                  return request_json(
                      "POST",
                      f"/marketplace/{post_id}/payment/check"
                  )

