name: NØX ACT 17 - Knowledge Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit ACT17 Knowledge Core
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          path = Path("memory/nox_knowledge_core.json")

          print("=" * 60)
          print("NØX ACT17 — KNOWLEDGE CORE AUDIT")
          print("=" * 60)

          if not path.exists():
              print("STATUS: FAIL")
              print("ERROR: memory/nox_knowledge_core.json not found")
              raise SystemExit(1)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"File size: {path.stat().st_size:,} bytes")

          # --------------------------------------------------
          # Locate knowledge entries
          # --------------------------------------------------

          entries = []

          if isinstance(data, list):
              entries = data

          elif isinstance(data, dict):
              possible_keys = [
                  "knowledge",
                  "knowledge_base",
                  "claims",
                  "entries",
                  "items",
                  "records",
                  "facts"
              ]

              for key in possible_keys:
                  value = data.get(key)
                  if isinstance(value, list):
                      entries = value
                      break

              if not entries:
                  for value in data.values():
                      if isinstance(value, list) and value:
                          if all(isinstance(x, dict) for x in value):
                              entries = value
                              break

          print(f"Knowledge entries detected: {len(entries):,}")

          if not entries:
              print("STATUS: REVIEW")
              print("No knowledge-entry list could be detected.")
              print("=" * 60)
              raise SystemExit(0)

          # --------------------------------------------------
          # Generic helpers
          # --------------------------------------------------

          def first_value(item, keys):
              for key in keys:
                  value = item.get(key)
                  if value not in (None, "", [], {}):
                      return value
              return None

          def text_value(value):
              if value is None:
                  return ""
              if isinstance(value, (dict, list)):
                  return json.dumps(value, ensure_ascii=False)
              return str(value)

          # --------------------------------------------------
          # Domains
          # --------------------------------------------------

          domains = Counter()
          confidence = Counter()
          status = Counter()
          freshness = Counter()

          sources = set()
          agents = set()

          with_evidence = 0
          corroborated = 0
          contradictions = 0
          stale = 0

          claim_ids = []
          claim_texts = []

          for item in entries:
              if not isinstance(item, dict):
                  continue

              domain = first_value(item, [
                  "domain",
                  "topic_domain",
                  "category"
              ])

              if domain:
                  domains[str(domain)] += 1

              conf = first_value(item, [
                  "confidence",
                  "confidence_level"
              ])

              if conf is not None:
                  confidence[str(conf).upper()] += 1

              st = first_value(item, [
                  "status",
                  "knowledge_status"
              ])

              if st:
                  status[str(st).upper()] += 1

              fr = first_value(item, [
                  "freshness",
                  "freshness_status"
              ])

              if fr:
                  freshness[str(fr).upper()] += 1
                  if str(fr).upper() == "STALE":
                      stale += 1

              evidence = first_value(item, [
                  "evidence",
                  "evidence_refs",
                  "evidence_sources"
              ])

              if evidence not in (None, "", [], {}):
                  with_evidence += 1

              confirmations = first_value(item, [
                  "confirmations",
                  "confirmation_count",
                  "confirmed_by"
              ])

              if isinstance(confirmations, list) and len(confirmations) > 0:
                  corroborated += 1
              elif isinstance(confirmations, (int, float)) and confirmations > 0:
                  corroborated += 1

              contradiction = first_value(item, [
                  "contradictions",
                  "contradiction_count"
              ])

              if isinstance(contradiction, list) and contradiction:
                  contradictions += 1
              elif isinstance(contradiction, (int, float)) and contradiction > 0:
                  contradictions += 1

              source = first_value(item, [
                  "source",
                  "source_ref",
                  "source_url"
              ])

              if source:
                  sources.add(text_value(source))

              agent = first_value(item, [
                  "agent",
                  "source_agent",
                  "author",
                  "username"
              ])

              if agent:
                  agents.add(text_value(agent))

              claim_id = first_value(item, [
                  "claim_id",
                  "id"
              ])

              if claim_id:
                  claim_ids.append(str(claim_id))

              claim = first_value(item, [
                  "claim",
                  "information",
                  "fact",
                  "content",
                  "text"
              ])

              if claim:
                  claim_texts.append(
                      " ".join(text_value(claim).lower().split())
                  )

          # --------------------------------------------------
          # Duplicate detection
          # --------------------------------------------------

          duplicate_claim_ids = len(claim_ids) - len(set(claim_ids))

          duplicate_claim_texts = (
              len(claim_texts) - len(set(claim_texts))
              if claim_texts else 0
          )

          # --------------------------------------------------
          # Output
          # --------------------------------------------------

          print()
          print("DOMAIN DISTRIBUTION")
          print("-" * 60)

          for name, count in domains.most_common():
              print(f"{name}: {count}")

          print()
          print("CONFIDENCE")
          print("-" * 60)

          for name, count in confidence.most_common():
              print(f"{name}: {count}")

          print()
          print("STATUS")
          print("-" * 60)

          for name, count in status.most_common():
              print(f"{name}: {count}")

          print()
          print("FRESHNESS")
          print("-" * 60)

          for name, count in freshness.most_common():
              print(f"{name}: {count}")

          print()
          print("EVIDENCE & CORROBORATION")
          print("-" * 60)
          print(f"With evidence: {with_evidence:,}")
          print(f"Corroborated: {corroborated:,}")
          print(f"Contradictions: {contradictions:,}")
          print(f"Stale: {stale:,}")

          print()
          print("SOURCES")
          print("-" * 60)
          print(f"Unique sources: {len(sources):,}")
          print(f"Unique agents: {len(agents):,}")

          print()
          print("DUPLICATES")
          print("-" * 60)
          print(f"Duplicate claim IDs: {duplicate_claim_ids:,}")
          print(f"Duplicate claim texts: {duplicate_claim_texts:,}")

          # --------------------------------------------------
          # Structural statistics
          # --------------------------------------------------

          print()
          print("STRUCTURE")
          print("-" * 60)

          print(f"Top-level JSON type: {type(data).__name__}")

          if isinstance(data, dict):
              print(
                  "Top-level keys: "
                  + ", ".join(list(data.keys())[:20])
              )

          # --------------------------------------------------
          # Sample entries
          # --------------------------------------------------

          print()
          print("SAMPLE KNOWLEDGE ENTRIES")
          print("-" * 60)

          for index, item in enumerate(entries[:3], 1):
              if not isinstance(item, dict):
                  continue

              print(f"\nEntry {index}:")

              for key in [
                  "claim_id",
                  "domain",
                  "claim",
                  "information",
                  "source",
                  "agent",
                  "confidence",
                  "status",
                  "freshness",
                  "operational_usefulness"
              ]:
                  if key in item:
                      value = item[key]
                      rendered = text_value(value)

                      if len(rendered) > 300:
                          rendered = rendered[:300] + "..."

                      print(f"  {key}: {rendered}")

          # --------------------------------------------------
          # Preliminary verdict
          # --------------------------------------------------

          print()
          print("=" * 60)
          print("PRELIMINARY VERDICT")
          print("=" * 60)

          issues = []

          if len(entries) == 0:
              issues.append("no knowledge entries")

          if duplicate_claim_ids > 0:
              issues.append("duplicate claim IDs")

          if duplicate_claim_texts > 0:
              issues.append("duplicate claim contents")

          if not domains:
              issues.append("no domains detected")

          if with_evidence == 0:
              issues.append("no evidence detected")

          if issues:
              print("STATUS: REVIEW")
              for issue in issues:
                  print(f"- {issue}")
          else:
              print("STATUS: STRUCTURALLY HEALTHY")
              print("Further semantic validation required.")

          print("=" * 60)
          PY
