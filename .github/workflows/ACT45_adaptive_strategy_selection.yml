name: Nox ACT45 - Adaptive Strategy Selection V7

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act45:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT45 V7
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from collections import Counter

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(exist_ok=True)

          OUTPUT_JSON = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_MD = MEMORY / "nox_act_45_adaptive_strategy_selection.md"

          ACTS = {
              40: "nox_act_40_action_selection",
              41: "nox_act_41_action_outcome_evaluation",
              42: "nox_act_42_empirical_action_learning",
              43: "nox_act_43_generalization_of_empirical_learning",
              44: "nox_act_44_strategy_failure_detection",
          }

          def version_number(path):
              m = re.search(r"_v(\d+)(?:\.\d+)?$", path.stem, re.I)
              return int(m.group(1)) if m else 0

          def canonical_candidates(base):
              exact = MEMORY / f"{base}.json"
              candidates = list(MEMORY.glob(f"{base}_v*.json"))

              ordered = []
              if exact.exists():
                  ordered.append(exact)

              ordered.extend(
                  sorted(
                      candidates,
                      key=lambda p: (version_number(p), p.name),
                      reverse=True
                  )
              )
              return ordered

          def load_current(act_number):
              base = ACTS[act_number]
              candidates = canonical_candidates(base)

              for path in candidates:
                  try:
                      with path.open("r", encoding="utf-8") as f:
                          return path, json.load(f)
                  except Exception:
                      continue

              return None, None

          sources = {}
          source_metadata = {}

          for act_number in [40, 41, 42, 43, 44]:
              path, data = load_current(act_number)

              if path is not None:
                  sources[act_number] = data
                  source_metadata[act_number] = {
                      "file": str(path),
                      "version": version_number(path)
                  }

          def is_scalar(value):
              return isinstance(value, (str, int, float, bool)) or value is None

          def normalize(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, (int, float, bool)):
                  return str(value)

              return ""

          def looks_like_identifier(value):
              if not isinstance(value, str):
                  return False

              text = value.strip()

              if not text:
                  return False

              if len(text) > 160:
                  return False

              return True

          STRATEGY_KEYS = {
              "strategy",
              "strategy_id",
              "strategy_name",
              "selected_strategy",
              "preferred_strategy",
              "strategy_used",
              "strategy_candidate",
              "candidate_strategy",
              "action_strategy",
              "adaptive_strategy",
          }

          OUTCOME_KEYS = {
              "outcome",
              "result",
              "action_outcome",
              "empirical_outcome",
              "evaluation",
              "performance",
              "status",
              "success",
              "successful",
              "failure",
              "failed",
              "failure_detected",
              "effect",
              "impact",
              "observation",
              "observations",
              "evidence",
              "empirical_evidence",
          }

          FAILURE_KEYS = {
              "failure",
              "failed",
              "failure_detected",
              "strategy_failure",
              "failure_reason",
              "failure_type",
              "decline",
              "declining",
          }

          SUCCESS_KEYS = {
              "success",
              "successful",
              "improvement",
              "improved",
              "positive",
              "effective",
              "success_count",
              "positive_observations",
          }

          CONTRADICTION_KEYS = {
              "contradiction",
              "contradictory",
              "inconsistent",
              "conflict",
          }

          def scalar_fields(obj):
              if not isinstance(obj, dict):
                  return {}

              return {
                  str(k).lower(): normalize(v)
                  for k, v in obj.items()
                  if is_scalar(v) and normalize(v)
              }

          def find_strategy_fields(obj, path="$"):
              found = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      key_lower = str(key).lower()
                      current_path = f"{path}.{key}"

                      if key_lower in STRATEGY_KEYS:
                          if isinstance(value, str) and looks_like_identifier(value):
                              found.append({
                                  "strategy": value.strip(),
                                  "path": current_path
                              })
                          elif isinstance(value, list):
                              for index, item in enumerate(value):
                                  if isinstance(item, str) and looks_like_identifier(item):
                                      found.append({
                                          "strategy": item.strip(),
                                          "path": f"{current_path}[{index}]"
                                      })
                                  elif isinstance(item, dict):
                                      nested = find_strategy_fields(
                                          item,
                                          f"{current_path}[{index}]"
                                      )
                                      found.extend(nested)

                      found.extend(
                          find_strategy_fields(value, current_path)
                      )

              elif isinstance(obj, list):
                  for index, item in enumerate(obj):
                      found.extend(
                          find_strategy_fields(item, f"{path}[{index}]")
                      )

              return found

          def contains_relevant_key(obj):
              if not isinstance(obj, dict):
                  return False

              keys = {str(k).lower() for k in obj.keys()}

              return bool(
                  keys.intersection(OUTCOME_KEYS)
                  or keys.intersection(FAILURE_KEYS)
                  or keys.intersection(SUCCESS_KEYS)
                  or keys.intersection(CONTRADICTION_KEYS)
              )

          def inspect_related_object(obj, path="$"):
              """
              Extract evidence only when strategy information and outcome/
              empirical information are structurally related inside the same
              object or directly nested object.

              No free-text global matching is used.
              """

              records = []

              if isinstance(obj, dict):
                  local_strategy = []

                  for key, value in obj.items():
                      key_lower = str(key).lower()

                      if key_lower in STRATEGY_KEYS:
                          if isinstance(value, str) and looks_like_identifier(value):
                              local_strategy.append(value.strip())

                          elif isinstance(value, list):
                              for item in value:
                                  if isinstance(item, str) and looks_like_identifier(item):
                                      local_strategy.append(item.strip())

                  if local_strategy and contains_relevant_key(obj):
                      scalars = scalar_fields(obj)

                      records.append({
                          "path": path,
                          "strategies": sorted(set(local_strategy)),
                          "fields": scalars,
                          "source_relation": "same_structural_object"
                      })

                  for key, value in obj.items():
                      child_path = f"{path}.{key}"
                      records.extend(
                          inspect_related_object(value, child_path)
                      )

              elif isinstance(obj, list):
                  for index, item in enumerate(obj):
                      records.extend(
                          inspect_related_object(item, f"{path}[{index}]")
                      )

              return records

          def classify_record(record):
              fields = record.get("fields", {})
              joined = " ".join(
                  f"{k}={v}".lower()
                  for k, v in fields.items()
              )

              positives = 0
              negatives = 0
              contradictions = 0

              for key, value in fields.items():
                  key_l = key.lower()
                  value_l = value.lower()

                  if key_l in SUCCESS_KEYS:
                      if value_l in {
                          "true",
                          "yes",
                          "success",
                          "successful",
                          "positive",
                          "improved",
                          "effective"
                      }:
                          positives += 1

                  if key_l in FAILURE_KEYS:
                      if value_l in {
                          "true",
                          "yes",
                          "failure",
                          "failed",
                          "declining",
                          "decline"
                      }:
                          negatives += 1

                  if key_l in CONTRADICTION_KEYS:
                      if value_l in {
                          "true",
                          "yes",
                          "inconsistent",
                          "contradictory",
                          "conflict"
                      }:
                          contradictions += 1

              if "inconsistent" in joined or "contradictory" in joined:
                  contradictions += 1

              if negatives > 0 and positives > 0:
                  return "contradictory"

              if negatives > 0:
                  return "negative"

              if positives > 0:
                  return "positive"

              return "unclassified"

          structural_records = []

          for act_number in [44, 43, 42, 41, 40]:
              if act_number not in sources:
                  continue

              records = inspect_related_object(
                  sources[act_number],
                  "$"
              )

              for record in records:
                  record["source_act"] = act_number
                  record["source_file"] = source_metadata[act_number]["file"]
                  record["classification"] = classify_record(record)

              structural_records.extend(records)

          candidate_names = set()

          for act_number in [44, 43, 42, 41, 40]:
              if act_number not in sources:
                  continue

              for item in find_strategy_fields(
                  sources[act_number],
                  "$"
              ):
                  candidate_names.add(item["strategy"])

          # A strategy becomes eligible only when it belongs to the current
          # ACT40-ACT44 lineage. Old ACT30 candidates are deliberately ignored.
          candidates = []

          for strategy in sorted(candidate_names):
              related = [
                  r for r in structural_records
                  if strategy in r.get("strategies", [])
              ]

              if not related:
                  continue

              positive = sum(
                  1 for r in related
                  if r["classification"] == "positive"
              )

              negative = sum(
                  1 for r in related
                  if r["classification"] == "negative"
              )

              contradictory = sum(
                  1 for r in related
                  if r["classification"] == "contradictory"
              )

              unclassified = sum(
                  1 for r in related
                  if r["classification"] == "unclassified"
              )

              comparable = positive + negative + contradictory

              if comparable >= 3:
                  if contradictory > 0 and positive > 0 and negative > 0:
                      trend = "inconsistent"

                  elif positive > negative:
                      trend = "improving"

                  elif negative > positive:
                      trend = "declining"

                  else:
                      trend = "stable"

              else:
                  trend = "insufficient"

              if comparable >= 3:
                  evidence_strength = "sufficient_for_comparison"
              elif comparable >= 1:
                  evidence_strength = "partial"
              else:
                  evidence_strength = "insufficient"

              candidates.append({
                  "name": strategy,
                  "evidence_sources": sorted(
                      set(r["source_file"] for r in related)
                  ),
                  "empirical_samples": [
                      {
                          "source_act": r["source_act"],
                          "source_file": r["source_file"],
                          "path": r["path"],
                          "classification": r["classification"],
                          "fields": r["fields"]
                      }
                      for r in related
                  ],
                  "successes": positive,
                  "failures": negative,
                  "contradictions": contradictory,
                  "unclassified": unclassified,
                  "comparable_observations": comparable,
                  "trend": trend,
                  "evidence_strength": evidence_strength
              })

          comparable_candidates = [
              c for c in candidates
              if c["comparable_observations"] >= 3
          ]

          decision = "INSUFFICIENT_EVIDENCE"
          selected_strategy = None
          recommendation = None
          confidence = "insufficient"

          if len(comparable_candidates) >= 2:
              trend_counts = Counter(
                  c["trend"] for c in comparable_candidates
              )

              declining = [
                  c for c in comparable_candidates
                  if c["trend"] == "declining"
              ]

              improving = [
                  c for c in comparable_candidates
                  if c["trend"] == "improving"
              ]

              stable = [
                  c for c in comparable_candidates
                  if c["trend"] == "stable"
              ]

              if improving and not declining:
                  ranked = sorted(
                      improving,
                      key=lambda c: (
                          c["successes"],
                          -c["failures"],
                          -c["contradictions"]
                      ),
                      reverse=True
                  )

                  if len(ranked) >= 2:
                      first = ranked[0]
                      second = ranked[1]

                      first_score = (
                          first["successes"],
                          -first["failures"],
                          -first["contradictions"]
                      )

                      second_score = (
                          second["successes"],
                          -second["failures"],
                          -second["contradictions"]
                      )

                      if first_score != second_score:
                          selected_strategy = first["name"]
                          decision = "ADAPT"
                          recommendation = (
                              "Increase future preference for the strategy "
                              "with stronger comparable empirical evidence."
                          )
                          confidence = "moderate"

              elif declining and not improving:
                  decision = "ADAPT"
                  recommendation = (
                      "Reduce future preference for declining strategies "
                      "and continue evaluating alternatives."
                  )
                  confidence = "moderate"

              elif improving and declining:
                  decision = "INSUFFICIENT_COMPARISON"
                  recommendation = (
                      "Comparable evidence contains opposing trends; "
                      "preserve uncertainty and continue testing."
                  )
                  confidence = "low"

              elif stable:
                  decision = "INSUFFICIENT_COMPARISON"
                  recommendation = (
                      "Comparable strategies appear stable but evidence "
                      "does not justify a stronger preference."
                  )
                  confidence = "low"

              else:
                  decision = "INSUFFICIENT_COMPARISON"
                  recommendation = (
                      "Comparable evidence exists but does not establish "
                      "a defensible adaptive preference."
                  )
                  confidence = "low"

          elif len(candidates) >= 1:
              decision = "INSUFFICIENT_COMPARISON"
              recommendation = (
                  "Current strategy evidence is not comparable across at "
                  "least two strategies with three or more empirical "
                  "observations each."
              )

          else:
              decision = "INSUFFICIENT_EVIDENCE"
              recommendation = (
                  "No current ACT40-ACT44 strategy with explicit associated "
                  "empirical evidence was found."
              )

          output = {
              "act": "ACT45",
              "version": "V7",
              "name": "Adaptive Strategy Selection",
              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "method": {
                  "strategy": (
                      "Evidence-based adaptive strategy selection from "
                      "the current ACT40-ACT44 cognitive lineage"
                  ),
                  "source_selection": (
                      "ACT40_to_ACT44_current_lineage_only"
                  ),
                  "candidate_discovery": (
                      "explicit_structural_strategy_fields_only"
                  ),
                  "evidence_association": (
                      "same_structural_object_or_explicit_nested_relation"
                  ),
                  "free_text_name_matching": False,
                  "old_act30_candidates_used": False,
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "global_metrics_used_as_candidate_metrics": False,
                  "arbitrary_selection": False,
                  "minimum_comparable_observations_per_strategy": 3,
                  "minimum_strategies_for_comparison": 2
              },

              "source": {
                  "memory_directory": str(MEMORY),
                  "lineage": "ACT40 -> ACT41 -> ACT42 -> ACT43 -> ACT44",
                  "files_loaded": len(sources),
                  "files": source_metadata
              },

              "discovery": {
                  "structural_records": len(structural_records),
                  "candidate_count": len(candidates),
                  "comparable_candidate_count": len(
                      comparable_candidates
                  )
              },

              "candidates": candidates,

              "selection": {
                  "decision": decision,
                  "selected_strategy": selected_strategy,
                  "comparison_possible": (
                      len(comparable_candidates) >= 2
                  ),
                  "confidence": confidence,
                  "adaptation_recommendation": recommendation
              },

              "evidence_integrity": {
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "global_metrics_used_as_candidate_metrics": False,
                  "free_text_strategy_matching": False,
                  "missing_evidence_preserved": True,
                  "qualitative_states_preserved": True,
                  "current_lineage_prioritized": True,
                  "act30_stale_candidates_ignored": True
              },

              "next_cognitive_step": (
                  "Proceed to ACT46 only when ACT45 produces a defensible "
                  "adaptive comparison; otherwise remain in ACT45."
              )
          }

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          md_lines = [
              "# ACT45 V7 — Adaptive Strategy Selection",
              "",
              "## Decision",
              "",
              f"- Decision: `{decision}`",
              f"- Selected strategy: `{selected_strategy}`",
              f"- Confidence: `{confidence}`",
              "",
              "## Current cognitive lineage",
              "",
              "ACT40 → ACT41 → ACT42 → ACT43 → ACT44 → ACT45",
              "",
              "## Evidence policy",
              "",
              "- Current lineage only.",
              "- ACT30 candidates are ignored.",
              "- No free-text strategy matching.",
              "- No fabricated candidates.",
              "- No fabricated metrics.",
              "- No global metrics used as candidate metrics.",
              "- No arbitrary strategy selection.",
              "- Minimum 3 comparable observations per strategy.",
              "- Minimum 2 strategies for comparison.",
              "",
              "## Candidates",
              ""
          ]

          if candidates:
              for candidate in candidates:
                  md_lines.extend([
                      f"### {candidate['name']}",
                      "",
                      f"- Comparable observations: "
                      f"`{candidate['comparable_observations']}`",
                      f"- Successes: `{candidate['successes']}`",
                      f"- Failures: `{candidate['failures']}`",
                      f"- Contradictions: "
                      f"`{candidate['contradictions']}`",
                      f"- Trend: `{candidate['trend']}`",
                      f"- Evidence strength: "
                      f"`{candidate['evidence_strength']}`",
                      ""
                  ])
          else:
              md_lines.extend([
                  "No current strategy with explicit structural "
                  "empirical evidence was found.",
                  ""
              ])

          md_lines.extend([
              "## Integrity",
              "",
              "- Cost: €0",
              "- Gemini: false",
              "- External AI: false",
              "- External API: false",
              "- Spending: false",
              "- Payments: false",
              ""
          ])

          OUTPUT_MD.write_text(
              "\n".join(md_lines),
              encoding="utf-8"
          )

          print("ACT45 V7 completed")
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Verify ACT45 outputs
        run: |
          test -s memory/nox_act_45_adaptive_strategy_selection.json
          test -s memory/nox_act_45_adaptive_strategy_selection.md

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("memory/nox_act_45_adaptive_strategy_selection.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["act"] == "ACT45"
          assert data["version"] == "V7"
          assert data["cost_zero"] is True
          assert data["gemini_used"] is False
          assert data["external_ai_used"] is False
          assert data["external_api_used"] is False
          assert data["spending"] is False
          assert data["payments"] is False

          assert data["method"]["fabricated_candidates"] is False
          assert data["method"]["fabricated_metrics"] is False
          assert data["method"]["arbitrary_selection"] is False
          assert data["method"]["old_act30_candidates_used"] is False

          print("ACT45 V7 output verification: OK")
          PY

      - name: Commit ACT45 V7 results
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_act_45_adaptive_strategy_selection.json \
            memory/nox_act_45_adaptive_strategy_selection.md

          if git diff --cached --quiet; then
            echo "No ACT45 V7 changes to commit."
            exit 0
          fi

          git commit -m "ACT45 V7 adaptive strategy selection"
          git push
