name: NØX ACT45 - Adaptive Strategy Selection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act45:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT45 V6
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          ACT = "ACT45"
          VERSION = "V6"

          MEMORY = Path("memory")
          OUTPUT_JSON = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_MD = MEMORY / "nox_act_45_adaptive_strategy_selection.md"

          MEMORY.mkdir(parents=True, exist_ok=True)

          def timestamp():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception:
                  return None

          def walk(node, path="$"):
              yield path, node

              if isinstance(node, dict):
                  for key, value in node.items():
                      yield from walk(value, f"{path}.{key}")

              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      yield from walk(value, f"{path}[{index}]")

          def numeric(value):
              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  number = float(value)
                  return number if math.isfinite(number) else None

              if isinstance(value, str):
                  try:
                      number = float(value.strip())
                      return number if math.isfinite(number) else None
                  except Exception:
                      return None

              return None

          def preview(value):
              if isinstance(value, (str, int, float, bool)):
                  return value

              if isinstance(value, list):
                  return value[:3]

              if isinstance(value, dict):
                  return list(value.keys())[:10]

              return str(value)[:300]

          def classify(value):
              text_parts = []

              if isinstance(value, str):
                  text_parts.append(value)

              elif isinstance(value, dict):
                  for key, item in value.items():
                      text_parts.append(str(key))
                      if isinstance(item, (str, int, float, bool)):
                          text_parts.append(str(item))

              elif isinstance(value, list):
                  text_parts.append(json.dumps(value, ensure_ascii=False))

              text = " ".join(text_parts).lower()

              contradictory = (
                  "inconsistent",
                  "contradictory",
                  "mixed",
                  "uncertain",
                  "uncertainty",
              )

              positive = (
                  "success",
                  "successful",
                  "improved",
                  "positive",
                  "effective",
                  "worked",
                  "stable",
              )

              negative = (
                  "failure",
                  "failed",
                  "decline",
                  "declining",
                  "negative",
                  "ineffective",
                  "worse",
              )

              if any(word in text for word in contradictory):
                  return "contradictory"

              if any(word in text for word in positive):
                  return "positive"

              if any(word in text for word in negative):
                  return "negative"

              return "unclassified"

          def explicitly_related(candidate_name, value, path):
              name = candidate_name.lower().strip()

              if name and name in path.lower():
                  return True

              if isinstance(value, str):
                  return name in value.lower()

              if isinstance(value, (dict, list)):
                  try:
                      text = json.dumps(
                          value,
                          ensure_ascii=False,
                          sort_keys=True
                      ).lower()
                      return name in text
                  except Exception:
                      return False

              return False

          # ------------------------------------------------------------
          # Discover memory files
          # ------------------------------------------------------------

          memory_files = sorted(
              path for path in MEMORY.rglob("*.json")
              if path.name != OUTPUT_JSON.name
          )

          documents = []

          for path in memory_files[:100]:
              data = load_json(path)

              if data is not None:
                  documents.append((path, data))

          # ------------------------------------------------------------
          # Discover explicit strategy candidates
          # ------------------------------------------------------------

          strategy_fields = {
              "stable_strategy",
              "declining_strategy",
              "inconsistent_strategy",
              "adaptation_candidates",
              "adaptive_strategy_preference",
              "strategy_preferences",
              "preferred_strategy",
              "candidate_strategies",
              "strategy_candidates",
          }

          discovery = []
          raw_candidates = []

          for source_path, data in documents:
              for path, value in walk(data):

                  field = path.split(".")[-1]
                  field = field.split("[")[0]

                  if field not in strategy_fields:
                      continue

                  discovery.append({
                      "file": str(source_path),
                      "field": field,
                      "path": path,
                      "value_type": type(value).__name__,
                      "preview": preview(value)
                  })

                  if field in {
                      "stable_strategy",
                      "declining_strategy",
                      "inconsistent_strategy",
                      "preferred_strategy",
                  }:
                      if isinstance(value, str) and value.strip():
                          raw_candidates.append({
                              "name": value.strip(),
                              "source_file": str(source_path),
                              "source_field": field,
                              "source_path": path
                          })

                  elif field in {
                      "candidate_strategies",
                      "strategy_candidates",
                      "adaptation_candidates",
                  }:
                      if isinstance(value, list):

                          for index, item in enumerate(value):
                              item_path = f"{path}[{index}]"

                              if isinstance(item, str) and item.strip():
                                  raw_candidates.append({
                                      "name": item.strip(),
                                      "source_file": str(source_path),
                                      "source_field": field,
                                      "source_path": item_path
                                  })

                              elif isinstance(item, dict):
                                  name = (
                                      item.get("strategy")
                                      or item.get("name")
                                      or item.get("strategy_name")
                                      or item.get("preferred_strategy")
                                  )

                                  if isinstance(name, str) and name.strip():
                                      raw_candidates.append({
                                          "name": name.strip(),
                                          "source_file": str(source_path),
                                          "source_field": field,
                                          "source_path": item_path,
                                          "object": item
                                      })

                  elif field == "strategy_preferences":
                      if isinstance(value, dict):

                          for key, item in value.items():

                              if isinstance(key, str) and key.strip():
                                  raw_candidates.append({
                                      "name": key.strip(),
                                      "source_file": str(source_path),
                                      "source_field": field,
                                      "source_path": f"{path}.{key}",
                                      "object": item
                                  })

          # ------------------------------------------------------------
          # Deduplicate candidates
          # ------------------------------------------------------------

          unique = {}

          for candidate in raw_candidates:
              key = candidate["name"].strip().lower()

              if key not in unique:
                  unique[key] = candidate

          candidates = list(unique.values())

          # ------------------------------------------------------------
          # Empirical evidence fields
          # ------------------------------------------------------------

          evidence_fields = {
              "empirical_samples",
              "empirical_evidence",
              "observations",
              "results",
              "outcomes",
              "action_outcome",
              "action_outcome_evaluation",
              "strategy_result",
              "strategy_results",
              "execution_result",
              "success",
              "failure",
              "successes",
              "failures",
              "trend",
              "confidence",
              "current_confidence",
              "new_confidence",
              "confidence_change",
          }

          evaluated = []

          for candidate in candidates:

              observations = []
              candidate_metrics = {}

              for source_path, data in documents:

                  for path, value in walk(data):

                      field = path.split(".")[-1]
                      field = field.split("[")[0]

                      if field not in evidence_fields:
                          continue

                      if not explicitly_related(
                          candidate["name"],
                          value,
                          path
                      ):
                          continue

                      classification = classify(value)

                      observations.append({
                          "file": str(source_path),
                          "path": path,
                          "field": field,
                          "classification": classification,
                          "preview": preview(value)
                      })

                      if isinstance(value, dict):

                          for key, item in value.items():

                              number = numeric(item)

                              if number is not None:
                                  candidate_metrics.setdefault(
                                      str(key),
                                      []
                                  ).append({
                                      "value": number,
                                      "file": str(source_path),
                                      "path": f"{path}.{key}"
                                  })

              positive = sum(
                  1 for item in observations
                  if item["classification"] == "positive"
              )

              negative = sum(
                  1 for item in observations
                  if item["classification"] == "negative"
              )

              contradictory = sum(
                  1 for item in observations
                  if item["classification"] == "contradictory"
              )

              unclassified = sum(
                  1 for item in observations
                  if item["classification"] == "unclassified"
              )

              comparable = positive + negative

              if comparable >= 2:

                  if positive > negative:
                      trend = "positive"

                  elif negative > positive:
                      trend = "negative"

                  else:
                      trend = "balanced"

              elif contradictory > 0:
                  trend = "contradictory"

              else:
                  trend = "insufficient"

              if comparable >= 5 and contradictory == 0:
                  evidence_strength = "strong"

              elif comparable >= 3 and contradictory == 0:
                  evidence_strength = "moderate"

              elif comparable >= 2:
                  evidence_strength = "limited"

              else:
                  evidence_strength = "insufficient"

              evaluated.append({
                  "name": candidate["name"],
                  "source_file": candidate["source_file"],
                  "source_field": candidate["source_field"],
                  "source_path": candidate["source_path"],
                  "observations": observations,
                  "observation_count": len(observations),
                  "comparable_observations": comparable,
                  "positive_observations": positive,
                  "negative_observations": negative,
                  "contradictory_observations": contradictory,
                  "unclassified_observations": unclassified,
                  "trend": trend,
                  "evidence_strength": evidence_strength,
                  "candidate_metrics": candidate_metrics
              })

          # ------------------------------------------------------------
          # Adaptive selection
          # ------------------------------------------------------------

          decision = "INSUFFICIENT_EVIDENCE"
          selected_strategy = None
          comparison_possible = False

          reason = ""

          comparable_candidates = [
              candidate
              for candidate in evaluated
              if candidate["comparable_observations"] >= 2
          ]

          if not evaluated:

              decision = "INSUFFICIENT_EVIDENCE"

              reason = (
                  "No explicit strategy candidate was discovered "
                  "in the available memory."
              )

          elif len(comparable_candidates) < 2:

              decision = "INSUFFICIENT_COMPARISON"

              reason = (
                  "Strategies were discovered, but fewer than two "
                  "strategies have enough comparable empirical observations."
              )

          else:

              comparison_possible = True

              rates = []

              for candidate in comparable_candidates:

                  total = candidate["comparable_observations"]

                  if total <= 0:
                      continue

                  rate = (
                      candidate["positive_observations"] / total
                  )

                  rates.append({
                      "candidate": candidate,
                      "positive_rate": rate
                  })

              if not rates:

                  decision = "INSUFFICIENT_COMPARISON"

                  reason = (
                      "Comparable observations were not sufficient "
                      "to calculate a defensible comparison."
                  )

              else:

                  best_rate = max(
                      item["positive_rate"]
                      for item in rates
                  )

                  winners = [
                      item
                      for item in rates
                      if abs(
                          item["positive_rate"] - best_rate
                      ) < 1e-12
                  ]

                  if len(winners) > 1:

                      decision = "TIE"

                      reason = (
                          "Multiple strategies have the same observed "
                          "positive outcome rate. No arbitrary tie-break "
                          "was applied."
                      )

                  else:

                      winner = winners[0]["candidate"]

                      if (
                          winner["comparable_observations"] >= 3
                          and winner["contradictory_observations"] == 0
                      ):

                          decision = "PRIORITIZE"

                          selected_strategy = winner["name"]

                          reason = (
                              "One strategy has the strongest observed "
                              "positive outcome rate among strategies "
                              "with comparable empirical evidence, with "
                              "sufficient observations and no contradictory evidence."
                          )

                      else:

                          decision = "INSUFFICIENT_COMPARISON"

                          reason = (
                              "A difference was observed, but the available "
                              "evidence is not strong enough to justify adaptation."
                          )

          # ------------------------------------------------------------
          # Integrity
          # ------------------------------------------------------------

          evidence_integrity = {
              "fabricated_candidates": False,
              "fabricated_metrics": False,
              "arbitrary_selection": False,
              "global_metrics_used_as_candidate_metrics": False,
              "missing_evidence_preserved": True,
              "qualitative_states_preserved": True,
              "recursive_discovery": True
          }

          # ------------------------------------------------------------
          # Final result
          # ------------------------------------------------------------

          result = {
              "act": ACT,
              "version": VERSION,
              "name": "Adaptive Strategy Selection",
              "timestamp": timestamp(),

              "cost_zero": True,
              "project_cost_eur": 0,

              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,

              "spending": False,
              "payments": False,

              "method": {
                  "strategy": (
                      "Evidence-based adaptive strategy selection "
                      "from observed comparable empirical results"
                  ),
                  "recursive_scan": True,
                  "candidate_discovery": "explicit_structural_fields_only",
                  "evidence_association": "explicit_relationship_only",
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "minimum_comparable_observations_for_selection": 3
              },

              "source": {
                  "memory_directory": str(MEMORY),
                  "files_considered": len(memory_files),
                  "files_loaded": len(documents),
                  "files": [
                      str(path)
                      for path, _ in documents
                  ]
              },

              "discovery": {
                  "strategy_field_occurrences": len(discovery),
                  "fields_found": sorted(
                      set(
                          item["field"]
                          for item in discovery
                      )
                  ),
                  "paths_found": discovery[:200]
              },

              "candidate_count": len(evaluated),
              "candidates": evaluated,

              "selection": {
                  "decision": decision,
                  "selected_strategy": selected_strategy,
                  "comparison_possible": comparison_possible,
                  "reason": reason
              },

              "evidence_integrity": evidence_integrity,

              "learning": {
                  "what_nox_learned": (
                      "ACT45 V6 separates strategy existence from "
                      "strategy performance. NØX must associate empirical "
                      "observations with the correct strategy, compare only "
                      "genuinely comparable observations, preserve contradictory "
                      "evidence, and refuse adaptation when evidence is weak."
                  ),
                  "next_condition": (
                      "ACT46 may arbitrate only when multiple strategies "
                      "have defensible comparable evidence."
                  )
              },

              "next_cognitive_step": (
                  "ACT46 - Strategy Arbitration"
                  if decision == "PRIORITIZE"
                  else (
                      "Remain in ACT45 until stronger empirical evidence exists"
                  )
              )
          }

          # ------------------------------------------------------------
          # Write JSON
          # ------------------------------------------------------------

          OUTPUT_JSON.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Write Markdown
          # ------------------------------------------------------------

          markdown = f"""# NØX ACT45 V6 — Adaptive Strategy Selection

          ## Execution

          - ACT: `{ACT}`
          - Version: `{VERSION}`
          - Timestamp: `{result["timestamp"]}`
          - Cost: `0 EUR`
          - Gemini: `false`
          - External AI: `false`
          - External API: `false`
          - Spending: `false`
          - Payments: `false`

          ## Decision

          **{decision}**

          Selected strategy:

          **{selected_strategy or "none"}**

          Comparison possible:

          **{comparison_possible}**

          Reason:

          {reason}

          ## Candidates

          Number of candidates:

          **{len(evaluated)}**

          ## Evidence integrity

          - Fabricated candidates: `false`
          - Fabricated metrics: `false`
          - Arbitrary selection: `false`
          - Global metrics reused as candidate metrics: `false`
          - Missing evidence preserved: `true`
          - Qualitative states preserved: `true`
          - Recursive discovery: `true`

          ## Next cognitive step

          **{result["next_cognitive_step"]}**
          """

          OUTPUT_MD.write_text(
              markdown,
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print("NØX ACT45 V6")
          print("========================================")
          print(f"Decision: {decision}")
          print(
              f"Selected strategy: "
              f"{selected_strategy or 'NONE'}"
          )
          print(
              f"Candidates: "
              f"{len(evaluated)}"
          )
          print(
              f"Comparison possible: "
              f"{comparison_possible}"
          )
          print(
              f"JSON: "
              f"{OUTPUT_JSON}"
          )
          print(
              f"Markdown: "
              f"{OUTPUT_MD}"
          )
          print("========================================")

          PY

      - name: Verify ACT45 V6 outputs
        shell: bash
        run: |
          test -f memory/nox_act_45_adaptive_strategy_selection.json
          test -f memory/nox_act_45_adaptive_strategy_selection.md

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "memory/nox_act_45_adaptive_strategy_selection.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert data["act"] == "ACT45"
          assert data["version"] == "V6"
          assert data["cost_zero"] is True
          assert data["gemini"] is False
          assert data["gemini_used"] is False
          assert data["external_ai_used"] is False
          assert data["external_api_used"] is False
          assert data["spending"] is False
          assert data["payments"] is False

          print("ACT45 V6 output validation: OK")
          print(
              "Decision:",
              data["selection"]["decision"]
          )
          print(
              "Candidates:",
              data["candidate_count"]
          )
          PY

      - name: Commit ACT45 V6 results
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_45_adaptive_strategy_selection.json
          git add memory/nox_act_45_adaptive_strategy_selection.md

          if git diff --cached --quiet; then
            echo "No ACT45 V6 result changes to commit."
            exit 0
          fi

          git commit -m "ACT45 V6 evidence-based strategy selection"
          git push
