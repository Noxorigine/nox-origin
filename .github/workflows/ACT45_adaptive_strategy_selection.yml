name: ACT45 - Adaptive Strategy Selection

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  adaptive-strategy-selection:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT45
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT40 = MEMORY_DIR / "nox_act_40_action_selection.json"
          ACT41 = MEMORY_DIR / "nox_act_41_action_outcome_evaluation.json"
          ACT42 = MEMORY_DIR / "nox_act_42_empirical_action_learning.json"
          ACT43 = MEMORY_DIR / "nox_act_43_generalization_of_empirical_learning.json"
          ACT44 = MEMORY_DIR / "nox_act_44_strategy_failure_detection.json"

          OUTPUT = MEMORY_DIR / "nox_act_45_adaptive_strategy_selection.json"

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          act40 = load_json(ACT40)
          act41 = load_json(ACT41)
          act42 = load_json(ACT42)
          act43 = load_json(ACT43)
          act44 = load_json(ACT44)

          sources = {
              "act40": str(ACT40),
              "act41": str(ACT41),
              "act42": str(ACT42),
              "act43": str(ACT43),
              "act44": str(ACT44),
          }

          source_presence = {
              "act40": act40 is not None,
              "act41": act41 is not None,
              "act42": act42 is not None,
              "act43": act43 is not None,
              "act44": act44 is not None,
          }

          source_completeness = round(
              100.0 * sum(source_presence.values()) / len(source_presence),
              2
          )

          # ------------------------------------------------------------
          # ACT45 reads strategy evidence produced by ACT44.
          # No strategy performance is invented here.
          # ------------------------------------------------------------

          monitoring = {}
          assessments = []

          if act44:
              monitoring = act44.get("strategy_monitoring", {})
              assessments = act44.get("strategy_assessments", [])

          empirical_samples = monitoring.get("empirical_samples", 0)
          failure_evidence_available = monitoring.get(
              "failure_evidence_available",
              False
          )

          adaptive_preferences = []
          adaptation_candidates = []
          neutral_strategies = []

          # ------------------------------------------------------------
          # Adaptation rules
          #
          # STABLE:
          #   positive evidence, but not automatic execution.
          #
          # DECLINING:
          #   reduce future preference.
          #
          # INCONSISTENT:
          #   preserve uncertainty and require more testing.
          #
          # INSUFFICIENT:
          #   remain neutral.
          # ------------------------------------------------------------

          for assessment in assessments:
              strategy = assessment.get("action", "unknown")
              action_id = assessment.get("action_id")

              state = assessment.get("state", "insufficient_evidence")
              observations = assessment.get("observations", 0)
              context = assessment.get("context")

              base = {
                  "action": strategy,
                  "action_id": action_id,
                  "state": state,
                  "observations": observations,
                  "context": context,
              }

              if state == "stable" and observations >= 2:
                  preference = {
                      **base,
                      "adaptation": "increase_preference",
                      "preference_delta": 1,
                      "reason": (
                          "Repeated comparable empirical outcomes indicate "
                          "that this strategy remains stable."
                      ),
                      "confidence_in_adaptation": "moderate",
                  }

                  adaptive_preferences.append(preference)
                  adaptation_candidates.append(preference)

              elif state == "declining" and observations >= 2:
                  preference = {
                      **base,
                      "adaptation": "decrease_preference",
                      "preference_delta": -1,
                      "reason": (
                          "Repeated comparable empirical outcomes indicate "
                          "that this strategy is declining."
                      ),
                      "confidence_in_adaptation": "moderate",
                  }

                  adaptive_preferences.append(preference)
                  adaptation_candidates.append(preference)

              elif state == "inconsistent" and observations >= 2:
                  preference = {
                      **base,
                      "adaptation": "preserve_uncertainty",
                      "preference_delta": 0,
                      "reason": (
                          "Comparable outcomes are inconsistent. The strategy "
                          "requires additional testing rather than automatic "
                          "promotion or rejection."
                      ),
                      "confidence_in_adaptation": "low",
                  }

                  adaptive_preferences.append(preference)
                  adaptation_candidates.append(preference)

              else:
                  neutral = {
                      **base,
                      "adaptation": "no_change",
                      "preference_delta": 0,
                      "reason": (
                          "Evidence is insufficient for a reliable adaptive "
                          "strategy preference."
                      ),
                  }

                  neutral_strategies.append(neutral)

          # ------------------------------------------------------------
          # If ACT44 has no empirical evidence, ACT45 must not manufacture
          # an adaptive preference.
          # ------------------------------------------------------------

          if empirical_samples == 0 or not failure_evidence_available:
              adaptive_preferences = []
              adaptation_candidates = []

              status = "awaiting_empirical_evidence"

              signal = (
                  "No validated repeated empirical strategy evidence is "
                  "available. Adaptive strategy preferences cannot yet be "
                  "changed."
              )

              adaptation_allowed = False

          else:
              status = (
                  "adaptive_preferences_available"
                  if adaptation_candidates
                  else "no_adaptation_required"
              )

              signal = (
                  "Validated empirical strategy evidence is available and "
                  "can influence future strategy preferences without "
                  "authorizing execution."
              )

              adaptation_allowed = bool(adaptation_candidates)

          # ------------------------------------------------------------
          # Confidence is deliberately not modified by ACT45.
          # Strategy preference adaptation and confidence calibration remain
          # separate cognitive mechanisms.
          # ------------------------------------------------------------

          current_confidence = 30.0

          if act40:
              current_confidence = (
                  act40.get("confidence", {}).get(
                      "current_confidence",
                      current_confidence
                  )
              )

          if act42:
              current_confidence = (
                  act42.get("confidence_update", {}).get(
                      "new_confidence",
                      current_confidence
                  )
              )

          if act43:
              current_confidence = (
                  act43.get("confidence_update", {}).get(
                      "new_confidence",
                      current_confidence
                  )
              )

          if act44:
              current_confidence = (
                  act44.get("confidence_update", {}).get(
                      "new_confidence",
                      current_confidence
                  )
              )

          result = {
              "act": "ACT45",
              "version": "V1",
              "name": "Adaptive Strategy Selection",
              "timestamp": datetime.now(timezone.utc).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "source_completeness": source_completeness,

              "sources": sources,

              "source_presence": source_presence,

              "adaptive_strategy_selection": {
                  "status": status,
                  "empirical_samples": empirical_samples,
                  "failure_evidence_available": failure_evidence_available,
                  "adaptation_allowed": adaptation_allowed,
                  "adaptation_candidates": len(adaptation_candidates),
                  "signal": signal,
              },

              "strategy_preferences": adaptive_preferences,

              "neutral_strategies": neutral_strategies,

              "adaptation_rules": {
                  "stable_strategy": (
                      "Increase future preference only when repeated "
                      "comparable empirical evidence supports stability."
                  ),
                  "declining_strategy": (
                      "Decrease future preference when repeated comparable "
                      "empirical evidence indicates decline."
                  ),
                  "inconsistent_strategy": (
                      "Preserve uncertainty and request further testing "
                      "instead of automatically promoting or rejecting."
                  ),
                  "insufficient_evidence": (
                      "Keep the strategy neutral and do not alter preference."
                  ),
                  "single_result": (
                      "Never modify strategy preference from a single "
                      "outcome."
                  ),
                  "prediction": (
                      "Never treat a prediction as an empirical outcome."
                  ),
                  "selection_score": (
                      "Never treat an internal selection score as evidence "
                      "of real-world strategy effectiveness."
                  ),
                  "context": (
                      "Strategy adaptation remains context-sensitive. "
                      "Evidence from one context must not automatically "
                      "override evidence from another context."
                  ),
              },

              "cognitive_separation": {
                  "strategy_failure_detection": True,
                  "adaptive_strategy_preference": True,
                  "confidence_calibration": False,
                  "action_execution": False,
                  "financial_decision": False,
              },

              "confidence_update": {
                  "status": "no_update",
                  "current_confidence": current_confidence,
                  "confidence_change": 0.0,
                  "new_confidence": current_confidence,
                  "reason": (
                      "ACT45 adapts strategy preferences from empirical "
                      "evidence but does not independently recalibrate "
                      "global confidence."
                  ),
              },

              "execution_state": {
                  "execution_permission": False,
                  "execution_authorization": False,
                  "action_execution": False,
                  "status": "learning_only",
              },

              "autonomy_state": {
                  "status": "learning_only",
                  "action_selection": True,
                  "action_outcome_evaluation": True,
                  "empirical_action_learning": True,
                  "empirical_generalization": True,
                  "strategy_failure_detection": True,
                  "adaptive_strategy_selection": True,
                  "action_execution": False,
                  "financial_actions": False,
                  "payments": False,
                  "spending": False,
                  "gemini": False,
              },

              "financial_boundary": {
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "financial_limit": 0.0,
              },

              "cognitive_learning": {
                  "capability": (
                      "Adapt future strategy preferences according to "
                      "validated empirical evidence about which strategies "
                      "remain effective, decline, or require more testing."
                  ),
                  "current_state": status,
                  "what_nox_learned": (
                      "Strategy selection should not remain static. "
                      "When repeated empirical evidence becomes available, "
                      "future strategy preferences can be adapted without "
                      "confusing adaptation with execution."
                  ),
                  "future_use": (
                      "Use validated strategy-performance evidence to "
                      "influence future action selection while preserving "
                      "context and uncertainty."
                  ),
              },

              "validation": {
                  "act40_present": source_presence["act40"],
                  "act41_present": source_presence["act41"],
                  "act42_present": source_presence["act42"],
                  "act43_present": source_presence["act43"],
                  "act44_present": source_presence["act44"],
                  "empirical_evidence_required": True,
                  "prediction_not_treated_as_outcome": True,
                  "selection_score_not_treated_as_outcome": True,
                  "single_result_not_overinterpreted": True,
                  "stable_declining_inconsistent_separated": True,
                  "context_preserved": True,
                  "insufficient_evidence_remains_neutral": True,
                  "confidence_not_artificially_increased": True,
                  "execution_not_authorized": True,
                  "financial_permission_false": True,
                  "payment_permission_false": True,
                  "spending_permission_false": True,
                  "gemini_false": True,
                  "cost_zero": True,
              },

              "next_action": (
                  "Continue collecting repeated comparable real outcomes "
                  "so adaptive strategy preferences can be validated."
              ),

              "next_cognitive_step": (
                  "ACT46 should learn to balance competing strategy "
                  "preferences when several strategies are simultaneously "
                  "supported, declining, or uncertain."
              ),
          }

          with OUTPUT.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit ACT45 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_45_adaptive_strategy_selection.json

          if git diff --cached --quiet; then
            echo "No ACT45 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT45 adaptive strategy selection"

      - name: Push ACT45 memory
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"

            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              git cherry-pick HEAD@{1} 2>/dev/null || true
            }

            if git push origin HEAD:main; then
              echo "ACT45 pushed successfully."
              exit 0
            fi

            sleep $((attempt * 5))
          done

          echo "Unable to push ACT45 after 3 attempts."
          exit 1
