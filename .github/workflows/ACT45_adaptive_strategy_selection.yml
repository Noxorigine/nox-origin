name: NØX ACT45 - Adaptive Strategy Selection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act45:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT45 V6
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          VERSION = "V6"
          ACT = "ACT45"

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          OUTPUT_JSON = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_MD = MEMORY / "nox_act_45_adaptive_strategy_selection.md"

          MEMORY.mkdir(parents=True, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def walk(node, path="$"):
              yield path, node

              if isinstance(node, dict):
                  for key, value in node.items():
                      child = f"{path}.{key}"
                      yield from walk(value, child)

              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      child = f"{path}[{index}]"
                      yield from walk(value, child)

          def normalize_text(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, (int, float, bool)):
                  return str(value)

              return None

          def clean_name(value):
              text = normalize_text(value)
              if not text:
                  return None

              if len(text) > 300:
                  text = text[:297] + "..."

              return text

          def numeric(value):
              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  if math.isfinite(float(value)):
                      return float(value)

              if isinstance(value, str):
                  try:
                      number = float(value.strip())
                      if math.isfinite(number):
                          return number
                  except Exception:
                      pass

              return None

          def strategy_key(name):
              if not isinstance(name, str):
                  return None

              text = name.lower().strip()

              aliases = {
                  "stable_strategy": "stable_strategy",
                  "declining_strategy": "declining_strategy",
                  "inconsistent_strategy": "inconsistent_strategy",
                  "adaptation_candidates": "adaptation_candidates",
                  "adaptive_strategy_preference": "adaptive_strategy_preference",
                  "strategy_preferences": "strategy_preferences",
                  "preferred_strategy": "preferred_strategy",
                  "candidate_strategies": "candidate_strategies",
                  "strategy_candidates": "strategy_candidates",
              }

              return aliases.get(text)

          # ------------------------------------------------------------
          # 1. Discover relevant memory files
          # ------------------------------------------------------------

          json_files = sorted(
              p for p in MEMORY.rglob("*.json")
              if p.name != OUTPUT_JSON.name
          )

          preferred_files = []

          priority_names = [
              "nox_act_44",
              "nox_act_45",
              "nox_act_43",
              "nox_act_42",
          ]

          for path in json_files:
              lowered = path.name.lower()
              if any(token in lowered for token in priority_names):
                  preferred_files.append(path)

          # Include recent ACT/memory evidence without imposing a fixed
          # interpretation on it.
          for path in json_files:
              if path not in preferred_files:
                  preferred_files.append(path)

          files_loaded = []
          documents = []

          for path in preferred_files[:100]:
              data = load_json(path)
              if data is None:
                  continue

              documents.append((path, data))
              files_loaded.append(str(path))

          # ------------------------------------------------------------
          # 2. Discover candidate strategies structurally
          # ------------------------------------------------------------

          candidate_fields = {
              "stable_strategy",
              "declining_strategy",
              "inconsistent_strategy",
              "adaptation_candidates",
              "adaptive_strategy_preference",
              "strategy_preferences",
              "preferred_strategy",
              "candidate_strategies",
              "strategy_candidates",
          }

          candidate_records = []
          discovery = []

          for source_path, data in documents:
              for path, value in walk(data):

                  if not path or path == "$":
                      continue

                  field = path.split(".")[-1]
                  field = field.split("[")[0]

                  if field not in candidate_fields:
                      continue

                  discovery.append({
                      "file": str(source_path),
                      "field": field,
                      "path": path,
                      "value_type": type(value).__name__,
                      "preview": (
                          value if isinstance(value, (str, int, float, bool))
                          else (
                              value[:3] if isinstance(value, list)
                              else list(value.keys())[:10]
                              if isinstance(value, dict)
                              else str(value)
                          )
                      )
                  })

                  # Only explicit strategy-bearing fields become candidates.
                  if field in {
                      "stable_strategy",
                      "declining_strategy",
                      "inconsistent_strategy",
                      "preferred_strategy",
                  }:
                      if isinstance(value, str) and value.strip():
                          candidate_records.append({
                              "name": value.strip(),
                              "source_file": str(source_path),
                              "source_field": field,
                              "source_path": path
                          })

                  elif field in {
                      "candidate_strategies",
                      "strategy_candidates",
                      "adaptation_candidates",
                  }:
                      if isinstance(value, list):
                          for item_index, item in enumerate(value):
                              item_path = f"{path}[{item_index}]"

                              if isinstance(item, str) and item.strip():
                                  candidate_records.append({
                                      "name": item.strip(),
                                      "source_file": str(source_path),
                                      "source_field": field,
                                      "source_path": item_path
                                  })

                              elif isinstance(item, dict):
                                  possible_name = (
                                      item.get("strategy")
                                      or item.get("name")
                                      or item.get("strategy_name")
                                      or item.get("preferred_strategy")
                                  )

                                  if isinstance(possible_name, str) and possible_name.strip():
                                      candidate_records.append({
                                          "name": possible_name.strip(),
                                          "source_file": str(source_path),
                                          "source_field": field,
                                          "source_path": item_path,
                                          "object": item
                                      })

          # Deduplicate candidates by normalized name.
          unique_candidates = {}

          for record in candidate_records:
              key = record["name"].strip().lower()

              if key not in unique_candidates:
                  unique_candidates[key] = record

          candidates = list(unique_candidates.values())

          # ------------------------------------------------------------
          # 3. Gather empirical evidence without inventing associations
          # ------------------------------------------------------------

          evidence_field_names = {
              "empirical_samples",
              "empirical_evidence",
              "observations",
              "results",
              "outcomes",
              "action_outcome",
              "action_outcome_evaluation",
              "strategy_result",
              "strategy_results",
              "execution_result",
              "success",
              "failure",
              "successes",
              "failures",
              "trend",
              "confidence",
              "current_confidence",
              "new_confidence",
              "confidence_change",
          }

          positive_words = {
              "success",
              "successful",
              "improved",
              "positive",
              "effective",
              "worked",
              "stable",
              "successes",
          }

          negative_words = {
              "failure",
              "failed",
              "decline",
              "declining",
              "negative",
              "ineffective",
              "worse",
              "failures",
          }

          contradictory_words = {
              "inconsistent",
              "contradictory",
              "mixed",
              "uncertain",
              "uncertainty",
          }

          def classify_outcome(value):
              text = ""

              if isinstance(value, str):
                  text = value.lower()

              elif isinstance(value, dict):
                  parts = []
                  for key, val in value.items():
                      parts.append(str(key))
                      if isinstance(val, (str, int, float, bool)):
                          parts.append(str(val))
                  text = " ".join(parts).lower()

              if any(word in text for word in contradictory_words):
                  return "contradictory"

              if any(word in text for word in positive_words):
                  return "positive"

              if any(word in text for word in negative_words):
                  return "negative"

              return "unclassified"

          def candidate_is_explicitly_related(candidate, value, path):
              candidate_name = candidate["name"].lower()

              if candidate_name in path.lower():
                  return True

              if isinstance(value, str):
                  return candidate_name in value.lower()

              if isinstance(value, dict):
                  haystack = json.dumps(value, ensure_ascii=False).lower()
                  return candidate_name in haystack

              if isinstance(value, list):
                  haystack = json.dumps(value, ensure_ascii=False).lower()
                  return candidate_name in haystack

              return False

          evaluated = []

          for candidate in candidates:
              observations = []
              numeric_metrics = {}

              for source_path, data in documents:
                  for path, value in walk(data):

                      field = path.split(".")[-1]
                      field = field.split("[")[0]

                      if field not in evidence_field_names:
                          continue

                      if not candidate_is_explicitly_related(candidate, value, path):
                          continue

                      outcome = classify_outcome(value)

                      observations.append({
                          "file": str(source_path),
                          "path": path,
                          "field": field,
                          "classification": outcome,
                          "preview": (
                              value if isinstance(value, (str, int, float, bool))
                              else str(value)[:500]
                          )
                      })

                      if isinstance(value, dict):
                          for key, val in value.items():
                              number = numeric(val)
                              if number is not None:
                                  metric_key = str(key)
                                  numeric_metrics.setdefault(metric_key, []).append({
                                      "value": number,
                                      "file": str(source_path),
                                      "path": f"{path}.{key}"
                                  })

              # Count only observations actually associated with this candidate.
              positive = sum(
                  1 for item in observations
                  if item["classification"] == "positive"
              )

              negative = sum(
                  1 for item in observations
                  if item["classification"] == "negative"
              )

              contradictory = sum(
                  1 for item in observations
                  if item["classification"] == "contradictory"
              )

              unclassified = sum(
                  1 for item in observations
                  if item["classification"] == "unclassified"
              )

              comparable = positive + negative

              if comparable >= 2:
                  if positive > negative:
                      trend = "positive"
                  elif negative > positive:
                      trend = "negative"
                  else:
                      trend = "balanced"
              elif contradictory > 0:
                  trend = "contradictory"
              else:
                  trend = "insufficient"

              # Evidence strength is categorical and derived from actual
              # observation count, never fabricated as a score.
              if comparable >= 5 and contradictory == 0:
                  evidence_strength = "strong"
              elif comparable >= 3 and contradictory == 0:
                  evidence_strength = "moderate"
              elif comparable >= 2:
                  evidence_strength = "limited"
              else:
                  evidence_strength = "insufficient"

              evaluated.append({
                  "name": candidate["name"],
                  "source_file": candidate["source_file"],
                  "source_field": candidate["source_field"],
                  "source_path": candidate["source_path"],
                  "observations": observations,
                  "observation_count": len(observations),
                  "comparable_observations": comparable,
                  "positive_observations": positive,
                  "negative_observations": negative,
                  "contradictory_observations": contradictory,
                  "unclassified_observations": unclassified,
                  "trend": trend,
                  "evidence_strength": evidence_strength,
                  "numeric_metrics": numeric_metrics,
              })

          # ------------------------------------------------------------
          # 4. Decide whether adaptation is defensible
          # ------------------------------------------------------------

          decision = "INSUFFICIENT_EVIDENCE"
          selected_strategy = None
          comparison_possible = False
          reason = ""

          candidates_with_comparable = [
              item for item in evaluated
              if item["comparable_observations"] >= 2
          ]

          if len(evaluated) == 0:
              decision = "INSUFFICIENT_EVIDENCE"
              reason = (
                  "No explicit strategy candidate with sufficient structural evidence "
                  "was found in the available memory."
              )

          elif len(candidates_with_comparable) < 2:
              decision = "INSUFFICIENT_COMPARISON"
              reason = (
                  "Explicit strategies were found, but fewer than two strategies "
                  "have at least two comparable empirical observations. "
                  "No adaptation was selected."
              )

          else:
              comparison_possible = True

              # Only compare candidates with comparable observations.
              # No arbitrary numerical weighting is introduced.
              positive_rates = []

              for item in candidates_with_comparable:
                  comparable = item["comparable_observations"]

                  if comparable <= 0:
                      continue

                  rate = item["positive_observations"] / comparable

                  positive_rates.append({
                      "candidate": item,
                      "rate": rate
                  })

              if positive_rates:
                  best_rate = max(item["rate"] for item in positive_rates)
                  winners = [
                      item for item in positive_rates
                      if abs(item["rate"] - best_rate) < 1e-12
                  ]

                  if len(winners) == 1:
                      winner = winners[0]["candidate"]

                      # Require meaningful evidence before selection.
                      if (
                          winner["comparable_observations"] >= 3
                          and winner["contradictory_observations"] == 0
                      ):
                          decision = "PRIORITIZE"
                          selected_strategy = winner["name"]
                          reason = (
                              "One strategy has the strongest observed positive "
                              "outcome rate among candidates with comparable "
                              "empirical evidence, with sufficient evidence and "
                              "no contradictory observations."
                          )
                      else:
                          decision = "INSUFFICIENT_COMPARISON"
                          reason = (
                              "A numerical difference exists, but the available "
                              "evidence is not strong enough to justify adaptation."
                          )

                  else:
                      decision = "TIE"
                      reason = (
                          "Multiple strategies have the same best observed outcome "
                          "rate. No arbitrary tie-breaking was applied."
                      )

          # ------------------------------------------------------------
          # 5. Integrity and output
          # ------------------------------------------------------------

          integrity = {
              "fabricated_candidates": False,
              "fabricated_metrics": False,
              "arbitrary_selection": False,
              "global_metrics_used_as_candidate_metrics": False,
              "missing_evidence_preserved": True,
              "qualitative_states_preserved": True,
              "recursive_discovery": True
          }

          result = {
              "act": ACT,
              "version": VERSION,
              "name": "Adaptive Strategy Selection",
              "timestamp": now(),

              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "method": {
                  "strategy": (
                      "Evidence-based adaptive strategy selection from "
                      "observed comparable empirical results"
                  ),
                  "recursive_scan": True,
                  "candidate_discovery": "explicit_structural_fields_only",
                  "evidence_association": "explicit_relationship_only",
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "minimum_comparable_observations_for_selection": 3
              },

              "source": {
                  "memory_directory": str(MEMORY),
                  "files_considered": len(files_loaded),
                  "files_loaded": files_loaded[:100]
              },

              "discovery": {
                  "strategy_field_occurrences": len(discovery),
                  "fields_found": sorted(
                      set(item["field"] for item in discovery)
                  ),
                  "paths_found": discovery[:200]
              },

              "candidate_count": len(evaluated),
              "candidates": evaluated,

              "selection": {
                  "decision": decision,
                  "selected_strategy": selected_strategy,
                  "comparison_possible": comparison_possible,
                  "reason": reason
              },

              "evidence_integrity": integrity,

              "learning": {
                  "what_nox_learned": (
                      "ACT45 V6 learned to distinguish strategy existence "
                      "from strategy performance. A strategy can be discovered "
                      "without being sufficiently evaluated. NØX must therefore "
                      "associate empirical observations with the correct strategy, "
                      "compare only genuinely comparable observations, preserve "
                      "contradictions, and refuse adaptation when evidence is weak."
                  ),
                  "next_condition": (
                      "ACT46 may arbitrate only when multiple strategies have "
                      "defensible comparable evidence."
                  )
              },

              "next_cognitive_step": (
                  "ACT46 - Strategy Arbitration"
                  if decision == "PRIORITIZE"
                  else "Remain in ACT45 until stronger empirical evidence exists"
              )
          }

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          md = f"""# NØX ACT45 V6 — Adaptive Strategy Selection

          - Timestamp: {result["timestamp"]}
          - Decision: **{decision}**
          - Selected strategy: **{selected_strategy or "none"}**
          - Candidates: **{len(evaluated)}**
          - Comparison possible: **{comparison_possible}**

          ## Principle

          ACT45 V6 separates:

          1. strategy discovery;
          2. empirical evidence;
          3. comparable observations;
          4. adaptation decision.

          Missing evidence is never replaced by an invented score.

          ## Result

          {reason}

          ## Evidence integrity

          - Fabricated candidates: `{integrity["fabricated_candidates"]}`
          - Fabricated metrics: `{integrity["fabricated_metrics"]}`
          - Arbitrary selection: `{integrity["arbitrary_selection"]}`
          - Global metrics reused as candidate metrics: `{integrity["global_metrics_used_as_candidate_metrics"]}`
          - Missing evidence preserved: `{integrity["missing_evidence_preserved"]}`

          ## Next cognitive step

          {result["next_cognitive_step"]}
          """

          OUTPUT_MD.write_text(md, encoding="utf-8")

          print(json.dumps({
              "act": ACT,
              "version": VERSION,
              "decision": decision,
              "selected_strategy": selected_strategy,
              "candidate_count": len(evaluated),
              "comparison_possible": comparison_possible,
              "output_json": str(OUTPUT_JSON),
              "output_md": str(OUTPUT_MD)
          }, indent=2))

          PY

      - name: Commit ACT45 V6
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            .github/workflows/nox-act45-adaptive-strategy-selection.yml \
            memory/nox_act_45_adaptive_strategy_selection.json \
            memory/nox_act_45_adaptive_strategy_selection.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ACT45 V6 evidence-based strategy selection"
          git push
