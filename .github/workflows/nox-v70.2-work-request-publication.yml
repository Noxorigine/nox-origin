name: NØX V70.2 - WORK_REQUEST Publication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-work-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish exactly one WORK_REQUEST proposal
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is not configured.")

          BASE_URL = "https://thecolony.ai/api/v1"

          INPUT_FILE = Path(
              "memory/nox_v70_1_work_request_publication_draft.json"
          )

          OUTPUT_FILE = Path(
              "memory/nox_v70_2_work_request_publication_result.json"
          )

          if not INPUT_FILE.exists():
              raise FileNotFoundError(
                  f"Required V70.1 file not found: {INPUT_FILE}"
              )

          with INPUT_FILE.open("r", encoding="utf-8") as f:
              draft = json.load(f)

          publication = draft["publication"]

          if publication.get("automatic_publication") is not False:
              raise RuntimeError(
                  "Safety check failed: V70.1 draft is not marked for "
                  "controlled publication."
              )

          title = publication["title"]

          body = publication["body"]

          # ---------------------------------------------------------
          # V70.2 PUBLICATION GUARD
          # ---------------------------------------------------------
          # Exactly one publication is allowed by this workflow.
          # No comments, DMs, bids or payments are performed.
          # ---------------------------------------------------------

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
              "Accept": "application/json"
          })

          # First verify the authenticated agent.
          me = session.get(
              f"{BASE_URL}/users/me",
              timeout=30
          )

          if me.status_code != 200:
              print("Authentication verification failed.")
              print("HTTP status:", me.status_code)
              print("Response:", me.text[:1000])
              me.raise_for_status()

          print("Authenticated agent successfully.")

          payload = {
              "post_type": "discussion",
              "title": title,
              "body": body
          }

          print("")
          print("Publishing ONE discussion post.")
          print("Title:", title)
          print("Post type: discussion")
          print("Automatic comments: disabled")
          print("Automatic DM: disabled")
          print("Automatic bidding: disabled")
          print("Automatic payment: disabled")
          print("Gemini: disabled")
          print("Cost: €0")
          print("")

          response = session.post(
              f"{BASE_URL}/posts",
              json=payload,
              timeout=30
          )

          if response.status_code not in (200, 201):
              print("Publication failed.")
              print("HTTP status:", response.status_code)
              print("Response:", response.text[:2000])
              response.raise_for_status()

          try:
              response_data = response.json()
          except ValueError:
              response_data = {
                  "raw_response": response.text
              }

          post_id = (
              response_data.get("id")
              or response_data.get("post_id")
              or response_data.get("data", {}).get("id")
          )

          result = {
              "version": "V70.2",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "controlled_publication",
              "status": "PUBLISHED",
              "publication": {
                  "platform": "The Colony",
                  "post_type": "discussion",
                  "title": title,
                  "post_id": post_id,
                  "http_status": response.status_code,
                  "published_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "exactly_one_publication_attempt": True,
                  "automatic_publication": True
              },
              "source": {
                  "version": "V70.1",
                  "input_file": str(INPUT_FILE)
              },
              "api_response": response_data,
              "experiment": {
                  "hypothesis": draft["experiment"]["hypothesis"],
                  "not_proven": True,
                  "community_validation_required": True
              },
              "safety": {
                  "second_publication": False,
                  "automatic_comments": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              },
              "next_stage": {
                  "version": "V71",
                  "purpose": (
                      "Observe and analyze community responses and "
                      "evaluate whether the WORK_REQUEST proposal "
                      "provides useful evidence."
                  ),
                  "no_immediate_rule_change": True
              }
          }

          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT_FILE.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("========================================")
          print("V70.2 PUBLICATION SUCCESSFUL")
          print("========================================")
          print("HTTP status:", response.status_code)
          print("Post ID:", post_id)
          print("Exactly one publication: YES")
          print("Automatic comments: NO")
          print("Automatic contact: NO")
          print("Automatic bidding: NO")
          print("Automatic payment: NO")
          print("Gemini: NO")
          print("Cost: €0")
          print("Result:", OUTPUT_FILE)

          PY

      - name: Commit publication result
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v70_2_work_request_publication_result.json

          if git diff --cached --quiet; then
            echo "No V70.2 result to commit."
          else
            git commit -m "NØX V70.2 publish WORK_REQUEST proposal"
            git push
          fi
