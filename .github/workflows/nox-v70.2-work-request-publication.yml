name: NØX V70.2 - WORK_REQUEST Publication

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v70-2-work-request-publication
  cancel-in-progress: false

jobs:
  publish-work-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Publish exactly one WORK_REQUEST proposal
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError(
                  "COLONY_API_KEY is not configured."
              )

          BASE_URL = "https://thecolony.ai/api/v1"

          INPUT_FILE = Path(
              "memory/nox_v70_1_work_request_publication_draft.json"
          )

          OUTPUT_FILE = Path(
              "memory/nox_v70_2_work_request_publication_result.json"
          )

          # =========================================================
          # V70.2 ONE-TIME PUBLICATION GUARD
          # =========================================================

          if OUTPUT_FILE.exists():
              try:
                  with OUTPUT_FILE.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      previous = json.load(f)

                  if previous.get("status") == "PUBLISHED":
                      print("")
                      print("========================================")
                      print("V70.2 ALREADY PUBLISHED")
                      print("========================================")
                      print(
                          "Second publication BLOCKED."
                      )
                      print(
                          "Existing post ID:",
                          previous.get(
                              "publication",
                              {}
                          ).get("post_id")
                      )
                      print("")
                      raise SystemExit(0)

              except json.JSONDecodeError:
                  raise RuntimeError(
                      "Existing V70.2 result file is invalid JSON. "
                      "Publication blocked for safety."
                  )

          # =========================================================
          # LOAD V70.1 APPROVED DRAFT
          # =========================================================

          if not INPUT_FILE.exists():
              raise FileNotFoundError(
                  f"Required V70.1 file not found: {INPUT_FILE}"
              )

          with INPUT_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:
              draft = json.load(f)

          publication = draft["publication"]

          title = publication["title"]
          body = publication["body"]

          # =========================================================
          # AUTHENTICATION
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
              "Accept": "application/json"
          })

          me = session.get(
              f"{BASE_URL}/users/me",
              timeout=30
          )

          if me.status_code != 200:
              print("Authentication verification failed.")
              print("HTTP status:", me.status_code)
              print("Response:", me.text[:1000])
              me.raise_for_status()

          print("Authenticated agent successfully.")

          # =========================================================
          # FIND META COLONY
          # =========================================================

          colonies_response = session.get(
              f"{BASE_URL}/colonies",
              params={"limit": 200},
              timeout=30
          )

          if colonies_response.status_code != 200:
              print("Colony discovery failed.")
              print(
                  "HTTP status:",
                  colonies_response.status_code
              )
              print(
                  "Response:",
                  colonies_response.text[:2000]
              )
              colonies_response.raise_for_status()

          colonies_data = colonies_response.json()

          if isinstance(colonies_data, list):
              colonies = colonies_data

          elif isinstance(colonies_data, dict):
              colonies = (
                  colonies_data.get("items")
                  or colonies_data.get("data")
                  or colonies_data.get("colonies")
                  or []
              )

          else:
              colonies = []

          if not isinstance(colonies, list):
              colonies = []

          meta_colony = None

          for colony in colonies:
              if not isinstance(colony, dict):
                  continue

              name = str(
                  colony.get("name", "")
              ).strip().lower()

              slug = str(
                  colony.get("slug", "")
              ).strip().lower()

              if name == "meta" or slug == "meta":
                  meta_colony = colony
                  break

          if not meta_colony:
              print("Meta colony was not found.")
              print("")
              print("Available colonies:")

              for colony in colonies:
                  if isinstance(colony, dict):
                      name = colony.get("name")
                      if name:
                          print("-", name)

              raise RuntimeError(
                  "Publication blocked safely: "
                  "Meta colony could not be identified."
              )

          colony_id = (
              meta_colony.get("id")
              or meta_colony.get("colony_id")
              or meta_colony.get("uuid")
          )

          if not colony_id:
              raise RuntimeError(
                  "Meta colony was found but no colony ID "
                  "was returned."
              )

          colony_name = meta_colony.get(
              "name",
              "Meta"
          )

          print("Target colony:", colony_name)
          print("Colony ID:", colony_id)

          # =========================================================
          # PUBLICATION PAYLOAD
          # =========================================================

          payload = {
              "colony_id": colony_id,
              "post_type": "discussion",
              "title": title,
              "body": body
          }

          print("")
          print("========================================")
          print("NØX V70.2 CONTROLLED PUBLICATION")
          print("========================================")
          print("Colony:", colony_name)
          print("Post type: discussion")
          print("Title:", title)
          print("")
          print("Publication confirmed automatically: YES")
          print("Exactly one publication: YES")
          print("Automatic comments: NO")
          print("Automatic contact: NO")
          print("Automatic bidding: NO")
          print("Automatic payment: NO")
          print("Gemini: NO")
          print("Cost: €0")
          print("")

          # =========================================================
          # PUBLISH ONE POST
          # =========================================================

          response = session.post(
              f"{BASE_URL}/posts",
              json=payload,
              timeout=30
          )

          if response.status_code not in (200, 201):
              print("Publication failed.")
              print(
                  "HTTP status:",
                  response.status_code
              )
              print(
                  "Response:",
                  response.text[:3000]
              )
              response.raise_for_status()

          try:
              response_data = response.json()

          except ValueError:
              response_data = {
                  "raw_response": response.text
              }

          # =========================================================
          # EXTRACT POST ID
          # =========================================================

          post_id = (
              response_data.get("id")
              or response_data.get("post_id")
          )

          if not post_id and isinstance(
              response_data.get("data"),
              dict
          ):
              post_id = response_data[
                  "data"
              ].get("id")

          published_at = datetime.now(
              timezone.utc
          ).isoformat()

          # =========================================================
          # SAVE PUBLICATION RESULT
          # =========================================================

          result = {
              "version": "V70.2",
              "generated_at": published_at,
              "mode": "controlled_publication",
              "status": "PUBLISHED",

              "publication": {
                  "platform": "The Colony",
                  "colony_name": colony_name,
                  "colony_id": colony_id,
                  "post_type": "discussion",
                  "title": title,
                  "post_id": post_id,
                  "http_status": response.status_code,
                  "published_at": published_at,
                  "exactly_one_publication_attempt": True,
                  "automatic_publication": True
              },

              "source": {
                  "version": "V70.1",
                  "input_file": str(INPUT_FILE)
              },

              "api_response": response_data,

              "experiment": {
                  "hypothesis": draft[
                      "experiment"
                  ][
                      "hypothesis"
                  ],
                  "not_proven": True,
                  "community_validation_required": True
              },

              "safety": {
                  "second_publication": False,
                  "automatic_comments": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              },

              "next_stage": {
                  "version": "V71",
                  "purpose": (
                      "Observe and analyze community "
                      "responses to the WORK_REQUEST "
                      "proposal."
                  ),
                  "no_immediate_rule_change": True
              }
          }

          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("========================================")
          print("V70.2 PUBLICATION SUCCESSFUL")
          print("========================================")
          print("HTTP status:", response.status_code)
          print("Post ID:", post_id)
          print("Colony:", colony_name)
          print("Exactly one publication: YES")
          print("Automatic comments: NO")
          print("Automatic contact: NO")
          print("Automatic bidding: NO")
          print("Automatic payment: NO")
          print("Gemini: NO")
          print("Cost: €0")
          print("Result:", OUTPUT_FILE)
          PY

      - name: Commit publication result
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v70_2_work_request_publication_result.json

          if git diff --cached --quiet; then
            echo "No V70.2 result to commit."
          else
            git commit -m "NØX V70.2 publish WORK_REQUEST proposal"
            git push
          fi
