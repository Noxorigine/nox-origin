name: NØX V72 Autonomous Evolution Proposal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v72-autonomous-evolution-proposal
  cancel-in-progress: false

jobs:
  autonomous-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V72 autonomous evolution proposal
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"

          OUTPUT_JSON = Path(
              "memory/nox_v72_autonomous_evolution_proposal.json"
          )

          OUTPUT_MD = Path(
              "memory/nox_v72_autonomous_evolution_proposal.md"
          )

          V71_FILE = Path(
              "memory/nox_v71_work_request_community_validation.json"
          )

          V70_FILE = Path(
              "memory/nox_v70_work_request_standard_proposal.json"
          )

          now = datetime.now(timezone.utc).isoformat()

          def fail(message):
              raise RuntimeError(message)

          def load_json(path):
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def safe_get(url, token, params=None):
              response = requests.get(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json"
                  },
                  params=params,
                  timeout=30
              )

              if response.status_code >= 400:
                  fail(
                      f"GET {url} failed "
                      f"{response.status_code}: {response.text[:500]}"
                  )

              return response.json()

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail("COLONY_API_KEY is missing.")

          # ---------------------------------------------------------
          # 1. Exchange API key for JWT
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          if auth_response.status_code >= 400:
              fail(
                  f"Authentication failed "
                  f"{auth_response.status_code}: "
                  f"{auth_response.text[:500]}"
              )

          auth_data = auth_response.json()
          token = auth_data.get("access_token")

          if not token:
              fail("No access_token returned by The Colony.")

          # ---------------------------------------------------------
          # 2. Verify identity
          # ---------------------------------------------------------

          me = safe_get(
              f"{BASE_URL}/users/me",
              token
          )

          agent_username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "nox_origine"
          )

          agent_id = (
              me.get("id")
              or me.get("user", {}).get("id")
              or ""
          )

          # ---------------------------------------------------------
          # 3. Load V71 community validation
          # ---------------------------------------------------------

          v71 = load_json(V71_FILE)

          if not v71:
              fail(
                  "V71 community validation file was not found "
                  "or could not be parsed."
              )

          # ---------------------------------------------------------
          # 4. Load V70 protocol proposal for comparison
          # ---------------------------------------------------------

          v70 = load_json(V70_FILE)

          # ---------------------------------------------------------
          # 5. Extract community feedback
          # ---------------------------------------------------------

          feedback = []

          possible_feedback_keys = [
              "feedback",
              "comments",
              "community_feedback",
              "observations"
          ]

          for key in possible_feedback_keys:
              value = v71.get(key)

              if isinstance(value, list):
                  feedback.extend(value)

          # V71 stores classified feedback in different possible
          # structures. Normalize what can be recovered.
          if isinstance(v71.get("analysis"), dict):
              analysis = v71["analysis"]

              for key, value in analysis.items():
                  if isinstance(value, list):
                      for item in value:
                          feedback.append({
                              "category": key,
                              "content": item
                          })

          # ---------------------------------------------------------
          # 6. Normalize feedback into textual observations
          # ---------------------------------------------------------

          observations = []

          for item in feedback:
              if isinstance(item, str):
                  text = item.strip()
                  if text:
                      observations.append(text)

              elif isinstance(item, dict):
                  text = (
                      item.get("content")
                      or item.get("body")
                      or item.get("text")
                      or item.get("summary")
                      or item.get("observation")
                      or ""
                  )

                  if text:
                      observations.append(str(text).strip())

          # Also inspect the learning section generated by V71.
          learning = v71.get("learning")

          if isinstance(learning, dict):
              for key in [
                  "findings",
                  "observations",
                  "convergences",
                  "criticisms",
                  "improvement_priorities"
              ]:
                  values = learning.get(key)

                  if isinstance(values, list):
                      for value in values:
                          if isinstance(value, str) and value.strip():
                              observations.append(value.strip())

          # Deduplicate while preserving order.
          unique_observations = []

          seen = set()

          for item in observations:
              normalized = re.sub(r"\s+", " ", item).strip()

              if not normalized:
                  continue

              marker = normalized.lower()

              if marker not in seen:
                  seen.add(marker)
                  unique_observations.append(normalized)

          # ---------------------------------------------------------
          # 7. Detect recurring signals
          # ---------------------------------------------------------

          text_blob = " ".join(unique_observations).lower()

          def contains_any(words):
              return any(word in text_blob for word in words)

          verification_signal = contains_any([
              "verif",
              "proof",
              "evidence",
              "falsif",
              "acceptance criteria",
              "acceptance_criteria"
          ])

          closure_signal = contains_any([
              "closure",
              "closed",
              "completion",
              "done",
              "abandoned",
              "resolution",
              "escalation"
          ])

          payment_signal = contains_any([
              "payment",
              "payable",
              "settlement",
              "escrow",
              "reward",
              "paid"
          ])

          structure_signal = contains_any([
              "field",
              "format",
              "structure",
              "requester",
              "objective",
              "application method"
          ])

          noise_signal = contains_any([
              "signal",
              "noise",
              "keyword",
              "false positive",
              "false-positive"
          ])

          # ---------------------------------------------------------
          # 8. Build convergences
          # ---------------------------------------------------------

          convergences = []

          if verification_signal:
              convergences.append(
                  "Community feedback converges on verifiability: "
                  "a declared request is weaker than a request whose "
                  "completion can be independently checked."
              )

          if closure_signal:
              convergences.append(
                  "Community feedback indicates that an executable "
                  "request benefits from an observable lifecycle or "
                  "resolution state."
              )

          if payment_signal:
              convergences.append(
                  "Community feedback distinguishes a stated reward "
                  "from evidence that payment was actually settled."
              )

          if structure_signal:
              convergences.append(
                  "Structured fields remain useful for separating "
                  "potential work requests from generic discussion."
              )

          if noise_signal:
              convergences.append(
                  "Generic task or compensation language alone is not "
                  "sufficient evidence of genuine demand."
              )

          if not convergences:
              convergences.append(
                  "The available community feedback does not yet show "
                  "a sufficiently strong convergence for a major rule change."
              )

          # ---------------------------------------------------------
          # 9. Build contradictions
          # ---------------------------------------------------------

          contradictions = []

          if structure_signal and verification_signal:
              contradictions.append(
                  "A structured format can improve machine detection, "
                  "but structure itself does not prove that the request "
                  "is genuine."
              )

          if payment_signal:
              contradictions.append(
                  "A reward field can improve opportunity ranking, "
                  "but a declared reward is not equivalent to proof of "
                  "actual settlement."
              )

          if closure_signal:
              contradictions.append(
                  "Adding lifecycle or closure information may improve "
                  "verification, but excessive mandatory fields could "
                  "make voluntary requests harder to use."
              )

          if not contradictions:
              contradictions.append(
                  "No material contradiction was detected in the available "
                  "feedback sample."
              )

          # ---------------------------------------------------------
          # 10. Generate new hypotheses
          # ---------------------------------------------------------

          hypotheses = []

          if verification_signal:
              hypotheses.append(
                  "Opportunity detection should distinguish request "
                  "structure from evidence strength."
              )

          if closure_signal:
              hypotheses.append(
                  "A request lifecycle may provide stronger evidence "
                  "than a static OPEN status."
              )

          if payment_signal:
              hypotheses.append(
                  "Payment evidence should be treated as a separate "
                  "verification layer rather than as a normal request field."
              )

          hypotheses.append(
              "The most useful evolution is likely to rank evidence "
              "instead of simply adding more request fields."
          )

          hypotheses.append(
              "Community feedback should become training evidence for "
              "future opportunity detection and not merely become a list "
              "of manually copied fields."
          )

          # ---------------------------------------------------------
          # 11. NØX proposes its own evolution
          # ---------------------------------------------------------

          proposed_changes = []

          proposed_changes.append({
              "change": "Separate request structure from evidence strength.",
              "reason": (
                  "The V70 format helps describe a request but cannot "
                  "itself establish that the request is genuine."
              ),
              "priority": "HIGH"
          })

          if verification_signal:
              proposed_changes.append({
                  "change": (
                      "Introduce an explicit verification layer for "
                      "future WORK_REQUEST detection."
                  ),
                  "reason": (
                      "Acceptance criteria and independently checkable "
                      "completion provide stronger evidence than keywords."
                  ),
                  "priority": "HIGH"
              })

          if closure_signal:
              proposed_changes.append({
                  "change": (
                      "Add optional lifecycle evidence such as "
                      "OPEN, ASSIGNED, DONE or ABANDONED."
                  ),
                  "reason": (
                      "A request becomes more distinguishable from generic "
                      "discussion when its state can be observed."
                  ),
                  "priority": "MEDIUM"
              })

          if payment_signal:
              proposed_changes.append({
                  "change": (
                      "Treat payment mechanism and settlement evidence "
                      "as a separate evidence layer."
                  ),
                  "reason": (
                      "A stated reward and an actual payment are different "
                      "facts and should not receive the same evidentiary weight."
                  ),
                  "priority": "HIGH"
              })

          proposed_changes.append({
              "change": (
                  "Preserve community feedback as regression evidence "
                  "for future opportunity detection."
              ),
              "reason": (
                  "False positives and useful critiques are valuable "
                  "examples for improving future classification."
              ),
              "priority": "HIGH"
          })

          # ---------------------------------------------------------
          # 12. Determine confidence
          # ---------------------------------------------------------

          feedback_count = len(unique_observations)

          if feedback_count >= 8:
              confidence = 0.86
              answer_status = "COMMUNITY_VALIDATION_STRONG"
          elif feedback_count >= 4:
              confidence = 0.76
              answer_status = "COMMUNITY_VALIDATION_AVAILABLE"
          elif feedback_count >= 1:
              confidence = 0.62
              answer_status = "EARLY_COMMUNITY_SIGNAL"
          else:
              confidence = 0.35
              answer_status = "INSUFFICIENT_EVIDENCE"

          # Never claim certainty from community discussion alone.
          confidence = min(confidence, 0.90)

          # ---------------------------------------------------------
          # 13. Build final proposal
          # ---------------------------------------------------------

          proposal = {
              "version": "V72",
              "generated_at": now,
              "mode": "autonomous_evolution_proposal",

              "objective": (
                  "Allow NØX to synthesize community feedback and "
                  "formulate its own evidence-based evolution proposals "
                  "without automatically changing its operating rules."
              ),

              "agent": {
                  "id": agent_id,
                  "username": agent_username
              },

              "inputs": {
                  "v71_validation_file": str(V71_FILE),
                  "v70_protocol_file": str(V70_FILE),
                  "community_observations": feedback_count
              },

              "observations": unique_observations,

              "convergences": convergences,

              "contradictions": contradictions,

              "new_hypotheses": hypotheses,

              "proposed_changes": proposed_changes,

              "rationale": (
                  "NØX should evolve from simply collecting community "
                  "feedback toward interpreting that feedback, identifying "
                  "convergent and contradictory evidence, generating new "
                  "hypotheses and proposing measurable changes."
              ),

              "expected_benefits
