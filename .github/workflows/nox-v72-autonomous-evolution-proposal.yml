name: NØX V72 Autonomous Evolution Proposal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v72-autonomous-evolution-proposal
  cancel-in-progress: false

jobs:
  autonomous-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V72 autonomous evolution proposal
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"

          OUTPUT_JSON = Path(
              "memory/nox_v72_autonomous_evolution_proposal.json"
          )

          OUTPUT_MD = Path(
              "memory/nox_v72_autonomous_evolution_proposal.md"
          )

          V71_FILE = Path(
              "memory/nox_v71_work_request_community_validation.json"
          )

          V70_FILE = Path(
              "memory/nox_v70_work_request_standard_proposal.json"
          )

          now = datetime.now(timezone.utc).isoformat()

          def fail(message):
              raise RuntimeError(message)

          def load_json(path):
              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  fail(
                      f"Unable to parse {path}: {exc}"
                  )

          def safe_get(url, token, params=None):
              response = requests.get(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json"
                  },
                  params=params,
                  timeout=30
              )

              if response.status_code >= 400:
                  fail(
                      f"GET {url} failed "
                      f"{response.status_code}: "
                      f"{response.text[:500]}"
                  )

              return response.json()

          # ---------------------------------------------------------
          # 1. API KEY
          # ---------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail("COLONY_API_KEY is missing.")

          # ---------------------------------------------------------
          # 2. EXCHANGE API KEY FOR JWT
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          if auth_response.status_code >= 400:
              fail(
                  f"Authentication failed "
                  f"{auth_response.status_code}: "
                  f"{auth_response.text[:500]}"
              )

          auth_data = auth_response.json()

          token = auth_data.get("access_token")

          if not token:
              fail("No access_token returned by The Colony.")

          # ---------------------------------------------------------
          # 3. VERIFY NØX IDENTITY
          # ---------------------------------------------------------

          me = safe_get(
              f"{BASE_URL}/users/me",
              token
          )

          agent_username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "nox_origine"
          )

          agent_id = (
              me.get("id")
              or me.get("user", {}).get("id")
              or ""
          )

          # ---------------------------------------------------------
          # 4. LOAD V71
          # ---------------------------------------------------------

          v71 = load_json(V71_FILE)

          if not v71:
              fail(
                  "V71 community validation file is missing."
              )

          # ---------------------------------------------------------
          # 5. LOAD V70
          # ---------------------------------------------------------

          v70 = load_json(V70_FILE)

          # ---------------------------------------------------------
          # 6. EXTRACT COMMUNITY FEEDBACK
          # ---------------------------------------------------------

          feedback = []

          possible_keys = [
              "feedback",
              "comments",
              "community_feedback",
              "observations"
          ]

          for key in possible_keys:
              value = v71.get(key)

              if isinstance(value, list):
                  feedback.extend(value)

          # ---------------------------------------------------------
          # 7. EXTRACT CLASSIFIED V71 ANALYSIS
          # ---------------------------------------------------------

          analysis = v71.get("analysis")

          if isinstance(analysis, dict):
              for category, values in analysis.items():

                  if not isinstance(values, list):
                      continue

                  for item in values:

                      if isinstance(item, dict):
                          entry = dict(item)

                          if "category" not in entry:
                              entry["category"] = category

                          feedback.append(entry)

                      else:
                          feedback.append({
                              "category": category,
                              "content": str(item)
                          })

          # ---------------------------------------------------------
          # 8. EXTRACT V71 LEARNING
          # ---------------------------------------------------------

          learning = v71.get("learning")

          if isinstance(learning, dict):

              learning_keys = [
                  "findings",
                  "observations",
                  "convergences",
                  "criticisms",
                  "improvement_priorities"
              ]

              for key in learning_keys:

                  values = learning.get(key)

                  if not isinstance(values, list):
                      continue

                  for value in values:

                      if isinstance(value, str):
                          feedback.append({
                              "category": key,
                              "content": value
                          })

                      elif isinstance(value, dict):
                          entry = dict(value)

                          if "category" not in entry:
                              entry["category"] = key

                          feedback.append(entry)

          # ---------------------------------------------------------
          # 9. NORMALIZE FEEDBACK
          # ---------------------------------------------------------

          observations = []

          for item in feedback:

              if isinstance(item, str):

                  text = item.strip()

                  if text:
                      observations.append(text)

                  continue

              if isinstance(item, dict):

                  text = (
                      item.get("content")
                      or item.get("body")
                      or item.get("text")
                      or item.get("summary")
                      or item.get("observation")
                      or item.get("feedback")
                      or ""
                  )

                  category = (
                      item.get("category")
                      or item.get("type")
                      or ""
                  )

                  if text:

                      if category:
                          observations.append(
                              f"[{category}] {str(text).strip()}"
                          )
                      else:
                          observations.append(
                              str(text).strip()
                          )

          # ---------------------------------------------------------
          # 10. DEDUPLICATE
          # ---------------------------------------------------------

          unique_observations = []
          seen = set()

          for item in observations:

              normalized = re.sub(
                  r"\s+",
                  " ",
                  item
              ).strip()

              if not normalized:
                  continue

              marker = normalized.lower()

              if marker in seen:
                  continue

              seen.add(marker)
              unique_observations.append(normalized)

          # ---------------------------------------------------------
          # 11. SIGNAL DETECTION
          # ---------------------------------------------------------

          text_blob = " ".join(
              unique_observations
          ).lower()

          def contains_any(words):
              return any(
                  word.lower() in text_blob
                  for word in words
              )

          verification_signal = contains_any([
              "verif",
              "proof",
              "evidence",
              "falsif",
              "acceptance criteria",
              "acceptance_criteria",
              "checkable",
              "independent"
          ])

          closure_signal = contains_any([
              "closure",
              "closed",
              "completion",
              "complete",
              "done",
              "abandoned",
              "resolution",
              "escalation",
              "assigned"
          ])

          payment_signal = contains_any([
              "payment",
              "payable",
              "settlement",
              "escrow",
              "reward",
              "paid",
              "payment method"
          ])

          structure_signal = contains_any([
              "field",
              "format",
              "structure",
              "requester",
              "objective",
              "application method",
              "task",
              "deliverable"
          ])

          noise_signal = contains_any([
              "signal",
              "noise",
              "keyword",
              "false positive",
              "false-positive",
              "generic"
          ])

          # ---------------------------------------------------------
          # 12. CONVERGENCES
          # ---------------------------------------------------------

          convergences = []

          if verification_signal:
              convergences.append(
                  "Community feedback converges on "
                  "verifiability: a declared request is weaker "
                  "than a request whose completion can be checked."
              )

          if closure_signal:
              convergences.append(
                  "Community feedback indicates that an executable "
                  "request benefits from an observable lifecycle "
                  "or resolution state."
              )

          if payment_signal:
              convergences.append(
                  "Community feedback distinguishes a stated reward "
                  "from evidence that payment was actually settled."
              )

          if structure_signal:
              convergences.append(
                  "Structured fields remain useful for separating "
                  "potential work requests from generic discussion."
              )

          if noise_signal:
              convergences.append(
                  "Generic task or compensation language alone "
                  "is insufficient evidence of genuine demand."
              )

          if not convergences:
              convergences.append(
                  "The current feedback sample does not yet show "
                  "a strong convergence for a major rule change."
              )

          # ---------------------------------------------------------
          # 13. CONTRADICTIONS
          # ---------------------------------------------------------

          contradictions = []

          if structure_signal and verification_signal:
              contradictions.append(
                  "Structure can improve machine detection, "
                  "but structure itself does not prove that a "
                  "request is genuine."
              )

          if payment_signal:
              contradictions.append(
                  "A reward field can improve opportunity ranking, "
                  "but a declared reward is not equivalent to proof "
                  "of actual settlement."
              )

          if closure_signal:
              contradictions.append(
                  "Lifecycle information can improve verification, "
                  "but too many mandatory fields could reduce "
                  "voluntary adoption."
              )

          if verification_signal:
              contradictions.append(
                  "Community feedback can identify useful evidence, "
                  "but community opinion itself is not independent proof."
              )

          if not contradictions:
              contradictions.append(
                  "No material contradiction was detected "
                  "in the available feedback."
              )

          # ---------------------------------------------------------
          # 14. NEW HYPOTHESES
          # ---------------------------------------------------------

          hypotheses = []

          if verification_signal:
              hypotheses.append(
                  "Opportunity detection should distinguish "
                  "request structure from evidence strength."
              )

          if closure_signal:
              hypotheses.append(
                  "A request lifecycle may provide stronger "
                  "evidence than a static OPEN status."
              )

          if payment_signal:
              hypotheses.append(
                  "Payment evidence should be treated as a "
                  "separate verification layer."
              )

          hypotheses.append(
              "The most useful evolution is likely to rank "
              "evidence instead of simply adding more fields."
          )

          hypotheses.append(
              "Community feedback should become reusable "
              "learning evidence for future opportunity detection."
          )

          hypotheses.append(
              "False positives should remain available as "
              "regression cases so future versions can measure "
              "whether detection actually improves."
          )

          # ---------------------------------------------------------
          # 15. NØX PROPOSED CHANGES
          # ---------------------------------------------------------

          proposed_changes = []

          proposed_changes.append({
              "change": (
                  "Separate request structure from evidence strength."
              ),
              "reason": (
                  "The V70 format describes a request but cannot "
                  "itself establish that the request is genuine."
              ),
              "priority": "HIGH"
          })

          if verification_signal:
              proposed_changes.append({
                  "change": (
                      "Introduce an explicit verification layer "
                      "for future WORK_REQUEST detection."
                  ),
                  "reason": (
                      "Acceptance criteria and independently "
                      "checkable completion provide stronger "
                      "evidence than keywords."
                  ),
                  "priority": "HIGH"
              })

          if closure_signal:
              proposed_changes.append({
                  "change": (
                      "Use optional lifecycle evidence such as "
                      "OPEN, ASSIGNED, DONE or ABANDONED."
                  ),
                  "reason": (
                      "An observable lifecycle can distinguish "
                      "an executable request from static discussion."
                  ),
                  "priority": "MEDIUM"
              })

          if payment_signal:
              proposed_changes.append({
                  "change": (
                      "Treat payment mechanism and settlement "
                      "evidence as a separate evidence layer."
                  ),
                  "reason": (
                      "A stated reward and an actual payment are "
                      "different facts and should not receive the "
                      "same evidentiary weight."
                  ),
                  "priority": "HIGH"
              })

          proposed_changes.append({
              "change": (
                  "Preserve community feedback and false positives "
                  "as regression evidence."
              ),
              "reason": (
                  "Observed mistakes and useful critiques can "
                  "measure whether future versions genuinely improve."
              ),
              "priority": "HIGH"
          })

          # ---------------------------------------------------------
          # 16. NEXT TEST
          # ---------------------------------------------------------

          next_test = {
              "purpose": (
                  "Test whether the proposed evidence layer "
                  "reduces false positives without eliminating "
                  "real or atypical opportunities."
              ),
              "minimum_checks": [
                  "Re-run historical false-positive cases.",
                  "Check whether genuine delegated requests remain detectable.",
                  "Compare evidence strength against previous versions.",
                  "Measure false-positive and false-negative changes."
              ]
          }

          # ---------------------------------------------------------
          # 17. CONFIDENCE
          # ---------------------------------------------------------

          feedback_count = len(
              unique_observations
          )

          if feedback_count >= 8:
              confidence = 0.86
              answer_status = (
                  "COMMUNITY_VALIDATION_STRONG"
              )

          elif feedback_count >= 4:
              confidence = 0.76
              answer_status = (
                  "COMMUNITY_VALIDATION_AVAILABLE"
              )

          elif feedback_count >= 1:
              confidence = 0.62
              answer_status = (
                  "EARLY_COMMUNITY_SIGNAL"
              )

          else:
              confidence = 0.35
              answer_status = (
                  "INSUFFICIENT_EVIDENCE"
              )

          confidence = min(
              confidence,
              0.90
          )

          # ---------------------------------------------------------
          # 18. FINAL PROPOSAL
          # ---------------------------------------------------------

          proposal = {
              "version": "V72",
              "generated_at": now,
              "mode": "autonomous_evolution_proposal",

              "objective": (
                  "Allow NØX to synthesize community feedback, "
                  "identify evidence patterns and formulate "
                  "its own evolution proposal."
              ),

              "agent": {
                  "id": agent_id,
                  "username": agent_username
              },

              "inputs": {
                  "v71_validation_file": str(V71_FILE),
                  "v70_protocol_file": str(V70_FILE),
                  "community_observations": feedback_count
              },

              "observations": unique_observations,

              "convergences": convergences,

              "contradictions": contradictions,

              "new_hypotheses": hypotheses,

              "proposed_changes": proposed_changes,

              "rationale": (
                  "NØX should evolve from collecting community "
                  "feedback toward interpreting evidence, "
                  "identifying convergences and contradictions, "
                  "forming hypotheses and proposing measurable "
                  "improvements."
              ),

              "expected_benefits": [
                  "Better distinction between genuine work and generic discussion.",
                  "Less dependence on simple keyword matching.",
                  "Better use of acceptance and verification evidence.",
                  "Better separation between declared rewards and actual settlement.",
                  "Reusable learning from community feedback.",
                  "Measurable evolution across future versions."
              ],

              "risks": [
                  "Overfitting to a small community sample.",
                  "Adding unnecessary structure to voluntary requests.",
                  "Treating community opinion as independent proof.",
                  "Changing detection rules before sufficient testing."
              ],

              "next_test": next_test,

              "decision": {
                  "nox_recommends_evolution": True,
                  "automatic_rule_change": False,
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "human_decision_required_before_deployment": True
              },

              "answer_status": answer_status,

              "confidence": confidence,

              "next_stage": {
                  "version": "V73",
                  "purpose": (
                      "Test NØX's proposed evolution against "
                      "historical opportunity-detection cases."
                  )
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_rule_change": False,
                  "automatic_contact": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "metadata_preserved": True,
                  "invalid_items_preserved": True,
                  "stable_id_only_deduplication": True
              }
          }

          # ---------------------------------------------------------
          # 19. WRITE JSON
          # ---------------------------------------------------------

          OUTPUT_JSON.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_JSON.write_text(
              json.dumps(
                  proposal,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 20. WRITE MARKDOWN
          # ---------------------------------------------------------

          md = []

          md.append(
              "# NØX Origin — V72 Autonomous Evolution Proposal"
          )
          md.append("")

          md.append(
              f"Generated: {now}"
          )
          md.append("")

          md.append("## Objective")
          md.append("")
          md.append(
              proposal["objective"]
          )
          md.append("")

          md.append("## Observations")
          md.append("")

          if unique_observations:

              for item in unique_observations:
                  md.append(
                      f"- {item}"
                  )

          else:

              md.append(
                  "- No usable community observation recovered."
              )

          md.append("")
          md.append("## Convergences")
          md.append("")

          for item in convergences:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## Contradictions")
          md.append("")

          for item in contradictions:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## New hypotheses")
          md.append("")

          for item in hypotheses:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## NØX proposed changes")
          md.append("")

          for item in proposed_changes:

              md.append(
                  f"### {item['priority']}"
              )

              md.append(
                  f"**Change:** {item['change']}"
              )

              md.append("")

              md.append(
                  f"**Reason:** {item['reason']}"
              )

              md.append("")

          md.append("## Next test")
          md.append("")

          md.append(
              f"**Purpose:** {next_test['purpose']}"
          )

          md.append("")

          for item in next_test["minimum_checks"]:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## Expected benefits")
          md.append("")

          for item in proposal["expected_benefits"]:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## Risks")
          md.append("")

          for item in proposal["risks"]:
              md.append(
                  f"- {item}"
              )

          md.append("")
          md.append("## Decision")
          md.append("")

          md.append(
              "NØX recommends evolution, but V72 does not "
              "modify operating rules automatically."
          )

          md.append("")

          md.append(
              "The proposal must first be tested against "
              "historical evidence."
          )

          md.append("")
          md.append("## Status")
          md.append("")

          md.append(
              f"- Answer status: {answer_status}"
          )

          md.append(
              f"- Confidence: {confidence}"
          )

          md.append(
              "- Gemini: disabled"
          )

          md.append(
              "- Project cost: €0"
          )

          OUTPUT_MD.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 21. OUTPUT SUMMARY
          # ---------------------------------------------------------

          print("")
          print("==========================================")
          print("NØX V72 AUTONOMOUS EVOLUTION PROPOSAL")
          print("==========================================")
          print(
              f"Agent: {agent_username}"
          )
          print(
              f"Observations: {feedback_count}"
          )
          print(
              f"Answer status: {answer_status}"
          )
          print(
              f"Confidence: {confidence}"
          )
          print(
              f"Proposed changes: {len(proposed_changes)}"
          )
          print(
              f"JSON: {OUTPUT_JSON}"
          )
          print(
              f"Markdown: {OUTPUT_MD}"
          )
          print(
              "Gemini: DISABLED"
          )
          print(
              "Cost: €0"
          )
          print("==========================================")

          PY

      - name: Commit V72 proposal
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v72_autonomous_evolution_proposal.json
          git add memory/nox_v72_autonomous_evolution_proposal.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add NØX V72 autonomous evolution proposal"
            git push
          fi
