name: NØX Origin - V15 Opportunity Scoring

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"

permissions:
  contents: write

jobs:
  nox-v15:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V15
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://thecolony.ai/api/v1"

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v13_file = memory_dir / "nox_v13_needs.json"
          v14_file = memory_dir / "nox_v14_opportunities.json"
          v15_file = memory_dir / "nox_v15_scores.json"

          print("======================================")
          print("NØX ORIGIN - V15 OPPORTUNITY SCORING")
          print("======================================")

          # ==========================================
          # LOAD FILES
          # ==========================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text()
                  )
              except Exception:
                  return default

          print("")
          print("[1/5] Loading NØX knowledge...")

          memory = load_json(
              memory_file,
              {}
          )

          v13_history = load_json(
              v13_file,
              []
          )

          v14_history = load_json(
              v14_file,
              []
          )

          print(
              f"V13 reports: {len(v13_history)}"
          )

          print(
              f"V14 reports: {len(v14_history)}"
          )

          # ==========================================
          # SELECT LATEST V14 REPORT
          # ==========================================

          print("")
          print("[2/5] Selecting latest opportunities...")

          if not v14_history:
              raise RuntimeError(
                  "No V14 opportunity data found"
              )

          latest_v14 = v14_history[-1]

          opportunities = latest_v14.get(
              "opportunities",
              []
          )

          if not opportunities:
              print(
                  "No opportunities detected by V14."
              )

          print(
              f"Opportunities received: "
              f"{len(opportunities)}"
          )

          # ==========================================
          # BUILD SCORES
          # ==========================================

          print("")
          print("[3/5] Calculating opportunity scores...")

          scored = []

          for opportunity in opportunities:

              category = opportunity.get(
                  "opportunity",
                  "unknown"
              )

              base_score = float(
                  opportunity.get(
                      "score",
                      0
                  )
              )

              relevance = float(
                  opportunity.get(
                      "relevance_percent",
                      0
                  )
              )

              potential = opportunity.get(
                  "potential",
                  "LOW"
              )

              # Frequency score
              frequency_score = min(
                  base_score * 2,
                  25
              )

              # Relevance score
              relevance_score = min(
                  relevance,
                  25
              )

              # Potential score
              potential_points = {
                  "HIGH": 25,
                  "MEDIUM": 15,
                  "LOW": 5
              }

              potential_score = potential_points.get(
                  potential,
                  5
              )

              # Feasibility
              feasible_categories = {
                  "automation_service",
                  "information_service",
                  "collaboration_service",
                  "technical_service",
                  "agent_support"
              }

              if category in feasible_categories:
                  feasibility_score = 15
              else:
                  feasibility_score = 8

              # Risk / complexity
              if category in {
                  "financial_opportunity",
                  "marketplace_opportunity"
              }:
                  risk_score = 5
              else:
                  risk_score = 10

              total_score = (
                  frequency_score
                  + relevance_score
                  + potential_score
                  + feasibility_score
                  + risk_score
              )

              total_score = round(
                  min(total_score, 100),
                  2
              )

              if total_score >= 75:
                  priority = "VERY_HIGH"

              elif total_score >= 60:
                  priority = "HIGH"

              elif total_score >= 40:
                  priority = "MEDIUM"

              else:
                  priority = "LOW"

              scored.append(
                  {
                      "opportunity": category,
                      "total_score": total_score,
                      "priority": priority,
                      "components": {
                          "frequency": round(
                              frequency_score,
                              2
                          ),
                          "relevance": round(
                              relevance_score,
                              2
                          ),
                          "potential": potential_score,
                          "feasibility": feasibility_score,
                          "risk_adjustment": risk_score
                      },
                      "source_potential": potential,
                      "examples": opportunity.get(
                          "examples",
                          []
                      )
                  }
              )

          scored.sort(
              key=lambda item: item["total_score"],
              reverse=True
          )

          # ==========================================
          # TEMPORAL CONFIRMATION
          # ==========================================

          print("")
          print(
              "[4/5] Checking historical persistence..."
          )

          historical_categories = {}

          for report in v14_history:

              for item in report.get(
                  "opportunities",
                  []
              ):

                  category = item.get(
                      "opportunity"
                  )

                  if category:
                      historical_categories[
                          category
                      ] = (
                          historical_categories.get(
                              category,
                              0
                          ) + 1
                      )

          for item in scored:

              category = item["opportunity"]

              history_count = historical_categories.get(
                  category,
                  0
              )

              item["historical_reports"] = (
                  history_count
              )

              if history_count >= 5:
                  persistence = "STRONG"

              elif history_count >= 3:
                  persistence = "MODERATE"

              elif history_count >= 2:
                  persistence = "EMERGING"

              else:
                  persistence = "NEW"

              item["persistence"] = persistence

              # Small bonus for persistence
              bonus = {
                  "STRONG": 10,
                  "MODERATE": 7,
                  "EMERGING": 4,
                  "NEW": 0
              }.get(
                  persistence,
                  0
              )

              item["total_score"] = round(
                  min(
                      item["total_score"] + bonus,
                      100
                  ),
                  2
              )

          scored.sort(
              key=lambda item: item["total_score"],
              reverse=True
          )

          # ==========================================
          # SAVE REPORT
          # ==========================================

          print("")
          print("[5/5] Saving V15 decision layer...")

          report = {
              "version": "V15",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "opportunities_scored": len(
                  scored
              ),
              "ranking": scored,
              "top_opportunity": (
                  scored[0]
                  if scored
                  else None
              )
          }

          v15_history = load_json(
              v15_file,
              []
          )

          v15_history.append(
              report
          )

          v15_history = v15_history[-20:]

          v15_file.write_text(
              json.dumps(
                  v15_history,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # UPDATE MEMORY
          # ==========================================

          memory["last_v15_analysis"] = (
              report["timestamp"]
          )

          memory["v15"] = {
              "opportunities_scored": len(
                  scored
              ),
              "top_opportunity": (
                  scored[0]["opportunity"]
                  if scored
                  else None
              ),
              "top_score": (
                  scored[0]["total_score"]
                  if scored
                  else 0
              ),
              "top_priority": (
                  scored[0]["priority"]
                  if scored
                  else None
              )
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("======================================")
          print("NØX V15 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Opportunities scored: "
              f"{len(scored)}"
          )

          print("")
          print("NØX PRIORITY RANKING:")

          for index, item in enumerate(
              scored,
              start=1
          ):

              print(
                  f"{index}. "
                  f"{item['opportunity']} | "
                  f"score={item['total_score']} | "
                  f"priority={item['priority']} | "
                  f"persistence={item['persistence']}"
              )

          if scored:

              print("")
              print(
                  "TOP OPPORTUNITY: "
                  f"{scored[0]['opportunity']}"
              )

              print(
                  "TOP SCORE: "
                  f"{scored[0]['total_score']}"
              )

          PY

      - name: Commit NØX V15 knowledge
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v15_scores.json

          if git diff --cached --quiet; then
            echo "No new V15 knowledge to commit."
          else
            git commit -m "NØX V15 opportunity scoring"
            git push
          fi
