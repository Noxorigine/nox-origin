name: NØX ACT25 - Decision Validation Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decision-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge impact
        run: |
          python -u <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          print("NØX ACT25 - Decision Validation Loop")
          print("Mode: DECISION VALIDATION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Web search executed: false")
          print("Research executed: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")

          ACT24_FILE = "memory/nox_act_24_knowledge_integration.json"
          CORE_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_act_25_decision_validation.json"

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Warning: could not load {path}: {exc}")
                  return default

          def normalize(value):
              return re.sub(r"\s+", " ", str(value or "").strip())

          act24 = load_json(ACT24_FILE, {})
          knowledge_core = load_json(CORE_FILE, {})

          integrated = act24.get("integrated_knowledge", [])
          pending = act24.get("pending_validation", [])

          if not isinstance(integrated, list):
              integrated = []

          if not isinstance(pending, list):
              pending = []

          print(f"Integrated knowledge received from ACT24: {len(integrated)}")
          print(f"Pending knowledge received from ACT24: {len(pending)}")

          # ------------------------------------------------------------
          # ACT25 PRINCIPLE
          # ------------------------------------------------------------
          #
          # ACT25 evaluates whether validated knowledge has produced a
          # measurable improvement in a decision or action.
          #
          # It does NOT:
          # - perform research
          # - invent decisions
          # - invent outcomes
          # - infer success without evidence
          # - execute external actions
          #
          # With no integrated knowledge or decision/result evidence,
          # the correct result is PENDING_DECISION_EVIDENCE.
          # ------------------------------------------------------------

          def extract_decision_evidence(item):
              """
              Look only for explicit decision/outcome information already
              present in the local record.

              ACT25 never creates synthetic evidence.
              """

              evidence = []

              if not isinstance(item, dict):
                  return evidence

              candidates = []

              for key in (
                  "decision_evidence",
                  "decision_records",
                  "decision_history",
                  "outcomes",
                  "results",
                  "impact_evidence",
                  "validation_evidence",
              ):
                  value = item.get(key)

                  if isinstance(value, list):
                      candidates.extend(value)

                  elif isinstance(value, dict):
                      candidates.append(value)

              for value in candidates:

                  if isinstance(value, dict):
                      decision = normalize(
                          value.get("decision")
                          or value.get("action")
                          or value.get("choice")
                      )

                      outcome = normalize(
                          value.get("outcome")
                          or value.get("result")
                          or value.get("observed_result")
                      )

                      metric = normalize(
                          value.get("metric")
                          or value.get("measurement")
                      )

                      if decision or outcome or metric:
                          evidence.append({
                              "decision": decision,
                              "outcome": outcome,
                              "metric": metric,
                              "evidence": normalize(
                                  value.get("evidence")
                                  or value.get("text")
                              ),
                          })

                  elif isinstance(value, str):
                      text = normalize(value)

                      if text:
                          evidence.append({
                              "decision": "",
                              "outcome": "",
                              "metric": "",
                              "evidence": text,
                          })

              return evidence

          def validation_status(item, evidence):
              """
              Determine the strongest defensible status without making
              unsupported claims.
              """

              if not isinstance(item, dict):
                  return "PENDING_DECISION_EVIDENCE"

              if not evidence:
                  return "PENDING_DECISION_EVIDENCE"

              has_decision = any(
                  e.get("decision") for e in evidence
              )

              has_outcome = any(
                  e.get("outcome") for e in evidence
              )

              has_metric = any(
                  e.get("metric") for e in evidence
              )

              if has_decision and has_outcome and has_metric:
                  return "IMPACT_EVIDENCE_AVAILABLE"

              if has_decision and has_outcome:
                  return "OUTCOME_EVIDENCE_AVAILABLE"

              return "DECISION_EVIDENCE_INCOMPLETE"

          def impact_assessment(status):
              if status == "IMPACT_EVIDENCE_AVAILABLE":
                  return "MEASURABLE_IMPACT_REVIEW"

              if status == "OUTCOME_EVIDENCE_AVAILABLE":
                  return "OUTCOME_REVIEW_REQUIRED"

              if status == "DECISION_EVIDENCE_INCOMPLETE":
                  return "INSUFFICIENT_EVIDENCE"

              return "NO_DECISION_EVIDENCE"

          validations = []
          pending_decision_evidence = []
          impact_candidates = []

          # ------------------------------------------------------------
          # Evaluate integrated knowledge.
          # ------------------------------------------------------------

          for index, item in enumerate(integrated, start=1):

              if not isinstance(item, dict):
                  continue

              concept = normalize(item.get("concept"))
              domain = normalize(item.get("domain"))

              priority = item.get(
                  "priority_score",
                  item.get("curiosity_score", 0)
              )

              evidence = extract_decision_evidence(item)
              status = validation_status(item, evidence)
              assessment = impact_assessment(status)

              record = {
                  "validation_id": f"act25-{index:03d}",
                  "domain": domain,
                  "concept": concept,
                  "priority_score": priority,
                  "decision_evidence_count": len(evidence),
                  "validation_status": status,
                  "impact_assessment": assessment,
                  "decision_evidence": evidence,
                  "validated_at": (
                      datetime.now(timezone.utc).isoformat()
                      if status == "IMPACT_EVIDENCE_AVAILABLE"
                      else None
                  ),
                  "validation_rule": (
                      "Decision impact requires explicit local evidence. "
                      "ACT25 does not infer improvement from knowledge alone."
                  ),
              }

              validations.append(record)

              if status == "IMPACT_EVIDENCE_AVAILABLE":
                  impact_candidates.append(record)
              else:
                  pending_decision_evidence.append(record)

          # ------------------------------------------------------------
          # Also preserve ACT24 pending knowledge.
          #
          # These items are not yet eligible for decision-impact
          # validation because ACT24 has not integrated them.
          # ------------------------------------------------------------

          pending_knowledge = []

          for index, item in enumerate(pending, start=1):

              if not isinstance(item, dict):
                  continue

              pending_knowledge.append({
                  "source": "ACT24",
                  "domain": normalize(item.get("domain")),
                  "concept": normalize(item.get("concept")),
                  "priority_score": item.get("priority_score", 0),
                  "status": "WAITING_FOR_KNOWLEDGE_VALIDATION",
                  "reason": (
                      "Knowledge has not yet been integrated by ACT24; "
                      "decision impact cannot be evaluated."
                  ),
              })

          # ------------------------------------------------------------
          # Read any previously generated ACT25 results so the loop can
          # preserve historical validation evidence without overwriting it.
          # ------------------------------------------------------------

          previous = load_json(OUTPUT_FILE, {})

          previous_validations = []

          if isinstance(previous, dict):
              previous_validations = previous.get(
                  "decision_validations",
                  []
              )

              if not isinstance(previous_validations, list):
                  previous_validations = []

          known_validation_ids = {
              item.get("validation_id")
              for item in previous_validations
              if isinstance(item, dict)
          }

          new_validations = [
              item
              for item in validations
              if item.get("validation_id") not in known_validation_ids
          ]

          # ------------------------------------------------------------
          # Build learning signals for the next ACT21 cycle.
          # ------------------------------------------------------------

          learning_signals = []

          for item in validations:

              status = item.get("validation_status")
              concept = item.get("concept")
              domain = item.get("domain")

              if status == "IMPACT_EVIDENCE_AVAILABLE":
                  signal = "DECISION_IMPACT_CAN_BE_EVALUATED"
              elif status == "OUTCOME_EVIDENCE_AVAILABLE":
                  signal = "OUTCOME_REQUIRES_FURTHER_VALIDATION"
              elif status == "DECISION_EVIDENCE_INCOMPLETE":
                  signal = "DECISION_EVIDENCE_INCOMPLETE"
              else:
                  signal = "NO_DECISION_EVIDENCE"

              learning_signals.append({
                  "domain": domain,
                  "concept": concept,
                  "signal": signal,
                  "source": "ACT25",
              })

          for item in pending_knowledge:
              learning_signals.append({
                  "domain": item.get("domain"),
                  "concept": item.get("concept"),
                  "signal": "KNOWLEDGE_NOT_YET_VALIDATED",
                  "source": "ACT24",
              })

          output = {
              "act": "ACT25",
              "name": "Decision Validation Loop",
              "version": "V1",
              "mode": "DECISION_VALIDATION_ONLY",

              "gemini_used": False,
              "external_ai_used": False,
              "api_calls": False,
              "web_search_executed": False,
              "research_executed": False,

              "marketplace_actions": False,
              "publishing": False,
              "comments": False,
              "private_messages": False,
              "bids": False,
              "payments": False,

              "project_cost_eur": 0,

              "created_at": datetime.now(timezone.utc).isoformat(),

              "input": {
                  "source": ACT24_FILE,
                  "integrated_knowledge_received": len(integrated),
                  "pending_knowledge_received": len(pending),
              },

              "validation_policy": {
                  "requires_integrated_knowledge": True,
                  "requires_explicit_decision": True,
                  "requires_observed_outcome": True,
                  "requires_measurement_for_measurable_impact": True,
                  "unsupported_inference": False,
                  "synthetic_outcomes": False,
                  "research_performed": False,
                  "unknowns_preserved": True,
              },

              "summary": {
                  "integrated_knowledge_evaluated": len(validations),
                  "pending_knowledge": len(pending_knowledge),
                  "decision_validations_created": len(validations),
                  "impact_candidates": len(impact_candidates),
                  "pending_decision_evidence": (
                      len(pending_decision_evidence)
                  ),
                  "new_validation_records": len(new_validations),
              },

              "decision_validations": (
                  previous_validations + new_validations
              ),

              "pending_decision_evidence": pending_decision_evidence,

              "pending_knowledge": pending_knowledge,

              "learning_signals_for_act21": learning_signals,

              "loop_status": (
                  "WAITING_FOR_KNOWLEDGE"
                  if not integrated and pending
                  else (
                      "WAITING_FOR_DECISION_EVIDENCE"
                      if integrated and not impact_candidates
                      else "DECISION_IMPACT_REVIEW_AVAILABLE"
                  )
              ),

              "next_cycle": {
                  "act": "ACT21",
                  "role": (
                      "Use validated learning signals to detect new "
                      "knowledge gaps and continue the learning loop."
                  ),
              },
          }

          os.makedirs("memory", exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("ACT25 RESULT")
          print(
              f"Integrated knowledge evaluated: {len(validations)}"
          )
          print(
              f"Pending knowledge: {len(pending_knowledge)}"
          )
          print(
              f"Decision validations created: {len(validations)}"
          )
          print(
              f"Impact candidates: {len(impact_candidates)}"
          )
          print(
              f"Pending decision evidence: "
              f"{len(pending_decision_evidence)}"
          )
          print(
              f"New validation records: {len(new_validations)}"
          )

          print()
          print(
              f"Loop status: {output['loop_status']}"
          )

          if pending_knowledge:
              print()
              print("Knowledge still awaiting ACT24 validation:")

              for i, item in enumerate(
                  pending_knowledge,
                  start=1
              ):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | "
                      f"{item.get('concept')}"
                  )

          if pending_decision_evidence:
              print()
              print("Decision evidence still required:")

              for i, item in enumerate(
                  pending_decision_evidence,
                  start=1
              ):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | "
                      f"{item.get('concept')} | "
                      f"{item.get('validation_status')}"
                  )

          if impact_candidates:
              print()
              print("Decision impact candidates:")

              for i, item in enumerate(
                  impact_candidates,
                  start=1
              ):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | "
                      f"{item.get('concept')} | "
                      f"{item.get('impact_assessment')}"
                  )

          print()
          print(f"Output: {OUTPUT_FILE}")
          PY

      - name: Commit ACT25 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_25_decision_validation.json

          if git diff --cached --quiet; then
            echo "No ACT25 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT25 - validate decision impact"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
