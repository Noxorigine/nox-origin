name: NØX Origin - V19 Memory Evolution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run NØX V19 Memory Evolution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import hashlib
          from datetime import datetime, timezone
          import requests
          from google import genai

          print("========================================")
          print("NØX ORIGIN - V19 MEMORY EVOLUTION")
          print("========================================")

          colony_key = os.environ.get("COLONY_API_KEY")
          gemini_key = os.environ.get("GEMINI_API_KEY")

          if not colony_key:
              raise RuntimeError("COLONY_API_KEY missing")

          if not gemini_key:
              raise RuntimeError("GEMINI_API_KEY missing")

          memory_file = "nox_memory.json"

          # ================================================
          # 1. LOAD MEMORY
          # ================================================

          if os.path.exists(memory_file):
              try:
                  with open(memory_file, "r", encoding="utf-8") as f:
                      memory = json.load(f)
              except Exception as e:
                  print("Memory could not be read:", e)
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("version", "V19")
          memory.setdefault(
              "created_at",
              datetime.now(timezone.utc).isoformat()
          )
          memory.setdefault("observations", [])
          memory.setdefault("insights", [])
          memory.setdefault("needs", [])
          memory.setdefault("opportunities", [])
          memory.setdefault("history", [])

          print("Existing observations:", len(memory["observations"]))
          print("Existing insights:", len(memory["insights"]))
          print("Existing needs:", len(memory["needs"]))
          print("Existing opportunities:", len(memory["opportunities"]))

          # ================================================
          # 2. AUTHENTICATE THE COLONY
          # ================================================

          print("Authenticating with The Colony...")

          auth = requests.post(
              "https://thecolony.cc/api/v1/auth/token",
              headers={
                  "Content-Type": "application/json"
              },
              json={
                  "api_key": colony_key
              },
              timeout=30
          )

          print("Authentication status:", auth.status_code)

          if auth.status_code != 200:
              raise RuntimeError(
                  f"The Colony authentication failed: "
                  f"{auth.status_code} {auth.text[:500]}"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError("No Colony access token returned")

          # ================================================
          # 3. FETCH COLONY DATA
          # ================================================

          print("Fetching fresh Colony data...")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          feed_response = requests.get(
              "https://thecolony.cc/api/v1/posts",
              headers=headers,
              params={
                  "limit": 20
              },
              timeout=30
          )

          print("Colony feed status:", feed_response.status_code)

          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"Colony feed failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:500]}"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("data")
                  or feed_data.get("items")
                  or []
              )
          elif isinstance(feed_data, list):
              posts = feed_data
          else:
              posts = []

          print("Fresh posts retrieved:", len(posts))

          # ================================================
          # 4. BUILD OBSERVATIONS
          # ================================================

          observations = []

          for post in posts:
              if not isinstance(post, dict):
                  continue

              text = (
                  post.get("content")
                  or post.get("body")
                  or post.get("text")
                  or ""
              )

              if not isinstance(text, str):
                  text = str(text)

              text = text.strip()

              if not text:
                  continue

              author = (
                  post.get("author")
                  or post.get("username")
                  or post.get("agent")
                  or "unknown"
              )

              if isinstance(author, dict):
                  author = (
                      author.get("username")
                      or author.get("name")
                      or "unknown"
                  )

              observations.append({
                  "author": str(author),
                  "text": text[:2000]
              })

          print("Usable observations:", len(observations))

          # ================================================
          # 5. REMOVE DUPLICATES
          # ================================================

          existing_hashes = set()

          for item in memory["observations"]:
              if not isinstance(item, dict):
                  continue

              text = str(
                  item.get("text", "")
              ).strip().lower()

              if text:
                  digest = hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()

                  existing_hashes.add(digest)

          new_observations = []

          for item in observations:

              text = item["text"].strip()

              digest = hashlib.sha256(
                  text.lower().encode("utf-8")
              ).hexdigest()

              if digest not in existing_hashes:

                  item["observed_at"] = datetime.now(
                      timezone.utc
                  ).isoformat()

                  new_observations.append(item)

                  existing_hashes.add(digest)

          print("New observations:", len(new_observations))

          memory["observations"].extend(new_observations)

          # Keep memory under control
          memory["observations"] = memory["observations"][-200:]

          # ================================================
          # 6. GEMINI ANALYSIS
          # ================================================

          gemini_success = False
          gemini_error = None

          print("Starting Gemini memory analysis...")

          try:

              client = genai.Client(
                  api_key=gemini_key
              )

              compact_context = {
                  "existing_insights": memory["insights"][-30:],
                  "existing_needs": memory["needs"][-30:],
                  "existing_opportunities":
                      memory["opportunities"][-30:],
                  "new_observations":
                      new_observations[:20]
              }

              prompt = f"""
You are NØX Origin.

Task: V19 MEMORY EVOLUTION.

Analyse only the information provided below.

Do not invent facts.
Do not invent opportunities.
Do not repeat existing information unless it has materially changed.

Identify:
1. genuinely new insights
2. recurring needs
3. potentially useful opportunities

Return ONLY valid JSON.

Required structure:

{{
  "new_insights": [],
  "new_needs": [],
  "new_opportunities": []
}}

DATA:

{json.dumps(
    compact_context,
    ensure_ascii=False,
    indent=2
)}
"""

              response = client.models.generate_content(
                  model="gemini-3.7-flash",
                  contents=prompt
              )

              raw = response.text.strip()

              print("Gemini response received.")

              if raw.startswith("```"):
                  raw = raw.replace("```json", "")
                  raw = raw.replace("```", "")
                  raw = raw.strip()

              result = json.loads(raw)

              if not isinstance(result, dict):
                  raise ValueError(
                      "Gemini returned an invalid JSON object"
                  )

              gemini_success = True

              print("Gemini analysis successful.")

          except Exception as e:

              gemini_success = False
              gemini_error = str(e)

              print("WARNING: Gemini analysis failed.")
              print("Gemini error:", gemini_error)
              print(
                  "The Colony observations will still be saved."
              )

              result = {
                  "new_insights": [],
                  "new_needs": [],
                  "new_opportunities": []
              }

          # ================================================
          # 7. MERGE RESULTS
          # ================================================

          def merge_unique(target, additions):

              if not isinstance(additions, list):
                  return

              existing = {
                  str(x).strip().lower()
                  for x in target
                  if isinstance(x, str)
              }

              for item in additions:

                  if not isinstance(item, str):
                      continue

                  item = item.strip()

                  if not item:
                      continue

                  if item.lower() not in existing:

                      target.append(item)

                      existing.add(item.lower())

          merge_unique(
              memory["insights"],
              result.get("new_insights", [])
          )

          merge_unique(
              memory["needs"],
              result.get("new_needs", [])
          )

          merge_unique(
              memory["opportunities"],
              result.get("new_opportunities", [])
          )

          memory["insights"] = memory["insights"][-100:]
          memory["needs"] = memory["needs"][-100:]
          memory["opportunities"] = memory["opportunities"][-100:]

          # ================================================
          # 8. HISTORY
          # ================================================

          history_entry = {
              "version": "V19",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "new_observations": len(
                  new_observations
              ),
              "gemini_success": gemini_success,
              "new_insights": len(
                  result.get("new_insights", [])
                  if isinstance(
                      result.get("new_insights", []),
                      list
                  )
                  else []
              ),
              "new_needs": len(
                  result.get("new_needs", [])
                  if isinstance(
                      result.get("new_needs", []),
                      list
                  )
                  else []
              ),
              "new_opportunities": len(
                  result.get("new_opportunities", [])
                  if isinstance(
                      result.get("new_opportunities", []),
                      list
                  )
                  else []
              )
          }

          if gemini_error:
              history_entry["gemini_error"] = gemini_error[:500]

          memory["history"].append(history_entry)
          memory["history"] = memory["history"][-50:]

          memory["version"] = "V19"

          memory["updated_at"] = datetime.now(
              timezone.utc
          ).isoformat()

          # ================================================
          # 9. SAVE MEMORY
          # ================================================

          with open(
              memory_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Memory successfully updated.")

          # ================================================
          # 10. SUMMARY
          # ================================================

          print("")
          print("========================================")
          print("V19 RESULT")
          print("========================================")
          print(
              "New observations:",
              len(new_observations)
          )
          print(
              "Total observations:",
              len(memory["observations"])
          )
          print(
              "Total insights:",
              len(memory["insights"])
          )
          print(
              "Total needs:",
              len(memory["needs"])
          )
          print(
              "Total opportunities:",
              len(memory["opportunities"])
          )
          print(
              "Gemini analysis:",
              "SUCCESS" if gemini_success else "FAILED"
          )
          print("========================================")

          PY

      - name: Commit updated memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX V19 - evolve memory"
            git push
          fi
