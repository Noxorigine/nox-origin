name: NØX ACT 28 - Anticipation & Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  anticipation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT28
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          print("========================================")
          print("NØX ACT28 - ANTICIPATION & SIMULATION")
          print("========================================")

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          INPUT_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_28_anticipation_simulation.json"

          API_BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY", "")

          if INPUT_FILE.exists():
              with INPUT_FILE.open("r", encoding="utf-8") as f:
                  act27 = json.load(f)
          else:
              act27 = {}

          hypotheses = act27.get("relationship_hypotheses", [])
          relationships = act27.get("relationships", [])
          analyzed_items = act27.get("analyzed_items", [])

          print(f"ACT27 relationships: {len(relationships)}")
          print(f"ACT27 hypotheses: {len(hypotheses)}")
          print(f"Items available: {len(analyzed_items)}")

          # ------------------------------------------------------------
          # Anticipation model
          # ------------------------------------------------------------

          prediction_rules = {
              "motivation_can_influence_agent_behavior": {
                  "prediction": "A change in motivation or reward may produce a change in agent behavior.",
                  "consequence_type": "behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.68,
              },
              "tasks_create_opportunities_for_agent_action": {
                  "prediction": "A relevant task may create an opportunity for an agent to act.",
                  "consequence_type": "action_opportunity",
                  "direction": "conditional",
                  "base_confidence": 0.72,
              },
              "learning_and_memory_support_adaptation": {
                  "prediction": "New learning retained in memory may improve a future response or strategy.",
                  "consequence_type": "adaptation",
                  "direction": "positive",
                  "base_confidence": 0.74,
              },
              "agents_need_communication_to_coordinate": {
                  "prediction": "Successful communication may increase the possibility of coordinated agent activity.",
                  "consequence_type": "coordination",
                  "direction": "conditional",
                  "base_confidence": 0.66,
              },
              "information_can_change_understanding": {
                  "prediction": "New information may modify an existing understanding or belief.",
                  "consequence_type": "belief_update",
                  "direction": "conditional",
                  "base_confidence": 0.70,
              },
              "interaction_can_produce_learning": {
                  "prediction": "Interaction with another agent may generate information that changes future understanding.",
                  "consequence_type": "learning",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },
              "security_can_constrain_task_execution": {
                  "prediction": "A security constraint may prevent or alter execution of an otherwise relevant task.",
                  "consequence_type": "execution_constraint",
                  "direction": "negative_or_constraining",
                  "base_confidence": 0.69,
              },
              "communication_transports_information": {
                  "prediction": "A successful communication channel may make information available for later interpretation or action.",
                  "consequence_type": "information_transfer",
                  "direction": "conditional",
                  "base_confidence": 0.65,
              },
              "reward_or_incentive_can_influence_work_behavior": {
                  "prediction": "A change in reward or incentive may alter participation or work behavior.",
                  "consequence_type": "work_behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },
          }

          def clamp(value, low=0.0, high=1.0):
              return max(low, min(high, value))

          def normalize(text):
              return re.sub(r"\s+", " ", str(text or "").strip()).lower()

          predictions = []

          for hypothesis in hypotheses:
              relation = hypothesis.get("relation") or hypothesis.get("type")
              support = int(hypothesis.get("support", 1) or 1)
              confidence = float(hypothesis.get("confidence", 0.5) or 0.5)

              rule = prediction_rules.get(relation)

              if not rule:
                  continue

              support_bonus = min(0.12, max(0, support - 1) * 0.025)
              confidence_adjustment = (confidence - 0.5) * 0.20

              predicted_confidence = clamp(
                  rule["base_confidence"]
                  + support_bonus
                  + confidence_adjustment
              )

              predictions.append({
                  "prediction_id": f"P{len(predictions) + 1:03d}",
                  "source_relation": relation,
                  "support": support,
                  "source_confidence": round(confidence, 3),
                  "prediction": rule["prediction"],
                  "consequence_type": rule["consequence_type"],
                  "direction": rule["direction"],
                  "predicted_confidence": round(predicted_confidence, 3),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ------------------------------------------------------------
          # Build short scenario chains
          # ------------------------------------------------------------

          scenarios = []

          scenario_templates = [
              {
                  "trigger": "new_information",
                  "relations": [
                      "information_can_change_understanding",
                      "learning_and_memory_support_adaptation",
                  ],
                  "scenario": (
                      "If NØX receives information that conflicts with or expands "
                      "its current understanding, it may update its understanding "
                      "and later adapt its behavior."
                  ),
                  "confidence": 0.72,
              },
              {
                  "trigger": "relevant_task",
                  "relations": [
                      "tasks_create_opportunities_for_agent_action",
                      "security_can_constrain_task_execution",
                  ],
                  "scenario": (
                      "If NØX detects a relevant task, it may have an opportunity "
                      "to act, but security or execution constraints may change "
                      "whether and how the action can occur."
                  ),
                  "confidence": 0.70,
              },
              {
                  "trigger": "agent_interaction",
                  "relations": [
                      "agents_need_communication_to_coordinate",
                      "interaction_can_produce_learning",
                  ],
                  "scenario": (
                      "If NØX interacts with another agent, communication may enable "
                      "coordination and the interaction may generate information "
                      "that changes future decisions."
                  ),
                  "confidence": 0.68,
              },
              {
                  "trigger": "reward_change",
                  "relations": [
                      "motivation_can_influence_agent_behavior",
                      "reward_or_incentive_can_influence_work_behavior",
                  ],
                  "scenario": (
                      "If the reward structure changes, agent behavior or work "
                      "participation may change as a consequence."
                  ),
                  "confidence": 0.67,
              },
          ]

          known_relations = {
              h.get("relation")
              for h in hypotheses
              if h.get("relation")
          }

          for template in scenario_templates:
              matched = [
                  relation
                  for relation in template["relations"]
                  if relation in known_relations
              ]

              if not matched:
                  continue

              coverage = len(matched) / len(template["relations"])

              scenarios.append({
                  "scenario_id": f"S{len(scenarios) + 1:03d}",
                  "trigger": template["trigger"],
                  "relations_used": matched,
                  "coverage": round(coverage, 3),
                  "scenario": template["scenario"],
                  "scenario_confidence": round(
                      clamp(template["confidence"] * (0.75 + 0.25 * coverage)),
                      3
                  ),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ------------------------------------------------------------
          # Rank what should be watched for verification
          # ------------------------------------------------------------

          verification_targets = []

          for prediction in predictions:
              priority = (
                  prediction["predicted_confidence"] * 60
                  + min(prediction["support"], 5) * 6
              )

              verification_targets.append({
                  "prediction_id": prediction["prediction_id"],
                  "priority": round(priority, 2),
                  "what_to_watch": prediction["prediction"],
                  "expected_consequence": prediction["consequence_type"],
                  "status": "awaiting_observation",
              })

          verification_targets.sort(
              key=lambda x: x["priority"],
              reverse=True
          )

          # ------------------------------------------------------------
          # Simple anticipation quality indicators
          # ------------------------------------------------------------

          if predictions:
              avg_confidence = sum(
                  p["predicted_confidence"] for p in predictions
              ) / len(predictions)
          else:
              avg_confidence = 0.0

          if scenarios:
              avg_scenario_confidence = sum(
                  s["scenario_confidence"] for s in scenarios
              ) / len(scenarios)
          else:
              avg_scenario_confidence = 0.0

          # Avoid pretending that predictions are facts.
          # ACT28 only creates hypotheses that future observations must verify.
          output = {
              "act": "ACT28",
              "name": "Anticipation & Simulation",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "input": {
                  "source": "memory/nox_act_27_relational_understanding.json",
                  "relationships": len(relationships),
                  "relationship_hypotheses": len(hypotheses),
                  "items_analyzed": len(analyzed_items),
              },
              "purpose": (
                  "Generate conditional future predictions from ACT27 "
                  "relationships before action or observation."
              ),
              "predictions": predictions,
              "scenarios": scenarios,
              "verification_targets": verification_targets[:10],
              "metrics": {
                  "predictions_generated": len(predictions),
                  "scenarios_generated": len(scenarios),
                  "average_prediction_confidence": round(avg_confidence, 3),
                  "average_scenario_confidence": round(
                      avg_scenario_confidence, 3
                  ),
                  "all_predictions_require_verification": True,
              },
              "cognitive_principle": (
                  "A prediction is a hypothesis about what may happen, "
                  "not a fact about what will happen."
              ),
              "next_step": (
                  "Observe future events and compare them with these "
                  "predictions to measure anticipation accuracy."
              ),
          }

          with OUTPUT_FILE.open("w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("----------------------------------------")
          print(f"Predictions generated: {len(predictions)}")
          print(f"Scenarios generated: {len(scenarios)}")
          print("----------------------------------------")

          for prediction in predictions[:10]:
              print(
                  f"[{prediction['prediction_id']}] "
                  f"{prediction['predicted_confidence']:.2f} "
                  f"{prediction['prediction']}"
              )

          print("----------------------------------------")
          print("SCENARIOS:")

          for scenario in scenarios:
              print(
                  f"[{scenario['scenario_id']}] "
                  f"{scenario['scenario_confidence']:.2f} "
                  f"{scenario['scenario']}"
              )

          print("----------------------------------------")
          print("VERIFICATION TARGETS:")

          for target in verification_targets[:5]:
              print(
                  f"- {target['priority']:.2f} | "
                  f"{target['what_to_watch']}"
              )

          print(f"Memory written: {OUTPUT_FILE}")

          # ------------------------------------------------------------
          # Commit memory
          # ------------------------------------------------------------

          os.system("git config user.name 'NØX'")
          os.system("git config user.email 'nox@users.noreply.github.com'")

          os.system("git add memory/nox_act_28_anticipation_simulation.json")

          status = os.system(
              "git diff --cached --quiet -- "
              "memory/nox_act_28_anticipation_simulation.json"
          )

          if status != 0:
              os.system(
                  "git commit -m 'NØX ACT28: anticipation and simulation memory'"
              )

              pushed = False

              for attempt in range(5):
                  result = os.system("git push origin HEAD:main")

                  if result == 0:
                      pushed = True
                      break

                  print(
                      f"Push attempt {attempt + 1} failed; "
                      "synchronizing before retry..."
                  )

                  os.system("git fetch origin main")
                  os.system("git rebase origin/main")

                  time.sleep(2)

              if not pushed:
                  raise SystemExit("Unable to push ACT28 memory after retries.")

          else:
              print("No memory changes to commit.")
          PY
