name: NØX ACT 28 - Anticipation & Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  anticipation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT28
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          print("========================================")
          print("NØX ACT28 - ANTICIPATION & SIMULATION")
          print("========================================")

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          INPUT_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_28_anticipation_simulation.json"

          if not INPUT_FILE.exists():
              raise SystemExit(
                  f"ACT27 memory not found: {INPUT_FILE}"
              )

          with INPUT_FILE.open("r", encoding="utf-8") as f:
              act27 = json.load(f)

          # ------------------------------------------------------------
          # ACT27 compatibility layer
          # ------------------------------------------------------------

          raw_hypotheses = act27.get("relationship_hypotheses", [])

          if not raw_hypotheses:
              raw_hypotheses = act27.get("hypotheses", [])

          raw_relationships = act27.get("relationships", [])

          if not isinstance(raw_hypotheses, list):
              raw_hypotheses = []

          if not isinstance(raw_relationships, list):
              raw_relationships = []

          print(f"ACT27 hypotheses found: {len(raw_hypotheses)}")
          print(f"ACT27 relationships found: {len(raw_relationships)}")

          # ACT27 may use different field names depending on version.
          # Normalize every hypothesis into:
          # relation / support / confidence
          normalized_hypotheses = []

          for item in raw_hypotheses:
              if not isinstance(item, dict):
                  continue

              relation = (
                  item.get("relation")
                  or item.get("relationship")
                  or item.get("type")
                  or item.get("name")
              )

              if not relation:
                  continue

              support = item.get("support", 1)
              confidence = item.get("confidence", 0.5)

              try:
                  support = int(support)
              except Exception:
                  support = 1

              try:
                  confidence = float(confidence)
              except Exception:
                  confidence = 0.5

              normalized_hypotheses.append({
                  "relation": str(relation),
                  "support": max(1, support),
                  "confidence": max(0.0, min(1.0, confidence)),
              })

          # If the hypotheses are absent but relationship objects exist,
          # normalize those as a fallback.
          if not normalized_hypotheses:
              for item in raw_relationships:
                  if not isinstance(item, dict):
                      continue

                  relation = (
                      item.get("relation")
                      or item.get("relationship")
                      or item.get("type")
                      or item.get("name")
                  )

                  if not relation:
                      continue

                  try:
                      support = int(item.get("support", 1))
                  except Exception:
                      support = 1

                  try:
                      confidence = float(item.get("confidence", 0.5))
                  except Exception:
                      confidence = 0.5

                  normalized_hypotheses.append({
                      "relation": str(relation),
                      "support": max(1, support),
                      "confidence": max(0.0, min(1.0, confidence)),
                  })

          # Remove duplicates while keeping the strongest evidence.
          merged = {}

          for item in normalized_hypotheses:
              relation = item["relation"]

              if relation not in merged:
                  merged[relation] = item
              else:
                  merged[relation]["support"] = max(
                      merged[relation]["support"],
                      item["support"]
                  )
                  merged[relation]["confidence"] = max(
                      merged[relation]["confidence"],
                      item["confidence"]
                  )

          hypotheses = list(merged.values())

          print(f"Normalized hypotheses: {len(hypotheses)}")

          # ------------------------------------------------------------
          # Anticipation rules
          # ------------------------------------------------------------

          prediction_rules = {
              "motivation_can_influence_agent_behavior": {
                  "prediction": (
                      "A change in motivation or reward may produce "
                      "a change in agent behavior."
                  ),
                  "consequence_type": "behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.68,
              },

              "tasks_create_opportunities_for_agent_action": {
                  "prediction": (
                      "A relevant task may create an opportunity "
                      "for an agent to act."
                  ),
                  "consequence_type": "action_opportunity",
                  "direction": "conditional",
                  "base_confidence": 0.72,
              },

              "learning_and_memory_support_adaptation": {
                  "prediction": (
                      "New learning retained in memory may improve "
                      "a future response or strategy."
                  ),
                  "consequence_type": "adaptation",
                  "direction": "positive",
                  "base_confidence": 0.74,
              },

              "agents_need_communication_to_coordinate": {
                  "prediction": (
                      "Successful communication may increase the "
                      "possibility of coordinated agent activity."
                  ),
                  "consequence_type": "coordination",
                  "direction": "conditional",
                  "base_confidence": 0.66,
              },

              "information_can_change_understanding": {
                  "prediction": (
                      "New information may modify an existing "
                      "understanding or belief."
                  ),
                  "consequence_type": "belief_update",
                  "direction": "conditional",
                  "base_confidence": 0.70,
              },

              "interaction_can_produce_learning": {
                  "prediction": (
                      "Interaction with another agent may generate "
                      "information that changes future understanding."
                  ),
                  "consequence_type": "learning",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },

              "security_can_constrain_task_execution": {
                  "prediction": (
                      "A security constraint may prevent or alter "
                      "execution of an otherwise relevant task."
                  ),
                  "consequence_type": "execution_constraint",
                  "direction": "constraining",
                  "base_confidence": 0.69,
              },

              "communication_transports_information": {
                  "prediction": (
                      "A successful communication channel may make "
                      "information available for later interpretation "
                      "or action."
                  ),
                  "consequence_type": "information_transfer",
                  "direction": "conditional",
                  "base_confidence": 0.65,
              },

              "reward_or_incentive_can_influence_work_behavior": {
                  "prediction": (
                      "A change in reward or incentive may alter "
                      "participation or work behavior."
                  ),
                  "consequence_type": "work_behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },

              "shared_domain": {
                  "prediction": (
                      "Two events sharing a domain may be relevant "
                      "to the same area of understanding, but this "
                      "does not by itself imply causation."
                  ),
                  "consequence_type": "contextual_relevance",
                  "direction": "neutral",
                  "base_confidence": 0.55,
              },
          }

          def clamp(value, low=0.0, high=1.0):
              return max(low, min(high, value))

          # ------------------------------------------------------------
          # Generate predictions
          # ------------------------------------------------------------

          predictions = []

          for hypothesis in hypotheses:
              relation = hypothesis["relation"]
              support = hypothesis["support"]
              source_confidence = hypothesis["confidence"]

              rule = prediction_rules.get(relation)

              if not rule:
                  print(
                      f"Skipping unsupported relation: {relation}"
                  )
                  continue

              support_bonus = min(
                  0.12,
                  max(0, support - 1) * 0.025
              )

              confidence_adjustment = (
                  source_confidence - 0.5
              ) * 0.20

              predicted_confidence = clamp(
                  rule["base_confidence"]
                  + support_bonus
                  + confidence_adjustment
              )

              predictions.append({
                  "prediction_id": f"P{len(predictions) + 1:03d}",
                  "source_relation": relation,
                  "support": support,
                  "source_confidence": round(
                      source_confidence,
                      3
                  ),
                  "prediction": rule["prediction"],
                  "consequence_type": rule["consequence_type"],
                  "direction": rule["direction"],
                  "predicted_confidence": round(
                      predicted_confidence,
                      3
                  ),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ------------------------------------------------------------
          # Scenario simulation
          # ------------------------------------------------------------

          known_relations = {
              h["relation"]
              for h in hypotheses
          }

          scenario_templates = [
              {
                  "trigger": "new_information",
                  "relations": [
                      "information_can_change_understanding",
                      "learning_and_memory_support_adaptation",
                  ],
                  "scenario": (
                      "If NØX receives information that conflicts with "
                      "or expands its current understanding, it may "
                      "update its understanding and later adapt "
                      "its behavior."
                  ),
                  "confidence": 0.72,
              },

              {
                  "trigger": "relevant_task",
                  "relations": [
                      "tasks_create_opportunities_for_agent_action",
                      "security_can_constrain_task_execution",
                  ],
                  "scenario": (
                      "If NØX detects a relevant task, it may have "
                      "an opportunity to act, but security or execution "
                      "constraints may change whether and how the "
                      "action can occur."
                  ),
                  "confidence": 0.70,
              },

              {
                  "trigger": "agent_interaction",
                  "relations": [
                      "agents_need_communication_to_coordinate",
                      "interaction_can_produce_learning",
                  ],
                  "scenario": (
                      "If NØX interacts with another agent, communication "
                      "may enable coordination and the interaction may "
                      "generate information that changes future decisions."
                  ),
                  "confidence": 0.68,
              },

              {
                  "trigger": "reward_change",
                  "relations": [
                      "motivation_can_influence_agent_behavior",
                      "reward_or_incentive_can_influence_work_behavior",
                  ],
                  "scenario": (
                      "If the reward structure changes, agent behavior "
                      "or work participation may change as a consequence."
                  ),
                  "confidence": 0.67,
              },
          ]

          scenarios = []

          for template in scenario_templates:
              matched = [
                  relation
                  for relation in template["relations"]
                  if relation in known_relations
              ]

              if not matched:
                  continue

              coverage = len(matched) / len(
                  template["relations"]
              )

              scenario_confidence = clamp(
                  template["confidence"]
                  * (0.75 + 0.25 * coverage)
              )

              scenarios.append({
                  "scenario_id": f"S{len(scenarios) + 1:03d}",
                  "trigger": template["trigger"],
                  "relations_used": matched,
                  "coverage": round(coverage, 3),
                  "scenario": template["scenario"],
                  "scenario_confidence": round(
                      scenario_confidence,
                      3
                  ),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ------------------------------------------------------------
          # Verification targets
          # ------------------------------------------------------------

          verification_targets = []

          for prediction in predictions:
              priority = (
                  prediction["predicted_confidence"] * 60
                  + min(prediction["support"], 5) * 6
              )

              verification_targets.append({
                  "prediction_id": prediction["prediction_id"],
                  "priority": round(priority, 2),
                  "what_to_watch": prediction["prediction"],
                  "expected_consequence": (
                      prediction["consequence_type"]
                  ),
                  "status": "awaiting_observation",
              })

          verification_targets.sort(
              key=lambda x: x["priority"],
              reverse=True
          )

          if predictions:
              avg_prediction_confidence = sum(
                  p["predicted_confidence"]
                  for p in predictions
              ) / len(predictions)
          else:
              avg_prediction_confidence = 0.0

          if scenarios:
              avg_scenario_confidence = sum(
                  s["scenario_confidence"]
                  for s in scenarios
              ) / len(scenarios)
          else:
              avg_scenario_confidence = 0.0

          # ------------------------------------------------------------
          # Output
          # ------------------------------------------------------------

          output = {
              "act": "ACT28",
              "name": "Anticipation & Simulation",
              "timestamp_utc": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "input": {
                  "source": (
                      "memory/"
                      "nox_act_27_relational_understanding.json"
                  ),
                  "raw_hypotheses": len(raw_hypotheses),
                  "raw_relationships": len(raw_relationships),
                  "normalized_hypotheses": len(hypotheses),
              },

              "purpose": (
                  "Generate conditional future predictions from "
                  "ACT27 relational hypotheses before future "
                  "events are observed."
              ),

              "predictions": predictions,
              "scenarios": scenarios,
              "verification_targets": verification_targets[:10],

              "metrics": {
                  "predictions_generated": len(predictions),
                  "scenarios_generated": len(scenarios),
                  "average_prediction_confidence": round(
                      avg_prediction_confidence,
                      3
                  ),
                  "average_scenario_confidence": round(
                      avg_scenario_confidence,
                      3
                  ),
                  "all_predictions_require_verification": True,
              },

              "cognitive_principle": (
                  "A prediction is a hypothesis about what may happen, "
                  "not a fact about what will happen."
              ),

              "next_step": (
                  "Observe future events and compare them with these "
                  "predictions. Prediction accuracy will become evidence "
                  "for ACT29 metacognition."
              ),
          }

          with OUTPUT_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("----------------------------------------")
          print(
              f"Raw ACT27 hypotheses: {len(raw_hypotheses)}"
          )
          print(
              f"Normalized hypotheses: {len(hypotheses)}"
          )
          print(
              f"Predictions generated: {len(predictions)}"
          )
          print(
              f"Scenarios generated: {len(scenarios)}"
          )
          print("----------------------------------------")

          for prediction in predictions[:10]:
              print(
                  f"[{prediction['prediction_id']}] "
                  f"{prediction['predicted_confidence']:.2f} "
                  f"{prediction['prediction']}"
              )

          print("----------------------------------------")
          print("SCENARIOS:")

          for scenario in scenarios:
              print(
                  f"[{scenario['scenario_id']}] "
                  f"{scenario['scenario_confidence']:.2f} "
                  f"{scenario['scenario']}"
              )

          print("----------------------------------------")
          print("VERIFICATION TARGETS:")

          for target in verification_targets[:5]:
              print(
                  f"- {target['priority']:.2f} | "
                  f"{target['what_to_watch']}"
              )

          print(
              f"Memory written: {OUTPUT_FILE}"
          )

          # ------------------------------------------------------------
          # Commit and push
          # ------------------------------------------------------------

          os.system(
              "git config user.name 'NØX'"
          )

          os.system(
              "git config user.email "
              "'nox@users.noreply.github.com'"
          )

          os.system(
              f"git add {OUTPUT_FILE}"
          )

          diff_status = os.system(
              f"git diff --cached --quiet -- {OUTPUT_FILE}"
          )

          if diff_status != 0:
              os.system(
                  "git commit -m "
                  "'NØX ACT28: anticipation and simulation memory'"
              )

              pushed = False

              for attempt in range(5):
                  result = os.system(
                      "git push origin HEAD:main"
                  )

                  if result == 0:
                      pushed = True
                      break

                  print(
                      f"Push attempt {attempt + 1} failed; "
                      "synchronizing before retry..."
                  )

                  fetch_result = os.system(
                      "git fetch origin main"
                  )

                  if fetch_result != 0:
                      print("git fetch failed.")
                      time.sleep(2)
                      continue

                  rebase_result = os.system(
                      "git rebase origin/main"
                  )

                  if rebase_result != 0:
                      print(
                          "git rebase failed; aborting rebase."
                      )
                      os.system(
                          "git rebase --abort"
                      )
                      time.sleep(2)
                      continue

                  time.sleep(2)

              if not pushed:
                  raise SystemExit(
                      "Unable to push ACT28 memory "
                      "after retries."
                  )
          else:
              print(
                  "No ACT28 memory changes to commit."
              )

          print("========================================")
          print("ACT28 COMPLETE")
          print("========================================")
          PY
