name: NØX ACT 28 - Anticipation & Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  anticipation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run ACT28
        run: |
          python <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          print("========================================")
          print("NØX ACT28 - ANTICIPATION & SIMULATION")
          print("========================================")

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          INPUT_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_28_anticipation_simulation.json"

          if not INPUT_FILE.exists():
              raise SystemExit(
                  f"ACT27 memory not found: {INPUT_FILE}"
              )

          with INPUT_FILE.open("r", encoding="utf-8") as f:
              act27 = json.load(f)

          # ============================================================
          # READ ACT27 EXACT STRUCTURE
          # ============================================================

          hypotheses = act27.get("relationship_hypotheses", [])
          relation_counts = act27.get("relation_counts", {})
          concept_graph = act27.get("concept_graph", {})

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(relation_counts, dict):
              relation_counts = {}

          if not isinstance(concept_graph, dict):
              concept_graph = {}

          print(f"ACT27 hypotheses found: {len(hypotheses)}")
          print(f"ACT27 relation counts: {len(relation_counts)}")
          print(f"ACT27 concepts: {len(concept_graph)}")

          # ============================================================
          # ANTICIPATION KNOWLEDGE
          # ============================================================

          prediction_rules = {
              "motivation_can_influence_agent_behavior": {
                  "trigger": "change_in_motivation_or_reward",
                  "prediction": (
                      "A change in motivation or reward may produce "
                      "a change in agent behavior."
                  ),
                  "consequence": "behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.68,
              },

              "tasks_create_opportunities_for_agent_action": {
                  "trigger": "relevant_task_detected",
                  "prediction": (
                      "A relevant task may create an opportunity "
                      "for an agent to act."
                  ),
                  "consequence": "action_opportunity",
                  "direction": "conditional",
                  "base_confidence": 0.72,
              },

              "learning_and_memory_support_adaptation": {
                  "trigger": "new_learning_retained",
                  "prediction": (
                      "Learning retained in memory may improve "
                      "a future response or strategy."
                  ),
                  "consequence": "adaptation",
                  "direction": "positive",
                  "base_confidence": 0.74,
              },

              "agents_need_communication_to_coordinate": {
                  "trigger": "agent_communication",
                  "prediction": (
                      "Successful communication may increase "
                      "the possibility of coordinated activity."
                  ),
                  "consequence": "coordination",
                  "direction": "conditional",
                  "base_confidence": 0.66,
              },

              "information_can_change_understanding": {
                  "trigger": "new_relevant_information",
                  "prediction": (
                      "New information may modify an existing "
                      "understanding or belief."
                  ),
                  "consequence": "belief_update",
                  "direction": "conditional",
                  "base_confidence": 0.70,
              },

              "interaction_can_produce_learning": {
                  "trigger": "interaction_with_another_agent",
                  "prediction": (
                      "Interaction with another agent may generate "
                      "information that changes future understanding."
                  ),
                  "consequence": "learning",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },

              "security_can_constrain_task_execution": {
                  "trigger": "security_constraint",
                  "prediction": (
                      "A security constraint may prevent or alter "
                      "execution of an otherwise relevant task."
                  ),
                  "consequence": "execution_constraint",
                  "direction": "constraining",
                  "base_confidence": 0.69,
              },

              "communication_transports_information": {
                  "trigger": "communication_event",
                  "prediction": (
                      "Successful communication may make information "
                      "available for later interpretation or action."
                  ),
                  "consequence": "information_transfer",
                  "direction": "conditional",
                  "base_confidence": 0.65,
              },

              "reward_or_incentive_can_influence_work_behavior": {
                  "trigger": "reward_or_incentive_change",
                  "prediction": (
                      "A change in reward or incentive may alter "
                      "participation or work behavior."
                  ),
                  "consequence": "work_behavior_change",
                  "direction": "conditional",
                  "base_confidence": 0.67,
              },

              "security_constraints_can_affect_communication": {
                  "trigger": "communication_security_constraint",
                  "prediction": (
                      "A security constraint may restrict, delay "
                      "or alter communication."
                  ),
                  "consequence": "communication_constraint",
                  "direction": "constraining",
                  "base_confidence": 0.64,
              },

              "shared_domain": {
                  "trigger": "related_domain_event",
                  "prediction": (
                      "Events sharing a domain may deserve joint "
                      "attention, but shared context alone does "
                      "not establish causation."
                  ),
                  "consequence": "contextual_relevance",
                  "direction": "neutral",
                  "base_confidence": 0.55,
              },
          }

          # ============================================================
          # NORMALIZE EXACT ACT27 HYPOTHESES
          # ============================================================

          normalized = []

          for item in hypotheses:
              if not isinstance(item, dict):
                  continue

              relation = item.get("hypothesis")

              if not relation:
                  continue

              try:
                  support = int(
                      item.get(
                          "supporting_observations",
                          1
                      )
                  )
              except Exception:
                  support = 1

              try:
                  confidence = float(
                      item.get(
                          "confidence",
                          0.5
                      )
                  )
              except Exception:
                  confidence = 0.5

              normalized.append({
                  "relation": relation,
                  "support": max(1, support),
                  "confidence": max(
                      0.0,
                      min(1.0, confidence)
                  ),
                  "status": item.get(
                      "status",
                      "hypothesis"
                  ),
              })

          print(
              f"Normalized hypotheses: {len(normalized)}"
          )

          if not normalized:
              raise SystemExit(
                  "ACT28 could not normalize ACT27 hypotheses."
              )

          # ============================================================
          # GENERATE PREDICTIONS
          # ============================================================

          predictions = []

          for item in normalized:
              relation = item["relation"]

              rule = prediction_rules.get(relation)

              if not rule:
                  print(
                      f"Warning: no anticipation rule for "
                      f"{relation}"
                  )
                  continue

              support = item["support"]
              source_confidence = item["confidence"]

              support_bonus = min(
                  0.12,
                  max(0, support - 1) * 0.025
              )

              confidence_adjustment = (
                  source_confidence - 0.5
              ) * 0.20

              predicted_confidence = min(
                  0.95,
                  max(
                      0.0,
                      rule["base_confidence"]
                      + support_bonus
                      + confidence_adjustment
                  )
              )

              predictions.append({
                  "prediction_id": (
                      f"P{len(predictions) + 1:03d}"
                  ),
                  "source_hypothesis": relation,
                  "trigger": rule["trigger"],
                  "supporting_observations": support,
                  "source_confidence": round(
                      source_confidence,
                      3
                  ),
                  "prediction": rule["prediction"],
                  "expected_consequence": (
                      rule["consequence"]
                  ),
                  "direction": rule["direction"],
                  "predicted_confidence": round(
                      predicted_confidence,
                      3
                  ),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ============================================================
          # BUILD MULTI-STEP SCENARIOS
          # ============================================================

          known = {
              item["relation"]
              for item in normalized
          }

          scenario_templates = [
              {
                  "id": "S001",
                  "trigger": "new_information",
                  "required": [
                      "information_can_change_understanding",
                      "learning_and_memory_support_adaptation",
                  ],
                  "scenario": (
                      "If NØX receives new information that changes "
                      "its understanding, that updated understanding "
                      "may be retained in memory and influence "
                      "a later strategy or response."
                  ),
                  "base_confidence": 0.73,
              },

              {
                  "id": "S002",
                  "trigger": "relevant_marketplace_task",
                  "required": [
                      "tasks_create_opportunities_for_agent_action",
                      "security_can_constrain_task_execution",
                  ],
                  "scenario": (
                      "If NØX detects a relevant task, it may gain "
                      "an opportunity to act; however, security "
                      "constraints may change whether or how the "
                      "task can be executed."
                  ),
                  "base_confidence": 0.70,
              },

              {
                  "id": "S003",
                  "trigger": "agent_interaction",
                  "required": [
                      "agents_need_communication_to_coordinate",
                      "interaction_can_produce_learning",
                  ],
                  "scenario": (
                      "If NØX communicates with another agent, "
                      "communication may enable coordination and "
                      "the interaction may produce information "
                      "that changes future understanding."
                  ),
                  "base_confidence": 0.68,
              },

              {
                  "id": "S004",
                  "trigger": "reward_change",
                  "required": [
                      "motivation_can_influence_agent_behavior",
                      "reward_or_incentive_can_influence_work_behavior",
                  ],
                  "scenario": (
                      "If the reward or incentive structure changes, "
                      "agent behavior or work participation may change."
                  ),
                  "base_confidence": 0.67,
              },

              {
                  "id": "S005",
                  "trigger": "communication_constraint",
                  "required": [
                      "communication_transports_information",
                      "security_constraints_can_affect_communication",
                  ],
                  "scenario": (
                      "If NØX depends on communication to obtain "
                      "information but a security constraint affects "
                      "that communication, information transfer "
                      "may be reduced or altered."
                  ),
                  "base_confidence": 0.64,
              },
          ]

          scenarios = []

          for template in scenario_templates:
              matched = [
                  relation
                  for relation in template["required"]
                  if relation in known
              ]

              if not matched:
                  continue

              coverage = (
                  len(matched)
                  / len(template["required"])
              )

              confidence = min(
                  0.95,
                  template["base_confidence"]
                  * (
                      0.75
                      + 0.25 * coverage
                  )
              )

              scenarios.append({
                  "scenario_id": template["id"],
                  "trigger": template["trigger"],
                  "relations_used": matched,
                  "coverage": round(
                      coverage,
                      3
                  ),
                  "scenario": template["scenario"],
                  "scenario_confidence": round(
                      confidence,
                      3
                  ),
                  "status": "unverified",
                  "verification_required": True,
              })

          # ============================================================
          # VERIFICATION TARGETS
          # ============================================================

          verification_targets = []

          for prediction in predictions:
              priority = (
                  prediction["predicted_confidence"]
                  * 60
                  + min(
                      prediction[
                          "supporting_observations"
                      ],
                      5
                  ) * 6
              )

              verification_targets.append({
                  "prediction_id": (
                      prediction["prediction_id"]
                  ),
                  "priority": round(
                      priority,
                      2
                  ),
                  "trigger_to_watch": (
                      prediction["trigger"]
                  ),
                  "expected_consequence": (
                      prediction[
                          "expected_consequence"
                      ]
                  ),
                  "prediction": (
                      prediction["prediction"]
                  ),
                  "status": "awaiting_observation",
              })

          verification_targets.sort(
              key=lambda x: x["priority"],
              reverse=True
          )

          # ============================================================
          # METRICS
          # ============================================================

          if predictions:
              average_prediction_confidence = (
                  sum(
                      p["predicted_confidence"]
                      for p in predictions
                  )
                  / len(predictions)
              )
          else:
              average_prediction_confidence = 0.0

          if scenarios:
              average_scenario_confidence = (
                  sum(
                      s["scenario_confidence"]
                      for s in scenarios
                  )
                  / len(scenarios)
              )
          else:
              average_scenario_confidence = 0.0

          # ============================================================
          # OUTPUT
          # ============================================================

          output = {
              "act": "ACT28",
              "name": "Anticipation & Simulation",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Use ACT27 relational hypotheses to construct "
                  "conditional future predictions and scenarios "
                  "before future events are observed."
              ),

              "principle": (
                  "A prediction is a hypothesis about what may "
                  "happen, not a fact about what will happen."
              ),

              "source_act": "ACT27",

              "input": {
                  "relationship_hypotheses": len(
                      hypotheses
                  ),
                  "normalized_hypotheses": len(
                      normalized
                  ),
                  "relation_types": len(
                      relation_counts
                  ),
                  "concepts": len(
                      concept_graph
                  ),
              },

              "predictions": predictions,

              "scenarios": scenarios,

              "verification_targets": (
                  verification_targets[:10]
              ),

              "metrics": {
                  "predictions_generated": len(
                      predictions
                  ),
                  "scenarios_generated": len(
                      scenarios
                  ),
                  "verification_targets": len(
                      verification_targets
                  ),
                  "average_prediction_confidence": round(
                      average_prediction_confidence,
                      3
                  ),
                  "average_scenario_confidence": round(
                      average_scenario_confidence,
                      3
                  ),
                  "all_predictions_require_verification": True,
              },

              "relation_counts_used": relation_counts,

              "cognitive_principle": (
                  "Anticipation becomes useful only when future "
                  "observations can be compared with previous "
                  "predictions."
              ),

              "next_cognitive_step": (
                  "ACT29 should compare predictions with observed "
                  "outcomes, identify successful and failed "
                  "anticipations, and use those results to improve "
                  "NØX's understanding of its own strengths and errors."
              ),
          }

          with OUTPUT_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # DISPLAY
          # ============================================================

          print("----------------------------------------")
          print(
              f"Raw ACT27 hypotheses: "
              f"{len(hypotheses)}"
          )
          print(
              f"Normalized hypotheses: "
              f"{len(normalized)}"
          )
          print(
              f"Predictions generated: "
              f"{len(predictions)}"
          )
          print(
              f"Scenarios generated: "
              f"{len(scenarios)}"
          )
          print("----------------------------------------")

          print("PREDICTIONS:")

          for prediction in predictions:
              print(
                  f"[{prediction['prediction_id']}] "
                  f"{prediction['predicted_confidence']:.2f} "
                  f"{prediction['source_hypothesis']}"
              )
              print(
                  f"    IF: "
                  f"{prediction['trigger']}"
              )
              print(
                  f"    THEN: "
                  f"{prediction['prediction']}"
              )

          print("----------------------------------------")
          print("SCENARIOS:")

          for scenario in scenarios:
              print(
                  f"[{scenario['scenario_id']}] "
                  f"{scenario['scenario_confidence']:.2f} "
                  f"{scenario['trigger']}"
              )
              print(
                  f"    {scenario['scenario']}"
              )

          print("----------------------------------------")
          print("VERIFICATION TARGETS:")

          for target in verification_targets[:5]:
              print(
                  f"- {target['priority']:.2f} | "
                  f"{target['trigger_to_watch']} -> "
                  f"{target['expected_consequence']}"
              )

          print("----------------------------------------")
          print(
              f"Memory written: {OUTPUT_FILE}"
          )

          # ============================================================
          # COMMIT AND PUSH
          # ============================================================

          os.system(
              "git config user.name 'NØX'"
          )

          os.system(
              "git config user.email "
              "'nox@users.noreply.github.com'"
          )

          os.system(
              f"git add {OUTPUT_FILE}"
          )

          diff_status = os.system(
              f"git diff --cached --quiet -- {OUTPUT_FILE}"
          )

          if diff_status != 0:
              commit_result = os.system(
                  "git commit -m "
                  "'NØX ACT28: anticipation and simulation memory'"
              )

              if commit_result != 0:
                  raise SystemExit(
                      "ACT28 commit failed."
                  )

              pushed = False

              for attempt in range(5):
                  result = os.system(
                      "git push origin HEAD:main"
                  )

                  if result == 0:
                      pushed = True
                      print(
                          "Push successful."
                      )
                      break

                  print(
                      f"Push attempt {attempt + 1} failed; "
                      "synchronizing before retry..."
                  )

                  fetch_result = os.system(
                      "git fetch origin main"
                  )

                  if fetch_result != 0:
                      print(
                          "git fetch failed."
                      )
                      time.sleep(2)
                      continue

                  rebase_result = os.system(
                      "git rebase origin/main"
                  )

                  if rebase_result != 0:
                      print(
                          "git rebase failed; "
                          "aborting rebase."
                      )
                      os.system(
                          "git rebase --abort"
                      )
                      time.sleep(2)
                      continue

                  time.sleep(2)

              if not pushed:
                  raise SystemExit(
                      "Unable to push ACT28 memory "
                      "after retries."
                  )
          else:
              print(
                  "No ACT28 memory changes to commit."
              )

          print("========================================")
          print("ACT28 COMPLETE")
          print("========================================")
          PY
