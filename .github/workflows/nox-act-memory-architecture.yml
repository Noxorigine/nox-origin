name: NØX ACT Memory Architecture V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-memory-architecture-v1
  cancel-in-progress: false

jobs:
  memory-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Inspect current memory
        run: |
          python - <<'PY'
          import json
          import os

          path = "nox_memory.json"

          if not os.path.exists(path):
              print("ERROR: nox_memory.json not found")
              raise SystemExit(1)

          size = os.path.getsize(path)
          print(f"Memory file: {path}")
          print(f"Size: {size:,} bytes")

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Root type: {type(data).__name__}")

          if isinstance(data, dict):
              print("Root keys:")
              for key in list(data.keys())[:50]:
                  print(f"  - {key}")

          elif isinstance(data, list):
              print(f"Root list entries: {len(data)}")

          print("Inspection completed.")
          PY

      - name: Run memory migration
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import re
          from datetime import datetime, timezone

          SOURCE = "nox_memory.json"
          MEMORY_DIR = "memory"
          ACTS_DIR = os.path.join(MEMORY_DIR, "acts")
          ARCHIVE_DIR = os.path.join(MEMORY_DIR, "archive")
          INDEX = os.path.join(MEMORY_DIR, "index.json")

          os.makedirs(ACTS_DIR, exist_ok=True)
          os.makedirs(ARCHIVE_DIR, exist_ok=True)

          with open(SOURCE, "r", encoding="utf-8") as f:
              data = json.load(f)

          # ---------------------------------------------------------
          # 1. Preserve the original memory
          # ---------------------------------------------------------

          archive_path = os.path.join(ARCHIVE_DIR, "nox_memory.json")

          if not os.path.exists(archive_path):
              shutil.copy2(SOURCE, archive_path)
              print("Original memory archived.")
          else:
              print("Archive already exists. Original archive preserved.")

          # ---------------------------------------------------------
          # 2. Convert root structure into searchable records
          # ---------------------------------------------------------

          records = []

          if isinstance(data, list):
              records = data

          elif isinstance(data, dict):

              # Common container names
              possible_lists = [
                  "acts",
                  "runs",
                  "history",
                  "memory",
                  "events",
                  "entries",
                  "records"
              ]

              found = False

              for key in possible_lists:
                  value = data.get(key)

                  if isinstance(value, list):
                      records = value
                      print(f"Using records from root key: {key}")
                      found = True
                      break

              # If no obvious list exists, inspect all root values
              if not found:
                  for key, value in data.items():
                      if isinstance(value, list):
                          records.extend(value)

              # If still nothing, inspect the dictionary itself
              if not records:
                  records = [data]

          # ---------------------------------------------------------
          # 3. Detect ACT identifiers
          # ---------------------------------------------------------

          act_pattern = re.compile(
              r"\bACT[\s_-]*(\d+)\b",
              re.IGNORECASE
          )

          acts = {}

          def find_text(value):
              if isinstance(value, str):
                  return value

              if isinstance(value, dict):
                  return " ".join(
                      find_text(v) for v in value.values()
                  )

              if isinstance(value, list):
                  return " ".join(
                      find_text(v) for v in value
                  )

              return str(value)

          for record in records:

              text = find_text(record)

              matches = act_pattern.findall(text)

              for number in matches:

                  act_number = int(number)
                  act_id = f"ACT_{act_number:02d}"

                  # Keep first complete matching record.
                  if act_id not in acts:
                      acts[act_id] = record

          # ---------------------------------------------------------
          # 4. Write individual ACT files
          # ---------------------------------------------------------

          for act_id, record in sorted(
              acts.items(),
              key=lambda x: int(x[0].split("_")[1])
          ):

              path = os.path.join(
                  ACTS_DIR,
                  act_id.lower() + ".json"
              )

              output = {
                  "act_id": act_id,
                  "extracted_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "source": "nox_memory.json",
                  "data": record
              }

              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      output,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          # ---------------------------------------------------------
          # 5. Create lightweight index
          # ---------------------------------------------------------

          index = {
              "version": "NØX Memory Architecture V1",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": SOURCE,
              "archive": archive_path,
              "acts": {}
          }

          for act_id in sorted(
              acts.keys(),
              key=lambda x: int(x.split("_")[1])
          ):

              index["acts"][act_id] = {
                  "file": f"acts/{act_id.lower()}.json",
                  "status": "migrated"
              }

          with open(INDEX, "w", encoding="utf-8") as f:
              json.dump(
                  index,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ---------------------------------------------------------
          # 6. Report
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("NØX MEMORY MIGRATION")
          print("========================================")
          print(f"Records inspected : {len(records)}")
          print(f"ACTs detected     : {len(acts)}")
          print(f"Archive           : {archive_path}")
          print(f"Index             : {INDEX}")
          print("========================================")

          if acts:
              print("Detected ACTs:")
              for act_id in sorted(
                  acts.keys(),
                  key=lambda x: int(x.split("_")[1])
              ):
                  print(f"  - {act_id}")
          else:
              print("WARNING: No ACT identifiers detected.")

          PY

      - name: Validate generated memory
        run: |
          python - <<'PY'
          import json
          import os

          index_path = "memory/index.json"

          if not os.path.exists(index_path):
              raise SystemExit("ERROR: index.json was not created")

          with open(index_path, "r", encoding="utf-8") as f:
              index = json.load(f)

          print("Index validation: OK")
          print(f"ACT count: {len(index.get('acts', {}))}")

          for act_id, info in index.get("acts", {}).items():
              path = os.path.join("memory", info["file"])

              if not os.path.exists(path):
                  raise SystemExit(
                      f"ERROR: Missing file for {act_id}: {path}"
                  )

          print("All indexed ACT files validated successfully.")
          PY

      - name: Commit memory architecture
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "ACT Memory Architecture V1"
            git push
          fi
