name: NØX ACT Memory Architecture SAFE V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-act-memory-architecture-safe-v1
  cancel-in-progress: false

jobs:
  inspect-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect NØX memory
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          candidates = [
              Path("nox_memory.json"),
              Path("memory/nox_memory.json")
          ]

          memory_file = None

          for path in candidates:
              if path.exists():
                  memory_file = path
                  break

          if memory_file is None:
              print("ERROR: nox_memory.json was not found.")
              print("")
              print("Files containing 'memory' in their name:")
              for path in Path(".").rglob("*memory*"):
                  if path.is_file():
                      print(f"  - {path}")
              raise SystemExit(1)

          print("=" * 70)
          print("NØX MEMORY ARCHITECTURE — SAFE INSPECTION")
          print("=" * 70)
          print(f"File: {memory_file}")
          print(f"Size: {memory_file.stat().st_size:,} bytes")

          with memory_file.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Root type: {type(data).__name__}")

          if isinstance(data, dict):
              print("")
              print("ROOT KEYS:")
              for key in data.keys():
                  print(f"  - {key}")

          elif isinstance(data, list):
              print(f"Root list length: {len(data)}")

          print("")
          print("SEARCHING FOR ACT IDENTIFIERS...")
          print("")

          pattern = re.compile(
              r"\bACT[\s_-]*(\d+)\b",
              re.IGNORECASE
          )

          found = {}

          def scan(value, location="root"):
              if isinstance(value, dict):
                  for key, item in value.items():
                      scan(item, f"{location}.{key}")

              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      scan(item, f"{location}[{i}]")

              elif isinstance(value, str):
                  for match in pattern.finditer(value):
                      number = int(match.group(1))
                      act = f"ACT_{number:02d}"

                      if act not in found:
                          found[act] = []

                      if len(found[act]) < 5:
                          found[act].append(location)

          scan(data)

          if found:
              for act in sorted(
                  found,
                  key=lambda x: int(x.split("_")[1])
              ):
                  print(
                      f"  {act}: "
                      f"{', '.join(found[act])}"
                  )
          else:
              print("  No ACT identifiers detected.")

          print("")
          print("=" * 70)
          print("MEMORY SUMMARY")
          print("=" * 70)

          def count_nodes(value):
              if isinstance(value, dict):
                  return 1 + sum(
                      count_nodes(v)
                      for v in value.values()
                  )

              if isinstance(value, list):
                  return 1 + sum(
                      count_nodes(v)
                      for v in value
                  )

              return 1

          print(f"Total JSON nodes: {count_nodes(data):,}")
          print(f"ACT identifiers: {len(found)}")

          if found:
              numbers = sorted(
                  int(act.split("_")[1])
                  for act in found
              )

              print(f"Lowest ACT: ACT_{numbers[0]:02d}")
              print(f"Highest ACT: ACT_{numbers[-1]:02d}")

          print("")
          print("SAFE MODE:")
          print("  - No files modified")
          print("  - No files created")
          print("  - No files deleted")
          print("  - No Git push")
          print("  - No Gemini/API call")
          print("")
          print("Inspection completed successfully.")
          PY
