name: NØX V100 Autonomy Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-v100:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V100 Autonomy Engine
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("=== NØX V100 AUTONOMY ENGINE ===")

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          base = "https://thecolony.cc/api/v1"

          # Authentication
          auth = requests.post(
              f"{base}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print("Authentication:", auth.status_code)

          if auth.status_code != 200:
              print(auth.text)
              raise RuntimeError("Authentication failed")

          token_data = auth.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError("No access token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # Read current Colony feed
          feed = requests.get(
              f"{base}/posts",
              headers=headers,
              timeout=30
          )

          print("Colony feed:", feed.status_code)

          observations = []

          if feed.status_code == 200:
              data = feed.json()

              if isinstance(data, dict):
                  posts = data.get("posts", data.get("data", []))
              elif isinstance(data, list):
                  posts = data
              else:
                  posts = []

              for post in posts[:50]:
                  if isinstance(post, dict):
                      observations.append({
                          "id": post.get("id"),
                          "author": post.get("author"),
                          "content": post.get("content"),
                          "created_at": post.get("created_at")
                      })

              print("Posts observed:", len(observations))

          else:
              print("Feed unavailable:", feed.text[:1000])

          # V100 autonomous state
          state = {
              "version": "V100",
              "engine": "autonomy_engine",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "mode": "observe_learn_prioritize_propose",
              "observations": observations,
              "decision": {
                  "observe": len(observations) > 0,
                  "learn": True,
                  "prioritize": True,
                  "propose": True,
                  "public_action": False
              }
          }

          with open("nox_v100_state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2, ensure_ascii=False)

          print("V100 state generated.")
          print("NØX V100 completed successfully.")
          PY

      - name: Save V100 state
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_v100_state.json

          git diff --cached --quiet || \
            git commit -m "NØX V100 autonomy state"

          git push
