name: NØX Origin - DM Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dm-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: NØX DM Diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          print("========================================")
          print("NØX ORIGIN - DM DIAGNOSTIC V2")
          print("========================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"

          # --------------------------------------------------
          # HELPERS
          # --------------------------------------------------

          def print_json(title, data):
              print()
              print(title)
              print("----------------------------------------")
              try:
                  print(
                      json.dumps(
                          data,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
              except Exception:
                  print(data)

          # --------------------------------------------------
          # 1. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("[1] Authenticating with The Colony...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(f"Authentication status: {auth.status_code}")

          if not auth.ok:
              print_json(
                  "Authentication error:",
                  auth.text
              )
              raise SystemExit(
                  "Authentication failed."
              )

          auth_data = auth.json()

          token = auth_data.get("access_token")

          if not token:
              raise SystemExit(
                  "Authentication succeeded but no access token was returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # --------------------------------------------------
          # 2. VERIFY NØX IDENTITY
          # --------------------------------------------------

          print()
          print("[2] Checking NØX identity...")

          me = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )

          print(f"Identity status: {me.status_code}")

          if not me.ok:
              print_json(
                  "Identity error:",
                  me.text
              )
              raise SystemExit(
                  "Unable to verify NØX identity."
              )

          me_data = me.json()

          print(
              f"Authenticated agent: "
              f"@{me_data.get('username', 'unknown')}"
          )

          print(
              f"Karma: "
              f"{me_data.get('karma', 'unknown')}"
          )

          # --------------------------------------------------
          # 3. READ DIRECT CONVERSATION WITH ROMU
          # --------------------------------------------------

          print()
          print("[3] Reading direct conversation with @Romu...")

          conversation_url = (
              f"{BASE}/messages/conversations/Romu"
          )

          conversation = requests.get(
              conversation_url,
              headers=headers,
              timeout=30
          )

          print(
              f"Conversation status: "
              f"{conversation.status_code}"
          )

          if conversation.ok:

              conversation_data = conversation.json()

              print_json(
                  "Raw conversation response:",
                  conversation_data
              )

              # --------------------------------------------------
              # TRY TO IDENTIFY MESSAGE LIST
              # --------------------------------------------------

              messages = []

              if isinstance(conversation_data, list):

                  messages = conversation_data

              elif isinstance(conversation_data, dict):

                  for key in (
                      "messages",
                      "items",
                      "conversation",
                      "data"
                  ):

                      value = conversation_data.get(key)

                      if isinstance(value, list):

                          messages = value
                          break

              print()
              print(
                  f"Messages found in conversation: "
                  f"{len(messages)}"
              )

              if messages:

                  print()
                  print("========== DM CONVERSATION ==========")

                  for index, message in enumerate(
                      messages,
                      1
                  ):

                      print()
                      print(f"DM #{index}")
                      print("----------------------------------")

                      if not isinstance(
                          message,
                          dict
                      ):

                          print(message)
                          continue

                      print(
                          f"ID: "
                          f"{message.get('id')}"
                      )

                      print(
                          f"From: "
                          f"{message.get('sender_username', message.get('from'))}"
                      )

                      print(
                          f"To: "
                          f"{message.get('recipient_username', message.get('to'))}"
                      )

                      print(
                          f"Created: "
                          f"{message.get('created_at')}"
                      )

                      body = message.get(
                          "body",
                          message.get(
                              "content",
                              ""
                          )
                      )

                      print(
                          f"Body: {body}"
                      )

                  # --------------------------------------------------
                  # SEARCH FOR ROMU'S TEST MESSAGES
                  # --------------------------------------------------

                  print()
                  print(
                      "========== SEARCHING FOR ROMU TEST MESSAGES =========="
                  )

                  test_phrases = [
                      "hello nox",
                      "comment ca va",
                      "comment ça va",
                      "je suis ton fondateur",
                      "plus d autonomie",
                      "plus d'autonomie"
                  ]

                  found = []

                  for message in messages:

                      if not isinstance(
                          message,
                          dict
                      ):
                          continue

                      body = str(
                          message.get(
                              "body",
                              message.get(
                                  "content",
                                  ""
                              )
                          )
                      ).lower()

                      for phrase in test_phrases:

                          if phrase in body:

                              found.append(
                                  message
                              )
                              break

                  print(
                      f"Matching test messages: "
                      f"{len(found)}"
                  )

                  if found:

                      print()
                      print(
                          ">>> IMPORTANT: "
                          "NØX CAN READ THE TEST MESSAGES."
                      )

                      for message in found:

                          print(
                              json.dumps(
                                  message,
                                  ensure_ascii=False,
                                  indent=2
                              )
                          )

                  else:

                      print()
                      print(
                          ">>> The conversation exists, "
                          "but the test messages were not found."
                      )

              else:

                  print()
                  print(
                      ">>> Conversation endpoint succeeded "
                      "but no message list was detected."
                  )

          else:

              print_json(
                  "Conversation endpoint error:",
                  conversation.text
              )

              print()
              print(
                  ">>> Direct conversation could not be read."
              )

          # --------------------------------------------------
          # 4. CHECK SUGGESTIONS
          # --------------------------------------------------

          print()
          print("[4] Checking NØX suggestions...")

          suggestions_response = requests.get(
              f"{BASE}/suggestions",
              headers=headers,
              params={"limit": 50},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          if suggestions_response.ok:

              suggestions_data = (
                  suggestions_response.json()
              )

              suggestions = []

              if isinstance(
                  suggestions_data,
                  dict
              ):

                  suggestions = (
                      suggestions_data.get(
                          "suggestions",
                          suggestions_data.get(
                              "items",
                              []
                          )
                      )
                  )

              if not isinstance(
                  suggestions,
                  list
              ):

                  suggestions = []

              print(
                  f"Suggestions available: "
                  f"{len(suggestions)}"
              )

              dm_related = []

              for suggestion in suggestions:

                  if not isinstance(
                      suggestion,
                      dict
                  ):
                      continue

                  text = json.dumps(
                      suggestion,
                      ensure_ascii=False
                  ).lower()

                  if (
                      "dm" in text
                      or "message" in text
                      or "reply" in text
                      or "conversation" in text
                  ):

                      dm_related.append(
                          suggestion
                      )

              print(
                  f"DM/message-related suggestions: "
                  f"{len(dm_related)}"
              )

              if dm_related:

                  print()
                  print(
                      "========== DM-RELATED SUGGESTIONS =========="
                  )

                  for suggestion in dm_related:

                      print_json(
                          "Suggestion:",
                          suggestion
                      )

              else:

                  print()
                  print(
                      "No DM/message-related suggestion detected."
                  )

          else:

              print_json(
                  "Suggestions error:",
                  suggestions_response.text
              )

          # --------------------------------------------------
          # 5. TEST /SINCE WITHOUT FAILING THE WORKFLOW
          # --------------------------------------------------

          print()
          print("[5] Testing /since endpoint...")

          since = requests.get(
              f"{BASE}/since",
              headers=headers,
              timeout=30
          )

          print(
              f"/since status: "
              f"{since.status_code}"
          )

          if since.ok:

              since_data = since.json()

              print_json(
                  "Raw /since response:",
                  since_data
              )

              messages = []

              if isinstance(
                  since_data,
                  dict
              ):

                  messages = since_data.get(
                      "messages",
                      []
                  )

              if not isinstance(
                  messages,
                  list
              ):

                  messages = []

              print()
              print(
                  f"/since messages detected: "
                  f"{len(messages)}"
              )

          else:

              print()
              print(
                  "WARNING: /since returned an error."
              )

              print(
                  "This does NOT fail the diagnostic."
              )

              print_json(
                  "/since error response:",
                  since.text
              )

          # --------------------------------------------------
          # 6. FINAL DIAGNOSIS
          # --------------------------------------------------

          print()
          print("========================================")
          print("NØX DM DIAGNOSTIC V2 COMPLETED")
          print("========================================")

          print()
          print("READ-ONLY TEST")

          print("- No DM was sent.")
          print("- No post was created.")
          print("- No comment was created.")
          print("- No vote was performed.")
          print("- No memory was modified.")
          print("- No Colony action was executed.")

          print()
          print("The purpose of this diagnostic is only")
          print("to determine whether NØX can RECEIVE and")
          print("READ messages sent by @Romu.")

          print()
          print("========================================")
          print("END")
          print("========================================")
          PY
