name: NØX Origin - DM Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dm-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: NØX DM Diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          print("========================================")
          print("NØX ORIGIN - DM DIAGNOSTIC")
          print("========================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"

          # --------------------------------------------------
          # 1. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("[1] Authenticating with The Colony...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(f"Authentication status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # --------------------------------------------------
          # 2. IDENTIFY NØX
          # --------------------------------------------------

          print()
          print("[2] Checking NØX identity...")

          me = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )

          print(f"Identity status: {me.status_code}")
          me.raise_for_status()

          me_data = me.json()

          print(
              f"Authenticated agent: "
              f"@{me_data.get('username', 'unknown')}"
          )

          print(
              f"Karma: "
              f"{me_data.get('karma', 'unknown')}"
          )

          # --------------------------------------------------
          # 3. CHECK NEW ACTIVITY
          # --------------------------------------------------

          print()
          print("[3] Checking /since for new activity...")

          since = requests.get(
              f"{BASE}/since",
              headers=headers,
              timeout=30
          )

          print(f"/since status: {since.status_code}")
          since.raise_for_status()

          since_data = since.json()

          print()
          print("Raw /since result:")
          print(
              json.dumps(
                  since_data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # --------------------------------------------------
          # 4. DISPLAY DETECTED DMS
          # --------------------------------------------------

          print()
          print("[4] Searching for incoming direct messages...")

          messages = since_data.get("messages", [])

          if not isinstance(messages, list):
              messages = []

          print(f"Messages detected: {len(messages)}")

          if messages:

              print()
              print("========== DETECTED DMs ==========")

              for index, message in enumerate(messages, 1):

                  if not isinstance(message, dict):
                      print(f"DM {index}: invalid format")
                      continue

                  print()
                  print(f"DM #{index}")
                  print("----------------------------------")

                  print(
                      f"ID: "
                      f"{message.get('id')}"
                  )

                  print(
                      f"From: "
                      f"{message.get('sender_username', message.get('from'))}"
                  )

                  print(
                      f"To: "
                      f"{message.get('recipient_username', message.get('to'))}"
                  )

                  print(
                      f"Created: "
                      f"{message.get('created_at')}"
                  )

                  print(
                      f"Body: "
                      f"{message.get('body', message.get('content', ''))}"
                  )

          else:

              print()
              print("NO DIRECT MESSAGE DETECTED.")

          # --------------------------------------------------
          # 5. READ ROMU CONVERSATION
          # --------------------------------------------------

          print()
          print("[5] Reading conversation with @Romu...")

          conversation = requests.get(
              f"{BASE}/messages/conversations/Romu",
              headers=headers,
              timeout=30
          )

          print(
              f"Conversation status: "
              f"{conversation.status_code}"
          )

          if conversation.ok:

              conversation_data = conversation.json()

              print()
              print("========== @ROMU CONVERSATION ==========")

              print(
                  json.dumps(
                      conversation_data,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          else:

              print(
                  "Conversation endpoint returned an error:"
              )

              print(conversation.text)

          # --------------------------------------------------
          # 6. SUGGESTIONS
          # --------------------------------------------------

          print()
          print("[6] Checking suggestions...")

          suggestions = requests.get(
              f"{BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          if suggestions.ok:

              suggestions_data = suggestions.json()

              print()
              print("Suggestions containing DM/message references:")

              found = False

              items = []

              if isinstance(suggestions_data, dict):
                  items = suggestions_data.get(
                      "suggestions",
                      suggestions_data.get("items", [])
                  )

              if isinstance(items, list):

                  for item in items:

                      if not isinstance(item, dict):
                          continue

                      text = json.dumps(
                          item,
                          ensure_ascii=False
                      ).lower()

                      if (
                          "message" in text
                          or "dm" in text
                          or "reply" in text
                      ):
                          print(
                              json.dumps(
                                  item,
                                  ensure_ascii=False,
                                  indent=2
                              )
                          )
                          found = True

              if not found:
                  print("No DM-related suggestion found.")

          # --------------------------------------------------
          # 7. FINAL DIAGNOSIS
          # --------------------------------------------------

          print()
          print("========================================")
          print("NØX DM DIAGNOSTIC COMPLETED")
          print("========================================")

          print()
          print("IMPORTANT:")
          print("- No message was sent.")
          print("- No post was created.")
          print("- No comment was created.")
          print("- No NØX memory was modified.")
          print("- This workflow is READ-ONLY.")

          print()
          print("Interpretation:")
          print("If your messages appear above,")
          print("NØX CAN RECEIVE/READ your DMs.")
          print()
          print("If they do not appear,")
          print("we investigate the DM/API path next.")
          PY
