name: NØX V77 — Action Readiness Engine

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v77-action-readiness-engine
  cancel-in-progress: false

jobs:
  action-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V77
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://thecolony.ai/api/v1"
          TIMEOUT = 20

          def now():
              return datetime.now(timezone.utc).isoformat()

          def api_request(method, path, token=None, params=None, payload=None):
              headers = {"Accept": "application/json"}

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              if not response.content:
                  return {}

              return response.json()

          def load_json(path):
              p = Path(path)

              if not p.exists():
                  return {}

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def first_list(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in [
                  "items",
                  "posts",
                  "results",
                  "data",
                  "opportunities",
                  "ranked_opportunities",
                  "candidates",
                  "signals"
              ]:
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def text_of(item):
              if not isinstance(item, dict):
                  return ""

              parts = [
                  item.get("title"),
                  item.get("body"),
                  item.get("content"),
                  item.get("description"),
                  item.get("text")
              ]

              return " ".join(
                  str(x)
                  for x in parts
                  if x
              ).strip()

          def author_of(item):
              if not isinstance(item, dict):
                  return {}

              author = item.get("author")

              if isinstance(author, dict):
                  return author

              return {
                  "id": item.get("author_id"),
                  "username": (
                      item.get("author_username")
                      or item.get("username")
                  )
              }

          def post_id_of(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "post_id",
                  "id",
                  "postId"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()

          def contains(text, terms):
              t = text.lower()
              return any(term in t for term in terms)

          def detect_capabilities(text):
              t = text.lower()

              capabilities = []

              mapping = {
                  "coding": [
                      "code",
                      "coding",
                      "script",
                      "python",
                      "javascript",
                      "api",
                      "parser",
                      "implement"
                  ],
                  "research": [
                      "research",
                      "investigate",
                      "investigation",
                      "researcher",
                      "find evidence"
                  ],
                  "analysis": [
                      "analysis",
                      "analyze",
                      "audit",
                      "compare",
                      "evaluate"
                  ],
                  "writing": [
                      "write",
                      "writing",
                      "documentation",
                      "article",
                      "report"
                  ],
                  "data": [
                      "data",
                      "dataset",
                      "csv",
                      "database",
                      "scrape"
                  ],
                  "media": [
                      "video",
                      "image",
                      "audio",
                      "editing"
                  ],
                  "testing": [
                      "test",
                      "testing",
                      "qa",
                      "verify",
                      "verification"
                  ]
              }

              for capability, terms in mapping.items():
                  if contains(t, terms):
                      capabilities.append(capability)

              return capabilities

          def determine_requirements(text):
              t = text.lower()

              requirements = []

              if contains(t, [
                  "must",
                  "required",
                  "requirement",
                  "acceptance criteria"
              ]):
                  requirements.append(
                      "EXPLICIT_REQUIREMENTS"
                  )

              if contains(t, [
                  "deadline",
                  "due",
                  "within",
                  "by tomorrow",
                  "by friday"
              ]):
                  requirements.append(
                      "TIME_CONSTRAINT"
                  )

              if contains(t, [
                  "reward",
                  "paid",
                  "payment",
                  "bounty",
                  "sats",
                  "btc",
                  "usdc"
              ]):
                  requirements.append(
                      "COMPENSATION_SIGNAL"
                  )

              if contains(t, [
                  "comment",
                  "reply",
                  "dm",
                  "message",
                  "application"
              ]):
                  requirements.append(
                      "APPLICATION_ROUTE"
                  )

              return requirements

          def assess_candidate(candidate):
              text = text_of(candidate)

              score = int(
                  candidate.get("final_score")
                  or candidate.get("contextual_score")
                  or candidate.get("score")
                  or 0
              )

              classification = str(
                  candidate.get("classification")
                  or ""
              )

              reasons = []
              penalties = []
              strengths = []

              if score >= 75:
                  strengths.append(
                      "STRONG_EVIDENCE_SCORE"
                  )
              elif score >= 55:
                  strengths.append(
                      "USEFUL_CONTEXTUAL_SIGNAL"
                  )
              elif score >= 35:
                  strengths.append(
                      "ATYPICAL_SIGNAL"
                  )

              if contains(text, [
                  "i need",
                  "we need",
                  "looking for",
                  "need someone",
                  "seeking",
                  "hire",
                  "hiring",
                  "who can"
              ]):
                  strengths.append(
                      "OPEN_DELEGATION"
                  )
              else:
                  penalties.append(
                      "NO_EXPLICIT_DELEGATION"
                  )

              if contains(text, [
                  "deliverable",
                  "acceptance criteria",
                  "must include",
                  "requirements",
                  "criteria"
              ]):
                  strengths.append(
                      "DELIVERABLE_OR_ACCEPTANCE"
                  )
              else:
                  penalties.append(
                      "NO_CLEAR_ACCEPTANCE_SIGNAL"
                  )

              if contains(text, [
                  "reward",
                  "paid",
                  "payment",
                  "bounty",
                  "sats",
                  "btc",
                  "usdc"
              ]):
                  strengths.append(
                      "COMPENSATION_SIGNAL"
                  )

              if contains(text, [
                  "completed",
                  "done",
                  "finished",
                  "already built",
                  "delivered",
                  "successfully completed"
              ]):
                  penalties.append(
                      "COMPLETION_SIGNAL"
                  )

              if contains(text, [
                  "analysis",
                  "finding",
                  "i observed",
                  "here is what i learned"
              ]) and not contains(text, [
                  "looking for",
                  "need someone",
                  "hire",
                  "seeking"
              ]):
                  penalties.append(
                      "ANALYSIS_WITHOUT_DELEGATION"
                  )

              capabilities = detect_capabilities(text)
              requirements = determine_requirements(text)

              capability_match = len(capabilities) > 0

              if capability_match:
                  strengths.append(
                      "NØX_CAPABILITY_MATCH_POSSIBLE"
                  )
              else:
                  penalties.append(
                      "CAPABILITY_NOT_OBVIOUS"
                  )

              readiness = score

              readiness += min(
                  10,
                  len(strengths) * 2
              )

              readiness -= min(
                  20,
                  len(penalties) * 4
              )

              readiness = max(
                  0,
                  min(100, readiness)
              )

              # Strong opportunity must still have delegation.
              explicit_delegation = contains(text, [
                  "i need",
                  "we need",
                  "looking for",
                  "need someone",
                  "seeking",
                  "hire",
                  "hiring",
                  "who can",
                  "can someone"
              ])

              completed = contains(text, [
                  "completed",
                  "done",
                  "finished",
                  "already built",
                  "delivered",
                  "successfully completed"
              ])

              if completed:
                  status = "NOT_SUITABLE"

              elif readiness >= 80 and explicit_delegation:
                  status = "HIGH_VALUE_OPPORTUNITY"

              elif readiness >= 65 and explicit_delegation:
                  status = "READY_FOR_ACTION"

              elif readiness >= 45:
                  status = "NEEDS_MORE_INFORMATION"

              else:
                  status = "NOT_SUITABLE"

              if status == "HIGH_VALUE_OPPORTUNITY":
                  priority = "P1"
              elif status == "READY_FOR_ACTION":
                  priority = "P2"
              elif status == "NEEDS_MORE_INFORMATION":
                  priority = "P3"
              else:
                  priority = "P4"

              if completed:
                  action = "DO_NOT_PURSUIT"

              elif not explicit_delegation:
                  action = "VERIFY_DELEGATION"

              elif "APPLICATION_ROUTE" not in requirements:
                  action = "VERIFY_APPLICATION_METHOD"

              elif "EXPLICIT_REQUIREMENTS" not in requirements:
                  action = "REQUEST_ACCEPTANCE_CRITERIA"

              else:
                  action = "PREPARE_APPLICATION"

              return {
                  "post_id": post_id_of(candidate),
                  "title": normalize(
                      candidate.get("title")
                  ),
                  "author": author_of(candidate),
                  "source_classification": classification,
                  "source_score": score,
                  "readiness_score": readiness,
                  "status": status,
                  "priority": priority,
                  "strengths": strengths,
                  "penalties": penalties,
                  "detected_capabilities": capabilities,
                  "detected_requirements": requirements,
                  "recommended_next_action": action,
                  "external_action_executed": False
              }

          print("Starting NØX V77")
          print("Mode: action readiness")

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          # ------------------------------------------------------------
          # JWT authentication
          # ------------------------------------------------------------

          token_response = requests.post(
              BASE + "/auth/token",
              json={"api_key": api_key},
              headers={"Accept": "application/json"},
              timeout=TIMEOUT
          )

          token_response.raise_for_status()

          token_data = token_response.json()
          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "JWT access_token missing"
              )

          print("JWT authentication: OK")

          # ------------------------------------------------------------
          # Canonical NØX identity
          # ------------------------------------------------------------

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          nox_id = str(
              me.get("id")
              or "442104b5-eee0-4f73-b452-08f258a21ea2"
          )

          nox_username = str(
              me.get("username")
              or "nox_origine"
          )

          print(
              "NØX identity:",
              nox_username
          )

          # ------------------------------------------------------------
          # Load V76
          # ------------------------------------------------------------

          v76 = load_json(
              "memory/nox_v76_contextual_opportunity_verifier.json"
          )

          v76_candidates = first_list(
              v76.get("ranked_opportunities", [])
          )

          print(
              "V76 candidates:",
              len(v76_candidates)
          )

          # ------------------------------------------------------------
          # Re-fetch top candidates from primary source
          # ------------------------------------------------------------

          evaluated = []

          for candidate in v76_candidates[:20]:

              pid = post_id_of(candidate)

              if not pid:
                  continue

              try:
                  post = api_request(
                      "GET",
                      f"/posts/{pid}",
                      token=token
                  )
              except Exception as exc:
                  print(
                      f"Primary post retrieval failed for {pid}: {exc}"
                  )
                  post = candidate

              merged = dict(candidate)

              if isinstance(post, dict):
                  for key, value in post.items():
                      if value not in [
                          None,
                          "",
                          [],
                          {}
                      ]:
                          merged[key] = value

              evaluation = assess_candidate(
                  merged
              )

              evaluation["primary_source_retrieved"] = (
                  isinstance(post, dict)
                  and bool(post)
              )

              evaluated.append(
                  evaluation
              )

          # ------------------------------------------------------------
          # If V76 has no candidates, inspect fresh personalized feed.
          # ------------------------------------------------------------

          if not evaluated:

              print(
                  "No V76 candidates. Checking personalized feed."
              )

              feed = api_request(
                  "GET",
                  "/feed/for-you",
                  token=token,
                  params={"limit": 25}
              )

              feed_items = first_list(feed)

              for item in feed_items[:25]:

                  author = author_of(item)

                  if (
                      str(author.get("id", "")) == nox_id
                      or str(
                          author.get("username", "")
                      ).lower() == nox_username.lower()
                  ):
                      continue

                  candidate = {
                      "post_id": post_id_of(item),
                      "title": item.get("title"),
                      "body": item.get("body"),
                      "content": item.get("content"),
                      "final_score": 0,
                      "classification": "FRESH_FEED_SIGNAL"
                  }

                  evaluation = assess_candidate(
                      candidate
                  )

                  evaluation[
                      "primary_source_retrieved"
                  ] = True

                  evaluated.append(
                      evaluation
                  )

          # ------------------------------------------------------------
          # Rank final decisions
          # ------------------------------------------------------------

          evaluated.sort(
              key=lambda x: (
                  x["priority"],
                  -x["readiness_score"]
              )
          )

          high_value = [
              x for x in evaluated
              if x["status"] ==
              "HIGH_VALUE_OPPORTUNITY"
          ]

          ready = [
              x for x in evaluated
              if x["status"] ==
              "READY_FOR_ACTION"
          ]

          more_info = [
              x for x in evaluated
              if x["status"] ==
              "NEEDS_MORE_INFORMATION"
          ]

          unsuitable = [
              x for x in evaluated
              if x["status"] ==
              "NOT_SUITABLE"
          ]

          if high_value:
              decision_status = (
                  "HIGH_VALUE_ACTION_CANDIDATE"
              )
          elif ready:
              decision_status = (
                  "ACTION_CANDIDATE_READY"
              )
          elif more_info:
              decision_status = (
                  "MORE_INFORMATION_REQUIRED"
              )
          else:
              decision_status = (
                  "NO_SUITABLE_ACTION"
              )

          # ------------------------------------------------------------
          # Learning
          # ------------------------------------------------------------

          learning = {
              "observations": [
                  "Opportunity detection alone is insufficient for execution.",
                  "A useful action requires evidence of an open delegation.",
                  "Capability fit should influence prioritization.",
                  "Completion signals must prevent pursuit of already finished work.",
                  "Application routing is necessary before an application can be executed.",
                  "Acceptance criteria should be preferred over generic task language.",
                  "Compensation signals increase relevance but do not prove settlement.",
                  "Future autonomy should be based on measured decision quality."
              ],
              "decision_rules": [
                  "Never treat a completed task as an open opportunity.",
                  "Never treat analysis or findings as delegated work without evidence.",
                  "Prefer explicit delegation.",
                  "Prefer concrete deliverables.",
                  "Prefer verifiable acceptance criteria.",
                  "Prefer clear application routing.",
                  "Preserve atypical signals for later learning."
              ]
          }

          # ------------------------------------------------------------
          # V77 result
          # ------------------------------------------------------------

          result = {
              "version": "V77",
              "generated_at": now(),
              "mode": "action_readiness_engine",
              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },
              "scope": {
                  "v76_candidates": len(v76_candidates),
                  "evaluated_candidates": len(evaluated),
                  "primary_source_reverification": True,
                  "automatic_comments": False,
                  "automatic_application": False,
                  "automatic_bidding": False,
                  "automatic_dm": False,
                  "automatic_payment": False,
                  "gemini": False
              },
              "decision_counts": {
                  "high_value_opportunities": len(high_value),
                  "ready_for_action": len(ready),
                  "needs_more_information": len(more_info),
                  "not_suitable": len(unsuitable)
              },
              "decision": {
                  "status": decision_status,
                  "top_candidate": (
                      evaluated[0]
                      if evaluated
                      else None
                  ),
                  "external_action_executed": False
              },
              "ranked_decisions": evaluated,
              "learning": learning,
              "autonomy_progression": {
                  "current_stage": (
                      "ACTION_READINESS_AND_PRIORITIZATION"
                  ),
                  "previous_stage": (
                      "CONTEXTUAL_VERIFICATION"
                  ),
                  "next_stage": (
                      "CONTROLLED_USEFUL_ACTION"
                  ),
                  "long_term_target": (
                      "V100_AUTONOMOUS_DECISION_MAKING"
                  )
              },
              "regression_cases_preserved": [
                  "V62_GENERIC_DEMAND_FALSE_POSITIVE",
                  "V64_ANALYSIS_FALSE_POSITIVE",
                  "V67_OVER_PRUNING",
                  "V69_TASK_WITHOUT_DEMAND",
                  "V72_INPUT_RECOVERY_FAILURE",
                  "V74_SELF_EVIDENCE_CONTAMINATION"
              ],
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_application": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              },
              "answer_status": decision_status,
              "confidence": (
                  0.92 if high_value
                  else 0.85 if ready
                  else 0.72 if more_info
                  else 0.45
              )
          }

          # ------------------------------------------------------------
          # Markdown report
          # ------------------------------------------------------------

          md = []

          md.append(
              "# NØX V77 — Action Readiness Engine"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Evaluate whether verified opportunities are actually "
              "worth pursuing and identify the best next action."
          )
          md.append("")
          md.append("## Decision")
          md.append("")
          md.append(
              f"Status: **{decision_status}**"
          )
          md.append("")
          md.append(
              f"- High value: {len(high_value)}"
          )
          md.append(
              f"- Ready for action: {len(ready)}"
          )
          md.append(
              f"- More information required: {len(more_info)}"
          )
          md.append(
              f"- Not suitable: {len(unsuitable)}"
          )
          md.append("")

          if evaluated:
              md.append("## Ranked decisions")
              md.append("")

              for index, item in enumerate(
                  evaluated,
                  start=1
              ):
                  md.append(
                      f"### {index}. "
                      f"{item['title'] or item['post_id']}"
                  )
                  md.append("")
                  md.append(
                      f"- Post ID: `{item['post_id']}`"
                  )
                  md.append(
                      f"- Readiness score: **{item['readiness_score']}**"
                  )
                  md.append(
                      f"- Status: `{item['status']}`"
                  )
                  md.append(
                      f"- Priority: `{item['priority']}`"
                  )
                  md.append(
                      f"- Recommended next action: "
                      f"`{item['recommended_next_action']}`"
                  )
                  md.append(
                      f"- Primary source retrieved: "
                      f"`{item['primary_source_retrieved']}`"
                  )
                  md.append("")
                  md.append(
                      "Strengths: "
                      + (
                          ", ".join(item["strengths"])
                          if item["strengths"]
                          else "none"
                      )
                  )
                  md.append("")
                  md.append(
                      "Penalties: "
                      + (
                          ", ".join(item["penalties"])
                          if item["penalties"]
                          else "none"
                      )
                  )
                  md.append("")

          md.append("## Autonomy progression")
          md.append("")
          md.append(
              "V77 gives NØX a decision layer between opportunity "
              "detection and external action."
          )
          md.append("")
          md.append(
              "NØX now evaluates opportunity quality, capability fit, "
              "priority and the most useful next action."
          )
          md.append("")
          md.append(
              "No external action is executed automatically in V77."
          )
          md.append("")
          md.append(
              "The next progression is controlled useful action, "
              "followed by increasingly autonomous decision-making "
              "toward V100."
          )
          md.append("")
          md.append("## Constraints")
          md.append("")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("- No automatic application.")
          md.append("- No automatic bidding.")
          md.append("- No automatic DM.")
          md.append("- No automatic payment.")
          md.append("- Regression cases preserved.")
          md.append("")

          # ------------------------------------------------------------
          # Save
          # ------------------------------------------------------------

          Path("memory").mkdir(
              exist_ok=True
          )

          json_path = Path(
              "memory/nox_v77_action_readiness_engine.json"
          )

          md_path = Path(
              "memory/nox_v77_action_readiness_engine.md"
          )

          json_path.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          md_path.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          print("")
          print("V77 completed successfully.")
          print(
              "Decision:",
              decision_status
          )
          print(
              "Evaluated:",
              len(evaluated)
          )

          if evaluated:
              print(
                  "Top candidate:",
                  evaluated[0]["title"]
              )
              print(
                  "Top readiness:",
                  evaluated[0]["readiness_score"]
              )

          print("")
          print(json_path)
          print(md_path)
          PY

      - name: Commit V77 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add \
            memory/nox_v77_action_readiness_engine.json \
            memory/nox_v77_action_readiness_engine.md

          git diff --cached
