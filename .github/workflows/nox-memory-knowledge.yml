name: NØX - Memory Knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  PROJECT_COST_EUR: "0"
  FREE_AI_ONLY: "true"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  consolidate-knowledge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and consolidate memory knowledge
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from hashlib import sha256
          policy={"PROJECT_COST_EUR":"0","AUTO_PAYMENT":"false","AUTO_SPENDING":"false","FREE_AI_ONLY":"true"}
          for k,v in policy.items():
              if os.environ.get(k,v).lower()!=v: raise SystemExit(f"SECURITY STOP: {k} must remain {v}")
          paths={"core":Path("memory/nox_core_memory.json"),"runtime":Path("memory/nox_core_runtime.json"),"work":Path("memory/nox_work_factory.json"),"presence":Path("memory/nox_colony_presence.json"),"knowledge":Path("memory/nox_knowledge.json")}
          def load(p, default):
              if not p.exists(): return default
              obj=json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(obj,dict): raise SystemExit(f"STATE SAFETY STOP: {p} root is not an object")
              return obj
          core=load(paths["core"],{"version":7,"observations":[],"questions":[],"hypotheses":[],"decisions":[],"actions":[],"results":[],"learnings":[],"failures":[],"relationships":[],"cognitive_cases":[]})
          runtime=load(paths["runtime"],{"version":7})
          work=load(paths["work"],{"version":1,"history":[],"completed":[]})
          presence=load(paths["presence"],{"version":1,"outcomes":[],"runs":[]})
          knowledge=load(paths["knowledge"],{"version":1,"observations":[],"facts":[],"hypotheses":[],"experiences":[],"results":[],"learnings":[],"sources":[],"queries":[]})
          now=datetime.now(timezone.utc).isoformat()
          for key in ("observations","facts","hypotheses","experiences","results","learnings","sources","queries"):
              if not isinstance(knowledge.get(key),list): knowledge[key]=[]
          # Preserve epistemic labels; do not promote reports or hypotheses to verified facts.
          def slim(item):
              raw=json.dumps(item,sort_keys=True,ensure_ascii=False)
              return item if len(raw)<=4000 else {"truncated":True,"original_chars":len(raw),"preview":raw[:3500]}
          sources=[]
          for field, label in (("observations","observed"),("results","result"),("learnings","learning")):
              for item in core.get(field,[]) if isinstance(core.get(field),list) else []:
                  if isinstance(item,dict):
                      stamp=json.dumps(item,sort_keys=True,ensure_ascii=False)
                      sid="core-"+sha256((field+stamp).encode()).hexdigest()[:20]
                      sources.append({"id":sid,"type":label,"source_file":"nox_core_memory.json","content":slim(item)})
          for item in (work.get("history",[]) if isinstance(work.get("history"),list) else [])[-100:]:
              if isinstance(item,dict): sources.append({"id":"work-"+sha256(json.dumps(item,sort_keys=True,ensure_ascii=False).encode()).hexdigest()[:20],"type":"research_result","source_file":"nox_work_factory.json","content":slim(item)})
          existing={x.get("id") for x in knowledge["sources"] if isinstance(x,dict)}
          added=0
          for item in sources:
              if item["id"] not in existing: knowledge["sources"].append(item); existing.add(item["id"]); added+=1
          knowledge["sources"]=knowledge["sources"][-500:]
          p=paths["knowledge"]
          if added or not p.exists():
              knowledge["last_consolidation"]={"timestamp":now,"sources_added":added,"policy":"preserve_epistemic_status; no automatic fact promotion","runtime_run_count":runtime.get("run_count"),"presence_outcomes":len(presence.get("outcomes",[])) if isinstance(presence.get("outcomes"),list) else 0}
              p.parent.mkdir(parents=True,exist_ok=True); t=p.with_suffix(p.suffix+".tmp")
              t.write_text(json.dumps(knowledge,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"); json.loads(t.read_text(encoding="utf-8")); os.replace(t,p)
              print(f"Knowledge consolidation complete: sources_added={added}; facts_promoted=0")
          else:
              print("Knowledge unchanged: nothing added, file left untouched (no commit).")
          PY
      - name: Commit knowledge state if changed
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          git add -- memory/nox_knowledge.json
          if git diff --cached --quiet; then
            echo "No knowledge changes."
            exit 0
          fi
          git commit -m "chore(nox): consolidate typed knowledge sources"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying."
            sleep $((attempt * 5))
          done
          echo "Push failed after 4 attempts."
          exit 1
