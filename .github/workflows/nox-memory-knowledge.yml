name: NØX - Memory & Knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-memory-knowledge
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  INDEX_FILE: memory/nox_knowledge_index.json

  MAX_KNOWLEDGE_ITEMS: "500"
  MAX_INDEX_ITEMS: "500"
  MAX_RESEARCH_QUERIES: "3"
  MAX_WEB_RESULTS: "5"
  WEB_TIMEOUT_SECONDS: "12"

jobs:
  memory-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX Memory & Knowledge
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          INDEX_FILE = Path(os.environ["INDEX_FILE"])

          MAX_KNOWLEDGE_ITEMS = int(
              os.environ["MAX_KNOWLEDGE_ITEMS"]
          )
          MAX_INDEX_ITEMS = int(
              os.environ["MAX_INDEX_ITEMS"]
          )
          MAX_RESEARCH_QUERIES = int(
              os.environ["MAX_RESEARCH_QUERIES"]
          )
          MAX_WEB_RESULTS = int(
              os.environ["MAX_WEB_RESULTS"]
          )
          WEB_TIMEOUT = int(
              os.environ["WEB_TIMEOUT_SECONDS"]
          )

          NOW = datetime.now(timezone.utc).isoformat()

          EMPTY_CORE_MEMORY = {
              "observations": [],
              "decisions": [],
              "actions": [],
              "learnings": []
          }

          EMPTY_CORE_RUNTIME = {}

          EMPTY_KNOWLEDGE = {
              "version": 2,
              "observations": [],
              "facts": [],
              "experiences": [],
              "hypotheses": [],
              "results": [],
              "learnings": [],
              "sources": [],
              "last_run": None,
              "run_count": 0
          }

          EMPTY_INDEX = {
              "version": 2,
              "terms": {},
              "updated_at": None
          }


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception as exc:
                  print(
                      f"WARNING: impossible de lire "
                      f"{path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              temporary.replace(path)


          def clean_text(value, limit=1000):
              if value is None:
                  return ""

              text = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              return text[:limit]


          def stable_id(kind, text):
              raw = (
                  f"{kind}|{text}"
                  .strip()
                  .lower()
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:16]


          def add_unique(collection, item, item_id):
              for existing in collection:
                  if (
                      isinstance(existing, dict)
                      and existing.get("id") == item_id
                  ):
                      return False

              item["id"] = item_id
              collection.append(item)

              return True


          def ensure_list(container, key):
              if not isinstance(
                  container.get(key),
                  list
              ):
                  container[key] = []

              return container[key]


          def item_summary(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "summary",
                  "observation",
                  "result",
                  "lesson",
                  "learning",
                  "action"
              ):
                  value = clean_text(
                      item.get(key)
                  )

                  if value:
                      return value

              return ""


          def evidence_value(item):
              if not isinstance(item, dict):
                  return {}

              evidence = item.get(
                  "evidence",
                  {}
              )

              return (
                  evidence
                  if isinstance(evidence, dict)
                  else {}
              )


          # ==========================================================
          # 1. LOAD CORE STATE
          # ==========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              EMPTY_CORE_MEMORY
          )

          if not isinstance(
              core_memory,
              dict
          ):
              core_memory = dict(
                  EMPTY_CORE_MEMORY
              )

          for key in (
              "observations",
              "decisions",
              "actions",
              "learnings"
          ):
              ensure_list(
                  core_memory,
                  key
              )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              EMPTY_CORE_RUNTIME
          )

          if not isinstance(
              core_runtime,
              dict
          ):
              core_runtime = {}


          # ==========================================================
          # 2. LOAD KNOWLEDGE LIBRARY
          # ==========================================================

          knowledge = load_json(
              KNOWLEDGE_FILE,
              EMPTY_KNOWLEDGE
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = dict(
                  EMPTY_KNOWLEDGE
              )

          knowledge["version"] = 2

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              ensure_list(
                  knowledge,
                  key
              )


          # ==========================================================
          # 3. CONSOLIDATE CORE OBSERVATIONS
          #
          # Observation remains an observation.
          # It is NOT automatically promoted to a verified fact.
          # ==========================================================

          observations = core_memory[
              "observations"
          ]

          observation_count = 0

          for item in observations:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              summary = clean_text(
                  item.get("summary")
                  or item.get("observation")
              )

              if not summary:
                  continue

              timestamp = item.get(
                  "timestamp",
                  NOW
              )

              source = clean_text(
                  item.get(
                      "source",
                      "core"
                  ),
                  300
              )

              evidence = evidence_value(
                  item
              )

              item_id = stable_id(
                  "observation",
                  json.dumps(
                      {
                          "summary": summary,
                          "source": source,
                          "evidence": evidence
                      },
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              added = add_unique(
                  knowledge["observations"],
                  {
                      "timestamp": timestamp,
                      "source": source,
                      "summary": summary,
                      "evidence": evidence
                  },
                  item_id
              )

              if added:
                  observation_count += 1


          # ==========================================================
          # 4. EXPLICIT VERIFIED FACTS
          #
          # Only items explicitly represented as facts are stored as
          # facts. Ordinary observations are never silently promoted.
          # ==========================================================

          fact_count = 0

          for item in observations:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              fact = item.get(
                  "fact"
              )

              verified = item.get(
                  "verified",
                  False
              )

              if not fact or verified is not True:
                  continue

              summary = clean_text(
                  fact
              )

              if not summary:
                  continue

              evidence = evidence_value(
                  item
              )

              item_id = stable_id(
                  "fact",
                  json.dumps(
                      {
                          "summary": summary,
                          "evidence": evidence
                      },
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              added = add_unique(
                  knowledge["facts"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "summary": summary,
                      "evidence": evidence,
                      "source": clean_text(
                          item.get(
                              "source",
                              "core"
                          ),
                          300
                      )
                  },
                  item_id
              )

              if added:
                  fact_count += 1


          # ==========================================================
          # 5. CONSOLIDATE ACTION EXPERIENCES
          #
          # An action and its result form an experience.
          # The experience itself is not automatically a learning.
          # ==========================================================

          actions = core_memory[
              "actions"
          ]

          experience_count = 0

          for item in actions:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              action = clean_text(
                  item.get("action")
              )

              if not action:
                  continue

              result = clean_text(
                  item.get("result")
              )

              target = item.get(
                  "target"
              )

              identity = {
                  "action": action,
                  "target": target,
                  "result": result
              }

              item_id = stable_id(
                  "experience",
                  json.dumps(
                      identity,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              added = add_unique(
                  knowledge["experiences"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "action": action,
                      "target": target,
                      "result": result,
                      "evidence": evidence_value(
                          item
                      )
                  },
                  item_id
              )

              if added:
                  experience_count += 1


          # ==========================================================
          # 6. EXPLICIT HYPOTHESES
          # ==========================================================

          hypothesis_count = 0

          for item in observations:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              hypothesis = (
                  item.get("hypothesis")
                  or item.get("hypotheses")
              )

              if not hypothesis:
                  continue

              if isinstance(
                  hypothesis,
                  list
              ):
                  values = hypothesis
              else:
                  values = [hypothesis]

              for value in values:
                  summary = clean_text(
                      value
                  )

                  if not summary:
                      continue

                  item_id = stable_id(
                      "hypothesis",
                      summary
                  )

                  added = add_unique(
                      knowledge["hypotheses"],
                      {
                          "timestamp": item.get(
                              "timestamp",
                              NOW
                          ),
                          "summary": summary,
                          "status": clean_text(
                              item.get(
                                  "hypothesis_status",
                                  "unverified"
                              )
                          ) or "unverified",
                          "evidence": evidence_value(
                              item
                          )
                      },
                      item_id
                  )

                  if added:
                      hypothesis_count += 1


          # ==========================================================
          # 7. EXPLICIT TEST RESULTS
          # ==========================================================

          result_count = 0

          for item in actions:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              result = item.get(
                  "result"
              )

              result_status = (
                  item.get("result_status")
                  or item.get("outcome_status")
              )

              if (
                  not result
                  or not result_status
              ):
                  continue

              summary = clean_text(
                  result
              )

              if not summary:
                  continue

              item_id = stable_id(
                  "result",
                  json.dumps(
                      {
                          "summary": summary,
                          "status": result_status
                      },
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              added = add_unique(
                  knowledge["results"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "summary": summary,
                      "status": clean_text(
                          result_status,
                          100
                      ),
                      "action": clean_text(
                          item.get("action")
                      ),
                      "evidence": evidence_value(
                          item
                      )
                  },
                  item_id
              )

              if added:
                  result_count += 1


          # ==========================================================
          # 8. CONSOLIDATE CORE LEARNINGS
          #
          # Learnings remain explicit learnings and retain evidence.
          # ==========================================================

          learnings = core_memory[
              "learnings"
          ]

          learning_count = 0

          for item in learnings:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              summary = clean_text(
                  item.get("summary")
                  or item.get("learning")
                  or item.get("lesson")
              )

              if not summary:
                  continue

              item_id = stable_id(
                  "learning",
                  json.dumps(
                      {
                          "summary": summary,
                          "evidence": evidence_value(
                              item
                          )
                      },
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              added = add_unique(
                  knowledge["learnings"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "summary": summary,
                      "evidence": evidence_value(
                          item
                      ),
                      "confidence": item.get(
                          "confidence"
                      ),
                      "source": clean_text(
                          item.get(
                              "source",
                              "core"
                          ),
                          300
                      )
                  },
                  item_id
              )

              if added:
                  learning_count += 1


          # ==========================================================
          # 9. EXTRACT WEB SOURCES ALREADY USED BY CORE
          # ==========================================================

          sources_added = 0

          for item in observations:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              evidence = evidence_value(
                  item
              )

              results = evidence.get(
                  "results",
                  []
              )

              if not isinstance(
                  results,
                  list
              ):
                  continue

              for result in results:
                  if not isinstance(
                      result,
                      dict
                  ):
                      continue

                  url = clean_text(
                      result.get("url"),
                      500
                  )

                  if not url:
                      continue

                  source_id = stable_id(
                      "source",
                      url
                  )

                  added = add_unique(
                      knowledge["sources"],
                      {
                          "timestamp": item.get(
                              "timestamp",
                              NOW
                          ),
                          "url": url,
                          "title": clean_text(
                              result.get(
                                  "title"
                              ),
                              300
                          ),
                          "snippet": clean_text(
                              result.get(
                                  "snippet"
                              ),
                              500
                          ),
                          "source": "core"
                      },
                      source_id
                  )

                  if added:
                      sources_added += 1


          # ==========================================================
          # 10. WEB RESEARCH
          #
          # Research is a capability of Memory & Knowledge.
          # No Gemini and no external AI.
          #
          # The Core provides research intent through web_queries.
          # This workflow performs deterministic retrieval and stores
          # the retrieved evidence for later cognitive use.
          # ==========================================================

          web_queries = core_runtime.get(
              "web_queries",
              []
          )

          if not isinstance(
              web_queries,
              list
          ):
              web_queries = []

          queries = []
          seen_queries = set()

          for item in reversed(
              web_queries
          ):
              if isinstance(
                  item,
                  dict
              ):
                  query = clean_text(
                      item.get("query"),
                      300
                  )
              else:
                  query = clean_text(
                      item,
                      300
                  )

              if not query:
                  continue

              normalized = query.lower()

              if normalized in seen_queries:
                  continue

              seen_queries.add(
                  normalized
              )
              queries.append(
                  query
              )

              if (
                  len(queries)
                  >= MAX_RESEARCH_QUERIES
              ):
                  break


          def web_search(query):
              encoded = urllib.parse.urlencode(
                  {"q": query}
              )

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + encoded
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(compatible; "
                          "NOX-Memory-Knowledge/2.0)"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT
                  ) as response:
                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
              except Exception as exc:
                  print(
                      f"WEB SEARCH unavailable: "
                      f"{exc}"
                  )
                  return []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*"'
                  r'.*?</div>\s*</div>',
                  html,
                  flags=(
                      re.IGNORECASE
                      | re.DOTALL
                  )
              )

              results = []

              for block in blocks:
                  if (
                      len(results)
                      >= MAX_WEB_RESULTS
                  ):
                      break

                  title_match = re.search(
                      r'class="result__a"'
                      r'[^>]*>(.*?)</a>',
                      block,
                      flags=(
                          re.IGNORECASE
                          | re.DOTALL
                      )
                  )

                  url_match = re.search(
                      r'class="result__a"'
                      r'[^>]*href="([^"]+)"',
                      block,
                      flags=re.IGNORECASE
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"'
                      r'[^>]*>(.*?)</',
                      block,
                      flags=(
                          re.IGNORECASE
                          | re.DOTALL
                      )
                  )

                  if (
                      not title_match
                      or not url_match
                  ):
                      continue

                  title = clean_text(
                      re.sub(
                          r"<[^>]+>",
                          "",
                          title_match.group(1)
                      ),
                      300
                  )

                  snippet = ""

                  if snippet_match:
                      snippet = clean_text(
                          re.sub(
                              r"<[^>]+>",
                              "",
                              snippet_match.group(1)
                          ),
                          500
                      )

                  result_url = urllib.parse.unquote(
                      url_match.group(1)
                  )

                  if not result_url:
                      continue

                  results.append(
                      {
                          "title": title,
                          "url": clean_text(
                              result_url,
                              500
                          ),
                          "snippet": snippet
                      }
                  )

              return results


          research_runs = 0
          research_results = 0

          for query in queries:
              print(
                  f"RESEARCH: {query}"
              )

              results = web_search(
                  query
              )

              if not results:
                  continue

              research_runs += 1
              research_results += len(
                  results
              )

              for result in results:
                  url = clean_text(
                      result.get("url"),
                      500
                  )

                  if not url:
                      continue

                  source_id = stable_id(
                      "source",
                      url
                  )

                  add_unique(
                      knowledge["sources"],
                      {
                          "timestamp": NOW,
                          "url": url,
                          "title": clean_text(
                              result.get(
                                  "title"
                              ),
                              300
                          ),
                          "snippet": clean_text(
                              result.get(
                                  "snippet"
                              ),
                              500
                          ),
                          "query": query,
                          "source": "web"
                      },
                      source_id
                  )


          # ==========================================================
          # 11. KNOWLEDGE LIMITS
          # ==========================================================

          for key in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
              "sources"
          ):
              knowledge[key] = (
                  knowledge[key]
                  [-MAX_KNOWLEDGE_ITEMS:]
              )


          # ==========================================================
          # 12. SEARCH INDEX
          # ==========================================================

          index = {
              "version": 2,
              "terms": {},
              "updated_at": NOW
          }

          stop_words = {
              "avec",
              "dans",
              "pour",
              "mais",
              "plus",
              "cette",
              "sont",
              "une",
              "des",
              "les",
              "sur",
              "par",
              "que",
              "qui",
              "est",
              "pas",
              "aux",
              "avec",
              "the",
              "and",
              "for",
              "with",
              "from",
              "this",
              "that",
              "are",
              "was",
              "were",
              "not",
              "has",
              "have",
              "but",
              "you",
              "your"
          }

          indexed_kinds = (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings"
          )

          for kind in indexed_kinds:
              for item in knowledge[kind]:
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  item_id = item.get(
                      "id"
                  )

                  if not item_id:
                      continue

                  text = json.dumps(
                      item,
                      ensure_ascii=False
                  ).lower()

                  words = re.findall(
                      r"[a-zà-ÿ0-9_-]{3,}",
                      text,
                      flags=re.IGNORECASE
                  )

                  for word in set(words):
                      if word in stop_words:
                          continue

                      bucket = index[
                          "terms"
                      ].setdefault(
                          word,
                          []
                      )

                      if item_id not in bucket:
                          bucket.append(
                              item_id
                          )

          for word in list(
              index["terms"]
          ):
              index["terms"][word] = (
                  index["terms"][word]
                  [-MAX_INDEX_ITEMS:]
              )


          # ==========================================================
          # 13. PERSISTENCE
          # ==========================================================

          knowledge["last_run"] = NOW
          knowledge["run_count"] = (
              int(
                  knowledge.get(
                      "run_count",
                      0
                  )
              )
              + 1
          )

          save_json(
              KNOWLEDGE_FILE,
              knowledge
          )

          save_json(
              INDEX_FILE,
              index
          )


          # ==========================================================
          # 14. RUN SUMMARY
          # ==========================================================

          print("")
          print(
              "=== NØX MEMORY & KNOWLEDGE ==="
          )
          print(
              f"Core observations: "
              f"{len(observations)}"
          )
          print(
              f"Core decisions: "
              f"{len(core_memory['decisions'])}"
          )
          print(
              f"Core actions: "
              f"{len(actions)}"
          )
          print(
              f"Core learnings: "
              f"{len(learnings)}"
          )
          print(
              f"Observations added: "
              f"{observation_count}"
          )
          print(
              f"Verified facts added: "
              f"{fact_count}"
          )
          print(
              f"Experiences added: "
              f"{experience_count}"
          )
          print(
              f"Hypotheses added: "
              f"{hypothesis_count}"
          )
          print(
              f"Results added: "
              f"{result_count}"
          )
          print(
              f"Learnings added: "
              f"{learning_count}"
          )
          print(
              f"Core sources added: "
              f"{sources_added}"
          )
          print(
              f"Research runs: "
              f"{research_runs}"
          )
          print(
              f"Research results: "
              f"{research_results}"
          )
          print(
              f"Knowledge observations: "
              f"{len(knowledge['observations'])}"
          )
          print(
              f"Knowledge facts: "
              f"{len(knowledge['facts'])}"
          )
          print(
              f"Knowledge experiences: "
              f"{len(knowledge['experiences'])}"
          )
          print(
              f"Knowledge hypotheses: "
              f"{len(knowledge['hypotheses'])}"
          )
          print(
              f"Knowledge results: "
              f"{len(knowledge['results'])}"
          )
          print(
              f"Knowledge learnings: "
              f"{len(knowledge['learnings'])}"
          )
          print(
              f"Knowledge sources: "
              f"{len(knowledge['sources'])}"
          )
          print(
              f"Index terms: "
              f"{len(index['terms'])}"
          )
          print("")
          print(
              "=== OBSERVE -> EVIDENCE -> "
              "KNOWLEDGE -> INDEX ==="
          )
          print(
              "=== NØX MEMORY & KNOWLEDGE TERMINÉ ==="
          )
          PY

      - name: Commit Memory & Knowledge
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

