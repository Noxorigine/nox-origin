name: NØX - Memory & Knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  KNOWLEDGE_INDEX_FILE: memory/nox_knowledge_index.json

  MAX_OBSERVATIONS: "500"
  MAX_FACTS: "300"
  MAX_EXPERIENCES: "300"
  MAX_HYPOTHESES: "200"
  MAX_RESULTS: "300"
  MAX_LEARNINGS: "300"
  MAX_SOURCES: "300"
  MAX_QUERIES: "300"

  MAX_TEXT_CHARS: "12000"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  memory-knowledge:
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ddgs>=9.16.0,<10.0.0"

      - name: Build knowledge state
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import re
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          INDEX_FILE = Path(os.environ["KNOWLEDGE_INDEX_FILE"])

          MAX_OBSERVATIONS = int(os.environ["MAX_OBSERVATIONS"])
          MAX_FACTS = int(os.environ["MAX_FACTS"])
          MAX_EXPERIENCES = int(os.environ["MAX_EXPERIENCES"])
          MAX_HYPOTHESES = int(os.environ["MAX_HYPOTHESES"])
          MAX_RESULTS = int(os.environ["MAX_RESULTS"])
          MAX_LEARNINGS = int(os.environ["MAX_LEARNINGS"])
          MAX_SOURCES = int(os.environ["MAX_SOURCES"])
          MAX_QUERIES = int(os.environ["MAX_QUERIES"])
          MAX_TEXT_CHARS = int(os.environ["MAX_TEXT_CHARS"])

          NOW = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def load(path, default):
              if not path.exists():
                  return default
              try:
                  with path.open("r", encoding="utf-8") as f:
                      value = json.load(f)
                  return value
              except Exception as exc:
                  print(f"WARNING: cannot load {path}: {exc}")
                  return default

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(value, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              tmp.replace(path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value.strip()
              try:
                  return json.dumps(value, ensure_ascii=False)
              except Exception:
                  return str(value)

          def clip(value, limit=MAX_TEXT_CHARS):
              value = text(value)
              return value if len(value) <= limit else value[:limit].rstrip() + "…"

          def stable_id(prefix, value):
              raw = text(value)
              return f"{prefix}-{hashlib.sha256(raw.encode('utf-8')).hexdigest()[:16]}"

          def timestamp(item):
              if not isinstance(item, dict):
                  return ""
              for key in (
                  "timestamp",
                  "created_at",
                  "created",
                  "updated_at",
                  "observed_at",
                  "completed_at",
                  "date",
              ):
                  value = item.get(key)
                  if value:
                      return str(value)
              return ""

          def newest_first(items):
              return sorted(
                  items,
                  key=lambda x: timestamp(x),
                  reverse=True,
              )

          def bounded(items, limit):
              return newest_first(items)[:limit]

          def normalize_item(item):
              if isinstance(item, str):
                  return {
                      "id": stable_id("item", item),
                      "text": clip(item),
                      "timestamp": NOW,
                  }

              if not isinstance(item, dict):
                  return None

              result = dict(item)

              if "timestamp" not in result:
                  for key in ("created_at", "created", "updated_at"):
                      if result.get(key):
                          result["timestamp"] = result[key]
                          break

              result.setdefault("timestamp", NOW)

              for key, value in list(result.items()):
                  if isinstance(value, str):
                      result[key] = clip(value)

              if not result.get("id"):
                  basis = (
                      result.get("text")
                      or result.get("content")
                      or result.get("question")
                      or result.get("title")
                      or result
                  )
                  result["id"] = stable_id("item", basis)

              return result

          def merge_unique(existing, incoming, limit):
              result = []

              for item in list(existing) + list(incoming):
                  normalized = normalize_item(item)
                  if not normalized:
                      continue

                  item_id = str(normalized.get("id"))

                  duplicate = False
                  for previous in result:
                      if str(previous.get("id")) == item_id:
                          duplicate = True
                          break

                  if not duplicate:
                      result.append(normalized)

              return bounded(result, limit)

          core_memory = as_dict(load(CORE_MEMORY_FILE, {}))
          runtime = as_dict(load(CORE_RUNTIME_FILE, {}))
          work = as_dict(load(WORK_FILE, {}))
          knowledge = as_dict(load(KNOWLEDGE_FILE, {}))

          observations = as_list(core_memory.get("observations"))
          facts = as_list(core_memory.get("facts"))
          experiences = as_list(core_memory.get("experiences"))
          hypotheses = as_list(core_memory.get("hypotheses"))
          results = as_list(core_memory.get("results"))
          learnings = as_list(core_memory.get("learnings"))

          k_observations = as_list(knowledge.get("observations"))
          k_facts = as_list(knowledge.get("facts"))
          k_experiences = as_list(knowledge.get("experiences"))
          k_hypotheses = as_list(knowledge.get("hypotheses"))
          k_results = as_list(knowledge.get("results"))
          k_learnings = as_list(knowledge.get("learnings"))
          sources = as_list(knowledge.get("sources"))
          queries = as_list(knowledge.get("queries"))

          runtime_observations = as_list(runtime.get("observations"))
          runtime_decisions = as_list(runtime.get("decisions"))
          runtime_actions = as_list(runtime.get("actions"))
          runtime_outcomes = as_list(runtime.get("outcomes"))
          runtime_web_queries = as_list(runtime.get("web_queries"))

          work_history = as_list(work.get("history"))
          work_results = as_list(work.get("results"))

          new_observations = []
          new_experiences = []
          new_results = []
          new_learnings = []
          new_sources = []
          new_queries = []

          # ------------------------------------------------------------
          # 1. Runtime observations
          # ------------------------------------------------------------

          for item in runtime_observations[-100:]:
              obj = normalize_item(item)
              if obj:
                  obj.setdefault("source", "core_runtime")
                  new_observations.append(obj)

          # ------------------------------------------------------------
          # 2. Decisions are not automatically facts.
          #    They remain observations/decision records.
          # ------------------------------------------------------------

          for item in runtime_decisions[-100:]:
              obj = normalize_item(item)
              if obj:
                  obj.setdefault("source", "core_runtime")
                  obj["type"] = obj.get("type", "decision")
                  new_observations.append(obj)

          # ------------------------------------------------------------
          # 3. Actions + outcomes become experiences.
          #    No outcome = no experience claim.
          # ------------------------------------------------------------

          outcome_by_action = {}

          for outcome in runtime_outcomes:
              if not isinstance(outcome, dict):
                  continue

              action_id = (
                  outcome.get("action_id")
                  or outcome.get("id")
                  or outcome.get("action")
              )

              if action_id:
                  outcome_by_action[str(action_id)] = outcome

          for action in runtime_actions[-200:]:
              if not isinstance(action, dict):
                  continue

              action_id = action.get("id") or action.get("action_id")

              if not action_id:
                  continue

              outcome = outcome_by_action.get(str(action_id))

              if not outcome:
                  continue

              outcome_status = text(
                  outcome.get("status")
                  or outcome.get("result")
                  or outcome.get("outcome")
              ).lower()

              experience = {
                  "id": stable_id(
                      "experience",
                      f"{action_id}|{outcome_status}|{text(outcome)}",
                  ),
                  "timestamp": timestamp(outcome) or timestamp(action) or NOW,
                  "source": "core_runtime",
                  "action_id": action_id,
                  "action_type": action.get("type"),
                  "target_id": action.get("target_id"),
                  "status": outcome_status,
                  "action": clip(action),
                  "outcome": clip(outcome),
              }

              new_experiences.append(experience)

          # ------------------------------------------------------------
          # 4. Work Factory completed results
          # ------------------------------------------------------------

          for item in work_results[-100:]:
              if not isinstance(item, dict):
                  continue

              status = text(item.get("status")).lower()

              if status not in (
                  "completed",
                  "complete",
                  "success",
                  "multi_source_support",
                  "partial_support",
                  "insufficient_verification",
                  "no_evidence",
              ):
                  continue

              result_obj = {
                  "id": item.get("id")
                  or stable_id("result", item),
                  "timestamp": timestamp(item) or NOW,
                  "source": "work_factory",
                  "work_id": item.get("work_id") or item.get("id"),
                  "question": clip(item.get("question")),
                  "status": status,
                  "conclusion": clip(item.get("conclusion")),
                  "uncertainty": clip(item.get("uncertainty")),
                  "evidence": item.get("evidence", []),
                  "sources": item.get("sources", []),
              }

              new_results.append(result_obj)

              for source in as_list(item.get("sources")):
                  if isinstance(source, str):
                      url = source
                  elif isinstance(source, dict):
                      url = (
                          source.get("url")
                          or source.get("link")
                          or source.get("source")
                      )
                  else:
                      url = ""

                  if url:
                      new_sources.append({
                          "id": stable_id("source", url),
                          "url": url,
                          "timestamp": timestamp(item) or NOW,
                          "source": "work_factory",
                          "work_id": item.get("work_id") or item.get("id"),
                      })

          # ------------------------------------------------------------
          # 5. Work history: preserve learning signals, not raw noise
          # ------------------------------------------------------------

          for item in work_history[-100:]:
              if not isinstance(item, dict):
                  continue

              status = text(item.get("status")).lower()

              if status in (
                  "invalid_input",
                  "needs_retry",
                  "failed",
                  "no_evidence",
              ):
                  learning = {
                      "id": stable_id("learning", item),
                      "timestamp": timestamp(item) or NOW,
                      "source": "work_factory",
                      "type": "process_learning",
                      "status": status,
                      "question": clip(item.get("question")),
                      "learning": clip(
                          item.get("learning")
                          or item.get("reason")
                          or item.get("error")
                          or "Research item did not produce usable evidence."
                      ),
                  }
                  new_learnings.append(learning)

          # ------------------------------------------------------------
          # 6. Explicit learning records already present in Core
          # ------------------------------------------------------------

          for item in learnings[-100:]:
              obj = normalize_item(item)
              if obj:
                  obj.setdefault("source", "core_memory")
                  new_learnings.append(obj)

          # ------------------------------------------------------------
          # 7. URLs from runtime web queries
          # ------------------------------------------------------------

          for query in runtime_web_queries[-100:]:
              obj = normalize_item(query)
              if obj:
                  obj.setdefault("source", "core_runtime")
                  new_queries.append(obj)

          # ------------------------------------------------------------
          # 8. Query records already stored in knowledge
          # ------------------------------------------------------------

          for query in queries[-100:]:
              obj = normalize_item(query)
              if obj:
                  new_queries.append(obj)

          # ------------------------------------------------------------
          # 9. Extract URLs from all research-related text.
          # ------------------------------------------------------------

          url_pattern = re.compile(r"https?://[^\s<>\"]+")

          research_texts = []

          for item in new_results:
              research_texts.append(text(item))

          for item in new_sources:
              research_texts.append(text(item))

          for item in work_history[-50:]:
              research_texts.append(text(item))

          for blob in research_texts:
              for url in url_pattern.findall(blob):
                  url = url.rstrip(".,);]}>")
                  try:
                      parsed = urlparse(url)
                      if parsed.scheme not in ("http", "https"):
                          continue
                      if not parsed.netloc:
                          continue
                  except Exception:
                      continue

                  new_sources.append({
                      "id": stable_id("source", url),
                      "url": url,
                      "timestamp": NOW,
                      "source": "research_extraction",
                  })

          # ------------------------------------------------------------
          # 10. Merge without inventing facts.
          # ------------------------------------------------------------

          merged_observations = merge_unique(
              observations + k_observations,
              new_observations,
              MAX_OBSERVATIONS,
          )

          merged_facts = merge_unique(
              facts + k_facts,
              [],
              MAX_FACTS,
          )

          merged_experiences = merge_unique(
              experiences + k_experiences,
              new_experiences,
              MAX_EXPERIENCES,
          )

          merged_hypotheses = merge_unique(
              hypotheses + k_hypotheses,
              [],
              MAX_HYPOTHESES,
          )

          merged_results = merge_unique(
              results + k_results,
              new_results,
              MAX_RESULTS,
          )

          merged_learnings = merge_unique(
              learnings + k_learnings,
              new_learnings,
              MAX_LEARNINGS,
          )

          merged_sources = merge_unique(
              sources,
              new_sources,
              MAX_SOURCES,
          )

          merged_queries = merge_unique(
              queries,
              new_queries,
              MAX_QUERIES,
          )

          # ------------------------------------------------------------
          # 11. Knowledge facts remain conservative.
          #
          # We only retain existing explicit facts here.
          # Research conclusions are results until independently verified.
          # ------------------------------------------------------------

          verified_facts = []

          for item in merged_facts:
              if not isinstance(item, dict):
                  continue

              verification = text(
                  item.get("verification")
                  or item.get("status")
                  or item.get("evidence_status")
              ).lower()

              explicit = item.get("verified") is True

              if explicit or verification in (
                  "verified",
                  "confirmed",
                  "multi_source_verified",
              ):
                  verified_facts.append(item)

          merged_facts = bounded(verified_facts, MAX_FACTS)

          # ------------------------------------------------------------
          # 12. Build knowledge object.
          # ------------------------------------------------------------

          knowledge = {
              "schema_version": 2,
              "updated_at": NOW,
              "last_run": NOW,
              "run_count": int(knowledge.get("run_count", 0) or 0) + 1,

              "observations": merged_observations,
              "facts": merged_facts,
              "experiences": merged_experiences,
              "hypotheses": merged_hypotheses,
              "results": merged_results,
              "learnings": merged_learnings,
              "sources": merged_sources,
              "queries": merged_queries,
          }

          # ------------------------------------------------------------
          # 13. Update Core memory conservatively.
          #
          # Never promote results/hypotheses to facts automatically.
          # ------------------------------------------------------------

          core_memory["observations"] = bounded(
              merge_unique(observations, new_observations, MAX_OBSERVATIONS),
              MAX_OBSERVATIONS,
          )

          core_memory["facts"] = merged_facts
          core_memory["experiences"] = bounded(
              merge_unique(experiences, new_experiences, MAX_EXPERIENCES),
              MAX_EXPERIENCES,
          )
          core_memory["hypotheses"] = merged_hypotheses
          core_memory["results"] = merged_results
          core_memory["learnings"] = merged_learnings
          core_memory["updated_at"] = NOW

          # ------------------------------------------------------------
          # 14. Build compact searchable index.
          # ------------------------------------------------------------

          index_items = []

          def add_index(collection, item_type):
              for item in collection:
                  if not isinstance(item, dict):
                      continue

                  content = (
                      item.get("text")
                      or item.get("content")
                      or item.get("question")
                      or item.get("conclusion")
                      or item.get("learning")
                      or item.get("title")
                      or ""
                  )

                  index_items.append({
                      "id": item.get("id"),
                      "type": item_type,
                      "timestamp": item.get("timestamp") or NOW,
                      "text": clip(content, 2000),
                  })

          add_index(merged_observations, "observation")
          add_index(merged_facts, "fact")
          add_index(merged_experiences, "experience")
          add_index(merged_hypotheses, "hypothesis")
          add_index(merged_results, "result")
          add_index(merged_learnings, "learning")

          index_items = newest_first(index_items)[:1200]

          index = {
              "schema_version": 2,
              "updated_at": NOW,
              "count": len(index_items),
              "items": index_items,
          }

          # ------------------------------------------------------------
          # 15. Policy integrity.
          # ------------------------------------------------------------

          assert os.environ["PROJECT_COST_EUR"] == "0"
          assert os.environ["GEMINI_USED"].lower() == "false"
          assert os.environ["EXTERNAL_AI_USED"].lower() == "false"
          assert os.environ["AUTO_PAYMENT"].lower() == "false"
          assert os.environ["AUTO_SPENDING"].lower() == "false"

          save(KNOWLEDGE_FILE, knowledge)
          save(INDEX_FILE, index)
          save(CORE_MEMORY_FILE, core_memory)

          print("=== NØX MEMORY & KNOWLEDGE ===")
          print(f"Run: {NOW}")
          print(f"Observations: {len(merged_observations)}")
          print(f"Verified facts: {len(merged_facts)}")
          print(f"Experiences: {len(merged_experiences)}")
          print(f"Hypotheses: {len(merged_hypotheses)}")
          print(f"Results: {len(merged_results)}")
          print(f"Learnings: {len(merged_learnings)}")
          print(f"Sources: {len(merged_sources)}")
          print(f"Queries: {len(merged_queries)}")
          print(f"Index items: {len(index_items)}")
          print("Research conclusions remain results unless explicitly verified.")
          PY

      - name: Validate JSON and policy
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          from pathlib import Path

          files = [
              Path(os.environ["CORE_MEMORY_FILE"]),
              Path(os.environ["CORE_RUNTIME_FILE"]),
              Path(os.environ["WORK_FILE"]),
              Path(os.environ["KNOWLEDGE_FILE"]),
              Path(os.environ["KNOWLEDGE_INDEX_FILE"]),
          ]

          for path in files:
              if not path.exists():
                  raise SystemExit(f"Missing JSON file: {path}")

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")

          assert os.environ["PROJECT_COST_EUR"] == "0"
          assert os.environ["GEMINI_USED"].lower() == "false"
          assert os.environ["EXTERNAL_AI_USED"].lower() == "false"
          assert os.environ["AUTO_PAYMENT"].lower() == "false"
          assert os.environ["AUTO_SPENDING"].lower() == "false"

          print("POLICY: OK")
          PY

          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          if git diff --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git add \
            memory/nox_core_memory.json \
            memory/nox_knowledge.json \
            memory/nox_knowledge_index.json

          git commit -m "chore(nox): update memory and knowledge"

          git pull --rebase origin main
          git push origin HEAD:main
