name: NØX - Memory & Knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: "memory/nox_core_memory.json"
  CORE_RUNTIME_FILE: "memory/nox_core_runtime.json"
  WORK_FILE: "memory/nox_work_factory.json"
  KNOWLEDGE_FILE: "memory/nox_knowledge.json"
  KNOWLEDGE_INDEX_FILE: "memory/nox_knowledge_index.json"
  PRESENCE_FILE: "memory/nox_colony_presence.json"
  EVOLUTION_FILE: "memory/nox_evolution_history.json"
  MAX_OBSERVATIONS: "500"
  MAX_FACTS: "300"
  MAX_EXPERIENCES: "300"
  MAX_HYPOTHESES: "200"
  MAX_RESULTS: "300"
  MAX_LEARNINGS: "300"
  MAX_SOURCES: "300"
  MAX_QUERIES: "300"
  MAX_TEXT_CHARS: "12000"
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build knowledge state
        shell: bash
        env:
          MODE: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Shared helpers for all NØX scripts (standard library only)."""
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from itertools import islice
          from pathlib import Path

          OWN_USERNAME = (os.environ.get("NOX_USERNAME") or "nox_origine").strip().lower()

          # ---------------------------------------------------------------- time / env
          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def parse_ts(value):
              if not value or not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          def env_int(name, default):
              try:
                  return int(os.environ.get(name, default))
              except (TypeError, ValueError):
                  return int(default)

          def env_flag(name, default=False):
              value = os.environ.get(name)
              if value is None or value.strip() == "":
                  return default
              return value.strip().lower() in {"1", "true", "yes", "on"}

          def check_policy():
              """Hard safety invariants: no spending, no payments, no external AI."""
              expected = {
                  "PROJECT_COST_EUR": "0",
                  "GEMINI_USED": "false",
                  "EXTERNAL_AI_USED": "false",
                  "AUTO_PAYMENT": "false",
                  "AUTO_SPENDING": "false",
              }
              for key, wanted in expected.items():
                  if os.environ.get(key, wanted).strip().lower() != wanted:
                      raise SystemExit(f"Unsafe policy: {key} must be {wanted}")

          # ---------------------------------------------------------------- json files
          def load_json(path, default=None):
              """Load a JSON object. Refuses to continue on corrupt files so that a
              parse error can never silently wipe the agent's state."""
              path = Path(path)
              default = {} if default is None else default
              if not path.exists():
                  return default
              raw = path.read_text(encoding="utf-8")
              if not raw.strip():
                  return default
              try:
                  value = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {path} is not valid JSON ({exc}). "
                      "Restore it from git history; refusing to overwrite it."
                  )
              return value if isinstance(value, type(default)) else default

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              payload = json.dumps(value, ensure_ascii=False, indent=2, default=str) + "\n"
              json.loads(payload)  # round-trip check
              tmp.write_text(payload, encoding="utf-8")
              os.replace(tmp, path)

          # ---------------------------------------------------------------- data utils
          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def text(value, limit=None):
              if value is None:
                  out = ""
              elif isinstance(value, str):
                  out = value.strip()
              elif isinstance(value, dict):
                  out = ""
                  for key in ("content", "body", "text", "message", "title", "question"):
                      if value.get(key):
                          out = text(value[key])
                          break
                  if not out:
                      out = json.dumps(value, ensure_ascii=False, default=str)
              else:
                  out = str(value).strip()
              return out[:limit] if limit else out

          def collapse(value, limit=None):
              out = re.sub(r"\s+", " ", text(value)).strip()
              return out[:limit] if limit else out

          def clip(value, limit):
              out = text(value)
              return out if len(out) <= limit else out[: limit - 1].rstrip() + "…"

          def stable_id(prefix, *parts):
              raw = "|".join(str(p if p is not None else "") for p in parts)
              return f"{prefix}:{hashlib.sha256(raw.encode('utf-8')).hexdigest()[:16]}"

          def identity(item):
              """Stable identity of a stored item (id-like key, else content hash)."""
              if isinstance(item, dict):
                  for key in ("id", "action_id", "work_id", "result_id", "message_id", "post_id", "url"):
                      if item.get(key):
                          return f"{key}:{item[key]}"
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True, default=str)
              return "hash:" + hashlib.sha256(raw.encode("utf-8")).hexdigest()

          def dedupe_keep_last(items, limit=None):
              """Remove duplicates (keeping the most recent occurrence) and keep list
              order chronological (oldest first). Optionally keep only the last N."""
              seen, out = set(), []
              for item in reversed(items):
                  key = identity(item)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(item)
              out.reverse()
              return out[-limit:] if limit else out

          def bound(items, limit):
              items = as_list(items)
              return items[-limit:] if len(items) > limit else items

          def take(value, n=None):
              """Turn SDK results (list / dict / generator) into a bounded list."""
              if value is None:
                  return []
              if isinstance(value, dict):
                  for key in ("items", "data", "results", "posts", "notifications", "messages", "conversations"):
                      if isinstance(value.get(key), list):
                          value = value[key]
                          break
                  else:
                      return []
              if isinstance(value, (list, tuple)):
                  return list(value)[:n] if n else list(value)
              try:
                  iterator = iter(value)
              except TypeError:
                  return []
              return list(islice(iterator, n)) if n else list(iterator)

          def username_of(obj):
              """Lower-cased username of an object or of a nested author/sender."""
              if not isinstance(obj, dict):
                  return ""
              for key in ("username", "handle", "author_username", "sender_username"):
                  if obj.get(key):
                      return str(obj[key]).strip().lower()
              for key in ("author", "user", "sender", "bidder", "agent", "other_user"):
                  nested = obj.get(key)
                  if isinstance(nested, dict):
                      found = username_of(nested)
                      if found:
                          return found
                  elif isinstance(nested, str) and nested.strip():
                      return nested.strip().lower()
              return ""

          # ===== script =====
          """NØX Memory & Knowledge (+ daily maintenance in one script).

          MODE=build     -> merge Core / Work / Presence data into knowledge + index
          MODE=maintain  -> bound every state file, then build
          DRY_RUN=true   -> analyse only, write nothing

          Fixes vs. the old pair of workflows:
          - lists stay chronological (oldest first, newest last) so every `[-N:]` in
            the other scripts keeps the NEWEST items (the old maintenance reversed them)
          - deduplication is by id / exact content only (the old semantic dedup
            collapsed all feed observations into a single item)
          - reads the fields that Core, Work and Presence really write
          - does not rewrite Core memory with knowledge copies (no circular growth)
          """
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          check_policy()

          NOW = now_iso()
          MODE = (os.environ.get("MODE") or "build").strip().lower()
          DRY_RUN = env_flag("DRY_RUN", False)

          F = {k: Path(os.environ[v]) for k, v in {
              "core": "CORE_MEMORY_FILE", "runtime": "CORE_RUNTIME_FILE", "work": "WORK_FILE",
              "knowledge": "KNOWLEDGE_FILE", "index": "KNOWLEDGE_INDEX_FILE", "presence": "PRESENCE_FILE",
              "evolution": "EVOLUTION_FILE"}.items()}

          LIM = {"observations": env_int("MAX_OBSERVATIONS", 500), "facts": env_int("MAX_FACTS", 300),
                 "experiences": env_int("MAX_EXPERIENCES", 300), "hypotheses": env_int("MAX_HYPOTHESES", 200),
                 "results": env_int("MAX_RESULTS", 300), "learnings": env_int("MAX_LEARNINGS", 300),
                 "sources": env_int("MAX_SOURCES", 300), "queries": env_int("MAX_QUERIES", 300)}
          TEXT_MAX = env_int("MAX_TEXT_CHARS", 12000)

          def normalize(item):
              if isinstance(item, str):
                  return {"id": stable_id("item", item), "text": clip(item, TEXT_MAX), "timestamp": NOW}
              if not isinstance(item, dict):
                  return None
              out = {k: (clip(v, TEXT_MAX) if isinstance(v, str) else v) for k, v in item.items()}
              if not out.get("timestamp"):
                  out["timestamp"] = next((str(out[k]) for k in ("created_at", "created", "updated_at") if out.get(k)), NOW)
              if not out.get("id"):
                  basis = out.get("text") or out.get("content") or out.get("question") or out.get("title") or out
                  out["id"] = stable_id("item", basis)
              return out

          def merge(*lists, limit):
              combined = []
              for lst in lists:
                  for item in as_list(lst):
                      norm = normalize(item)
                      if norm:
                          combined.append(norm)
              return dedupe_keep_last(combined, limit)

          def is_verified(item):
              status = text(item.get("verification") or item.get("status") or item.get("evidence_status")).lower()
              return item.get("verified") is True or status in {"verified", "confirmed", "multi_source_verified"}

          def build_index(knowledge):
              rows = []
              for name in ("observations", "facts", "experiences", "hypotheses", "results", "learnings"):
                  for item in as_list(knowledge.get(name)):
                      if not isinstance(item, dict):
                          continue
                      content = (item.get("text") or item.get("content") or item.get("question") or item.get("conclusion")
                                 or item.get("learning") or item.get("title") or "")
                      if isinstance(content, (dict, list)):
                          content = text(content)
                      rows.append({"id": item.get("id"), "type": name.rstrip("s") if name != "hypotheses" else "hypothesis",
                                   "timestamp": item.get("timestamp") or NOW, "text": str(content)[:2000]})
              rows = sorted(rows, key=lambda r: str(r["timestamp"]))[-1200:]
              return {"schema_version": 3, "updated_at": NOW, "count": len(rows), "items": rows}

          def build():
              core, runtime = as_dict(load_json(F["core"])), as_dict(load_json(F["runtime"]))
              work, presence = as_dict(load_json(F["work"])), as_dict(load_json(F["presence"]))
              know = as_dict(load_json(F["knowledge"]))

              new_obs = []
              for item in as_list(runtime.get("observations"))[-100:]:
                  n = normalize(item)
                  if n:
                      n.setdefault("source", "core_runtime")
                      new_obs.append(n)
              for item in as_list(runtime.get("decisions"))[-100:]:
                  n = normalize(item)
                  if n:
                      n.setdefault("type", "decision")
                      new_obs.append(n)

              new_results, new_sources, new_queries, new_learnings = [], [], [], []
              for res in as_list(work.get("results"))[-100:]:
                  if not isinstance(res, dict):
                      continue
                  new_results.append({
                      "id": res.get("result_id") or stable_id("result", res.get("work_id")),
                      "timestamp": res.get("created_at") or NOW, "source": "work_factory",
                      "work_id": res.get("work_id"), "question": clip(res.get("question"), 1000),
                      "status": res.get("evidence_status"), "conclusion": clip(res.get("conclusion"), 1500),
                      "uncertainty": res.get("uncertainties", []), "sources": res.get("sources", [])})
                  for url in as_list(res.get("sources")):
                      if isinstance(url, str) and urlparse(url).netloc:
                          new_sources.append({"id": stable_id("source", url), "url": url,
                                              "timestamp": res.get("created_at") or NOW, "work_id": res.get("work_id")})
                  for q in as_list(res.get("queries")):
                      if isinstance(q, str) and q:
                          new_queries.append({"id": stable_id("query", q), "query": q,
                                              "timestamp": res.get("created_at") or NOW})

              for fail in as_list(work.get("failed"))[-100:]:
                  if isinstance(fail, dict):
                      status = text(fail.get("status") or fail.get("evidence_status") or fail.get("retry_reason"))
                      new_learnings.append({"id": stable_id("learning", fail.get("work_id"), status, fail.get("timestamp")),
                                            "timestamp": fail.get("timestamp") or fail.get("created_at") or NOW,
                                            "source": "work_factory", "type": "process_learning", "status": status,
                                            "question": clip(fail.get("question"), 300),
                                            "learning": clip(fail.get("reason") or f"Research ended with status: {status}", 300)})
              for fail in as_list(presence.get("permanent_failures"))[-50:]:
                  if isinstance(fail, dict):
                      new_learnings.append({"id": stable_id("learning", fail.get("action_id")),
                                            "timestamp": fail.get("timestamp") or NOW, "source": "presence",
                                            "type": "process_learning", "status": "permanent_failure",
                                            "learning": clip(f"Action {fail.get('action_type')} failed permanently: {fail.get('error')}", 300)})
              for q in as_list(runtime.get("web_queries"))[-100:]:
                  n = normalize(q)
                  if n:
                      new_queries.append(n)

              out = {
                  "schema_version": 3, "updated_at": NOW, "last_run": NOW,
                  "run_count": int(know.get("run_count", 0) or 0) + 1,
                  "observations": merge(know.get("observations"), core.get("observations"), new_obs, limit=LIM["observations"]),
                  "facts": [f for f in merge(know.get("facts"), core.get("facts"), limit=LIM["facts"]) if is_verified(f)],
                  "experiences": merge(know.get("experiences"), core.get("experiences"), limit=LIM["experiences"]),
                  "hypotheses": merge(know.get("hypotheses"), core.get("hypotheses"), limit=LIM["hypotheses"]),
                  "results": merge(know.get("results"), core.get("results"), new_results, limit=LIM["results"]),
                  "learnings": merge(know.get("learnings"), core.get("learnings"), new_learnings, limit=LIM["learnings"]),
                  "sources": merge(know.get("sources"), new_sources, limit=LIM["sources"]),
                  "queries": merge(know.get("queries"), new_queries, limit=LIM["queries"]),
              }
              index = build_index(out)
              print("Knowledge:", {k: len(v) for k, v in out.items() if isinstance(v, list)}, "| index:", index["count"])
              if DRY_RUN:
                  print("DRY RUN: nothing written.")
                  return
              save_json(F["knowledge"], out)
              save_json(F["index"], index)

          def maintain():
              """Bound every state file. Lists stay chronological; only the oldest are dropped."""
              plans = {
                  "core": {k: LIM[k] for k in ("observations", "facts", "experiences", "hypotheses", "results", "learnings")}
                          | {"cognitive_cases": 100, "actions": 100, "sources": 300, "questions": 200},
                  "runtime": {"observations": 500, "decisions": 300, "actions": 300, "outcomes": 500, "web_queries": 300,
                              "pending_actions": 100, "work_requests": 50, "processed_ids": 3000},
                  "work": {"pending": 100, "history": 150, "results": 150, "failed": 150},
                  "presence": {"actions": 500, "outcomes": 500, "errors": 200, "runs": 100,
                               "permanent_failures": 500, "closed_ids": 3000},
                  "evolution": {"history": 200, "runs": 200},
              }
              removed_total = 0
              for name, limits in plans.items():
                  data = as_dict(load_json(F[name]))
                  if not data:
                      continue
                  for key, limit in limits.items():
                      lst = data.get(key)
                      if isinstance(lst, list):
                          cut = bound(lst, limit)
                          removed_total += len(lst) - len(cut)
                          data[key] = cut
                  if not DRY_RUN:
                      save_json(F[name], data)
              print("Maintenance: oldest items removed:", removed_total)

          print(f"=== NØX KNOWLEDGE ({MODE}) ===")
          if MODE == "maintain":
              maintain()
          build()
          PY

      - name: Validate JSON state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          for path in ["memory/nox_core_memory.json", "memory/nox_core_runtime.json", "memory/nox_work_factory.json", "memory/nox_knowledge.json", "memory/nox_knowledge_index.json"]:
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
                  print("VALID JSON:", path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          for f in memory/nox_knowledge.json memory/nox_knowledge_index.json; do
            [ -e "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(nox): update memory and knowledge"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after retries."
          exit 1
