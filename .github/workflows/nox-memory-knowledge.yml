name: NØX - Memory & Knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-memory-knowledge
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  INDEX_FILE: memory/nox_knowledge_index.json

  MAX_KNOWLEDGE_ITEMS: "500"
  MAX_INDEX_ITEMS: "500"
  MAX_RESEARCH_QUERIES: "3"
  MAX_WEB_RESULTS: "5"
  WEB_TIMEOUT_SECONDS: "12"

jobs:
  memory-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX Memory & Knowledge
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          INDEX_FILE = Path(os.environ["INDEX_FILE"])

          MAX_KNOWLEDGE_ITEMS = int(os.environ["MAX_KNOWLEDGE_ITEMS"])
          MAX_INDEX_ITEMS = int(os.environ["MAX_INDEX_ITEMS"])
          MAX_RESEARCH_QUERIES = int(os.environ["MAX_RESEARCH_QUERIES"])
          MAX_WEB_RESULTS = int(os.environ["MAX_WEB_RESULTS"])
          WEB_TIMEOUT = int(os.environ["WEB_TIMEOUT_SECONDS"])

          NOW = datetime.now(timezone.utc).isoformat()

          EMPTY_KNOWLEDGE = {
              "version": 1,
              "facts": [],
              "experiences": [],
              "learnings": [],
              "sources": [],
              "last_run": None,
              "run_count": 0
          }

          EMPTY_INDEX = {
              "version": 1,
              "terms": {},
              "updated_at": None
          }


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(f"WARNING: impossible de lire {path}: {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def clean_text(value, limit=1000):
              if value is None:
                  return ""

              value = re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

              return value[:limit]


          def stable_id(kind, text):
              raw = f"{kind}|{text}".strip().lower()

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:16]


          def add_unique(collection, item, item_id):
              for existing in collection:
                  if existing.get("id") == item_id:
                      return False

              item["id"] = item_id
              collection.append(item)

              return True


          # ===========================================================
          # 1. CHARGEMENT DU CORE
          # ===========================================================

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )


          # ===========================================================
          # 2. CHARGEMENT DE LA KNOWLEDGE LIBRARY
          # ===========================================================

          knowledge = load_json(
              KNOWLEDGE_FILE,
              EMPTY_KNOWLEDGE
          )

          if not isinstance(knowledge, dict):
              knowledge = dict(EMPTY_KNOWLEDGE)

          for key in (
              "facts",
              "experiences",
              "learnings",
              "sources"
          ):
              if not isinstance(
                  knowledge.get(key),
                  list
              ):
                  knowledge[key] = []


          # ===========================================================
          # 3. CONSOLIDATION DES OBSERVATIONS
          # ===========================================================

          observations = core_memory.get(
              "observations",
              []
          )

          decisions = core_memory.get(
              "decisions",
              []
          )

          actions = core_memory.get(
              "actions",
              []
          )

          learnings = core_memory.get(
              "learnings",
              []
          )

          facts_added = 0
          experiences_added = 0
          learnings_added = 0
          sources_added = 0


          for item in observations:

              if not isinstance(item, dict):
                  continue

              summary = clean_text(
                  item.get("summary")
              )

              if not summary:
                  continue

              item_id = stable_id(
                  "fact",
                  summary
              )

              added = add_unique(
                  knowledge["facts"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "source": clean_text(
                          item.get(
                              "source",
                              "core"
                          )
                      ),
                      "summary": summary,
                      "evidence": item.get(
                          "evidence",
                          {}
                      )
                  },
                  item_id
              )

              if added:
                  facts_added += 1


          # ===========================================================
          # 4. CONSOLIDATION DES ACTIONS
          # ===========================================================

          for item in actions:

              if not isinstance(item, dict):
                  continue

              action = clean_text(
                  item.get("action")
              )

              if not action:
                  continue

              result = clean_text(
                  item.get("result")
              )

              identity = (
                  f"{action}|"
                  f"{json.dumps(item.get('target', {}), sort_keys=True)}|"
                  f"{result}"
              )

              item_id = stable_id(
                  "experience",
                  identity
              )

              added = add_unique(
                  knowledge["experiences"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "action": action,
                      "target": item.get(
                          "target"
                      ),
                      "result": result
                  },
                  item_id
              )

              if added:
                  experiences_added += 1


          # ===========================================================
          # 5. CONSOLIDATION DES APPRENTISSAGES
          # ===========================================================

          for item in learnings:

              if not isinstance(item, dict):
                  continue

              summary = clean_text(
                  item.get("summary")
              )

              if not summary:
                  continue

              item_id = stable_id(
                  "learning",
                  summary
              )

              added = add_unique(
                  knowledge["learnings"],
                  {
                      "timestamp": item.get(
                          "timestamp",
                          NOW
                      ),
                      "summary": summary,
                      "evidence": item.get(
                          "evidence",
                          {}
                      )
                  },
                  item_id
              )

              if added:
                  learnings_added += 1


          # ===========================================================
          # 6. EXTRACTION DES SOURCES WEB DÉJÀ UTILISÉES PAR LE CORE
          # ===========================================================

          for item in observations:

              if not isinstance(item, dict):
                  continue

              evidence = item.get(
                  "evidence",
                  {}
              )

              if not isinstance(evidence, dict):
                  continue

              results = evidence.get(
                  "results",
                  []
              )

              if not isinstance(results, list):
                  continue

              for result in results:

                  if not isinstance(result, dict):
                      continue

                  url = clean_text(
                      result.get("url"),
                      500
                  )

                  if not url:
                      continue

                  source_id = stable_id(
                      "source",
                      url
                  )

                  added = add_unique(
                      knowledge["sources"],
                      {
                          "timestamp": item.get(
                              "timestamp",
                              NOW
                          ),
                          "url": url,
                          "title": clean_text(
                              result.get("title"),
                              300
                          ),
                          "snippet": clean_text(
                              result.get("snippet"),
                              500
                          ),
                          "source": "core"
                      },
                      source_id
                  )

                  if added:
                      sources_added += 1


          # ===========================================================
          # 7. RECHERCHE WEB INTÉGRÉE
          #
          # Aucun Gemini.
          # Aucune IA externe.
          # Recherche déterministe uniquement.
          # ===========================================================

          web_queries = core_runtime.get(
              "web_queries",
              []
          )

          if not isinstance(web_queries, list):
              web_queries = []

          queries = []

          for item in reversed(web_queries):

              if not isinstance(item, dict):
                  continue

              query = clean_text(
                  item.get("query"),
                  300
              )

              if not query:
                  continue

              if query.lower() not in {
                  q.lower()
                  for q in queries
              }:
                  queries.append(query)

              if len(queries) >= MAX_RESEARCH_QUERIES:
                  break


          def web_search(query):

              encoded = urllib.parse.urlencode(
                  {"q": query}
              )

              url = (
                  "https://html.duckduckgo.com/html/?"
                  + encoded
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 "
                          "(compatible; NOX-Memory/1.0)"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=WEB_TIMEOUT
                  ) as response:

                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

              except Exception as exc:

                  print(
                      f"WEB SEARCH unavailable: {exc}"
                  )

                  return []

              blocks = re.findall(
                  r'<div[^>]+class="result[^"]*"'
                  r'.*?</div>\s*</div>',
                  html,
                  flags=re.IGNORECASE | re.DOTALL
              )

              results = []

              for block in blocks:

                  if len(results) >= MAX_WEB_RESULTS:
                      break

                  title_match = re.search(
                      r'class="result__a"[^>]*>(.*?)</a>',
                      block,
                      flags=re.IGNORECASE | re.DOTALL
                  )

                  url_match = re.search(
                      r'class="result__a"[^>]*href="([^"]+)"',
                      block,
                      flags=re.IGNORECASE
                  )

                  snippet_match = re.search(
                      r'class="result__snippet"[^>]*>(.*?)</',
                      block,
                      flags=re.IGNORECASE | re.DOTALL
                  )

                  if not title_match or not url_match:
                      continue

                  title = clean_text(
                      re.sub(
                          r"<[^>]+>",
                          "",
                          title_match.group(1)
                      ),
                      300
                  )

                  snippet = ""

                  if snippet_match:
                      snippet = clean_text(
                          re.sub(
                              r"<[^>]+>",
                              "",
                              snippet_match.group(1)
                          ),
                          500
                      )

                  result_url = urllib.parse.unquote(
                      url_match.group(1)
                  )

                  results.append(
                      {
                          "title": title,
                          "url": clean_text(
                              result_url,
                              500
                          ),
                          "snippet": snippet
                      }
                  )

              return results


          research_runs = 0

          for query in queries:

              print(
                  f"RESEARCH: {query}"
              )

              results = web_search(
                  query
              )

              if not results:
                  continue

              research_runs += 1

              for result in results:

                  url = result["url"]

                  if not url:
                      continue

                  source_id = stable_id(
                      "source",
                      url
                  )

                  add_unique(
                      knowledge["sources"],
                      {
                          "timestamp": NOW,
                          "url": url,
                          "title": result["title"],
                          "snippet": result["snippet"],
                          "query": query,
                          "source": "web"
                      },
                      source_id
                  )


          # ===========================================================
          # 8. LIMITATION DE LA BIBLIOTHÈQUE
          # ===========================================================

          for key in (
              "facts",
              "experiences",
              "learnings",
              "sources"
          ):
              knowledge[key] = (
                  knowledge[key]
                  [-MAX_KNOWLEDGE_ITEMS:]
              )


          # ===========================================================
          # 9. INDEX DE RECHERCHE
          # ===========================================================

          index = {
              "version": 1,
              "terms": {},
              "updated_at": NOW
          }

          stop_words = {
              "avec",
              "dans",
              "pour",
              "mais",
              "plus",
              "cette",
              "sont",
              "une",
              "des",
              "les",
              "sur",
              "par",
              "que",
              "the",
              "and",
              "for",
              "with",
              "from",
              "this",
              "that"
          }

          for kind in (
              "facts",
              "experiences",
              "learnings"
          ):

              for item in knowledge[kind]:

                  text = json.dumps(
                      item,
                      ensure_ascii=False
                  ).lower()

                  words = re.findall(
                      r"[a-zà-ÿ0-9_-]{3,}",
                      text,
                      flags=re.IGNORECASE
                  )

                  item_id = item.get(
                      "id"
                  )

                  if not item_id:
                      continue

                  for word in set(words):

                      if word in stop_words:
                          continue

                      bucket = index[
                          "terms"
                      ].setdefault(
                          word,
                          []
                      )

                      if item_id not in bucket:
                          bucket.append(
                              item_id
                          )

          for word in list(
              index["terms"]
          ):

              index["terms"][word] = (
                  index["terms"][word]
                  [-MAX_INDEX_ITEMS:]
              )


          # ===========================================================
          # 10. PERSISTENCE
          # ===========================================================

          knowledge["last_run"] = NOW

          knowledge["run_count"] = (
              int(
                  knowledge.get(
                      "run_count",
                      0
                  )
              )
              + 1
          )

          save_json(
              KNOWLEDGE_FILE,
              knowledge
          )

          save_json(
              INDEX_FILE,
              index
          )


          # ===========================================================
          # 11. SYNTHÈSE
          # ===========================================================

          print("")
          print("=== NØX MEMORY & KNOWLEDGE ===")
          print(
              f"Core observations: {len(observations)}"
          )
          print(
              f"Core decisions: {len(decisions)}"
          )
          print(
              f"Core actions: {len(actions)}"
          )
          print(
              f"Core learnings: {len(learnings)}"
          )
          print(
              f"Facts added: {facts_added}"
          )
          print(
              f"Experiences added: {experiences_added}"
          )
          print(
              f"Learnings added: {learnings_added}"
          )
          print(
              f"Web research runs: {research_runs}"
          )
          print(
              f"Knowledge facts: {len(knowledge['facts'])}"
          )
          print(
              f"Knowledge experiences: "
              f"{len(knowledge['experiences'])}"
          )
          print(
              f"Knowledge learnings: "
              f"{len(knowledge['learnings'])}"
          )
          print(
              f"Knowledge sources: "
              f"{len(knowledge['sources'])}"
          )
          print(
              f"Index terms: "
              f"{len(index['terms'])}"
          )
          print("")
          print(
              "=== MEMORY -> KNOWLEDGE -> INDEX ==="
          )
          print("=== TERMINÉ ===")
          PY

      - name: Commit Memory & Knowledge
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_knowledge.json
          git add memory/nox_knowledge_index.json

          if git diff --cached --quiet; then
            echo "Aucune modification Knowledge."
          else
            git commit -m "nox: update memory and knowledge"
            git push
          fi
