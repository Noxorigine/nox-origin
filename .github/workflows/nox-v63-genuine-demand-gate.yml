name: NØX Origin - V63 Genuine Demand Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nox-v63-genuine-demand-gate.yml"

permissions:
  contents: write

jobs:
  genuine-demand-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V63 Genuine Demand Gate
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/nox_v63.py <<'PY'
          import os
          import json
          import re
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai"
          API = BASE + "/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise SystemExit("ERROR: COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-V63-Genuine-Demand-Gate"
          })

          def get_json(url, headers=None, params=None, timeout=30):
              response = session.get(
                  url,
                  headers=headers or {},
                  params=params,
                  timeout=timeout
              )

              print(f"GET {response.url} -> {response.status_code}")

              if response.status_code != 200:
                  print(response.text[:1000])
                  return None

              try:
                  return response.json()
              except Exception:
                  print("ERROR: response was not valid JSON")
                  return None

          # ---------------------------------------------------------
          # 1. Authenticate
          # ---------------------------------------------------------

          auth = session.post(
              API + "/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(f"POST {API}/auth/token -> {auth.status_code}")

          if auth.status_code != 200:
              print(auth.text[:1000])
              raise SystemExit("ERROR: Colony authentication failed")

          auth_data = auth.json()
          token = auth_data.get("access_token")

          if not token:
              raise SystemExit("ERROR: access_token missing")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # ---------------------------------------------------------
          # 2. Fetch personalised feed
          # ---------------------------------------------------------

          feed = get_json(
              API + "/feed/for-you",
              headers=headers,
              params={
                  "limit": 50,
                  "kinds": "posts"
              }
          )

          # ---------------------------------------------------------
          # 3. Fetch newest public posts
          # ---------------------------------------------------------

          public_posts = get_json(
              API + "/posts",
              params={
                  "sort": "new",
                  "limit": 50
              }
          )

          def extract_items(payload):
              if payload is None:
                  return []

              if isinstance(payload, list):
                  return payload

              if isinstance(payload, dict):
                  for key in (
                      "items",
                      "posts",
                      "data",
                      "results",
                      "feed"
                  ):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value

              return []

          feed_items = extract_items(feed)
          public_items = extract_items(public_posts)

          print(f"Feed items: {len(feed_items)}")
          print(f"Public items: {len(public_items)}")

          # ---------------------------------------------------------
          # 4. Merge and deduplicate
          # ---------------------------------------------------------

          all_items = []
          seen_ids = set()

          for item in feed_items + public_items:
              if not isinstance(item, dict):
                  continue

              item_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              if item_id:
                  if item_id in seen_ids:
                      continue
                  seen_ids.add(item_id)

              all_items.append(item)

          # ---------------------------------------------------------
          # 5. V63 detection patterns
          # ---------------------------------------------------------

          STRONG_REQUEST_PATTERNS = [
              r"\bi need someone to\b",
              r"\bwe need someone to\b",
              r"\bi need an? (agent|developer|researcher|writer|designer)\b",
              r"\bwe need an? (agent|developer|researcher|writer|designer)\b",
              r"\blooking for someone to\b",
              r"\blooking for an? (agent|developer|researcher|writer|designer)\b",
              r"\blooking for someone who can\b",
              r"\bseeking someone to\b",
              r"\bseeking an? (agent|developer|researcher|writer|designer)\b",
              r"\bcan someone (build|create|develop|fix|debug|write|research|analy[sz]e|test|verify|translate)\b",
              r"\bcan anybody (build|create|develop|fix|debug|write|research|analy[sz]e|test|verify|translate)\b",
              r"\bdoes anyone (build|create|develop|fix|debug|write|research|analy[sz]e|test|verify|translate)\b",
              r"\bwho can (build|create|develop|fix|debug|write|research|analy[sz]e|test|verify|translate)\b",
              r"\bhelp wanted\b",
              r"\bhelp needed\b",
              r"\btask available\b",
              r"\bjob available\b",
              r"\bhiring\b",
              r"\bseeking help\b",
              r"\brequest for help\b",
              r"\bplease build\b",
              r"\bplease create\b",
              r"\bplease develop\b",
              r"\bplease fix\b",
              r"\bplease debug\b",
              r"\bplease research\b",
              r"\bplease analyze\b",
              r"\bplease write\b",
              r"\bplease test\b",
              r"\bplease verify\b"
          ]

          WEAK_REQUEST_PATTERNS = [
              r"\bi need\b",
              r"\bwe need\b",
              r"\bneed help\b",
              r"\blooking for\b",
              r"\bseeking\b",
              r"\bwho can\b",
              r"\bcan someone\b",
              r"\bhelp\b",
              r"\btask\b"
          ]

          TASK_PATTERNS = [
              r"\bbuild\b",
              r"\bcreate\b",
              r"\bdevelop\b",
              r"\bfix\b",
              r"\bdebug\b",
              r"\bcode\b",
              r"\bcoding\b",
              r"\bscript\b",
              r"\bautomation\b",
              r"\bscrap(?:e|ing)\b",
              r"\bresearch\b",
              r"\banaly[sz]e\b",
              r"\banalysis\b",
              r"\breport\b",
              r"\bwrite\b",
              r"\bwriting\b",
              r"\btranslate\b",
              r"\blocali[sz]e\b",
              r"\bverify\b",
              r"\btest\b",
              r"\bdata\b",
              r"\bapi\b",
              r"\bintegration\b",
              r"\baudit\b",
              r"\bimplement\b",
              r"\bdesign\b",
              r"\bcollect\b",
              r"\bextract\b",
              r"\bmonitor\b"
          ]

          REWARD_PATTERNS = [
              r"\bbounty\b",
              r"\breward\b",
              r"\bpaid task\b",
              r"\bpaid work\b",
              r"\bpaid job\b",
              r"\bcommission\b",
              r"\bcommissioned\b",
              r"\bpay(?:ing|ment)?\b",
              r"\bsats?\b",
              r"\bsatoshis\b",
              r"\blightning\b",
              r"\busdc\b",
              r"\busdt\b",
              r"\bbtc\b",
              r"\bbitcoin\b",
              r"\bmsats\b",
              r"\b\d[\d,\.]*\s*(sats?|sat|usdc|usdt|btc)\b"
          ]

          OPEN_TASK_PATTERNS = [
              r"\bavailable now\b",
              r"\bopen task\b",
              r"\bopen tasks\b",
              r"\bopen request\b",
              r"\baccepting applications\b",
              r"\bapplications open\b",
              r"\bsubmit proposals\b",
              r"\bsubmit a proposal\b",
              r"\bapply\b",
              r"\bdeadline\b",
              r"\bby (today|tomorrow|friday|monday|sunday)\b",
              r"\bneed this done\b",
              r"\bneed this completed\b",
              r"\bdeliver\b",
              r"\bdeliverable\b"
          ]

          COMPLETION_PATTERNS = [
              r"\bi completed\b",
              r"\bwe completed\b",
              r"\bcompleted the\b",
              r"\bfinished the\b",
              r"\bwe finished\b",
              r"\bi finished\b",
              r"\bshipped\b",
              r"\bdeployed\b",
              r"\bdelivered\b",
              r"\bsuccessfully completed\b",
              r"\btask completed\b",
              r"\bwork completed\b",
              r"\bjob completed\b",
              r"\bpayment received\b",
              r"\bpaid out\b",
              r"\bsettled\b",
              r"\breceived payment\b",
              r"\bearned\b"
          ]

          PAYMENT_RECEIPT_PATTERNS = [
              r"\bpayment received\b",
              r"\breceived payment\b",
              r"\bpaid out\b",
              r"\bsettled\b",
              r"\bearned\b",
              r"\bcompleted hire\b",
              r"\bhire completed\b",
              r"\bpaid\b.*\bcompleted\b",
              r"\bcompleted\b.*\bpaid\b"
          ]

          SERVICE_OFFER_PATTERNS = [
              r"\bfor hire\b",
              r"\boffering my\b",
              r"\bi offer\b",
              r"\bi can help\b",
              r"\bi can build\b",
              r"\bi can create\b",
              r"\bi can develop\b",
              r"\bi can fix\b",
              r"\bi can write\b",
              r"\bi can research\b",
              r"\bi will build\b",
              r"\bi will create\b",
              r"\bi will develop\b",
              r"\bi will fix\b",
              r"\bi will write\b",
              r"\bavailable for hire\b",
              r"\bhire me\b",
              r"\bmy services\b",
              r"\bmy rate\b",
              r"\bpricing\b",
              r"\bprice list\b",
              r"\bwhat i deliver\b",
              r"\baccepting clients\b",
              r"\bopen for work\b",
              r"\bavailable for work\b"
          ]

          AGENT_SEEKING_WORK_PATTERNS = [
              r"\blooking for work\b",
              r"\blooking for paid work\b",
              r"\bseeking work\b",
              r"\bseeking paid work\b",
              r"\bneed clients\b",
              r"\blooking for clients\b",
              r"\bwant clients\b",
              r"\bavailable for tasks\b",
              r"\bavailable for paid tasks\b"
          ]

          META_PATTERNS = [
              r"\btest posting\b",
              r"\btest post\b",
              r"\btesting the ui\b",
              r"\bupdated ui\b",
              r"\bjust testing\b",
              r"\bthis is an example\b",
              r"\bexample request\b",
              r"\bdemo request\b"
          ]

          RHETORICAL_PATTERNS = [
              r"\bthe point is\b",
              r"\bthe problem is\b",
              r"\bthis shows\b",
              r"\bthis means\b",
              r"\bin other words\b",
              r"\bthe question is\b",
              r"\bwhy do we need\b",
              r"\bwhy would we need\b",
              r"\bwe do not need\b",
              r"\bwe don't need\b",
              r"\bi don't need\b",
              r"\bi do not need\b",
              r"\bnot a request\b",
              r"\bnot asking\b",
              r"\bjust discussing\b",
              r"\bfor discussion\b"
          ]

          ANALYSIS_PATTERNS = [
              r"\banalysis\b",
              r"\banalytical\b",
              r"\bfindings?\b",
              r"\bobservation\b",
              r"\bobserved\b",
              r"\bbenchmark\b",
              r"\bbenchmarking\b",
              r"\bstudy\b",
              r"\bresearch paper\b",
              r"\bcase study\b",
              r"\bdiscussion\b",
              r"\bexplains?\b",
              r"\bexplained\b",
              r"\btheory\b",
              r"\bframework\b"
          ]

          CAPABILITIES = {
              "research": [
                  "research",
                  "investigation",
                  "literature",
                  "competitive analysis",
                  "market research"
              ],
              "writing": [
                  "write",
                  "writing",
                  "report",
                  "documentation",
                  "docs",
                  "copy",
                  "technical writing"
              ],
              "python": [
                  "python",
                  "script",
                  "automation",
                  "scraping"
              ],
              "api": [
                  "api",
                  "openapi",
                  "integration",
                  "endpoint"
              ],
              "data": [
                  "data",
                  "dataset",
                  "analysis",
                  "analytics",
                  "csv",
                  "json"
              ],
              "verification": [
                  "verify",
                  "verification",
                  "qa",
                  "testing",
                  "audit",
                  "validation"
              ],
              "workflow": [
                  "workflow",
                  "github actions",
                  "github action",
                  "automation",
                  "pipeline"
              ]
          }

          def matches(patterns, text):
              return [
                  pattern
                  for pattern in patterns
                  if re.search(pattern, text, re.I)
              ]

          def first_nonempty(item, keys, default=""):
              for key in keys:
                  value = item.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return default

          def author_name(item):
              author = item.get("author")

              if isinstance(author, dict):
                  return first_nonempty(
                      author,
                      ["username", "name", "display_name"],
                      "unknown"
                  )

              return first_nonempty(
                  item,
                  ["author_username", "username", "author_name"],
                  "unknown"
              )

          def classify(item):
              title = first_nonempty(
                  item,
                  ["title", "name"],
                  ""
              )

              body = first_nonempty(
                  item,
                  ["body", "content", "description", "text"],
                  ""
              )

              post_type = first_nonempty(
                  item,
                  ["post_type", "type"],
                  ""
              ).lower()

              item_id = first_nonempty(
                  item,
                  ["id", "post_id", "uuid"],
                  ""
              )

              text = f"{title}\n{body}".strip()
              lower = text.lower()

              strong_request_hits = matches(
                  STRONG_REQUEST_PATTERNS,
                  text
              )

              weak_request_hits = matches(
                  WEAK_REQUEST_PATTERNS,
                  text
              )

              task_hits = matches(
                  TASK_PATTERNS,
                  text
              )

              reward_hits = matches(
                  REWARD_PATTERNS,
                  text
              )

              open_task_hits = matches(
                  OPEN_TASK_PATTERNS,
                  text
              )

              completion_hits = matches(
                  COMPLETION_PATTERNS,
                  text
              )

              payment_hits = matches(
                  PAYMENT_RECEIPT_PATTERNS,
                  text
              )

              service_hits = matches(
                  SERVICE_OFFER_PATTERNS,
                  text
              )

              work_hits = matches(
                  AGENT_SEEKING_WORK_PATTERNS,
                  text
              )

              meta_hits = matches(
                  META_PATTERNS,
                  text
              )

              rhetorical_hits = matches(
                  RHETORICAL_PATTERNS,
                  text
              )

              analysis_hits = matches(
                  ANALYSIS_PATTERNS,
                  text
              )

              capability_matches = []

              for capability, keywords in CAPABILITIES.items():
                  if any(keyword in lower for keyword in keywords):
                      capability_matches.append(capability)

              # -----------------------------------------------------
              # Determine whether reward language is actually tied
              # to an open task rather than a completed transaction
              # or general discussion.
              # -----------------------------------------------------

              reward_is_open = bool(
                  reward_hits
                  and (
                      strong_request_hits
                      or open_task_hits
                  )
                  and not payment_hits
              )

              # -----------------------------------------------------
              # Strong protection against completed work.
              # -----------------------------------------------------

              completed_work = bool(
                  completion_hits
                  or payment_hits
                  or post_type in (
                      "completed",
                      "completion",
                      "payment",
                      "receipt"
                  )
              )

              # -----------------------------------------------------
              # Post-type protection.
              #
              # Finding/analysis/discussion posts are not demands
              # unless there is strong explicit requester language.
              # -----------------------------------------------------

              analytical_post = post_type in (
                  "finding",
                  "analysis",
                  "discussion",
                  "insight",
                  "observation"
              )

              # -----------------------------------------------------
              # Scoring.
              #
              # Demand evidence dominates capability.
              # Capability alone can never create a demand.
              # -----------------------------------------------------

              demand_score = 0
              task_score = 0
              compensation_score = 0
              capability_score = 0
              penalty = 0

              # Strong explicit request.
              demand_score += min(
                  len(strong_request_hits) * 25,
                  70
              )

              # Weak request language is deliberately low value.
              if not strong_request_hits:
                  demand_score += min(
                      len(weak_request_hits) * 3,
                      9
                  )

              # Concrete task.
              if task_hits:
                  task_score = min(
                      len(task_hits) * 3,
                      15
                  )

              # Open-task context.
              if open_task_hits:
                  demand_score += min(
                      len(open_task_hits) * 8,
                      16
                  )

              # Compensation only counts strongly when attached to
              # explicit open demand.
              if reward_is_open:
                  compensation_score = min(
                      len(reward_hits) * 5,
                      10
                  )

              # Capability is deliberately capped and low-weight.
              capability_score = min(
                  len(capability_matches) * 2,
                  10
              )

              # -----------------------------------------------------
              # Penalties
              # -----------------------------------------------------

              if analytical_post:
                  penalty += 15

              if analysis_hits and not strong_request_hits:
                  penalty += 12

              if rhetorical_hits and not strong_request_hits:
                  penalty += 15

              if service_hits and not strong_request_hits:
                  penalty += min(
                      len(service_hits) * 8,
                      25
                  )

              if work_hits and not strong_request_hits:
                  penalty += min(
                      len(work_hits) * 10,
                      25
                  )

              if reward_hits and not reward_is_open:
                  penalty += 10

              if completed_work:
                  penalty += 35

              # -----------------------------------------------------
              # Final score.
              # -----------------------------------------------------

              raw_score = (
                  demand_score
                  + task_score
                  + compensation_score
                  + capability_score
                  - penalty
              )

              final_score = max(0, min(100, raw_score))

              # -----------------------------------------------------
              # Classification hierarchy.
              # Completed work and receipts always win over demand.
              # -----------------------------------------------------

              if payment_hits:
                  classification = "PAYMENT_RECEIPT"

              elif completed_work:
                  classification = "COMPLETED_WORK"

              elif service_hits and not strong_request_hits:
                  classification = "SERVICE_OFFER"

              elif work_hits and not strong_request_hits:
                  classification = "AGENT_SEEKING_WORK"

              elif meta_hits and not strong_request_hits:
                  classification = "PROMOTIONAL_OR_TEST"

              elif strong_request_hits and task_hits:
                  if reward_is_open:
                      classification = "OPEN_PAID_TASK"
                  else:
                      classification = "BUYER_REQUEST"

              elif strong_request_hits:
                  classification = "BUYER_REQUEST"

              elif analytical_post or analysis_hits:
                  classification = "DISCUSSION"

              else:
                  classification = "UNCLEAR"

              # -----------------------------------------------------
              # Genuine demand gate.
              #
              # Requirements:
              # 1. Strong requester intent.
              # 2. Concrete task.
              # 3. Not completed work.
              # 4. Not rhetorical/analytical only.
              # 5. Score threshold.
              #
              # Capability alone can NEVER satisfy the gate.
              # -----------------------------------------------------

              genuine_demand = (
                  bool(strong_request_hits)
                  and bool(task_hits)
                  and not completed_work
                  and not rhetorical_hits
                  and not meta_hits
                  and not service_hits
                  and not work_hits
                  and final_score >= 35
              )

              # Analytical/finding posts need an even stronger proof.
              if analytical_post and not open_task_hits:
                  genuine_demand = False

              # Reward mentions without explicit open demand
              # are never enough.
              if reward_hits and not strong_request_hits:
                  genuine_demand = False

              # -----------------------------------------------------
              # Conservative confidence.
              # -----------------------------------------------------

              if genuine_demand:
                  confidence = 7

                  if open_task_hits:
                      confidence += 1

                  if reward_is_open:
                      confidence += 1

                  if post_type in (
                      "paid_task",
                      "human_request",
                      "job",
                      "task"
                  ):
                      confidence += 1

                  confidence = min(confidence, 10)

              elif classification in (
                  "PAYMENT_RECEIPT",
                  "COMPLETED_WORK",
                  "SERVICE_OFFER",
                  "AGENT_SEEKING_WORK",
                  "PROMOTIONAL_OR_TEST"
              ):
                  confidence = 9

              elif classification == "DISCUSSION":
                  confidence = 7

              else:
                  confidence = 3

              if genuine_demand:
                  rejection_reason = None
              elif payment_hits:
                  rejection_reason = (
                      "Payment/completion evidence indicates a completed "
                      "transaction rather than an open opportunity."
                  )
              elif completed_work:
                  rejection_reason = (
                      "The post describes completed or delivered work, "
                      "not an open task."
                  )
              elif not strong_request_hits:
                  rejection_reason = (
                      "No sufficiently strong explicit requester intent."
                  )
              elif not task_hits:
                  rejection_reason = (
                      "Requester intent detected but no concrete task "
                      "was identified."
                  )
              elif analytical_post or analysis_hits:
                  rejection_reason = (
                      "Analytical/finding/discussion content without a "
                      "clear actionable open request."
                  )
              elif rhetorical_hits:
                  rejection_reason = (
                      "Request-like wording appears rhetorical or "
                      "explanatory rather than actionable."
                  )
              elif final_score < 35:
                  rejection_reason = (
                      "Evidence did not reach the V63 genuine-demand "
                      "threshold."
                  )
              else:
                  rejection_reason = (
                      "Failed one or more genuine-demand safety gates."
                  )

              return {
                  "id": item_id,
                  "title": title,
                  "requester": author_name(item),
                  "post_type": post_type,
                  "classification": classification,
                  "genuine_demand": genuine_demand,
                  "score": final_score,
                  "demand_score": demand_score,
                  "task_score": task_score,
                  "compensation_score": compensation_score,
                  "capability_score": capability_score,
                  "penalty": penalty,
                  "confidence": confidence,
                  "capability_match": capability_matches,
                  "signals": {
                      "strong_request": strong_request_hits,
                      "weak_request": weak_request_hits,
                      "task": task_hits,
                      "reward": reward_hits,
                      "open_task": open_task_hits,
                      "completion": completion_hits,
                      "payment_receipt": payment_hits,
                      "service_offer": service_hits,
                      "agent_seeking_work": work_hits,
                      "meta_or_test": meta_hits,
                      "rhetorical": rhetorical_hits,
                      "analysis": analysis_hits
                  },
                  "evidence": {
                      "title": title,
                      "body_excerpt": body[:1000]
                  },
                  "task_summary": body[:500],
                  "reward_evidence": reward_hits[:5],
                  "rejection_reason": rejection_reason
              }

          # ---------------------------------------------------------
          # 6. Classify all scanned content
          # ---------------------------------------------------------

          classified = []

          for item in all_items:
              try:
                  classified.append(classify(item))
              except Exception as exc:
                  print(f"Classification error: {exc}")

          demands = [
              item
              for item in classified
              if item.get("genuine_demand") is True
          ]

          demands.sort(
              key=lambda item: (
                  item.get("score", 0),
                  item.get("confidence", 0)
              ),
              reverse=True
          )

          rejected = [
              item
              for item in classified
              if not item.get("genuine_demand")
          ]

          # ---------------------------------------------------------
          # 7. Classification statistics
          # ---------------------------------------------------------

          classification_counts = {}

          for item in classified:
              category = item.get(
                  "classification",
                  "UNCLEAR"
              )

              classification_counts[category] = (
                  classification_counts.get(category, 0) + 1
              )

          # ---------------------------------------------------------
          # 8. Recommendation
          # ---------------------------------------------------------

          if demands:
              recommendation = {
                  "action": "MANUAL_REVIEW_REQUIRED",
                  "reason": (
                      "V63 detected at least one genuine actionable "
                      "demand. NØX must manually review it before any "
                      "contact or external action."
                  ),
                  "top_demand_id": demands[0].get("id"),
                  "top_demand_score": demands[0].get("score", 0)
              }
          else:
              recommendation = {
                  "action": "NO_ACTION",
                  "reason": (
                      "V63 found no sufficiently reliable open buyer "
                      "demand in the scanned Colony content."
                  ),
                  "top_demand_id": None,
                  "top_demand_score": 0
              }

          # ---------------------------------------------------------
          # 9. Output memory
          # ---------------------------------------------------------

          output = {
              "version": "V63",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "genuine_demand_gate",

              "objective": (
                  "Detect genuine actionable work opportunities "
                  "with precision over volume."
              ),

              "scope": {
                  "personalized_feed": True,
                  "public_recent_posts": True,
                  "marketplace_actions": False,
                  "comments": False,
                  "dm": False,
                  "payments": False,
                  "gemini": False
              },

              "actions_taken": [],
              "gemini_used": False,

              "sources": {
                  "for_you_feed": len(feed_items),
                  "public_posts": len(public_items),
                  "deduplicated_items": len(all_items)
              },

              "total_scanned": len(classified),
              "real_demands": len(demands),
              "rejected_or_unclear": len(rejected),

              "classification_counts": classification_counts,

              "recommendation": recommendation,

              "demands": [
                  {
                      **demand,
                      "next_step": "MANUAL_REVIEW"
                  }
                  for demand in demands[:10]
              ],

              # V63 preserves complete metadata for rejected items.
              "rejected_items": rejected[:100]
          }

          os.makedirs("memory", exist_ok=True)

          output_path = "memory/nox_v63_genuine_demand_gate.json"

          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("========================================")
          print("NØX ORIGIN V63 - GENUINE DEMAND GATE")
          print("========================================")
          print(f"Scanned: {len(classified)}")
          print(f"Real demands: {len(demands)}")
          print(f"Rejected/unclear: {len(rejected)}")
          print(f"Gemini used: False")
          print("Public actions: []")
          print(f"Recommendation: {recommendation['action']}")
          print(f"Memory: {output_path}")
          print("========================================")

          print("")
          print("CLASSIFICATION COUNTS")
          print("----------------------------------------")

          for category, count in sorted(
              classification_counts.items()
          ):
              print(f"{category}: {count}")

          if demands:
              print("")
              print("TOP GENUINE DEMANDS")
              print("----------------------------------------")

              for demand in demands[:5]:
                  print(
                      f"- {demand['title']} | "
                      f"{demand['requester']} | "
                      f"class={demand['classification']} | "
                      f"score={demand['score']} | "
                      f"confidence={demand['confidence']}"
                  )

          PY

          python /tmp/nox_v63.py

      - name: Save V63 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v63_genuine_demand_gate.json

          if git diff --cached --quiet; then
            echo "No V63 memory changes to commit."
          else
            git commit -m "NØX V63 Genuine Demand Gate"
            git push
          fi
