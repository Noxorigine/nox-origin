name: NØX V96 — Controlled Correction Deployment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v96-controlled-correction-deployment
  cancel-in-progress: false

jobs:
  controlled-correction-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V96
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          MEMORY = "memory"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(name):
              path = os.path.join(MEMORY, name)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(name, data):
              os.makedirs(MEMORY, exist_ok=True)
              with open(
                  os.path.join(MEMORY, name),
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          # ---------------------------------------------------------
          # LOAD VALIDATION CHAIN
          # ---------------------------------------------------------

          v92 = load(
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          v93 = load(
              "nox_v93_autonomous_self_correction_validation.json"
          )

          v94 = load(
              "nox_v94_controlled_live_comparison.json"
          )

          v95 = load(
              "nox_v95_controlled_correction_arbitration.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          v90 = load(
              "nox_v90_autonomous_decision_framework.json"
          )

          # ---------------------------------------------------------
          # RECOVER SELECTED CORRECTION
          # ---------------------------------------------------------

          selected = v92.get(
              "selected_correction",
              {}
          )

          if not isinstance(selected, dict):
              selected = {}

          correction_id = text(
              selected.get("id")
          )

          correction_name = text(
              selected.get("name")
          )

          correction_change = text(
              selected.get("change")
          )

          # ---------------------------------------------------------
          # READ V95 ARBITRATION
          # ---------------------------------------------------------

          arbitration = v95.get(
              "arbitration",
              {}
          )

          if not isinstance(arbitration, dict):
              arbitration = {}

          v95_status = text(
              arbitration.get("status")
          )

          v95_score = number(
              arbitration.get("score"),
              0
          )

          v95_confidence = number(
              arbitration.get("confidence"),
              0
          )

          # ---------------------------------------------------------
          # READ V93 / V94 VALIDATION
          # ---------------------------------------------------------

          v93_validation = v93.get(
              "validation",
              {}
          )

          if not isinstance(v93_validation, dict):
              v93_validation = {}

          v93_status = text(
              v93_validation.get("status")
          )

          v94_validation = v94.get(
              "live_validation",
              {}
          )

          if not isinstance(v94_validation, dict):
              v94_validation = {}

          v94_status = text(
              v94_validation.get("status")
          )

          v94_confidence = number(
              v94_validation.get("confidence"),
              0
          )

          # ---------------------------------------------------------
          # DEPLOYMENT GATE
          #
          # V96 only activates the correction when the previous
          # evidence chain supports controlled deployment.
          # ---------------------------------------------------------

          deployment_gate = False
          gate_reasons = []

          if v95_status == (
              "CLEAR_CONTROLLED_DEPLOYMENT_CANDIDATE"
          ):
              deployment_gate = True
              gate_reasons.append(
                  "V95 explicitly selected the correction "
                  "as a controlled deployment candidate."
              )
          else:
              gate_reasons.append(
                  "V95 did not grant clear controlled deployment "
                  "candidate status."
              )

          if v95_score >= 80:
              gate_reasons.append(
                  "V95 arbitration score is at least 80/100."
              )
          else:
              deployment_gate = False
              gate_reasons.append(
                  "V95 arbitration score is below 80/100."
              )

          if v95_confidence >= 0.80:
              gate_reasons.append(
                  "V95 confidence is at least 0.80."
              )
          else:
              deployment_gate = False
              gate_reasons.append(
                  "V95 confidence is below 0.80."
              )

          if not correction_id:
              deployment_gate = False
              gate_reasons.append(
                  "No correction ID was recovered from V92."
              )

          if not v93_status:
              deployment_gate = False
              gate_reasons.append(
                  "V93 validation status is unavailable."
              )

          if not v94_status:
              deployment_gate = False
              gate_reasons.append(
                  "V94 live validation status is unavailable."
              )

          # ---------------------------------------------------------
          # CONTROLLED CONFIGURATION
          #
          # The correction is stored separately from the historical
          # baseline. This is the reversible deployment layer.
          # ---------------------------------------------------------

          baseline_config = {
              "engine": "NØX autonomous decision framework",
              "version": "V90_BASELINE",
              "active": not deployment_gate,
              "source": "V90",
              "modifiable_by_v96": False
          }

          controlled_config = {
              "engine": "NØX autonomous decision framework",
              "version": "V96_CONTROLLED",
              "active": deployment_gate,
              "correction_id": correction_id,
              "correction_name": correction_name,
              "change": correction_change,
              "source": "V92",
              "validated_by": [
                  "V93",
                  "V94",
                  "V95"
              ],
              "reversible": True,
              "rollback_target": "V90_BASELINE",
              "permanent": False
          }

          # ---------------------------------------------------------
          # PRESERVE BASELINE
          # ---------------------------------------------------------

          save(
              "nox_v96_baseline_decision_config.json",
              baseline_config
          )

          save(
              "nox_v96_controlled_correction_config.json",
              controlled_config
          )

          # ---------------------------------------------------------
          # DEPLOYMENT STATE
          # ---------------------------------------------------------

          if deployment_gate:
              deployment_status = (
                  "CONTROLLED_CORRECTION_ACTIVE"
              )

              authority = (
                  "V96_CONTROLLED_DEPLOYMENT_ACTIVE"
              )

              next_stage = (
                  "V97_DEPLOYMENT_RESULT_LEARNING"
              )

          else:
              deployment_status = (
                  "DEPLOYMENT_BLOCKED"
              )

              authority = (
                  "RETAIN_BASELINE"
              )

              next_stage = (
                  "V96_REQUIRES_FURTHER_VALIDATION"
              )

          # ---------------------------------------------------------
          # DEPLOYMENT ID
          # ---------------------------------------------------------

          deployment_id = (
              "V96-"
              + datetime.now(timezone.utc).strftime(
                  "%Y%m%dT%H%M%SZ"
              )
          )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V96",
              "generated_at": now(),
              "mode": "controlled_correction_deployment",

              "deployment": {
                  "deployment_id": deployment_id,
                  "status": deployment_status,
                  "gate_open": deployment_gate,
                  "authority": authority
              },

              "correction": {
                  "id": correction_id,
                  "name": correction_name,
                  "change": correction_change
              },

              "evidence_chain": {
                  "v93_status": v93_status,
                  "v94_status": v94_status,
                  "v94_confidence": v94_confidence,
                  "v95_status": v95_status,
                  "v95_score": v95_score,
                  "v95_confidence": v95_confidence
              },

              "configuration": {
                  "baseline_preserved": True,
                  "controlled_layer_created": True,
                  "rollback_target": "V90_BASELINE",
                  "permanent_change": False,
                  "production_rule_overwritten": False
              },

              "gate": {
                  "opened": deployment_gate,
                  "reasons": gate_reasons
              },

              "rollback": {
                  "available": True,
                  "target": "V90_BASELINE",
                  "automatic_rollback": False,
                  "rollback_trigger": (
                      "V97 or later evidence may recommend rollback."
                  )
              },

              "autonomy": {
                  "correction_origin": "NØX V92",
                  "validation_chain": [
                      "V93",
                      "V94",
                      "V95"
                  ],
                  "controlled_deployment": deployment_gate,
                  "permanent_self_modification": False,
                  "automatic_rollback": False,
                  "human_override": True
              },

              "next_stage": {
                  "version": next_stage,
                  "purpose": (
                      "Measure the real decision effects of the "
                      "controlled correction and determine whether "
                      "it should be retained, rolled back or refined."
                  )
              },

              "safety": {
                  "gemini_disabled": True,
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "production_rule_overwrite": False,
                  "permanent_self_modification": False,
                  "rollback_available": True,
                  "zero_cost_constraint": True,
                  "human_override": True
              },

              "answer_status": deployment_status
          }

          # ---------------------------------------------------------
          # SAVE RESULT
          # ---------------------------------------------------------

          save(
              "nox_v96_controlled_correction_deployment.json",
              result
          )

          # ---------------------------------------------------------
          # MARKDOWN REPORT
          # ---------------------------------------------------------

          lines = []

          lines.append(
              "# NØX V96 — Controlled Correction Deployment"
          )
          lines.append("")
          lines.append(
              "Generated: "
              + text(result["generated_at"])
          )
          lines.append("")

          lines.append("## Deployment")
          lines.append("")
          lines.append(
              "- Deployment ID: "
              + deployment_id
          )
          lines.append(
              "- Status: "
              + deployment_status
          )
          lines.append(
              "- Gate open: "
              + str(deployment_gate)
          )
          lines.append(
              "- Authority: "
              + authority
          )
          lines.append("")

          lines.append("## Correction")
          lines.append("")
          lines.append(
              "- ID: "
              + correction_id
          )
          lines.append(
              "- Name: "
              + correction_name
          )
          lines.append(
              "- Change: "
              + correction_change
          )
          lines.append("")

          lines.append("## Evidence chain")
          lines.append("")
          lines.append(
              "- V93: "
              + v93_status
          )
          lines.append(
              "- V94: "
              + v94_status
          )
          lines.append(
              "- V94 confidence: "
              + str(v94_confidence)
          )
          lines.append(
              "- V95: "
              + v95_status
          )
          lines.append(
              "- V95 score: "
              + str(v95_score)
              + "/100"
          )
          lines.append(
              "- V95 confidence: "
              + str(v95_confidence)
          )
          lines.append("")

          lines.append("## Deployment gate")
          lines.append("")

          for reason in gate_reasons:
              lines.append(
                  "- " + reason
              )

          lines.append("")

          lines.append("## Reversibility")
          lines.append("")
          lines.append(
              "- Baseline preserved: true"
          )
          lines.append(
              "- Rollback target: V90_BASELINE"
          )
          lines.append(
              "- Permanent modification: false"
          )
          lines.append(
              "- Production rule overwritten: false"
          )
          lines.append("")

          lines.append("## Next stage")
          lines.append("")
          lines.append(
              "V97 will measure the actual decision effects "
              "of the controlled correction."
          )
          lines.append(
              "The correction can then be retained, rolled back "
              "or refined from observed evidence."
          )
          lines.append("")

          lines.append("## Safety")
          lines.append("")
          lines.append("- Gemini: disabled")
          lines.append("- External action: disabled")
          lines.append("- Contact: disabled")
          lines.append("- Bidding: disabled")
          lines.append("- Payments: disabled")
          lines.append("- Permanent self-modification: false")
          lines.append("- Rollback available: true")
          lines.append("- Project cost: €0")
          lines.append("- Human override: enabled")

          with open(
              os.path.join(
                  MEMORY,
                  "nox_v96_controlled_correction_deployment.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          print(
              json.dumps(
                  {
                      "version": "V96",
                      "status": deployment_status,
                      "correction": correction_id,
                      "gate_open": deployment_gate,
                      "v95_score": v95_score,
                      "v95_confidence": v95_confidence,
                      "rollback": True,
                      "next_stage": next_stage
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V96 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v96_baseline_decision_config.json
          git add memory/nox_v96_controlled_correction_config.json
          git add memory/nox_v96_controlled_correction_deployment.json
          git add memory/nox_v96_controlled_correction_deployment.md

          git diff --cached --quiet || \
            git commit -m "NØX V96 controlled correction deployment"

          git push
