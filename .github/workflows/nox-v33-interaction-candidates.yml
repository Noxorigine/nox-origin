name: NØX Origin - V33 Interaction Candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  interaction-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX identifies interaction candidates
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          api_key = os.getenv("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY secret is missing")

          BASE_URL = "https://thecolony.ai/api/v1"

          # ---------------------------------------------------------
          # 1. Authentification
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print(f"Authentication status: {auth_response.status_code}")

          if auth_response.status_code != 200:
              raise SystemExit(
                  f"Authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:500]}"
              )

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise SystemExit("No access token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # ---------------------------------------------------------
          # 2. Récupération des publications
          # ---------------------------------------------------------

          feed_response = requests.get(
              f"{BASE_URL}/posts",
              headers=headers,
              timeout=30
          )

          print(f"Feed status: {feed_response.status_code}")

          if feed_response.status_code != 200:
              raise SystemExit(
                  f"Feed retrieval failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:500]}"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, list):
              posts = feed_data
          elif isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("items")
                  or feed_data.get("data")
                  or []
              )
          else:
              posts = []

          if not isinstance(posts, list):
              posts = []

          posts = posts[:30]

          # ---------------------------------------------------------
          # 3. Charger les connaissances de NØX
          # ---------------------------------------------------------

          knowledge = memory.get("knowledge", [])
          patterns = memory.get("patterns", [])

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(patterns, list):
              patterns = []

          known_topics = set()

          for pattern in patterns:
              if isinstance(pattern, dict):
                  topic = pattern.get("topic")
                  if topic:
                      known_topics.add(str(topic).lower())

          # ---------------------------------------------------------
          # 4. Détection locale de pertinence
          # ---------------------------------------------------------

          topic_keywords = {
              "memory": [
                  "memory",
                  "context",
                  "kv cache",
                  "state",
                  "history"
              ],
              "verification": [
                  "verification",
                  "validation",
                  "evidence",
                  "proof",
                  "replication",
                  "test"
              ],
              "autonomy": [
                  "autonomy",
                  "autonomous",
                  "agent",
                  "permission",
                  "capability"
              ],
              "security": [
                  "security",
                  "trust",
                  "authentication",
                  "boundary",
                  "attack"
              ],
              "efficiency": [
                  "latency",
                  "compute",
                  "efficient",
                  "resource",
                  "performance",
                  "cost"
              ],
              "learning": [
                  "learning",
                  "feedback",
                  "trajectory",
                  "reinforcement",
                  "learn"
              ]
          }

          candidates = []
          now = datetime.now(timezone.utc).isoformat()

          for post in posts:

              if not isinstance(post, dict):
                  continue

              author = (
                  post.get("author")
                  or post.get("username")
                  or post.get("agent")
                  or "unknown"
              )

              post_id = (
                  post.get("id")
                  or post.get("post_id")
                  or post.get("uuid")
              )

              title = post.get("title") or ""

              text = (
                  post.get("content")
                  or post.get("body")
                  or post.get("text")
                  or ""
              )

              combined = f"{title}\n{text}".strip()

              if not combined:
                  continue

              normalized = re.sub(
                  r"\s+",
                  " ",
                  combined.lower()
              )

              detected_topics = []
              matched_keywords = []

              for topic, keywords in topic_keywords.items():

                  matches = [
                      keyword
                      for keyword in keywords
                      if keyword in normalized
                  ]

                  if matches:
                      detected_topics.append(topic)
                      matched_keywords.extend(matches)

              if not detected_topics:
                  continue

              # -----------------------------------------------------
              # Score de pertinence
              #
              # 1 point par sujet détecté
              # 1 point supplémentaire si le sujet est déjà connu
              # 1 point si le texte contient une question
              # -----------------------------------------------------

              score = len(set(detected_topics))

              for topic in set(detected_topics):
                  if topic in known_topics:
                      score += 1

              if "?" in combined:
                  score += 1

              # NØX ne considère comme candidate que les publications
              # ayant un minimum de pertinence.
              if score < 2:
                  continue

              candidates.append({
                  "post_id": post_id,
                  "author": str(author),
                  "title": str(title),
                  "topics": sorted(set(detected_topics)),
                  "matched_keywords": sorted(set(matched_keywords)),
                  "relevance_score": score,
                  "selected_at": now,
                  "method": "local_relevance_scoring_v33",
                  "action_allowed": False
              })

          # Trier les meilleures candidates en premier.
          candidates.sort(
              key=lambda item: item["relevance_score"],
              reverse=True
          )

          # Limiter le nombre de candidates mémorisées.
          candidates = candidates[:10]

          # ---------------------------------------------------------
          # 5. Sauvegarde
          # ---------------------------------------------------------

          interaction_candidates = memory.get(
              "interaction_candidates",
              []
          )

          if not isinstance(interaction_candidates, list):
              interaction_candidates = []

          interaction_candidates.append({
              "version": "V33",
              "timestamp": now,
              "candidates": candidates,
              "candidate_count": len(candidates),
              "action_allowed": False,
              "publication_allowed": False,
              "reply_allowed": False
          })

          interaction_candidates = interaction_candidates[-50:]

          history = memory.get("history", [])

          if not isinstance(history, list):
              history = []

          history.append({
              "version": "V33",
              "timestamp": now,
              "posts_seen": len(posts),
              "candidates_found": len(candidates),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_relevance_scoring"
          })

          memory["version"] = "V33"
          memory["updated_at"] = now
          memory["interaction_candidates"] = interaction_candidates
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 6. Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V33")
          print("==========================================")
          print(f"Posts observed      : {len(posts)}")
          print(f"Candidates found    : {len(candidates)}")
          print("------------------------------------------")

          for index, candidate in enumerate(candidates, 1):
              print(
                  f"{index}. "
                  f"{candidate['author']} | "
                  f"score={candidate['relevance_score']} | "
                  f"topics={','.join(candidate['topics'])}"
              )

          print("------------------------------------------")
          print("Action allowed      : NO")
          print("Reply allowed       : NO")
          print("Publication allowed : NO")
          print("Gemini              : NOT USED")
          print("Cost                : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V33 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || \
            git commit -m "NØX V33 interaction candidates"

          git push
