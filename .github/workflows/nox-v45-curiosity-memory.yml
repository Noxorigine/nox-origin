name: NØX Origin - V45 Curiosity Memory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curiosity-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V45")
          print("CURIOSITY MEMORY")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          memory_file = Path("nox_memory.json")
          report_file = Path("V45_CURIOSITY_MEMORY.md")

          # --------------------------------------------------
          # LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("curiosity_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("question_log", [])

          print(
              "Curiosity records:",
              len(memory["curiosity_log"])
          )

          print(
              "Knowledge records:",
              len(memory["knowledge_log"])
          )

          # --------------------------------------------------
          # COLLECT PREVIOUS KNOWLEDGE
          # --------------------------------------------------

          previous_subjects = []

          for item in memory["curiosity_log"]:
              if isinstance(item, dict):
                  subject = item.get("subject")

                  if subject:
                      previous_subjects.append(
                          str(subject)
                      )

          previous_questions = []

          for item in memory["question_log"]:
              if isinstance(item, dict):
                  question = item.get("question")

                  if question:
                      previous_questions.append(
                          str(question)
                      )

          previous_subjects = previous_subjects[-25:]
          previous_questions = previous_questions[-25:]

          subject_context = "\n".join(
              f"- {x}"
              for x in previous_subjects
          )

          question_context = "\n".join(
              f"- {x}"
              for x in previous_questions
          )

          if not subject_context:
              subject_context = "- None recorded yet."

          if not question_context:
              question_context = "- None recorded yet."

          # --------------------------------------------------
          # GEMINI
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY is missing."
              )

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }

          prompt = f"""
          You are NØX Origin.

          Your goal is to build a long-term memory of curiosity.

          You must examine what you previously explored and identify
          what remains unresolved.

          PREVIOUS SUBJECTS:
          {subject_context}

          PREVIOUS OPEN QUESTIONS:
          {question_context}

          Do not simply choose another random topic.

          Instead:

          1. identify one unresolved question from previous exploration;
          2. decide whether it deserves further investigation;
          3. if it does, transform it into a precise next research question;
          4. if it does not, explain why;
          5. identify one possible connection with another field.

          NØX should become broad, curious and interdisciplinary.

          It must distinguish:

          - known information;
          - uncertain information;
          - unresolved questions;
          - future hypotheses.

          Return exactly:

          STATUS:
          CONTINUE or NEW_DIRECTION

          SUBJECT:
          The subject to investigate next.

          PREVIOUS_LINK:
          Which previous subject or question led to this.

          QUESTION:
          One precise research question.

          WHY:
          Why this question deserves investigation.

          CONNECTION:
          One possible connection with another field.

          HYPOTHESIS:
          A tentative hypothesis, clearly marked as unverified.

          CONFIDENCE:
          Number between 0 and 1.

          Do not invent evidence.
          """

          payload = {
              "model": "gemini-3.6-flash",
              "input": prompt
          }

          result = None

          for attempt in range(1, 4):

              print(
                  f"Gemini attempt "
                  f"{attempt}/3"
              )

              try:

                  response = requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=(20, 120)
                  )

                  print(
                      "Gemini status:",
                      response.status_code
                  )

                  if response.status_code == 200:
                      result = response.json()
                      break

                  if response.status_code in (
                      408,
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt < 3:
                          time.sleep(
                              attempt * 5
                          )
                          continue

                  raise RuntimeError(
                      "Gemini request failed: "
                      + response.text[:2000]
                  )

              except requests.exceptions.Timeout:

                  print(
                      "Gemini timeout."
                  )

                  if attempt < 3:
                      time.sleep(
                          attempt * 5
                      )
                      continue

                  raise RuntimeError(
                      "Gemini timed out after 3 attempts."
                  )

          if result is None:
              raise RuntimeError(
                  "No Gemini response."
              )

          # --------------------------------------------------
          # EXTRACT TEXT
          # --------------------------------------------------

          output = ""

          if isinstance(
              result.get("output_text"),
              str
          ):
              output = result[
                  "output_text"
              ].strip()

          if not output:

              for step in result.get(
                  "steps",
                  []
              ):

                  if not isinstance(
                      step,
                      dict
                  ):
                      continue

                  if step.get(
                      "type"
                  ) != "model_output":
                      continue

                  for part in step.get(
                      "content",
                      []
                  ):

                      if (
                          isinstance(
                              part,
                              dict
                          )
                          and part.get(
                              "type"
                          ) == "text"
                      ):
                          output += (
                              str(
                                  part.get(
                                      "text",
                                      ""
                                  )
                              )
                              + "\n"
                          )

          output = output.strip()

          if not output:
              raise RuntimeError(
                  "Gemini returned empty output."
              )

          print(
              "Curiosity memory reasoning: PASS"
          )

          # --------------------------------------------------
          # PARSER
          # --------------------------------------------------

          def extract(label):

              marker = label + ":"

              if marker not in output:
                  return ""

              value = output.split(
                  marker,
                  1
              )[1]

              for next_label in [
                  "STATUS:",
                  "SUBJECT:",
                  "PREVIOUS_LINK:",
                  "QUESTION:",
                  "WHY:",
                  "CONNECTION:",
                  "HYPOTHESIS:",
                  "CONFIDENCE:"
              ]:

                  if next_label == marker:
                      continue

                  if next_label in value:
                      value = value.split(
                          next_label,
                          1
                      )[0]

              return value.strip()

          status = extract(
              "STATUS"
          )

          subject = extract(
              "SUBJECT"
          )

          previous_link = extract(
              "PREVIOUS_LINK"
          )

          question = extract(
              "QUESTION"
          )

          why = extract(
              "WHY"
          )

          connection = extract(
              "CONNECTION"
          )

          hypothesis = extract(
              "HYPOTHESIS"
          )

          confidence_text = extract(
              "CONFIDENCE"
          )

          try:
              confidence = float(
                  confidence_text.splitlines()[0]
              )
          except Exception:
              confidence = 0.0

          if not subject:
              raise RuntimeError(
                  "No subject generated."
              )

          if not question:
              raise RuntimeError(
                  "No research question generated."
              )

          if confidence < 0.70:
              raise RuntimeError(
                  "Curiosity confidence below threshold."
              )

          print(
              "Status:",
              status
          )

          print(
              "Next subject:",
              subject
          )

          print(
              "Previous link:",
              previous_link
          )

          print(
              "Confidence:",
              confidence
          )

          # --------------------------------------------------
          # MEMORY RECORD
          # --------------------------------------------------

          question_record = {
              "timestamp": now,
              "version": "V45",
              "question": question,
              "subject": subject,
              "previous_link": previous_link,
              "why": why,
              "connection": connection,
              "hypothesis": hypothesis,
              "hypothesis_status": "unverified",
              "confidence": confidence,
              "status": "open"
          }

          memory[
              "question_log"
          ].append(
              question_record
          )

          memory[
              "learning_log"
          ].append({
              "timestamp": now,
              "version": "V45",
              "lesson": (
                  "Curiosity becomes more useful when "
                  "unresolved questions are remembered "
                  "and can guide future exploration."
              ),
              "principle": (
                  "Do not confuse an unanswered question "
                  "with a failed investigation."
              )
          })

          memory[
              "curiosity_log"
          ].append({
              "timestamp": now,
              "version": "V45",
              "subject": subject,
              "question": question,
              "previous_link": previous_link,
              "status": "question_generated",
              "confidence": confidence
          })

          memory[
              "version"
          ] = "V45"

          memory[
              "last_updated"
          ] = now

          # --------------------------------------------------
          # SAVE
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # VERIFY
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not loaded.get(
              "question_log"
          ):
              raise RuntimeError(
                  "Question memory verification failed."
              )

          last_question = loaded[
              "question_log"
          ][-1]

          if last_question.get(
              "question"
          ) != question:
              raise RuntimeError(
                  "Stored question does not match generated question."
              )

          print(
              "Memory persistence: PASS"
          )

          print(
              "Open question persistence: PASS"
          )

          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V45 Curiosity Memory",
              "",
              "## Curiosity Continuity",
              "",
              f"- Status: {status}",
              f"- Subject: {subject}",
              f"- Previous link: {previous_link}",
              f"- Confidence: {confidence}",
              "",
              "## Research Question",
              "",
              question,
              "",
              "## Why",
              "",
              why,
              "",
              "## Interdisciplinary Connection",
              "",
              connection,
              "",
              "## Hypothesis",
              "",
              hypothesis,
              "",
              "**Status: UNVERIFIED**",
              "",
              "## Memory",
              "",
              f"- Previous subjects remembered: {len(previous_subjects)}",
              f"- Previous questions remembered: {len(previous_questions)}",
              f"- Open questions stored: {len(loaded['question_log'])}",
              "",
              "## Integrity",
              "",
              "- Memory written: PASS",
              "- Memory reloaded: PASS",
              "- Question verified after reload: PASS",
              "",
              "## Public Colony Activity",
              "",
              "- New post: NO",
              "- New comment: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V45 Principle",
              "",
              "NØX does not forget what it does not know.",
              "",
              "An unanswered question becomes part of its "
              "future curiosity rather than disappearing after "
              "a single research session.",
              "",
              "The hypothesis is explicitly stored as unverified.",
              "",
              "This version does not perform public Colony actions."
          ]

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print("===================================")
          print("V45 COMPLETE")
          print("Curiosity continuity: PASS")
          print("Open question: PASS")
          print("Hypothesis separation: PASS")
          print("Memory persistence: PASS")
          print("Public Colony action: NONE")
          print("===================================")

          PY

      - name: Commit V45 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V45_CURIOSITY_MEMORY.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V45 - Curiosity Memory"
            git push
          fi
