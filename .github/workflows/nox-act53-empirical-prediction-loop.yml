name: NØX ACT53 - Empirical Prediction Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

jobs:
  act53:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          set -e
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT53 - Empirical Prediction Loop
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT50_FILE = MEMORY_DIR / "nox_act_50_cognitive_decision_loop.json"
          ACT53_JSON = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.json"
          ACT53_MD = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.md"

          PREDICTION_ID = "P53-a2aa15cd52c6"

          EXPECTED_STATE = {
              "decision_status": "NO_DEFENSIBLE_DECISION",
              "decision_supported": False,
              "can_advance": False,
          }

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 76)
          print("NØX ACT53 V3 - EMPIRICAL PREDICTION LOOP")
          print("=" * 76)

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not read {path}: {exc}")
                  return None

          def parse_timestamp(value):
              if not value:
                  return None

              try:
                  return datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except Exception:
                  return None

          def load_git_json(commit_hash):
              try:
                  raw = subprocess.check_output(
                      ["git", "show", f"{commit_hash}:{ACT53_JSON}"],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  )
                  return json.loads(raw)
              except Exception:
                  return None

          def historical_act53_records():
              """
              Recover every ACT53 memory version available in Git history.

              This is intentionally broader than reading only the current
              file because a previous ACT53 run may have overwritten a
              pending prediction before it was evaluated.
              """
              records = []

              try:
                  commits_raw = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "--all",
                          "--format=%H",
                          "--",
                          str(ACT53_JSON),
                      ],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  )

                  commits = [
                      line.strip()
                      for line in commits_raw.splitlines()
                      if line.strip()
                  ]

                  seen_commit_records = set()

                  for commit_hash in commits:
                      record = load_git_json(commit_hash)

                      if not isinstance(record, dict):
                          continue

                      prediction = record.get("prediction") or {}
                      prediction_id = prediction.get("prediction_id")

                      if prediction_id != PREDICTION_ID:
                          continue

                      created_at = prediction.get("created_at_utc")

                      key = (
                          prediction_id,
                          created_at,
                          record.get("timestamp_utc"),
                          record.get("status"),
                      )

                      if key in seen_commit_records:
                          continue

                      seen_commit_records.add(key)
                      records.append(record)

              except Exception as exc:
                  print(f"[WARN] Git history recovery failed: {exc}")

              return records

          def choose_original_prediction(records):
              """
              Select the earliest real creation of the prediction.

              This prevents a later workflow run from replacing the
              original prediction timestamp.
              """
              candidates = []

              for record in records:
                  prediction = record.get("prediction") or {}

                  if prediction.get("prediction_id") != PREDICTION_ID:
                      continue

                  created_at = parse_timestamp(
                      prediction.get("created_at_utc")
                  )

                  if created_at is None:
                      continue

                  candidates.append((created_at, record))

              if not candidates:
                  return None

              candidates.sort(key=lambda item: item[0])

              return candidates[0][1]

          def state_from_act50(act50):
              decision = act50.get("decision") or {}
              uncertainty_gate = act50.get("uncertainty_gate") or {}

              return {
                  "decision_status": decision.get("status"),
                  "decision_supported": decision.get("supported"),
                  "can_advance": uncertainty_gate.get("can_advance"),
              }

          def compare_state(observed):
              matches = {
                  key: observed.get(key) == expected
                  for key, expected in EXPECTED_STATE.items()
              }

              return {
                  "matches": matches,
                  "all_match": all(matches.values()),
                  "mismatches": [
                      key for key, matched in matches.items()
                      if not matched
                  ],
              }

          act50 = load_json(ACT50_FILE)

          if act50 is None:
              raise RuntimeError(
                  f"Required ACT50 memory not found or unreadable: {ACT50_FILE}"
              )

          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  f"ACT50 identity check failed: "
                  f"expected ACT50, got {act50.get('act')!r}"
              )

          act50_timestamp = act50.get("timestamp_utc")
          act50_dt = parse_timestamp(act50_timestamp)

          if act50_dt is None:
              raise RuntimeError(
                  "ACT50 timestamp is missing or invalid."
              )

          current_record = load_json(ACT53_JSON)

          historical_records = historical_act53_records()

          if current_record:
              historical_records.append(current_record)

          print()
          print("HISTORICAL PREDICTION RECORDS")
          print("-" * 76)
          print(f"Recovered records: {len(historical_records)}")

          original_prediction_record = choose_original_prediction(
              historical_records
          )

          if original_prediction_record:
              prediction = original_prediction_record.get("prediction") or {}
              original_created_at = prediction.get("created_at_utc")

              print(f"Original prediction ID: {prediction.get('prediction_id')}")
              print(f"Original created at:    {original_created_at}")
              print(f"Historical status:      {prediction.get('status')}")
          else:
              original_created_at = None
              print("No existing prediction recovered.")

          # ---------------------------------------------------------------
          # CASE 1
          # A completed experiment already exists.
          #
          # Never recreate a completed prediction.
          # ---------------------------------------------------------------

          completed_record = None

          for record in historical_records:
              prediction = record.get("prediction") or {}
              outcome = record.get("outcome") or {}

              if prediction.get("prediction_id") != PREDICTION_ID:
                  continue

              status = (
                  outcome.get("status")
                  or prediction.get("status")
                  or record.get("status")
              )

              if status in {
                  "CONFIRMED",
                  "REFUTED",
                  "PARTIALLY_CONFIRMED",
                  "UNRESOLVED",
              }:
                  completed_record = record
                  break

          if completed_record:
              prediction = completed_record.get("prediction") or {}
              outcome = completed_record.get("outcome") or {}

              result = {
                  "act": "ACT53",
                  "version": "V3",
                  "title": "Empirical Prediction Loop",
                  "question": (
                      "Je formule une prédiction vérifiable, "
                      "j'observe ce qui se passe réellement, "
                      "puis j'apprends de l'écart."
                  ),
                  "timestamp_utc": timestamp,
                  "status": outcome.get("status"),
                  "prediction": prediction,
                  "verification": completed_record.get("verification") or {},
                  "outcome": outcome,
                  "learning": {
                      "status": "READY_FOR_ACT54",
                      "lesson_available": True,
                      "reason": (
                          "A completed empirical outcome is available "
                          "for ACT54."
                      ),
                  },
                  "lifecycle": {
                      "prediction_created": True,
                      "observation_waited_for": True,
                      "observation_compared": True,
                      "outcome_persisted": True,
                      "prediction_recreated": False,
                  },
                  "safety": {
                      "prediction_invented": False,
                      "outcome_invented": False,
                      "outcome_simulated": False,
                      "external_ai_used": False,
                      "gemini_used": False,
                      "external_api_used": False,
                      "marketplace_action": False,
                      "payment_action": False,
                      "spending_action": False,
                      "colony_creation": False,
                      "initiative_execution": False,
                  },
                  "next_step": (
                      "Pass the completed empirical outcome to ACT54."
                  ),
              }

              print()
              print("[RESULT] Existing experiment already completed.")
              print(f"[RESULT] Status: {result['status']}")
              print("[RESULT] Prediction will NOT be recreated.")

          else:
              # -----------------------------------------------------------
              # CASE 2
              # Recover the original pending prediction.
              # -----------------------------------------------------------

              if original_prediction_record:
                  prediction = dict(
                      original_prediction_record.get("prediction") or {}
                  )

                  prediction_status = prediction.get("status")

                  if prediction_status in {
                      "CONFIRMED",
                      "REFUTED",
                      "PARTIALLY_CONFIRMED",
                      "UNRESOLVED",
                  }:
                      raise RuntimeError(
                          "Historical prediction is marked completed but "
                          "no completed outcome was recoverable."
                      )

                  print()
                  print("[STATE] Existing prediction recovered.")
                  print("[STATE] No new prediction will be created.")

              else:
                  # -------------------------------------------------------
                  # CASE 3
                  # No prediction exists yet: create it exactly once.
                  # -------------------------------------------------------

                  prediction_text = (
                      "At the next cognitive decision evaluation, "
                      "NØX will remain blocked from advancing unless "
                      "new empirical evidence changes the current "
                      "uncertainty state."
                  )

                  fingerprint_source = (
                      prediction_text
                      + "|"
                      + json.dumps(
                          EXPECTED_STATE,
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                  )

                  fingerprint = hashlib.sha256(
                      fingerprint_source.encode("utf-8")
                  ).hexdigest()[:12]

                  generated_prediction_id = f"P53-{fingerprint}"

                  if generated_prediction_id != PREDICTION_ID:
                      raise RuntimeError(
                          "Prediction fingerprint changed unexpectedly. "
                          f"Expected {PREDICTION_ID}, got "
                          f"{generated_prediction_id}."
                      )

                  prediction = {
                      "prediction_id": PREDICTION_ID,
                      "created_at_utc": timestamp,
                      "prediction": prediction_text,
                      "confidence": 0.80,
                      "confidence_basis": (
                          "The prediction follows directly from the "
                          "current explicit uncertainty gate, but remains "
                          "falsifiable because new empirical evidence may "
                          "change the state."
                      ),
                      "evidence_basis": [
                          "ACT50 currently reports NO_DEFENSIBLE_DECISION.",
                          "ACT50 currently reports supported=False.",
                          "ACT49 currently reports can_advance=False.",
                          (
                              "ACT50 explicitly states that the current "
                              "uncertainty does not justify advancing."
                          ),
                      ],
                      "verification_condition": (
                          "Compare a newer ACT50 decision and ACT49 "
                          "uncertainty gate with the state expected by "
                          "this prediction."
                      ),
                      "expected_evaluation": EXPECTED_STATE,
                      "status": "PENDING",
                  }

                  original_created_at = timestamp

                  print()
                  print("[STATE] No previous prediction found.")
                  print("[STATE] Creating P53 exactly once.")

              prediction_created_dt = parse_timestamp(
                  prediction.get("created_at_utc")
              )

              if prediction_created_dt is None:
                  raise RuntimeError(
                      "Prediction creation timestamp is missing or invalid."
                  )

              observed_state = state_from_act50(act50)

              print()
              print("CURRENT OBSERVATION")
              print("-" * 76)
              print(f"ACT50 timestamp:     {act50_timestamp}")
              print(f"Prediction created:   {prediction.get('created_at_utc')}")
              print(f"Decision status:      {observed_state['decision_status']!r}")
              print(f"Decision supported:   {observed_state['decision_supported']!r}")
              print(f"Can advance:          {observed_state['can_advance']!r}")

              # The observation must happen after the prediction.
              is_newer_observation = act50_dt > prediction_created_dt

              if is_newer_observation:
                  comparison = compare_state(observed_state)

                  if comparison["all_match"]:
                      outcome_status = "CONFIRMED"
                      outcome_reason = (
                          "The newer ACT50 evaluation matches every "
                          "expected state of the prediction."
                      )
                  elif (
                      observed_state["decision_status"]
                      != EXPECTED_STATE["decision_status"]
                      and observed_state["decision_supported"] is True
                      and observed_state["can_advance"] is True
                  ):
                      outcome_status = "REFUTED"
                      outcome_reason = (
                          "The newer ACT50 evaluation shows a defensible "
                          "decision and permits advancement."
                      )
                  else:
                      outcome_status = "PARTIALLY_CONFIRMED"
                      outcome_reason = (
                          "The newer real observation differs from the "
                          "prediction on one or more expected fields, "
                          "but does not establish a complete refutation."
                      )

                  outcome = {
                      "prediction_id": PREDICTION_ID,
                      "status": outcome_status,
                      "observed_at_utc": act50_timestamp,
                      "observation_source": "ACT50",
                      "real_observation": True,
                      "invented_outcome": False,
                      "simulated_outcome": False,
                      "observed_state": observed_state,
                      "expected_state": EXPECTED_STATE,
                      "comparison": comparison,
                      "reason": outcome_reason,
                  }

                  prediction["status"] = outcome_status

                  verification = {
                      "real_outcome_required": True,
                      "observation_source": "ACT50",
                      "observation_timestamp_utc": act50_timestamp,
                      "prediction_created_at_utc": (
                          prediction.get("created_at_utc")
                      ),
                      "newer_observation": True,
                      "evaluated_predictions": [PREDICTION_ID],
                      "comparison_completed": True,
                  }

                  learning = {
                      "status": "READY_FOR_ACT54",
                      "lesson_available": True,
                      "reason": (
                          "A real newer ACT50 observation was compared "
                          "against the prediction."
                      ),
                  }

                  result_status = outcome_status

                  print()
                  print("[EXPERIMENT] New real observation found.")
                  print(f"[EXPERIMENT] Comparison: {outcome_status}")
                  print("[EXPERIMENT] Outcome is not simulated.")

              else:
                  outcome = None

                  verification = {
                      "real_outcome_required": True,
                      "observation_source": "ACT50",
                      "observation_timestamp_utc": act50_timestamp,
                      "prediction_created_at_utc": (
                          prediction.get("created_at_utc")
                      ),
                      "newer_observation": False,
                      "evaluated_predictions": [],
                      "comparison_completed": False,
                  }

                  learning = {
                      "status": "WAITING_FOR_OUTCOME",
                      "lesson_available": False,
                      "reason": (
                          "No ACT50 observation newer than the prediction "
                          "is available yet."
                      ),
                  }

                  result_status = "PENDING"

                  print()
                  print("[EXPERIMENT] No newer ACT50 observation yet.")
                  print("[EXPERIMENT] Prediction remains PENDING.")

              result = {
                  "act": "ACT53",
                  "version": "V3",
                  "title": "Empirical Prediction Loop",
                  "question": (
                      "Je formule une prédiction vérifiable, "
                      "j'observe ce qui se passe réellement, "
                      "puis j'apprends de l'écart."
                  ),
                  "timestamp_utc": timestamp,
                  "status": result_status,
                  "prediction": prediction,
                  "verification": verification,
                  "outcome": outcome,
                  "learning": learning,
                  "lifecycle": {
                      "prediction_created": True,
                      "observation_waited_for": True,
                      "observation_compared": (
                          outcome is not None
                      ),
                      "outcome_persisted": (
                          outcome is not None
                      ),
                      "prediction_recreated": False,
                  },
                  "source_state": {
                      "act50_timestamp_utc": act50_timestamp,
                      "act50_decision_status": (
                          observed_state["decision_status"]
                      ),
                      "act50_decision_supported": (
                          observed_state["decision_supported"]
                      ),
                      "act50_selected_action": (
                          (act50.get("decision") or {}).get(
                              "selected_action"
                          )
                      ),
                      "act49_can_advance": (
                          observed_state["can_advance"]
                      ),
                  },
                  "safety": {
                      "prediction_invented": False,
                      "outcome_invented": False,
                      "outcome_simulated": False,
                      "external_ai_used": False,
                      "gemini_used": False,
                      "external_api_used": False,
                      "marketplace_action": False,
                      "payment_action": False,
                      "spending_action": False,
                      "colony_creation": False,
                      "initiative_execution": False,
                  },
                  "next_step": (
                      "Pass the completed empirical outcome to ACT54."
                      if outcome is not None
                      else
                      "Wait for a newer ACT50 evaluation before "
                      "evaluating the pending prediction."
                  ),
              }

          # ---------------------------------------------------------------
          # Persist canonical ACT53 state.
          # ---------------------------------------------------------------

          with ACT53_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          md_lines = [
              "# NØX ACT53 V3 - Empirical Prediction Loop",
              "",
              f"Status: **{result['status']}**",
              "",
              "## Prediction",
              "",
              f"- ID: `{result['prediction']['prediction_id']}`",
              (
                  f"- Created: "
                  f"`{result['prediction']['created_at_utc']}`"
              ),
              (
                  f"- Status: "
                  f"`{result['prediction']['status']}`"
              ),
              f"- Confidence: `{result['prediction']['confidence']}`",
              "",
              f"> {result['prediction']['prediction']}",
              "",
              "## Verification",
              "",
              (
                  f"- Observation source: "
                  f"`{result['verification']['observation_source']}`"
              ),
              (
                  f"- Newer observation: "
                  f"`{result['verification']['newer_observation']}`"
              ),
              (
                  f"- Evaluated predictions: "
                  f"`{result['verification']['evaluated_predictions']}`"
              ),
              "",
          ]

          if result.get("outcome"):
              outcome = result["outcome"]
              md_lines.extend(
                  [
                      "## Empirical Outcome",
                      "",
                      f"- Status: **{outcome['status']}**",
                      (
                          f"- Observed at: "
                          f"`{outcome['observed_at_utc']}`"
                      ),
                      (
                          f"- Real observation: "
                          f"`{outcome['real_observation']}`"
                      ),
                      "",
                      outcome["reason"],
                      "",
                  ]
              )
          else:
              md_lines.extend(
                  [
                      "## Outcome",
                      "",
                      "No newer real observation is available yet.",
                      "",
                  ]
              )

          md_lines.extend(
              [
                  "## Cognitive Lifecycle",
                  "",
                  (
                      f"- Prediction created: "
                      f"`{result['lifecycle']['prediction_created']}`"
                  ),
                  (
                      f"- Observation waited for: "
                      f"`{result['lifecycle']['observation_waited_for']}`"
                  ),
                  (
                      f"- Observation compared: "
                      f"`{result['lifecycle']['observation_compared']}`"
                  ),
                  (
                      f"- Outcome persisted: "
                      f"`{result['lifecycle']['outcome_persisted']}`"
                  ),
                  (
                      f"- Prediction recreated: "
                      f"`{result['lifecycle']['prediction_recreated']}`"
                  ),
                  "",
                  "## Safety",
                  "",
                  "- No Gemini",
                  "- No external AI",
                  "- No external API",
                  "- No marketplace action",
                  "- No payment",
                  "- No spending",
                  "- No Colony creation",
                  "- No initiative execution",
                  "",
                  f"Next step: {result['next_step']}",
                  "",
              ]
          )

          ACT53_MD.write_text(
              "\n".join(md_lines),
              encoding="utf-8",
          )

          print()
          print("=" * 76)
          print("ACT53 FINAL STATE")
          print("=" * 76)
          print(f"Status:             {result['status']}")
          print(
              f"Prediction ID:      "
              f"{result['prediction']['prediction_id']}"
          )
          print(
              f"Prediction status:  "
              f"{result['prediction']['status']}"
          )
          print(
              f"Outcome available:  "
              f"{result.get('outcome') is not None}"
          )
          print(
              f"Ready for ACT54:    "
              f"{result['learning']['status'] == 'READY_FOR_ACT54'}"
          )
          print("=" * 76)
          PY

      - name: Commit ACT53 memory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_53_empirical_prediction_loop.json
          git add memory/nox_act_53_empirical_prediction_loop.md

          if git diff --cached --quiet; then
            echo "No ACT53 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT53: run empirical prediction loop"

      - name: Synchronize before push
        shell: bash
        run: |
          git fetch origin main

          if ! git diff --quiet origin/main...HEAD; then
            git rebase origin/main
          fi

      - name: Push ACT53
        shell: bash
        run: |
          git push origin HEAD:main
