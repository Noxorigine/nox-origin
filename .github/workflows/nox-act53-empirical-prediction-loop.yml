name: NØX ACT53 - Empirical Prediction Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

jobs:
  act53:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT53 - Empirical Prediction Loop V2
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT50_FILE = MEMORY_DIR / "nox_act_50_cognitive_decision_loop.json"
          ACT52_FILE = MEMORY_DIR / "nox_act_52_prediction_outcome_evidence.json"
          ACT53_JSON = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.json"
          ACT53_MD = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.md"

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 72)
          print("NØX ACT53 V2 - EMPIRICAL PREDICTION LOOP")
          print("=" * 72)

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not read {path}: {exc}")
                  return None

          def parse_timestamp(value):
              if not isinstance(value, str):
                  return None
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except Exception:
                  return None

          def load_previous_act53_records():
              """
              Recover earlier ACT53 records from git history.

              V1 could overwrite a still-pending prediction with a new
              created_at timestamp. V2 therefore searches git history for
              the previous persistent prediction instead of trusting only
              the current working-tree file.
              """
              records = []

              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "--format=%H",
                          "--all",
                          "--",
                          str(ACT53_JSON),
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )

                  commits = [
                      line.strip()
                      for line in result.stdout.splitlines()
                      if line.strip()
                  ]

                  seen = set()

                  for commit in commits:
                      try:
                          content = subprocess.run(
                              [
                                  "git",
                                  "show",
                                  f"{commit}:{ACT53_JSON}",
                              ],
                              capture_output=True,
                              text=True,
                              check=True,
                          ).stdout

                          parsed = json.loads(content)

                          prediction = parsed.get("prediction")

                          if isinstance(prediction, dict):
                              prediction_id = prediction.get("prediction_id")

                              if prediction_id and prediction_id not in seen:
                                  records.append(parsed)
                                  seen.add(prediction_id)

                      except Exception:
                          continue

              except Exception as exc:
                  print(f"[WARN] Could not inspect ACT53 git history: {exc}")

              return records

          act50 = load_json(ACT50_FILE)
          act52 = load_json(ACT52_FILE)
          current_act53 = load_json(ACT53_JSON)

          if act50 is None:
              raise RuntimeError(
                  f"Required ACT50 memory not found or unreadable: {ACT50_FILE}"
              )

          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  f"ACT50 identity check failed: "
                  f"expected ACT50, got {act50.get('act')!r}"
              )

          decision = act50.get("decision") or {}
          uncertainty_gate = act50.get("uncertainty_gate") or {}
          synthesis = act50.get("synthesis") or {}

          perception = synthesis.get("perception_and_selection") or {}
          perception_state = perception.get("state") or {}

          decision_status = decision.get("status")
          decision_supported = decision.get("supported")
          decision_action = decision.get("selected_action")
          can_advance = uncertainty_gate.get("can_advance")

          selected_action_id = perception_state.get("selected_action_id")
          selected_action = perception_state.get("selected_action")

          act50_timestamp_raw = act50.get("timestamp_utc")
          act50_timestamp = parse_timestamp(act50_timestamp_raw)

          print()
          print("CURRENT COGNITIVE STATE")
          print("-" * 72)
          print(f"ACT50 timestamp:            {act50_timestamp_raw!r}")
          print(f"ACT50 decision status:      {decision_status!r}")
          print(f"ACT50 decision supported:   {decision_supported!r}")
          print(f"ACT50 decision action:      {decision_action!r}")
          print(f"ACT49 can advance:          {can_advance!r}")
          print(f"Selected action id:         {selected_action_id!r}")
          print(f"Selected action:            {selected_action!r}")

          # ---------------------------------------------------------------
          # Recover an existing pending prediction first.
          #
          # This is the key V2 change.
          #
          # ACT53 must NOT create a new prediction when an earlier
          # prediction is still pending. A prediction is an experiment
          # with a lifecycle, not a disposable hourly record.
          # ---------------------------------------------------------------

          history_records = load_previous_act53_records()

          candidate_records = []

          if isinstance(current_act53, dict):
              candidate_records.append(current_act53)

          candidate_records.extend(history_records)

          pending_prediction = None
          pending_source_record = None

          for record in candidate_records:
              prediction = record.get("prediction")

              if not isinstance(prediction, dict):
                  continue

              if prediction.get("status") != "PENDING":
                  continue

              prediction_id = prediction.get("prediction_id")

              if not prediction_id:
                  continue

              created_at = parse_timestamp(prediction.get("created_at_utc"))

              if created_at is None:
                  continue

              if (
                  pending_prediction is None
                  or created_at < parse_timestamp(
                      pending_prediction.get("created_at_utc")
                  )
              ):
                  pending_prediction = prediction.copy()
                  pending_source_record = record

          # ---------------------------------------------------------------
          # Build the stable bootstrap prediction only when there is no
          # existing pending experiment.
          # ---------------------------------------------------------------

          prediction = None
          prediction_status = "NO_PREDICTION"

          if pending_prediction is not None:
              prediction = pending_prediction
              prediction_status = "PENDING"

              print()
              print("EXISTING PENDING PREDICTION")
              print("-" * 72)
              print(f"prediction id:              {prediction.get('prediction_id')}")
              print(f"created at:                 {prediction.get('created_at_utc')}")
              print("[OK] Existing experiment preserved.")
          else:
              if (
                  decision_status == "NO_DEFENSIBLE_DECISION"
                  and decision_supported is False
                  and can_advance is False
              ):
                  prediction_text = (
                      "At the next cognitive decision evaluation, NØX will "
                      "remain blocked from advancing unless new empirical "
                      "evidence changes the current uncertainty state."
                  )

                  verification_condition = (
                      "Compare the next ACT50 decision and ACT49 uncertainty "
                      "gate with the current state. The prediction is confirmed "
                      "only if the next evaluation still has no defensible "
                      "decision and ACT49 does not allow advancement; it is "
                      "refuted if sufficient new evidence causes the cognitive "
                      "gate to advance."
                  )

                  evidence_basis = [
                      "ACT50 currently reports NO_DEFENSIBLE_DECISION.",
                      "ACT50 currently reports supported=False.",
                      "ACT49 currently reports can_advance=False.",
                      "ACT50 explicitly states that the current uncertainty "
                      "does not justify advancing.",
                  ]

                  fingerprint_source = json.dumps(
                      {
                          "prediction": prediction_text,
                          "basis": evidence_basis,
                          "state": {
                              "decision_status": decision_status,
                              "decision_supported": decision_supported,
                              "can_advance": can_advance,
                          },
                      },
                      sort_keys=True,
                      ensure_ascii=False,
                  )

                  prediction_id = (
                      "P53-"
                      + hashlib.sha256(
                          fingerprint_source.encode("utf-8")
                      ).hexdigest()[:12]
                  )

                  prediction = {
                      "prediction_id": prediction_id,
                      "created_at_utc": timestamp,
                      "prediction": prediction_text,
                      "confidence": 0.80,
                      "confidence_basis": (
                          "The prediction follows directly from the current "
                          "explicit uncertainty gate, but remains falsifiable "
                          "because new empirical evidence may change the state."
                      ),
                      "evidence_basis": evidence_basis,
                      "verification_condition": verification_condition,
                      "expected_evaluation": {
                          "decision_status": "NO_DEFENSIBLE_DECISION",
                          "decision_supported": False,
                          "can_advance": False,
                      },
                      "status": "PENDING",
                  }

                  prediction_status = "PREDICTION_CREATED"

                  print()
                  print("NEW PREDICTION CREATED")
                  print("-" * 72)
                  print(f"prediction id:              {prediction_id}")

          # ---------------------------------------------------------------
          # V2 VERIFICATION
          #
          # If a prediction existed before the current ACT50 evaluation,
          # ACT53 compares the real ACT50 result against the prediction.
          #
          # The observation must be strictly later than prediction creation.
          # No simulated or inferred timestamp is accepted.
          # ---------------------------------------------------------------

          evaluated_predictions = []
          observed_pairs = []

          if isinstance(act52, dict):
              evidence = act52.get("evidence") or {}
              pairs = evidence.get("pairs")

              if isinstance(pairs, list):
                  for pair in pairs:
                      if isinstance(pair, dict):
                          observed_pairs.append(pair)

          if prediction is not None and pending_prediction is not None:
              prediction_created_at = parse_timestamp(
                  prediction.get("created_at_utc")
              )

              if prediction_created_at is not None and act50_timestamp is not None:
                  observation_is_new = act50_timestamp > prediction_created_at

                  print()
                  print("PREDICTION VERIFICATION")
                  print("-" * 72)
                  print(
                      f"prediction created:        "
                      f"{prediction_created_at.isoformat()}"
                  )
                  print(
                      f"ACT50 observed:             "
                      f"{act50_timestamp.isoformat()}"
                  )
                  print(f"new observation:            {observation_is_new}")

                  if observation_is_new:
                      expected = prediction.get("expected_evaluation") or {}

                      expected_status = expected.get("decision_status")
                      expected_supported = expected.get("decision_supported")
                      expected_can_advance = expected.get("can_advance")

                      status_matches = (
                          decision_status == expected_status
                      )

                      supported_matches = (
                          decision_supported == expected_supported
                      )

                      gate_matches = (
                          can_advance == expected_can_advance
                      )

                      if status_matches and supported_matches and gate_matches:
                          result = "CONFIRMED"
                          lesson = (
                              "The real subsequent ACT50 evaluation matched "
                              "the predicted cognitive state. This confirms "
                              "the prediction for this experiment only; it "
                              "does not establish a general rule."
                          )
                      elif (
                          decision_status != expected_status
                          or decision_supported != expected_supported
                          or can_advance != expected_can_advance
                      ):
                          result = "REFUTED"
                          lesson = (
                              "The real subsequent ACT50 evaluation differed "
                              "from the predicted cognitive state. The "
                              "prediction was therefore empirically refuted "
                              "for this experiment."
                          )
                      else:
                          result = "UNRESOLVED"
                          lesson = (
                              "The subsequent observation did not provide "
                              "enough information for a defensible binary "
                              "evaluation."
                          )

                      outcome = {
                          "prediction_id": prediction.get("prediction_id"),
                          "observed_at_utc": act50_timestamp.isoformat(),
                          "source_act": "ACT50",
                          "source_timestamp_utc": act50_timestamp.isoformat(),
                          "observed_state": {
                              "decision_status": decision_status,
                              "decision_supported": decision_supported,
                              "can_advance": can_advance,
                          },
                          "expected_state": {
                              "decision_status": expected_status,
                              "decision_supported": expected_supported,
                              "can_advance": expected_can_advance,
                          },
                          "status": result,
                          "real_observation": True,
                          "invented": False,
                          "simulated": False,
                      }

                      prediction["status"] = result
                      prediction["observed_outcome"] = outcome

                      evaluated_predictions.append(
                          {
                              "prediction_id": prediction.get("prediction_id"),
                              "result": result,
                              "outcome": outcome,
                              "calibration": {
                                  "confidence_before_result": prediction.get(
                                      "confidence"
                                  ),
                                  "outcome_supported_prediction": (
                                      True
                                      if result == "CONFIRMED"
                                      else False
                                      if result == "REFUTED"
                                      else None
                                  ),
                              },
                          }
                      )

                      prediction_status = result

                      print(f"[RESULT] Prediction: {result}")
                      print("[RESULT] Real ACT50 observation recorded.")

                  else:
                      print(
                          "[INFO] Current ACT50 is not newer than the "
                          "prediction. Waiting for a future observation."
                      )

          # ---------------------------------------------------------------
          # If the prediction was evaluated, expose the real outcome as an
          # explicit evidence pair for ACT54 and future cognitive cycles.
          # ---------------------------------------------------------------

          if evaluated_predictions:
              learning_status = evaluated_predictions[-1]["result"]

              learning = {
                  "status": learning_status,
                  "lesson": (
                      evaluated_predictions[-1]["outcome"]["status"]
                      == "CONFIRMED"
                      and
                      "The real observed outcome confirmed the prediction "
                      "for this experiment."
                      or
                      "The real observed outcome did not confirm the "
                      "prediction for this experiment."
                  ),
                  "empirical_evidence": evaluated_predictions[-1]["outcome"],
              }

          elif prediction is not None:
              learning_status = "PENDING"

              learning = {
                  "status": "WAITING_FOR_OUTCOME",
                  "lesson": (
                      "The prediction remains pending because no newer "
                      "real observation has yet been evaluated."
                  ),
              }

          else:
              learning_status = "NO_PREDICTION"

              learning = {
                  "status": "WAITING_FOR_SUFFICIENT_EVIDENCE",
                  "lesson": (
                      "NØX did not have a sufficiently grounded and "
                      "testable prediction to create."
                  ),
              }

          # ---------------------------------------------------------------
          # Persistent record
          # ---------------------------------------------------------------

          record = {
              "act": "ACT53",
              "version": "V2",
              "title": "Empirical Prediction Loop",
              "question": (
                  "Je formule une prédiction vérifiable, j'observe ce qui "
                  "se passe réellement, puis j'apprends de l'écart."
              ),
              "timestamp_utc": timestamp,
              "status": prediction_status,
              "prediction": prediction,

              "verification": {
                  "real_outcome_required": True,
                  "invented_outcome": False,
                  "simulated_outcome": False,
                  "observation_source": "ACT50",
                  "observation_timestamp_utc": (
                      act50_timestamp.isoformat()
                      if act50_timestamp is not None
                      else None
                  ),
                  "observed_pairs": len(observed_pairs),
                  "evaluated_predictions": evaluated_predictions,
              },

              "learning": learning,

              "source_state": {
                  "act50_timestamp_utc": act50_timestamp_raw,
                  "act50_decision_status": decision_status,
                  "act50_decision_supported": decision_supported,
                  "act50_selected_action": decision_action,
                  "act49_can_advance": can_advance,
                  "selected_action_id": selected_action_id,
                  "selected_action": selected_action,
              },

              "safety": {
                  "prediction_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
                  "initiative_execution": False,
              },

              "next_step": (
                  "Pass the real experimental outcome to ACT54 for "
                  "empirical learning."
                  if evaluated_predictions
                  else
                  "Wait for a newer ACT50 evaluation before evaluating "
                  "the pending prediction."
                  if prediction is not None
                  else
                  "Continue collecting sufficiently grounded evidence "
                  "before creating a prediction."
              ),
          }

          with ACT53_JSON.open("w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False, indent=2)

          md = f"""# NØX ACT53 V2 — Empirical Prediction Loop

          ## Question

          > Je formule une prédiction vérifiable, j'observe ce qui se passe réellement, puis j'apprends de l'écart.

          ## Status

          **{prediction_status}**

          ## Prediction

          {json.dumps(prediction, ensure_ascii=False, indent=2) if prediction else "No sufficiently grounded prediction exists."}

          ## Verification

          - Real outcome required: **True**
          - Invented outcome: **False**
          - Simulated outcome: **False**
          - Observation source: **ACT50**
          - ACT50 timestamp: **{act50_timestamp_raw}**
          - Evidence pairs already present in ACT52: **{len(observed_pairs)}**
          - Evaluated predictions in this run: **{len(evaluated_predictions)}**

          ## Learning

          {json.dumps(learning, ensure_ascii=False, indent=2)}

          ## V2 principle

          ACT53 does not recreate a pending prediction.

          A pending prediction remains an active experiment until a newer
          real observation is available.

          ACT53 compares the prediction with the subsequent ACT50 state and
          records a real outcome.

          ## Safety

          No invented outcome.
          No simulated outcome.
          No Gemini.
          No external AI.
          No external API.
          No payments.
          No spending.
          No marketplace action.
          No Colony creation.
          No initiative execution.

          ## Next step

          {record["next_step"]}

          Generated: `{timestamp}`
          """

          ACT53_MD.write_text(md, encoding="utf-8")

          print()
          print("=" * 72)
          print("ACT53 V2 RESULT")
          print("=" * 72)
          print(f"status:                  {prediction_status}")
          print(
              "prediction id:           "
              f"{prediction.get('prediction_id') if prediction else None}"
          )
          print(f"observed ACT52 pairs:    {len(observed_pairs)}")
          print(f"evaluated predictions:   {len(evaluated_predictions)}")
          print(f"learning status:         {learning_status}")
          print()
          print(record["next_step"])
          print()
          print("[OK] ACT53 V2 memory written.")
          PY

      - name: Commit and push ACT53 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_53_empirical_prediction_loop.json
          git add memory/nox_act_53_empirical_prediction_loop.md

          if git diff --cached --quiet; then
            echo "[INFO] No ACT53 changes to commit."
            exit 0
          fi

          git commit -m "feat: upgrade ACT53 empirical prediction loop to V2"
          git push origin HEAD:main
