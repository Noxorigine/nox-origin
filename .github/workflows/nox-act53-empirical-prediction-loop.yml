name: NØX ACT53 - Empirical Prediction Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

jobs:
  act53:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT53 - Empirical Prediction Loop
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT50_FILE = MEMORY_DIR / "nox_act_50_cognitive_decision_loop.json"
          ACT52_FILE = MEMORY_DIR / "nox_act_52_prediction_outcome_evidence.json"

          ACT53_JSON = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.json"
          ACT53_MD = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.md"

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 72)
          print("NØX ACT53 V1 - EMPIRICAL PREDICTION LOOP")
          print("=" * 72)

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not read {path}: {exc}")
                  return None

          act50 = load_json(ACT50_FILE)
          act52 = load_json(ACT52_FILE)

          if act50 is None:
              raise RuntimeError(
                  f"Required ACT50 memory not found or unreadable: {ACT50_FILE}"
              )

          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  f"ACT50 identity check failed: "
                  f"expected ACT50, got {act50.get('act')!r}"
              )

          decision = act50.get("decision") or {}
          uncertainty_gate = act50.get("uncertainty_gate") or {}
          synthesis = act50.get("synthesis") or {}

          perception = synthesis.get("perception_and_selection") or {}
          perception_state = perception.get("state") or {}

          decision_status = decision.get("status")
          decision_supported = decision.get("supported")
          decision_action = decision.get("selected_action")

          can_advance = uncertainty_gate.get("can_advance")

          selected_action_id = perception_state.get("selected_action_id")
          selected_action = perception_state.get("selected_action")

          print()
          print("CURRENT COGNITIVE STATE")
          print("-" * 72)
          print(f"ACT50 decision status:       {decision_status!r}")
          print(f"ACT50 decision supported:    {decision_supported!r}")
          print(f"ACT50 decision action:       {decision_action!r}")
          print(f"ACT49 can advance:           {can_advance!r}")
          print(f"Selected action id:          {selected_action_id!r}")
          print(f"Selected action:             {selected_action!r}")

          # ---------------------------------------------------------------
          # ACT53 PRINCIPLE
          #
          # ACT53 never invents an outcome.
          # ACT53 only creates a prediction when an observable future
          # condition can be stated from existing NØX state.
          #
          # The first bootstrap prediction is deliberately conservative:
          # if ACT50 remains blocked by ACT49 uncertainty, the next
          # cognitive decision cycle cannot legitimately advance.
          #
          # This is not presented as a certainty. It is recorded as a
          # testable prediction with explicit evidence and a verification
          # condition.
          # ---------------------------------------------------------------

          prediction = None
          prediction_status = "INSUFFICIENT_EVIDENCE_TO_PREDICT"

          if (
              decision_status == "NO_DEFENSIBLE_DECISION"
              and decision_supported is False
              and can_advance is False
          ):
              prediction_text = (
                  "At the next cognitive decision evaluation, NØX will "
                  "remain blocked from advancing unless new empirical "
                  "evidence changes the current uncertainty state."
              )

              verification_condition = (
                  "Compare the next ACT50 decision and ACT49 uncertainty "
                  "gate with the current state. The prediction is confirmed "
                  "only if the next evaluation still has no defensible "
                  "decision and ACT49 does not allow advancement; it is "
                  "refuted if sufficient new evidence causes the cognitive "
                  "gate to advance."
              )

              evidence_basis = [
                  "ACT50 currently reports NO_DEFENSIBLE_DECISION.",
                  "ACT50 currently reports supported=False.",
                  "ACT49 currently reports can_advance=False.",
                  "ACT50 explicitly states that the current uncertainty "
                  "does not justify advancing.",
              ]

              # Stable fingerprint prevents creating a new identical
              # prediction on every hourly workflow execution.
              fingerprint_source = json.dumps(
                  {
                      "prediction": prediction_text,
                      "basis": evidence_basis,
                      "state": {
                          "decision_status": decision_status,
                          "decision_supported": decision_supported,
                          "can_advance": can_advance,
                      },
                  },
                  sort_keys=True,
                  ensure_ascii=False,
              )

              prediction_id = (
                  "P53-"
                  + hashlib.sha256(
                      fingerprint_source.encode("utf-8")
                  ).hexdigest()[:12]
              )

              prediction = {
                  "prediction_id": prediction_id,
                  "created_at_utc": timestamp,
                  "prediction": prediction_text,
                  "confidence": 0.80,
                  "confidence_basis": (
                      "The prediction follows directly from the current "
                      "explicit uncertainty gate, but remains falsifiable "
                      "because new empirical evidence may change the state."
                  ),
                  "evidence_basis": evidence_basis,
                  "verification_condition": verification_condition,
                  "expected_evaluation": {
                      "decision_status": "NO_DEFENSIBLE_DECISION",
                      "decision_supported": False,
                      "can_advance": False,
                  },
                  "status": "PENDING",
              }

              prediction_status = "PREDICTION_CREATED"

          # ---------------------------------------------------------------
          # Search ACT52 for already observed prediction/outcome evidence.
          # ACT53 does not manufacture outcomes.
          # ---------------------------------------------------------------

          observed_pairs = []

          if isinstance(act52, dict):
              evidence = act52.get("evidence") or {}
              pairs = evidence.get("pairs")

              if isinstance(pairs, list):
                  for pair in pairs:
                      if isinstance(pair, dict):
                          observed_pairs.append(pair)

          evaluated_predictions = []

          if prediction is not None:
              for pair in observed_pairs:
                  prediction_id = pair.get("prediction_id")

                  if prediction_id != prediction.get("prediction_id"):
                      continue

                  outcome = pair.get("outcome")

                  if not isinstance(outcome, dict):
                      continue

                  actual_status = outcome.get("status")

                  if actual_status in {
                      "CONFIRMED",
                      "CORRECT",
                      "REFUTED",
                      "INCORRECT",
                      "PARTIALLY_CONFIRMED",
                      "UNRESOLVED",
                  }:
                      if actual_status in {"CONFIRMED", "CORRECT"}:
                          result = "CONFIRMED"
                      elif actual_status in {"REFUTED", "INCORRECT"}:
                          result = "REFUTED"
                      elif actual_status == "PARTIALLY_CONFIRMED":
                          result = "PARTIALLY_CONFIRMED"
                      else:
                          result = "UNRESOLVED"

                      prediction["status"] = result
                      prediction["observed_outcome"] = outcome

                      confidence = prediction.get("confidence", 0.0)

                      if result == "CONFIRMED":
                          calibration = {
                              "confidence_before_result": confidence,
                              "outcome_supported_prediction": True,
                              "calibration_note": (
                                  "The predicted state was observed."
                              ),
                          }
                      elif result == "REFUTED":
                          calibration = {
                              "confidence_before_result": confidence,
                              "outcome_supported_prediction": False,
                              "calibration_note": (
                                  "The predicted state was not observed."
                              ),
                          }
                      else:
                          calibration = {
                              "confidence_before_result": confidence,
                              "outcome_supported_prediction": None,
                              "calibration_note": (
                                  "The observed result does not permit "
                                  "a binary calibration."
                              ),
                          }

                      evaluated_predictions.append({
                          "prediction_id": prediction["prediction_id"],
                          "result": result,
                          "calibration": calibration,
                      })

          # ---------------------------------------------------------------
          # Learning signal
          # ---------------------------------------------------------------

          if prediction is None:
              learning_status = "NO_PREDICTION"
              learning = {
                  "status": "WAITING_FOR_SUFFICIENT_EVIDENCE",
                  "lesson": (
                      "NØX did not have a sufficiently grounded and "
                      "testable prediction to create."
                  ),
              }

          elif evaluated_predictions:
              result = evaluated_predictions[-1]["result"]

              if result == "CONFIRMED":
                  learning_status = "CONFIRMED"
                  lesson = (
                      "The observed result matched the predicted state. "
                      "The evidence supports the current reasoning pattern, "
                      "without proving that it will generalize."
                  )
              elif result == "REFUTED":
                  learning_status = "REFUTED"
                  lesson = (
                      "The observed result contradicted the prediction. "
                      "The reasoning and confidence used for this prediction "
                      "must be treated as an empirical error."
                  )
              elif result == "PARTIALLY_CONFIRMED":
                  learning_status = "PARTIALLY_CONFIRMED"
                  lesson = (
                      "The observed result only partially matched the "
                      "prediction. The prediction should not be treated "
                      "as fully validated."
                  )
              else:
                  learning_status = "UNRESOLVED"
                  lesson = (
                      "The available observation does not establish whether "
                      "the prediction was correct."
                  )

              learning = {
                  "status": learning_status,
                  "lesson": lesson,
              }

          else:
              learning_status = "PENDING"
              learning = {
                  "status": "WAITING_FOR_OUTCOME",
                  "lesson": (
                      "The prediction is testable but its verification "
                      "condition has not yet produced a real outcome."
                  ),
              }

          record = {
              "act": "ACT53",
              "version": "V1",
              "title": "Empirical Prediction Loop",
              "question": (
                  "Je formule une prédiction vérifiable, j'observe ce qui "
                  "se passe réellement, puis j'apprends de l'écart."
              ),
              "timestamp_utc": timestamp,

              "status": prediction_status,
              "prediction": prediction,

              "verification": {
                  "real_outcome_required": True,
                  "invented_outcome": False,
                  "simulated_outcome": False,
                  "observed_pairs": len(observed_pairs),
                  "evaluated_predictions": evaluated_predictions,
              },

              "learning": learning,

              "source_state": {
                  "act50_decision_status": decision_status,
                  "act50_decision_supported": decision_supported,
                  "act50_selected_action": decision_action,
                  "act49_can_advance": can_advance,
                  "selected_action_id": selected_action_id,
                  "selected_action": selected_action,
              },

              "safety": {
                  "prediction_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
                  "initiative_execution": False,
              },

              "next_step": (
                  "Wait for the verification condition to become "
                  "observable, then compare prediction with the real result."
                  if prediction is not None and not evaluated_predictions
                  else
                  "Continue empirical observation and use confirmed or "
                  "refuted outcomes as learning evidence."
                  if evaluated_predictions
                  else
                  "Continue collecting sufficiently grounded evidence "
                  "before creating a prediction."
              ),
          }

          with ACT53_JSON.open("w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False, indent=2)

          md = f"""# NØX ACT53 V1 — Empirical Prediction Loop

          ## Question

          > Je formule une prédiction vérifiable, j'observe ce qui se passe réellement, puis j'apprends de l'écart.

          ## Status

          **{prediction_status}**

          ## Current prediction

          {json.dumps(prediction, ensure_ascii=False, indent=2) if prediction else "No sufficiently grounded prediction created."}

          ## Verification

          - Real outcome required: **True**
          - Invented outcome: **False**
          - Simulated outcome: **False**
          - Existing evidence pairs: **{len(observed_pairs)}**
          - Evaluated predictions: **{len(evaluated_predictions)}**

          ## Learning

          {json.dumps(learning, ensure_ascii=False, indent=2)}

          ## Safety

          ACT53 does not invent outcomes.

          No Gemini.
          No external AI.
          No external API.
          No payments.
          No spending.
          No marketplace action.
          No Colony creation.
          No initiative execution.

          ## Next step

          {record["next_step"]}

          Generated: `{timestamp}`
          """

          ACT53_MD.write_text(md, encoding="utf-8")

          print()
          print("=" * 72)
          print("ACT53 RESULT")
          print("=" * 72)
          print(f"status:                  {prediction_status}")
          print(
              "prediction id:           "
              f"{prediction.get('prediction_id') if prediction else None}"
          )
          print(f"existing evidence pairs: {len(observed_pairs)}")
          print(f"evaluated predictions:   {len(evaluated_predictions)}")
          print(f"learning status:         {learning_status}")
          print()
          print(record["next_step"])
          print()
          print("[OK] ACT53 memory written.")
          PY

      - name: Commit and push ACT53 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_53_empirical_prediction_loop.json
          git add memory/nox_act_53_empirical_prediction_loop.md

          if git diff --cached --quiet; then
            echo "[INFO] No ACT53 changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT53 empirical prediction loop"
          git push origin HEAD:main
