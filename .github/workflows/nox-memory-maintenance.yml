name: NØX - Memory Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse uniquement, sans modifier les fichiers"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-memory-maintenance
  cancel-in-progress: false

jobs:
  memory-maintenance:
    name: Clean and compact NØX memory
    runs-on: ubuntu-latest

    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate target files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "memory/nox_colony_presence.json"
            "memory/nox_core_memory.json"
            "memory/nox_knowledge.json"
            "memory/nox_evolution_history.json"
            "memory/nox_core_runtime.json"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "SKIP: $file does not exist"
            fi
          done

      - name: Validate JSON before maintenance
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          for path in files:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")
          PY

      - name: Safe exact-duplicate cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path

          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          TARGETS = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          def fingerprint(value):
              return hashlib.sha256(
                  canonical(value).encode("utf-8")
              ).hexdigest()

          def clean(value):
              removed = 0

              if isinstance(value, dict):
                  result = {}

                  for key, item in value.items():
                      cleaned, count = clean(item)
                      result[key] = cleaned
                      removed += count

                  return result, removed

              if isinstance(value, list):
                  result = []
                  seen = set()

                  for item in value:
                      cleaned, count = clean(item)
                      removed += count

                      if isinstance(cleaned, (dict, list)):
                          key = fingerprint(cleaned)

                          if key in seen:
                              removed += 1
                              continue

                          seen.add(key)

                      result.append(cleaned)

                  return result, removed

              return value, 0

          changed_files = 0
          total_removed = 0

          for path in TARGETS:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  original = json.load(f)

              cleaned, removed = clean(original)

              if canonical(original) == canonical(cleaned):
                  print(f"UNCHANGED: {path}")
                  continue

              changed_files += 1
              total_removed += removed

              print(
                  f"CANDIDATE: {path} | "
                  f"exact duplicate complex entries: {removed}"
              )

              if DRY_RUN:
                  continue

              fd, tmp_name = tempfile.mkstemp(
                  prefix=f".{path.name}.",
                  suffix=".tmp",
                  dir=str(path.parent),
                  text=True,
              )

              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as tmp:
                      json.dump(
                          cleaned,
                          tmp,
                          ensure_ascii=False,
                          indent=2,
                      )
                      tmp.write("\n")
                      tmp.flush()
                      os.fsync(tmp.fileno())

                  with open(tmp_name, "r", encoding="utf-8") as check:
                      validated = json.load(check)

                  if canonical(validated) != canonical(cleaned):
                      raise RuntimeError(
                          f"Temporary validation mismatch: {path}"
                      )

                  os.replace(tmp_name, path)

              finally:
                  if os.path.exists(tmp_name):
                      os.unlink(tmp_name)

          print("")
          print("=== EXACT CLEANUP ===")
          print(f"DRY_RUN: {DRY_RUN}")
          print(f"FILES_CHANGED: {changed_files}")
          print(f"DUPLICATES_REMOVED: {total_removed}")
          PY

      - name: Compact redundant knowledge experiences
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path("memory/nox_knowledge.json")
          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          if not path.exists():
              print("KNOWLEDGE COMPACTION: file does not exist")
              raise SystemExit(0)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          experiences = data.get("experiences")

          if not isinstance(experiences, list):
              print("KNOWLEDGE COMPACTION: experiences is not a list")
              raise SystemExit(0)

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          def fingerprint(value):
              return hashlib.sha256(
                  canonical(value).encode("utf-8")
              ).hexdigest()

          def identity_body(entry):
              """
              Identity used for safe experience compaction.

              Only these fields are ignored:
              - id
              - evidence

              Everything else must be identical.
              """
              if not isinstance(entry, dict):
                  return None

              return {
                  key: value
                  for key, value in entry.items()
                  if key not in {"id", "evidence"}
              }

          def evidence_state(entry):
              if "evidence" not in entry:
                  return None

              evidence = entry["evidence"]

              if evidence is None:
                  return None

              if evidence == "":
                  return None

              if evidence == []:
                  return None

              if evidence == {}:
                  return None

              return evidence

          groups = {}

          for index, entry in enumerate(experiences):
              if not isinstance(entry, dict):
                  continue

              body = identity_body(entry)

              if body is None:
                  continue

              key = fingerprint(body)
              groups.setdefault(key, []).append(index)

          compacted = []
          removed = 0
          merged_evidence = 0
          protected_conflicts = 0

          consumed = set()

          for index, entry in enumerate(experiences):
              if index in consumed:
                  continue

              if not isinstance(entry, dict):
                  compacted.append(entry)
                  continue

              body = identity_body(entry)

              if body is None:
                  compacted.append(entry)
                  continue

              key = fingerprint(body)
              indexes = groups.get(key, [index])

              if len(indexes) == 1:
                  compacted.append(entry)
                  consumed.add(index)
                  continue

              entries = [
                  experiences[i]
                  for i in indexes
              ]

              non_empty_evidence = []

              for candidate in entries:
                  evidence = evidence_state(candidate)

                  if evidence is not None:
                      non_empty_evidence.append(evidence)

              unique_evidence = {
                  canonical(value)
                  for value in non_empty_evidence
              }

              # If multiple distinct evidence payloads exist,
              # the experiences are NOT safe to merge.
              if len(unique_evidence) > 1:
                  protected_conflicts += 1

                  for i in indexes:
                      compacted.append(experiences[i])
                      consumed.add(i)

                  continue

              # Safe merge.
              keeper = dict(entries[0])

              if non_empty_evidence:
                  keeper["evidence"] = non_empty_evidence[0]

                  if "evidence" not in entries[0] or evidence_state(entries[0]) is None:
                      merged_evidence += 1

              compacted.append(keeper)

              for i in indexes:
                  consumed.add(i)

              removed += len(indexes) - 1

          print("=== KNOWLEDGE EXPERIENCE COMPACTION ===")
          print(f"EXPERIENCES_BEFORE: {len(experiences)}")
          print(f"SAFE_DUPLICATES_FOUND: {removed}")
          print(f"EVIDENCE_MERGES: {merged_evidence}")
          print(f"PROTECTED_CONFLICT_GROUPS: {protected_conflicts}")
          print(f"DRY_RUN: {DRY_RUN}")

          if removed == 0:
              print("No safely redundant experiences found.")
              raise SystemExit(0)

          data["experiences"] = compacted

          if DRY_RUN:
              print("DRY RUN: no knowledge file modified.")
              raise SystemExit(0)

          fd, tmp_name = tempfile.mkstemp(
              prefix=".nox_knowledge.",
              suffix=".tmp",
              dir=str(path.parent),
              text=True,
          )

          try:
              with os.fdopen(fd, "w", encoding="utf-8") as tmp:
                  json.dump(
                      data,
                      tmp,
                      ensure_ascii=False,
                      indent=2,
                  )
                  tmp.write("\n")
                  tmp.flush()
                  os.fsync(tmp.fileno())

              with open(tmp_name, "r", encoding="utf-8") as check:
                  validated = json.load(check)

              if canonical(validated) != canonical(data):
                  raise RuntimeError(
                      "Temporary knowledge validation mismatch"
                  )

              os.replace(tmp_name, path)

          finally:
              if os.path.exists(tmp_name):
                  os.unlink(tmp_name)

          print(
              f"KNOWLEDGE_COMPACTED: removed {removed} "
              f"redundant experience entries."
          )
          PY

      - name: Validate JSON after maintenance
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          for path in files:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID AFTER MAINTENANCE: {path}")
          PY

      - name: Validate diff
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff --check -- \
            memory/nox_colony_presence.json \
            memory/nox_core_memory.json \
            memory/nox_knowledge.json \
            memory/nox_evolution_history.json \
            memory/nox_core_runtime.json

          echo "Git diff validation passed."

      - name: Commit only real changes
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "memory/nox_colony_presence.json"
            "memory/nox_core_memory.json"
            "memory/nox_knowledge.json"
            "memory/nox_evolution_history.json"
            "memory/nox_core_runtime.json"
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No memory changes detected."
            exit 0
          fi

          git config user.name "NØX Memory Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${files[@]}"

          git commit -m "chore(memory): compact redundant experiences"

          git push
