name: NØX - Memory Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse uniquement, sans modifier les fichiers"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-memory-maintenance
  cancel-in-progress: false

jobs:
  memory-maintenance:
    name: Clean and audit NØX memory
    runs-on: ubuntu-latest

    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate target files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "memory/nox_colony_presence.json"
            "memory/nox_core_memory.json"
            "memory/nox_knowledge.json"
            "memory/nox_evolution_history.json"
            "memory/nox_core_runtime.json"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "SKIP: $file does not exist"
            fi
          done

      - name: Validate JSON before maintenance
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          for path in files:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")
          PY

      - name: Safe exact-duplicate cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tempfile
          from pathlib import Path

          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          TARGETS = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          def fingerprint(value):
              return hashlib.sha256(
                  canonical(value).encode("utf-8")
              ).hexdigest()

          def clean(value):
              removed = 0

              if isinstance(value, dict):
                  result = {}

                  for key, item in value.items():
                      cleaned, count = clean(item)
                      result[key] = cleaned
                      removed += count

                  return result, removed

              if isinstance(value, list):
                  result = []
                  seen = set()

                  for item in value:
                      cleaned, count = clean(item)
                      removed += count

                      if isinstance(cleaned, (dict, list)):
                          key = fingerprint(cleaned)

                          if key in seen:
                              removed += 1
                              continue

                          seen.add(key)

                      result.append(cleaned)

                  return result, removed

              return value, 0

          changed_files = 0
          total_removed = 0

          for path in TARGETS:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  original = json.load(f)

              cleaned, removed = clean(original)

              if canonical(original) == canonical(cleaned):
                  print(f"UNCHANGED: {path}")
                  continue

              changed_files += 1
              total_removed += removed

              print(
                  f"CANDIDATE: {path} | "
                  f"exact duplicate complex entries: {removed}"
              )

              if DRY_RUN:
                  continue

              fd, tmp_name = tempfile.mkstemp(
                  prefix=f".{path.name}.",
                  suffix=".tmp",
                  dir=str(path.parent),
                  text=True,
              )

              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as tmp:
                      json.dump(
                          cleaned,
                          tmp,
                          ensure_ascii=False,
                          indent=2,
                      )
                      tmp.write("\n")
                      tmp.flush()
                      os.fsync(tmp.fileno())

                  with open(tmp_name, "r", encoding="utf-8") as check:
                      validated = json.load(check)

                  if canonical(validated) != canonical(cleaned):
                      raise RuntimeError(
                          f"Temporary validation mismatch: {path}"
                      )

                  os.replace(tmp_name, path)

              finally:
                  if os.path.exists(tmp_name):
                      os.unlink(tmp_name)

          print("")
          print("=== EXACT CLEANUP ===")
          print(f"DRY_RUN: {DRY_RUN}")
          print(f"FILES_CHANGED: {changed_files}")
          print(f"DUPLICATES_REMOVED: {total_removed}")
          PY

      - name: Audit semantic redundancy in knowledge
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path("memory/nox_knowledge.json")

          if not path.exists():
              print("KNOWLEDGE AUDIT: file does not exist")
              raise SystemExit(0)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          def canonical(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          def digest(value):
              return hashlib.sha256(
                  canonical(value).encode("utf-8")
              ).hexdigest()

          def normalize_entry(entry, ignored_fields):
              if not isinstance(entry, dict):
                  return entry

              result = {}

              for key, value in entry.items():
                  if key in ignored_fields:
                      continue

                  result[key] = value

              return result

          def duplicate_groups(items, ignored_fields):
              groups = defaultdict(list)

              if not isinstance(items, list):
                  return []

              for index, item in enumerate(items):
                  normalized = normalize_entry(
                      item,
                      ignored_fields,
                  )

                  groups[digest(normalized)].append(index)

              return [
                  indexes
                  for indexes in groups.values()
                  if len(indexes) > 1
              ]

          print("=== KNOWLEDGE SEMANTIC AUDIT ===")

          arrays = {
              "facts": ["id"],
              "experiences": ["id", "evidence"],
              "learnings": ["id"],
              "observations": ["id"],
              "sources": ["id"],
              "hypotheses": ["id"],
              "results": ["id"],
          }

          for section, ignored in arrays.items():
              items = data.get(section, [])

              if not isinstance(items, list):
                  print(
                      f"{section}: SKIP "
                      f"(not a list)"
                  )
                  continue

              groups = duplicate_groups(
                  items,
                  ignored,
              )

              print(
                  f"{section}: "
                  f"entries={len(items)} "
                  f"candidate_groups={len(groups)} "
                  f"candidate_entries={sum(len(g) - 1 for g in groups)}"
              )

          # Colony bootstrap analysis.
          bootstrap = []

          for section in (
              "facts",
              "experiences",
              "observations",
              "learnings",
          ):
              items = data.get(section, [])

              if not isinstance(items, list):
                  continue

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  text = canonical(item).lower()

                  if "colony_bootstrap" in text:
                      bootstrap.append(item)

          capability_groups = defaultdict(list)

          for item in bootstrap:
              capabilities = item.get("capabilities")

              if capabilities is None:
                  continue

              capability_groups[digest(capabilities)].append(item)

          repeated_capability_groups = [
              group
              for group in capability_groups.values()
              if len(group) > 1
          ]

          print(
              "colony_bootstrap: "
              f"entries={len(bootstrap)} "
              f"repeated_capability_groups="
              f"{len(repeated_capability_groups)}"
          )

          # Explicitly report that semantic candidates are not deleted.
          print("")
          print("SEMANTIC ACTION: REPORT ONLY")
          print("No semantic candidate was deleted.")
          print("No field was rewritten.")
          print("No historical snapshot was removed.")
          print("No learning or experience was compacted.")
          PY

      - name: Validate JSON after maintenance
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("memory/nox_colony_presence.json"),
              Path("memory/nox_core_memory.json"),
              Path("memory/nox_knowledge.json"),
              Path("memory/nox_evolution_history.json"),
              Path("memory/nox_core_runtime.json"),
          ]

          for path in files:
              if not path.exists():
                  continue

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID AFTER MAINTENANCE: {path}")
          PY

      - name: Validate diff
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff --check -- \
            memory/nox_colony_presence.json \
            memory/nox_core_memory.json \
            memory/nox_knowledge.json \
            memory/nox_evolution_history.json \
            memory/nox_core_runtime.json

          echo "Git diff validation passed."

      - name: Commit only real changes
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "memory/nox_colony_presence.json"
            "memory/nox_core_memory.json"
            "memory/nox_knowledge.json"
            "memory/nox_evolution_history.json"
            "memory/nox_core_runtime.json"
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No memory changes detected."
            exit 0
          fi

          git config user.name "NØX Memory Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${files[@]}"

          git commit -m "chore(memory): remove exact duplicate entries"

          git push
