name: NØX - Memory Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  PROJECT_COST_EUR: "0"
  FREE_AI_ONLY: "true"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  maintain-memory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and safely bound memory files
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          policy={"PROJECT_COST_EUR":"0","AUTO_PAYMENT":"false","AUTO_SPENDING":"false","FREE_AI_ONLY":"true"}
          for k,v in policy.items():
              if os.environ.get(k,v).lower()!=v: raise SystemExit(f"SECURITY STOP: {k} must remain {v}")
          files={
            "memory/nox_core_memory.json": {"observations":300,"questions":300,"hypotheses":300,"decisions":300,"actions":300,"results":300,"learnings":300,"failures":300,"relationships":300,"cognitive_cases":150},
            "memory/nox_core_runtime.json": {"seen_event_ids":1000,"processed_post_ids":1000,"processed_suggestion_ids":1000,"consumed_work_result_ids":1000,"consumed_presence_outcome_ids":1000,"pending_actions":100},
            "memory/nox_work_factory.json": {"history":150,"completed":300,"results":300,"requests":300,"manual_review":300},
            "memory/nox_colony_presence.json": {"runs":150,"outcomes":300,"actions":300,"errors":150,"observed_posts":500,"replied_posts":300,"published_posts":300,"notifications":300},
            "memory/nox_knowledge.json": {"observations":500,"facts":500,"hypotheses":500,"experiences":500,"results":500,"learnings":500,"sources":500,"queries":300},
            "memory/nox_self_evolution.json": {"history":150,"signals":300,"findings":300,"experiments":150,"changes":150,"learnings":300}
          }
          changed=[]
          for filename,limits in files.items():
              p=Path(filename)
              if not p.exists(): continue
              try: obj=json.loads(p.read_text(encoding="utf-8"))
              except Exception as e: raise SystemExit(f"STATE SAFETY STOP: invalid JSON in {filename}: {e}")
              if not isinstance(obj,dict): raise SystemExit(f"STATE SAFETY STOP: {filename} root is not object")
              did=False
              for key,limit in limits.items():
                  if key in obj and isinstance(obj[key],list) and len(obj[key])>limit:
                      obj[key]=obj[key][-limit:]; did=True
              if did:
                  obj["maintenance"]={"timestamp":datetime.now(timezone.utc).isoformat(),"policy":"bounded retention; no semantic promotion or deletion outside configured list limits"}
                  tmp=p.with_suffix(p.suffix+".tmp"); tmp.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"); json.loads(tmp.read_text(encoding="utf-8")); os.replace(tmp,p); changed.append(filename)
          # Hand the exact list of rewritten files to the commit step, so it never
          # stages files that other workflows are updating at the same time.
          marker=Path(os.environ.get("RUNNER_TEMP","/tmp"))/"nox_maintenance_changed.txt"
          marker.write_text("\n".join(changed),encoding="utf-8")
          for filename in files:
              fp=Path(filename)
              if fp.exists():
                  size=fp.stat().st_size
                  print(f"size {filename}: {size/1024:.0f} KB" + ("  WARNING: over 1.5 MB" if size>1_500_000 else ""))
          print("Memory maintenance complete; bounded files changed:", changed)
          PY
      - name: Commit maintenance changes if needed
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          MARKER="${RUNNER_TEMP:-/tmp}/nox_maintenance_changed.txt"
          if [ ! -s "$MARKER" ]; then
            echo "No bounded files changed."
            exit 0
          fi
          while IFS= read -r changed_file || [ -n "$changed_file" ]; do
            [ -n "$changed_file" ] && git add -- "$changed_file"
          done < "$MARKER"
          if git diff --cached --quiet; then
            echo "No maintenance changes."
            exit 0
          fi
          git commit -m "chore(nox): bound memory retention safely"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying."
            sleep $((attempt * 5))
          done
          echo "Push failed after 4 attempts."
          exit 1
