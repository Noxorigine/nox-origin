name: NØX - Memory Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze only, without writing changes"
        required: false
        default: "false"
        type: boolean

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  KNOWLEDGE_INDEX_FILE: memory/nox_knowledge_index.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  EVOLUTION_FILE: memory/nox_evolution_history.json

  MAX_OBSERVATIONS: "500"
  MAX_FACTS: "300"
  MAX_EXPERIENCES: "300"
  MAX_HYPOTHESES: "200"
  MAX_RESULTS: "300"
  MAX_LEARNINGS: "300"
  MAX_SOURCES: "300"
  MAX_QUERIES: "300"

  MAX_RUNTIME_OBSERVATIONS: "500"
  MAX_RUNTIME_DECISIONS: "300"
  MAX_RUNTIME_ACTIONS: "300"
  MAX_RUNTIME_OUTCOMES: "500"
  MAX_RUNTIME_WEB_QUERIES: "300"

  MAX_WORK_PENDING: "100"
  MAX_WORK_HISTORY: "150"
  MAX_WORK_RESULTS: "150"
  MAX_WORK_FAILED: "100"

  MAX_PRESENCE_ACTIONS: "300"
  MAX_PRESENCE_OUTCOMES: "500"
  MAX_PRESENCE_ERRORS: "200"
  MAX_PRESENCE_RUNS: "100"
  MAX_TRACKED_TARGETS: "500"

  MAX_EVOLUTION_HISTORY: "100"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  memory-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compact NØX memory
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          KNOWLEDGE_INDEX_FILE = Path(os.environ["KNOWLEDGE_INDEX_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          EVOLUTION_FILE = Path(os.environ["EVOLUTION_FILE"])

          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          LIMITS = {
              "core_memory": {
                  "observations": int(os.environ["MAX_OBSERVATIONS"]),
                  "facts": int(os.environ["MAX_FACTS"]),
                  "experiences": int(os.environ["MAX_EXPERIENCES"]),
                  "hypotheses": int(os.environ["MAX_HYPOTHESES"]),
                  "results": int(os.environ["MAX_RESULTS"]),
                  "learnings": int(os.environ["MAX_LEARNINGS"]),
              },
              "knowledge": {
                  "observations": int(os.environ["MAX_OBSERVATIONS"]),
                  "facts": int(os.environ["MAX_FACTS"]),
                  "experiences": int(os.environ["MAX_EXPERIENCES"]),
                  "hypotheses": int(os.environ["MAX_HYPOTHESES"]),
                  "results": int(os.environ["MAX_RESULTS"]),
                  "learnings": int(os.environ["MAX_LEARNINGS"]),
                  "sources": int(os.environ["MAX_SOURCES"]),
                  "queries": int(os.environ["MAX_QUERIES"]),
              },
              "runtime": {
                  "observations": int(os.environ["MAX_RUNTIME_OBSERVATIONS"]),
                  "decisions": int(os.environ["MAX_RUNTIME_DECISIONS"]),
                  "actions": int(os.environ["MAX_RUNTIME_ACTIONS"]),
                  "outcomes": int(os.environ["MAX_RUNTIME_OUTCOMES"]),
                  "web_queries": int(os.environ["MAX_RUNTIME_WEB_QUERIES"]),
              },
              "work": {
                  "pending": int(os.environ["MAX_WORK_PENDING"]),
                  "history": int(os.environ["MAX_WORK_HISTORY"]),
                  "results": int(os.environ["MAX_WORK_RESULTS"]),
                  "failed": int(os.environ["MAX_WORK_FAILED"]),
              },
              "presence": {
                  "actions": int(os.environ["MAX_PRESENCE_ACTIONS"]),
                  "outcomes": int(os.environ["MAX_PRESENCE_OUTCOMES"]),
                  "errors": int(os.environ["MAX_PRESENCE_ERRORS"]),
                  "runs": int(os.environ["MAX_PRESENCE_RUNS"]),
                  "tracked_targets": int(os.environ["MAX_TRACKED_TARGETS"]),
              },
              "evolution": {
                  "history": int(os.environ["MAX_EVOLUTION_HISTORY"]),
              },
          }

          NOW = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def load(path):
              if not path.exists():
                  return {}

              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
                  f.write("\n")

              tmp.replace(path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def timestamp(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "timestamp",
                  "created_at",
                  "created",
                  "updated_at",
                  "observed_at",
                  "completed_at",
                  "date",
              ):
                  value = item.get(key)

                  if value:
                      return str(value)

              return ""

          def stable_identity(item):
              if not isinstance(item, dict):
                  return hashlib.sha256(
                      str(item).encode("utf-8")
                  ).hexdigest()

              for key in (
                  "id",
                  "action_id",
                  "work_id",
                  "message_id",
                  "post_id",
                  "target_id",
                  "url",
              ):
                  value = item.get(key)

                  if value:
                      return f"{key}:{value}"

              semantic = {
                  key: item.get(key)
                  for key in (
                      "type",
                      "status",
                      "question",
                      "title",
                      "text",
                      "content",
                      "conclusion",
                      "learning",
                  )
                  if item.get(key) is not None
              }

              raw = json.dumps(
                  semantic,
                  ensure_ascii=False,
                  sort_keys=True,
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()

          def semantic_key(item):
              if not isinstance(item, dict):
                  return str(item)

              fields = (
                  "type",
                  "question",
                  "title",
                  "text",
                  "content",
                  "conclusion",
                  "learning",
                  "action_id",
                  "message_id",
                  "post_id",
                  "target_id",
                  "url",
              )

              parts = []

              for field in fields:
                  value = item.get(field)

                  if value is None:
                      continue

                  if isinstance(value, str):
                      value = " ".join(value.split()).strip().lower()

                  parts.append(f"{field}={value}")

              return "|".join(parts)

          def newest_first(items):
              return sorted(
                  items,
                  key=lambda item: timestamp(item),
                  reverse=True,
              )

          def deduplicate(items):
              result = []
              seen_ids = set()
              seen_semantic = set()

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  identity = stable_identity(item)
                  semantic = semantic_key(item)

                  if identity in seen_ids:
                      continue

                  if semantic and semantic in seen_semantic:
                      continue

                  seen_ids.add(identity)

                  if semantic:
                      seen_semantic.add(semantic)

                  result.append(item)

              return result

          def compact_collection(items, limit):
              cleaned = deduplicate(items)
              cleaned = newest_first(cleaned)
              return cleaned[:limit]

          def process_collection(
              obj,
              key,
              limit,
              *,
              preserve_status=False,
          ):
              original = as_list(obj.get(key))

              compacted = compact_collection(
                  original,
                  limit,
              )

              removed = len(original) - len(compacted)

              obj[key] = compacted

              return removed

          core_memory = as_dict(load(CORE_MEMORY_FILE))
          core_runtime = as_dict(load(CORE_RUNTIME_FILE))
          work = as_dict(load(WORK_FILE))
          knowledge = as_dict(load(KNOWLEDGE_FILE))
          knowledge_index = as_dict(load(KNOWLEDGE_INDEX_FILE))
          presence = as_dict(load(PRESENCE_FILE))
          evolution = as_dict(load(EVOLUTION_FILE))

          stats = {
              "files_changed": 0,
              "duplicates_removed": 0,
              "bounded_items_removed": 0,
          }

          # ============================================================
          # CORE MEMORY
          #
          # Facts are treated specially:
          # only explicit verified facts survive.
          # ============================================================

          for key, limit in LIMITS["core_memory"].items():
              before = len(as_list(core_memory.get(key)))

              removed = process_collection(
                  core_memory,
                  key,
                  limit,
              )

              after = len(as_list(core_memory.get(key)))

              stats["duplicates_removed"] += max(
                  0,
                  before - after,
              )

          verified_facts = []

          for item in as_list(core_memory.get("facts")):
              if not isinstance(item, dict):
                  continue

              verified = (
                  item.get("verified") is True
                  or str(
                      item.get("verification")
                      or item.get("status")
                      or item.get("evidence_status")
                      or ""
                  ).lower()
                  in {
                      "verified",
                      "confirmed",
                      "multi_source_verified",
                  }
              )

              if verified:
                  verified_facts.append(item)

          core_memory["facts"] = compact_collection(
              verified_facts,
              LIMITS["core_memory"]["facts"],
          )

          # ============================================================
          # RUNTIME
          #
          # Do not compact pending work by semantic similarity.
          # Runtime actions can be operationally distinct.
          # ============================================================

          for key, limit in LIMITS["runtime"].items():
              original = as_list(core_runtime.get(key))

              compacted = newest_first(original)[:limit]

              removed = max(
                  0,
                  len(original) - len(compacted),
              )

              core_runtime[key] = compacted
              stats["bounded_items_removed"] += removed

          # ============================================================
          # WORK FACTORY
          #
          # Pending items are preserved in full unless over the explicit
          # operational bound. No semantic deduplication of pending work.
          # ============================================================

          for key, limit in LIMITS["work"].items():
              original = as_list(work.get(key))

              if key == "pending":
                  compacted = original[-limit:]
              else:
                  compacted = newest_first(original)[:limit]

              removed = max(
                  0,
                  len(original) - len(compacted),
              )

              work[key] = compacted
              stats["bounded_items_removed"] += removed

          # ============================================================
          # KNOWLEDGE
          # ============================================================

          for key, limit in LIMITS["knowledge"].items():
              original = as_list(knowledge.get(key))

              compacted = compact_collection(
                  original,
                  limit,
              )

              removed = max(
                  0,
                  len(original) - len(compacted),
              )

              knowledge[key] = compacted

              stats["duplicates_removed"] += removed

          # Preserve only explicitly verified facts.
          knowledge_facts = []

          for item in as_list(knowledge.get("facts")):
              if not isinstance(item, dict):
                  continue

              verified = (
                  item.get("verified") is True
                  or str(
                      item.get("verification")
                      or item.get("status")
                      or item.get("evidence_status")
                      or ""
                  ).lower()
                  in {
                      "verified",
                      "confirmed",
                      "multi_source_verified",
                  }
              )

              if verified:
                  knowledge_facts.append(item)

          knowledge["facts"] = compact_collection(
              knowledge_facts,
              LIMITS["knowledge"]["facts"],
          )

          # ============================================================
          # PRESENCE
          #
          # Never recursively rewrite or shrink nested action/outcome
          # payloads. Only bound top-level collections.
          # ============================================================

          for key, limit in LIMITS["presence"].items():
              original = as_list(presence.get(key))

              compacted = newest_first(original)[:limit]

              removed = max(
                  0,
                  len(original) - len(compacted),
              )

              presence[key] = compacted
              stats["bounded_items_removed"] += removed

          # ============================================================
          # EVOLUTION HISTORY
          # ============================================================

          original_history = as_list(evolution.get("history"))

          evolution["history"] = newest_first(
              original_history
          )[:LIMITS["evolution"]["history"]]

          stats["bounded_items_removed"] += max(
              0,
              len(original_history) - len(evolution["history"]),
          )

          # ============================================================
          # Rebuild knowledge index from the compacted knowledge.
          # ============================================================

          index_items = []

          for collection_name in (
              "observations",
              "facts",
              "experiences",
              "hypotheses",
              "results",
              "learnings",
          ):
              for item in as_list(knowledge.get(collection_name)):
                  if not isinstance(item, dict):
                      continue

                  content = (
                      item.get("text")
                      or item.get("content")
                      or item.get("question")
                      or item.get("conclusion")
                      or item.get("learning")
                      or item.get("title")
                      or ""
                  )

                  index_items.append({
                      "id": item.get("id"),
                      "type": collection_name[:-1]
                      if collection_name.endswith("s")
                      else collection_name,
                      "timestamp": timestamp(item) or NOW,
                      "text": str(content)[:2000],
                  })

          index_items = newest_first(index_items)[:1200]

          knowledge_index = {
              "schema_version": 2,
              "updated_at": NOW,
              "count": len(index_items),
              "items": index_items,
          }

          # ============================================================
          # Metadata
          # ============================================================

          core_memory["updated_at"] = NOW
          core_runtime["maintenance_at"] = NOW
          work["maintenance_at"] = NOW
          knowledge["updated_at"] = NOW
          presence["maintenance_at"] = NOW
          evolution["maintenance_at"] = NOW

          # ============================================================
          # Policy integrity
          # ============================================================

          assert os.environ["PROJECT_COST_EUR"] == "0"
          assert os.environ["GEMINI_USED"].lower() == "false"
          assert os.environ["EXTERNAL_AI_USED"].lower() == "false"
          assert os.environ["AUTO_PAYMENT"].lower() == "false"
          assert os.environ["AUTO_SPENDING"].lower() == "false"

          print("=== NØX MEMORY MAINTENANCE ===")
          print(f"Run: {NOW}")
          print(f"Dry run: {DRY_RUN}")
          print(f"Duplicate removals: {stats['duplicates_removed']}")
          print(f"Bounded removals: {stats['bounded_items_removed']}")

          if DRY_RUN:
              print("DRY RUN: no files will be written.")
          else:
              save(CORE_MEMORY_FILE, core_memory)
              save(CORE_RUNTIME_FILE, core_runtime)
              save(WORK_FILE, work)
              save(KNOWLEDGE_FILE, knowledge)
              save(KNOWLEDGE_INDEX_FILE, knowledge_index)
              save(PRESENCE_FILE, presence)
              save(EVOLUTION_FILE, evolution)

              print("Memory maintenance completed.")
          PY

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          from pathlib import Path

          files = [
              Path(os.environ["CORE_MEMORY_FILE"]),
              Path(os.environ["CORE_RUNTIME_FILE"]),
              Path(os.environ["WORK_FILE"]),
              Path(os.environ["KNOWLEDGE_FILE"]),
              Path(os.environ["KNOWLEDGE_INDEX_FILE"]),
              Path(os.environ["PRESENCE_FILE"]),
              Path(os.environ["EVOLUTION_FILE"]),
          ]

          for path in files:
              if not path.exists():
                  raise SystemExit(f"Missing JSON file: {path}")

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")

          assert os.environ["PROJECT_COST_EUR"] == "0"
          assert os.environ["GEMINI_USED"].lower() == "false"
          assert os.environ["EXTERNAL_AI_USED"].lower() == "false"
          assert os.environ["AUTO_PAYMENT"].lower() == "false"
          assert os.environ["AUTO_SPENDING"].lower() == "false"

          print("POLICY: OK")
          PY

          git diff --check

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          if git diff --quiet; then
            echo "No maintenance changes to commit."
            exit 0
          fi

          git add \
            memory/nox_core_memory.json \
            memory/nox_core_runtime.json \
            memory/nox_work_factory.json \
            memory/nox_knowledge.json \
            memory/nox_knowledge_index.json \
            memory/nox_colony_presence.json \
            memory/nox_evolution_history.json

          git commit -m "chore(nox): maintain bounded memory"

          git pull --rebase origin main
          git push origin HEAD:main
