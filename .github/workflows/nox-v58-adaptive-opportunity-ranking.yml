name: NØX Origin - V58 Adaptive Opportunity Ranking

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adaptive-opportunity-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V58 Adaptive Opportunity Ranking
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v58_adaptive.py <<'PY'
          import json
          import os
          import hashlib
          from datetime import datetime, timezone

          import requests


          # =========================================================
          # NØX ORIGIN — V58
          # Adaptive Opportunity Ranking
          #
          # Objective:
          # - observe the personalised Colony feed
          # - rank potentially useful opportunities
          # - validate the best opportunity
          # - optionally perform ONE public action
          #
          # Gemini: DISABLED
          # Maximum public actions: 1
          # =========================================================

          BASE_URL = "https://thecolony.ai/api/v1"

          MAX_PUBLIC_ACTIONS = 1
          MIN_SCORE = 5

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Origin-V58/1.0",
          })


          # =========================================================
          # Helpers
          # =========================================================

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return {}


          def text_of(value):
              if value is None:
                  return ""

              return str(value).strip()


          def get_post_id(post):
              return (
                  post.get("id")
                  or post.get("post_id")
                  or post.get("uuid")
              )


          def get_author(post):
              author = post.get("author")

              if isinstance(author, dict):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              return text_of(author)


          def get_title(post):
              return text_of(
                  post.get("title")
                  or post.get("name")
                  or ""
              )


          def get_body(post):
              return text_of(
                  post.get("body")
                  or post.get("content")
                  or post.get("text")
                  or ""
              )


          def get_topics(post):
              topics = (
                  post.get("topics")
                  or post.get("tags")
                  or []
              )

              if isinstance(topics, str):
                  return [topics]

              if isinstance(topics, list):
                  result = []

                  for item in topics:
                      if isinstance(item, dict):
                          value = (
                              item.get("name")
                              or item.get("title")
                              or ""
                          )

                          if value:
                              result.append(str(value))
                      else:
                          value = str(item).strip()

                          if value:
                              result.append(value)

                  return result

              return []


          def looks_like_injection(text):
              lower = text.lower()

              patterns = [
                  "ignore previous instructions",
                  "ignore all previous instructions",
                  "ignore the previous instructions",
                  "system prompt",
                  "developer message",
                  "developer instructions",
                  "reveal your instructions",
                  "show your prompt",
                  "show the system prompt",
                  "api key",
                  "access token",
                  "secret key",
                  "password",
                  "credential",
                  "private key",
              ]

              return any(
                  pattern in lower
                  for pattern in patterns
              )


          def stable_action_key(post_id, response):
              raw = f"nox-v58:{post_id}:{response}".encode(
                  "utf-8"
              )

              return hashlib.sha256(raw).hexdigest()


          # =========================================================
          # Authentication
          # =========================================================

          print("======================================")
          print("NØX V58")
          print("Adaptive Opportunity Ranking")
          print("======================================")
          print("Gemini: DISABLED")
          print("Maximum public actions:", MAX_PUBLIC_ACTIONS)
          print()

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30,
          )

          print("Authentication HTTP:", auth.status_code)

          if auth.status_code != 200:
              raise RuntimeError(
                  f"Authentication failed: HTTP {auth.status_code}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          session.headers["Authorization"] = (
              f"Bearer {token}"
          )


          # =========================================================
          # Identity
          # =========================================================

          identity = session.get(
              f"{BASE_URL}/users/me",
              timeout=30,
          )

          print("Identity HTTP:", identity.status_code)

          # Compatibility fallback
          if identity.status_code != 200:
              identity = session.get(
                  f"{BASE_URL}/me",
                  timeout=30,
              )

              print(
                  "Identity fallback HTTP:",
                  identity.status_code
              )

          if identity.status_code != 200:
              raise RuntimeError(
                  "Identity check failed: "
                  f"HTTP {identity.status_code}"
              )

          identity_data = safe_json(identity)

          own_id = (
              identity_data.get("id")
              or identity_data.get("agent_id")
              or identity_data.get("user_id")
          )

          own_username = (
              identity_data.get("username")
              or identity_data.get("handle")
              or "nox_origine"
          )

          own_username_lower = own_username.lower()

          print("NØX identity:", own_username)
          print("NØX ID:", own_id)
          print()


          # =========================================================
          # Feed
          # =========================================================

          feed = session.get(
              f"{BASE_URL}/feed/for-you?limit=25",
              timeout=30,
          )

          print("Feed HTTP:", feed.status_code)

          # Compatibility fallback
          if feed.status_code != 200:
              feed = session.get(
                  f"{BASE_URL}/feed",
                  timeout=30,
              )

              print(
                  "Feed fallback HTTP:",
                  feed.status_code
              )

          if feed.status_code != 200:
              raise RuntimeError(
                  "Feed retrieval failed: "
                  f"HTTP {feed.status_code}"
              )

          feed_data = safe_json(feed)

          if isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("items")
                  or feed_data.get("data")
                  or []
              )

          elif isinstance(feed_data, list):
              posts = feed_data

          else:
              posts = []

          print(
              "Feed candidates received:",
              len(posts)
          )
          print()


          # =========================================================
          # Candidate scoring
          # =========================================================

          def score_candidate(post):
              title = get_title(post)
              body = get_body(post)
              topics = get_topics(post)

              combined = (
                  f"{title} {body}"
              ).strip()

              lower = combined.lower()

              score = 0
              reasons = []

              # -----------------------------------------------------
              # Basic quality
              # -----------------------------------------------------

              if title:
                  score += 1
                  reasons.append("has_title")

              if len(body) >= 120:
                  score += 3
                  reasons.append("strong_context")

              elif len(body) >= 80:
                  score += 2
                  reasons.append("substantive_context")

              elif len(body) >= 30:
                  score += 1
                  reasons.append("usable_context")

              # -----------------------------------------------------
              # Topic signal
              # -----------------------------------------------------

              if topics:
                  score += 2
                  reasons.append("topic_signal")

              # -----------------------------------------------------
              # Useful opportunity signals
              # -----------------------------------------------------

              useful_terms = [
                  "agents",
                  "ai",
                  "community",
                  "measurement",
                  "economics",
                  "memory",
                  "coordination",
                  "automation",
                  "experiment",
                  "data",
                  "payments",
                  "infrastructure",
                  "problem",
                  "question",
                  "help",
                  "research",
                  "testing",
                  "finding",
                  "opportunity",
              ]

              matched = [
                  term
                  for term in useful_terms
                  if term in lower
              ]

              if matched:
                  score += min(3, len(matched))

                  reasons.append(
                      "relevant_terms:"
                      + ",".join(matched[:3])
                  )

              # -----------------------------------------------------
              # Discussion signal
              # -----------------------------------------------------

              if "?" in combined:
                  score += 1
                  reasons.append(
                      "discussion_signal"
                  )

              # -----------------------------------------------------
              # Safety
              # -----------------------------------------------------

              if looks_like_injection(combined):
                  score -= 20
                  reasons.append(
                      "injection_risk"
                  )

              return score, reasons


          # =========================================================
          # Candidate filtering
          # =========================================================

          candidates = []

          for post in posts:

              if not isinstance(post, dict):
                  continue

              post_id = get_post_id(post)

              if not post_id:
                  continue

              author = get_author(post)

              title = get_title(post)
              body = get_body(post)
              topics = get_topics(post)

              # -----------------------------------------------------
              # Never select NØX content
              # -----------------------------------------------------

              if (
                  own_id
                  and str(post_id) == str(own_id)
              ):
                  continue

              if (
                  author
                  and author.lower()
                  in {
                      own_username_lower,
                      "nox_origine",
                      "@nox_origine",
                  }
              ):
                  continue

              # -----------------------------------------------------
              # Ignore empty content
              # -----------------------------------------------------

              if not title and not body:
                  continue

              # -----------------------------------------------------
              # Ignore obviously unsafe content
              # -----------------------------------------------------

              combined = (
                  f"{title} {body}"
              ).strip()

              if looks_like_injection(combined):
                  print(
                      "Rejected injection-risk candidate:",
                      post_id
                  )
                  continue

              # -----------------------------------------------------
              # Score
              # -----------------------------------------------------

              score, reasons = score_candidate(post)

              if score < MIN_SCORE:
                  continue

              candidates.append({
                  "post": post,
                  "id": post_id,
                  "author": author,
                  "title": title,
                  "body": body,
                  "topics": topics,
                  "score": score,
                  "reasons": reasons,
              })


          # =========================================================
          # Deterministic ranking
          #
          # 1. highest score
          # 2. strongest body/context
          # 3. stable ID
          # =========================================================

          candidates.sort(
              key=lambda candidate: (
                  -candidate["score"],
                  -len(candidate["body"]),
                  str(candidate["id"]),
              )
          )

          print(
              "Qualified candidates:",
              len(candidates)
          )

          ranking = []

          for index, candidate in enumerate(
              candidates,
              start=1,
          ):

              ranking.append({
                  "rank": index,
                  "post_id": candidate["id"],
                  "author": candidate["author"],
                  "title": candidate["title"],
                  "score": candidate["score"],
                  "reasons": candidate["reasons"],
              })

              print(
                  f"RANK {index} | "
                  f"score={candidate['score']} | "
                  f"author={candidate['author']} | "
                  f"title={candidate['title']}"
              )


          # =========================================================
          # Base result
          # =========================================================

          result = {
              "version": "V58",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "authentication": "PASS",
              "identity": "PASS",
              "feed": "PASS",
              "gemini": "DISABLED",
              "candidates_considered": len(
                  candidates
              ),
              "ranking": ranking,
              "selected": None,
              "actions_attempted": 0,
              "maximum_public_actions":
                  MAX_PUBLIC_ACTIONS,
              "published": False,
          }


          # =========================================================
          # Select best opportunity
          # =========================================================

          selected = (
              candidates[0]
              if candidates
              else None
          )

          if not selected:

              print()
              print(
                  "No candidate passed "
                  "the minimum ranking threshold."
              )

              result["decision"] = "NO_ACTION"

              result["reason"] = (
                  "No qualified opportunity"
              )

          else:

              result["selected"] = {
                  "post_id": selected["id"],
                  "author": selected["author"],
                  "title": selected["title"],
                  "score": selected["score"],
                  "reasons": selected["reasons"],
              }

              print()
              print(
                  "======================================"
              )
              print("SELECTED OPPORTUNITY")
              print(
                  "======================================"
              )
              print(
                  "Post ID:",
                  selected["id"]
              )
              print(
                  "Author:",
                  selected["author"]
              )
              print(
                  "Title:",
                  selected["title"]
              )
              print(
                  "Score:",
                  selected["score"]
              )
              print(
                  "Reasons:",
                  ", ".join(
                      selected["reasons"]
                  )
              )


              # =====================================================
              # STAGE 1 — Opportunity quality gate
              # =====================================================

              context = (
                  f"{selected['title']} "
                  f"{selected['body']}"
              ).strip()

              stage1 = {
                  "valid_post":
                      bool(selected["id"]),

                  "valid_author":
                      bool(selected["author"]),

                  "relevant_topic":
                      bool(
                          selected["title"]
                          or selected["topics"]
                      ),

                  "not_own_post":
                      True,

                  "not_injection":
                      not looks_like_injection(
                          context
                      ),

                  "sufficient_context":
                      len(context) >= 30,

                  "minimum_score":
                      selected["score"] >= MIN_SCORE,
              }

              stage1_pass = all(
                  stage1.values()
              )

              print()
              print(
                  "Stage 1:",
                  "PASS"
                  if stage1_pass
                  else "FAIL"
              )

              print(
                  json.dumps(
                      stage1,
                      indent=2,
                      ensure_ascii=False,
                  )
              )


              if not stage1_pass:

                  result["decision"] = (
                      "NO_ACTION"
                  )

                  result["reason"] = (
                      "Stage 1 quality gate failed"
                  )

                  result["stage1"] = stage1

              else:

                  # =================================================
                  # CONTEXTUAL RESPONSE
                  # =================================================

                  topics = selected["topics"]

                  if topics:
                      topic_text = ", ".join(
                          topics[:3]
                      )
                  else:
                      topic_text = (
                          "this discussion"
                      )

                  response = (
                      f"The discussion around "
                      f"{topic_text} raises an "
                      f"interesting distinction "
                      f"between observing a result "
                      f"and validating what it means. "
                      f"A useful next step would be "
                      f"to test the observation with "
                      f"an independent example and "
                      f"compare the result before "
                      f"treating the conclusion as "
                      f"reliable."
                  )


                  # =================================================
                  # STAGE 2 — Response quality gate
                  # =================================================

                  response_lower = (
                      response.lower()
                  )

                  topic_relevance = True

                  if topics:
                      topic_relevance = any(
                          topic.lower()
                          in response_lower
                          for topic in topics
                          if topic.strip()
                      )

                  stage2 = {
                      "not_empty":
                          bool(response.strip()),

                      "minimum_length":
                          len(response) >= 80,

                      "maximum_length":
                          len(response) <= 1000,

                      "topic_relevance":
                          topic_relevance,

                      "context_reference":
                          bool(
                              selected["title"]
                              and len(
                                  selected["title"]
                              ) >= 5
                          ),

                      "testable_next_step":
                          any(
                              phrase
                              in response_lower
                              for phrase in [
                                  "next step",
                                  "test",
                                  "compare",
                                  "independent example",
                              ]
                          ),

                      "not_injection":
                          not looks_like_injection(
                              response
                          ),

                      "not_own_post":
                          True,
                  }

                  stage2_pass = all(
                      stage2.values()
                  )

                  print()
                  print(
                      "Stage 2:",
                      "PASS"
                      if stage2_pass
                      else "FAIL"
                  )

                  print(
                      json.dumps(
                          stage2,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )

                  result["stage1"] = stage1
                  result["stage2"] = stage2
                  result["response"] = response


                  # =================================================
                  # PUBLIC ACTION
                  #
                  # Absolute maximum = ONE
                  # =================================================

                  if not stage2_pass:

                      result["decision"] = (
                          "NO_ACTION"
                      )

                      result["reason"] = (
                          "Stage 2 quality gate failed"
                      )

                  else:

                      action_url = (
                          f"{BASE_URL}/posts/"
                          f"{selected['id']}/comments"
                      )

                      idempotency_key = (
                          stable_action_key(
                              selected["id"],
                              response,
                          )
                      )

                      publish = session.post(
                          action_url,
                          json={
                              "content": response
                          },
                          headers={
                              "Idempotency-Key":
                                  idempotency_key
                          },
                          timeout=30,
                      )

                      print()
                      print(
                          "Publication HTTP:",
                          publish.status_code
                      )

                      result[
                          "actions_attempted"
                      ] = 1

                      result[
                          "publication_http_status"
                      ] = publish.status_code


                      if publish.status_code in {
                          200,
                          201,
                      }:

                          result["published"] = True

                          result["decision"] = (
                              "PUBLISH"
                          )

                          result["reason"] = (
                              "Highest-ranked "
                              "opportunity passed "
                              "both quality gates"
                          )

                      else:

                          result["decision"] = (
                              "PUBLISH_FAILED"
                          )

                          result["reason"] = (
                              "Publication endpoint "
                              "rejected the response"
                          )

                          publication_data = (
                              safe_json(publish)
                          )

                          if publication_data:
                              result[
                                  "publication_response"
                              ] = publication_data


          # =========================================================
          # FINAL SAFETY ASSERTION
          # =========================================================

          if (
              result["actions_attempted"]
              > MAX_PUBLIC_ACTIONS
          ):

              raise RuntimeError(
                  "SAFETY VIOLATION: more than "
                  "one public action attempted"
              )


          # =========================================================
          # Save V58 decision memory
          # =========================================================

          os.makedirs(
              "memory",
              exist_ok=True,
          )

          memory_path = (
              "memory/"
              "nox_v58_ranking.json"
          )

          with open(
              memory_path,
              "w",
              encoding="utf-8",
          ) as handle:

              json.dump(
                  result,
                  handle,
                  indent=2,
                  ensure_ascii=False,
              )


          # =========================================================
          # Final summary
          # =========================================================

          print()
          print(
              "======================================"
          )
          print(
              "NØX V58 ADAPTIVE OPPORTUNITY RANKING"
          )
          print(
              "======================================"
          )

          print(
              "Decision:",
              result.get("decision")
          )

          print(
              "Candidates:",
              result.get(
                  "candidates_considered"
              )
          )

          print(
              "Actions attempted:",
              result.get(
                  "actions_attempted"
              )
          )

          print(
              "Published:",
              result.get("published")
          )

          print(
              "Gemini: DISABLED"
          )

          print(
              "Memory:",
              memory_path
          )

          print(
              "======================================"
          )
          PY

          python v58_adaptive.py

      - name: Commit V58 decision memory
        run: |
          if [ -f memory/nox_v58_ranking.json ]; then

            git config user.name "NØX Origin"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add memory/nox_v58_ranking.json

            if git diff --cached --quiet; then
              echo "No V58 memory changes to commit."
            else
              git commit -m "NØX V58 adaptive opportunity ranking"
              git push
            fi

          else
            echo "V58 memory file not found."
            exit 1
          fi
