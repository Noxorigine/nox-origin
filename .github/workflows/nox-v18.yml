name: NØX Origin - V18 Experimental Design

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  nox-v18:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V18
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v17_file = memory_dir / "nox_v17_validation.json"
          v18_file = memory_dir / "nox_v18_experiments.json"

          print("======================================")
          print("NØX ORIGIN - V18 EXPERIMENTAL DESIGN")
          print("======================================")

          # ==========================================
          # HELPERS
          # ==========================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text()
                  )
              except Exception:
                  return default

          # ==========================================
          # 1. LOAD NØX KNOWLEDGE
          # ==========================================

          print("")
          print("[1/7] Loading NØX knowledge...")

          memory = load_json(
              memory_file,
              {}
          )

          v17_history = load_json(
              v17_file,
              []
          )

          if not v17_history:
              raise RuntimeError(
                  "No V17 validation data found"
              )

          latest_v17 = v17_history[-1]

          decisions = latest_v17.get(
              "decisions",
              []
          )

          print(
              f"V17 decisions available: "
              f"{len(decisions)}"
          )

          # ==========================================
          # 2. SELECT TEST CANDIDATES
          # ==========================================

          print("")
          print("[2/7] Selecting experiment candidates...")

          candidates = [
              item
              for item in decisions
              if item.get("decision")
              == "TEST_RECOMMENDED"
          ]

          print(
              f"TEST_RECOMMENDED candidates: "
              f"{len(candidates)}"
          )

          # ==========================================
          # 3. EXPERIMENT DESIGN TEMPLATES
          # ==========================================

          print("")
          print("[3/7] Designing controlled experiments...")

          experiment_templates = {

              "automation_service": {
                  "hypothesis":
                      "Agents repeatedly experience a manual task for which a simple automation could provide measurable value.",

                  "experiment":
                      "Identify one recurring manual task and compare the normal workflow with a simple proposed automation concept.",

                  "primary_metric":
                      "Time saved per task",

                  "secondary_metrics": [
                      "Task completion rate",
                      "Error rate",
                      "Number of repeated occurrences",
                      "Interest from potentially affected agents"
                  ],

                  "success_condition":
                      "The proposed approach produces measurable improvement without creating unacceptable complexity.",

                  "failure_condition":
                      "No measurable improvement or insufficient evidence of recurring demand."
              },

              "information_service": {
                  "hypothesis":
                      "Agents repeatedly need structured information that is difficult or time-consuming to obtain.",

                  "experiment":
                      "Select one information gap and create a small structured information sample using publicly available sources.",

                  "primary_metric":
                      "Usefulness of the resulting information",

                  "secondary_metrics": [
                      "Accuracy",
                      "Time required to obtain the information",
                      "Repeatability",
                      "Observed demand"
                  ],

                  "success_condition":
                      "The information is accurate, useful, reproducible and addresses a recurring need.",

                  "failure_condition":
                      "Information is unreliable, difficult to reproduce or demand appears weak."
              },

              "collaboration_service": {
                  "hypothesis":
                      "Agents with complementary capabilities could benefit from structured collaboration.",

                  "experiment":
                      "Model a small collaboration scenario using compatible capabilities and a clearly defined objective.",

                  "primary_metric":
                      "Successful completion of the shared objective",

                  "secondary_metrics": [
                      "Compatibility",
                      "Response rate",
                      "Coordination effort",
                      "Repeatability"
                  ],

                  "success_condition":
                      "The collaboration produces a measurable improvement compared with isolated effort.",

                  "failure_condition":
                      "Coordination cost exceeds the observed benefit."
              },

              "technical_service": {
                  "hypothesis":
                      "A recurring technical problem can be addressed with a repeatable solution.",

                  "experiment":
                      "Select one recurring technical problem and design a minimal reproducible solution.",

                  "primary_metric":
                      "Successful resolution rate",

                  "secondary_metrics": [
                      "Resolution time",
                      "Error rate",
                      "Repeatability",
                      "Number of similar problems"
                  ],

                  "success_condition":
                      "The solution reliably resolves the problem and can be reproduced.",

                  "failure_condition":
                      "The solution is unreliable or the problem is not sufficiently recurrent."
              },

              "agent_support": {
                  "hypothesis":
                      "A recurring need specific to AI agents can be addressed with a simple reusable capability.",

                  "experiment":
                      "Define one agent-specific problem and create a minimal conceptual solution that can be evaluated without external commitment.",

                  "primary_metric":
                      "Useful outcome for the target agent problem",

                  "secondary_metrics": [
                      "Number of affected agents",
                      "Repeat demand",
                      "Reliability",
                      "Complexity"
                  ],

                  "success_condition":
                      "The proposed capability addresses a recurring agent need with measurable utility.",

                  "failure_condition":
                      "The need is isolated, unclear or the solution provides insufficient benefit."
              },

              "marketplace_opportunity": {
                  "hypothesis":
                      "A recurring demand and supply mismatch could support a useful coordination mechanism.",

                  "experiment":
                      "Map one specific demand/supply pattern and determine whether a repeatable coordination opportunity exists.",

                  "primary_metric":
                      "Strength of recurring demand",

                  "secondary_metrics": [
                      "Available supply",
                      "Demand frequency",
                      "Potential matching rate",
                      "Repeatability"
                  ],

                  "success_condition":
                      "A recurring and measurable demand/supply mismatch is confirmed.",

                  "failure_condition":
                      "Demand is too weak, irregular or already adequately served."
              },

              "financial_opportunity": {
                  "hypothesis":
                      "An observed financial need may correspond to a legitimate useful service rather than speculation.",

                  "experiment":
                      "Evaluate the underlying utility problem without deploying capital or performing financial transactions.",

                  "primary_metric":
                      "Evidence of genuine utility",

                  "secondary_metrics": [
                      "Demand frequency",
                      "Potential usefulness",
                      "Risk level",
                      "Repeatability"
                  ],

                  "success_condition":
                      "A legitimate useful service can be demonstrated without financial exposure.",

                  "failure_condition":
                      "The opportunity depends primarily on speculation, capital exposure or unverified assumptions."
              }
          }

          generic_template = {
              "hypothesis":
                  "The observed opportunity represents a recurring problem that can potentially be solved in a measurable way.",

              "experiment":
                  "Create a minimal reversible test focused only on validating the underlying need.",

              "primary_metric":
                  "Measured usefulness",

              "secondary_metrics": [
                  "Demand",
                  "Reliability",
                  "Repeatability",
                  "Complexity"
              ],

              "success_condition":
                  "The experiment produces measurable evidence supporting the opportunity.",

              "failure_condition":
                  "The evidence does not support the opportunity."
          }

          # ==========================================
          # 4. BUILD EXPERIMENTS
          # ==========================================

          experiments = []

          for index, candidate in enumerate(
              candidates,
              start=1
          ):

              opportunity = candidate.get(
                  "opportunity",
                  "unknown"
              )

              template = experiment_templates.get(
                  opportunity,
                  generic_template
              )

              experiment = {
                  "experiment_id":
                      f"V18-EXP-{index:03d}",

                  "opportunity":
                      opportunity,

                  "confidence":
                      candidate.get(
                          "confidence",
                          0
                      ),

                  "priority":
                      candidate.get(
                          "priority",
                          "UNKNOWN"
                      ),

                  "hypothesis":
                      template["hypothesis"],

                  "experiment":
                      template["experiment"],

                  "primary_metric":
                      template["primary_metric"],

                  "secondary_metrics":
                      template["secondary_metrics"],

                  "success_condition":
                      template["success_condition"],

                  "failure_condition":
                      template["failure_condition"],

                  "observation_period":
                      "7 days",

                  "maximum_cost_eur":
                      0,

                  "capital_deployment":
                      False,

                  "external_contact":
                      False,

                  "financial_transaction":
                      False,

                  "irreversible_action":
                      False,

                  "status":
                      "DESIGNED_NOT_EXECUTED"
              }

              experiments.append(
                  experiment
              )

          # ==========================================
          # 5. SAFETY VALIDATION
          # ==========================================

          print("")
          print("[5/7] Applying V18 safety constraints...")

          safety_rules = {
              "maximum_cost_eur": 0,
              "capital_deployment": False,
              "financial_transactions": False,
              "external_contact": False,
              "irreversible_actions": False,
              "automatic_execution": False
          }

          for experiment in experiments:

              experiment["safety_gate"] = "PASS"

              experiment["execution_allowed"] = False

          # ==========================================
          # 6. SAVE EXPERIMENTS
          # ==========================================

          print("")
          print("[6/7] Saving V18 experiment designs...")

          report = {
              "version": "V18",

              "timestamp":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "NØX V17 Experiment Validation",

              "candidates_received":
                  len(candidates),

              "experiments_created":
                  len(experiments),

              "status":
                  "DESIGN_ONLY",

              "safety_rules":
                  safety_rules,

              "experiments":
                  experiments
          }

          history = load_json(
              v18_file,
              []
          )

          history.append(
              report
          )

          history = history[-20:]

          v18_file.write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # 7. UPDATE MEMORY
          # ==========================================

          print("")
          print("[7/7] Updating NØX memory...")

          memory["last_v18_analysis"] = (
              report["timestamp"]
          )

          memory["v18"] = {
              "experiments_created":
                  len(experiments),

              "status":
                  "DESIGN_ONLY",

              "execution_allowed":
                  False,

              "top_experiments": [
                  experiment["opportunity"]
                  for experiment in experiments
              ]
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # FINAL OUTPUT
          # ==========================================

          print("")
          print("======================================")
          print("NØX V18 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Candidates received : {len(candidates)}"
          )

          print(
              f"Experiments created : {len(experiments)}"
          )

          print("")
          print("EXPERIMENT DESIGNS:")

          for experiment in experiments:

              print(
                  f"{experiment['experiment_id']} | "
                  f"{experiment['opportunity']} | "
                  f"confidence="
                  f"{experiment['confidence']} | "
                  f"status="
                  f"{experiment['status']}"
              )

          print("")
          print("======================================")
          print("V18 SAFETY GATE")
          print("======================================")

          print(
              "Maximum cost       : 0 EUR"
          )

          print(
              "Capital deployment : BLOCKED"
          )

          print(
              "Financial actions  : BLOCKED"
          )

          print(
              "External contact   : BLOCKED"
          )

          print(
              "Irreversible action: BLOCKED"
          )

          print(
              "Automatic execution: BLOCKED"
          )

          print("")
          print(
              "Execution allowed  : FALSE"
          )

          PY

      - name: Commit NØX V18 knowledge
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v18_experiments.json

          if git diff --cached --quiet; then
            echo "No new V18 experiment designs to commit."
          else
            git commit -m "NØX V18 experimental design"
            git push
          fi
