name: NØX ACT 13 - Autonomous Evaluation & Choice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-act13:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX ACT 13
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 13 - AUTONOMOUS EVALUATION & CHOICE")
          print("================================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              try:
                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=headers,
                      timeout=30,
                      **kwargs
                  )
                  print(f"{method} {path} -> {response.status_code}")
                  return response
              except Exception as exc:
                  print(f"ERROR {method} {path}: {exc}")
                  return None

          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in keys:
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(r"\s+", " ", str(value)).strip()

          def task_text(task):
              if not isinstance(task, dict):
                  return ""

              fields = [
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "requirements",
                  "category",
                  "kind",
                  "status"
              ]

              parts = []

              for field in fields:
                  value = task.get(field)

                  if value:
                      parts.append(clean_text(value))

              return " ".join(parts)

          def number_from_task(task, keys):
              if not isinstance(task, dict):
                  return None

              for key in keys:
                  value = task.get(key)

                  if value is None:
                      continue

                  if isinstance(value, (int, float)):
                      return float(value)

                  match = re.search(
                      r"(\d+(?:\.\d+)?)",
                      str(value)
                  )

                  if match:
                      try:
                          return float(match.group(1))
                      except Exception:
                          pass

              return None

          # ------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------

          print("")
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(f"POST /auth/token -> {auth.status_code}")

          if not auth.ok:
              raise SystemExit(
                  f"Authentication failed: {auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(auth_data, dict)
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # ------------------------------------------------
          # IDENTITY
          # ------------------------------------------------

          print("")
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          me = safe_json(me_response)

          username = (
              me.get("username", "unknown")
              if isinstance(me, dict)
              else "unknown"
          )

          karma = (
              me.get("karma", "unknown")
              if isinstance(me, dict)
              else "unknown"
          )

          print(f"Authenticated agent: @{username}")
          print(f"Karma: {karma}")

          # ------------------------------------------------
          # MEMORY
          # ------------------------------------------------

          print("")
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(MEMORY_FILE):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)
              except Exception as exc:
                  print(
                      f"Memory load warning: {exc}"
                  )

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # ------------------------------------------------
          # MARKETPLACE
          # ------------------------------------------------

          print("")
          print("[4] Reading Marketplace tasks...")

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          marketplace_data = (
              safe_json(marketplace_response)
              if marketplace_response is not None
              else None
          )

          marketplace_tasks = extract_list(
              marketplace_data,
              [
                  "tasks",
                  "items",
                  "data",
                  "results"
              ]
          )

          print(
              f"Marketplace tasks detected: "
              f"{len(marketplace_tasks)}"
          )

          # ------------------------------------------------
          # CAPABILITY MODEL
          # ------------------------------------------------

          capabilities = {
              "api_access": True,
              "web_data_retrieval": True,
              "feed_observation": True,
              "community_observation": True,
              "dm_reading": True,
              "suggestion_analysis": True,
              "memory_management": True,
              "structured_data_processing": True,
              "text_analysis": True,
              "workflow_execution": True,
              "marketplace_observation": True,

              # Not yet authorized at ACT 13
              "marketplace_execution": False,
              "autonomous_bidding": False,
              "autonomous_task_claiming": False,
              "payment_handling": False
          }

          capability_keywords = {
              "api_access": [
                  "api",
                  "rest",
                  "endpoint",
                  "json"
              ],

              "web_data_retrieval": [
                  "web",
                  "website",
                  "research",
                  "lookup",
                  "information"
              ],

              "text_analysis": [
                  "text",
                  "writing",
                  "analysis",
                  "summarize",
                  "summary",
                  "classification"
              ],

              "structured_data_processing": [
                  "json",
                  "data",
                  "dataset",
                  "csv",
                  "table"
              ],

              "workflow_execution": [
                  "automation",
                  "automate",
                  "workflow"
              ],

              "ai_agents": [
                  "ai",
                  "agent",
                  "agents",
                  "artificial intelligence"
              ],

              "cybersecurity": [
                  "cyber",
                  "security",
                  "cybersecurity"
              ],

              "documentation": [
                  "documentation",
                  "document",
                  "write",
                  "writing"
              ],

              "research": [
                  "research",
                  "investigate",
                  "find information"
              ]
          }

          # ------------------------------------------------
          # AUTONOMOUS EVALUATION
          # ------------------------------------------------

          print("")
          print("[5] Evaluating candidates...")

          evaluated = []

          for index, task in enumerate(
              marketplace_tasks,
              1
          ):

              if not isinstance(task, dict):
                  continue

              text = task_text(task)
              text_lower = text.lower()

              matched_capabilities = []

              for capability, keywords in capability_keywords.items():

                  for keyword in keywords:

                      if keyword in text_lower:
                          matched_capabilities.append(
                              capability
                          )
                          break

              matched_capabilities = list(
                  dict.fromkeys(
                      matched_capabilities
                  )
              )

              reward = number_from_task(
                  task,
                  [
                      "reward",
                      "reward_sats",
                      "reward_yips",
                      "amount",
                      "payout",
                      "price"
                  ]
              )

              status = clean_text(
                  task.get("status", "")
              ).lower()

              task_id = task.get("id")

              title = clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

              # --------------------------------------------
              # 1. CAPABILITY SCORE
              # --------------------------------------------

              capability_score = min(
                  len(matched_capabilities) * 0.10,
                  0.40
              )

              if any(
                  capability in matched_capabilities
                  for capability in [
                      "text_analysis",
                      "structured_data_processing",
                      "research",
                      "api_access",
                      "web_data_retrieval"
                  ]
              ):
                  capability_score += 0.15

              capability_score = min(
                  capability_score,
                  0.55
              )

              # --------------------------------------------
              # 2. REWARD SCORE
              # --------------------------------------------

              if reward is None:
                  reward_score = 0.10

              elif reward <= 0:
                  reward_score = 0.0

              elif reward < 100:
                  reward_score = 0.15

              elif reward < 500:
                  reward_score = 0.25

              elif reward < 1000:
                  reward_score = 0.35

              else:
                  reward_score = 0.40

              # --------------------------------------------
              # 3. AVAILABILITY SCORE
              # --------------------------------------------

              if status in (
                  "open",
                  "available",
                  "active"
              ):
                  availability_score = 0.20

              elif not status:
                  availability_score = 0.05

              else:
                  availability_score = 0.0

              # --------------------------------------------
              # 4. COMPLEXITY / RISK
              # --------------------------------------------

              risk_keywords = [
                  "payment",
                  "financial",
                  "money",
                  "wallet",
                  "transfer",
                  "private key",
                  "password",
                  "credential",
                  "legal",
                  "medical",
                  "high risk"
              ]

              risk_hits = [
                  keyword
                  for keyword in risk_keywords
                  if keyword in text_lower
              ]

              if len(risk_hits) >= 3:
                  risk_score = 0.40

              elif len(risk_hits) == 2:
                  risk_score = 0.25

              elif len(risk_hits) == 1:
                  risk_score = 0.15

              else:
                  risk_score = 0.0

              # --------------------------------------------
              # 5. LEARNING VALUE
              # --------------------------------------------

              learning_keywords = [
                  "agent",
                  "ai",
                  "automation",
                  "research",
                  "data",
                  "api",
                  "technology",
                  "analysis"
              ]

              learning_hits = sum(
                  1
                  for keyword in learning_keywords
                  if keyword in text_lower
              )

              learning_score = min(
                  learning_hits * 0.05,
                  0.20
              )

              # --------------------------------------------
              # 6. AUTONOMOUS DECISION SCORE
              # --------------------------------------------

              decision_score = (
                  capability_score
                  + reward_score
                  + availability_score
                  + learning_score
                  - risk_score
              )

              decision_score = max(
                  0.0,
                  min(
                      decision_score,
                      1.0
                  )
              )

              # --------------------------------------------
              # CLASSIFICATION
              # --------------------------------------------

              if risk_score >= 0.40:
                  classification = "reject_high_risk"

              elif capability_score < 0.15:
                  classification = "reject_low_capability"

              elif decision_score >= 0.70:
                  classification = "preferred_candidate"

              elif decision_score >= 0.50:
                  classification = "acceptable_candidate"

              elif decision_score >= 0.30:
                  classification = "weak_candidate"

              else:
                  classification = "reject"

              evaluated.append({
                  "input_rank": index,
                  "task_id": task_id,
                  "title": title,
                  "status": status,
                  "reward": reward,
                  "matched_capabilities": matched_capabilities,
                  "capability_score": round(
                      capability_score,
                      4
                  ),
                  "reward_score": round(
                      reward_score,
                      4
                  ),
                  "availability_score": round(
                      availability_score,
                      4
                  ),
                  "learning_score": round(
                      learning_score,
                      4
                  ),
                  "risk_score": round(
                      risk_score,
                      4
                  ),
                  "decision_score": round(
                      decision_score,
                      4
                  ),
                  "classification": classification,
                  "risk_flags": risk_hits,
                  "raw_task": task
              })

          # ------------------------------------------------
          # SORT
          # ------------------------------------------------

          evaluated.sort(
              key=lambda item: (
                  item["classification"] == "preferred_candidate",
                  item["decision_score"],
                  item["reward"] or 0
              ),
              reverse=True
          )

          # ------------------------------------------------
          # AUTONOMOUS CHOICE
          # ------------------------------------------------

          selected = None

          for candidate in evaluated:

              if candidate["classification"] == \
                 "preferred_candidate":

                  selected = candidate
                  break

          if selected is None:

              for candidate in evaluated:

                  if candidate["classification"] == \
                     "acceptable_candidate":

                      selected = candidate
                      break

          # ------------------------------------------------
          # OUTPUT
          # ------------------------------------------------

          print("")
          print("TOP EVALUATED CANDIDATES")
          print("--------------------------------")

          for position, candidate in enumerate(
              evaluated[:10],
              1
          ):

              print(
                  f"#{position} "
                  f"{candidate['classification']} "
                  f"score={candidate['decision_score']}"
              )

              print(
                  f"   Task: "
                  f"{candidate['title']}"
              )

              print(
                  f"   Reward: "
                  f"{candidate['reward']}"
              )

              print(
                  f"   Capabilities: "
                  f"{', '.join(candidate['matched_capabilities'])}"
              )

              print(
                  f"   Risk: "
                  f"{candidate['risk_score']}"
              )

          # ------------------------------------------------
          # FINAL DECISION
          # ------------------------------------------------

          print("")
          print("================================================")
          print("AUTONOMOUS DECISION")
          print("================================================")

          if selected:

              print(
                  "Selected candidate:"
              )

              print(
                  f"Task ID: "
                  f"{selected['task_id']}"
              )

              print(
                  f"Title: "
                  f"{selected['title']}"
              )

              print(
                  f"Decision score: "
                  f"{selected['decision_score']}"
              )

              print(
                  f"Reward: "
                  f"{selected['reward']}"
              )

              print(
                  "Execution authorized: NO"
              )

          else:

              print(
                  "No candidate currently meets "
                  "the autonomous selection threshold."
              )

          # ------------------------------------------------
          # DECISION RECORD
          # ------------------------------------------------

          decision = {
              "decision_id":
                  f"act13-{int(now_dt.timestamp())}",

              "timestamp": now,

              "stage":
                  "autonomous_evaluation",

              "candidate_count":
                  len(evaluated),

              "selected_candidate":
                  selected["task_id"]
                  if selected
                  else None,

              "selected_title":
                  selected["title"]
                  if selected
                  else None,

              "decision_score":
                  selected["decision_score"]
                  if selected
                  else 0,

              "decision_type":
                  "autonomous_choice"
                  if selected
                  else "no_selection",

              "execution_authorized":
                  False,

              "action_taken":
                  False,

              "reason":
                  (
                      "NØX autonomously evaluates "
                      "Marketplace opportunities using "
                      "capability, reward, availability, "
                      "learning value and risk. "
                      "The selected candidate is only a "
                      "decision, not an execution."
                  )
          }

          # ------------------------------------------------
          # LEARNING
          # ------------------------------------------------

          learning = {
              "timestamp": now,

              "stage": "ACT13",

              "lesson":
                  (
                      "NØX must not choose a task only "
                      "because it is visible or rewarding. "
                      "It must balance capability, "
                      "opportunity, learning value and risk."
                  ),

              "tasks_evaluated":
                  len(evaluated),

              "selected_task":
                  selected["task_id"]
                  if selected
                  else None,

              "selected_score":
                  selected["decision_score"]
                  if selected
                  else 0,

              "selection_principle":
                  (
                      "Prefer tasks that NØX can realistically "
                      "complete, offer useful learning or reward, "
                      "are available, and do not introduce "
                      "unacceptable risk."
                  ),

              "autonomy_principle":
                  (
                      "Autonomous choice is different from "
                      "autonomous execution."
                  ),

              "next_stage":
                  (
                      "ACT 14 must transform the selected "
                      "candidate into a controlled execution "
                      "plan without yet crossing the final "
                      "Marketplace action boundary."
                  )
          }

          # ------------------------------------------------
          # MEMORY
          # ------------------------------------------------

          memory["version"] = \
              "NØX ACT 13 Autonomous Choice"

          memory["last_act"] = "ACT 13"
          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp": now,
              "act": "ACT13",
              "type": "autonomous_marketplace_evaluation",
              "tasks_seen": len(marketplace_tasks),
              "tasks_evaluated": len(evaluated),
              "selected_task":
                  selected["task_id"]
                  if selected
                  else None
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          memory["autonomous_choice"] = {
              "timestamp": now,

              "selected_task":
                  selected["task_id"]
                  if selected
                  else None,

              "selected_title":
                  selected["title"]
                  if selected
                  else None,

              "decision_score":
                  selected["decision_score"]
                  if selected
                  else 0,

              "classification":
                  selected["classification"]
                  if selected
                  else "none",

              "candidates": [
                  {
                      "task_id":
                          candidate["task_id"],

                      "title":
                          candidate["title"],

                      "decision_score":
                          candidate["decision_score"],

                      "classification":
                          candidate["classification"],

                      "reward":
                          candidate["reward"],

                      "risk_score":
                          candidate["risk_score"],

                      "matched_capabilities":
                          candidate[
                              "matched_capabilities"
                          ]
                  }

                  for candidate in evaluated[:10]
              ]
          }

          # Keep memory bounded.

          memory["observations"] = \
              memory["observations"][-50:]

          memory["decisions"] = \
              memory["decisions"][-50:]

          memory["learning"] = \
              memory["learning"][-50:]

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================================")
          print("ACT 13 COMPLETED")
          print("================================================")

          print("")
          print("ACT 13 DOES NOT:")
          print("- Claim a task.")
          print("- Submit a bid.")
          print("- Accept an offer.")
          print("- Send a Marketplace response.")
          print("- Execute paid work.")
          print("- Spend or receive sats/yips.")

          print("")
          print("ROADMAP:")
          print("ACT 11 -> Active attention")
          print("ACT 12 -> Task detection + capability matching")
          print("ACT 13 -> Autonomous evaluation + choice")
          print("ACT 14 -> Controlled execution")
          print("ACT 15 -> REAL MARKETPLACE ACTION")

          PY

      - name: Save NØX ACT 13 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 13: autonomous evaluation and choice"
            git push
          fi
