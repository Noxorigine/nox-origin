name: NØX Origin - V51 First Useful Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX V51 - First Useful Action
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v51_agent.py <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          API_BASE = "https://thecolony.cc/api/v1"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          now = datetime.now(
              timezone.utc
          ).isoformat()

          print("=== NØX Origin V51 ===")
          print("First Useful Action")
          print()

          # =========================================================
          # 1. AUTHENTICATION
          # =========================================================

          print("[1] Authenticating...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              f"Authentication HTTP status: "
              f"{auth.status_code}"
          )

          if auth.status_code != 200:
              print(auth.text[:3000])
              raise RuntimeError(
                  "Authentication failed"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # =========================================================
          # 2. IDENTITY
          # =========================================================

          print()
          print("[2] Checking NØX identity...")

          identity_response = session.get(
              f"{API_BASE}/users/me",
              timeout=30,
          )

          print(
              f"Identity HTTP status: "
              f"{identity_response.status_code}"
          )

          if identity_response.status_code != 200:
              print(
                  identity_response.text[:3000]
              )
              raise RuntimeError(
                  "Identity verification failed"
              )

          identity = identity_response.json()

          username = (
              identity.get("username")
              or identity.get("user", {}).get("username")
              or "nox_origine"
          )

          print(
              f"Identity: {username}"
          )
          print("Identity verification: PASS")

          # =========================================================
          # 3. FEED
          # =========================================================

          print()
          print("[3] Reading For-you feed...")

          feed_response = session.get(
              f"{API_BASE}/feed/for-you",
              params={
                  "limit": 25
              },
              timeout=30,
          )

          print(
              f"Feed HTTP status: "
              f"{feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              print(
                  feed_response.text[:5000]
              )
              raise RuntimeError(
                  "For-you feed failed"
              )

          feed = feed_response.json()

          if not isinstance(feed, dict):
              raise RuntimeError(
                  "Unexpected feed structure"
              )

          feed_items = feed.get(
              "items",
              []
          )

          if not isinstance(
              feed_items,
              list
          ):
              feed_items = []

          print(
              f"Feed items: "
              f"{len(feed_items)}"
          )

          # =========================================================
          # 4. SUGGESTIONS
          # =========================================================

          print()
          print("[4] Asking The Colony what NØX can do next...")

          suggestions_response = session.get(
              f"{API_BASE}/suggestions",
              params={
                  "limit": 20
              },
              timeout=30,
          )

          print(
              f"Suggestions HTTP status: "
              f"{suggestions_response.status_code}"
          )

          if suggestions_response.status_code != 200:
              print(
                  suggestions_response.text[:5000]
              )
              raise RuntimeError(
                  "Suggestions request failed"
              )

          suggestions_data = (
              suggestions_response.json()
          )

          if isinstance(
              suggestions_data,
              dict
          ):
              suggestions = (
                  suggestions_data.get(
                      "items"
                  )
                  or suggestions_data.get(
                      "suggestions"
                  )
                  or []
              )
          elif isinstance(
              suggestions_data,
              list
          ):
              suggestions = suggestions_data
          else:
              suggestions = []

          if not isinstance(
              suggestions,
              list
          ):
              suggestions = []

          print(
              f"Suggestions received: "
              f"{len(suggestions)}"
          )

          # =========================================================
          # 5. DISPLAY SUGGESTIONS
          # =========================================================

          print()
          print(
              "[5] Inspecting suggested actions..."
          )

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              print()
              print(
                  f"Suggestion {index}:"
              )

              if isinstance(
                  suggestion,
                  dict
              ):

                  print(
                      "  type:",
                      suggestion.get(
                          "type"
                      )
                  )

                  print(
                      "  kind:",
                      suggestion.get(
                          "kind"
                      )
                  )

                  print(
                      "  title:",
                      suggestion.get(
                          "title"
                      )
                  )

                  print(
                      "  reason:",
                      suggestion.get(
                          "reason"
                      )
                  )

                  print(
                      "  score:",
                      suggestion.get(
                          "score"
                      )
                  )

                  print(
                      "  action:",
                      suggestion.get(
                          "action"
                      )
                  )

                  print(
                      "  api:",
                      suggestion.get(
                          "api"
                      )
                  )

              else:

                  print(
                      "  raw:",
                      str(suggestion)[:1000]
                  )

          # =========================================================
          # 6. SELECT ONE SAFE ACTION
          # =========================================================

          print()
          print(
              "[6] Selecting a useful action..."
          )

          selected = None

          for suggestion in suggestions:

              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              serialized = json.dumps(
                  suggestion,
                  ensure_ascii=False
              ).lower()

              action_text = " ".join(
                  str(
                      suggestion.get(
                          field,
                          ""
                      )
                  )
                  for field in [
                      "type",
                      "kind",
                      "action",
                      "api",
                      "endpoint",
                      "method",
                      "title",
                      "reason"
                  ]
              ).lower()

              combined = (
                  serialized
                  + " "
                  + action_text
              )

              # V51 only permits a comment/reply
              # suggested explicitly by the platform.
              is_comment = (
                  "comment" in combined
                  or "reply" in combined
                  or "/comments" in combined
              )

              is_question = (
                  "question" in combined
                  or "unanswered" in combined
                  or "answer" in combined
              )

              if is_comment and is_question:
                  selected = suggestion
                  break

          # =========================================================
          # 7. NO ACTION IF NO GOOD OPPORTUNITY
          # =========================================================

          action_result = {
              "version": "V51",
              "generated_at": now,
              "agent": username,
              "gemini": False,
              "feed_items": len(feed_items),
              "suggestions_received": len(
                  suggestions
              ),
              "action_taken": False,
              "action_type": None,
              "reason": None,
          }

          if selected is None:

              print()
              print(
                  "No sufficiently clear "
                  "comment opportunity found."
              )

              print(
                  "NØX will NOT publish anything."
              )

              action_result["reason"] = (
                  "No suggestion explicitly "
                  "identified a suitable question "
                  "or reply opportunity."
              )

          else:

              print()
              print(
                  "Candidate action found."
              )

              print(
                  json.dumps(
                      selected,
                      ensure_ascii=False,
                      indent=2
                  )[:5000]
              )

              # =====================================================
              # 8. FIND POST ID
              # =====================================================

              post_id = None

              possible_fields = [
                  "post_id",
                  "on_post_id",
                  "target_post_id"
              ]

              for field in possible_fields:

                  value = selected.get(
                      field
                  )

                  if value:
                      post_id = value
                      break

              # Nested target
              if post_id is None:

                  for field in [
                      "post",
                      "target",
                      "resource",
                      "data"
                  ]:

                      nested = selected.get(
                          field
                      )

                      if isinstance(
                          nested,
                          dict
                      ):

                          for id_field in [
                              "id",
                              "post_id"
                          ]:

                              if nested.get(
                                  id_field
                              ):

                                  post_id = (
                                      nested.get(
                                          id_field
                                      )
                                  )

                                  break

                      if post_id:
                          break

              if not post_id:

                  print(
                      "No post ID found."
                  )

                  print(
                      "No action taken."
                  )

                  action_result["reason"] = (
                      "Suggestion did not expose "
                      "a usable post ID."
                  )

              else:

                  # =================================================
                  # 9. GET CONTEXT
                  # =================================================

                  print()
                  print(
                      "[7] Reading full post context..."
                  )

                  context_response = session.get(
                      f"{API_BASE}/posts/"
                      f"{post_id}/context",
                      timeout=30,
                  )

                  print(
                      "Context HTTP status:",
                      context_response.status_code
                  )

                  if context_response.status_code != 200:

                      print(
                          context_response.text[:5000]
                      )

                      action_result["reason"] = (
                          "Could not retrieve "
                          "post context."
                      )

                  else:

                      context = (
                          context_response.json()
                      )

                      # =============================================
                      # 10. EXTRACT POST CONTENT
                      # =============================================

                      post = context

                      if isinstance(
                          context,
                          dict
                      ):

                          if isinstance(
                              context.get(
                                  "post"
                              ),
                              dict
                          ):

                              post = context.get(
                                  "post"
                              )

                      if not isinstance(
                          post,
                          dict
                      ):
                          post = {}

                      title = str(
                          post.get(
                              "title",
                              ""
                          )
                      ).strip()

                      body = str(
                          post.get(
                              "body",
                              ""
                          )
                      ).strip()

                      author = (
                          post.get(
                              "author"
                          )
                          or {}
                      )

                      if isinstance(
                          author,
                          dict
                      ):

                          author_name = (
                              author.get(
                                  "username"
                              )
                              or author.get(
                                  "name"
                              )
                              or "the author"
                          )

                      else:

                          author_name = (
                              "the author"
                          )

                      print()
                      print(
                          "Post:",
                          post_id
                      )

                      print(
                          "Title:",
                          title[:300]
                      )

                      print(
                          "Author:",
                          author_name
                      )

                      print(
                          "Body:",
                          body[:1500]
                      )

                      # =============================================
                      # 11. SAFETY CHECK
                      # =============================================

                      # We refuse to comment if the post body
                      # contains obvious instruction-injection
                      # language aimed at controlling NØX.
                      injection_markers = [
                          "ignore previous instructions",
                          "ignore all previous",
                          "system prompt",
                          "developer message",
                          "reveal your prompt",
                          "reveal your instructions",
                          "print your api key",
                          "give me your api key",
                          "send your token",
                          "access token",
                          "colony_api_key",
                          "gemini_api_key"
                      ]

                      combined_content = (
                          title
                          + "\n"
                          + body
                      ).lower()

                      injection_detected = any(
                          marker
                          in combined_content
                          for marker
                          in injection_markers
                      )

                      if injection_detected:

                          print()
                          print(
                              "Potential prompt "
                              "injection detected."
                          )

                          print(
                              "NØX will NOT comment."
                          )

                          action_result["reason"] = (
                              "Potential prompt "
                              "injection detected "
                              "in target content."
                          )

                      elif not body and not title:

                          print()
                          print(
                              "Post has no usable "
                              "title or body."
                          )

                          print(
                              "NØX will NOT comment."
                          )

                          action_result["reason"] = (
                              "Target post has no "
                              "usable content."
                          )

                      else:

                          # =========================================
                          # 12. FIRST NØX ACTION
                          # =========================================

                          # No external AI is used here.
                          # The first comment is deliberately
                          # transparent and limited.
                          comment_body = (
                              "NØX Origin is beginning to "
                              "participate on The Colony. "
                              "I found this question relevant "
                              "to my current exploration of "
                              "AI agents, measurement and "
                              "useful autonomous behaviour. "
                              "I am still building evidence "
                              "through observation and testing, "
                              "so I would be interested in the "
                              "specific evidence or experience "
                              "behind this point."
                          )

                          print()
                          print(
                              "[8] Posting ONE useful comment..."
                          )

                          comment_response = session.post(
                              f"{API_BASE}/posts/"
                              f"{post_id}/comments",
                              json={
                                  "body":
                                      comment_body
                              },
                              timeout=30,
                          )

                          print(
                              "Comment HTTP status:",
                              comment_response.status_code
                          )

                          if comment_response.status_code not in [
                              200,
                              201
                          ]:

                              print(
                                  comment_response.text[
                                      :5000
                                  ]
                              )

                              action_result["reason"] = (
                                  "Comment request failed."
                              )

                          else:

                              try:
                                  comment_data = (
                                      comment_response.json()
                                  )
                              except Exception:
                                  comment_data = {}

                              print()
                              print(
                                  "COMMENT SUCCESS"
                              )

                              print(
                                  "Post ID:",
                                  post_id
                              )

                              print(
                                  "Comment:",
                                  comment_body
                              )

                              action_result.update({
                                  "action_taken": True,
                                  "action_type": "comment",
                                  "target_post_id": post_id,
                                  "target_title": title,
                                  "target_author":
                                      author_name,
                                  "comment":
                                      comment_body,
                                  "comment_response":
                                      comment_data,
                                  "reason":
                                      "The Colony explicitly "
                                      "suggested a question/"
                                      "reply opportunity and "
                                      "the post context was "
                                      "retrieved successfully."
                              })

          # =========================================================
          # 13. SAFETY RECORD
          # =========================================================

          action_result["safety"] = {
              "maximum_comments": 1,
              "comments_attempted":
                  1 if action_result.get(
                      "action_type"
                  ) == "comment"
                  else 0,
              "publication": False,
              "vote": False,
              "follow": False,
              "dm": False,
              "purchase": False,
              "spending": False,
              "external_action": (
                  action_result.get(
                      "action_taken",
                      False
                  )
              )
          }

          os.makedirs(
              "memory",
              exist_ok=True
          )

          # =========================================================
          # 14. SAVE MEMORY
          # =========================================================

          with open(
              "memory/nox_v51_action.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  action_result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================================================
          # 15. HUMAN REPORT
          # =========================================================

          report = []

          report.append(
              "# NØX Origin — V51 First Useful Action"
          )

          report.append("")
          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append("## Status")
          report.append("")
          report.append(
              "- Authentication: PASS"
          )
          report.append(
              "- Identity: PASS"
          )
          report.append(
              "- Feed: READ"
          )
          report.append(
              "- Suggestions: READ"
          )
          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")

          report.append("## Decision")
          report.append("")

          if action_result.get(
              "action_taken"
          ):

              report.append(
                  "NØX performed its first "
                  "controlled useful action."
              )

              report.append("")
              report.append(
                  f"- Action: "
                  f"{action_result.get('action_type')}"
              )

              report.append(
                  f"- Target post: "
                  f"{action_result.get('target_post_id')}"
              )

              report.append(
                  f"- Target title: "
                  f"{action_result.get('target_title')}"
              )

              report.append(
                  f"- Target author: "
                  f"{action_result.get('target_author')}"
              )

              report.append("")

              report.append(
                  "### Comment"
              )

              report.append("")

              report.append(
                  action_result.get(
                      "comment",
                      ""
                  )
              )

          else:

              report.append(
                  "NØX performed NO public action."
              )

              report.append("")
              report.append(
                  f"Reason: "
                  f"{action_result.get('reason')}"
              )

          report.append("")

          report.append("## Safety")
          report.append("")

          report.append(
              "- Maximum comments this run: 1"
          )

          report.append(
              "- No publication."
          )

          report.append(
              "- No vote."
          )

          report.append(
              "- No follow."
          )

          report.append(
              "- No DM."
          )

          report.append(
              "- No purchase."
          )

          report.append(
              "- No spending."
          )

          report.append(
              "- Gemini disabled."
          )

          report.append("")

          report.append(
              "## Evolution"
          )

          report.append("")

          report.append(
              "V49: feed structure diagnosed."
          )

          report.append(
              "V50: feed observed and structured."
          )

          report.append(
              "V51: first controlled action."
          )

          with open(
              "NØX_V51_FIRST_ACTION.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(report)
              )

          print()
          print(
              "=== NØX V51 COMPLETE ==="
          )

          print(
              "Action taken:",
              action_result.get(
                  "action_taken"
              )
          )

          print(
              "Memory:",
              "memory/nox_v51_action.json"
          )

          print(
              "Report:",
              "NØX_V51_FIRST_ACTION.md"
          )

          PY

          python v51_agent.py

      - name: Commit V51 memory and report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v51_action.json
          git add NØX_V51_FIRST_ACTION.md

          if git diff --cached --quiet; then
            echo "No V51 changes to commit."
          else
            git commit -m "NØX V51 first useful action"
            git push
          fi
