name: NØX ACT51 - Autonomous Initiative Generation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act51:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate autonomous initiative
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          print("=" * 72)
          print("NØX ACT51 - AUTONOMOUS INITIATIVE GENERATION")
          print("=" * 72)
          print()
          print("Purpose:")
          print("  Transform a supported ACT50 decision into a traceable")
          print("  autonomous initiative proposal.")
          print()
          print("Safety:")
          print("  - No Gemini")
          print("  - No external AI")
          print("  - No external API")
          print("  - No marketplace action")
          print("  - No Colony creation")
          print("  - No payments")
          print("  - No spending")
          print("  - Proposal only")
          print()

          MEMORY = Path("memory")
          OUT_JSON = MEMORY / "nox_act_51_autonomous_initiative_generation.json"
          OUT_MD = MEMORY / "nox_act_51_autonomous_initiative_generation.md"

          ACT50_FILE = MEMORY / "nox_act_50_cognitive_decision_loop.json"

          def load_json(path, label):
              if not path.exists():
                  raise RuntimeError(f"Missing required file: {path}")

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise RuntimeError(f"Invalid JSON in {path}: {exc}")

              if not isinstance(data, dict):
                  raise RuntimeError(f"Expected JSON object in {path}")

              print(f"[OK] Loaded {label}: {path}")
              return data

          # ------------------------------------------------------------
          # 1. Load ACT50
          # ------------------------------------------------------------

          act50 = load_json(
              ACT50_FILE,
              "ACT50 cognitive decision"
          )

          # ACT50 memory uses the canonical identity string "ACT50".
          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  "ACT50 identity check failed: "
                  f"expected act='ACT50', got {act50.get('act')!r}"
              )

          print("[OK] ACT50 identity verified.")

          # ------------------------------------------------------------
          # 2. Read explicit ACT50 state
          # ------------------------------------------------------------

          decision_state = act50.get("decision_state")

          if decision_state is None:
              decision_state = act50.get("state")

          action = act50.get("action")

          if action is None:
              action = act50.get("selected_plan")

          print()
          print(f"ACT50 decision state: {decision_state!r}")
          print(f"ACT50 action / plan: {action!r}")

          # ------------------------------------------------------------
          # 3. No supported decision = no initiative
          # ------------------------------------------------------------

          if decision_state != "DECISION_SUPPORTED":
              status = "WAITING_FOR_SUPPORTED_DECISION"

              reason = (
                  "ACT50 did not provide a DECISION_SUPPORTED state. "
                  "ACT51 must not invent an initiative."
              )

              result = {
                  "act": "ACT51",
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "act": "ACT50",
                      "decision_state": decision_state,
                      "action": action,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                  },
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              }

              MEMORY.mkdir(parents=True, exist_ok=True)

              OUT_JSON.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              OUT_MD.write_text(
                  "# NØX ACT51 — Autonomous Initiative Generation\n\n"
                  f"**Status:** {status}\n\n"
                  "No initiative was generated because ACT50 did not "
                  "provide a defensible decision.\n\n"
                  f"**Decision state:** `{decision_state}`\n\n"
                  f"**Reason:** {reason}\n",
                  encoding="utf-8"
              )

              print()
              print("[RESULT] No initiative generated.")
              print(f"[RESULT] Reason: {reason}")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # 4. Supported decision requires an explicit plan
          # ------------------------------------------------------------

          if not isinstance(action, str) or not action.strip():
              status = "WAITING_FOR_EXPLICIT_PLAN"

              reason = (
                  "ACT50 is supported but did not expose an explicit "
                  "action or selected plan."
              )

              result = {
                  "act": "ACT51",
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "act": "ACT50",
                      "decision_state": decision_state,
                      "action": action,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                  },
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              }

              MEMORY.mkdir(parents=True, exist_ok=True)

              OUT_JSON.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              OUT_MD.write_text(
                  "# NØX ACT51 — Autonomous Initiative Generation\n\n"
                  f"**Status:** {status}\n\n"
                  "ACT50 permitted advancement, but no explicit plan "
                  "was available. ACT51 therefore refuses to invent one.\n",
                  encoding="utf-8"
              )

              print()
              print("[RESULT] No initiative generated.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # 5. Deterministic initiative classification
          # ------------------------------------------------------------

          normalized = action.strip().lower()

          if any(term in normalized for term in (
              "create colony",
              "create a colony",
              "création de colony",
              "créer une colony",
              "creer une colony",
              "new colony",
              "new colony space",
          )):
              initiative_type = "CREATE_COLONY"

          elif any(term in normalized for term in (
              "research",
              "research plan",
              "investigate",
              "investigation",
              "recherche",
              "approfondir",
              "étudier",
              "etudier",
          )):
              initiative_type = "RESEARCH"

          elif any(term in normalized for term in (
              "collaborat",
              "collaboration",
              "work request",
              "agent-collab",
          )):
              initiative_type = "COLLABORATION"

          elif any(term in normalized for term in (
              "learn",
              "learning",
              "knowledge",
              "apprentissage",
              "connaissance",
          )):
              initiative_type = "KNOWLEDGE_DEVELOPMENT"

          else:
              initiative_type = "AUTONOMOUS_INITIATIVE"

          # ------------------------------------------------------------
          # 6. Build the initiative
          # ------------------------------------------------------------

          initiative_id = (
              "nox-act51-"
              + datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          )

          initiative = {
              "id": initiative_id,
              "type": initiative_type,
              "title": "Initiative derived from ACT50 supported plan",
              "objective": action.strip(),
              "source": {
                  "act": "ACT50",
                  "decision_state": decision_state,
                  "selected_plan": action.strip(),
              },
              "status": "PROPOSED",
              "execution_allowed": False,
              "external_action_required": initiative_type == "CREATE_COLONY",
          }

          # ------------------------------------------------------------
          # 7. Final ACT51 result
          # ------------------------------------------------------------

          result = {
              "act": "ACT51",
              "name": "Autonomous Initiative Generation",
              "status": "INITIATIVE_PROPOSED",
              "initiative_generated": True,
              "initiative": initiative,
              "source_layers": {
                  "act50": {
                      "available": True,
                      "decision_state": decision_state,
                      "action_present": True,
                  }
              },
              "principles": [
                  "initiative must originate from a supported ACT50 decision",
                  "ACT51 must not invent missing evidence",
                  "the original supported plan must remain traceable",
                  "initiative generation is not execution",
                  "external actions remain disabled",
                  "ACT52 is responsible for execution",
              ],
              "safety": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "colony_created": False,
                  "marketplace_action": False,
                  "payment": False,
                  "spending": False,
              },
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
          }

          # ------------------------------------------------------------
          # 8. Write memory
          # ------------------------------------------------------------

          MEMORY.mkdir(parents=True, exist_ok=True)

          OUT_JSON.write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          md = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **INITIATIVE_PROPOSED**

          ## Source decision

          - ACT: `ACT50`
          - Decision state: `{decision_state}`
          - Selected plan:

          > {action.strip()}

          ## Initiative

          - ID: `{initiative_id}`
          - Type: `{initiative_type}`
          - Status: `PROPOSED`
          - Execution allowed: `False`

          ## Objective

          > {action.strip()}

          ## Cognitive chain

          ACT40 → ACT41 → ACT42 → ACT43 → ACT44 → ACT45 → ACT46 →
          ACT47 → ACT48 → ACT49 → ACT50 → **ACT51**

          ACT50 provides the defensible decision.

          ACT51 converts that decision into an initiative candidate.

          ACT52 will be responsible for future execution.

          ## Safety

          - Gemini: `false`
          - External AI: `false`
          - External API: `false`
          - Colony created: `false`
          - Marketplace action: `false`
          - Payment: `false`
          - Spending: `false`

          ## Principle

          **ACT50 decides. ACT51 proposes. ACT52 executes.**
          """

          OUT_MD.write_text(md, encoding="utf-8")

          print()
          print("=" * 72)
          print("ACT51 RESULT")
          print("=" * 72)
          print("Status:              INITIATIVE_PROPOSED")
          print(f"Initiative type:     {initiative_type}")
          print(f"Initiative ID:       {initiative_id}")
          print(f"Objective:           {action.strip()}")
          print("Execution allowed:  False")
          print()
          print("Memory:")
          print(f"  {OUT_JSON}")
          print(f"  {OUT_MD}")
          print()
          print("ACT51 completed without external action.")

          PY

      - name: Commit ACT51 memory
        run: |
          git config user.name "NØX"
          git config user.email "noreply@nox-origin.local"

          git fetch origin main
          git rebase origin/main

          git add memory/nox_act_51_autonomous_initiative_generation.json
          git add memory/nox_act_51_autonomous_initiative_generation.md

          if git diff --cached --quiet; then
            echo "No ACT51 memory changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT51 autonomous initiative generation"
          git push origin HEAD:main
