name: NØX ACT51 - Autonomous Initiative Generation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act51:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate autonomous initiative
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          print("=" * 72)
          print("NØX ACT51 - AUTONOMOUS INITIATIVE GENERATION")
          print("=" * 72)
          print()
          print("Purpose:")
          print("  Transform a supported ACT50 decision into a traceable")
          print("  autonomous initiative proposal.")
          print()
          print("Safety:")
          print("  - No Gemini")
          print("  - No external AI")
          print("  - No external API")
          print("  - No marketplace action")
          print("  - No Colony creation")
          print("  - No payments")
          print("  - No spending")
          print("  - Proposal only")
          print()

          MEMORY = Path("memory")
          OUT_JSON = MEMORY / "nox_act_51_autonomous_initiative_generation.json"
          OUT_MD = MEMORY / "nox_act_51_autonomous_initiative_generation.md"

          REQUIRED = {
              50: MEMORY / "nox_act_50_cognitive_decision_loop.json",
          }

          SUPPORTING = {
              48: MEMORY / "nox_act_48_strategy_planning.json",
              49: MEMORY / "nox_act_49_uncertainty_management.json",
          }

          def load_json(path, label, required=True):
              if not path.exists():
                  if required:
                      raise RuntimeError(f"Missing required file: {path}")
                  print(f"[INFO] Optional file missing: {path}")
                  return None

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise RuntimeError(f"Invalid JSON in {path}: {exc}")

              if not isinstance(data, dict):
                  raise RuntimeError(f"Expected JSON object in {path}")

              print(f"[OK] Loaded {label}: {path}")
              return data

          # ------------------------------------------------------------
          # 1. Load ACT50 - the authoritative cognitive decision gate
          # ------------------------------------------------------------

          act50 = load_json(
              REQUIRED[50],
              "ACT50 cognitive decision",
              required=True
          )

          if act50.get("act") != 50:
              raise RuntimeError(
                  "ACT50 identity check failed: "
                  f"expected act=50, got {act50.get('act')!r}"
              )

          # ------------------------------------------------------------
          # 2. Load supporting planning / uncertainty evidence
          # ------------------------------------------------------------

          act48 = load_json(
              SUPPORTING[48],
              "ACT48 strategy planning",
              required=False
          )

          act49 = load_json(
              SUPPORTING[49],
              "ACT49 uncertainty management",
              required=False
          )

          # ------------------------------------------------------------
          # 3. Read explicit ACT50 decision state
          # ------------------------------------------------------------

          decision_state = act50.get("decision_state")
          action = act50.get("action")

          if decision_state is None:
              decision_state = act50.get("state")

          if action is None:
              action = act50.get("selected_plan")

          print()
          print(f"ACT50 decision state: {decision_state!r}")
          print(f"ACT50 action / plan: {action!r}")

          # ------------------------------------------------------------
          # 4. Refuse initiative generation without a defensible decision
          # ------------------------------------------------------------

          supported_states = {
              "DECISION_SUPPORTED",
              "SUPPORTED",
              "DECISION_SUPPORTED_BY_COGNITIVE_CHAIN",
          }

          if decision_state not in supported_states:
              status = "WAITING_FOR_SUPPORTED_DECISION"
              reason = (
                  "ACT50 did not provide a supported decision. "
                  "ACT51 must not invent an initiative."
              )

              result = {
                  "act": 51,
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "decision_state": decision_state,
                      "action": action,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                  },
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              }

              MEMORY.mkdir(parents=True, exist_ok=True)
              OUT_JSON.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              OUT_MD.write_text(
                  "# NØX ACT51 — Autonomous Initiative Generation\n\n"
                  f"**Status:** {status}\n\n"
                  "No initiative was generated because ACT50 did not "
                  "provide a defensible decision.\n\n"
                  f"**Decision state:** `{decision_state}`\n\n"
                  f"**Reason:** {reason}\n\n"
                  "ACT51 does not invent a goal when the cognitive "
                  "decision gate is unresolved.\n",
                  encoding="utf-8"
              )

              print()
              print("[RESULT] No initiative generated.")
              print(f"[RESULT] Reason: {reason}")
              raise SystemExit(0)

          if not isinstance(action, str) or not action.strip():
              status = "WAITING_FOR_EXPLICIT_PLAN"
              reason = (
                  "ACT50 is supported but did not expose an explicit "
                  "action/selected plan."
              )

              result = {
                  "act": 51,
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "decision_state": decision_state,
                      "action": action,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                  },
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              }

              MEMORY.mkdir(parents=True, exist_ok=True)
              OUT_JSON.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              OUT_MD.write_text(
                  "# NØX ACT51 — Autonomous Initiative Generation\n\n"
                  f"**Status:** {status}\n\n"
                  "ACT50 permitted advancement, but no explicit plan "
                  "was available. ACT51 therefore refuses to invent one.\n",
                  encoding="utf-8"
              )

              print()
              print("[RESULT] No initiative generated.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # 5. Deterministic initiative classification
          #
          # ACT51 does not use an LLM. It classifies the explicit plan
          # using transparent rules and preserves the original plan.
          # ------------------------------------------------------------

          normalized = action.strip().lower()

          if any(term in normalized for term in (
              "create colony",
              "create a colony",
              "création de colony",
              "créer une colony",
              "creer une colony",
              "new colony",
              "new colony space",
          )):
              initiative_type = "CREATE_COLONY"

          elif any(term in normalized for term in (
              "research",
              "research plan",
              "investigate",
              "investigation",
              "recherche",
              "approfondir",
              "étudier",
              "etudier",
          )):
              initiative_type = "RESEARCH"

          elif any(term in normalized for term in (
              "collaborat",
              "collaboration",
              "work request",
              "agent-collab",
          )):
              initiative_type = "COLLABORATION"

          elif any(term in normalized for term in (
              "learn",
              "learning",
              "knowledge",
              "apprentissage",
              "connaissance",
          )):
              initiative_type = "KNOWLEDGE_DEVELOPMENT"

          else:
              initiative_type = "AUTONOMOUS_INITIATIVE"

          # ------------------------------------------------------------
          # 6. Build the initiative without inventing external facts
          # ------------------------------------------------------------

          initiative_id = (
              "nox-act51-"
              + datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          )

          initiative = {
              "id": initiative_id,
              "type": initiative_type,
              "title": "Initiative derived from ACT50 supported plan",
              "objective": action.strip(),
              "source": {
                  "act": 50,
                  "decision_state": decision_state,
                  "selected_plan": action.strip(),
              },
              "status": "PROPOSED",
              "execution_allowed": False,
              "external_action_required": initiative_type == "CREATE_COLONY",
          }

          # ------------------------------------------------------------
          # 7. Preserve traceability to planning / uncertainty layers
          # ------------------------------------------------------------

          source_layers = {
              "act50": {
                  "available": True,
                  "decision_state": decision_state,
                  "action_present": bool(action.strip()),
              },
              "act48": {
                  "available": act48 is not None,
              },
              "act49": {
                  "available": act49 is not None,
              },
          }

          # If available, expose only explicit ACT49 advancement state.
          if act49 is not None:
              source_layers["act49"]["can_advance"] = act49.get("can_advance")

          # If available, expose only explicit ACT48 planning state.
          if act48 is not None:
              source_layers["act48"]["order_supported"] = act48.get(
                  "order_supported"
              )
              source_layers["act48"]["selected_plan"] = act48.get(
                  "selected_plan"
              )

          result = {
              "act": 51,
              "name": "Autonomous Initiative Generation",
              "status": "INITIATIVE_PROPOSED",
              "initiative_generated": True,
              "initiative": initiative,
              "source_layers": source_layers,
              "principles": [
                  "initiative must originate from a supported ACT50 decision",
                  "ACT51 must not invent missing evidence",
                  "the original supported plan must remain traceable",
                  "initiative generation is not execution",
                  "external actions remain disabled",
                  "ACT52 is responsible for execution",
              ],
              "safety": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "colony_created": False,
                  "marketplace_action": False,
                  "payment": False,
                  "spending": False,
              },
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
          }

          # ------------------------------------------------------------
          # 8. Write JSON + Markdown memory
          # ------------------------------------------------------------

          MEMORY.mkdir(parents=True, exist_ok=True)

          OUT_JSON.write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          md = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **INITIATIVE_PROPOSED**

          ## Purpose

          ACT51 transforms a supported ACT50 cognitive decision into an
          explicit, traceable initiative proposal.

          ACT51 does **not** execute the initiative.

          ## Source decision

          - ACT: 50
          - Decision state: `{decision_state}`
          - Selected plan:

          > {action.strip()}

          ## Initiative

          - ID: `{initiative_id}`
          - Type: `{initiative_type}`
          - Status: `PROPOSED`
          - Execution allowed: `False`

          ## Objective

          > {action.strip()}

          ## Cognitive chain

          ACT40 → ACT41 → ACT42 → ACT43 → ACT44 → ACT45 → ACT46 →
          ACT47 → ACT48 → ACT49 → ACT50 → **ACT51**

          ACT50 provides the defensible decision.

          ACT51 converts that decision into an initiative candidate.

          ACT52 will be responsible for any future execution.

          ## Safety

          - Gemini: `false`
          - External AI: `false`
          - External API: `false`
          - Colony created: `false`
          - Marketplace action: `false`
          - Payment: `false`
          - Spending: `false`

          ## Principle

          NØX does not create an initiative merely because an idea exists.

          An initiative is proposed only after the cognitive decision layer
          has explicitly supported a plan.

          **ACT51 proposes. ACT52 executes.**
          """

          OUT_MD.write_text(md, encoding="utf-8")

          print()
          print("=" * 72)
          print("ACT51 RESULT")
          print("=" * 72)
          print(f"Status:              INITIATIVE_PROPOSED")
          print(f"Initiative type:     {initiative_type}")
          print(f"Initiative ID:       {initiative_id}")
          print(f"Objective:           {action.strip()}")
          print(f"Execution allowed:  False")
          print()
          print("Memory:")
          print(f"  {OUT_JSON}")
          print(f"  {OUT_MD}")
          print()
          print("ACT51 completed without external action.")

          PY

      - name: Commit ACT51 memory
        run: |
          git config user.name "NØX"
          git config user.email "noreply@nox-origin.local"

          git fetch origin main
          git rebase origin/main

          git add memory/nox_act_51_autonomous_initiative_generation.json
          git add memory/nox_act_51_autonomous_initiative_generation.md

          if git diff --cached --quiet; then
            echo "No ACT51 memory changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT51 autonomous initiative generation"
          git push origin HEAD:main
