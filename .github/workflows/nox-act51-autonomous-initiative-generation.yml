name: NØX ACT51 - Autonomous Initiative Generation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act51:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate autonomous initiative
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          print("=" * 72)
          print("NØX ACT51 - AUTONOMOUS INITIATIVE GENERATION")
          print("=" * 72)
          print()
          print("Purpose:")
          print("  Transform a supported ACT50 decision into a traceable")
          print("  autonomous initiative proposal.")
          print()
          print("Safety:")
          print("  - No Gemini")
          print("  - No external AI")
          print("  - No external API")
          print("  - No marketplace action")
          print("  - No Colony creation")
          print("  - No payments")
          print("  - No spending")
          print("  - Proposal only")
          print()

          MEMORY = Path("memory")
          ACT50_FILE = MEMORY / "nox_act_50_cognitive_decision_loop.json"

          OUT_JSON = (
              MEMORY / "nox_act_51_autonomous_initiative_generation.json"
          )
          OUT_MD = (
              MEMORY / "nox_act_51_autonomous_initiative_generation.md"
          )

          def load_json(path, label):
              if not path.exists():
                  raise RuntimeError(f"Missing required file: {path}")

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise RuntimeError(
                      f"Invalid JSON in {path}: {exc}"
                  )

              if not isinstance(data, dict):
                  raise RuntimeError(
                      f"Expected JSON object in {path}"
                  )

              print(f"[OK] Loaded {label}: {path}")
              return data

          def write_result(result, markdown):
              MEMORY.mkdir(parents=True, exist_ok=True)

              OUT_JSON.write_text(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              OUT_MD.write_text(
                  markdown,
                  encoding="utf-8"
              )

          # ------------------------------------------------------------
          # 1. Load ACT50
          # ------------------------------------------------------------

          act50 = load_json(
              ACT50_FILE,
              "ACT50 cognitive decision"
          )

          if act50.get("act") != "ACT50":
              raise RuntimeError(
                  "ACT50 identity check failed: "
                  f"expected 'ACT50', got {act50.get('act')!r}"
              )

          print("[OK] ACT50 identity verified.")

          # ------------------------------------------------------------
          # 2. Read the real ACT50 schema
          # ------------------------------------------------------------

          decision = act50.get("decision")

          if not isinstance(decision, dict):
              decision = {}

          decision_status = decision.get("status")
          decision_supported = decision.get("supported")
          selected_action = decision.get("selected_action")

          uncertainty_gate = act50.get("uncertainty_gate")

          if not isinstance(uncertainty_gate, dict):
              uncertainty_gate = {}

          can_advance = uncertainty_gate.get("can_advance")

          print()
          print("ACT50 DECISION")
          print("-" * 72)
          print(f"status:          {decision_status!r}")
          print(f"supported:       {decision_supported!r}")
          print(f"selected_action: {selected_action!r}")

          print()
          print("ACT49 UNCERTAINTY GATE")
          print("-" * 72)
          print(f"can_advance:     {can_advance!r}")

          # ------------------------------------------------------------
          # 3. Hard cognitive gates
          #
          # ACT51 may only propose an initiative if:
          #
          #   ACT50 decision.supported == True
          #   AND
          #   ACT49 uncertainty_gate.can_advance == True
          #
          # ACT51 must never override either gate.
          # ------------------------------------------------------------

          if decision_supported is not True:
              status = "WAITING_FOR_SUPPORTED_DECISION"

              reason = (
                  "ACT50 decision.supported is not true. "
                  "NØX does not have a defensible decision."
              )

              result = {
                  "act": "ACT51",
                  "version": "V2",
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "act": "ACT50",
                      "status": decision_status,
                      "supported": decision_supported,
                      "selected_action": selected_action,
                  },
                  "uncertainty_gate": {
                      "can_advance": can_advance,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                      "decision_overridden": False,
                      "uncertainty_overridden": False,
                      "initiative_invented": False,
                  },
                  "timestamp_utc": (
                      datetime.now(timezone.utc).isoformat()
                  ),
              }

              markdown = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **{status}**

          ## ACT50 decision

          - Status: `{decision_status}`
          - Supported: `{decision_supported}`
          - Selected action: `{selected_action}`

          ## ACT49 uncertainty gate

          - Can advance: `{can_advance}`

          ## Reason

          {reason}

          ACT51 does not invent an initiative when ACT50 has not produced
          a defensible decision.

          ## Safety

          - Decision overridden: `false`
          - Uncertainty overridden: `false`
          - Initiative invented: `false`
          - Colony created: `false`
          - External API: `false`
          - Gemini: `false`
          - Payment: `false`
          - Spending: `false`
          """

              write_result(result, markdown)

              print()
              print("[RESULT] No initiative generated.")
              print(f"[RESULT] Reason: {reason}")
              raise SystemExit(0)

          if can_advance is not True:
              status = "WAITING_FOR_UNCERTAINTY_CLEARANCE"

              reason = (
                  "ACT49 uncertainty_gate.can_advance is not true. "
                  "ACT51 must not advance despite ACT50 state."
              )

              result = {
                  "act": "ACT51",
                  "version": "V2",
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "act": "ACT50",
                      "status": decision_status,
                      "supported": decision_supported,
                      "selected_action": selected_action,
                  },
                  "uncertainty_gate": {
                      "can_advance": can_advance,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                      "decision_overridden": False,
                      "uncertainty_overridden": False,
                      "initiative_invented": False,
                  },
                  "timestamp_utc": (
                      datetime.now(timezone.utc).isoformat()
                  ),
              }

              markdown = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **{status}**

          ## ACT50 decision

          - Status: `{decision_status}`
          - Supported: `{decision_supported}`
          - Selected action: `{selected_action}`

          ## ACT49 uncertainty gate

          - Can advance: `{can_advance}`

          ## Reason

          {reason}

          ACT51 respects the uncertainty gate and does not generate an
          initiative until ACT49 explicitly permits advancement.

          ## Safety

          - Decision overridden: `false`
          - Uncertainty overridden: `false`
          - Initiative invented: `false`
          - Colony created: `false`
          - External API: `false`
          - Gemini: `false`
          - Payment: `false`
          - Spending: `false`
          """

              write_result(result, markdown)

              print()
              print("[RESULT] No initiative generated.")
              print(f"[RESULT] Reason: {reason}")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # 4. Supported decision requires explicit action
          # ------------------------------------------------------------

          if not isinstance(selected_action, str):
              status = "WAITING_FOR_EXPLICIT_ACTION"

              reason = (
                  "ACT50 is supported and uncertainty is cleared, "
                  "but no explicit selected_action exists."
              )

              result = {
                  "act": "ACT51",
                  "version": "V2",
                  "name": "Autonomous Initiative Generation",
                  "status": status,
                  "initiative_generated": False,
                  "initiative": None,
                  "source_decision": {
                      "act": "ACT50",
                      "status": decision_status,
                      "supported": decision_supported,
                      "selected_action": selected_action,
                  },
                  "uncertainty_gate": {
                      "can_advance": can_advance,
                  },
                  "reason": reason,
                  "safety": {
                      "gemini": False,
                      "external_ai": False,
                      "external_api": False,
                      "colony_created": False,
                      "marketplace_action": False,
                      "payment": False,
                      "spending": False,
                      "decision_overridden": False,
                      "uncertainty_overridden": False,
                      "initiative_invented": False,
                  },
                  "timestamp_utc": (
                      datetime.now(timezone.utc).isoformat()
                  ),
              }

              markdown = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **{status}**

          ACT50 is supported and ACT49 permits advancement, but no
          explicit selected action is available.

          ACT51 therefore refuses to invent an initiative.
          """

              write_result(result, markdown)

              print()
              print("[RESULT] No initiative generated.")
              raise SystemExit(0)

          selected_action = selected_action.strip()

          if not selected_action:
              raise SystemExit(
                  "ACT51 stopped: selected_action is empty."
              )

          # ------------------------------------------------------------
          # 5. Deterministic initiative classification
          # ------------------------------------------------------------

          normalized = selected_action.lower()

          if any(term in normalized for term in (
              "create colony",
              "create a colony",
              "création de colony",
              "créer une colony",
              "creer une colony",
              "new colony",
          )):
              initiative_type = "CREATE_COLONY"

          elif any(term in normalized for term in (
              "research",
              "research plan",
              "investigate",
              "investigation",
              "recherche",
              "approfondir",
              "étudier",
              "etudier",
          )):
              initiative_type = "RESEARCH"

          elif any(term in normalized for term in (
              "collaboration",
              "collaborat",
              "work request",
              "agent-collab",
          )):
              initiative_type = "COLLABORATION"

          elif any(term in normalized for term in (
              "learn",
              "learning",
              "knowledge",
              "apprentissage",
              "connaissance",
          )):
              initiative_type = "KNOWLEDGE_DEVELOPMENT"

          else:
              initiative_type = "AUTONOMOUS_INITIATIVE"

          # ------------------------------------------------------------
          # 6. Generate traceable proposal
          # ------------------------------------------------------------

          initiative_id = (
              "nox-act51-"
              + datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          )

          initiative = {
              "id": initiative_id,
              "type": initiative_type,
              "title": "Initiative derived from ACT50 decision",
              "objective": selected_action,
              "source": {
                  "act": "ACT50",
                  "decision_status": decision_status,
                  "decision_supported": decision_supported,
                  "selected_action": selected_action,
              },
              "status": "PROPOSED",
              "execution_allowed": False,
              "external_action_required": (
                  initiative_type == "CREATE_COLONY"
              ),
          }

          result = {
              "act": "ACT51",
              "version": "V2",
              "name": "Autonomous Initiative Generation",
              "status": "INITIATIVE_PROPOSED",
              "initiative_generated": True,
              "initiative": initiative,
              "source_decision": {
                  "act": "ACT50",
                  "status": decision_status,
                  "supported": decision_supported,
                  "selected_action": selected_action,
              },
              "uncertainty_gate": {
                  "can_advance": can_advance,
              },
              "principles": [
                  "ACT51 only acts on an explicitly supported ACT50 decision",
                  "ACT49 uncertainty clearance cannot be overridden",
                  "missing evidence must never be invented",
                  "initiative generation is not execution",
                  "external actions remain disabled",
                  "ACT52 is responsible for future execution",
              ],
              "safety": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "colony_created": False,
                  "marketplace_action": False,
                  "payment": False,
                  "spending": False,
                  "decision_overridden": False,
                  "uncertainty_overridden": False,
                  "initiative_invented": False,
              },
              "timestamp_utc": (
                  datetime.now(timezone.utc).isoformat()
              ),
          }

          markdown = f"""# NØX ACT51 — Autonomous Initiative Generation

          ## Status

          **INITIATIVE_PROPOSED**

          ## Source decision

          - ACT: `ACT50`
          - Decision status: `{decision_status}`
          - Supported: `{decision_supported}`
          - Selected action:

          > {selected_action}

          ## Uncertainty gate

          - ACT49 can advance: `{can_advance}`

          ## Initiative

          - ID: `{initiative_id}`
          - Type: `{initiative_type}`
          - Status: `PROPOSED`
          - Execution allowed: `False`

          ## Objective

          > {selected_action}

          ## Cognitive chain

          ACT40 → ACT41 → ACT42 → ACT43 → ACT44 → ACT45 → ACT46 →
          ACT47 → ACT48 → ACT49 → ACT50 → **ACT51**

          ACT50 provides the defensible decision.

          ACT51 transforms that decision into a traceable initiative
          proposal.

          ACT51 does not execute the initiative.

          ACT52 will be responsible for future execution.

          ## Safety

          - Gemini: `false`
          - External AI: `false`
          - External API: `false`
          - Colony created: `false`
          - Marketplace action: `false`
          - Payment: `false`
          - Spending: `false`
          - Decision overridden: `false`
          - Uncertainty overridden: `false`
          - Initiative invented: `false`

          ## Principle

          **ACT50 decides. ACT51 proposes. ACT52 executes.**
          """

          write_result(result, markdown)

          print()
          print("=" * 72)
          print("ACT51 RESULT")
          print("=" * 72)
          print("Status:              INITIATIVE_PROPOSED")
          print(f"Initiative type:     {initiative_type}")
          print(f"Initiative ID:       {initiative_id}")
          print(f"Objective:           {selected_action}")
          print("Execution allowed:  False")
          print()
          print("Memory:")
          print(f"  {OUT_JSON}")
          print(f"  {OUT_MD}")
          print()
          print("ACT51 completed without external action.")

          PY

      - name: Commit ACT51 memory
        run: |
          git config user.name "NØX"
          git config user.email "noreply@nox-origin.local"

          git fetch origin main
          git rebase origin/main

          git add memory/nox_act_51_autonomous_initiative_generation.json
          git add memory/nox_act_51_autonomous_initiative_generation.md

          if git diff --cached --quiet; then
            echo "No ACT51 memory changes to commit."
            exit 0
          fi

          git commit -m "feat: refine ACT51 autonomous initiative generation"
          git push origin HEAD:main
