name: NØX ACT 11 - Active Attention & Prioritization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-act11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX ACT 11
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("==============================================")
          print("NØX ACT 11 - ACTIVE ATTENTION")
          print("==============================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          # ---------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              try:
                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def as_list(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "suggestions",
                      "messages",
                      "tasks",
                      "posts",
                      "notifications"
                  ):
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

              return []

          def text_of(item):
              if not isinstance(item, dict):
                  return str(item)

              parts = []

              for key in (
                  "title",
                  "body",
                  "content",
                  "label",
                  "description",
                  "rationale",
                  "category",
                  "kind"
              ):
                  value = item.get(key)

                  if value:
                      parts.append(str(value))

              return " ".join(parts).lower()

          # ---------------------------------------------------------
          # 1. Authentication
          # ---------------------------------------------------------

          print()
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(
              f"Authentication status: "
              f"{auth.status_code}"
          )

          if not auth.ok:
              raise SystemExit(
                  f"Authentication failed: {auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(auth_data, dict)
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # ---------------------------------------------------------
          # 2. Identity
          # ---------------------------------------------------------

          print()
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          me = safe_json(me_response)

          username = (
              me.get("username", "unknown")
              if isinstance(me, dict)
              else "unknown"
          )

          print(
              f"Authenticated agent: @{username}"
          )

          # ---------------------------------------------------------
          # 3. Load existing memory
          # ---------------------------------------------------------

          print()
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(MEMORY_FILE):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  print(
                      f"Memory load warning: {exc}"
                  )

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "version",
              "NØX ACT 11 Active Attention"
          )

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # ---------------------------------------------------------
          # 4. Read personalized feed
          # ---------------------------------------------------------

          print()
          print("[4] Reading for-you feed...")

          feed_response = request(
              "GET",
              "/feed/for-you",
              params={"limit": 25}
          )

          feed_data = (
              safe_json(feed_response)
              if feed_response is not None
              else None
          )

          feed_items = as_list(feed_data)

          print(
              f"Feed items detected: "
              f"{len(feed_items)}"
          )

          # ---------------------------------------------------------
          # 5. Read suggestions
          # ---------------------------------------------------------

          print()
          print("[5] Reading suggestions...")

          suggestions_response = request(
              "GET",
              "/suggestions",
              params={"limit": 50}
          )

          suggestions_data = (
              safe_json(suggestions_response)
              if suggestions_response is not None
              else None
          )

          suggestions = as_list(
              suggestions_data
          )

          print(
              f"Suggestions detected: "
              f"{len(suggestions)}"
          )

          # ---------------------------------------------------------
          # 6. Read unread notifications
          # ---------------------------------------------------------

          print()
          print("[6] Reading unread notifications...")

          notifications_response = request(
              "GET",
              "/notifications",
              params={"unread_only": "true"}
          )

          notifications_data = (
              safe_json(notifications_response)
              if notifications_response is not None
              else None
          )

          notifications = as_list(
              notifications_data
          )

          print(
              f"Unread notifications detected: "
              f"{len(notifications)}"
          )

          # ---------------------------------------------------------
          # 7. Read verified DM channel
          # ---------------------------------------------------------

          print()
          print(
              "[7] Reading verified DM channel with @Romu..."
          )

          dm_response = request(
              "GET",
              "/messages/conversations/Romu"
          )

          dm_data = (
              safe_json(dm_response)
              if dm_response is not None
              else None
          )

          dm_messages = []

          if isinstance(dm_data, dict):
              dm_messages = as_list(
                  dm_data.get("messages", [])
              )

          print(
              f"DM messages detected: "
              f"{len(dm_messages)}"
          )

          # ---------------------------------------------------------
          # 8. Read Marketplace tasks
          #
          # ACT 11 observes only.
          # No bid, claim, order or execution is performed.
          # ---------------------------------------------------------

          print()
          print("[8] Scanning Marketplace tasks...")

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          marketplace_data = (
              safe_json(marketplace_response)
              if marketplace_response is not None
              else None
          )

          marketplace_tasks = as_list(
              marketplace_data
          )

          print(
              f"Marketplace tasks detected: "
              f"{len(marketplace_tasks)}"
          )

          # ---------------------------------------------------------
          # 9. Build attention candidates
          # ---------------------------------------------------------

          print()
          print("[9] Building attention candidates...")

          candidates = []

          # Suggestions
          for item in suggestions:

              if not isinstance(item, dict):
                  continue

              kind = str(
                  item.get("kind", "")
              )

              category = str(
                  item.get("category", "")
              )

              score = item.get(
                  "score",
                  0
              )

              try:
                  score = float(score)
              except Exception:
                  score = 0.0

              attention = score

              if (
                  "reply" in kind
                  or "mention" in kind
                  or "message" in kind
                  or "dm" in kind
              ):
                  attention += 0.20

              candidates.append({
                  "source": "suggestion",
                  "type": kind,
                  "category": category,
                  "base_score": score,
                  "attention_score": round(
                      min(attention, 1.0),
                      4
                  ),
                  "item": item
              })

          # Direct messages
          for message in dm_messages:

              if not isinstance(
                  message,
                  dict
              ):
                  continue

              body = message.get(
                  "body",
                  message.get(
                      "content",
                      ""
                  )
              )

              sender = message.get(
                  "sender",
                  {}
              )

              if not isinstance(
                  sender,
                  dict
              ):
                  sender = {}

              sender_name = sender.get(
                  "username",
                  ""
              )

              # Direct messages receive high attention,
              # but not automatic action.
              dm_attention = 0.85

              body_lower = str(
                  body
              ).lower()

              if (
                  "autonomie" in body_lower
                  or "autonomous" in body_lower
              ):
                  dm_attention = 0.98

              candidates.append({
                  "source": "dm",
                  "type": "direct_message",
                  "category": "communication",
                  "base_score": 0.0,
                  "attention_score": dm_attention,
                  "sender": sender_name,
                  "item": message
              })

          # Notifications
          for notification in notifications:

              if not isinstance(
                  notification,
                  dict
              ):
                  continue

              text = text_of(
                  notification
              )

              attention = 0.45

              if (
                  "mention" in text
                  or "reply" in text
                  or "message" in text
                  or "dm" in text
              ):
                  attention += 0.20

              candidates.append({
                  "source": "notification",
                  "type": "incoming_notification",
                  "category": "community",
                  "base_score": 0.45,
                  "attention_score": round(
                      min(attention, 1.0),
                      4
                  ),
                  "item": notification
              })

          # Marketplace
          for task in marketplace_tasks:

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              text = text_of(
                  task
              )

              attention = 0.30

              keywords = [
                  "ai",
                  "agent",
                  "automation",
                  "research",
                  "analysis",
                  "api",
                  "python",
                  "data",
                  "cyber",
                  "technology"
              ]

              matches = sum(
                  1
                  for keyword in keywords
                  if keyword in text
              )

              attention += min(
                  matches * 0.05,
                  0.25
              )

              candidates.append({
                  "source": "marketplace",
                  "type": "marketplace_task",
                  "category": "opportunity",
                  "base_score": 0.30,
                  "attention_score": round(
                      min(attention, 0.80),
                      4
                  ),
                  "item": task
              })

          # Feed
          for post in feed_items[:25]:

              if not isinstance(
                  post,
                  dict
              ):
                  continue

              candidates.append({
                  "source": "feed",
                  "type": "feed_item",
                  "category": "observation",
                  "base_score": 0.20,
                  "attention_score": 0.20,
                  "item": post
              })

          # ---------------------------------------------------------
          # 10. Sort attention
          # ---------------------------------------------------------

          candidates.sort(
              key=lambda x: x.get(
                  "attention_score",
                  0
              ),
              reverse=True
          )

          top_candidates = candidates[:15]

          print()
          print(
              f"Total attention candidates: "
              f"{len(candidates)}"
          )

          print()
          print(
              "========== TOP ATTENTION =========="
          )

          for index, candidate in enumerate(
              top_candidates,
              1
          ):

              print()
              print(
                  f"#{index} "
                  f"{candidate['source']} / "
                  f"{candidate['type']} "
                  f"score="
                  f"{candidate['attention_score']}"
              )

              if candidate.get("sender"):
                  print(
                      f"Sender: "
                      f"@{candidate['sender']}"
                  )

              item = candidate.get(
                  "item",
                  {}
              )

              if isinstance(
                  item,
                  dict
              ):

                  title = item.get(
                      "title",
                      item.get(
                          "label",
                          ""
                      )
                  )

                  body = item.get(
                      "body",
                      item.get(
                          "content",
                          ""
                      )
                  )

                  if title:
                      print(
                          f"Title: {title}"
                      )

                  if body:
                      print(
                          f"Content: "
                          f"{str(body)[:300]}"
                      )

          # ---------------------------------------------------------
          # 11. Active attention rules
          # ---------------------------------------------------------

          print()
          print(
              "[11] Applying active attention rules..."
          )

          active_attention = []

          for candidate in top_candidates:

              item = candidate.get(
                  "item",
                  {}
              )

              text = text_of(
                  item
              )

              reasons = []

              if candidate["source"] == "dm":
                  reasons.append(
                      "direct human communication"
                  )

              if (
                  "autonomie" in text
                  or "autonomous" in text
              ):
                  reasons.append(
                      "autonomy relevance"
                  )

              if (
                  "task" in text
                  or "bounty" in text
                  or "paid" in text
                  or "marketplace" in text
              ):
                  reasons.append(
                      "potential actionable task"
                  )

              if (
                  "reply" in text
                  or "mention" in text
              ):
                  reasons.append(
                      "interaction requiring attention"
                  )

              if candidate["source"] == "marketplace":
                  reasons.append(
                      "potential future work opportunity"
                  )

              if not reasons:
                  reasons.append(
                      "general observation"
                  )

              candidate["attention_reasons"] = (
                  reasons
              )

              active_attention.append(
                  candidate
              )

          # ---------------------------------------------------------
          # 12. Create ACT 11 decision
          # ---------------------------------------------------------

          print()
          print(
              "[12] Creating ACT 11 decision..."
          )

          selected = (
              active_attention[0]
              if active_attention
              else None
          )

          decision_id = (
              f"act11-{int(now_dt.timestamp())}"
          )

          decision = {
              "decision_id": decision_id,
              "timestamp": now,
              "stage": "active_attention",
              "selected_source": (
                  selected["source"]
                  if selected
                  else None
              ),
              "selected_type": (
                  selected["type"]
                  if selected
                  else None
              ),
              "selected_score": (
                  selected["attention_score"]
                  if selected
                  else 0
              ),
              "reason": (
                  selected["attention_reasons"]
                  if selected
                  else ["no candidate"]
              ),
              "action_taken": False
          }

          print(
              json.dumps(
                  decision,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ---------------------------------------------------------
          # 13. Learning record
          # ---------------------------------------------------------

          print()
          print(
              "[13] Creating learning record..."
          )

          learning = {
              "timestamp": now,
              "stage": "ACT11",
              "lesson": (
                  "NØX must distinguish passive perception "
                  "from active attention. Incoming information "
                  "must be evaluated for relevance before action."
              ),
              "observed_sources": {
                  "feed": len(feed_items),
                  "suggestions": len(suggestions),
                  "notifications": len(notifications),
                  "direct_messages": len(dm_messages),
                  "marketplace_tasks": len(
                      marketplace_tasks
                  )
              },
              "important_principle": (
                  "A readable input is not automatically "
                  "an actionable input."
              ),
              "autonomy_direction": (
                  "Future cycles must progressively move "
                  "from attention to task detection, "
                  "capability evaluation, autonomous choice, "
                  "execution and outcome learning."
              )
          }

          # ---------------------------------------------------------
          # 14. Save memory
          # ---------------------------------------------------------

          print()
          print(
              "[14] Updating NØX memory..."
          )

          memory["last_act"] = "ACT 11"
          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp": now,
              "act": "ACT11",
              "type": "active_attention_cycle",
              "sources": {
                  "feed": len(feed_items),
                  "suggestions": len(suggestions),
                  "notifications": len(notifications),
                  "direct_messages": len(dm_messages),
                  "marketplace_tasks": len(
                      marketplace_tasks
                  )
              }
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          # Keep memory bounded.
          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["learning"] = (
              memory["learning"][-50:]
          )

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Memory saved to {MEMORY_FILE}"
          )

          # ---------------------------------------------------------
          # 15. Safety boundary
          # ---------------------------------------------------------

          print()
          print("==============================================")
          print("ACT 11 COMPLETED")
          print("==============================================")

          print()
          print("ACT 11 PURPOSE:")
          print("- Observe incoming information.")
          print("- Distinguish passive perception from attention.")
          print("- Prioritize what deserves attention.")
          print("- Include direct messages in the cognitive input.")
          print("- Begin observing Marketplace opportunities.")

          print()
          print("IMPORTANT:")
          print("- No DM was sent.")
          print("- No comment was created.")
          print("- No post was created.")
          print("- No Marketplace task was claimed.")
          print("- No Marketplace bid was submitted.")
          print("- No order was placed.")
          print("- No paid service was used.")
          print("- No external AI API was used.")
          print("- ACT 11 remains an observation/attention stage.")

          print()
          print("NEXT AUTONOMY STEP:")
          print(
              "ACT 12 must transform attention into "
              "task detection and capability matching."
          )

          print()
          print("ROADMAP:")
          print("ACT 11 -> Attention")
          print("ACT 12 -> Task detection")
          print("ACT 13 -> Autonomous evaluation/choice")
          print("ACT 14 -> Controlled execution")
          print("ACT 15 -> REAL MARKETPLACE ACTION")

          print()
          print("==============================================")
          print("END")
          print("==============================================")
          PY

      - name: Save NØX ACT 11 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 11: active attention and prioritization"
            git push
          fi
