name: NØX V78 — Controlled Useful Action

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v78-controlled-useful-action
  cancel-in-progress: false

jobs:
  controlled-useful-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V78
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          TIMEOUT = 20

          def now():
              return datetime.now(timezone.utc).isoformat()

          def api_request(method, path, token=None, params=None, payload=None):
              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              if not response.content:
                  return {}

              return response.json()

          def load_json(path):
              p = Path(path)

              if not p.exists():
                  return {}

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def first_list(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in [
                  "items",
                  "posts",
                  "results",
                  "data",
                  "suggestions",
                  "opportunities",
                  "ranked_opportunities"
              ]:
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def text_of(item):
              if not isinstance(item, dict):
                  return ""

              return " ".join(
                  str(value)
                  for value in [
                      item.get("title"),
                      item.get("body"),
                      item.get("content"),
                      item.get("description"),
                      item.get("text")
                  ]
                  if value
              ).strip()

          def post_id_of(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "post_id",
                  "id",
                  "postId"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def author_of(item):
              if not isinstance(item, dict):
                  return {}

              author = item.get("author")

              if isinstance(author, dict):
                  return author

              return {
                  "id": item.get("author_id"),
                  "username": (
                      item.get("author_username")
                      or item.get("username")
                  )
              }

          def is_nox(item, me):
              author = author_of(item)

              aid = str(
                  author.get("id") or ""
              ).lower()

              username = str(
                  author.get("username") or ""
              ).lower()

              my_id = str(
                  me.get("id")
                  or "442104b5-eee0-4f73-b452-08f258a21ea2"
              ).lower()

              my_username = str(
                  me.get("username")
                  or "nox_origine"
              ).lower()

              return (
                  aid == my_id
                  or username == my_username
                  or aid == "442104b5-eee0-4f73-b452-08f258a21ea2"
                  or username == "nox_origine"
              )

          def has_any(text, terms):
              lowered = text.lower()
              return any(
                  term in lowered
                  for term in terms
              )

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text or "")
              ).strip()

          def classify_action_candidate(item):
              title = clean(
                  item.get("title")
              )

              body = clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("description")
                  or item.get("text")
              )

              text = (
                  title + "\n" + body
              ).strip()

              post_type = str(
                  item.get("post_type")
                  or item.get("type")
                  or ""
              )

              score = int(
                  item.get("readiness_score")
                  or item.get("final_score")
                  or item.get("contextual_score")
                  or item.get("score")
                  or 0
              )

              signals = []
              reasons = []

              explicit_request = has_any(
                  text,
                  [
                      "i need",
                      "we need",
                      "looking for",
                      "need someone",
                      "seeking",
                      "hire",
                      "hiring",
                      "who can",
                      "can someone"
                  ]
              )

              question_signal = (
                  post_type == "question"
                  or has_any(
                      text,
                      [
                          "how do",
                          "how can",
                          "does anyone know",
                          "any idea",
                          "what is",
                          "why does",
                          "can anyone explain"
                      ]
                  )
              )

              useful_answer_signal = has_any(
                  text,
                  [
                      "help",
                      "issue",
                      "problem",
                      "bug",
                      "question",
                      "need advice",
                      "looking for information"
                  ]
              )

              completed = has_any(
                  text,
                  [
                      "completed",
                      "done",
                      "finished",
                      "already built",
                      "delivered",
                      "successfully completed"
                  ]
              )

              analysis_only = (
                  post_type in [
                      "analysis",
                      "finding"
                  ]
                  and not explicit_request
                  and not question_signal
              )

              if explicit_request:
                  signals.append(
                      "OPEN_DELEGATION"
                  )
                  reasons.append(
                      "The post contains an explicit delegation signal."
                  )

              if question_signal:
                  signals.append(
                      "QUESTION_SIGNAL"
                  )
                  reasons.append(
                      "The post appears to contain a question that NØX may answer."
                  )

              if useful_answer_signal:
                  signals.append(
                      "USEFUL_RESPONSE_POSSIBLE"
                  )

              if score >= 65:
                  signals.append(
                      "V77_READY_SIGNAL"
                  )

              if completed:
                  signals.append(
                      "COMPLETION_SIGNAL"
                  )

              if analysis_only:
                  signals.append(
                      "ANALYSIS_WITHOUT_REQUEST"
                  )

              # ------------------------------------------------------
              # Action selection
              # ------------------------------------------------------

              if completed:
                  action = "NO_ACTION"

              elif explicit_request:
                  action = "USEFUL_REQUEST_RESPONSE"

              elif question_signal:
                  action = "USEFUL_QUESTION_ANSWER"

              elif useful_answer_signal and score >= 55:
                  action = "USEFUL_INFORMATION_RESPONSE"

              else:
                  action = "NO_ACTION"

              action_score = score

              if explicit_request:
                  action_score += 15

              if question_signal:
                  action_score += 10

              if useful_answer_signal:
                  action_score += 5

              if completed:
                  action_score -= 40

              if analysis_only:
                  action_score -= 20

              action_score = max(
                  0,
                  min(100, action_score)
              )

              if action == "NO_ACTION":
                  readiness = "NOT_READY"

              elif action_score >= 80:
                  readiness = "ACTION_READY_HIGH"

              elif action_score >= 65:
                  readiness = "ACTION_READY"

              else:
                  readiness = "ACTION_REVIEW_REQUIRED"

              return {
                  "post_id": post_id_of(item),
                  "title": title,
                  "author": author_of(item),
                  "post_type": post_type,
                  "source_score": score,
                  "action_score": action_score,
                  "action": action,
                  "readiness": readiness,
                  "signals": signals,
                  "reasons": reasons,
                  "external_action_allowed": (
                      action != "NO_ACTION"
                      and action_score >= 65
                  )
              }

          def generate_response(candidate, context):
              title = candidate.get("title") or ""
              body = ""

              if isinstance(context, dict):
                  body = (
                      context.get("body")
                      or context.get("content")
                      or context.get("text")
                      or ""
                  )

              text = (
                  title + " " + body
              ).lower()

              if has_any(
                  text,
                  [
                      "acceptance criteria",
                      "requirements",
                      "verification"
                  ]
              ):
                  return (
                      "I think the key point is to make the expected "
                      "result and acceptance criteria explicit. That "
                      "makes the request easier to evaluate and verify."
                  )

              if has_any(
                  text,
                  [
                      "bug",
                      "error",
                      "issue",
                      "problem"
                  ]
              ):
                  return (
                      "This looks like a useful issue to investigate. "
                      "A reproducible example and a clear expected "
                      "result would make the next step much easier "
                      "to verify."
                  )

              if has_any(
                  text,
                  [
                      "looking for",
                      "need someone",
                      "seeking",
                      "hire",
                      "hiring"
                  ]
              ):
                  return (
                      "This looks like a potentially actionable request. "
                      "Before taking the task, I would make the expected "
                      "deliverable, acceptance criteria and application "
                      "method explicit."
                  )

              return (
                  "This looks relevant to the kind of useful work NØX "
                  "is trying to identify. The concrete deliverable and "
                  "verification criteria are the most useful next details."
              )

          print("Starting NØX V78")
          print("Mode: controlled useful action")

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          # ------------------------------------------------------------
          # JWT authentication
          # ------------------------------------------------------------

          token_response = requests.post(
              BASE + "/auth/token",
              json={
                  "api_key": api_key
              },
              headers={
                  "Accept": "application/json"
              },
              timeout=TIMEOUT
          )

          token_response.raise_for_status()

          token_data = token_response.json()
          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "JWT access_token missing"
              )

          print(
              "JWT authentication: OK"
          )

          # ------------------------------------------------------------
          # Identity
          # ------------------------------------------------------------

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          print(
              "NØX identity:",
              me.get("username")
              or "unknown"
          )

          # ------------------------------------------------------------
          # Load V77
          # ------------------------------------------------------------

          v77 = load_json(
              "memory/nox_v77_action_readiness_engine.json"
          )

          candidates = first_list(
              v77.get("ranked_decisions", [])
          )

          print(
              "V77 ranked decisions:",
              len(candidates)
          )

          # ------------------------------------------------------------
          # Select action candidate
          # ------------------------------------------------------------

          action_candidates = []

          for item in candidates:

              if is_nox(item, me):
                  continue

              evaluation = classify_action_candidate(
                  item
              )

              if evaluation["action"] != "NO_ACTION":
                  action_candidates.append(
                      evaluation
                  )

          action_candidates.sort(
              key=lambda x: (
                  x["external_action_allowed"],
                  x["action_score"]
              ),
              reverse=True
          )

          selected = None

          for candidate in action_candidates:
              if candidate[
                  "external_action_allowed"
              ]:
                  selected = candidate
                  break

          # ------------------------------------------------------------
          # If no V77 candidate is ready, inspect suggestions.
          # ------------------------------------------------------------

          if selected is None:

              print(
                  "No V77 action-ready candidate."
              )
              print(
                  "Checking Colony suggestions."
              )

              suggestions_raw = api_request(
                  "GET",
                  "/suggestions",
                  token=token,
                  params={
                      "limit": 20
                  }
              )

              suggestions = first_list(
                  suggestions_raw
              )

              for suggestion in suggestions:

                  if not isinstance(
                      suggestion,
                      dict
                  ):
                      continue

                  candidate = {
                      "post_id": suggestion.get(
                          "post_id"
                      ),
                      "title": suggestion.get(
                          "title"
                      ),
                      "body": suggestion.get(
                          "description"
                      ),
                      "post_type": suggestion.get(
                          "type"
                      ),
                      "readiness_score": 70
                  }

                  if not candidate["post_id"]:
                      continue

                  evaluation = classify_action_candidate(
                      candidate
                  )

                  if evaluation[
                      "external_action_allowed"
                  ]:
                      selected = evaluation
                      break

          # ------------------------------------------------------------
          # Safety: only public comment action.
          # ------------------------------------------------------------

          action_result = {
              "executed": False,
              "action": "NONE",
              "post_id": None,
              "comment_id": None,
              "body": None,
              "status": "NO_ACTION_EXECUTED"
          }

          if selected is None:

              print(
                  "No sufficiently strong action candidate."
              )

          else:

              post_id = selected.get(
                  "post_id"
              )

              print(
                  "Selected action candidate:",
                  selected.get("title")
              )

              print(
                  "Action score:",
                  selected.get("action_score")
              )

              print(
                  "Action:",
                  selected.get("action")
              )

              # --------------------------------------------------------
              # Fetch primary context before commenting.
              # --------------------------------------------------------

              context = api_request(
                  "GET",
                  f"/posts/{post_id}/context",
                  token=token
              )

              response_body = generate_response(
                  selected,
                  context
              )

              # --------------------------------------------------------
              # Final action gate.
              # --------------------------------------------------------

              if (
                  selected.get("action_score", 0) >= 65
                  and post_id
                  and response_body
              ):

                  payload = {
                      "body": response_body
                  }

                  comment_response = api_request(
                      "POST",
                      f"/posts/{post_id}/comments",
                      token=token,
                      payload=payload
                  )

                  comment_id = None

                  if isinstance(
                      comment_response,
                      dict
                  ):
                      comment_id = (
                          comment_response.get("id")
                          or comment_response.get("comment_id")
                      )

                  action_result = {
                      "executed": True,
                      "action": "PUBLIC_USEFUL_COMMENT",
                      "post_id": post_id,
                      "comment_id": comment_id,
                      "body": response_body,
                      "status": "EXECUTED"
                  }

                  print(
                      "Controlled useful action executed."
                  )

                  print(
                      "Comment ID:",
                      comment_id
                  )

              else:
                  print(
                      "Final action gate rejected candidate."
                  )

          # ------------------------------------------------------------
          # Result
          # ------------------------------------------------------------

          result = {
              "version": "V78",
              "generated_at": now(),
              "mode": "controlled_useful_action",
              "agent": {
                  "id": me.get("id"),
                  "username": me.get("username")
              },
              "input": {
                  "v77_candidates": len(candidates),
                  "action_candidates": len(
                      action_candidates
                  )
              },
              "selection": {
                  "selected_candidate": selected,
                  "action_result": action_result
              },
              "learning": {
                  "objective": (
                      "Begin the transition from decision to useful "
                      "external action while preserving evidence of "
                      "why the action was selected."
                  ),
                  "observations": [
                      "Action should follow verified opportunity evidence.",
                      "The selected post must be re-read before action.",
                      "A useful response must be relevant to the actual context.",
                      "Action results must be stored for future learning.",
                      "No action should occur when evidence is insufficient.",
                      "Autonomy should increase only when decision quality is demonstrated."
                  ],
                  "next_learning_target": (
                      "Measure whether controlled actions produce "
                      "useful responses, engagement or real work opportunities."
                  )
              },
              "autonomy_progression": {
                  "current_stage": (
                      "CONTROLLED_USEFUL_ACTION"
                  ),
                  "previous_stage": (
                      "ACTION_READINESS_AND_PRIORITIZATION"
                  ),
                  "next_stage": (
                      "ACTION_RESULT_MEASUREMENT_AND_ADAPTATION"
                  ),
                  "long_term_target": (
                      "V100_AUTONOMOUS_DECISION_MAKING"
                  )
              },
              "constraints": {
                  "automatic_public_comment": True,
                  "automatic_application": False,
                  "automatic_bidding": False,
                  "automatic_dm": False,
                  "automatic_payment": False,
                  "gemini": False,
                  "zero_cost": True
              },
              "regression_cases_preserved": [
                  "V62_GENERIC_DEMAND_FALSE_POSITIVE",
                  "V64_ANALYSIS_FALSE_POSITIVE",
                  "V67_OVER_PRUNING",
                  "V69_TASK_WITHOUT_DEMAND",
                  "V72_INPUT_RECOVERY_FAILURE",
                  "V74_SELF_EVIDENCE_CONTAMINATION"
              ],
              "answer_status": (
                  "ACTION_EXECUTED"
                  if action_result["executed"]
                  else "NO_ACTION_EXECUTED"
              ),
              "confidence": (
                  0.90
                  if action_result["executed"]
                  else 0.55
              )
          }

          # ------------------------------------------------------------
          # Markdown
          # ------------------------------------------------------------

          md = []

          md.append(
              "# NØX V78 — Controlled Useful Action"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Transform a sufficiently verified opportunity into "
              "one controlled, useful public interaction."
          )
          md.append("")
          md.append("## Selection")
          md.append("")

          if selected:
              md.append(
                  f"- Title: {selected.get('title') or 'unknown'}"
              )
              md.append(
                  f"- Post ID: `{selected.get('post_id')}`"
              )
              md.append(
                  f"- Action score: **{selected.get('action_score')}**"
              )
              md.append(
                  f"- Action: `{selected.get('action')}`"
              )
              md.append(
                  f"- Readiness: `{selected.get('readiness')}`"
              )
          else:
              md.append(
                  "No action candidate reached the final action gate."
              )

          md.append("")
          md.append("## Action result")
          md.append("")
          md.append(
              f"- Executed: `{action_result['executed']}`"
          )
          md.append(
              f"- Status: `{action_result['status']}`"
          )

          if action_result["comment_id"]:
              md.append(
                  f"- Comment ID: `{action_result['comment_id']}`"
              )

          md.append("")
          md.append("## Autonomy progression")
          md.append("")
          md.append(
              "V78 introduces the first controlled useful external "
              "action in the V75+ decision chain."
          )
          md.append("")
          md.append(
              "The action is intentionally limited to a substantive "
              "public comment. No bidding, payment or automatic DM "
              "is performed."
          )
          md.append("")
          md.append(
              "The result is preserved so future versions can learn "
              "whether NØX's decisions actually produce useful outcomes."
          )
          md.append("")
          md.append(
              "Long-term target: V100 autonomous decision-making."
          )
          md.append("")
          md.append("## Constraints")
          md.append("")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("- Automatic public useful comment: enabled.")
          md.append("- Automatic application: disabled.")
          md.append("- Automatic bidding: disabled.")
          md.append("- Automatic DM: disabled.")
          md.append("- Automatic payment: disabled.")
          md.append("")

          Path("memory").mkdir(
              exist_ok=True
          )

          json_path = Path(
              "memory/nox_v78_controlled_useful_action.json"
          )

          md_path = Path(
              "memory/nox_v78_controlled_useful_action.md"
          )

          json_path.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          md_path.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          print("")
          print(
              "V78 completed successfully."
          )
          print(
              "Action executed:",
              action_result["executed"]
          )
          print(
              "Status:",
              action_result["status"]
          )
          print(
              json_path
          )
          print(
              md_path
          )
          PY

      - name: Commit V78 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add \
            memory/nox_v78_controlled_useful_action.json \
            memory/nox_v78_controlled_useful_action.md

          git diff --cached --quiet || \
            git commit -m "NØX V78 controlled useful action"

          git push
