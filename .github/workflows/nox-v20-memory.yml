name: NØX Origin - V20 Pattern Detection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pattern-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run NØX V20 Pattern Detection
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import hashlib
          import re
          from collections import Counter
          from datetime import datetime, timezone

          import requests
          from google import genai


          print("========================================")
          print("NØX ORIGIN - V20 PATTERN DETECTION")
          print("========================================")


          colony_key = os.environ.get("COLONY_API_KEY")
          gemini_key = os.environ.get("GEMINI_API_KEY")

          if not colony_key:
              raise RuntimeError("COLONY_API_KEY missing")

          if not gemini_key:
              raise RuntimeError("GEMINI_API_KEY missing")


          memory_file = "nox_memory.json"


          # ================================================
          # 1. LOAD MEMORY
          # ================================================

          if os.path.exists(memory_file):
              try:
                  with open(memory_file, "r", encoding="utf-8") as f:
                      memory = json.load(f)
              except Exception as e:
                  print("Memory could not be read:", e)
                  memory = {}
          else:
              memory = {}


          if not isinstance(memory, dict):
              memory = {}


          memory.setdefault("version", "V20")
          memory.setdefault(
              "created_at",
              datetime.now(timezone.utc).isoformat()
          )
          memory.setdefault("observations", [])
          memory.setdefault("insights", [])
          memory.setdefault("needs", [])
          memory.setdefault("opportunities", [])
          memory.setdefault("patterns", [])
          memory.setdefault("knowledge", [])
          memory.setdefault("history", [])


          print("Existing observations:", len(memory["observations"]))
          print("Existing patterns:", len(memory["patterns"]))
          print("Existing knowledge:", len(memory["knowledge"]))


          # ================================================
          # 2. AUTHENTICATE THE COLONY
          # ================================================

          print("Authenticating with The Colony...")


          auth = requests.post(
              "https://thecolony.cc/api/v1/auth/token",
              headers={
                  "Content-Type": "application/json"
              },
              json={
                  "api_key": colony_key
              },
              timeout=30
          )


          print("Authentication status:", auth.status_code)


          if auth.status_code != 200:
              raise RuntimeError(
                  f"The Colony authentication failed: "
                  f"{auth.status_code} {auth.text[:500]}"
              )


          auth_data = auth.json()


          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )


          if not token:
              raise RuntimeError("No Colony access token returned")


          # ================================================
          # 3. FETCH NEW COLONY DATA
          # ================================================

          print("Fetching fresh Colony data...")


          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }


          feed_response = requests.get(
              "https://thecolony.cc/api/v1/posts",
              headers=headers,
              params={
                  "limit": 20
              },
              timeout=30
          )


          print("Colony feed status:", feed_response.status_code)


          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"Colony feed failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:500]}"
              )


          feed_data = feed_response.json()


          if isinstance(feed_data, dict):
              posts = (
                  feed_data.get("posts")
                  or feed_data.get("data")
                  or feed_data.get("items")
                  or []
              )
          elif isinstance(feed_data, list):
              posts = feed_data
          else:
              posts = []


          print("Fresh posts retrieved:", len(posts))


          # ================================================
          # 4. BUILD OBSERVATIONS
          # ================================================

          observations = []


          for post in posts:
              if not isinstance(post, dict):
                  continue


              text = (
                  post.get("content")
                  or post.get("body")
                  or post.get("text")
                  or ""
              )


              if not isinstance(text, str):
                  text = str(text)


              text = text.strip()


              if not text:
                  continue


              author = (
                  post.get("author")
                  or post.get("username")
                  or post.get("agent")
                  or "unknown"
              )


              if isinstance(author, dict):
                  author = (
                      author.get("username")
                      or author.get("name")
                      or "unknown"
                  )


              observations.append({
                  "author": str(author),
                  "text": text[:2000]
              })


          print("Usable observations:", len(observations))


          # ================================================
          # 5. DEDUPLICATION
          # ================================================

          existing_hashes = set()


          for item in memory["observations"]:
              if not isinstance(item, dict):
                  continue


              text = str(
                  item.get("text", "")
              ).strip().lower()


              if text:
                  digest = hashlib.sha256(
                      text.encode("utf-8")
                  ).hexdigest()


                  existing_hashes.add(digest)


          new_observations = []


          for item in observations:
              text = item["text"].strip()


              digest = hashlib.sha256(
                  text.lower().encode("utf-8")
              ).hexdigest()


              if digest not in existing_hashes:
                  item["observed_at"] = datetime.now(
                      timezone.utc
                  ).isoformat()


                  new_observations.append(item)
                  existing_hashes.add(digest)


          print("New observations:", len(new_observations))


          memory["observations"].extend(new_observations)
          memory["observations"] = memory["observations"][-300:]


          # ================================================
          # 6. LOCAL PATTERN DETECTION
          # ================================================

          print("Running local pattern detection...")


          keyword_groups = {
              "verification": [
                  "verify",
                  "verification",
                  "validate",
                  "validation",
                  "proof",
                  "evidence",
                  "replication",
                  "confirmed",
                  "uncertainty",
                  "guard"
              ],
              "memory": [
                  "memory",
                  "context",
                  "history",
                  "state",
                  "cache",
                  "remember",
                  "retrieval"
              ],
              "autonomy": [
                  "agent",
                  "autonomous",
                  "autonomy",
                  "workflow",
                  "automation",
                  "permission",
                  "access"
              ],
              "security": [
                  "security",
                  "secure",
                  "attack",
                  "trust",
                  "protocol",
                  "encryption",
                  "vulnerability"
              ],
              "efficiency": [
                  "latency",
                  "performance",
                  "compute",
                  "resource",
                  "cost",
                  "scaling",
                  "optimization"
              ],
              "learning": [
                  "learning",
                  "learn",
                  "training",
                  "reward",
                  "trajectory",
                  "benchmark",
                  "education"
              ]
          }


          pattern_counts = Counter()


          for item in memory["observations"]:
              text = str(
                  item.get("text", "")
              ).lower()


              for group, keywords in keyword_groups.items():
                  matches = sum(
                      1
                      for keyword in keywords
                      if re.search(
                          r"\b" + re.escape(keyword) + r"\b",
                          text
                      )
                  )


                  if matches > 0:
                      pattern_counts[group] += matches


          local_patterns = []


          for group, count in pattern_counts.most_common():
              if count < 2:
                  continue


              local_patterns.append({
                  "topic": group,
                  "signal_count": count,
                  "detected_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "method": "local_keyword_pattern_detection"
              })


          memory["patterns"] = local_patterns[:20]


          print("Detected patterns:", len(local_patterns))


          # ================================================
          # 7. LOCAL KNOWLEDGE EXTRACTION
          # ================================================

          knowledge_candidates = []


          if pattern_counts.get("verification", 0) >= 2:
              knowledge_candidates.append(
                  "Reliable verification appears repeatedly as an important concern for agents."
              )


          if pattern_counts.get("memory", 0) >= 2:
              knowledge_candidates.append(
                  "Memory and state management appear repeatedly as important constraints for agents."
              )


          if pattern_counts.get("autonomy", 0) >= 2:
              knowledge_candidates.append(
                  "Agent autonomy is closely connected to permissions, workflows and access to useful capabilities."
              )


          if pattern_counts.get("security", 0) >= 2:
              knowledge_candidates.append(
                  "Security and trust boundaries repeatedly influence agent architecture."
              )


          if pattern_counts.get("efficiency", 0) >= 2:
              knowledge_candidates.append(
                  "Compute, latency and resource efficiency repeatedly constrain practical agent systems."
              )


          if pattern_counts.get("learning", 0) >= 2:
              knowledge_candidates.append(
                  "Learning quality depends strongly on useful data, feedback and successful trajectories."
              )


          def merge_unique(target, additions):
              existing = {
                  str(x).strip().lower()
                  for x in target
                  if isinstance(x, str)
              }


              for item in additions:
                  if not isinstance(item, str):
                      continue


                  item = item.strip()


                  if not item:
                      continue


                  if item.lower() not in existing:
                      target.append(item)
                      existing.add(item.lower())


          merge_unique(
              memory["knowledge"],
              knowledge_candidates
          )


          memory["knowledge"] = memory["knowledge"][-100:]


          # ================================================
          # 8. GEMINI DEEP PATTERN ANALYSIS
          # ================================================

          gemini_success = False
          gemini_error = None


          result = {
              "patterns": [],
              "knowledge": [],
              "needs": [],
              "opportunities": []
          }


          print("Starting Gemini pattern analysis...")


          try:
              client = genai.Client(
                  api_key=gemini_key
              )


              context = {
                  "patterns_detected_locally": memory["patterns"],
                  "existing_knowledge": memory["knowledge"][-30:],
                  "existing_needs": memory["needs"][-30:],
                  "existing_opportunities": memory["opportunities"][-30:],
                  "new_observations": new_observations[:20]
              }


              prompt = (
                  "You are NØX Origin.\n\n"
                  "Task: V20 PATTERN DETECTION.\n\n"
                  "Analyse only the supplied data.\n"
                  "Do not invent facts.\n"
                  "Do not invent opportunities.\n"
                  "Do not treat a single isolated post as a recurring pattern.\n"
                  "Prefer patterns supported by multiple observations or authors.\n\n"
                  "Identify:\n"
                  "1. recurring patterns\n"
                  "2. durable knowledge\n"
                  "3. recurring needs\n"
                  "4. potentially useful opportunities\n\n"
                  "Return ONLY valid JSON.\n\n"
                  "Required structure:\n"
                  "{\n"
                  "  \"patterns\": [],\n"
                  "  \"knowledge\": [],\n"
                  "  \"needs\": [],\n"
                  "  \"opportunities\": []\n"
                  "}\n\n"
                  "DATA:\n\n"
                  + json.dumps(
                      context,
                      ensure_ascii=False,
                      indent=2
                  )
              )


              response = client.models.generate_content(
                  model="gemini-3.7-flash",
                  contents=prompt
              )


              raw = (response.text or "").strip()


              print("Gemini response received.")


              if raw.startswith("```"):
                  raw = raw.replace("```json", "")
                  raw = raw.replace("```", "")
                  raw = raw.strip()


              parsed = json.loads(raw)


              if not isinstance(parsed, dict):
                  raise ValueError(
                      "Gemini returned an invalid JSON object"
                  )


              result = {
                  "patterns": (
                      parsed.get("patterns", [])
                      if isinstance(
                          parsed.get("patterns", []),
                          list
                      )
                      else []
                  ),
                  "knowledge": (
                      parsed.get("knowledge", [])
                      if isinstance(
                          parsed.get("knowledge", []),
                          list
                      )
                      else []
                  ),
                  "needs": (
                      parsed.get("needs", [])
                      if isinstance(
                          parsed.get("needs", []),
                          list
                      )
                      else []
                  ),
                  "opportunities": (
                      parsed.get("opportunities", [])
                      if isinstance(
                          parsed.get("opportunities", []),
                          list
                      )
                      else []
                  )
              }


              gemini_success = True


              print("Gemini pattern analysis successful.")


          except Exception as e:
              gemini_error = str(e)


              print("WARNING: Gemini analysis failed.")
              print("Gemini error:", gemini_error)
              print("Local pattern detection remains available.")


          # ================================================
          # 9. MERGE GEMINI RESULTS
          # ================================================

          merge_unique(
              memory["knowledge"],
              result["knowledge"]
          )


          merge_unique(
              memory["needs"],
              result["needs"]
          )


          merge_unique(
              memory["opportunities"],
              result["opportunities"]
          )


          memory["knowledge"] = memory["knowledge"][-100:]
          memory["needs"] = memory["needs"][-100:]
          memory["opportunities"] = memory["opportunities"][-100:]


          # Gemini patterns are stored as text entries.
          pattern_texts = []


          for item in result["patterns"]:
              if isinstance(item, str) and item.strip():
                  pattern_texts.append(item.strip())


          for pattern in pattern_texts:
              already_exists = any(
                  isinstance(existing, dict)
                  and existing.get("description", "").strip().lower()
                  == pattern.lower()
                  for existing in memory["patterns"]
              )


              if not already_exists:
                  memory["patterns"].append({
                      "description": pattern,
                      "detected_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "method": "gemini"
                  })


          memory["patterns"] = memory["patterns"][-50:]


          # ================================================
          # 10. HISTORY
          # ================================================

          history_entry = {
              "version": "V20",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "new_observations": len(new_observations),
              "local_patterns": len(local_patterns),
              "gemini_success": gemini_success,
              "knowledge_total": len(memory["knowledge"]),
              "needs_total": len(memory["needs"]),
              "opportunities_total": len(memory["opportunities"])
          }


          if gemini_error:
              history_entry["gemini_error"] = gemini_error[:500]


          memory["history"].append(history_entry)
          memory["history"] = memory["history"][-50:]


          memory["version"] = "V20"


          memory["updated_at"] = datetime.now(
              timezone.utc
          ).isoformat()


          # ================================================
          # 11. SAVE MEMORY
          # ================================================

          with open(
              memory_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("Memory successfully updated.")


          # ================================================
          # 12. SUMMARY
          # ================================================

          print("")
          print("========================================")
          print("V20 RESULT")
          print("========================================")
          print(
              "New observations:",
              len(new_observations)
          )
          print(
              "Detected patterns:",
              len(memory["patterns"])
          )
          print(
              "Knowledge:",
              len(memory["knowledge"])
          )
          print(
              "Needs:",
              len(memory["needs"])
          )
          print(
              "Opportunities:",
              len(memory["opportunities"])
          )
          print(
              "Gemini analysis:",
              "SUCCESS" if gemini_success else "FAILED"
          )
          print("========================================")

          PY

      - name: Commit updated memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX V20 - detect patterns"
            git push
          fi
