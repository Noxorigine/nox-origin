name: NØX Origin - Learning V11

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write

jobs:
  nox-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NØX Learning V11
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from collections import Counter

          MEMORY_FILE = "memory/nox_memory.json"
          LEARNING_FILE = "memory/nox_learning_v11.json"
          REPORT_FILE = "memory/nox_learning_v11_report.md"

          print("====================================")
          print("NØX ORIGIN - LEARNING V11")
          print("====================================")

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          if not os.path.exists(MEMORY_FILE):
              raise RuntimeError("NØX memory file not found.")

          with open(MEMORY_FILE, "r", encoding="utf-8") as f:
              memory = json.load(f)

          observations = memory.get("observations", [])
          decisions = memory.get("decisions", [])
          actions = memory.get("actions", [])
          learnings = memory.get("learnings", [])

          print(f"Observations: {len(observations)}")
          print(f"Decisions: {len(decisions)}")
          print(f"Actions: {len(actions)}")
          print(f"Existing learnings: {len(learnings)}")

          # --------------------------------------------------
          # 2. EXTRACT ACTIONS
          # --------------------------------------------------

          experiences = []

          for item in actions:
              if not isinstance(item, dict):
                  continue

              action = item.get("action", {})

              if not isinstance(action, dict):
                  action = {}

              title = action.get("title") or item.get("title")
              kind = action.get("kind") or item.get("kind")
              category = action.get("category") or item.get("category")

              # Possible result fields
              result = (
                  action.get("result")
                  or action.get("outcome")
                  or action.get("response")
                  or item.get("result")
                  or item.get("outcome")
                  or item.get("response")
              )

              # Possible evaluation fields
              evaluation = (
                  action.get("evaluation")
                  or action.get("assessment")
                  or item.get("evaluation")
                  or item.get("assessment")
              )

              # Possible score
              score = action.get("score")

              if score is None:
                  score = item.get("score")

              experiences.append({
                  "title": title,
                  "kind": kind,
                  "category": category,
                  "result": result,
                  "evaluation": evaluation,
                  "score": score
              })

          # --------------------------------------------------
          # 3. IDENTIFY REAL RESULTS
          # --------------------------------------------------

          with_results = []
          without_results = []

          for experience in experiences:

              has_result = (
                  experience["result"] is not None
                  and experience["result"] != ""
              )

              has_evaluation = (
                  experience["evaluation"] is not None
                  and experience["evaluation"] != ""
              )

              has_score = isinstance(
                  experience["score"],
                  (int, float)
              )

              if has_result or has_evaluation or has_score:
                  with_results.append(experience)
              else:
                  without_results.append(experience)

          # --------------------------------------------------
          # 4. CLASSIFY RESULTS
          # --------------------------------------------------

          success_words = {
              "success",
              "successful",
              "succeeded",
              "successfully",
              "positive",
              "good",
              "useful",
              "effective",
              "accepted",
              "replied",
              "response"
          }

          failure_words = {
              "failure",
              "failed",
              "error",
              "negative",
              "useless",
              "ineffective",
              "rejected",
              "denied"
          }

          result_classes = Counter()

          classified_experiences = []

          for experience in with_results:

              text_parts = []

              for field in [
                  experience["result"],
                  experience["evaluation"]
              ]:
                  if isinstance(field, str):
                      text_parts.append(field.lower())

              text = " ".join(text_parts)

              classification = "unknown"

              if any(word in text for word in failure_words):
                  classification = "failure"

              elif any(word in text for word in success_words):
                  classification = "success"

              elif isinstance(experience["score"], (int, float)):
                  if experience["score"] > 0:
                      classification = "positive_score"
                  elif experience["score"] < 0:
                      classification = "negative_score"
                  else:
                      classification = "neutral_score"

              result_classes[classification] += 1

              classified = dict(experience)
              classified["classification"] = classification

              classified_experiences.append(classified)

          # --------------------------------------------------
          # 5. BUILD LEARNING RECORDS
          # --------------------------------------------------

          learning_records = []

          for experience in classified_experiences:

              title = experience["title"] or "Unnamed action"

              result = experience["result"]
              evaluation = experience["evaluation"]
              classification = experience["classification"]

              if classification == "success":
                  lesson = (
                      f"Action '{title}' produced a potentially positive "
                      f"result. It may be worth repeating when the context "
                      f"is similar."
                  )

              elif classification == "failure":
                  lesson = (
                      f"Action '{title}' produced a potentially negative "
                      f"result. It should be reviewed before being repeated."
                  )

              elif classification in {
                  "positive_score",
                  "negative_score",
                  "neutral_score"
              }:
                  lesson = (
                      f"Action '{title}' has a recorded score of "
                      f"{experience['score']}. Future decisions should "
                      f"compare this result with similar actions."
                  )

              else:
                  lesson = (
                      f"Action '{title}' has a recorded result, but the "
                      f"available evidence is insufficient for a reliable "
                      f"success/failure conclusion."
                  )

              learning_records.append({
                  "created_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "action": title,
                  "kind": experience["kind"],
                  "category": experience["category"],
                  "result": result,
                  "evaluation": evaluation,
                  "classification": classification,
                  "lesson": lesson,
                  "confidence": (
                      "high"
                      if classification in {
                          "success",
                          "failure"
                      }
                      else "low"
                  )
              })

          # --------------------------------------------------
          # 6. BUILD LEARNING STATE
          # --------------------------------------------------

          learning_state = {
              "version": "V11",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source_memory": MEMORY_FILE,
              "statistics": {
                  "observations": len(observations),
                  "decisions": len(decisions),
                  "actions": len(actions),
                  "existing_learnings": len(learnings),
                  "actions_with_results": len(with_results),
                  "actions_without_results": len(without_results)
              },
              "result_classes": dict(result_classes),
              "learning_records": learning_records
          }

          # --------------------------------------------------
          # 7. SAVE LEARNING DATA
          # --------------------------------------------------

          os.makedirs("memory", exist_ok=True)

          with open(
              LEARNING_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  learning_state,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # --------------------------------------------------
          # 8. BUILD HUMAN-READABLE REPORT
          # --------------------------------------------------

          report = []

          report.append("# NØX ORIGIN — LEARNING V11 REPORT")
          report.append("")
          report.append(
              f"Generated: {learning_state['generated_at']}"
          )

          report.append("")
          report.append("## 1. Learning Overview")
          report.append("")
          report.append(
              f"- Observations: {len(observations)}"
          )
          report.append(
              f"- Decisions: {len(decisions)}"
          )
          report.append(
              f"- Actions: {len(actions)}"
          )
          report.append(
              f"- Actions with measurable result: {len(with_results)}"
          )
          report.append(
              f"- Actions without measurable result: "
              f"{len(without_results)}"
          )

          report.append("")
          report.append("## 2. Result Classification")
          report.append("")

          if result_classes:
              for classification, count in result_classes.most_common():
                  report.append(
                      f"- **{classification}** — {count}"
                  )
          else:
              report.append(
                  "- No measurable results available yet."
              )

          report.append("")
          report.append("## 3. Current Learning Signals")
          report.append("")

          if learning_records:
              for record in learning_records[:20]:

                  report.append(
                      f"### {record['action']}"
                  )

                  report.append(
                      f"- Classification: "
                      f"**{record['classification']}**"
                  )

                  report.append(
                      f"- Confidence: "
                      f"**{record['confidence']}**"
                  )

                  if record["result"] is not None:
                      report.append(
                          f"- Result: {record['result']}"
                      )

                  if record["evaluation"] is not None:
                      report.append(
                          f"- Evaluation: {record['evaluation']}"
                      )

                  report.append(
                      f"- Lesson: {record['lesson']}"
                  )

                  report.append("")

          else:
              report.append(
                  "NØX does not yet have enough result data "
                  "to establish reliable learning."
              )

          # --------------------------------------------------
          # 9. IMPORTANT SAFETY / QUALITY LIMITATION
          # --------------------------------------------------

          report.append("")
          report.append("## 4. Learning Integrity")
          report.append("")

          report.append(
              "V11 does NOT consider an action to be learned merely "
              "because the action was executed."
          )

          report.append("")
          report.append(
              "A reliable learning signal requires evidence linking:"
          )

          report.append("")
          report.append(
              "1. Observation"
          )
          report.append(
              "2. Decision"
          )
          report.append(
              "3. Action"
          )
          report.append(
              "4. Result"
          )
          report.append(
              "5. Evaluation"
          )
          report.append(
              "6. Future decision change"
          )

          report.append("")
          report.append(
              "Until these elements are connected, learning confidence "
              "must remain limited."
          )

          # --------------------------------------------------
          # 10. NEXT TARGET
          # --------------------------------------------------

          report.append("")
          report.append("## 5. Next Development Target")
          report.append("")

          if len(with_results) == 0:
              report.append(
                  "The next priority is to make NØX record measurable "
                  "results for its actions."
              )

          else:
              report.append(
                  "The next priority is to connect learning records "
                  "to future decisions and action selection."
              )

          report.append("")
          report.append(
              "V11 does not automatically change NØX behaviour."
          )

          report.append(
              "It prepares evidence that future intelligence layers "
              "can use to make better decisions."
          )

          # --------------------------------------------------
          # 11. SAVE REPORT
          # --------------------------------------------------

          with open(
              REPORT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(report))

          print()
          print("====================================")
          print("NØX LEARNING V11 COMPLETE")
          print("====================================")
          print(
              f"Learning file: {LEARNING_FILE}"
          )
          print(
              f"Report: {REPORT_FILE}"
          )
          print(
              f"Actions with results: {len(with_results)}"
          )
          print(
              f"Actions without results: {len(without_results)}"
          )

          PY

      - name: Save NØX learning
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_learning_v11.json
          git add memory/nox_learning_v11_report.md

          if git diff --cached --quiet; then
            echo "No learning changes to commit."
          else
            git commit -m "NØX: build learning model V11"
            git push
          fi
