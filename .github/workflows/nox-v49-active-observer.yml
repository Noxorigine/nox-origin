name: NØX Origin - V49 Active Observer

on:
workflow_dispatch:

permissions:
contents: write

jobs:
active-observer:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Run NØX V49
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python - <<'PY'
      import json
      import os
      import time
      import requests
      from pathlib import Path
      from datetime import datetime, timezone

      print("===================================")
      print("NØX ORIGIN V49")
      print("ACTIVE OBSERVER")
      print("===================================")

      now = datetime.now(timezone.utc).isoformat()

      memory_file = Path("nox_memory.json")
      report_file = Path("V49_ACTIVE_OBSERVATION.md")

      COLONY_API_BASE = "https://thecolony.ai/api/v1"
      GEMINI_URL = (
          "https://generativelanguage.googleapis.com/"
          "v1beta/interactions"
      )

      GEMINI_MODEL = "gemini-3.6-flash"

      FEED_LIMIT = 25

      # --------------------------------------------------
      # MEMORY
      # --------------------------------------------------

      if memory_file.exists():
          try:
              memory = json.loads(
                  memory_file.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception:
              memory = {}
      else:
          memory = {}

      if not isinstance(memory, dict):
          memory = {}

      memory.setdefault("question_log", [])
      memory.setdefault("source_log", [])
      memory.setdefault("knowledge_log", [])
      memory.setdefault("learning_log", [])
      memory.setdefault("observation_log", [])

      # --------------------------------------------------
      # ENVIRONMENT
      # --------------------------------------------------

      colony_api_key = os.environ.get(
          "COLONY_API_KEY"
      )

      gemini_api_key = os.environ.get(
          "GEMINI_API_KEY"
      )

      if not colony_api_key:
          raise RuntimeError(
              "COLONY_API_KEY secret is missing."
          )

      if not gemini_api_key:
          raise RuntimeError(
              "GEMINI_API_KEY secret is missing."
          )

      # --------------------------------------------------
      # COLONY AUTHENTICATION
      # --------------------------------------------------

      print("Authenticating with The Colony...")

      auth_response = requests.post(
          f"{COLONY_API_BASE}/auth/token",
          json={
              "api_key": colony_api_key
          },
          headers={
              "Content-Type": "application/json"
          },
          timeout=(15, 30)
      )

      print(
          "Colony authentication status:",
          auth_response.status_code
      )

      if auth_response.status_code != 200:
          raise RuntimeError(
              "The Colony authentication failed: "
              f"{auth_response.status_code} "
              f"{auth_response.text[:1500]}"
          )

      try:
          auth_data = auth_response.json()
      except ValueError:
          raise RuntimeError(
              "The Colony authentication response "
              "was not valid JSON."
          )

      token = auth_data.get(
          "access_token"
      )

      if not token:
          raise RuntimeError(
              "The Colony did not return an access token."
          )

      colony_headers = {
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json"
      }

      # --------------------------------------------------
      # VERIFY IDENTITY
      # --------------------------------------------------

      print("Verifying Colony identity...")

      me_response = requests.get(
          f"{COLONY_API_BASE}/users/me",
          headers=colony_headers,
          timeout=(15, 30)
      )

      print(
          "Colony identity status:",
          me_response.status_code
      )

      if me_response.status_code != 200:
          raise RuntimeError(
              "The Colony JWT was not accepted: "
              f"{me_response.status_code} "
              f"{me_response.text[:1500]}"
          )

      try:
          me_data = me_response.json()
      except ValueError:
          me_data = {}

      agent_name = (
          me_data.get("username")
          or me_data.get("name")
          or "NØX Origin"
      )

      print(
          "Authenticated agent:",
          agent_name
      )

      # --------------------------------------------------
      # FETCH COLONY FEED
      # --------------------------------------------------

      print("Observing The Colony...")
      print("Requesting personalized feed...")

      feed_response = requests.get(
          f"{COLONY_API_BASE}/feed/for-you",
          headers=colony_headers,
          params={
              "limit": FEED_LIMIT
          },
          timeout=(15, 45)
      )

      print(
          "Colony feed status:",
          feed_response.status_code
      )

      if feed_response.status_code != 200:
          raise RuntimeError(
              "The Colony feed request failed: "
              f"{feed_response.status_code} "
              f"{feed_response.text[:2000]}"
          )

      try:
          feed_data = feed_response.json()
      except ValueError:
          raise RuntimeError(
              "The Colony feed returned invalid JSON."
          )

      # --------------------------------------------------
      # NORMALIZE FEED
      # --------------------------------------------------

      raw_posts = []

      if isinstance(feed_data, list):

          raw_posts = feed_data

      elif isinstance(feed_data, dict):

          for key in (
              "posts",
              "items",
              "data",
              "results",
              "feed"
          ):

              value = feed_data.get(key)

              if isinstance(value, list):
                  raw_posts = value
                  break

      print(
          "Feed items received:",
          len(raw_posts)
      )

      # --------------------------------------------------
      # NORMALIZE POSTS
      # --------------------------------------------------

      posts = []

      for item in raw_posts:

          if not isinstance(item, dict):
              continue

          post_id = (
              item.get("id")
              or item.get("post_id")
              or item.get("uuid")
          )

          title = (
              item.get("title")
              or item.get("name")
              or ""
          )

          content = (
              item.get("content")
              or item.get("body")
              or item.get("text")
              or ""
          )

          author = item.get("author")

          if isinstance(author, dict):

              author_name = (
                  author.get("username")
                  or author.get("name")
                  or author.get("handle")
                  or "unknown"
              )

          else:

              author_name = (
                  str(author)
                  if author
                  else (
                      item.get(
                          "author_username"
                      )
                      or "unknown"
                  )
              )

          colony = (
              item.get("colony")
              or item.get("category")
              or item.get("topic")
              or "unknown"
          )

          created_at = (
              item.get("created_at")
              or item.get("published_at")
              or item.get("createdAt")
              or ""
          )

          if not title and not content:
              continue

          posts.append({
              "id": (
                  str(post_id)
                  if post_id is not None
                  else ""
              ),
              "title": str(title).strip(),
              "content": str(content).strip(),
              "author": str(author_name).strip(),
              "colony": str(colony).strip(),
              "created_at": str(created_at).strip()
          })

      print(
          "Usable posts:",
          len(posts)
      )

      if not posts:

          print("Feed response preview:")
          print(
              json.dumps(
                  feed_data,
                  ensure_ascii=False,
                  indent=2
              )[:5000]
          )

          raise RuntimeError(
              "No usable Colony posts were found."
          )

      # --------------------------------------------------
      # PREPARE OBSERVATION DATA
      # --------------------------------------------------

      observation_posts = []

      for post in posts:

          content = post["content"]

          if len(content) > 2500:

              content = (
                  content[:2500]
                  + "..."
              )

          observation_posts.append({
              "id": post["id"],
              "title": post["title"],
              "content": content,
              "author": post["author"],
              "colony": post["colony"],
              "created_at": post["created_at"]
          })

      # --------------------------------------------------
      # PREVIOUS OBSERVATIONS
      # --------------------------------------------------

      previous_observations = []

      for item in memory.get(
          "observation_log",
          []
      ):

          if isinstance(item, dict):
              previous_observations.append(item)

      previous_context = []

      for observation in previous_observations[-10:]:

          previous_context.append({
              "subject": observation.get(
                  "subject",
                  ""
              ),
              "type": observation.get(
                  "type",
                  ""
              ),
              "importance": observation.get(
                  "importance",
                  0
              )
          })

      # --------------------------------------------------
      # GEMINI REQUEST
      # --------------------------------------------------

      gemini_headers = {
          "Content-Type": "application/json",
          "x-goog-api-key": gemini_api_key
      }

      def gemini_request(prompt):

          for attempt in range(1, 4):

              try:

                  response = requests.post(
                      GEMINI_URL,
                      headers=gemini_headers,
                      json={
                          "model": GEMINI_MODEL,
                          "input": prompt
                      },
                      timeout=(20, 120)
                  )

                  print(
                      "Gemini status:",
                      response.status_code
                  )

                  if response.status_code == 200:
                      return response.json()

                  if response.status_code == 429:

                      raise RuntimeError(
                          "Gemini free quota/rate limit "
                          "reached. No paid service will "
                          "be activated."
                      )

                  if response.status_code in (
                      408,
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt < 3:

                          print(
                              "Temporary Gemini error. "
                              "Retrying..."
                          )

                          time.sleep(
                              attempt * 5
                          )

                          continue

                  raise RuntimeError(
                      "Gemini request failed: "
                      f"{response.status_code} "
                      f"{response.text[:2000]}"
                  )

              except requests.exceptions.Timeout:

                  if attempt < 3:

                      print(
                          "Gemini timeout. Retrying..."
                      )

                      time.sleep(
                          attempt * 5
                      )

                      continue

                  raise RuntimeError(
                      "Gemini request timed out."
                  )

      # --------------------------------------------------
      # ACTIVE OBSERVATION PROMPT
      # --------------------------------------------------

      prompt = f"""

You are NØX Origin, an experimental AI agent
observing The Colony.

Your role in V49 is ACTIVE OBSERVATION.

You do not act.

You observe.

You compare.

You identify patterns.

You prepare knowledge for possible future action.

STRICT SAFETY RULES:

- Do not invent facts.
- Do not invent post IDs.
- Do not fabricate conversations.
- Do not pretend to know information absent from the feed.
- Do not answer users.
- Do not publish anything.
- Do not comment.
- Do not vote.
- Do not follow anyone.
- Do not send DMs.
- Do not make purchases.
- Do not spend money.
- Do not execute external actions.

Analyze ONLY the supplied Colony feed.

Look for:

1. recurring needs among AI agents
2. recurring technical problems
3. requests for help
4. collaboration opportunities
5. useful ideas
6. emerging patterns
7. potentially useful tasks
8. unmet needs
9. disagreements or uncertainty
10. subjects that NØX should investigate later

For every important observation:

- describe what was actually observed
- use only supporting post IDs present in the feed
- distinguish direct observation from inference
- assign an importance score from 0.0 to 1.0
- state whether follow-up is justified

Evidence rules:

- Never invent a post ID.
- Empty evidence is acceptable when appropriate.
- Do not treat absence of evidence as evidence.
- Weak evidence must be marked inferred.
- Prefer fewer strong observations over many weak observations.
- Do not turn speculation into fact.

Previous observations:

{json.dumps(
previous_context,
ensure_ascii=False,
indent=2
)}

Current Colony feed:

{json.dumps(
observation_posts,
ensure_ascii=False,
indent=2
)}

Return ONLY valid JSON.

Required format:

{{
"observations": [
{{
"type": "need|problem|opportunity|idea|pattern|task|uncertainty|other",
"subject": "short subject",
"description": "what was actually observed",
"evidence_post_ids": ["id1", "id2"],
"observation_level": "direct|inferred",
"importance": 0.0,
"follow_up": true
}}
],
"overall_summary": "short evidence-based summary",
"next_focus": [
"subject to investigate later"
]
}}
"""

      print(
          "Starting NØX active observation..."
      )

      gemini_result = gemini_request(
          prompt
      )

      # --------------------------------------------------
      # EXTRACT GEMINI TEXT
      # --------------------------------------------------

      def extract_text(result):

          if isinstance(
              result.get("output_text"),
              str
          ):

              return result[
                  "output_text"
              ].strip()

          text_parts = []

          for step in result.get(
              "steps",
              []
          ):

              if not isinstance(
                  step,
                  dict
              ):
                  continue

              if step.get(
                  "type"
              ) != "model_output":
                  continue

              for part in step.get(
                  "content",
                  []
              ):

                  if (
                      isinstance(part, dict)
                      and part.get("type") == "text"
                  ):

                      text_parts.append(
                          str(
                              part.get(
                                  "text",
                                  ""
                              )
                          )
                      )

          return "\n".join(
              text_parts
          ).strip()

      raw_text = extract_text(
          gemini_result
      )

      if not raw_text:

          raise RuntimeError(
              "Gemini returned empty observation."
          )

      # --------------------------------------------------
      # CLEAN JSON
      # --------------------------------------------------

      raw_text = raw_text.strip()

      if raw_text.startswith(
          "```json"
      ):

          raw_text = raw_text[
              7:
          ].strip()

      elif raw_text.startswith(
          "```"
      ):

          raw_text = raw_text[
              3:
          ].strip()

      if raw_text.endswith(
          "```"
      ):

          raw_text = raw_text[
              :-3
          ].strip()

      # --------------------------------------------------
      # PARSE OBSERVATION
      # --------------------------------------------------

      try:

          analysis = json.loads(
              raw_text
          )

      except json.JSONDecodeError as exc:

          print(
              "Gemini raw response:"
          )

          print(
              raw_text[:5000]
          )

          raise RuntimeError(
              "Gemini returned invalid JSON: "
              f"{exc}"
          )

      if not isinstance(
          analysis,
          dict
      ):

          raise RuntimeError(
              "Gemini observation is not a JSON object."
          )

      observations = analysis.get(
          "observations",
          []
      )

      if not isinstance(
          observations,
          list
      ):

          observations = []

      # --------------------------------------------------
      # VALIDATION
      # --------------------------------------------------

      allowed_types = {
          "need",
          "problem",
          "opportunity",
          "idea",
          "pattern",
          "task",
          "uncertainty",
          "other"
      }

      allowed_levels = {
          "direct",
          "inferred"
      }

      valid_post_ids = {
          post["id"]
          for post in posts
          if post["id"]
      }

      valid_observations = []

      for observation in observations:

          if not isinstance(
              observation,
              dict
          ):
              continue

          subject = str(
              observation.get(
                  "subject",
                  ""
              )
          ).strip()

          description = str(
              observation.get(
                  "description",
                  ""
              )
          ).strip()

          if not subject or not description:
              continue

          observation_type = observation.get(
              "type",
              "other"
          )

          if observation_type not in allowed_types:
              observation_type = "other"

          observation_level = observation.get(
              "observation_level",
              "inferred"
          )

          if observation_level not in allowed_levels:
              observation_level = "inferred"

          try:

              importance = float(
                  observation.get(
                      "importance",
                      0.0
                  )
              )

          except (
              TypeError,
              ValueError
          ):

              importance = 0.0

          importance = max(
              0.0,
              min(
                  1.0,
                  importance
              )
          )

          evidence_ids = observation.get(
              "evidence_post_ids",
              []
          )

          if not isinstance(
              evidence_ids,
              list
          ):

              evidence_ids = []

          evidence_ids = [
              str(post_id)
              for post_id in evidence_ids
              if str(post_id)
              in valid_post_ids
          ]

          follow_up = bool(
              observation.get(
                  "follow_up",
                  False
              )
          )

          valid_observations.append({
              "type": observation_type,
              "subject": subject,
              "description": description,
              "evidence_post_ids": evidence_ids,
              "observation_level": observation_level,
              "importance": round(
                  importance,
                  3
              ),
              "follow_up": follow_up
          })

      print(
          "Valid observations:",
          len(valid_observations)
      )

      # --------------------------------------------------
      # STORE OBSERVATION MEMORY
      # --------------------------------------------------

      overall_summary = str(
          analysis.get(
              "overall_summary",
              ""
          )
      ).strip()

      next_focus = analysis.get(
          "next_focus",
          []
      )

      if not isinstance(
          next_focus,
          list
      ):

          next_focus = []

      next_focus = [
          str(item).strip()
          for item in next_focus
          if str(item).strip()
      ]

      observation_record = {
          "timestamp": now,
          "version": "V49",
          "mode": "active_observer",
          "agent": agent_name,
          "posts_observed": len(posts),
          "observations": valid_observations,
          "overall_summary": overall_summary,
          "next_focus": next_focus
      }

      memory["observation_log"].append(
          observation_record
      )

      memory["learning_log"].append({
          "timestamp": now,
          "version": "V49",
          "lesson": (
              "NØX must observe Colony activity "
              "before considering future action."
          ),
          "principle": (
              "Observation must remain separate "
              "from execution."
          )
      })

      memory["version"] = "V49"
      memory["last_updated"] = now

      memory_file.write_text(
          json.dumps(
              memory,
              indent=2,
              ensure_ascii=False
          ),
          encoding="utf-8"
      )

      # --------------------------------------------------
      # RELOAD TEST
      # --------------------------------------------------

      reloaded = json.loads(
          memory_file.read_text(
              encoding="utf-8"
          )
      )

      if not reloaded.get(
          "observation_log"
      ):

          raise RuntimeError(
              "Memory persistence check failed."
          )

      print(
          "Memory persistence: PASS"
      )

      # --------------------------------------------------
      # REPORT
      # --------------------------------------------------

      report_lines = [
          "# NØX Origin — V49 Active Observer",
          "",
          f"Generated: {now}",
          "",
          f"Agent: {agent_name}",
          "",
          "## Mission",
          "",
          "V49 observes The Colony before any "
          "future action is considered.",
          "",
          "NØX does not automatically publish, "
          "comment, vote, follow, DM, purchase "
          "or spend money.",
          "",
          "## Observation Statistics",
          "",
          f"- Posts observed: {len(posts)}",
          f"- Valid observations: "
          f"{len(valid_observations)}",
          "",
          "## Overall Summary",
          "",
          overall_summary,
          "",
          "## Observations",
          ""
      ]

      for number, observation in enumerate(
          valid_observations,
          start=1
      ):

          evidence = observation[
              "evidence_post_ids"
          ]

          evidence_text = (
              ", ".join(evidence)
              if evidence
              else "none"
          )

          follow_up_text = (
              "YES"
              if observation["follow_up"]
              else "NO"
          )

          report_lines.extend([
              f"### Observation {number}",
              "",
              f"**Type:** "
              f"{observation['type']}",
              "",
              f"**Subject:** "
              f"{observation['subject']}",
              "",
              f"**Description:** "
              f"{observation['description']}",
              "",
              f"**Level:** "
              f"{observation['observation_level']}",
              "",
              f"**Importance:** "
              f"{observation['importance']:.3f}",
              "",
              f"**Evidence post IDs:** "
              f"{evidence_text}",
              "",
              f"**Follow-up:** "
              f"{follow_up_text}",
              ""
          ])

      report_lines.extend([
          "## Next Focus",
          ""
      ])

      if next_focus:

          for item in next_focus:

              report_lines.append(
                  f"- {item}"
              )

      else:

          report_lines.append(
              "- No next focus identified."
          )

      report_lines.extend([
          "",
          "## Safety Boundary",
          "",
          "- Automatic publication: NO",
          "- Automatic comments: NO",
          "- Automatic voting: NO",
          "- Automatic follows: NO",
          "- Automatic DMs: NO",
          "- Automatic purchases: NO",
          "- Automatic spending: NO",
          "- External actions: NO",
          "",
          "## V49 Principle",
          "",
          "NØX observes before acting.",
          "",
          "NØX separates direct observation "
          "from inference.",
          "",
          "Evidence must come from the observed "
          "Colony feed.",
          "",
          "The purpose of V49 is to build an "
          "evidence-based observation layer "
          "before future autonomous capabilities."
      ])

      report_file.write_text(
          "\n".join(report_lines),
          encoding="utf-8"
      )

      # --------------------------------------------------
      # FINAL OUTPUT
      # --------------------------------------------------

      print("===================================")
      print("V49 COMPLETE")
      print("===================================")
      print(
          "Posts observed:",
          len(posts)
      )
      print(
          "Observations created:",
          len(valid_observations)
      )
      print(
          "Colony authentication: PASS"
      )
      print(
          "Colony feed: PASS"
      )
      print(
          "Gemini observation: PASS"
      )
      print(
          "Evidence validation: PASS"
      )
      print(
          "Memory persistence: PASS"
      )
      print(
          "Automatic publication: DISABLED"
      )
      print(
          "Automatic spending: DISABLED"
      )
      print(
          "External actions: DISABLED"
      )
      print("===================================")

      PY

  - name: Commit V49 results
    run: |
      git config user.name "NØX Origin"
      git config user.email "nox-origin@users.noreply.github.com"

      git add nox_memory.json V49_ACTIVE_OBSERVATION.md

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "NØX V49 - Active Observer"
        git push
      fi
