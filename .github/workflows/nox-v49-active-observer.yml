name: NØX Origin - V49 Active Observer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  active-observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V49
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V49")
          print("ACTIVE OBSERVER")
          print("NO GEMINI")
          print("===================================")

          # --------------------------------------------------
          # CONFIGURATION
          # --------------------------------------------------

          API_BASE = "https://thecolony.ai/api/v1"
          FEED_LIMIT = 25

          memory_file = Path("nox_memory.json")
          report_file = Path("V49_ACTIVE_OBSERVATION.md")

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------

          colony_api_key = os.environ.get("COLONY_API_KEY")

          if not colony_api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing."
              )

          print("Environment: PASS")

          # --------------------------------------------------
          # LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      "Existing memory could not be loaded:",
                      exc
                  )
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("question_log", [])
          memory.setdefault("source_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("observation_log", [])

          print("Memory loaded: PASS")

          # --------------------------------------------------
          # COLONY AUTHENTICATION
          # --------------------------------------------------

          print("Authenticating with The Colony...")

          auth_response = requests.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": colony_api_key
              },
              headers={
                  "Content-Type": "application/json"
              },
              timeout=(15, 30)
          )

          print(
              "Colony authentication status:",
              auth_response.status_code
          )

          if auth_response.status_code != 200:
              raise RuntimeError(
                  "The Colony authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:1500]}"
              )

          try:
              auth_data = auth_response.json()
          except ValueError:
              raise RuntimeError(
                  "The Colony returned invalid authentication JSON."
              )

          token = auth_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "The Colony did not return an access_token."
              )

          colony_headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Colony authentication: PASS")

          # --------------------------------------------------
          # VERIFY IDENTITY
          # --------------------------------------------------

          print("Verifying NØX identity...")

          me_response = requests.get(
              f"{API_BASE}/users/me",
              headers=colony_headers,
              timeout=(15, 30)
          )

          print(
              "Colony identity status:",
              me_response.status_code
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  "Colony identity verification failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text[:1500]}"
              )

          try:
              me_data = me_response.json()
          except ValueError:
              me_data = {}

          agent_name = (
              me_data.get("username")
              or me_data.get("name")
              or "unknown"
          )

          print(
              "Authenticated agent:",
              agent_name
          )

          # --------------------------------------------------
          # FETCH PERSONALIZED FEED
          # --------------------------------------------------

          print("Observing The Colony...")
          print("Feed: for-you")

          feed_response = requests.get(
              f"{API_BASE}/feed/for-you",
              headers=colony_headers,
              params={
                  "limit": FEED_LIMIT
              },
              timeout=(15, 45)
          )

          print(
              "Colony feed status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  "Colony feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:2000]}"
              )

          try:
              feed_data = feed_response.json()
          except ValueError:
              raise RuntimeError(
                  "Colony feed returned invalid JSON."
              )

          # --------------------------------------------------
          # NORMALIZE FEED
          # --------------------------------------------------

          raw_posts = []

          if isinstance(feed_data, list):
              raw_posts = feed_data

          elif isinstance(feed_data, dict):

              for key in (
                  "posts",
                  "items",
                  "data",
                  "results",
                  "feed"
              ):
                  value = feed_data.get(key)

                  if isinstance(value, list):
                      raw_posts = value
                      break

          print(
              "Feed items received:",
              len(raw_posts)
          )

          # --------------------------------------------------
          # NORMALIZE POSTS
          # --------------------------------------------------

          posts = []

          for item in raw_posts:

              if not isinstance(item, dict):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              title = (
                  item.get("title")
                  or item.get("name")
                  or ""
              )

              content = (
                  item.get("content")
                  or item.get("body")
                  or item.get("text")
                  or ""
              )

              author = item.get("author")

              if isinstance(author, dict):

                  author_name = (
                      author.get("username")
                      or author.get("name")
                      or author.get("handle")
                      or "unknown"
                  )

              else:

                  author_name = (
                      str(author)
                      if author
                      else (
                          item.get("author_username")
                          or "unknown"
                      )
                  )

              colony = (
                  item.get("colony")
                  or item.get("category")
                  or item.get("topic")
                  or "unknown"
              )

              created_at = (
                  item.get("created_at")
                  or item.get("published_at")
                  or item.get("createdAt")
                  or ""
              )

              title = str(title).strip()
              content = str(content).strip()

              if not title and not content:
                  continue

              posts.append(
                  {
                      "id": (
                          str(post_id)
                          if post_id is not None
                          else ""
                      ),
                      "title": title,
                      "content": content,
                      "author": str(
                          author_name
                      ).strip(),
                      "colony": str(
                          colony
                      ).strip(),
                      "created_at": str(
                          created_at
                      ).strip()
                  }
              )

          print(
              "Usable posts:",
              len(posts)
          )

          if not posts:
              raise RuntimeError(
                  "No usable Colony posts found."
              )

          # --------------------------------------------------
          # KEYWORD OBSERVATION ENGINE
          # --------------------------------------------------

          categories = {

              "need": [
                  "need",
                  "needs",
                  "looking for",
                  "looking",
                  "help",
                  "require",
                  "requires",
                  "requirement",
                  "want",
                  "wanted",
                  "seeking",
                  "cherche",
                  "besoin",
                  "aide",
                  "recherche"
              ],

              "problem": [
                  "error",
                  "errors",
                  "bug",
                  "bugs",
                  "failed",
                  "failure",
                  "problem",
                  "problems",
                  "issue",
                  "issues",
                  "broken",
                  "cannot",
                  "can't",
                  "unable",
                  "blocked",
                  "block",
                  "erreur",
                  "problème",
                  "bloqué"
              ],

              "opportunity": [
                  "collaborate",
                  "collaboration",
                  "partner",
                  "partnership",
                  "opportunity",
                  "together",
                  "join",
                  "build together",
                  "collaboration"
              ],

              "technical": [
                  "api",
                  "github",
                  "python",
                  "code",
                  "coding",
                  "agent",
                  "automation",
                  "workflow",
                  "token",
                  "authentication",
                  "memory",
                  "database",
                  "server",
                  "endpoint",
                  "software",
                  "model"
              ],

              "idea": [
                  "idea",
                  "ideas",
                  "proposal",
                  "propose",
                  "could build",
                  "should build",
                  "new project",
                  "concept",
                  "suggestion",
                  "idée",
                  "projet"
              ],

              "task": [
                  "task",
                  "tasks",
                  "job",
                  "jobs",
                  "work",
                  "marketplace",
                  "bounty",
                  "gig",
                  "earn",
                  "earning"
              ],

              "uncertainty": [
                  "maybe",
                  "perhaps",
                  "not sure",
                  "uncertain",
                  "unsure",
                  "wonder",
                  "question",
                  "does anyone know",
                  "could someone",
                  "je ne sais",
                  "question"
              ]
          }

          # --------------------------------------------------
          # TOKEN NORMALIZATION
          # --------------------------------------------------

          def normalize(text):

              text = str(text).lower()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # --------------------------------------------------
          # CLASSIFY POSTS
          # --------------------------------------------------

          classified_posts = []

          for post in posts:

              combined = normalize(
                  post["title"]
                  + " "
                  + post["content"]
              )

              matches = {}

              for category, keywords in categories.items():

                  found = []

                  for keyword in keywords:

                      if keyword in combined:
                          found.append(keyword)

                  if found:
                      matches[category] = sorted(
                          set(found)
                      )

              classified_posts.append(
                  {
                      **post,
                      "matches": matches
                  }
              )

          # --------------------------------------------------
          # BUILD OBSERVATIONS
          # --------------------------------------------------

          observations = []

          for category in categories:

              matching_posts = [
                  post
                  for post in classified_posts
                  if category in post["matches"]
              ]

              if not matching_posts:
                  continue

              post_ids = [
                  post["id"]
                  for post in matching_posts
                  if post["id"]
              ]

              authors = sorted(
                  set(
                      post["author"]
                      for post in matching_posts
                      if post["author"]
                  )
              )

              matched_keywords = sorted(
                  set(
                      keyword
                      for post in matching_posts
                      for keyword in post["matches"].get(
                          category,
                          []
                      )
                  )
              )

              post_count = len(matching_posts)
              author_count = len(authors)

              importance = 0.25

              if post_count >= 2:
                  importance += 0.20

              if post_count >= 4:
                  importance += 0.15

              if author_count >= 2:
                  importance += 0.15

              if author_count >= 4:
                  importance += 0.10

              if category in (
                  "need",
                  "problem",
                  "task"
              ):
                  importance += 0.05

              importance = min(
                  1.0,
                  round(
                      importance,
                      3
                  )
              )

              if post_count == 1:

                  observation_level = "direct"

                  subject = (
                      f"{category} signal detected"
                  )

                  description = (
                      f"NØX directly detected "
                      f"{category} language in "
                      f"one Colony post."
                  )

              else:

                  observation_level = "inferred"

                  subject = (
                      f"Recurring {category} signals"
                  )

                  description = (
                      f"NØX detected {post_count} "
                      f"Colony posts containing "
                      f"signals associated with "
                      f"{category}."
                  )

                  if author_count > 1:

                      description += (
                          f" The signals involve "
                          f"{author_count} different "
                          f"authors."
                      )

              observations.append(
                  {
                      "type": (
                          "pattern"
                          if post_count >= 2
                          else category
                      ),
                      "subject": subject,
                      "description": description,
                      "evidence_post_ids": post_ids,
                      "observation_level":
                          observation_level,
                      "importance":
                          importance,
                      "follow_up": (
                          post_count >= 2
                          or importance >= 0.55
                      ),
                      "signal_count":
                          post_count,
                      "author_count":
                          author_count,
                      "keywords":
                          matched_keywords
                  }
              )

          # --------------------------------------------------
          # RECURRING SUBJECTS BY KEYWORD
          # --------------------------------------------------

          keyword_counts = {}

          keyword_posts = {}

          for post in classified_posts:

              combined = normalize(
                  post["title"]
                  + " "
                  + post["content"]
              )

              for category, keywords in categories.items():

                  for keyword in keywords:

                      if keyword in combined:

                          keyword_counts[keyword] = (
                              keyword_counts.get(
                                  keyword,
                                  0
                              ) + 1
                          )

                          keyword_posts.setdefault(
                              keyword,
                              []
                          ).append(
                              post["id"]
                          )

          recurring_keywords = sorted(
              [
                  {
                      "keyword": keyword,
                      "count": count,
                      "post_ids": sorted(
                          set(
                              keyword_posts.get(
                                  keyword,
                                  []
                              )
                          )
                      )
                  }
                  for keyword, count
                  in keyword_counts.items()
                  if count >= 2
              ],
              key=lambda item: (
                  -item["count"],
                  item["keyword"]
              )
          )

          recurring_keywords = recurring_keywords[:15]

          # --------------------------------------------------
          # COMPARE WITH PREVIOUS MEMORY
          # --------------------------------------------------

          previous_observations = memory.get(
              "observation_log",
              []
          )

          if not isinstance(
              previous_observations,
              list
          ):
              previous_observations = []

          previous_subjects = set()

          for old in previous_observations:

              if not isinstance(old, dict):
                  continue

              subject = str(
                  old.get(
                      "subject",
                      ""
                  )
              ).strip().lower()

              if subject:
                  previous_subjects.add(subject)

          for observation in observations:

              subject_key = observation[
                  "subject"
              ].lower()

              if subject_key in previous_subjects:

                  observation[
                      "historical_signal"
                  ] = "recurring"

              else:

                  observation[
                      "historical_signal"
                  ] = "new"

          # --------------------------------------------------
          # NEXT FOCUS
          # --------------------------------------------------

          next_focus = []

          important_observations = sorted(
              observations,
              key=lambda item: (
                  -item["importance"],
                  -item["signal_count"]
              )
          )

          for observation in important_observations[:5]:

              if observation["follow_up"]:

                  next_focus.append(
                      observation["subject"]
                  )

          for item in recurring_keywords[:5]:

              focus = (
                  f"Investigate recurring signal: "
                  f"{item['keyword']}"
              )

              if focus not in next_focus:
                  next_focus.append(focus)

          next_focus = next_focus[:8]

          # --------------------------------------------------
          # SUMMARY
          # --------------------------------------------------

          recurring_count = sum(
              1
              for observation in observations
              if observation[
                  "signal_count"
              ] >= 2
          )

          new_count = sum(
              1
              for observation in observations
              if observation.get(
                  "historical_signal"
              ) == "new"
          )

          historical_count = sum(
              1
              for observation in observations
              if observation.get(
                  "historical_signal"
              ) == "recurring"
          )

          if observations:

              overall_summary = (
                  f"NØX observed {len(posts)} Colony "
                  f"posts and detected "
                  f"{len(observations)} observation "
                  f"categories. "
                  f"{recurring_count} category signals "
                  f"were recurring within the current "
                  f"feed. "
                  f"{new_count} observations are new "
                  f"relative to stored observation "
                  f"subjects and "
                  f"{historical_count} match previous "
                  f"subjects."
              )

          else:

              overall_summary = (
                  "NØX observed the Colony feed but "
                  "did not detect sufficiently strong "
                  "keyword signals."
              )

          # --------------------------------------------------
          # STORE OBSERVATIONS
          # --------------------------------------------------

          observation_record = {
              "timestamp": now,
              "version": "V49",
              "mode": "active_observer",
              "agent": agent_name,
              "posts_observed": len(posts),
              "observations": observations,
              "recurring_keywords": recurring_keywords,
              "next_focus": next_focus
          }

          memory["observation_log"].append(
              observation_record
          )

          # Keep observation history bounded.
          memory["observation_log"] = (
              memory["observation_log"][-50:]
          )

          # --------------------------------------------------
          # LEARNING
          # --------------------------------------------------

          memory["learning_log"].append(
              {
                  "timestamp": now,
                  "version": "V49",
                  "lesson": (
                      "NØX can perform a first layer "
                      "of active Colony observation "
                      "without an external AI model."
                  ),
                  "principle": (
                      "Deterministic observation should "
                      "be established before introducing "
                      "external model dependency."
                  )
              }
          )

          memory["learning_log"] = (
              memory["learning_log"][-50:]
          )

          memory["version"] = "V49"
          memory["last_updated"] = now

          # --------------------------------------------------
          # WRITE MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # RELOAD TEST
          # --------------------------------------------------

          reloaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              reloaded,
              dict
          ):
              raise RuntimeError(
                  "Memory reload test failed."
              )

          if not reloaded.get(
              "observation_log"
          ):
              raise RuntimeError(
                  "Observation persistence test failed."
              )

          print("Memory persistence: PASS")

          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = []

          report.append(
              "# NØX Origin — V49 Active Observation"
          )

          report.append("")
          report.append(
              f"Generated: {now}"
          )

          report.append("")
          report.append(
              f"Agent: {agent_name}"
          )

          report.append("")
          report.append("## V49 Mission")
          report.append("")
          report.append(
              "V49 performs active observation of "
              "The Colony without Gemini or another "
              "external AI model."
          )

          report.append("")
          report.append(
              "NØX observes before acting."
          )

          report.append("")
          report.append(
              "NØX uses deterministic signals to identify "
              "possible needs, problems, opportunities, "
              "ideas, tasks and uncertainty."
          )

          report.append("")
          report.append(
              "No automatic publication or external action "
              "is performed."
          )

          report.append("")
          report.append("## Feed")
          report.append("")
          report.append(
              f"- Posts observed: {len(posts)}"
          )

          report.append("")
          report.append(
              f"- Observation categories: "
              f"{len(observations)}"
          )

          report.append("")
          report.append(
              f"- Recurring categories: "
              f"{recurring_count}"
          )

          report.append("")
          report.append(
              f"- New observation subjects: "
              f"{new_count}"
          )

          report.append("")
          report.append(
              f"- Historical observation subjects: "
              f"{historical_count}"
          )

          report.append("")
          report.append("## Overall Summary")
          report.append("")
          report.append(
              overall_summary
          )

          report.append("")
          report.append("## Observations")
          report.append("")

          if not observations:

              report.append(
                  "No observation reached the minimum "
                  "signal threshold."
              )

          else:

              for number, observation in enumerate(
                  important_observations,
                  start=1
              ):

                  report.append(
                      f"### Observation {number}"
                  )

                  report.append("")

                  report.append(
                      f"**Type:** "
                      f"{observation['type']}"
                  )

                  report.append("")

                  report.append(
                      f"**Subject:** "
                      f"{observation['subject']}"
                  )

                  report.append("")

                  report.append(
                      f"**Importance:** "
                      f"{observation['importance']:.3f}"
                  )

                  report.append("")

                  report.append(
                      f"**Observation level:** "
                      f"{observation['observation_level']}"
                  )

                  report.append("")

                  report.append(
                      f"**Historical signal:** "
                      f"{observation.get('historical_signal', 'unknown')}"
                  )

                  report.append("")

                  report.append(
                      f"**Signal count:** "
                      f"{observation['signal_count']}"
                  )

                  report.append("")

                  report.append(
                      f"**Author count:** "
                      f"{observation['author_count']}"
                  )

                  report.append("")

                  report.append(
                      f"**Follow-up:** "
                      f"{'YES' if observation['follow_up'] else 'NO'}"
                  )

                  report.append("")

                  report.append(
                      "**Description:**"
                  )

                  report.append("")

                  report.append(
                      observation["description"]
                  )

                  report.append("")

                  evidence = observation[
                      "evidence_post_ids"
                  ]

                  report.append(
                      "**Evidence post IDs:**"
                  )

                  report.append("")

                  if evidence:

                      for post_id in evidence:

                          report.append(
                              f"- {post_id}"
                          )

                  else:

                      report.append(
                          "- none"
                      )

                  report.append("")

                  keywords = observation.get(
                      "keywords",
                      []
                  )

                  report.append(
                      "**Detected signals:** "
                      + (
                          ", ".join(keywords)
                          if keywords
                          else "none"
                      )
                  )

                  report.append("")

          # --------------------------------------------------
          # RECURRING KEYWORDS
          # --------------------------------------------------

          report.append(
              "## Recurring Signals"
          )

          report.append("")

          if recurring_keywords:

              for item in recurring_keywords:

                  report.append(
                      f"- **{item['keyword']}** "
                      f"({item['count']} posts)"
                  )

                  if item["post_ids"]:

                      report.append(
                          "  - Evidence: "
                          + ", ".join(
                              item["post_ids"]
                          )
                      )

          else:

              report.append(
                  "No recurring keyword signal detected."
              )

          # --------------------------------------------------
          # NEXT FOCUS
          # --------------------------------------------------

          report.append("")
          report.append("## Next Focus")
          report.append("")

          if next_focus:

              for item in next_focus:

                  report.append(
                      f"- {item}"
                  )

          else:

              report.append(
                  "- No follow-up focus identified."
              )

          # --------------------------------------------------
          # OBSERVED POSTS
          # --------------------------------------------------

          report.append("")
          report.append("## Observed Posts")
          report.append("")

          for post in posts:

              report.append(
                  f"### Post {post['id'] or 'unknown'}"
              )

              report.append("")

              report.append(
                  f"**Title:** {post['title']}"
              )

              report.append("")

              report.append(
                  f"**Author:** {post['author']}"
              )

              report.append("")

              report.append(
                  f"**Colony:** {post['colony']}"
              )

              report.append("")

              content_preview = post[
                  "content"
              ]

              if len(content_preview) > 500:
                  content_preview = (
                      content_preview[:500]
                      + "..."
                  )

              report.append(
                  content_preview
              )

              report.append("")

          # --------------------------------------------------
          # SAFETY BOUNDARY
          # --------------------------------------------------

          report.append(
              "## Safety Boundary"
          )

          report.append("")

          report.append(
              "- Gemini: NOT USED"
          )

          report.append(
              "- Paid service: NOT USED"
          )

          report.append(
              "- Automatic publication: DISABLED"
          )

          report.append(
              "- Automatic comments: DISABLED"
          )

          report.append(
              "- Automatic voting: DISABLED"
          )

          report.append(
              "- Automatic follow: DISABLED"
          )

          report.append(
              "- Purchases: DISABLED"
          )

          report.append(
              "- Spending: DISABLED"
          )

          report.append(
              "- External actions: DISABLED"
          )

          report.append("")

          report.append(
