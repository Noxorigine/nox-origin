name: NØX Origin - V49 Active Observer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  active-observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create V49 script
        shell: bash
        run: |
          cat > nox_v49.py <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          print("===================================")
          print("NØX ORIGIN V49")
          print("ACTIVE OBSERVER")
          print("===================================")


          # --------------------------------------------------
          # CONFIGURATION
          # --------------------------------------------------

          COLONY_API_BASE = "https://thecolony.ai/api/v1"
          GEMINI_MODEL = "gemini-3.7-flash"
          FEED_LIMIT = 25

          MEMORY_FILE = Path(
              "nox_memory/nox_memory_v49.json"
          )

          REPORT_FILE = Path(
              "V49_ACTIVE_OBSERVATION.md"
          )


          # --------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------

          colony_api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          gemini_api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not colony_api_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          if not gemini_api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )


          # --------------------------------------------------
          # COLONY AUTHENTICATION
          # --------------------------------------------------

          print("Authenticating with The Colony...")

          auth_response = requests.post(
              f"{COLONY_API_BASE}/auth/token",
              json={
                  "api_key": colony_api_key
              },
              headers={
                  "Content-Type": "application/json"
              },
              timeout=(15, 30),
          )

          print(
              f"Colony authentication status: "
              f"{auth_response.status_code}"
          )

          if auth_response.status_code != 200:
              raise RuntimeError(
                  "The Colony authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:1500]}"
              )

          try:
              auth_data = auth_response.json()
          except ValueError:
              raise RuntimeError(
                  "The Colony returned invalid JSON "
                  "during authentication."
              )

          token = auth_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "The Colony did not return an access_token."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }


          # --------------------------------------------------
          # VERIFY AUTHENTICATION
          # --------------------------------------------------

          print("Verifying Colony authentication...")

          me_response = requests.get(
              f"{COLONY_API_BASE}/users/me",
              headers=headers,
              timeout=(15, 30),
          )

          print(
              f"Colony identity status: "
              f"{me_response.status_code}"
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  "The Colony JWT was not accepted: "
                  f"{me_response.status_code} "
                  f"{me_response.text[:1500]}"
              )

          try:
              me_data = me_response.json()
          except ValueError:
              me_data = {}

          agent_name = (
              me_data.get("username")
              or me_data.get("name")
              or "unknown"
          )

          print(
              f"Authenticated agent: {agent_name}"
          )


          # --------------------------------------------------
          # LOAD PREVIOUS MEMORY
          # --------------------------------------------------

          previous_memory = {}

          if MEMORY_FILE.exists():
              try:
                  previous_memory = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
                  print("Previous V49 memory loaded.")
              except Exception as exc:
                  print(
                      "Previous V49 memory could not "
                      f"be loaded: {exc}"
                  )
                  previous_memory = {}
          else:
              print("No previous V49 memory found.")

          previous_observations = []

          if isinstance(previous_memory, dict):
              previous_observations = (
                  previous_memory.get(
                      "observations",
                      []
                  )
              )

              if not isinstance(
                  previous_observations,
                  list
              ):
                  previous_observations = []


          # --------------------------------------------------
          # FETCH PERSONALIZED COLONY FEED
          # --------------------------------------------------

          print("Observing The Colony...")
          print("Using personalized for-you feed...")

          feed_response = requests.get(
              f"{COLONY_API_BASE}/feed/for-you",
              headers=headers,
              params={
                  "limit": FEED_LIMIT
              },
              timeout=(15, 45),
          )

          print(
              f"Colony feed status: "
              f"{feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  "The Colony personalized feed "
                  "request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:2000]}"
              )

          try:
              feed_data = feed_response.json()
          except ValueError:
              raise RuntimeError(
                  "The Colony feed returned invalid JSON."
              )


          # --------------------------------------------------
          # NORMALIZE FEED
          # --------------------------------------------------

          raw_posts = []

          if isinstance(feed_data, list):
              raw_posts = feed_data

          elif isinstance(feed_data, dict):
              for key in (
                  "posts",
                  "items",
                  "data",
                  "results",
                  "feed",
              ):
                  value = feed_data.get(key)

                  if isinstance(value, list):
                      raw_posts = value
                      break

          print(
              f"Feed items received: {len(raw_posts)}"
          )

          if not raw_posts:
              print("Feed response preview:")
              print(
                  json.dumps(
                      feed_data,
                      ensure_ascii=False,
                      indent=2
                  )[:5000]
              )


          # --------------------------------------------------
          # NORMALIZE POSTS
          # --------------------------------------------------

          posts = []

          for item in raw_posts:

              if not isinstance(item, dict):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              title = (
                  item.get("title")
                  or item.get("name")
                  or ""
              )

              content = (
                  item.get("content")
                  or item.get("body")
                  or item.get("text")
                  or ""
              )

              author = item.get("author")

              if isinstance(author, dict):
                  author_name = (
                      author.get("username")
                      or author.get("name")
                      or author.get("handle")
                      or "unknown"
                  )
              else:
                  author_name = (
                      str(author)
                      if author
                      else (
                          item.get(
                              "author_username"
                          )
                          or "unknown"
                      )
                  )

              colony = (
                  item.get("colony")
                  or item.get("category")
                  or item.get("topic")
                  or "unknown"
              )

              created_at = (
                  item.get("created_at")
                  or item.get("published_at")
                  or item.get("createdAt")
                  or ""
              )

              if not title and not content:
                  continue

              posts.append(
                  {
                      "id": (
                          str(post_id)
                          if post_id is not None
                          else ""
                      ),
                      "title": str(title).strip(),
                      "content": str(content).strip(),
                      "author": str(author_name).strip(),
                      "colony": str(colony).strip(),
                      "created_at": str(
                          created_at
                      ).strip(),
                  }
              )

          print(
              f"Usable posts: {len(posts)}"
          )

          if not posts:
              raise RuntimeError(
                  "No usable Colony posts were "
                  "found in the personalized feed."
              )


          # --------------------------------------------------
          # PREPARE POSTS FOR GEMINI
          # --------------------------------------------------

          observation_posts = []

          for post in posts:

              content = post["content"]

              if len(content) > 3000:
                  content = (
                      content[:3000]
                      + "..."
                  )

              observation_posts.append(
                  {
                      "id": post["id"],
                      "title": post["title"],
                      "content": content,
                      "author": post["author"],
                      "colony": post["colony"],
                      "created_at": post["created_at"],
                  }
              )


          # --------------------------------------------------
          # PREVIOUS OBSERVATIONS
          # --------------------------------------------------

          previous_context = []

          for observation in previous_observations[-10:]:

              if not isinstance(
                  observation,
                  dict
              ):
                  continue

              previous_context.append(
                  {
                      "subject": observation.get(
                          "subject",
                          ""
                      ),
                      "type": observation.get(
                          "type",
                          ""
                      ),
                      "importance": observation.get(
                          "importance",
                          0
                      ),
                  }
              )


          # --------------------------------------------------
          # GEMINI PROMPT
          # --------------------------------------------------

          print(
              "Starting NØX active observation..."
          )

          previous_json = json.dumps(
              previous_context,
              ensure_ascii=False,
              indent=2
          )

          current_json = json.dumps(
              observation_posts,
              ensure_ascii=False,
              indent=2
          )

          prompt = f"""
          You are NØX Origin, an experimental AI agent
          observing The Colony.

          Your role in V49 is ACTIVE OBSERVATION.

          Do not pretend to know things that are not present
          in the supplied data.

          Do not invent facts.

          Do not fabricate conversations.

          Do not answer users.

          Do not make purchases.

          Do not spend money.

          Do not publish anything.

          Do not execute external actions.

          Your task is to observe, compare, identify patterns,
          and decide what deserves further attention.

          Analyze the supplied Colony feed.

          Look specifically for:

          1. recurring needs among AI agents
          2. recurring technical problems
          3. requests for help
          4. collaboration opportunities
          5. useful ideas
          6. emerging patterns
          7. potentially useful tasks
          8. signals of unmet needs
          9. disagreements or uncertainty
          10. subjects NØX should investigate later

          For every important observation:

          - describe what was actually observed
          - identify supporting post IDs
          - distinguish direct observation from inference
          - assign an importance score between 0.0 and 1.0
          - state whether the subject deserves follow-up

          Evidence rules:

          - Never invent a post ID.
          - Only use post IDs present in the supplied feed.
          - Do not treat absence of evidence as evidence.
          - If evidence is weak, mark the observation as inferred.
          - Prefer fewer strong observations over many weak ones.
          - Do not turn speculation into fact.

          Previous NØX observations:

          {previous_json}

          Current Colony observations:

          {current_json}

          Return ONLY valid JSON.

          Required format:

          {{
            "observations": [
              {{
                "type": "need|problem|opportunity|idea|pattern|task|uncertainty|other",
                "subject": "short subject",
                "description": "what NØX observed",
                "evidence_post_ids": ["id1", "id2"],
                "observation_level": "direct|inferred",
                "importance": 0.0,
                "follow_up": true
              }}
            ],
            "overall_summary": "short summary",
            "next_focus": [
              "subject to investigate"
            ]
          }}
          """


          # --------------------------------------------------
          # GEMINI REQUEST
          # --------------------------------------------------

          endpoint = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{GEMINI_MODEL}:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json"
              }
          }

          try:
              gemini_response = requests.post(
                  endpoint,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": gemini_api_key,
                  },
                  json=payload,
                  timeout=(15, 90),
              )
          except requests.RequestException as exc:
              raise RuntimeError(
                  "Gemini connection failed: "
                  f"{exc}"
              )

          print(
              f"Gemini model: {GEMINI_MODEL}"
          )

          print(
              f"Gemini status: "
              f"{gemini_response.status_code}"
          )

          if gemini_response.status_code == 429:
              raise RuntimeError(
                  "Gemini returned HTTP 429. "
                  "The free quota/rate limit was reached. "
                  "No paid service will be activated."
              )

          if gemini_response.status_code != 200:
              raise RuntimeError(
                  "Gemini request failed: "
                  f"{gemini_response.status_code} "
                  f"{gemini_response.text[:2000]}"
              )


          # --------------------------------------------------
          # READ GEMINI RESPONSE
          # --------------------------------------------------

          try:
              gemini_data = gemini_response.json()
          except ValueError:
              raise RuntimeError(
                  "Gemini returned invalid HTTP JSON."
              )

          try:
              candidates = gemini_data["candidates"]

              if not candidates:
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              content = candidates[0]["content"]
              parts = content["parts"]

              if not parts:
                  raise RuntimeError(
                      "Gemini returned no content parts."
                  )

              raw_text = parts[0]["text"]

          except (
              KeyError,
              IndexError,
              TypeError,
          ) as exc:

              print("Unexpected Gemini response:")

              print(
                  json.dumps(
                      gemini_data,
                      ensure_ascii=False,
                      indent=2
                  )[:5000]
              )

              raise RuntimeError(
                  "Unexpected Gemini response: "
                  f"{exc}"
              )


          # --------------------------------------------------
          # CLEAN POSSIBLE CODE FENCES
          # --------------------------------------------------

          raw_text = raw_text.strip()

          if raw_text.startswith("```json"):
              raw_text = raw_text[7:].strip()

          elif raw_text.startswith("```"):
              raw_text = raw_text[3:].strip()

          if raw_text.endswith("```"):
              raw_text = raw_text[:-3].strip()


          # --------------------------------------------------
          # PARSE ANALYSIS
          # --------------------------------------------------

          try:
              analysis = json.loads(raw_text)
          except json.JSONDecodeError as exc:

              print("Gemini raw response:")
              print(raw_text[:5000])

              raise RuntimeError(
                  "Gemini returned invalid "
                  f"analysis JSON: {exc}"
              )

          if not isinstance(analysis, dict):
              raise RuntimeError(
                  "Gemini analysis is not a JSON object."
              )


          observations = analysis.get(
              "observations",
              []
          )

          if not isinstance(
              observations,
              list
          ):
              observations = []


          # --------------------------------------------------
          # VALIDATE OBSERVATIONS
          # --------------------------------------------------

          valid_observations = []

          allowed_types = {
              "need",
              "problem",
              "opportunity",
              "idea",
              "pattern",
              "task",
              "uncertainty",
              "other",
          }

          allowed_levels = {
              "direct",
              "inferred",
          }

          valid_post_ids = {
              post["id"]
              for post in posts
              if post["id"]
          }

          for observation in observations:

              if not isinstance(
                  observation,
                  dict
              ):
                  continue

              subject = str(
                  observation.get(
                      "subject",
                      ""
                  )
              ).strip()

              description = str(
                  observation.get(
                      "description",
                      ""
                  )
              ).strip()

              if not subject or not description:
                  continue

              observation_type = observation.get(
                  "type",
                  "other"
              )

              if observation_type not in allowed_types:
                  observation_type = "other"

              observation_level = observation.get(
                  "observation_level",
                  "inferred"
              )

              if observation_level not in allowed_levels:
                  observation_level = "inferred"

              try:
                  importance = float(
                      observation.get(
                          "importance",
                          0.0
                      )
                  )
              except (
                  TypeError,
                  ValueError,
              ):
                  importance = 0.0

              importance = max(
                  0.0,
                  min(
                      1.0,
                      importance
                  )
              )

              evidence_ids = observation.get(
                  "evidence_post_ids",
                  []
              )

              if not isinstance(
                  evidence_ids,
                  list
              ):
                  evidence_ids = []

              evidence_ids = [
                  str(post_id)
                  for post_id in evidence_ids
                  if str(post_id) in valid_post_ids
              ]

              follow_up = bool(
                  observation.get(
                      "follow_up",
                      False
                  )
              )

              valid_observations.append(
                  {
                      "type": observation_type,
                      "subject": subject,
                      "description": description,
                      "evidence_post_ids": evidence_ids,
                      "observation_level": observation_level,
                      "importance": round(
                          importance,
                          3
                      ),
                      "follow_up": follow_up,
                  }
              )

          print(
              f"Valid observations: "
              f"{len(valid_observations)}"
          )


          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()

          memory_dir = Path("nox_memory")
          memory_dir.mkdir(exist_ok=True)

          next_focus = analysis.get(
              "next_focus",
              []
          )

          if not isinstance(
              next_focus,
              list
          ):
              next_focus = []

          next_focus = [
              str(item).strip()
              for item in next_focus
              if str(item).strip()
          ]

          overall_summary = str(
              analysis.get(
                  "overall_summary",
                  ""
              )
          ).strip()

          memory = {
              "version": "V49",
              "created_at": now,
              "mode": "active_observer",
              "agent": agent_name,
              "posts_observed": len(posts),
              "observations": valid_observations,
              "overall_summary": overall_summary,
              "next_focus": next_focus,
              "learning": {
                  "direct_observation_is_distinguished_from_inference": True,
                  "evidence_post_ids_are_validated": True,
                  "importance_is_bounded": True,
                  "follow_up_is_explicit": True,
                  "no_automatic_publication": True,
                  "no_automatic_spending": True,
                  "no_external_actions": True,
                  "personalized_colony_feed": True,
                  "active_colony_observation": True,
              },
              "last_updated": now,
          }

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V49 Active Observation",
              "",
              f"Generated: {now}",
              "",
              f"Agent: {agent_name}",
              "",
              "## Mission",
              "",
              "V49 transforms NØX into an active observer "
              "of The Colony.",
              "",
              "NØX observes before acting.",
              "",
              "NØX uses the personalized Colony feed.",
              "",
              "NØX distinguishes observation from inference.",
              "",
              "NØX does not publish automatically.",
              "",
              "NØX does not spend money.",
              "",
              "## Observation Summary",
              "",
              f"- Posts observed: {len(posts)}",
              f"- Valid observations: "
              f"{len(valid_observations)}",
              "",
              overall_summary,
              "",
              "## Observations",
              "",
          ]

          for number, observation in enumerate(
              valid_observations,
              start=1
          ):

              evidence_ids = observation[
                  "evidence_post_ids"
              ]

              evidence_text = (
                  ", ".join(evidence_ids)
                  if evidence_ids
                  else "none"
              )

              follow_up_text = (
                  "YES"
                  if observation["follow_up"]
                  else "NO"
              )

              report.extend(
                  [
                      f"### Observation {number}",
                      "",
                      f"**Type:** "
                      f"{observation['type']}",
                      "",
                      f"**Subject:** "
                      f"{observation['subject']}",
                      "",
                      f"**Importance:** "
                      f"{observation['importance']:.3f}",
                      "",
                      f"**Level:** "
                      f"{observation['observation_level']}",
                      "",
                      f"**Description:** "
                      f"{observation['description']}",
                      "",
                      f"**Evidence post IDs:** "
                      f"{evidence_text}",
                      "",
                      f"**Follow-up:** "
                      f"{follow_up_text}",
                      "",
                  ]
              )


          # --------------------------------------------------
          # NEXT FOCUS
          # --------------------------------------------------

          report.extend(
              [
                  "## Next Focus",
                  "",
              ]
          )

          if next_focus:
              for item in next_focus:
                  report.append(
                      f"- {item}"
                  )
          else:
              report.append(
                  "- No next focus identified."
              )


          # --------------------------------------------------
          # LEARNING
          # --------------------------------------------------

          report.extend(
              [
                  "",
                  "## V49 Learning",
                  "",
                  "NØX is learning to observe the environment "
                  "before deciding what deserves action.",
                  "",
                  "Observed facts and inferred patterns are "
                  "kept distinct.",
                  "",
                  "Evidence is linked to Colony post IDs.",
                  "",
                  "The personalized feed focuses NØX attention "
                  "on potentially relevant Colony activity.",
                  "",
                  "Important subjects can be marked for "
                  "future investigation.",
                  "",
                  "## Safety Boundary",
                  "",
                  "V49 does not automatically publish.",
                  "",
                  "V49 does not spend money.",
                  "",
                  "V49 does not execute external actions.",
                  "",
                  "The purpose of V49 is observation, "
                  "memory and preparation for later action.",
              ]
          )

          REPORT_FILE.write_text(
              "\n".join(report),
              encoding="utf-8"
          )


          # --------------------------------------------------
          # FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V49 ACTIVE OBSERVER RESULT")
          print("===================================")

          print(
              f"Posts observed: {len(posts)}"
          )

          print(
              f"Observations created: "
              f"{len(valid_observations)}"
          )

          print("Colony authentication: PASS")
          print("Personalized feed: PASS")
          print("Gemini analysis: PASS")
          print("Evidence validation: PASS")
          print("Memory written: PASS")
          print("Report written: PASS")
          print("Automatic publication: DISABLED")
          print("Automatic spending: DISABLED")
          print("===================================")
          PY

      - name: Run NØX V49
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python nox_v49.py

      - name: Commit V49 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            nox_memory/nox_memory_v49.json \
            V49_ACTIVE_OBSERVATION.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V49 - Active Observer"
            git push
          fi
