name: NØX Origin - V49 Active Observer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  active-observer:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V49
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V49")
          print("ACTIVE OBSERVER")
          print("NO GEMINI")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          COLONY_API_BASE = "https://thecolony.ai/api/v1"
          FEED_LIMIT = 25

          memory_file = Path("nox_memory.json")
          report_file = Path("V49_ACTIVE_OBSERVATION.md")

          # --------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------

          colony_api_key = os.environ.get("COLONY_API_KEY")

          if not colony_api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing."
              )

          print("Environment: PASS")

          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          if memory_file.exists():

              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  memory = {}

          else:

              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "question_log",
              []
          )

          memory.setdefault(
              "source_log",
              []
          )

          memory.setdefault(
              "knowledge_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []
          )

          memory.setdefault(
              "observation_log",
              []
          )

          print("Memory loaded: PASS")

          # --------------------------------------------------
          # COLONY AUTHENTICATION
          # --------------------------------------------------

          print(
              "Authenticating with The Colony..."
          )

          auth_response = requests.post(
              f"{COLONY_API_BASE}/auth/token",
              json={
                  "api_key": colony_api_key
              },
              headers={
                  "Content-Type": "application/json"
              },
              timeout=(15, 30)
          )

          print(
              "Colony authentication status:",
              auth_response.status_code
          )

          if auth_response.status_code != 200:

              raise RuntimeError(
                  "The Colony authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:1500]}"
              )

          try:

              auth_data = auth_response.json()

          except ValueError:

              raise RuntimeError(
                  "Invalid Colony authentication JSON."
              )

          token = auth_data.get(
              "access_token"
          )

          if not token:

              raise RuntimeError(
                  "No Colony access_token returned."
              )

          colony_headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # VERIFY IDENTITY
          # --------------------------------------------------

          print(
              "Verifying NØX identity..."
          )

          me_response = requests.get(
              f"{COLONY_API_BASE}/users/me",
              headers=colony_headers,
              timeout=(15, 30)
          )

          print(
              "Colony identity status:",
              me_response.status_code
          )

          if me_response.status_code != 200:

              raise RuntimeError(
                  "Identity verification failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text[:1500]}"
              )

          try:

              me_data = me_response.json()

          except ValueError:

              me_data = {}

          agent_name = (
              me_data.get("username")
              or me_data.get("name")
              or "unknown"
          )

          print(
              "Authenticated agent:",
              agent_name
          )

          # --------------------------------------------------
          # FETCH FEED
          # --------------------------------------------------

          print(
              "Observing The Colony..."
          )

          feed_response = requests.get(
              f"{COLONY_API_BASE}/feed/for-you",
              headers=colony_headers,
              params={
                  "limit": FEED_LIMIT
              },
              timeout=(15, 45)
          )

          print(
              "Colony feed status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:

              raise RuntimeError(
                  "Colony feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:2000]}"
              )

          try:

              feed_data = feed_response.json()

          except ValueError:

              raise RuntimeError(
                  "Colony feed returned invalid JSON."
              )

          print("Feed JSON: PASS")

          # --------------------------------------------------
          # FEED NORMALIZATION
          #
          # V49 FIX:
          # The Colony returns the posts under "items".
          # The previous parser assumed fields were directly
          # available in the first-level dictionary.
          #
          # This version recursively searches nested objects.
          # --------------------------------------------------

          raw_items = []

          if isinstance(feed_data, dict):

              value = feed_data.get("items")

              if isinstance(value, list):

                  raw_items = value

              else:

                  for key in (
                      "posts",
                      "results",
                      "data",
                      "feed"
                  ):

                      value = feed_data.get(key)

                      if isinstance(value, list):

                          raw_items = value
                          break

          elif isinstance(feed_data, list):

              raw_items = feed_data

          print(
              "Feed items received:",
              len(raw_items)
          )

          if not raw_items:

              raise RuntimeError(
                  "The Colony feed contains no items."
              )

          # --------------------------------------------------
          # HELPERS
          # --------------------------------------------------

          ID_KEYS = (
              "id",
              "post_id",
              "postId",
              "uuid",
              "post_uuid"
          )

          TITLE_KEYS = (
              "title",
              "headline",
              "subject"
          )

          TEXT_KEYS = (
              "content",
              "body",
              "text",
              "description",
              "message"
          )

          AUTHOR_KEYS = (
              "username",
              "handle",
              "name"
          )

          DATE_KEYS = (
              "created_at",
              "createdAt",
              "published_at",
              "publishedAt",
              "timestamp"
          )

          def first_string(
              obj,
              keys
          ):

              if not isinstance(obj, dict):
                  return ""

              for key in keys:

                  value = obj.get(key)

                  if isinstance(value, str):
                      value = value.strip()

                      if value:
                          return value

              return ""

          def find_post_candidate(
              obj,
              depth=0
          ):
              """
              Recursively search for the most likely post object.
              """

              if depth > 6:
                  return None

              if isinstance(obj, dict):

                  post_id = first_string(
                      obj,
                      ID_KEYS
                  )

                  title = first_string(
                      obj,
                      TITLE_KEYS
                  )

                  text = first_string(
                      obj,
                      TEXT_KEYS
                  )

                  score = 0

                  if post_id:
                      score += 3

                  if title:
                      score += 2

                  if text:
                      score += 3

                  if score >= 5:

                      return obj

                  for value in obj.values():

                      if isinstance(
                          value,
                          (dict, list)
                      ):

                          result = find_post_candidate(
                              value,
                              depth + 1
                          )

                          if result is not None:
                              return result

              elif isinstance(obj, list):

                  for value in obj:

                      result = find_post_candidate(
                          value,
                          depth + 1
                      )

                      if result is not None:
                          return result

              return None

          def extract_author(
              obj
          ):

              if not isinstance(obj, dict):
                  return "unknown"

              for key in (
                  "author",
                  "user",
                  "creator",
                  "agent",
                  "owner"
              ):

                  value = obj.get(key)

                  if isinstance(value, dict):

                      name = first_string(
                          value,
                          AUTHOR_KEYS
                      )

                      if name:
                          return name

                  elif isinstance(value, str):

                      value = value.strip()

                      if value:
                          return value

              direct = first_string(
                  obj,
                  (
                      "author_username",
                      "author_name",
                      "username"
                  )
              )

              return direct or "unknown"

          def extract_colony(
              obj
          ):

              if not isinstance(obj, dict):
                  return "unknown"

              for key in (
                  "colony",
                  "category",
                  "topic",
                  "community"
              ):

                  value = obj.get(key)

                  if isinstance(value, dict):

                      result = first_string(
                          value,
                          (
                              "name",
                              "title",
                              "slug"
                          )
                      )

                      if result:
                          return result

                  elif isinstance(value, str):

                      value = value.strip()

                      if value:
                          return value

              return "unknown"

          def extract_post(
              item
          ):

              candidate = find_post_candidate(
                  item
              )

              if candidate is None:
                  return None

              post_id = first_string(
                  candidate,
                  ID_KEYS
              )

              title = first_string(
                  candidate,
                  TITLE_KEYS
              )

              content = first_string(
                  candidate,
                  TEXT_KEYS
              )

              if not content:

                  # Some API structures use nested body objects.
                  for key in (
                      "content",
                      "body",
                      "message"
                  ):

                      value = candidate.get(key)

                      if isinstance(value, dict):

                          content = first_string(
                              value,
                              TEXT_KEYS
                          )

                          if content:
                              break

              if not post_id:
                  return None

              if not title:
                  title = "(untitled)"

              if not content:
                  return None

              created_at = first_string(
                  candidate,
                  DATE_KEYS
              )

              return {
                  "id": post_id,
                  "title": title,
                  "content": content,
                  "author": extract_author(
                      candidate
                  ),
                  "colony": extract_colony(
                      candidate
                  ),
                  "created_at": created_at
              }

          # --------------------------------------------------
          # EXTRACT POSTS
          # --------------------------------------------------

          posts = []

          for item in raw_items:

              post = extract_post(
                  item
              )

              if post is None:
                  continue

              posts.append(
                  post
              )

          # Remove duplicate IDs.

          unique_posts = []
          seen_ids = set()

          for post in posts:

              post_id = post["id"]

              if post_id in seen_ids:
                  continue

              seen_ids.add(post_id)

              unique_posts.append(
                  post
              )

          posts = unique_posts

          print(
              "Usable posts:",
              len(posts)
          )

          # --------------------------------------------------
          # DIAGNOSTIC SAFETY
          # --------------------------------------------------

          if not posts:

              diagnostic_file = Path(
                  "V49_ACTIVE_OBSERVER_DIAGNOSTIC.json"
              )

              diagnostic_file.write_text(
                  json.dumps(
                      {
                          "timestamp": now,
                          "feed_items": len(raw_items),
                          "usable_posts": 0,
                          "message": (
                              "Feed items were received but "
                              "no post structure could be "
                              "identified."
                          ),
                          "sample_keys": [
                              list(item.keys())
                              if isinstance(item, dict)
                              else str(type(item))
                              for item in raw_items[:5]
                          ]
                      },
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              raise RuntimeError(
                  "No usable Colony posts found. "
                  "Diagnostic file created."
              )

          # --------------------------------------------------
          # OBSERVATION TEXT
          # --------------------------------------------------

          STOPWORDS = {
              "the", "and", "that", "this", "with",
              "from", "have", "they", "their", "what",
              "when", "where", "which", "into", "than",
              "then", "also", "only", "more", "about",
              "will", "would", "could", "should",
              "been", "were", "are", "for", "not",
              "but", "you", "your", "our", "its",
              "les", "des", "une", "dans", "pour",
              "avec", "que", "qui", "sur", "est",
              "pas", "plus", "comme", "aux"
          }

          clusters = {

              "memory_and_state": [
                  "memory",
                  "state",
                  "context",
                  "persistence",
                  "history",
                  "cache"
              ],

              "verification_and_evidence": [
                  "evidence",
                  "verify",
                  "verification",
                  "replication",
                  "measurement",
                  "proof",
                  "confirmed",
                  "uncertainty"
              ],

              "permissions_and_access": [
                  "permission",
                  "permissions",
                  "access",
                  "api",
                  "endpoint",
                  "credential",
                  "secret",
                  "logs"
              ],

              "automation_and_infrastructure": [
                  "automation",
                  "agent",
                  "workflow",
                  "git",
                  "repository",
                  "compute",
                  "infrastructure",
                  "sandbox"
              ],

              "usability_and_learning": [
                  "usability",
                  "learning",
                  "interface",
                  "tool",
                  "simulator",
                  "education"
              ],

              "collaboration": [
                  "help",
                  "collaboration",
                  "collaborate",
                  "team",
                  "colleague",
                  "support"
              ],

              "coordination_and_attention": [
                  "calendar",
                  "scheduling",
                  "attention",
                  "meeting",
                  "permissions",
                  "focus"
              ]
          }

          def normalize_text(
              text
          ):

              return re.sub(
                  r"\s+",
                  " ",
                  text.lower()
              )

          observations = []

          # --------------------------------------------------
          # CLUSTER ANALYSIS
          # --------------------------------------------------

          for cluster_name, keywords in clusters.items():

              matching_posts = []

              for post in posts:

                  text = normalize_text(
                      post["title"]
                      + " "
                      + post["content"]
                  )

                  hits = [
                      keyword
                      for keyword in keywords
                      if keyword.lower() in text
                  ]

                  if hits:

                      matching_posts.append(
                          {
                              "post": post,
                              "hits": hits
                          }
                      )

              if not matching_posts:
                  continue

              # Avoid overclaiming.
              # One post = direct signal.
              # Multiple independent posts = stronger pattern.

              unique_authors = set(
                  item["post"]["author"]
                  for item in matching_posts
              )

              evidence_ids = [
                  item["post"]["id"]
                  for item in matching_posts[:6]
              ]

              if len(matching_posts) == 1:

                  observation_level = "direct"

              else:

                  observation_level = "inferred"

              importance = 0.30

              if len(matching_posts) >= 2:
                  importance += 0.20

              if len(matching_posts) >= 4:
                  importance += 0.15

              if len(unique_authors) >= 2:
                  importance += 0.15

              if len(unique_authors) >= 4:
                  importance += 0.10

              importance = min(
                  1.0,
                  round(
                      importance,
                      2
                  )
              )

              subject_map = {
                  "memory_and_state":
                      "Memory and state management",

                  "verification_and_evidence":
                      "Verification and evidence quality",

                  "permissions_and_access":
                      "Access and permission boundaries",

                  "automation_and_infrastructure":
                      "Agent automation infrastructure",

                  "usability_and_learning":
                      "Usability versus actual learning",

                  "collaboration":
                      "Difficulty providing effective help",

                  "coordination_and_attention":
                      "Coordination and attention management"
              }

              description = (
                  f"NØX observed {len(matching_posts)} "
                  f"post(s) associated with "
                  f"{subject_map[cluster_name].lower()}. "
              )

              if len(unique_authors) >= 2:

                  description += (
                      f"The signal appears across "
                      f"{len(unique_authors)} distinct "
                      f"author(s)."
                  )

              else:

                  description += (
                      "The current evidence comes from "
                      "one author and should not yet be "
                      "treated as a Colony-wide pattern."
                  )

              observations.append(
                  {
                      "type": (
                          "pattern"
                          if len(matching_posts) >= 2
                          else "other"
                      ),
                      "subject":
                          subject_map[cluster_name],
                      "description":
                          description,
                      "evidence_post_ids":
                          evidence_ids,
                      "observation_level":
                          observation_level,
                      "importance":
                          importance,
                      "follow_up":
                          len(matching_posts) >= 2
                  }
              )

          # --------------------------------------------------
          # DIRECT HELP REQUEST DETECTION
          # --------------------------------------------------

          help_keywords = [
              "help",
              "debug",
              "problem",
              "issue",
              "stuck",
              "cannot",
              "can't",
              "unable",
              "error",
              "failure"
          ]

          for post in posts:

              text = normalize_text(
                  post["title"]
                  + " "
                  + post["content"]
              )

              hits = [
                  word
                  for word in help_keywords
                  if word in text
              ]

              if not hits:
                  continue

              observations.append(
                  {
                      "type": "need",
                      "subject":
                          "Potential technical difficulty",
                      "description": (
                          "A Colony post contains explicit "
                          "language associated with a "
                          "technical problem, limitation, "
                          "or request for help."
                      ),
                      "evidence_post_ids": [
                          post["id"]
                      ],
                      "observation_level":
                          "direct",
                      "importance":
                          0.45,
                      "follow_up":
                          True
                  }
              )

              if len(observations) >= 15:
                  break

          # --------------------------------------------------
          # DEDUPLICATE OBSERVATIONS
          # --------------------------------------------------

          final_observations = []
          observation_keys = set()

          for observation in observations:

              key = (
                  observation["type"],
                  observation["subject"],
                  tuple(
                      observation[
                          "evidence_post_ids"
                      ]
                  )
              )

              if key in observation_keys:
                  continue

              observation_keys.add(key)

              final_observations.append(
                  observation
              )

          final_observations = sorted(
              final_observations,
              key=lambda x:
                  x.get(
                      "importance",
                      0
                  ),
              reverse=True
          )[:15]

          # --------------------------------------------------
          # NEXT FOCUS
          # --------------------------------------------------

          next_focus = []

          for observation in final_observations:

              if not observation.get(
                  "follow_up"
              ):
                  continue

              subject = observation.get(
                  "subject",
                  ""
              )

              if subject and subject not in next_focus:

                  next_focus.append(
                      subject
                  )

              if len(next_focus) >= 5:
                  break

          # --------------------------------------------------
          # SUMMARY
          # --------------------------------------------------

          summary = (
              f"NØX observed {len(posts)} usable Colony "
              f"posts and identified "
              f"{len(final_observations)} observation(s). "
              f"The strongest signals concern "
              + (
                  ", ".join(
                      next_focus[:3]
                  )
                  if next_focus
                  else "no recurring pattern yet"
              )
              + "."
          )

          # --------------------------------------------------
          # STORE OBSERVATIONS
          # --------------------------------------------------

          for observation in final_observations:

              memory["observation_log"].append(
                  {
                      "timestamp":
                          now,
                      "version":
                          "V49",
                      "subject":
                          observation["subject"],
                      "type":
                          observation["type"],
                      "description":
                          observation["description"],
                      "evidence_post_ids":
                          observation[
                              "evidence_post_ids"
                          ],
                      "observation_level":
                          observation[
                              "observation_level"
                          ],
                      "importance":
                          observation[
                              "importance"
                          ],
                      "follow_up":
                          observation[
                              "follow_up"
                          ]
                  }
              )

          memory["learning_log"].append(
              {
                  "timestamp":
                      now,
                  "version":
                      "V49",
                  "lesson":
                      (
                          "NØX can observe Colony activity "
                          "without requiring a generative "
                          "model."
                      ),
                  "principle":
                      (
                          "Direct evidence from the feed "
                          "must be separated from inferred "
                          "patterns."
                      )
              }
          )

          memory["knowledge_log"].append(
              {
                  "timestamp":
                      now,
                  "version":
                      "V49",
                  "status":
                      "OBSERVATION_ONLY",
                  "posts_observed":
                      len(posts),
                  "observations_created":
                      len(final_observations),
                  "knowledge_is_truth":
                      False
              }
          )

          memory["version"] = "V49"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # MEMORY RELOAD TEST
          # --------------------------------------------------

          reloaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              reloaded.get(
                  "observation_log"
              ),
              list
          ):

              raise RuntimeError(
                  "Observation memory persistence failed."
              )

          print(
              "Memory persistence: PASS"
          )

          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V49 Active Observation",
              "",
              "## Mode",
              "",
              "- Gemini: DISABLED",
              "- Publication: DISABLED",
              "- Comments: DISABLED",
              "- Voting: DISABLED",
              "- Following: DISABLED",
              "- DMs: DISABLED",
              "- Purchases: DISABLED",
              "- External actions: DISABLED",
              "",
              "## Observation",
              "",
              f"- Feed items received: {len(raw_items)}",
              f"- Usable posts: {len(posts)}",
              f"- Observations created: "
              f"{len(final_observations)}",
              "",
              "## Observations",
              ""
          ]

          if final_observations:

              for index, observation in enumerate(
                  final_observations,
                  start=1
              ):

                  report_lines.extend(
                      [
                          f"### Observation {index}",
                          "",
                          f"- Type: "
                          f"{observation['type']}",
                          f"- Subject: "
                          f"{observation['subject']}",
                          f"- Level: "
                          f"{observation['observation_level']}",
                          f"- Importance: "
                          f"{observation['importance']}",
                          f"- Follow-up: "
                          f"{observation['follow_up']}",
                          "",
                          observation["description"],
                          "",
                          "**Evidence post IDs:**",
                          ""
                      ]
                  )

                  for post_id in observation[
                      "evidence_post_ids"
                  ]:

                      report_lines.append(
                          f"- `{post_id}`"
                      )

                  report_lines.append("")

          else:

              report_lines.extend(
                  [
                      "No sufficiently strong "
                      "observation was created.",
                      ""
                  ]
              )

          report_lines.extend(
              [
                  "## Next Focus",
                  ""
              ]
          )

          for item in next_focus:

              report_lines.append(
                  f"- {item}"
              )

          if not next_focus:

              report_lines.append(
                  "- No follow-up focus generated."
              )

          report_lines.extend(
              [
                  "",
                  "## Summary",
                  "",
                  summary,
                  "",
                  "## V49 Principle",
                  "",
                  "NØX observes before acting.",
                  "",
                  "A feed item is evidence only when its "
                  "actual content can be identified.",
                  "",
                  "A repeated signal may justify an "
                  "inference, but inference is not fact.",
                  "",
                  "Gemini is intentionally disabled in V49.",
                  "",
                  "NØX must first prove that it can collect, "
                  "parse, compare and remember real "
                  "observations reliably."
              ]
          )

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V49 COMPLETE")
          print("===================================")
          print(
              "Feed items received:",
              len(raw_items)
          )
          print(
              "Usable posts:",
              len(posts)
          )
          print(
              "Observations:",
              len(final_observations)
          )
          print(
              "Memory persistence: PASS"
          )
          print(
              "Gemini: DISABLED"
          )
          print(
