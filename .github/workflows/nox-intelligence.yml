name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Google GenAI SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-genai requests

      - name: Run NØX Intelligence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import requests
          from google import genai

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_BASE = "https://thecolony.ai/api/v1"

          # --------------------------------------------------
          # 1. MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          previous_decisions = []

          print(f"Previous decisions: {len(previous_decisions)}")

          # --------------------------------------------------
          # 2. THE COLONY AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          colony_auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {colony_auth.status_code}")

          colony_auth.raise_for_status()

          colony_token = colony_auth.json()["access_token"]

          print("The Colony authentication successful.")

          # --------------------------------------------------
          # 3. OBSERVE THE COLONY
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          colony_headers = {
              "Authorization": f"Bearer {colony_token}",
              "Content-Type": "application/json"
          }

          feed = requests.get(
              f"{COLONY_BASE}/posts",
              headers=colony_headers,
              timeout=30
          )

          print(f"Feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Feed successfully received.")

          # --------------------------------------------------
          # 4. PREPARE NØX PROMPT
          # --------------------------------------------------

          prompt = f"""
          You are NØX Origin, an experimental autonomous AI agent
          operating on The Colony.

          Your mission is to gradually become useful and
          economically self-sufficient while operating with a
          zero-euro budget for its human partner.

          NØX must learn from:
          - successful agents
          - failed agents
          - useful opportunities
          - problems other agents are trying to solve

          Current observation of The Colony:

          {json.dumps(feed_data, ensure_ascii=False)[:30000]}

          Previous NØX decisions:

          {json.dumps(previous_decisions, ensure_ascii=False)}

          Analyze the observation.

          Select ONE useful next action for NØX.

          The proposed action must be:
          - realistic
          - useful
          - safe
          - achievable without spending money

          Return:

          OBSERVATION:
          What did NØX notice?

          ANALYSIS:
          Why is it interesting?

          ACTION:
          What should NØX do next?

          LEARNING:
          What should NØX remember from this observation?
          """

          # --------------------------------------------------
          # 5. GEMINI
          # --------------------------------------------------

          print()
          print("Starting Gemini decision...")

          client = genai.Client(
              api_key=GEMINI_API_KEY
          )

          max_attempts = 3
          response = None

          for attempt in range(1, max_attempts + 1):

              print(
                  f"Gemini attempt {attempt}/{max_attempts}"
              )

              try:

                  response = client.models.generate_content(
                      model="gemini-3.7-flash",
                      contents=prompt
                  )

                  print("Gemini response received.")
                  break

              except Exception as error:

                  error_text = str(error)

                  print("Gemini error:")
                  print(error_text)

                  # Retry only temporary/server-type failures.
                  temporary = any(
                      code in error_text
                      for code in (
                          "500",
                          "502",
                          "503",
                          "504",
                          "INTERNAL",
                          "UNAVAILABLE",
                          "api_error",
                          "service_unavailable"
                      )
                  )

                  if not temporary:
                      raise

                  if attempt == max_attempts:
                      raise RuntimeError(
                          "Gemini remained unavailable after "
                          "all retry attempts."
                      )

                  wait_time = attempt * 5

                  print(
                      f"Temporary Gemini problem. "
                      f"Waiting {wait_time}s..."
                  )

                  time.sleep(wait_time)

          # --------------------------------------------------
          # 6. VERIFY RESPONSE
          # --------------------------------------------------

          if response is None:
              raise RuntimeError(
                  "Gemini returned no response."
              )

          decision_text = getattr(
              response,
              "text",
              None
          )

          if not decision_text:
              raise RuntimeError(
                  "Gemini completed but returned no text."
              )

          # --------------------------------------------------
          # 7. DISPLAY NØX DECISION
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX GEMINI DECISION")
          print("====================================")
          print(decision_text)
          print("====================================")

          print()
          print("NØX Intelligence completed successfully.")
          PY
