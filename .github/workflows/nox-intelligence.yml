name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V2")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 2,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          memory.setdefault("version", 2)
          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          print(f"Previous observations: {len(memory['observations'])}")
          print(f"Previous decisions: {len(memory['decisions'])}")
          print(f"Previous actions: {len(memory['actions'])}")
          print(f"Previous learnings: {len(memory['learnings'])}")

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {auth.status_code}")
          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("The Colony authentication successful.")

          # --------------------------------------------------
          # 3. OBSERVE PERSONALIZED FEED
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"For-you feed status: {feed.status_code}")
          feed.raise_for_status()

          feed_data = feed.json()

          feed_items = []

          if isinstance(feed_data, dict):
              feed_items = feed_data.get("items", [])

          if not isinstance(feed_items, list):
              feed_items = []

          print(f"Observed items: {len(feed_items)}")

          # --------------------------------------------------
          # 4. GET SUGGESTIONS
          # --------------------------------------------------

          print()
          print("NØX is examining possible actions...")

          suggestions_response = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_response.raise_for_status()

          suggestions_data = suggestions_response.json()

          suggestions = []

          if isinstance(suggestions_data, dict):
              suggestions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )

          if not isinstance(suggestions, list):
              suggestions = []

          print(f"Available suggestions: {len(suggestions)}")

          # --------------------------------------------------
          # 5. COMPARE WITH MEMORY
          # --------------------------------------------------

          print()
          print("NØX is comparing current suggestions with memory...")

          previous_action_ids = set()

          for item in memory["actions"]:
              if not isinstance(item, dict):
                  continue

              action = item.get("action")

              if isinstance(action, dict):
                  action_id = action.get("id")

                  if action_id:
                      previous_action_ids.add(str(action_id))

          print(
              f"Previously seen action IDs: "
              f"{len(previous_action_ids)}"
          )

          # --------------------------------------------------
          # 6. SCORE CURRENT SUGGESTIONS
          # --------------------------------------------------

          evaluated = []

          for index, suggestion in enumerate(suggestions):

              if not isinstance(suggestion, dict):
                  continue

              score = suggestion.get("score", 0)

              try:
                  score = float(score)
              except (TypeError, ValueError):
                  score = 0.0

              action_id = suggestion.get("id")

              already_seen = (
                  str(action_id) in previous_action_ids
                  if action_id
                  else False
              )

              adjusted_score = score

              # Small penalty for repeatedly seeing
              # exactly the same action.
              if already_seen:
                  adjusted_score -= 0.10

              evaluated.append({
                  "rank": index + 1,
                  "id": action_id,
                  "title": suggestion.get("title"),
                  "kind": suggestion.get("kind"),
                  "category": suggestion.get("category"),
                  "original_score": score,
                  "already_seen": already_seen,
                  "adjusted_score": round(adjusted_score, 4),
                  "suggestion": suggestion
              })

          evaluated.sort(
              key=lambda x: x["adjusted_score"],
              reverse=True
          )

          # --------------------------------------------------
          # 7. SELECT BEST ACTION
          # --------------------------------------------------

          selected = None

          if evaluated:
              selected = evaluated[0]

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # 8. CREATE OBSERVATION
          # --------------------------------------------------

          observation = {
              "timestamp": now,
              "feed_items": len(feed_items),
              "suggestion_count": len(suggestions),
              "top_suggestions": [
                  {
                      "id": item["id"],
                      "title": item["title"],
                      "kind": item["kind"],
                      "original_score": item["original_score"],
                      "already_seen": item["already_seen"],
                      "adjusted_score": item["adjusted_score"]
                  }
                  for item in evaluated[:5]
              ]
          }

          memory["observations"].append(observation)

          # --------------------------------------------------
          # 9. RECORD DECISION
          # --------------------------------------------------

          if selected:

              decision = {
                  "timestamp": now,
                  "selected_action_id": selected["id"],
                  "title": selected["title"],
                  "kind": selected["kind"],
                  "original_score": selected["original_score"],
                  "adjusted_score": selected["adjusted_score"],
                  "already_seen": selected["already_seen"],
                  "reason": (
                      "Selected the highest adjusted-score suggestion. "
                      "Repeated actions receive a small penalty so NØX "
                      "can progressively explore alternatives."
                  )
              }

              memory["decisions"].append(decision)

              # Record the complete action for future comparison.
              memory["actions"].append({
                  "timestamp": now,
                  "action": selected["suggestion"],
                  "status": "selected",
                  "adjusted_score": selected["adjusted_score"]
              })

          else:

              decision = {
                  "timestamp": now,
                  "selected_action_id": None,
                  "title": None,
                  "kind": None,
                  "original_score": None,
                  "adjusted_score": None,
                  "already_seen": False,
                  "reason": "No usable suggestion was available."
              }

              memory["decisions"].append(decision)

          # --------------------------------------------------
          # 10. LEARNING
          # --------------------------------------------------

          learning = {
              "timestamp": now,
              "new_suggestions": sum(
                  1 for item in evaluated
                  if not item["already_seen"]
              ),
              "repeated_suggestions": sum(
                  1 for item in evaluated
                  if item["already_seen"]
              ),
              "note": (
                  "NØX compared current suggestions with previous "
                  "memory instead of blindly selecting the first item."
              )
          }

          memory["learnings"].append(learning)

          # --------------------------------------------------
          # 11. KEEP MEMORY MANAGEABLE
          # --------------------------------------------------

          memory["observations"] = memory["observations"][-50:]
          memory["decisions"] = memory["decisions"][-50:]
          memory["actions"] = memory["actions"][-50:]
          memory["learnings"] = memory["learnings"][-50:]

          # --------------------------------------------------
          # 12. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("NØX memory updated successfully.")

          # --------------------------------------------------
          # 13. DISPLAY RESULT
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX V2 DECISION")
          print("====================================")

          if selected:

              print(f"Selected: {selected['title']}")
              print(f"Kind: {selected['kind']}")
              print(f"Original score: {selected['original_score']}")
              print(f"Adjusted score: {selected['adjusted_score']}")
              print(f"Already seen: {selected['already_seen']}")

          else:

              print("No action selected.")

          print()
          print("Top evaluated suggestions:")

          for item in evaluated[:5]:
              print(
                  f"- {item['title']} | "
                  f"score={item['adjusted_score']} | "
                  f"seen={item['already_seen']}"
              )

          print()
          print("IMPORTANT:")
          print("NØX has NOT executed any Colony action.")
          print("This version only observes, evaluates and learns.")

          print()
          print("====================================")
          print("NØX INTELLIGENCE V2 COMPLETED")
          print("====================================")
          PY

      # ------------------------------------------------------
      # 14. SAVE MEMORY
      # ------------------------------------------------------

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: V2 learning cycle"
            git push
          fi
