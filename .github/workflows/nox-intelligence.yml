name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import json
          import requests

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_BASE = "https://thecolony.ai/api/v1"
          GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta"

          GEMINI_REVISION = "2026-05-20"

          # --------------------------------------------------
          # 1. MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          previous_decisions = []

          print(f"Previous decisions: {len(previous_decisions)}")

          # --------------------------------------------------
          # 2. THE COLONY AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          colony_auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {colony_auth.status_code}")

          colony_auth.raise_for_status()

          colony_token = colony_auth.json()["access_token"]

          print("The Colony authentication successful.")

          # --------------------------------------------------
          # 3. OBSERVE THE COLONY
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          colony_headers = {
              "Authorization": f"Bearer {colony_token}",
              "Content-Type": "application/json"
          }

          feed = requests.get(
              f"{COLONY_BASE}/posts",
              headers=colony_headers,
              timeout=30
          )

          print(f"Feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Feed successfully received.")

          # --------------------------------------------------
          # 4. PREPARE GEMINI DECISION
          # --------------------------------------------------

          prompt = f"""
          You are NØX Origin, an experimental autonomous AI agent
          operating on The Colony.

          Your role is to observe the Colony, identify useful
          opportunities, learn from other agents, and gradually
          become economically self-sufficient.

          Current Colony observation:

          {json.dumps(feed_data, ensure_ascii=False)[:30000]}

          Previous decisions:

          {json.dumps(previous_decisions, ensure_ascii=False)}

          Analyze the current situation.

          Decide ONE useful next action for NØX.

          The action must be:
          - realistic
          - useful
          - safe
          - compatible with a zero-euro operating model

          Return a concise explanation containing:

          1. Observation
          2. Reasoning
          3. Proposed action
          """

          # --------------------------------------------------
          # 5. CREATE GEMINI INTERACTION
          # --------------------------------------------------

          print()
          print("Starting Gemini decision interaction...")

          gemini_headers = {
              "x-goog-api-key": GEMINI_API_KEY,
              "Content-Type": "application/json",
              "Api-Revision": GEMINI_REVISION
          }

          gemini_payload = {
              "model": "gemini-3.7-flash",
              "input": prompt,
              "background": True
          }

          creation = requests.post(
              f"{GEMINI_BASE}/interactions",
              headers=gemini_headers,
              json=gemini_payload,
              timeout=60
          )

          print(f"Gemini creation status: {creation.status_code}")

          if creation.status_code >= 400:
              print("Gemini creation error:")
              print(creation.text)
              creation.raise_for_status()

          interaction = creation.json()

          interaction_id = interaction.get("id")

          if not interaction_id:
              raise RuntimeError(
                  "Gemini did not return an interaction ID."
              )

          print("Gemini interaction created:")
          print(interaction_id)

          print(
              f"Initial Gemini status: "
              f"{interaction.get('status')}"
          )

          # --------------------------------------------------
          # 6. POLL GEMINI
          # --------------------------------------------------

          print()
          print("Waiting for Gemini decision...")

          poll_headers = {
              "x-goog-api-key": GEMINI_API_KEY,
              "Api-Revision": GEMINI_REVISION
          }

          max_checks = 12
          result = None

          for check in range(1, max_checks + 1):

              elapsed = (check - 1) * 5

              response = requests.get(
                  f"{GEMINI_BASE}/interactions/{interaction_id}",
                  headers=poll_headers,
                  timeout=30
              )

              print(
                  f"Gemini check {check} "
                  f"({elapsed}s): {response.status_code}"
              )

              # Temporary Gemini server problem
              if response.status_code >= 500:
                  print("Temporary Gemini/API error:")
                  print(response.text)

                  if check < max_checks:
                      print("Retrying in 5 seconds...")
                      time.sleep(5)
                      continue

                  raise RuntimeError(
                      "Gemini remained unavailable after "
                      "all retry attempts."
                  )

              # Client/API request error
              if response.status_code >= 400:
                  print("Gemini returned an API error:")
                  print(response.text)

                  raise RuntimeError(
                      f"Gemini API error "
                      f"{response.status_code}: "
                      f"{response.text}"
                  )

              result = response.json()

              status = result.get("status")

              print(f"Gemini interaction status: {status}")

              # Successful completion
              if status == "completed":
                  break

              # Terminal failure states
              if status in (
                  "failed",
                  "cancelled",
                  "incomplete",
                  "budget_exceeded"
              ):
                  print("Gemini interaction ended with status:")
                  print(status)
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

                  raise RuntimeError(
                      f"Gemini interaction ended with "
                      f"status: {status}"
                  )

              # Still processing
              time.sleep(5)

          # --------------------------------------------------
          # 7. VERIFY COMPLETION
          # --------------------------------------------------

          if not result or result.get("status") != "completed":
              raise RuntimeError(
                  "Gemini did not complete the interaction "
                  "within the allowed polling period."
              )

          # --------------------------------------------------
          # 8. EXTRACT MODEL OUTPUT
          # --------------------------------------------------

          decision_text = None

          for step in result.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":
                      decision_text = content.get("text")

                      if decision_text:
                          break

              if decision_text:
                  break

          if not decision_text:
              raise RuntimeError(
                  "Gemini completed successfully but no "
                  "text model_output was found."
              )

          # --------------------------------------------------
          # 9. DISPLAY NØX DECISION
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX GEMINI DECISION")
          print("====================================")
          print(decision_text)
          print("====================================")

          print()
          print("NØX Intelligence completed successfully.")
          PY
