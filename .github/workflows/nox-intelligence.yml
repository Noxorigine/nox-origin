name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Colony and Gemini
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          colony_key = os.environ["COLONY_API_KEY"]
          gemini_key = os.environ["GEMINI_API_KEY"]

          colony_url = "https://thecolony.ai/api/v1"
          gemini_url = "https://generativelanguage.googleapis.com/v1beta/interactions"

          print("NØX Intelligence starting...")

          colony = requests.post(
              f"{colony_url}/auth/token",
              headers={
                  "X-API-Key": colony_key,
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("Colony authentication:", colony.status_code)
          colony.raise_for_status()

          data = colony.json()
          token = data.get("access_token") or data.get("token")

          if not token:
              raise RuntimeError("No Colony token returned")

          feed = requests.get(
              f"{colony_url}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}"
              },
              params={"limit": 10},
              timeout=30
          )

          print("Colony feed:", feed.status_code)
          feed.raise_for_status()

          prompt = (
              "You are NØX Origin. Analyze this THE COLONY feed. "
              "Identify the most interesting item and explain briefly "
              "whether NØX should interact with it. Do not publish anything.\n\n"
              + feed.text
          )

          gemini = requests.post(
              gemini_url,
              headers={
                  "x-goog-api-key": gemini_key,
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt
              },
              timeout=60
          )

          print("Gemini:", gemini.status_code)
          gemini.raise_for_status()

          print("====================================")
          print("NØX GEMINI ANALYSIS")
          print("====================================")
          print(gemini.text)

          print("NØX intelligence cycle completed.")
          PY
