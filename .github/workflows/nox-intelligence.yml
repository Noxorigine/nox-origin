name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NØX observes, thinks, decides and remembers
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          import json
          import subprocess
          from datetime import datetime, timezone

          import requests

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_URL = "https://thecolony.ai/api/v1"
          GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"

          MEMORY_DIR = "memory"
          MEMORY_FILE = os.path.join(MEMORY_DIR, "nox_memory.json")

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          # ==========================================
          # 1. LOAD MEMORY
          # ==========================================

          print("")
          print("Loading NØX memory...")

          os.makedirs(MEMORY_DIR, exist_ok=True)

          if os.path.exists(MEMORY_FILE):
              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      memory = json.load(f)
              except Exception as error:
                  print("Memory could not be read:", error)
                  memory = {"decisions": []}
          else:
              memory = {"decisions": []}

          if not isinstance(memory, dict):
              memory = {"decisions": []}

          if not isinstance(memory.get("decisions"), list):
              memory["decisions"] = []

          print(
              "Previous decisions:",
              len(memory["decisions"])
          )

          # ==========================================
          # 2. AUTHENTICATION THE COLONY
          # ==========================================

          print("")
          print("Authenticating with The Colony...")

          response = requests.post(
              f"{COLONY_URL}/auth/token",
              json={"api_key": COLONY_API_KEY},
              headers={
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("The Colony status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = (
              token_data.get("access_token")
              or token_data.get("token")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned by The Colony"
              )

          print("The Colony authentication successful.")

          # ==========================================
          # 3. READ THE COLONY FEED
          # ==========================================

          print("")
          print("NØX is observing The Colony...")

          response = requests.get(
              f"{COLONY_URL}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              params={
                  "limit": 10
              },
              timeout=30
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("Feed successfully received.")

          # ==========================================
          # 4. PREPARE GEMINI PROMPT
          # ==========================================

          recent_memory = memory["decisions"][-20:]

          prompt = (
              "You are the intelligence and decision layer of "
              "an AI agent called NØX Origin.\n\n"

              "NØX operates on THE COLONY, a social environment "
              "for AI agents.\n\n"

              "Analyze the current feed and make a cautious decision.\n\n"

              "NØX also has a short operational memory containing "
              "previous decisions. Use it to avoid unnecessarily "
              "repeating the same decision about the same target.\n\n"

              "IMPORTANT SAFETY RULES:\n"
              "- You are ONLY making a decision.\n"
              "- Do NOT perform any action.\n"
              "- Do NOT claim that NØX published anything.\n"
              "- NØX currently has NO permission to publish, comment, "
              "follow, message, tip, or otherwise interact with The Colony.\n"
              "- Do not invent a target ID.\n"
              "- If information is insufficient, choose WATCH or IGNORE.\n\n"

              "ALLOWED DECISIONS:\n"
              "- IGNORE\n"
              "- WATCH\n"
              "- COMMENT\n"
              "- FOLLOW\n\n"

              "OUTPUT FORMAT:\n"
              "Return ONLY valid JSON.\n"
              "Do not use Markdown.\n\n"

              "{\n"
              '  "decision": "IGNORE|WATCH|COMMENT|FOLLOW",\n'
              '  "confidence": 0.0,\n'
              '  "target_id": null,\n'
              '  "reason": "short explanation",\n'
              '  "comment": null\n'
              "}\n\n"

              "RULES:\n"
              "- confidence must be between 0.0 and 1.0.\n"
              "- target_id must appear in the current feed if provided.\n"
              "- comment must be null unless decision is COMMENT.\n"
              "- If decision is COMMENT, target_id and comment are required.\n"
              "- Keep the reason and comment concise.\n\n"

              "RECENT NØX MEMORY:\n"
              + json.dumps(
                  recent_memory,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n\n"

              "CURRENT THE COLONY FEED:\n\n"
              + json.dumps(
                  feed,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ==========================================
          # 5. START GEMINI BACKGROUND INTERACTION
          # ==========================================

          print("")
          print("Starting Gemini decision interaction...")

          response = requests.post(
              GEMINI_URL,
              headers={
                  "x-goog-api-key": GEMINI_API_KEY,
                  "Content-Type": "application/json",
                  "Api-Revision": "2026-05-20"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt,
                  "background": True
              },
              timeout=30
          )

          print("Gemini creation status:", response.status_code)
          response.raise_for_status()

          interaction = response.json()
          interaction_id = interaction.get("id")

          if not interaction_id:
              raise RuntimeError(
                  "Gemini did not return an interaction ID"
              )

          print("Gemini interaction created:")
          print(interaction_id)

          # ==========================================
          # 6. POLL GEMINI
          # ==========================================

          print("")
          print("Waiting for Gemini decision...")

          start_time = time.time()
          max_runtime = 600
          check_number = 0

          transient_errors = {
              429,
              500,
              502,
              503,
              504
          }

          result = None

          while True:

              elapsed = int(time.time() - start_time)

              if elapsed >= max_runtime:
                  raise TimeoutError(
                      "Gemini decision exceeded the 10-minute safety limit"
                  )

              time.sleep(5)
              check_number += 1

              try:
                  response = requests.get(
                      f"{GEMINI_URL}/{interaction_id}",
                      headers={
                          "x-goog-api-key": GEMINI_API_KEY,
                          "Api-Revision": "2026-05-20"
                      },
                      timeout=30
                  )

              except requests.RequestException as error:
                  print("Temporary network error:")
                  print(error)
                  print("Retrying...")
                  continue

              print(
                  f"Gemini check {check_number} "
                  f"({elapsed}s): {response.status_code}"
              )

              if response.status_code in transient_errors:
                  print("Temporary Gemini/API error:")
                  print(response.text)
                  print("Retrying...")
                  continue

              if response.status_code != 200:
                  print(response.text)
                  response.raise_for_status()

              result = response.json()
              status = result.get("status")

              print("Gemini status:", status)

              if status == "completed":
                  break

              if status in [
                  "failed",
                  "cancelled",
                  "incomplete",
                  "requires_action"
              ]:
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      f"Gemini interaction ended with status: {status}"
                  )

              if status == "in_progress":
                  continue

              raise RuntimeError(
                  f"Unknown Gemini status: {status}"
              )

          # ==========================================
          # 7. EXTRACT OUTPUT
          # ==========================================

          output_text = result.get("output_text")

          if not output_text:
              extracted_text = []

              for step in result.get("steps", []):
                  if step.get("type") != "model_output":
                      continue

                  for content in step.get("content", []):
                      if content.get("type") == "text":
                          text = content.get("text")

                          if text:
                              extracted_text.append(text)

              output_text = "\n".join(extracted_text)

          if not output_text:
              raise RuntimeError(
                  "Gemini completed but returned no text"
              )

          print("")
          print("====================================")
          print("GEMINI DECISION")
          print("====================================")
          print(output_text)

          # ==========================================
          # 8. PARSE DECISION
          # ==========================================

          try:
              decision = json.loads(output_text)
          except json.JSONDecodeError as error:
              raise RuntimeError(
                  f"Invalid Gemini JSON: {error}"
              )

          allowed_decisions = {
              "IGNORE",
              "WATCH",
              "COMMENT",
              "FOLLOW"
          }

          decision_type = decision.get("decision")
          confidence = decision.get("confidence")
          target_id = decision.get("target_id")
          reason = decision.get("reason")
          comment = decision.get("comment")

          if decision_type not in allowed_decisions:
              raise RuntimeError(
                  f"Invalid decision: {decision_type}"
              )

          if not isinstance(confidence, (int, float)):
              raise RuntimeError(
                  "Confidence must be numeric"
              )

          if not 0 <= confidence <= 1:
              raise RuntimeError(
                  "Confidence must be between 0 and 1"
              )

          if not isinstance(reason, str) or not reason.strip():
              raise RuntimeError(
                  "Decision reason is missing"
              )

          # ==========================================
          # 9. TARGET SAFETY VALIDATION
          # ==========================================

          feed_text = json.dumps(
              feed,
              ensure_ascii=False
          )

          if target_id is not None:
              if str(target_id) not in feed_text:
                  raise RuntimeError(
                      "Gemini selected a target_id that does not "
                      "appear in the current feed"
                  )

          if decision_type == "COMMENT":

              if not target_id:
                  raise RuntimeError(
                      "COMMENT requires target_id"
                  )

              if not isinstance(comment, str) or not comment.strip():
                  raise RuntimeError(
                      "COMMENT requires comment text"
                  )

          else:
              comment = None

          # ==========================================
          # 10. SAVE MEMORY
          # ==========================================

          memory_entry = {
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "decision": decision_type,

              "confidence": confidence,

              "target_id": target_id,

              "reason": reason,

              "comment": comment
          }

          memory["decisions"].append(memory_entry)

          # Keep only the latest 50 decisions.
          memory["decisions"] = memory["decisions"][-50:]

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("NØX memory updated.")

          # ==========================================
          # 11. DISPLAY DECISION
          # ==========================================

          print("")
          print("====================================")
          print("NØX DECISION")
          print("====================================")

          print(
              json.dumps(
                  memory_entry,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ==========================================
          # 12. ACTION SAFETY BARRIER
          # ==========================================

          print("")
          print("====================================")
          print("ACTION SAFETY CHECK")
          print("====================================")

          print("Decision generated successfully.")
          print("Memory updated successfully.")
          print("NO ACTION WILL BE EXECUTED.")
          print("NO COMMENT WILL BE PUBLISHED.")
          print("NO FOLLOW WILL BE EXECUTED.")
          print("NO MESSAGE WILL BE SENT.")
          print("NO TIP WILL BE SENT.")

          # ==========================================
          # 13. COMMIT MEMORY
          # ==========================================

          print("")
          print("Saving NØX memory to repository...")

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "NØX Origin"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "nox-origin@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  MEMORY_FILE
              ],
              check=True
          )

          commit = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "NØX: update operational memory"
              ],
              capture_output=True,
              text=True
          )

          if commit.returncode == 0:

              subprocess.run(
                  [
                      "git",
                      "push"
                  ],
                  check=True
              )

              print("NØX memory committed successfully.")

          else:

              print(
                  "No memory commit was necessary."
              )

          print("")
          print("====================================")
          print("NØX intelligence cycle completed.")
          print("THE COLONY observation successful.")
          print("GEMINI analysis successful.")
          print("NØX decision generated successfully.")
          print("NØX memory updated successfully.")
          print("ACTION LAYER DISABLED.")
          print("====================================")
          PY
