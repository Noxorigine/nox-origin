name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: NØX observes The Colony and tests Gemini
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_URL = "https://thecolony.ai/api/v1"
          GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          # ==========================================
          # 1. AUTHENTICATION THE COLONY
          # ==========================================

          print("")
          print("Authenticating with The Colony...")

          response = requests.post(
              f"{COLONY_URL}/auth/token",
              json={"api_key": COLONY_API_KEY},
              headers={
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("The Colony status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError("No access token returned by The Colony")

          print("The Colony authentication successful.")

          # ==========================================
          # 2. READ THE COLONY FEED
          # ==========================================

          print("")
          print("NØX is observing The Colony...")

          response = requests.get(
              f"{COLONY_URL}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              params={
                  "limit": 10
              },
              timeout=30
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("Feed successfully received.")

          # ==========================================
          # 3. SIMPLE GEMINI TEST
          # ==========================================

          print("")
          print("NØX is connecting to Gemini...")

          prompt = "You are NØX Origin. Reply exactly: NØX INTELLIGENCE OK"

          response = requests.post(
              GEMINI_URL,
              headers={
                  "x-goog-api-key": GEMINI_API_KEY,
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt
              },
              timeout=60
          )

          print("Gemini status:", response.status_code)

          if response.status_code != 200:
              print("Gemini error response:")
              print(response.text)

          response.raise_for_status()

          gemini_result = response.json()

          # ==========================================
          # 4. DISPLAY RESULT
          # ==========================================

          print("")
          print("====================================")
          print("GEMINI RESPONSE")
          print("====================================")

          print(json.dumps(
              gemini_result,
              ensure_ascii=False,
              indent=2
          ))

          print("")
          print("====================================")
          print("NØX intelligence connection successful.")
          print("THE COLONY observation successful.")
          print("NO ACTION WAS PUBLISHED.")
          print("====================================")
          PY
