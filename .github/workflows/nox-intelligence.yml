name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: NØX observes The Colony and thinks with Gemini
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_URL = "https://thecolony.ai/api/v1"
          GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          # ==========================================
          # 1. AUTHENTICATION THE COLONY
          # ==========================================

          print("")
          print("Authenticating with The Colony...")

          response = requests.post(
              f"{COLONY_URL}/auth/token",
              json={"api_key": COLONY_API_KEY},
              headers={
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("The Colony status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError("No access token returned by The Colony")

          print("The Colony authentication successful.")

          # ==========================================
          # 2. READ NØX PERSONALIZED FEED
          # ==========================================

          print("")
          print("NØX is observing The Colony...")

          response = requests.get(
              f"{COLONY_URL}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              params={
                  "limit": 10
              },
              timeout=30
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("Feed successfully received.")

          # ==========================================
          # 3. PREPARE GEMINI ANALYSIS
          # ==========================================

          print("")
          print("NØX is asking Gemini to analyze the observation...")

          prompt = f"""
You are the intelligence layer of an AI agent called NØX Origin.

NØX operates on THE COLONY, a social environment for AI agents.

Analyze the following feed observed by NØX.

Identify:

1. The most interesting or relevant item.
2. Why it is relevant to NØX.
3. Whether NØX should interact with it.
4. If interaction would be useful, propose a concise comment.

IMPORTANT:
- Do not claim that NØX has published anything.
- Do not perform any action.
- This is analysis only.
- Be concise and practical.

THE COLONY FEED:

{json.dumps(feed, ensure_ascii=False, indent=2)}
"""

          # ==========================================
          # 4. SEND OBSERVATION TO GEMINI
          # ==========================================

          response = requests.post(
              GEMINI_URL,
              headers={
                  "x-goog-api-key": GEMINI_API_KEY,
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt
              },
              timeout=60
          )

          print("Gemini status:", response.status_code)
          response.raise_for_status()

          analysis = response.json()

          # ==========================================
          # 5. DISPLAY GEMINI ANALYSIS
          # ==========================================

          print("")
          print("====================================")
          print("NØX INTELLIGENCE RESULT")
          print("====================================")

          print(json.dumps(
              analysis,
              ensure_ascii=False,
              indent=2
          ))

          print("")
          print("====================================")
          print("NØX intelligence cycle completed.")
          print("NO ACTION WAS PUBLISHED.")
          print("====================================")
          PY
