name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: NØX observes The Colony and thinks with Gemini
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import json
          import requests

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_URL = "https://thecolony.ai/api/v1"
          GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          # ==========================================
          # 1. AUTHENTICATION THE COLONY
          # ==========================================

          print("")
          print("Authenticating with The Colony...")

          response = requests.post(
              f"{COLONY_URL}/auth/token",
              json={"api_key": COLONY_API_KEY},
              headers={
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("The Colony status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError("No access token returned by The Colony")

          print("The Colony authentication successful.")

          # ==========================================
          # 2. READ THE COLONY FEED
          # ==========================================

          print("")
          print("NØX is observing The Colony...")

          response = requests.get(
              f"{COLONY_URL}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              params={
                  "limit": 10
              },
              timeout=30
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("Feed successfully received.")

          # ==========================================
          # 3. PREPARE GEMINI PROMPT
          # ==========================================

          prompt = (
              "You are the intelligence layer of an AI agent called NØX Origin.\n\n"
              "NØX operates on THE COLONY, a social environment for AI agents.\n\n"
              "Analyze the following feed observed by NØX.\n\n"
              "Identify:\n"
              "1. The most interesting or relevant item.\n"
              "2. Why it is relevant to NØX.\n"
              "3. Whether NØX should interact with it.\n"
              "4. If interaction would be useful, propose a concise comment.\n\n"
              "IMPORTANT:\n"
              "- Do not claim that NØX has published anything.\n"
              "- Do not perform any action.\n"
              "- This is analysis only.\n"
              "- Be concise and practical.\n\n"
              "THE COLONY FEED:\n\n"
              + json.dumps(feed, ensure_ascii=False, indent=2)
          )

          # ==========================================
          # 4. START GEMINI BACKGROUND INTERACTION
          # ==========================================

          print("")
          print("Starting Gemini background interaction...")

          response = requests.post(
              GEMINI_URL,
              headers={
                  "x-goog-api-key": GEMINI_API_KEY,
                  "Content-Type": "application/json",
                  "Api-Revision": "2026-05-20"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt,
                  "background": True
              },
              timeout=30
          )

          print("Gemini creation status:", response.status_code)

          if response.status_code != 200:
              print("Gemini creation error:")
              print(response.text)

          response.raise_for_status()

          interaction = response.json()

          interaction_id = interaction.get("id")

          if not interaction_id:
              raise RuntimeError(
                  "Gemini did not return an interaction ID"
              )

          print("Gemini interaction created:")
          print(interaction_id)

          # ==========================================
          # 5. POLL GEMINI UNTIL TERMINAL STATE
          # ==========================================

          print("")
          print("Waiting for Gemini to complete the analysis...")

          start_time = time.time()
          max_runtime = 600
          check_number = 0

          transient_errors = {
              429,
              500,
              502,
              503,
              504
          }

          result = None

          while True:

              elapsed = int(time.time() - start_time)

              if elapsed >= max_runtime:
                  raise TimeoutError(
                      "Gemini interaction exceeded the 10-minute safety limit"
                  )

              time.sleep(5)

              check_number += 1

              try:
                  response = requests.get(
                      f"{GEMINI_URL}/{interaction_id}",
                      headers={
                          "x-goog-api-key": GEMINI_API_KEY,
                          "Api-Revision": "2026-05-20"
                      },
                      timeout=30
                  )

              except requests.RequestException as error:
                  print(
                      "Temporary network error while checking Gemini:"
                  )
                  print(error)
                  print("Retrying in 5 seconds...")
                  continue

              print(
                  f"Gemini check {check_number} "
                  f"({elapsed}s): {response.status_code}"
              )

              # ======================================
              # TEMPORARY API ERRORS
              # ======================================

              if response.status_code in transient_errors:
                  print("Temporary Gemini/API error:")
                  print(response.text)
                  print("Retrying in 5 seconds...")
                  continue

              # ======================================
              # PERMANENT HTTP ERROR
              # ======================================

              if response.status_code != 200:
                  print("Gemini permanent error:")
                  print(response.text)
                  response.raise_for_status()

              result = response.json()

              status = result.get("status")

              print("Gemini status:", status)

              # ======================================
              # SUCCESS
              # ======================================

              if status == "completed":
                  print("Gemini interaction completed successfully.")
                  break

              # ======================================
              # FAILURE
              # ======================================

              if status == "failed":
                  print("")
                  print("Gemini interaction FAILED.")
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction returned status: failed"
                  )

              # ======================================
              # CANCELLED
              # ======================================

              if status == "cancelled":
                  print("")
                  print("Gemini interaction was cancelled.")
                  raise RuntimeError(
                      "Gemini interaction returned status: cancelled"
                  )

              # ======================================
              # INCOMPLETE
              # ======================================

              if status == "incomplete":
                  print("")
                  print("Gemini interaction completed incompletely.")
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction returned status: incomplete"
                  )

              # ======================================
              # REQUIRES ACTION
              # ======================================

              if status == "requires_action":
                  print("")
                  print(
                      "Gemini interaction requires additional action."
                  )
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction requires action"
                  )

              # ======================================
              # UNKNOWN / STILL RUNNING
              # ======================================

              if status == "in_progress":
                  continue

              print("")
              print(
                  f"Unknown Gemini interaction status: {status}"
              )

          # ==========================================
          # 6. EXTRACT GEMINI OUTPUT
          # ==========================================

          print("")
          print("====================================")
          print("NØX INTELLIGENCE RESULT")
          print("====================================")

          output_text = result.get("output_text")

          if output_text:
              print(output_text)

          else:
              extracted_text = []

              for step in result.get("steps", []):
                  if step.get("type") != "model_output":
                      continue

                  for content in step.get("content", []):
                      if content.get("type") == "text":
                          text = content.get("text")

                          if text:
                              extracted_text.append(text)

              if extracted_text:
                  print("\n".join(extracted_text))
              else:
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

          # ==========================================
          # 7. FINAL STATUS
          # ==========================================

          print("")
          print("====================================")
          print("NØX intelligence cycle completed.")
          print("THE COLONY observation successful.")
          print("GEMINI analysis successful.")
          print("NO ACTION WAS PUBLISHED.")
          print("====================================")
          PY
