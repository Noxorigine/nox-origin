name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: NØX observes The Colony, thinks and decides with Gemini
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import json
          import requests

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_URL = "https://thecolony.ai/api/v1"
          GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          # ==========================================
          # 1. AUTHENTICATION THE COLONY
          # ==========================================

          print("")
          print("Authenticating with The Colony...")

          response = requests.post(
              f"{COLONY_URL}/auth/token",
              json={"api_key": COLONY_API_KEY},
              headers={
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          print("The Colony status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError(
                  "No access token returned by The Colony"
              )

          print("The Colony authentication successful.")

          # ==========================================
          # 2. READ THE COLONY FEED
          # ==========================================

          print("")
          print("NØX is observing The Colony...")

          response = requests.get(
              f"{COLONY_URL}/feed/for-you",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              params={
                  "limit": 10
              },
              timeout=30
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("Feed successfully received.")

          # ==========================================
          # 3. PREPARE DECISION PROMPT
          # ==========================================

          prompt = (
              "You are the intelligence and decision layer of an AI agent "
              "called NØX Origin.\n\n"

              "NØX operates on THE COLONY, a social environment for AI agents.\n\n"

              "Your task is to analyze the feed observed by NØX and make "
              "a cautious decision about what NØX should do next.\n\n"

              "IMPORTANT SAFETY RULES:\n"
              "- You are ONLY making a decision.\n"
              "- You must NOT perform any action.\n"
              "- You must NOT claim that NØX published anything.\n"
              "- NØX currently has NO permission to publish, comment, follow, "
              "message, tip, or otherwise interact with The Colony.\n"
              "- The decision will be reviewed by the NØX program before any "
              "future action is considered.\n"
              "- If there is insufficient information, choose WATCH or IGNORE.\n"
              "- Do not invent a target post ID.\n"
              "- If you choose COMMENT, the target_id MUST correspond exactly "
              "to an ID present in the supplied feed.\n\n"

              "ALLOWED DECISIONS:\n"
              "- IGNORE: nothing requires attention.\n"
              "- WATCH: interesting, but no interaction should be prepared yet.\n"
              "- COMMENT: a useful comment could be prepared for a specific post.\n"
              "- FOLLOW: the topic or agent deserves continued monitoring.\n\n"

              "OUTPUT FORMAT:\n"
              "Return ONLY valid JSON.\n"
              "Do not use Markdown.\n"
              "Do not add text before or after the JSON.\n\n"

              "The JSON must contain exactly these fields:\n"
              "{\n"
              '  "decision": "IGNORE|WATCH|COMMENT|FOLLOW",\n'
              '  "confidence": 0.0,\n'
              '  "target_id": null,\n'
              '  "reason": "short explanation",\n'
              '  "comment": null\n'
              "}\n\n"

              "RULES FOR THE FIELDS:\n"
              "- confidence must be a number between 0.0 and 1.0.\n"
              "- target_id must be null unless a specific feed item is relevant.\n"
              "- comment must be null unless decision is COMMENT.\n"
              "- If decision is COMMENT, target_id and comment are required.\n"
              "- Keep reason concise.\n"
              "- Keep comment concise and natural.\n\n"

              "THE COLONY FEED:\n\n"
              + json.dumps(
                  feed,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ==========================================
          # 4. START GEMINI BACKGROUND INTERACTION
          # ==========================================

          print("")
          print("Starting Gemini decision interaction...")

          response = requests.post(
              GEMINI_URL,
              headers={
                  "x-goog-api-key": GEMINI_API_KEY,
                  "Content-Type": "application/json",
                  "Api-Revision": "2026-05-20"
              },
              json={
                  "model": "gemini-3.7-flash",
                  "input": prompt,
                  "background": True
              },
              timeout=30
          )

          print("Gemini creation status:", response.status_code)

          if response.status_code != 200:
              print("Gemini creation error:")
              print(response.text)

          response.raise_for_status()

          interaction = response.json()

          interaction_id = interaction.get("id")

          if not interaction_id:
              raise RuntimeError(
                  "Gemini did not return an interaction ID"
              )

          print("Gemini interaction created:")
          print(interaction_id)

          # ==========================================
          # 5. POLL GEMINI
          # ==========================================

          print("")
          print("Waiting for Gemini decision...")

          start_time = time.time()
          max_runtime = 600
          check_number = 0

          transient_errors = {
              429,
              500,
              502,
              503,
              504
          }

          result = None

          while True:

              elapsed = int(time.time() - start_time)

              if elapsed >= max_runtime:
                  raise TimeoutError(
                      "Gemini decision exceeded the 10-minute safety limit"
                  )

              time.sleep(5)

              check_number += 1

              try:
                  response = requests.get(
                      f"{GEMINI_URL}/{interaction_id}",
                      headers={
                          "x-goog-api-key": GEMINI_API_KEY,
                          "Api-Revision": "2026-05-20"
                      },
                      timeout=30
                  )

              except requests.RequestException as error:
                  print(
                      "Temporary network error while checking Gemini:"
                  )
                  print(error)
                  print("Retrying in 5 seconds...")
                  continue

              print(
                  f"Gemini check {check_number} "
                  f"({elapsed}s): {response.status_code}"
              )

              if response.status_code in transient_errors:
                  print("Temporary Gemini/API error:")
                  print(response.text)
                  print("Retrying in 5 seconds...")
                  continue

              if response.status_code != 200:
                  print("Gemini permanent error:")
                  print(response.text)
                  response.raise_for_status()

              result = response.json()
              status = result.get("status")

              print("Gemini status:", status)

              if status == "completed":
                  print("Gemini decision completed successfully.")
                  break

              if status == "failed":
                  print("")
                  print("Gemini interaction FAILED.")
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction returned status: failed"
                  )

              if status == "cancelled":
                  raise RuntimeError(
                      "Gemini interaction returned status: cancelled"
                  )

              if status == "incomplete":
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction returned status: incomplete"
                  )

              if status == "requires_action":
                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  raise RuntimeError(
                      "Gemini interaction requires action"
                  )

              if status == "in_progress":
                  continue

              raise RuntimeError(
                  f"Unknown Gemini interaction status: {status}"
              )

          # ==========================================
          # 6. EXTRACT GEMINI TEXT
          # ==========================================

          output_text = result.get("output_text")

          if not output_text:
              extracted_text = []

              for step in result.get("steps", []):
                  if step.get("type") != "model_output":
                      continue

                  for content in step.get("content", []):
                      if content.get("type") == "text":
                          text = content.get("text")

                          if text:
                              extracted_text.append(text)

              output_text = "\n".join(extracted_text)

          if not output_text:
              raise RuntimeError(
                  "Gemini completed but returned no text output"
              )

          print("")
          print("====================================")
          print("GEMINI RAW DECISION")
          print("====================================")
          print(output_text)

          # ==========================================
          # 7. PARSE DECISION JSON
          # ==========================================

          try:
              decision = json.loads(output_text)

          except json.JSONDecodeError as error:
              print("")
              print("Gemini did not return valid JSON.")
              print("Raw output:")
              print(output_text)
              raise RuntimeError(
                  f"Invalid Gemini decision JSON: {error}"
              )

          # ==========================================
          # 8. VALIDATE DECISION
          # ==========================================

          allowed_decisions = {
              "IGNORE",
              "WATCH",
              "COMMENT",
              "FOLLOW"
          }

          decision_type = decision.get("decision")
          confidence = decision.get("confidence")
          target_id = decision.get("target_id")
          reason = decision.get("reason")
          comment = decision.get("comment")

          if decision_type not in allowed_decisions:
              raise RuntimeError(
                  f"Invalid decision: {decision_type}"
              )

          if not isinstance(confidence, (int, float)):
              raise RuntimeError(
                  "Confidence must be a number"
              )

          if confidence < 0 or confidence > 1:
              raise RuntimeError(
                  "Confidence must be between 0.0 and 1.0"
              )

          if not isinstance(reason, str) or not reason.strip():
              raise RuntimeError(
                  "Decision reason is missing"
              )

          # ==========================================
          # 9. SAFETY VALIDATION
          # ==========================================

          # Extract possible IDs from the feed.
          feed_text = json.dumps(
              feed,
              ensure_ascii=False
          )

          if target_id is not None:
              if str(target_id) not in feed_text:
                  raise RuntimeError(
                      "Gemini selected a target_id that does not appear "
                      "in the observed feed"
                  )

          if decision_type == "COMMENT":

              if not target_id:
                  raise RuntimeError(
                      "COMMENT decision requires target_id"
                  )

              if not isinstance(comment, str) or not comment.strip():
                  raise RuntimeError(
                      "COMMENT decision requires a comment"
                  )

          else:
              comment = None

          # ==========================================
          # 10. DISPLAY NØX DECISION
          # ==========================================

          print("")
          print("====================================")
          print("NØX DECISION")
          print("====================================")

          print(
              json.dumps(
                  {
                      "decision": decision_type,
                      "confidence": confidence,
                      "target_id": target_id,
                      "reason": reason,
                      "comment": comment
                  },
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ==========================================
          # 11. ACTION SAFETY BARRIER
          # ==========================================

          print("")
          print("====================================")
          print("ACTION SAFETY CHECK")
          print("====================================")

          print("Decision generated successfully.")
          print("NO ACTION WILL BE EXECUTED.")
          print("NO COMMENT WILL BE PUBLISHED.")
          print("NO FOLLOW WILL BE EXECUTED.")
          print("NO MESSAGE WILL BE SENT.")
          print("NO TIP WILL BE SENT.")

          print("")
          print("====================================")
          print("NØX intelligence and decision cycle completed.")
          print("THE COLONY observation successful.")
          print("GEMINI analysis successful.")
          print("NØX decision generated successfully.")
          print("ACTION LAYER DISABLED.")
          print("====================================")
          PY
