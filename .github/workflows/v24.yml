name: NØX Origin - V24 Contradiction Detection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contradiction-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect contradictions locally
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          observations = memory.get("observations", [])
          knowledge = memory.get("knowledge", [])
          hypotheses = memory.get("hypotheses", [])
          validation_results = memory.get("validation_results", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(contradictions, list):
              contradictions = []

          if not isinstance(history, list):
              history = []

          now = datetime.now(timezone.utc).isoformat()

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).strip().lower()
              )

          observation_texts = [
              clean(o.get("text", ""))
              for o in observations
              if isinstance(o, dict)
          ]

          all_observation_text = " ".join(observation_texts)

          # ---------------------------------------------------------
          # 1. Groupes de concepts opposés
          # ---------------------------------------------------------

          opposition_groups = [
              {
                  "name": "efficiency_vs_quality",
                  "positive": [
                      "efficiency",
                      "efficient",
                      "faster",
                      "latency",
                      "performance"
                  ],
                  "negative": [
                      "quality",
                      "accuracy",
                      "coherence",
                      "precision",
                      "reliable"
                  ]
              },
              {
                  "name": "autonomy_vs_control",
                  "positive": [
                      "autonomy",
                      "autonomous",
                      "independent"
                  ],
                  "negative": [
                      "permission",
                      "restriction",
                      "boundary",
                      "control",
                      "access"
                  ]
              },
              {
                  "name": "memory_vs_resource_limits",
                  "positive": [
                      "memory",
                      "context",
                      "history",
                      "cache"
                  ],
                  "negative": [
                      "resource",
                      "vram",
                      "oom",
                      "latency",
                      "limit"
                  ]
              },
              {
                  "name": "verification_vs_false_confidence",
                  "positive": [
                      "verification",
                      "validation",
                      "evidence",
                      "confirmed"
                  ],
                  "negative": [
                      "false positive",
                      "false negative",
                      "uncertain",
                      "unverified",
                      "stale"
                  ]
              },
              {
                  "name": "learning_vs_data_quality",
                  "positive": [
                      "learning",
                      "trajectory",
                      "feedback",
                      "successful"
                  ],
                  "negative": [
                      "noise",
                      "sparse",
                      "failure",
                      "data quality"
                  ]
              }
          ]

          # ---------------------------------------------------------
          # 2. Détection des tensions
          # ---------------------------------------------------------

          detected = []

          for group in opposition_groups:

              positive_hits = sorted({
                  term
                  for term in group["positive"]
                  if term in all_observation_text
              })

              negative_hits = sorted({
                  term
                  for term in group["negative"]
                  if term in all_observation_text
              })

              if positive_hits and negative_hits:

                  contradiction_id = (
                      f"{group['name']}:"
                      f"{','.join(positive_hits)}:"
                      f"{','.join(negative_hits)}"
                  )

                  existing = [
                      c for c in contradictions
                      if isinstance(c, dict)
                      and c.get("id") == contradiction_id
                  ]

                  if existing:
                      item = existing[-1]
                      item["occurrences"] = (
                          int(item.get("occurrences", 1)) + 1
                      )
                      item["last_detected"] = now
                  else:
                      item = {
                          "id": contradiction_id,
                          "type": group["name"],
                          "positive_signals": positive_hits,
                          "negative_signals": negative_hits,
                          "occurrences": 1,
                          "first_detected": now,
                          "last_detected": now,
                          "status": "unresolved",
                          "method": "local_contradiction_detection_v24"
                      }
                      contradictions.append(item)

                  detected.append(item)

          # ---------------------------------------------------------
          # 3. Vérifier les hypothèses rejetées
          # ---------------------------------------------------------

          rejected_hypotheses = [
              item
              for item in validation_results
              if isinstance(item, dict)
              and item.get("verdict") == "rejected"
          ]

          for item in rejected_hypotheses:

              topic = item.get("topic", "unknown")

              contradiction_id = f"hypothesis_rejected:{topic}"

              existing = [
                  c for c in contradictions
                  if isinstance(c, dict)
                  and c.get("id") == contradiction_id
              ]

              if existing:
                  contradiction = existing[-1]
                  contradiction["occurrences"] = (
                      int(contradiction.get("occurrences", 1)) + 1
                  )
                  contradiction["last_detected"] = now
              else:
                  contradiction = {
                      "id": contradiction_id,
                      "type": "hypothesis_rejected",
                      "topic": topic,
                      "hypothesis": item.get("hypothesis"),
                      "support_score": item.get("support_score", 0),
                      "contradiction_score": item.get(
                          "contradiction_score", 0
                      ),
                      "occurrences": 1,
                      "first_detected": now,
                      "last_detected": now,
                      "status": "unresolved",
                      "method": "local_hypothesis_rejection_v24"
                  }

                  contradictions.append(contradiction)

              detected.append(contradiction)

          # ---------------------------------------------------------
          # 4. État global
          # ---------------------------------------------------------

          unresolved = [
              c for c in contradictions
              if isinstance(c, dict)
              and c.get("status") == "unresolved"
          ]

          resolved = [
              c for c in contradictions
              if isinstance(c, dict)
              and c.get("status") == "resolved"
          ]

          contradiction_state = {
              "updated_at": now,
              "total": len(contradictions),
              "unresolved": len(unresolved),
              "resolved": len(resolved),
              "detected_this_run": len(detected),
              "method": "local_contradiction_detection"
          }

          # ---------------------------------------------------------
          # 5. Historique
          # ---------------------------------------------------------

          history.append({
              "version": "V24",
              "timestamp": now,
              "observations_total": len(observations),
              "knowledge_total": len(knowledge),
              "hypotheses_total": len(hypotheses),
              "contradictions_total": len(contradictions),
              "detected_this_run": len(detected),
              "unresolved": len(unresolved),
              "resolved": len(resolved),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_contradiction_detection"
          })

          # ---------------------------------------------------------
          # 6. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V24"
          memory["updated_at"] = now
          memory["contradictions"] = contradictions
          memory["contradiction_state"] = contradiction_state
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 7. Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V24")
          print("==========================================")
          print(f"Observations          : {len(observations)}")
          print(f"Knowledge             : {len(knowledge)}")
          print(f"Hypotheses            : {len(hypotheses)}")
          print(f"Contradictions        : {len(contradictions)}")
          print(f"Detected this run     : {len(detected)}")
          print(f"Unresolved            : {len(unresolved)}")
          print(f"Resolved              : {len(resolved)}")
          print("------------------------------------------")
          print("Detection             : LOCAL")
          print("Gemini                : NON REQUIS")
          print("Cost                  : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V24 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V24 contradiction detection"

          git push
