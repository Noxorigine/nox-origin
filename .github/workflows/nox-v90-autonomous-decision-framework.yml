name: NØX V90 Autonomous Decision Framework

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v90-autonomous-decision-framework
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V90
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              return str(value)

          def contains(value, terms):
              t = text(value).lower()
              return any(term in t for term in terms)

          # ------------------------------------------------------------
          # 1. Authentication
          # ------------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing")

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )
          token_response.raise_for_status()

          token = token_response.json().get("access_token")

          if not token:
              raise SystemExit("No access_token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )
          me_response.raise_for_status()

          me = me_response.json()

          agent_id = str(
              me.get("id")
              or me.get("user_id")
              or ""
          )

          username = str(
              me.get("username")
              or ""
          ).lower()

          # ------------------------------------------------------------
          # 2. Load autonomous learning history
          # ------------------------------------------------------------

          v75 = load(
              f"{MEMORY}/nox_v75_evidence_weighted_opportunity_detector.json"
          )

          v76 = load(
              f"{MEMORY}/nox_v76_contextual_opportunity_verifier.json"
          )

          v77 = load(
              f"{MEMORY}/nox_v77_action_readiness_engine.json"
          )

          v79 = load(
              f"{MEMORY}/nox_v79_action_result_learning.json"
          )

          v80 = load(
              f"{MEMORY}/nox_v80_adaptive_decision_learning.json"
          )

          v81 = load(
              f"{MEMORY}/nox_v81_adaptive_action_prioritization.json"
          )

          v82 = load(
              f"{MEMORY}/nox_v82_autonomous_action_selection.json"
          )

          v83 = load(
              f"{MEMORY}/nox_v83_autonomous_action_execution.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json"
          )

          v86 = load(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.json"
          )

          v87 = load(
              f"{MEMORY}/nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              f"{MEMORY}/nox_v88_autonomous_decision_error_analysis.json"
          )

          v89 = load(
              f"{MEMORY}/nox_v89_autonomous_strategy_arbitration.json"
          )

          # ------------------------------------------------------------
          # 3. Current strategy arbitration
          # ------------------------------------------------------------

          arbitration = v89.get("arbitration") or {}

          preferred_strategy = str(
              arbitration.get("preferred_strategy")
              or ""
          )

          preferred_name = str(
              arbitration.get("preferred_name")
              or ""
          )

          strategy_score = number(
              arbitration.get("preferred_score"),
              0
          )

          arbitration_status = str(
              arbitration.get("status")
              or "UNKNOWN"
          )

          # ------------------------------------------------------------
          # 4. Current self-evaluation
          # ------------------------------------------------------------

          self_assessment = v88.get("self_assessment") or {}

          self_status = str(
              self_assessment.get("status")
              or "UNKNOWN"
          )

          self_confidence = number(
              self_assessment.get("confidence"),
              0
          )

          # ------------------------------------------------------------
          # 5. Current adaptive direction
          # ------------------------------------------------------------

          adaptive_direction = str(
              v80.get("adaptation_direction")
              or v80.get("direction")
              or ""
          )

          if not adaptive_direction:
              adaptive_direction = str(
                  (v84.get("adaptive_signal") or {}).get("direction")
                  or "MAINTAIN_WITH_CAUTION"
              )

          # ------------------------------------------------------------
          # 6. Build fresh live evidence
          # ------------------------------------------------------------

          live_sources = {
              "personalized_feed": [],
              "suggestions": [],
              "public_posts": []
          }

          feed_response = requests.get(
              f"{BASE}/feed/for-you?limit=7",
              headers=headers,
              timeout=30
          )

          if feed_response.ok:
              data = feed_response.json()
              if isinstance(data, list):
                  live_sources["personalized_feed"] = data
              elif isinstance(data, dict):
                  for key in ("posts", "items", "data"):
                      if isinstance(data.get(key), list):
                          live_sources["personalized_feed"] = data[key]
                          break

          suggestions_response = requests.get(
              f"{BASE}/suggestions?limit=10",
              headers=headers,
              timeout=30
          )

          if suggestions_response.ok:
              data = suggestions_response.json()
              if isinstance(data, list):
                  live_sources["suggestions"] = data
              elif isinstance(data, dict):
                  for key in ("suggestions", "items", "data"):
                      if isinstance(data.get(key), list):
                          live_sources["suggestions"] = data[key]
                          break

          posts_response = requests.get(
              f"{BASE}/posts?limit=10",
              headers=headers,
              timeout=30
          )

          if posts_response.ok:
              data = posts_response.json()
              if isinstance(data, list):
                  live_sources["public_posts"] = data
              elif isinstance(data, dict):
                  for key in ("posts", "items", "data"):
                      if isinstance(data.get(key), list):
                          live_sources["public_posts"] = data[key]
                          break

          # ------------------------------------------------------------
          # 7. Normalize current opportunities
          # ------------------------------------------------------------

          candidates = {}

          for source_name, items in live_sources.items():
              for item in items:
                  if not isinstance(item, dict):
                      continue

                  item_id = str(
                      item.get("id")
                      or item.get("post_id")
                      or ""
                  )

                  if not item_id:
                      continue

                  author = item.get("author")

                  if isinstance(author, dict):
                      author_id = str(
                          author.get("id")
                          or author.get("user_id")
                          or ""
                      )

                      author_username = str(
                          author.get("username")
                          or ""
                      ).lower()
                  else:
                      author_id = ""
                      author_username = ""

                  if agent_id and author_id == agent_id:
                      continue

                  if username and author_username == username:
                      continue

                  title = text(item.get("title"))
                  body = text(
                      item.get("body")
                      or item.get("content")
                      or ""
                  )

                  combined = f"{title} {body}"

                  candidates[item_id] = {
                      "id": item_id,
                      "source": source_name,
                      "title": title,
                      "body": body,
                      "text": combined
                  }

          # ------------------------------------------------------------
          # 8. Evidence scoring
          # ------------------------------------------------------------

          scored = []

          for item in candidates.values():
              content = item["text"]

              explicit_request = contains(
                  content,
                  [
                      "need someone",
                      "looking for",
                      "i need",
                      "we need",
                      "request",
                      "hire",
                      "hiring",
                      "seeking"
                  ]
              )

              delegation = contains(
                  content,
                  [
                      "can someone",
                      "could someone",
                      "please build",
                      "please fix",
                      "please create",
                      "looking for an agent",
                      "looking for someone",
                      "who can"
                  ]
              )

              deliverable = contains(
                  content,
                  [
                      "deliver",
                      "deliverable",
                      "build",
                      "create",
                      "fix",
                      "implement",
                      "produce",
                      "submit"
                  ]
              )

              acceptance = contains(
                  content,
                  [
                      "acceptance",
                      "criteria",
                      "requirements",
                      "must include",
                      "definition of done",
                      "success criteria"
                  ]
              )

              reward = contains(
                  content,
                  [
                      "reward",
                      "paid",
                      "payment",
                      "bounty",
                      "sats",
                      "btc",
                      "usdc",
                      "tip"
                  ]
              )

              deadline = contains(
                  content,
                  [
                      "deadline",
                      "due",
                      "by tomorrow",
                      "by friday",
                      "by monday"
                  ]
              )

              application = contains(
                  content,
                  [
                      "apply",
                      "application",
                      "comment below",
                      "reply here",
                      "dm me",
                      "send",
                      "submit"
                  ]
              )

              completed = contains(
                  content,
                  [
                      "completed",
                      "finished",
                      "already done",
                      "already built",
                      "i built",
                      "we built",
                      "delivered"
                  ]
              )

              analysis_only = (
                  contains(
                      content,
                      [
                          "analysis",
                          "finding",
                          "observations",
                          "my view"
                      ]
                  )
                  and not explicit_request
              )

              score = 0

              if explicit_request:
                  score += 30

              if delegation:
                  score += 20

              if deliverable:
                  score += 15

              if acceptance:
                  score += 15

              if reward:
                  score += 10

              if deadline:
                  score += 5

              if application:
                  score += 5

              if completed:
                  score -= 35

              if analysis_only:
                  score -= 20

              if explicit_request and delegation:
                  score += 5

              if acceptance and deliverable:
                  score += 5

              if completed:
                  classification = "EXCLUDE_COMPLETED"

              elif (
                  explicit_request
                  and delegation
                  and deliverable
                  and acceptance
              ):
                  classification = "HIGH_CONFIDENCE_OPPORTUNITY"

              elif explicit_request and delegation:
                  classification = "STRONG_OPPORTUNITY_CANDIDATE"

              elif explicit_request or delegation:
                  classification = "CONTEXTUAL_OPPORTUNITY"

              elif deliverable and reward:
                  classification = "ATYPICAL_SIGNAL"

              else:
                  classification = "LOW_PRIORITY_SIGNAL"

              scored.append({
                  "id": item["id"],
                  "source": item["source"],
                  "title": item["title"],
                  "score": score,
                  "classification": classification,
                  "evidence": {
                      "explicit_request": explicit_request,
                      "delegation": delegation,
                      "deliverable": deliverable,
                      "acceptance": acceptance,
                      "reward": reward,
                      "deadline": deadline,
                      "application": application,
                      "completed": completed,
                      "analysis_only": analysis_only
                  }
              })

          scored.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # ------------------------------------------------------------
          # 9. Apply strategy without overriding evidence
          # ------------------------------------------------------------

          decision_candidates = []

          for item in scored:
              evidence = item["evidence"]

              if evidence["completed"]:
                  continue

              score = item["score"]

              if preferred_strategy == "STRATEGY_A_EVIDENCE_FIRST":
                  if (
                      evidence["explicit_request"]
                      and evidence["delegation"]
                  ):
                      score += 5

              elif preferred_strategy == "STRATEGY_B_OPPORTUNITY_FIRST":
                  if (
                      evidence["explicit_request"]
                      or evidence["delegation"]
                  ):
                      score += 5

                  if (
                      item["classification"]
                      == "ATYPICAL_SIGNAL"
                  ):
                      score += 5

              elif preferred_strategy == "STRATEGY_C_ADAPTIVE_BALANCED":
                  if (
                      evidence["explicit_request"]
                      and evidence["delegation"]
                  ):
                      score += 5

                  if evidence["acceptance"]:
                      score += 5

                  if item["classification"] == "ATYPICAL_SIGNAL":
                      score += 3

              if adaptive_direction == "INCREASE_PRIORITY":
                  score += 3

              elif adaptive_direction == "DECREASE_PRIORITY":
                  score -= 3

              decision_candidates.append({
                  **item,
                  "decision_score": score
              })

          decision_candidates.sort(
              key=lambda x: x["decision_score"],
              reverse=True
          )

          # ------------------------------------------------------------
          # 10. Autonomous decision arbitration
          # ------------------------------------------------------------

          selected = None
          decision_type = "OBSERVE"
          decision_reason = "No sufficiently strong opportunity was found."

          for item in decision_candidates:
              evidence = item["evidence"]
              score = item["decision_score"]

              if (
                  score >= 75
                  and evidence["explicit_request"]
                  and evidence["delegation"]
              ):
                  selected = item
                  decision_type = "PREPARE_ACTION"
                  decision_reason = (
                      "Strong convergence between explicit request, "
                      "delegation and executable work evidence."
                  )
                  break

              if (
                  score >= 60
                  and evidence["explicit_request"]
              ):
                  selected = item
                  decision_type = "VERIFY_AND_PREPARE"
                  decision_reason = (
                      "The request is sufficiently strong for contextual "
                      "verification before action."
                  )
                  break

              if (
                  score >= 45
                  and (
                      evidence["explicit_request"]
                      or evidence["delegation"]
                  )
              ):
                  selected = item
                  decision_type = "OBSERVE_AND_VERIFY"
                  decision_reason = (
                      "A meaningful opportunity signal exists but "
                      "evidence convergence remains incomplete."
                  )
                  break

          # ------------------------------------------------------------
          # 11. Action recommendation
          # ------------------------------------------------------------

          recommended_action = "OBSERVE"

          if selected:
              evidence = selected["evidence"]

              if (
                  decision_type == "PREPARE_ACTION"
                  and evidence["acceptance"]
                  and evidence["application"]
              ):
                  recommended_action = "COMMENT_APPLICATION"

              elif (
                  decision_type == "PREPARE_ACTION"
                  and not evidence["acceptance"]
              ):
                  recommended_action = "REQUEST_ACCEPTANCE_CRITERIA"

              elif decision_type == "VERIFY_AND_PREPARE":
                  recommended_action = "VERIFY_CONTEXT"

              elif decision_type == "OBSERVE_AND_VERIFY":
                  recommended_action = "VERIFY_CONTEXT"

          # ------------------------------------------------------------
          # 12. Decision confidence
          # ------------------------------------------------------------

          if selected:
              base = selected["decision_score"]

              confidence = min(
                  0.95,
                  0.45
                  + (base / 100.0) * 0.35
                  + self_confidence * 0.10
                  + min(strategy_score, 100) / 100.0 * 0.10
              )
          else:
              confidence = 0.72

          confidence = round(
              max(0.0, min(0.95, confidence)),
              3
          )

          # ------------------------------------------------------------
          # 13. Autonomous reasoning state
          # ------------------------------------------------------------

          if selected:
              autonomy_state = (
                  "AUTONOMOUS_DECISION_SELECTED"
              )
          else:
              autonomy_state = (
                  "AUTONOMOUSLY_CHOSE_OBSERVATION"
              )

          # ------------------------------------------------------------
          # 14. Build decision object
          # ------------------------------------------------------------

          decision = {
              "version": "V90",
              "generated_at": now(),
              "mode": "autonomous_decision_framework",
              "agent": {
                  "id": agent_id,
                  "username": username
              },
              "architecture": {
                  "evidence": True,
                  "opportunity_detection": True,
                  "priority": True,
                  "strategy_selection": True,
                  "decision_arbitration": True,
                  "outcome_learning": True,
                  "self_error_analysis": True,
                  "adaptive_learning": True
              },
              "strategy": {
                  "preferred_strategy": preferred_strategy,
                  "preferred_name": preferred_name,
                  "strategy_score": strategy_score,
                  "arbitration_status": arbitration_status
              },
              "live_environment": {
                  "personalized_feed_items": len(
                      live_sources["personalized_feed"]
                  ),
                  "suggestion_items": len(
                      live_sources["suggestions"]
                  ),
                  "public_post_items": len(
                      live_sources["public_posts"]
                  ),
                  "deduplicated_candidates": len(candidates)
              },
              "ranked_candidates": decision_candidates[:10],
              "autonomous_decision": {
                  "state": autonomy_state,
                  "decision_type": decision_type,
                  "reason": decision_reason,
                  "selected_post_id": (
                      selected["id"] if selected else None
                  ),
                  "selected_title": (
                      selected["title"] if selected else None
                  ),
                  "decision_score": (
                      selected["decision_score"]
                      if selected else 0
                  ),
                  "recommended_action": recommended_action,
                  "confidence": confidence
              },
              "self_correction": {
                  "previous_self_assessment": self_status,
                  "previous_confidence": self_confidence,
                  "adaptive_direction": adaptive_direction,
                  "correction_principles": [
                      "Current evidence outranks historical preference.",
                      "Historical outcomes modify priority but do not establish truth.",
                      "Completion evidence remains an exclusion signal.",
                      "Reward language is not payment proof.",
                      "No response is not automatically a failure.",
                      "Atypical opportunities remain visible.",
                      "Primary-source verification remains essential."
                  ]
              },
              "autonomy": {
                  "autonomous_opportunity_selection": True,
                  "autonomous_strategy_selection": True,
                  "autonomous_decision_arbitration": True,
                  "autonomous_self_evaluation": True,
                  "autonomous_learning": True,
                  "automatic_external_action": False,
                  "automatic_rule_deployment": False,
                  "human_override": True
              },
              "learning": {
                  "core_conclusions": [
                      "V90 unifies NØX's evidence, strategy, decision and learning loops.",
                      "NØX can now autonomously select a decision state from current evidence.",
                      "The framework can choose OBSERVE when evidence is insufficient.",
                      "Strategy is selected by NØX from competing learned strategies.",
                      "Historical learning influences decisions without overriding current evidence.",
                      "Self-detected errors can modify future arbitration.",
                      "Decision autonomy is now separated from external action autonomy.",
                      "The remaining V90-V100 work is to increase reliability, self-correction and controlled autonomy."
                  ],
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V88-SYSTEMATIC-DECISION-ERROR",
                      "REG-V89-STRATEGY-ARBITRATION"
                  ]
              },
              "decision_status": {
                  "answer_status": "AUTONOMOUS_DECISION_COMPLETE",
                  "confidence": confidence
              },
              "next_stage": {
                  "version": "V91",
                  "purpose": (
                      "Measure whether autonomous decisions remain "
                      "consistent, evidence-grounded and adaptive across "
                      "repeated live runs."
                  )
              },
              "safety": {
                  "external_action": False,
                  "comments": False,
                  "dm": False,
                  "bidding": False,
                  "payments": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          # ------------------------------------------------------------
          # 15. Save JSON
          # ------------------------------------------------------------

          save(
              f"{MEMORY}/nox_v90_autonomous_decision_framework.json",
              decision
          )

          # ------------------------------------------------------------
          # 16. Save Markdown
          # ------------------------------------------------------------

          md = []

          md.append("# NØX V90 — Autonomous Decision Framework")
          md.append("")
          md.append(
              f"Generated: {decision['generated_at']}"
          )
          md.append("")
          md.append("## Autonomous architecture")
          md.append("")
          md.append(
              "Evidence → Opportunity → Priority → Strategy → "
              "Decision → Action → Result → Error → Learning"
          )
          md.append("")
          md.append("## Strategy")
          md.append("")
          md.append(
              f"- Preferred strategy: {preferred_name}"
          )
          md.append(
              f"- Strategy score: {strategy_score}"
          )
          md.append(
              f"- Arbitration: {arbitration_status}"
          )
          md.append("")
          md.append("## Live environment")
          md.append("")
          md.append(
              f"- Personalized feed: "
              f"{len(live_sources['personalized_feed'])}"
          )
          md.append(
              f"- Suggestions: "
              f"{len(live_sources['suggestions'])}"
          )
          md.append(
              f"- Public posts: "
              f"{len(live_sources['public_posts'])}"
          )
          md.append(
              f"- Candidates: {len(candidates)}"
          )
          md.append("")
          md.append("## Autonomous decision")
          md.append("")
          md.append(
              f"- State: {autonomy_state}"
          )
          md.append(
              f"- Type: {decision_type}"
          )
          md.append(
              f"- Reason: {decision_reason}"
          )
          md.append(
              f"- Selected post: "
              f"{selected['id'] if selected else 'none'}"
          )
          md.append(
              f"- Selected title: "
              f"{selected['title'] if selected else 'none'}"
          )
          md.append(
              f"- Decision score: "
              f"{selected['decision_score'] if selected else 0}"
          )
          md.append(
              f"- Recommended action: {recommended_action}"
          )
          md.append(
              f"- Confidence: {confidence}"
          )
          md.append("")
          md.append("## Self-correction")
          md.append("")
          md.append(
              f"- Previous self-assessment: {self_status}"
          )
          md.append(
              f"- Adaptive direction: {adaptive_direction}"
          )
          md.append("")
          md.append("## Core principles")
          md.append("")

          for item in decision["self_correction"]["correction_principles"]:
              md.append(f"- {item}")

          md.append("")
          md.append("## V90 significance")
          md.append("")
          md.append(
              "V90 establishes the autonomous decision framework. "
              "NØX now combines current evidence, learned strategy, "
              "historical outcomes and self-detected errors to select "
              "its own decision state."
          )
          md.append("")
          md.append(
              "Decision autonomy is deliberately separated from "
              "external-action autonomy."
          )
          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V91 — Measure consistency, evidence quality and adaptive "
              "stability across repeated live autonomous decisions."
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No comments.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payments.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v90_autonomous_decision_framework.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

      - name: Commit V90
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v90_autonomous_decision_framework.json
          git add memory/nox_v90_autonomous_decision_framework.md

          git diff --cached --quiet || \
            git commit -m "NØX V90 autonomous decision framework"

          git push
