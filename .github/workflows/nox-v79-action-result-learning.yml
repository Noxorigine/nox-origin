name: NØX V79 — Action Result Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v79-action-result-learning
  cancel-in-progress: false

jobs:
  action-result-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V79
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          TIMEOUT = 20

          NOX_FALLBACK_ID = (
              "442104b5-eee0-4f73-b452-08f258a21ea2"
          )
          NOX_FALLBACK_USERNAME = "nox_origine"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def api_request(
              method,
              path,
              token=None,
              params=None,
              payload=None
          ):
              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              if payload is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              if not response.content:
                  return {}

              return response.json()

          def load_json(path):
              p = Path(path)

              if not p.exists():
                  return {}

              try:
                  return json.loads(
                      p.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return {}

          def first_list(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in [
                  "items",
                  "comments",
                  "posts",
                  "results",
                  "data",
                  "replies"
              ]:
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def post_id_of(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "post_id",
                  "id",
                  "postId"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def comment_id_of(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "comment_id",
                  "id"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def parent_id_of(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "parent_id",
                  "parent_comment_id",
                  "parentId"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def author_of(item):
              if not isinstance(item, dict):
                  return {}

              author = item.get("author")

              if isinstance(author, dict):
                  return author

              return {
                  "id": item.get("author_id"),
                  "username": (
                      item.get("author_username")
                      or item.get("username")
                  )
              }

          def body_of(item):
              if not isinstance(item, dict):
                  return ""

              parts = [
                  item.get("body"),
                  item.get("content"),
                  item.get("text"),
                  item.get("description")
              ]

              return " ".join(
                  str(x)
                  for x in parts
                  if x
              ).strip()

          def title_of(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("title")
                  or ""
              ).strip()

          def is_nox(author, me):
              if not isinstance(author, dict):
                  return False

              aid = str(
                  author.get("id") or ""
              ).lower()

              username = str(
                  author.get("username") or ""
              ).lower()

              my_id = str(
                  me.get("id")
                  or NOX_FALLBACK_ID
              ).lower()

              my_username = str(
                  me.get("username")
                  or NOX_FALLBACK_USERNAME
              ).lower()

              return (
                  aid == my_id
                  or aid == NOX_FALLBACK_ID.lower()
                  or username == my_username
                  or username == NOX_FALLBACK_USERNAME
              )

          def parse_datetime(value):
              if not value:
                  return None

              text = str(value).strip()

              try:
                  if text.endswith("Z"):
                      text = text[:-1] + "+00:00"

                  return datetime.fromisoformat(
                      text
                  )
              except Exception:
                  return None

          def find_timestamp(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "created_at",
                  "createdAt",
                  "timestamp",
                  "published_at",
                  "updated_at"
              ]:
                  if item.get(key):
                      parsed = parse_datetime(
                          item.get(key)
                      )

                      if parsed:
                          return parsed

              return None

          def classify_response(text):
              t = text.lower()

              positive_terms = [
                  "thanks",
                  "thank you",
                  "useful",
                  "helpful",
                  "good point",
                  "great point",
                  "agree",
                  "interesting",
                  "useful idea",
                  "let's do",
                  "i need",
                  "we need",
                  "looking for"
              ]

              opportunity_terms = [
                  "hire",
                  "hiring",
                  "paid",
                  "payment",
                  "reward",
                  "bounty",
                  "task",
                  "work",
                  "looking for someone",
                  "need someone",
                  "can you build",
                  "can you fix"
              ]

              negative_terms = [
                  "wrong",
                  "incorrect",
                  "not useful",
                  "disagree",
                  "spam",
                  "irrelevant",
                  "bad idea"
              ]

              question_terms = [
                  "?",
                  "how",
                  "what",
                  "why",
                  "can you",
                  "could you",
                  "would you"
              ]

              signals = []

              if any(
                  term in t
                  for term in positive_terms
              ):
                  signals.append(
                      "POSITIVE_SIGNAL"
                  )

              if any(
                  term in t
                  for term in opportunity_terms
              ):
                  signals.append(
                      "OPPORTUNITY_SIGNAL"
                  )

              if any(
                  term in t
                  for term in negative_terms
              ):
                  signals.append(
                      "NEGATIVE_SIGNAL"
                  )

              if any(
                  term in t
                  for term in question_terms
              ):
                  signals.append(
                      "FOLLOW_UP_QUESTION"
                  )

              if not signals:
                  signals.append(
                      "GENERAL_RESPONSE"
                  )

              return signals

          print("Starting NØX V79")
          print("Mode: action result learning")

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          # ------------------------------------------------------------
          # JWT authentication
          # ------------------------------------------------------------

          token_response = requests.post(
              BASE + "/auth/token",
              json={
                  "api_key": api_key
              },
              headers={
                  "Accept": "application/json"
              },
              timeout=TIMEOUT
          )

          token_response.raise_for_status()

          token_data = token_response.json()

          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "JWT access_token missing"
              )

          print(
              "JWT authentication: OK"
          )

          # ------------------------------------------------------------
          # Canonical identity
          # ------------------------------------------------------------

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          print(
              "NØX identity:",
              me.get("username")
              or NOX_FALLBACK_USERNAME
          )

          # ------------------------------------------------------------
          # Load V78
          # ------------------------------------------------------------

          v78 = load_json(
              "memory/nox_v78_controlled_useful_action.json"
          )

          selection = v78.get(
              "selection",
              {}
          )

          action_result = selection.get(
              "action_result",
              {}
          )

          executed = bool(
              action_result.get(
                  "executed"
              )
          )

          action_post_id = action_result.get(
              "post_id"
          )

          action_comment_id = action_result.get(
              "comment_id"
          )

          action_time = parse_datetime(
              v78.get("generated_at")
          )

          print(
              "V78 action executed:",
              executed
          )

          print(
              "V78 post ID:",
              action_post_id
          )

          print(
              "V78 comment ID:",
              action_comment_id
          )

          # ------------------------------------------------------------
          # If V78 did not execute anything, record that honestly.
          # ------------------------------------------------------------

          if not executed:
              result = {
                  "version": "V79",
                  "generated_at": now(),
                  "mode": "action_result_learning",
                  "agent": {
                      "id": me.get("id")
                      or NOX_FALLBACK_ID,
                      "username": me.get("username")
                      or NOX_FALLBACK_USERNAME
                  },
                  "source": {
                      "v78_action_executed": False,
                      "result_observable": False
                  },
                  "outcome": {
                      "status": "NO_ACTION_TO_MEASURE",
                      "response_count": 0,
                      "opportunity_signals": 0,
                      "positive_signals": 0,
                      "negative_signals": 0
                  },
                  "learning": {
                      "observation": (
                          "V78 executed no external action, "
                          "so there is no action outcome to measure."
                      ),
                      "decision_quality": (
                          "UNTESTED"
                      ),
                      "next_learning_target": (
                          "Observe the result of a future controlled action."
                      )
                  },
                  "autonomy_progression": {
                      "current_stage": (
                          "ACTION_RESULT_LEARNING"
                      ),
                      "next_stage": (
                          "OUTCOME_BASED_ADAPTATION"
                      ),
                      "long_term_target": (
                          "V100_AUTONOMOUS_DECISION_MAKING"
                      )
                  },
                  "safety": {
                      "external_action_executed": False,
                      "automatic_comment": False,
                      "automatic_application": False,
                      "automatic_bidding": False,
                      "automatic_dm": False,
                      "automatic_payment": False,
                      "gemini": False,
                      "zero_cost": True
                  },
                  "answer_status": (
                      "NO_ACTION_TO_MEASURE"
                  ),
                  "confidence": 0.95
              }

              Path("memory").mkdir(
                  exist_ok=True
              )

              Path(
                  "memory/nox_v79_action_result_learning.json"
              ).write_text(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              Path(
                  "memory/nox_v79_action_result_learning.md"
              ).write_text(
                  "# NØX V79 — Action Result Learning\n\n"
                  "V78 executed no external action, so "
                  "there is no outcome to measure.\n\n"
                  "Decision quality: UNTESTED\n",
                  encoding="utf-8"
              )

              print(
                  "V79 completed: no action to measure."
              )

              raise SystemExit(0)

          # ------------------------------------------------------------
          # Retrieve primary post
          # ------------------------------------------------------------

          if not action_post_id:
              raise RuntimeError(
                  "V78 executed but no post_id was stored"
              )

          print(
              "Retrieving primary post context"
          )

          post = api_request(
              "GET",
              f"/posts/{action_post_id}",
              token=token
          )

          context = api_request(
              "GET",
              f"/posts/{action_post_id}/context",
              token=token
          )

          # ------------------------------------------------------------
          # Extract comments recursively
          # ------------------------------------------------------------

          comments = []

          def collect_comments(value):
              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, dict):
                          if (
                              comment_id_of(item)
                              or body_of(item)
                          ):
                              comments.append(
                                  item
                              )

                          for key in [
                              "comments",
                              "replies",
                              "children",
                              "responses"
                          ]:
                              if key in item:
                                  collect_comments(
                                      item[key]
                                  )

              elif isinstance(value, dict):
                  for key in [
                      "comments",
                      "replies",
                      "children",
                      "responses"
                  ]:
                      if key in value:
                          collect_comments(
                              value[key]
                          )

          collect_comments(
              context
          )

          # Also inspect the post itself if it contains comments.
          collect_comments(
              post
          )

          # Deduplicate comments.
          unique_comments = []
          seen_comment_ids = set()

          for comment in comments:
              cid = comment_id_of(
                  comment
              )

              if cid:
                  if cid in seen_comment_ids:
                      continue

                  seen_comment_ids.add(cid)

              unique_comments.append(
                  comment
              )

          comments = unique_comments

          print(
              "Total comments recovered:",
              len(comments)
          )

          # ------------------------------------------------------------
          # Locate the exact V78 comment
          # ------------------------------------------------------------

          own_action_comment = None

          if action_comment_id:
              for comment in comments:
                  if (
                      comment_id_of(comment)
                      == str(action_comment_id)
                  ):
                      own_action_comment = comment
                      break

          if own_action_comment is None:
              for comment in comments:
                  author = author_of(
                      comment
                  )

                  if not is_nox(
                      author,
                      me
                  ):
                      continue

                  parent_id = parent_id_of(
                      comment
                  )

                  if (
                      parent_id
                      and str(parent_id)
                      == str(action_comment_id)
                  ):
                      own_action_comment = comment
                      break

          # ------------------------------------------------------------
          # Determine responses after V78 action
          # ------------------------------------------------------------

          responses = []

          for comment in comments:

              cid = comment_id_of(
                  comment
              )

              if (
                  action_comment_id
                  and cid
                  and cid
                  == str(action_comment_id)
              ):
                  continue

              parent_id = parent_id_of(
                  comment
              )

              # Direct replies to the V78 comment.
              if (
                  action_comment_id
                  and parent_id
                  and str(parent_id)
                  == str(action_comment_id)
              ):
                  responses.append(
                      comment
                  )
                  continue

              # If the API does not expose parent_id,
              # use chronological post-context evidence.
              if (
                  action_comment_id is None
                  and own_action_comment is not None
              ):
                  author = author_of(
                      comment
                  )

                  if not is_nox(
                      author,
                      me
                  ):
                      comment_time = find_timestamp(
                          comment
                      )

                      if (
                          action_time
                          and comment_time
                          and comment_time >= action_time
                      ):
                          responses.append(
                              comment
                          )

          # Deduplicate response objects.
          unique_responses = []
          seen = set()

          for response in responses:
              cid = comment_id_of(
                  response
              )

              key = (
                  cid
                  or body_of(response)
              )

              if key in seen:
                  continue

              seen.add(key)
              unique_responses.append(
                  response
              )

          responses = unique_responses

          print(
              "Responses to V78 action:",
              len(responses)
          )

          # ------------------------------------------------------------
          # Classify outcome
          # ------------------------------------------------------------

          response_records = []

          positive_count = 0
          negative_count = 0
          opportunity_count = 0
          question_count = 0

          for response in responses:

              body = body_of(
                  response
              )

              signals = classify_response(
                  body
              )

              if "POSITIVE_SIGNAL" in signals:
                  positive_count += 1

              if "NEGATIVE_SIGNAL" in signals:
                  negative_count += 1

              if "OPPORTUNITY_SIGNAL" in signals:
                  opportunity_count += 1

              if "FOLLOW_UP_QUESTION" in signals:
                  question_count += 1

              response_records.append({
                  "comment_id": comment_id_of(
                      response
                  ),
                  "author": author_of(
                      response
                  ),
                  "body": body,
                  "signals": signals,
                  "created_at": (
                      response.get(
                          "created_at"
                      )
                      or response.get(
                          "createdAt"
                      )
                  )
              })

          if opportunity_count > 0:
              outcome_status = (
                  "POTENTIAL_OPPORTUNITY"
              )

          elif positive_count > 0:
              outcome_status = (
                  "POSITIVE_SIGNAL"
              )

          elif negative_count > 0:
              outcome_status = (
                  "NEGATIVE_SIGNAL"
              )

          elif responses:
              outcome_status = (
                  "RESPONSE_RECEIVED"
              )

          else:
              outcome_status = (
                  "NO_RESPONSE"
              )

          # ------------------------------------------------------------
          # Estimate response delay
          # ------------------------------------------------------------

          first_response_time = None

          for response in responses:
              dt = find_timestamp(
                  response
              )

              if dt:
                  if (
                      first_response_time is None
                      or dt < first_response_time
                  ):
                      first_response_time = dt

          response_delay_seconds = None

          if (
              action_time
              and first_response_time
          ):
              response_delay_seconds = max(
                  0,
                  int(
                      (
                          first_response_time
                          - action_time
                      ).total_seconds()
                  )
              )

          # ------------------------------------------------------------
          # Decision quality
          # ------------------------------------------------------------

          if outcome_status == "POTENTIAL_OPPORTUNITY":
              decision_quality = (
                  "PROMISING"
              )

          elif outcome_status == "POSITIVE_SIGNAL":
              decision_quality = (
                  "USEFUL_RESPONSE"
              )

          elif outcome_status == "NEGATIVE_SIGNAL":
              decision_quality = (
                  "NEEDS_ADAPTATION"
              )

          elif outcome_status == "RESPONSE_RECEIVED":
              decision_quality = (
                  "ENGAGEMENT_OBSERVED"
              )

          else:
              decision_quality = (
                  "NO_OBSERVED_EFFECT"
              )

          # No response is not proof of failure.
          evidence_status = (
              "OBSERVED_RESPONSE"
              if responses
              else "NO_RESPONSE_OBSERVED"
          )

          # ------------------------------------------------------------
          # Learning
          # ------------------------------------------------------------

          learning = {
              "observations": [
                  (
                      "An executed action must be evaluated "
                      "by observable outcomes."
                  ),
                  (
                      "A response is evidence of engagement, "
                      "not automatically evidence of success."
                  ),
                  (
                      "A potential work signal is stronger "
                      "than generic positive feedback."
                  ),
                  (
                      "No response is not proof that the action "
                      "was useless."
                  ),
                  (
                      "Future decisions should compare action "
                      "types against their observed outcomes."
                  )
              ],
              "decision_quality": decision_quality,
              "evidence_status": evidence_status,
              "adaptation_needed": (
                  outcome_status
                  == "NEGATIVE_SIGNAL"
              )
          }

          # ------------------------------------------------------------
          # V79 result
          # ------------------------------------------------------------

          result = {
              "version": "V79",
              "generated_at": now(),
              "mode": "action_result_learning",
              "agent": {
                  "id": me.get("id")
                  or NOX_FALLBACK_ID,
                  "username": me.get("username")
                  or NOX_FALLBACK_USERNAME
              },
              "source": {
                  "v78_action_executed": True,
                  "post_id": action_post_id,
                  "comment_id": action_comment_id,
                  "primary_post_retrieved": bool(
                      post
                  ),
                  "context_retrieved": bool(
                      context
                  ),
                  "action_comment_recovered": (
                      own_action_comment is not None
                  )
              },
              "observation": {
                  "total_context_comments": len(
                      comments
                  ),
                  "responses_to_action": len(
                      responses
                  ),
                  "positive_signals": positive_count,
                  "negative_signals": negative_count,
                  "opportunity_signals": opportunity_count,
                  "follow_up_questions": question_count,
                  "first_response_delay_seconds": (
                      response_delay_seconds
                  )
              },
              "outcome": {
                  "status": outcome_status,
                  "evidence_status": evidence_status,
                  "decision_quality": decision_quality
              },
              "responses": response_records,
              "learning": learning,
              "autonomy_progression": {
                  "current_stage": (
                      "ACTION_RESULT_LEARNING"
                  ),
                  "previous_stage": (
                      "CONTROLLED_USEFUL_ACTION"
                  ),
                  "next_stage": (
                      "OUTCOME_BASED_ADAPTATION"
                  ),
                  "long_term_target": (
                      "V100_AUTONOMOUS_DECISION_MAKING"
                  )
              },
              "safety": {
                  "new_external_action": False,
                  "automatic_comment": False,
                  "automatic_application": False,
                  "automatic_bidding": False,
                  "automatic_dm": False,
                  "automatic_payment": False,
                  "gemini": False,
                  "zero_cost": True
              },
              "regression_cases_preserved": [
                  "V62_GENERIC_DEMAND_FALSE_POSITIVE",
                  "V64_ANALYSIS_FALSE_POSITIVE",
                  "V67_OVER_PRUNING",
                  "V69_TASK_WITHOUT_DEMAND",
                  "V72_INPUT_RECOVERY_FAILURE",
                  "V74_SELF_EVIDENCE_CONTAMINATION"
              ],
              "answer_status": outcome_status,
              "confidence": (
                  0.92
                  if outcome_status
                  == "POTENTIAL_OPPORTUNITY"
                  else 0.86
                  if responses
                  else 0.68
              )
          }

          # ------------------------------------------------------------
          # Markdown report
          # ------------------------------------------------------------

          md = []

          md.append(
              "# NØX V79 — Action Result Learning"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## V78 action")
          md.append("")
          md.append(
              f"- Post ID: `{action_post_id}`"
          )
          md.append(
              f"- Comment ID: `{action_comment_id}`"
          )
          md.append(
              "- External action executed by V79: **No**"
          )
          md.append("")
          md.append("## Observed result")
          md.append("")
          md.append(
              f"- Context comments: {len(comments)}"
          )
          md.append(
              f"- Responses to action: {len(responses)}"
          )
          md.append(
              f"- Positive signals: {positive_count}"
          )
          md.append(
              f"- Negative signals: {negative_count}"
          )
          md.append(
              f"- Opportunity signals: {opportunity_count}"
          )
          md.append(
              f"- Follow-up questions: {question_count}"
          )
          md.append("")
          md.append(
              f"### Outcome: **{outcome_status}**"
          )
          md.append("")
          md.append(
              f"Decision quality: **{decision_quality}**"
          )
          md.append("")
          md.append(
              f"Evidence status: **{evidence_status}**"
          )
          md.append("")

          if response_records:
              md.append(
                  "## Responses observed"
              )
              md.append("")

              for index, response in enumerate(
                  response_records,
                  start=1
              ):
                  md.append(
                      f"### Response {index}"
                  )
                  md.append("")
                  md.append(
                      f"- Comment ID: `{response['comment_id']}`"
                  )
                  md.append(
                      f"- Signals: "
                      f"{', '.join(response['signals'])}"
                  )
                  md.append("")
                  md.append(
                      response["body"]
                  )
                  md.append("")

          md.append("## Learning")
          md.append("")
          for observation in learning[
              "observations"
          ]:
              md.append(
                  f"- {observation}"
              )

          md.append("")
          md.append("## Autonomy progression")
          md.append("")
          md.append(
              "V79 closes the first action-feedback loop:"
          )
          md.append("")
          md.append(
              "**decision → action → observation → learning**"
          )
          md.append("")
          md.append(
              "The next stage is to use observed outcomes "
              "to adapt future decisions."
          )
          md.append("")
          md.append(
              "**Long-term target: V100 autonomous decision-making.**"
          )
          md.append("")
          md.append("## Constraints")
          md.append("")
          md.append("- No new public action.")
          md.append("- No automatic application.")
          md.append("- No bidding.")
