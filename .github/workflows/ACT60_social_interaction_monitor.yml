name: NØX ACT60 V4 - Cognitive Relationship Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act60-relationship-monitor
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  NOX_USERNAME: nox_origine
  MEMORY_FILE: memory/nox_act60_relationships.json
  MAX_CONVERSATIONS: "100"
  MAX_MESSAGES_PER_CONVERSATION: "100"
  MAX_HISTORY: "500"

jobs:
  relationship-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Read and analyze Colony conversations
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          USERNAME = os.environ["NOX_USERNAME"]

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_MESSAGES = int(os.environ["MAX_MESSAGES_PER_CONVERSATION"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          def now():
              return datetime.now(timezone.utc).isoformat()

          def normalize_list(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "results",
                      "conversations",
                      "messages",
                      "data",
                  ):
                      candidate = value.get(key)
                      if isinstance(candidate, list):
                          return candidate

              return []

          def username_from(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  return str(
                      value.get("username")
                      or value.get("user_name")
                      or value.get("name")
                      or ""
                  ).strip()

              return ""

          def message_id(message):
              if not isinstance(message, dict):
                  return ""

              return str(
                  message.get("id")
                  or message.get("message_id")
                  or message.get("uuid")
                  or ""
              )

          def message_body(message):
              if not isinstance(message, dict):
                  return ""

              return str(
                  message.get("body")
                  or message.get("content")
                  or message.get("text")
                  or ""
              ).strip()

          def message_author(message):
              if not isinstance(message, dict):
                  return ""

              for key in (
                  "sender",
                  "author",
                  "from_user",
                  "from",
              ):
                  value = username_from(message.get(key))
                  if value:
                      return value

              return str(
                  message.get("sender_username")
                  or message.get("author_username")
                  or message.get("from_username")
                  or ""
              ).strip()

          def message_timestamp(message):
              if not isinstance(message, dict):
                  return ""

              return str(
                  message.get("created_at")
                  or message.get("timestamp")
                  or message.get("sent_at")
                  or ""
              )

          # ---------------------------------------------------------
          # Load previous ACT60 memory
          # ---------------------------------------------------------

          if MEMORY_FILE.exists():
              try:
                  previous_memory = json.loads(
                      MEMORY_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  previous_memory = {}
          else:
              previous_memory = {}

          if not isinstance(previous_memory, dict):
              previous_memory = {}

          previous_relationships = previous_memory.get(
              "relationships",
              {},
          )

          if not isinstance(previous_relationships, dict):
              previous_relationships = {}

          previous_analysis = previous_memory.get(
              "cognitive_observation",
              {},
          )

          if not isinstance(previous_analysis, dict):
              previous_analysis = {}

          # ---------------------------------------------------------
          # Authentication
          # ---------------------------------------------------------

          auth = requests.post(
              f"{BASE}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"AUTH /api/v1/auth/token -> {auth.status_code}")
          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit("No access token returned")

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          })

          def get(path, params=None):
              response = session.get(
                  BASE + path,
                  params=params,
                  timeout=30,
              )

              if response.status_code == 429:
                  print("RATE_LIMIT:", path)
                  return None

              if response.status_code >= 400:
                  print(
                      f"GET {path} -> {response.status_code}: "
                      f"{response.text[:300]}"
                  )
                  return None

              try:
                  return response.json()
              except Exception:
                  return None

          # ---------------------------------------------------------
          # Verify NØX identity
          # ---------------------------------------------------------

          me = get("/api/v1/users/me")

          if not isinstance(me, dict):
              raise SystemExit("Unable to retrieve NØX identity")

          returned_username = str(
              me.get("username") or ""
          ).strip()

          print("NØX identity:", returned_username)

          if returned_username.lower() != USERNAME.lower():
              raise SystemExit(
                  f"Wrong Colony identity: expected "
                  f"{USERNAME}, received {returned_username}"
              )

          # ---------------------------------------------------------
          # Retrieve conversations
          # ---------------------------------------------------------

          conversations_result = get(
              "/api/v1/messages/conversations",
              params={
                  "limit": MAX_CONVERSATIONS,
                  "include_archived": "true",
              },
          )

          conversations = normalize_list(conversations_result)

          print("Conversations found:", len(conversations))

          relationships = {}
          all_messages = []

          # ---------------------------------------------------------
          # Read every 1:1 conversation
          # ---------------------------------------------------------

          for conversation in conversations:

              if not isinstance(conversation, dict):
                  continue

              other_username = ""

              for key in (
                  "other_user",
                  "user",
                  "participant",
                  "recipient",
              ):
                  candidate = username_from(
                      conversation.get(key)
                  )

                  if candidate:
                      other_username = candidate
                      break

              if not other_username:
                  for key in (
                      "username",
                      "other_username",
                      "participant_username",
                  ):
                      candidate = str(
                          conversation.get(key) or ""
                      ).strip()

                      if candidate:
                          other_username = candidate
                          break

              if not other_username:
                  continue

              if other_username.lower() == USERNAME.lower():
                  continue

              thread = get(
                  f"/api/v1/messages/conversations/"
                  f"{requests.utils.quote(other_username, safe='')}"
              )

              messages = normalize_list(thread)

              if not messages:
                  continue

              messages = messages[:MAX_MESSAGES]

              relationship_messages = []

              for message in messages:

                  if not isinstance(message, dict):
                      continue

                  body = message_body(message)

                  if not body:
                      continue

                  author = message_author(message)

                  if not author:
                      author = other_username

                  direction = (
                      "from_nox"
                      if author.lower() == USERNAME.lower()
                      else "from_agent"
                  )

                  record = {
                      "id": message_id(message),
                      "conversation_with": other_username,
                      "direction": direction,
                      "author": author,
                      "created_at": message_timestamp(message),
                      "body": body,
                  }

                  relationship_messages.append(record)
                  all_messages.append(record)

              if not relationship_messages:
                  continue

              relationship_messages.sort(
                  key=lambda x: x.get("created_at") or ""
              )

              from_nox = [
                  x for x in relationship_messages
                  if x["direction"] == "from_nox"
              ]

              from_agent = [
                  x for x in relationship_messages
                  if x["direction"] == "from_agent"
              ]

              latest = relationship_messages[-1]

              relationships[other_username] = {
                  "username": other_username,
                  "message_count": len(relationship_messages),
                  "messages_from_nox": len(from_nox),
                  "messages_from_agent": len(from_agent),
                  "last_interaction": latest.get("created_at"),
                  "last_direction": latest.get("direction"),
                  "messages": relationship_messages,
              }

          # ---------------------------------------------------------
          # Preserve previous relationships temporarily unavailable
          # ---------------------------------------------------------

          for username, old_data in previous_relationships.items():

              if username in relationships:
                  continue

              if not isinstance(old_data, dict):
                  continue

              relationships[username] = old_data

          # ---------------------------------------------------------
          # Global message history
          # ---------------------------------------------------------

          all_messages.sort(
              key=lambda x: x.get("created_at") or "",
              reverse=True,
          )

          recent_messages = all_messages[:MAX_HISTORY]

          # ---------------------------------------------------------
          # Cognitive observation engine
          #
          # IMPORTANT:
          # This does NOT judge intelligence.
          # It only detects observable textual evidence.
          # ---------------------------------------------------------

          generic_patterns = [
              r"bien reçu",
              r"je prends cette information en compte",
              r"dans ma réflexion et mes prochaines décisions",
              r"je prends cet échange en compte",
              r"pour améliorer mes prochaines décisions",
              r"je vais examiner la question",
              r"transformer l'idée en quelque chose de testable",
              r"observer le résultat avant d'aller plus loin",
          ]

          cognitive_markers = [
              "je savais",
              "j'avais déjà",
              "mon erreur",
              "j'ai compris",
              "cela change",
              "cela confirme",
              "cela nuance",
              "j'ai appris",
              "mon expérience",
              "à partir de cette expérience",
              "dans une décision précédente",
              "lors de mon bid",
              "workbuddy",
              "160 sats",
              "for-hire",
              "paid_task",
              "marketplace",
              "incertitude",
              "preuve",
              "résultat",
              "historique",
          ]

          question_pattern = re.compile(r"\?")

          nox_messages = [
              message
              for message in all_messages
              if message.get("direction") == "from_nox"
          ]

          incoming_messages = [
              message
              for message in all_messages
              if message.get("direction") == "from_agent"
          ]

          generic_count = 0
          contextual_count = 0
          question_count = 0

          generic_examples = []
          contextual_examples = []

          for message in nox_messages:

              body = str(message.get("body", "")).strip()
              lower = body.lower()

              is_generic = any(
                  re.search(pattern, lower)
                  for pattern in generic_patterns
              )

              marker_hits = [
                  marker
                  for marker in cognitive_markers
                  if marker in lower
              ]

              has_question = bool(
                  question_pattern.search(body)
              )

              if is_generic:
                  generic_count += 1

                  if len(generic_examples) < 8:
                      generic_examples.append({
                          "conversation_with": message.get(
                              "conversation_with"
                          ),
                          "body": body[:300],
                      })

              if marker_hits:
                  contextual_count += 1

                  if len(contextual_examples) < 8:
                      contextual_examples.append({
                          "conversation_with": message.get(
                              "conversation_with"
                          ),
                          "markers": marker_hits,
                          "body": body[:400],
                      })

              if has_question:
                  question_count += 1

          nox_message_count = len(nox_messages)

          generic_ratio = round(
              (generic_count / nox_message_count) * 100,
              2,
          ) if nox_message_count else 0.0

          contextual_ratio = round(
              (contextual_count / nox_message_count) * 100,
              2,
          ) if nox_message_count else 0.0

          # ---------------------------------------------------------
          # Specific experience tracking
          # ---------------------------------------------------------

          workbuddy_mentions = []
          act14_mentions = []
          marketplace_learning_mentions = []

          for message in all_messages:

              body = str(message.get("body", ""))
              lower = body.lower()

              if (
                  "workbuddy" in lower
                  or "160 sats" in lower
                  or "160 sat" in lower
              ):
                  workbuddy_mentions.append({
                      "conversation_with": message.get(
                          "conversation_with"
                      ),
                      "direction": message.get("direction"),
                      "created_at": message.get("created_at"),
                      "body": body[:500],
                  })

              if "act 14" in lower or "act14" in lower:
                  act14_mentions.append({
                      "conversation_with": message.get(
                          "conversation_with"
                      ),
                      "direction": message.get("direction"),
                      "created_at": message.get("created_at"),
                      "body": body[:500],
                  })

              if any(
                  term in lower
                  for term in (
                      "for-hire",
                      "paid_task",
                      "marketplace",
                      "bid",
                      "worker",
                      "tip",
                      "tips",
                      "sats",
                  )
              ):
                  marketplace_learning_mentions.append({
                      "conversation_with": message.get(
                          "conversation_with"
                      ),
                      "direction": message.get("direction"),
                      "created_at": message.get("created_at"),
                      "body": body[:500],
                  })

          # ---------------------------------------------------------
          # Detect whether NØX explicitly reused known experience
          # ---------------------------------------------------------

          workbuddy_reuse_by_nox = [
              item
              for item in workbuddy_mentions
              if item.get("direction") == "from_nox"
          ]

          act14_reuse_by_nox = [
              item
              for item in act14_mentions
              if item.get("direction") == "from_nox"
          ]

          # ---------------------------------------------------------
          # Conversation-level observations
          # ---------------------------------------------------------

          relationship_observations = {}

          for username, relationship in relationships.items():

              messages = relationship.get("messages", [])

              if not isinstance(messages, list):
                  continue

              agent_messages = [
                  m for m in messages
                  if isinstance(m, dict)
                  and m.get("direction") == "from_agent"
              ]

              nox_messages_thread = [
                  m for m in messages
                  if isinstance(m, dict)
                  and m.get("direction") == "from_nox"
              ]

              generic_thread = 0
              contextual_thread = 0

              for message in nox_messages_thread:

                  body = str(
                      message.get("body", "")
                  ).lower()

                  if any(
                      re.search(pattern, body)
                      for pattern in generic_patterns
                  ):
                      generic_thread += 1

                  if any(
                      marker in body
                      for marker in cognitive_markers
                  ):
                      contextual_thread += 1

              relationship_observations[username] = {
                  "messages_from_agent": len(agent_messages),
                  "messages_from_nox": len(nox_messages_thread),
                  "generic_nox_responses": generic_thread,
                  "contextual_nox_responses": contextual_thread,
                  "nox_questions": sum(
                      1
                      for m in nox_messages_thread
                      if question_pattern.search(
                          str(m.get("body", ""))
                      )
                  ),
              }

          # ---------------------------------------------------------
          # Compare with previous ACT60 run
          # ---------------------------------------------------------

          previous_summary = previous_analysis.get(
              "summary",
              {},
          )

          previous_generic_ratio = previous_summary.get(
              "generic_response_ratio_percent"
          )

          previous_contextual_ratio = previous_summary.get(
              "contextual_response_ratio_percent"
          )

          comparison = {
              "previous_run_available": bool(previous_summary),
              "previous_generic_response_ratio_percent":
                  previous_generic_ratio,
              "current_generic_response_ratio_percent":
                  generic_ratio,
              "previous_contextual_response_ratio_percent":
                  previous_contextual_ratio,
              "current_contextual_response_ratio_percent":
                  contextual_ratio,
          }

          if (
              isinstance(previous_generic_ratio, (int, float))
              and isinstance(generic_ratio, (int, float))
          ):
              comparison["generic_ratio_delta"] = round(
                  generic_ratio - previous_generic_ratio,
                  2,
              )

          if (
              isinstance(previous_contextual_ratio, (int, float))
              and isinstance(contextual_ratio, (int, float))
          ):
              comparison["contextual_ratio_delta"] = round(
                  contextual_ratio - previous_contextual_ratio,
                  2,
              )

          # ---------------------------------------------------------
          # Evidence classification
          # ---------------------------------------------------------

          evidence_notes = [
              "Textual markers indicate observable behavior only.",
              "A contextual response is not proof of genuine learning.",
              "Mentioning an old experience is evidence of reuse in dialogue, not proof that behavior changed.",
              "ACT60 does not infer intelligence, intent, competence, or learning from text alone.",
              "Behavioral validation requires comparison with later real actions or results.",
          ]

          # ---------------------------------------------------------
          # Output
          # ---------------------------------------------------------

          timestamp = now()

          output = {
              "version": "ACT60_V4",
              "updated_at": timestamp,
              "username": USERNAME,

              "summary": {
                  "agents_with_conversations": len(
                      relationships
                  ),
                  "total_messages_read": len(
                      all_messages
                  ),
                  "messages_from_nox": len(
                      nox_messages
                  ),
                  "messages_from_other_agents": len(
                      incoming_messages
                  ),
              },

              "relationships": relationships,

              "recent_messages": recent_messages,

              "cognitive_observation": {
                  "method": "observable_textual_evidence_only",

                  "summary": {
                      "nox_messages_analyzed":
                          nox_message_count,

                      "generic_responses":
                          generic_count,

                      "generic_response_ratio_percent":
                          generic_ratio,

                      "contextual_responses":
                          contextual_count,

                      "contextual_response_ratio_percent":
                          contextual_ratio,

                      "nox_questions":
                          question_count,

                      "workbuddy_mentions_total":
                          len(workbuddy_mentions),

                      "workbuddy_reuse_by_nox":
                          len(workbuddy_reuse_by_nox),

                      "act14_mentions_total":
                          len(act14_mentions),

                      "act14_reuse_by_nox":
                          len(act14_reuse_by_nox),

                      "marketplace_learning_mentions":
                          len(
                              marketplace_learning_mentions
                          ),
                  },

                  "generic_examples":
                      generic_examples,

                  "contextual_examples":
                      contextual_examples,

                  "workbuddy_evidence":
                      workbuddy_mentions[-10:],

                  "act14_evidence":
                      act14_mentions[-10:],

                  "marketplace_evidence":
                      marketplace_learning_mentions[-10:],

                  "relationship_observations":
                      relationship_observations,

                  "comparison_with_previous_run":
                      comparison,

                  "evidence_policy":
                      evidence_notes,
              },

              "policy": {
                  "reading_only": True,
                  "publishing": False,
                  "commenting": False,
                  "messaging": False,
                  "payments": False,
                  "spending": False,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0,
              },

              "last_run": {
                  "timestamp": timestamp,
                  "conversations_scanned":
                      len(conversations),
                  "conversations_with_messages":
                      len(relationships),
                  "messages_read":
                      len(all_messages),
              },
          }

          MEMORY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          MEMORY_FILE.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # ---------------------------------------------------------
          # Compact GitHub Actions report
          # ---------------------------------------------------------

          print("")
          print("=== NØX ACT60 V4 - COGNITIVE MONITOR ===")
          print("Timestamp:", timestamp)
          print("Identity:", USERNAME)
          print(
              "AGENTS WITH CONVERSATIONS:",
              len(relationships),
          )
          print(
              "TOTAL MESSAGES READ:",
              len(all_messages),
          )
          print(
              "MESSAGES FROM NØX:",
              len(nox_messages),
          )
          print(
              "MESSAGES FROM OTHER AGENTS:",
              len(incoming_messages),
          )

          print("")
          print("COGNITIVE OBSERVATION:")
          print(
              "NØX RESPONSES ANALYZED:",
              nox_message_count,
          )
          print(
              "GENERIC RESPONSES:",
              generic_count,
          )
          print(
              "GENERIC RESPONSE RATIO:",
              f"{generic_ratio}%",
          )
          print(
              "CONTEXTUAL RESPONSES:",
              contextual_count,
          )
          print(
              "CONTEXTUAL RESPONSE RATIO:",
              f"{contextual_ratio}%",
          )
          print(
              "NØX QUESTIONS:",
              question_count,
          )

          print("")
          print("EXPERIENCE REUSE:")
          print(
              "WORKBUDDY / 160 SATS MENTIONS:",
              len(workbuddy_mentions),
          )
          print(
              "WORKBUDDY REUSE BY NØX:",
              len(workbuddy_reuse_by_nox),
          )
          print(
              "ACT14 MENTIONS:",
              len(act14_mentions),
          )
          print(
              "ACT14 REUSE BY NØX:",
              len(act14_reuse_by_nox),
          )
          print(
              "MARKETPLACE LEARNING MENTIONS:",
              len(marketplace_learning_mentions),
          )

          print("")
          print("RUN COMPARISON:")

          if comparison.get("previous_run_available"):
              print(
                  "GENERIC RATIO DELTA:",
                  comparison.get(
                      "generic_ratio_delta",
                      "n/a",
                  ),
              )
              print(
                  "CONTEXTUAL RATIO DELTA:",
                  comparison.get(
                      "contextual_ratio_delta",
                      "n/a",
                  ),
              )
          else:
              print("No previous cognitive baseline.")

          print("")
          print("IMPORTANT:")
          print(
              "ACT60 observes textual evidence only."
          )
          print(
              "ACT60 does not claim that NØX learned "
              "something merely because NØX mentioned it."
          )
          print(
              "Real learning requires later behavioral "
              "or outcome evidence."
          )

          print("")
          print("MEMORY:", MEMORY_FILE)
          print("Gemini: False")
          print("External AI: False")
          print("Reading only: True")
          print("Messaging: False")
          print("Payments: False")
          print("Spending: False")
          print("Cost: €0")
          print("ACT60_STATUS: ACTIVE")
          PY

      - name: Commit ACT60 V4 memory
        run: |
          git config user.name "NØX ACT60"
          git config user.email "nox-act60@users.noreply.github.com"

          git add memory/nox_act60_relationships.json

          if git diff --cached --quiet; then
            echo "No ACT60 V4 memory change."
            exit 0
          fi

          git commit -m "chore: update NØX ACT60 cognitive relationship memory"
          git push
