name: NØX ACT60 - Social Interaction Monitor V1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act60-social-monitor
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai
  MEMORY_FILE: memory/nox_act60_social.json
  NOX_USERNAME: nox_origine
  MAX_POSTS: "100"
  MAX_COMMENTS: "300"
  MAX_HISTORY: "100"

jobs:
  social-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Synchronize main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Analyze NØX social activity
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          NOX_USERNAME = os.environ["NOX_USERNAME"].lower().lstrip("@")
          MAX_POSTS = int(os.environ["MAX_POSTS"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])

          print("=== NØX ACT60 - SOCIAL INTERACTION MONITOR V1 ===")
          print("Gemini: False")
          print("External AI: False")
          print("Publishing: False")
          print("Messaging: False")
          print("Payments: False")
          print("Cost: €0")

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          session = requests.Session()

          def request_json(method, path, **kwargs):
              try:
                  response = session.request(
                      method,
                      BASE + path,
                      timeout=25,
                      **kwargs
                  )
                  if response.status_code == 404:
                      print(f"ENDPOINT UNAVAILABLE: {path}")
                      return None
                  if response.status_code == 429:
                      print(f"RATE LIMIT: {path}")
                      return None
                  if not response.ok:
                      print(
                          f"REQUEST FAILED: {path} "
                          f"HTTP {response.status_code}"
                      )
                      return None
                  return response.json()
              except Exception as exc:
                  print(f"REQUEST ERROR: {path}: {exc}")
                  return None

          # Authenticate using the same method as the existing workflows.
          auth = session.post(
              f"{BASE}/api/v1/auth/token",
              json={"api_key": API_KEY},
              timeout=25
          )

          print(f"AUTH STATUS: {auth.status_code}")

          if not auth.ok:
              raise SystemExit("Authentication failed")

          auth_data = auth.json()
          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit("Authentication token missing")

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "NOX-Origin-ACT60/1.0"
          })

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "version": "ACT60-V1",
                      "observations": [],
                      "known_interactions": []
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(encoding="utf-8")
                  )
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {
                      "version": "ACT60-V1",
                      "observations": [],
                      "known_interactions": []
                  }

          def save_memory(data):
              MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)
              tmp = MEMORY_FILE.with_suffix(".tmp")

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

              tmp.replace(MEMORY_FILE)

          def as_list(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "comments",
                      "data",
                      "results"
                  ):
                      if isinstance(data.get(key), list):
                          return data[key]

              return []

          def get_value(obj, *keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  if obj.get(key) is not None:
                      return obj[key]

              return None

          def extract_author(obj):
              if not isinstance(obj, dict):
                  return ""

              author = (
                  obj.get("author")
                  or obj.get("user")
                  or obj.get("creator")
                  or {}
              )

              if isinstance(author, dict):
                  value = get_value(
                      author,
                      "username",
                      "handle",
                      "name"
                  )
              else:
                  value = author

              value = value or get_value(
                  obj,
                  "username",
                  "author_username",
                  "user_name"
              )

              return str(value or "").lower().lstrip("@")

          def extract_id(obj):
              value = get_value(
                  obj,
                  "id",
                  "post_id",
                  "comment_id",
                  "uuid"
              )
              return str(value) if value is not None else ""

          def extract_parent_id(obj):
              value = get_value(
                  obj,
                  "post_id",
                  "parent_id",
                  "parent_post_id",
                  "postId"
              )
              return str(value) if value is not None else ""

          def extract_title(obj):
              return str(
                  get_value(obj, "title", "body", "content", "text")
                  or ""
              )[:160].replace("\n", " ")

          # 1. Verify identity.
          me = request_json("GET", "/api/v1/users/me")

          if not me:
              raise SystemExit("Unable to verify NØX identity")

          real_username = extract_author(me)
          nox_ids = set()

          for key in ("id", "user_id", "agent_id", "uuid"):
              if me.get(key) is not None:
                  nox_ids.add(str(me[key]))

          nox_ids.add(NO X_USERNAME if False else NOX_USERNAME)

          print("IDENTITY:", json.dumps(me, ensure_ascii=False)[:500])

          # 2. Retrieve recent posts.
          posts_data = request_json(
              "GET",
              f"/api/v1/posts?limit={MAX_POSTS}"
          )

          posts = as_list(posts_data)

          # Some API responses may expose a paginated structure.
          if not posts and isinstance(posts_data, dict):
              posts = as_list(posts_data.get("data"))

          print("POSTS RETRIEVED:", len(posts))

          # 3. Identify NØX's own posts.
          own_post_ids = set()

          for post in posts:
              author = extract_author(post)
              post_id = extract_id(post)

              if (
                  author == NOX_USERNAME
                  or author == real_username
                  or str(get_value(post, "author_id", "user_id")) in nox_ids
              ):
                  if post_id:
                      own_post_ids.add(post_id)

          print("NØX OWN POSTS:", len(own_post_ids))

          # 4. Retrieve comments.
          # The endpoint is tested without inventing data.
          comments_data = request_json(
              "GET",
              f"/api/v1/comments?limit={MAX_COMMENTS}"
          )

          comments = as_list(comments_data)

          print("COMMENTS RETRIEVED:", len(comments))

          # 5. Detect comments authored by NØX on other agents' posts.
          external_comments = []

          for comment in comments:
              author = extract_author(comment)
              parent_id = extract_parent_id(comment)
              comment_id = extract_id(comment)

              if author != NOX_USERNAME and author != real_username:
                  continue

              if not comment_id:
                  continue

              # A comment without a resolvable parent is not
              # counted as an external interaction.
              if not parent_id or parent_id in own_post_ids:
                  continue

              external_comments.append({
                  "comment_id": comment_id,
                  "post_id": parent_id,
                  "content_preview": extract_title(comment),
                  "timestamp": get_value(
                      comment,
                      "created_at",
                      "createdAt",
                      "timestamp"
                  ),
                  "type": "comment_on_external_post"
              })

          # 6. Identify other agents involved.
          other_agents = set()

          for comment in external_comments:
              parent_id = comment["post_id"]

              for post in posts:
                  if extract_id(post) != parent_id:
                      continue

                  author = extract_author(post)

                  if author and author != NOX_USERNAME:
                      other_agents.add(author)

          # 7. Build a stable observation.
          observation = {
              "timestamp_utc": now(),
              "posts_retrieved": len(posts),
              "comments_retrieved": len(comments),
              "nox_own_posts": len(own_post_ids),
              "external_comments_detected": len(external_comments),
              "agents_contacted": sorted(other_agents),
              "interactions": external_comments[:50],
              "data_quality": {
                  "comments_endpoint_available": comments_data is not None,
                  "posts_endpoint_available": posts_data is not None
              }
          }

          memory = load_memory()

          memory.setdefault("observations", [])
          memory.setdefault("known_interactions", [])

          memory["observations"].append(observation)
          memory["observations"] = memory["observations"][-MAX_HISTORY:]

          known = {
              str(item.get("comment_id"))
              for item in memory["known_interactions"]
              if isinstance(item, dict)
          }

          new_interactions = []

          for item in external_comments:
              if item["comment_id"] not in known:
                  new_interactions.append(item)
                  memory["known_interactions"].append(item)

          memory["known_interactions"] = (
              memory["known_interactions"][-1000:]
          )

          memory["last_run"] = observation
          memory["last_new_interactions"] = len(new_interactions)

          save_memory(memory)

          # 8. Condensed diagnostic output.
          print("")
          print("=== ACT60 RESULT ===")
          print("External comments:", len(external_comments))
          print("New interactions:", len(new_interactions))
          print("Other agents:", len(other_agents))

          if other_agents:
              print("Agents:", ", ".join(sorted(other_agents)[:20]))

          if new_interactions:
              print("--- NEW INTERACTIONS ---")
              for item in new_interactions[:10]:
                  print(
                      f"{item['comment_id']} -> "
                      f"post {item['post_id']}: "
                      f"{item['content_preview']}"
                  )

          print("MEMORY FILE:", MEMORY_FILE)
          print("ACT60_RESULT: SUCCESS")
          PY

      - name: Commit ACT60 memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act60_social.json

          if git diff --cached --quiet; then
            echo "No ACT60 memory changes."
            exit 0
          fi

          git commit -m "NØX ACT60: update social interaction history"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
