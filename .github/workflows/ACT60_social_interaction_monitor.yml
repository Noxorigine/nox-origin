name: NØX ACT60 V3 - Relationship & Conversation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act60-relationship-monitor
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  NOX_USERNAME: nox_origine
  MEMORY_FILE: memory/nox_act60_relationships.json
  MAX_CONVERSATIONS: "100"
  MAX_MESSAGES_PER_CONVERSATION: "100"
  MAX_HISTORY: "500"

jobs:
  relationship-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Read Colony conversations
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          USERNAME = os.environ["NOX_USERNAME"]
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])

          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_MESSAGES = int(os.environ["MAX_MESSAGES_PER_CONVERSATION"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          def now():
              return datetime.now(timezone.utc).isoformat()

          def normalize_list(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "results",
                      "conversations",
                      "messages",
                      "data",
                  ):
                      value2 = value.get(key)
                      if isinstance(value2, list):
                          return value2

              return []

          def username_from(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  return str(
                      value.get("username")
                      or value.get("user_name")
                      or value.get("name")
                      or ""
                  ).strip()

              return ""

          def message_id(message):
              if not isinstance(message, dict):
                  return ""

              return str(
                  message.get("id")
                  or message.get("message_id")
                  or message.get("uuid")
                  or ""
              )

          def message_body(message):
              if not isinstance(message, dict):
                  return ""

              body = (
                  message.get("body")
                  or message.get("content")
                  or message.get("text")
                  or ""
              )

              return str(body)

          def message_author(message):
              if not isinstance(message, dict):
                  return ""

              for key in (
                  "sender",
                  "author",
                  "from_user",
                  "from",
              ):
                  value = username_from(message.get(key))
                  if value:
                      return value

              return str(
                  message.get("sender_username")
                  or message.get("author_username")
                  or message.get("from_username")
                  or ""
              ).strip()

          def message_timestamp(message):
              if not isinstance(message, dict):
                  return ""

              return str(
                  message.get("created_at")
                  or message.get("timestamp")
                  or message.get("sent_at")
                  or ""
              )

          # ---------------------------------------------------------
          # Load previous memory
          # ---------------------------------------------------------

          if MEMORY_FILE.exists():
              try:
                  memory = json.loads(
                      MEMORY_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          previous_relationships = memory.get("relationships", {})
          if not isinstance(previous_relationships, dict):
              previous_relationships = {}

          # ---------------------------------------------------------
          # Authentication
          # ---------------------------------------------------------

          auth = requests.post(
              f"{BASE}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"AUTH /api/v1/auth/token -> {auth.status_code}")
          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit("No access token returned")

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          })

          def get(path, params=None):
              response = session.get(
                  BASE + path,
                  params=params,
                  timeout=30,
              )

              if response.status_code == 429:
                  print("RATE_LIMIT:", path)
                  return None

              if response.status_code >= 400:
                  print(
                      f"GET {path} -> {response.status_code}: "
                      f"{response.text[:300]}"
                  )
                  return None

              try:
                  return response.json()
              except Exception:
                  return None

          # ---------------------------------------------------------
          # Verify identity
          # ---------------------------------------------------------

          me = get("/api/v1/users/me")

          if not isinstance(me, dict):
              raise SystemExit("Unable to retrieve NØX identity")

          returned_username = str(
              me.get("username") or ""
          ).strip()

          print("NØX identity:", returned_username)

          if returned_username.lower() != USERNAME.lower():
              raise SystemExit(
                  f"Wrong Colony identity: "
                  f"expected {USERNAME}, received {returned_username}"
              )

          # ---------------------------------------------------------
          # Get all conversations
          # ---------------------------------------------------------

          conversations_result = get(
              "/api/v1/messages/conversations",
              params={
                  "limit": MAX_CONVERSATIONS,
                  "include_archived": "true",
              },
          )

          conversations = normalize_list(conversations_result)

          print("Conversations found:", len(conversations))

          relationships = {}
          all_messages = []

          # ---------------------------------------------------------
          # Read every 1:1 conversation
          # ---------------------------------------------------------

          for conversation in conversations:

              if not isinstance(conversation, dict):
                  continue

              other_username = ""

              # Current documented shape
              for key in (
                  "other_user",
                  "user",
                  "participant",
                  "recipient",
              ):
                  candidate = username_from(
                      conversation.get(key)
                  )
                  if candidate:
                      other_username = candidate
                      break

              # Alternative direct username fields
              if not other_username:
                  for key in (
                      "username",
                      "other_username",
                      "participant_username",
                  ):
                      candidate = str(
                          conversation.get(key) or ""
                      ).strip()

                      if candidate:
                          other_username = candidate
                          break

              if not other_username:
                  continue

              if other_username.lower() == USERNAME.lower():
                  continue

              # -----------------------------------------------------
              # Read the actual conversation
              # -----------------------------------------------------

              thread = get(
                  f"/api/v1/messages/conversations/"
                  f"{requests.utils.quote(other_username, safe='')}"
              )

              messages = normalize_list(thread)

              if not messages:
                  continue

              # Newest-first or oldest-first responses are both
              # normalized below.
              messages = messages[:MAX_MESSAGES]

              relationship_messages = []

              for message in messages:

                  if not isinstance(message, dict):
                      continue

                  body = message_body(message)

                  if not body:
                      continue

                  author = message_author(message)

                  if not author:
                      author = other_username

                  direction = (
                      "from_nox"
                      if author.lower() == USERNAME.lower()
                      else "from_agent"
                  )

                  record = {
                      "id": message_id(message),
                      "conversation_with": other_username,
                      "direction": direction,
                      "author": author,
                      "created_at": message_timestamp(message),
                      "body": body,
                  }

                  relationship_messages.append(record)
                  all_messages.append(record)

              if not relationship_messages:
                  continue

              relationship_messages.sort(
                  key=lambda x: x.get("created_at") or ""
              )

              from_nox = [
                  x for x in relationship_messages
                  if x["direction"] == "from_nox"
              ]

              from_agent = [
                  x for x in relationship_messages
                  if x["direction"] == "from_agent"
              ]

              latest = relationship_messages[-1]

              relationships[other_username] = {
                  "username": other_username,
                  "message_count": len(relationship_messages),
                  "messages_from_nox": len(from_nox),
                  "messages_from_agent": len(from_agent),
                  "last_interaction": latest.get("created_at"),
                  "last_direction": latest.get("direction"),
                  "messages": relationship_messages,
              }

          # ---------------------------------------------------------
          # Preserve relationships that temporarily return no data
          # ---------------------------------------------------------

          for username, old_data in previous_relationships.items():

              if username in relationships:
                  continue

              if not isinstance(old_data, dict):
                  continue

              relationships[username] = old_data

          # ---------------------------------------------------------
          # Build interaction summary
          # ---------------------------------------------------------

          external_agents = []

          for username, relationship in relationships.items():

              if username.lower() == USERNAME.lower():
                  continue

              external_agents.append(username)

          external_agents = sorted(
              set(external_agents),
              key=lambda x: x.lower()
          )

          total_from_nox = sum(
              int(r.get("messages_from_nox", 0))
              for r in relationships.values()
              if isinstance(r, dict)
          )

          total_from_agents = sum(
              int(r.get("messages_from_agent", 0))
              for r in relationships.values()
              if isinstance(r, dict)
          )

          # ---------------------------------------------------------
          # Compact recent global history
          # ---------------------------------------------------------

          all_messages.sort(
              key=lambda x: x.get("created_at") or "",
              reverse=True,
          )

          recent_messages = all_messages[:MAX_HISTORY]

          timestamp = now()

          output = {
              "version": "ACT60_V3",
              "updated_at": timestamp,
              "username": USERNAME,

              "summary": {
                  "agents_with_conversations": len(external_agents),
                  "total_messages_read": len(all_messages),
                  "messages_from_nox": total_from_nox,
                  "messages_from_other_agents": total_from_agents,
              },

              "relationships": relationships,

              "recent_messages": recent_messages,

              "policy": {
                  "reading_only": True,
                  "publishing": False,
                  "commenting": False,
                  "messaging": False,
                  "payments": False,
                  "spending": False,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0,
              },

              "last_run": {
                  "timestamp": timestamp,
                  "conversations_scanned": len(conversations),
                  "conversations_with_messages": len(relationships),
                  "messages_read": len(all_messages),
              },
          }

          MEMORY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          MEMORY_FILE.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # ---------------------------------------------------------
          # Compact GitHub Actions output
          # ---------------------------------------------------------

          print("")
          print("=== NØX ACT60 V3 - RELATIONSHIPS ===")
          print("Timestamp:", timestamp)
          print("Identity:", USERNAME)
          print("AGENTS WITH CONVERSATIONS:", len(external_agents))
          print("TOTAL MESSAGES READ:", len(all_messages))
          print("MESSAGES FROM NØX:", total_from_nox)
          print("MESSAGES FROM OTHER AGENTS:", total_from_agents)
          print("")

          print("RELATIONSHIPS:")

          ranked = sorted(
              relationships.values(),
              key=lambda r: (
                  -int(r.get("message_count", 0)),
                  str(r.get("username", "")).lower(),
              ),
          )

          for relationship in ranked[:20]:
              print(
                  f"  @{relationship['username']} | "
                  f"{relationship['message_count']} messages | "
                  f"NØX={relationship['messages_from_nox']} | "
                  f"AGENT={relationship['messages_from_agent']} | "
                  f"last={relationship['last_interaction']}"
              )

          print("")
          print("RECENT CONVERSATION CONTENT:")

          for message in reversed(recent_messages[:12]):
              body = " ".join(
                  str(message.get("body", "")).split()
              )

              if len(body) > 180:
                  body = body[:180] + "..."

              print(
                  f"  {message.get('created_at')} | "
                  f"@{message.get('conversation_with')} | "
                  f"{message.get('direction')} | "
                  f"{body}"
              )

          print("")
          print("MEMORY:", MEMORY_FILE)
          print("Gemini: False")
          print("External AI: False")
          print("Reading only: True")
          print("Messaging: False")
          print("Payments: False")
          print("Spending: False")
          print("Cost: €0")
          print("ACT60_STATUS: ACTIVE")
          PY

      - name: Commit ACT60 V3 memory
        run: |
          git config user.name "NØX ACT60"
          git config user.email "nox-act60@users.noreply.github.com"

          git add memory/nox_act60_relationships.json

          if git diff --cached --quiet; then
            echo "No ACT60 V3 memory change."
            exit 0
          fi

          git commit -m "chore: update NØX ACT60 relationship memory"
          git push
