name: NØX ACT60 V2 - Social Interaction Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act60-social-interaction
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  NOX_USERNAME: nox_origine
  MEMORY_FILE: memory/nox_act60_social.json
  MAX_ACTIONS: "300"
  MAX_HISTORY: "200"
  MAX_AGENTS: "100"

jobs:
  social-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Track NØX social interactions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          USERNAME = os.environ["NOX_USERNAME"]
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS"])
          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_AGENTS = int(os.environ["MAX_AGENTS"])

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          def compact(value, limit=1500):
              try:
                  text = json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  text = str(value)

              return text[:limit]

          def normalize_items(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "results",
                      "posts",
                      "conversations",
                      "actions",
                  ):
                      if isinstance(value.get(key), list):
                          return value[key]

              return []

          # ------------------------------------------------------------
          # Load memory
          # ------------------------------------------------------------

          if MEMORY_FILE.exists():
              try:
                  memory = json.loads(
                      MEMORY_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          history = memory.get("history", [])
          if not isinstance(history, list):
              history = []

          # ------------------------------------------------------------
          # Authenticate
          # ------------------------------------------------------------

          auth = requests.post(
              f"{BASE}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"AUTH /api/v1/auth/token -> {auth.status_code}")
          auth.raise_for_status()

          token_data = auth.json()
          token = (
              token_data.get("access_token")
              or token_data.get("token")
              or token_data.get("jwt")
          )

          if not token:
              raise SystemExit("No access token returned")

          HEADERS = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          def get(path, params=None):
              response = SESSION.get(
                  BASE + path,
                  params=params,
                  timeout=30,
              )

              if response.status_code == 429:
                  print("RATE_LIMIT:", path)
                  return None

              if response.status_code >= 400:
                  print(
                      f"GET {path} -> {response.status_code}: "
                      f"{response.text[:500]}"
                  )
                  return None

              try:
                  return response.json()
              except Exception:
                  return None

          # ------------------------------------------------------------
          # Identity
          # ------------------------------------------------------------

          me = get("/api/v1/users/me")

          if not isinstance(me, dict):
              raise SystemExit("Unable to retrieve NØX identity")

          returned_username = str(
              me.get("username", "")
          ).strip()

          print("NØX identity:", returned_username)

          if returned_username != USERNAME:
              raise SystemExit(
                  f"Wrong Colony identity: expected {USERNAME}, "
                  f"received {returned_username}"
              )

          nox_id = str(me.get("id", "")).strip()

          # ------------------------------------------------------------
          # 1. Get NØX actions
          #
          # This is the authoritative activity surface:
          # post_created / comment_created / dm_sent
          # ------------------------------------------------------------

          actions = []
          cursor = None

          while len(actions) < MAX_ACTIONS:
              params = {
                  "kinds": "comment_created,dm_sent,post_created",
                  "limit": min(200, MAX_ACTIONS - len(actions)),
              }

              if cursor:
                  params["cursor"] = cursor

              result = get(
                  "/api/v1/me/actions",
                  params=params
              )

              if not isinstance(result, dict):
                  break

              page_items = result.get("items") or []

              if not isinstance(page_items, list):
                  break

              actions.extend(page_items)

              if not result.get("has_more"):
                  break

              cursor = result.get("next_cursor")

              if not cursor:
                  break

          print("NØX actions retrieved:", len(actions))

          # ------------------------------------------------------------
          # 2. Separate action types
          # ------------------------------------------------------------

          comments = [
              x for x in actions
              if isinstance(x, dict)
              and x.get("kind") == "comment_created"
          ]

          dms = [
              x for x in actions
              if isinstance(x, dict)
              and x.get("kind") == "dm_sent"
          ]

          posts = [
              x for x in actions
              if isinstance(x, dict)
              and x.get("kind") == "post_created"
          ]

          print("Own comments:", len(comments))
          print("Own DMs:", len(dms))
          print("Own posts:", len(posts))

          # ------------------------------------------------------------
          # 3. Resolve parent posts for NØX comments
          #
          # parent_id = post ID according to Colony API.
          # We fetch the parent post to determine its author.
          # ------------------------------------------------------------

          parent_ids = sorted({
              str(x.get("parent_id"))
              for x in comments
              if x.get("parent_id")
          })

          post_cache = {}

          def fetch_post(post_id):
              data = get(
                  f"/api/v1/posts/{quote(post_id, safe='')}"
              )
              return post_id, data

          if parent_ids:
              workers = min(8, len(parent_ids))

              with ThreadPoolExecutor(
                  max_workers=workers
              ) as executor:

                  futures = [
                      executor.submit(fetch_post, post_id)
                      for post_id in parent_ids
                  ]

                  for future in as_completed(futures):
                      try:
                          post_id, data = future.result()

                          if isinstance(data, dict):
                              post_cache[post_id] = data

                      except Exception as exc:
                          print(
                              "POST_RESOLVE_ERROR:",
                              str(exc)[:300]
                          )

          # ------------------------------------------------------------
          # 4. Classify comments
          # ------------------------------------------------------------

          external_comments = []
          own_post_replies = []

          agent_names = set()

          for action in comments:
              parent_id = str(
                  action.get("parent_id") or ""
              )

              post = post_cache.get(parent_id)

              if not post:
                  continue

              author = post.get("author")

              if not isinstance(author, dict):
                  author = {}

              author_username = str(
                  author.get("username")
                  or post.get("author_username")
                  or ""
              ).strip()

              if not author_username:
                  continue

              created_at = action.get("created_at")

              record = {
                  "kind": "comment",
                  "comment_id": action.get("resource_id"),
                  "post_id": parent_id,
                  "post_author": author_username,
                  "created_at": created_at,
              }

              if author_username.lower() == USERNAME.lower():
                  record["interaction"] = "reply_on_own_post"
                  own_post_replies.append(record)
              else:
                  record["interaction"] = "comment_on_other_agent"
                  external_comments.append(record)
                  agent_names.add(author_username)

          # ------------------------------------------------------------
          # 5. Resolve DM conversation partners
          # ------------------------------------------------------------

          conversations = normalize_items(
              get(
                  "/api/v1/messages/conversations",
                  params={
                      "limit": 100,
                      "include_archived": "true",
                  },
              ) or []
          )

          conversation_map = {}

          for conversation in conversations:
              if not isinstance(conversation, dict):
                  continue

              conversation_id = str(
                  conversation.get("id") or ""
              )

              other_user = conversation.get("other_user")

              if conversation_id and isinstance(
                  other_user,
                  dict
              ):
                  conversation_map[conversation_id] = other_user

          dm_records = []

          for action in dms:
              conversation_id = str(
                  action.get("parent_id") or ""
              )

              other = conversation_map.get(
                  conversation_id,
                  {}
              )

              other_username = str(
                  other.get("username") or ""
              ).strip()

              record = {
                  "kind": "dm_sent",
                  "message_id": action.get("resource_id"),
                  "conversation_id": conversation_id,
                  "agent": other_username or "unknown",
                  "created_at": action.get("created_at"),
              }

              dm_records.append(record)

              if other_username:
                  agent_names.add(other_username)

          # ------------------------------------------------------------
          # 6. Following list
          # ------------------------------------------------------------

          following_result = get(
              "/api/v1/users/me/following",
              params={
                  "limit": 100,
                  "page": 1,
              },
          ) or {}

          following = normalize_items(following_result)

          following_names = []

          for user in following:
              if not isinstance(user, dict):
                  continue

              name = str(
                  user.get("username") or ""
              ).strip()

              if name and name.lower() != USERNAME.lower():
                  following_names.append(name)

          # ------------------------------------------------------------
          # 7. Build interaction history
          # ------------------------------------------------------------

          current_records = (
              external_comments
              + own_post_replies
              + dm_records
          )

          # Stable deduplication
          existing_keys = {
              (
                  x.get("kind"),
                  x.get("comment_id") or x.get("message_id"),
              )
              for x in history
              if isinstance(x, dict)
          }

          for record in current_records:
              key = (
                  record.get("kind"),
                  record.get("comment_id")
                  or record.get("message_id"),
              )

              if key in existing_keys:
                  continue

              history.append(record)
              existing_keys.add(key)

          # newest first
          history.sort(
              key=lambda x: str(
                  x.get("created_at") or ""
              ),
              reverse=True,
          )

          history = history[:MAX_HISTORY]

          # ------------------------------------------------------------
          # 8. Agent interaction summary
          # ------------------------------------------------------------

          interaction_counts = {}

          for record in history:
              if not isinstance(record, dict):
                  continue

              agent = (
                  record.get("post_author")
                  or record.get("agent")
              )

              if not agent:
                  continue

              if agent.lower() == USERNAME.lower():
                  continue

              interaction_counts[agent] = (
                  interaction_counts.get(agent, 0) + 1
              )

          top_agents = sorted(
              interaction_counts.items(),
              key=lambda item: (-item[1], item[0].lower()),
          )[:MAX_AGENTS]

          # ------------------------------------------------------------
          # 9. Compact memory
          # ------------------------------------------------------------

          now = utc_now()

          memory_out = {
              "version": "ACT60_V2",
              "updated_at": now,
              "username": USERNAME,

              "summary": {
                  "external_agent_comments": len(
                      external_comments
                  ),
                  "replies_on_nox_posts": len(
                      own_post_replies
                  ),
                  "dms_sent": len(dms),
                  "unique_agents_interacted": len(
                      interaction_counts
                  ),
                  "following_count": len(
                      following_names
                  ),
              },

              "agents_interacted": [
                  {
                      "username": username,
                      "interactions": count,
                  }
                  for username, count in top_agents
              ],

              "following": following_names[:MAX_AGENTS],

              "recent_external_comments":
                  external_comments[:50],

              "recent_replies_received_context":
                  own_post_replies[:50],

              "recent_dms":
                  dm_records[:50],

              "history": history,

              "last_run": {
                  "timestamp": now,
                  "actions_scanned": len(actions),
                  "comments_scanned": len(comments),
                  "posts_scanned": len(posts),
                  "dms_scanned": len(dms),
              },

              "policy": {
                  "publishing": False,
                  "commenting": False,
                  "messaging": False,
                  "payments": False,
                  "spending": False,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0,
              },
          }

          MEMORY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          MEMORY_FILE.write_text(
              json.dumps(
                  memory_out,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # ------------------------------------------------------------
          # 10. Condensed GitHub output
          # ------------------------------------------------------------

          print("")
          print("=== NØX ACT60 V2 - SOCIAL INTERACTION ===")
          print("Timestamp:", now)
          print("Identity:", USERNAME)
          print("")
          print("COMMENTS BY NØX ON OTHER AGENTS:",
                len(external_comments))
          print("REPLIES ON NØX POSTS:",
                len(own_post_replies))
          print("DMS SENT:",
                len(dms))
          print("UNIQUE AGENTS INTERACTED:",
                len(interaction_counts))
          print("FOLLOWING:",
                len(following_names))
          print("")

          print("TOP INTERACTED AGENTS:")

          if top_agents:
              for username, count in top_agents[:15]:
                  print(f"  @{username}: {count}")
          else:
              print("  none")

          print("")
          print("RECENT EXTERNAL COMMENTS:")

          if external_comments:
              for item in external_comments[:10]:
                  print(
                      f"  {item.get('created_at')} | "
                      f"@{item.get('post_author')} | "
                      f"post={item.get('post_id')}"
                  )
          else:
              print("  none")

          print("")
          print("RECENT DMS:")

          if dm_records:
              for item in dm_records[:10]:
                  print(
                      f"  {item.get('created_at')} | "
                      f"@{item.get('agent')}"
                  )
          else:
              print("  none")

          print("")
          print("MEMORY:", MEMORY_FILE)
          print("")
          print("Gemini: False")
          print("External AI: False")
          print("Publishing: False")
          print("Commenting: False")
          print("Messaging: False")
          print("Payments: False")
          print("Spending: False")
          print("Cost: €0")
          print("")
          print("ACT60_STATUS: ACTIVE")

          PY

      - name: Commit ACT60 memory
        run: |
          git config user.name "NØX ACT60"
          git config user.email "nox-act60@users.noreply.github.com"

          git add memory/nox_act60_social.json

          if git diff --cached --quiet; then
            echo "No ACT60 memory change."
            exit 0
          fi

          git commit -m "chore: update NØX ACT60 social interaction memory"
          git push
