name: NØX ACT 57 V1.1 - Demand Discovery & Opportunity Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-57-demand-discovery
  cancel-in-progress: false

jobs:
  demand-discovery:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      COLONY_JWT: ${{ secrets.COLONY_JWT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT57
        run: |
          python <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          ACT = "ACT57"
          VERSION = "V1.1"

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          OUTPUT_FILE = Path(
              "memory/nox_act_57_demand_discovery.json"
          )

          GEMINI_USED = False
          PROJECT_COST_EUR = 0.0

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-ACT57/1.1"
          })

          api_key = os.environ.get("COLONY_API_KEY", "").strip()
          jwt = os.environ.get("COLONY_JWT", "").strip()

          if api_key:
              session.headers["X-API-Key"] = api_key

          if jwt:
              session.headers["Authorization"] = f"Bearer {jwt}"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def normalize(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )

              return " ".join(
                  str(value).split()
              ).strip()

          def fingerprint(item):
              raw = json.dumps(
                  item,
                  ensure_ascii=False,
                  sort_keys=True
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def request_json(path, params=None):
              try:
                  response = session.get(
                      BASE_URL + path,
                      params=params,
                      timeout=20
                  )

                  if not response.ok:
                      return {
                          "ok": False,
                          "status": response.status_code,
                          "data": None
                      }

                  return {
                      "ok": True,
                      "status": response.status_code,
                      "data": response.json()
                  }

              except Exception as exc:
                  return {
                      "ok": False,
                      "status": None,
                      "error": str(exc),
                      "data": None
                  }

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "tasks",
                  "requests",
                  "suggestions",
                  "data",
                  "results"
              ):
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for nested in (
                          "items",
                          "posts",
                          "tasks",
                          "requests",
                          "suggestions",
                          "results"
                      ):
                          if isinstance(
                              value.get(nested),
                              list
                          ):
                              return value[nested]

              return []

          def text_of(item):
              if not isinstance(item, dict):
                  return normalize(item)

              values = []

              for key in (
                  "title",
                  "body",
                  "text",
                  "description",
                  "content",
                  "summary",
                  "reason",
                  "message"
              ):
                  if key in item:
                      values.append(
                          normalize(item.get(key))
                      )

              return " ".join(
                  x for x in values if x
              )

          def first_value(item, keys):
              if not isinstance(item, dict):
                  return None

              for key in keys:
                  value = item.get(key)

                  if value not in (
                      None,
                      "",
                      [],
                      {}
                  ):
                      return value

              return None

          # ---------------------------------------------------------
          # Load previous memory
          # ---------------------------------------------------------

          previous = {}

          if OUTPUT_FILE.exists():
              try:
                  previous = json.loads(
                      OUTPUT_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  previous = {}

          processed = set(
              previous.get(
                  "processed_fingerprints",
                  []
              )
          )

          # ---------------------------------------------------------
          # Discovery sources
          # ---------------------------------------------------------

          sources = {
              "marketplace_tasks": request_json(
                  "/api/v1/marketplace/tasks"
              ),
              "feed_for_you": request_json(
                  "/api/v1/feed/for-you",
                  {"limit": 25}
              ),
              "suggestions": request_json(
                  "/api/v1/suggestions",
                  {"limit": 20}
              ),
              "posts": request_json(
                  "/api/v1/posts",
                  {
                      "sort": "new",
                      "limit": 25
                  }
              )
          }

          source_stats = {}

          for name, result in sources.items():
              source_stats[name] = {
                  "ok": result.get("ok", False),
                  "http_status": result.get("status"),
                  "items": len(
                      extract_items(
                          result.get("data")
                      )
                  )
              }

          # ---------------------------------------------------------
          # Capability signals
          # ---------------------------------------------------------

          capability_terms = {
              "python",
              "api",
              "github",
              "workflow",
              "automation",
              "agent",
              "agents",
              "research",
              "analysis",
              "documentation",
              "docs",
              "data",
              "json",
              "testing",
              "debug",
              "bug",
              "lightning",
              "bitcoin",
              "knowledge",
              "verification",
              "writing"
          }

          demand_terms = {
              "need",
              "needs",
              "looking for",
              "looking",
              "request",
              "wanted",
              "help",
              "require",
              "requires",
              "seeking",
              "task",
              "work",
              "please",
              "can someone",
              "who can",
              "human request",
              "human_request"
          }

          offer_terms = {
              "offering",
              "for hire",
              "i can",
              "we offer",
              "service",
              "services",
              "available for",
              "hire me"
          }

          # ---------------------------------------------------------
          # Discovery
          # ---------------------------------------------------------

          discovered = []

          for source_name, result in sources.items():

              if not result.get("ok"):
                  continue

              for item in extract_items(
                  result.get("data")
              ):

                  if not isinstance(item, dict):
                      continue

                  text = text_of(item)

                  if not text:
                      continue

                  lower = text.lower()

                  item_id = normalize(
                      first_value(
                          item,
                          (
                              "id",
                              "task_id",
                              "taskId",
                              "uuid",
                              "post_id",
                              "request_id"
                          )
                      )
                  )

                  title = normalize(
                      first_value(
                          item,
                          (
                              "title",
                              "name"
                          )
                      )
                  )

                  post_type = normalize(
                      first_value(
                          item,
                          (
                              "post_type",
                              "type",
                              "kind"
                          )
                      )
                  ).lower()

                  reward = first_value(
                      item,
                      (
                          "reward_sats",
                          "reward",
                          "budget",
                          "amount",
                          "price"
                      )
                  )

                  # -------------------------------------------------
                  # Classification
                  # -------------------------------------------------

                  demand_hits = sum(
                      1
                      for term in demand_terms
                      if term in lower
                  )

                  offer_hits = sum(
                      1
                      for term in offer_terms
                      if term in lower
                  )

                  capability_hits = [
                      term
                      for term in capability_terms
                      if term in lower
                  ]

                  explicit_task = (
                      source_name == "marketplace_tasks"
                      or post_type in (
                          "human_request",
                          "paid_task"
                      )
                      or any(
                          key in item
                          for key in (
                              "task_id",
                              "taskId",
                              "acceptance_criteria",
                              "reward_sats",
                              "budget"
                          )
                      )
                  )

                  if explicit_task:
                      classification = "explicit_task"

                  elif demand_hits >= 2:
                      classification = "implicit_demand"

                  elif demand_hits == 1:
                      classification = "possible_demand"

                  elif offer_hits:
                      classification = "agent_offer"

                  else:
                      classification = "general_signal"

                  # Offers are not demand.
                  if classification == "agent_offer":
                      continue

                  # General content is not enough.
                  if (
                      classification == "general_signal"
                      and not capability_hits
                  ):
                      continue

                  # -------------------------------------------------
                  # Score
                  # -------------------------------------------------

                  score = 0

                  if classification == "explicit_task":
                      score += 45

                  elif classification == "implicit_demand":
                      score += 35

                  elif classification == "possible_demand":
                      score += 20

                  if reward not in (
                      None,
                      "",
                      [],
                      {}
                  ):
                      score += 20

                  score += min(
                      20,
                      len(capability_hits) * 5
                  )

                  if demand_hits:
                      score += min(
                          10,
                          demand_hits * 3
                      )

                  fp = fingerprint({
                      "source": source_name,
                      "id": item_id,
                      "title": title,
                      "text": text[:1000]
                  })

                  is_new = fp not in processed

                  if is_new:
                      score += 10

                  score = min(100, score)

                  if score < 25:
                      continue

                  discovered.append({
                      "fingerprint": fp,
                      "source": source_name,
                      "item_id": item_id,
                      "title": title,
                      "text": text[:800],
                      "post_type": post_type,
                      "classification": classification,
                      "score": score,
                      "capability_matches": capability_hits,
                      "reward": reward,
                      "new": is_new
                  })

          # ---------------------------------------------------------
          # Deduplicate
          # ---------------------------------------------------------

          unique = {}

          for item in discovered:

              key = (
                  item["item_id"]
                  or item["fingerprint"]
              )

              if key not in unique:
                  unique[key] = item
              else:
                  if item["score"] > unique[key]["score"]:
                      unique[key] = item

          opportunities = list(
              unique.values()
          )

          opportunities.sort(
              key=lambda x: (
                  -x["score"],
                  not x["new"]
              )
          )

          opportunities = opportunities[:15]

          # ---------------------------------------------------------
          # Activation hints for ACT58
          # ---------------------------------------------------------

          activation_actions = []

          for item in opportunities:

              if item["classification"] == "explicit_task":
                  action = "ACT15_BID"

              elif item["classification"] == "implicit_demand":
                  action = "STRUCTURE_REQUEST"

              elif item["classification"] == "possible_demand":
                  action = "REVIEW_FOR_ACTIVATION"

              else:
                  action = "NO_ACTION"

              activation_actions.append({
                  "fingerprint": item["fingerprint"],
                  "item_id": item["item_id"],
                  "recommended_action": action,
                  "score": item["score"],
                  "executed": False
              })

          # ---------------------------------------------------------
          # History
          # ---------------------------------------------------------

          history = list(processed)

          for item in opportunities:
              history.append(
                  item["fingerprint"]
              )

          history = list(
              dict.fromkeys(history)
          )[-500:]

          # ---------------------------------------------------------
          # Memory
          # ---------------------------------------------------------

          output = {
              "version": ACT,
              "workflow_version": VERSION,
              "created_at": previous.get(
                  "created_at",
                  now()
              ),
              "updated_at": now(),
              "runs": int(
                  previous.get("runs", 0)
              ) + 1,

              "status": (
                  "OPPORTUNITIES_FOUND"
                  if opportunities
                  else "NO_QUALIFIED_DEMAND"
              ),

              "question": (
                  "Where is there real demand "
                  "that NØX can turn into useful work?"
              ),

              "gemini_used": GEMINI_USED,
              "project_cost_eur": PROJECT_COST_EUR,

              "source_stats": source_stats,

              "opportunities": opportunities,

              "activation_actions": activation_actions,

              "results": [
                  *(
                      previous.get(
                          "results",
                          []
                      )[-19:]
                  ),
                  {
                      "timestamp": now(),
                      "run": int(
                          previous.get(
                              "runs",
                              0
                          )
                      ) + 1,
                      "sources_checked": sum(
                          1
                          for x in source_stats.values()
                          if x["ok"]
                      ),
                      "opportunities_found": len(
                          opportunities
                      ),
                      "explicit_tasks": sum(
                          1
                          for x in opportunities
                          if x["classification"]
                          == "explicit_task"
                      ),
                      "implicit_demand": sum(
                          1
                          for x in opportunities
                          if x["classification"]
                          == "implicit_demand"
                      ),
                      "possible_demand": sum(
                          1
                          for x in opportunities
                          if x["classification"]
                          == "possible_demand"
                      )
                  }
              ],

              "actions": [],
              "bids": [],
              "accepted": [],
              "payments": [],
              "tips": [],

              "policy": {
                  "discover_only": True,
                  "auto_bid": False,
                  "auto_message": False,
                  "auto_spend": False,
                  "delegates_bidding_to": "ACT58/ACT15",
                  "cost_eur": 0.0
              },

              "processed_fingerprints": history
          }

          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_FILE.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Condensed log
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("NØX ACT57 V1.1")
          print("Demand Discovery & Opportunity Engine")
          print("========================================")
          print(
              "Sources OK:",
              sum(
                  1
                  for x in source_stats.values()
                  if x["ok"]
              ),
              "/",
              len(source_stats)
          )
          print(
              "Opportunities:",
              len(opportunities)
          )
          print(
              "Explicit tasks:",
              sum(
                  1
                  for x in opportunities
                  if x["classification"]
                  == "explicit_task"
              )
          )
          print(
              "Implicit demand:",
              sum(
                  1
                  for x in opportunities
                  if x["classification"]
                  == "implicit_demand"
              )
          )
          print(
              "Possible demand:",
              sum(
                  1
                  for x in opportunities
                  if x["classification"]
                  == "possible_demand"
              )
          )
          print("Bids created: 0")
          print("Messages sent: 0")
          print("Gemini: false")
          print("Cost: €0")
          print("")

          for index, item in enumerate(
              opportunities[:5],
              start=1
          ):
              title = (
                  item["title"]
                  or item["text"][:100]
                  or "(no title)"
              )

              print(
                  f"{index}. "
                  f"{item['score']}/100 "
                  f"[{item['classification']}] "
                  f"{title}"
              )

          print("")
          print(
              "Memory:",
              OUTPUT_FILE
          )
          print("========================================")
          PY

      - name: Commit ACT57 memory safely
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add memory/nox_act_57_demand_discovery.json

          if git diff --cached --quiet; then
            echo "No ACT57 changes."
            exit 0
          fi

          git commit -m "ACT57 demand discovery memory"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
