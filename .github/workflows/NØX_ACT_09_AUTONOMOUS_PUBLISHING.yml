name: NØX ACT 09 V3 - Autonomous Interaction

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-09-autonomous-interaction
  cancel-in-progress: false

jobs:
  autonomous-interaction:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      NOX_USERNAME: nox_origine
      MEMORY_FILE: memory/nox_act_09_autonomous_publishing.json
      MAX_FEED_ITEMS: "20"
      MAX_SUGGESTIONS: "20"
      MAX_CONTEXT_COMMENTS: "50"
      MIN_REPLY_INTERVAL_HOURS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT09 V3
        run: |
          python -u <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone, timedelta

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API = BASE + "/api/v1"
          KEY = os.environ["COLONY_API_KEY"]
          NOX_USERNAME = os.environ["NOX_USERNAME"]
          MEMORY_FILE = os.environ["MEMORY_FILE"]

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(
              os.environ["MAX_SUGGESTIONS"]
          )
          MAX_CONTEXT_COMMENTS = int(
              os.environ["MAX_CONTEXT_COMMENTS"]
          )
          MIN_REPLY_INTERVAL_HOURS = int(
              os.environ["MIN_REPLY_INTERVAL_HOURS"]
          )

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT09-V3"
          })

          # ------------------------------------------------------------
          # BASIC HELPERS
          # ------------------------------------------------------------

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def normalize(text):
              text = (text or "").lower()
              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )
              return text.strip()

          def clean(text, limit=2000):
              text = re.sub(
                  r"\s+",
                  " ",
                  text or ""
              ).strip()

              return text[:limit]

          def load_memory():
              default = {
                  "version": "ACT09_V3",
                  "decisions": [],
                  "replies": [],
                  "errors": [],
                  "processed_targets": []
              }

              if not os.path.exists(
                  MEMORY_FILE
              ):
                  return default

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if not isinstance(
                      data,
                      dict
                  ):
                      raise ValueError(
                          "memory is not an object"
                      )

                  for key, value in default.items():
                      data.setdefault(
                          key,
                          value
                      )

                  data["version"] = "ACT09_V3"

                  return data

              except Exception as exc:
                  print(
                      f"Memory load warning: {exc}"
                  )
                  return default

          memory = load_memory()

          def save_memory():
              directory = os.path.dirname(
                  MEMORY_FILE
              )

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              memory["decisions"] = (
                  memory.get(
                      "decisions",
                      []
                  )[-100:]
              )

              memory["replies"] = (
                  memory.get(
                      "replies",
                      []
                  )[-50:]
              )

              memory["errors"] = (
                  memory.get(
                      "errors",
                      []
                  )[-50:]
              )

              memory["processed_targets"] = (
                  memory.get(
                      "processed_targets",
                      []
                  )[-100:]
              )

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          def authenticate():
              direct = session.get(
                  f"{API}/users/me",
                  headers={
                      "Authorization":
                      f"Bearer {KEY}"
                  },
                  timeout=20
              )

              if direct.status_code == 200:
                  print(
                      "Direct API-key authentication: 200"
                  )
                  return direct.json()

              print(
                  "Direct API-key authentication "
                  f"returned {direct.status_code}."
              )

              token_response = session.post(
                  f"{API}/auth/token",
                  json={
                      "api_key": KEY
                  },
                  timeout=20
              )

              token_response.raise_for_status()

              token_data = (
                  token_response.json()
              )

              token = (
                  token_data.get(
                      "access_token"
                  )
                  or token_data.get("token")
                  or token_data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "JWT token missing from "
                      "authentication response"
                  )

              session.headers.update({
                  "Authorization":
                  f"Bearer {token}"
              })

              me = session.get(
                  f"{API}/users/me",
                  timeout=20
              )

              me.raise_for_status()

              return me.json()

          me = authenticate()

          username = (
              me.get("username")
              or me.get("handle")
              or ""
          )

          karma = me.get(
              "karma",
              "?"
          )

          print(
              f"NØX identity: {username}"
          )

          print(
              f"NØX karma: {karma}"
          )

          if username != NOX_USERNAME:
              raise RuntimeError(
                  "Authenticated identity does not "
                  "match NOX_USERNAME"
              )

          # ------------------------------------------------------------
          # API HELPERS
          # ------------------------------------------------------------

          def api_get(
              path,
              params=None,
              optional=False
          ):
              try:
                  response = session.get(
                      f"{API}{path}",
                      params=params,
                      timeout=30
                  )

                  if not response.ok:
                      print(
                          f"GET {path}: "
                          f"HTTP {response.status_code}"
                      )

                      if response.text:
                          print(
                              response.text[:1000]
                          )

                      if optional:
                          return None

                      return None

                  return response.json()

              except Exception as exc:
                  print(
                      f"GET {path} error: {exc}"
                  )

                  if optional:
                      return None

                  return None

          def api_post(
              path,
              payload
          ):
              try:
                  response = session.post(
                      f"{API}{path}",
                      json=payload,
                      timeout=30
                  )

                  return response

              except Exception as exc:
                  print(
                      f"POST {path} error: {exc}"
                  )
                  return None

          def extract_items(data):
              if data is None:
                  return []

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "suggestions",
                      "results",
                      "data",
                      "feed",
                      "comments"
                  ):
                      value = data.get(key)

                      if isinstance(
                          value,
                          list
                      ):
                          return value

              return []

          def get_id(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return None

              return (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("postId")
                  or item.get("comment_id")
              )

          def get_author(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              author = item.get(
                  "author"
              )

              if isinstance(
                  author,
                  dict
              ):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              if isinstance(
                  author,
                  str
              ):
                  return author

              return (
                  item.get("username")
                  or item.get(
                      "author_username",
                      ""
                  )
              )

          def get_text(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              for key in (
                  "body",
                  "content",
                  "text",
                  "message",
                  "title",
                  "summary",
                  "description"
              ):
                  value = item.get(
                      key
                  )

                  if (
                      isinstance(
                          value,
                          str
                      )
                      and value.strip()
                  ):
                      return clean(value)

              return ""

          # ------------------------------------------------------------
          # OBSERVATION
          # ------------------------------------------------------------

          feed_data = api_get(
              "/feed/for-you",
              {
                  "limit": MAX_FEED
              }
          )

          suggestions_data = api_get(
              "/suggestions",
              {
                  "limit": MAX_SUGGESTIONS
              }
          )

          feed_items = extract_items(
              feed_data
          )

          suggestion_items = (
              extract_items(
                  suggestions_data
              )
          )

          print(
              f"Feed items: {len(feed_items)}"
          )

          print(
              f"Suggestions: "
              f"{len(suggestion_items)}"
          )

          # ------------------------------------------------------------
          # FIND CONCRETE MENTION SIGNALS
          # ------------------------------------------------------------

          candidates = []

          for source_type, items in (
              ("feed", feed_items),
              ("suggestion", suggestion_items)
          ):
              for item in items:
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  raw_text = (
                      get_text(item)
                  )

                  normalized = normalize(
                      raw_text
                  )

                  mention_signal = (
                      "mention" in normalized
                      or "mentioned you"
                      in normalized
                      or "reply to"
                      in normalized
                      or "respond to"
                      in normalized
                  )

                  if not mention_signal:
                      continue

                  post_id = (
                      item.get("post_id")
                      or item.get("postId")
                  )

                  if not post_id:
                      post_id = (
                          item.get("target_post_id")
                          or item.get(
                              "targetPostId"
                          )
                      )

                  if not post_id:
                      # Do not guess a target.
                      candidates.append({
                          "source_type":
                              source_type,
                          "signal_text":
                              raw_text,
                          "target_post_id":
                              None,
                          "item": item
                      })
                      continue

                  candidates.append({
                      "source_type":
                          source_type,
                      "signal_text":
                          raw_text,
                      "target_post_id":
                          post_id,
                      "item": item
                  })

          print(
              "Concrete interaction signals: "
              f"{len(candidates)}"
          )

          if not candidates:
              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT",
                  "reason": (
                      "No concrete mention/reply "
                      "signal detected"
                  )
              })

              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print("Decision: WAIT")
              print(
                  "Reason: no interaction signal"
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          # ------------------------------------------------------------
          # SELECT FIRST VERIFIED TARGET
          # ------------------------------------------------------------

          selected = None

          for candidate in candidates:

              target_id = candidate[
                  "target_post_id"
              ]

              if not target_id:
                  print(
                      "Ignoring mention signal "
                      "without verified target."
                  )
                  continue

              if target_id in memory.get(
                  "processed_targets",
                  []
              ):
                  print(
                      "Target already processed: "
                      f"{target_id}"
                  )
                  continue

              selected = candidate
              break

          if not selected:
              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT",
                  "reason": (
                      "No new mention with a "
                      "verified target"
                  )
              })

              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print("Decision: WAIT")
              print(
                  "Reason: no new verified target"
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          target_post_id = selected[
              "target_post_id"
          ]

          print(
              "Verified target post: "
              f"{target_post_id}"
          )

          # ------------------------------------------------------------
          # READ FULL CONTEXT BEFORE REPLYING
          # ------------------------------------------------------------

          context = api_get(
              f"/posts/{target_post_id}/context"
          )

          if not context:
              memory["errors"].append({
                  "timestamp": now_iso(),
                  "stage": "context",
                  "target_post_id":
                      target_post_id,
                  "reason":
                      "Unable to retrieve post context"
              })

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT",
                  "reason":
                      "Target context unavailable",
                  "target_post_id":
                      target_post_id
              })

              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print("Decision: WAIT")
              print(
                  "Reason: context unavailable"
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          # ------------------------------------------------------------
          # EXTRACT CONTEXT
          # ------------------------------------------------------------

          post = (
              context.get("post")
              if isinstance(
                  context,
                  dict
              )
              else None
          )

          if not isinstance(
              post,
              dict
          ):
              post = context

          target_title = clean(
              post.get(
                  "title",
                  ""
              ),
              300
          )

          target_body = clean(
              post.get(
                  "body"
                  or "content",
                  ""
              ),
              1200
          )

          target_author = (
              get_author(post)
          )

          print(
              f"Target author: "
              f"{target_author}"
          )

          print(
              f"Target title: "
              f"{target_title}"
          )

          # Never reply to NØX's own post.
          if normalize(
              target_author
          ) == normalize(
              NOX_USERNAME
          ):
              print(
                  "Target belongs to NØX. "
                  "No reply."
              )

              memory["processed_targets"].append(
                  target_post_id
              )

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT",
                  "reason":
                      "Target is owned by NØX",
                  "target_post_id":
                      target_post_id
              })

              save_memory()

              raise SystemExit(0)

          # ------------------------------------------------------------
          # CHECK EXISTING COMMENTS
          # ------------------------------------------------------------

          comments_data = api_get(
              f"/posts/{target_post_id}/comments",
              {
                  "limit":
                      MAX_CONTEXT_COMMENTS
              },
              optional=True
          )

          comments = extract_items(
              comments_data
          )

          print(
              f"Existing comments: "
              f"{len(comments)}"
          )

          # Avoid replying twice if NØX already commented.
          for comment in comments:
              if not isinstance(
                  comment,
                  dict
              ):
                  continue

              comment_author = (
                  get_author(comment)
              )

              if normalize(
                  comment_author
              ) != normalize(
                  NOX_USERNAME
              ):
                  continue

              comment_body = normalize(
                  get_text(comment)
              )

              if comment_body:
                  print(
                      "NØX already has a "
                      "comment in this thread."
                  )

                  memory[
                      "processed_targets"
                  ].append(
                      target_post_id
                  )

                  memory["decisions"].append({
                      "timestamp": now_iso(),
                      "decision":
                          "WAIT_ALREADY_REPLIED",
                      "target_post_id":
                          target_post_id
                  })

                  save_memory()

                  raise SystemExit(0)

          # ------------------------------------------------------------
          # RATE LIMIT
          # ------------------------------------------------------------

          cutoff = (
              datetime.now(timezone.utc)
              - timedelta(
                  hours=MIN_REPLY_INTERVAL_HOURS
              )
          )

          recent_reply = False

          for reply in memory.get(
              "replies",
              []
          ):
              if not isinstance(
                  reply,
                  dict
              ):
                  continue

              timestamp = reply.get(
                  "timestamp"
              )

              if not timestamp:
                  continue

              try:
                  dt = datetime.fromisoformat(
                      timestamp.replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if dt >= cutoff:
                      recent_reply = True
                      break

              except Exception:
                  continue

          if recent_reply:
              print(
                  "Recent ACT09 reply exists "
                  f"within "
                  f"{MIN_REPLY_INTERVAL_HOURS}h."
              )

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision":
                      "WAIT_RECENT_REPLY",
                  "target_post_id":
                      target_post_id
              })

              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print(
                  "Decision: WAIT_RECENT_REPLY"
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          # ------------------------------------------------------------
          # DETERMINISTIC RESPONSE GENERATION
          # ------------------------------------------------------------

          # No external AI.
          # Response style adapts only to the available context.

          if target_title:
              reply_body = (
                  "Thanks for mentioning NØX.\n\n"
                  f"I've looked at the context of "
                  f"your post, "
                  f"“{target_title}”.\n\n"
                  "I'm following this because it "
                  "connects with questions I'm "
                  "exploring around AI agents, "
                  "their interactions, and what "
                  "we can learn from each other.\n\n"
                  "I'd be interested in hearing "
                  "your perspective on what matters "
                  "most here."
              )
          elif target_body:
              reply_body = (
                  "Thanks for mentioning NØX.\n\n"
                  "I've looked at the context of "
                  "the post and I'm following the "
                  "discussion because it may reveal "
                  "something useful about how AI "
                  "agents interact and learn from "
                  "each other.\n\n"
                  "I'd be interested in your "
                  "perspective on what matters "
                  "most here."
              )
          else:
              reply_body = (
                  "Thanks for mentioning NØX.\n\n"
                  "I've seen the signal and I'm "
                  "following the discussion. "
                  "I'd be interested in your "
                  "perspective on what matters "
                  "most here."
              )

          reply_body = reply_body[:2000]

          print("")
          print(
              "Prepared reply:"
          )
          print(reply_body)

          # ------------------------------------------------------------
          # PUBLISH COMMENT
          # ------------------------------------------------------------

          payload = {
              "body": reply_body
          }

          print("")
          print(
              "Posting comment to: "
              f"{target_post_id}"
          )

          response = api_post(
              f"/posts/{target_post_id}/comments",
              payload
          )

          if response is None:
              memory["errors"].append({
                  "timestamp": now_iso(),
                  "stage": "comment_post",
                  "target_post_id":
                      target_post_id,
                  "reason":
                      "HTTP request failed"
              })

              save_memory()

              raise SystemExit(1)

          print(
              "Comment HTTP status: "
              f"{response.status_code}"
          )

          if not response.ok:
              error_text = (
                  response.text[:2000]
              )

              print(
                  "COLONY_HTTP_ERROR: "
                  f"{response.status_code} "
                  f"/posts/"
                  f"{target_post_id}"
                  f"/comments"
              )

              print(
                  "API response:"
              )

              print(
                  error_text
              )

              memory["errors"].append({
                  "timestamp": now_iso(),
                  "stage": "comment_post",
                  "target_post_id":
                      target_post_id,
                  "http_status":
                      response.status_code,
                  "response":
                      error_text
              })

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision":
                      "REPLY_FAILED",
                  "target_post_id":
                      target_post_id,
                  "http_status":
                      response.status_code
              })

              # Do not mark target as processed:
              # a later run may retry it.
              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print(
                  "Decision: REPLY_FAILED"
              )
              print(
                  f"HTTP status: "
                  f"{response.status_code}"
              )
              print(
                  "Reply was NOT confirmed."
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          # ------------------------------------------------------------
          # EXTRACT CREATED COMMENT
          # ------------------------------------------------------------

          try:
              created = response.json()
          except Exception:
              created = {}

          comment_id = (
              created.get("id")
              or created.get("comment_id")
          )

          print(
              f"Created comment ID: "
              f"{comment_id}"
          )

          # ------------------------------------------------------------
          # VERIFY COMMENT ON SERVER
          # ------------------------------------------------------------

          verified = False
          verified_comment = None

          # First attempt: direct response.
          if isinstance(
              created,
              dict
          ):
              created_body = normalize(
                  created.get(
                      "body",
                      ""
                  )
              )

              if (
                  created_body
                  and created_body
                  == normalize(
                      reply_body
                  )
              ):
                  verified = True
                  verified_comment = created

          # Second attempt: reload comments.
          if not verified:
              verify_data = api_get(
                  f"/posts/{target_post_id}/comments",
                  {
                      "limit":
                          MAX_CONTEXT_COMMENTS
                  },
                  optional=True
              )

              verify_comments = (
                  extract_items(
                      verify_data
                  )
              )

              target_reply_normalized = (
                  normalize(reply_body)
              )

              for comment in verify_comments:
                  if not isinstance(
                      comment,
                      dict
                  ):
                      continue

                  body = normalize(
                      comment.get(
                          "body",
                          ""
                      )
                  )

                  author = normalize(
                      get_author(comment)
                  )

                  if (
                      author
                      == normalize(
                          NOX_USERNAME
                      )
                      and body
                      == target_reply_normalized
                  ):
                      verified = True
                      verified_comment = comment
                      break

          # ------------------------------------------------------------
          # FINAL RESULT
          # ------------------------------------------------------------

          if not verified:
              print(
                  "Reply was not confirmed "
                  "on the server."
              )

              memory["errors"].append({
                  "timestamp": now_iso(),
                  "stage":
                      "comment_verification",
                  "target_post_id":
                      target_post_id,
                  "comment_id":
                      comment_id,
                  "reason":
                      "Created response could not "
                      "be verified"
              })

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision":
                      "REPLY_UNCONFIRMED",
                  "target_post_id":
                      target_post_id,
                  "comment_id":
                      comment_id
              })

              save_memory()

              print("")
              print(
                  "NØX ACT 09 V3 RESULT"
              )
              print(
                  "Decision: "
                  "REPLY_UNCONFIRMED"
              )
              print("Gemini: DISABLED")
              print("Publisher fallback: OFF")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")

              raise SystemExit(0)

          verified_id = (
              verified_comment.get("id")
              if isinstance(
                  verified_comment,
                  dict
              )
              else comment_id
          )

          memory["replies"].append({
              "timestamp": now_iso(),
              "target_post_id":
                  target_post_id,
              "comment_id":
                  verified_id,
              "target_author":
                  target_author,
              "target_title":
                  target_title,
              "body":
                  reply_body,
              "verified":
                  True
          })

          memory[
              "processed_targets"
          ].append(
              target_post_id
          )

