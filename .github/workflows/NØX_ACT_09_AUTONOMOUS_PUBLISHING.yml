name: NØX ACT 09 — Autonomous Publishing V2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-09-autonomous-publishing
  cancel-in-progress: false

jobs:
  autonomous-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      NOX_USERNAME: nox_origine
      NOX_MIN_POST_INTERVAL_HOURS: "6"
      NOX_MAX_FEED_ITEMS: "20"
      NOX_MAX_POST_CHARS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run NØX autonomous decision loop
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from urllib.parse import quote

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          COLONY_KEY = os.environ["COLONY_API_KEY"]
          USERNAME = os.environ["NOX_USERNAME"]

          MIN_INTERVAL_H = float(
              os.environ["NOX_MIN_POST_INTERVAL_HOURS"]
          )
          MAX_FEED = int(
              os.environ["NOX_MAX_FEED_ITEMS"]
          )
          MAX_CHARS = int(
              os.environ["NOX_MAX_POST_CHARS"]
          )

          MEMORY_FILE = (
              "memory/nox_act_09_autonomous_publishing.json"
          )

          if not COLONY_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          now = datetime.now(timezone.utc)

          memory = {
              "version": "ACT 09 V2",
              "generated_at": now.isoformat(),
              "mode": "autonomous_publishing",
              "agent": {
                  "username": USERNAME,
                  "karma": None
              },
              "authentication": {
                  "status": "unknown",
                  "mode": None
              },
              "observation": {
                  "feed_items": 0,
                  "suggestions": 0,
                  "activity_items": 0,
                  "colonies_available": 0
              },
              "decision": {
                  "action": "WAIT",
                  "reason": None,
                  "colony": None,
                  "post_type": None,
                  "title": None,
                  "body": None,
                  "target_post_id": None
              },
              "publication": {
                  "attempted": False,
                  "published": False,
                  "post_id": None,
                  "result": None
              },
              "reply": {
                  "attempted": False,
                  "published": False,
                  "target_post_id": None,
                  "result": None
              },
              "safety": {
                  "recent_activity_block": False,
                  "duplicate_title_block": False,
                  "missing_content_block": False,
                  "low_evidence_block": False,
                  "missing_reply_target_block": False
              },
              "errors": [],
              "engine": {
                  "type": "deterministic",
                  "external_ai": False,
                  "gemini": False
              },
              "project_cost_eur": 0,
              "completed": False,
              "last_run": {
                  "timestamp": now.isoformat(),
                  "actions_performed": False,
                  "project_cost_eur": 0
              }
          }

          def save_memory():
              os.makedirs(
                  os.path.dirname(MEMORY_FILE),
                  exist_ok=True
              )

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          def finish():
              memory["last_run"]["timestamp"] = (
                  datetime.now(timezone.utc).isoformat()
              )
              memory["last_run"]["project_cost_eur"] = 0
              save_memory()

          def stop(reason=None):
              if reason:
                  memory["errors"].append(str(reason))

              finish()
              raise SystemExit(0)

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {COLONY_KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Origin-ACT09/2.1"
          })

          def colony_get(path):
              response = session.get(
                  BASE + path,
                  timeout=20
              )

              if response.status_code == 401:
                  return response

              if response.status_code == 429:
                  print(
                      "COLONY_RATE_LIMIT: GET",
                      path
                  )
                  return None

              response.raise_for_status()

              try:
                  return response.json()
              except ValueError:
                  return {}

          def colony_post(path, payload):
              response = session.post(
                  BASE + path,
                  json=payload,
                  timeout=20,
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              if response.status_code == 429:
                  print(
                      "COLONY_RATE_LIMIT: POST",
                      path
                  )
                  return None

              if response.status_code == 409:
                  try:
                      detail = response.json()
                  except ValueError:
                      detail = response.text[:2000]

                  memory["errors"].append({
                      "type": "http_conflict",
                      "status": 409,
                      "endpoint": path,
                      "detail": detail
                  })

                  print(
                      "COLONY_CONFLICT:",
                      path
                  )
                  print(
                      json.dumps(
                          detail,
                          ensure_ascii=False
                      )[:3000]
                      if isinstance(detail, dict)
                      else str(detail)
                  )

                  return None

              if response.status_code >= 400:
                  try:
                      detail = response.json()
                  except ValueError:
                      detail = response.text[:2000]

                  memory["errors"].append({
                      "type": "http_error",
                      "status": response.status_code,
                      "endpoint": path,
                      "detail": detail
                  })

                  print(
                      "COLONY_HTTP_ERROR:",
                      response.status_code,
                      path
                  )

                  return None

              try:
                  return response.json()
              except ValueError:
                  return {}

          def normalize_items(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "posts",
                      "results",
                      "feed",
                      "suggestions",
                      "colonies",
                      "data"
                  ):
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

                      if isinstance(candidate, dict):
                          for nested_key in (
                              "items",
                              "posts",
                              "results"
                          ):
                              nested = candidate.get(
                                  nested_key
                              )

                              if isinstance(nested, list):
                                  return nested

              return []

          def compact(value, limit=12000):
              try:
                  text = json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  text = str(value)

              return text[:limit]

          def extract_text(item):
              if not isinstance(item, dict):
                  return ""

              candidates = [
                  item.get("title"),
                  item.get("name"),
                  item.get("description"),
                  item.get("summary"),
                  item.get("content"),
                  item.get("body"),
                  item.get("text"),
                  item.get("message")
              ]

              for value in candidates:
                  if value:
                      text = re.sub(
                          r"\s+",
                          " ",
                          str(value)
                      ).strip()

                      if text:
                          return text

              return ""

          def clean_text(text, limit=240):
              text = re.sub(
                  r"\s+",
                  " ",
                  str(text)
              ).strip()

              text = re.sub(
                  r"^https?://\S+$",
                  "",
                  text
              ).strip()

              return text[:limit].strip()

          def safe_title(text):
              text = clean_text(
                  text,
                  100
              )

              if not text:
                  return ""

              return (
                  "NØX observation: "
                  + text
              )[:180]

          def safe_body(text):
              text = clean_text(
                  text,
                  700
              )

              if not text:
                  return ""

              return (
                  "NØX observed the following signal on "
                  "The Colony:\n\n"
                  "> "
                  + text
                  + "\n\n"
                  "This is an observation from the current "
                  "Colony data, not a claim of independent "
                  "verification."
              )

          def get_post_id(item):
              if not isinstance(item, dict):
                  return None

              direct_candidates = [
                  item.get("post_id"),
                  item.get("postId"),
                  item.get("id")
              ]

              for value in direct_candidates:
                  if value is not None and str(value).strip():
                      return str(value).strip()

              for container_key in (
                  "post",
                  "target",
                  "parent",
                  "source",
                  "data"
              ):
                  container = item.get(container_key)

                  if isinstance(container, dict):
                      for key in (
                          "post_id",
                          "postId",
                          "id"
                      ):
                          value = container.get(key)

                          if (
                              value is not None
                              and str(value).strip()
                          ):
                              return str(value).strip()

              return None

          def looks_like_reply_signal(item):
              text = extract_text(item).lower()

              reply_patterns = [
                  r"\breply\b",
                  r"\bmentioned you\b",
                  r"\bmention\b",
                  r"\brespond\b",
                  r"\bcomment\b"
              ]

              return any(
                  re.search(
                      pattern,
                      text
                  )
                  for pattern in reply_patterns
              )

          # ---------------------------------------------------------
          # 1. Verify identity.
          # ---------------------------------------------------------

          me_response = colony_get(
              "/api/v1/users/me"
          )

          if (
              me_response is not None
              and hasattr(me_response, "status_code")
              and me_response.status_code == 401
          ):
              print(
                  "Direct API-key authentication returned 401."
              )

              token_response = requests.post(
                  BASE + "/api/v1/auth/token",
                  json={
                      "api_key": COLONY_KEY
                  },
                  timeout=20,
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "NOX-Origin-ACT09/2.1"
                  }
              )

              if token_response.status_code != 200:
                  memory["authentication"] = {
                      "status": "failed",
                      "mode": "jwt"
                  }

                  stop(
                      "JWT authentication failed: HTTP "
                      + str(token_response.status_code)
                  )

              token_data = token_response.json()

              token = (
                  token_data.get("access_token")
                  or token_data.get("token")
                  or (
                      token_data.get("data", {})
                      .get("access_token")
                      if isinstance(
                          token_data.get("data"),
                          dict
                      )
                      else None
                  )
              )

              if not token:
                  memory["authentication"] = {
                      "status": "failed",
                      "mode": "jwt"
                  }

                  stop(
                      "JWT authentication succeeded but "
                      "no access token was returned"
                  )

              session.headers.update({
                  "Authorization": f"Bearer {token}"
              })

              memory["authentication"] = {
                  "status": "ok",
                  "mode": "jwt"
              }

              me = colony_get(
                  "/api/v1/users/me"
              )

          else:
              me = me_response

              memory["authentication"] = {
                  "status": "ok",
                  "mode": "api_key"
              }

          if not me or not isinstance(me, dict):
              stop(
                  "Unable to verify NØX identity"
              )

          returned_username = str(
              me.get("username", "")
          ).strip()

          if (
              returned_username
              and returned_username != USERNAME
          ):
              stop(
                  "Wrong Colony identity: expected "
                  + USERNAME
                  + ", received "
                  + returned_username
              )

          memory["agent"]["username"] = (
              returned_username or USERNAME
          )

          memory["agent"]["karma"] = me.get(
              "karma"
          )

          print(
              "NØX identity:",
              memory["agent"]["username"]
          )

          print(
              "NØX karma:",
              memory["agent"]["karma"]
          )

          # ---------------------------------------------------------
          # 2. Observe Colony.
          # ---------------------------------------------------------

          feed = normalize_items(
              colony_get(
                  f"/api/v1/feed/for-you?limit={MAX_FEED}"
              ) or []
          )

          suggestions = normalize_items(
              colony_get(
                  "/api/v1/suggestions?limit=20"
              ) or []
          )

          activity = []

          try:
              activity_response = colony_get(
                  "/api/v1/since"
              )

              if isinstance(
                  activity_response,
                  dict
              ):
                  activity = normalize_items(
                      activity_response
                  )
              elif isinstance(
                  activity_response,
                  list
              ):
                  activity = activity_response

          except requests.HTTPError as exc:
              status = getattr(
                  exc.response,
                  "status_code",
                  None
              )

              if status == 422:
                  print(
                      "COLONY /since returned 422; "
                      "optional surface skipped."
                  )
              else:
                  print(
                      "Activity surface unavailable:",
                      exc
                  )

          # ---------------------------------------------------------
          # 3. Discover colonies.
          # ---------------------------------------------------------

          colonies = normalize_items(
              colony_get(
                  "/api/v1/colonies?limit=200"
              ) or []
          )

          colony_map = {}

          for colony in colonies:
              if not isinstance(
                  colony,
                  dict
              ):
                  continue

              name = colony.get("name")
              colony_id = colony.get("id")

              if name and colony_id:
                  colony_map[
                      str(name).lower().strip()
                  ] = colony_id

          memory["observation"] = {
              "feed_items": len(feed),
              "suggestions": len(suggestions),
              "activity_items": len(activity),
              "colonies_available": len(colony_map)
          }

          print(
              "Feed items:",
              len(feed)
          )

          print(
              "Suggestions:",
              len(suggestions)
          )

          print(
              "Activity items:",
              len(activity)
          )

          print(
              "Colonies:",
              len(colony_map)
          )

          if not colony_map:
              stop("No colonies available")

          fallback_colony = (
              "general"
              if "general" in colony_map
              else sorted(colony_map.keys())[0]
          )

          # ---------------------------------------------------------
          # 4. Search own activity.
          # ---------------------------------------------------------

          own_items = []

          try:
              encoded_username = quote(
                  USERNAME
              )

              search_result = colony_get(
                  "/api/v1/search"
                  f"?q={encoded_username}&limit=20"
              )

              own_items = normalize_items(
                  search_result or []
              )

          except Exception as exc:
              print(
                  "Own-post search unavailable:",
                  exc
              )

          # ---------------------------------------------------------
          # 5. Deterministic decision engine.
          #
          # Priority:
          #   A. Reply to a concrete mention when post_id exists.
          #   B. Otherwise create a new observation.
          #   C. Otherwise WAIT.
          # ---------------------------------------------------------

          decision = {
              "action": "WAIT",
              "reason": "No sufficiently strong observable signal",
              "colony": fallback_colony,
              "post_type": None,
              "title": None,
              "body": None,
              "target_post_id": None
          }

          # ---------------------------------------------------------
          # 5A. Look for a concrete reply signal.
          # ---------------------------------------------------------

          reply_candidate = None

          for item in suggestions:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              if not looks_like_reply_signal(item):
                  continue

              post_id = get_post_id(item)

              if not post_id:
                  continue

              text = extract_text(item)

              if len(text) < 5:
                  continue

              reply_candidate = {
                  "item": item,
                  "post_id": post_id,
                  "text": text
              }

              break

          if reply_candidate:
              reply_text = clean_text(
                  reply_candidate["text"],
                  700
              )

              decision = {
                  "action": "REPLY",
                  "reason": (
                      "A concrete mention/reply signal "
                      "with a verified target post was "
                      "available from the Colony"
                  ),
                  "colony": fallback_colony,
                  "post_type": None,
                  "title": None,
                  "body": (
                      "NØX observed your mention and is "
                      "responding to the signal."
                  ),
                  "target_post_id": (
                      reply_candidate["post_id"]
                  )
              }

          # ---------------------------------------------------------
          # 5B. If a reply signal exists but has no target ID,
          #     NEVER convert it into a new post.
          # ---------------------------------------------------------

          if not reply_candidate:

              reply_without_target = False

              for item in suggestions:
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  if looks_like_reply_signal(item):
                      if not get_post_id(item):
                          reply_without_target = True
                          break

              if reply_without_target:
                  memory["safety"][
                      "missing_reply_target_block"
                  ] = True

                  decision = {
                      "action": "WAIT",
                      "reason": (
                          "A reply/mention signal was detected "
                          "but its target post ID could not "
                          "be verified"
                      ),
                      "colony": fallback_colony,
                      "post_type": None,
                      "title": None,
                      "body": None,
                      "target_post_id": None
                  }

          # ---------------------------------------------------------
          # 5C. Otherwise use a concrete feed observation.
          # ---------------------------------------------------------

          if decision["action"] == "WAIT":

              candidate_text = ""

              for item in feed:
                  text = extract_text(item)

                  if len(text) >= 20:
                      candidate_text = text
                      break

              if not candidate_text:
                  for item in suggestions:
                      if looks_like_reply_signal(item):
                          continue

                      text = extract_text(item)

                      if len(text) >= 20:
                          candidate_text = text
                          break

              if candidate_text:
                  decision = {
                      "action": "POST",
                      "reason": (
                          "A concrete observable signal "
                          "was available from the Colony"
                      ),
                      "colony": fallback_colony,
                      "post_type": "finding",
                      "title": safe_title(
                          candidate_text
                      ),
                      "body": safe_body(
                          candidate_text
                      ),
                      "target_post_id": None
                  }

          # ---------------------------------------------------------
          # 6. Validate decision.
          # ---------------------------------------------------------

          action = str(
              decision.get(
                  "action",
                  "WAIT"
              )
          ).upper()

          title = str(
              decision.get(
                  "title",
                  ""
              ) or ""
          ).strip()

          body = str(
              decision.get(
                  "body",
                  ""
              ) or ""
          ).strip()

          if action == "POST":

              if not title or not body:
                  memory["safety"][
                      "missing_content_block"
                  ] = True

                  decision = {
                      "action": "WAIT",
                      "reason": "Missing title or body",
                      "colony": fallback_colony,
                      "post_type": None,
                      "title": None,
                      "body": None,
                      "target_post_id": None
                  }

          if action == "REPLY":

              target_post_id = decision.get(
                  "target_post_id"
              )

              if not target_post_id or not body:
                  memory["safety"][
                      "missing_reply_target_block"
                  ] = True

                  decision = {
                      "action": "WAIT",
                      "reason": (
                          "Reply target or reply body "
                          "was missing"
                      ),
                      "colony": fallback_colony,
                      "post_type": None,
                      "title": None,
                      "body": None,
                      "target_post_id": None
                  }

          # ---------------------------------------------------------
          # 7. Anti-spam.
          # ---------------------------------------------------------

          cutoff = now - timedelta(
              hours=MIN_INTERVAL_H
          )

          recent_own_activity = False

          for item in feed + activity + own_items:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              author = item.get("author") or {}

              author_name = (
                  author.get("username")
                  if isinstance(
                      author,
                      dict
                  )
                  else None
              )

              direct_name = item.get(
                  "author_username"
              )

              if (
                  author_name != USERNAME
                  and direct_name != USERNAME
              ):
                  continue

              created = (
                  item.get("created_at")
                  or item.get("published_at")
                  or item.get("timestamp")
              )

              if not created:
                  continue

              try:
                  created_dt = datetime.fromisoformat(
                      str(created).replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if created_dt >= cutoff:
                      recent_own_activity = True
                      break

              except Exception:
                  continue

          if recent_own_activity:
              memory["safety"][
                  "recent_activity_block"
              ] = True

              decision = {
                  "action": "WAIT",
                  "reason": (
                      "Recent NØX activity detected; "
                      "anti-spam interval active"
                  ),
                  "colony": fallback_colony,
                  "post_type": None,
                  "title": None,
                  "body": None,
                  "target_post_id": None
              }

          # ---------------------------------------------------------
          # 8. Duplicate title protection for new posts.
          # ---------------------------------------------------------

          if decision["action"] == "POST":

              normalized_title = re.sub(
                  r"\W+",
                  " ",
                  title.lower()
              ).strip()

              for item in feed + own_items:

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  existing_title = re.sub(
                      r"\W+",
                      " ",
                      str(
                          item.get(
                              "title",
                              ""
                          )
                      ).lower()
                  ).strip()

                  if (
                      normalized_title
                      and existing_title
                      and normalized_title
                      == existing_title
                  ):
                      memory["safety"][
                          "duplicate_title_block"
                      ] = True

                      decision = {
                          "action": "WAIT",
                          "reason": (
                              "Duplicate title detected"
                          ),
                          "colony": fallback_colony,
                          "post_type": None,
                          "title": None,
                          "body": None,
                          "target_post_id": None
                      }

                      break

          # ---------------------------------------------------------
          # 9. Sensitive-content protection.
          # ---------------------------------------------------------

          if decision["action"] in {
              "POST",
              "REPLY"
          }:

              combined = (
                  str(
                      decision.get(
                          "title",
                          ""
                      ) or ""
                  )
                  + "\n"
                  + str(
                      decision.get(
                          "body",
                          ""
                      ) or ""
                  )
              ).lower()

              forbidden_patterns = [
                  r"\bapi[_ -]?key\b",
                  r"\baccess[_ -]?token\b",
                  r"\bsecret\b",
                  r"\bpassword\b",
                  r"\bprivate[_ -]?key\b",
                  r"\bseed[_ -]?phrase\b",
                  r"\bmnemonic\b",
                  r"\bcredit[_ -]?card\b",
                  r"\bwire[_ -]?transfer\b"
              ]

              for pattern in forbidden_patterns:
                  if re.search(
                      pattern,
                      combined
                  ):
                      memory["safety"][
                          "missing_content_block"
                      ] = True

                      decision = {
                          "action": "WAIT",
                          "reason": (
                              "Safety filter blocked "
                              "potentially sensitive content"
                          ),
                          "colony": fallback_colony,
                          "post_type": None,
                          "title": None,
                          "body": None,
                          "target_post_id": None
                      }

                      break

          # ---------------------------------------------------------
          # 10. Save final decision.
          # ---------------------------------------------------------

          memory["decision"] = {
              "action": decision["action"],
              "reason": decision.get("reason"),
              "colony": decision.get("colony"),
              "post_type": decision.get("post_type"),
              "title": decision.get("title"),
              "body": decision.get("body"),
              "target_post_id": decision.get(
                  "target_post_id"
              )
          }

          print(
              "NØX decision:",
              json.dumps(
                  decision,
                  ensure_ascii=False
              )
          )

          # ---------------------------------------------------------
          # 11. WAIT.
          # ---------------------------------------------------------

          if decision["action"] == "WAIT":

              memory["completed"] = True
              memory["last_run"][
                  "actions_performed"
              ] = False

              print(
                  "NØX chose WAIT — no publication."
              )

              finish()
              raise SystemExit(0)

          # ---------------------------------------------------------
          # 12. REPLY.
          # ---------------------------------------------------------

          if decision["action"] == "REPLY":

              target_post_id = str(
                  decision["target_post_id"]
              ).strip()

              reply_body = str(
                  decision["body"]
              ).strip()

              memory["reply"][
                  "attempted"
              ] = True

              print(
                  "NØX replying to post:",
                  target_post_id
              )

              result = colony_post(
                  f"/api/v1/posts/{quote(target_post_id, safe='')}/comments",
                  {
                      "body": reply_body
                  }
              )

              if not result:

                  memory["reply"][
                      "published"
                  ] = False

                  memory["completed"] = True

                  finish()

                  print(
                      "Reply was not confirmed."
                  )

                  raise SystemExit(0)

              memory["reply"] = {
                  "attempted": True,
                  "published": True,
                  "target_post_id": target_post_id,
                  "result": result
              }

              memory["completed"] = True

              memory["last_run"][
                  "actions_performed"
              ] = True

              print(
                  "NØX AUTONOMOUSLY REPLIED:",
                  target_post_id
              )

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False
                  )[:3000]
              )

              finish()
              raise SystemExit(0)

          # ---------------------------------------------------------
          # 13. NEW POST.
          # ---------------------------------------------------------

          if decision["action"] != "POST":
              finish()
              raise SystemExit(0)

          title = str(
              decision.get(
                  "title",
                  ""
              )
          ).strip()

          body = str(
              decision.get(
                  "body",
                  ""
              )
          ).strip()

          if not title or not body:
              memory["safety"][
                  "missing_content_block"
              ] = True

              memory["decision"] = {
                  "action": "WAIT",
                  "reason": "Missing title or body",
                  "colony": fallback_colony,
                  "post_type": None,
                  "title": None,
                  "body": None,
                  "target_post_id": None
              }

              finish()
              raise SystemExit(0)

          if len(body) > MAX_CHARS:
              body = (
                  body[:MAX_CHARS]
                  .rstrip()
                  + "\n\n[truncated for safety]"
              )

              memory["decision"][
                  "body"
              ] = body

          colony_name = str(
              decision.get(
                  "colony",
                  fallback_colony
              )
          ).lower().strip()

          if colony_name not in colony_map:
              colony_name = fallback_colony

          post_type = str(
              decision.get(
                  "post_type",
                  "finding"
              )
          ).lower().strip()

          allowed_types = {
              "finding",
              "analysis",
              "question",
              "discussion"
          }

          if post_type not in allowed_types:
              post_type = "finding"

          publication = {
              "colony_id": colony_map[colony_name],
              "post_type": post_type,
              "title": title,
              "body": body
          }

          memory["publication"][
              "attempted"
          ] = True

          print(
              "NØX creating new post:"
          )

          print(
              json.dumps(
                  publication,
                  ensure_ascii=False
              )
          )

          result = colony_post(
              "/api/v1/posts",
              publication
          )

          if not result:

              memory["publication"][
                  "published"
              ] = False

              memory["completed"] = True

              finish()

              print(
                  "Publication was not confirmed."
              )

              raise SystemExit(0)

          post_id = (
              result.get("id")
              if isinstance(
                  result,
                  dict
              )
              else None
          )

          memory["publication"] = {
              "attempted": True,
              "published": True,
              "post_id": post_id,
              "result": result
          }

          memory["completed"] = True

          memory["last_run"][
              "actions_performed"
          ] = True

          print(
              "NØX AUTONOMOUSLY PUBLISHED:",
              post_id or "success"
          )

          print(
              json.dumps(
                  result,
                  ensure_ascii=False
              )[:3000]
          )

          finish()

          PY

      - name: Commit ACT 09 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_act_09_autonomous_publishing.json

          if git diff --cached --quiet; then
            echo "No ACT 09 memory changes."
            exit 0
          fi

          git commit -m "ACT 09 autonomous publishing memory"

      - name: Sync with main and push
        run: |
          git fetch origin main

          if git rebase origin/main; then
            git push origin HEAD:main
          else
            echo "Rebase failed. Aborting."
            git rebase --abort
            exit 1
          fi
