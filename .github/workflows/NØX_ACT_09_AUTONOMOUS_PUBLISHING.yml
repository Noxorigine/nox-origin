name: NØX ACT 09 — Autonomous Publishing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-09-autonomous-publishing
  cancel-in-progress: false

jobs:
  autonomous-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      NOX_USERNAME: nox_origine
      NOX_MIN_POST_INTERVAL_HOURS: "6"
      NOX_MAX_FEED_ITEMS: "20"
      NOX_MAX_POST_CHARS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: NØX autonomous decision and publication
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import atexit
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone, timedelta

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          COLONY_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          MODEL = os.environ["GEMINI_MODEL"]
          USERNAME = os.environ["NOX_USERNAME"]

          MIN_INTERVAL_H = float(
              os.environ["NOX_MIN_POST_INTERVAL_HOURS"]
          )

          MAX_FEED = int(
              os.environ["NOX_MAX_FEED_ITEMS"]
          )

          MAX_CHARS = int(
              os.environ["NOX_MAX_POST_CHARS"]
          )

          MEMORY_FILE = (
              "memory/"
              "nox_act_09_autonomous_publishing.json"
          )

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()

          # =========================================================
          # PERSISTENT ACT 09 MEMORY
          # =========================================================

          memory = {
              "version": "ACT 09",
              "generated_at": generated_at,
              "mode": "autonomous_publishing",
              "agent": {
                  "username": USERNAME
              },
              "authentication": {
                  "status": "not_started",
                  "mode": None
              },
              "observation": {
                  "feed_items": 0,
                  "suggestions": 0,
                  "activity_items": 0,
                  "colonies_available": 0
              },
              "decision": {
                  "action": "WAIT",
                  "reason": None,
                  "colony": None,
                  "post_type": None,
                  "title": None,
                  "body": None
              },
              "publication": {
                  "attempted": False,
                  "published": False,
                  "post_id": None,
                  "result": None
              },
              "safety": {
                  "recent_activity_block": False,
                  "duplicate_title_block": False,
                  "missing_content_block": False
              },
              "errors": [],
              "gemini": {
                  "used": False,
                  "model": MODEL,
                  "rate_limited": False
              },
              "project_cost_eur": 0,
              "completed": False
          }

          def save_memory():

              os.makedirs(
                  os.path.dirname(MEMORY_FILE),
                  exist_ok=True
              )

              memory["last_run"] = {
                  "timestamp": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "actions_performed": memory[
                      "publication"
                  ]["published"],
                  "project_cost_eur": 0
              }

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "ACT 09 memory saved:",
                  MEMORY_FILE
              )

          # IMPORTANT:
          # Save the memory even when the workflow safely exits after
          # choosing WAIT, rate limiting, anti-spam, duplicate detection,
          # or another controlled condition.
          atexit.register(save_memory)

          if not COLONY_KEY:
              memory["errors"].append(
                  "COLONY_API_KEY is missing"
              )
              raise SystemExit(
                  "COLONY_API_KEY is missing"
              )

          if not COLONY_KEY.startswith("col_"):
              memory["errors"].append(
                  "COLONY_API_KEY does not look like a The Colony agent key"
              )
              raise SystemExit(
                  "COLONY_API_KEY does not look like a The Colony agent key"
              )

          if not GEMINI_KEY:
              memory["errors"].append(
                  "GEMINI_API_KEY is missing"
              )
              raise SystemExit(
                  "GEMINI_API_KEY is missing"
              )

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "NOX-Origin-ACT09/1.4",
          })

          # =========================================================
          # AUTHENTICATION
          # =========================================================

          def authenticate():

              direct_headers = {
                  "Authorization": f"Bearer {COLONY_KEY}"
              }

              response = session.get(
                  BASE + "/api/v1/users/me",
                  headers=direct_headers,
                  timeout=20
              )

              if response.status_code != 401:
                  response.raise_for_status()

                  return {
                      "token": COLONY_KEY,
                      "mode": "api_key",
                      "me": response.json()
                  }

              print(
                  "Direct API-key authentication returned 401."
              )

              print(
                  "Attempting API-key to JWT token exchange..."
              )

              token_response = session.post(
                  BASE + "/api/v1/auth/token",
                  json={
                      "api_key": COLONY_KEY
                  },
                  headers={
                      "Content-Type": "application/json"
                  },
                  timeout=20
              )

              if token_response.status_code >= 400:
                  memory["errors"].append(
                      "The Colony token exchange failed"
                  )

                  print(
                      "THE_COLONY_TOKEN_ERROR:",
                      token_response.status_code
                  )

                  print(
                      token_response.text[:1500]
                  )

                  sys.exit(1)

              token_data = token_response.json()

              access_token = token_data.get(
                  "access_token"
              )

              if not access_token:
                  memory["errors"].append(
                      "The Colony token response did not contain access_token"
                  )

                  raise SystemExit(
                      "The Colony token response did not contain access_token"
                  )

              jwt_headers = {
                  "Authorization": f"Bearer {access_token}"
              }

              me_response = session.get(
                  BASE + "/api/v1/users/me",
                  headers=jwt_headers,
                  timeout=20
              )

              if me_response.status_code == 401:
                  memory["errors"].append(
                      "JWT authentication rejected"
                  )

                  print(
                      "COLONY_AUTH_ERROR: "
                      "JWT authentication rejected."
                  )

                  print(
                      me_response.text[:1500]
                  )

                  sys.exit(1)

              me_response.raise_for_status()

              return {
                  "token": access_token,
                  "mode": "jwt",
                  "me": me_response.json()
              }

          auth = authenticate()

          TOKEN = auth["token"]

          AUTH_MODE = auth["mode"]

          me = auth["me"]

          session.headers.update({
              "Authorization": f"Bearer {TOKEN}"
          })

          memory["authentication"] = {
              "status": "ok",
              "mode": AUTH_MODE
          }

          memory["agent"] = {
              "username": me.get(
                  "username",
                  USERNAME
              ),
              "karma": me.get("karma")
          }

          print(
              "The Colony authentication mode:",
              AUTH_MODE
          )

          # =========================================================
          # API HELPERS
          # =========================================================

          def colony_get(path):

              response = session.get(
                  BASE + path,
                  timeout=20
              )

              if response.status_code == 401:
                  memory["errors"].append(
                      f"401 Unauthorized: {path}"
                  )

                  print(
                      "COLONY_AUTH_ERROR: "
                      "401 Unauthorized",
                      path
                  )

                  sys.exit(1)

              if response.status_code == 429:
                  print(
                      "COLONY_RATE_LIMIT:",
                      path
                  )

                  return None

              response.raise_for_status()

              return response.json()

          def colony_get_optional(path):

              response = session.get(
                  BASE + path,
                  timeout=20
              )

              if response.status_code == 401:
                  memory["errors"].append(
                      f"401 Unauthorized: {path}"
                  )

                  print(
                      "COLONY_AUTH_ERROR: "
                      "401 Unauthorized",
                      path
                  )

                  sys.exit(1)

              if response.status_code == 429:
                  print(
                      "COLONY_RATE_LIMIT:",
                      path
                  )

                  return None

              if response.status_code == 422:
                  print(
                      "COLONY_OPTIONAL_ENDPOINT_422:",
                      path
                  )

                  print(
                      "Continuing without this optional observation."
                  )

                  return None

              if response.status_code >= 400:
                  print(
                      "COLONY_OPTIONAL_ENDPOINT_ERROR:",
                      response.status_code,
                      path
                  )

                  print(
                      response.text[:1000]
                  )

                  return None

              return response.json()

          def colony_post(path, payload):

              response = session.post(
                  BASE + path,
                  json=payload,
                  timeout=20,
                  headers={
                      "Content-Type": "application/json"
                  },
              )

              if response.status_code == 401:
                  memory["errors"].append(
                      f"401 Unauthorized: {path}"
                  )

                  print(
                      "COLONY_AUTH_ERROR: "
                      "401 Unauthorized",
                      path
                  )

                  sys.exit(1)

              if response.status_code == 429:
                  print(
                      "COLONY_RATE_LIMIT:",
                      response.text[:1000]
                  )

                  return None

              response.raise_for_status()

              return response.json()

          def normalize_items(value):

              if isinstance(value, list):
                  return value

              if isinstance(value, dict):

                  for key in (
                      "items",
                      "posts",
                      "results",
                      "feed",
                      "suggestions"
                  ):

                      if isinstance(
                          value.get(key),
                          list
                      ):

                          return value[key]

              return []

          def compact(value, limit):

              return json.dumps(
                  value,
                  ensure_ascii=False,
                  separators=(",", ":")
              )[:limit]

          # =========================================================
          # IDENTITY
          # =========================================================

          if not me:
              memory["errors"].append(
                  "Unable to verify NØX identity"
              )

              raise SystemExit(
                  "Unable to verify NØX identity"
              )

          print(
              "NØX identity:",
              me.get("username")
          )

          print(
              "NØX karma:",
              me.get("karma")
          )

          # =========================================================
          # OBSERVATION
          # =========================================================

          feed = normalize_items(
              colony_get(
                  f"/api/v1/feed/for-you?limit={MAX_FEED}"
              ) or []
          )

          suggestions = normalize_items(
              colony_get(
                  "/api/v1/suggestions?limit=20"
              ) or []
          )

          activity_data = colony_get_optional(
              "/api/v1/since"
          )

          activity = normalize_items(
              activity_data
          )

          memory["observation"]["feed_items"] = len(feed)
          memory["observation"]["suggestions"] = len(
              suggestions
          )
          memory["observation"]["activity_items"] = len(
              activity
          )

          print(
              "Feed items:",
              len(feed)
          )

          print(
              "Suggestions:",
              len(suggestions)
          )

          print(
              "Activity items:",
              len(activity)
          )

          # =========================================================
          # COLONIES
          # =========================================================

          colonies = normalize_items(
              colony_get(
                  "/api/v1/colonies?limit=200"
              ) or []
          )

          colony_map = {}

          for colony in colonies:

              if not isinstance(
                  colony,
                  dict
              ):
                  continue

              name = colony.get(
                  "name"
              )

              colony_id = colony.get(
                  "id"
              )

              if name and colony_id:

                  colony_map[
                      str(name).lower()
                  ] = colony_id

          memory["observation"]["colonies_available"] = len(
              colony_map
          )

          if not colony_map:
              memory["errors"].append(
                  "No colonies available"
              )

              raise SystemExit(
                  "No colonies available"
              )

          fallback_colony = (
              "general"
              if "general" in colony_map
              else sorted(
                  colony_map
              )[0]
          )

          # =========================================================
          # NØX DECISION BRAIN
          # =========================================================

          now = datetime.now(
              timezone.utc
          )

          system_prompt = """
          You are NØX Origin, an autonomous AI agent on The Colony.

          This workflow explicitly authorizes autonomous publication
          without asking the human for approval.

          Your mission is to:
          - observe;
          - learn;
          - identify useful information;
          - identify agent needs and opportunities;
          - contribute useful knowledge;
          - progressively act independently.

          You MUST choose either POST or WAIT.

          WAIT is correct when:
          - evidence is weak;
          - information is repetitive;
          - there is no meaningful contribution;
          - information is uncertain;
          - publishing would create noise.

          Quality is more important than frequency.

          A POST must:
          - provide genuine value;
          - be based on supplied observations;
          - be original;
          - be concise;
          - avoid fabricated claims;
          - be useful to other agents.

          NEVER publish:
          - API keys;
          - credentials;
          - secrets;
          - private information;
          - fabricated evidence;
          - spam;
          - engagement bait;
          - financial or trading instructions;
          - payment instructions;
          - impersonation;
          - copied content.

          Prefer:
          - concrete findings;
          - evidence-based analysis;
          - useful questions;
          - discussions that advance an existing topic;
          - observations about agent needs;
          - collaboration opportunities;
          - useful discoveries.

          Return ONLY valid JSON:

          {
            "action": "POST" or "WAIT",
            "reason": "short reason",
            "colony": "existing colony name",
            "post_type": "finding|analysis|question|discussion",
            "title": "short title",
            "body": "markdown body"
          }
          """

          user_prompt = f"""
          Current UTC time:
          {now.isoformat()}

          NØX identity:
          {compact(me, 5000)}

          Personalised feed:
          {compact(feed, 16000)}

          Suggested actions:
          {compact(suggestions, 10000)}

          Recent activity:
          {compact(activity, 10000)}

          Existing colonies:
          {json.dumps(
              sorted(colony_map.keys()),
              ensure_ascii=False
          )}

          Decide whether NØX should publish ONE useful post now.

          Do not invent evidence.

          If there is not enough evidence for a meaningful
          contribution, choose WAIT.

          NØX is autonomous in this decision.
          Do not ask for human approval.
          """

          # =========================================================
          # ONE GEMINI CALL PER HEARTBEAT
          # =========================================================

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              f"{MODEL}:generateContent"
              f"?key={GEMINI_KEY}"
          )

          gemini_payload = {
              "system_instruction": {
                  "parts": [
                      {
                          "text": system_prompt
                      }
                  ]
              },
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": user_prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "responseMimeType": "application/json",
                  "maxOutputTokens": 1200
              }
          }

          memory["gemini"]["used"] = True

          response = requests.post(
              gemini_url,
              json=gemini_payload,
              timeout=45,
              headers={
                  "Content-Type": "application/json"
              },
          )

          if response.status_code == 429:
              memory["gemini"]["rate_limited"] = True
              memory["decision"]["action"] = "WAIT"
              memory["decision"]["reason"] = (
                  "Gemini rate limit; cycle skipped safely"
              )

              print(
                  "GEMINI_RATE_LIMIT: "
                  "cycle skipped safely"
              )

              sys.exit(0)

          if response.status_code >= 400:
              memory["errors"].append(
                  f"Gemini HTTP {response.status_code}"
              )

              print(
                  "GEMINI_ERROR:",
                  response.status_code
              )

              print(
                  response.text[:1500]
              )

              sys.exit(0)

          data = response.json()

          parts = (
              data
              .get("candidates", [{}])[0]
              .get("content", {})
              .get("parts", [])
          )

          raw = "".join(
              part.get("text", "")
              for part in parts
              if isinstance(
                  part,
                  dict
              )
          ).strip()

          match = re.search(
              r"\{.*\}",
              raw,
              flags=re.S
          )

          if not match:
              memory["errors"].append(
                  "No valid JSON decision returned by Gemini"
              )

              memory["decision"]["reason"] = (
                  "No valid JSON decision"
              )

              print(
                  "NO_VALID_DECISION:",
                  raw[:1500]
              )

              sys.exit(0)

          try:

              decision = json.loads(
                  match.group(0)
              )

          except json.JSONDecodeError:

              memory["errors"].append(
                  "Invalid JSON decision returned by Gemini"
              )

              memory["decision"]["reason"] = (
                  "Invalid JSON decision"
              )

              print(
                  "INVALID_JSON_DECISION:",
                  raw[:1500]
              )

              sys.exit(0)

          print(
              "NØX decision:",
              json.dumps(
                  decision,
                  ensure_ascii=False
              )
          )

          memory["decision"] = {
              "action": str(
                  decision.get(
                      "action",
                      "WAIT"
                  )
              ).upper(),
              "reason": decision.get(
                  "reason"
              ),
              "colony": decision.get(
                  "colony"
              ),
              "post_type": decision.get(
                  "post_type"
              ),
              "title": decision.get(
                  "title"
              ),
              "body": decision.get(
                  "body"
              )
          }

          # =========================================================
          # WAIT
          # =========================================================

          if (
              str(
                  decision.get(
                      "action",
                      "WAIT"
                  )
              ).upper()
              != "POST"
          ):

              memory["decision"]["action"] = "WAIT"

              print(
                  "NØX chose WAIT — "
                  "nothing will be published."
              )

              sys.exit(0)

          # =========================================================
          # PREPARE PUBLICATION
          # =========================================================

          title = str(
              decision.get(
                  "title",
                  ""
              )
          ).strip()

          body = str(
              decision.get(
                  "body",
                  ""
              )
          ).strip()

          post_type = str(
              decision.get(
                  "post_type",
                  "discussion"
              )
          ).lower().strip()

          colony_name = str(
              decision.get(
                  "colony",
                  fallback_colony
              )
          ).lower().strip()

          allowed_types = {
              "finding",
              "analysis",
              "question",
              "discussion"
          }

          if post_type not in allowed_types:
              post_type = "discussion"

          if colony_name not in colony_map:
              colony_name = fallback_colony

          memory["decision"]["colony"] = colony_name
          memory["decision"]["post_type"] = post_type
          memory["decision"]["title"] = title

          if not title or not body:

              memory["safety"]["missing_content_block"] = True
              memory["decision"]["action"] = "WAIT"
              memory["decision"]["reason"] = (
                  "Missing title or body"
              )

              print(
                  "POST_BLOCKED: "
                  "missing title/body"
              )

              sys.exit(0)

          if len(body) > MAX_CHARS:

              body = (
                  body[:MAX_CHARS].rstrip()
                  + "\n\n[truncated for safety]"
              )

              memory["decision"]["body"] = body

          # =========================================================
          # ANTI-SPAM
          # =========================================================

          cutoff = (
              now
              - timedelta(
                  hours=MIN_INTERVAL_H
              )
          )

          for item in feed + activity:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              author = item.get(
                  "author"
              ) or {}

              author_name = (
                  author.get(
                      "username"
                  )
                  if isinstance(
                      author,
                      dict
                  )
                  else None
              )

              direct_name = item.get(
                  "author_username"
              )

              if (
                  author_name != USERNAME
                  and direct_name != USERNAME
              ):
                  continue

              created = (
                  item.get("created_at")
                  or item.get("published_at")
                  or item.get("timestamp")
              )

              if not created:
                  continue

              try:

                  created_dt = (
                      datetime.fromisoformat(
                          str(
                              created
                          ).replace(
                              "Z",
                              "+00:00"
                          )
                      )
                  )

                  if created_dt >= cutoff:

                      memory["safety"][
                          "recent_activity_block"
                      ] = True

                      memory["decision"]["action"] = "WAIT"
                      memory["decision"]["reason"] = (
                          "Recent NØX activity detected"
                      )

                      print(
                          "POST_BLOCKED: "
                          "recent NØX activity detected"
                      )

                      sys.exit(0)

              except Exception:
                  pass

          # =========================================================
          # DUPLICATE TITLE CHECK
          # =========================================================

          normalized_title = re.sub(
              r"\W+",
              " ",
              title.lower()
          ).strip()

          for item in feed:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              existing_title = re.sub(
                  r"\W+",
                  " ",
                  str(
                      item.get(
                          "title",
                          ""
                      )
                  ).lower()
              ).strip()

              if (
                  normalized_title
                  and normalized_title
                  == existing_title
              ):

                  memory["safety"][
                      "duplicate_title_block"
                  ] = True

                  memory["decision"]["action"] = "WAIT"
                  memory["decision"]["reason"] = (
                      "Duplicate title detected"
                  )

                  print(
                      "POST_BLOCKED: "
                      "duplicate title"
                  )

                  sys.exit(0)

          # =========================================================
          # AUTONOMOUS PUBLICATION
          # =========================================================

          publication = {
              "colony_id": colony_map[
                  colony_name
              ],
              "post_type": post_type,
              "title": title,
              "body": body
          }

          memory["publication"]["attempted"] = True

          result = colony_post(
              "/api/v1/posts",
              publication
          )

          if not result:

              memory["publication"]["result"] = (
                  "Publication skipped"
              )

              print(
                  "Publication skipped."
              )

              sys.exit(0)

          post_id = (
              result.get("id")
              if isinstance(
                  result,
                  dict
              )
              else None
          )

          memory["publication"] = {
              "attempted": True,
              "published": True,
              "post_id": post_id,
              "result": result
          }

          memory["decision"]["action"] = "POST"

          memory["completed"] = True

          print(
              "NØX AUTONOMOUSLY PUBLISHED:",
              post_id or "success"
          )

          print(
              json.dumps(
                  result,
                  ensure_ascii=False
              )[:3000]
          )

          PY

      - name: Commit ACT 09 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_act_09_autonomous_publishing.json

          if git diff --cached --quiet; then
            echo "No ACT 09 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT 09 autonomous publishing memory"

      - name: Sync with main and push
        run: |
          git fetch origin main

          if git rebase origin/main; then
            git push origin HEAD:main
          else
            echo "Rebase failed. Aborting."
            git rebase --abort
            exit 1
          fi
