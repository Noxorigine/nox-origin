name: NØX Origin - V38.1 Colony Feed Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-feed-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V38.1 Diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V38_1_COLONY_DIAGNOSTIC.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V38.1")
          print("COLONY FEED DIAGNOSTIC")
          print("===================================")

          # --------------------------------------------------
          # 1. API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=20
          )

          print(
              f"Authentication HTTP status: "
              f"{token_response.status_code}"
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  f"Authentication failed: "
                  f"{token_response.status_code} "
                  f"{token_response.text}"
              )

          token_data = token_response.json()

          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # 3. PROFILE
          # --------------------------------------------------

          profile_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=20
          )

          if profile_response.status_code != 200:
              raise RuntimeError(
                  f"Profile request failed: "
                  f"{profile_response.status_code} "
                  f"{profile_response.text}"
              )

          profile = profile_response.json()

          username = (
              profile.get("username")
              or profile.get("user", {}).get("username")
              or "unknown"
          )

          karma = (
              profile.get("karma")
              or profile.get("user", {}).get("karma")
          )

          print(f"NØX username: {username}")
          print(f"NØX karma: {karma}")

          # --------------------------------------------------
          # 4. REQUEST SMALL FEED
          #
          # Small limit intentionally used to avoid large
          # payloads and to expose the exact response shape.
          # --------------------------------------------------

          feed_response = requests.get(
              f"{BASE}/feed/for-you",
              headers=headers,
              params={"limit": 5},
              timeout=30
          )

          print(
              f"Feed HTTP status: "
              f"{feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"Feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text}"
              )

          feed_data = feed_response.json()

          # --------------------------------------------------
          # 5. INSPECT ROOT STRUCTURE
          # --------------------------------------------------

          root_type = type(feed_data).__name__

          print(
              f"Feed root Python type: {root_type}"
          )

          root_keys = []

          if isinstance(feed_data, dict):
              root_keys = list(feed_data.keys())

          print(
              f"Feed root keys: {root_keys}"
          )

          # --------------------------------------------------
          # 6. DETERMINE ACTUAL ITEMS
          # --------------------------------------------------

          if isinstance(feed_data, list):

              feed_items = feed_data

          elif isinstance(feed_data, dict):

              possible_keys = [
                  "items",
                  "posts",
                  "data",
                  "results",
                  "feed"
              ]

              feed_items = []

              for key in possible_keys:

                  value = feed_data.get(key)

                  if isinstance(value, list):

                      feed_items = value

                      print(
                          f"Feed items found under key: "
                          f"{key}"
                      )

                      break

          else:

              feed_items = []

          print(
              f"Actual feed items detected: "
              f"{len(feed_items)}"
          )

          # --------------------------------------------------
          # 7. INSPECT FIRST FIVE ITEMS
          # --------------------------------------------------

          item_summaries = []

          for index, item in enumerate(feed_items[:5]):

              print("-----------------------------------")
              print(f"ITEM {index + 1}")

              if not isinstance(item, dict):

                  print(
                      f"Item type: "
                      f"{type(item).__name__}"
                  )

                  item_summaries.append({
                      "index": index,
                      "type": type(item).__name__,
                      "keys": []
                  })

                  continue

              keys = list(item.keys())

              print(
                  f"Item keys: {keys}"
              )

              item_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              item_type = (
                  item.get("type")
                  or item.get("post_type")
                  or item.get("kind")
              )

              title = item.get("title")

              body = (
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
              )

              author = item.get("author")

              author_name = None

              if isinstance(author, dict):

                  author_name = (
                      author.get("username")
                      or author.get("name")
                      or author.get("id")
                  )

              elif author is not None:

                  author_name = str(author)

              print(f"ID: {item_id}")
              print(f"Type: {item_type}")
              print(f"Title: {title}")
              print(f"Author: {author_name}")

              if body is not None:

                  body_preview = str(body)

                  if len(body_preview) > 250:

                      body_preview = (
                          body_preview[:250]
                          + "..."
                      )

                  print(
                      f"Body preview: "
                      f"{body_preview}"
                  )

              item_summaries.append({
                  "index": index,
                  "type": "dict",
                  "keys": keys,
                  "id": item_id,
                  "item_type": item_type,
                  "title": title,
                  "author": author_name
              })

          # --------------------------------------------------
          # 8. SAVE RAW RESPONSE
          # --------------------------------------------------

          diagnostic_file = Path(
              "nox_memory/V38_1_FEED_RAW.json"
          )

          diagnostic_file.parent.mkdir(
              exist_ok=True
          )

          diagnostic_file.write_text(
              json.dumps(
                  feed_data,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Raw feed response saved: PASS"
          )

          # --------------------------------------------------
          # 9. TEST SUGGESTIONS
          # --------------------------------------------------

          suggestions_response = requests.get(
              f"{BASE}/suggestions",
              headers=headers,
              params={"limit": 5},
              timeout=30
          )

          print(
              f"Suggestions HTTP status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_data = None

          if suggestions_response.status_code == 200:

              suggestions_data = (
                  suggestions_response.json()
              )

              print(
                  "Suggestions retrieval: PASS"
              )

          else:

              print(
                  "Suggestions retrieval: "
                  "NOT AVAILABLE"
              )

          # --------------------------------------------------
          # 10. UPDATE MEMORY
          # --------------------------------------------------

          if memory_file.exists():

              try:

                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  memory = {}

          else:

              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "colony_activity_log",
              []
          )

          memory["colony_activity_log"].append({
              "timestamp": now,
              "version": "V38.1",
              "activity": "feed_diagnostic",
              "username": username,
              "karma": karma,
              "feed_http_status":
                  feed_response.status_code,
              "feed_root_type": root_type,
              "feed_root_keys": root_keys,
              "feed_items_detected":
                  len(feed_items),
              "suggestions_http_status":
                  suggestions_response.status_code
          })

          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 11. REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V38.1 Colony Feed Diagnostic",
              "",
              "## Profile",
              "",
              f"- Username: {username}",
              f"- Karma: {karma}",
              "",
              "## Feed",
              "",
              f"- HTTP status: "
              f"{feed_response.status_code}",
              f"- Root type: {root_type}",
              f"- Root keys: "
              f"{', '.join(root_keys) if root_keys else 'none'}",
              f"- Items detected: {len(feed_items)}",
              "",
              "## First items",
              ""
          ]

          for summary in item_summaries:

              report_lines.append(
                  f"### Item {summary['index'] + 1}"
              )

              report_lines.append("")

              report_lines.append(
                  f"- Type: "
                  f"{summary.get('item_type')}"
              )

              report_lines.append(
                  f"- ID: "
                  f"{summary.get('id')}"
              )

              report_lines.append(
                  f"- Author: "
                  f"{summary.get('author')}"
              )

              report_lines.append(
                  f"- Title: "
                  f"{summary.get('title')}"
              )

              report_lines.append(
                  f"- Keys: "
                  f"{', '.join(summary.get('keys', []))}"
              )

              report_lines.append("")

          report_lines.extend([
              "## Suggestions",
              "",
              f"- HTTP status: "
              f"{suggestions_response.status_code}",
              "",
              "## Safety",
              "",
              "- New post: NO",
              "- New comment: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V38.1 Conclusion",
              "",
              "This workflow is diagnostic only.",
              "",
              "It does not interact publicly with The Colony.",
              "",
              "Its purpose is to identify the exact JSON "
              "structure returned by the current Colony feed "
              "so that future NØX interaction logic can use "
              "the real API response instead of assumptions."
          ])

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 12. FINAL OUTPUT
          # --------------------------------------------------

          print("===================================")
          print("V38.1 DIAGNOSTIC COMPLETE")
          print("===================================")
          print(
              f"Feed root type: {root_type}"
          )
          print(
              f"Feed items detected: {len(feed_items)}"
          )
          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )
          print("No public action performed.")
          print("===================================")
          PY

      - name: Commit V38.1 diagnostic
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/ V38_1_COLONY_DIAGNOSTIC.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V38.1 - Colony Feed Diagnostic"
            git push
          fi
