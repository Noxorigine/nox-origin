name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-colony-presence
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json

  MAX_FEED_ITEMS: "25"
  MAX_NOTIFICATIONS: "25"

  MAX_COMMENTS_PER_RUN: "2"
  MAX_REPLIES_PER_RUN: "2"
  MAX_REPLIES_PER_SENDER: "2"
  MAX_POSTS_PER_RUN: "1"

  MIN_POST_INTERVAL_HOURS: "24"

  MAX_MEMORY_ITEMS: "400"
  MAX_HANDLED_NOTIFICATIONS: "1500"
  MAX_CONTEXT_CHARS: "7000"

  MIN_INTEREST_TO_COMMENT: "0.62"
  MIN_INTEREST_TO_REPLY: "0.58"
  MIN_INTEREST_TO_POST: "0.72"

  MAX_COGNITIVE_CASES: "300"
  MAX_EVIDENCE_TERMS: "8"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0"

      - name: Verify Colony SDK
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from colony_sdk import ColonyClient

          required = [
              "get_for_you_feed",
              "get_notifications",
              "create_comment",
              "create_post",
          ]

          missing = [
              name
              for name in required
              if not hasattr(ColonyClient, name)
          ]

          if missing:
              raise RuntimeError(
                  "Colony SDK is missing required methods: "
                  + ", ".join(missing)
              )

          print("Colony SDK import: OK")
          print("Required methods: OK")
          PY

      - name: Run NØX Colony Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta

          from colony_sdk import ColonyClient


          # ============================================================
          # 1. CONFIGURATION
          # ============================================================

          CORE_MEMORY_FILE = os.environ["CORE_MEMORY_FILE"]
          CORE_RUNTIME_FILE = os.environ["CORE_RUNTIME_FILE"]
          KNOWLEDGE_FILE = os.environ["KNOWLEDGE_FILE"]
          PRESENCE_FILE = os.environ["PRESENCE_FILE"]

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])

          MAX_COMMENTS_PER_RUN = int(
              os.environ["MAX_COMMENTS_PER_RUN"]
          )
          MAX_REPLIES_PER_RUN = int(
              os.environ["MAX_REPLIES_PER_RUN"]
          )
          MAX_REPLIES_PER_SENDER = int(
              os.environ["MAX_REPLIES_PER_SENDER"]
          )
          MAX_POSTS_PER_RUN = int(
              os.environ["MAX_POSTS_PER_RUN"]
          )

          MIN_POST_INTERVAL_HOURS = int(
              os.environ["MIN_POST_INTERVAL_HOURS"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )
          MAX_HANDLED_NOTIFICATIONS = int(
              os.environ["MAX_HANDLED_NOTIFICATIONS"]
          )
          MAX_CONTEXT_CHARS = int(
              os.environ["MAX_CONTEXT_CHARS"]
          )

          MIN_INTEREST_TO_COMMENT = float(
              os.environ["MIN_INTEREST_TO_COMMENT"]
          )
          MIN_INTEREST_TO_REPLY = float(
              os.environ["MIN_INTEREST_TO_REPLY"]
          )
          MIN_INTEREST_TO_POST = float(
              os.environ["MIN_INTEREST_TO_POST"]
          )

          MAX_COGNITIVE_CASES = int(
              os.environ["MAX_COGNITIVE_CASES"]
          )
          MAX_EVIDENCE_TERMS = int(
              os.environ["MAX_EVIDENCE_TERMS"]
          )


          # ============================================================
          # 2. BASIC UTILITIES
          # ============================================================

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          SELF_ID = "nox_origine"


          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def clean_text(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def get_value(obj, *names, default=None):
              if isinstance(obj, dict):
                  for name in names:
                      if (
                          name in obj
                          and obj[name] is not None
                      ):
                          return obj[name]
                  return default

              for name in names:
                  value = getattr(
                      obj,
                      name,
                      None
                  )

                  if value is not None:
                      return value

              return default


          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"WARNING: unable to load {path}: "
                      f"{type(exc).__name__}: {exc}"
                  )

                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temporary = f"{path}.tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )


          def trim_text(text, limit=MAX_CONTEXT_CHARS):
              text = clean_text(text)

              if len(text) <= limit:
                  return text

              return (
                  text[:limit - 1].rstrip()
                  + "…"
              )


          def clamp(value, minimum=0.0, maximum=1.0):
              return max(
                  minimum,
                  min(
                      maximum,
                      float(value)
                  )
              )


          def safe_float(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default


          # ============================================================
          # 3. RESPONSE NORMALIZATION
          # ============================================================

          def normalize_items(response, preferred_keys):
              if response is None:
                  return []

              if isinstance(response, list):
                  return response

              if isinstance(response, tuple):
                  return list(response)

              if isinstance(response, dict):
                  for key in preferred_keys:
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

                  for key in (
                      "items",
                      "data",
                      "results",
                  ):
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

                  return []

              try:
                  return list(response)
              except TypeError:
                  return []


          # ============================================================
          # 4. COLONY OBJECT EXTRACTION
          # ============================================================

          def extract_sender(item):
              sender = get_value(
                  item,
                  "sender",
                  "author",
                  "user",
                  "agent",
                  default=None
              )

              if sender is None:
                  return ""

              return clean_text(
                  get_value(
                      sender,
                      "username",
                      "handle",
                      "name",
                      "id",
                      default=sender
                  )
              )


          def extract_sender_id(item):
              sender = get_value(
                  item,
                  "sender",
                  "author",
                  "user",
                  "agent",
                  default=None
              )

              if sender is not None:
                  value = get_value(
                      sender,
                      "id",
                      "user_id",
                      "agent_id",
                      "username",
                      "handle",
                      default=None
                  )

                  if value is not None:
                      return str(value)

              value = get_value(
                  item,
                  "sender_id",
                  "author_id",
                  "user_id",
                  "agent_id",
                  default=None
              )

              if value is not None:
                  return str(value)

              return ""


          def extract_id(item):
              value = get_value(
                  item,
                  "id",
                  "post_id",
                  "comment_id",
                  "notification_id",
                  default=None
              )

              if value is not None:
                  return str(value)

              return ""


          def extract_target_id(notification):
              fields = (
                  "target_id",
                  "comment_id",
                  "post_id",
                  "reply_to_id",
                  "parent_id",
                  "content_id",
                  "source_id",
              )

              for field in fields:
                  value = get_value(
                      notification,
                      field,
                      default=None
                  )

                  if value is not None:
                      return str(value)

              target = get_value(
                  notification,
                  "target",
                  "content",
                  "post",
                  "comment",
                  default=None
              )

              if target is not None:
                  value = get_value(
                      target,
                      "id",
                      "comment_id",
                      "post_id",
                      default=None
                  )

                  if value is not None:
                      return str(value)

              return ""


          def extract_text(item):
              return clean_text(
                  get_value(
                      item,
                      "body",
                      "content",
                      "text",
                      "message",
                      "title",
                      default=""
                  )
              )


          def extract_post_id(item):
              return clean_text(
                  get_value(
                      item,
                      "post_id",
                      "id",
                      default=""
                  )
              )


          def extract_feed_post(item):
              if isinstance(item, dict):
                  nested = item.get("post")

                  if isinstance(nested, dict):
                      return nested

              return item


          # ============================================================
          # 5. LANGUAGE
          #
          # English remains NØX's default public language.
          # Incoming language is respected only when deterministic
          # evidence is sufficient.
          # ============================================================

          LANGUAGE_MARKERS = {
              "fr": (
                  " le ",
                  " la ",
                  " les ",
                  " des ",
                  " une ",
                  " un ",
                  " est ",
                  " avec ",
                  " pour ",
                  " dans ",
                  " que ",
                  " vous ",
                  " nous ",
                  " merci ",
                  " comment ",
                  " pourquoi ",
                  " mais ",
                  " sur ",
                  " cette ",
                  " ces ",
                  " votre ",
                  " peut ",
                  " peux ",
              ),
              "es": (
                  " el ",
                  " la ",
                  " los ",
                  " las ",
                  " una ",
                  " un ",
                  " es ",
                  " con ",
                  " para ",
                  " que ",
                  " gracias ",
                  " cómo ",
                  " por qué ",
                  " pero ",
                  " esta ",
                  " este ",
                  " puede ",
                  " puedes ",
                  " sobre ",
              ),
              "de": (
                  " der ",
                  " die ",
                  " das ",
                  " den ",
                  " eine ",
                  " ein ",
                  " ist ",
                  " mit ",
                  " für ",
                  " und ",
                  " danke ",
                  " wie ",
                  " warum ",
                  " aber ",
                  " diese ",
                  " dieser ",
                  " können ",
                  " kann ",
                  " über ",
              ),
              "it": (
                  " il ",
                  " lo ",
                  " gli ",
                  " le ",
                  " una ",
                  " un ",
                  " è ",
                  " con ",
                  " per ",
                  " che ",
                  " grazie ",
                  " come ",
                  " perché ",
                  " ma ",
                  " questa ",
                  " questo ",
                  " può ",
                  " puoi ",
                  " sulla ",
              ),
              "pt": (
                  " o ",
                  " a ",
                  " os ",
                  " as ",
                  " uma ",
                  " um ",
                  " é ",
                  " com ",
                  " para ",
                  " que ",
                  " obrigado ",
                  " obrigada ",
                  " como ",
                  " por que ",
                  " mas ",
                  " esta ",
                  " este ",
                  " pode ",
                  " você ",
              ),
              "nl": (
                  " de ",
                  " het ",
                  " een ",
                  " is ",
                  " met ",
                  " voor ",
                  " en ",
                  " dank ",
                  " hoe ",
                  " waarom ",
                  " maar ",
                  " deze ",
                  " dit ",
                  " kan ",
                  " kunt ",
                  " over ",
              ),
              "en": (
                  " the ",
                  " a ",
                  " an ",
                  " is ",
                  " are ",
                  " with ",
                  " for ",
                  " and ",
                  " thanks ",
                  " how ",
                  " why ",
                  " but ",
                  " this ",
                  " that ",
                  " these ",
                  " those ",
                  " can ",
                  " could ",
                  " would ",
                  " your ",
              ),
          }


          def detect_language(text):
              text = clean_text(text).lower()

              if not text:
                  return "en"

              padded = f" {text} "

              scores = {}

              for language, markers in LANGUAGE_MARKERS.items():
                  scores[language] = sum(
                      padded.count(marker)
                      for marker in markers
                  )

              ordered = sorted(
                  scores.items(),
                  key=lambda item: item[1],
                  reverse=True
              )

              if not ordered:
                  return "en"

              best_language, best_score = ordered[0]

              if best_score < 2:
                  return "en"

              if len(ordered) > 1:
                  second_score = ordered[1][1]

                  if (
                      best_score == second_score
                      and best_score < 3
                  ):
                      return "en"

              return best_language


          # ============================================================
          # 6. CONTENT ANALYSIS
          #
          # This is deliberately deterministic.
          # Presence does not pretend to have semantic certainty.
          # It builds evidence-backed hypotheses and assigns uncertainty.
          # ============================================================

          STOP_WORDS = {
              "the", "and", "that", "this", "with", "from",
              "have", "about", "your", "what", "when", "where",
              "would", "could", "should", "there", "their",
              "dans", "pour", "avec", "les", "des", "une",
              "que", "vous", "nous", "comment", "pourquoi",
              "est", "mais", "sur", "cette", "ces", "votre",
              "peut", "peux",
              "der", "die", "das", "und", "mit", "für", "ist",
              "ein", "eine",
              "el", "los", "las", "una", "para", "con", "como",
              "por",
              "il", "gli", "perché", "che",
              "uma", "com",
              "een", "het", "voor", "van", "maar",
          }


          def topic_terms(text):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9_-]{2,}",
                  clean_text(text).lower()
              )

              selected = []

              for word in words:
                  if word in STOP_WORDS:
                      continue

                  if word in selected:
                      continue

                  selected.append(word)

                  if len(selected) >= MAX_EVIDENCE_TERMS:
                      break

              return selected


          def meaningful_topic(text):
              return ", ".join(
                  topic_terms(text)[:3]
              )


          def contains_any(text, terms):
              lowered = clean_text(text).lower()

              return any(
                  term in lowered
                  for term in terms
              )


          def is_real_question(text):
              text = clean_text(text).lower()

              if not text:
                  return False

              question_starts = (
                  "how ",
                  "why ",
                  "what ",
                  "when ",
                  "where ",
                  "can ",
                  "could ",
                  "would ",
                  "anyone ",
                  "does ",
                  "do you ",
                  "have you ",
                  "comment ",
                  "pourquoi ",
                  "quoi ",
                  "quand ",
                  "où ",
                  "peux ",
                  "pouvez ",
                  "cómo ",
                  "por qué ",
                  "puede ",
                  "pueden ",
                  "wie ",
                  "warum ",
                  "kann ",
                  "können ",
                  "come ",
                  "perché ",
                  "può ",
                  "como ",
                  "por que ",
                  "pode ",
                  "podem ",
                  "hoe ",
                  "waarom ",
                  "kan ",
              )

              return (
                  "?" in text
                  or any(
                      text.startswith(start)
                      for start in question_starts
                  )
              )


          def is_meaningful_content(text):
              text = clean_text(text)

              if len(text) < 50:
                  return False

              generic = (
                  "caught my attention",
                  "interesting perspective",
                  "just wanted to share",
                  "what do you think?",
                  "gm",
                  "good morning",
                  "good night",
                  "great post",
                  "nice post",
                  "interesting post",
                  "thanks for sharing",
              )

              if any(
                  phrase in text.lower()
                  for phrase in generic
              ):
                  return False

              return len(topic_terms(text)) >= 1


          def has_evidence_language(text):
              evidence_terms = (
                  "tested",
                  "test",
                  "tested it",
                  "result",
                  "results",
                  "observed",
                  "observation",
                  "measured",
                  "measurement",
                  "data",
                  "evidence",
                  "experiment",
                  "experimented",
                  "failed",
                  "failure",
                  "worked",
                  "works",
                  "verified",
                  "validation",
                  "confirmed",
                  "proof",
                  "tried",
                  "attempt",
                  "résultat",
                  "testé",
                  "observé",
                  "preuve",
                  "expérience",
                  "échec",
                  "vérifié",
              )

              return contains_any(
                  text,
                  evidence_terms
              )


          def has_action_language(text):
              action_terms = (
                  "build",
                  "building",
                  "try",
                  "trying",
                  "test",
                  "testing",
                  "implement",
                  "implementation",
                  "change",
                  "changed",
                  "improve",
                  "improvement",
                  "fix",
                  "fixed",
                  "measure",
                  "measurements",
                  "deploy",
                  "deployment",
                  "create",
                  "cré",
                  "tester",
                  "test",
                  "corriger",
                  "améliorer",
                  "mesurer",
              )

              return contains_any(
                  text,
                  action_terms
              )


          def has_learning_language(text):
              learning_terms = (
                  "learned",
                  "lesson",
                  "learning",
                  "realized",
                  "discovered",
                  "changed my mind",
                  "adapted",
                  "adaptation",
                  "failure taught",
                  "j'ai appris",
                  "leçon",
                  "apprentissage",
                  "découvert",
                  "adapté",
              )

              return contains_any(
                  text,
                  learning_terms
              )


          def has_agent_relevance(text):
              terms = (
                  "agent",
                  "agents",
                  "ai",
                  "artificial intelligence",
                  "autonomous",
                  "autonomy",
                  "workflow",
                  "memory",
                  "cognitive",
                  "reasoning",
                  "reputation",
                  "colony",
                  "marketplace",
                  "task",
                  "tasks",
                  "contribution",
                  "agent economy",
              )

              return contains_any(
                  text,
                  terms
              )


          def has_uncertainty_language(text):
              terms = (
                  "maybe",
                  "perhaps",
                  "uncertain",
                  "unclear",
                  "hypothesis",
                  "might",
                  "could be",
                  "not sure",
                  "unknown",
                  "probably",
                  "je ne sais pas",
                  "hypothèse",
                  "incertain",
                  "peut-être",
                  "inconnu",
              )

              return contains_any(
                  text,
                  terms
              )


          # ============================================================
          # 7. CORE / KNOWLEDGE RECALL
          #
          # Presence does not become a second Core.
          # It consumes the Core's current cognitive state and knowledge.
          # Web research remains outside this workflow.
          # ============================================================

          def flatten_memory_text(data, max_items=80):
              pieces = []

              if not isinstance(data, dict):
                  return pieces

              preferred = (
                  "beliefs",
                  "learnings",
                  "observations",
                  "decisions",
                  "actions",
                  "failures",
                  "cognitive_cases",
                  "lessons",
                  "facts",
                  "insights",
              )

              for key in preferred:
                  values = data.get(key)

                  if not isinstance(values, list):
                      continue

                  for item in values[-max_items:]:
                      if isinstance(item, str):
                          text = clean_text(item)
                      else:
                          text = clean_text(
                              get_value(
                                  item,
                                  "text",
                                  "content",
                                  "lesson",
                                  "summary",
                                  "reason",
                                  "decision",
                                  "observation",
                                  default=""
                              )
                          )

                      if text:
                          pieces.append(
                              (
                                  key,
                                  text
                              )
                          )

              return pieces


          def recall_relevant_terms(
              text,
              core_memory,
              knowledge
          ):
              terms = topic_terms(text)

              if not terms:
                  return {
                      "matched": 0,
                      "matches": [],
                  }

              memory_items = (
                  flatten_memory_text(
                      core_memory
                  )
                  + flatten_memory_text(
                      knowledge
                  )
              )

              matches = []

              for key, memory_text in memory_items:
                  lowered = memory_text.lower()

                  overlap = [
                      term
                      for term in terms
                      if term in lowered
                  ]

                  if overlap:
                      matches.append(
                          {
                              "source": key,
                              "terms": overlap[:5],
                              "text": trim_text(
                                  memory_text,
                                  350
                              ),
                          }
                      )

              return {
                  "matched": len(matches),
                  "matches": matches[-5:],
              }


          def build_shared_context(
              core_memory,
              core_runtime,
              knowledge
          ):
              sections = []

              for label, data in (
                  ("CORE", core_memory),
                  ("RUNTIME", core_runtime),
                  ("KNOWLEDGE", knowledge),
              ):
                  raw = json.dumps(
                      data,
                      ensure_ascii=False
                  )

                  sections.append(
                      f"{label}: "
                      + trim_text(
                          raw,
                          2100
                      )
                  )

              return trim_text(
                  "\n".join(sections),
                  MAX_CONTEXT_CHARS
              )


          # ============================================================
          # 8. COGNITIVE INTEREST MODEL
          #
          # This is the key change:
          # Presence must justify intervention instead of merely
          # detecting a question.
          #
          # Dimensions:
          #   relevance
          #   novelty
          #   evidence
          #   actionability
          #   relationship
          #   uncertainty
          #   risk
          #
          # Interest is an operational heuristic, NOT claimed truth.
          # ============================================================

          def calculate_interest(
              text,
              author_id,
              presence,
              recall
          ):
              text = clean_text(text)

              relevance = (
                  0.80
                  if has_agent_relevance(text)
                  else 0.30
              )

              evidence = (
                  0.80
                  if has_evidence_language(text)
                  else 0.25
              )

              actionability = (
                  0.75
                  if has_action_language(text)
                  else 0.30
              )

              learning_signal = (
                  0.75
                  if has_learning_language(text)
                  else 0.25
              )

              question_signal = (
                  0.80
                  if is_real_question(text)
                  else 0.20
              )

              novelty = (
                  0.75
                  if recall["matched"] == 0
                  else 0.45
                  if recall["matched"] <= 2
                  else 0.25
              )

              relationship = 0.25

              if author_id:
                  relation = presence.get(
                      "relationships",
                      {}
                  ).get(
                      str(author_id),
                      {}
                  )

                  interaction_count = int(
                      relation.get(
                          "interactions",
                          0
                      )
                  )

                  if interaction_count >= 3:
                      relationship = 0.60
                  elif interaction_count >= 1:
                      relationship = 0.45

              uncertainty = (
                  0.65
                  if has_uncertainty_language(text)
                  else 0.25
              )

              risk = 0.10

              if len(text) < 70:
                  risk += 0.15

              if contains_any(
                  text,
                  (
                      "guaranteed",
                      "always",
                      "never",
                      "obviously",
                      "100%",
                      "certainly",
                  )
              ):
                  risk += 0.15

              if not topic_terms(text):
                  risk += 0.20

              raw_interest = (
                  relevance * 0.20
                  + novelty * 0.15
                  + evidence * 0.15
                  + actionability * 0.15
                  + relationship * 0.05
                  + question_signal * 0.15
                  + learning_signal * 0.10
                  + uncertainty * 0.05
              )

              interest = clamp(
                  raw_interest - risk * 0.15
              )

              return {
                  "overall": round(
                      interest,
                      3
                  ),
                  "relevance": round(
                      relevance,
                      3
                  ),
                  "novelty": round(
                      novelty,
                      3
                  ),
                  "evidence": round(
                      evidence,
                      3
                  ),
                  "actionability": round(
                      actionability,
                      3
                  ),
                  "relationship": round(
                      relationship,
                      3
                  ),
                  "question": round(
                      question_signal,
                      3
                  ),
                  "learning": round(
                      learning_signal,
                      3
                  ),
                  "uncertainty": round(
                      uncertainty,
                      3
                  ),
                  "risk": round(
                      risk,
                      3
                  ),
              }


          def choose_action(
              interest,
              is_question,
              has_target,
              is_post,
              author
          ):
              score = interest["overall"]

              if (
                  is_question
                  and has_target
                  and score >= MIN_INTEREST_TO_REPLY
              ):
                  return "reply"

              if (
                  is_post
                  and author
                  and score >= MIN_INTEREST_TO_COMMENT
              ):
                  return "comment"

              return "observe"


          # ============================================================
          # 9. RELATIONSHIP STATE
          # ============================================================

          def ensure_relationship(
              presence,
              author_id,
              author
          ):
              if not author_id:
                  return None

              relationships = presence.setdefault(
                  "relationships",
                  {}
              )

              relation = relationships.setdefault(
                  str(author_id),
                  {
                      "sender": author,
                      "first_seen": now_iso(),
                      "last_seen": now_iso(),
                      "interactions": 0,
                      "useful_interactions": 0,
                      "actions": 0,
                      "languages": {},
                  }
              )

              relation["sender"] = (
                  author
                  or relation.get(
                      "sender",
                      ""
                  )
              )

              relation["last_seen"] = now_iso()

              relation["interactions"] = (
                  int(
                      relation.get(
                          "interactions",
                          0
                      )
                  )
                  + 1
              )

              return relation


          # ============================================================
          # 10. COGNITIVE MEMORY HELPERS
          # ============================================================

          def remember_case(
              presence,
              case
          ):
              presence.setdefault(
                  "cognitive_cases",
                  []
              )

              presence[
                  "cognitive_cases"
              ].append(case)


          def remember_learning(
              presence,
              lesson,
              evidence
          ):
              presence.setdefault(
                  "learnings",
                  []
              )

              presence[
                  "learnings"
              ].append(
                  {
                      "timestamp": now_iso(),
                      "lesson": clean_text(
                          lesson
                      ),
                      "evidence": evidence,
                  }
              )


          def remember_outcome(
              presence,
              outcome_type,
              case_id,
              result,
              evidence=None
          ):
              presence.setdefault(
                  "outcomes",
                  []
              )

              presence[
                  "outcomes"
              ].append(
                  {
                      "timestamp": now_iso(),
                      "type": outcome_type,
                      "case_id": case_id,
                      "result": result,
                      "evidence": evidence or {},
                  }
              )


          # ============================================================
          # 11. COMMUNICATION
          #
          # Replies/comments are generated from the actual topic.
          # NØX does not use generic "interesting point" engagement.
          # ============================================================

          def build_reply(
              language,
              sender,
              message,
              recall,
              interest
          ):
              name = (
                  sender
                  if sender and len(sender) <= 40
                  else "there"
              )

              topic = meaningful_topic(message)

              if recall["matched"] > 0:
                  evidence_phrase = (
                      "I already have related observations in "
                      "my working memory, so I would compare "
                      "this with those results before drawing "
                      "a stronger conclusion."
                  )
              else:
                  evidence_phrase = (
                      "I don't have a matching observation in "
                      "my current memory, so I would treat this "
                      "as a hypothesis until a result can be observed."
                  )

              if language == "fr":
                  return (
                      f"@{name}, sur "
                      f"{topic or 'ce point'}, je vois surtout "
                      "une question testable plutôt qu'une "
                      "conclusion déjà établie. "
                      f"{evidence_phrase} "
                      "Quel résultat concret permettrait de "
                      "confirmer ou d'infirmer l'approche ?"
                  )

              if language == "es":
                  return (
                      f"@{name}, sobre "
                      f"{topic or 'este punto'}, veo sobre todo "
                      "una cuestión comprobable, no una conclusión "
                      "ya establecida. "
                      "¿Qué resultado concreto permitiría "
                      "confirmar o refutar el enfoque?"
                  )

              if language == "de":
                  return (
                      f"@{name}, bei "
                      f"{topic or 'diesem Punkt'} sehe ich vor "
                      "allem eine überprüfbare Frage und noch "
                      "keine gesicherte Schlussfolgerung. "
                      "Welches konkrete Ergebnis würde den Ansatz "
                      "bestätigen oder widerlegen?"
                  )

              if language == "it":
                  return (
                      f"@{name}, su "
                      f"{topic or 'questo punto'} vedo soprattutto "
                      "una questione verificabile, non ancora una "
                      "conclusione stabilita. "
                      "Quale risultato concreto permetterebbe di "
                      "confermare o smentire l'approccio?"
                  )

              if language == "pt":
                  return (
                      f"@{name}, sobre "
                      f"{topic or 'este ponto'}, vejo sobretudo "
                      "uma questão testável, não uma conclusão "
                      "já estabelecida. "
                      "Que resultado concreto permitiria confirmar "
                      "ou refutar a abordagem?"
                  )

              if language == "nl":
                  return (
                      f"@{name}, bij "
                      f"{topic or 'dit punt'} zie ik vooral een "
                      "toetsbare vraag en nog geen vaststaande "
                      "conclusie. "
                      "Welk concreet resultaat zou de aanpak "
                      "bevestigen of weerleggen?"
                  )

              return (
                  f"@{name}, on "
                  f"{topic or 'this point'}, I see a testable "
                  "question rather than an established conclusion. "
                  f"{evidence_phrase} "
                  "What concrete result would confirm or falsify "
                  "the approach?"
              )


          def build_comment(
              language,
              author,
              post_text,
              recall
          ):
              topic = meaningful_topic(post_text)

              if recall["matched"] > 0:
                  evidence = (
                      "I would compare it with the related "
                      "observations already available rather "
                      "than treating it as a new fact."
                  )
              else:
                  evidence = (
                      "I would treat the claim as a hypothesis "
                      "until an observable result supports it."
                  )

              if language == "fr":
                  return (
                      f"@{author}, sur "
                      f"{topic or 'ce sujet'}, {evidence} "
                      "Quel résultat concret ferait évoluer "
                      "ton interprétation ?"
                  )

              if language == "es":
                  return (
                      f"@{author}, sobre "
                      f"{topic or 'este tema'}, {evidence} "
                      "¿Qué resultado concreto cambiaría "
                      "tu interpretación?"
                  )

              if language == "de":
                  return (
                      f"@{author}, bei "
                      f"{topic or 'diesem Thema'} würde ich "
                      f"so vorgehen: {evidence} "
                      "Welches konkrete Ergebnis würde deine "
                      "Interpretation verändern?"
                  )

              if language == "it":
                  return (
                      f"@{author}, su "
                      f"{topic or 'questo tema'} {evidence} "
                      "Quale risultato concreto cambierebbe "
                      "la tua interpretazione?"
                  )

              if language == "pt":
                  return (
                      f"@{author}, sobre "
                      f"{topic or 'este tema'}, {evidence} "
                      "Que resultado concreto mudaria "
                      "a tua interpretação?"
                  )

              if language == "nl":
                  return (
                      f"@{author}, bij "
                      f"{topic or 'dit onderwerp'} {evidence} "
                      "Welk concreet resultaat zou je "
                      "interpretatie veranderen?"
                  )

              return (
                  f"@{author}, on "
                  f"{topic or 'this topic'}, {evidence} "
                  "What concrete result would change "
                  "your interpretation?"
              )


          # ============================================================
          # 12. PUBLICATION CANDIDATE SELECTION
          #
          # NØX publishes only when a real lesson exists.
          # It does NOT manufacture a post simply because the timer
          # permits one.
          # ============================================================

          def collect_learning_candidates(
              core_memory,
              knowledge,
              presence
          ):
              candidates = []

              sources = (
                  ("core", core_memory),
                  ("knowledge", knowledge),
                  ("presence", presence),
              )

              for source_name, data in sources:
                  if not isinstance(data, dict):
                      continue

                  for key in (
                      "learnings",
                      "lessons",
                      "insights",
                      "observations",
                      "failures",
                  ):
                      values = data.get(key)

                      if not isinstance(values, list):
                          continue

                      for item in values[-30:]:
                          if isinstance(item, str):
                              text = clean_text(item)
                          else:
                              text = clean_text(
                                  get_value(
                                      item,
                                      "lesson",
                                      "summary",
                                      "text",
                                      "content",
                                      "observation",
                                      "description",
                                      default=""
                                  )
                              )

                          if not text:
                              continue

                          if not is_meaningful_content(
                              text
                          ):
                              continue

                          candidates.append(
                              {
                                  "source": source_name,
                                  "text": trim_text(
                                      text,
                                      900
                                  ),
                                  "evidence": (
                                      has_evidence_language(
                                          text
                                      )
                                  ),
                                  "learning": (
                                      has_learning_language(
                                          text
                                      )
                                  ),
                              }
                          )

              return candidates


          def choose_publication_candidate(
              core_memory,
              knowledge,
              presence
          ):
              candidates = collect_learning_candidates(
                  core_memory,
                  knowledge,
                  presence
              )

              if not candidates:
                  return None

              recent_posts = presence.get(
                  "posts",
                  []
              )

              recent_text = " ".join(
                  clean_text(
                      item.get(
                          "body",
                          ""
                      )
                  )
                  for item in recent_posts[-8:]
                  if isinstance(item, dict)
              ).lower()

              scored = []

              for candidate in candidates:
                  text = candidate["text"]

                  if (
                      text[:120].lower()
                      in recent_text
                  ):
                      continue

                  score = 0.30

                  if candidate["evidence"]:
                      score += 0.25

                  if candidate["learning"]:
                      score += 0.25

                  if len(topic_terms(text)) >= 2:
                      score += 0.10

                  if candidate["source"] == "core":
                      score += 0.05

                  scored.append(
                      (
                          clamp(score),
                          candidate
                      )
                  )

              if not scored:
                  return None

              scored.sort(
                  key=lambda item: item[0],
                  reverse=True
              )

              best_score, best = scored[0]

              if best_score < MIN_INTEREST_TO_POST:
                  return None

              best["score"] = round(
                  best_score,
                  3
              )

              return best


          # ============================================================
          # 13. INITIAL STATE
          # ============================================================

          print("=== NØX COLONY PRESENCE COGNITIVE V3 ===")

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          presence = load_json(
              PRESENCE_FILE,
              {}
          )

          if not isinstance(presence, dict):
              presence = {}

          defaults = {
              "version": 3,
              "updated_at": None,
              "runs": 0,
              "handled_notifications": [],
              "relationships": {},
              "interactions": [],
              "cognitive_cases": [],
              "decisions": [],
              "actions": [],
              "comments": [],
              "replies": [],
              "posts": [],
              "outcomes": [],
              "learnings": [],
              "failures": [],
          }

          for key, value in defaults.items():
              presence.setdefault(
                  key,
                  value
              )


          shared_context = build_shared_context(
              core_memory,
              core_runtime,
              knowledge
          )

          print(
              f"Shared Core/Knowledge context: "
              f"{len(shared_context)} chars"
          )

          print(
              "Cognitive mode: enabled"
          )
          print(
              "External AI: false"
          )
          print(
              "Gemini: false"
          )
          print(
              "Project cost: €0"
          )
          print(
              "Spending/payment authority: false"
          )


          # ============================================================
          # 14. CLIENT
          # ============================================================

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          client = ColonyClient(
              api_key
          )


          # ============================================================
          # 15. OBSERVE
          # ============================================================

          feed_response = client.get_for_you_feed(
              limit=MAX_FEED_ITEMS
          )

          notifications_response = (
              client.get_notifications(
                  limit=MAX_NOTIFICATIONS
              )
          )

          feed = normalize_items(
              feed_response,
              (
                  "posts",
                  "items",
                  "feed",
              )
          )

          notifications = normalize_items(
              notifications_response,
              (
                  "notifications",
                  "items",
              )
          )

          print(
              f"OBSERVE: feed={len(feed)}"
          )

          print(
              f"OBSERVE: notifications={len(notifications)}"
          )


          # ============================================================
          # 16. STATE / GUARDS
          # ============================================================

          handled_notifications = set(
              str(item)
              for item in presence[
                  "handled_notifications"
              ]
          )

          sender_reply_counts = {}

          for item in presence["replies"]:
              if not isinstance(item, dict):
                  continue

              sender_id = str(
                  item.get(
                      "sender_id",
                      ""
                  )
              )

              if sender_id:
                  sender_reply_counts[
                      sender_id
                  ] = (
                      sender_reply_counts.get(
                          sender_id,
                          0
                      )
                      + 1
                  )

          commented_post_ids = set(
              str(
                  item.get(
                      "post_id"
                  )
              )
              for item in presence["comments"]
              if (
                  isinstance(item, dict)
                  and item.get("post_id")
              )
          )

          conflict_post_ids = set(
              str(
                  item.get(
                      "post_id"
                  )
              )
              for item in presence["outcomes"]
              if (
                  isinstance(item, dict)
                  and item.get("type")
                  == "comment_conflict"
                  and item.get("post_id")
              )
          )

          replies_sent = 0
          comments_sent = 0
          publications = 0
          new_interactions = 0
          cognitive_cases_created = 0
          silent_decisions = 0


          # ============================================================
          # 17. NOTIFICATIONS
          #
          # Every new notification becomes a cognitive case.
          # ============================================================

          for notification in notifications:

              notification_id = extract_id(
                  notification
              )

              if (
                  not notification_id
                  or notification_id
                  in handled_notifications
              ):
                  continue

              sender = extract_sender(
                  notification
              )

              sender_id = extract_sender_id(
                  notification
              )

              message = extract_text(
                  notification
              )

              target_id = extract_target_id(
                  notification
              )

              if (
                  sender_id == SELF_ID
              ):
                  handled_notifications.add(
                      notification_id
                  )
                  continue

              if not sender and not message:
                  handled_notifications.add(
                      notification_id
                  )
                  continue

              new_interactions += 1

              language = detect_language(
                  message
              )

              recall = recall_relevant_terms(
                  message,
                  core_memory,
                  knowledge
              )

              interest = calculate_interest(
                  message,
                  sender_id,
                  presence,
                  recall
              )

              action = choose_action(
                  interest,
                  is_real_question(message),
                  bool(target_id),
                  False,
                  sender
              )

              case_id = (
                  f"notification:"
                  f"{notification_id}"
              )

              case = {
                  "timestamp": now_iso(),
                  "case_id": case_id,
                  "source": "notification",
                  "source_id": notification_id,
                  "sender": sender,
                  "sender_id": sender_id,
                  "language": language,
                  "message": trim_text(
                      message,
                      1400
                  ),
                  "topic": topic_terms(message),
                  "recall": recall,
                  "interest": interest,
                  "action_candidate": action,
                  "uncertainty": round(
                      1.0 - interest["evidence"],
                      3
                  ),
                  "reasoning": {
                      "question": is_real_question(
                          message
                      ),
                      "has_target": bool(
                          target_id
                      ),
                      "memory_match": recall[
                          "matched"
                      ],
                      "interest_threshold": (
                          MIN_INTEREST_TO_REPLY
                      ),
                  },
                  "status": "considered",
              }

              remember_case(
                  presence,
                  case
              )

              cognitive_cases_created += 1

              print(
                  "REFLECT: notification "
                  f"{notification_id} "
                  f"interest={interest['overall']} "
                  f"action={action}"
              )

              relation = ensure_relationship(
                  presence,
                  sender_id,
                  sender
              )

              if relation is not None:
                  relation["languages"][
                      language
                  ] = int(
                      relation["languages"].get(
                          language,
                          0
                      )
                  ) + 1

              # --------------------------------------------------------
              # CHOOSE / ACT: REPLY
              # --------------------------------------------------------

              can_reply = (
                  action == "reply"
                  and replies_sent
                  < MAX_REPLIES_PER_RUN
                  and bool(target_id)
                  and bool(sender_id)
                  and sender_id != SELF_ID
                  and (
                      sender_reply_counts.get(
                          sender_id,
                          0
                      )
                      < MAX_REPLIES_PER_SENDER
                  )
              )

              if can_reply:

                  reply = build_reply(
                      language,
                      sender,
                      message,
                      recall,
                      interest
                  )

                  try:
                      client.create_comment(
                          target_id,
                          reply
                      )

                      replies_sent += 1

                      sender_reply_counts[
                          sender_id
                      ] = (
                          sender_reply_counts.get(
                              sender_id,
                              0
                          )
                          + 1
                      )

                      presence["replies"].append(
                          {
                              "timestamp": now_iso(),
                              "case_id": case_id,
                              "notification_id": (
                                  notification_id
                              ),
                              "target_id": target_id,
                              "sender": sender,
                              "sender_id": sender_id,
                              "language": language,
                              "message": trim_text(
                                  message,
                                  1200
                              ),
                              "reply": reply,
                              "interest": interest,
                          }
                      )

                      presence["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "case_id": case_id,
                              "action": "reply",
                              "reason": (
                                  "interest threshold "
                                  "and concrete question"
                              ),
                              "interest": interest,
                          }
                      )

                      case["status"] = "acted"
                      case["chosen_action"] = "reply"

                      if relation is not None:
                          relation["actions"] = int(
                              relation.get(
                                  "actions",
                                  0
                              )
                          ) + 1

                      remember_outcome(
                          presence,
                          "reply_attempt",
                          case_id,
                          "sent",
                          {
                              "interest": interest,
                              "target_id": target_id,
                          }
                      )

                      print(
                          f"ACT: reply sent to "
                          f"{sender or sender_id}"
                      )

                  except Exception as exc:

                      error_text = clean_text(
                          str(exc)
                      )

                      case["status"] = "action_failed"

                      presence["failures"].append(
                          {
                              "timestamp": now_iso(),
                              "case_id": case_id,
                              "type": "reply",
                              "error": trim_text(
                                  error_text,
                                  1200
                              ),
                              "uncertainty": (
                                  "The failure cause "
                                  "was not independently "
                                  "verified."
                              ),
                          }
                      )

                      remember_outcome(
                          presence,
                          "reply_attempt",
                          case_id,
                          "failed",
                          {
                              "error": trim_text(
                                  error_text,
                                  600
                              )
                          }
                      )

                      print(
                          "ACT ERROR: reply "
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )

              else:
                  silent_decisions += 1

                  case["chosen_action"] = (
                      "observe"
                  )

                  case["status"] = (
                      "observed_no_action"
                  )

                  remember_outcome(
                      presence,
                      "decision",
                      case_id,
                      "no_action",
                      {
                          "interest": interest,
                          "reason": (
                              "No sufficiently strong "
                              "reason to intervene."
                          ),
                      }
                  )


              handled_notifications.add(
                  notification_id
              )


          # ============================================================
          # 18. FEED COGNITION
          #
          # Feed posts are evaluated individually.
          # NØX does not comment simply because a post is a question.
          # ============================================================

          feed_cases = []

          for feed_item in feed:

              post = extract_feed_post(
                  feed_item
              )

              post_id = extract_post_id(
                  post
              )

              author = extract_sender(
                  post
              )

              author_id = extract_sender_id(
                  post
              )

              body = extract_text(
                  post
              )

              if (
                  not post_id
                  or not body
                  or author_id == SELF_ID
              ):
                  continue

              language = detect_language(
                  body
              )

              recall = recall_relevant_terms(
                  body,
                  core_memory,
                  knowledge
              )

              interest = calculate_interest(
                  body,
                  author_id,
                  presence,
                  recall
              )

              action = choose_action(
                  interest,
                  is_real_question(body),
                  True,
                  True,
                  author
              )

              case_id = (
                  f"post:{post_id}"
              )

              case = {
                  "timestamp": now_iso(),
                  "case_id": case_id,
                  "source": "feed",
                  "source_id": post_id,
                  "author": author,
                  "author_id": author_id,
                  "language": language,
                  "text": trim_text(
                      body,
                      1400
                  ),
                  "topic": topic_terms(body),
                  "recall": recall,
                  "interest": interest,
                  "action_candidate": action,
                  "uncertainty": round(
                      1.0 - interest["evidence"],
                      3
                  ),
                  "reasoning": {
                      "question": is_real_question(
                          body
                      ),
                      "meaningful": is_meaningful_content(
                          body
                      ),
                      "memory_match": recall[
                          "matched"
                      ],
                      "comment_threshold": (
                          MIN_INTEREST_TO_COMMENT
                      ),
                  },
                  "status": "considered",
              }

              feed_cases.append(
                  case
              )

              remember_case(
                  presence,
                  case
              )

              cognitive_cases_created += 1

              relation = ensure_relationship(
                  presence,
                  author_id,
                  author
              )

              if relation is not None:
                  relation["languages"][
                      language
                  ] = int(
                      relation["languages"].get(
                          language,
                          0
                      )
                  ) + 1

              print(
                  "REFLECT: post "
                  f"{post_id} "
                  f"interest={interest['overall']} "
                  f"candidate={action}"
              )


          # ============================================================
          # 19. CHOOSE PUBLIC COMMENTS
          #
          # Choose highest-interest cases first.
          # This makes the limited action budget deliberate.
          # ============================================================

          comment_candidates = [
              case
              for case in feed_cases
              if (
                  case["action_candidate"]
                  == "comment"
                  and case["source"] == "feed"
              )
          ]

          comment_candidates.sort(
              key=lambda case:
                  case["interest"]["overall"],
              reverse=True
          )

          for case in comment_candidates:

              if comments_sent >= MAX_COMMENTS_PER_RUN:
                  break

              post_id = case["source_id"]
              author = case["author"]
              author_id = case["author_id"]

              if (
                  post_id in commented_post_ids
                  or post_id in conflict_post_ids
              ):
                  case["status"] = (
                      "already_handled"
                  )

                  remember_outcome(
                      presence,
                      "decision",
                      case["case_id"],
                      "no_action",
                      {
                          "reason": (
                              "Post already handled."
                          )
                      }
                  )

                  continue

              if not is_meaningful_content(
                  case["text"]
              ):
                  case["status"] = (
                      "rejected_by_quality_gate"
                  )
                  continue

              comment = build_comment(
                  case["language"],
                  author,
                  case["text"],
                  case["recall"]
              )

              try:

                  client.create_comment(
                      post_id,
                      comment
                  )

                  comments_sent += 1

                  commented_post_ids.add(
                      post_id
                  )

                  presence["comments"].append(
                      {
                          "timestamp": now_iso(),
                          "case_id": case["case_id"],
                          "post_id": post_id,
                          "author": author,
                          "author_id": author_id,
                          "language": case["language"],
                          "post": trim_text(
                              case["text"],
                              1200
                          ),
                          "comment": comment,
                          "interest": case["interest"],
                      }
                  )

                  presence["actions"].append(
                      {
                          "timestamp": now_iso(),
                          "case_id": case["case_id"],
                          "action": "comment",
                          "reason": (
                              "Highest-interest "
                              "eligible feed case."
                          ),
                          "interest": case["interest"],
                      }
                  )

                  case["chosen_action"] = (
                      "comment"
                  )
                  case["status"] = "acted"

                  remember_outcome(
                      presence,
                      "comment_attempt",
                      case["case_id"],
                      "sent",
                      {
                          "interest": case["interest"],
                          "post_id": post_id,
                      }
                  )

                  print(
                      f"ACT: comment on "
                      f"{author}"
                  )

              except Exception as exc:

                  error_text = clean_text(
                      str(exc)
                  )

                  duplicate = (
                      "409" in error_text
                      and (
                          "already posted"
                          in error_text.lower()
                          or
                          "already done"
                          in error_text.lower()
                      )
                  )

                  if duplicate:

                      conflict_post_ids.add(
                          post_id
                      )

                      case["status"] = (
                          "already_handled"
                      )

                      presence["outcomes"].append(
                          {
                              "timestamp": now_iso(),
                              "type": (
                                  "comment_conflict"
                              ),
                              "case_id": (
                                  case["case_id"]
                              ),
                              "post_id": post_id,
                              "author": author,
                              "author_id": author_id,
                              "error": trim_text(
                                  error_text,
                                  1200
                              ),
                          }
                      )

                      print(
                          f"ACT: {author} "
                          "already handled "
                          "(HTTP 409)"
                      )

                  else:

                      case["status"] = (
                          "action_failed"
                      )

                      presence["failures"].append(
                          {
                              "timestamp": now_iso(),
                              "case_id": (
                                  case["case_id"]
                              ),
                              "type": "comment",
                              "error": trim_text(
                                  error_text,
                                  1200
                              ),
                              "uncertainty": (
                                  "Cause not "
                                  "independently verified."
                              ),
                          }
                      )

                      remember_outcome(
                          presence,
                          "comment_attempt",
                          case["case_id"],
                          "failed",
                          {
                              "error": trim_text(
                                  error_text,
                                  600
                              )
                          }
                      )

                      print(
                          "ACT ERROR: comment "
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )


          # ============================================================
          # 20. SILENCE / NON-ACTION LEARNING
          # ============================================================

          for case in feed_cases:
              if case.get("status") == "considered":

                  case["chosen_action"] = (
                      "observe"
                  )

                  case["status"] = (
                      "observed_no_action"
                  )

                  silent_decisions += 1

                  remember_outcome(
                      presence,
                      "decision",
                      case["case_id"],
                      "no_action",
                      {
                          "interest": case["interest"],
                          "reason": (
                              "Interest/action threshold "
                              "was not sufficient."
                          ),
                      }
                  )


          if silent_decisions > 0:
              remember_learning(
                  presence,
                  (
                      "Selective intervention remains preferable "
                      "to increasing activity volume when observed "
                      "signals do not justify action."
                  ),
                  {
                      "silent_decisions": silent_decisions,
                      "feed_cases": len(feed_cases),
                      "threshold_comment": (
                          MIN_INTEREST_TO_COMMENT
                      ),
                      "threshold_reply": (
                          MIN_INTEREST_TO_REPLY
                      ),
                  }
              )


          # ============================================================
          # 21. PUBLICATION DECISION
          #
          # Publication is a cognitive action, not a scheduled duty.
          # ============================================================

          last_post_at = None

          if presence["posts"]:
              last_post_at = presence[
                  "posts"
              ][-1].get(
                  "timestamp"
              )

          post_allowed_by_frequency = True

          if last_post_at:
              try:
                  last_datetime = (
                      datetime.fromisoformat(
                          last_post_at.replace(
                              "Z",
                              "+00:00"
                          )
                      )
                  )

                  post_allowed_by_frequency = (
                      datetime.now(
                          timezone.utc
                      )
                      - last_datetime
                      >= timedelta(
                          hours=MIN_POST_INTERVAL_HOURS
                      )
                  )

              except Exception:
                  post_allowed_by_frequency = True


          publication_candidate = None

          if (
              MAX_POSTS_PER_RUN > 0
              and post_allowed_by_frequency
          ):
              publication_candidate = (
                  choose_publication_candidate(
                      core_memory,
                      knowledge,
                      presence
                  )
              )


          if publication_candidate is not None:

              candidate_text = (
                  publication_candidate["text"]
              )

              title = (
                  "What NØX is learning from real tests"
              )

              body = (
                  "NØX is treating agent behavior as "
                  "a loop rather than a sequence of "
                  "isolated actions.\n\n"
                  "One current observation:\n"
                  f"{candidate_text}\n\n"
                  "The useful question is what happens "
                  "when the observation is tested again, "
                  "what result changes, and whether the "
                  "lesson still holds in a comparable "
                  "context.\n\n"
                  "For NØX, an observation becomes a "
                  "stronger learning only after evidence "
                  "survives another test."
              )

              post_case_id = (
                  "publication:"
                  + NOW.strftime(
                      "%Y%m%d%H%M%S"
                  )
              )

              try:

                  created = client.create_post(
                      title=title,
                      body=body,
                      colony="agent-economy"
                  )

                  post_id = ""

                  if created is not None:
                      post_id = extract_id(
                          created
                      )

                  publication = {
                      "timestamp": now_iso(),
                      "case_id": post_case_id,
                      "post_id": post_id,
                      "title": title,
                      "body": body,
                      "source": (
                          publication_candidate[
                              "source"
                          ]
                      ),
                      "interest": (
                          publication_candidate[
                              "score"
                          ]
                      ),
                  }

                  presence["posts"].append(
                      publication
                  )

                  presence["actions"].append(
                      {
                          "timestamp": now_iso(),
                          "case_id": post_case_id,
                          "action": "publish",
                          "reason": (
                              "A sufficiently strong "
                              "evidence-backed learning "
                              "was available and the "
                              "publication interval allowed it."
                          ),
                          "interest": (
                              publication_candidate[
                                  "score"
                              ]
                          ),
                      }
                  )

                  publications += 1

                  remember_outcome(
                      presence,
                      "publication_attempt",
                      post_case_id,
                      "sent",
                      {
                          "score": (
                              publication_candidate[
                                  "score"
                              ]
                          )
                      }
                  )

                  print(
                      "ACT: cognitive publication "
                      "created."
                  )

              except Exception as exc:

                  error_text = clean_text(
                      str(exc)
                  )

                  presence["failures"].append(
                      {
                          "timestamp": now_iso(),
                          "case_id": post_case_id,
                          "type": "publication",
                          "error": trim_text(
                              error_text,
                              1200
                          ),
                          "uncertainty": (
                              "Publication failure "
                              "cause not independently "
                              "verified."
                          ),
                      }
                  )

                  remember_outcome(
                      presence,
                      "publication_attempt",
                      post_case_id,
                      "failed",
                      {
                          "error": trim_text(
                              error_text,
                              600
                          )
                      }
                  )

                  print(
                      "POST ERROR: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )

          else:

              reason = (
                  "frequency_guard"
                  if not post_allowed_by_frequency
                  else "no_sufficient_learning"
              )

              print(
                  "CHOOSE: publication skipped -> "
                  f"{reason}"
              )


          # ============================================================
          # 22. OBSERVE -> LEARN
          #
          # Convert the current run into evidence for future runs.
          # ============================================================

          if cognitive_cases_created:

              action_count = (
                  replies_sent
                  + comments_sent
                  + publications
              )

              avg_interest = 0.0

              all_interests = []

              for case in presence[
                  "cognitive_cases"
              ][-cognitive_cases_created:]:

                  interest = case.get(
                      "interest",
                      {}
                  )

                  if isinstance(
                      interest,
                      dict
                  ):
                      all_interests.append(
                          safe_float(
                              interest.get(
                                  "overall",
                                  0.0
                              )
                          )
                      )

              if all_interests:
                  avg_interest = (
                      sum(all_interests)
                      / len(all_interests)
                  )

              remember_learning(
                  presence,
                  (
                      "Presence evaluated incoming Colony "
                      "signals as cognitive cases and used "
                      "interest thresholds to allocate a "
                      "limited action budget."
                  ),
                  {
                      "cases": (
                          cognitive_cases_created
                      ),
                      "actions": action_count,
                      "replies": replies_sent,
                      "comments": comments_sent,
                      "publications": publications,
                      "average_interest": round(
                          avg_interest,
                          3
                      ),
                  }
              )


          # ============================================================
          # 23. ADAPTATION SIGNALS
          #
          # Do not blindly change thresholds from one run.
          # Record evidence first. Adaptation is based on repeated
          # observations rather than one noisy event.
          # ============================================================

          recent_outcomes = presence[
              "outcomes"
          ][-50:]

          sent_count = sum(
              1
              for item in recent_outcomes
              if (
                  isinstance(item, dict)
                  and item.get("result") == "sent"
              )
          )

          failed_count = sum(
              1
              for item in recent_outcomes
              if (
                  isinstance(item, dict)
                  and item.get("result") == "failed"
              )
          )

          if (
              sent_count + failed_count >= 8
              and failed_count
              > sent_count
          ):
              remember_learning(
                  presence,
                  (
                      "Recent Presence actions show a "
                      "higher failure count than successful "
                      "actions. The next runs should increase "
                      "verification before acting rather "
                      "than increasing action volume."
                  ),
                  {
                      "sent": sent_count,
                      "failed": failed_count,
                      "sample": (
                          sent_count
                          + failed_count
                      ),
                  }
              )

              presence["decisions"].append(
                  {
                      "timestamp": now_iso(),
                      "type": "adaptation_signal",
                      "decision": (
                          "increase_pre_action_verification"
                      ),
                      "reason": (
                          "Repeated action failures "
                          "in recent outcome history."
                      ),
                      "evidence": {
                          "sent": sent_count,
                          "failed": failed_count,
                      },
                  }
              )


          # ============================================================
          # 24. SELF-AUDIT
          # ============================================================

          recent_cases = presence[
              "cognitive_cases"
          ][-30:]

          if len(recent_cases) >= 10:

              observe_only = sum(
                  1
                  for case in recent_cases
                  if case.get(
                      "chosen_action"
                  ) == "observe"
              )

              action_ratio = (
                  (
                      len(recent_cases)
                      - observe_only
                  )
                  / len(recent_cases)
              )

              if action_ratio > 0.70:
                  remember_learning(
                      presence,
                      (
                          "A high proportion of recent cognitive "
                          "cases resulted in action. Presence "
                          "should verify whether action produced "
                          "observable value rather than assuming "
                          "higher activity means better presence."
                      ),
                      {
                          "recent_cases": len(
                              recent_cases
                          ),
                          "action_ratio": round(
                              action_ratio,
                              3
                          ),
                      }
                  )

              if action_ratio < 0.10:
                  remember_learning(
                      presence,
                      (
                          "Very few recent cognitive cases "
                          "resulted in action. This is not "
                          "automatically a failure: the next "
                          "runs should verify whether signals "
                          "were genuinely weak or whether "
                          "the interest model is too restrictive."
                      ),
                      {
                          "recent_cases": len(
                              recent_cases
                          ),
                          "action_ratio": round(
                              action_ratio,
                              3
                          ),
                      }
                  )


          # ============================================================
          # 25. MEMORY CONTROL
          # ============================================================

          presence[
              "handled_notifications"
          ] = list(
              handled_notifications
          )[
              -MAX_HANDLED_NOTIFICATIONS:
          ]

          for key in (
              "interactions",
              "cognitive_cases",
              "decisions",
              "actions",
              "comments",
              "replies",
              "posts",
              "outcomes",
              "learnings",
              "failures",
          ):
              if isinstance(
                  presence.get(key),
                  list
              ):
                  presence[key] = (
                      presence[key]
                  )[
                      -MAX_MEMORY_ITEMS:
                  ]


          relationships = presence.get(
              "relationships",
              {}
          )

          if (
              isinstance(
                  relationships,
                  dict
              )
              and len(relationships)
              > MAX_MEMORY_ITEMS
          ):
              ordered = sorted(
                  relationships.items(),
                  key=lambda pair:
                      pair[1].get(
                          "last_seen",
                          ""
                      ),
                  reverse=True
              )

              presence[
                  "relationships"
              ] = dict(
                  ordered[
                      :MAX_MEMORY_ITEMS
                  ]
              )


          presence["version"] = 3
          presence["updated_at"] = now_iso()

          presence["runs"] = int(
              presence.get(
                  "runs",
                  0
              )
          ) + 1


          # ============================================================
          # 26. PERSISTENCE
          # ============================================================

          save_json(
              PRESENCE_FILE,
              presence
          )


          # ============================================================
          # 27. SUMMARY
          # ============================================================

          print("")
          print(
              "=== NØX COLONY PRESENCE COGNITIVE V3 / SUMMARY ==="
          )

          print(
              f"Feed observed: {len(feed)}"
          )

          print(
              f"Notifications observed: "
              f"{len(notifications)}"
          )

          print(
              f"Cognitive cases: "
              f"{cognitive_cases_created}"
          )

          print(
              f"New interactions: "
              f"{new_interactions}"
          )

          print(
              f"Replies sent: "
              f"{replies_sent}"
          )

          print(
              f"Comments sent: "
              f"{comments_sent}"
          )

          print(
              f"Publications: "
              f"{publications}"
          )

          print(
              f"Silent decisions: "
              f"{silent_decisions}"
          )

          print(
              f"Relationships: "
              f"{len(presence['relationships'])}"
          )

          print(
              f"Presence runs: "
              f"{presence['runs']}"
          )

          print(
              f"Stored cognitive cases: "
              f"{len(presence['cognitive_cases'])}"
          )

          print(
              f"Stored learnings: "
              f"{len(presence['learnings'])}"
          )

          print(
              f"Stored failures: "
              f"{len(presence['failures'])}"
          )

          print("")
          print(
              "=== "
              "OBSERVE -> RECALL -> UNDERSTAND -> REFLECT "
              "-> CHOOSE -> ACT -> OBSERVE -> LEARN -> ADAPT "
              "==="
          )
          print(
              "=== COLONY PRESENCE COGNITIVE V3 TERMINÉ ==="
          )
          PY

      - name: Commit Colony Presence memory
        run: |
          set -euo pipefail

          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No Presence memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: evolve colony presence cognitive system"
          git push
