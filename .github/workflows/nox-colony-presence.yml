name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json

  MAX_ACTIONS_PER_RUN: "2"
  MAX_PUBLISH_PER_RUN: "1"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"

  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          NOW = datetime.now(timezone.utc).isoformat()

          RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          PRESENCE_FILE = Path(
              os.environ["PRESENCE_MEMORY_FILE"]
          )

          MAX_ACTIONS = int(
              os.environ["MAX_ACTIONS_PER_RUN"]
          )

          MAX_PUBLISH = int(
              os.environ["MAX_PUBLISH_PER_RUN"]
          )

          MAX_TRACKED = int(
              os.environ["MAX_TRACKED"]
          )

          MAX_RUNS = int(
              os.environ["MAX_RUNS"]
          )


          # ==========================================================
          # SECURITY
          # ==========================================================

          if (
              os.environ.get("AUTO_PAYMENT") != "false"
              or os.environ.get("AUTO_SPENDING") != "false"
          ):
              raise SystemExit(
                  "SECURITY STOP: payment/spending must remain disabled."
              )


          # ==========================================================
          # STORAGE
          # ==========================================================

          def clone(value):
              return json.loads(
                  json.dumps(value)
              )


          def load(path, default):
              if not path.exists():
                  return clone(default)

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return clone(default)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: "
                      f"{clean(exc, 500)}"
                  )
                  return clone(default)


          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()[:limit]


          def stable(*parts):
              raw = "|".join(
                  clean(part, 5000)
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def ensure_list(mapping, key):
              if not isinstance(
                  mapping.get(key),
                  list
              ):
                  mapping[key] = []

              return mapping[key]


          def append_bounded(
              mapping,
              key,
              value,
              limit
          ):
              values = ensure_list(
                  mapping,
                  key
              )

              values.append(value)

              if len(values) > limit:
                  del values[:-limit]


          # ==========================================================
          # DEFAULT PRESENCE STATE
          # ==========================================================

          DEFAULT_PRESENCE = {
              "version": 8,
              "runs": [],
              "outcomes": [],
              "executed_actions": [],
              "failures": []
          }

          runtime = load(
              RUNTIME_FILE,
              {
                  "version": 8,
                  "pending_actions": [],
                  "completed_action_ids": []
              }
          )

          presence = load(
              PRESENCE_FILE,
              DEFAULT_PRESENCE
          )

          for key in DEFAULT_PRESENCE:
              if key == "version":
                  continue

              ensure_list(
                  presence,
                  key
              )

          presence["version"] = 8

          ensure_list(
              runtime,
              "pending_actions"
          )

          ensure_list(
              runtime,
              "completed_action_ids"
          )


          # ==========================================================
          # COLONY CLIENT
          # ==========================================================

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(
              API_KEY
          )

          try:
              state = client.bootstrap()

          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )

          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: profil inattendu "
                  f"'{username}'."
              )


          # ==========================================================
          # PENDING ACTIONS
          #
          # IMPORTANT:
          # Presence NEVER creates its own action.
          # Core is the authority.
          # ==========================================================

          pending = [
              action
              for action in runtime.get(
                  "pending_actions",
                  []
              )
              if isinstance(action, dict)
          ]

          completed_ids = set(
              runtime.get(
                  "completed_action_ids",
                  []
              )
          )

          pending = [
              action
              for action in pending
              if action.get(
                  "action_id"
              )
              and action.get(
                  "action_id"
              ) not in completed_ids
          ]


          # ==========================================================
          # ACTION SELECTION
          # ==========================================================

          executable = []

          publish_count = 0

          for action in pending:

              kind = clean(
                  action.get("kind"),
                  100
              )

              if kind not in (
                  "reply",
                  "research_reply",
                  "publish",
                  "dm_reply"
              ):
                  continue

              if (
                  kind == "publish"
                  and publish_count >= MAX_PUBLISH
              ):
                  continue

              executable.append(
                  action
              )

              if kind == "publish":
                  publish_count += 1

              if len(executable) >= MAX_ACTIONS:
                  break


          # ==========================================================
          # RESPONSE FORMULATION
          #
          # Presence may formulate the authorized response,
          # but it cannot create or authorize an action.
          #
          # No external AI is used.
          # ==========================================================

          def detect_language(text):

              low = clean(
                  text,
                  5000
              ).lower()

              french = (
                  " le ",
                  " la ",
                  " les ",
                  " des ",
                  " une ",
                  " pour ",
                  " avec ",
                  " est ",
                  " que ",
                  " dans ",
                  " pas ",
                  " plus ",
                  " comment ",
                  " pourquoi "
              )

              english = (
                  " the ",
                  " this ",
                  " that ",
                  " with ",
                  " for ",
                  " is ",
                  " are ",
                  " what ",
                  " how ",
                  " why ",
                  " not ",
                  " more "
              )

              fr_score = sum(
                  low.count(
                      marker
                  )
                  for marker in french
              )

              en_score = sum(
                  low.count(
                      marker
                  )
                  for marker in english
              )

              if (
                  fr_score > en_score
                  and fr_score >= 2
              ):
                  return "fr"

              return "en"


          def extract_question(text):

              questions = re.findall(
                  r"[^.!?]{5,}\?",
                  clean(
                      text,
                      5000
                  )
              )

              if questions:
                  return clean(
                      questions[0],
                      700
                  )

              return ""


          def formulate_reply(action):

              original = clean(
                  action.get("body"),
                  5000
              )

              title = clean(
                  action.get("title"),
                  400
              )

              research = action.get(
                  "research_result"
              )

              language = detect_language(
                  f"{title} {original}"
              )

              # ------------------------------------------------------
              # Research-backed response
              # ------------------------------------------------------

              if isinstance(
                  research,
                  dict
              ):

                  status = clean(
                      research.get(
                          "evidence_status"
                      ),
                      100
                  )

                  conclusion = clean(
                      research.get(
                          "conclusion"
                      ),
                      1200
                  )

                  next_step = clean(
                      research.get(
                          "next_step"
                      ),
                      600
                  )

                  if conclusion:

                      if language == "fr":

                          result = (
                              "Le résultat disponible est "
                              f"{status or 'non établi'} : "
                              f"{conclusion}"
                          )

                          if next_step:
                              result += (
                                  " La prochaine vérification "
                                  f"utile serait : {next_step}"
                              )

                          return clean(
                              result,
                              1600
                          )

                      result = (
                          "The available result is "
                          f"{status or 'not established'}: "
                          f"{conclusion}"
                      )

                      if next_step:
                          result += (
                              " The next useful verification "
                              f"would be: {next_step}"
                          )

                      return clean(
                          result,
                          1600
                      )

              # ------------------------------------------------------
              # Question without research
              # ------------------------------------------------------

              question = extract_question(
                  original
              )

              if question:

                  if language == "fr":
                      return clean(
                          "Le point vérifiable à traiter est : "
                          f"« {question} ». "
                          "Avec les éléments actuellement disponibles, "
                          "je ne considérerais pas encore la conclusion "
                          "comme établie sans résultat reproductible.",
                          1500
                      )

                  return clean(
                      "The point that can be tested directly is: "
                      f"“{question}”. "
                      "With the currently available information, "
                      "I would not treat the conclusion as established "
                      "without a reproducible result.",
                      1500
                  )

              # ------------------------------------------------------
              # No research / no explicit question
              # ------------------------------------------------------

              if title:

                  if language == "fr":
                      return clean(
                          f"Le point central ici est : {title}. "
                          "La distinction utile est entre ce qui est "
                          "observé ou rapporté et ce qui est effectivement "
                          "démontré par un résultat vérifiable.",
                          1200
                      )

                  return clean(
                      f"The central point here is: {title}. "
                      "The useful distinction is between what is "
                      "observed or reported and what is actually "
                      "demonstrated by a verifiable result.",
                      1200
                  )

              if language == "fr":
                  return (
                      "Le point utile à vérifier est la distinction "
                      "entre l'observation et la conclusion."
                  )

              return (
                  "The useful point to verify is the distinction "
                  "between the observation and the conclusion."
              )


          # ==========================================================
          # EXECUTION
          # ==========================================================

          outcomes_created = []

          executed = 0
          skipped = 0
          errors = 0

          for action in executable:

              action_id = clean(
                  action.get("action_id"),
                  200
              )

              case_id = clean(
                  action.get("case_id"),
                  200
              )

              kind = clean(
                  action.get("kind"),
                  100
              )

              target_id = clean(
                  action.get("target_id"),
                  200
              )

              title = clean(
                  action.get("title"),
                  400
              )

              author = clean(
                  action.get("author"),
                  100
              )

              created_at = clean(
                  action.get("created_at"),
                  100
              )

              if not action_id:
                  continue

              outcome_id = stable(
                  "presence-outcome",
                  action_id
              )

              existing_outcome = any(
                  isinstance(item, dict)
                  and item.get("id")
                  == outcome_id
                  for item in presence[
                      "outcomes"
                  ]
              )

              if existing_outcome:
                  continue

              status = "skipped"
              result = {}
              error = None

              try:

                  # --------------------------------------------------
                  # PUBLIC REPLY
                  # --------------------------------------------------

                  if kind in (
                      "reply",
                      "research_reply"
                  ):

                      if not target_id:
                          raise ValueError(
                              "reply action has no target_id"
                          )

                      body = formulate_reply(
                          action
                      )

                      if not body:
                          raise ValueError(
                              "no safe response could be formulated"
                          )

                      response = client.create_comment(
                          target_id,
                          body
                      )

                      status = "executed"

                      result = {
                          "operation":
                              "create_comment",
                          "comment_id":
                              (
                                  response.get("id")
                                  if isinstance(
                                      response,
                                      dict
                                  )
                                  else None
                              ),
                          "target_id":
                              target_id
                      }

                  # --------------------------------------------------
                  # PUBLICATION
                  # --------------------------------------------------

                  elif kind == "publish":

                      body = clean(
                          action.get("body"),
                          2800
                      )

                      if not body:
                          raise ValueError(
                              "publish action has empty body"
                          )

                      if not title:
                          title = "NØX research finding"

                      response = client.create_post(
                          title=title,
                          body=body
                      )

                      status = "executed"

                      result = {
                          "operation":
                              "create_post",
                          "post_id":
                              (
                                  response.get("id")
                                  if isinstance(
                                      response,
                                      dict
                                  )
                                  else None
                              )
                      }

                  # --------------------------------------------------
                  # DIRECT MESSAGE
                  # --------------------------------------------------

                  elif kind == "dm_reply":

                      recipient = clean(
                          action.get(
                              "recipient"
                          )
                          or author,
                          100
                      )

                      if not recipient:
                          raise ValueError(
                              "dm_reply action has no recipient"
                          )

                      body = formulate_reply(
                          action
                      )

                      if not body:
                          raise ValueError(
                              "no safe DM response could be formulated"
                          )

                      response = client.send_message(
                          recipient,
                          body
                      )

                      status = "executed"

                      result = {
                          "operation":
                              "send_message",
                          "recipient":
                              recipient
                      }

                  else:

                      status = "skipped"

                      result = {
                          "reason":
                              "Unsupported action kind."
                      }

              except Exception as exc:

                  status = "error"

                  error = clean(
                      exc,
                      800
                  )

                  errors += 1

                  result = {
                      "error":
                          error
                  }


              if status == "executed":
                  executed += 1

              elif status == "skipped":
                  skipped += 1


              # ======================================================
              # OUTCOME
              # ======================================================

              outcome = {
                  "id":
                      outcome_id,
                  "timestamp":
                      NOW,
                  "action_id":
                      action_id,
                  "case_id":
                      case_id or None,
                  "kind":
                      kind,
                  "target_id":
                      target_id or None,
                  "status":
                      status,
                  "title":
                      title,
                  "author":
                      author,
                  "created_at":
                      created_at,
                  "result":
                      result
              }

              append_bounded(
                  presence,
                  "outcomes",
                  outcome,
                  MAX_TRACKED
              )

              append_bounded(
                  presence,
                  "executed_actions"
                  if status == "executed"
                  else "failures",
                  outcome,
                  MAX_TRACKED
              )

              outcomes_created.append(
                  outcome
              )

              # Core V7 expects completed_action_ids
              # to contain every resolved outcome.
              completed_ids.add(
                  action_id
              )


          # ==========================================================
          # REMOVE RESOLVED ACTIONS FROM RUNTIME
          #
          # Core also performs this housekeeping on its next cycle.
          # Doing it here prevents stale pending actions from being
          # re-executed during the next Presence cycle.
          # ==========================================================

          remaining_pending = []

          for action in runtime.get(
              "pending_actions",
              []
          ):

              if not isinstance(
                  action,
                  dict
              ):
                  continue

              action_id = action.get(
                  "action_id"
              )

              if action_id in completed_ids:
                  continue

              remaining_pending.append(
                  action
              )

          runtime[
              "pending_actions"
          ] = remaining_pending[-500:]


          runtime[
              "completed_action_ids"
          ] = list(
              dict.fromkeys(
                  list(completed_ids)
              )
          )[-1000:]


          # ==========================================================
          # RUN HISTORY
          # ==========================================================

          run_record = {
              "timestamp":
                  NOW,
              "pending_before":
                  len(pending),
              "selected":
                  len(executable),
              "executed":
                  executed,
              "skipped":
                  skipped,
              "errors":
                  errors,
              "outcomes":
                  len(outcomes_created)
          }

          append_bounded(
              presence,
              "runs",
              run_record,
              MAX_RUNS
          )


          # ==========================================================
          # SAVE
          # ==========================================================

          save(
              RUNTIME_FILE,
              runtime
          )

          save(
              PRESENCE_FILE,
              presence
          )


          # ==========================================================
          # REPORT
          # ==========================================================

          print(
              "=== NØX COLONY PRESENCE V8 ==="
          )

          print(
              f"Pending before={len(pending)} "
              f"Selected={len(executable)} "
              f"Executed={executed} "
              f"Skipped={skipped} "
              f"Errors={errors}"
          )

          print(
              f"Pending after="
              f"{len(runtime['pending_actions'])}"
          )

          print(
              "Architecture: "
              "CORE DECIDES -> PRESENCE EXECUTES "
              "-> CORE OBSERVES OUTCOME"
          )

          print(
              "External AI: disabled"
          )

          print(
              "Payments: disabled"
          )

          print(
              "Spending: disabled"
          )

          PY

      - name: Commit Presence state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_core_runtime.json \
            memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No Presence changes."
            exit 0
          fi

          git commit -m "NØX: execute authorized presence actions"

          git pull --rebase origin main

          git push
