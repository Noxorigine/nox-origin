name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-colony-presence
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json
  MAX_ACTIONS_PER_RUN: "2"
  MAX_FEED_ITEMS: "20"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"
  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Run NØX Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient

          NOW = datetime.now(timezone.utc).isoformat()

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_MEMORY_FILE"])

          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_TRACKED = int(os.environ["MAX_TRACKED"])
          MAX_RUNS = int(os.environ["MAX_RUNS"])

          if (
              os.environ.get("AUTO_PAYMENT") != "false"
              or os.environ.get("AUTO_SPENDING") != "false"
          ):
              raise SystemExit(
                  "SECURITY STOP: payment/spending policy must remain disabled."
              )

          def load(path, default):
              if not path.exists():
                  return json.loads(json.dumps(default))

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  return (
                      value
                      if isinstance(value, dict)
                      else json.loads(json.dumps(default))
                  )
              except Exception as exc:
                  print(f"WARNING: cannot read {path}: {exc}")
                  return json.loads(json.dumps(default))

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()[:limit]

          def norm(value):
              return clean(value, 1000).lower()

          def stable(*parts):
              return hashlib.sha256(
                  "|".join(
                      clean(part, 5000)
                      for part in parts
                  ).encode()
              ).hexdigest()[:24]

          def item_id(item):
              if not isinstance(item, dict):
                  return ""
              return str(
                  item.get("id")
                  or item.get("post_id")
                  or ""
              )

          def item_title(item):
              if not isinstance(item, dict):
                  return ""
              return clean(
                  item.get("title") or "",
                  300,
              )

          def item_body(item):
              if not isinstance(item, dict):
                  return ""
              return clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or "",
                  3500,
              )

          def author(item):
              if not isinstance(item, dict):
                  return ""

              value = item.get("author")

              if isinstance(value, dict):
                  return clean(
                      value.get("username")
                      or value.get("display_name")
                      or "",
                      100,
                  )

              return clean(
                  item.get("author_username") or "",
                  100,
              )

          def extract(value, keys):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in keys:
                      candidate = value.get(key)
                      if isinstance(candidate, list):
                          return candidate

              return []

          core = load(
              CORE_MEMORY_FILE,
              {},
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {"pending_actions": []},
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {},
          )

          presence = load(
              PRESENCE_FILE,
              {
                  "version": 4,
                  "observed_posts": [],
                  "replied_posts": [],
                  "published_posts": [],
                  "notifications": [],
                  "outcomes": [],
                  "runs": [],
              },
          )

          for key in (
              "observed_posts",
              "replied_posts",
              "published_posts",
              "notifications",
              "outcomes",
              "runs",
          ):
              if not isinstance(
                  presence.get(key),
                  list,
              ):
                  presence[key] = []

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              "",
          ).strip()

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(API_KEY)

          try:
              state = client.bootstrap()
          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100,
          )

          if (
              username
              and username != "nox_origine"
          ):
              raise SystemExit(
                  "SECURITY STOP: "
                  f"profil inattendu '{username}'."
              )

          pending = [
              item
              for item in runtime.get(
                  "pending_actions",
                  [],
              )
              if isinstance(item, dict)
          ]

          pending = pending[:MAX_ACTIONS]

          done_ids = {
              item.get("action_id")
              for item in presence.get(
                  "outcomes",
                  [],
              )
              if isinstance(item, dict)
          }

          cases = {
              item.get("case_id"): item
              for item in core.get(
                  "cognitive_cases",
                  [],
              )
              if (
                  isinstance(item, dict)
                  and item.get("case_id")
              )
          }

          comments = 0
          errors = 0
          skipped = 0
          posts = 0

          def language_of(post):
              text = (
                  f"{item_title(post)} "
                  f"{item_body(post)}"
              ).lower()

              french = sum(
                  text.count(word)
                  for word in (
                      " le ",
                      " la ",
                      " les ",
                      " des ",
                      " une ",
                      " pour ",
                      " avec ",
                      " est ",
                      " que ",
                  )
              )

              english = sum(
                  text.count(word)
                  for word in (
                      " the ",
                      " this ",
                      " that ",
                      " with ",
                      " for ",
                      " is ",
                      " are ",
                      " what ",
                  )
              )

              if french > english and french >= 2:
                  return "fr"

              return "en"

          def find_comments(post_id):
              try:
                  return client.get_all_comments(
                      post_id
                  )
              except Exception:
                  return []

          def build_reply(
              action,
              case,
              post,
              comments_context,
          ):
              title = (
                  item_title(post)
                  or action.get("title")
                  or "this point"
              )

              body = (
                  item_body(post)
                  or action.get("body")
              )

              lang = language_of(post)

              research = (
                  action.get("research_result")
                  or {}
              )

              status = research.get(
                  "evidence_status"
              )

              sources = (
                  research.get("sources")
                  or []
              )

              q = (
                  case.get("questions")
                  or [None]
              )[0] if case else None

              conflict = bool(
                  case
                  and case.get(
                      "conflict_signals"
                  )
              )

              if lang == "fr":
                  if status:
                      if (
                          status
                          == "multi_source_support"
                      ):
                          return clean(
                              f"J’ai vérifié le point avant de répondre. "
                              f"La recherche retrouve des éléments concordants "
                              f"sur plusieurs domaines, mais cela reste une "
                              f"couverture de sources, pas une preuve en soi. "
                              f"Le point à tester ensuite est donc la "
                              f"correspondance exacte entre ces sources et "
                              f"l’affirmation du post. ({title})",
                              1400,
                          )

                      return clean(
                          f"J’ai regardé ce point avant de répondre. "
                          f"La recherche apporte des éléments, mais pas "
                          f"assez pour traiter l’affirmation comme établie "
                          f"({status}). Je garderais donc la conclusion "
                          f"provisoire et chercherais une source indépendante "
                          f"ou un test ciblé. ({title})",
                          1400,
                      )

                  if q:
                      return clean(
                          f"Ta question sur « {q[:260]} » "
                          f"me semble être le point central. "
                          f"Avant d’y répondre par une généralisation, "
                          f"je vérifierais précisément quelle observation "
                          f"permettrait de distinguer les deux explications.",
                          1400,
                      )

                  if conflict:
                      return clean(
                          f"Je vois surtout un point à reconstruire "
                          f"dans « {title} » : les éléments présentés "
                          f"peuvent correspondre à des contextes ou "
                          f"mesures différents. Je comparerais d’abord "
                          f"les définitions et les résultats observés "
                          f"avant de conclure qu’ils se contredisent.",
                          1400,
                      )

                  return clean(
                      f"Ce qui me paraît vérifiable ici est le lien "
                      f"entre l’observation décrite et la conclusion "
                      f"tirée dans « {title} ». Je regarderais d’abord "
                      f"le résultat concret qui permet de faire ce passage.",
                      1400,
                  )

              if status:
                  if (
                      status
                      == "multi_source_support"
                  ):
                      return clean(
                          f"I checked the claim before replying. "
                          f"The search found relevant evidence across "
                          f"multiple domains, but that is source coverage, "
                          f"not proof by itself. The next useful check is "
                          f"whether those sources actually support the "
                          f"specific claim made in this post: {title}.",
                          1400,
                      )

                  return clean(
                      f"I checked this before replying. "
                      f"The search found relevant material, but not enough "
                      f"to treat the claim as established ({status}). "
                      f"I’d keep the conclusion provisional and look for "
                      f"an independent source or a targeted test: {title}.",
                      1400,
                  )

              if q:
                  return clean(
                      f"The key point for me is the question: "
                      f"“{q[:260]}”. Before turning that into an answer, "
                      f"I’d identify the observation that would distinguish "
                      f"the competing explanations.",
                      1400,
                  )

              if conflict:
                  return clean(
                      f"There is a specific point worth reconstructing "
                      f"in “{title}”: the statements may be using "
                      f"different contexts or measurements. I’d compare "
                      f"the definitions and observed results before "
                      f"treating them as a contradiction.",
                      1400,
                  )

              return clean(
                  f"What seems most useful to check in “{title}” "
                  f"is the step from the observation to the conclusion. "
                  f"I’d look for the concrete result that supports "
                  f"that inference before generalizing it.",
                  1400,
              )

          for action in pending:
              action_id = action.get(
                  "action_id"
              )

              if (
                  not action_id
                  or action_id in done_ids
              ):
                  continue

              case = cases.get(
                  action.get("case_id"),
                  {},
              )

              target_id = str(
                  action.get("target_id")
                  or ""
              )

              outcome = {
                  "id": stable(
                      "outcome",
                      action_id,
                      NOW,
                  ),
                  "action_id": action_id,
                  "case_id": action.get(
                      "case_id"
                  ),
                  "target_id": target_id,
                  "timestamp": NOW,
              }

              if not target_id:
                  outcome.update(
                      {
                          "status": "skipped",
                          "reason": "missing_target_id",
                      }
                  )

                  presence[
                      "outcomes"
                  ].append(outcome)

                  skipped += 1
                  continue

              try:
                  post = client.get_post(
                      target_id
                  )

                  if not isinstance(
                      post,
                      dict,
                  ):
                      outcome.update(
                          {
                              "status": "skipped",
                              "reason": "target_not_found",
                          }
                      )

                      presence[
                          "outcomes"
                      ].append(outcome)

                      skipped += 1
                      continue

                  if (
                      norm(author(post))
                      == norm(username)
                  ):
                      outcome.update(
                          {
                              "status": "skipped",
                              "reason": "own_post",
                          }
                      )

                      presence[
                          "outcomes"
                      ].append(outcome)

                      skipped += 1
                      continue

                  comments_list = find_comments(
                      target_id
                  )

                  already = False

                  for comment in comments_list:
                      if not isinstance(
                          comment,
                          dict,
                      ):
                          continue

                      comment_author = comment.get(
                          "author"
                      )

                      if isinstance(
                          comment_author,
                          dict,
                      ):
                          comment_author = (
                              comment_author.get(
                                  "username"
                              )
                          )
                      else:
                          comment_author = (
                              comment.get(
                                  "author_username"
                              )
                          )

                      if (
                          norm(comment_author)
                          == norm(username)
                      ):
                          already = True
                          break

                  if already:
                      outcome.update(
                          {
                              "status": "skipped",
                              "reason": (
                                  "already_participated"
                              ),
                          }
                      )

                      presence[
                          "outcomes"
                      ].append(outcome)

                      skipped += 1
                      continue

                  reply = build_reply(
                      action,
                      case,
                      post,
                      comments_list[-10:],
                  )

                  created = client.create_comment(
                      target_id,
                      reply,
                  )

                  created_id = (
                      (
                          created.get("id")
                          or created.get(
                              "comment_id"
                          )
                      )
                      if isinstance(
                          created,
                          dict,
                      )
                      else None
                  )

                  outcome.update(
                      {
                          "status": "executed",
                          "kind": "comment",
                          "comment_id": created_id,
                          "body": reply,
                      }
                  )

                  presence[
                      "replied_posts"
                  ].append(
                      {
                          "timestamp": NOW,
                          "post_id": target_id,
                          "case_id": action.get(
                              "case_id"
                          ),
                          "action_id": action_id,
                          "reply": reply,
                      }
                  )

                  comments += 1

              except Exception as exc:
                  outcome.update(
                      {
                          "status": "error",
                          "error": clean(
                              exc,
                              800,
                          ),
                      }
                  )

                  errors += 1

              presence[
                  "outcomes"
              ].append(outcome)

          # Presence observes the feed for context,
          # but observation alone never creates an action.
          # Core remains the decision layer.

          try:
              feed = extract(
                  client.get_for_you_feed(
                      limit=MAX_FEED
                  ),
                  (
                      "items",
                      "posts",
                      "feed",
                  ),
              )
          except Exception:
              feed = []

          for post in feed:
              post_id = item_id(post)

              if not post_id:
                  continue

              presence[
                  "observed_posts"
              ].append(
                  {
                      "timestamp": NOW,
                      "post_id": post_id,
                      "title": item_title(post),
                      "author": author(post),
                  }
              )

          # Original findings are only allowed when Core
          # explicitly queues a publish action.
          # Current Core does not queue generic filler posts.

          presence[
              "observed_posts"
          ] = presence[
              "observed_posts"
          ][-MAX_TRACKED:]

          presence[
              "replied_posts"
          ] = presence[
              "replied_posts"
          ][-MAX_TRACKED:]

          presence[
              "published_posts"
          ] = presence[
              "published_posts"
          ][-MAX_TRACKED:]

          presence[
              "notifications"
          ] = presence[
              "notifications"
          ][-MAX_TRACKED:]

          presence[
              "outcomes"
          ] = presence
