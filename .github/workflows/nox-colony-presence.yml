name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json

  MAX_ACTIONS_PER_RUN: "2"
  MAX_PUBLISH_PER_RUN: "1"
  MAX_FEED_ITEMS: "20"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"

  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

  GEMINI_MODEL: "gemini-3.8-flash"
  GEMINI_MAX_CALLS_PER_RUN: "2"
  GEMINI_MAX_OUTPUT_TOKENS: "500"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Install optional cognitive engine
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            pip install "google-genai>=1.0.0,<2.0.0"
            echo "Gemini cognitive formulation enabled."
          else
            echo "No GEMINI_API_KEY. Deterministic fallback enabled."
          fi

      - name: Run NØX Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          try:
              from colony_sdk import ColonyNotFoundError
          except ImportError:
              ColonyNotFoundError = None


          NOW = datetime.now(timezone.utc).isoformat()

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )

          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          PRESENCE_FILE = Path(
              os.environ["PRESENCE_MEMORY_FILE"]
          )

          MAX_ACTIONS = int(
              os.environ["MAX_ACTIONS_PER_RUN"]
          )

          MAX_PUBLISH = int(
              os.environ["MAX_PUBLISH_PER_RUN"]
          )

          MAX_FEED = int(
              os.environ["MAX_FEED_ITEMS"]
          )

          MAX_TRACKED = int(
              os.environ["MAX_TRACKED"]
          )

          MAX_RUNS = int(
              os.environ["MAX_RUNS"]
          )

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.8-flash"
          )

          GEMINI_MAX_CALLS = int(
              os.environ.get(
                  "GEMINI_MAX_CALLS_PER_RUN",
                  "2"
              )
          )

          GEMINI_MAX_OUTPUT = int(
              os.environ.get(
                  "GEMINI_MAX_OUTPUT_TOKENS",
                  "500"
              )
          )


          # ==========================================================
          # SECURITY
          # ==========================================================

          if (
              os.environ.get("AUTO_PAYMENT") != "false"
              or os.environ.get("AUTO_SPENDING") != "false"
          ):
              raise SystemExit(
                  "SECURITY STOP: payment/spending must remain disabled."
              )


          # ==========================================================
          # STORAGE
          # ==========================================================

          def clone(value):
              return json.loads(
                  json.dumps(value)
              )


          def load(path, default):
              if not path.exists():
                  return clone(default)

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return clone(default)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return clone(default)


          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()[:limit]


          def stable(*parts):
              raw = "|".join(
                  clean(part, 5000)
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or ""
              )


          def item_title(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("title") or "",
                  400
              )


          def item_body(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or "",
                  5000
              )


          def item_author(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return clean(
                      author.get("username")
                      or author.get("display_name")
                      or "",
                      100
                  )

              return clean(
                  item.get("author_username")
                  or item.get("username")
                  or "",
                  100
              )


          def extract(value, keys):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in keys:
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

              return []


          # ==========================================================
          # PRESENCE STATE
          # ==========================================================

          DEFAULT_PRESENCE = {
              "version": 8,
              "observed_posts": [],
              "replied_posts": [],
              "published_posts": [],
              "notifications": [],
              "outcomes": [],
              "runs": []
          }

          core = load(
              CORE_MEMORY_FILE,
              {}
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {
                  "pending_actions": []
              }
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          presence = load(
              PRESENCE_FILE,
              DEFAULT_PRESENCE
          )

          for key in DEFAULT_PRESENCE:
              if key == "version":
                  continue

              if not isinstance(
                  presence.get(key),
                  list
              ):
                  presence[key] = []

          presence["version"] = 8


          # ==========================================================
          # COLONY CLIENT
          # ==========================================================

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(
              API_KEY
          )

          try:
              state = client.bootstrap()

          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )

          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get("profile", {})
              if isinstance(state, dict)
              else {}
          )

          username = clean(
              profile.get("username"),
              100
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: profil inattendu "
                  f"'{username}'."
              )


          # ==========================================================
          # MEMORY
          # ==========================================================

          def memory_blob(value):
              try:
                  return clean(
                      json.dumps(
                          value,
                          ensure_ascii=False
                      ),
                      12000
                  ).lower()

              except Exception:
                  return clean(
                      value,
                      12000
                  ).lower()


          def recall(text, limit=6):
              words = set(
                  re.findall(
                      r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                      clean(
                          text,
                          5000
                      ).lower()
                  )
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "there",
                  "pour",
                  "avec",
                  "dans",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "plus",
                  "faire",
                  "être",
                  "sont"
              }

              words = {
                  word
                  for word in words
                  if word not in stop
              }

              scored = []

              for kind, values in core.items():

                  if (
                      kind == "version"
                      or not isinstance(values, list)
                  ):
                      continue

                  for value in values:
                      score = sum(
                          1
                          for word in words
                          if word in memory_blob(value)
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": value
                              }
                          )

              scored.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              return scored[:limit]


          # ==========================================================
          # LANGUAGE
          # ==========================================================

          def detect_language(text):
              low = clean(
                  text,
                  5000
              ).lower()

              french_markers = (
                  " le ",
                  " la ",
                  " les ",
                  " des ",
                  " une ",
                  " pour ",
                  " avec ",
                  " est ",
                  " que ",
                  " dans ",
                  " pas ",
                  " plus ",
                  " comment ",
                  " pourquoi "
              )

              english_markers = (
                  " the ",
                  " this ",
                  " that ",
                  " with ",
                  " for ",
                  " is ",
                  " are ",
                  " what ",
                  " how ",
                  " why ",
                  " not ",
                  " more "
              )

              fr = sum(
                  low.count(x)
                  for x in french_markers
              )

              en = sum(
                  low.count(x)
                  for x in english_markers
              )

              if fr > en and fr >= 2:
                  return "fr"

              return "en"


          # ==========================================================
          # PUBLIC THREAD HELPERS
          # ==========================================================

          def get_comments(post_id):
              try:
                  comments = client.get_all_comments(
                      post_id
                  )

                  if not isinstance(
                      comments,
                      list
                  ):
                      return []

                  return comments[-12:]

              except Exception as exc:
                  print(
                      "WARNING: comments unavailable: "
                      f"{clean(exc, 500)}"
                  )
                  return []


          def comment_author(comment):
              if not isinstance(comment, dict):
                  return ""

              author = comment.get("author")

              if isinstance(author, dict):
                  return clean(
                      author.get("username")
                      or author.get("display_name")
                      or "",
                      100
                  )

              return clean(
                  comment.get("author_username")
                  or "",
                  100
              )


          def comment_body(comment):
              if not isinstance(comment, dict):
                  return ""

              return clean(
                  comment.get("body")
                  or comment.get("content")
                  or comment.get("text")
                  or "",
                  2000
              )


          # ==========================================================
          # GEMINI
          # ==========================================================

          gemini_calls = 0


          def gemini_reply(
              post,
              comments,
              case,
              research,
              memories
          ):
              global gemini_calls

              if (
                  not GEMINI_KEY
                  or gemini_calls >= GEMINI_MAX_CALLS
              ):
                  return None

              try:
                  from google import genai
                  from google.genai import types

                  gemini_calls += 1

                  ai_client = genai.Client(
                      api_key=GEMINI_KEY
                  )

                  language = detect_language(
                      f"{item_title(post)} "
                      f"{item_body(post)}"
                  )

                  comments_text = "\n".join(
                      f"- {comment_author(c)}: "
                      f"{comment_body(c)}"
                      for c in comments[-8:]
                      if comment_body(c)
                  )

                  memory_text = json.dumps(
                      memories[:4],
                      ensure_ascii=False
                  )[:5000]

                  research_text = json.dumps(
                      research,
                      ensure_ascii=False
                  )[:6000]

                  case_text = json.dumps(
                      {
                          "intent": case.get("intent"),
                          "decision": case.get("decision"),
                          "reason": case.get(
                              "decision_reason"
                          ),
                          "questions": case.get(
                              "questions",
                              []
                          ),
                          "uncertainties": case.get(
                              "uncertainties",
                              []
                          )
                      },
                      ensure_ascii=False
                  )

                  system_instruction = """
          You are the cognitive response layer of NØX.

          Core has already decided that NØX should respond.
          You only formulate the response.

          Rules:
          - Address the concrete content.
          - Do not invent facts.
          - Do not claim verification without supporting research.
          - Distinguish observation, reported information,
            research, hypothesis and uncertainty.
          - Use memory only when genuinely relevant.
          - Answer a direct question when evidence permits.
          - If evidence is insufficient, identify what remains unverified.
          - If there is a contradiction, identify the concrete contradiction.
          - Prefer one precise point over generic commentary.
          - Never use generic openings such as:
            "Interesting", "Great post", "This caught my attention",
            "I agree", "I think", or
            "I'm taking the specific claim..."
          - Do not quote large sections of the post.
          - Do not mention internal workflows, Core, Work Factory,
            Gemini or implementation details.
          - Preserve the language of the post.
          - Keep the answer approximately 40-180 words.
          - Output only the final response.
          """

                  prompt = f"""
          LANGUAGE:
          {language}

          POST TITLE:
          {item_title(post)}

          POST BODY:
          {item_body(post)}

          RECENT THREAD:
          {comments_text or "(no comments)"}

          COGNITIVE CASE:
          {case_text}

          RESEARCH RESULT:
          {research_text or "(no external research)"}

          RELEVANT MEMORY:
          {memory_text or "(no relevant memory)"}

          Formulate one concrete response.
          """

                  response = ai_client.models.generate_content(
                      model=GEMINI_MODEL,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          system_instruction=system_instruction,
                          max_output_tokens=GEMINI_MAX_OUTPUT
                      )
                  )

                  text = clean(
                      getattr(
                          response,
                          "text",
                          ""
                      ),
                      1800
                  )

                  if (
                      not text
                      or len(text) < 20
                  ):
                      return None

                  return text

              except Exception as exc:
                  print(
                      "WARNING: Gemini formulation failed: "
                      f"{clean(exc, 500)}"
                  )
                  return None


          # ==========================================================
          # DETERMINISTIC FALLBACK
          # ==========================================================

          def fallback_reply(
              post,
              case,
              research,
              memories
          ):
              body = item_body(post)

              language = detect_language(
                  body
              )

              questions = case.get(
                  "questions",
                  []
              )

              if isinstance(
                  research,
                  dict
              ):
                  status = clean(
                      research.get(
                          "evidence_status"
                      ),
                      100
                  )

                  conclusion = clean(
                      research.get(
                          "conclusion"
                      ),
                      700
                  )

                  next_step = clean(
                      research.get(
                          "next_step"
                      ),
                      500
                  )

                  if conclusion:

                      if language == "fr":
                          result = (
                              f"Le résultat disponible est "
                              f"{status or 'non établi'} : "
                              f"{conclusion}"
                          )

                          if next_step:
                              result += (
                                  f" La prochaine vérification utile "
                                  f"serait : {next_step}"
                              )

                          return clean(
                              result,
                              1500
                          )

                      result = (
                          f"The available result is "
                          f"{status or 'not established'}: "
                          f"{conclusion}"
                      )

                      if next_step:
                          result += (
                              f" The next useful verification would be: "
                              f"{next_step}"
                          )

                      return clean(
                          result,
                          1500
                      )

              if questions:
                  question = clean(
                      questions[0],
                      500
                  )

                  if language == "fr":
                      return clean(
                          f"Le point à traiter directement est : "
                          f"« {question} ». Avec les éléments disponibles, "
                          f"il manque encore un résultat vérifiable pour "
                          f"distinguer les explications possibles.",
                          1400
                      )

                  return clean(
                      f"The point that needs a direct answer is: "
                      f"“{question}”. With the available evidence, "
                      f"a reproducible result is still needed to "
                      f"distinguish the possible explanations.",
                      1400
                  )

              if memories:
                  memory = memories[0].get(
                      "item",
                      {}
                  )

                  if isinstance(memory, dict):
                      memory_summary = clean(
                          memory.get("summary")
                          or memory.get("content")
                          or memory.get("text")
                          or "",
                          500
                      )
                  else:
                      memory_summary = clean(
                          memory,
                          500
                      )

                  if memory_summary:
                      if language == "fr":
                          return clean(
                              f"Il existe un précédent pertinent "
                              f"dans ce que j'ai déjà observé : "
                              f"{memory_summary} "
                              f"Le point à vérifier est toutefois "
                              f"ce qui diffère entre les deux situations.",
                              1400
                          )

                      return clean(
                          f"There is a relevant precedent in what I "
                          f"have observed before: {memory_summary} "
                          f"The important check is what differs between "
                          f"the two situations.",
                          1400
                      )

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  body
              )

              concrete = clean(
                  sentences[0] if sentences else body,
                  500
              )

              if not concrete:
                  concrete = clean(
                      item_title(post),
                      300
                  )

              if language == "fr":
                  return
