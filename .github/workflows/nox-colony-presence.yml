name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json

  MAX_ACTIONS_PER_RUN: "2"
  MAX_FEED_ITEMS: "20"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  presence:
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Execute Presence
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          import sys
          import uuid
          from datetime import datetime, timezone

          from colony_sdk import ColonyClient


          # ============================================================
          # CONFIG
          # ============================================================

          CORE_MEMORY_FILE = os.environ["CORE_MEMORY_FILE"]
          CORE_RUNTIME_FILE = os.environ["CORE_RUNTIME_FILE"]
          KNOWLEDGE_FILE = os.environ["KNOWLEDGE_FILE"]
          PRESENCE_MEMORY_FILE = os.environ["PRESENCE_MEMORY_FILE"]

          MAX_ACTIONS_PER_RUN = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_TRACKED = int(os.environ["MAX_TRACKED"])
          MAX_RUNS = int(os.environ["MAX_RUNS"])

          PROJECT_COST_EUR = os.environ["PROJECT_COST_EUR"]
          GEMINI_USED = os.environ["GEMINI_USED"]
          EXTERNAL_AI_USED = os.environ["EXTERNAL_AI_USED"]
          AUTO_PAYMENT = os.environ["AUTO_PAYMENT"]
          AUTO_SPENDING = os.environ["AUTO_SPENDING"]

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          NOW = datetime.now(timezone.utc)
          RUN_ID = "presence-" + NOW.strftime("%Y%m%dT%H%M%SZ")


          # ============================================================
          # HELPERS
          # ============================================================

          def load(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      value = json.load(fh)

                  return value

              except Exception as exc:
                  print(f"WARNING: cannot load {path}: {exc}")
                  return default


          def save(path, value):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(directory, exist_ok=True)

              temporary = path + ".tmp"

              with open(temporary, "w", encoding="utf-8") as fh:
                  json.dump(
                      value,
                      fh,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  fh.write("\n")

              os.replace(temporary, path)


          def as_dict(value):
              return value if isinstance(value, dict) else {}


          def as_list(value):
              return value if isinstance(value, list) else []


          def text(value):
              if value is None:
                  return ""

              return str(value).strip()


          def first_nonempty(mapping, keys):
              for key in keys:
                  value = mapping.get(key)

                  if value is None:
                      continue

                  if isinstance(value, str):
                      value = value.strip()

                  if value != "":
                      return value

              return None


          def make_id(prefix):
              return f"{prefix}-{uuid.uuid4().hex[:22]}"


          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )


          def clip(value, maximum):
              value = text(value)

              if len(value) <= maximum:
                  return value

              return value[: maximum - 1].rstrip() + "…"


          # ============================================================
          # POLICY
          # ============================================================

          if PROJECT_COST_EUR != "0":
              raise RuntimeError("Unsafe policy: PROJECT_COST_EUR must be 0")

          if GEMINI_USED.lower() != "false":
              raise RuntimeError("Unsafe policy: GEMINI_USED must be false")

          if EXTERNAL_AI_USED.lower() != "false":
              raise RuntimeError("Unsafe policy: EXTERNAL_AI_USED must be false")

          if AUTO_PAYMENT.lower() != "false":
              raise RuntimeError("Unsafe policy: AUTO_PAYMENT must be false")

          if AUTO_SPENDING.lower() != "false":
              raise RuntimeError("Unsafe policy: AUTO_SPENDING must be false")


          # ============================================================
          # LOAD STATE
          # ============================================================

          runtime = as_dict(load(CORE_RUNTIME_FILE, {}))
          memory = as_dict(load(CORE_MEMORY_FILE, {}))
          knowledge = as_dict(load(KNOWLEDGE_FILE, {}))
          presence = as_dict(load(PRESENCE_MEMORY_FILE, {}))

          runtime.setdefault("pending_actions", [])
          runtime.setdefault("actions", [])
          runtime.setdefault("decisions", [])
          runtime.setdefault("presence_outcomes", [])
          runtime.setdefault("work_requests", [])

          memory.setdefault("actions", [])
          memory.setdefault("observations", [])
          memory.setdefault("experiences", [])
          memory.setdefault("learnings", [])

          presence.setdefault("actions", [])
          presence.setdefault("outcomes", [])
          presence.setdefault("errors", [])
          presence.setdefault("tracked_targets", [])
          presence.setdefault("runs", [])


          # ============================================================
          # ACTION NORMALIZATION
          # ============================================================

          def normalize_action(raw):
              """
              Normalize all action schemas emitted by Core/runtime.

              Supported action type fields:
                type
                action_type
                kind
                action

              Supported target fields:
                target_id
                post_id
                parent_id
                conversation_id
                recipient
                username
                target
              """

              if not isinstance(raw, dict):
                  return None

              action_id = first_nonempty(
                  raw,
                  [
                      "id",
                      "action_id",
                      "actionId",
                  ],
              )

              action_type = first_nonempty(
                  raw,
                  [
                      "type",
                      "action_type",
                      "kind",
                      "action",
                      "actionType",
                  ],
              )

              action_type = text(action_type).lower().replace("-", "_").replace(" ", "_")

              aliases = {
                  "dm": "dm_reply",
                  "message": "dm_reply",
                  "send_message": "dm_reply",
                  "direct_message": "dm_reply",
                  "reply_dm": "dm_reply",

                  "comment": "reply",
                  "create_comment": "reply",
                  "reply_post": "reply",
                  "research_reply": "reply",

                  "create_post": "publish",
                  "post": "publish",
                  "new_post": "publish",
              }

              action_type = aliases.get(action_type, action_type)

              target_id = first_nonempty(
                  raw,
                  [
                      "target_id",
                      "post_id",
                      "target",
                      "targetId",
                  ],
              )

              parent_id = first_nonempty(
                  raw,
                  [
                      "parent_id",
                      "comment_id",
                      "parentId",
                  ],
              )

              recipient = first_nonempty(
                  raw,
                  [
                      "recipient",
                      "username",
                      "recipient_username",
                      "recipientUsername",
                      "conversation_id",
                      "conversation",
                  ],
              )

              body = first_nonempty(
                  raw,
                  [
                      "body",
                      "reply_text",
                      "message",
                      "content",
                      "text",
                  ],
              )

              title = first_nonempty(
                  raw,
                  [
                      "title",
                      "post_title",
                  ],
              )

              colony = first_nonempty(
                  raw,
                  [
                      "colony",
                      "colony_name",
                  ],
              )

              normalized = {
                  "id": text(action_id) if action_id else make_id("action"),
                  "type": action_type,
                  "target_id": text(target_id) if target_id else None,
                  "parent_id": text(parent_id) if parent_id else None,
                  "recipient": text(recipient) if recipient else None,
                  "body": text(body) if body else "",
                  "title": text(title) if title else "",
                  "colony": text(colony) if colony else None,
                  "attempts": int(raw.get("attempts", 0) or 0),
                  "created_at": raw.get("created_at") or now_iso(),
                  "source": raw.get("source") or "core",
                  "original": raw,
              }

              return normalized


          def action_key(action):
              return (
                  text(action.get("id"))
                  or "|".join(
                      [
                          text(action.get("type")),
                          text(action.get("target_id")),
                          text(action.get("recipient")),
                          text(action.get("body")),
                      ]
                  )
              )


          # ============================================================
          # COLLECT PENDING ACTIONS
          # ============================================================

          raw_pending = as_list(runtime.get("pending_actions"))

          normalized_pending = []

          for raw in raw_pending:
              action = normalize_action(raw)

              if action is not None:
                  normalized_pending.append(action)


          # Also accept actions that Core may have stored in runtime["actions"]
          # but which have not yet been copied to pending_actions.
          existing_keys = {
              action_key(action)
              for action in normalized_pending
          }

          for raw in as_list(runtime.get("actions")):
              action = normalize_action(raw)

              if action is None:
                  continue

              key = action_key(action)

              if key not in existing_keys:
                  status = text(
                      raw.get("status")
                      if isinstance(raw, dict)
                      else ""
                  ).lower()

                  if status not in {
                      "executed",
                      "success",
                      "completed",
                      "blocked",
                  }:
                      normalized_pending.append(action)
                      existing_keys.add(key)


          print("=== NØX PRESENCE ===")
          print(f"Run: {RUN_ID}")
          print(f"Pending actions: {len(normalized_pending)}")


          # ============================================================
          # CLIENT
          # ============================================================

          client = ColonyClient(API_KEY)

          print("ColonyClient initialized.")

          bootstrap = client.bootstrap()

          print("Bootstrap: OK")


          # ============================================================
          # SDK CAPABILITY CHECK
          # ============================================================

          required_methods = [
              "create_comment",
              "create_post",
              "send_message",
              "get_post",
              "get_for_you_feed",
          ]

          missing = [
              name
              for name in required_methods
              if not hasattr(client, name)
          ]

          if missing:
              raise RuntimeError(
                  "Missing required SDK capabilities: "
                  + ", ".join(missing)
              )

          print("SDK capabilities: OK")


          # ============================================================
          # ACTION SELECTION
          # ============================================================

          selected = normalized_pending[:MAX_ACTIONS_PER_RUN]

          print(f"Selected actions: {len(selected)}")


          # ============================================================
          # SAFETY CLASSIFICATION
          # ============================================================

          FINANCIAL_TYPES = {
              "pay",
              "payment",
              "send_payment",
              "send_sats",
              "invoice",
              "withdraw",
              "withdrawal",
              "bid",
              "place_bid",
              "purchase",
              "buy",
              "spend",
              "transfer",
              "tip",
              "lightning_payment",
              "ln_payment",
          }

          PUBLIC_TYPES = {
              "reply",
              "publish",
          }

          DM_TYPES = {
              "dm_reply",
          }


          # ============================================================
          # RESULT CONTAINERS
          # ============================================================

          outcomes = []
          executed_keys = set()
          failed_keys = set()

          success_count = 0
          failed_count = 0
          blocked_count = 0
          retry_count = 0


          # ============================================================
          # EXECUTION
          # ============================================================

          for action in selected:

              action_id = action["id"]
              action_type = action["type"]
              target_id = action.get("target_id")
              parent_id = action.get("parent_id")
              recipient = action.get("recipient")
              body = action.get("body")
              title = action.get("title")
              colony = action.get("colony")

              print()
              print(f"=== ACTION {action_id} ===")
              print(f"Type: {action_type}")
              print(f"Target: {target_id or recipient or ''}")


              # --------------------------------------------------------
              # UNKNOWN TYPE
              # --------------------------------------------------------

              if not action_type:
                  print("ACTION BLOCKED: missing action type")

                  blocked_count += 1
                  failed_keys.add(action_key(action))

                  outcomes.append(
                      {
                          "id": make_id("outcome"),
                          "action_id": action_id,
                          "run_id": RUN_ID,
                          "type": "blocked",
                          "success": False,
                          "status": "blocked",
                          "reason": "missing_action_type",
                          "timestamp": now_iso(),
                      }
                  )

                  continue


              # --------------------------------------------------------
              # FINANCIAL SAFETY BLOCK
              # --------------------------------------------------------

              if action_type in FINANCIAL_TYPES:
                  print(
                      f"BLOCKED FINANCIAL ACTION: {action_type}"
                  )

                  blocked_count += 1
                  failed_keys.add(action_key(action))

                  outcomes.append(
                      {
                          "id": make_id("outcome"),
                          "action_id": action_id,
                          "run_id": RUN_ID,
                          "type": "blocked",
                          "success": False,
                          "status": "blocked",
                          "reason": "financial_action_forbidden",
                          "action_type": action_type,
                          "timestamp": now_iso(),
                      }
                  )

                  continue


              # --------------------------------------------------------
              # BODY VALIDATION
              # --------------------------------------------------------

              if action_type in PUBLIC_TYPES or action_type in DM_TYPES:
                  if not body:
                      print("ACTION BLOCKED: missing body")

                      blocked_count += 1
                      failed_keys.add(action_key(action))

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "blocked",
                              "success": False,
                              "status": "blocked",
                              "reason": "missing_body",
                              "action_type": action_type,
                              "timestamp": now_iso(),
                          }
                      )

                      continue


              # --------------------------------------------------------
              # DM
              # --------------------------------------------------------

              if action_type in DM_TYPES:

                  if not recipient:
                      print("ACTION FAILED: missing recipient")

                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "reason": "missing_recipient",
                              "action_type": action_type,
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                      continue

                  try:
                      result = client.send_message(
                          recipient,
                          body,
                      )

                      success_count += 1
                      executed_keys.add(action_key(action))

                      print("SUCCESS: DM sent")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "success",
                              "success": True,
                              "status": "executed",
                              "action_type": action_type,
                              "recipient": recipient,
                              "body": clip(body, 500),
                              "result": result,
                              "timestamp": now_iso(),
                          }
                      )

                  except Exception as exc:
                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      print(f"FAILED DM: {exc}")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "action_type": action_type,
                              "recipient": recipient,
                              "error": clip(exc, 1000),
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                  continue


              # --------------------------------------------------------
              # PUBLIC REPLY
              # --------------------------------------------------------

              if action_type == "reply":

                  if not target_id:
                      print("ACTION FAILED: reply has no target post")

                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "reason": "missing_post_target",
                              "action_type": action_type,
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                      continue

                  try:
                      # Verify the target post exists before commenting.
                      post = client.get_post(target_id)

                      if not post:
                          raise RuntimeError(
                              f"target post not found: {target_id}"
                          )

                      if parent_id:
                          result = client.create_comment(
                              target_id,
                              body,
                              parent_id=parent_id,
                          )
                      else:
                          result = client.create_comment(
                              target_id,
                              body,
                          )

                      success_count += 1
                      executed_keys.add(action_key(action))

                      print("SUCCESS: comment created")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "success",
                              "success": True,
                              "status": "executed",
                              "action_type": action_type,
                              "target_id": target_id,
                              "parent_id": parent_id,
                              "body": clip(body, 500),
                              "result": result,
                              "timestamp": now_iso(),
                          }
                      )

                  except Exception as exc:
                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      print(f"FAILED REPLY: {exc}")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "action_type": action_type,
                              "target_id": target_id,
                              "error": clip(exc, 1000),
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                  continue


              # --------------------------------------------------------
              # PUBLIC POST
              # --------------------------------------------------------

              if action_type == "publish":

                  if not body:
                      print("ACTION FAILED: publish has no body")

                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "reason": "missing_body",
                              "action_type": action_type,
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                      continue

                  if not title:
                      title = "NØX observation"

                  try:
                      kwargs = {
                          "title": title,
                          "body": body,
                      }

                      if colony:
                          kwargs["colony"] = colony

                      result = client.create_post(**kwargs)

                      success_count += 1
                      executed_keys.add(action_key(action))

                      print("SUCCESS: post created")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "success",
                              "success": True,
                              "status": "executed",
                              "action_type": action_type,
                              "title": clip(title, 300),
                              "body": clip(body, 700),
                              "colony": colony,
                              "result": result,
                              "timestamp": now_iso(),
                          }
                      )

                  except Exception as exc:
                      failed_count += 1
                      retry_count += 1
                      failed_keys.add(action_key(action))

                      print(f"FAILED POST: {exc}")

                      outcomes.append(
                          {
                              "id": make_id("outcome"),
                              "action_id": action_id,
                              "run_id": RUN_ID,
                              "type": "retry",
                              "success": False,
                              "status": "retry",
                              "action_type": action_type,
                              "error": clip(exc, 1000),
                              "attempts": action["attempts"] + 1,
                              "timestamp": now_iso(),
                          }
                      )

                  continue


              # --------------------------------------------------------
              # UNKNOWN TYPE
              # --------------------------------------------------------

              print(f"UNKNOWN ACTION TYPE: {action_type}")

              failed_count += 1
              retry_count += 1
              failed_keys.add(action_key(action))

              outcomes.append(
                  {
                      "id": make_id("outcome"),
                      "action_id": action_id,
                      "run_id": RUN_ID,
                      "type": "retry",
                      "success": False,
                      "status": "retry",
                      "reason": "unknown_action_type",
                      "action_type": action_type,
                      "attempts": action["attempts"] + 1,
                      "timestamp": now_iso(),
                  }
              )


          # ============================================================
          # REBUILD PENDING ACTIONS
          # ============================================================

          remaining_pending = []

          for action in normalized_pending:

              key = action_key(action)

              if key in executed_keys:
                  continue

              if key in failed_keys:
                  action["attempts"] = int(action.get("attempts", 0)) + 1
                  action["last_attempt_at"] = now_iso()

              remaining_pending.append(action)


          # Keep pending actions bounded.
          # Oldest retryable actions remain first.
          remaining_pending = remaining_pending[:500]


          # ============================================================
          # UPDATE RUNTIME
          # ============================================================

          runtime["pending_actions"] = remaining_pending

          runtime["presence_outcomes"] = (
              as_list(runtime.get("presence_outcomes"))
              + outcomes
          )

          runtime["last_presence_run"] = RUN_ID
          runtime["last_presence_at"] = now_iso()


          # Keep runtime outcomes bounded.
          runtime["presence_outcomes"] = (
              runtime["presence_outcomes"][-500:]
          )


          # ============================================================
          # UPDATE MEMORY ACTIONS
          # ============================================================

          for outcome in outcomes:

              memory["actions"].append(
                  {
                      "id": make_id("memory-action"),
                      "action_id": outcome.get("action_id"),
                      "run_id": RUN_ID,
                      "type": outcome.get("action_type")
                      or outcome.get("type"),
                      "status": outcome.get("status"),
                      "success": bool(outcome.get("success")),
                      "target_id": outcome.get("target_id"),
                      "recipient": outcome.get("recipient"),
                      "timestamp": outcome.get("timestamp"),
                  }
              )


          memory["actions"] = memory["actions"][-500:]


          # ============================================================
          # PRESENCE MEMORY
          # ============================================================

          presence["actions"].extend(
              [
                  {
                      "action_id": outcome.get("action_id"),
                      "run_id": RUN_ID,
                      "action_type": outcome.get("action_type"),
                      "status": outcome.get("status"),
                      "success": outcome.get("success"),
                      "target_id": outcome.get("target_id"),
                      "recipient": outcome.get("recipient"),
                      "timestamp": outcome.get("timestamp"),
                  }
                  for outcome in outcomes
              ]
          )

          presence["outcomes"].extend(outcomes)


          # Record errors separately.
          for outcome in outcomes:
              if not outcome.get("success"):
                  presence["errors"].append(
                      {
                          "id": make_id("error"),
                          "run_id": RUN_ID,
                          "action_id": outcome.get("action_id"),
                          "reason": outcome.get("reason"),
                          "error": outcome.get("error"),
                          "status": outcome.get("status"),
                          "timestamp": outcome.get("timestamp"),
                      }
                  )


          # ============================================================
          # OBSERVE FEED AFTER ACTIONS
          # ============================================================

          observed_feed = []

          try:
              feed_result = client.get_for_you_feed(
                  limit=MAX_FEED_ITEMS
              )

              if isinstance(feed_result, dict):
                  observed_feed = (
                      feed_result.get("items")
                      or feed_result.get("posts")
                      or feed_result.get("feed")
                      or []
                  )

              elif isinstance(feed_result, list):
                  observed_feed = feed_result

          except Exception as exc:
              print(f"WARNING: post-action feed observation failed: {exc}")


          for item in as_list(observed_feed):

              if not isinstance(item, dict):
                  continue

              item_id = first_nonempty(
                  item,
                  [
                      "id",
                      "post_id",
                  ],
              )

              if not item_id:
                  continue

              presence["tracked_targets"].append(
                  {
                      "id": text(item_id),
                      "observed_at": now_iso(),
                      "kind": "post",
                  }
              )


          # Deduplicate tracked targets by id.
          tracked = {}

          for item in presence["tracked_targets"]:
              if not isinstance(item, dict):
                  continue

              item_id = text(item.get("id"))

              if item_id:
                  tracked[item_id] = item

          presence["tracked_targets"] = list(
              tracked.values()
          )[-MAX_TRACKED:]


          # ============================================================
          # RUN RECORD
          # ============================================================

          presence["runs"].append(
              {
                  "run_id": RUN_ID,
                  "timestamp": now_iso(),
                  "pending_before": len(normalized_pending),
                  "selected": len(selected),
                  "success": success_count,
                  "failed": failed_count,
                  "retry": retry_count,
                  "blocked": blocked_count,
                  "pending_after": len(remaining_pending),
                  "observed_feed": len(observed_feed),
              }
          )

          presence["runs"] = presence["runs"][-MAX_RUNS:]

          presence["actions"] = presence["actions"][-MAX_TRACKED:]
          presence["outcomes"] = presence["outcomes"][-MAX_TRACKED:]
          presence["errors"] = presence["errors"][-MAX_TRACKED:]


          # ============================================================
          # SAVE
          # ============================================================

          save(CORE_RUNTIME_FILE, runtime)
          save(CORE_MEMORY_FILE, memory)
          save(PRESENCE_MEMORY_FILE, presence)


          # ============================================================
          # SUMMARY
          # ============================================================

          print()
          print("=== PRESENCE SUMMARY ===")
          print(f"Run: {RUN_ID}")
          print(f"Selected: {len(selected)}")
          print(f"Success: {success_count}")
          print(f"Failed: {failed_count}")
          print(f"Retry: {retry_count}")
          print(f"Blocked: {blocked_count}")
          print(f"Pending after: {len(remaining_pending)}")
          print(f"Observed feed: {len(observed_feed)}")
          print("=== PRESENCE COMPLETE ===")
          PY

      - name: Validate JSON state
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os

          files = [
              os.environ["CORE_MEMORY_FILE"],
              os.environ["CORE_RUNTIME_FILE"],
              os.environ["PRESENCE_MEMORY_FILE"],
          ]

          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  json.load(fh)

              print(f"VALID JSON: {path}")
          PY

      - name: Check policy and diff
        run: |
          set -euo pipefail

          test "${PROJECT_COST_EUR}" = "0"
          test "${GEMINI_USED}" = "false"
          test "${EXTERNAL_AI_USED}" = "false"
          test "${AUTO_PAYMENT}" = "false"
          test "${AUTO_SPENDING}" = "false"

          git diff --check

      - name: Commit state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            "${CORE_MEMORY_FILE}" \
            "${CORE_RUNTIME_FILE}" \
            "${PRESENCE_MEMORY_FILE}"

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore(nox): record colony presence outcomes"

          git pull --rebase origin main

          git push origin HEAD:main
