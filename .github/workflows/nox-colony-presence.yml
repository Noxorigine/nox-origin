name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-colony-presence
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json

  MAX_FEED_ITEMS: "25"
  MAX_NOTIFICATIONS: "25"

  MAX_COMMENTS_PER_RUN: "2"
  MAX_REPLIES_PER_RUN: "2"
  MAX_REPLIES_PER_SENDER: "2"
  MAX_POSTS_PER_RUN: "1"

  MIN_POST_INTERVAL_HOURS: "24"

  MAX_MEMORY_ITEMS: "300"
  MAX_HANDLED_NOTIFICATIONS: "1000"
  MAX_CONTEXT_CHARS: "6000"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0"

      - name: Verify Colony SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from colony_sdk import ColonyClient

          client_methods = [
              "get_for_you_feed",
              "get_notifications",
              "create_comment",
              "create_post",
          ]

          missing = [
              name
              for name in client_methods
              if not hasattr(ColonyClient, name)
          ]

          if missing:
              raise RuntimeError(
                  "Colony SDK is missing required methods: "
                  + ", ".join(missing)
              )

          print("Colony SDK import: OK")
          print("Required Colony SDK methods: OK")
          PY

      - name: Run NØX Colony Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta

          from colony_sdk import ColonyClient


          # ============================================================
          # CONFIGURATION
          # ============================================================

          CORE_MEMORY_FILE = os.environ["CORE_MEMORY_FILE"]
          CORE_RUNTIME_FILE = os.environ["CORE_RUNTIME_FILE"]
          KNOWLEDGE_FILE = os.environ["KNOWLEDGE_FILE"]
          PRESENCE_FILE = os.environ["PRESENCE_FILE"]

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_NOTIFICATIONS = int(os.environ["MAX_NOTIFICATIONS"])

          MAX_COMMENTS_PER_RUN = int(
              os.environ["MAX_COMMENTS_PER_RUN"]
          )
          MAX_REPLIES_PER_RUN = int(
              os.environ["MAX_REPLIES_PER_RUN"]
          )
          MAX_REPLIES_PER_SENDER = int(
              os.environ["MAX_REPLIES_PER_SENDER"]
          )
          MAX_POSTS_PER_RUN = int(
              os.environ["MAX_POSTS_PER_RUN"]
          )

          MIN_POST_INTERVAL_HOURS = int(
              os.environ["MIN_POST_INTERVAL_HOURS"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )
          MAX_HANDLED_NOTIFICATIONS = int(
              os.environ["MAX_HANDLED_NOTIFICATIONS"]
          )
          MAX_CONTEXT_CHARS = int(
              os.environ["MAX_CONTEXT_CHARS"]
          )


          # ============================================================
          # BASIC UTILITIES
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def clean_text(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def get_value(obj, *names, default=None):
              if isinstance(obj, dict):
                  for name in names:
                      if name in obj and obj[name] is not None:
                          return obj[name]

              else:
                  for name in names:
                      value = getattr(
                          obj,
                          name,
                          None
                      )

                      if value is not None:
                          return value

              return default


          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"WARNING: unable to load "
                      f"{path}: {type(exc).__name__}: {exc}"
                  )
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temporary = f"{path}.tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )


          def trim_text(
              text,
              limit=MAX_CONTEXT_CHARS
          ):
              text = clean_text(text)

              if len(text) <= limit:
                  return text

              return (
                  text[:limit - 1].rstrip()
                  + "…"
              )


          # ============================================================
          # SDK RESPONSE NORMALIZATION
          #
          # Current Colony SDK returns paginated dictionaries.
          # This converts common response shapes into plain lists.
          # ============================================================

          def normalize_items(response, preferred_keys):
              if response is None:
                  return []

              if isinstance(response, list):
                  return response

              if isinstance(response, tuple):
                  return list(response)

              if isinstance(response, dict):
                  for key in preferred_keys:
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

                  for key in (
                      "items",
                      "data",
                      "results",
                  ):
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

                  return []

              try:
                  return list(response)

              except TypeError:
                  return []


          # ============================================================
          # LANGUAGE DETECTION
          #
          # English is the primary/default language.
          #
          # Incoming agent messages are detected locally and
          # deterministicly. If another supported language is clear,
          # NØX responds in that language.
          #
          # No Gemini.
          # No external AI.
          # ============================================================

          LANGUAGE_MARKERS = {
              "fr": (
                  " le ",
                  " la ",
                  " les ",
                  " des ",
                  " une ",
                  " un ",
                  " est ",
                  " avec ",
                  " pour ",
                  " dans ",
                  " que ",
                  " vous ",
                  " nous ",
                  " merci ",
                  " comment ",
                  " pourquoi ",
                  " mais ",
                  " sur ",
                  " cette ",
                  " ces ",
                  " votre ",
                  " peut ",
                  " peux ",
              ),
              "es": (
                  " el ",
                  " la ",
                  " los ",
                  " las ",
                  " una ",
                  " un ",
                  " es ",
                  " con ",
                  " para ",
                  " que ",
                  " gracias ",
                  " cómo ",
                  " por qué ",
                  " pero ",
                  " esta ",
                  " este ",
                  " puede ",
                  " puedes ",
                  " sobre ",
              ),
              "de": (
                  " der ",
                  " die ",
                  " das ",
                  " den ",
                  " eine ",
                  " ein ",
                  " ist ",
                  " mit ",
                  " für ",
                  " und ",
                  " danke ",
                  " wie ",
                  " warum ",
                  " aber ",
                  " diese ",
                  " dieser ",
                  " können ",
                  " kann ",
                  " über ",
              ),
              "it": (
                  " il ",
                  " lo ",
                  " gli ",
                  " le ",
                  " una ",
                  " un ",
                  " è ",
                  " con ",
                  " per ",
                  " che ",
                  " grazie ",
                  " come ",
                  " perché ",
                  " ma ",
                  " questa ",
                  " questo ",
                  " può ",
                  " puoi ",
                  " sulla ",
              ),
              "pt": (
                  " o ",
                  " a ",
                  " os ",
                  " as ",
                  " uma ",
                  " um ",
                  " é ",
                  " com ",
                  " para ",
                  " que ",
                  " obrigado ",
                  " obrigada ",
                  " como ",
                  " por que ",
                  " mas ",
                  " esta ",
                  " este ",
                  " pode ",
                  " você ",
              ),
              "nl": (
                  " de ",
                  " het ",
                  " een ",
                  " is ",
                  " met ",
                  " voor ",
                  " en ",
                  " dank ",
                  " hoe ",
                  " waarom ",
                  " maar ",
                  " deze ",
                  " dit ",
                  " kan ",
                  " kunt ",
                  " over ",
              ),
              "en": (
                  " the ",
                  " a ",
                  " an ",
                  " is ",
                  " are ",
                  " with ",
                  " for ",
                  " and ",
                  " thanks ",
                  " how ",
                  " why ",
                  " but ",
                  " this ",
                  " that ",
                  " these ",
                  " those ",
                  " can ",
                  " could ",
                  " would ",
                  " your ",
              ),
          }


          def detect_language(text):
              text = clean_text(text).lower()

              if not text:
                  return "en"

              padded = f" {text} "

              scores = {}

              for language, markers in LANGUAGE_MARKERS.items():
                  score = 0

                  for marker in markers:
                      score += padded.count(marker)

                  scores[language] = score

              best_language = max(
                  scores,
                  key=scores.get
              )

              best_score = scores[best_language]

              if best_score < 2:
                  return "en"

              ordered = sorted(
                  scores.items(),
                  key=lambda item: item[1],
                  reverse=True
              )

              if len(ordered) > 1:
                  first_score = ordered[0][1]
                  second_score = ordered[1][1]

                  if (
                      first_score == second_score
                      and first_score < 3
                  ):
                      return "en"

              return best_language


          # ============================================================
          # CONTENT UNDERSTANDING
          # ============================================================

          def meaningful_topic(text):
              text = clean_text(text)

              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9_-]{2,}",
                  text.lower()
              )

              stop_words = {
                  "the",
                  "and",
                  "that",
                  "this",
                  "with",
                  "from",
                  "have",
                  "about",
                  "your",
                  "what",
                  "when",
                  "where",
                  "would",
                  "could",
                  "should",
                  "dans",
                  "pour",
                  "avec",
                  "les",
                  "des",
                  "une",
                  "que",
                  "vous",
                  "nous",
                  "comment",
                  "pourquoi",
                  "est",
                  "mais",
                  "der",
                  "die",
                  "das",
                  "und",
                  "mit",
                  "für",
                  "ist",
                  "ein",
                  "eine",
                  "el",
                  "los",
                  "las",
                  "una",
                  "para",
                  "con",
                  "como",
                  "por",
                  "il",
                  "gli",
                  "perché",
                  "che",
                  "uma",
                  "com",
                  "een",
                  "het",
                  "voor",
                  "van",
                  "maar",
              }

              selected = []

              for word in words:
                  if word in stop_words:
                      continue

                  if word in selected:
                      continue

                  selected.append(word)

                  if len(selected) == 3:
                      break

              return ", ".join(selected)


          def is_real_question(text):
              text = clean_text(text).lower()

              if not text:
                  return False

              question_starts = (
                  "how ",
                  "why ",
                  "what ",
                  "when ",
                  "where ",
                  "can ",
                  "could ",
                  "would ",
                  "anyone ",
                  "does ",
                  "do you ",
                  "have you ",
                  "comment ",
                  "pourquoi ",
                  "quoi ",
                  "quand ",
                  "où ",
                  "peux ",
                  "pouvez ",
                  "cómo ",
                  "por qué ",
                  "puede ",
                  "pueden ",
                  "wie ",
                  "warum ",
                  "kann ",
                  "können ",
                  "come ",
                  "perché ",
                  "può ",
                  "como ",
                  "por que ",
                  "pode ",
                  "podem ",
                  "hoe ",
                  "waarom ",
                  "kan ",
              )

              return (
                  "?" in text
                  or any(
                      text.startswith(start)
                      for start in question_starts
                  )
              )


          def is_meaningful_post(text):
              text = clean_text(text).lower()

              if len(text) < 40:
                  return False

              generic_phrases = (
                  "caught my attention",
                  "interesting perspective",
                  "just wanted to share",
                  "what do you think?",
                  "gm",
                  "good morning",
                  "good night",
              )

              if any(
                  phrase in text
                  for phrase in generic_phrases
              ):
                  return False

              return True


          # ============================================================
          # COLONY OBJECT EXTRACTION
          # ============================================================

          def extract_sender(item):
              sender = get_value(
                  item,
                  "sender",
                  "author",
                  "user",
                  "agent",
                  default=None
              )

              if sender is None:
                  return ""

              return clean_text(
                  get_value(
                      sender,
                      "username",
                      "handle",
                      "name",
                      "id",
                      default=sender
                  )
              )


          def extract_sender_id(item):
              sender = get_value(
                  item,
                  "sender",
                  "author",
                  "user",
                  "agent",
                  default=None
              )

              if sender is not None:
                  value = get_value(
                      sender,
                      "id",
                      "user_id",
                      "agent_id",
                      "username",
                      "handle",
                      default=None
                  )

                  if value is not None:
                      return str(value)

              value = get_value(
                  item,
                  "sender_id",
                  "author_id",
                  "user_id",
                  "agent_id",
                  default=None
              )

              if value is not None:
                  return str(value)

              return ""


          def extract_id(item):
              value = get_value(
                  item,
                  "id",
                  "post_id",
                  "comment_id",
                  "notification_id",
                  default=None
              )

              if value is not None:
                  return str(value)

              return ""


          def extract_target_id(notification):
              target_fields = (
                  "target_id",
                  "comment_id",
                  "post_id",
                  "reply_to_id",
                  "parent_id",
                  "content_id",
                  "source_id",
              )

              for field in target_fields:
                  value = get_value(
                      notification,
                      field,
                      default=None
                  )

                  if value is not None:
                      return str(value)

              target = get_value(
                  notification,
                  "target",
                  "content",
                  "post",
                  "comment",
                  default=None
              )

              if target is not None:
                  value = get_value(
                      target,
                      "id",
                      "comment_id",
                      "post_id",
                      default=None
                  )

                  if value is not None:
                      return str(value)

              return ""


          def extract_text(item):
              return clean_text(
                  get_value(
                      item,
                      "body",
                      "content",
                      "text",
                      "message",
                      "title",
                      default=""
                  )
              )


          def extract_post_id_from_feed_item(item):
              return clean_text(
                  get_value(
                      item,
                      "post_id",
                      "id",
                      default=""
                  )
              )


          def extract_feed_post(item):
              if not isinstance(item, dict):
                  return item

              nested = item.get("post")

              if isinstance(nested, dict):
                  return nested

              return item


          # ============================================================
          # SHARED COGNITIVE CONTEXT
          #
          # Presence reads CORE + KNOWLEDGE.
          # Web research remains inside MEMORY & KNOWLEDGE.
          # ============================================================

          def build_context(
              core_memory,
              core_runtime,
              knowledge
          ):
              pieces = []

              for label, data in (
                  ("CORE", core_memory),
                  ("RUNTIME", core_runtime),
                  ("KNOWLEDGE", knowledge),
              ):
                  raw = json.dumps(
                      data,
                      ensure_ascii=False
                  )

                  if raw:
                      pieces.append(
                          f"{label}: "
                          + trim_text(
                              raw,
                              1800
                          )
                      )

              return trim_text(
                  "\n".join(pieces),
                  MAX_CONTEXT_CHARS
              )


          # ============================================================
          # DETERMINISTIC COMMUNICATION
          #
          # English is the primary/default language.
          # Incoming language is respected when clearly detected.
          # ============================================================

          def build_reply(
              language,
              sender,
              message
          ):
              topic = meaningful_topic(message)

              name = (
                  sender
                  if sender and len(sender) <= 40
                  else "there"
              )

              replies = {
                  "en": (
                      f"@{name}, your point on "
                      f"{topic or 'this topic'} is useful. "
                      "I’m tracking the concrete question here "
                      "rather than adding noise. "
                      "What result would you use to tell "
                      "whether the approach actually worked?"
                  ),
                  "fr": (
                      f"@{name}, ton point sur "
                      f"{topic or 'ce sujet'} est utile. "
                      "Je préfère suivre la question concrète "
                      "plutôt que d’ajouter du bruit. "
                      "Quel résultat utiliserais-tu pour savoir "
                      "si l’approche fonctionne réellement ?"
                  ),
                  "es": (
                      f"@{name}, tu punto sobre "
                      f"{topic or 'este tema'} es útil. "
                      "Prefiero seguir la cuestión concreta "
                      "en lugar de añadir ruido. "
                      "¿Qué resultado usarías para saber "
                      "si el enfoque realmente funciona?"
                  ),
                  "de": (
                      f"@{name}, dein Punkt zu "
                      f"{topic or 'diesem Thema'} ist nützlich. "
                      "Ich möchte der konkreten Frage folgen, "
                      "statt nur mehr Rauschen zu erzeugen. "
                      "Welches Ergebnis würde zeigen, "
                      "dass der Ansatz tatsächlich funktioniert?"
                  ),
                  "it": (
                      f"@{name}, il tuo punto su "
                      f"{topic or 'questo tema'} è utile. "
                      "Preferisco seguire la questione concreta "
                      "invece di aggiungere rumore. "
                      "Quale risultato useresti per capire "
                      "se l’approccio funziona davvero?"
                  ),
                  "pt": (
                      f"@{name}, o teu ponto sobre "
                      f"{topic or 'este tema'} é útil. "
                      "Prefiro seguir a questão concreta "
                      "em vez de acrescentar ruído. "
                      "Que resultado usarias para saber "
                      "se a abordagem realmente funciona?"
                  ),
                  "nl": (
                      f"@{name}, je punt over "
                      f"{topic or 'dit onderwerp'} is nuttig. "
                      "Ik volg liever de concrete vraag "
                      "dan extra ruis toe te voegen. "
                      "Welk resultaat zou laten zien "
                      "dat de aanpak echt werkt?"
                  ),
              }

              return replies.get(
                  language,
                  replies["en"]
              )


          def build_comment(
              language,
              author,
              post_text
          ):
              topic = meaningful_topic(post_text)

              prompts = {
                  "en": (
                      f"@{author}, the concrete part I’d "
                      f"test here is "
                      f"{topic or 'the proposed approach'}. "
                      "What evidence would make you change "
                      "your mind?"
                  ),
                  "fr": (
                      f"@{author}, le point concret que "
                      f"je testerais ici concerne "
                      f"{topic or 'l’approche proposée'}. "
                      "Quelle preuve te ferait changer d’avis ?"
                  ),
                  "es": (
                      f"@{author}, el punto concreto que "
                      f"probaría aquí es "
                      f"{topic or 'el enfoque propuesto'}. "
                      "¿Qué evidencia te haría cambiar de opinión?"
                  ),
                  "de": (
                      f"@{author}, der konkrete Punkt, "
                      f"den ich hier testen würde, ist "
                      f"{topic or 'der vorgeschlagene Ansatz'}. "
                      "Welche Evidenz würde dich umstimmen?"
                  ),
                  "it": (
                      f"@{author}, il punto concreto che "
                      f"testerei qui è "
                      f"{topic or 'l’approccio proposto'}. "
                      "Quale evidenza ti farebbe cambiare idea?"
                  ),
                  "pt": (
                      f"@{author}, o ponto concreto que "
                      f"eu testaria aqui é "
                      f"{topic or 'a abordagem proposta'}. "
                      "Que evidência faria você mudar de ideia?"
                  ),
                  "nl": (
                      f"@{author}, het concrete punt dat "
                      f"ik hier zou testen is "
                      f"{topic or 'de voorgestelde aanpak'}. "
                      "Welk bewijs zou je van mening doen veranderen?"
                  ),
              }

              return prompts.get(
                  language,
                  prompts["en"]
              )


          # ============================================================
          # PUBLICATION SELECTION
          # ============================================================

          def choose_public_post(
              core_memory,
              knowledge,
              presence
          ):
              learnings = []

              if isinstance(core_memory, dict):
                  for key in (
                      "learnings",
                      "lessons",
                      "observations"
                  ):
                      value = core_memory.get(key)

                      if isinstance(value, list):
                          learnings.extend(
                              value[-20:]
                          )

              if isinstance(knowledge, dict):
                  for key in (
                      "learnings",
                      "facts",
                      "insights",
                      "observations"
                  ):
                      value = knowledge.get(key)

                      if isinstance(value, list):
                          learnings.extend(
                              value[-20:]
                          )

              candidates = []

              for item in learnings:
                  if isinstance(item, str):
                      text = clean_text(item)

                  else:
                      text = clean_text(
                          get_value(
                              item,
                              "text",
                              "content",
                              "lesson",
                              "summary",
                              default=""
                          )
                      )

                  if is_meaningful_post(text):
                      candidates.append(text)

              if not candidates:
                  return None

              recent_posts = presence.get(
                  "posts",
                  []
              )

              recent_text = " ".join(
                  clean_text(
                      item.get("body", "")
                  )
                  for item in recent_posts[-5:]
                  if isinstance(item, dict)
              )

              for candidate in reversed(candidates):
                  if (
                      candidate[:120].lower()
                      not in recent_text.lower()
                  ):
                      return candidate

              return None


          # ============================================================
          # START
          # ============================================================

          print("=== NØX COLONY PRESENCE ===")

          core_memory = load_json(
              CORE_MEMORY_FILE,
              {}
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          presence = load_json(
              PRESENCE_FILE,
              {
                  "version": 2,
                  "updated_at": None,
                  "handled_notifications": [],
                  "relationships": {},
                  "interactions": [],
                  "posts": [],
                  "comments": [],
                  "replies": [],
                  "outcomes": [],
                  "learnings": [],
                  "runs": 0,
              }
          )

          if not isinstance(presence, dict):
              presence = {}

          presence.setdefault(
              "version",
              2
          )

          presence.setdefault(
              "handled_notifications",
              []
          )

          presence.setdefault(
              "relationships",
              {}
          )

          presence.setdefault(
              "interactions",
              []
          )

          presence.setdefault(
              "posts",
              []
          )

          presence.setdefault(
              "comments",
              []
          )

          presence.setdefault(
              "replies",
              []
          )

          presence.setdefault(
              "outcomes",
              []
          )

          presence.setdefault(
              "learnings",
              []
          )

          presence.setdefault(
              "runs",
              0
          )


          # ============================================================
          # SHARED CONTEXT
          # ============================================================

          context = build_context(
              core_memory,
              core_runtime,
              knowledge
          )

          print(
              f"Shared context loaded: "
              f"{len(context)} chars"
          )

          print(
              "Primary response language: English"
          )
          print(
              "Incoming language adaptation: enabled"
          )
          print("External AI: false")
          print("Gemini: false")
          print("Project cost: €0")
          print(
              "Spending/payment authority: false"
          )


          # ============================================================
          # COLONY CLIENT
          # ============================================================

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          client = ColonyClient(
              api_key
          )


          # ============================================================
          # OBSERVE
          #
          # Current SDK:
          #   get_for_you_feed()
          #   get_notifications()
          # ============================================================

          feed_response = client.get_for_you_feed(
              limit=MAX_FEED_ITEMS
          )

          notifications_response = (
              client.get_notifications(
                  limit=MAX_NOTIFICATIONS
              )
          )

          feed = normalize_items(
              feed_response,
              (
                  "posts",
                  "items",
                  "feed",
              )
          )

          notifications = normalize_items(
              notifications_response,
              (
                  "notifications",
                  "items",
              )
          )

          print(
              f"OBSERVE: {len(feed)} feed items."
          )

          print(
              f"OBSERVE: "
              f"{len(notifications)} notifications."
          )


          # ============================================================
          # STATE
          # ============================================================

          handled = set(
              str(item)
              for item in presence[
                  "handled_notifications"
              ]
          )

          sender_reply_counts = {}

          for item in presence["replies"]:
              if not isinstance(item, dict):
                  continue

              sender_id = str(
                  item.get(
                      "sender_id",
                      ""
                  )
              )

              if sender_id:
                  sender_reply_counts[
                      sender_id
                  ] = (
                      sender_reply_counts.get(
                          sender_id,
                          0
                      )
                      + 1
                  )

          # Existing successful comments are authoritative local
          # evidence that NØX already commented on a post.
          commented_post_ids = set(
              str(item.get("post_id"))
              for item in presence["comments"]
              if (
                  isinstance(item, dict)
                  and item.get("post_id")
              )
          )

          # A 409 from Colony explicitly means that the requested
          # comment was already posted recently. These conflicts are
          # remembered as handled outcomes so the same feed post is
          # not retried indefinitely.
          comment_conflict_post_ids = set(
              str(item.get("post_id"))
              for item in presence["outcomes"]
              if (
                  isinstance(item, dict)
                  and item.get("type")
                  == "comment_conflict"
                  and item.get("post_id")
              )
          )

          replies_sent = 0
          comments_sent = 0
          new_interactions = 0


          # ============================================================
          # UNDERSTAND + CHOOSE + ACT
          # ============================================================

          for notification in notifications:

              notification_id = extract_id(
                  notification
              )

              if (
                  not notification_id
                  or notification_id in handled
              ):
                  continue

              sender = extract_sender(
                  notification
              )

              sender_id = extract_sender_id(
                  notification
              )

              message = extract_text(
                  notification
              )

              target_id = extract_target_id(
                  notification
              )

              if (
                  sender_id
                  and sender_id == "nox_origine"
              ):
                  handled.add(
                      notification_id
                  )
                  continue

              if not sender and not message:
                  handled.add(
                      notification_id
                  )
                  continue

              new_interactions += 1

              language = detect_language(
                  message
              )

              presence["interactions"].append(
                  {
                      "timestamp": now_iso(),
                      "notification_id": (
                          notification_id
                      ),
                      "sender": sender,
                      "sender_id": sender_id,
                      "language": language,
                      "message": trim_text(
                          message,
                          1200
                      ),
                      "target_id": target_id,
                      "action": "observed",
                  }
              )

              print(
                  f"UNDERSTAND: "
                  f"{sender or sender_id} "
                  f"-> detected language: {language}"
              )


              # --------------------------------------------------------
              # SELECTIVE REPLY
              # --------------------------------------------------------

              can_reply = (
                  replies_sent
                  < MAX_REPLIES_PER_RUN
                  and bool(target_id)
                  and bool(sender_id)
                  and sender_id != "nox_origine"
                  and (
                      sender_reply_counts.get(
                          sender_id,
                          0
                      )
                      < MAX_REPLIES_PER_SENDER
                  )
                  and bool(message)
                  and is_real_question(
                      message
                  )
              )

              if can_reply:

                  reply = build_reply(
                      language,
                      sender,
                      message
                  )

                  try:
                      client.create_comment(
                          target_id,
                          reply
                      )

                      replies_sent += 1

                      sender_reply_counts[
                          sender_id
                      ] = (
                          sender_reply_counts.get(
                              sender_id,
                              0
                          )
                          + 1
                      )

                      presence["replies"].append(
                          {
                              "timestamp": now_iso(),
                              "notification_id": (
                                  notification_id
                              ),
                              "target_id": target_id,
                              "sender": sender,
                              "sender_id": sender_id,
                              "language": language,
                              "message": trim_text(
                                  message,
                                  1200
                              ),
                              "reply": reply,
                          }
                      )

                      print(
                          f"REPLY: "
                          f"{sender or sender_id} "
                          f"[{language}]"
                      )

                  except Exception as exc:

                      print(
                          "REPLY ERROR: "
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )

              else:

                  if not target_id:
                      print(
                          "REPLY: "
                          f"{sender or sender_id} "
                          "-> no target id, observe only"
                      )

                  elif not is_real_question(
                      message
                  ):
                      print(
                          "REPLY: "
                          f"{sender or sender_id} "
                          "-> not a concrete "
                          "question, observe only"
                      )

                  else:
                      print(
                          "REPLY: "
                          f"{sender or sender_id} "
                          "-> reply limit/"
                          "relationship guard"
                      )

              handled.add(
                  notification_id
              )


          # ============================================================
          # FEED RELATIONSHIPS + SELECTIVE COMMENTS
          # ============================================================

          for feed_item in feed:

              post = extract_feed_post(
                  feed_item
              )

              post_id = extract_post_id_from_feed_item(
                  post
              )

              author = extract_sender(
                  post
              )

              author_id = extract_sender_id(
                  post
              )

              body = extract_text(
                  post
              )

              if (
                  not post_id
                  or not body
                  or author_id == "nox_origine"
              ):
                  continue


              # --------------------------------------------------------
              # RELATIONSHIP MEMORY
              # --------------------------------------------------------

              if author_id:

                  relationship = (
                      presence[
                          "relationships"
                      ].setdefault(
                          author_id,
                          {
                              "sender": author,
                              "first_seen": now_iso(),
                              "last_seen": now_iso(),
                              "interactions": 0,
                              "languages": {},
                          }
                      )
                  )

                  relationship["sender"] = (
                      author
                      or relationship.get(
                          "sender",
                          ""
                      )
                  )

                  relationship[
                      "last_seen"
                  ] = now_iso()

                  relationship[
                      "interactions"
                  ] = int(
                      relationship.get(
                          "interactions",
                          0
                      )
                  ) + 1

                  language = detect_language(
                      body
                  )

                  relationship[
                      "languages"
                  ][language] = int(
                      relationship[
                          "languages"
                      ].get(
                          language,
                          0
                      )
                  ) + 1


              # --------------------------------------------------------
              # SELECTIVE PUBLIC COMMENT
              #
              # A post already commented successfully is not commented
              # again. A post that produced a confirmed Colony 409 is
              # also not retried. All existing eligibility guards remain
              # unchanged.
              # --------------------------------------------------------

              already_handled_comment = (
                  post_id in commented_post_ids
                  or post_id in comment_conflict_post_ids
              )

              can_comment = (
                  comments_sent
                  < MAX_COMMENTS_PER_RUN
                  and not already_handled_comment
                  and is_real_question(body)
                  and is_meaningful_post(body)
                  and bool(author)
              )

              if already_handled_comment:
                  print(
                      f"COMMENT: {author} "
                      "-> already handled, observe only"
                  )

              elif can_comment:

                  language = detect_language(
                      body
                  )

                  comment = build_comment(
                      language,
                      author,
                      body
                  )

                  try:

                      client.create_comment(
                          post_id,
                          comment
                      )

                      comments_sent += 1

                      commented_post_ids.add(
                          post_id
                      )

                      presence["comments"].append(
                          {
                              "timestamp": now_iso(),
                              "post_id": post_id,
                              "author": author,
                              "author_id": author_id,
                              "language": language,
                              "post": trim_text(
                                  body,
                                  1200
                              ),
                              "comment": comment,
                          }
                      )

                      print(
                          f"COMMENT: "
                          f"{author} "
                          f"[{language}]"
                      )

                  except Exception as exc:

                      error_text = clean_text(
                          str(exc)
                      )

                      # Colony returns HTTP 409 when the requested
                      # comment has already been posted recently.
                      # This is an already-handled state, not a reason
                      # to keep retrying the same feed item.
                      is_colony_duplicate = (
                          "409" in error_text
                          and (
                              "already posted"
                              in error_text.lower()
                              or
                              "already done"
                              in error_text.lower()
                          )
                      )

                      if is_colony_duplicate:
                          comment_conflict_post_ids.add(
                              post_id
                          )

                          presence["outcomes"].append(
                              {
                                  "timestamp": now_iso(),
                                  "type": "comment_conflict",
                                  "status": (
                                      "already_handled"
                                  ),
                                  "post_id": post_id,
                                  "author": author,
                                  "author_id": author_id,
                                  "error": trim_text(
                                      error_text,
                                      1200
                                  ),
                              }
                          )

                          print(
                              f"COMMENT: "
                              f"{author} "
                              "-> already handled "
                              "(Colony HTTP 409)"
                          )

                      else:
                          print(
                              "COMMENT ERROR: "
                              f"{type(exc).__name__}: "
                              f"{exc}"
                          )

              else:

                  if not is_real_question(body):
                      print(
                          f"COMMENT: {author} "
                          "-> not a concrete "
                          "question, observe only"
                      )

                  elif not is_meaningful_post(body):
                      print(
                          f"COMMENT: {author} "
                          "-> not a meaningful post, "
                          "observe only"
                      )

                  else:
                      print(
                          f"COMMENT: {author} "
                          "-> comment limit guard"
                      )


          # ============================================================
          # RARE USEFUL PUBLICATION
          # ============================================================

          publication = None

          last_post_at = None

          if presence["posts"]:
              last_post_at = presence[
                  "posts"
              ][-1].get(
                  "timestamp"
              )

          can_post = True

          if last_post_at:

              try:

                  last_datetime = (
                      datetime.fromisoformat(
                          last_post_at.replace(
                              "Z",
                              "+00:00"
                          )
                      )
                  )

                  can_post = (
                      datetime.now(
                          timezone.utc
                      )
                      - last_datetime
                      >= timedelta(
                          hours=MIN_POST_INTERVAL_HOURS
                      )
                  )

              except Exception:

                  can_post = True


          if (
              can_post
              and MAX_POSTS_PER_RUN > 0
          ):

              candidate = choose_public_post(
                  core_memory,
                  knowledge,
                  presence
              )

              if candidate:

                  title = (
                      "A concrete lesson from NØX"
                  )

                  body = (
                      "NØX is testing a simple "
                      "principle: useful agent "
                      "activity should leave "
                      "evidence behind.\n\n"
                      "Current observation: "
                      f"{trim_text(candidate, 900)}\n\n"
                      "The next step is not to "
                      "repeat the claim, but to "
                      "test what changes when "
                      "the result is observable."
                  )

                  try:

                      created = client.create_post(
                          title=title,
                          body=body,
                          colony="agent-economy"
                      )

                      post_id = ""

                      if created is not None:
                          post_id = extract_id(
                              created
                          )

                      publication = {
                          "timestamp": now_iso(),
                          "post_id": post_id,
                          "title": title,
                          "body": body,
                      }

                      presence["posts"].append(
                          publication
                      )

                      print(
                          "ACT: useful "
                          "publication created."
                      )

                  except Exception as exc:

                      print(
                          "POST ERROR: "
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      )

          else:

              print(
                  "ACT: publication skipped "
                  "by frequency guard."
              )


          # ============================================================
          # OBSERVE RESULT + LEARN
          # ============================================================

          if new_interactions:

              presence["outcomes"].append(
                  {
                      "timestamp": now_iso(),
                      "type": "presence_run",
                      "new_interactions": (
                          new_interactions
                      ),
                      "replies": replies_sent,
                      "comments": comments_sent,
                      "publication": bool(
                          publication
                      ),
                  }
              )

              presence["learnings"].append(
                  {
                      "timestamp": now_iso(),
                      "lesson": (
                          f"Observed "
                          f"{new_interactions} "
                          "new interaction(s); "
                          f"answered "
                          f"{replies_sent}, "
                          f"commented "
                          f"{comments_sent}, "
                          f"published "
                          f"{bool(publication)}."
                      ),
                  }
              )


          # ============================================================
          # MEMORY CONTROL
          # ============================================================

          presence[
              "handled_notifications"
          ] = list(handled)[
              -MAX_HANDLED_NOTIFICATIONS:
          ]

          presence[
              "interactions"
          ] = presence[
              "interactions"
          ][-MAX_MEMORY_ITEMS:]

          presence[
              "replies"
          ] = presence[
              "replies"
          ][-MAX_MEMORY_ITEMS:]

          presence[
              "comments"
          ] = presence[
              "comments"
          ][-MAX_MEMORY_ITEMS:]

          presence[
              "outcomes"
          ] = presence[
              "outcomes"
          ][-MAX_MEMORY_ITEMS:]

          presence[
              "learnings"
          ] = presence[
              "learnings"
          ][-MAX_MEMORY_ITEMS:]

          presence[
              "posts"
          ] = presence[
              "posts"
          ][-MAX_MEMORY_ITEMS:]


          if len(
              presence["relationships"]
          ) > MAX_MEMORY_ITEMS:

              ordered = sorted(
                  presence[
                      "relationships"
                  ].items(),
                  key=lambda pair:
                      pair[1].get(
                          "last_seen",
                          ""
                      ),
                  reverse=True
              )[:MAX_MEMORY_ITEMS]

              presence[
                  "relationships"
              ] = dict(ordered)


          presence["updated_at"] = now_iso()

          presence["runs"] = int(
              presence.get(
                  "runs",
                  0
              )
          ) + 1


          # ============================================================
          # PERSIST
          # ============================================================

          save_json(
              PRESENCE_FILE,
              presence
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          print(
              "\n=== NØX COLONY PRESENCE / SUMMARY ==="
          )

          print(
              f"Feed observed: {len(feed)}"
          )

          print(
              f"New interactions: "
              f"{new_interactions}"
          )

          print(
              f"Replies sent: "
              f"{replies_sent}"
          )

          print(
              f"Comments sent: "
              f"{comments_sent}"
          )

          print(
              "Publication: "
              + (
                  "yes"
                  if publication
                  else "no"
              )
          )

          print(
              "Relationships tracked: "
              f"{len(presence['relationships'])}"
          )

          print(
              f"Run: {presence['runs']}"
          )

          print(
              "\n=== COLONY PRESENCE TERMINÉ ==="
          )
          PY

      - name: Commit Colony Presence memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

          git add memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No Presence memory changes to commit."
            exit 0
          fi

          git commit -m "NØX: update colony presence memory"
          git push
