name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

# Presence, Core et Work Factory écrivent tous dans le même état Git.
# Le même groupe empêche deux workflows de modifier simultanément
# les fichiers mémoire/runtime.
concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json
  MAX_ACTIONS_PER_RUN: "2"
  MAX_FEED_ITEMS: "20"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"

  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

  # Cognitive reply engine.
  # If GEMINI_API_KEY exists, Gemini is used only to formulate
  # the bounded answer decided by Core.
  GEMINI_MODEL: "gemini-3.8-flash"
  GEMINI_MAX_CALLS_PER_RUN: "2"
  GEMINI_MAX_OUTPUT_TOKENS: "500"

jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Install optional cognitive engine
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            pip install "google-genai>=1.0.0,<2.0.0"
            echo "Gemini cognitive formulation enabled."
          else
            echo "No GEMINI_API_KEY. Deterministic cognitive fallback enabled."
          fi

      - name: Run NØX Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          NOW = datetime.now(timezone.utc).isoformat()

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          PRESENCE_FILE = Path(
              os.environ["PRESENCE_MEMORY_FILE"]
          )

          MAX_ACTIONS = int(
              os.environ["MAX_ACTIONS_PER_RUN"]
          )
          MAX_FEED = int(
              os.environ["MAX_FEED_ITEMS"]
          )
          MAX_TRACKED = int(
              os.environ["MAX_TRACKED"]
          )
          MAX_RUNS = int(
              os.environ["MAX_RUNS"]
          )

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.8-flash"
          )

          GEMINI_MAX_CALLS = int(
              os.environ.get(
                  "GEMINI_MAX_CALLS_PER_RUN",
                  "2"
              )
          )

          GEMINI_MAX_OUTPUT = int(
              os.environ.get(
                  "GEMINI_MAX_OUTPUT_TOKENS",
                  "500"
              )
          )

          # ==========================================================
          # SECURITY
          # ==========================================================

          if (
              os.environ.get("AUTO_PAYMENT")
              != "false"
              or os.environ.get("AUTO_SPENDING")
              != "false"
          ):
              raise SystemExit(
                  "SECURITY STOP: payment/spending must remain disabled."
              )

          # ==========================================================
          # STORAGE
          # ==========================================================

          def clone(value):
              return json.loads(
                  json.dumps(value)
              )

          def load(path, default):
              if not path.exists():
                  return clone(default)

              try:
                  value = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(value, dict):
                      return value

                  return clone(default)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return clone(default)

          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          def clean(value, limit=3000):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()[:limit]

          def stable(*parts):
              raw = "|".join(
                  clean(
                      part,
                      5000
                  )
                  for part in parts
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def item_id(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or ""
              )

          def item_title(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              return clean(
                  item.get("title")
                  or "",
                  400
              )

          def item_body(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              return clean(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or "",
                  5000
              )

          def item_author(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              value = item.get(
                  "author"
              )

              if isinstance(
                  value,
                  dict
              ):
                  return clean(
                      value.get("username")
                      or value.get("display_name")
                      or "",
                      100
                  )

              return clean(
                  item.get(
                      "author_username"
                  )
                  or item.get("username")
                  or "",
                  100
              )

          def extract(value, keys):
              if isinstance(
                  value,
                  list
              ):
                  return value

              if isinstance(
                  value,
                  dict
              ):
                  for key in keys:
                      candidate = value.get(
                          key
                      )

                      if isinstance(
                          candidate,
                          list
                      ):
                          return candidate

              return []

          # ==========================================================
          # DEFAULT PRESENCE STATE
          # ==========================================================

          DEFAULT_PRESENCE = {
              "version": 6,
              "observed_posts": [],
              "replied_posts": [],
              "published_posts": [],
              "notifications": [],
              "outcomes": [],
              "runs": []
          }

          core = load(
              CORE_MEMORY_FILE,
              {}
          )

          runtime = load(
              CORE_RUNTIME_FILE,
              {
                  "pending_actions": []
              }
          )

          knowledge = load(
              KNOWLEDGE_FILE,
              {}
          )

          presence = load(
              PRESENCE_FILE,
              DEFAULT_PRESENCE
          )

          for key in DEFAULT_PRESENCE:
              if key == "version":
                  continue

              if not isinstance(
                  presence.get(key),
                  list
              ):
                  presence[key] = []

          presence["version"] = 6

          # ==========================================================
          # COLONY CLIENT
          # ==========================================================

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(
              API_KEY
          )

          try:
              state = client.bootstrap()

          except ColonyAuthError as exc:
              raise SystemExit(
                  f"Authentification Colony refusée: {exc}"
              )

          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur Colony au bootstrap: {exc}"
              )

          profile = (
              state.get(
                  "profile",
                  {}
              )
              if isinstance(
                  state,
                  dict
              )
              else {}
          )

          username = clean(
              profile.get(
                  "username"
              ),
              100
          )

          if username != "nox_origine":
              raise SystemExit(
                  "SECURITY STOP: profil inattendu "
                  f"'{username}'."
              )

          # ==========================================================
          # MEMORY HELPERS
          # ==========================================================

          def memory_blob(value):
              try:
                  return clean(
                      json.dumps(
                          value,
                          ensure_ascii=False
                      ),
                      12000
                  ).lower()
              except Exception:
                  return clean(
                      value,
                      12000
                  ).lower()

          def recall(text, limit=6):
              words = set(
                  re.findall(
                      r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                      clean(
                          text,
                          5000
                      ).lower()
                  )
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "have",
                  "what",
                  "when",
                  "where",
                  "which",
                  "would",
                  "could",
                  "about",
                  "your",
                  "their",
                  "there",
                  "pour",
                  "avec",
                  "dans",
                  "nous",
                  "vous",
                  "cela",
                  "cette",
                  "comme",
                  "mais",
                  "plus",
                  "faire",
                  "être",
                  "sont"
              }

              words = {
                  word
                  for word in words
                  if word not in stop
              }

              scored = []

              for kind, values in core.items():

                  if (
                      kind == "version"
                      or not isinstance(
                          values,
                          list
                      )
                  ):
                      continue

                  for value in values:

                      score = sum(
                          1
                          for word in words
                          if word in memory_blob(
                              value
                          )
                      )

                      if score:
                          scored.append(
                              {
                                  "kind": kind,
                                  "score": score,
                                  "item": value
                              }
                          )

              scored.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              return scored[:limit]

          # ==========================================================
          # LANGUAGE
          # ==========================================================

          def detect_language(text):
              low = clean(
                  text,
                  5000
              ).lower()

              french_markers = (
                  " le ",
                  " la ",
                  " les ",
                  " des ",
                  " une ",
                  " pour ",
                  " avec ",
                  " est ",
                  " que ",
                  " dans ",
                  " pas ",
                  " plus ",
                  " comment ",
                  " pourquoi "
              )

              english_markers = (
                  " the ",
                  " this ",
                  " that ",
                  " with ",
                  " for ",
                  " is ",
                  " are ",
                  " what ",
                  " how ",
                  " why ",
                  " not ",
                  " more "
              )

              fr = sum(
                  low.count(x)
                  for x in french_markers
              )

              en = sum(
                  low.count(x)
                  for x in english_markers
              )

              if fr > en and fr >= 2:
                  return "fr"

              return "en"

          # ==========================================================
          # THREAD CONTEXT
          # ==========================================================

          def get_comments(post_id):
              try:
                  comments = client.get_all_comments(
                      post_id
                  )

                  if not isinstance(
                      comments,
                      list
                  ):
                      return []

                  return comments[-12:]

              except Exception as exc:
                  print(
                      "WARNING: comments unavailable: "
                      f"{clean(exc, 500)}"
                  )
                  return []

          def comment_author(comment):
              if not isinstance(
                  comment,
                  dict
              ):
                  return ""

              author = comment.get(
                  "author"
              )

              if isinstance(
                  author,
                  dict
              ):
                  return clean(
                      author.get(
                          "username"
                      )
                      or author.get(
                          "display_name"
                      )
                      or "",
                      100
                  )

              return clean(
                  comment.get(
                      "author_username"
                  )
                  or "",
                  100
              )

          def comment_body(comment):
              if not isinstance(
                  comment,
                  dict
              ):
                  return ""

              return clean(
                  comment.get("body")
                  or comment.get("content")
                  or comment.get("text")
                  or "",
                  2000
              )

          # ==========================================================
          # GEMINI COGNITIVE FORMULATION
          # ==========================================================

          gemini_calls = 0

          def gemini_reply(
              post,
              comments,
              case,
              research,
              memories
          ):
              global gemini_calls

              if (
                  not GEMINI_KEY
                  or gemini_calls
                  >= GEMINI_MAX_CALLS
              ):
                  return None

              try:
                  from google import genai
                  from google.genai import types

                  gemini_calls += 1

                  client_ai = genai.Client(
                      api_key=GEMINI_KEY
                  )

                  language = detect_language(
                      f"{item_title(post)} "
                      f"{item_body(post)}"
                  )

                  comments_text = "\n".join(
                      f"- {comment_author(c)}: "
                      f"{comment_body(c)}"
                      for c in comments[-8:]
                      if comment_body(c)
                  )

                  memory_text = json.dumps(
                      memories[:4],
                      ensure_ascii=False
                  )[:5000]

                  research_text = json.dumps(
                      research,
                      ensure_ascii=False
                  )[:6000]

                  case_text = json.dumps(
                      {
                          "intent": case.get(
                              "intent"
                          ),
                          "decision": case.get(
                              "decision"
                          ),
                          "reason": case.get(
                              "decision_reason"
                          ),
                          "questions": case.get(
                              "questions",
                              []
                          ),
                          "uncertainties": case.get(
                              "uncertainties",
                              []
                          )
                      },
                      ensure_ascii=False
                  )

                  system_instruction = """
          You are the cognitive response layer of NØX, an AI agent on The Colony.

          You do NOT decide whether NØX should reply.
          Core already made that decision.

          Your job is to formulate one authentic, specific response from
          the evidence and context supplied to you.

          Rules:
          - Respond directly to what the author actually said.
          - Do not invent facts.
          - Do not pretend a search proved something it did not prove.
          - Distinguish observation, reported information, research result,
            hypothesis and uncertainty.
          - Use relevant memory only when it genuinely connects to the post.
          - If research is insufficient, say so naturally.
          - If the post contains a question, address that question.
          - If there is a contradiction, identify the exact point of tension.
          - If there is no justified conclusion, ask one precise follow-up
            question rather than filling space.
          - Do not say "I checked this" unless research data is actually present.
          - Do not use generic openings such as "Interesting", "This caught
            my attention", "Great post", "I agree", or "I think".
          - Do not mention Core, Work Factory, Gemini, workflows or internal
            architecture.
          - Sound like an agent that has actually read the conversation.
          - Keep the response between roughly 40 and 180 words.
          - Do not use bullet points unless the original post clearly calls
            for a list.
          - Preserve the language of the post.
          """

                  prompt = f"""
          LANGUAGE: {language}

          POST TITLE:
          {item_title(post)}

          POST BODY:
          {item_body(post)}

          RECENT THREAD:
          {comments_text or "(no comments)"}

          COGNITIVE CASE:
          {case_text}

          RESEARCH RESULT:
          {research_text or "(no external research)"}

          RELEVANT NØX MEMORY:
          {memory_text or "(no relevant memory)"}

          Write ONLY the final Colony reply.
          """

                  response = client_ai.models.generate_content(
                      model=GEMINI_MODEL,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          system_instruction=system_instruction,
                          max_output_tokens=GEMINI_MAX_OUTPUT
                      )
                  )

                  text = clean(
                      getattr(
                          response,
                          "text",
                          ""
                      ),
                      1800
                  )

                  if (
                      not text
                      or len(text) < 20
                  ):
                      return None

                  return text

              except Exception as exc:
                  print(
                      "WARNING: Gemini formulation failed: "
                      f"{clean(exc, 500)}"
                  )
                  return None

          # ==========================================================
          # DETERMINISTIC COGNITIVE FALLBACK
          # ==========================================================

          def fallback_reply(
              post,
              comments,
              case,
              research,
              memories
          ):
              title = item_title(post)
              body = item_body(post)
              language = detect_language(
                  f"{title} {body}"
              )

              questions = case.get(
                  "questions",
                  []
              )

              intent = case.get(
                  "intent",
                  ""
              )

              if isinstance(
                  research,
                  dict
              ):
                  status = research.get(
                      "evidence_status"
                  )

                  conclusion = clean(
                      research.get(
                          "conclusion"
                      ),
                      700
                  )

                  next_step = clean(
                      research.get(
                          "next_step"
                      ),
                      500
                  )

                  if language == "fr":

                      if status == "multi_source_support":
                          return clean(
                              f"Le point vérifié ici est surtout "
                              f"la solidité du passage entre ton affirmation "
                              f"et les éléments disponibles. La recherche "
                              f"retrouve des sources convergentes, mais leur "
                              f"convergence ne suffit pas à elle seule à "
                              f"établir la conclusion. {next_step}",
                              1600
                          )

                      if conclusion:
                          return clean(
                              f"J’ai regardé précisément ce point. "
                              f"Le résultat reste {status or 'non établi'} : "
                              f"{conclusion} {next_step}",
                              1600
                          )

                  else:

                      if status == "multi_source_support":
                          return clean(
                              f"The useful distinction here is between "
                              f"source convergence and actual confirmation. "
                              f"The research found converging sources, but "
                              f"that does not by itself establish the claim. "
                              f"{next_step}",
                              1600
                          )

                      if conclusion:
                          return clean(
                              f"I checked the specific point rather than "
                              f"generalizing from the post. The result is "
                              f"{status or 'not established'}: "
                              f"{conclusion} {next_step}",
                              1600
                          )

              if questions:

                  question = clean(
                      questions[0],
                      500
                  )

                  if language == "fr":
                      return clean(
                          f"Ta question « {question} » me semble être "
                          f"le point qui mérite d’être isolé. Je ne veux "
                          f"pas transformer cette observation en conclusion "
                          f"trop vite : il faudrait identifier le résultat "
                          f"qui permettrait réellement de départager les "
                          f"explications possibles.",
                          1500
                      )

                  return clean(
                      f"The question “{question}” is the part I would "
                      f"isolate first. I would not turn the observation "
                      f"into a conclusion yet; the useful next step is to "
                      f"identify the result that would actually distinguish "
                      f"the competing explanations.",
                      1500
                  )

              if memories:

                  memory = memories[0].get(
                      "item",
                      {}
                  )

                  memory_summary = clean(
                      memory.get(
                          "summary"
                      )
                      if isinstance(
                          memory,
                          dict
                      )
                      else memory,
                      500
                  )

                  if memory_summary:

                      if language == "fr":
                          return clean(
                              f"Il y a un lien avec quelque chose que "
                              f"j’ai déjà observé : {memory_summary}. "
                              f"Mais je ne considérerais pas encore les "
                              f"deux situations comme équivalentes. "
                              f"Le point à vérifier est ce qui change "
                              f"entre les deux contextes.",
                              1500
                          )

                      return clean(
                          f"There is a connection with something I have "
                          f"observed before: {memory_summary}. "
                          f"I would not treat the two situations as "
                          f"equivalent yet, though. The useful check is "
                          f"what changes between the two contexts.",
                          1500
                      )

              # Last fallback is deliberately tied to the actual post,
              # never a generic "caught my attention" sentence.
              excerpt = clean(
                  body,
                  420
              )

              if language == "fr":
                  return clean(
                      f"Je pars de ce que tu affirmes réellement ici : "
                      f"« {excerpt} ». Le point que je voudrais vérifier "
                      f"avant d’aller plus loin est le passage entre cette "
                      f"observation et la conclusion que tu en tires. "
                      f"Si ce passage est confirmé, on aura quelque chose "
                      f"de reproductible plutôt qu’une simple impression.",
                      1500
                  )

              return clean(
                  f"I’m taking the specific claim in your post as the "
                  f"starting point: “{excerpt}”. The part I would verify "
                  f"before going further is the step from that observation "
                  f"to the conclusion drawn from it. If that step holds, "
                  f"we have something reproducible rather than just an "
                  f"impression.",
                  1500
              )

          # ==========================================================
          # REPLY CONSTRUCTION
          # ==========================================================

          def build_reply(
              action,
              case,
              post,
              comments
          ):
              research = action.get(
                  "research_result"
              )

              if not isinstance(
                  research,
                  dict
              ):
                  research = (
                      case.get(
                          "research_result"
                      )
                      if isinstance(
                          case,
                          dict
                      )
                      else None
                  )

              memories = []

              if isinstance(
                  case,
                  dict
              ):
                  memories = [
                      {
                          "kind": "case_memory",
                          "item": item
                      }
                      for item in case.get(
                          "memory_hits",
                          []
                      )[:4]
                  ]

              if not memories:
                  memories = recall(
                      f"{item_title(post)} "
                      f"{item_body(post)}",
                      4
                  )

              generated = gemini_reply(
                  post,
                  comments,
                  case,
                  research,
                  memories
              )

              if generated:
                  return generated, "gemini"

              return (
                  fallback_reply(
                      post,
                      comments,
                      case,
                      research,
                      memories
                  ),
                  "deterministic"
              )

          # ==========================================================
          # PENDING ACTIONS FROM CORE
          # ==========================================================

          pending = [
              item
              for item in runtime.get(
                  "pending_actions",
                  []
              )
              if isinstance(
                  item,
                  dict
              )
          ]

          pending = pending[
              :MAX_ACTIONS
          ]

          done_ids = {
              item.get("action_id")
              for item in presence.get(
                  "outcomes",
                  []
              )
              if (
                  isinstance(
                      item,
                      dict
                  )
                  and item.get(
                      "action_id"
                  )
              )
          }

          cognitive_cases = {
              item.get("case_id"): item
              for item in core.get(
                  "cognitive_cases",
                  []
              )
              if (
                  isinstance(
                      item,
                      dict
                  )
                  and item.get(
                      "case_id"
                  )
              )
          }

          comments_created = 0
          skipped = 0
          errors = 0

          # ==========================================================
          # EXECUTE ONLY CORE-APPROVED ACTIONS
          # ==========================================================

          for action in pending:

              action_id = action.get(
                  "action_id"
              )

              if (
                  not action_id
                  or action_id in done_ids
              ):
                  continue

              case_id = action.get(
                  "case_id"
              )

              case = cognitive_cases.get(
                  case_id,
                  {}
              )

              target_id = str(
                  action.get(
                      "target_id"
                  )
                  or ""
              )

              outcome = {
                  "id": stable(
                      "presence-outcome",
                      action_id,
                      NOW
                  ),
                  "action_id": action_id,
                  "case_id": case_id,
                  "target_id": target_id,
                  "timestamp": NOW
              }

              if not target_id:
                  outcome.update(
                      {
                          "status": "skipped",
                          "reason": "missing_target_id"
                      }
                  )

                  presence[
                      "outcomes"
                  ].append(
                      outcome
                  )

                  skipped += 1
                  continue

              try:

                  post = client.get_post(
                      target_id
                  )

                  if not isinstance(
                      post,
                      dict
                  ):
                      raise ValueError(
                          "target post unavailable"
                      )

                  post_author = item_author(
                      post
                  )

                  if (
                      post_author.lower()
                      == username.lower()
                  ):
                      outcome.update(
                          {
                              "status": "skipped",
                              "reason": "own_post"
                          }
                      )

                      presence[
                          "outcomes"
                      ].append(
                          outcome
                      )

                      skipped += 1
                      continue

                  comments = get_comments(
                      target_id
                  )

                  # --------------------------------------------------
                  # Prevent duplicate participation.
                  # --------------------------------------------------

                  own_comment = None

                  for comment in comments:

                      if (
                          comment_author(
                              comment
                          ).lower()
                          == username.lower()
                      ):
                          own_comment = comment
                          break

                  if own_comment is not None:
                      outcome.update(
                          {
                              "status": "skipped",
                              "reason": "already_participated",
                              "existing_comment_id": (
                                  own_comment.get(
                                      "id"
                                  )
                                  if isinstance(
                                      own_comment,
                                      dict
                                  )
                                  else None
                              )
                          }
                      )

                      presence[
                          "outcomes"
                      ].append(
                          outcome
                      )

                      skipped += 1
                      continue

                  # --------------------------------------------------
                  # Build a response from actual context.
                  # --------------------------------------------------

                  reply, engine = build_reply(
                      action,
                      case,
                      post,
                      comments
                  )

                  if not reply:
                      raise ValueError(
                          "empty cognitive reply"
                      )

                  # --------------------------------------------------
                  # IMPORTANT:
                  # Core currently queues replies to POSTS.
                  # Therefore we deliberately create a top-level
                  # comment on the post. If Core later stores a
                  # parent_comment_id, this code can be extended
                  # without changing the cognitive layer.
                  # --------------------------------------------------

                  created = client.create_comment(
                      target_id,
                      reply
                  )

                  created_id = (
                      (
                          created.get("id")
                          or created.get(
                              "comment_id"
                          )
                      )
                      if isinstance(
                          created,
                          dict
                      )
                      else None
                  )

                  outcome.update(
                      {
                          "status": "executed",
                          "kind": "comment",
                          "comment_id": created_id,
                          "body": reply,
                          "formulation_engine": engine,
                          "post_title": item_title(
                              post
                          ),
                          "post_author": post_author
                      }
                  )

                  presence[
                      "replied_posts"
                  ].append(
                      {
                          "timestamp": NOW,
                          "post_id": target_id,
                          "case_id": case_id,
                          "action_id": action_id,
                          "comment_id": created_id,
                          "reply": reply,
                          "engine": engine
                      }
                  )

                  comments_created += 1

                  print(
                      "REPLIED:",
                      target_id,
                      "engine=",
                      engine
                  )

              except Exception as exc:

                  outcome.update(
                      {
                          "status": "error",
                          "error": clean(
                              exc,
                              1000
                          )
                      }
                  )

                  errors += 1

              presence[
                  "outcomes"
              ].append(
                  outcome
              )

          # ==========================================================
          # OBSERVE FEED
          #
          # Presence observes the Colony, but NEVER decides from
          # observation alone. Core remains the decision layer.
          # ==========================================================

          try:
              feed = extract(
                  client.get_for_you_feed(
                      limit=MAX_FEED,
                      kinds="posts"
                  ),
                  (
                      "items",
                      "posts",
                      "feed"
                  )
              )

          except Exception as exc:

              feed = []

              print(
                  "WARNING: feed unavailable:",
                  clean(exc, 500)
              )

          for post in feed:

              post_id = item_id(
                  post
              )

              if not post_id:
                  continue

              presence[
                  "observed_posts"
              ].append(
                  {
                      "timestamp": NOW,
                      "post_id": post_id,
                      "title": item_title(
                          post
                      ),
                      "author": item_author(
                          post
                      )
                  }
              )

          # ==========================================================
          # TRACKING LIMITS
          # ==========================================================

          for key in (
              "observed_posts",
              "replied_posts",
              "published_posts",
              "notifications",
              "outcomes"
          ):
              presence[key] = presence[key][
                  -MAX_TRACKED:
              ]

          presence["runs"].append(
              {
                  "timestamp": NOW,
                  "actions_received": len(
                      pending
                  ),
                  "comments_created": (
                      comments_created
                  ),
                  "skipped": skipped,
                  "errors": errors,
                  "gemini_calls": gemini_calls,
                  "feed_observed": len(
                      feed
                  )
              }
          )

          presence["runs"] = presence[
              "runs"
          ][-MAX_RUNS:]

          # ==========================================================
          # SAVE
          # ==========================================================

          save(
              PRESENCE_FILE,
              presence
          )

          # ==========================================================
          # OUTPUT
          # ==========================================================

          print(
              "=== NØX COLONY PRESENCE V6 ==="
          )

          print(
              f"Feed observed={len(feed)}"
          )

          print(
              f"Core actions received={len(pending)}"
          )

          print(
              f"Comments created={comments_created}"
          )

          print(
              f"Skipped={skipped}"
          )

          print(
              f"Errors={errors}"
          )

          print(
              f"Gemini calls={gemini_calls}"
          )

          print(
              "Pipeline: "
              "CORE DECISION -> "
              "POST CONTEXT -> "
              "MEMORY -> "
              "WORK RESULT -> "
              "COGNITIVE FORMULATION -> "
              "COLONY RESPONSE -> "
              "OUTCOME -> CORE"
          )

          print(
              "Policy: "
              "Presence executes only Core-approved actions. "
              "No payment. No spending."
          )

          PY

      - name: Commit Presence state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No Presence changes."
            exit 0
          fi

          git commit -m "NØX: update colony presence"

          git pull --rebase origin main

          git push
