name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_MEMORY_FILE: memory/nox_colony_presence.json

  MAX_ACTIONS_PER_RUN: "2"
  MAX_FEED_ITEMS: "20"
  MAX_TRACKED: "500"
  MAX_RUNS: "100"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  presence:
    name: presence
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@noreply.github.com"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Verify Colony SDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from colony_sdk import ColonyClient

          print("Colony SDK import: OK")
          print("ColonyClient:", ColonyClient)
          PY

      - name: Run NØX Presence
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          print("=== NØX PRESENCE ===")

          now = datetime.now(timezone.utc)
          run_id = "presence-" + now.strftime("%Y%m%dT%H%M%SZ")

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          PRESENCE_FILE = Path(
              os.environ["PRESENCE_MEMORY_FILE"]
          )

          MAX_ACTIONS = int(
              os.environ["MAX_ACTIONS_PER_RUN"]
          )
          MAX_TRACKED = int(
              os.environ["MAX_TRACKED"]
          )
          MAX_RUNS = int(
              os.environ["MAX_RUNS"]
          )

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8",
                  ) as f:
                      return json.load(f)
              except Exception as exc:
                  print(
                      f"WARNING: cannot load {path}: {exc}"
                  )
                  return default

          def save(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with tmp.open(
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
                  f.write("\n")

              tmp.replace(path)

          def as_dict(value):
              return value if isinstance(
                  value,
                  dict,
              ) else {}

          def as_list(value):
              return value if isinstance(
                  value,
                  list,
              ) else []

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "body",
                      "content",
                      "text",
                      "message",
                      "title",
                      "username",
                      "id",
                  ):
                      if value.get(key):
                          return text(
                              value[key]
                          )

              return str(value).strip()

          def ident(value):
              if not isinstance(
                  value,
                  dict,
              ):
                  return ""

              for key in (
                  "id",
                  "post_id",
                  "comment_id",
                  "message_id",
                  "conversation_id",
              ):
                  if value.get(key) is not None:
                      candidate = str(
                          value.get(key)
                      ).strip()

                      if candidate:
                          return candidate

              return ""

          def make_id(*values):
              raw = "|".join(
                  str(value or "")
                  for value in values
              )

              return re.sub(
                  r"[^A-Za-z0-9_.:-]+",
                  "-",
                  raw,
              )[:220]

          core = as_dict(
              load(
                  CORE_MEMORY_FILE,
                  {},
              )
          )

          runtime = as_dict(
              load(
                  CORE_RUNTIME_FILE,
                  {},
              )
          )

          knowledge = as_dict(
              load(
                  KNOWLEDGE_FILE,
                  {},
              )
          )

          presence = as_dict(
              load(
                  PRESENCE_FILE,
                  {},
              )
          )

          runtime.setdefault(
              "pending_actions",
              [],
          )

          runtime.setdefault(
              "decisions",
              [],
          )

          runtime.setdefault(
              "observations",
              [],
          )

          presence.setdefault(
              "runs",
              [],
          )

          presence.setdefault(
              "outcomes",
              [],
          )

          presence.setdefault(
              "actions",
              [],
          )

          presence.setdefault(
              "errors",
              [],
          )

          presence.setdefault(
              "tracked_targets",
              [],
          )

          # ------------------------------------------------------------
          # Policy safety
          # ------------------------------------------------------------

          if os.environ.get(
              "AUTO_PAYMENT"
          ) != "false":
              raise RuntimeError(
                  "AUTO_PAYMENT must remain false."
              )

          if os.environ.get(
              "AUTO_SPENDING"
          ) != "false":
              raise RuntimeError(
                  "AUTO_SPENDING must remain false."
              )

          if os.environ.get(
              "GEMINI_USED"
          ) != "false":
              raise RuntimeError(
                  "GEMINI_USED must remain false."
              )

          if os.environ.get(
              "EXTERNAL_AI_USED"
          ) != "false":
              raise RuntimeError(
                  "EXTERNAL_AI_USED must remain false."
              )

          api_key = os.environ.get(
              "COLONY_API_KEY",
              "",
          ).strip()

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing."
              )

          from colony_sdk import ColonyClient

          client = ColonyClient(api_key)

          print(
              "ColonyClient initialized."
          )

          # ------------------------------------------------------------
          # SDK helpers
          # ------------------------------------------------------------

          def sdk_call(
              method_name,
              *args,
              **kwargs,
          ):
              method = getattr(
                  client,
                  method_name,
                  None,
              )

              if method is None:
                  return {
                      "ok": False,
                      "error": (
                          "SDK method unavailable: "
                          + method_name
                      ),
                  }

              try:
                  value = method(
                      *args,
                      **kwargs,
                  )

                  return {
                      "ok": True,
                      "value": value,
                  }

              except TypeError:
                  try:
                      value = method(*args)

                      return {
                          "ok": True,
                          "value": value,
                      }

                  except Exception as exc:
                      return {
                          "ok": False,
                          "error": str(exc),
                      }

              except Exception as exc:
                  return {
                      "ok": False,
                      "error": str(exc),
                  }

          # ------------------------------------------------------------
          # Bootstrap
          # ------------------------------------------------------------

          bootstrap = getattr(
              client,
              "bootstrap",
              None,
          )

          if callable(bootstrap):
              try:
                  bootstrap()
                  print(
                      "Bootstrap: OK"
                  )
              except Exception as exc:
                  print(
                      "WARNING: bootstrap failed:",
                      exc,
                  )

          # ------------------------------------------------------------
          # SDK capability check
          # ------------------------------------------------------------

          required_methods = (
              "create_comment",
              "create_post",
              "send_message",
              "get_post",
              "get_all_comments",
              "get_for_you_feed",
          )

          missing_methods = [
              method
              for method in required_methods
              if not hasattr(
                  client,
                  method,
              )
          ]

          if missing_methods:
              raise RuntimeError(
                  "Required Colony SDK methods missing: "
                  + ", ".join(
                      missing_methods
                  )
              )

          print(
              "SDK capabilities: OK"
          )

          # ------------------------------------------------------------
          # Helpers for resolving targets
          # ------------------------------------------------------------

          def get_post(post_id):
              if not post_id:
                  return None

              result = sdk_call(
                  "get_post",
                  post_id,
              )

              if not result["ok"]:
                  return None

              return result["value"]

          def get_feed():
              result = sdk_call(
                  "get_for_you_feed"
              )

              if not result["ok"]:
                  print(
                      "WARNING: feed unavailable:",
                      result["error"],
                  )
                  return []

              value = result["value"]

              if isinstance(
                  value,
                  list,
              ):
                  return value

              if isinstance(
                  value,
                  dict,
              ):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "posts",
                  ):
                      if isinstance(
                          value.get(key),
                          list,
                      ):
                          return value[key]

              try:
                  return list(value)
              except Exception:
                  return []

          def resolve_post_id(action):
              target_id = text(
                  action.get(
                      "target_id"
                  )
              )

              if not target_id:
                  return None

              direct = get_post(
                  target_id
              )

              if direct is not None:
                  return target_id

              # Search recent feed for the same target.
              feed = get_feed()

              for post in feed:
                  if not isinstance(
                      post,
                      dict,
                  ):
                      continue

                  candidate = ident(post)

                  if candidate == target_id:
                      return candidate

              return None

          def action_body(action):
              return text(
                  action.get("body")
                  or action.get("reply_text")
                  or action.get("content")
              )

          # ------------------------------------------------------------
          # Existing state
          # ------------------------------------------------------------

          pending = [
              item
              for item in as_list(
                  runtime.get(
                      "pending_actions"
                  )
              )
              if isinstance(
                  item,
                  dict,
              )
          ]

          print(
              "Pending actions:",
              len(pending),
          )

          # Oldest pending actions first.
          pending.sort(
              key=lambda item: text(
                  item.get(
                      "created_at"
                  )
              )
          )

          selected = pending[
              :MAX_ACTIONS
          ]

          print(
              "Selected actions:",
              len(selected),
          )

          executed_ids = set()

          for item in as_list(
              presence.get(
                  "actions"
              )
          ):
              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              action_id = text(
                  item.get(
                      "action_id"
                  )
              )

              if action_id:
                  executed_ids.add(
                      action_id
                  )

          outcomes_this_run = []

          # ------------------------------------------------------------
          # Execute
          # ------------------------------------------------------------

          for action in selected:

              action_id = text(
                  action.get(
                      "action_id"
                  )
              )

              action_type = text(
                  action.get(
                      "type"
                  )
              ).lower()

              body = action_body(
                  action
              )

              target_id = text(
                  action.get(
                      "target_id"
                  )
              )

              recipient = text(
                  action.get(
                      "recipient"
                  )
              )

              print()
              print(
                  "=== ACTION "
                  + action_id
                  + " ==="
              )

              print(
                  "Type:",
                  action_type,
              )

              print(
                  "Target:",
                  target_id,
              )

              # --------------------------------------------------------
              # Safety: no financial action
              # --------------------------------------------------------

              if any(
                  token in action_type
                  for token in (
                      "payment",
                      "pay",
                      "spend",
                      "invoice",
                      "withdraw",
                  )
              ):
                  outcome = {
                      "outcome_id": make_id(
                          "outcome",
                          action_id,
                          run_id,
                      ),
                      "action_id": action_id,
                      "timestamp": now.isoformat(),
                      "status": "blocked",
                      "error": (
                          "Financial action blocked "
                          "by Presence policy."
                      ),
                  }

                  outcomes_this_run.append(
                      outcome
                  )

                  presence[
                      "errors"
                  ].append(
                      outcome
                  )

                  print(
                      "BLOCKED: financial action"
                  )

                  continue

              if not body:
                  outcome = {
                      "outcome_id": make_id(
                          "outcome",
                          action_id,
                          run_id,
                      ),
                      "action_id": action_id,
                      "timestamp": now.isoformat(),
                      "status": "failed",
                      "error": (
                          "Action has no body."
                      ),
                  }

                  outcomes_this_run.append(
                      outcome
                  )

                  presence[
                      "errors"
                  ].append(
                      outcome
                  )

                  continue

              # --------------------------------------------------------
              # DM reply
              # --------------------------------------------------------

              if action_type in (
                  "dm_reply",
                  "message",
                  "send_message",
              ):

                  if not recipient:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "failed",
                          "error": (
                              "DM reply has no "
                              "recipient."
                          ),
                      }

                      outcomes_this_run.append(
                          outcome
                      )

                      presence[
                          "errors"
                      ].append(
                          outcome
                      )

                      continue

                  result = sdk_call(
                      "send_message",
                      recipient,
                      body,
                  )

                  if result["ok"]:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "success",
                          "action_type": action_type,
                          "recipient": recipient,
                      }

                      print(
                          "DM reply: SUCCESS"
                      )

                  else:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "failed",
                          "action_type": action_type,
                          "error": result[
                              "error"
                          ],
                      }

                      print(
                          "DM reply: FAILED:",
                          result["error"],
                      )

                  outcomes_this_run.append(
                      outcome
                  )

                  continue

              # --------------------------------------------------------
              # Public reply
              # --------------------------------------------------------

              if action_type in (
                  "reply",
                  "research_reply",
              ):

                  resolved_post_id = (
                      resolve_post_id(
                          action
                      )
                  )

                  if not resolved_post_id:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "retry",
                          "action_type": action_type,
                          "target_id": target_id,
                          "error": (
                              "Target post could "
                              "not be resolved."
                          ),
                      }

                      outcomes_this_run.append(
                          outcome
                      )

                      print(
                          "Reply: TARGET UNAVAILABLE"
                      )

                      continue

                  result = sdk_call(
                      "create_comment",
                      resolved_post_id,
                      body,
                  )

                  if result["ok"]:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "success",
                          "action_type": action_type,
                          "target_id": resolved_post_id,
                      }

                      print(
                          "Reply: SUCCESS"
                      )

                  else:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "failed",
                          "action_type": action_type,
                          "target_id": resolved_post_id,
                          "error": result[
                              "error"
                          ],
                      }

                      print(
                          "Reply: FAILED:",
                          result["error"],
                      )

                  outcomes_this_run.append(
                      outcome
                  )

                  continue

              # --------------------------------------------------------
              # Publish
              # --------------------------------------------------------

              if action_type in (
                  "publish",
                  "post",
                  "create_post",
              ):

                  title = text(
                      action.get(
                          "title"
                      )
                  )

                  if not title:
                      title = (
                          "NØX research note"
                      )

                  result = sdk_call(
                      "create_post",
                      title,
                      body,
                  )

                  if result["ok"]:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "success",
                          "action_type": action_type,
                      }

                      print(
                          "Publish: SUCCESS"
                      )

                  else:
                      outcome = {
                          "outcome_id": make_id(
                              "outcome",
                              action_id,
                              run_id,
                          ),
                          "action_id": action_id,
                          "timestamp": now.isoformat(),
                          "status": "failed",
                          "action_type": action_type,
                          "error": result[
                              "error"
                          ],
                      }

                      print(
                          "Publish: FAILED:",
                          result["error"],
                      )

                  outcomes_this_run.append(
                      outcome
                  )

                  continue

              # --------------------------------------------------------
              # Unknown action
              # --------------------------------------------------------

              outcome = {
                  "outcome_id": make_id(
                      "outcome",
                      action_id,
                      run_id,
                  ),
                  "action_id": action_id,
                  "timestamp": now.isoformat(),
                  "status": "failed",
                  "error": (
                      "Unsupported action type: "
                      + action_type
                  ),
              }

              outcomes_this_run.append(
                  outcome
              )

              print(
                  "UNKNOWN ACTION TYPE:",
                  action_type,
              )

          # ------------------------------------------------------------
          # Update pending actions
          # ------------------------------------------------------------

          outcome_by_action = {
              text(
                  outcome.get(
                      "action_id"
                  )
              ): outcome
              for outcome in outcomes_this_run
          }

          remaining_actions = []

          for action in pending:

              action_id = text(
                  action.get(
                      "action_id"
                  )
              )

              outcome = (
                  outcome_by_action.get(
                      action_id
                  )
              )

              if outcome is None:
                  remaining_actions.append(
                      action
                  )
                  continue

              status = text(
                  outcome.get(
                      "status"
                  )
              )

              if status == "success":
                  action["status"] = (
                      "executed"
                  )

                  action[
                      "executed_at"
                  ] = now.isoformat()

              elif status == "retry":
                  action["status"] = (
                      "pending"
                  )

                  action["attempts"] = (
                      int(
                          action.get(
                              "attempts",
                              0,
                          )
                      )
                      + 1
                  )

                  remaining_actions.append(
                      action
                  )

              else:
                  action["status"] = (
                      "failed"
                  )

                  action["attempts"] = (
                      int(
                          action.get(
                              "attempts",
                              0,
                          )
                      )
                      + 1
                  )

                  action[
                      "last_error"
                  ] = text(
                      outcome.get(
                          "error"
                      )
                  )

                  # Keep failed actions for retry.
                  remaining_actions.append(
                      action
                  )

          runtime[
              "pending_actions"
          ] = remaining_actions

          # ------------------------------------------------------------
          # Record outcomes
          # ------------------------------------------------------------

          presence[
              "outcomes"
          ].extend(
              outcomes_this_run
          )

          for outcome in outcomes_this_run:
              presence[
                  "actions"
              ].append(
                  {
                      "action_id": outcome.get(
                          "action_id"
                      ),
                      "run_id": run_id,
                      "timestamp": outcome.get(
                          "timestamp"
                      ),
                      "status": outcome.get(
                          "status"
                      ),
                  }
              )

          # ------------------------------------------------------------
          # Observe feed after execution
          # ------------------------------------------------------------

          feed_after = get_feed()

          feed_after = feed_after[
              : int(
                  os.environ[
                      "MAX_FEED_ITEMS"
                  ]
              )
          ]

          presence[
              "tracked_targets"
          ].extend(
              ident(item)
              for item in feed_after
              if isinstance(
                  item,
                  dict,
              )
              and ident(item)
          )

          # ------------------------------------------------------------
          # Semantic bounds
          # ------------------------------------------------------------

          def bound_list(
              obj,
              key,
              limit,
          ):
              value = as_list(
                  obj.get(key)
              )

              if len(value) > limit:
                  obj[key] = value[
                      -limit:
                  ]

          bound_list(
              presence,
              "outcomes",
              MAX_TRACKED,
          )

          bound_list(
              presence,
              "actions",
              MAX_TRACKED,
          )

          bound_list(
              presence,
              "errors",
              MAX_TRACKED,
          )

          bound_list(
              presence,
              "tracked_targets",
              MAX_TRACKED,
          )

          presence["runs"].append(
              {
                  "run_id": run_id,
                  "timestamp": now.isoformat(),
                  "pending_before": len(
                      pending
                  ),
                  "selected": len(
                      selected
                  ),
                  "executed": sum(
                      1
                      for outcome
                      in outcomes_this_run
                      if outcome.get(
                          "status"
                      )
                      == "success"
                  ),
                  "failed": sum(
                      1
                      for outcome
                      in outcomes_this_run
                      if outcome.get(
                          "status"
                      )
                      == "failed"
                  ),
                  "retry": sum(
                      1
                      for outcome
                      in outcomes_this_run
                      if outcome.get(
                          "status"
                      )
                      == "retry"
                  ),
                  "remaining": len(
                      runtime[
                          "pending_actions"
                      ]
                  ),
              }
          )

          bound_list(
              presence,
              "runs",
              MAX_RUNS,
          )

          presence[
              "last_run"
          ] = now.isoformat()

          presence[
              "last_summary"
          ] = {
              "run_id": run_id,
              "selected": len(
                  selected
              ),
              "success": sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "success"
              ),
              "failed": sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "failed"
              ),
              "retry": sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "retry"
              ),
              "pending_after": len(
                  runtime[
                      "pending_actions"
                  ]
              ),
          }

          # ------------------------------------------------------------
          # Persist
          # ------------------------------------------------------------

          save(
              CORE_RUNTIME_FILE,
              runtime,
          )

          save(
              PRESENCE_FILE,
              presence,
          )

          print()
          print(
              "=== PRESENCE SUMMARY ==="
          )
          print(
              "Run:",
              run_id,
          )
          print(
              "Selected:",
              len(selected),
          )
          print(
              "Success:",
              sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "success"
              ),
          )
          print(
              "Failed:",
              sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "failed"
              ),
          )
          print(
              "Retry:",
              sum(
                  1
                  for outcome
                  in outcomes_this_run
                  if outcome.get(
                      "status"
                  )
                  == "retry"
              ),
          )
          print(
              "Pending after:",
              len(
                  runtime[
                      "pending_actions"
                  ]
              ),
          )
          print(
              "=== PRESENCE COMPLETE ==="
          )
          PY

      - name: Validate Presence state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "memory/nox_core_runtime.json",
              "memory/nox_colony_presence.json",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"Missing state file: {filename}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              if not isinstance(
                  data,
                  dict,
              ):
                  raise SystemExit(
                      f"Invalid JSON object: {filename}"
                  )

              print(
                  "VALID:",
                  filename,
              )

          print(
              "Presence state valid."
          )
          PY

      - name: Check whitespace
        run: |
          set -euo pipefail
          git diff --check

      - name: Commit and push state
        shell: bash
        run: |
          set -euo pipefail

          git add \
            memory/nox_core_runtime.json \
            memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "No Presence state changes."
            exit 0
          fi

          git commit -m "chore(nox): update colony presence state"

          git pull --rebase origin main

          git push origin HEAD:main
