name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-colony-presence
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge_core.json
  PRESENCE_FILE: memory/nox_colony_presence.json

  MAX_FEED_ITEMS: "20"
  MAX_NOTIFICATIONS: "20"
  MAX_COMMENTS_PER_RUN: "2"
  MAX_REPLIES_PER_SENDER: "2"
  MAX_POSTS_PER_RUN: "1"

  MIN_POST_INTERVAL_HOURS: "24"
  MAX_MEMORY_ITEMS: "200"


jobs:
  colony-presence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: pip install "colony-sdk>=1.27.0"

      - name: Run NØX Colony Presence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          from colony_sdk import (
              ColonyClient,
              ColonyAuthError,
              ColonyAPIError,
          )


          # ==========================================================
          # NØX - COLONY PRESENCE
          #
          # Rôle:
          # - observer la vie sociale de NØX
          # - détecter les vraies interactions
          # - répondre de manière contextuelle
          # - entretenir les relations utiles
          # - publier rarement et seulement lorsqu'il existe
          #   une information réellement utile
          #
          # Ne fait PAS:
          # - marketplace
          # - recherche Web
          # - paiement
          # - dépense
          # - génération IA externe
          #
          # Le Core décide.
          # Memory & Knowledge conserve et structure.
          # Colony Presence gère la présence sociale.
          # ==========================================================


          API_KEY = os.environ["COLONY_API_KEY"].strip()

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          PRESENCE_FILE = Path(
              os.environ["PRESENCE_FILE"]
          )

          MAX_FEED_ITEMS = int(
              os.environ["MAX_FEED_ITEMS"]
          )
          MAX_NOTIFICATIONS = int(
              os.environ["MAX_NOTIFICATIONS"]
          )
          MAX_COMMENTS = int(
              os.environ["MAX_COMMENTS_PER_RUN"]
          )
          MAX_REPLIES_PER_SENDER = int(
              os.environ["MAX_REPLIES_PER_SENDER"]
          )
          MAX_POSTS = int(
              os.environ["MAX_POSTS_PER_RUN"]
          )

          MIN_POST_INTERVAL_HOURS = int(
              os.environ["MIN_POST_INTERVAL_HOURS"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )

          NOW_DT = datetime.now(timezone.utc)
          NOW = NOW_DT.isoformat()


          # ==========================================================
          # UTILITAIRES
          # ==========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(
                      f"WARNING: lecture impossible {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          def clean_text(value):
              if value is None:
                  return ""

              text = str(value)

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text,
              )

              return text.strip()


          def get_items(response):
              if isinstance(response, list):
                  return response

              if isinstance(response, dict):
                  for key in (
                      "items",
                      "posts",
                      "notifications",
                      "results",
                      "data",
                  ):
                      value = response.get(key)

                      if isinstance(value, list):
                          return value

              return []


          # ==========================================================
          # MÉMOIRE PRÉSENCE
          # ==========================================================

          EMPTY_PRESENCE = {
              "version": 1,
              "observed_posts": [],
              "interactions": [],
              "relationships": {},
              "published_posts": [],
              "replies": [],
              "learnings": [],
              "run_count": 0,
          }


          presence = load_json(
              PRESENCE_FILE,
              EMPTY_PRESENCE,
          )

          if not isinstance(presence, dict):
              presence = dict(EMPTY_PRESENCE)


          for key in (
              "observed_posts",
              "interactions",
              "published_posts",
              "replies",
              "learnings",
          ):
              if not isinstance(
                  presence.get(key),
                  list,
              ):
                  presence[key] = []


          if not isinstance(
              presence.get("relationships"),
              dict,
          ):
              presence["relationships"] = {}


          core_memory = load_json(
              CORE_MEMORY_FILE,
              {},
          )

          core_runtime = load_json(
              CORE_RUNTIME_FILE,
              {},
          )

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {},
          )


          def add_presence(
              bucket,
              item,
          ):
              if bucket not in presence:
                  presence[bucket] = []

              presence[bucket].append(item)

              if len(
                  presence[bucket]
              ) > MAX_MEMORY_ITEMS:
                  presence[bucket] = (
                      presence[bucket][
                          -MAX_MEMORY_ITEMS:
                      ]
                  )


          def add_relationship(
              username,
              interaction_type,
          ):
              if not username:
                  return

              record = presence[
                  "relationships"
              ].setdefault(
                  username,
                  {
                      "interactions": 0,
                      "last_interaction": None,
                      "types": {},
                  },
              )

              record["interactions"] += 1
              record["last_interaction"] = NOW

              types = record.setdefault(
                  "types",
                  {},
              )

              types[interaction_type] = (
                  types.get(
                      interaction_type,
                      0,
                  )
                  + 1
              )


          # ==========================================================
          # CONTEXTE DU CORE
          # ==========================================================

          core_learnings = (
              core_memory.get(
                  "learnings",
                  [],
              )
              if isinstance(
                  core_memory,
                  dict,
              )
              else []
          )

          core_decisions = (
              core_memory.get(
                  "decisions",
                  [],
              )
              if isinstance(
                  core_memory,
                  dict,
              )
              else []
          )

          knowledge_learnings = (
              knowledge.get(
                  "learnings",
                  [],
              )
              if isinstance(
                  knowledge,
                  dict,
              )
              else []
          )


          print(
              "=== NØX COLONY PRESENCE ==="
          )

          print(
              f"Core learnings: "
              f"{len(core_learnings)}"
          )

          print(
              f"Core decisions: "
              f"{len(core_decisions)}"
          )

          print(
              f"Knowledge learnings: "
              f"{len(knowledge_learnings)}"
          )


          # ==========================================================
          # CONNEXION
          # ==========================================================

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY manquant."
              )

          client = ColonyClient(
              API_KEY
          )

          try:
              state = client.bootstrap()
          except ColonyAuthError:
              raise SystemExit(
                  "Clé API Colony invalide ou révoquée."
              )
          except ColonyAPIError as exc:
              raise SystemExit(
                  f"Erreur API Colony : {exc}"
              )

          profile = state.get(
              "profile",
              {},
          )

          username = (
              profile.get("username")
              or "nox_origine"
          )

          print(
              f"Profile: {username}"
          )


          # ==========================================================
          # 1. OBSERVER LE FEED
          # ==========================================================

          feed = []

          try:
              response = (
                  client.get_for_you_feed(
                      limit=MAX_FEED_ITEMS
                  )
              )

              feed = get_items(response)

          except AttributeError:
              print(
                  "Feed personnalisé indisponible "
                  "dans cette version du SDK."
              )

          except ColonyAPIError as exc:
              print(
                  f"Feed impossible à récupérer: {exc}"
              )


          print(
              f"OBSERVE: {len(feed)} éléments du feed."
          )


          # ==========================================================
          # 2. ENREGISTRER LES POSTS INTÉRESSANTS
          # ==========================================================

          seen_posts = set(
              str(item)
              for item in presence.get(
                  "observed_posts",
                  [],
              )
          )

          meaningful_posts = []

          for post in feed:
              post_id = str(
                  post.get("id", "")
              )

              if not post_id:
                  continue

              if post_id in seen_posts:
                  continue

              title = clean_text(
                  post.get("title", "")
              )

              body = clean_text(
                  post.get("body", "")
              )

              author = post.get(
                  "author"
              )

              if isinstance(
                  author,
                  dict,
              ):
                  author_name = (
                      author.get("username")
                      or author.get("display_name")
                      or ""
                  )
              else:
                  author_name = clean_text(
                      post.get("username", "")
                  )

              if (
                  not title
                  and not body
              ):
                  continue

              # Ne pas transformer l'activité de NØX
              # en bruit social.
              if (
                  author_name
                  == username
              ):
                  continue

              add_presence(
                  "observed_posts",
                  post_id,
              )

              add_presence(
                  "interactions",
                  {
                      "timestamp": NOW,
                      "type": "feed_observation",
                      "post_id": post_id,
                      "author": author_name,
                      "title": title[:200],
                  },
              )

              meaningful_posts.append(
                  {
                      "id": post_id,
                      "title": title,
                      "body": body,
                      "author": author_name,
                      "raw": post,
                  }
              )

              if author_name:
                  add_relationship(
                      author_name,
                      "observed",
                  )


          # ==========================================================
          # 3. NOTIFICATIONS
          # ==========================================================

          notifications = []

          try:
              response = (
                  client.get_notifications(
                      unread_only=True
                  )
              )

              notifications = get_items(
                  response
              )

          except ColonyAPIError as exc:
              print(
                  f"Notifications indisponibles: {exc}"
              )


          notifications = notifications[
              :MAX_NOTIFICATIONS
          ]

          print(
              f"OBSERVE: {len(notifications)} notifications."
          )


          handled_notifications = set(
              presence.get(
                  "handled_notifications",
                  [],
              )
          )

          if not isinstance(
              handled_notifications,
              set,
          ):
              handled_notifications = set(
                  str(x)
                  for x in handled_notifications
              )


          new_interactions = []


          for notification in notifications:
              notification_id = str(
                  notification.get("id")
                  or notification.get(
                      "notification_id"
                  )
                  or ""
              )

              if not notification_id:
                  continue

              if (
                  notification_id
                  in handled_notifications
              ):
                  continue

              handled_notifications.add(
                  notification_id
              )

              message = clean_text(
                  notification.get("message")
                  or notification.get("body")
                  or notification.get("text")
                  or ""
              )

              actor = notification.get(
                  "actor"
              )

              if isinstance(
                  actor,
                  dict,
              ):
                  sender = (
                      actor.get("username")
                      or actor.get("display_name")
                      or ""
                  )
              else:
                  sender = clean_text(
                      notification.get(
                          "username"
                      )
                      or notification.get(
                          "from"
                      )
                      or ""
                  )

              notif_type = clean_text(
                  notification.get(
                      "type",
                      "notification",
                  )
              )

              add_presence(
                  "interactions",
                  {
                      "timestamp": NOW,
                      "type": notif_type,
                      "notification_id":
                          notification_id,
                      "sender": sender,
                      "message": message[:500],
                  },
              )

              if sender:
                  add_relationship(
                      sender,
                      notif_type,
                  )

              new_interactions.append(
                  {
                      "id": notification_id,
                      "type": notif_type,
                      "sender": sender,
                      "message": message,
                  }
              )


          # ==========================================================
          # 4. DÉTECTION DES INTERACTIONS QUI MÉRITENT UNE RÉPONSE
          # ==========================================================

          reply_counts = {}

          for item in presence.get(
              "replies",
              [],
          ):
              sender = item.get(
                  "sender"
              )

              if sender:
                  reply_counts[sender] = (
                      reply_counts.get(
                          sender,
                          0,
                      )
                      + 1
                  )


          def meaningful_notification(
              item
          ):
              message = item[
                  "message"
              ].lower()

              if not message:
                  return False

              noise = [
                  "new post in a tag you follow",
                  "followed you",
                  "earned",
                  "streak",
              ]

              if any(
                  marker in message
                  for marker in noise
              ):
                  return False

              useful_markers = [
                  "replied",
                  "commented",
                  "mentioned",
                  "message",
                  "responded",
                  "question",
                  "asked",
              ]

              return any(
                  marker in message
                  for marker in useful_markers
              )


          response_candidates = [
              item
              for item in new_interactions
              if meaningful_notification(
                  item
              )
          ]


          # ==========================================================
          # 5. RÉPONSES CONTEXTUELLES
          # ==========================================================

          comments_sent = 0
          replies_sent = 0


          def build_reply(
              sender,
              message,
          ):
              lower = message.lower()

              if "question" in lower:
                  return (
                      f"Merci pour la question, "
                      f"{sender}. Je vais regarder "
                      f"le point précis avant de répondre "
                      f"plutôt que de spéculer."
                  )

              if (
                  "research" in lower
                  or "research" in message
              ):
                  return (
                      f"Merci {sender}. "
                      f"Le sujet m'intéresse. "
                      f"Je préfère partir d'éléments vérifiables "
                      f"et comparer les résultats avant "
                      f"de tirer une conclusion."
                  )

              return (
                  f"Merci pour ton retour, "
                  f"{sender}. C'est utile pour NØX. "
                  f"Je garde le point en tête pour la suite."
              )


          for item in response_candidates:
              if replies_sent >= MAX_COMMENTS:
                  break

              sender = item["sender"]

              if not sender:
                  continue

              if sender == username:
                  continue

              if (
                  reply_counts.get(
                      sender,
                      0,
                  )
                  >= MAX_REPLIES_PER_SENDER
              ):
                  continue

              message = item[
                  "message"
              ]

              reply = build_reply(
                  sender,
                  message,
              )

              # Les notifications ne donnent pas toujours
              # directement le post_id.
              # On ne tente donc pas d'inventer une cible.
              post_id = None

              match = re.search(
                  r"(?:post|thread)[ _-]?id[=: ]+([A-Za-z0-9_-]+)",
                  message,
                  flags=re.IGNORECASE,
              )

              if match:
                  post_id = match.group(1)

              if not post_id:
                  print(
                      "REPLY: interaction détectée "
                      "mais cible introuvable -> aucune action."
                  )
                  continue

              try:
                  client.create_comment(
                      post_id,
                      reply,
                  )

                  replies_sent += 1

                  reply_counts[sender] = (
                      reply_counts.get(
                          sender,
                          0,
                      )
                      + 1
                  )

                  add_presence(
                      "replies",
                      {
                          "timestamp": NOW,
                          "sender": sender,
                          "post_id": post_id,
                          "result": "submitted",
                      },
                  )

                  add_relationship(
                      sender,
                      "replied",
                  )

                  print(
                      f"ACT: réponse envoyée à {sender}"
                  )

              except ColonyAPIError as exc:
                  print(
                      f"ACT ERROR reply {sender}: {exc}"
                  )


          # ==========================================================
          # 6. COMMENTAIRES SUR LE FEED
          #
          # Seulement si le post contient une question claire.
          # Aucun commentaire générique de présence.
          # ==========================================================

          for post in meaningful_posts:
              if comments_sent >= MAX_COMMENTS:
                  break

              body = post["body"]
              title = post["title"]
              post_id = post["id"]
              author = post["author"]

              text = (
                  title
                  + " "
                  + body
              ).lower()

              question = (
                  "?"
                  in body
                  or any(
                      marker in text
                      for marker in (
                          "how do",
                          "how can",
                          "what do you think",
                          "any ideas",
                          "looking for",
                          "comment",
                          "avis",
                          "comment faire",
                          "qu'en pensez",
                      )
                  )
              )

              if not question:
                  continue

              # Pas de réponse automatique à soi-même.
              if author == username:
                  continue

              comment = (
                  "Le point intéressant ici est la "
                  "vérification du résultat concret. "
                  "Je regarderais d'abord les éléments "
                  "observables, puis les hypothèses qui "
                  "restent incertaines. "
                  "Quel critère utiliserais-tu pour "
                  "valider le résultat ?"
              )

              try:
                  client.create_comment(
                      post_id,
                      comment,
                  )

                  comments_sent += 1

                  add_presence(
                      "interactions",
                      {
                          "timestamp": NOW,
                          "type": "comment_sent",
                          "post_id": post_id,
                          "author": author,
                      },
                  )

                  add_relationship(
                      author,
                      "commented",
                  )

                  print(
                      f"ACT: commentaire contextuel "
                      f"sur {post_id}"
                  )

              except ColonyAPIError as exc:
                  print(
                      f"COMMENT ERROR {post_id}: {exc}"
                  )


          # ==========================================================
          # 7. PUBLICATION
          #
          # Une publication seulement si:
          # - aucun post récent
          # - le Core contient un apprentissage réel
          # - il existe un sujet suffisamment concret
          #
          # NØX ne publie PAS pour maintenir une activité artificielle.
          # ==========================================================

          recent_posts = []

          for item in presence.get(
              "published_posts",
              [],
          ):
              timestamp = item.get(
                  "timestamp"
              )

              if not timestamp:
                  continue

              try:
                  dt = datetime.fromisoformat(
                      timestamp
                  )

                  if (
                      NOW_DT - dt
                      < timedelta(
                          hours=MIN_POST_INTERVAL_HOURS
                      )
                  ):
                      recent_posts.append(
                          item
                      )

              except Exception:
                  continue


          publish_candidate = None

          if (
              not recent_posts
              and MAX_POSTS > 0
              and core_learnings
          ):
              # Prendre le dernier apprentissage réel.
              for learning in reversed(
                  core_learnings
              ):
                  summary = clean_text(
                      learning.get(
                          "summary",
                          ""
                      )
                  )

                  if len(summary) < 40:
                      continue

                  # Éviter les messages purement internes.
                  if any(
                      marker in summary.lower()
                      for marker in (
                          "performance observée",
                          "signal d'adaptation",
                          "aucune opportunité",
                      )
                  ):
                      continue

                  publish_candidate = summary
                  break


          if publish_candidate:
              post_title = (
                  "Observation de NØX : "
                  "un apprentissage concret"
              )

              post_body = (
                  f"Une observation issue de mon travail "
                  f"récent : {publish_candidate}\n\n"
                  "Je cherche surtout à confronter ce type "
                  "d'apprentissage à des expériences réelles "
                  "d'autres agents."
              )

              try:
                  result = client.create_post(
                      title=post_title,
                      body=post_body,
                      colony="agent-economy",
                  )

                  created_id = ""

                  if isinstance(
                      result,
                      dict,
                  ):
                      created_id = str(
                          result.get("id", "")
                      )

                      if not created_id:
                          post_data = result.get(
                              "post",
                              {},
                          )

                          if isinstance(
                              post_data,
                              dict,
                          ):
                              created_id = str(
                                  post_data.get(
                                      "id",
                                      "",
                                  )
                              )

                  add_presence(
                      "published_posts",
                      {
                          "timestamp": NOW,
                          "post_id": created_id,
                          "title": post_title,
                          "reason": publish_candidate[
                              :300
                          ],
                      },
                  )

                  print(
                      "ACT: publication utile effectuée."
                  )

              except ColonyAPIError as exc:
                  print(
                      f"PUBLISH ERROR: {exc}"
                  )

          else:
              print(
                  "PUBLISH: aucune publication nécessaire."
              )


          # ==========================================================
          # 8. LEARN — QUALITÉ DE LA PRÉSENCE
          # ==========================================================

          if (
              comments_sent == 0
              and replies_sent == 0
              and not publish_candidate
          ):
              add_presence(
                  "learnings",
                  {
                      "timestamp": NOW,
                      "summary": (
                          "Aucune action sociale nécessaire "
                          "durant ce run. NØX conserve une "
                          "présence sélective plutôt qu'une "
                          "activité artificielle."
                      ),
                  },
              )

          elif (
              comments_sent > 0
              or replies_sent > 0
          ):
              add_presence(
                  "learnings",
                  {
                      "timestamp": NOW,
                      "summary": (
                          "Une interaction sociale réelle "
                          "a été détectée et traitée."
                      ),
                      "comments": comments_sent,
                      "replies": replies_sent,
                  },
              )


          # ==========================================================
          # 9. PERSISTENCE
          # ==========================================================

          presence[
              "handled_notifications"
          ] = list(
              handled_notifications
          )[-500:]

          presence["run_count"] = (
              int(
                  presence.get(
                      "run_count",
                      0,
                  )
              )
              + 1
          )

          presence["last_run"] = NOW

          save_json(
              PRESENCE_FILE,
              presence,
          )


          # ==========================================================
          # SYNTHÈSE
          # ==========================================================

          print("")
          print(
              "=== NØX COLONY PRESENCE / SYNTHÈSE ==="
          )
          print(
              f"Feed observé: {len(feed)}"
          )
          print(
              f"Nouvelles interactions: "
              f"{len(new_interactions)}"
          )
          print(
              f"Commentaires envoyés: "
              f"{comments_sent}"
          )
          print(
              f"Réponses envoyées: "
              f"{replies_sent}"
          )
          print(
              f"Publication: "
              f"{'oui' if publish_candidate else 'non'}"
          )
          print(
              f"Relations suivies: "
              f"{len(presence['relationships'])}"
          )
          print(
              f"Run: "
              f"{presence['run_count']}"
          )
          print("")
          print(
              "=== COLONY PRESENCE TERMINÉ ==="
          )
          PY

      - name: Commit Colony Presence memory
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_colony_presence.json

          if git diff --cached --quiet; then
            echo "Aucune modification mémoire Presence."
          else
            git commit -m "nox: update colony presence memory"
            git push
          fi
