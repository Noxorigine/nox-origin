name: NØX - Colony Presence

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  EXTERNAL_AI_USED: "false"
  GEMINI_USED: "false"
  PROJECT_COST_EUR: "0"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update heartbeat and log
        run: |
          set -euo pipefail
          mkdir -p data

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc).isoformat()
          status = {
              "agent": "NØX",
              "state": "inactive",
              "detail": "Présence vérifiée ; aucune action publique exécutée.",
              "timestamp": now,
              "external_ai_used": False,
              "cost_eur": 0,
              "automatic_payment": False,
              "automatic_spending": False,
          }

          Path("data/heartbeat.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with Path("data/presence.log").open("a", encoding="utf-8") as log:
              log.write(
                  f"{now} [INFO] Présence vérifiée ; aucune action publique.\n"
              )

          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit presence state
        run: |
          set -euo pipefail
          git config user.name "NØX"
          git config user.email "nox-agent@users.noreply.github.com"

          git add data/heartbeat.json data/presence.log

          if ! git diff --cached --quiet; then
            git commit -m "chore(nox): update presence heartbeat"
            git push
          else
            echo "État de présence inchangé."
          fi
