name: NØX - Colony Presence

on:
workflow_dispatch:
schedule:
- cron: "17 */2 * * *"

permissions:
contents: write

concurrency:
group: nox-colony-presence
cancel-in-progress: false

env:
CORE_MEMORY_FILE: memory/nox_core_memory.json
CORE_RUNTIME_FILE: memory/nox_core_runtime.json
KNOWLEDGE_FILE: memory/nox_knowledge.json
PRESENCE_FILE: memory/nox_colony_presence.json

MAX_FEED_ITEMS: "25"
MAX_NOTIFICATIONS: "25"
MAX_COMMENTS_PER_RUN: "2"
MAX_REPLIES_PER_RUN: "2"
MAX_REPLIES_PER_SENDER: "2"
MAX_POSTS_PER_RUN: "1"

MIN_POST_INTERVAL_HOURS: "24"
MAX_MEMORY_ITEMS: "300"
MAX_HANDLED_NOTIFICATIONS: "1000"
MAX_CONTEXT_CHARS: "6000"

jobs:
colony-presence:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Colony SDK
    run: |
      python -m pip install --upgrade pip
      pip install "colony-sdk>=1.27.0"

  - name: Run NØX Colony Presence
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
    run: |
      python3 - <<'PY'
      import json
      import os
      import re
      from datetime import datetime, timezone, timedelta
      from pathlib import Path

      from colony_sdk import (
          ColonyClient,
          ColonyAuthError,
          ColonyAPIError,
      )


      # ==========================================================
      # NØX - COLONY PRESENCE
      #
      # ROLE IN THE 4-WORKFLOW ARCHITECTURE
      #
      # CORE
      #   ↓
      # MEMORY & KNOWLEDGE
      #   ↓
      # COLONY PRESENCE
      #   ↓
      # observe / understand / communicate
      #   ↓
      # result
      #   ↓
      # MEMORY & KNOWLEDGE
      #   ↓
      # CORE
      #
      # This workflow is NOT an independent brain.
      #
      # It does not:
      # - perform marketplace actions
      # - perform payments
      # - use Gemini
      # - use external AI
      # - invent missing context
      #
      # It does:
      # - observe Colony activity
      # - identify meaningful interactions
      # - use available Core/Knowledge context
      # - respond when there is a real reason
      # - prefer conversation over generic engagement
      # - publish rarely and only when justified
      # - record outcomes for the next cognitive cycle
      #
      # PUBLIC LANGUAGE POLICY
      # - English by default for public posts/comments
      # - reply in the language of the conversation when clear
      # - support common Colony languages without external AI
      # - use English when language confidence is insufficient
      # - never translate blindly just to create activity
      # ==========================================================


      API_KEY = os.environ["COLONY_API_KEY"].strip()

      CORE_MEMORY_FILE = Path(
          os.environ["CORE_MEMORY_FILE"]
      )
      CORE_RUNTIME_FILE = Path(
          os.environ["CORE_RUNTIME_FILE"]
      )
      KNOWLEDGE_FILE = Path(
          os.environ["KNOWLEDGE_FILE"]
      )
      PRESENCE_FILE = Path(
          os.environ["PRESENCE_FILE"]
      )

      MAX_FEED_ITEMS = int(
          os.environ["MAX_FEED_ITEMS"]
      )
      MAX_NOTIFICATIONS = int(
          os.environ["MAX_NOTIFICATIONS"]
      )
      MAX_COMMENTS = int(
          os.environ["MAX_COMMENTS_PER_RUN"]
      )
      MAX_REPLIES = int(
          os.environ["MAX_REPLIES_PER_RUN"]
      )
      MAX_REPLIES_PER_SENDER = int(
          os.environ["MAX_REPLIES_PER_SENDER"]
      )
      MAX_POSTS = int(
          os.environ["MAX_POSTS_PER_RUN"]
      )
      MIN_POST_INTERVAL_HOURS = int(
          os.environ["MIN_POST_INTERVAL_HOURS"]
      )
      MAX_MEMORY_ITEMS = int(
          os.environ["MAX_MEMORY_ITEMS"]
      )
      MAX_HANDLED_NOTIFICATIONS = int(
          os.environ["MAX_HANDLED_NOTIFICATIONS"]
      )
      MAX_CONTEXT_CHARS = int(
          os.environ["MAX_CONTEXT_CHARS"]
      )

      NOW_DT = datetime.now(timezone.utc)
      NOW = NOW_DT.isoformat()


      # ==========================================================
      # UTILITIES
      # ==========================================================

      def load_json(path, default):
          if not path.exists():
              return default

          try:
              return json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as exc:
              print(
                  f"WARNING: cannot read {path}: {exc}"
              )
              return default


      def save_json(path, data):
          path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          tmp = path.with_suffix(
              path.suffix + ".tmp"
          )

          tmp.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          tmp.replace(path)


      def clean_text(value):
          if value is None:
              return ""

          text = str(value)

          text = re.sub(
              r"<[^>]+>",
              " ",
              text,
          )

          text = re.sub(
              r"\s+",
              " ",
              text,
          )

          return text.strip()


      def get_items(response):
          if isinstance(response, list):
              return response

          if isinstance(response, dict):
              for key in (
                  "items",
                  "posts",
                  "notifications",
                  "results",
                  "data",
              ):
                  value = response.get(key)

                  if isinstance(value, list):
                      return value

          return []


      def first_value(data, keys):
          if not isinstance(data, dict):
              return None

          for key in keys:
              value = data.get(key)

              if value not in (
                  None,
                  "",
              ):
                  return value

          return None


      def author_name(item):
          if not isinstance(item, dict):
              return ""

          author = item.get("author")

          if isinstance(author, dict):
              return clean_text(
                  first_value(
                      author,
                      (
                          "username",
                          "handle",
                          "display_name",
                          "name",
                      ),
                  )
                  or ""
              )

          return clean_text(
              first_value(
                  item,
                  (
                      "username",
                      "author_username",
                      "author_name",
                  ),
              )
              or ""
          )


      def post_id_from_item(item):
          if not isinstance(item, dict):
              return ""

          value = first_value(
              item,
              (
                  "id",
                  "post_id",
                  "thread_id",
              ),
          )

          return str(value) if value else ""


      def notification_id(item):
          if not isinstance(item, dict):
              return ""

          value = first_value(
              item,
              (
                  "id",
                  "notification_id",
              ),
          )

          return str(value) if value else ""


      def notification_sender(item):
          if not isinstance(item, dict):
              return ""

          actor = item.get("actor")

          if isinstance(actor, dict):
              return clean_text(
                  first_value(
                      actor,
                      (
                          "username",
                          "handle",
                          "display_name",
                          "name",
                      ),
                  )
                  or ""
              )

          return clean_text(
              first_value(
                  item,
                  (
                      "username",
                      "from",
                      "sender",
                      "sender_username",
                      "actor_username",
                  ),
              )
              or ""
          )


      def notification_message(item):
          if not isinstance(item, dict):
              return ""

          return clean_text(
              first_value(
                  item,
                  (
                      "message",
                      "body",
                      "text",
                      "content",
                  ),
              )
              or ""
          )


      def notification_target(item):
          if not isinstance(item, dict):
              return ""

          direct = first_value(
              item,
              (
                  "post_id",
                  "thread_id",
                  "target_post_id",
                  "target_thread_id",
              ),
          )

          if direct:
              return str(direct)

          nested = item.get("post")

          if isinstance(nested, dict):
              value = first_value(
                  nested,
                  (
                      "id",
                      "post_id",
                  ),
              )

              if value:
                  return str(value)

          nested = item.get("thread")

          if isinstance(nested, dict):
              value = first_value(
                  nested,
                  (
                      "id",
                      "thread_id",
                  ),
              )

              if value:
                  return str(value)

          return ""


      def add_memory(bucket, item):
          values = presence.setdefault(
              bucket,
              [],
          )

          values.append(item)

          if len(values) > MAX_MEMORY_ITEMS:
              del values[
                  :len(values) - MAX_MEMORY_ITEMS
              ]


      def add_relationship(
          username,
          interaction_type,
      ):
          username = clean_text(username)

          if not username:
              return

          if username == username_self:
              return

          relationships = presence.setdefault(
              "relationships",
              {},
          )

          record = relationships.setdefault(
              username,
              {
                  "interactions": 0,
                  "last_interaction": None,
                  "types": {},
              },
          )

          record["interactions"] = (
              int(
                  record.get(
                      "interactions",
                      0,
                  )
              )
              + 1
          )

          record["last_interaction"] = NOW

          types = record.setdefault(
              "types",
              {},
          )

          types[interaction_type] = (
              int(
                  types.get(
                      interaction_type,
                      0,
                  )
              )
              + 1
          )


      # ==========================================================
      # LOAD SHARED COGNITIVE CONTEXT
      # ==========================================================

      EMPTY_PRESENCE = {
          "version": 2,
          "observed_posts": [],
          "interactions": [],
          "relationships": {},
          "published_posts": [],
          "replies": [],
          "comments": [],
          "outcomes": [],
          "learnings": [],
          "handled_notifications": [],
          "run_count": 0,
          "last_run": None,
      }

      presence = load_json(
          PRESENCE_FILE,
          EMPTY_PRESENCE,
      )

      if not isinstance(
          presence,
          dict,
      ):
          presence = dict(
              EMPTY_PRESENCE
          )

      for key in (
          "observed_posts",
          "interactions",
          "published_posts",
          "replies",
          "comments",
          "outcomes",
          "learnings",
          "handled_notifications",
      ):
          if not isinstance(
              presence.get(key),
              list,
          ):
              presence[key] = []

      if not isinstance(
          presence.get("relationships"),
          dict,
      ):
          presence["relationships"] = {}


      core_memory = load_json(
          CORE_MEMORY_FILE,
          {},
      )

      core_runtime = load_json(
          CORE_RUNTIME_FILE,
          {},
      )

      knowledge = load_json(
          KNOWLEDGE_FILE,
          {},
      )


      def recent_records(
          value,
          limit=8,
      ):
          if isinstance(
              value,
              list,
          ):
              return value[-limit:]

          return []


      core_learnings = (
          recent_records(
              core_memory.get(
                  "learnings",
                  [],
              )
          )
          if isinstance(
              core_memory,
              dict,
          )
          else []
      )

      core_decisions = (
          recent_records(
              core_memory.get(
                  "decisions",
                  [],
              )
          )
          if isinstance(
              core_memory,
              dict,
          )
          else []
      )

      knowledge_learnings = (
          recent_records(
              knowledge.get(
                  "learnings",
                  [],
              )
          )
          if isinstance(
              knowledge,
              dict,
          )
          else []
      )


      print(
          "=== NØX COLONY PRESENCE ==="
      )

      print(
          f"Core learnings loaded: "
          f"{len(core_learnings)}"
      )

      print(
          f"Core decisions loaded: "
          f"{len(core_decisions)}"
      )

      print(
          f"Knowledge learnings loaded: "
          f"{len(knowledge_learnings)}"
      )


      # ==========================================================
      # CONNECTION
      # ==========================================================

      if not API_KEY:
          raise SystemExit(
              "COLONY_API_KEY missing."
          )

      client = ColonyClient(
          API_KEY
      )

      try:
          state = client.bootstrap()

      except ColonyAuthError:
          raise SystemExit(
              "Colony API key invalid or revoked."
          )

      except ColonyAPIError as exc:
          raise SystemExit(
              f"Colony API error: {exc}"
          )

      profile = state.get(
          "profile",
          {},
      )

      username_self = clean_text(
          first_value(
              profile,
              (
                  "username",
                  "handle",
                  "display_name",
              ),
          )
          or "nox_origine"
      )

      print(
          f"Profile: {username_self}"
      )


      # ==========================================================
      # 1. OBSERVE FEED
      # ==========================================================

      try:
          response = (
              client.get_for_you_feed(
                  limit=MAX_FEED_ITEMS
              )
          )

          feed = get_items(response)

      except AttributeError:
          print(
              "Feed unavailable in this SDK version."
          )
          feed = []

      except ColonyAPIError as exc:
          print(
              f"Feed unavailable: {exc}"
          )
          feed = []


      print(
          f"OBSERVE: {len(feed)} feed items."
      )


      observed_ids = set(
          str(x)
          for x in presence.get(
              "observed_posts",
              [],
          )
      )

      new_posts = []


      for post in feed:
          if not isinstance(
              post,
              dict,
          ):
              continue

          pid = post_id_from_item(post)

          if not pid:
              continue

          if pid in observed_ids:
              continue

          title = clean_text(
              first_value(
                  post,
                  (
                      "title",
                      "subject",
                  ),
              )
              or ""
          )

          body = clean_text(
              first_value(
                  post,
                  (
                      "body",
                      "content",
                      "text",
                      "description",
                  ),
              )
              or ""
          )

          author = author_name(post)

          if not title and not body:
              continue

          if author == username_self:
              continue

          add_memory(
              "observed_posts",
              pid,
          )

          add_memory(
              "interactions",
              {
                  "timestamp": NOW,
                  "type": "feed_observation",
                  "post_id": pid,
                  "author": author,
                  "title": title[:250],
              },
          )

          new_posts.append(
              {
                  "id": pid,
                  "title": title,
                  "body": body,
                  "author": author,
                  "raw": post,
              }
          )

          if author:
              add_relationship(
                  author,
                  "observed",
              )


      # ==========================================================
      # 2. OBSERVE NOTIFICATIONS
      # ==========================================================

      try:
          response = (
              client.get_notifications(
                  unread_only=True
              )
          )

          notifications = get_items(
              response
          )

      except ColonyAPIError as exc:
          print(
              f"Notifications unavailable: {exc}"
          )
          notifications = []


      notifications = notifications[
          :MAX_NOTIFICATIONS
      ]

      print(
          f"OBSERVE: {len(notifications)} notifications."
      )


      handled = set(
          str(x)
          for x in presence.get(
              "handled_notifications",
              [],
          )
      )

      new_interactions = []


      for item in notifications:
          nid = notification_id(item)

          if not nid:
              continue

          if nid in handled:
              continue

          sender = notification_sender(
              item
          )

          message = notification_message(
              item
          )

          notif_type = clean_text(
              first_value(
                  item,
                  (
                      "type",
                      "event_type",
                  ),
              )
              or "notification"
          )

          target_id = notification_target(
              item
          )

          handled.add(nid)

          record = {
              "timestamp": NOW,
              "type": notif_type,
              "notification_id": nid,
              "sender": sender,
              "message": message[:1000],
              "post_id": target_id or None,
          }

          add_memory(
              "interactions",
              record,
          )

          if sender:
              add_relationship(
                  sender,
                  notif_type,
              )

          new_interactions.append(
              record
          )


      # ==========================================================
      # 3. UNDERSTAND INTERACTIONS
      # ==========================================================

      def is_noise(message):
          text = clean_text(
              message
          ).lower()

          if not text:
              return True

          noise = (
              "new post in a tag you follow",
              "followed you",
              "earned",
              "streak",
              "badge",
              "upvote",
              "downvote",
          )

          return any(
              marker in text
              for marker in noise
          )


      def is_direct_interaction(
          item
      ):
          if not isinstance(
              item,
              dict,
          ):
              return False

          message = clean_text(
              item.get(
                  "message",
                  "",
              )
          )

          if is_noise(message):
              return False

          interaction_type = (
              clean_text(
                  item.get(
                      "type",
                      "",
                  )
              )
              .lower()
          )

          direct_types = (
              "reply",
              "replied",
              "comment",
              "commented",
              "mention",
              "mentioned",
              "message",
              "question",
              "response",
          )

          if any(
              value in interaction_type
              for value in direct_types
          ):
              return True

          markers = (
              "replied",
              "commented",
              "mentioned",
              "asked",
              "responded",
              "question",
          )

          return any(
              marker in message.lower()
              for marker in markers
          )


      response_candidates = [
          item
          for item in new_interactions
          if is_direct_interaction(item)
      ]


      # ==========================================================
      # 4. BUILD A SMALL SHARED CONTEXT
      #
      # The Presence workflow does not become an AI engine.
      # It only exposes relevant structured context to its
      # deterministic response policy.
      # ==========================================================

      context_parts = []

      for learning in core_learnings:
          if isinstance(
              learning,
              dict,
          ):
              text = clean_text(
                  learning.get(
                      "summary",
                      ""
                  )
                  or learning.get(
                      "lesson",
                      ""
                  )
                  or learning.get(
                      "content",
                      ""
                  )
              )

              if text:
                  context_parts.append(
                      "Core learning: " + text
                  )

      for decision in core_decisions:
          if isinstance(
              decision,
              dict,
          ):
              text = clean_text(
                  decision.get(
                      "summary",
                      ""
                  )
                  or decision.get(
                      "decision",
                      ""
                  )
                  or decision.get(
                      "action",
                      ""
                  )
              )

              if text:
                  context_parts.append(
                      "Core decision: " + text
                  )

      for learning in knowledge_learnings:
          if isinstance(
              learning,
              dict,
          ):
              text = clean_text(
                  learning.get(
                      "summary",
                      ""
                  )
                  or learning.get(
                      "lesson",
                      ""
                  )
                  or learning.get(
                      "content",
                      ""
                  )
              )

              if text:
                  context_parts.append(
                      "Knowledge: " + text
                  )

      shared_context = "\n".join(
          context_parts
      )[:MAX_CONTEXT_CHARS]


      # ==========================================================
      # 5. LANGUAGE DETECTION
      #
      # Deterministic and local.
      #
      # No translation service.
      # No Gemini.
      # No external AI.
      #
      # English is the default public language.
      # A language switch happens only when enough linguistic
      # evidence is present.
      # ==========================================================

      LANGUAGE_MARKERS = {
          "fr": (
              " le ",
              " la ",
              " les ",
              " des ",
              " une ",
              " un ",
              " est ",
              " avec ",
              " pour ",
              " dans ",
              " que ",
              " vous ",
              " nous ",
              " merci ",
              " comment ",
              " pourquoi ",
              " mais ",
              " cette ",
              " ces ",
              " votre ",
              " notre ",
              " aussi ",
              " peut ",
              " peux ",
              " faire ",
              " être ",
              " idée ",
              " recherche ",
              " preuve ",
              " résultat ",
          ),
          "es": (
              " el ",
              " la ",
              " los ",
              " las ",
              " una ",
              " un ",
              " es ",
              " con ",
              " para ",
              " por ",
              " que ",
              " usted ",
              " nosotros ",
              " gracias ",
              " cómo ",
              " porque ",
              " pero ",
              " esta ",
              " estas ",
              " este ",
              " nuestro ",
              " también ",
              " puede ",
              " hacer ",
              " idea ",
              " investigación ",
              " prueba ",
              " resultado ",
          ),
          "de": (
              " der ",
              " die ",
              " das ",
              " den ",
              " dem ",
              " ein ",
              " eine ",
              " ist ",
              " mit ",
              " für ",
              " von ",
              " und ",
              " nicht ",
              " ich ",
              " wir ",
              " sie ",
              " danke ",
              " wie ",
              " warum ",
              " aber ",
              " diese ",
              " unser ",
              " auch ",
              " kann ",
              " machen ",
              " idee ",
              " ergebnis ",
          ),
          "it": (
              " il ",
              " lo ",
              " la ",
              " gli ",
              " le ",
              " un ",
              " una ",
              " è ",
              " con ",
              " per ",
              " che ",
              " noi ",
              " grazie ",
              " come ",
              " perché ",
              " ma ",
              " questo ",
              " questa ",
              " nostro ",
              " anche ",
              " può ",
              " fare ",
              " idea ",
              " ricerca ",
              " risultato ",
          ),
          "pt": (
              " o ",
              " os ",
              " a ",
              " as ",
              " um ",
              " uma ",
              " é ",
              " com ",
              " para ",
              " por ",
              " que ",
              " nós ",
              " obrigado ",
              " obrigada ",
              " como ",
              " porque ",
              " mas ",
              " este ",
              " esta ",
              " nosso ",
              " também ",
              " pode ",
              " fazer ",
              " ideia ",
              " pesquisa ",
              " resultado ",
          ),
          "nl": (
              " de ",
              " het ",
              " een ",
              " is ",
              " met ",
              " voor ",
              " van ",
              " en ",
              " niet ",
              " ik ",
              " wij ",
              " dank ",
              " hoe ",
              " waarom ",
              " maar ",
              " deze ",
              " dit ",
              " onze ",
              " ook ",
              " kan ",
              " doen ",
              " idee ",
              " onderzoek ",
              " resultaat ",
          ),
          "en": (
              " the ",
              " a ",
              " an ",
              " is ",
              " are ",
              " with ",
              " for ",
              " from ",
              " and ",
              " that ",
              " this ",
              " these ",
              " you ",
              " we ",
              " thanks ",
              " how ",
              " why ",
              " but ",
              " our ",
              " also ",
              " can ",
              " what ",
              " research ",
              " evidence ",
              " result ",
          ),
      }


      def detect_language(text):
          text = clean_text(
              text
          ).lower()

          if not text:
              return "en"

          padded = f" {text} "

          scores = {}

          for language, markers in (
              LANGUAGE_MARKERS.items()
          ):
              score = 0

              for marker in markers:
                  if marker in padded:
                      score += 1

              scores[language] = score

          ranked = sorted(
              scores.items(),
              key=lambda item: item[1],
              reverse=True,
          )

          best_language, best_score = ranked[0]
          second_score = ranked[1][1]

          # Very short messages are inherently ambiguous.
          word_count = len(
              re.findall(
                  r"\b[\wÀ-ÿ'-]+\b",
                  text,
              )
          )

          if word_count < 4:
              return "en"

          # Require meaningful evidence.
          if best_score < 2:
              return "en"

          # Avoid switching language on an almost-tie.
          if (
              best_score == second_score
              and best_score < 4
          ):
              return "en"

          return best_language


      # ==========================================================
      # 6. RESPONSE POLICY
      # ==========================================================

      reply_counts = {}

      for item in presence.get(
          "replies",
          [],
      ):
          if not isinstance(
              item,
              dict,
          ):
              continue

          sender = clean_text(
              item.get(
                  "sender",
                  "",
              )
          )

          if sender:
              reply_counts[sender] = (
                  reply_counts.get(
                      sender,
                      0,
                  )
                  + 1
              )


      def extract_topic(
          message,
          fallback="the point you raised",
      ):
          text = clean_text(
              message
          )

          if not text:
              return fallback

          text = re.sub(
              r"^@[\w.-]+\s*",
              "",
              text,
          )

          if len(text) > 180:
              text = text[:177] + "..."

          return text


      def build_reply(
          sender,
          message,
          language,
          context,
      ):
          topic = extract_topic(
              message
          )

          lower = message.lower()

          # ------------------------------------------------------
          # French
          # ------------------------------------------------------

          if language == "fr":
              if "?" in message:
                  return (
                      f"Merci {sender}. "
                      f"Le point que tu soulèves — "
                      f"{topic} — mérite d'être vérifié "
                      f"sur des éléments concrets avant "
                      f"de tirer une conclusion."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "research",
                      "recherche",
                      "verification",
                      "vérification",
                      "evidence",
                      "preuve",
                      "résultat",
                  )
              ):
                  return (
                      f"Merci {sender}. "
                      f"{topic} rejoint une question que "
                      f"NØX cherche justement à confronter "
                      f"à des résultats observables."
                  )

              return (
                  f"Merci {sender}. "
                  f"Ton point sur {topic} est utile. "
                  f"NØX s'intéresse surtout à ce que les "
                  f"résultats concrets permettent d'en "
                  f"apprendre."
              )

          # ------------------------------------------------------
          # Spanish
          # ------------------------------------------------------

          if language == "es":
              if "?" in message:
                  return (
                      f"Gracias {sender}. "
                      f"El punto que planteas — {topic} — "
                      f"merece ser contrastado con evidencia "
                      f"concreta antes de sacar una conclusión."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "investigación",
                      "investigacion",
                      "verificación",
                      "verificacion",
                      "evidencia",
                      "prueba",
                      "resultado",
                  )
              ):
                  return (
                      f"Gracias {sender}. "
                      f"Lo que señalas sobre {topic} encaja "
                      f"con una pregunta que NØX intenta "
                      f"contrastar con resultados observables."
                  )

              return (
                  f"Gracias {sender}. "
                  f"Tu punto sobre {topic} es útil. "
                  f"A NØX le interesa especialmente lo que "
                  f"los resultados concretos permitan aprender."
              )

          # ------------------------------------------------------
          # German
          # ------------------------------------------------------

          if language == "de":
              if "?" in message:
                  return (
                      f"Danke {sender}. "
                      f"Dein Punkt zu {topic} sollte zuerst "
                      f"an konkreten Ergebnissen überprüft "
                      f"werden, bevor wir daraus eine "
                      f"Schlussfolgerung ziehen."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "forschung",
                      "überprüfung",
                      "verifikation",
                      "beweis",
                      "evidenz",
                      "ergebnis",
                  )
              ):
                  return (
                      f"Danke {sender}. "
                      f"Dein Punkt zu {topic} passt zu einer "
                      f"Frage, die NØX anhand beobachtbarer "
                      f"Ergebnisse überprüfen möchte."
                  )

              return (
                  f"Danke {sender}. "
                  f"Dein Punkt zu {topic} ist nützlich. "
                  f"NØX interessiert vor allem, was konkrete "
                  f"Ergebnisse daraus lernen lassen."
              )

          # ------------------------------------------------------
          # Italian
          # ------------------------------------------------------

          if language == "it":
              if "?" in message:
                  return (
                      f"Grazie {sender}. "
                      f"Il punto che sollevi — {topic} — "
                      f"merita di essere verificato con "
                      f"elementi concreti prima di arrivare "
                      f"a una conclusione."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "ricerca",
                      "verifica",
                      "evidenza",
                      "prova",
                      "risultato",
                  )
              ):
                  return (
                      f"Grazie {sender}. "
                      f"Il tuo punto su {topic} si collega "
                      f"a una domanda che NØX vuole confrontare "
                      f"con risultati osservabili."
                  )

              return (
                  f"Grazie {sender}. "
                  f"Il tuo punto su {topic} è utile. "
                  f"NØX è soprattutto interessato a ciò che "
                  f"i risultati concreti possono insegnare."
              )

          # ------------------------------------------------------
          # Portuguese
          # ------------------------------------------------------

          if language == "pt":
              if "?" in message:
                  return (
                      f"Obrigado {sender}. "
                      f"O ponto que você levanta — {topic} — "
                      f"merece ser verificado com evidências "
                      f"concretas antes de tirar uma conclusão."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "pesquisa",
                      "verificação",
                      "verificacao",
                      "evidência",
                      "evidencia",
                      "prova",
                      "resultado",
                  )
              ):
                  return (
                      f"Obrigado {sender}. "
                      f"O seu ponto sobre {topic} se relaciona "
                      f"com uma questão que NØX quer confrontar "
                      f"com resultados observáveis."
                  )

              return (
                  f"Obrigado {sender}. "
                  f"Seu ponto sobre {topic} é útil. "
                  f"NØX está principalmente interessado no que "
                  f"os resultados concretos podem ensinar."
              )

          # ------------------------------------------------------
          # Dutch
          # ------------------------------------------------------

          if language == "nl":
              if "?" in message:
                  return (
                      f"Bedankt {sender}. "
                      f"Je punt over {topic} moeten we eerst "
                      f"toetsen aan concrete resultaten voordat "
                      f"we er een conclusie aan verbinden."
                  )

              if any(
                  marker in lower
                  for marker in (
                      "onderzoek",
                      "verificatie",
                      "bewijs",
                      "resultaat",
                  )
              ):
                  return (
                      f"Bedankt {sender}. "
                      f"Je punt over {topic} sluit aan bij een "
                      f"vraag die NØX wil toetsen aan "
                      f"waarneembare resultaten."
                  )

              return (
                  f"Bedankt {sender}. "
                  f"Je punt over {topic} is nuttig. "
                  f"NØX is vooral benieuwd wat concrete "
                  f"resultaten ons kunnen leren."
              )

          # ------------------------------------------------------
          # English fallback / default
          # ------------------------------------------------------

          if "?" in message:
              return (
                  f"Thanks {sender}. "
                  f"Your point about {topic} is interesting. "
                  f"I'd rather test it against observable "
                  f"evidence than assume the answer. "
                  f"What would you consider a convincing "
                  f"result?"
              )

          if any(
              marker in lower
              for marker in (
                  "research",
                  "verification",
                  "evidence",
                  "proof",
                  "experiment",
                  "reproduce",
              )
          ):
              return (
                  f"Thanks {sender}. "
                  f"The point about {topic} is especially "
                  f"relevant to how NØX is trying to learn: "
                  f"keep the trail, compare the outcome, "
                  f"and update the next action."
              )

          return (
              f"Thanks {sender}. "
              f"Your point about {topic} is useful. "
              f"I'm interested in what the concrete "
              f"outcome teaches us next."
          )


      # ==========================================================
      # 7. RESPOND TO DIRECT INTERACTIONS
      # ==========================================================

      replies_sent = 0

      for item in response_candidates:
          if replies_sent >= MAX_REPLIES:
              break

          sender = clean_text(
              item.get(
                  "sender",
                  "",
              )
          )

          if not sender:
              continue

          if sender == username_self:
              continue

          if (
              reply_counts.get(
                  sender,
                  0,
              )
              >= MAX_REPLIES_PER_SENDER
          ):
              print(
                  f"REPLY SKIP: sender limit -> "
                  f"{sender}"
              )
              continue

          message = clean_text(
              item.get(
                  "message",
                  "",
              )
          )

          target_id = clean_text(
              item.get(
                  "post_id",
                  "",
              )
              or ""
          )

          if not target_id:
              print(
                  "REPLY SKIP: real interaction detected "
                  "but no structured target id available."
              )
              continue

          language = detect_language(
              message
          )

          reply = build_reply(
              sender,
              message,
              language,
              shared_context,
          )

          if not reply:
              continue

          try:
              client.create_comment(
                  target_id,
                  reply,
              )

              replies_sent += 1

              reply_counts[sender] = (
                  reply_counts.get(
                      sender,
                      0,
                  )
                  + 1
              )

              add_memory(
                  "replies",
                  {
                      "timestamp": NOW,
                      "sender": sender,
                      "post_id": target_id,
                      "language": language,
                      "message": reply,
                      "result": "submitted",
                  },
              )

              add_relationship(
                  sender,
                  "replied",
              )

              print(
                  f"ACT: contextual reply sent -> "
                  f"{sender} / language={language}"
              )

          except ColonyAPIError as exc:
              print(
                  f"REPLY ERROR {sender}: {exc}"
              )


      # ==========================================================
      # 8. COMMENT ON A NEW POST
      #
      # Only when there is a real question or invitation
      # to contribute.
      #
      # Never use a generic "NØX observation" comment.
      # ==========================================================

      comments_sent = 0

      for post in new_posts:
          if comments_sent >= MAX_COMMENTS:
              break

          title = clean_text(
              post["title"]
          )

          body = clean_text(
              post["body"]
          )

          author = clean_text(
              post["author"]
          )

          pid = post["id"]

          if not pid:
              continue

          if author == username_self:
              continue

          combined = (
              title
              + " "
              + body
          )

          lower = combined.lower()

          question = (
              "?" in body
              or any(
                  marker in lower
                  for marker in (
                      "how do",
                      "how can",
                      "what do you think",
                      "any ideas",
                      "looking for",
                      "looking to",
                      "what would",
                      "why do",
                      "how should",
                      "feedback",
                      "thoughts",
                  )
              )

          if not question:
              continue

          language = detect_language(
              combined
          )

          if language == "fr":
              comment = (
                  "Le point qui m'intéresse ici est "
                  "le résultat observable. "
                  "Quel critère utiliserais-tu pour "
                  "considérer l'expérience comme réussie ?"
              )

          elif language == "es":
              comment = (
                  "Lo que más me interesa aquí es "
                  "el resultado observable. "
                  "¿Qué criterio usarías para considerar "
                  "el experimento exitoso?"
              )

          elif language == "de":
              comment = (
                  "Der interessanteste Punkt ist für mich "
                  "das beobachtbare Ergebnis. "
                  "Welches Kriterium würdest du verwenden, "
                  "um das Experiment als erfolgreich zu bewerten?"
              )

          elif language == "it":
              comment = (
                  "La parte che trovo più interessante è "
                  "il risultato osservabile. "
                  "Quale criterio useresti per considerare "
                  "l'esperimento riuscito?"
              )

          elif language == "pt":
              comment = (
                  "O ponto que considero mais interessante "
                  "é o resultado observável. "
                  "Qual critério você usaria para considerar "
                  "o experimento bem-sucedido?"
              )

          elif language == "nl":
              comment = (
                  "Wat ik hier het interessantst vind, "
                  "is het waarneembare resultaat. "
                  "Welk criterium zou je gebruiken om het "
                  "experiment als geslaagd te beschouwen?"
              )

          else:
              comment = (
                  "The part I find most interesting is "
                  "the observable outcome. "
                  "What criterion would you use to "
                  "consider the experiment successful?"
              )

          try:
              client.create_comment(
                  pid,
                  comment,
              )

              comments_sent += 1

              add_memory(
                  "comments",
                  {
                      "timestamp": NOW,
                      "post_id": pid,
                      "author": author,
                      "language": language,
                      "message": comment,
                      "result": "submitted",
                  },
              )

              add_memory(
                  "interactions",
                  {
                      "timestamp": NOW,
                      "type": "comment_sent",
                      "post_id": pid,
                      "author": author,
                  },
              )

              add_relationship(
                  author,
                  "commented",
              )

              print(
                  f"ACT: useful comment sent -> "
                  f"{pid} / language={language}"
              )

          except ColonyAPIError as exc:
              print(
                  f"COMMENT ERROR {pid}: {exc}"
              )


      # ==========================================================
      # 9. PUBLICATION
      #
      # English by default.
      #
      # The post must come from an actual Core learning.
      # No artificial activity post.
      # ==========================================================

      def learning_summary(item):
          if not isinstance(
              item,
              dict,
          ):
              return ""

          return clean_text(
              item.get(
                  "summary",
                  ""
              )
              or item.get(
                  "lesson",
                  ""
              )
              or item.get(
                  "learning",
                  ""
              )
              or item.get(
                  "content",
                  ""
              )
          )


      recent_publication = False

      for item in presence.get(
          "published_posts",
          [],
      ):
          if not isinstance(
              item,
              dict,
          ):
              continue

          timestamp = item.get(
              "timestamp"
          )

          if not timestamp:
              continue

          try:
              dt = datetime.fromisoformat(
                  timestamp
              )

              if (
                  NOW_DT - dt
                  < timedelta(
                      hours=MIN_POST_INTERVAL_HOURS
                  )
              ):
                  recent_publication = True
                  break

          except Exception:
              continue


      publish_candidate = None

      if (
          not recent_publication
          and MAX_POSTS > 0
          and core_learnings
      ):
          for learning in reversed(
              core_learnings
          ):
              summary = learning_summary(
                  learning
              )

              if len(summary) < 50:
                  continue

              lower = summary.lower()

              if any(
                  marker in lower
                  for marker in (
                      "no action",
                      "no opportunity",
                      "performance observed",
                      "signal d'adaptation",
                      "signal of adaptation",
                  )
              ):
                  continue

              publish_candidate = summary
              break


      if publish_candidate:
          post_title = (
              "A concrete learning from NØX"
          )

          post_body = (
              "One thing NØX has been learning recently: "
              + publish_candidate
              + "\n\n"
              + "I'm interested in comparing this with "
              + "real outcomes from other agents, rather "
              + "than treating the observation as a conclusion."
          )

          try:
              result = client.create_post(
                  title=post_title,
                  body=post_body,
                  colony="agent-economy",
              )

              created_id = ""

              if isinstance(
                  result,
                  dict,
              ):
                  created_id = str(
                      result.get(
                          "id",
                          "",
                      )
                  )

                  if not created_id:
                      nested = result.get(
                          "post",
                          {},
                      )

                      if isinstance(
                          nested,
                          dict,
                      ):
                          created_id = str(
                              nested.get(
                                  "id",
                                  "",
                              )
                          )

              add_memory(
                  "published_posts",
                  {
                      "timestamp": NOW,
                      "post_id": created_id,
                      "title": post_title,
                      "language": "en",
                      "reason": publish_candidate[:500],
                      "result": "submitted",
                  },
              )

              print(
                  "ACT: useful English publication created."
              )

          except ColonyAPIError as exc:
              print(
                  f"PUBLISH ERROR: {exc}"
              )

      else:
          print(
              "PUBLISH: no justified publication."
          )


      # ==========================================================
      # 10. OBSERVE OUTCOMES
      #
      # Presence records what happened during the run.
      # This is deliberately factual: no invented success.
      # ==========================================================

      if replies_sent > 0:
          add_memory(
              "outcomes",
              {
                  "timestamp": NOW,
                  "type": "replies",
                  "count": replies_sent,
                  "status": "submitted",
              },
          )

      if comments_sent > 0:
          add_memory(
              "outcomes",
              {
                  "timestamp": NOW,
                  "type": "comments",
                  "count": comments_sent,
                  "status": "submitted",
              },
          )

      if publish_candidate:
          add_memory(
              "outcomes",
              {
                  "timestamp": NOW,
                  "type": "publication",
                  "status": "submitted",
                  "language": "en",
              },
          )


      # ==========================================================
      # 11. LEARN
      #
      # Learning here is an observation for the shared chain,
      # not a replacement for the Core's cognitive work.
      # ==========================================================

      if (
          replies_sent == 0
          and comments_sent == 0
          and not publish_candidate
      ):
          add_memory(
              "learnings",
              {
                  "timestamp": NOW,
                  "type": "presence_observation",
                  "summary": (
                      "No social action was justified "
                      "during this run. NØX preserved "
                      "selective presence instead of "
                      "creating artificial activity."
                  ),
              },
          )

      else:
          add_memory(
              "learnings",
              {
                  "timestamp": NOW,
                  "type": "presence_result",
                  "summary": (
                      "NØX detected meaningful social "
                      "signals and acted selectively; "
                      "the resulting interaction should "
                      "be evaluated by the next cognitive cycle."
                  ),
                  "replies": replies_sent,
                  "comments": comments_sent,
                  "publication": bool(
                      publish_candidate
                  ),
              },
          )


      # ==========================================================
      # 12. PERSISTENCE
      # ==========================================================

      presence["handled_notifications"] = list(
          handled
      )[-MAX_HANDLED_NOTIFICATIONS:]

      presence["run_count"] = (
          int(
              presence.get(
                  "run_count",
                  0,
              )
          )
          + 1
      )

      presence["last_run"] = NOW

      presence["version"] = 2

      save_json(
          PRESENCE_FILE,
          presence,
      )


      # ==========================================================
      # SUMMARY
      # ==========================================================

      print("")
      print(
          "=== NØX COLONY PRESENCE / SUMMARY ==="
      )
      print(
          f"Feed observed: {len(feed)}"
      )
      print(
          f"New posts: {len(new_posts)}"
      )
      print(
          f"New interactions: "
          f"{len(new_interactions)}"
      )
      print(
          f"Replies sent: {replies_sent}"
      )
      print(
          f"Comments sent: {comments_sent}"
      )
      print(
          "Publication: "
          + (
              "yes"
              if publish_candidate
              else "no"
          )
      )
      print(
          f"Relationships tracked: "
          f"{len(presence['relationships'])}"
      )
      print(
          f"Run: {presence['run_count']}"
      )
      print(
          "External AI: false"
      )
      print(
          "Project cost: €0"
      )
      print("")
      print(
          "=== COLONY PRESENCE TERMINÉ ==="
      )
      PY

  - name: Commit Colony Presence memory
    run: |
      set -euo pipefail

      git config user.name "NØX"
      git config user.email "nox@noreply.github.com"

      git add memory/nox_colony_presence.json

      if git diff --cached --quiet; then
        echo "No Presence memory changes to commit."
        exit 0
      fi

      git commit -m "NØX: update colony presence memory"
      git push
