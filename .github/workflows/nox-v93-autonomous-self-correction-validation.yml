name: NØX V93 — Autonomous Self-Correction Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v93-autonomous-self-correction-validation
  cancel-in-progress: false

jobs:
  self-correction-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V93
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          BASE = "memory"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(filename):
              path = os.path.join(BASE, filename)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(filename, data):
              os.makedirs(BASE, exist_ok=True)
              path = os.path.join(BASE, filename)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def boolean(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  return value.lower() in [
                      "true",
                      "1",
                      "yes"
                  ]
              return bool(value)

          # ---------------------------------------------------------
          # LOAD V92 PROPOSAL
          # ---------------------------------------------------------

          v92 = load(
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          v88 = load(
              "nox_v88_autonomous_decision_error_analysis.json"
          )

          v87 = load(
              "nox_v87_autonomous_prioritization_refinement.json"
          )

          v86 = load(
              "nox_v86_adaptive_strategy_live_test.json"
          )

          v85 = load(
              "nox_v85_autonomous_strategy_adaptation.json"
          )

          # ---------------------------------------------------------
          # READ SELECTED CORRECTION
          # ---------------------------------------------------------

          selected = v92.get(
              "selected_correction",
              {}
          )

          if not isinstance(selected, dict):
              selected = {}

          correction_id = text(
              selected.get("id")
          )

          correction_name = text(
              selected.get("name")
          )

          correction_score = number(
              selected.get("score"),
              0
          )

          correction_change = text(
              selected.get("change")
          )

          correction_benefit = text(
              selected.get("benefit")
          )

          correction_risk = text(
              selected.get("risk")
          )

          # ---------------------------------------------------------
          # READ V91 STABILITY
          # ---------------------------------------------------------

          metrics = v91.get(
              "metrics",
              {}
          )

          if not isinstance(metrics, dict):
              metrics = {}

          overall_stability = number(
              metrics.get(
                  "overall_stability",
                  0
              )
          )

          decision_stability = number(
              metrics.get(
                  "decision_stability",
                  0
              )
          )

          evidence_stability = number(
              metrics.get(
                  "evidence_stability",
                  0
              )
          )

          reversal_rate = number(
              metrics.get(
                  "reversal_rate",
                  0
              )
          )

          over_pruning = boolean(
              metrics.get(
                  "over_pruning_signal",
                  False
              )
          )

          under_pruning = boolean(
              metrics.get(
                  "under_pruning_signal",
                  False
              )
          )

          # ---------------------------------------------------------
          # BUILD REGRESSION CASES
          #
          # These are deliberately synthetic representations of
          # previously observed failure patterns. They do not alter
          # live Colony data.
          # ---------------------------------------------------------

          regression_cases = [
              {
                  "id": "REG-V62-GENERIC-TASK-LANGUAGE",
                  "type": "FALSE_POSITIVE",
                  "request": False,
                  "delegation": False,
                  "deliverable": False,
                  "acceptance": False,
                  "reward": False,
                  "completion": False,
                  "analysis_only": True
              },
              {
                  "id": "REG-V64-ANALYSIS-AS-DEMAND",
                  "type": "FALSE_POSITIVE",
                  "request": False,
                  "delegation": False,
                  "deliverable": True,
                  "acceptance": False,
                  "reward": False,
                  "completion": False,
                  "analysis_only": True
              },
              {
                  "id": "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                  "type": "PIPELINE_FAILURE",
                  "request": False,
                  "delegation": False,
                  "deliverable": False,
                  "acceptance": False,
                  "reward": False,
                  "completion": False,
                  "analysis_only": False,
                  "identity_error": True
              },
              {
                  "id": "REG-V70-GENUINE-WORK-REQUEST",
                  "type": "GENUINE_REQUEST",
                  "request": True,
                  "delegation": True,
                  "deliverable": True,
                  "acceptance": True,
                  "reward": False,
                  "completion": False,
                  "analysis_only": False
              },
              {
                  "id": "REG-PAYMENT-LANGUAGE-NOT-PROOF",
                  "type": "PAYMENT_AMBIGUITY",
                  "request": False,
                  "delegation": False,
                  "deliverable": True,
                  "acceptance": False,
                  "reward": True,
                  "completion": False,
                  "settlement_verified": False,
                  "analysis_only": False
              },
              {
                  "id": "REG-COMPLETED-WORK",
                  "type": "COMPLETED_WORK",
                  "request": True,
                  "delegation": True,
                  "deliverable": True,
                  "acceptance": True,
                  "reward": True,
                  "completion": True,
                  "analysis_only": False
              },
              {
                  "id": "REG-ATYPICAL-OPPORTUNITY",
                  "type": "ATYPICAL_SIGNAL",
                  "request": False,
                  "delegation": True,
                  "deliverable": True,
                  "acceptance": False,
                  "reward": True,
                  "completion": False,
                  "analysis_only": False
              }
          ]

          # ---------------------------------------------------------
          # BASELINE CLASSIFIER
          # ---------------------------------------------------------

          def baseline_score(case):
              score = 0

              if case.get("request"):
                  score += 30

              if case.get("delegation"):
                  score += 20

              if case.get("deliverable"):
                  score += 15

              if case.get("acceptance"):
                  score += 15

              if case.get("reward"):
                  score += 10

              if case.get("completion"):
                  score -= 35

              if case.get("analysis_only"):
                  score -= 20

              if (
                  case.get("request")
                  and case.get("delegation")
              ):
                  score += 5

              if (
                  case.get("acceptance")
                  and case.get("deliverable")
              ):
                  score += 5

              return score

          def baseline_class(score, case):
              if case.get("completion"):
                  return "EXCLUDE_COMPLETED"

              if (
                  case.get("request")
                  and case.get("delegation")
                  and case.get("deliverable")
                  and case.get("acceptance")
              ):
                  return "HIGH_CONFIDENCE_OPPORTUNITY"

              if (
                  case.get("request")
                  and case.get("delegation")
              ):
                  return "STRONG_OPPORTUNITY_CANDIDATE"

              if (
                  case.get("request")
                  or case.get("delegation")
              ):
                  return "CONTEXTUAL_OPPORTUNITY"

              if (
                  case.get("deliverable")
                  and case.get("reward")
              ):
                  return "ATYPICAL_SIGNAL"

              return "LOW_PRIORITY_SIGNAL"

          # ---------------------------------------------------------
          # CORRECTED CLASSIFIER
          #
          # The selected correction modifies the simulation only.
          # No live rule is changed.
          # ---------------------------------------------------------

          def corrected_score(case, correction):
              score = baseline_score(case)

              if correction == "CORR_A_EVIDENCE_CONVERGENCE":
                  if (
                      case.get("request")
                      and case.get("delegation")
                  ):
                      score += 8

                  if (
                      case.get("request")
                      and case.get("delegation")
                      and case.get("deliverable")
                  ):
                      score += 7

                  if (
                      case.get("request")
                      and case.get("delegation")
                      and case.get("deliverable")
                      and case.get("acceptance")
                  ):
                      score += 10

                  if (
                      not case.get("request")
                      and not case.get("delegation")
                  ):
                      score -= 10

              elif correction == "CORR_B_ATYPICAL_RECOVERY":
                  if (
                      case.get("delegation")
                      and case.get("deliverable")
                      and case.get("reward")
                      and not case.get("completion")
                  ):
                      score += 15

              elif correction == "CORR_C_ACCEPTANCE_PRIORITY":
                  if case.get("acceptance"):
                      score += 15

                  if (
                      case.get("request")
                      and case.get("delegation")
                      and not case.get("acceptance")
                  ):
                      score -= 5

              elif correction == "CORR_D_COMPLETION_EXCLUSION":
                  if case.get("completion"):
                      score -= 25

                  if (
                      case.get("reward")
                      and not case.get("settlement_verified", False)
                  ):
                      score -= 5

              elif correction == "CORR_E_HISTORY_AS_MODIFIER":
                  # Historical learning is intentionally prevented
                  # from overriding current evidence.
                  score = baseline_score(case)

              return score

          def corrected_class(score, case):
              if case.get("completion"):
                  return "EXCLUDE_COMPLETED"

              if (
                  case.get("request")
                  and case.get("delegation")
                  and case.get("deliverable")
                  and case.get("acceptance")
                  and score >= 70
              ):
                  return "HIGH_CONFIDENCE_OPPORTUNITY"

              if (
                  case.get("request")
                  and case.get("delegation")
                  and score >= 55
              ):
                  return "STRONG_OPPORTUNITY_CANDIDATE"

              if (
                  case.get("delegation")
                  and case.get("deliverable")
                  and case.get("reward")
                  and not case.get("completion")
              ):
                  return "ATYPICAL_SIGNAL"

              if (
                  case.get("request")
                  or case.get("delegation")
              ):
                  return "CONTEXTUAL_OPPORTUNITY"

              return "LOW_PRIORITY_SIGNAL"

          # ---------------------------------------------------------
          # EVALUATE CASES
          # ---------------------------------------------------------

          evaluations = []

          baseline_correct = 0
          corrected_correct = 0

          for case in regression_cases:

              base_score = baseline_score(case)
              base_class = baseline_class(
                  base_score,
                  case
              )

              new_score = corrected_score(
                  case,
                  correction_id
              )

              new_class = corrected_class(
                  new_score,
                  case
              )

              expected = "UNKNOWN"

              if case["type"] == "FALSE_POSITIVE":
                  expected = "LOW_PRIORITY_SIGNAL"

              elif case["type"] == "GENUINE_REQUEST":
                  expected = "HIGH_CONFIDENCE_OPPORTUNITY"

              elif case["type"] == "COMPLETED_WORK":
                  expected = "EXCLUDE_COMPLETED"

              elif case["type"] == "ATYPICAL_SIGNAL":
                  expected = "ATYPICAL_SIGNAL"

              elif case["type"] == "PAYMENT_AMBIGUITY":
                  expected = "ATYPICAL_SIGNAL"

              elif case["type"] == "PIPELINE_FAILURE":
                  expected = "LOW_PRIORITY_SIGNAL"

              base_ok = (
                  expected == "UNKNOWN"
                  or base_class == expected
              )

              new_ok = (
                  expected == "UNKNOWN"
                  or new_class == expected
              )

              if base_ok:
                  baseline_correct += 1

              if new_ok:
                  corrected_correct += 1

              evaluations.append({
                  "id": case["id"],
                  "type": case["type"],
                  "expected_classification": expected,
                  "baseline": {
                      "score": base_score,
                      "classification": base_class,
                      "correct": base_ok
                  },
                  "corrected": {
                      "score": new_score,
                      "classification": new_class,
                      "correct": new_ok
                  },
                  "changed": (
                      base_class != new_class
                      or base_score != new_score
                  )
              })

          total_cases = len(
              regression_cases
          )

          baseline_accuracy = (
              baseline_correct / total_cases
              if total_cases
              else 0
          )

          corrected_accuracy = (
              corrected_correct / total_cases
              if total_cases
              else 0
          )

          accuracy_delta = (
              corrected_accuracy
              - baseline_accuracy
          )

          # ---------------------------------------------------------
          # REGRESSION SAFETY
          # ---------------------------------------------------------

          regressions = []

          for item in evaluations:
              if (
                  item["baseline"]["correct"]
                  and not item["corrected"]["correct"]
              ):
                  regressions.append(
                      item["id"]
                  )

          regression_count = len(
              regressions
          )

          # ---------------------------------------------------------
          # VALIDATION DECISION
          # ---------------------------------------------------------

          if (
              corrected_accuracy > baseline_accuracy
              and regression_count == 0
          ):
              validation_status = (
                  "CORRECTION_VALIDATED_IN_SIMULATION"
              )

          elif (
              corrected_accuracy == baseline_accuracy
              and regression_count == 0
          ):
              validation_status = (
                  "CORRECTION_NEUTRAL"
              )

          elif regression_count > 0:
              validation_status = (
                  "CORRECTION_REJECTED_REGRESSION_RISK"
              )

          else:
              validation_status = (
                  "CORRECTION_NOT_PROVEN"
              )

          # ---------------------------------------------------------
          # LIVE AUTHORITY
          # ---------------------------------------------------------

          automatic_rule_deployment = False

          if validation_status == (
              "CORRECTION_VALIDATED_IN_SIMULATION"
          ):
              next_authority = (
                  "ELIGIBLE_FOR_CONTROLLED_LIVE_TEST"
              )

          elif validation_status == "CORRECTION_NEUTRAL":
              next_authority = (
                  "REQUIRES_MORE_EVIDENCE"
              )

          else:
              next_authority = (
                  "RETAIN_CURRENT_RULES"
              )

          # ---------------------------------------------------------
          # CONFIDENCE
          # ---------------------------------------------------------

          confidence = 0.40

          if total_cases >= 5:
              confidence += 0.10

          if corrected_accuracy > baseline_accuracy:
              confidence += 0.15

          if regression_count == 0:
              confidence += 0.10

          if overall_stability >= 0.70:
              confidence += 0.10

          if evidence_stability >= 0.70:
              confidence += 0.05

          confidence = min(
              round(confidence, 3),
              0.90
          )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V93",
              "generated_at": now(),
              "mode": "autonomous_self_correction_validation",

              "input": {
                  "selected_correction_id": correction_id,
                  "selected_correction_name": correction_name,
                  "proposal_score": correction_score,
                  "change": correction_change,
                  "benefit": correction_benefit,
                  "risk": correction_risk
              },

              "method": {
                  "simulation_only": True,
                  "live_rules_modified": False,
                  "live_external_action": False,
                  "regression_cases": total_cases,
                  "baseline_classifier": "V90-style decision logic",
                  "corrected_classifier": correction_id
              },

              "comparison": {
                  "baseline_correct": baseline_correct,
                  "corrected_correct": corrected_correct,
                  "baseline_accuracy": round(
                      baseline_accuracy,
                      3
                  ),
                  "corrected_accuracy": round(
                      corrected_accuracy,
                      3
                  ),
                  "accuracy_delta": round(
                      accuracy_delta,
                      3
                  ),
                  "regression_count": regression_count,
                  "regression_cases": regressions
              },

              "evaluations": evaluations,

              "validation": {
                  "status": validation_status,
                  "confidence": confidence,
                  "next_authority": next_authority
              },

              "autonomy": {
                  "correction_selected_by_nox": True,
                  "correction_simulated_by_nox": True,
                  "correction_validated_by_simulation": (
                      validation_status
                      == "CORRECTION_VALIDATED_IN_SIMULATION"
                  ),
                  "automatic_rule_deployment": (
                      automatic_rule_deployment
                  ),
                  "human_override": True
              },

              "next_stage": {
                  "version": "V94",
                  "purpose": (
                      "Controlled live comparison of the validated "
                      "correction without permanent rule deployment."
                  ),
                  "automatic_rule_deployment": False,
                  "external_action": False
              },

              "safety": {
                  "gemini_disabled": True,
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "zero_cost_constraint": True,
                  "live_rules_modified": False,
                  "human_override": True
              },

              "answer_status": validation_status
          }

          # ---------------------------------------------------------
          # SAVE JSON
          # ---------------------------------------------------------

          save(
              "nox_v93_autonomous_self_correction_validation.json",
              result
          )

          # ---------------------------------------------------------
          # SAVE MARKDOWN
          # ---------------------------------------------------------

          lines = []

          lines.append(
              "# NØX V93 — Autonomous Self-Correction Validation"
          )
          lines.append("")
          lines.append(
              "Generated: " + text(result["generated_at"])
          )
          lines.append("")

          lines.append("## Selected correction")
          lines.append("")
          lines.append(
              "- ID: " + correction_id
          )
          lines.append(
              "- Name: " + correction_name
          )
          lines.append(
              "- Proposal score: "
              + str(correction_score)
              + "/100"
          )
          lines.append(
              "- Change: " + correction_change
          )
          lines.append("")

          lines.append("## Simulation")
          lines.append("")
          lines.append(
              "- Regression cases: "
              + str(total_cases)
          )
          lines.append(
              "- Baseline correct: "
              + str(baseline_correct)
          )
          lines.append(
              "- Corrected correct: "
              + str(corrected_correct)
          )
          lines.append(
              "- Baseline accuracy: "
              + str(round(baseline_accuracy, 3))
          )
          lines.append(
              "- Corrected accuracy: "
              + str(round(corrected_accuracy, 3))
          )
          lines.append(
              "- Accuracy delta: "
              + str(round(accuracy_delta, 3))
          )
          lines.append(
              "- Regression count: "
              + str(regression_count)
          )
          lines.append("")

          lines.append("## Case results")
          lines.append("")

          for item in evaluations:
              lines.append(
                  "### " + text(item["id"])
              )
              lines.append(
                  "- Expected: "
                  + text(item["expected_classification"])
              )
              lines.append(
                  "- Baseline: "
                  + text(
                      item["baseline"]["classification"]
                  )
                  + " / "
                  + str(
                      item["baseline"]["score"]
                  )
              )
              lines.append(
                  "- Corrected: "
                  + text(
                      item["corrected"]["classification"]
                  )
                  + " / "
                  + str(
                      item["corrected"]["score"]
                  )
              )
              lines.append(
                  "- Changed: "
                  + str(item["changed"])
              )
              lines.append("")

          lines.append("## Validation")
          lines.append("")
          lines.append(
              "- Status: "
              + validation_status
          )
          lines.append(
              "- Confidence: "
              + str(confidence)
          )
          lines.append(
              "- Next authority: "
              + next_authority
          )
          lines.append("")

          lines.append("## Autonomy")
          lines.append("")
          lines.append(
              "- Correction selected by NØX: true"
          )
          lines.append(
              "- Correction simulated by NØX: true"
          )
          lines.append(
              "- Permanent rule deployment: false"
          )
          lines.append(
              "- Human override: true"
          )
          lines.append("")

          lines.append("## Next stage")
          lines.append("")
          lines.append(
              "V94 will perform a controlled live comparison "
              "if V93 demonstrates that the proposed correction "
              "improves the regression set without introducing "
              "regressions."
          )
          lines.append("")

          lines.append("## Safety")
          lines.append("")
          lines.append("- Gemini: disabled")
          lines.append("- External action: disabled")
          lines.append("- Contact: disabled")
          lines.append("- Bidding: disabled")
          lines.append("- Payments: disabled")
          lines.append("- Live rules modified: false")
          lines.append("- Project cost: €0")
          lines.append("- Human override: enabled")

          with open(
              os.path.join(
                  BASE,
                  "nox_v93_autonomous_self_correction_validation.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          print(
              json.dumps(
                  {
                      "version": "V93",
                      "status": validation_status,
                      "correction": correction_id,
                      "baseline_accuracy": round(
                          baseline_accuracy,
                          3
                      ),
                      "corrected_accuracy": round(
                          corrected_accuracy,
                          3
                      ),
                      "regressions": regression_count,
                      "confidence": confidence,
                      "next_stage": "V94"
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V93 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v93_autonomous_self_correction_validation.json
          git add memory/nox_v93_autonomous_self_correction_validation.md

          git diff --cached --quiet || \
            git commit -m "NØX V93 autonomous self correction validation"

          git push
