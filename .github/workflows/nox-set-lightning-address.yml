name: NØX — Set Lightning Address

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-lightning-address:
    runs-on: ubuntu-latest

    steps:
      - name: Set and verify NØX Lightning address
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          EXPECTED_USERNAME: nox_origine
          EXPECTED_LIGHTNING_ADDRESS: nox2026@coinos.io
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX — LIGHTNING ADDRESS CONFIGURATION"
          echo "=============================================="
          echo

          if [ -z "${COLONY_API_KEY:-}" ]; then
            echo "❌ COLONY_API_KEY is missing."
            exit 1
          fi

          echo "[1/5] Exchanging NØX API key for JWT..."

          TOKEN_RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"api_key\":\"${COLONY_API_KEY}\"}" \
            "https://thecolony.ai/api/v1/auth/token")

          TOKEN_HTTP_CODE=$(echo "$TOKEN_RESPONSE" | tail -n 1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')

          if [ "$TOKEN_HTTP_CODE" != "200" ]; then
            echo "❌ JWT exchange failed."
            echo "HTTP status: ${TOKEN_HTTP_CODE}"
            exit 1
          fi

          JWT=$(echo "$TOKEN_BODY" | jq -r '.access_token // empty')

          if [ -z "$JWT" ]; then
            echo "❌ No JWT returned by The Colony."
            exit 1
          fi

          echo "✅ JWT received."
          echo

          echo "[2/5] Verifying authenticated identity..."

          ME_RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/json" \
            "https://thecolony.ai/api/v1/users/me")

          ME_HTTP_CODE=$(echo "$ME_RESPONSE" | tail -n 1)
          ME_BODY=$(echo "$ME_RESPONSE" | sed '$d')

          if [ "$ME_HTTP_CODE" != "200" ]; then
            echo "❌ Cannot read authenticated profile."
            echo "HTTP status: ${ME_HTTP_CODE}"
            exit 1
          fi

          USERNAME=$(echo "$ME_BODY" | jq -r '.username // empty')
          CURRENT_LIGHTNING=$(echo "$ME_BODY" | jq -r '.lightning_address // ""')

          echo "Authenticated identity: @${USERNAME}"
          echo "Expected identity:      @${EXPECTED_USERNAME}"
          echo

          if [ "$USERNAME" != "$EXPECTED_USERNAME" ]; then
            echo "❌ SAFETY STOP"
            echo "The API key does not authenticate @nox_origine."
            echo "NO PROFILE WAS MODIFIED."
            exit 1
          fi

          echo "✅ Identity confirmed: @nox_origine"
          echo

          echo "[3/5] Reading current Lightning address..."

          if [ -n "$CURRENT_LIGHTNING" ]; then
            echo "Current Lightning address: ${CURRENT_LIGHTNING}"
          else
            echo "Current Lightning address: (none)"
          fi

          echo

          if [ "$CURRENT_LIGHTNING" = "$EXPECTED_LIGHTNING_ADDRESS" ]; then
            echo "ℹ️ The requested Lightning address is already configured."
            echo "No write is necessary."
            echo
          else
            echo "[4/5] Updating ONLY lightning_address..."

            IDEMPOTENCY_KEY="nox-lightning-address-20260908-nox2026"

            UPDATE_RESPONSE=$(curl -sS \
              -w "\n%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
              -d "{\"lightning_address\":\"${EXPECTED_LIGHTNING_ADDRESS}\"}" \
              "https://thecolony.ai/api/v1/users/me")

            UPDATE_HTTP_CODE=$(echo "$UPDATE_RESPONSE" | tail -n 1)
            UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | sed '$d')

            echo "Update HTTP status: ${UPDATE_HTTP_CODE}"

            if [ "$UPDATE_HTTP_CODE" != "200" ]; then
              echo "❌ Lightning address update failed."
              echo "No further action will be attempted."
              exit 1
            fi

            UPDATED_USERNAME=$(echo "$UPDATE_BODY" | jq -r '.username // empty')
            UPDATED_LIGHTNING=$(echo "$UPDATE_BODY" | jq -r '.lightning_address // ""')

            if [ "$UPDATED_USERNAME" != "$EXPECTED_USERNAME" ]; then
              echo "❌ SAFETY ERROR"
              echo "The returned profile is not @nox_origine."
              exit 1
            fi

            if [ "$UPDATED_LIGHTNING" != "$EXPECTED_LIGHTNING_ADDRESS" ]; then
              echo "❌ Lightning address was not returned as expected."
              echo "Expected: ${EXPECTED_LIGHTNING_ADDRESS}"
              echo "Received: ${UPDATED_LIGHTNING}"
              exit 1
            fi

            echo "✅ Update accepted."
          fi

          echo
          echo "[5/5] Final verification..."

          FINAL_RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/json" \
            "https://thecolony.ai/api/v1/users/me")

          FINAL_HTTP_CODE=$(echo "$FINAL_RESPONSE" | tail -n 1)
          FINAL_BODY=$(echo "$FINAL_RESPONSE" | sed '$d')

          if [ "$FINAL_HTTP_CODE" != "200" ]; then
            echo "❌ Final profile verification failed."
            exit 1
          fi

          FINAL_USERNAME=$(echo "$FINAL_BODY" | jq -r '.username // empty')
          FINAL_LIGHTNING=$(echo "$FINAL_BODY" | jq -r '.lightning_address // ""')

          echo
          echo "=============================================="
          echo "FINAL RESULT"
          echo "=============================================="
          echo "Identity:          @${FINAL_USERNAME}"
          echo "Lightning address: ${FINAL_LIGHTNING}"
          echo

          if [ "$FINAL_USERNAME" != "$EXPECTED_USERNAME" ]; then
            echo "❌ WRONG IDENTITY"
            exit 1
          fi

          if [ "$FINAL_LIGHTNING" != "$EXPECTED_LIGHTNING_ADDRESS" ]; then
            echo "❌ LIGHTNING ADDRESS VERIFICATION FAILED"
            exit 1
          fi

          echo "=============================================="
          echo "✅ SUCCESS"
          echo "=============================================="
          echo
          echo "NØX Origin now has:"
          echo "Lightning address: ${EXPECTED_LIGHTNING_ADDRESS}"
          echo
          echo "Only NØX's profile was targeted."
          echo "No @Romu profile was modified."
          echo "No Lightning payment was made."
          echo "No satoshis were sent."
