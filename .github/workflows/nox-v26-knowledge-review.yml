name: NØX Origin - V26 Knowledge Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  knowledge-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Review knowledge locally
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          knowledge = memory.get("knowledge", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(contradictions, list):
              contradictions = []

          if not isinstance(history, list):
              history = []

          now = datetime.now(timezone.utc).isoformat()

          # ---------------------------------------------------------
          # 1. Construire une liste de textes de connaissance
          # ---------------------------------------------------------

          knowledge_entries = []

          for index, item in enumerate(knowledge):

              if isinstance(item, str):
                  text = item

                  entry = {
                      "index": index,
                      "text": text
                  }

              elif isinstance(item, dict):
                  text = (
                      item.get("text")
                      or item.get("knowledge")
                      or item.get("statement")
                      or ""
                  )

                  entry = {
                      "index": index,
                      "text": text
                  }

              else:
                  continue

              if text:
                  knowledge_entries.append(entry)

          # ---------------------------------------------------------
          # 2. Identifier les connaissances impliquées dans
          #    des contradictions potentielles
          # ---------------------------------------------------------

          conflicted_indices = set()

          contradiction_topics = {}

          for contradiction in contradictions:

              if not isinstance(contradiction, dict):
                  continue

              if contradiction.get("status") not in (
                  "potential",
                  "confirmed",
                  "conflicted"
              ):
                  continue

              source_a = str(
                  contradiction.get("source_a", "")
              ).strip()

              source_b = str(
                  contradiction.get("source_b", "")
              ).strip()

              topic = contradiction.get(
                  "topic",
                  "unknown"
              )

              contradiction_topics.setdefault(
                  topic,
                  0
              )

              contradiction_topics[topic] += 1

              for entry in knowledge_entries:

                  text = str(entry["text"]).strip()

                  if text == source_a or text == source_b:
                      conflicted_indices.add(
                          entry["index"]
                      )

          # ---------------------------------------------------------
          # 3. Réévaluer chaque connaissance
          #
          # Important :
          # Une contradiction ne détruit jamais automatiquement
          # une connaissance.
          # ---------------------------------------------------------

          reviewed_knowledge = []

          stable_count = 0
          uncertain_count = 0
          conflicted_count = 0

          for entry in knowledge_entries:

              index = entry["index"]
              text = entry["text"]

              old_status = "stable"

              if isinstance(knowledge[index], dict):
                  old_status = knowledge[index].get(
                      "status",
                      "stable"
                  )

              if index in conflicted_indices:

                  status = "conflicted"
                  confidence = 0.40
                  conflicted_count += 1

              else:

                  status = "stable"
                  confidence = 0.80
                  stable_count += 1

              # -----------------------------------------------------
              # Conserver la structure existante si possible
              # -----------------------------------------------------

              if isinstance(knowledge[index], dict):

                  knowledge[index]["status"] = status
                  knowledge[index]["confidence"] = confidence
                  knowledge[index]["reviewed_at"] = now
                  knowledge[index]["review_method"] = (
                      "local_knowledge_review_v26"
                  )

              else:

                  knowledge[index] = {
                      "text": text,
                      "status": status,
                      "confidence": confidence,
                      "reviewed_at": now,
                      "review_method": (
                          "local_knowledge_review_v26"
                      )
                  }

              reviewed_knowledge.append({
                  "index": index,
                  "text": text,
                  "previous_status": old_status,
                  "status": status,
                  "confidence": confidence
              })

          # ---------------------------------------------------------
          # 4. Si aucune contradiction n'est détectée,
          #    les connaissances restent stables.
          # ---------------------------------------------------------

          if not knowledge_entries:
              stable_count = 0

          # ---------------------------------------------------------
          # 5. Etat global de la mémoire
          # ---------------------------------------------------------

          knowledge_state = {
              "updated_at": now,
              "total": len(knowledge),
              "stable": stable_count,
              "uncertain": uncertain_count,
              "conflicted": conflicted_count,
              "contradictions_considered": len(
                  contradictions
              ),
              "method": "local_knowledge_review"
          }

          # ---------------------------------------------------------
          # 6. Journal des connaissances conflictuelles
          # ---------------------------------------------------------

          review_events = memory.get(
              "knowledge_review_events",
              []
          )

          if not isinstance(review_events, list):
              review_events = []

          for item in reviewed_knowledge:

              if item["status"] == "conflicted":

                  review_events.append({
                      "timestamp": now,
                      "knowledge_index": item["index"],
                      "status": "conflicted",
                      "confidence": item["confidence"],
                      "method": "local_knowledge_review_v26"
                  })

          # Limiter la croissance inutile de l'historique
          if len(review_events) > 500:
              review_events = review_events[-500:]

          # ---------------------------------------------------------
          # 7. Historique V26
          # ---------------------------------------------------------

          history.append({
              "version": "V26",
              "timestamp": now,
              "knowledge_total": len(knowledge),
              "stable": stable_count,
              "uncertain": uncertain_count,
              "conflicted": conflicted_count,
              "contradictions_considered": len(
                  contradictions
              ),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_knowledge_review"
          })

          # ---------------------------------------------------------
          # 8. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V26"
          memory["updated_at"] = now
          memory["knowledge"] = knowledge
          memory["knowledge_state"] = knowledge_state
          memory["knowledge_review_events"] = review_events
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 9. Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V26")
          print("==========================================")
          print(f"Knowledge total       : {len(knowledge)}")
          print(f"Stable                : {stable_count}")
          print(f"Uncertain             : {uncertain_count}")
          print(f"Conflicted            : {conflicted_count}")
          print(
              f"Contradictions checked: "
              f"{len(contradictions)}"
          )
          print("------------------------------------------")
          print("Review                : LOCAL")
          print("Gemini                : NON REQUIS")
          print("Cost                  : 0 EUR")
          print("------------------------------------------")
          print("No knowledge was automatically deleted.")
          print("Conflicts are preserved for future review.")
          print("==========================================")
          PY

      - name: Commit V26 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V26 knowledge review"

          git push
