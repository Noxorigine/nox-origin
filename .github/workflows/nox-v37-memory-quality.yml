name: NØX Origin - V37 Memory Quality & Relevance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V37
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          memory_file = Path("nox_memory.json")
          report_file = Path("V37_MEMORY_REPORT.md")

          now = datetime.now(timezone.utc).isoformat()
          sentinel = "MEMORY_SENTINEL_V37_OK"

          print("===================================")
          print("NØX ORIGIN V37")
          print("Memory Quality & Relevance")
          print("===================================")

          # --------------------------------------------------
          # 1. LOAD MAIN MEMORY
          # --------------------------------------------------

          if not memory_file.exists():
              raise RuntimeError("nox_memory.json does not exist.")

          try:
              data = json.loads(
                  memory_file.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise RuntimeError(
                  f"Unable to read nox_memory.json: {exc}"
              )

          if not isinstance(data, dict):
              raise RuntimeError(
                  "nox_memory.json does not contain a valid JSON object."
              )

          # --------------------------------------------------
          # 2. PRESERVE EXISTING STRUCTURE
          # --------------------------------------------------

          data.setdefault("observations", [])
          data.setdefault("verification_log", [])
          data.setdefault("retrieval_log", [])
          data.setdefault("learning_log", [])
          data.setdefault("memory_quality_log", [])

          previous_version = data.get("version", "unknown")

          # --------------------------------------------------
          # 3. DEFINE MEMORY QUALITY MODEL
          # --------------------------------------------------

          quality_model = {
              "source_reliability": {
                  "description": (
                      "How trustworthy the origin of a memory is."
                  ),
                  "range": "0.0-1.0"
              },
              "confidence": {
                  "description": (
                      "How confident NØX is that the stored information "
                      "was correctly understood."
                  ),
                  "range": "0.0-1.0"
              },
              "freshness": {
                  "description": (
                      "How likely the information is to remain current."
                  ),
                  "range": "0.0-1.0"
              },
              "relevance": {
                  "description": (
                      "How useful the memory is for the current context."
                  ),
                  "range": "0.0-1.0"
              },
              "verification": {
                  "description": (
                      "Whether the information has been externally verified."
                  ),
                  "values": [
                      "unverified",
                      "requires_verification",
                      "verified"
                  ]
              }
          }

          data["memory_quality_model"] = quality_model

          # --------------------------------------------------
          # 4. CREATE V37 CONTROLLED MEMORY
          # --------------------------------------------------

          observation = {
              "id": "v37_quality_001",
              "content": (
                  "Memory quality depends on source reliability, confidence, "
                  "freshness, relevance and verification status."
              ),
              "source": "V37 controlled test",
              "source_reliability": 0.9,
              "confidence": 0.9,
              "freshness": 1.0,
              "relevance": 0.9,
              "verification_status": "requires_verification",
              "created_at": now
          }

          existing = next(
              (
                  item
                  for item in data["observations"]
                  if isinstance(item, dict)
                  and item.get("id") == observation["id"]
              ),
              None
          )

          if existing is None:
              data["observations"].append(observation)
              print("V37 quality observation added.")
          else:
              print("V37 quality observation already exists.")

          # --------------------------------------------------
          # 5. RETRIEVE V37 MEMORY
          # --------------------------------------------------

          retrieved = next(
              (
                  item
                  for item in data["observations"]
                  if isinstance(item, dict)
                  and item.get("id") == "v37_quality_001"
              ),
              None
          )

          if retrieved is None:
              raise RuntimeError(
                  "V37 memory retrieval test failed."
              )

          data["retrieval_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "success",
              "purpose": "quality_evaluation"
          })

          print("Memory retrieval: PASS")

          # --------------------------------------------------
          # 6. CALCULATE QUALITY SCORE
          # --------------------------------------------------

          quality_score = round(
              (
                  retrieved.get("source_reliability", 0)
                  + retrieved.get("confidence", 0)
                  + retrieved.get("freshness", 0)
                  + retrieved.get("relevance", 0)
              ) / 4,
              3
          )

          data["memory_quality_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "quality_score": quality_score,
              "verification_status": retrieved.get(
                  "verification_status",
                  "unverified"
              ),
              "status": "evaluated"
          })

          print(f"Memory quality score: {quality_score}")

          # --------------------------------------------------
          # 7. VERIFY SAFETY RULE
          # --------------------------------------------------

          if retrieved.get("verification_status") == "verified":
              treated_as_current_truth = True
          else:
              treated_as_current_truth = False

          if treated_as_current_truth:
              raise RuntimeError(
                  "Unverified memory was incorrectly treated as current truth."
              )

          data["verification_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "requires_external_verification",
              "treated_as_current_truth": False
          })

          print("Truth separation: PASS")

          # --------------------------------------------------
          # 8. RECORD LEARNING
          # --------------------------------------------------

          data["learning_log"].append({
              "timestamp": now,
              "lesson": (
                  "A memory should be evaluated by source reliability, "
                  "confidence, freshness, relevance and verification status "
                  "before being relied upon."
              )
          })

          print("Learning record: PASS")

          # --------------------------------------------------
          # 9. UPDATE VERSION
          # --------------------------------------------------

          data["version"] = "V37"
          data["last_updated"] = now
          data["sentinel"] = sentinel

          # --------------------------------------------------
          # 10. WRITE MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 11. RELOAD AND VERIFY PERSISTENCE
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if loaded.get("version") != "V37":
              raise RuntimeError(
                  "V37 version persistence check failed."
              )

          if loaded.get("sentinel") != sentinel:
              raise RuntimeError(
                  "V37 sentinel check failed."
              )

          if "memory_quality_model" not in loaded:
              raise RuntimeError(
                  "Memory quality model was not persisted."
              )

          if not any(
              isinstance(item, dict)
              and item.get("id") == "v37_quality_001"
              for item in loaded["observations"]
          ):
              raise RuntimeError(
                  "V37 observation persistence check failed."
              )

          if not loaded.get("memory_quality_log"):
              raise RuntimeError(
                  "Memory quality evaluation was not persisted."
              )

          print("JSON integrity: PASS")
          print("Quality model persistence: PASS")
          print("V37 persistence: PASS")

          # --------------------------------------------------
          # 12. GENERATE REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V37 Memory Quality Report",
              "",
              "## Memory Evolution",
              "",
              f"- Previous version: {previous_version}",
              "- Current version: V37",
              "- Main memory: `nox_memory.json`",
              "",
              "## Quality Dimensions",
              "",
              "V37 evaluates memory using:",
              "",
              "1. source reliability;",
              "2. confidence;",
              "3. freshness;",
              "4. relevance;",
              "5. verification status.",
              "",
              "## Controlled Test",
              "",
              "- V37 observation: PASS",
              "- Retrieval: PASS",
              f"- Quality score: {quality_score}",
              "- Verification separation: PASS",
              "- Unverified memory treated as current truth: NO",
              "",
              "## Learning",
              "",
              "NØX now records that stored information should be",
              "evaluated before being relied upon.",
              "",
              "## V37 Conclusion",
              "",
              "Memory quantity alone is insufficient.",
              "",
              "A useful memory system must evaluate the quality,",
              "relevance and verification state of stored information.",
              "",
              "V37 is a controlled architectural test,",
              "not a claim that every stored memory is correct."
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V37 COMPLETE")
          print("===================================")
          PY

      - name: Commit V37 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V37_MEMORY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V37 - Memory Quality & Relevance"
            git push
          fi
