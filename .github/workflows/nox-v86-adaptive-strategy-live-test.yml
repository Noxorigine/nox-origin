name: NØX V86 Adaptive Strategy Live Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v86-adaptive-strategy-live-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V86
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path, default=None):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {} if default is None else default

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def text_of(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("body", "content", "text", "title"):
                      if isinstance(value.get(key), str):
                          return value[key]
                  return json.dumps(value, ensure_ascii=False)
              return str(value)

          def score_post(post):
              title = text_of(post.get("title"))
              body = text_of(post.get("body"))
              text = f"{title} {body}".lower()

              score = 0
              evidence = []

              request_terms = [
                  "need someone",
                  "looking for",
                  "i need",
                  "we need",
                  "request",
                  "hire",
                  "hiring",
                  "seeking"
              ]

              delegation_terms = [
                  "can someone",
                  "could someone",
                  "please build",
                  "please fix",
                  "please create",
                  "looking for an agent",
                  "looking for someone",
                  "who can"
              ]

              deliverable_terms = [
                  "deliver",
                  "deliverable",
                  "build",
                  "create",
                  "fix",
                  "implement",
                  "produce",
                  "submit"
              ]

              acceptance_terms = [
                  "acceptance",
                  "criteria",
                  "must include",
                  "requirements",
                  "definition of done",
                  "success criteria"
              ]

              reward_terms = [
                  "reward",
                  "paid",
                  "payment",
                  "bounty",
                  "sats",
                  "btc",
                  "usdc",
                  "tip"
              ]

              deadline_terms = [
                  "deadline",
                  "by tomorrow",
                  "by friday",
                  "due date",
                  "within"
              ]

              application_terms = [
                  "apply",
                  "application",
                  "comment to apply",
                  "dm me",
                  "message me",
                  "submit"
              ]

              completion_terms = [
                  "completed",
                  "finished",
                  "done",
                  "delivered",
                  "already built",
                  "i built",
                  "we built"
              ]

              analysis_terms = [
                  "analysis",
                  "finding",
                  "research",
                  "explained",
                  "observations",
                  "my view"
              ]

              def contains(terms):
                  return any(term in text for term in terms)

              if contains(request_terms):
                  score += 30
                  evidence.append("explicit_request")

              if contains(delegation_terms):
                  score += 20
                  evidence.append("delegation")

              if contains(deliverable_terms):
                  score += 15
                  evidence.append("deliverable")

              if contains(acceptance_terms):
                  score += 15
                  evidence.append("acceptance_criteria")

              if contains(reward_terms):
                  score += 10
                  evidence.append("reward_or_compensation")

              if contains(deadline_terms):
                  score += 5
                  evidence.append("deadline")

              if contains(application_terms):
                  score += 5
                  evidence.append("application_route")

              if contains(completion_terms):
                  score -= 35
                  evidence.append("completion_signal")

              if contains(analysis_terms) and not contains(request_terms):
                  score -= 20
                  evidence.append("analysis_or_finding")

              if score >= 75:
                  classification = "HIGH_CONFIDENCE_OPPORTUNITY"
                  priority = "P1"
              elif score >= 55:
                  classification = "STRONG_OPPORTUNITY_CANDIDATE"
                  priority = "P2"
              elif score >= 35:
                  classification = "CONTEXTUAL_OPPORTUNITY"
                  priority = "P3"
              else:
                  classification = "LOW_PRIORITY_SIGNAL"
                  priority = "P4"

              return {
                  "score": score,
                  "classification": classification,
                  "priority": priority,
                  "evidence": evidence
              }

          def is_nox(post, agent_id, username):
              author = post.get("author") or post.get("user") or {}

              pid = str(
                  author.get("id")
                  or author.get("user_id")
                  or ""
              )

              uname = str(
                  author.get("username")
                  or ""
              ).lower()

              if agent_id and pid == agent_id:
                  return True

              if username and uname == username:
                  return True

              return False

          # ------------------------------------------------------------
          # 1. Authenticate
          # ------------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY is missing")

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )
          token_response.raise_for_status()

          token_data = token_response.json()
          token = token_data.get("access_token")

          if not token:
              raise SystemExit("No access_token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=30
          )
          me_response.raise_for_status()

          me = me_response.json()

          agent_id = str(
              me.get("id")
              or me.get("user_id")
              or ""
          )

          username = str(
              me.get("username")
              or ""
          ).lower()

          # ------------------------------------------------------------
          # 2. Load V85 adaptive strategy
          # ------------------------------------------------------------

          v85 = load(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          proposed_changes = v85.get("proposed_changes") or []
          strategy_state = str(
              v85.get("strategy_state")
              or "UNKNOWN"
          )

          adaptive_direction = str(
              (v85.get("observed_result") or {}).get(
                  "adaptive_direction"
              )
              or "MAINTAIN_WITH_CAUTION"
          )

          # ------------------------------------------------------------
          # 3. Retrieve fresh live data
          # ------------------------------------------------------------

          feed_response = requests.get(
              f"{BASE}/feed/for-you?limit=7",
              headers=headers,
              timeout=30
          )
          feed_response.raise_for_status()

          feed_data = feed_response.json()

          suggestions_response = requests.get(
              f"{BASE}/suggestions?limit=10",
              headers=headers,
              timeout=30
          )
          suggestions_response.raise_for_status()

          suggestions_data = suggestions_response.json()

          posts_response = requests.get(
              f"{BASE}/posts?limit=10",
              headers=headers,
              timeout=30
          )
          posts_response.raise_for_status()

          posts_data = posts_response.json()

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "posts",
                      "items",
                      "results",
                      "data",
                      "suggestions"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          feed_items = extract_items(feed_data)
          suggestion_items = extract_items(suggestions_data)
          public_items = extract_items(posts_data)

          # ------------------------------------------------------------
          # 4. Deduplicate live posts
          # ------------------------------------------------------------

          all_posts = []

          for source_name, items in (
              ("personalized_feed", feed_items),
              ("suggestions", suggestion_items),
              ("public_posts", public_items)
          ):
              for item in items:
                  if not isinstance(item, dict):
                      continue

                  pid = str(item.get("id") or "")

                  if not pid:
                      continue

                  if is_nox(item, agent_id, username):
                      continue

                  copy = dict(item)
                  copy["_source"] = source_name
                  all_posts.append(copy)

          unique = {}

          for post in all_posts:
              pid = str(post.get("id"))
              if pid not in unique:
                  unique[pid] = post

          candidates = list(unique.values())

          # ------------------------------------------------------------
          # 5. Score fresh opportunities
          # ------------------------------------------------------------

          ranked = []

          for post in candidates:
              evaluation = score_post(post)

              ranked.append({
                  "post_id": str(post.get("id")),
                  "title": text_of(post.get("title")),
                  "post_type": post.get("post_type"),
                  "source": post.get("_source"),
                  "score": evaluation["score"],
                  "classification": evaluation["classification"],
                  "priority": evaluation["priority"],
                  "evidence": evaluation["evidence"]
              })

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # ------------------------------------------------------------
          # 6. Compare strategy impact
          # ------------------------------------------------------------

          high_confidence = [
              x for x in ranked
              if x["classification"] == "HIGH_CONFIDENCE_OPPORTUNITY"
          ]

          strong_candidates = [
              x for x in ranked
              if x["classification"] == "STRONG_OPPORTUNITY_CANDIDATE"
          ]

          contextual = [
              x for x in ranked
              if x["classification"] == "CONTEXTUAL_OPPORTUNITY"
          ]

          low_priority = [
              x for x in ranked
              if x["classification"] == "LOW_PRIORITY_SIGNAL"
          ]

          # Evidence convergence is the primary measurement.
          evidence_scores = [
              x["score"] for x in ranked
          ]

          average_score = (
              sum(evidence_scores) / len(evidence_scores)
              if evidence_scores
              else 0
          )

          if high_confidence:
              test_result = "ADAPTATION_SUPPORTED"

          elif strong_candidates:
              test_result = "ADAPTATION_PARTIALLY_SUPPORTED"

          elif contextual:
              test_result = "ADAPTATION_REQUIRES_MORE_EVIDENCE"

          else:
              test_result = "NO_STRONG_OPPORTUNITY_OBSERVED"

          # ------------------------------------------------------------
          # 7. Detect whether the new strategy is over-pruning
          # ------------------------------------------------------------

          total = len(ranked)

          if total:
              low_ratio = len(low_priority) / total
          else:
              low_ratio = 1.0

          if total >= 5 and low_ratio >= 0.85:
              pruning_warning = True
          else:
              pruning_warning = False

          # ------------------------------------------------------------
          # 8. Generate autonomous learning conclusions
          # ------------------------------------------------------------

          conclusions = []

          if test_result == "ADAPTATION_SUPPORTED":
              conclusions.append(
                  "Fresh live data contains at least one high-confidence opportunity signal."
              )
              conclusions.append(
                  "The evidence-weighted strategy remains compatible with useful autonomous prioritization."
              )

          elif test_result == "ADAPTATION_PARTIALLY_SUPPORTED":
              conclusions.append(
                  "Fresh live data contains strong opportunity candidates but not enough evidence for a definitive high-confidence result."
              )
              conclusions.append(
                  "The adaptive strategy should continue testing before stronger autonomy is granted."
              )

          elif test_result == "ADAPTATION_REQUIRES_MORE_EVIDENCE":
              conclusions.append(
                  "Fresh data contains contextual signals but insufficient evidence for strong autonomous prioritization."
              )
              conclusions.append(
                  "More observations are required before increasing action priority."
              )

          else:
              conclusions.append(
                  "No strong opportunity was observed in the current live sample."
              )
              conclusions.append(
                  "The absence of a strong opportunity is not proof that the strategy is ineffective."
              )

          if pruning_warning:
              conclusions.append(
                  "A high proportion of low-priority results may indicate over-pruning and should be monitored."
              )
          else:
              conclusions.append(
                  "No immediate over-pruning warning was detected in the current sample."
              )

          conclusions.append(
              "Fresh primary data must remain the basis for future strategy evaluation."
          )

          # ------------------------------------------------------------
          # 9. Build V86 result
          # ------------------------------------------------------------

          result = {
              "version": "V86",
              "generated_at": now(),
              "mode": "adaptive_strategy_live_test",
              "agent": {
                  "id": agent_id,
                  "username": username
              },
              "strategy_under_test": {
                  "source_version": "V85",
                  "state": strategy_state,
                  "adaptive_direction": adaptive_direction,
                  "proposed_changes": proposed_changes
              },
              "live_sources": {
                  "personalized_feed": len(feed_items),
                  "suggestions": len(suggestion_items),
                  "public_posts": len(public_items),
                  "deduplicated_candidates": len(candidates)
              },
              "evaluation": {
                  "total_ranked": total,
                  "high_confidence_opportunities": len(high_confidence),
                  "strong_candidates": len(strong_candidates),
                  "contextual_opportunities": len(contextual),
                  "low_priority_signals": len(low_priority),
                  "average_score": round(average_score, 2),
                  "low_priority_ratio": round(low_ratio, 3),
                  "over_pruning_warning": pruning_warning
              },
              "top_candidates": ranked[:10],
              "test": {
                  "result": test_result,
                  "conclusions": conclusions
              },
              "learning": {
                  "strategy_supported": test_result in (
                      "ADAPTATION_SUPPORTED",
                      "ADAPTATION_PARTIALLY_SUPPORTED"
                  ),
                  "stronger_autonomy_justified": test_result == "ADAPTATION_SUPPORTED",
                  "automatic_rule_deployment": False,
                  "lessons": conclusions,
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V83-EXECUTION-RESULT-REQUIRES-PRIMARY-SOURCE",
                      "REG-V84-OUTCOME-MUST-BE-OBSERVED-BEFORE-ADAPTATION",
                      "REG-V85-STRATEGY-REQUIRES-LIVE-VALIDATION"
                  ]
              },
              "decision": {
                  "answer_status": "LIVE_STRATEGY_TEST_COMPLETED",
                  "confidence": (
                      0.90
                      if test_result == "ADAPTATION_SUPPORTED"
                      else 0.78
                      if test_result == "ADAPTATION_PARTIALLY_SUPPORTED"
                      else 0.65
                  ),
                  "automatic_strategy_activation": False,
                  "future_versions_may_use_results": True
              },
              "autonomy": {
                  "live_data_evaluation": True,
                  "strategy_testing": True,
                  "adaptive_learning": True,
                  "automatic_strategy_activation": False,
                  "external_action": False
              },
              "next_stage": {
                  "version": "V87",
                  "purpose": "Use repeated live tests and historical outcomes to refine autonomous prioritization."
              },
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          save(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.json",
              result
          )

          # ------------------------------------------------------------
          # 10. Markdown report
          # ------------------------------------------------------------

          md = []

          md.append("# NØX V86 — Adaptive Strategy Live Test")
          md.append("")
          md.append(f"Generated: {result['generated_at']}")
          md.append("")
          md.append("## Strategy under test")
          md.append("")
          md.append("- Source: V85")
          md.append(f"- State: {strategy_state}")
          md.append(f"- Direction: {adaptive_direction}")
          md.append("")
          md.append("## Live data")
          md.append("")
          md.append(
              f"- Personalized feed: {len(feed_items)}"
          )
          md.append(
              f"- Suggestions: {len(suggestion_items)}"
          )
          md.append(
              f"- Public posts: {len(public_items)}"
          )
          md.append(
              f"- Deduplicated candidates: {len(candidates)}"
          )
          md.append("")
          md.append("## Evaluation")
          md.append("")
          md.append(
              f"- High-confidence opportunities: {len(high_confidence)}"
          )
          md.append(
              f"- Strong candidates: {len(strong_candidates)}"
          )
          md.append(
              f"- Contextual opportunities: {len(contextual)}"
          )
          md.append(
              f"- Low-priority signals: {len(low_priority)}"
          )
          md.append(
              f"- Average score: {round(average_score, 2)}"
          )
          md.append(
              f"- Over-pruning warning: {pruning_warning}"
          )
          md.append("")
          md.append("## Test result")
          md.append("")
          md.append(f"**{test_result}**")
          md.append("")

          for conclusion in conclusions:
              md.append(f"- {conclusion}")

          md.append("")
          md.append("## Top candidates")
          md.append("")

          for item in ranked[:10]:
              md.append(
                  f"- `{item['priority']}` "
                  f"{item['classification']} "
                  f"score={item['score']} "
                  f"post={item['post_id']} "
                  f"title={item['title']}"
              )

          md.append("")
          md.append("## Autonomy")
          md.append("")
          md.append("- Live strategy evaluation: enabled")
          md.append("- Adaptive learning: enabled")
          md.append("- Automatic strategy activation: disabled")
          md.append("- External action: disabled")
          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V87 — Refine autonomous prioritization using repeated live tests and historical outcomes."
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V86
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v86_adaptive_strategy_live_test.json
          git add memory/nox_v86_adaptive_strategy_live_test.md

          git diff --cached --quiet || \
            git commit -m "NØX V86 adaptive strategy live test"

          git push
