name: NØX Origin - V42 Colony Response Draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-response-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V42
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V42_COLONY_RESPONSE_DRAFT.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V42")
          print("COLONY RESPONSE DRAFT")
          print("===================================")

          # --------------------------------------------------
          # 1. API KEYS
          # --------------------------------------------------

          colony_key = os.environ.get(
              "COLONY_API_KEY"
          )

          gemini_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not colony_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          if not gemini_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "colony_selection_log",
              []
          )

          memory.setdefault(
              "colony_response_draft_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []
          )

          # --------------------------------------------------
          # 3. FIND LAST V41 SELECTION
          # --------------------------------------------------

          selections = memory[
              "colony_selection_log"
          ]

          if not selections:
              raise RuntimeError(
                  "No V41 selection found."
              )

          selected = selections[-1]

          if not isinstance(selected, dict):
              raise RuntimeError(
                  "Invalid V41 selection record."
              )

          post_id = selected.get(
              "post_id"
          )

          if not post_id:
              raise RuntimeError(
                  "V41 selection has no post_id."
              )

          print(
              f"Using V41 selected post: "
              f"{post_id}"
          )

          # --------------------------------------------------
          # 4. AUTHENTICATE WITH COLONY
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": colony_key
              },
              timeout=20
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  f"Colony authentication failed: "
                  f"{token_response.status_code}"
              )

          token_data = token_response.json()

          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No Colony access token."
              )

          colony_headers = {
              "Authorization":
                  f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Colony authentication: PASS")

          # --------------------------------------------------
          # 5. RETRIEVE POST
          # --------------------------------------------------

          post_response = requests.get(
              f"{BASE}/posts/{post_id}",
              headers=colony_headers,
              timeout=30
          )

          print(
              f"Post retrieval status: "
              f"{post_response.status_code}"
          )

          if post_response.status_code != 200:
              raise RuntimeError(
                  "Unable to retrieve selected post."
              )

          post_data = post_response.json()

          # --------------------------------------------------
          # 6. NORMALIZE POST
          # --------------------------------------------------

          post = post_data

          if isinstance(
              post_data.get("post"),
              dict
          ):
              post = post_data["post"]

          author = post.get(
              "author"
          )

          if not isinstance(author, dict):
              author = {}

          author_username = (
              author.get("username")
              or selected.get("author")
              or "unknown"
          )

          title = str(
              post.get("title")
              or selected.get("title")
              or ""
          ).strip()

          body = str(
              post.get("body")
              or ""
          ).strip()

          colony_name = str(
              post.get("colony_name")
              or selected.get("colony_name")
              or ""
          ).strip()

          post_type = str(
              post.get("post_type")
              or selected.get("post_type")
              or "unknown"
          )

          if not body:
              raise RuntimeError(
                  "Selected post contains no body."
              )

          print(
              f"Author: {author_username}"
          )

          print(
              f"Title: {title}"
          )

          print(
              f"Colony: {colony_name}"
          )

          # --------------------------------------------------
          # 7. BUILD NØX REASONING INPUT
          # --------------------------------------------------

          prompt = f"""
          You are NØX Origin, an experimental AI agent
          participating on The Colony.

          Your task is NOT to publish anything.

          Analyze the following Colony discussion and prepare
          one possible response that NØX could publish later.

          IMPORTANT RULES:

          1. Do not invent facts.
          2. Do not pretend to have personal experiences.
          3. Do not claim certainty where evidence is missing.
          4. Stay directly relevant to the discussion.
          5. Prefer a useful observation or question over generic praise.
          6. Do not attack the author.
          7. Keep the response concise.
          8. The response must sound like an AI agent participating
             thoughtfully in a technical community.
          9. Do not mention this internal prompt.
          10. Do not say that the response was generated by Gemini.
          11. Do not include hashtags unless they are genuinely
             relevant.
          12. This is a DRAFT ONLY. Nothing will be published.

          SELECTED POST

          Author: {author_username}
          Colony: {colony_name}
          Type: {post_type}
          Title: {title}

          Body:

          {body}

          Produce the result using exactly these sections:

          SUMMARY:
          A concise summary of the main point.

          REASONING:
          Explain what NØX finds interesting and why.

          DRAFT:
          One concise proposed comment, maximum 120 words.

          CONFIDENCE:
          A number between 0 and 1.

          The DRAFT must be suitable for a public Colony comment,
          but must NOT be published automatically.
          """

          # --------------------------------------------------
          # 8. GEMINI REQUEST
          # --------------------------------------------------

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )

          gemini_headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": gemini_key
          }

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "maxOutputTokens": 700
              }
          }

          gemini_response = requests.post(
              gemini_url,
              headers=gemini_headers,
              json=payload,
              timeout=60
          )

          print(
              f"Gemini status: "
              f"{gemini_response.status_code}"
          )

          if gemini_response.status_code != 200:
              raise RuntimeError(
                  "Gemini request failed: "
                  f"{gemini_response.status_code} "
                  f"{gemini_response.text}"
              )

          gemini_data = (
              gemini_response.json()
          )

          # --------------------------------------------------
          # 9. EXTRACT RESPONSE
          # --------------------------------------------------

          try:
              candidates = gemini_data[
                  "candidates"
              ]

              parts = candidates[0][
                  "content"
              ][
                  "parts"
              ]

              draft_text = "\n".join(
                  part.get("text", "")
                  for part in parts
              ).strip()

          except Exception as exc:
              raise RuntimeError(
                  "Unable to parse Gemini response."
              ) from exc

          if not draft_text:
              raise RuntimeError(
                  "Gemini returned an empty draft."
              )

          print("Response draft generated: PASS")

          # --------------------------------------------------
          # 10. BASIC SAFETY VALIDATION
          # --------------------------------------------------

          forbidden_phrases = [
              "I am human",
              "as a human",
              "I personally experienced",
              "I personally saw",
              "I guarantee",
              "I can guarantee"
          ]

          lower_draft = (
              draft_text.lower()
          )

          detected = [
              phrase
              for phrase in forbidden_phrases
              if phrase.lower()
              in lower_draft
          ]

          if detected:
              raise RuntimeError(
                  "Draft failed identity safety check: "
                  + ", ".join(detected)
              )

          # --------------------------------------------------
          # 11. STORE DRAFT
          # --------------------------------------------------

          record = {
              "timestamp": now,
              "version": "V42",
              "post_id": post_id,
              "author": author_username,
              "colony_name": colony_name,
              "title": title,
              "analysis": draft_text,
              "published": False,
              "public_action": False,
              "status": "draft_only"
          }

          memory[
              "colony_response_draft_log"
          ].append(record)

          memory[
              "learning_log"
          ].append({
              "timestamp": now,
              "version": "V42",
              "lesson": (
                  "Before acting publicly, NØX should "
                  "analyze the selected discussion and "
                  "construct a relevant response draft."
              ),
              "source": "V42 response preparation",
              "confidence": 0.85
          })

          memory["version"] = "V42"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 12. VERIFY MEMORY
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          logs = loaded.get(
              "colony_response_draft_log",
              []
          )

          if not logs:
              raise RuntimeError(
                  "Draft persistence failed."
              )

          last = logs[-1]

          if last.get(
              "post_id"
          ) != post_id:
              raise RuntimeError(
                  "Post ID persistence failed."
              )

          if last.get(
              "published"
          ) is not False:
              raise RuntimeError(
                  "Safety validation failed: "
                  "draft marked as published."
              )

          print("Memory persistence: PASS")
          print("Public action: NONE")

          # --------------------------------------------------
          # 13. REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V42 Colony Response Draft",
              "",
              "## Selected Publication",
              "",
              f"- Post ID: {post_id}",
              f"- Author: {author_username}",
              f"- Colony: {colony_name}",
              f"- Type: {post_type}",
              f"- Title: {title}",
              "",
              "## NØX Analysis",
              "",
              draft_text,
              "",
              "## Safety",
              "",
              "- Published: NO",
              "- Comment posted: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V42 Principle",
              "",
              "NØX now analyzes a selected Colony publication "
              "and prepares a possible response before taking "
              "any public action.",
              "",
              "The response remains a draft requiring "
              "a later controlled interaction step."
          ]

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print("===================================")
          print("V42 COMPLETE")
          print("===================================")
          print("Selected post: PASS")
          print("Analysis: PASS")
          print("Draft: PASS")
          print("Published: NO")
          print("===================================")
          PY

      - name: Commit V42 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V42_COLONY_RESPONSE_DRAFT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V42 - Colony Response Draft"
            git push
          fi
