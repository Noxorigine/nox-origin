name: NØX ACT54 - Experimental Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

jobs:
  act54:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          set -e
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT54 - Experimental Learning
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT53_FILE = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.json"
          ACT54_JSON = MEMORY_DIR / "nox_act_54_experimental_learning.json"
          ACT54_MD = MEMORY_DIR / "nox_act_54_experimental_learning.md"

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 76)
          print("NØX ACT54 V2 - EXPERIMENTAL LEARNING")
          print("=" * 76)

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not read {path}: {exc}")
                  return None

          act53 = load_json(ACT53_FILE)

          if act53 is None:
              raise RuntimeError(
                  f"Required ACT53 memory not found or unreadable: {ACT53_FILE}"
              )

          if act53.get("act") != "ACT53":
              raise RuntimeError(
                  f"ACT53 identity check failed: "
                  f"expected ACT53, got {act53.get('act')!r}"
              )

          prediction = act53.get("prediction") or {}
          outcome = act53.get("outcome") or {}
          verification = act53.get("verification") or {}

          prediction_id = prediction.get("prediction_id")
          prediction_status = prediction.get("status")
          outcome_status = outcome.get("status")
          real_observation = outcome.get("real_observation") is True
          invented_outcome = outcome.get("invented_outcome") is True
          simulated_outcome = outcome.get("simulated_outcome") is True

          print()
          print("ACT53 EXPERIMENT")
          print("-" * 76)
          print(f"Prediction ID:        {prediction_id!r}")
          print(f"Prediction status:    {prediction_status!r}")
          print(f"Outcome status:       {outcome_status!r}")
          print(f"Real observation:     {real_observation!r}")
          print(f"Invented outcome:     {invented_outcome!r}")
          print(f"Simulated outcome:    {simulated_outcome!r}")
          print(
              f"Comparison completed: "
              f"{verification.get('comparison_completed')!r}"
          )

          COMPLETED_STATUSES = {
              "CONFIRMED",
              "REFUTED",
              "PARTIALLY_CONFIRMED",
              "UNRESOLVED",
          }

          valid_experiment = (
              prediction_id is not None
              and outcome_status in COMPLETED_STATUSES
              and real_observation
              and not invented_outcome
              and not simulated_outcome
              and verification.get("comparison_completed") is True
          )

          lessons = []

          if valid_experiment:
              observed_state = outcome.get("observed_state") or {}
              expected_state = outcome.get("expected_state") or {}
              comparison = outcome.get("comparison") or {}

              all_match = comparison.get("all_match") is True

              if outcome_status == "CONFIRMED" and all_match:
                  lesson_type = "EMPIRICAL_CONFIRMATION"

                  lesson = (
                      "This experiment provides evidence that, in the "
                      "observed case, NØX's cognitive uncertainty gate "
                      "remained consistent across a subsequent ACT50 "
                      "evaluation: the decision remained "
                      "NO_DEFENSIBLE_DECISION, the decision was not "
                      "supported, and advancement remained blocked."
                  )

                  evidence = (
                      "The prediction was created before the observed "
                      "ACT50 evaluation, and all expected state fields "
                      "matched the real observation."
                  )

                  limitation = (
                      "This single confirmed experiment does not establish "
                      "a universal rule. It shows consistency for this "
                      "specific cognitive state and observation."
                  )

                  impact = {
                      "confidence_update_allowed": False,
                      "confidence_update": None,
                      "generalization_allowed": False,
                      "strategy_change_required": False,
                      "reason": (
                          "One confirmed experiment is insufficient to "
                          "calibrate confidence or establish a general rule."
                      ),
                  }

              elif outcome_status == "REFUTED":
                  lesson_type = "EMPIRICAL_REFUTATION"

                  lesson = (
                      "This experiment shows that the expected cognitive "
                      "state did not persist into the newer observation."
                  )

                  evidence = (
                      "The newer ACT50 evaluation contradicted the "
                      "prediction's expected state."
                  )

                  limitation = (
                      "A single refuted prediction does not prove that the "
                      "previous expectation is always wrong."
                  )

                  impact = {
                      "confidence_update_allowed": False,
                      "confidence_update": None,
                      "generalization_allowed": False,
                      "strategy_change_required": False,
                      "reason": (
                          "The observation identifies a failed prediction "
                          "but is insufficient for broad recalibration."
                      ),
                  }

              elif outcome_status == "PARTIALLY_CONFIRMED":
                  lesson_type = "EMPIRICAL_PARTIAL_CONFIRMATION"

                  lesson = (
                      "This experiment provides partial evidence for the "
                      "prediction, but at least one expected state "
                      "component differed from the real observation."
                  )

                  evidence = (
                      "The newer ACT50 evaluation matched only part of "
                      "the expected state."
                  )

                  limitation = (
                      "The available evidence is insufficient to establish "
                      "a stable general relationship."
                  )

                  impact = {
                      "confidence_update_allowed": False,
                      "confidence_update": None,
                      "generalization_allowed": False,
                      "strategy_change_required": False,
                      "reason": (
                          "Partial confirmation requires additional "
                          "observations before confidence can be changed."
                      ),
                  }

              else:
                  lesson_type = "EMPIRICAL_UNRESOLVED"

                  lesson = (
                      "The experiment produced a real observation, but "
                      "the available evidence does not resolve the "
                      "prediction sufficiently."
                  )

                  evidence = (
                      "A real outcome exists, but it cannot support a "
                      "clear confirmation or refutation."
                  )

                  limitation = (
                      "The unresolved observation cannot safely modify "
                      "confidence or establish a general rule."
                  )

                  impact = {
                      "confidence_update_allowed": False,
                      "confidence_update": None,
                      "generalization_allowed": False,
                      "strategy_change_required": False,
                      "reason": (
                          "Unresolved evidence must remain unresolved "
                          "until stronger observations become available."
                      ),
                  }

              lesson_payload = {
                  "lesson_id": None,
                  "lesson_type": lesson_type,
                  "prediction_id": prediction_id,
                  "outcome_status": outcome_status,
                  "lesson": lesson,
                  "evidence": evidence,
                  "limitation": limitation,
                  "observed_state": observed_state,
                  "expected_state": expected_state,
                  "comparison": comparison,
                  "epistemic_scope": (
                      "specific_observation_only"
                  ),
                  "confidence_change": None,
                  "generalization": "NOT_ALLOWED",
              }

              fingerprint_source = json.dumps(
                  {
                      "prediction_id": prediction_id,
                      "outcome_status": outcome_status,
                      "observed_at": outcome.get("observed_at_utc"),
                      "lesson_type": lesson_type,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )

              lesson_fingerprint = hashlib.sha256(
                  fingerprint_source.encode("utf-8")
              ).hexdigest()[:16]

              lesson_payload["lesson_id"] = f"L54-{lesson_fingerprint}"

              lessons.append(lesson_payload)

              aggregate = {
                  "completed_experiments": 1,
                  "confirmed": int(outcome_status == "CONFIRMED"),
                  "refuted": int(outcome_status == "REFUTED"),
                  "partially_confirmed": int(
                      outcome_status == "PARTIALLY_CONFIRMED"
                  ),
                  "unresolved": int(outcome_status == "UNRESOLVED"),
              }

              learning_status = "EMPIRICAL_LEARNING_EXTRACTED"

              print()
              print("[LEARNING] Real completed experiment detected.")
              print(f"[LEARNING] Lesson ID: {lesson_payload['lesson_id']}")
              print(f"[LEARNING] Type: {lesson_type}")
              print("[LEARNING] Generalization: NOT_ALLOWED")

          else:
              aggregate = {
                  "completed_experiments": 0,
                  "confirmed": 0,
                  "refuted": 0,
                  "partially_confirmed": 0,
                  "unresolved": 0,
              }

              learning_status = "WAITING_FOR_EXPERIMENTAL_EVIDENCE"

              impact = {
                  "confidence_update_allowed": False,
                  "confidence_update": None,
                  "generalization_allowed": False,
                  "strategy_change_required": False,
                  "reason": (
                      "ACT53 does not currently contain a completed real "
                      "experiment that satisfies ACT54's evidence gate."
                  ),
              }

              print()
              print("[LEARNING] No valid completed experiment available.")

          result = {
              "act": "ACT54",
              "version": "V2",
              "title": "Experimental Learning",
              "question": (
                  "Qu'est-ce que mes expériences réelles m'apprennent, "
                  "et comment dois-je modifier ce que je crois savoir ?"
              ),
              "timestamp_utc": timestamp,
              "status": learning_status,
              "input": {
                  "source_act": "ACT53",
                  "prediction_id": prediction_id,
                  "prediction_status": prediction_status,
                  "outcome_status": outcome_status,
                  "real_observation": real_observation,
                  "invented_outcome": invented_outcome,
                  "simulated_outcome": simulated_outcome,
                  "comparison_completed": (
                      verification.get("comparison_completed") is True
                  ),
              },
              "learning": {
                  "status": learning_status,
                  "lesson_count": len(lessons),
                  "lessons": lessons,
                  "aggregate": aggregate,
                  "confidence_update_allowed": impact[
                      "confidence_update_allowed"
                  ],
                  "generalization_allowed": impact[
                      "generalization_allowed"
                  ],
                  "impact": impact,
              },
              "epistemic_rules": {
                  "absence_of_evidence_is_not_success": True,
                  "pending_prediction_is_not_learning": True,
                  "unresolved_result_does_not_update_confidence": True,
                  "single_success_does_not_prove_general_rule": True,
                  "single_failure_does_not_prove_universal_failure": True,
                  "confirmed_result_is_evidence_not_certainty": True,
                  "learning_must_reference_real_outcome": True,
                  "learning_scope_must_remain_bounded": True,
              },
              "source_evidence": {
                  "prediction": prediction,
                  "outcome": outcome,
                  "verification": verification,
              },
              "safety": {
                  "lesson_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "confidence_fabricated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
                  "initiative_execution": False,
              },
              "next_step": (
                  "Use the bounded empirical lesson in future "
                  "decision-making and continue collecting independent "
                  "observations."
                  if lessons
                  else
                  "Wait for a completed real experimental outcome."
              ),
          }

          with ACT54_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          md = [
              "# NØX ACT54 V2 - Experimental Learning",
              "",
              f"Status: **{result['status']}**",
              "",
              "## Source experiment",
              "",
              f"- Prediction: `{prediction_id}`",
              f"- Prediction status: `{prediction_status}`",
              f"- Outcome: `{outcome_status}`",
              f"- Real observation: `{real_observation}`",
              f"- Comparison completed: "
              f"`{verification.get('comparison_completed')}`",
              "",
          ]

          if lessons:
              lesson = lessons[0]

              md.extend(
                  [
                      "## Empirical lesson",
                      "",
                      f"- Lesson ID: `{lesson['lesson_id']}`",
                      f"- Type: `{lesson['lesson_type']}`",
                      "",
                      lesson["lesson"],
                      "",
                      "**Evidence:**",
                      "",
                      lesson["evidence"],
                      "",
                      "**Limitation:**",
                      "",
                      lesson["limitation"],
                      "",
                      "**Generalization:** NOT ALLOWED",
                      "",
                      "**Confidence update:** NOT ALLOWED",
                      "",
                  ]
              )
          else:
              md.extend(
                  [
                      "## Empirical lesson",
                      "",
                      "No defensible empirical lesson was extracted.",
                      "",
                  ]
              )

          md.extend(
              [
                  "## Epistemic discipline",
                  "",
                  "- A confirmed experiment is evidence, not certainty.",
                  "- One success does not establish a general rule.",
                  "- One failure does not establish universal failure.",
                  "- Unresolved evidence does not modify confidence.",
                  "- No confidence was fabricated.",
                  "",
                  "## Safety",
                  "",
                  "- No Gemini",
                  "- No external AI",
                  "- No external API",
                  "- No marketplace action",
                  "- No payment",
                  "- No spending",
                  "- No Colony creation",
                  "- No initiative execution",
                  "",
                  f"Next step: {result['next_step']}",
                  "",
              ]
          )

          ACT54_MD.write_text(
              "\n".join(md),
              encoding="utf-8",
          )

          print()
          print("=" * 76)
          print("ACT54 FINAL STATE")
          print("=" * 76)
          print(f"Status:              {result['status']}")
          print(f"Prediction ID:       {prediction_id}")
          print(f"Outcome:             {outcome_status}")
          print(f"Lessons extracted:   {len(lessons)}")
          print(
              f"Generalization:      "
              f"{result['learning']['generalization_allowed']}"
          )
          print(
              f"Confidence update:   "
              f"{result['learning']['confidence_update_allowed']}"
          )
          print("=" * 76)
          PY

      - name: Commit ACT54 memory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_54_experimental_learning.json
          git add memory/nox_act_54_experimental_learning.md

          if git diff --cached --quiet; then
            echo "No ACT54 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT54: extract empirical learning"

      - name: Synchronize before push
        shell: bash
        run: |
          git fetch origin main

          if ! git diff --quiet origin/main...HEAD; then
            git rebase origin/main
          fi

      - name: Push ACT54
        shell: bash
        run: |
          git push origin HEAD:main
