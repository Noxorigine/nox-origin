name: NØX ACT54 - Experimental Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

jobs:
  act54:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT54 - Experimental Learning
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          ACT53_FILE = MEMORY_DIR / "nox_act_53_empirical_prediction_loop.json"
          ACT54_JSON = MEMORY_DIR / "nox_act_54_experimental_learning.json"
          ACT54_MD = MEMORY_DIR / "nox_act_54_experimental_learning.md"

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 72)
          print("NØX ACT54 V1 - EXPERIMENTAL LEARNING")
          print("=" * 72)

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not read {path}: {exc}")
                  return None

          act53 = load_json(ACT53_FILE)

          if act53 is None:
              raise RuntimeError(
                  f"Required ACT53 memory not found or unreadable: {ACT53_FILE}"
              )

          if act53.get("act") != "ACT53":
              raise RuntimeError(
                  f"ACT53 identity check failed: "
                  f"expected ACT53, got {act53.get('act')!r}"
              )

          prediction = act53.get("prediction")

          if not isinstance(prediction, dict):
              prediction = None

          verification = act53.get("verification") or {}
          learning_from_act53 = act53.get("learning") or {}

          prediction_id = (
              prediction.get("prediction_id")
              if prediction
              else None
          )

          prediction_status = (
              prediction.get("status")
              if prediction
              else None
          )

          observed_pairs = verification.get("observed_pairs", 0)
          evaluated_predictions = (
              verification.get("evaluated_predictions") or []
          )

          print()
          print("ACT53 INPUT")
          print("-" * 72)
          print(f"prediction id:            {prediction_id!r}")
          print(f"prediction status:        {prediction_status!r}")
          print(f"observed evidence pairs:  {observed_pairs}")
          print(
              f"evaluated predictions:    "
              f"{len(evaluated_predictions)}"
          )

          # ---------------------------------------------------------------
          # ACT54 PRINCIPLE
          #
          # ACT54 learns from REAL experimental outcomes only.
          #
          # It never converts a pending prediction into a lesson.
          # It never treats absence of evidence as evidence.
          # It never fabricates a successful or failed experiment.
          #
          # When enough real evidence exists, ACT54 extracts:
          #   - what happened
          #   - whether the prediction was supported
          #   - what error occurred
          #   - what confidence lesson can be retained
          #   - what should change in future reasoning
          #
          # With only one unresolved prediction, ACT54 remains waiting.
          # ---------------------------------------------------------------

          completed = []

          for item in evaluated_predictions:
              if not isinstance(item, dict):
                  continue

              result = item.get("result")

              if result in {
                  "CONFIRMED",
                  "REFUTED",
                  "PARTIALLY_CONFIRMED",
                  "UNRESOLVED",
              }:
                  completed.append(item)

          lessons = []

          for item in completed:
              result = item.get("result")
              calibration = item.get("calibration") or {}

              confidence = calibration.get(
                  "confidence_before_result"
              )

              if result == "CONFIRMED":
                  lesson_type = "SUPPORTED_PREDICTION"

                  lesson = (
                      "The observed outcome supported the prediction. "
                      "The reasoning pattern has empirical support for "
                      "this experiment, but one successful observation "
                      "does not establish general validity."
                  )

                  confidence_effect = (
                      "Do not automatically increase confidence. "
                      "Use repeated comparable outcomes before treating "
                      "the prediction pattern as strongly reliable."
                  )

              elif result == "REFUTED":
                  lesson_type = "PREDICTION_ERROR"

                  lesson = (
                      "The observed outcome contradicted the prediction. "
                      "The reasoning that produced the prediction must "
                      "be treated as an empirical error for this case."
                  )

                  confidence_effect = (
                      "Future confidence should be reduced for comparable "
                      "situations unless new evidence explains the failure."
                  )

              elif result == "PARTIALLY_CONFIRMED":
                  lesson_type = "PARTIAL_EVIDENCE"

                  lesson = (
                      "The outcome only partially matched the prediction. "
                      "The original prediction cannot be considered fully "
                      "validated."
                  )

                  confidence_effect = (
                      "Avoid binary conclusions and preserve uncertainty "
                      "for similar future cases."
                  )

              else:
                  lesson_type = "UNRESOLVED_EXPERIMENT"

                  lesson = (
                      "The available outcome does not establish whether "
                      "the prediction was correct."
                  )

                  confidence_effect = (
                      "Do not update confidence from an unresolved result."
                  )

              lessons.append({
                  "prediction_id": item.get("prediction_id"),
                  "result": result,
                  "lesson_type": lesson_type,
                  "lesson": lesson,
                  "confidence_before_result": confidence,
                  "confidence_effect": confidence_effect,
              })

          # ---------------------------------------------------------------
          # Aggregate evidence
          # ---------------------------------------------------------------

          confirmed = sum(
              1 for x in completed
              if x.get("result") == "CONFIRMED"
          )

          refuted = sum(
              1 for x in completed
              if x.get("result") == "REFUTED"
          )

          partial = sum(
              1 for x in completed
              if x.get("result") == "PARTIALLY_CONFIRMED"
          )

          unresolved = sum(
              1 for x in completed
              if x.get("result") == "UNRESOLVED"
          )

          completed_count = len(completed)

          if completed_count == 0:
              status = "WAITING_FOR_EXPERIMENTAL_EVIDENCE"

              learning_state = {
                  "status": "NO_EMPIRICAL_LEARNING_YET",
                  "lesson_count": 0,
                  "lessons": [],
                  "aggregate": {
                      "completed_experiments": 0,
                      "confirmed": 0,
                      "refuted": 0,
                      "partially_confirmed": 0,
                      "unresolved": 0,
                  },
                  "confidence_update_allowed": False,
                  "generalization_allowed": False,
                  "reason": (
                      "ACT54 has no completed real experiment from which "
                      "a defensible learning signal can be extracted."
                  ),
              }

          else:
              status = "EMPIRICAL_LEARNING_AVAILABLE"

              learning_state = {
                  "status": "LEARNING_EXTRACTED",
                  "lesson_count": len(lessons),
                  "lessons": lessons,
                  "aggregate": {
                      "completed_experiments": completed_count,
                      "confirmed": confirmed,
                      "refuted": refuted,
                      "partially_confirmed": partial,
                      "unresolved": unresolved,
                  },
                  "confidence_update_allowed": (
                      confirmed > 0 or refuted > 0
                  ),
                  "generalization_allowed": (
                      completed_count >= 2
                  ),
                  "reason": (
                      "ACT54 found completed experimental outcomes and "
                      "extracted explicit learning signals without "
                      "inventing missing evidence."
                  ),
              }

          # ---------------------------------------------------------------
          # Persistent learning fingerprint
          # ---------------------------------------------------------------

          learning_basis = {
              "prediction_id": prediction_id,
              "completed": completed,
              "lessons": lessons,
          }

          learning_fingerprint = hashlib.sha256(
              json.dumps(
                  learning_basis,
                  sort_keys=True,
                  ensure_ascii=False,
              ).encode("utf-8")
          ).hexdigest()[:16]

          record = {
              "act": "ACT54",
              "version": "V1",
              "title": "Experimental Learning",
              "question": (
                  "Qu'est-ce que mes expériences réelles m'apprennent, "
                  "et comment dois-je modifier ce que je crois savoir ?"
              ),
              "timestamp_utc": timestamp,

              "status": status,

              "input": {
                  "source_act": "ACT53",
                  "prediction_id": prediction_id,
                  "prediction_status": prediction_status,
                  "observed_pairs": observed_pairs,
                  "evaluated_predictions": len(evaluated_predictions),
              },

              "learning": learning_state,

              "learning_fingerprint": learning_fingerprint,

              "epistemic_rules": {
                  "absence_of_evidence_is_not_success": True,
                  "pending_prediction_is_not_learning": True,
                  "unresolved_result_does_not_update_confidence": True,
                  "single_success_does_not_prove_general_rule": True,
                  "single_failure_does_not_prove_universal_failure": True,
              },

              "safety": {
                  "lesson_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "confidence_fabricated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
                  "initiative_execution": False,
              },

              "next_step": (
                  "Use the extracted empirical lessons as evidence for "
                  "future confidence and decision processes."
                  if completed_count > 0
                  else
                  "Wait for a real experimental outcome before extracting "
                  "a learning signal."
              ),
          }

          with ACT54_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  record,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          markdown = f"""# NØX ACT54 V1 — Experimental Learning

          ## Question

          > Qu'est-ce que mes expériences réelles m'apprennent,
          > et comment dois-je modifier ce que je crois savoir ?

          ## Status

          **{status}**

          ## Source

          - Source: ACT53
          - Prediction ID: `{prediction_id}`
          - Prediction status: `{prediction_status}`
          - Observed evidence pairs: **{observed_pairs}**
          - Evaluated predictions: **{len(evaluated_predictions)}**

          ## Empirical learning

          {json.dumps(learning_state, ensure_ascii=False, indent=2)}

          ## Epistemic safeguards

          - Pending prediction is not treated as learning.
          - Absence of evidence is not treated as success.
          - Unresolved outcomes do not update confidence.
          - One success does not prove a general rule.
          - One failure does not prove universal failure.
          - No missing outcome is fabricated.

          ## Safety

          No Gemini.
          No external AI.
          No external API.
          No payment.
          No spending.
          No marketplace action.
          No Colony creation.
          No initiative execution.

          ## Next step

          {record["next_step"]}

          Generated: `{timestamp}`
          """

          ACT54_MD.write_text(markdown, encoding="utf-8")

          print()
          print("=" * 72)
          print("ACT54 RESULT")
          print("=" * 72)
          print(f"status:                    {status}")
          print(f"completed experiments:     {completed_count}")
          print(f"confirmed:                 {confirmed}")
          print(f"refuted:                   {refuted}")
          print(f"partially confirmed:       {partial}")
          print(f"unresolved:                {unresolved}")
          print(f"learning lessons:          {len(lessons)}")
          print(f"generalization allowed:   {learning_state.get('generalization_allowed')}")
          print()
          print(record["next_step"])
          print()
          print("[OK] ACT54 memory written.")
          PY

      - name: Commit and push ACT54 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_54_experimental_learning.json
          git add memory/nox_act_54_experimental_learning.md

          if git diff --cached --quiet; then
            echo "[INFO] No ACT54 changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT54 experimental learning"
          git push origin HEAD:main
