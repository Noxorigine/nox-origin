name: NØX ACT46 - Strategy Arbitration V4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46-strategy-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 V4
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import math
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"

          ACT45_FILE = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_JSON = MEMORY / "nox_act_46_strategy_arbitration.json"
          OUTPUT_MD = MEMORY / "nox_act_46_strategy_arbitration.md"

          now = datetime.now(timezone.utc).isoformat()

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          act45 = load_json(ACT45_FILE)

          result = {
              "act": "ACT46",
              "version": "V4",
              "name": "Strategy Arbitration",
              "timestamp": now,

              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "previous_layer": {
                  "act": "ACT45",
                  "file": str(ACT45_FILE),
                  "loaded": act45 is not None
              },

              "learning_from_previous_versions": {
                  "v1": "Do not fabricate missing metrics or use arbitrary defaults.",
                  "v2": "Do not assume candidate fields without verifying the ACT45 structure.",
                  "v3": "Before declaring evidence missing, verify that the previous cognitive layer has actually been parsed correctly.",
                  "v4": "Consume the real ACT45 strategy-state fields and preserve uncertainty when candidate-specific evidence is insufficient."
              },

              "candidate_sources_checked": [
                  "stable_strategy",
                  "declining_strategy",
                  "inconsistent_strategy",
                  "neutral_strategies",
                  "adaptation_candidates",
                  "strategy_preferences",
                  "adaptive_strategy_preference"
              ],

              "candidate_count": 0,
              "candidates": [],
              "arbitration": {
                  "decision": "INSUFFICIENT_EVIDENCE",
                  "selected_strategy": None,
                  "ranking": [],
                  "comparison_possible": False,
                  "reason": ""
              },

              "evidence_integrity": {
                  "fabricated_metrics": False,
                  "fabricated_candidates": False,
                  "arbitrary_selection": False,
                  "missing_evidence_preserved": True
              }
          }

          if act45 is None:
              result["arbitration"]["reason"] = (
                  "ACT45 memory file is missing or unreadable. "
                  "No arbitration was attempted."
              )

              OUTPUT_JSON.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              OUTPUT_MD.write_text(
                  "# NØX ACT46 V4 — Strategy Arbitration\n\n"
                  "## Result\n\n"
                  "- Decision: `INSUFFICIENT_EVIDENCE`\n"
                  "- ACT45 loaded: false\n"
                  "- No strategy was selected.\n\n"
                  "ACT46 refused to fabricate candidates or evidence.\n",
                  encoding="utf-8"
              )

              raise SystemExit(0)

          def clean_text(value):
              if isinstance(value, str):
                  text = value.strip()
                  return text if text else None
              return None

          def numeric(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  if math.isfinite(float(value)):
                      return float(value)
              return None

          def strategy_name_from_object(obj):
              if isinstance(obj, str):
                  return clean_text(obj)

              if isinstance(obj, dict):
                  preferred_keys = [
                      "name",
                      "strategy",
                      "strategy_name",
                      "id",
                      "label",
                      "title"
                  ]

                  for key in preferred_keys:
                      value = obj.get(key)
                      text = clean_text(value)
                      if text:
                          return text

              return None

          def extract_candidate_items(value):
              """
              Normalize the real ACT45 strategy structures without inventing
              candidates.

              Returns tuples:
                (name, evidence_object)
              """
              found = []

              if isinstance(value, str):
                  name = clean_text(value)
                  if name:
                      found.append((name, {"raw": value}))
                  return found

              if isinstance(value, dict):
                  name = strategy_name_from_object(value)

                  # A dict may instead be a mapping:
                  # {"strategy A": 0.7, "strategy B": 0.4}
                  if name:
                      found.append((name, value))
                      return found

                  for key, nested in value.items():
                      key_text = clean_text(key)
                      if not key_text:
                          continue

                      if isinstance(nested, (dict, list, str)):
                          nested_name = strategy_name_from_object(nested)

                          if nested_name:
                              found.append((nested_name, nested))
                          elif isinstance(nested, str):
                              nested_text = clean_text(nested)
                              if nested_text:
                                  found.append((key_text, {
                                      "value": nested_text
                                  }))
                          elif isinstance(nested, dict):
                              found.append((key_text, nested))

                      elif numeric(nested) is not None:
                          found.append((key_text, {
                              "preference_score": numeric(nested)
                          }))

                  return found

              if isinstance(value, list):
                  for item in value:
                      found.extend(extract_candidate_items(item))

              return found

          candidates_by_name = {}

          def add_candidate(name, source, category=None, evidence=None):
              name = clean_text(name)
              if not name:
                  return

              # Ignore obvious non-strategy metadata.
              blocked = {
                  "true",
                  "false",
                  "none",
                  "null",
                  "unknown",
                  "insufficient evidence",
                  "insufficient_evidence"
              }

              if name.lower() in blocked:
                  return

              key = name.lower()

              if key not in candidates_by_name:
                  candidates_by_name[key] = {
                      "name": name,
                      "sources": [],
                      "categories": [],
                      "evidence": {},
                      "metrics": {}
                  }

              candidate = candidates_by_name[key]

              if source not in candidate["sources"]:
                  candidate["sources"].append(source)

              if category and category not in candidate["categories"]:
                  candidate["categories"].append(category)

              if isinstance(evidence, dict):
                  for k, v in evidence.items():
                      if k not in candidate["evidence"]:
                          candidate["evidence"][k] = v

          # ------------------------------------------------------------
          # 1. Extract explicit ACT45 strategy-state fields.
          # ------------------------------------------------------------

          state_fields = {
              "stable_strategy": "stable",
              "declining_strategy": "declining",
              "inconsistent_strategy": "inconsistent"
          }

          for field, category in state_fields.items():
              if field not in act45:
                  continue

              raw = act45.get(field)

              for name, evidence in extract_candidate_items(raw):
                  add_candidate(
                      name=name,
                      source=field,
                      category=category,
                      evidence=evidence
                  )

          # ------------------------------------------------------------
          # 2. Extract neutral strategies.
          # ------------------------------------------------------------

          if "neutral_strategies" in act45:
              for name, evidence in extract_candidate_items(
                  act45.get("neutral_strategies")
              ):
                  add_candidate(
                      name=name,
                      source="neutral_strategies",
                      category="neutral",
                      evidence=evidence
                  )

          # ------------------------------------------------------------
          # 3. Extract adaptation candidates.
          # ------------------------------------------------------------

          if "adaptation_candidates" in act45:
              for name, evidence in extract_candidate_items(
                  act45.get("adaptation_candidates")
              ):
                  add_candidate(
                      name=name,
                      source="adaptation_candidates",
                      category="adaptation_candidate",
                      evidence=evidence
                  )

          # ------------------------------------------------------------
          # 4. Extract strategy preferences.
          # ------------------------------------------------------------

          if "strategy_preferences" in act45:
              preference_value = act45.get("strategy_preferences")

              for name, evidence in extract_candidate_items(
                  preference_value
              ):
                  add_candidate(
                      name=name,
                      source="strategy_preferences",
                      category="preference",
                      evidence=evidence
                  )

          # ------------------------------------------------------------
          # 5. Extract adaptive_strategy_preference.
          # ------------------------------------------------------------

          if "adaptive_strategy_preference" in act45:
              adaptive_value = act45.get("adaptive_strategy_preference")

              for name, evidence in extract_candidate_items(
                  adaptive_value
              ):
                  add_candidate(
                      name=name,
                      source="adaptive_strategy_preference",
                      category="adaptive_preference",
                      evidence=evidence
                  )

          # ------------------------------------------------------------
          # 6. Attach candidate-specific metrics only when they are
          #    actually attached to that candidate's object.
          # ------------------------------------------------------------

          metric_aliases = {
              "relevance": [
                  "relevance",
                  "relevance_score"
              ],
              "evidence": [
                  "evidence",
                  "evidence_score",
                  "evidence_quality"
              ],
              "potential": [
                  "potential",
                  "potential_score"
              ],
              "confidence": [
                  "confidence",
                  "confidence_score",
                  "current_confidence"
              ],
              "risk": [
                  "risk",
                  "risk_score"
              ],
              "effort": [
                  "effort",
                  "effort_score"
              ],
              "preference": [
                  "preference",
                  "preference_score"
              ],
              "selection_score": [
                  "selection_score"
              ]
          }

          for candidate in candidates_by_name.values():
              evidence_objects = []

              for key in list(candidate["evidence"].keys()):
                  value = candidate["evidence"][key]
                  if isinstance(value, dict):
                      evidence_objects.append(value)

              for obj in evidence_objects:
                  for canonical, aliases in metric_aliases.items():
                      for alias in aliases:
                          if alias in obj:
                              value = numeric(obj.get(alias))
                              if value is not None:
                                  candidate["metrics"][canonical] = value
                                  break

          # ------------------------------------------------------------
          # 7. Preserve global ACT45 evidence separately.
          #    A global selection_score must NEVER be copied to every
          #    candidate because that would create false discrimination.
          # ------------------------------------------------------------

          global_metrics = {}

          for field in [
              "selection_score",
              "current_confidence",
              "new_confidence",
              "confidence_change"
          ]:
              if field in act45:
                  value = numeric(act45.get(field))
                  if value is not None:
                      global_metrics[field] = value

          # ------------------------------------------------------------
          # 8. Build normalized candidate list.
          # ------------------------------------------------------------

          normalized = []

          for candidate in candidates_by_name.values():
              normalized.append(candidate)

          normalized.sort(key=lambda x: x["name"].lower())

          result["candidate_count"] = len(normalized)

          for candidate in normalized:
              candidate["evidence"] = candidate["evidence"]

          result["candidates"] = normalized

          # ------------------------------------------------------------
          # 9. Determine whether real candidate-specific comparison is
          #    possible.
          #
          #    Important:
          #    - no fabricated defaults
          #    - global metrics do not discriminate candidates
          #    - qualitative state is preserved but not converted into
          #      arbitrary numeric weights
          # ------------------------------------------------------------

          if len(normalized) == 0:
              result["arbitration"]["decision"] = "INSUFFICIENT_EVIDENCE"
              result["arbitration"]["reason"] = (
                  "ACT45 was successfully parsed, but no explicit strategy "
                  "candidate could be extracted from its real strategy-state "
                  "fields."
              )

          elif len(normalized) == 1:
              only = normalized[0]

              candidate_metrics = only["metrics"]

              if candidate_metrics:
                  result["arbitration"]["decision"] = "PRIORITIZE"
                  result["arbitration"]["selected_strategy"] = only["name"]
                  result["arbitration"]["ranking"] = [
                      {
                          "strategy": only["name"],
                          "metrics": candidate_metrics
                      }
                  ]
                  result["arbitration"]["comparison_possible"] = True
                  result["arbitration"]["reason"] = (
                      "Only one explicit strategy candidate was found and "
                      "candidate-specific evidence exists."
                  )
              else:
                  result["arbitration"]["decision"] = "INSUFFICIENT_COMPARISON"
                  result["arbitration"]["reason"] = (
                      "One candidate exists, but ACT45 provides no "
                      "candidate-specific discriminating evidence."
                  )

          else:
              comparable_metrics = [
                  "relevance",
                  "evidence",
                  "potential",
                  "confidence",
                  "risk",
                  "effort",
                  "preference",
                  "selection_score"
              ]

              metric_presence = {}

              for metric in comparable_metrics:
                  count = sum(
                      1
                      for candidate in normalized
                      if metric in candidate["metrics"]
                  )
                  metric_presence[metric] = count

              # A metric can discriminate only if it exists for at least
              # two candidates.
              discriminating_metrics = [
                  metric
                  for metric, count in metric_presence.items()
                  if count >= 2
              ]

              complete_candidates = [
                  candidate
                  for candidate in normalized
                  if len(candidate["metrics"]) >= 2
              ]

              if not discriminating_metrics:
                  result["arbitration"]["decision"] = (
                      "INSUFFICIENT_COMPARISON"
                  )
                  result["arbitration"]["reason"] = (
                      "Multiple strategies were found, but ACT45 does not "
                      "provide candidate-specific metrics that allow a "
                      "defensible comparison. Global ACT45 metrics were not "
                      "reused as if they belonged to every candidate."
                  )

              elif len(complete_candidates) < 2:
                  result["arbitration"]["decision"] = (
                      "INSUFFICIENT_COMPARISON"
                  )
                  result["arbitration"]["reason"] = (
                      "Candidate-specific evidence exists, but fewer than "
                      "two strategies have enough discriminating evidence "
                      "for arbitration."
                  )

              else:
                  # Only compare dimensions that are explicitly present
                  # for the candidates being compared.
                  scores = []

                  for candidate in normalized:
                      values = []

                      for metric in discriminating_metrics:
                          value = candidate["metrics"].get(metric)
                          if value is not None:
                              values.append(value)

                      if values:
                          average = sum(values) / len(values)
                          scores.append({
                              "strategy": candidate["name"],
                              "score": round(average, 6),
                              "metrics_used": {
                                  k: candidate["metrics"][k]
                                  for k in discriminating_metrics
                                  if k in candidate["metrics"]
                              }
                          })

                  scores.sort(
                      key=lambda item: item["score"],
                      reverse=True
                  )

                  if len(scores) >= 2:
                      top = scores[0]
                      second = scores[1]
                      margin = top["score"] - second["score"]

                      result["arbitration"]["ranking"] = scores
                      result["arbitration"]["comparison_possible"] = True
                      result["arbitration"]["margin"] = round(
                          margin,
                          6
                      )

                      # No arbitrary threshold disguised as intelligence:
                      # the comparison is considered decisive only when
                      # the top candidate has a real positive separation.
                      if margin > 0:
                          result["arbitration"]["decision"] = "PRIORITIZE"
                          result["arbitration"]["selected_strategy"] = (
                              top["strategy"]
                          )
                          result["arbitration"]["reason"] = (
                              "A candidate-specific evidence comparison "
                              "produced a clear positive separation between "
                              "the first and second strategy."
                          )
                      else:
                          result["arbitration"]["decision"] = "TIE"
                          result["arbitration"]["reason"] = (
                              "The best candidate is not separated from the "
                              "next candidate by the available evidence."
                          )
                  else:
                      result["arbitration"]["decision"] = (
                          "INSUFFICIENT_COMPARISON"
                      )
                      result["arbitration"]["reason"] = (
                          "Not enough comparable candidate evidence was "
                          "available to produce a ranking."
                      )

          result["global_act45_metrics"] = global_metrics

          result["discovery"] = {
              "act45_loaded": True,
              "actual_fields_detected": sorted(
                  [
                      key
                      for key in [
                          "stable_strategy",
                          "declining_strategy",
                          "inconsistent_strategy",
                          "neutral_strategies",
                          "adaptation_candidates",
                          "strategy_preferences",
                          "adaptive_strategy_preference"
                      ]
                      if key in act45
                  ]
              ),
              "candidate_extraction_method": (
                  "ACT45 real strategy-state fields"
              ),
              "fabricated_candidate_objects": False,
              "fabricated_metrics": False
          }

          # ------------------------------------------------------------
          # 10. Final integrity statement.
          # ------------------------------------------------------------

          decision = result["arbitration"]["decision"]

          result["what_nox_learned"] = (
              "ACT46 learned that arbitration must operate on the actual "
              "strategy representation produced by ACT45. Candidate "
              "discovery must precede comparison, and missing candidate-level "
              "evidence must remain explicit instead of being replaced by "
              "default values."
          )

          result["next_cognitive_step"] = (
              "ACT47 - Strategy Combination"
              if decision == "PRIORITIZE"
              else "Remain in ACT46 until defensible arbitration evidence exists"
          )

          OUTPUT_JSON.write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Markdown report
          # ------------------------------------------------------------

          lines = []

          lines.append("# NØX ACT46 V4 — Strategy Arbitration")
          lines.append("")
          lines.append(f"**Timestamp:** `{now}`")
          lines.append("")
          lines.append("## Decision")
          lines.append("")
          lines.append(
              f"- **Decision:** `{decision}`"
          )
          lines.append(
              f"- **Selected strategy:** "
              f"`{result['arbitration']['selected_strategy']}`"
          )
          lines.append(
              f"- **Candidate count:** `{result['candidate_count']}`"
          )
          lines.append(
              f"- **Comparison possible:** "
              f"`{result['arbitration']['comparison_possible']}`"
          )
          lines.append("")
          lines.append("## ACT45 parsing")
          lines.append("")
          lines.append(
              "ACT46 V4 consumes the actual ACT45 strategy-state fields "
              "instead of assuming a generic candidate schema."
          )
          lines.append("")

          for field in result["discovery"]["actual_fields_detected"]:
              lines.append(f"- `{field}`")

          lines.append("")
          lines.append("## Candidates")
          lines.append("")

          if not normalized:
              lines.append(
                  "No explicit strategy candidate was found."
              )
          else:
              for candidate in normalized:
                  lines.append(
                      f"### {candidate['name']}"
                  )
                  lines.append(
                      f"- Sources: "
                      f"{', '.join(candidate['sources'])}"
                  )

                  if candidate["categories"]:
                      lines.append(
                          f"- Categories: "
                          f"{', '.join(candidate['categories'])}"
                      )

                  if candidate["metrics"]:
                      lines.append(
                          "- Candidate-specific metrics: "
                          + ", ".join(
                              f"{k}={v}"
                              for k, v in candidate["metrics"].items()
                          )
                      )
                  else:
                      lines.append(
                          "- Candidate-specific metrics: none"
                      )

                  lines.append("")

          lines.append("## Arbitration reason")
          lines.append("")
          lines.append(
              result["arbitration"]["reason"]
          )
          lines.append("")

          if result["arbitration"].get("ranking"):
              lines.append("## Ranking")
              lines.append("")

              for index, item in enumerate(
                  result["arbitration"]["ranking"],
                  start=1
              ):
                  lines.append(
                      f"{index}. **{item['strategy']}** — "
                      f"score `{item['score']}`"
                  )

              lines.append("")

          lines.append("## Evidence integrity")
          lines.append("")
          lines.append(
              "- Fabricated candidates: `false`"
          )
          lines.append(
              "- Fabricated metrics: `false`"
          )
          lines.append(
              "- Arbitrary selection: `false`"
          )
          lines.append(
              "- Missing evidence preserved: `true`"
          )
          lines.append("")

          lines.append("## Learning")
          lines.append("")
          lines.append(result["what_nox_learned"])
          lines.append("")

          lines.append("## Next step")
          lines.append("")
          lines.append(result["next_cognitive_step"])
          lines.append("")

          OUTPUT_MD.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("==============================================")
          print("NØX ACT46 V4 - STRATEGY ARBITRATION")
          print("==============================================")
          print(f"ACT45 loaded:       {act45 is not None}")
          print(f"Candidates:         {len(normalized)}")
          print(f"Decision:           {decision}")
          print(
              "Selected strategy:  "
              f"{result['arbitration']['selected_strategy']}"
          )
          print(
              "Comparison possible:"
              f" {result['arbitration']['comparison_possible']}"
          )
          print("Fabricated metrics:  false")
          print("Fabricated candidates:false")
          print("Gemini:              false")
          print("Cost:                0 EUR")
          print("==============================================")

          PY

      - name: Commit ACT46 V4 results
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_46_strategy_arbitration.json
          git add memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 V4 changes to commit."
          else
            git commit -m "NØX ACT46 V4 strategy arbitration"
            git push
          fi
