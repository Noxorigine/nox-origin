name: NØX ACT46 - Strategy Arbitration V5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46-strategy-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 V5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY = Path("memory")

          ACT45_FILE = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_JSON = MEMORY / "nox_act_46_strategy_arbitration.json"
          OUTPUT_MD = MEMORY / "nox_act_46_strategy_arbitration.md"

          TIMESTAMP = datetime.now(timezone.utc).isoformat()

          TARGET_FIELDS = {
              "stable_strategy": "stable",
              "declining_strategy": "declining",
              "inconsistent_strategy": "inconsistent",
              "neutral_strategies": "neutral",
              "adaptation_candidates": "adaptation_candidate",
              "strategy_preferences": "preference",
              "adaptive_strategy_preference": "adaptive_preference",
          }

          METRIC_ALIASES = {
              "relevance": {
                  "relevance",
                  "relevance_score",
              },
              "evidence": {
                  "evidence",
                  "evidence_score",
                  "evidence_quality",
              },
              "potential": {
                  "potential",
                  "potential_score",
              },
              "confidence": {
                  "confidence",
                  "confidence_score",
                  "current_confidence",
              },
              "risk": {
                  "risk",
                  "risk_score",
              },
              "effort": {
                  "effort",
                  "effort_score",
              },
              "preference": {
                  "preference",
                  "preference_score",
              },
              "selection_score": {
                  "selection_score",
              },
          }

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          def is_number(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(float(value))
              )

          def clean_string(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()

              if not value:
                  return None

              return value

          def scalar_summary(value):
              if value is None:
                  return None

              if isinstance(value, (str, int, float, bool)):
                  return value

              return None

          def path_to_string(path):
              if not path:
                  return "$"

              output = "$"

              for item in path:
                  if isinstance(item, int):
                      output += f"[{item}]"
                  else:
                      output += f".{item}"

              return output

          def walk(value, path=()):
              """
              Recursively walk every JSON node.

              This is deliberately independent from the expected ACT45
              hierarchy. V5 must discover the real hierarchy first.
              """
              yield path, value

              if isinstance(value, dict):
                  for key, child in value.items():
                      yield from walk(child, path + (key,))

              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from walk(child, path + (index,))

          def find_named_fields(root):
              discoveries = []

              for path, value in walk(root):
                  if not path:
                      continue

                  last = path[-1]

                  if isinstance(last, str) and last in TARGET_FIELDS:
                      discoveries.append({
                          "field": last,
                          "category": TARGET_FIELDS[last],
                          "path": path_to_string(path),
                          "value": value,
                      })

              return discoveries

          def candidate_name_from_dict(obj):
              if not isinstance(obj, dict):
                  return None

              keys = (
                  "name",
                  "strategy",
                  "strategy_name",
                  "id",
                  "label",
                  "title",
              )

              for key in keys:
                  value = clean_string(obj.get(key))
                  if value:
                      return value

              return None

          def normalize_items(value, parent_hint=None):
              """
              Convert actual ACT45 values into possible strategy references.

              No candidate is fabricated from missing information.
              """
              output = []

              if isinstance(value, str):
                  text = clean_string(value)

                  if text:
                      output.append({
                          "name": text,
                          "raw": value,
                          "evidence_object": None,
                      })

                  return output

              if isinstance(value, dict):
                  explicit_name = candidate_name_from_dict(value)

                  if explicit_name:
                      output.append({
                          "name": explicit_name,
                          "raw": value,
                          "evidence_object": value,
                      })
                      return output

                  # Mapping form:
                  # {
                  #   "strategy_A": 0.8,
                  #   "strategy_B": 0.4
                  # }
                  for key, child in value.items():
                      key_text = clean_string(key)

                      if not key_text:
                          continue

                      if isinstance(child, dict):
                          nested_name = candidate_name_from_dict(child)

                          if nested_name:
                              output.append({
                                  "name": nested_name,
                                  "raw": child,
                                  "evidence_object": child,
                              })
                          else:
                              output.append({
                                  "name": key_text,
                                  "raw": child,
                                  "evidence_object": child,
                              })

                      elif isinstance(child, list):
                          nested = normalize_items(
                              child,
                              parent_hint=key_text
                          )

                          if nested:
                              output.extend(nested)
                          else:
                              output.append({
                                  "name": key_text,
                                  "raw": child,
                                  "evidence_object": None,
                              })

                      elif isinstance(child, str):
                          child_text = clean_string(child)

                          if child_text:
                              output.append({
                                  "name": key_text,
                                  "raw": child,
                                  "evidence_object": {
                                      "value": child_text
                                  },
                              })

                      elif is_number(child):
                          output.append({
                              "name": key_text,
                              "raw": child,
                              "evidence_object": {
                                  "preference_score": float(child)
                              },
                          })

                  return output

              if isinstance(value, list):
                  for item in value:
                      output.extend(
                          normalize_items(
                              item,
                              parent_hint=parent_hint
                          )
                      )

                  return output

              return output

          def collect_candidate_metrics(candidate):
              metrics = {}

              objects = []

              if isinstance(candidate.get("raw"), dict):
                  objects.append(candidate["raw"])

              if isinstance(candidate.get("evidence_object"), dict):
                  objects.append(candidate["evidence_object"])

              for obj in objects:
                  for canonical, aliases in METRIC_ALIASES.items():
                      if canonical in metrics:
                          continue

                      for alias in aliases:
                          if alias in obj and is_number(obj[alias]):
                              metrics[canonical] = float(obj[alias])
                              break

              return metrics

          def evidence_preview(value):
              """
              Keep the report useful without dumping entire ACT45.
              """
              if isinstance(value, dict):
                  return {
                      str(k): scalar_summary(v)
                      for k, v in value.items()
                      if scalar_summary(v) is not None
                  }

              if isinstance(value, list):
                  preview = []

                  for item in value[:10]:
                      scalar = scalar_summary(item)

                      if scalar is not None:
                          preview.append(scalar)
                      elif isinstance(item, dict):
                          preview.append({
                              str(k): scalar_summary(v)
                              for k, v in item.items()
                              if scalar_summary(v) is not None
                          })

                  return preview

              return scalar_summary(value)

          act45 = load_json(ACT45_FILE)

          result = {
              "act": "ACT46",
              "version": "V5",
              "name": "Strategy Arbitration",
              "timestamp": TIMESTAMP,

              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "previous_layer": {
                  "act": "ACT45",
                  "file": str(ACT45_FILE),
                  "loaded": act45 is not None,
              },

              "method": {
                  "strategy": (
                      "Recursive ACT45 discovery followed by "
                      "evidence-preserving arbitration"
                  ),
                  "recursive_scan": True,
                  "root_only_assumption": False,
                  "candidate_fields": sorted(TARGET_FIELDS.keys()),
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
              },

              "learning_from_previous_versions": {
                  "v1": (
                      "Do not fabricate missing metrics or use arbitrary "
                      "defaults."
                  ),
                  "v2": (
                      "Do not assume candidate fields without verifying "
                      "the ACT45 structure."
                  ),
                  "v3": (
                      "Verify that the previous cognitive layer has "
                      "actually been parsed correctly."
                  ),
                  "v4": (
                      "The expected strategy fields may be nested. "
                      "Field discovery must therefore be recursive."
                  ),
              },

              "discovery": {
                  "nodes_inspected": 0,
                  "strategy_field_occurrences": 0,
                  "fields_found": [],
                  "paths_found": [],
              },

              "candidate_count": 0,
              "candidates": [],

              "arbitration": {
                  "decision": "INSUFFICIENT_EVIDENCE",
                  "selected_strategy": None,
                  "ranking": [],
                  "comparison_possible": False,
                  "reason": "",
              },

              "evidence_integrity": {
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "missing_evidence_preserved": True,
              },

              "global_act45_metrics": {},
          }

          if act45 is None:
              result["arbitration"]["reason"] = (
                  "ACT45 memory file is missing or unreadable. "
                  "Recursive discovery could not start."
              )

          else:
              all_nodes = list(walk(act45))
              discoveries = find_named_fields(act45)

              result["discovery"]["nodes_inspected"] = len(all_nodes)
              result["discovery"]["strategy_field_occurrences"] = len(
                  discoveries
              )

              result["discovery"]["fields_found"] = sorted(
                  set(item["field"] for item in discoveries)
              )

              result["discovery"]["paths_found"] = [
                  {
                      "field": item["field"],
                      "category": item["category"],
                      "path": item["path"],
                      "value_type": type(item["value"]).__name__,
                      "preview": evidence_preview(item["value"]),
                  }
                  for item in discoveries
              ]

              candidates = {}

              def add_candidate(
                  name,
                  field,
                  category,
                  path,
                  raw_value,
                  evidence_object=None,
              ):
                  name = clean_string(name)

                  if not name:
                      return

                  lowered = name.lower()

                  ignored = {
                      "true",
                      "false",
                      "none",
                      "null",
                      "unknown",
                      "n/a",
                      "na",
                      "insufficient evidence",
                      "insufficient_evidence",
                  }

                  if lowered in ignored:
                      return

                  if lowered not in candidates:
                      candidates[lowered] = {
                          "name": name,
                          "sources": [],
                          "categories": [],
                          "paths": [],
                          "metrics": {},
                          "evidence": [],
                      }

                  candidate = candidates[lowered]

                  source = field

                  if source not in candidate["sources"]:
                      candidate["sources"].append(source)

                  if category not in candidate["categories"]:
                      candidate["categories"].append(category)

                  if path not in candidate["paths"]:
                      candidate["paths"].append(path)

                  temp = {
                      "raw": raw_value,
                      "evidence_object": evidence_object,
                  }

                  metrics = collect_candidate_metrics(temp)

                  for key, value in metrics.items():
                      if key not in candidate["metrics"]:
                          candidate["metrics"][key] = value

                  preview = evidence_preview(raw_value)

                  if preview is not None:
                      candidate["evidence"].append({
                          "field": field,
                          "path": path,
                          "preview": preview,
                      })

              # --------------------------------------------------------
              # Extract candidates from every occurrence of every target
              # field, regardless of nesting depth.
              # --------------------------------------------------------

              for discovery in discoveries:
                  field = discovery["field"]
                  category = discovery["category"]
                  path = discovery["path"]
                  value = discovery["value"]

                  items = normalize_items(value)

                  for item in items:
                      add_candidate(
                          name=item["name"],
                          field=field,
                          category=category,
                          path=path,
                          raw_value=item.get("raw"),
                          evidence_object=item.get("evidence_object"),
                      )

              normalized_candidates = list(candidates.values())

              normalized_candidates.sort(
                  key=lambda item: item["name"].lower()
              )

              result["candidate_count"] = len(normalized_candidates)
              result["candidates"] = normalized_candidates

              # --------------------------------------------------------
              # Global ACT45 values are retained but never assigned to
              # every candidate.
              # --------------------------------------------------------

              for path, value in all_nodes:
                  if not path:
                      continue

                  field = path[-1]

                  if field in {
                      "selection_score",
                      "current_confidence",
                      "new_confidence",
                      "confidence_change",
                  } and is_number(value):
                      result["global_act45_metrics"].setdefault(
                          field,
                          []
                      )

                      result["global_act45_metrics"][field].append({
                          "path": path_to_string(path),
                          "value": float(value),
                      })

              # --------------------------------------------------------
              # Arbitration.
              #
              # Qualitative categories are evidence labels only.
              # They are NOT converted into invented weights.
              # --------------------------------------------------------

              if not normalized_candidates:
                  result["arbitration"]["decision"] = (
                      "INSUFFICIENT_EVIDENCE"
                  )

                  result["arbitration"]["reason"] = (
                      "ACT45 was recursively inspected and the expected "
                      "strategy fields were searched at every nesting "
                      "level, but no valid explicit strategy candidate "
                      "could be extracted."
                  )

              elif len(normalized_candidates) == 1:
                  candidate = normalized_candidates[0]

                  if candidate["metrics"]:
                      result["arbitration"]["decision"] = "PRIORITIZE"
                      result["arbitration"]["selected_strategy"] = (
                          candidate["name"]
                      )
                      result["arbitration"]["comparison_possible"] = True
                      result["arbitration"]["ranking"] = [{
                          "strategy": candidate["name"],
                          "metrics": candidate["metrics"],
                      }]
                      result["arbitration"]["reason"] = (
                          "One explicit strategy was found and "
                          "candidate-specific evidence is available."
                      )
                  else:
                      result["arbitration"]["decision"] = (
                          "INSUFFICIENT_COMPARISON"
                      )

                      result["arbitration"]["reason"] = (
                          "One explicit strategy was found, but ACT45 "
                          "does not provide candidate-specific "
                          "discriminating metrics."
                      )

              else:
                  # Metrics are usable only if they are attached to
                  # individual candidates.
                  metric_names = sorted({
                      metric
                      for candidate in normalized_candidates
                      for metric in candidate["metrics"]
                  })

                  discriminating_metrics = []

                  for metric in metric_names:
                      count = sum(
                          1
                          for candidate in normalized_candidates
                          if metric in candidate["metrics"]
                      )

                      if count >= 2:
                          discriminating_metrics.append(metric)

                  if not discriminating_metrics:
                      result["arbitration"]["decision"] = (
                          "INSUFFICIENT_COMPARISON"
                      )

                      result["arbitration"]["reason"] = (
                          "ACT45 contains multiple explicit strategy "
                          "candidates, but no candidate-specific metric "
                          "is available for comparing at least two "
                          "strategies. Qualitative states and global "
                          "metrics were preserved without inventing "
                          "numeric weights."
                      )

                  else:
                      rankings = []

                      for candidate in normalized_candidates:
                          values = []

                          for metric in discriminating_metrics:
                              value = candidate["metrics"].get(metric)

                              if is_number(value):
                                  values.append(float(value))

                          if values:
                              score = sum(values) / len(values)

                              rankings.append({
                                  "strategy": candidate["name"],
                                  "score": round(score, 6),
                                  "metrics_used": {
                                      metric: candidate["metrics"][metric]
                                      for metric in discriminating_metrics
                                      if metric in candidate["metrics"]
                                  },
                              })

                      rankings.sort(
                          key=lambda item: item["score"],
                          reverse=True
                      )

                      if len(rankings) < 2:
                          result["arbitration"]["decision"] = (
                              "INSUFFICIENT_COMPARISON"
                          )

                          result["arbitration"]["reason"] = (
                              "Candidate-specific evidence exists, but "
                              "fewer than two candidates can be ranked "
                              "from comparable evidence."
                          )

                      else:
                          result["arbitration"]["ranking"] = rankings
                          result["arbitration"]["comparison_possible"] = True

                          margin = (
                              rankings[0]["score"]
                              - rankings[1]["score"]
                          )

                          result["arbitration"]["margin"] = round(
                              margin,
                              6
                          )

                          if margin > 0:
                              result["arbitration"]["decision"] = (
                                  "PRIORITIZE"
                              )

                              result["arbitration"][
                                  "selected_strategy"
                              ] = rankings[0]["strategy"]

                              result["arbitration"]["reason"] = (
                                  "Candidate-specific evidence produced "
                                  "a positive separation between the top "
                                  "strategy and the second strategy."
                              )

                          else:
                              result["arbitration"]["decision"] = "TIE"

                              result["arbitration"]["reason"] = (
                                  "The available candidate-specific "
                                  "evidence does not separate the leading "
                                  "strategies."
                              )

          # --------------------------------------------------------------
          # Learning and next step
          # --------------------------------------------------------------

          result["what_nox_learned"] = (
              "ACT46 V5 learned that cognitive-layer interoperability "
              "requires structural discovery before interpretation. "
              "ACT45 strategy information may be nested, so NØX must "
              "locate fields recursively, preserve their original paths, "
              "normalize their values, and only arbitrate when "
              "candidate-specific evidence permits a defensible "
              "comparison."
          )

          if result["arbitration"]["decision"] == "PRIORITIZE":
              result["next_cognitive_step"] = (
                  "ACT47 - Strategy Combination"
              )
          else:
              result["next_cognitive_step"] = (
                  "Remain in ACT46 until defensible arbitration evidence exists"
              )

          # --------------------------------------------------------------
          # Save JSON
          # --------------------------------------------------------------

          OUTPUT_JSON.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------------
          # Markdown report
          # --------------------------------------------------------------

          lines = [
              "# NØX ACT46 V5 — Strategy Arbitration",
              "",
              f"**Timestamp:** `{TIMESTAMP}`",
              "",
              "## Decision",
              "",
              f"- **Decision:** `{result['arbitration']['decision']}`",
              (
                  "- **Selected strategy:** "
                  f"`{result['arbitration']['selected_strategy']}`"
              ),
              (
                  "- **Candidate count:** "
                  f"`{result['candidate_count']}`"
              ),
              (
                  "- **Comparison possible:** "
                  f"`{result['arbitration']['comparison_possible']}`"
              ),
              "",
              "## Recursive discovery",
              "",
              (
                  "- Nodes inspected: "
                  f"`{result['discovery']['nodes_inspected']}`"
              ),
              (
                  "- Strategy field occurrences: "
                  f"`{result['discovery']['strategy_field_occurrences']}`"
              ),
              (
                  "- Fields found: "
                  f"`{', '.join(result['discovery']['fields_found'])}`"
              ),
              "",
          ]

          if result["discovery"]["paths_found"]:
              lines.extend([
                  "### Actual ACT45 strategy field paths",
                  "",
              ])

              for item in result["discovery"]["paths_found"]:
                  lines.append(
                      (
                          f"- `{item['field']}` → `{item['path']}` "
                          f"({item['value_type']})"
                      )
                  )

              lines.append("")

          lines.extend([
              "## Candidates",
              "",
          ])

          if not result["candidates"]:
              lines.append(
                  "No explicit strategy candidate was extracted."
              )
              lines.append("")
          else:
              for candidate in result["candidates"]:
                  lines.extend([
                      f"### {candidate['name']}",
                      "",
                      (
                          "- Sources: "
                          + ", ".join(candidate["sources"])
                      ),
                      (
                          "- Categories: "
                          + ", ".join(candidate["categories"])
                      ),
                      (
                          "- Paths: "
                          + ", ".join(candidate["paths"])
                      ),
                  ])

                  if candidate["metrics"]:
                      lines.append(
                          "- Candidate-specific metrics: "
                          + ", ".join(
                              f"{key}={value}"
                              for key, value
                              in candidate["metrics"].items()
                          )
                      )
                  else:
                      lines.append(
                          "- Candidate-specific metrics: none"
                      )

                  lines.append("")

          lines.extend([
              "## Arbitration",
              "",
              result["arbitration"]["reason"],
              "",
          ])

          if result["arbitration"]["ranking"]:
              lines.extend([
                  "### Ranking",
                  "",
              ])

              for index, item in enumerate(
                  result["arbitration"]["ranking"],
                  start=1
              ):
                  lines.append(
                      (
                          f"{index}. **{item['strategy']}** — "
                          f"score `{item['score']}`"
                      )
                  )

              lines.append("")

          lines.extend([
              "## Evidence integrity",
              "",
              "- Fabricated candidates: `false`",
              "- Fabricated metrics: `false`",
              "- Arbitrary selection: `false`",
              "- Missing evidence preserved: `true`",
              "",
              "## Learning",
              "",
              result["what_nox_learned"],
              "",
              "## Next cognitive step",
              "",
              result["next_cognitive_step"],
              "",
          ])

          OUTPUT_MD.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          # --------------------------------------------------------------
          # Runtime diagnostic
          # --------------------------------------------------------------

          print("")
          print("==============================================")
          print("NØX ACT46 V5 - STRATEGY ARBITRATION")
          print("==============================================")
          print(f"ACT45 loaded:              {act45 is not None}")
          print(
              "Nodes inspected:           "
              f"{result['discovery']['nodes_inspected']}"
          )
          print(
              "Strategy fields discovered:"
              f" {result['discovery']['strategy_field_occurrences']}"
          )
          print(
              "Candidates:                "
              f"{result['candidate_count']}"
          )
          print(
              "Decision:                  "
              f"{result['arbitration']['decision']}"
          )
          print(
              "Selected strategy:         "
              f"{result['arbitration']['selected_strategy']}"
          )
          print(
              "Comparison possible:      "
              f"{result['arbitration']['comparison_possible']}"
          )
          print("Fabricated candidates:     false")
          print("Fabricated metrics:        false")
          print("Arbitrary selection:       false")
          print("Gemini:                    false")
          print("External AI:               false")
          print("External API:              false")
          print("Cost:                      0 EUR")
          print("==============================================")
          print("")

          PY

      - name: Commit ACT46 V5 results
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_46_strategy_arbitration.json
          git add memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 V5 changes to commit."
          else
            git commit -m "NØX ACT46 V5 strategy arbitration"
            git push
          fi
