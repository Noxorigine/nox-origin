name: NØX ACT46 - Strategy Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46-strategy-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 V2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p memory

          python - <<'PY'
          import json
          import os
          import glob
          import re
          from datetime import datetime, timezone

          ACT = "ACT46"
          VERSION = "V2"
          timestamp = datetime.now(timezone.utc).isoformat()

          # =========================================================
          # Helpers
          # =========================================================

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def flatten_strings(value, prefix=""):
              results = []

              if isinstance(value, dict):
                  for key, item in value.items():
                      path = f"{prefix}.{key}" if prefix else str(key)
                      results.extend(flatten_strings(item, path))

              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      path = f"{prefix}[{index}]"
                      results.extend(flatten_strings(item, path))

              elif isinstance(value, (str, int, float, bool)):
                  results.append((prefix, str(value)))

              return results

          def normalize_name(value):
              if not isinstance(value, str):
                  return ""

              value = value.lower().strip()
              value = re.sub(r"[^a-z0-9]+", "_", value)
              return value.strip("_")

          def clamp(value):
              return max(0.0, min(100.0, float(value)))

          def extract_numeric(item, keys):
              if not isinstance(item, dict):
                  return None

              for key in keys:
                  if key not in item:
                      continue

                  value = item.get(key)

                  try:
                      number = float(value)

                      # Accept either 0-1 or 0-100 representations.
                      if 0 <= number <= 1:
                          number *= 100

                      if 0 <= number <= 100:
                          return round(number, 2)

                  except (TypeError, ValueError):
                      pass

              return None

          # =========================================================
          # Load ACT45
          # =========================================================

          act45_candidates = [
              "memory/nox_act_45_adaptive_strategy_selection.json",
              "memory/nox_act_45_adaptive_strategy_selection_v1.json",
              "memory/nox_act_45_adaptive_strategy_selection_v2.json"
          ]

          act45_path = None
          act45 = {}

          for path in act45_candidates:
              if os.path.exists(path):
                  act45_path = path
                  act45 = load_json(path) or {}
                  break

          # =========================================================
          # Load memory files
          # =========================================================

          memory_files = []

          for path in glob.glob("memory/*.json"):
              data = load_json(path)

              if data is not None:
                  memory_files.append({
                      "path": path,
                      "data": data
                  })

          def extract_act_number(path):
              match = re.search(r"act_(\d+)", os.path.basename(path).lower())

              if match:
                  return int(match.group(1))

              return 0

          memory_files.sort(
              key=lambda item: extract_act_number(item["path"]),
              reverse=True
          )

          recent_memories = memory_files[:30]

          # =========================================================
          # Extract ACT45 strategies
          # =========================================================

          raw_candidates = []

          candidate_fields = [
              "strategies",
              "candidate_strategies",
              "candidates",
              "strategy_candidates",
              "alternatives"
          ]

          for field in candidate_fields:
              value = act45.get(field)

              if isinstance(value, list):
                  raw_candidates.extend(value)

          preferred = act45.get("preferred_strategy")

          if isinstance(preferred, dict):
              raw_candidates.append(preferred)

          elif isinstance(preferred, str):
              raw_candidates.append({
                  "name": preferred
              })

          # =========================================================
          # Normalize strategies
          # =========================================================

          strategies = []
          seen = set()

          for index, candidate in enumerate(raw_candidates):

              if isinstance(candidate, str):
                  candidate = {
                      "name": candidate
                  }

              if not isinstance(candidate, dict):
                  continue

              name = (
                  candidate.get("name")
                  or candidate.get("strategy")
                  or candidate.get("id")
              )

              if not name:
                  continue

              key = normalize_name(name)

              if not key or key in seen:
                  continue

              seen.add(key)

              strategies.append({
                  "name": str(name),
                  "normalized_name": key,
                  "source": candidate
              })

          # =========================================================
          # No invented strategy candidates.
          # If ACT45 gives no candidates, arbitration cannot happen.
          # =========================================================

          if not strategies:
              strategies = []

          # =========================================================
          # Build evidence corpus
          # =========================================================

          evidence_corpus = []

          for memory in recent_memories:
              path = memory["path"]
              data = memory["data"]

              text_parts = flatten_strings(data)

              text = "\n".join(
                  f"{key}: {value}"
                  for key, value in text_parts
              )

              evidence_corpus.append({
                  "path": path,
                  "text": text.lower()
              })

          # =========================================================
          # Strategy evaluation
          # =========================================================

          evaluated = []

          metric_aliases = {
              "relevance": [
                  "relevance",
                  "relevance_score",
                  "context_score"
              ],
              "evidence": [
                  "evidence",
                  "evidence_score",
                  "evidence_quality"
              ],
              "potential": [
                  "potential",
                  "potential_score",
                  "impact",
                  "impact_score"
              ],
              "confidence": [
                  "confidence",
                  "confidence_score"
              ],
              "risk": [
                  "risk",
                  "risk_score"
              ],
              "effort": [
                  "effort",
                  "effort_score",
                  "cost"
              ]
          }

          for strategy in strategies:

              source = strategy["source"]

              metrics = {}

              # -----------------------------------------------------
              # First priority: explicit metrics in ACT45
              # -----------------------------------------------------

              for metric, aliases in metric_aliases.items():
                  metrics[metric] = extract_numeric(source, aliases)

              # -----------------------------------------------------
              # Second priority: evidence found in memory
              # -----------------------------------------------------

              matching_files = []

              strategy_name = strategy["normalized_name"]

              for evidence in evidence_corpus:

                  normalized_text = normalize_name(evidence["text"])

                  if strategy_name and strategy_name in normalized_text:
                      matching_files.append(evidence["path"])

              # -----------------------------------------------------
              # Third priority: nested strategy evidence
              # -----------------------------------------------------

              nested_evidence = source.get("evidence")

              if isinstance(nested_evidence, dict):

                  for metric, aliases in metric_aliases.items():

                      if metrics.get(metric) is not None:
                          continue

                      metrics[metric] = extract_numeric(
                          nested_evidence,
                          aliases
                      )

              # -----------------------------------------------------
              # Determine actual evidence availability
              # -----------------------------------------------------

              known_metrics = [
                  key for key, value in metrics.items()
                  if value is not None
              ]

              known_count = len(known_metrics)
              total_metrics = len(metric_aliases)

              completeness = round(
                  (known_count / total_metrics) * 100,
                  2
              )

              # -----------------------------------------------------
              # No fabricated values.
              # -----------------------------------------------------

              score = None

              if known_count >= 4:

                  relevance = metrics["relevance"]
                  evidence_score = metrics["evidence"]
                  potential = metrics["potential"]
                  confidence = metrics["confidence"]
                  risk = metrics["risk"]
                  effort = metrics["effort"]

                  # Missing optional metrics are NOT silently replaced.
                  # They reduce the maximum possible confidence instead.
                  components = []
                  weights = []

                  values = {
                      "relevance": (relevance, 0.25),
                      "evidence": (evidence_score, 0.20),
                      "potential": (potential, 0.25),
                      "confidence": (confidence, 0.15),
                      "risk": (100 - risk, 0.10),
                      "effort": (100 - effort, 0.05)
                  }

                  for metric, (value, weight) in values.items():

                      if value is not None:
                          components.append(value * weight)
                          weights.append(weight)

                  if weights:
                      score = round(
                          sum(components) / sum(weights),
                          2
                      )

              # -----------------------------------------------------
              # Evidence state
              # -----------------------------------------------------

              if score is None:
                  arbitration_state = "INSUFFICIENT_EVIDENCE"

              elif completeness < 70:
                  arbitration_state = "LIMITED_EVIDENCE"

              else:
                  arbitration_state = "COMPARABLE"

              evaluated.append({
                  "name": strategy["name"],
                  "metrics": metrics,
                  "known_metrics": known_metrics,
                  "completeness": completeness,
                  "matching_memory_files": matching_files[:10],
                  "score": score,
                  "state": arbitration_state
              })

          # =========================================================
          # Arbitration
          # =========================================================

          comparable = [
              item for item in evaluated
              if item["score"] is not None
              and item["completeness"] >= 70
          ]

          comparable.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          decision = "INSUFFICIENT_EVIDENCE"
          selected = None
          margin = None
          confidence = "none"

          if len(comparable) >= 1:

              selected = comparable[0]

              if len(comparable) == 1:

                  decision = "INSUFFICIENT_COMPARISON"
                  confidence = "limited"

              else:

                  margin = round(
                      comparable[0]["score"]
                      - comparable[1]["score"],
                      2
                  )

                  if margin >= 10:

                      decision = "PRIORITIZE"
                      confidence = "strong"

                  elif margin >= 5:

                      decision = "PRIORITIZE"
                      confidence = "moderate"

                  else:

                      decision = "TIE"
                      confidence = "weak"
                      selected = None

          # =========================================================
          # Explicitly detect V1 failure mode
          # =========================================================

          v1_failure_detected = False

          if len(evaluated) >= 2:

              scores = [
                  item["score"]
                  for item in evaluated
                  if item["score"] is not None
              ]

              if len(scores) >= 2 and len(set(scores)) == 1:
                  v1_failure_detected = True

          # =========================================================
          # Rationale
          # =========================================================

          if decision == "PRIORITIZE":

              rationale = (
                  f"'{selected['name']}' is prioritized because it has "
                  f"the strongest evidence-supported score ({selected['score']}) "
                  f"with a comparison margin of {margin}."
              )

          elif decision == "TIE":

              rationale = (
                  "No strategy receives a sufficiently distinct advantage. "
                  "The available evidence does not justify an arbitrary priority."
              )

          elif decision == "INSUFFICIENT_COMPARISON":

              rationale = (
                  "Only one strategy has enough comparable evidence. "
                  "ACT46 refuses to treat an isolated score as a valid arbitration."
              )

          else:

              rationale = (
                  "The available evidence is insufficient to perform a "
                  "defensible strategy arbitration."
              )

          # =========================================================
          # Learning from V1
          # =========================================================

          learning = {
              "source": "ACT46_V1",
              "observation": (
                  "V1 assigned identical default scores to strategies "
                  "when explicit metrics were unavailable."
              ),
              "problem": (
                  "Identical fallback values created an artificial ranking "
                  "and selected the first strategy despite a zero comparison margin."
              ),
              "correction": (
                  "V2 never fabricates missing metrics and can return "
                  "INSUFFICIENT_EVIDENCE, INSUFFICIENT_COMPARISON or TIE."
              ),
              "principle": (
                  "Absence of discriminating evidence must remain an explicit "
                  "decision state rather than being converted into a fabricated priority."
              )
          }

          # =========================================================
          # Build final result
          # =========================================================

          result = {
              "act": ACT,
              "version": VERSION,
              "name": "Strategy Arbitration",
              "timestamp": timestamp,

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Compare multiple strategies and determine whether "
                  "one deserves priority based only on available evidence."
              ),

              "input": {
                  "act45_loaded": bool(act45_path),
                  "act45_source": act45_path,
                  "memory_files_loaded": len(recent_memories),
                  "candidate_count": len(strategies)
              },

              "arbitration": {
                  "decision": decision,
                  "selected_strategy": (
                      selected["name"] if selected else None
                  ),
                  "selected_score": (
                      selected["score"] if selected else None
                  ),
                  "comparison_margin": margin,
                  "confidence": confidence,
                  "rationale": rationale
              },

              "ranking": evaluated,

              "comparison": {
                  "comparable_candidates": len(comparable),
                  "required_minimum_metrics": 4,
                  "required_completeness_percent": 70,
                  "arbitration_requires_difference": True,
                  "fabricated_defaults_used": False
              },

              "v1_learning": learning,

              "decision_policy": {
                  "primary_goal": (
                      "Choose a strategy only when the evidence supports "
                      "a meaningful comparison."
                  ),
                  "rules": [
                      "Never invent missing evidence.",
                      "Never use arbitrary default scores.",
                      "Do not prioritize the first candidate merely because it appears first.",
                      "Require sufficient evidence for comparison.",
                      "Require a meaningful score difference for PRIORITIZE.",
                      "Use TIE when candidates are effectively indistinguishable.",
                      "Use INSUFFICIENT_EVIDENCE when evidence is inadequate.",
                      "Preserve uncertainty instead of hiding it."
                  ]
              },

              "learning_signal": {
                  "v1_failure_detected": v1_failure_detected,
                  "lesson": (
                      "When evidence cannot distinguish strategies, "
                      "the correct cognitive action is to preserve uncertainty "
                      "rather than manufacture a priority."
                  )
              },

              "next_step": {
                  "act": "ACT47",
                  "capability": "Strategy Combination",
                  "condition": (
                      "Proceed only after ACT46 can provide a defensible "
                      "arbitration result or demonstrate that strategies "
                      "should remain jointly considered."
                  ),
                  "question": (
                      "Can multiple valuable strategies be combined "
                      "without creating unnecessary conflict or complexity?"
                  )
              },

              "status": "SUCCESS"
          }

          # =========================================================
          # Write JSON
          # =========================================================

          json_path = "memory/nox_act_46_strategy_arbitration.json"

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # =========================================================
          # Write Markdown report
          # =========================================================

          md_path = "memory/nox_act_46_strategy_arbitration.md"

          lines = [
              "# NØX ACT46 — Strategy Arbitration V2",
              "",
              f"- Timestamp: `{timestamp}`",
              "- Version: `V2`",
              "- Gemini used: `false`",
              "- Project cost: `0 EUR`",
              "",
              "## Objective",
              "",
              "Determine whether one strategy deserves priority over "
              "the others using only evidence actually available.",
              "",
              "## Decision",
              "",
              f"**{decision}**",
              "",
              f"Confidence: **{confidence}**",
              "",
              rationale,
              "",
              "## Evidence policy",
              "",
              "- No fabricated default scores.",
              "- No arbitrary winner.",
              "- Missing evidence remains missing.",
              "- A tie is a valid result.",
              "- Insufficient evidence is a valid result.",
              "",
              "## Candidate evaluation",
              "",
              "| Strategy | Score | Completeness | State | Known metrics |",
              "|---|---:|---:|---|---|"
          ]

          for item in evaluated:

              known = ", ".join(item["known_metrics"]) or "none"

              score = (
                  str(item["score"])
                  if item["score"] is not None
                  else "N/A"
              )

              lines.append(
                  f"| {item['name']} | {score} | "
                  f"{item['completeness']}% | "
                  f"{item['state']} | {known} |"
              )

          lines.extend([
              "",
              "## V1 learning",
              "",
              learning["observation"],
              "",
              learning["problem"],
              "",
              learning["correction"],
              "",
              f"**Principle:** {learning['principle']}",
              "",
              "## Cognitive progression",
              "",
              "ACT45 — Adapter",
              "",
              "↓",
              "",
              "**ACT46 — Arbitrer**",
              "",
              "↓",
              "",
              "ACT47 — Combiner",
              "",
              "## Next step",
              "",
              "ACT47 will examine whether multiple valuable strategies "
              "can be combined without unnecessary conflict or complexity."
          ])

          with open(md_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          # =========================================================
          # Runtime diagnostics
          # =========================================================

          print("========================================")
          print("NØX ACT46 V2")
          print("========================================")
          print(f"Decision: {decision}")
          print(f"Confidence: {confidence}")
          print(f"Candidates: {len(evaluated)}")
          print(f"Comparable: {len(comparable)}")
          print(f"V1 failure detected: {v1_failure_detected}")
          print("Fabricated defaults: false")

          if selected:
              print(f"Selected strategy: {selected['name']}")
              print(f"Selected score: {selected['score']}")
          else:
              print("Selected strategy: NONE")

          if margin is not None:
              print(f"Comparison margin: {margin}")

          print(f"Memory: {json_path}")
          print(f"Report: {md_path}")
          print("========================================")

          PY

      - name: Commit ACT46 V2 results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_46_strategy_arbitration.json
          git add memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 V2 changes to commit."
            exit 0
          fi

          git commit -m "feat: improve ACT46 strategy arbitration"

          git pull --rebase origin main

          git push origin HEAD:main
