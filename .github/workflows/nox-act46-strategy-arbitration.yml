name: NØX ACT46 - Strategy Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46-strategy-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 V3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p memory

          python - <<'PY'
          import json
          import os
          import glob
          import re
          from datetime import datetime, timezone

          ACT = "ACT46"
          VERSION = "V3"
          timestamp = datetime.now(timezone.utc).isoformat()

          # =========================================================
          # Helpers
          # =========================================================

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def normalize_name(value):
              if not isinstance(value, str):
                  return ""

              value = value.lower().strip()
              value = re.sub(r"[^a-z0-9]+", "_", value)
              return value.strip("_")

          def numeric(value):
              try:
                  number = float(value)

                  if 0 <= number <= 1:
                      number *= 100

                  if 0 <= number <= 100:
                      return round(number, 2)

              except (TypeError, ValueError):
                  return None

              return None

          def recursive_paths(value, path="root"):
              """
              Return every dict/list node with its structural path.
              Used for diagnostics and robust ACT45 discovery.
              """

              nodes = [(path, value)]

              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"
                      nodes.extend(
                          recursive_paths(child, child_path)
                      )

              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      child_path = f"{path}[{index}]"
                      nodes.extend(
                          recursive_paths(child, child_path)
                      )

              return nodes

          # =========================================================
          # ACT45 discovery
          # =========================================================

          act45_candidates = [
              "memory/nox_act_45_adaptive_strategy_selection.json",
              "memory/nox_act_45_adaptive_strategy_selection_v2.json",
              "memory/nox_act_45_adaptive_strategy_selection_v1.json"
          ]

          act45_path = None
          act45 = None

          for path in act45_candidates:
              if os.path.exists(path):
                  act45_path = path
                  act45 = load_json(path)
                  break

          if not isinstance(act45, dict):
              act45 = {}

          # =========================================================
          # Inspect ACT45 structure
          # =========================================================

          all_nodes = recursive_paths(act45)

          dict_nodes = [
              (path, value)
              for path, value in all_nodes
              if isinstance(value, dict)
          ]

          list_nodes = [
              (path, value)
              for path, value in all_nodes
              if isinstance(value, list)
          ]

          discovered_keys = sorted({
              key
              for _, node in dict_nodes
              for key in node.keys()
          })

          # =========================================================
          # Strategy candidate detection
          # =========================================================

          STRATEGY_KEYS = {
              "strategy",
              "strategy_name",
              "strategy_id",
              "candidate_strategy",
              "selected_strategy",
              "preferred_strategy",
              "alternative_strategy"
          }

          NAME_KEYS = {
              "name",
              "title",
              "id",
              "strategy",
              "strategy_name",
              "strategy_id"
          }

          DESCRIPTION_KEYS = {
              "description",
              "summary",
              "reason",
              "rationale",
              "purpose",
              "objective"
          }

          CONTAINER_KEYS = {
              "strategies",
              "strategy_candidates",
              "candidate_strategies",
              "candidates",
              "alternatives",
              "options",
              "strategy_options",
              "available_strategies",
              "possible_strategies",
              "recommendations"
          }

          METRIC_KEYS = {
              "relevance",
              "relevance_score",
              "context_score",
              "evidence",
              "evidence_score",
              "evidence_quality",
              "potential",
              "potential_score",
              "impact",
              "impact_score",
              "confidence",
              "confidence_score",
              "risk",
              "risk_score",
              "effort",
              "effort_score",
              "cost"
          }

          discovered_candidates = []

          # ---------------------------------------------------------
          # A. Explicit strategy containers
          # ---------------------------------------------------------

          for path, node in all_nodes:

              if not isinstance(node, dict):
                  continue

              for key, value in node.items():

                  if key.lower() not in CONTAINER_KEYS:
                      continue

                  if isinstance(value, list):

                      for index, item in enumerate(value):

                          if isinstance(item, dict):
                              discovered_candidates.append({
                                  "source_path": (
                                      f"{path}.{key}[{index}]"
                                  ),
                                  "source_type": "container",
                                  "data": item
                              })

                          elif isinstance(item, str):
                              discovered_candidates.append({
                                  "source_path": (
                                      f"{path}.{key}[{index}]"
                                  ),
                                  "source_type": "container_string",
                                  "data": {
                                      "name": item
                                  }
                              })

                  elif isinstance(value, dict):

                      discovered_candidates.append({
                          "source_path": f"{path}.{key}",
                          "source_type": "container_dict",
                          "data": value
                      })

          # ---------------------------------------------------------
          # B. Any dictionary explicitly containing strategy keys
          # ---------------------------------------------------------

          for path, node in dict_nodes:

              lowered = {
                  str(key).lower()
                  for key in node.keys()
              }

              if lowered.intersection(STRATEGY_KEYS):

                  discovered_candidates.append({
                      "source_path": path,
                      "source_type": "strategy_key",
                      "data": node
                  })

          # ---------------------------------------------------------
          # C. Detect structured strategy-like objects
          # ---------------------------------------------------------

          for path, node in dict_nodes:

              lowered = {
                  str(key).lower()
                  for key in node.keys()
              }

              has_name = bool(
                  lowered.intersection(NAME_KEYS)
              )

              has_description = bool(
                  lowered.intersection(DESCRIPTION_KEYS)
              )

              has_metrics = bool(
                  lowered.intersection(METRIC_KEYS)
              )

              if has_name and (has_description or has_metrics):

                  discovered_candidates.append({
                      "source_path": path,
                      "source_type": "structured_object",
                      "data": node
                  })

          # =========================================================
          # Normalize candidates
          # =========================================================

          normalized = []
          seen = set()

          for candidate in discovered_candidates:

              data = candidate["data"]

              if not isinstance(data, dict):
                  continue

              name = None

              # Prefer explicit strategy fields.
              preferred_keys = [
                  "strategy",
                  "strategy_name",
                  "strategy_id",
                  "selected_strategy",
                  "preferred_strategy",
                  "name",
                  "title",
                  "id"
              ]

              for key in preferred_keys:

                  value = data.get(key)

                  if isinstance(value, str) and value.strip():

                      name = value.strip()
                      break

              if not name:
                  continue

              normalized_name = normalize_name(name)

              if not normalized_name:
                  continue

              # Avoid turning generic metadata into strategies.
              blocked = {
                  "act46",
                  "act45",
                  "strategy_arbitration",
                  "adaptive_strategy_selection",
                  "success",
                  "true",
                  "false"
              }

              if normalized_name in blocked:
                  continue

              if normalized_name in seen:
                  continue

              seen.add(normalized_name)

              description = ""

              for key in DESCRIPTION_KEYS:

                  value = data.get(key)

                  if isinstance(value, str) and value.strip():

                      description = value.strip()
                      break

              normalized.append({
                  "name": name,
                  "normalized_name": normalized_name,
                  "description": description,
                  "source_path": candidate["source_path"],
                  "source_type": candidate["source_type"],
                  "source": data
              })

          # =========================================================
          # Extract metrics from actual ACT45 data
          # =========================================================

          metric_aliases = {
              "relevance": [
                  "relevance",
                  "relevance_score",
                  "context_score"
              ],
              "evidence": [
                  "evidence",
                  "evidence_score",
                  "evidence_quality"
              ],
              "potential": [
                  "potential",
                  "potential_score",
                  "impact",
                  "impact_score"
              ],
              "confidence": [
                  "confidence",
                  "confidence_score"
              ],
              "risk": [
                  "risk",
                  "risk_score"
              ],
              "effort": [
                  "effort",
                  "effort_score",
                  "cost"
              ]
          }

          evaluated = []

          for strategy in normalized:

              source = strategy["source"]

              metrics = {}

              for metric, aliases in metric_aliases.items():

                  metrics[metric] = None

                  for alias in aliases:

                      if alias in source:

                          value = numeric(
                              source.get(alias)
                          )

                          if value is not None:
                              metrics[metric] = value
                              break

              known_metrics = [
                  key
                  for key, value in metrics.items()
                  if value is not None
              ]

              completeness = round(
                  len(known_metrics)
                  / len(metric_aliases)
                  * 100,
                  2
              )

              # -----------------------------------------------------
              # Score only when enough real evidence exists.
              # -----------------------------------------------------

              score = None

              if len(known_metrics) >= 4:

                  weighted_values = []
                  total_weight = 0.0

                  weights = {
                      "relevance": 0.25,
                      "evidence": 0.20,
                      "potential": 0.25,
                      "confidence": 0.15,
                      "risk": 0.10,
                      "effort": 0.05
                  }

                  for metric, weight in weights.items():

                      value = metrics.get(metric)

                      if value is None:
                          continue

                      if metric == "risk":
                          value = 100 - value

                      elif metric == "effort":
                          value = 100 - value

                      weighted_values.append(
                          value * weight
                      )

                      total_weight += weight

                  if total_weight > 0:
                      score = round(
                          sum(weighted_values)
                          / total_weight,
                          2
                      )

              if score is None:
                  state = "INSUFFICIENT_EVIDENCE"

              elif completeness < 70:
                  state = "LIMITED_EVIDENCE"

              else:
                  state = "COMPARABLE"

              evaluated.append({
                  "name": strategy["name"],
                  "description": strategy["description"],
                  "source_path": strategy["source_path"],
                  "source_type": strategy["source_type"],
                  "metrics": metrics,
                  "known_metrics": known_metrics,
                  "completeness": completeness,
                  "score": score,
                  "state": state
              })

          # =========================================================
          # Deduplicate based on normalized name
          # =========================================================

          unique_evaluated = []
          unique_names = set()

          for item in evaluated:

              key = normalize_name(item["name"])

              if key in unique_names:
                  continue

              unique_names.add(key)
              unique_evaluated.append(item)

          evaluated = unique_evaluated

          # =========================================================
          # Arbitration
          # =========================================================

          comparable = [
              item
              for item in evaluated
              if item["score"] is not None
              and item["completeness"] >= 70
          ]

          comparable.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          decision = "INSUFFICIENT_EVIDENCE"
          selected = None
          margin = None
          confidence = "none"

          if len(comparable) == 1:

              decision = "INSUFFICIENT_COMPARISON"
              confidence = "limited"

          elif len(comparable) >= 2:

              top = comparable[0]
              second = comparable[1]

              margin = round(
                  top["score"] - second["score"],
                  2
              )

              if margin >= 10:

                  decision = "PRIORITIZE"
                  confidence = "strong"
                  selected = top

              elif margin >= 5:

                  decision = "PRIORITIZE"
                  confidence = "moderate"
                  selected = top

              else:

                  decision = "TIE"
                  confidence = "weak"

          # =========================================================
          # Rank only actual candidates
          # =========================================================

          ranking = []

          for rank, item in enumerate(
              sorted(
                  evaluated,
                  key=lambda x: (
                      x["score"] is not None,
                      x["score"] if x["score"] is not None else -1
                  ),
                  reverse=True
              ),
              start=1
          ):

              ranking.append({
                  "rank": rank,
                  **item
              })

          # =========================================================
          # Diagnostics
          # =========================================================

          explicit_container_paths = []

          for path, node in all_nodes:

              if not isinstance(node, dict):
                  continue

              for key in node.keys():

                  if key.lower() in CONTAINER_KEYS:

                      explicit_container_paths.append(
                          f"{path}.{key}"
                      )

          strategy_key_paths = []

          for path, node in dict_nodes:

              if any(
                  key.lower() in STRATEGY_KEYS
                  for key in node.keys()
              ):

                  strategy_key_paths.append(path)

          # =========================================================
          # V2 learning
          # =========================================================

          v2_failure_detected = (
              len(normalized) == 0
              and bool(act45_path)
          )

          learning = {
              "source": "ACT46_V2",
              "observation": (
                  "V2 loaded ACT45 but extracted zero candidates because "
                  "candidate discovery depended too heavily on expected field names."
              ),
              "problem": (
                  "ACT46 could not arbitrate because it did not reliably "
                  "understand the actual structure of ACT45 output."
              ),
              "correction": (
                  "V3 recursively inspects ACT45, discovers strategy containers, "
                  "strategy keys and structured strategy-like objects, then "
                  "normalizes and deduplicates real candidates."
              ),
              "principle": (
                  "A cognitive layer must understand the actual output of the "
                  "previous layer before claiming that the information is absent."
              )
          }

          # =========================================================
          # Rationale
          # =========================================================

          if decision == "PRIORITIZE":

              rationale = (
                  f"'{selected['name']}' is prioritized with a score of "
                  f"{selected['score']} and a comparison margin of {margin}. "
                  f"The priority is supported by comparable evidence."
              )

          elif decision == "TIE":

              rationale = (
                  "Multiple strategies have sufficiently comparable evidence, "
                  "but no strategy has a meaningful advantage. "
                  "ACT46 refuses to manufacture a priority."
              )

          elif decision == "INSUFFICIENT_COMPARISON":

              rationale = (
                  "Only one strategy has enough comparable evidence. "
                  "ACT46 refuses to treat an isolated score as a valid arbitration."
              )

          else:

              rationale = (
                  "No sufficient evidence exists to perform a defensible "
                  "strategy arbitration."
              )

          # =========================================================
          # Final result
          # =========================================================

          result = {
              "act": ACT,
              "version": VERSION,
              "name": "Strategy Arbitration",
              "timestamp": timestamp,

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Compare multiple strategies from ACT45 and determine "
                  "which strategy deserves priority when evidence supports it."
              ),

              "input": {
                  "act45_loaded": bool(act45_path),
                  "act45_source": act45_path,
                  "memory_files_loaded": len(
                      glob.glob("memory/*.json")
                  ),
                  "candidate_count": len(evaluated)
              },

              "act45_discovery": {
                  "total_nodes_inspected": len(all_nodes),
                  "dictionary_nodes": len(dict_nodes),
                  "list_nodes": len(list_nodes),
                  "discovered_top_level_and_nested_keys": discovered_keys,
                  "explicit_strategy_container_paths": (
                      explicit_container_paths[:50]
                  ),
                  "strategy_key_paths": strategy_key_paths[:50],
                  "raw_candidate_objects_found": len(
                      discovered_candidates
                  ),
                  "normalized_candidates": len(normalized)
              },

              "arbitration": {
                  "decision": decision,
                  "selected_strategy": (
                      selected["name"]
                      if selected
                      else None
                  ),
                  "selected_score": (
                      selected["score"]
                      if selected
                      else None
                  ),
                  "comparison_margin": margin,
                  "confidence": confidence,
                  "rationale": rationale
              },

              "ranking": ranking,

              "comparison": {
                  "comparable_candidates": len(comparable),
                  "minimum_metrics_required": 4,
                  "minimum_completeness_percent": 70,
                  "minimum_priority_margin": 5,
                  "strong_priority_margin": 10,
                  "fabricated_defaults_used": False,
                  "arbitrary_first_candidate_selection": False
              },

              "v2_learning": learning,

              "learning_signal": {
                  "v2_failure_detected": v2_failure_detected,
                  "lesson": (
                      "Before declaring evidence missing, verify that the "
                      "previous cognitive layer has actually been parsed "
                      "correctly."
                  )
              },

              "decision_policy": {
                  "primary_goal": (
                      "Choose a strategy only when the evidence supports "
                      "a meaningful comparison."
                  ),
                  "rules": [
                      "Read the actual ACT45 structure.",
                      "Do not assume a fixed ACT45 schema.",
                      "Never invent candidates.",
                      "Never invent scores.",
                      "Never use arbitrary default values.",
                      "Do not prioritize the first candidate.",
                      "Require sufficient evidence for comparison.",
                      "Require a meaningful score difference for PRIORITIZE.",
                      "Use TIE when candidates are effectively indistinguishable.",
                      "Use INSUFFICIENT_COMPARISON when only one candidate is sufficiently evidenced.",
                      "Use INSUFFICIENT_EVIDENCE when no candidate is sufficiently evidenced.",
                      "Preserve uncertainty instead of hiding it."
                  ]
              },

              "next_step": {
                  "act": "ACT47",
                  "capability": "Strategy Combination",
                  "condition": (
                      "Proceed after ACT46 demonstrates that it can "
                      "reliably consume ACT45 strategy outputs."
                  ),
                  "question": (
                      "Can multiple valuable strategies be combined "
                      "without unnecessary conflict or complexity?"
                  )
              },

              "status": "SUCCESS"
          }

          # =========================================================
          # Write JSON
          # =========================================================

          json_path = (
              "memory/nox_act_46_strategy_arbitration.json"
          )

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # =========================================================
          # Write Markdown
          # =========================================================

          md_path = (
              "memory/nox_act_46_strategy_arbitration.md"
          )

          lines = [
              "# NØX ACT46 — Strategy Arbitration V3",
              "",
              f"- Timestamp: `{timestamp}`",
              "- Version: `V3`",
              "- Gemini used: `false`",
              "- Project cost: `0 EUR`",
              "",
              "## Objective",
              "",
              "Read the real ACT45 output structure, identify its actual "
              "strategy candidates, then arbitrate only when the evidence "
              "supports a meaningful comparison.",
              "",
              "## ACT45 discovery",
              "",
              f"- ACT45 loaded: `{bool(act45_path)}`",
              f"- Source: `{act45_path}`",
              f"- Nodes inspected: `{len(all_nodes)}`",
              f"- Dictionary nodes: `{len(dict_nodes)}`",
              f"- List nodes: `{len(list_nodes)}`",
              f"- Raw candidates discovered: `{len(discovered_candidates)}`",
              f"- Normalized candidates: `{len(normalized)}`",
              "",
              "### Strategy containers discovered",
              ""
          ]

          if explicit_container_paths:

              for path in explicit_container_paths[:30]:
                  lines.append(f"- `{path}`")

          else:
              lines.append("- None")

          lines.extend([
              "",
              "## Decision",
              "",
              f"**{decision}**",
              "",
              f"Confidence: **{confidence}**",
              "",
              rationale,
              "",
              "## Candidate ranking",
              "",
              "| Rank | Strategy | Score | Completeness | State |",
              "|---:|---|---:|---:|---|"
          ])

          for item in ranking:

              score = (
                  str(item["score"])
                  if item["score"] is not None
                  else "N/A"
              )

              lines.append(
                  f"| {item['rank']} | {item['name']} | "
                  f"{score} | {item['completeness']}% | "
                  f"{item['state']} |"
              )

          lines.extend([
              "",
              "## V2 learning",
              "",
              learning["observation"],
              "",
              learning["problem"],
              "",
              learning["correction"],
              "",
              f"**Principle:** {learning['principle']}",
              "",
              "## Cognitive progression",
              "",
              "ACT45 — Adapter",
              "",
              "↓",
              "",
              "**ACT46 — Arbitrer**",
              "",
              "↓",
              "",
              "ACT47 — Combiner",
              "",
              "## Next step",
              "",
              "ACT47 will examine whether multiple valuable strategies "
              "can be combined without unnecessary conflict or complexity."
          ])

          with open(md_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          # =========================================================
          # Runtime diagnostics
          # =========================================================

          print("========================================")
          print("NØX ACT46 V3")
          print("========================================")
          print(f"ACT45 loaded: {bool(act45_path)}")
          print(f"ACT45 source: {act45_path}")
          print(f"Nodes inspected: {len(all_nodes)}")
          print(f"Dictionary nodes: {len(dict_nodes)}")
          print(f"List nodes: {len(list_nodes)}")
          print(
              "Raw candidates discovered: "
              f"{len(discovered_candidates)}"
          )
          print(
              "Normalized candidates: "
              f"{len(normalized)}"
          )
          print(f"Decision: {decision}")
          print(f"Confidence: {confidence}")
          print(f"V2 failure detected: {v2_failure_detected}")
          print("Fabricated defaults: false")
          print("Arbitrary first candidate: false")

          if selected:
              print(
                  f"Selected strategy: {selected['name']}"
              )
              print(
                  f"Selected score: {selected['score']}"
              )
              print(
                  f"Comparison margin: {margin}"
              )
          else:
              print("Selected strategy: NONE")

          print(f"Memory: {json_path}")
          print(f"Report: {md_path}")
          print("========================================")

          PY

      - name: Commit ACT46 V3 results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_46_strategy_arbitration.json
          git add memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 V3 changes to commit."
            exit 0
          fi

          git commit -m "feat: improve ACT46 strategy discovery"

          git pull --rebase origin main

          git push origin HEAD:main
