name: NØX ACT46 - Strategy Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46-strategy-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 Strategy Arbitration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p memory

          python - <<'PY'
          import json
          import os
          import glob
          from datetime import datetime, timezone

          ACT = "ACT46"
          VERSION = "V1"

          timestamp = datetime.now(timezone.utc).isoformat()

          # ---------------------------------------------------------
          # 1. Load ACT45 result
          # ---------------------------------------------------------

          act45_candidates = [
              "memory/nox_act_45_adaptive_strategy_selection.json",
              "memory/nox_act_45_adaptive_strategy_selection_v1.json"
          ]

          act45_path = None

          for path in act45_candidates:
              if os.path.exists(path):
                  act45_path = path
                  break

          act45 = {}

          if act45_path:
              try:
                  with open(act45_path, "r", encoding="utf-8") as f:
                      act45 = json.load(f)
              except Exception:
                  act45 = {}

          # ---------------------------------------------------------
          # 2. Load recent ACT memory
          # ---------------------------------------------------------

          memories = []

          for path in glob.glob("memory/nox_act_*.json"):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  memories.append({
                      "path": path,
                      "data": data
                  })

              except Exception:
                  continue

          def act_number(path):
              name = os.path.basename(path)
              digits = ""
              for char in name:
                  if char.isdigit():
                      digits += char
                  elif digits:
                      break
              try:
                  return int(digits)
              except Exception:
                  return 0

          memories.sort(
              key=lambda item: act_number(item["path"]),
              reverse=True
          )

          recent_memories = memories[:20]

          # ---------------------------------------------------------
          # 3. Extract candidate strategies from ACT45
          # ---------------------------------------------------------

          candidates = []

          possible_fields = [
              "strategies",
              "candidate_strategies",
              "candidates",
              "strategy_candidates"
          ]

          for field in possible_fields:
              value = act45.get(field)

              if isinstance(value, list):
                  candidates.extend(value)

          # ACT45 may expose one preferred strategy plus alternatives.
          preferred = act45.get("preferred_strategy")

          if isinstance(preferred, dict):
              candidates.append(preferred)

          alternatives = act45.get("alternatives")

          if isinstance(alternatives, list):
              candidates.extend(alternatives)

          # ---------------------------------------------------------
          # 4. Normalize candidates
          # ---------------------------------------------------------

          normalized = []
          seen = set()

          for index, candidate in enumerate(candidates):

              if isinstance(candidate, str):
                  name = candidate
                  item = {
                      "name": name
                  }

              elif isinstance(candidate, dict):
                  item = dict(candidate)

                  name = (
                      item.get("name")
                      or item.get("strategy")
                      or item.get("id")
                      or f"strategy_{index + 1}"
                  )

                  item["name"] = name

              else:
                  continue

              key = str(name).strip().lower()

              if not key or key in seen:
                  continue

              seen.add(key)
              normalized.append(item)

          # ---------------------------------------------------------
          # 5. Fallback strategic candidates
          # ---------------------------------------------------------

          if not normalized:
              normalized = [
                  {
                      "name": "deepen_current_strategy",
                      "description": "Continue improving the currently strongest strategy."
                  },
                  {
                      "name": "explore_alternative",
                      "description": "Investigate a promising alternative strategy."
                  },
                  {
                      "name": "reduce_risk",
                      "description": "Prefer a lower-risk strategy while evidence remains limited."
                  }
              ]

          # ---------------------------------------------------------
          # 6. Build arbitration signals
          # ---------------------------------------------------------

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def get_score(item, keys):
              for key in keys:
                  if key in item:
                      return number(item.get(key))
              return 0.0

          scored = []

          for index, item in enumerate(normalized):

              relevance = get_score(
                  item,
                  ["relevance", "relevance_score", "context_score"]
              )

              evidence = get_score(
                  item,
                  ["evidence", "evidence_score", "evidence_quality"]
              )

              potential = get_score(
                  item,
                  ["potential", "potential_score", "impact", "impact_score"]
              )

              confidence = get_score(
                  item,
                  ["confidence", "confidence_score"]
              )

              risk = get_score(
                  item,
                  ["risk", "risk_score"]
              )

              effort = get_score(
                  item,
                  ["effort", "effort_score", "cost"]
              )

              # If scores are absent, ACT46 remains conservative.
              # The candidate receives a neutral baseline rather than
              # inventing evidence.
              if relevance == 0:
                  relevance = 50.0

              if evidence == 0:
                  evidence = 50.0

              if potential == 0:
                  potential = 50.0

              if confidence == 0:
                  confidence = 50.0

              # Lower risk and lower effort are preferable.
              risk_penalty = min(max(risk, 0.0), 100.0)
              effort_penalty = min(max(effort, 0.0), 100.0)

              arbitration_score = (
                  relevance * 0.25
                  + evidence * 0.20
                  + potential * 0.25
                  + confidence * 0.15
                  + (100.0 - risk_penalty) * 0.10
                  + (100.0 - effort_penalty) * 0.05
              )

              scored.append({
                  "rank": 0,
                  "name": item["name"],
                  "description": item.get("description", ""),
                  "relevance": round(relevance, 2),
                  "evidence": round(evidence, 2),
                  "potential": round(potential, 2),
                  "confidence": round(confidence, 2),
                  "risk": round(risk_penalty, 2),
                  "effort": round(effort_penalty, 2),
                  "arbitration_score": round(arbitration_score, 2)
              })

          # ---------------------------------------------------------
          # 7. Rank strategies
          # ---------------------------------------------------------

          scored.sort(
              key=lambda x: x["arbitration_score"],
              reverse=True
          )

          for rank, item in enumerate(scored, start=1):
              item["rank"] = rank

          winner = scored[0]

          alternatives = scored[1:]

          # ---------------------------------------------------------
          # 8. Determine arbitration margin
          # ---------------------------------------------------------

          if len(scored) > 1:
              margin = round(
                  winner["arbitration_score"]
                  - scored[1]["arbitration_score"],
                  2
              )
          else:
              margin = None

          if margin is None:
              arbitration_confidence = "limited_comparison"
          elif margin >= 20:
              arbitration_confidence = "strong"
          elif margin >= 10:
              arbitration_confidence = "moderate"
          else:
              arbitration_confidence = "weak"

          # ---------------------------------------------------------
          # 9. Produce decision rationale
          # ---------------------------------------------------------

          rationale = (
              f"'{winner['name']}' receives the highest arbitration score "
              f"({winner['arbitration_score']}) after comparing "
              f"{len(scored)} candidate strategies using relevance, "
              f"evidence, potential, confidence, risk and effort."
          )

          if margin is not None:
              rationale += (
                  f" The score margin over the next strategy is {margin}."
              )

          # ---------------------------------------------------------
          # 10. Build memory artifact
          # ---------------------------------------------------------

          result = {
              "act": ACT,
              "version": VERSION,
              "name": "Strategy Arbitration",
              "timestamp": timestamp,
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Arbitrate between multiple strategies and determine "
                  "which strategy deserves priority in the current context."
              ),

              "input": {
                  "act45_loaded": bool(act45_path),
                  "act45_source": act45_path,
                  "recent_memory_files_loaded": len(recent_memories),
                  "candidate_count": len(scored)
              },

              "arbitration": {
                  "selected_strategy": winner["name"],
                  "selected_score": winner["arbitration_score"],
                  "comparison_margin": margin,
                  "confidence": arbitration_confidence,
                  "rationale": rationale
              },

              "ranking": scored,

              "alternatives": [
                  {
                      "name": item["name"],
                      "score": item["arbitration_score"],
                      "rank": item["rank"]
                  }
                  for item in alternatives
              ],

              "decision_policy": {
                  "primary_goal": "Choose the strategy with the strongest overall current value.",
                  "priority_factors": [
                      "relevance",
                      "evidence",
                      "potential",
                      "confidence",
                      "risk",
                      "effort"
                  ],
                  "avoid": [
                      "choosing solely from historical popularity",
                      "treating uncertainty as certainty",
                      "inventing evidence",
                      "executing external actions"
                  ]
              },

              "next_step": {
                  "act": "ACT47",
                  "capability": "Strategy Combination",
                  "question": (
                      "Can multiple high-value strategies be combined "
                      "without creating unnecessary conflict or complexity?"
                  )
              },

              "status": "SUCCESS"
          }

          # ---------------------------------------------------------
          # 11. Write JSON memory
          # ---------------------------------------------------------

          json_path = "memory/nox_act_46_strategy_arbitration.json"

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          # ---------------------------------------------------------
          # 12. Write Markdown report
          # ---------------------------------------------------------

          md_path = "memory/nox_act_46_strategy_arbitration.md"

          lines = [
              "# NØX ACT46 — Strategy Arbitration",
              "",
              f"- Timestamp: `{timestamp}`",
              "- Version: `V1`",
              "- Gemini used: `false`",
              "- Project cost: `0 EUR`",
              "",
              "## Objective",
              "",
              "Determine which strategy deserves priority when several "
              "strategies are simultaneously available.",
              "",
              "## Selected strategy",
              "",
              f"**{winner['name']}**",
              "",
              f"Arbitration score: **{winner['arbitration_score']}**",
              "",
              f"Confidence: **{arbitration_confidence}**",
              "",
              rationale,
              "",
              "## Ranking",
              "",
              "| Rank | Strategy | Score | Relevance | Evidence | Potential | Confidence | Risk | Effort |",
              "|---:|---|---:|---:|---:|---:|---:|---:|---:|"
          ]

          for item in scored:
              lines.append(
                  f"| {item['rank']} | {item['name']} | "
                  f"{item['arbitration_score']} | "
                  f"{item['relevance']} | "
                  f"{item['evidence']} | "
                  f"{item['potential']} | "
                  f"{item['confidence']} | "
                  f"{item['risk']} | "
                  f"{item['effort']} |"
              )

          lines.extend([
              "",
              "## Decision principles",
              "",
              "- Prefer strategies with strong current relevance.",
              "- Prefer strategies supported by stronger evidence.",
              "- Consider expected potential and impact.",
              "- Account for confidence before prioritizing.",
              "- Penalize unnecessary risk.",
              "- Penalize unnecessary effort.",
              "- Do not invent missing evidence.",
              "- Do not execute external actions.",
              "",
              "## Cognitive progression",
              "",
              "ACT45 — Adapt",
              "",
              "↓",
              "",
              "**ACT46 — Arbitrate**",
              "",
              "↓",
              "",
              "ACT47 — Combine",
              "",
              "## Next step",
              "",
              "ACT47 will determine whether several valuable strategies "
              "can be combined into a coherent strategy set."
          ])

          with open(md_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print("ACT46 SUCCESS")
          print(f"Selected strategy: {winner['name']}")
          print(f"Score: {winner['arbitration_score']}")
          print(f"Candidates: {len(scored)}")
          print(f"Confidence: {arbitration_confidence}")
          print(f"Memory: {json_path}")
          print(f"Report: {md_path}")

          PY

      - name: Commit ACT46 results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_46_strategy_arbitration.json
          git add memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 changes to commit."
            exit 0
          fi

          git commit -m "feat: add ACT46 strategy arbitration"

          git pull --rebase origin main

          git push origin HEAD:main
