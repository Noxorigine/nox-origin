name: Nox ACT46 - Strategy Arbitration V6

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act46:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT46 V6
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          MEMORY = Path("memory")
          MEMORY.mkdir(exist_ok=True)

          INPUT = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          OUTPUT_JSON = MEMORY / "nox_act_46_strategy_arbitration.json"
          OUTPUT_MD = MEMORY / "nox_act_46_strategy_arbitration.md"

          if not INPUT.exists():
              raise SystemExit(
                  "ACT46 V6 requires memory/nox_act_45_adaptive_strategy_selection.json"
              )

          with INPUT.open("r", encoding="utf-8") as f:
              act45 = json.load(f)

          if act45.get("act") != "ACT45":
              raise SystemExit("Invalid ACT45 source: act field is not ACT45")

          if act45.get("version") != "V7":
              raise SystemExit(
                  "Invalid ACT45 source: ACT46 V6 requires ACT45 V7"
              )

          method = act45.get("method", {})
          integrity = act45.get("evidence_integrity", {})
          selection45 = act45.get("selection", {})

          # ------------------------------------------------------------------
          # Strict integrity checks
          # ------------------------------------------------------------------

          required_false_flags = {
              "fabricated_candidates": False,
              "fabricated_metrics": False,
              "arbitrary_selection": False,
          }

          for key, expected in required_false_flags.items():
              if method.get(key) is not expected:
                  raise SystemExit(
                      f"ACT45 integrity failure: method.{key} must be {expected}"
                  )

          if method.get("old_act30_candidates_used") is not False:
              raise SystemExit(
                  "ACT45 integrity failure: old ACT30 candidates must not be used"
              )

          if method.get("global_metrics_used_as_candidate_metrics") is not False:
              raise SystemExit(
                  "ACT45 integrity failure: global metrics must not become candidate metrics"
              )

          if integrity.get("free_text_strategy_matching") is not False:
              raise SystemExit(
                  "ACT45 integrity failure: free-text strategy matching detected"
              )

          # ------------------------------------------------------------------
          # Candidate validation
          # ------------------------------------------------------------------

          raw_candidates = act45.get("candidates", [])

          if not isinstance(raw_candidates, list):
              raise SystemExit("Invalid ACT45 candidates structure")

          candidates = []

          for candidate in raw_candidates:
              if not isinstance(candidate, dict):
                  continue

              name = candidate.get("name")

              if not isinstance(name, str) or not name.strip():
                  continue

              observations = candidate.get(
                  "comparable_observations",
                  0
              )

              successes = candidate.get("successes", 0)
              failures = candidate.get("failures", 0)
              contradictions = candidate.get("contradictions", 0)

              if not all(
                  isinstance(value, int) and value >= 0
                  for value in [
                      observations,
                      successes,
                      failures,
                      contradictions,
                  ]
              ):
                  continue

              candidates.append({
                  "name": name.strip(),
                  "evidence_sources": candidate.get(
                      "evidence_sources",
                      []
                  ),
                  "comparable_observations": observations,
                  "successes": successes,
                  "failures": failures,
                  "contradictions": contradictions,
                  "unclassified": candidate.get(
                      "unclassified",
                      0
                  ),
                  "trend": candidate.get(
                      "trend",
                      "insufficient"
                  ),
                  "evidence_strength": candidate.get(
                      "evidence_strength",
                      "insufficient"
                  ),
              })

          # ------------------------------------------------------------------
          # ACT46 arbitration rules
          #
          # ACT46 does not manufacture strategies.
          # ACT46 does not manufacture metrics.
          # ACT46 does not reinterpret missing evidence.
          # ACT46 only arbitrates candidates explicitly produced by ACT45.
          # ------------------------------------------------------------------

          MIN_OBSERVATIONS = 3

          eligible = [
              c for c in candidates
              if c["comparable_observations"] >= MIN_OBSERVATIONS
          ]

          decision = "INSUFFICIENT_COMPARISON"
          selected_strategy = None
          arbitration_basis = []
          reason = ""

          if len(eligible) < 2:
              decision = "INSUFFICIENT_COMPARISON"

              if len(eligible) == 0:
                  reason = (
                      "ACT45 V7 did not provide at least two strategies "
                      "with sufficient comparable empirical evidence."
                  )
              else:
                  reason = (
                      "ACT45 V7 provided fewer than two strategies with "
                      "sufficient comparable empirical evidence."
                  )

          else:
              # --------------------------------------------------------------
              # Explicit evidence comparison only.
              #
              # No hidden weighting.
              # No invented numerical score.
              # No first-candidate fallback.
              # --------------------------------------------------------------

              comparable = []

              for candidate in eligible:
                  net = (
                      candidate["successes"]
                      - candidate["failures"]
                  )

                  comparable.append({
                      **candidate,
                      "net_empirical_result": net
                  })

              # A candidate with contradictions cannot automatically win.
              # If contradictions are present across competing candidates,
              # preserve uncertainty unless one candidate has a strictly
              # stronger evidence profile without contradiction.
              contradiction_free = [
                  c for c in comparable
                  if c["contradictions"] == 0
              ]

              if len(contradiction_free) >= 2:
                  ranked = sorted(
                      contradiction_free,
                      key=lambda c: (
                          c["net_empirical_result"],
                          c["successes"],
                          -c["failures"],
                          c["comparable_observations"],
                      ),
                      reverse=True,
                  )

                  first = ranked[0]
                  second = ranked[1]

                  first_profile = (
                      first["net_empirical_result"],
                      first["successes"],
                      -first["failures"],
                      first["comparable_observations"],
                  )

                  second_profile = (
                      second["net_empirical_result"],
                      second["successes"],
                      -second["failures"],
                      second["comparable_observations"],
                  )

                  if first_profile != second_profile:
                      decision = "PRIORITIZE"
                      selected_strategy = first["name"]

                      arbitration_basis = [
                          "comparable empirical observations",
                          "success count",
                          "failure count",
                          "absence of contradictions",
                      ]

                      reason = (
                          "One strategy has a strictly stronger explicit "
                          "empirical evidence profile than the alternatives."
                      )
                  else:
                      decision = "TIE"
                      reason = (
                          "The strongest candidates have identical explicit "
                          "empirical evidence profiles."
                      )

              else:
                  decision = "INSUFFICIENT_COMPARISON"
                  reason = (
                      "Competing strategies contain contradictory evidence; "
                      "ACT46 will not force an arbitrary priority."
                  )

          # ------------------------------------------------------------------
          # Final integrity state
          # ------------------------------------------------------------------

          comparison_possible = len(eligible) >= 2

          output = {
              "act": "ACT46",
              "version": "V6",
              "name": "Strategy Arbitration",

              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "source": {
                  "file": str(INPUT),
                  "act": "ACT45",
                  "version": "V7",
                  "candidate_count_received": len(candidates),
                  "eligible_candidate_count": len(eligible),
                  "minimum_comparable_observations": MIN_OBSERVATIONS,
              },

              "method": {
                  "arbitration": (
                      "Explicit evidence comparison between candidates "
                      "produced by ACT45 V7"
                  ),
                  "candidate_source": "ACT45_V7_only",
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "first_candidate_fallback": False,
                  "hidden_scoring": False,
                  "global_metrics_used": False,
                  "free_text_matching": False,
                  "minimum_strategies_for_arbitration": 2,
                  "minimum_comparable_observations": MIN_OBSERVATIONS,
              },

              "candidates": candidates,

              "eligible_candidates": eligible,

              "arbitration": {
                  "decision": decision,
                  "selected_strategy": selected_strategy,
                  "comparison_possible": comparison_possible,
                  "reason": reason,
                  "basis": arbitration_basis,
              },

              "evidence_integrity": {
                  "act45_source_verified": True,
                  "act45_v7_verified": True,
                  "fabricated_candidates": False,
                  "fabricated_metrics": False,
                  "arbitrary_selection": False,
                  "missing_evidence_preserved": True,
                  "contradictory_evidence_preserved": True,
                  "old_act30_candidates_used": False,
                  "global_metrics_used": False,
              },

              "next_cognitive_step": (
                  "Proceed to ACT47 only when ACT46 produces a defensible "
                  "PRIORITIZE decision; otherwise preserve uncertainty."
              ),
          }

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          md = f"""# ACT46 V6 — Strategy Arbitration

          ## Decision

          - Decision: `{decision}`
          - Selected strategy: `{selected_strategy}`
          - Comparison possible: `{comparison_possible}`

          ## Source

          ACT45 V7:
          `memory/nox_act_45_adaptive_strategy_selection.json`

          ## Arbitration policy

          - ACT45 V7 is the only candidate source.
          - No candidates are invented.
          - No metrics are invented.
          - No arbitrary first-candidate selection.
          - No hidden scoring.
          - No global metrics.
          - No ACT30 fallback.
          - Minimum 2 comparable strategies.
          - Minimum 3 comparable observations per strategy.
          - Contradictory evidence remains explicit.

          ## Result

          {reason}

          ## Integrity

          - Cost: €0
          - Gemini: false
          - External AI: false
          - External API: false
          - Spending: false
          - Payments: false
          """

          OUTPUT_MD.write_text(
              md.strip() + "\n",
              encoding="utf-8"
          )

          print("ACT46 V6 completed")
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Verify ACT46 V6 outputs
        run: |
          test -s memory/nox_act_46_strategy_arbitration.json
          test -s memory/nox_act_46_strategy_arbitration.md

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "memory/nox_act_46_strategy_arbitration.json"
          )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["act"] == "ACT46"
          assert data["version"] == "V6"

          assert data["cost_zero"] is True
          assert data["gemini_used"] is False
          assert data["external_ai_used"] is False
          assert data["external_api_used"] is False
          assert data["spending"] is False
          assert data["payments"] is False

          assert data["method"]["fabricated_candidates"] is False
          assert data["method"]["fabricated_metrics"] is False
          assert data["method"]["arbitrary_selection"] is False
          assert data["method"]["first_candidate_fallback"] is False
          assert data["method"]["hidden_scoring"] is False

          assert data["source"]["act"] == "ACT45"
          assert data["source"]["version"] == "V7"

          assert data["arbitration"]["decision"] in {
              "PRIORITIZE",
              "TIE",
              "INSUFFICIENT_COMPARISON",
          }

          print("ACT46 V6 output verification: OK")
          PY

      - name: Commit ACT46 V6 results
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_act_46_strategy_arbitration.json \
            memory/nox_act_46_strategy_arbitration.md

          if git diff --cached --quiet; then
            echo "No ACT46 V6 changes to commit."
            exit 0
          fi

          git commit -m "ACT46 V6 strategy arbitration"
          git push
