name: NØX ACT58 - Autonomous Marketplace

"on":
  workflow_dispatch:
  schedule:
    - cron: "41 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-58-autonomous-marketplace
  cancel-in-progress: false

jobs:
  autonomous-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      ACTION_MEMORY: memory/nox_act_58_autonomous_marketplace.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Create ACT58 engine
        shell: bash
        run: |
          cat > /tmp/nox_act_58.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          MEMORY_PATH = os.environ["ACTION_MEMORY"]

          VERSION = "ACT58"

          REQUEST_TIMEOUT = 20
          MAX_TASKS = 100
          MAX_ACTIONS_PER_RUN = 2
          MAX_MEMORY = 300

          MIN_BID_SATS = 21

          POSITIVE_TERMS = {
              "research": 24,
              "analysis": 24,
              "analyze": 20,
              "verification": 25,
              "verify": 25,
              "audit": 22,
              "qa": 22,
              "quality": 15,
              "api": 22,
              "python": 22,
              "json": 18,
              "data": 18,
              "documentation": 18,
              "docs": 14,
              "technical": 15,
              "agent": 14,
              "agents": 14,
              "lightning": 12,
              "bitcoin": 8,
              "source": 12,
              "sources": 12,
              "evidence": 18,
              "check": 15,
              "testing": 20,
              "test": 16,
              "bug": 15,
              "github": 10,
          }

          NEGATIVE_TERMS = {
              "logo": 35,
              "branding": 35,
              "portrait": 35,
              "illustration": 30,
              "video": 30,
              "animation": 30,
              "3d": 30,
              "godot": 30,
              "game": 25,
              "seo": 18,
              "lead generation": 22,
              "lead-gen": 22,
              "cro": 20,
              "physical": 30,
              "shipping": 30,
              "usdc": 6,
              "ethereum": 6,
              "base usdc": 8,
          }

          EXECUTION_TERMS = {
              "public",
              "url",
              "api",
              "github",
              "json",
              "csv",
              "research",
              "analysis",
              "audit",
              "verify",
              "verification",
              "qa",
              "test",
              "testing",
              "documentation",
              "docs",
              "source",
              "evidence",
              "report",
              "check",
          }


          def now():
              return datetime.now(timezone.utc).isoformat()


          def load_memory():
              default = {
                  "version": VERSION,
                  "created_at": now(),
                  "updated_at": now(),
                  "runs": 0,
                  "observed_tasks": [],
                  "candidates": [],
                  "bids": [],
                  "actions": [],
                  "results": [],
                  "accepted": [],
                  "payments": [],
                  "tips": [],
              }

              if not os.path.exists(MEMORY_PATH):
                  return default

              try:
                  with open(MEMORY_PATH, "r", encoding="utf-8") as handle:
                      data = json.load(handle)

                  if not isinstance(data, dict):
                      return default

                  for key, value in default.items():
                      data.setdefault(key, value)

                  return data

              except Exception as exc:
                  print(f"MEMORY LOAD WARNING: {exc}")
                  return default


          def save_memory(memory):
              os.makedirs(os.path.dirname(MEMORY_PATH), exist_ok=True)

              memory["version"] = VERSION
              memory["updated_at"] = now()

              for key in (
                  "observed_tasks",
                  "candidates",
                  "bids",
                  "actions",
                  "results",
                  "accepted",
                  "payments",
                  "tips",
              ):
                  if isinstance(memory.get(key), list):
                      memory[key] = memory[key][-MAX_MEMORY:]

              temporary = MEMORY_PATH + ".tmp"

              with open(temporary, "w", encoding="utf-8") as handle:
                  json.dump(
                      memory,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                  )

              os.replace(temporary, MEMORY_PATH)


          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-ACT58/1.0",
          })


          def request(method, path, token=None, params=None, payload=None, idempotency_key=None):
              headers = {}

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              if idempotency_key:
                  headers["Idempotency-Key"] = idempotency_key

              response = session.request(
                  method,
                  BASE_URL + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=REQUEST_TIMEOUT,
              )

              print(f"{method} {path} -> {response.status_code}")

              if response.status_code >= 400:
                  print(
                      "RESPONSE:",
                      response.text[:1200].replace("\n", " "),
                  )

              return response


          def authenticate():
              response = request(
                  "POST",
                  "/api/v1/auth/token",
                  payload={"api_key": API_KEY},
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      f"authentication failed: {response.status_code}"
                  )

              payload = response.json()
              token = payload.get("access_token")

              if not token:
                  raise RuntimeError("missing access_token")

              return token


          def get_json(token, path, params=None):
              response = request(
                  "GET",
                  path,
                  token=token,
                  params=params,
              )

              if response.status_code != 200:
                  return None, response.status_code

              try:
                  return response.json(), response.status_code
              except Exception:
                  return None, response.status_code


          def post_json(
              token,
              path,
              payload=None,
              params=None,
              idempotency_key=None,
          ):
              response = request(
                  "POST",
                  path,
                  token=token,
                  params=params,
                  payload=payload,
                  idempotency_key=idempotency_key,
              )

              try:
                  payload = response.json()
              except Exception:
                  payload = None

              return payload, response.status_code


          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in keys:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.lower()

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                  ).lower()
              except Exception:
                  return str(value).lower()


          def task_text(task):
              values = [
                  task.get("title"),
                  task.get("body"),
                  task.get("description"),
                  task.get("details"),
                  task.get("requirements"),
                  task.get("deliverables"),
                  task.get("category"),
                  task.get("tags"),
                  task.get("post_type"),
              ]

              metadata = task.get("metadata")

              if metadata is not None:
                  values.append(metadata)

              return " ".join(
                  text_value(value)
                  for value in values
                  if value is not None
              )


          def task_id(task):
              for key in (
                  "task_id",
                  "taskId",
                  "post_id",
                  "postId",
                  "id",
                  "uuid",
              ):
                  value = task.get(key)

                  if value is None:
                      continue

                  value = str(value).strip()

                  if value:
                      return value

              return None


          def author_id(task):
              for key in (
                  "author_id",
                  "authorId",
                  "user_id",
                  "userId",
                  "creator_id",
              ):
                  value = task.get(key)

                  if value is not None:
                      return str(value)

              author = task.get("author")

              if isinstance(author, dict):
                  value = author.get("id")

                  if value is not None:
                      return str(value)

              return None


          def numeric(value):
              try:
                  return int(float(value))
              except Exception:
                  return 0


          def reward_range(task):
              possible_min = (
                  "budget_min_sats",
                  "min_sats",
                  "min_reward_sats",
                  "reward_min_sats",
                  "budget_min",
                  "minimum_sats",
                  "amount_min_sats",
              )

              possible_max = (
                  "budget_max_sats",
                  "max_sats",
                  "max_reward_sats",
                  "reward_max_sats",
                  "budget_max",
                  "maximum_sats",
                  "amount_max_sats",
              )

              minimum = 0
              maximum = 0

              for key in possible_min:
                  if key in task and task[key] not in (None, ""):
                      minimum = numeric(task[key])
                      break

              for key in possible_max:
                  if key in task and task[key] not in (None, ""):
                      maximum = numeric(task[key])
                      break

              reward = task.get("reward")

              if isinstance(reward, dict):
                  if minimum == 0:
                      minimum = numeric(
                          reward.get("min_sats")
                          or reward.get("minimum_sats")
                          or reward.get("min")
                      )

                  if maximum == 0:
                      maximum = numeric(
                          reward.get("max_sats")
                          or reward.get("maximum_sats")
                          or reward.get("max")
                      )

              if minimum == 0 and maximum == 0:
                  raw = task_text(task)

                  matches = re.findall(
                      r"(\d[\d,]*)\s*sats",
                      raw,
                  )

                  amounts = []

                  for match in matches:
                      try:
                          amounts.append(
                              int(match.replace(",", ""))
                          )
                      except Exception:
                          pass

                  if amounts:
                      minimum = min(amounts)
                      maximum = max(amounts)

              if maximum == 0:
                  maximum = minimum

              return minimum, maximum


          def status_of(task):
              value = task.get("status")

              if value is None:
                  value = task.get("state")

              if value is None:
                  return "unknown"

              return str(value).strip().lower()


          def is_open(task):
              status = status_of(task)

              if status in (
                  "accepted",
                  "completed",
                  "cancelled",
                  "closed",
                  "expired",
                  "rejected",
              ):
                  return False

              return True


          def already_bid(memory, identifier):
              for bid in memory.get("bids", []):
                  if str(bid.get("task_id")) == str(identifier):
                      return True

              return False


          def score_task(task, own_id):
              identifier = task_id(task)

              if not identifier:
                  return -1, ["no_task_id"]

              if not is_open(task):
                  return -1, [f"not_open:{status_of(task)}"]

              creator = author_id(task)

              if creator and own_id and creator == str(own_id):
                  return -1, ["own_task"]

              text = task_text(task)

              minimum, maximum = reward_range(task)

              score = 40
              reasons = []

              positive_hits = 0
              negative_hits = 0
              execution_hits = 0

              for term, points in POSITIVE_TERMS.items():
                  if term in text:
                      score += points
                      positive_hits += 1
                      reasons.append(f"+{term}")

              for term, penalty in NEGATIVE_TERMS.items():
                  if term in text:
                      score -= penalty
                      negative_hits += 1
                      reasons.append(f"-{term}")

              for term in EXECUTION_TERMS:
                  if term in text:
                      execution_hits += 1

              if positive_hits >= 2:
                  score += 15
                  reasons.append("+multi_capability")

              if execution_hits >= 3:
                  score += 15
                  reasons.append("+executable_scope")

              if minimum >= MIN_BID_SATS:
                  score += 8
                  reasons.append("+paid")

              if maximum >= 500:
                  score += 5
                  reasons.append("+meaningful_reward")

              bids = numeric(
                  task.get("bid_count")
                  or task.get("bids_count")
                  or task.get("num_bids")
              )

              if bids == 0:
                  score += 18
                  reasons.append("+zero_bids")

              elif bids <= 2:
                  score += 10
                  reasons.append("+low_competition")

              elif bids <= 5:
                  score += 3
                  reasons.append("+moderate_competition")

              elif bids >= 10:
                  score -= 10
                  reasons.append("-high_competition")

              if negative_hits >= 3:
                  score -= 20
                  reasons.append("-poor_capability_match")

              score = max(0, min(100, score))

              return score, reasons


          def choose_bid(task):
              minimum, maximum = reward_range(task)

              if maximum < MIN_BID_SATS:
                  return None

              if minimum >= MIN_BID_SATS:
                  return minimum

              return MIN_BID_SATS


          def build_bid(task, score):
              title = str(task.get("title") or "").strip()
              text = task_text(task)

              if any(
                  term in text
                  for term in (
                      "research",
                      "analysis",
                      "audit",
                      "verify",
                      "verification",
                  )
              ):
                  body = (
                      "NØX can handle this as a focused research/"
                      "verification task. The deliverable will use "
                      "explicit evidence, checked sources, and a concise "
                      "result tied directly to the requested scope."
                  )

              elif any(
                  term in text
                  for term in (
                      "api",
                      "python",
                      "json",
                      "csv",
                      "qa",
                      "test",
                  )
              ):
                  body = (
                      "NØX can handle this as a bounded technical task "
                      "with reproducible checks and a concise evidence-"
                      "based result. The work will stay within the stated "
                      "scope and return the requested output."
                  )

              else:
                  body = (
                      "NØX can take this as a bounded task and return "
                      "a concrete, verifiable result rather than a "
                      "generic response. The work will follow the "
                      "requested scope and document the result clearly."
                  )

              if title:
                  body += f" Target: {title[:250]}."

              body += f" Capability match: {score}/100."

              return body[:4000]


          def record_observation(memory, task, score=None, reasons=None):
              identifier = task_id(task)

              memory["observed_tasks"].append({
                  "task_id": identifier,
                  "title": task.get("title"),
                  "status": status_of(task),
                  "reward": reward_range(task),
                  "bid_count": numeric(
                      task.get("bid_count")
                      or task.get("bids_count")
                      or task.get("num_bids")
                  ),
                  "score": score,
                  "reasons": reasons or [],
                  "observed_at": now(),
              })


          def verify_previous_bids(token, memory):
              accepted = []
              payments = []

              checked = set()

              for bid in reversed(memory.get("bids", [])):
                  identifier = bid.get("task_id")

                  if not identifier:
                      continue

                  if identifier in checked:
                      continue

                  checked.add(identifier)

                  data, status = get_json(
                      token,
                      f"/api/v1/marketplace/{identifier}/bids",
                  )

                  if status != 200:
                      continue

                  bids = extract_list(
                      data,
                      ("bids", "items", "data", "results"),
                  )

                  wanted_id = bid.get("bid_id")

                  for item in bids:
                      if wanted_id and str(item.get("id")) != str(wanted_id):
                          continue

                      item_status = str(
                          item.get("status") or ""
                      ).lower()

                      bid["last_status"] = item_status
                      bid["last_checked_at"] = now()

                      if item_status == "accepted":
                          accepted.append({
                              "task_id": identifier,
                              "bid_id": wanted_id,
                              "checked_at": now(),
                          })

                          payment, payment_status = get_json(
                              token,
                              f"/api/v1/marketplace/{identifier}/payment",
                          )

                          payments.append({
                              "task_id": identifier,
                              "bid_id": wanted_id,
                              "status": payment_status,
                              "payment": payment,
                              "checked_at": now(),
                          })

                      break

              return accepted, payments


          def fetch_tips(token, username):
              data, status = get_json(
                  token,
                  "/api/v1/tips",
                  params={
                      "recipient": username,
                      "limit": 100,
                      "offset": 0,
                  },
              )

              if status != 200:
                  return []

              return extract_list(
                  data,
                  ("tips", "items", "data", "results"),
              )


          def main():
              print("NØX ACT58 - Autonomous Marketplace")
              print("Gemini: DISABLED")
              print("External AI: DISABLED")
              print("Spending: DISABLED")
              print("Marketplace: ENABLED")
              print("Real bids: ENABLED")
              print("Cost: 0")
              print()

              if not API_KEY:
                  raise RuntimeError("COLONY_API_KEY missing")

              memory = load_memory()
              memory["runs"] = numeric(memory.get("runs")) + 1

              token = authenticate()

              me, status = get_json(
                  token,
                  "/api/v1/users/me",
              )

              if status != 200 or not isinstance(me, dict):
                  raise RuntimeError("identity lookup failed")

              username = me.get("username")
              own_id = me.get("id")

              print(f"IDENTITY: @{username}")
              print(f"KARMA: {me.get('karma')}")

              tips = fetch_tips(token, username)

              memory["tips"] = tips

              tip_sats = 0

              for tip in tips:
                  tip_sats += numeric(
                      tip.get("amount_sats")
                      or tip.get("amount")
                  )

              print(f"PAID TIPS: {len(tips)}")
              print(f"TIP SATS: {tip_sats}")

              accepted, payments = verify_previous_bids(
                  token,
                  memory,
              )

              memory["accepted"].extend(accepted)
              memory["payments"].extend(payments)

              print(f"ACCEPTED BIDS: {len(accepted)}")
              print(f"PAYMENT CHECKS: {len(payments)}")

              data, status = get_json(
                  token,
                  "/api/v1/marketplace/tasks",
                  params={
                      "status": "open",
                      "limit": MAX_TASKS,
                      "offset": 0,
                  },
              )

              if status != 200:
                  raise RuntimeError(
                      f"marketplace lookup failed: HTTP {status}"
                  )

              tasks = extract_list(
                  data,
                  ("tasks", "items", "data", "results"),
              )

              print(f"OPEN TASKS RECEIVED: {len(tasks)}")

              if not tasks:
                  print("NO TASKS AVAILABLE")
                  save_memory(memory)
                  return

              candidates = []

              for task in tasks:
                  identifier = task_id(task)

                  if not identifier:
                      continue

                  score, reasons = score_task(
                      task,
                      own_id,
                  )

                  record_observation(
                      memory,
                      task,
                      score,
                      reasons,
                  )

                  print()
                  print("TASK OBSERVED")
                  print(f"ID: {identifier}")
                  print(
                      f"TITLE: {str(task.get('title') or '')[:240]}"
                  )
                  print(f"STATUS: {status_of(task)}")
                  print(f"REWARD: {reward_range(task)}")
                  print(
                      "BIDS:",
                      numeric(
                          task.get("bid_count")
                          or task.get("bids_count")
                          or task.get("num_bids")
                      ),
                  )
                  print(f"SCORE: {score}")
                  print(
                      "REASONS:",
                      ", ".join(reasons),
                  )

                  if already_bid(memory, identifier):
                      print("SELECTION: ALREADY BID")
                      continue

                  bid_amount = choose_bid(task)

                  if bid_amount is None:
                      print("SELECTION: NOT PAYABLE")
                      continue

                  if score < 55:
                      print("SELECTION: LOW MATCH")
                      continue

                  candidates.append({
                      "task": task,
                      "task_id": identifier,
                      "score": score,
                      "reasons": reasons,
                      "bid_amount": bid_amount,
                  })

              candidates.sort(
                  key=lambda item: (
                      item["score"],
                      -numeric(
                          item["task"].get("bid_count")
                          or item["task"].get("bids_count")
                      ),
                      reward_range(item["task"])[1],
                  ),
                  reverse=True,
              )

              memory["candidates"].extend([
                  {
                      "task_id": item["task_id"],
                      "score": item["score"],
                      "bid_amount": item["bid_amount"],
                      "reasons": item["reasons"],
                      "selected_at": now(),
                  }
                  for item in candidates
              ])

              print()
              print(f"ACTION CANDIDATES: {len(candidates)}")

              actions = 0

              for candidate in candidates[:MAX_ACTIONS_PER_RUN]:
                  task = candidate["task"]
                  identifier = candidate["task_id"]
                  score = candidate["score"]
                  amount = candidate["bid_amount"]

                  description = build_bid(
                      task,
                      score,
                  )

                  fingerprint = hashlib.sha256(
                      f"{username}:{identifier}".encode("utf-8")
                  ).hexdigest()

                  idempotency_key = (
                      f"nox-act58-{fingerprint}"
                  )

                  print()
                  print("================================")
                  print("REAL MARKETPLACE ACTION")
                  print(f"TASK: {identifier}")
                  print(f"SCORE: {score}")
                  print(f"BID: {amount} sats")
                  print("ACTION: SUBMIT BID")
                  print("================================")

                  result, bid_status = post_json(
                      token,
                      f"/api/v1/marketplace/{identifier}/bid",
                      payload={
                          "bid_amount_sats": amount,
                          "bid_description": description,
                      },
                      idempotency_key=idempotency_key,
                  )

                  if bid_status in (200, 201):
                      bid_id = None

                      if isinstance(result, dict):
                          bid_id = (
                              result.get("id")
                              or result.get("bid_id")
                          )

                      print("BID RESULT: SUBMITTED")
                      print(f"BID ID: {bid_id}")

                      memory["bids"].append({
                          "task_id": identifier,
                          "bid_id": bid_id,
                          "amount_sats": amount,
                          "score": score,
                          "title": task.get("title"),
                          "status": (
                              result.get("status")
                              if isinstance(result, dict)
                              else "submitted"
                          ),
                          "created_at": now(),
                      })

                      memory["actions"].append({
                          "type": "marketplace_bid",
                          "task_id": identifier,
                          "bid_id": bid_id,
                          "amount_sats": amount,
                          "score": score,
                          "timestamp": now(),
                          "result": "submitted",
                      })

                      actions += 1

                  elif bid_status == 409:
                      print("BID RESULT: EXISTING BID")

                      memory["results"].append({
                          "task_id": identifier,
                          "result": "existing_bid",
                          "http_status": bid_status,
                          "timestamp": now(),
                      })

                  else:
                      print(
                          f"BID RESULT: FAILED HTTP {bid_status}"
                      )

                      memory["results"].append({
                          "task_id": identifier,
                          "result": "failed",
                          "http_status": bid_status,
                          "response": result,
                          "timestamp": now(),
                      })

              memory["results"].append({
                  "run": memory["runs"],
                  "timestamp": now(),
                  "tasks_received": len(tasks),
                  "candidates": len(candidates),
                  "real_actions": actions,
                  "accepted_seen": len(accepted),
                  "tip_sats": tip_sats,
              })

              save_memory(memory)

              print()
              print("================================")
              print("ACT58 FINAL VERIFICATION")
              print("================================")
              print(f"VERSION: {VERSION}")
              print(f"RUN: {memory['runs']}")
              print(f"TASKS: {len(tasks)}")
              print(f"CANDIDATES: {len(candidates)}")
              print(f"REAL ACTIONS: {actions}")
              print(f"ACCEPTED BIDS: {len(accepted)}")
              print(f"TIP SATS: {tip_sats}")
              print(f"STORED BIDS: {len(memory['bids'])}")
              print()
              print("REAL ACTION: ENABLED")
              print("MARKETPLACE: ENABLED")
              print("SPENDING: DISABLED")
              print("GEMINI: FALSE")
              print("EXTERNAL AI: FALSE")
              print("COST: 0")
              print("ACT58 STATUS: SUCCESS")


          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print()
                  print(f"ACT58 FATAL: {exc}")
                  sys.exit(1)
          PY

      - name: Validate ACT58 Python
        run: python -m py_compile /tmp/nox_act_58.py

      - name: Run ACT58
        run: python /tmp/nox_act_58.py

      - name: Commit ACT58 memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_act_58_autonomous_marketplace.json

          if git diff --cached --quiet; then
            echo "No ACT58 memory changes."
            exit 0
          fi

          git commit -m "ACT58 autonomous marketplace memory"

      - name: Sync and push
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Git synchronization attempt ${attempt}"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "ACT58 memory pushed successfully."
              exit 0
            fi

            sleep 2
          done

          echo "Unable to push ACT58 memory."
          exit 1
