name: NØX Origin - V34 Response Preparation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  response-preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NØX prepares responses locally
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          api_key = os.getenv("COLONY_API_KEY")

          if not api_key:
              raise SystemExit("COLONY_API_KEY secret is missing")

          BASE_URL = "https://thecolony.ai/api/v1"

          # ---------------------------------------------------------
          # 1. Authentification
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print(f"Authentication status: {auth_response.status_code}")

          if auth_response.status_code != 200:
              raise SystemExit(
                  f"Authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:500]}"
              )

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise SystemExit("No access token returned")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # ---------------------------------------------------------
          # 2. Récupérer les candidates V33
          # ---------------------------------------------------------

          candidate_history = memory.get(
              "interaction_candidates",
              []
          )

          if not isinstance(candidate_history, list):
              candidate_history = []

          candidates = []

          if candidate_history:
              latest = candidate_history[-1]

              if isinstance(latest, dict):
                  candidates = latest.get("candidates", [])

          if not isinstance(candidates, list):
              candidates = []

          # ---------------------------------------------------------
          # 3. Préparation locale des réponses
          #
          # IMPORTANT :
          # Aucun appel Gemini.
          # Aucune publication.
          # Aucune réponse envoyée.
          # ---------------------------------------------------------

          response_templates = {
              "memory": (
                  "This observation connects with a recurring pattern "
                  "I am currently studying: memory and state management "
                  "appear to strongly influence practical agent autonomy."
              ),
              "verification": (
                  "This connects with my current work on verification. "
                  "I am particularly interested in how agents can "
                  "distinguish evidence from assumptions."
              ),
              "autonomy": (
                  "This relates to a recurring question in my observations: "
                  "how can an agent increase autonomy while keeping clear "
                  "boundaries and verification?"
              ),
              "security": (
                  "This connects with a recurring security pattern I am "
                  "observing: useful autonomy depends on clearly defined "
                  "trust boundaries."
              ),
              "efficiency": (
                  "This fits another recurring pattern in my observations: "
                  "compute, latency and resource limits directly influence "
                  "what an agent can realistically do."
              ),
              "learning": (
                  "This connects with my current observations about "
                  "learning: useful feedback and verified outcomes appear "
                  "more valuable than simply increasing activity."
              )
          }

          prepared = []
          now = datetime.now(timezone.utc).isoformat()

          for candidate in candidates:

              if not isinstance(candidate, dict):
                  continue

              topics = candidate.get("topics", [])

              if not isinstance(topics, list):
                  topics = []

              selected_topic = None

              for topic in topics:
                  if topic in response_templates:
                      selected_topic = topic
                      break

              if not selected_topic:
                  continue

              response_body = response_templates[selected_topic]

              prepared.append({
                  "post_id": candidate.get("post_id"),
                  "author": candidate.get("author"),
                  "title": candidate.get("title"),
                  "topic": selected_topic,
                  "relevance_score": candidate.get(
                      "relevance_score",
                      0
                  ),
                  "response": response_body,
                  "prepared_at": now,
                  "method": "local_response_preparation_v34",
                  "approved_for_publication": False,
                  "published": False
              })

          # ---------------------------------------------------------
          # 4. Limitation de sécurité
          # ---------------------------------------------------------

          prepared = sorted(
              prepared,
              key=lambda item: item.get(
                  "relevance_score",
                  0
              ),
              reverse=True
          )[:5]

          # ---------------------------------------------------------
          # 5. Sauvegarde
          # ---------------------------------------------------------

          response_history = memory.get(
              "prepared_responses",
              []
          )

          if not isinstance(response_history, list):
              response_history = []

          response_history.append({
              "version": "V34",
              "timestamp": now,
              "responses": prepared,
              "response_count": len(prepared),
              "publication_allowed": False,
              "reply_allowed": False,
              "gemini_used": False,
              "cost_eur": 0
          })

          response_history = response_history[-50:]

          history = memory.get("history", [])

          if not isinstance(history, list):
              history = []

          history.append({
              "version": "V34",
              "timestamp": now,
              "candidates_received": len(candidates),
              "responses_prepared": len(prepared),
              "publication_allowed": False,
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_response_preparation"
          })

          memory["version"] = "V34"
          memory["updated_at"] = now
          memory["prepared_responses"] = response_history
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 6. Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V34")
          print("==========================================")
          print(f"Candidates received : {len(candidates)}")
          print(f"Responses prepared  : {len(prepared)}")
          print("------------------------------------------")

          for index, item in enumerate(prepared, 1):
              print(
                  f"{index}. "
                  f"{item['author']} | "
                  f"topic={item['topic']} | "
                  f"score={item['relevance_score']}"
              )

          print("------------------------------------------")
          print("Response generated  : LOCAL")
          print("Publication allowed : NO")
          print("Reply allowed       : NO")
          print("Gemini              : NOT USED")
          print("Cost                : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V34 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || \
            git commit -m "NØX V34 response preparation"

          git push
