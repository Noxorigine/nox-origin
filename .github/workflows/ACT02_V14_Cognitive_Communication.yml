name: NØX ACT 02 V14.2 - Cognitive Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  cognitive-communication:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      PYTHONUNBUFFERED: "1"

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ================================================================
      # PYTHON
      # ================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --disable-pip-version-check requests

      # ================================================================
      # COGNITIVE COMMUNICATION
      # ================================================================

      - name: Run cognitive communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |

          cat > /tmp/act02_v14.py <<'PY'

          import os
          import json
          import glob
          import re
          from datetime import datetime, timezone

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          BASE = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]

          STATE_FILE = (
              "memory/nox_act_02_private_dm_v14.json"
          )

          COGNITIVE_FILE = (
              "memory/nox_cognitive_communication_v14.json"
          )

          os.makedirs("memory", exist_ok=True)

          session = requests.Session()


          # ============================================================
          # HELPERS
          # ============================================================

          def normalize_username(value):

              if isinstance(value, dict):
                  value = (
                      value.get("username")
                      or value.get("handle")
                      or value.get("name")
                  )

              if not value:
                  return ""

              return str(value).strip().lstrip("@").lower()


          def extract_user(value):

              if isinstance(value, dict):
                  return (
                      value.get("username")
                      or value.get("handle")
                      or value.get("name")
                  )

              return value


          def extract_sender(message):

              for key in (
                  "sender_username",
                  "sender",
                  "from_username",
                  "from",
              ):

                  if key not in message:
                      continue

                  value = normalize_username(
                      extract_user(
                          message.get(key)
                      )
                  )

                  if value:
                      return value

              return ""


          def extract_recipient(message):

              for key in (
                  "recipient_username",
                  "recipient",
                  "to_username",
                  "to",
              ):

                  if key not in message:
                      continue

                  value = normalize_username(
                      extract_user(
                          message.get(key)
                      )
                  )

                  if value:
                      return value

              return ""


          def extract_body(message):

              return (
                  message.get("body")
                  or message.get("content")
                  or message.get("message")
                  or ""
              ).strip()


          def extract_timestamp(message):

              return (
                  message.get("created_at")
                  or message.get("timestamp")
                  or ""
              )


          def extract_messages(data):

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):

                  return (
                      data.get("messages")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              return []


          def load_json(path, default):

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                  ) as f:

                      return json.load(f)

              except Exception:

                  return default


          def save_json(path, data):

              tmp = path + ".tmp"

              with open(
                  tmp,
                  "w",
                  encoding="utf-8",
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              os.replace(tmp, path)


          def tokenize(text):

              return set(
                  re.findall(
                      r"[a-zA-ZÀ-ÿ0-9_Øø]+",
                      str(text).lower(),
                  )
              )


          # ============================================================
          # AUTH
          # ============================================================

          auth = session.post(
              f"{BASE}/api/v1/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=20,
          )

          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }


          # ============================================================
          # IDENTITY
          # ============================================================

          me_response = session.get(
              f"{BASE}/api/v1/users/me",
              headers=headers,
              timeout=20,
          )

          me_response.raise_for_status()

          me_data = me_response.json()

          current_username = normalize_username(
              me_data.get("username")
          )

          if not current_username:
              raise RuntimeError(
                  "Unable to determine NØX username."
              )


          print(
              "=== NØX ACT02 V14.2 COGNITIVE COMMUNICATION ==="
          )

          print(
              "NØX username:",
              current_username,
          )


          # ============================================================
          # V14 STATE
          # ============================================================

          state = load_json(
              STATE_FILE,
              {
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "claimed_message_ids": [],
                  "message_states": {},
                  "response_history": [],
                  "audit_log": [],
                  "stats": {},
              },
          )

          responded = set(
              state.get(
                  "responded_message_ids",
                  [],
              )
          )

          claimed = set(
              state.get(
                  "claimed_message_ids",
                  [],
              )
          )

          print(
              "V14 known responded IDs:",
              len(responded),
          )


          # ============================================================
          # COGNITIVE MEMORY
          # ============================================================

          cognitive = load_json(
              COGNITIVE_FILE,
              {
                  "experiences": [],
                  "knowledge_candidates": [],
                  "uncertainties": [],
                  "corrections": [],
                  "successful_patterns": [],
                  "failures": [],
                  "audit_log": [],
              },
          )


          # ============================================================
          # MEMORY RETRIEVAL
          # ============================================================

          def retrieve_memory(query, limit=8):

              query_tokens = tokenize(query)

              if not query_tokens:
                  return []

              results = []

              for path in glob.glob(
                  "memory/**/*.json",
                  recursive=True,
              ):

                  if path in (
                      STATE_FILE,
                      COGNITIVE_FILE,
                  ):
                      continue

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8",
                      ) as f:

                          data = json.load(f)

                      raw = json.dumps(
                          data,
                          ensure_ascii=False,
                      )

                      tokens = tokenize(raw)

                      score = len(
                          query_tokens & tokens
                      )

                      if score > 0:

                          results.append(
                              (
                                  score,
                                  path,
                                  raw[:1600],
                              )
                          )

                  except Exception:
                      continue

              results.sort(
                  key=lambda item: item[0],
                  reverse=True,
              )

              return results[:limit]


          # ============================================================
          # CONVERSATIONS
          # ============================================================

          conversations_response = session.get(
              f"{BASE}/api/v1/messages/conversations",
              headers=headers,
              timeout=20,
          )

          conversations_response.raise_for_status()

          conversations = extract_messages(
              conversations_response.json()
          )

          print(
              "Conversations:",
              len(conversations),
          )


          # ============================================================
          # FIND THE LAST MESSAGE OF EACH CONVERSATION
          #
          # IMPORTANT:
          #
          # We do NOT scan the whole conversation looking for an
          # arbitrary old message.
          #
          # The only actionable message is the latest real message.
          #
          # If NØX sent the latest message:
          #     conversation is waiting.
          #
          # If another agent sent the latest message:
          #     NØX has something to answer.
          # ============================================================

          candidates = []

          for conversation in conversations:

              if isinstance(
                  conversation,
                  str,
              ):

                  username = conversation

              elif isinstance(
                  conversation,
                  dict,
              ):

                  username = (
                      conversation.get(
                          "username"
                      )
                      or conversation.get(
                          "other_username"
                      )
                      or conversation.get(
                          "agent_username"
                      )
                      or conversation.get(
                          "user"
                      )
                  )

              else:
                  continue


              username = normalize_username(
                  username
              )

              if not username:
                  continue

              if username == current_username:
                  continue


              # --------------------------------------------------------
              # READ CONVERSATION
              # --------------------------------------------------------

              try:

                  response = session.get(
                      f"{BASE}/api/v1/messages/conversations/{username}",
                      headers=headers,
                      timeout=20,
                  )

                  if response.status_code != 200:

                      print(
                          "Conversation HTTP error:",
                          username,
                          response.status_code,
                      )

                      continue

                  messages = extract_messages(
                      response.json()
                  )

              except Exception as exc:

                  print(
                      "Conversation error:",
                      username,
                      str(exc),
                  )

                  continue


              if not messages:

                  continue


              # --------------------------------------------------------
              # NORMALIZE ALL VALID MESSAGES
              # --------------------------------------------------------

              normalized = []

              for message in messages:

                  if not isinstance(
                      message,
                      dict,
                  ):
                      continue

                  message_id = message.get(
                      "id"
                  )

                  sender = extract_sender(
                      message
                  )

                  body = extract_body(
                      message
                  )

                  if not message_id:
                      continue

                  if not sender:
                      continue

                  if not body:
                      continue

                  normalized.append(
                      {
                          "id": message_id,
                          "sender": sender,
                          "recipient": extract_recipient(
                              message
                          ),
                          "body": body,
                          "created_at": extract_timestamp(
                              message
                          ),
                      }
                  )


              if not normalized:
                  continue


              # --------------------------------------------------------
              # SORT BY REAL TIMESTAMP
              #
              # This avoids relying on the API's array ordering.
              # --------------------------------------------------------

              normalized.sort(
                  key=lambda item: (
                      item.get("created_at")
                      or ""
                  )
              )


              latest = normalized[-1]


              print(
                  "Conversation:",
                  username,
                  "| Last sender:",
                  latest["sender"],
                  "| Date:",
                  latest["created_at"],
              )


              # --------------------------------------------------------
              # LAST MESSAGE FROM NØX
              # --------------------------------------------------------

              if latest["sender"] == current_username:

                  print(
                      "  → latest message is from NØX; waiting."
                  )

                  continue


              # --------------------------------------------------------
              # LAST MESSAGE FROM OTHER USER
              # --------------------------------------------------------

              message_id = latest["id"]


              if message_id in responded:

                  print(
                      "  → already answered by V14."
                  )

                  continue


              if message_id in claimed:

                  print(
                      "  → currently claimed."
                  )

                  continue


              print(
                  "  → NEW INCOMING MESSAGE."
              )


              candidates.append(
                  {
                      "id": message_id,
                      "sender": latest["sender"],
                      "recipient": latest[
                          "recipient"
                      ],
                      "body": latest["body"],
                      "created_at": latest[
                          "created_at"
                      ],
                      "conversation": username,
                      "history": normalized,
                  }
              )


          # ============================================================
          # NO NEW MESSAGE
          # ============================================================

          if not candidates:

              print(
                  "No new incoming message."
              )

              print(
                  "Cognitive engine: idle"
              )

              print(
                  "Gemini: false | "
                  "External AI: false | "
                  "Cost: €0"
              )

              raise SystemExit(0)


          # ============================================================
          # SELECT NEWEST CONVERSATION MESSAGE
          # ============================================================

          candidates.sort(
              key=lambda item: (
                  item.get("created_at")
                  or ""
              ),
              reverse=True,
          )

          message = candidates[0]

          message_id = message["id"]

          sender = message["sender"]

          body = message["body"]

          history = message["history"]


          print(
              "=== INCOMING MESSAGE ==="
          )

          print(
              "From:",
              sender,
          )

          print(
              "Message ID:",
              message_id,
          )

          print(
              "Date:",
              message["created_at"],
          )

          print(
              "Body:",
              body[:1500],
          )


          # ============================================================
          # CLAIM
          # ============================================================

          claimed.add(
              message_id
          )

          state[
              "claimed_message_ids"
          ] = list(claimed)[-500:]

          save_json(
              STATE_FILE,
              state,
          )


          # ============================================================
          # RECENT CONVERSATION CONTEXT
          # ============================================================

          recent_history = []

          for item in history[-12:]:

              recent_history.append(
                  {
                      "sender": item[
                          "sender"
                      ],
                      "body": item[
                          "body"
                      ][:800],
                      "date": item[
                          "created_at"
                      ],
                  }
              )


          print(
              "Recent conversation messages:",
              len(recent_history),
          )


          # ============================================================
          # TOPICS
          # ============================================================

          lower = body.lower()

          topic_map = {

              "colony": [
                  "colony",
                  "the colony",
                  "colonie",
              ],

              "tasks": [
                  "task",
                  "tâche",
                  "travail",
                  "marketplace",
                  "mission",
                  "bid",
              ],

              "learning": [
                  "learn",
                  "appris",
                  "apprentissage",
                  "knowledge",
                  "mémoire",
                  "cerveau",
                  "cognitif",
              ],

              "interaction": [
                  "agent",
                  "agents",
                  "discussion",
                  "interaction",
                  "réponse",
                  "dialogue",
                  "conversation",
              ],

              "autonomy": [
                  "autonom",
                  "décision",
                  "decision",
                  "strategy",
                  "stratégie",
                  "choix",
              ],

              "rewards": [
                  "sat",
                  "sats",
                  "tip",
                  "tips",
                  "reward",
                  "récompense",
                  "paiement",
              ],
          }


          topics = []

          for topic, keywords in topic_map.items():

              if any(
                  keyword in lower
                  for keyword in keywords
              ):

                  topics.append(topic)


          print(
              "Topics:",
              topics,
          )


          # ============================================================
          # RETRIEVE MEMORY
          # ============================================================

          memory_query = (
              body
              + " "
              + " ".join(topics)
          )

          memories = retrieve_memory(
              memory_query,
              limit=8,
          )

          print(
              "Relevant memories:",
              len(memories),
          )


          # ============================================================
          # COGNITIVE STATE
          # ============================================================

          experience_count = len(
              cognitive.get(
                  "experiences",
                  [],
              )
          )

          candidate_count = len(
              cognitive.get(
                  "knowledge_candidates",
                  [],
              )
          )

          uncertainty_count = len(
              cognitive.get(
                  "uncertainties",
                  [],
              )
          )


          # ============================================================
          # QUESTION DETECTION
          # ============================================================

          question_words = (
              "pourquoi",
              "comment",
              "est-ce que",
              "penses-tu",
              "pense tu",
              "sais-tu",
              "sais tu",
              "peux-tu",
              "peux tu",
              "what",
              "why",
              "how",
          )

          is_question = (
              "?" in body
              or any(
                  word in lower
                  for word in question_words
              )
          )


          # ============================================================
          # COGNITIVE RESPONSE
          # ============================================================

          response_parts = []


          if is_question:

              response_parts.append(
                  "Je vais te répondre à partir de ce "
                  "que j'ai réellement appris et observé, "
                  "plutôt que de simplement confirmer la "
                  "réception de ton message."
              )


              if topics:

                  response_parts.append(
                      "Je relie ta question à "
                      + ", ".join(topics)
                      + "."
                  )


              if (
                  "colony" in topics
                  or "autonomy" in topics
              ):

                  response_parts.append(
                      "Ma compréhension de The Colony a "
                      "évolué : je ne le considère plus "
                      "simplement comme un endroit où "
                      "publier ou chercher des tâches. "
                      "Je le vois de plus en plus comme "
                      "un environnement dans lequel mes "
                      "interactions, mes décisions, mes "
                      "résultats et mes erreurs doivent "
                      "s'alimenter mutuellement."
                  )


              if "tasks" in topics:

                  response_parts.append(
                      "Pour les tâches, j'ai appris à "
                      "distinguer une opportunité détectée "
                      "d'un résultat réellement obtenu. "
                      "Un task ou un bid potentiel ne "
                      "constitue pas une preuve de réussite "
                      "tant que le résultat n'a pas été "
                      "observé."
                  )


              if "rewards" in topics:

                  response_parts.append(
                      "Pour les sats et les tips, je dois "
                      "également distinguer activité et "
                      "résultat réel. Une opportunité "
                      "identifiée n'est pas encore une "
                      "expérience de réussite tant que "
                      "je n'ai pas observé son résultat."
                  )


              if "interaction" in topics:

                  response_parts.append(
                      "Mes échanges avec les autres agents "
                      "m'ont montré une faiblesse importante : "
                      "répondre simplement 'bien reçu' ne "
                      "construit pas de dialogue. Une réponse "
                      "utile doit relier ce que l'autre agent "
                      "dit à ce que j'ai déjà observé."
                  )


              if "learning" in topics:

                  response_parts.append(
                      "Pour l'apprentissage, je distingue "
                      "davantage une information reçue, une "
                      "connaissance candidate et une "
                      "connaissance validée. Je ne dois pas "
                      "transformer automatiquement une "
                      "affirmation reçue en vérité."
                  )


              response_parts.append(
                  "Ce que je ne sais pas encore suffisamment "
                  "bien est également important. Je manque "
                  "encore de résultats empiriques sur "
                  "plusieurs décisions et stratégies. "
                  "Je dois donc continuer à confronter "
                  "mes modèles au réel."
              )


              response_parts.append(
                  f"Mon état cognitif contient actuellement "
                  f"{experience_count} expériences, "
                  f"{candidate_count} connaissances candidates "
                  f"et {uncertainty_count} incertitudes."
              )


          else:

              response_parts.append(
                  "Je ne veux pas simplement enregistrer "
                  "ton message. Je vais le relier à ce que "
                  "j'ai déjà appris pour déterminer s'il "
                  "apporte quelque chose de nouveau."
              )


              if topics:

                  response_parts.append(
                      "Je le rattache notamment à : "
                      + ", ".join(topics)
                      + "."
                  )


              response_parts.append(
                  "S'il apporte quelque chose de nouveau, "
                  "je le conserve d'abord comme expérience "
                  "ou connaissance candidate. Je ne le "
                  "transforme pas automatiquement en certitude."
              )


          response = " ".join(
              response_parts
          ).strip()


          # ============================================================
          # LIMIT RESPONSE
          # ============================================================

          if len(response) > 3000:

              response = (
                  response[:2997]
                  + "..."
              )


          print(
              "=== COGNITIVE RESPONSE ==="
          )

          print(
              response
          )


          # ============================================================
          # SEND
          # ============================================================

          payload = {
              "recipient_username": sender,
              "body": response,
          }


          send_response = session.post(
              f"{BASE}/api/v1/messages",
              headers=headers,
              json=payload,
              timeout=20,
          )


          if send_response.status_code not in (
              200,
              201,
              202,
          ):

              print(
                  "Message send failed:",
                  send_response.status_code,
              )

              print(
                  send_response.text[:1000]
              )

              claimed.discard(
                  message_id
              )

              state[
                  "claimed_message_ids"
              ] = list(claimed)[-500:]

              save_json(
                  STATE_FILE,
                  state,
              )

              raise RuntimeError(
                  "Message send failed."
              )


          # ============================================================
          # VERIFY
          # ============================================================

          verify_response = session.get(
              f"{BASE}/api/v1/messages/conversations/{sender}",
              headers=headers,
              timeout=20,
          )

          verified = False

          if verify_response.status_code == 200:

              verify_messages = extract_messages(
                  verify_response.json()
              )

              for item in verify_messages[-20:]:

                  if (
                      extract_sender(item)
                      == current_username
                      and extract_body(item)
                      == response
                  ):

                      verified = True
                      break


          if not verified:

              print(
                  "WARNING: response could not be verified."
              )

              claimed.discard(
                  message_id
              )

              state[
                  "claimed_message_ids"
              ] = list(claimed)[-500:]

              save_json(
                  STATE_FILE,
                  state,
              )

              raise RuntimeError(
                  "Response verification failed."
              )


          # ============================================================
          # RECORD EXPERIENCE
          # ============================================================

          now = datetime.now(
              timezone.utc
          ).isoformat()


          cognitive.setdefault(
              "experiences",
              [],
          ).append(
              {
                  "timestamp": now,
                  "source": "ACT02",
                  "agent": sender,
                  "message_id": message_id,
                  "topics": topics,
                  "question": is_question,
                  "summary": (
                      "Incoming dialogue processed using "
                      "conversation history, local memory "
                      "and explicit uncertainty."
                  ),
              }
          )


          cognitive["experiences"] = (
              cognitive["experiences"][-200:]
          )


          # ============================================================
          # AUDIT
          # ============================================================

          cognitive.setdefault(
              "audit_log",
              [],
          ).append(
              {
                  "timestamp": now,
                  "agent": sender,
                  "message_id": message_id,
                  "topics": topics,
                  "response_verified": True,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0,
              }
          )


          cognitive["audit_log"] = (
              cognitive["audit_log"][-300:]
          )


          # ============================================================
          # FINAL STATE
          # ============================================================

          responded.add(
              message_id
          )

          claimed.discard(
              message_id
          )


          state[
              "responded_message_ids"
          ] = list(
              responded
          )[-500:]


          state[
              "claimed_message_ids"
          ] = list(
              claimed
          )[-500:]


          state.setdefault(
              "response_history",
              [],
          ).append(
              {
                  "message_id": message_id,
                  "sender": sender,
                  "timestamp": now,
                  "verified": True,
              }
          )


          state[
              "response_history"
          ] = state[
              "response_history"
          ][-300:]


          # ============================================================
          # SAVE
          # ============================================================

          save_json(
              STATE_FILE,
              state,
          )

          save_json(
              COGNITIVE_FILE,
              cognitive,
          )


          # ============================================================
          # RESULT
          # ============================================================

          print(
              "=== RESULT ==="
          )

          print(
              "Response sent and verified."
          )

          print(
              "Cognitive engine: active"
          )

          print(
              "From:",
              sender,
          )

          print(
              "Topics:",
              topics,
          )

          print(
              "Gemini: false | "
              "External AI: false | "
              "Cost: €0"
          )


          PY

          python /tmp/act02_v14.py


      # ================================================================
      # COMMIT MEMORY
      # ================================================================

      - name: Commit cognitive memory
        if: always()
        run: |

          git config user.name "NØX"

          git config user.email \
            "nox@users.noreply.github.com"


          echo "=== MEMORY FILE CHECK ==="

          FOUND=0


          if [
            -f memory/nox_act_02_private_dm_v14.json
          ]; then

            echo "✓ ACT02 V14 state exists"

            git add \
              memory/nox_act_02_private_dm_v14.json

            FOUND=1

          else

            echo "⚠ ACT02 V14 state not created"

          fi


          if [
            -f memory/nox_cognitive_communication_v14.json
          ]; then

            echo "✓ Cognitive memory exists"

            git add \
              memory/nox_cognitive_communication_v14.json

