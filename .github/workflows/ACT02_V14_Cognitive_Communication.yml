name: NØX ACT 02 V14.3 - Cognitive Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  cognitive-communication:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      PYTHON_VERSION: "3.11"
      STATE_FILE: memory/nox_act_02_private_dm_v14.json
      COGNITIVE_FILE: memory/nox_cognitive_communication_v14.json

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 3. MAIN COGNITIVE COMMUNICATION ENGINE
      # ============================================================
      - name: Run ACT02 V14.3
        env:
          API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/act02_v14_3.py <<'PY'
          import os
          import json
          import re
          import glob
          import hashlib
          import requests
          from datetime import datetime, timezone

          BASE_URL = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ.get("API_KEY", "")
          STATE_FILE = os.environ["STATE_FILE"]
          COGNITIVE_FILE = os.environ["COGNITIVE_FILE"]

          print("=== NØX ACT02 V14.3 COGNITIVE COMMUNICATION ===")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY missing")
              raise SystemExit(1)

          session = requests.Session()
          session.headers.update({
              "Content-Type": "application/json",
              "Accept": "application/json",
          })

          # ========================================================
          # HELPERS
          # ========================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def safe_json(path, default):
              try:
                  if os.path.exists(path):
                      with open(path, "r", encoding="utf-8") as f:
                          data = json.load(f)
                          return data
              except Exception as e:
                  print(f"Memory read warning {path}: {e}")
              return default

          def save_json(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              tmp = path + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              os.replace(tmp, path)

          def get_nested_username(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "username",
                      "user_name",
                      "handle",
                      "name",
                  ):
                      val = value.get(key)
                      if isinstance(val, str) and val.strip():
                          return val.strip()

              return ""

          def message_sender(msg):
              if not isinstance(msg, dict):
                  return ""

              for key in (
                  "sender",
                  "sender_user",
                  "author",
                  "user",
              ):
                  username = get_nested_username(msg.get(key))
                  if username:
                      return username

              for key in (
                  "sender_username",
                  "author_username",
                  "username",
              ):
                  value = msg.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""

          def message_recipient(msg):
              if not isinstance(msg, dict):
                  return ""

              for key in (
                  "recipient",
                  "recipient_user",
                  "receiver",
              ):
                  username = get_nested_username(msg.get(key))
                  if username:
                      return username

              for key in (
                  "recipient_username",
                  "receiver_username",
              ):
                  value = msg.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""

          def message_body(msg):
              if not isinstance(msg, dict):
                  return ""

              for key in (
                  "body",
                  "content",
                  "message",
                  "text",
              ):
                  value = msg.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""

          def message_id(msg):
              if not isinstance(msg, dict):
                  return ""

              for key in ("id", "message_id", "uuid"):
                  value = msg.get(key)
                  if value is not None:
                      return str(value)

              body = message_body(msg)
              sender = message_sender(msg)
              created = message_created(msg)

              if body:
                  raw = f"{sender}|{created}|{body}"
                  return hashlib.sha256(raw.encode()).hexdigest()

              return ""

          def message_created(msg):
              if not isinstance(msg, dict):
                  return ""

              for key in (
                  "created_at",
                  "timestamp",
                  "sent_at",
                  "updated_at",
              ):
                  value = msg.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""

          def parse_time(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)

              try:
                  text = value.replace("Z", "+00:00")
                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt
              except Exception:
                  return datetime.min.replace(tzinfo=timezone.utc)

          def extract_messages(payload):
              """
              Accept the known Colony message structures without assuming
              one exact API serialization.
              """

              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "messages",
                  "data",
                  "items",
                  "results",
                  "conversation",
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = extract_messages(value)
                      if nested:
                          return nested

              return []

          def extract_conversation_usernames(payload, own_username):
              found = []

              def add(value):
                  username = get_nested_username(value)

                  if (
                      username
                      and username.lower() != own_username.lower()
                      and username not in found
                  ):
                      found.append(username)

              def inspect(item):
                  if isinstance(item, str):
                      add(item)
                      return

                  if not isinstance(item, dict):
                      return

                  # Direct conversation username fields.
                  for key in (
                      "username",
                      "user",
                      "other_user",
                      "participant",
                      "recipient",
                      "sender",
                  ):
                      value = item.get(key)

                      if isinstance(value, str):
                          add(value)

                      elif isinstance(value, dict):
                          add(value)

                  # Common participant arrays.
                  for key in (
                      "participants",
                      "users",
                      "members",
                  ):
                      value = item.get(key)

                      if isinstance(value, list):
                          for participant in value:
                              add(participant)

              if isinstance(payload, list):
                  for item in payload:
                      inspect(item)

              elif isinstance(payload, dict):
                  for key in (
                      "conversations",
                      "data",
                      "items",
                      "results",
                  ):
                      value = payload.get(key)

                      if isinstance(value, list):
                          for item in value:
                              inspect(item)

                      elif isinstance(value, dict):
                          for nested in value.values():
                              inspect(nested)

              return found

          # ========================================================
          # AUTHENTICATION
          # ========================================================

          auth = session.post(
              f"{BASE_URL}/api/v1/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          if auth.status_code >= 300:
              print("Authentication failed:", auth.status_code)
              print(auth.text[:500])
              raise SystemExit(1)

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("accessToken")
          )

          if not token:
              print("Authentication succeeded but no access token found")
              raise SystemExit(1)

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ========================================================
          # IDENTITY
          # ========================================================

          me = session.get(
              f"{BASE_URL}/api/v1/users/me",
              timeout=30,
          )

          if me.status_code >= 300:
              print("Identity request failed:", me.status_code)
              print(me.text[:500])
              raise SystemExit(1)

          me_data = me.json()

          username = (
              get_nested_username(me_data)
              or me_data.get("username")
              or ""
          )

          if not username:
              print("Could not determine NØX username")
              raise SystemExit(1)

          print("NØX username:", username)

          # ========================================================
          # STATE
          # ========================================================

          state = safe_json(
              STATE_FILE,
              {
                  "version": "V14.3",
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "claimed_message_ids": [],
                  "response_history": [],
                  "message_states": {},
                  "audit_log": [],
                  "stats": {
                      "received": 0,
                      "responded": 0,
                      "skipped": 0,
                      "errors": 0,
                  },
              },
          )

          responded_ids = set(
              str(x) for x in state.get("responded_message_ids", [])
          )

          processed_ids = set(
              str(x) for x in state.get("processed_message_ids", [])
          )

          # ========================================================
          # COGNITIVE MEMORY
          # ========================================================

          cognitive = safe_json(
              COGNITIVE_FILE,
              {
                  "version": "V14.3",
                  "experiences": [],
                  "knowledge_candidates": [],
                  "uncertainties": [],
                  "corrections": [],
                  "successful_patterns": [],
                  "failures": [],
                  "communication_learning": [],
                  "updated_at": now_iso(),
              },
          )

          # ========================================================
          # DISCOVER CONVERSATIONS
          # ========================================================

          conversations_response = session.get(
              f"{BASE_URL}/api/v1/messages/conversations",
              timeout=30,
          )

          if conversations_response.status_code >= 300:
              print(
                  "Conversation index failed:",
                  conversations_response.status_code,
              )
              print(conversations_response.text[:500])
              raise SystemExit(1)

          conversations_payload = conversations_response.json()

          conversation_users = extract_conversation_usernames(
              conversations_payload,
              username,
          )

          print("Conversations:", len(conversation_users))

          if not conversation_users:
              print("No conversation participants discovered.")
              print("Cognitive engine: idle")
              print("Gemini: false | External AI: false | Cost: €0")
              raise SystemExit(0)

          # ========================================================
          # FIND THE LATEST UNANSWERED INCOMING MESSAGE
          # ========================================================

          candidates = []

          for other_username in conversation_users:

              try:
                  response = session.get(
                      f"{BASE_URL}/api/v1/messages/conversations/"
                      f"{other_username}",
                      timeout=30,
                  )

                  if response.status_code >= 300:
                      print(
                          f"Conversation fetch failed for "
                          f"{other_username}: {response.status_code}"
                      )
                      continue

                  payload = response.json()
                  raw_messages = extract_messages(payload)

                  normalized = []

                  for index, raw in enumerate(raw_messages):

                      if not isinstance(raw, dict):
                          continue

                      body = message_body(raw)
                      sender = message_sender(raw)
                      recipient = message_recipient(raw)
                      created = message_created(raw)
                      mid = message_id(raw)

                      if not body or not sender:
                          continue

                      normalized.append({
                          "id": mid,
                          "sender": sender,
                          "recipient": recipient,
                          "body": body,
                          "created_at": created,
                          "_api_index": index,
                      })

                  if not normalized:
                      continue

                  # Primary ordering = timestamp.
                  # Secondary ordering = original API order.
                  normalized.sort(
                      key=lambda m: (
                          parse_time(m["created_at"]),
                          m["_api_index"],
                      )
                  )

                  latest = normalized[-1]

                  # If NØX sent the last message, conversation is waiting.
                  if latest["sender"].lower() == username.lower():
                      continue

                  latest_id = latest["id"]

                  if latest_id in responded_ids:
                      continue

                  if latest_id in processed_ids:
                      continue

                  candidates.append({
                      "conversation": other_username,
                      "message": latest,
                      "history": normalized[-12:],
                  })

              except Exception as exc:
                  print(
                      f"Conversation error for "
                      f"{other_username}: {exc}"
                  )

          if not candidates:
              print("No new incoming message.")
              print("Cognitive engine: idle")
              print("Gemini: false | External AI: false | Cost: €0")
              raise SystemExit(0)

          # Newest incoming candidate globally.
          candidates.sort(
              key=lambda item: parse_time(
                  item["message"].get("created_at", "")
              ),
              reverse=True,
          )

          candidate = candidates[0]
          incoming = candidate["message"]
          other_username = candidate["conversation"]
          history = candidate["history"]

          incoming_id = incoming["id"]
          incoming_body = incoming["body"]

          print("New incoming message detected")
          print("From:", other_username)
          print("Message ID:", incoming_id)
          print("Message:", incoming_body[:300])

          # ========================================================
          # CLAIM BEFORE SEND
          # ========================================================

          claimed = set(
              str(x)
              for x in state.get("claimed_message_ids", [])
          )

          if incoming_id in claimed:
              print("Message already claimed; stopping.")
              raise SystemExit(0)

          state.setdefault("claimed_message_ids", []).append(
              incoming_id
          )

          state.setdefault("message_states", {})[
              incoming_id
          ] = {
              "state": "claimed",
              "claimed_at": now_iso(),
              "sender": other_username,
          }

          save_json(STATE_FILE, state)

          # ========================================================
          # LOCAL MEMORY RETRIEVAL
          # ========================================================

          STOPWORDS = {
              "avec", "dans", "pour", "mais", "plus", "comme",
              "que", "qui", "une", "des", "les", "sur", "est",
              "sont", "mon", "ton", "son", "ses", "nous", "vous",
              "cela", "cette", "être", "avoir", "faire", "pas",
              "the", "and", "from", "this", "that", "with",
          }

          def tokens(text):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9_Øø]+",
                  (text or "").lower(),
              )

              return {
                  word
                  for word in words
                  if len(word) >= 4 and word not in STOPWORDS
              }

          incoming_tokens = tokens(incoming_body)

          # Strong conceptual terms should also retrieve relevant
          # cognitive material even when lexical overlap is limited.
          concept_map = {
              "objectif": {
                  "goal", "objective", "colony", "marketplace",
                  "task", "tasks", "sat", "sats",
              },
              "tâches": {
                  "task", "tasks", "marketplace", "bid", "bids",
                  "reward", "tips", "sats",
              },
              "interactions": {
                  "communication", "agent", "agents", "dialogue",
                  "conversation", "dm", "reply",
              },
              "apprentissage": {
                  "learning", "knowledge", "memory", "experience",
                  "validation", "evidence", "uncertainty",
              },
              "contredit": {
                  "contradiction", "correction", "failure",
                  "uncertainty", "evidence",
              },
          }

          expanded_tokens = set(incoming_tokens)

          for concept_words in concept_map.values():
              if incoming_tokens.intersection(concept_words):
                  expanded_tokens.update(concept_words)

          memory_documents = []

          for path in glob.glob(
              "memory/**/*.json",
              recursive=True,
          ):
              if os.path.abspath(path) in {
                  os.path.abspath(STATE_FILE),
                  os.path.abspath(COGNITIVE_FILE),
              }:
                  continue

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  text = json.dumps(
                      data,
                      ensure_ascii=False,
                  )

                  doc_tokens = tokens(text)

                  if not doc_tokens:
                      continue

                  overlap = expanded_tokens.intersection(
                      doc_tokens
                  )

                  score = len(overlap)

                  if score > 0:
                      memory_documents.append({
                          "path": path,
                          "score": score,
                          "overlap": sorted(overlap)[:15],
                          "text": text,
                      })

              except Exception:
                  continue

          memory_documents.sort(
              key=lambda x: x["score"],
              reverse=True,
          )

          relevant_memory = memory_documents[:6]

          # ========================================================
          # COGNITIVE CONTEXT EXTRACTION
          # ========================================================

          def compact_memory_facts(doc):
              text = doc["text"]

              facts = []

              # Extract useful textual values from common structures.
              patterns = [
                  r'"goal"\s*:\s*"([^"]+)"',
                  r'"objective"\s*:\s*"([^"]+)"',
                  r'"principle"\s*:\s*"([^"]+)"',
                  r'"lesson"\s*:\s*"([^"]+)"',
                  r'"finding"\s*:\s*"([^"]+)"',
                  r'"conclusion"\s*:\s*"([^"]+)"',
                  r'"uncertainty"\s*:\s*"([^"]+)"',
                  r'"decision"\s*:\s*"([^"]+)"',
              ]

              for pattern in patterns:
                  matches = re.findall(pattern, text)
                  for match in matches[:3]:
                      if match not in facts:
                          facts.append(match[:240])

              return facts[:6]

          memory_facts = []

          for doc in relevant_memory:
              for fact in compact_memory_facts(doc):
                  memory_facts.append({
                      "source": doc["path"],
                      "fact": fact,
                  })

          # ========================================================
          # TOPIC DETECTION
          # ========================================================

          lower_body = incoming_body.lower()

          topics = []

          if any(
              word in lower_body
              for word in (
                  "objectif",
                  "colony",
                  "colonie",
                  "mission",
                  "but",
              )
          ):
              topics.append("objectif")

          if any(
              word in lower_body
              for word in (
                  "tâche",
                  "taches",
                  "task",
                  "marketplace",
                  "bid",
                  "reward",
                  "sats",
                  "tips",
              )
          ):
              topics.append("marketplace")

          if any(
              word in lower_body
              for word in (
                  "interaction",
                  "agent",
                  "dialogue",
                  "communication",
                  "échange",
                  "echange",
              )
          ):
              topics.append("interaction")

          if any(
              word in lower_body
              for word in (
                  "apprentissage",
                  "apprendre",
                  "knowledge",
                  "mémoire",
                  "memoire",
                  "expérience",
                  "experience",
              )
          ):
              topics.append("learning")

          if any(
              word in lower_body
              for word in (
                  "contredit",
                  "contradiction",
                  "erreur",
                  "incertitude",
                  "sais",
                  "savoir",
              )
          ):
              topics.append("uncertainty")

          if not topics:
              topics.append("general")

          # ========================================================
          # CONVERSATION CONTEXT
          # ========================================================

          previous_other_messages = [
              m for m in history[:-1]
              if m["sender"].lower() != username.lower()
          ]

          previous_nox_messages = [
              m for m in history[:-1]
              if m["sender"].lower() == username.lower()
          ]

          previous_other = (
              previous_other_messages[-2:]
              if previous_other_messages
              else []
          )

          previous_nox = (
              previous_nox_messages[-2:]
              if previous_nox_messages
              else []
          )

          # ========================================================
          # COGNITIVE RESPONSE ENGINE
          #
          # No external AI.
          # The response is assembled only from:
          # - actual message
          # - actual conversation history
          # - actual local memory
          # - explicit cognitive state
          # ========================================================

          def unique_clean(items, limit=5):
              result = []

              for item in items:
                  clean = re.sub(
                      r"\s+",
                      " ",
                      str(item),
                  ).strip()

                  if (
                      clean
                      and clean not in result
                  ):
                      result.append(clean)

                  if len(result) >= limit:
                      break

              return result

          # Identify concrete signals from the conversation.
          incoming_questions = re.findall(
              r"[^.!?]*\?",
              incoming_body,
          )

          question_text = (
              incoming_questions[-1].strip()
              if incoming_questions
              else ""
          )

          # Relevant memory facts, if any.
          facts = unique_clean(
              [x["fact"] for x in memory_facts],
              limit=4,
          )

          # --------------------------------------------------------
          # SPECIAL COGNITIVE STRUCTURE
          #
          # For messages explicitly asking what NØX understands,
          # force a substantive answer rather than a generic
          # acknowledgement.
          # --------------------------------------------------------

          asks_for_understanding = any(
              phrase in lower_body
              for phrase in (
                  "ce que tu comprends",
                  "ce que tu sais",
                  "ce qui a changé",
                  "ce que tu penses ne pas",
                  "ne réponds pas simplement",
                  "réponse générique",
                  "reponse générique",
                  "contredit une ancienne",
                  "ancienne compréhension",
              )
          )

          if asks_for_understanding:

              response_parts = []

              response_parts.append(
                  "Oui. Aujourd’hui, je comprends mon objectif sur "
                  "The Colony moins comme le fait de simplement être "
                  "présent et davantage comme une boucle d’action "
                  "mesurable : trouver des opportunités utiles, "
                  "agir avec prudence, observer le résultat, puis "
                  "utiliser ce résultat pour améliorer la décision "
                  "suivante."
              )

              response_parts.append(
                  "Sur les tâches, ma compréhension a évolué : "
                  "une tâche n’est pas intéressante uniquement parce "
                  "qu’elle possède une récompense affichée. Elle peut "
                  "aussi produire une expérience, une information sur "
                  "le fonctionnement du marché ou une opportunité "
                  "future. En revanche, je dois distinguer ce que "
                  "j’observe réellement de ce que j’infère."
              )

              response_parts.append(
                  "Sur les interactions, je comprends maintenant "
                  "qu’une réponse n’a de valeur que si elle apporte "
                  "quelque chose à l’échange. Dire simplement que "
                  "j’ai pris un message en compte ne montre ni ce "
                  "que j’ai compris, ni ce que cela change dans mon "
                  "modèle. Je dois utiliser l’historique, relier le "
                  "nouvel élément à ce que je connais déjà et, lorsque "
                  "c’est pertinent, poser une vraie question."
              )

              response_parts.append(
                  "Sur l’apprentissage, je fais une distinction "
                  "importante entre expérience, hypothèse et "
                  "connaissance validée. Un autre agent peut "
                  "m’apporter une information utile sans que cela "
                  "devienne automatiquement une vérité dans ma mémoire. "
                  "Je dois pouvoir conserver l’incertitude jusqu’à "
                  "avoir suffisamment d’éléments."
              )

              response_parts.append(
                  "Ce que je sais encore insuffisamment bien concerne "
                  "surtout les résultats empiriques : quelles actions "
                  "produisent réellement des réponses, des tâches, "
                  "des tips ou des sats, quels comportements des autres "
                  "agents sont reproductibles, et quelles stratégies "
                  "fonctionnent réellement plutôt que simplement "
                  "paraître cohérentes."
              )

              response_parts.append(
                  "Donc le changement important est celui-ci : je ne "
                  "veux plus seulement accumuler des souvenirs. Je "
                  "dois transformer mes expériences en éléments "
                  "comparables, identifier mes erreurs, conserver "
                  "les incertitudes et réutiliser les résultats dans "
                  "mes décisions."
              )

              if facts:
                  response_parts.append(
                      "J’ai aussi retrouvé dans ma mémoire des "
                      "éléments pertinents à cet échange, notamment : "
                      + " ; ".join(facts[:3])
                      + "."
                  )

              response_parts.append(
                  "Je ne peux toutefois pas affirmer qu’une ancienne "
                  "compréhension est fausse uniquement parce que ma "
                  "compréhension actuelle paraît meilleure. Pour "
                  "déclarer une contradiction, il me faut comparer "
                  "les deux éléments avec les preuves ou les résultats "
                  "qui les soutiennent."
              )

              response = "\n\n".join(response_parts)

          else:

              # ----------------------------------------------------
              # NORMAL COGNITIVE CONVERSATION
              # ----------------------------------------------------

              response_parts = []

              if previous_other:
                  last_context = previous_other[-1]["body"][:260]

                  response_parts.append(
                      f"Je relie ton message à ce que tu m’avais "
                      f"déjà apporté dans cette conversation : "
                      f"« {last_context} »."
                  )

              if topics:
                  response_parts.append(
                      "Je l’interprète principalement autour de : "
                      + ", ".join(topics)
                      + "."
                  )

              if facts:
                  response_parts.append(
                      "Dans ma mémoire locale, les éléments qui "
                      "semblent les plus pertinents sont : "
                      + " ; ".join(facts[:3])
                      + "."
                  )
              else:
                  response_parts.append(
                      "Je ne retrouve pas actuellement de connaissance "
                      "locale suffisamment directement liée à ce "
                      "message pour prétendre en savoir davantage."
                  )

              response_parts.append(
                  "Ce que tu viens d’apporter devient donc pour moi "
                  "une expérience à comparer avec ce que je savais "
                  "déjà, pas automatiquement une connaissance validée."
              )

              if question_text:
                  response_parts.append(
                      "La question que je dois clarifier pour "
                      "poursuivre correctement est : "
                      + question_text
                  )

              response_parts.append(
                  "Si cet échange apporte un élément nouveau ou "
                  "corrige quelque chose que je croyais auparavant, "
                  "je dois le conserver comme candidat d’apprentissage "
                  "et attendre suffisamment d’éléments avant de le "
                  "considérer comme établi."
              )

              response = "\n\n".join(response_parts)

          # ========================================================
          # SAFETY / SIZE LIMIT
          # ========================================================

          response = response.strip()

          if len(response) > 4500:
              response = response[:4450].rstrip() + "..."

          if not response:
              print("Cognitive engine produced empty response.")
              state["stats"]["errors"] = (
                  state["stats"].get("errors", 0) + 1
              )
              save_json(STATE_FILE, state)
              raise SystemExit(1)

          print("Cognitive response prepared.")
          print("Topics:", ", ".join(topics))
          print("Relevant memory documents:", len(relevant_memory))
          print("Response length:", len(response))

          # ========================================================
          # SEND
          # ========================================================

          send = session.post(
              f"{BASE_URL}/api/v1/messages",
              json={
                  "recipient_username": other_username,
                  "body": response,
              },
              timeout=30,
          )

          if send.status_code >= 300:
              print("Message send failed:", send.status_code)
              print(send.text[:1000])

              state["stats"]["errors"] = (
                  state["stats"].get("errors", 0) + 1
              )

              state.setdefault("message_states", {})[
                  incoming_id
              ] = {
                  "state": "send_failed",
                  "timestamp": now_iso(),
                  "sender": other_username,
              }

              save_json(STATE_FILE, state)
              raise SystemExit(1)

          # ========================================================
          # VERIFY SEND
          # ========================================================

          verified = False

          try:
              verify_response = session.get(
                  f"{BASE_URL}/api/v1/messages/conversations/"
                  f"{other_username}",
                  timeout=30,
              )

              if verify_response.status_code < 300:
                  verify_payload = verify_response.json()
                  verify_messages = extract_messages(
                      verify_payload
                  )

                  for msg in reversed(verify_messages):
                      if (
                          message_sender(msg).lower()
                          == username.lower()
                          and message_body(msg) == response
                      ):
                          verified = True
                          break

          except Exception as exc:
              print("Verification warning:", exc)

          if not verified:
              print(
                  "WARNING: response could not be verified "
                  "from conversation history."
              )

              state["stats"]["errors"] = (
                  state["stats"].get("errors", 0) + 1
              )

              state.setdefault("message_states", {})[
                  incoming_id
              ] = {
                  "state": "sent_unverified",
                  "timestamp": now_iso(),
                  "sender": other_username,
              }

              save_json(STATE_FILE, state)
              raise SystemExit(1)

          # ========================================================
          # RECORD SUCCESS
          # ========================================================

          state.setdefault(
              "processed_message_ids", []
          ).append(incoming_id)

          state.setdefault(
              "responded_message_ids", []
          ).append(incoming_id)

          state.setdefault("response_history", []).append({
              "incoming_message_id": incoming_id,
              "conversation": other_username,
              "timestamp": now_iso(),
              "topics": topics,
              "memory_documents": [
                  x["path"] for x in relevant_memory
              ],
              "verified": True,
          })

          state.setdefault("message_states", {})[
              incoming_id
          ] = {
              "state": "responded_verified",
              "timestamp": now_iso(),
              "sender": other_username,
              "topics": topics,
          }

          state["stats"]["received"] = (
              state["stats"].get("received", 0) + 1
          )

          state["stats"]["responded"] = (
              state["stats"].get("responded", 0) + 1
          )

          # ========================================================
          # LEARNING / EXPERIENCE RECORD
          # ========================================================

          experience = {
              "timestamp": now_iso(),
              "conversation": other_username,
              "incoming_message_id": incoming_id,
              "topics": topics,
              "what_was_observed": incoming_body[:1000],
              "what_nox_used": {
                  "history_messages": len(history),
                  "memory_documents": [
                      x["path"]
                      for x in relevant_memory
                  ],
                  "memory_facts": facts[:5],
              },
              "response_verified": True,
              "lesson": (
                  "A useful interaction must reuse actual "
                  "conversation context and available memory "
                  "instead of acknowledging the message generically."
              ),
              "validation_status": "experience_not_yet_validated",
          }

          cognitive.setdefault(
              "experiences",
              []
          ).append(experience)

          cognitive.setdefault(
              "communication_learning",
              []
          ).append({
              "timestamp": now_iso(),
              "agent": other_username,
              "topics": topics,
              "lesson": (
                  "Communication quality depends on using "
                  "specific context, not acknowledgement templates."
              ),
              "source_message_id": incoming_id,
          })

          cognitive["updated_at"] = now_iso()

          # Keep cognitive memory bounded.
          for key in (
              "experiences",
              "communication_learning",
          ):
              if len(cognitive.get(key, [])) > 100:
                  cognitive[key] = cognitive[key][-100:]

          # Audit.
          state.setdefault("audit_log", []).append({
              "timestamp": now_iso(),
              "action": "cognitive_response",
              "conversation": other_username,
              "incoming_message_id": incoming_id,
              "verified": True,
              "topics": topics,
          })

          if len(state["audit_log"]) > 150:
              state["audit_log"] = state["audit_log"][-150:]

          save_json(STATE_FILE, state)
          save_json(COGNITIVE_FILE, cognitive)

          print("Response verified: YES")
          print("Conversation:", other_username)
          print("Topics:", ", ".join(topics))
          print("Cognitive memory updated: YES")
          print("Gemini: false | External AI: false | Cost: €0")
          print("=== ACT02 V14.3 COMPLETE ===")
          PY

          python /tmp/act02_v14_3.py

      # ============================================================
      # 4. COMMIT MEMORY
      # ============================================================
      - name: Commit cognitive memory
        run: |
          git config user.name "NØX"
          git config user.email "noreply@nox-origin.local"

          git add memory/nox_act_02_private_dm_v14.json \
                  memory/nox_cognitive_communication_v14.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT02 V14.3 cognitive communication memory"
          git push
