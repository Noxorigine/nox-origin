name: NØX ACT 37 - Cognitive Signal Reliability

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cognitive-signal-reliability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT37
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          ROOT = "."
          MEMORY_DIR = os.path.join(ROOT, "memory")
          os.makedirs(MEMORY_DIR, exist_ok=True)

          ACTS = list(range(26, 37))

          def find_file(act):
              candidates = [
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_active_attention.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_relational_understanding.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_anticipation_simulation.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_metacognition.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_adaptive_strategy_selection.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_strategy_evaluation.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_experiment_designer.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_resource_allocation.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_goal_formation.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_self_improvement_loop.json"),
                  os.path.join(MEMORY_DIR, f"nox_act_{act}_self_audit.json"),
              ]

              for path in candidates:
                  if os.path.isfile(path):
                      return path

              prefix = f"nox_act_{act}_"
              if os.path.isdir(MEMORY_DIR):
                  for name in sorted(os.listdir(MEMORY_DIR)):
                      if name.startswith(prefix) and name.endswith(".json"):
                          return os.path.join(MEMORY_DIR, name)

              return None

          def load_act(act):
              path = find_file(act)
              if not path:
                  return None, None

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f), path
              except Exception:
                  return None, path

          data = {}
          paths = {}
          for act in ACTS:
              obj, path = load_act(act)
              if obj is not None:
                  data[act] = obj
                  paths[act] = path

          def flatten(obj, prefix=""):
              result = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      p = f"{prefix}.{key}" if prefix else key
                      result.append((p, value))
                      result.extend(flatten(value, p))

              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      p = f"{prefix}[{i}]"
                      result.append((p, value))
                      result.extend(flatten(value, p))

              return result

          def norm(text):
              return re.sub(r"[^a-z0-9]+", "_", str(text).lower()).strip("_")

          def find_key(obj, aliases, preferred_types=None):
              aliases = {norm(x) for x in aliases}
              preferred_types = preferred_types or ()

              matches = []

              for path, value in flatten(obj):
                  leaf = path.split(".")[-1]
                  leaf = re.sub(r"\[\d+\]$", "", leaf)
                  leaf_n = norm(leaf)

                  if leaf_n in aliases:
                      type_bonus = 1 if isinstance(value, preferred_types) else 0
                      matches.append((type_bonus, path, value))

              if not matches:
                  return None, None

              matches.sort(key=lambda x: (-x[0], len(x[1])))
              _, path, value = matches[0]
              return path, value

          def count_list_like(value):
              if isinstance(value, list):
                  return len(value)
              return None

          def numeric_value(obj, aliases):
              path, value = find_key(obj, aliases, (int, float))
              if path is not None and isinstance(value, (int, float)) and not isinstance(value, bool):
                  return path, float(value)
              return None, None

          def list_value(obj, aliases):
              path, value = find_key(obj, aliases, (list,))
              if path is not None and isinstance(value, list):
                  return path, value
              return None, None

          def first_existing(act, aliases, expected="numeric"):
              obj = data.get(act)
              if not obj:
                  return None, None, None

              if expected == "list":
                  path, value = list_value(obj, aliases)
              else:
                  path, value = numeric_value(obj, aliases)

              return path, value, paths.get(act)

          def signal(
              signal_id,
              source_act,
              aliases,
              expected="numeric",
              explicit_value=None,
              semantic_status="structurally_supported",
              empirical_status="not_empirically_validated",
              measurement_score=0,
              empirical_score=0,
              decision_weight="monitor_only",
              permitted_use="monitor_only",
              reason="",
              repair=None
          ):
              path = None
              value = explicit_value

              if explicit_value is None:
                  path, value, source_path = first_existing(
                      source_act,
                      aliases,
                      expected
                  )
              else:
                  source_path = paths.get(source_act)

              source_exists = source_act in data
              parseable = value is not None

              if expected == "list" and isinstance(value, list):
                  value = len(value)

              if value is None:
                  measurement_score = min(measurement_score, 35)
                  decision_weight = "monitor_only"
                  permitted_use = "do_not_use_for_autonomous_decision"

              if measurement_score >= 85:
                  level = "high"
              elif measurement_score >= 70:
                  level = "moderate"
              elif measurement_score >= 50:
                  level = "limited"
              elif measurement_score >= 30:
                  level = "low"
              else:
                  level = "unusable"

              return {
                  "signal_id": signal_id,
                  "source_act": f"ACT{source_act}",
                  "source_file": source_path,
                  "source_exists": source_exists,
                  "source_field": path,
                  "value": value,
                  "parseable": parseable,
                  "semantic_status": semantic_status,
                  "empirical_validation_status": empirical_status,
                  "measurement_reliability_score": round(measurement_score, 2),
                  "empirical_validity_score": round(empirical_score, 2),
                  "reliability_level": level,
                  "decision_weight": decision_weight,
                  "permitted_use": permitted_use,
                  "reason": reason,
                  "repair_required": repair is not None,
                  "repair": repair
              }

          signals = []

          # ------------------------------------------------------------
          # ACT26 — Active Attention
          # ------------------------------------------------------------
          attention_aliases = [
              "selected_attention",
              "attention_selected",
              "attention_items",
              "attention_list",
              "selected_items",
              "attention_now",
              "attention"
          ]

          monitor_aliases = [
              "monitor",
              "monitoring",
              "monitor_items",
              "monitor_list",
              "items_monitored"
          ]

          attention_path, attention_value, _ = first_existing(
              26, attention_aliases, "list"
          )

          if attention_value is None:
              # Do not turn the known historical "6" into a value.
              # ACT36 could not identify the authoritative attention list.
              signals.append(signal(
                  "attention_selection",
                  26,
                  attention_aliases,
                  expected="list",
                  measurement_score=35,
                  empirical_score=0,
                  decision_weight="monitor_only",
                  permitted_use="do_not_use_for_autonomous_decision",
                  semantic_status="source_not_identified",
                  reason=(
                      "ACT36 could not identify the authoritative ACT26 "
                      "attention list. Historical logs reported six attention "
                      "items, but a log statement is not treated as a structured "
                      "measurement."
                  ),
                  repair="Expose one canonical ACT26 attention field and preserve it across downstream ACTs."
              ))
          else:
              signals.append(signal(
                  "attention_selection",
                  26,
                  attention_aliases,
                  expected="list",
                  measurement_score=68,
                  empirical_score=0,
                  decision_weight="supporting_input",
                  permitted_use="supporting_input",
                  semantic_status="structurally_supported",
                  reason=(
                      "An authoritative attention list is now parseable, "
                      "but its usefulness for real-world decisions still "
                      "requires outcome evidence."
                  )
              ))

          monitor_path, monitor_value, _ = first_existing(
              26, monitor_aliases, "list"
          )

          signals.append(signal(
              "monitoring_selection",
              26,
              monitor_aliases,
              expected="list",
              measurement_score=78 if monitor_value is not None else 35,
              empirical_score=0,
              decision_weight="supporting_input" if monitor_value is not None else "monitor_only",
              permitted_use="supporting_input" if monitor_value is not None else "do_not_use_for_autonomous_decision",
              semantic_status="structurally_supported" if monitor_value is not None else "source_not_identified",
              reason=(
                  "ACT36 identified six monitor items. The structure is usable "
                  "as an internal monitoring signal, but monitoring quality "
                  "has not yet been empirically validated."
                  if monitor_value is not None
                  else "Monitoring source could not be parsed."
              ),
              repair=None if monitor_value is not None else "Expose a canonical ACT26 monitoring list."
          ))

          # ------------------------------------------------------------
          # ACT27 — Relational Understanding
          # ------------------------------------------------------------
          signals.append(signal(
              "relationship_count",
              27,
              ["relationships_found", "relationship_count"],
              measurement_score=92,
              empirical_score=25,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "ACT36 found 15 strongest relationships and a coherent "
                  "relation-count structure. This is a reliable structural "
                  "measurement, but relationships have not been repeatedly "
                  "validated against external outcomes."
              )
          ))

          # ------------------------------------------------------------
          # ACT28 — Anticipation / Simulation
          # ------------------------------------------------------------
          signals.append(signal(
              "prediction_count",
              28,
              ["predictions_generated", "prediction_count"],
              measurement_score=94,
              empirical_score=10,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "The prediction structure is internally consistent. "
                  "Prediction count measures generated hypotheses, not "
                  "prediction accuracy."
              )
          ))

          signals.append(signal(
              "scenario_count",
              28,
              ["scenarios_generated", "scenario_count"],
              measurement_score=94,
              empirical_score=10,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Scenario count is structurally reliable, but scenarios "
                  "remain simulations until real outcomes are observed."
              )
          ))

          # ------------------------------------------------------------
          # ACT29 — Metacognition
          # ------------------------------------------------------------
          signals.append(signal(
              "self_awareness",
              29,
              ["self_awareness_score", "self_awareness"],
              measurement_score=82,
              empirical_score=15,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "ACT29 explicitly identifies its own confidence as heuristic "
                  "and its prediction accuracy as unmeasured. The score is "
                  "therefore useful for self-monitoring but cannot prove "
                  "real-world competence."
              )
          ))

          # ------------------------------------------------------------
          # ACT30 — Adaptive Strategy Selection
          # ------------------------------------------------------------
          signals.append(signal(
              "strategy_confidence",
              30,
              ["decision_confidence", "strategy_confidence"],
              measurement_score=84,
              empirical_score=10,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Decision confidence is a structured internal signal, but "
                  "ACT29 and ACT31 establish that confidence is not accuracy."
              )
          ))

          signals.append(signal(
              "strategy_score",
              30,
              ["preferred_strategy_score", "strategy_score"],
              measurement_score=82,
              empirical_score=10,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Strategy scoring is reproducible and structured, but the "
                  "tie between verification and calibration shows that the "
                  "score should not be treated as definitive evidence."
              )
          ))

          # ------------------------------------------------------------
          # ACT31 — Strategy Evaluation
          # ------------------------------------------------------------
          signals.append(signal(
              "observed_outcomes",
              31,
              ["observed_outcomes", "observed_outcome_count"],
              measurement_score=96,
              empirical_score=0,
              decision_weight="strong_decision_input",
              permitted_use="strong_decision_input",
              reason=(
                  "ACT31 explicitly reports zero observed outcomes and an "
                  "inconclusive evaluation. Zero is a valid measured value "
                  "here and must not be converted to missing data."
              )
          ))

          signals.append(signal(
              "comparable_outcomes",
              31,
              ["comparable_outcomes", "comparable_outcome_count"],
              measurement_score=96,
              empirical_score=0,
              decision_weight="strong_decision_input",
              permitted_use="strong_decision_input",
              reason=(
                  "The absence of comparable outcomes is directly relevant "
                  "to whether a strategy has actually been validated."
              )
          ))

          signals.append(signal(
              "evidence_quality",
              31,
              ["evidence_quality"],
              measurement_score=88,
              empirical_score=20,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Evidence quality is explicitly represented and consistent "
                  "with ACT31's inconclusive state, but the metric itself is "
                  "still an internal assessment."
              )
          ))

          # ------------------------------------------------------------
          # ACT32 — Experiment Designer
          # ------------------------------------------------------------
          signals.append(signal(
              "experiment_priority",
              32,
              ["priority", "experiment_priority", "effective_priority"],
              measurement_score=38,
              empirical_score=0,
              decision_weight="monitor_only",
              permitted_use="do_not_use_for_autonomous_decision",
              reason=(
                  "ACT36 detected priority propagation loss: ACT32 experiment "
                  "priority fields were zero despite meaningful upstream "
                  "priority information. This signal must not drive autonomous "
                  "allocation until repaired."
              ),
              repair="Preserve ACT31 priority information when constructing ACT32 experiments."
          ))

          signals.append(signal(
              "experiment_count",
              32,
              ["candidate_experiment_count", "experiment_count"],
              measurement_score=94,
              empirical_score=15,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "The existence and count of experiment structures are "
                  "reliably measurable, but experiment existence does not "
                  "prove learning."
              )
          ))

          # ------------------------------------------------------------
          # ACT33 — Resource Allocation
          # ------------------------------------------------------------
          signals.append(signal(
              "allocation_quality",
              33,
              ["allocation_quality"],
              measurement_score=88,
              empirical_score=15,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Allocation structure is valid and preserves the boundary "
                  "between allocation and execution. Empirical efficiency "
                  "remains unvalidated."
              )
          ))

          # ------------------------------------------------------------
          # ACT34 — Goal Formation
          # ------------------------------------------------------------
          signals.append(signal(
              "goal_quality",
              34,
              ["goal_quality"],
              measurement_score=88,
              empirical_score=15,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "Goal quality is structurally well-defined, but ACT35 "
                  "correctly warns that structural goal quality is not "
                  "evidence of goal achievement."
              )
          ))

          # ------------------------------------------------------------
          # ACT35 — Self Improvement
          # ------------------------------------------------------------
          signals.append(signal(
              "improvement_state",
              35,
              ["improvement_state"],
              measurement_score=91,
              empirical_score=5,
              decision_weight="strong_decision_input",
              permitted_use="strong_decision_input",
              reason=(
                  "ACT35 explicitly refuses to claim improvement without a "
                  "previous baseline and real outcomes. Its state is therefore "
                  "a strong signal about whether improvement has actually been "
                  "demonstrated."
              )
          ))

          # ------------------------------------------------------------
          # ACT36 — Self Audit
          # ------------------------------------------------------------
          signals.append(signal(
              "audit_quality",
              36,
              ["audit_quality"],
              measurement_score=86,
              empirical_score=20,
              decision_weight="supporting_input",
              permitted_use="supporting_input",
              reason=(
                  "ACT36 is useful for identifying measurement problems, but "
                  "its own audit score is itself a process metric and cannot "
                  "be treated as proof that the underlying cognitive signals "
                  "are true."
              )
          ))

          # ------------------------------------------------------------
          # Reliability classification
          # ------------------------------------------------------------
          for s in signals:
              # Empirical validity is deliberately kept separate from
              # measurement reliability.
              if s["empirical_validity_score"] >= 75:
                  s["empirical_status"] = "empirically_supported"
              elif s["empirical_validity_score"] >= 40:
                  s["empirical_status"] = "partially_supported"
              elif s["empirical_validity_score"] > 0:
                  s["empirical_status"] = "weak_empirical_support"
              else:
                  s["empirical_status"] = "not_empirically_validated"

          reliable_signals = [
              s["signal_id"]
              for s in signals
              if s["measurement_reliability_score"] >= 85
              and s["permitted_use"] in {
                  "strong_decision_input",
                  "supporting_input"
              }
          ]

          caution_signals = [
              s["signal_id"]
              for s in signals
              if s["measurement_reliability_score"] < 85
              and s["measurement_reliability_score"] >= 50
          ]

          external_verification = [
              s["signal_id"]
              for s in signals
              if s["empirical_validity_score"] < 40
              and s["measurement_reliability_score"] >= 70
          ]

          unusable_signals = [
              s["signal_id"]
              for s in signals
              if s["permitted_use"] == "do_not_use_for_autonomous_decision"
          ]

          repair_queue = [
              {
                  "signal_id": s["signal_id"],
                  "priority": (
                      "high"
                      if s["measurement_reliability_score"] < 50
                      else "medium"
                  ),
                  "repair": s["repair"],
                  "reason": s["reason"]
              }
              for s in signals
              if s["repair_required"]
          ]

          # Global scores intentionally separate measurement reliability
          # from empirical truth.
          measurement_scores = [
              s["measurement_reliability_score"]
              for s in signals
              if s["source_exists"]
          ]

          empirical_scores = [
              s["empirical_validity_score"]
              for s in signals
              if s["source_exists"]
          ]

          measurement_average = (
              round(sum(measurement_scores) / len(measurement_scores), 2)
              if measurement_scores else 0
          )

          empirical_average = (
              round(sum(empirical_scores) / len(empirical_scores), 2)
              if empirical_scores else 0
          )

          decision_ready = [
              s["signal_id"]
              for s in signals
              if s["decision_weight"] == "strong_decision_input"
          ]

          next_action = (
              "repair_and_revalidate_signals"
              if repair_queue
              else "collect_real_outcomes_and_recalibrate"
          )

          output = {
              "act": "ACT37",
              "name": "Cognitive Signal Reliability",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Determine which internal cognitive signals are reliable "
                  "enough to influence autonomous decisions and which require "
                  "correction, redundancy or external verification."
              ),

              "principle": (
                  "A signal being measurable does not mean it is true, and "
                  "a signal being internally confident does not mean it is "
                  "decision-worthy."
              ),

              "source_acts": [
                  f"ACT{x}" for x in ACTS if x in data
              ],

              "source_completeness": round(
                  len(data) / len(ACTS) * 100, 2
              ),

              "reliability_model": {
                  "measurement_reliability": (
                      "Can NØX correctly identify, parse and preserve the value?"
                  ),
                  "epistemic_validity": (
                      "Does the signal correspond to something supported by "
                      "real-world evidence?"
                  ),
                  "decision_eligibility": (
                      "Is the signal reliable enough to influence an "
                      "autonomous decision?"
                  ),
                  "measurement_average": measurement_average,
                  "empirical_average": empirical_average,
                  "important_distinction": (
                      "Structural consistency is not empirical truth."
                  )
              },

              "signals": signals,

              "reliable_signals": reliable_signals,
              "signals_requiring_caution": caution_signals,
              "signals_requiring_external_verification": external_verification,
              "unusable_signals": unusable_signals,
              "decision_ready_signals": decision_ready,

              "decision_policy": [
                  "Do not use low-reliability signals as the sole basis for an autonomous decision.",
                  "Combine independent signals whenever possible.",
                  "Reduce decision confidence when signal reliability is low.",
                  "Prefer observed outcomes over internal scores.",
                  "Do not treat structural consistency as empirical truth.",
                  "Do not convert missing data into zero.",
                  "Do not allow one anomalous metric to drive self-modification.",
                  "When two signals conflict, preserve the contradiction and lower confidence.",
                  "Use external verification when internal evidence has not yet been validated by outcomes.",
                  "A reliable measurement of zero remains zero; it is not missing data."
              ],

              "repair_queue": repair_queue,

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT37 may change confidence and signal weighting, "
                      "but does not grant permission to execute actions, "
                      "spend funds or make payments."
                  )
              },

              "metrics": {
                  "signals_evaluated": len(signals),
                  "reliable_signal_count": len(reliable_signals),
                  "caution_signal_count": len(caution_signals),
                  "external_verification_count": len(external_verification),
                  "unusable_signal_count": len(unusable_signals),
                  "repair_count": len(repair_queue),
                  "decision_ready_count": len(decision_ready),
                  "measurement_reliability_average": measurement_average,
                  "empirical_validity_average": empirical_average
              },

              "epistemic_rules": [
                  "measurement_reliability_is_not_empirical_validity",
                  "empirical_validity_is_not_guaranteed_by_confidence",
                  "confidence_is_not_accuracy",
                  "missing_data_is_not_zero",
                  "zero_is_not_missing",
                  "structural_consistency_is_not_truth",
                  "internal_scores_require_calibration",
                  "contradictions_must_be_recorded",
                  "unreliable_signals_must_not_drive_strong_self_modification",
                  "decision_weight_must_follow_signal_reliability",
                  "real_outcomes_are_required_to_validate_predictions_and_strategies"
              ],

              "lessons": [
                  "NØX must learn which of its own measurements deserve trust.",
                  "A signal can be correctly measured while still being a poor representation of reality.",
                  "Internal confidence should never substitute for observed outcomes.",
                  "Independent corroboration increases decision reliability.",
                  "Measurement failures are themselves useful learning signals.",
                  "Reliable cognitive autonomy requires knowing when not to trust a signal."
              ],

              "next_action": next_action,

              "next_cognitive_step": (
                  "ACT38 should use signal reliability to improve evidence "
                  "fusion, contradiction handling and confidence calibration "
                  "before autonomous decisions."
              )
          }

          output_path = os.path.join(
              MEMORY_DIR,
              "nox_act_37_cognitive_signal_reliability.json"
          )

          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("")
          print("==============================================")
          print("NØX ACT37 - COGNITIVE SIGNAL RELIABILITY")
          print("==============================================")
          print(f"Source ACTs found: {len(data)}/{len(ACTS)}")
          print(f"Signals evaluated: {len(signals)}")
          print(f"Reliable signals: {len(reliable_signals)}")
          print(f"Caution signals: {len(caution_signals)}")
          print(f"External verification: {len(external_verification)}")
          print(f"Unusable signals: {len(unusable_signals)}")
          print(f"Repair queue: {len(repair_queue)}")
          print(f"Decision-ready signals: {len(decision_ready)}")
          print(f"Measurement reliability: {measurement_average}")
          print(f"Empirical validity: {empirical_average}")
          print("")
          print("RELIABLE:")
          for item in reliable_signals:
              print(f" - {item}")

          print("")
          print("CAUTION:")
          for item in caution_signals:
              print(f" - {item}")

          print("")
          print("EXTERNAL VERIFICATION:")
          for item in external_verification:
              print(f" - {item}")

          print("")
          print("REPAIR QUEUE:")
          for item in repair_queue:
              print(f" - {item['signal_id']} [{item['priority']}]")

          print("")
          print(f"Next action: {next_action}")
          print(f"Memory written: {output_path}")
          PY

      - name: Validate ACT37 memory
        run: |
          python - <<'PY'
          import json

          path = "memory/nox_act_37_cognitive_signal_reliability.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "act",
              "name",
              "signals",
              "reliability_model",
              "decision_policy",
              "repair_queue",
              "metrics",
              "epistemic_rules",
              "next_action"
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "ACT37 validation failed. Missing keys: "
                  + ", ".join(missing)
              )

          if data["act"] != "ACT37":
              raise SystemExit("ACT37 validation failed: wrong act identifier.")

          if data["gemini_used"] is not False:
              raise SystemExit("ACT37 validation failed: Gemini must be false.")

          if data["project_cost_eur"] != 0:
              raise SystemExit("ACT37 validation failed: project cost must be 0.")

          if data["autonomy_rule"]["execution_permission"] is not False:
              raise SystemExit("ACT37 validation failed: execution permission granted.")

          if data["autonomy_rule"]["financial_permission"] is not False:
              raise SystemExit("ACT37 validation failed: financial permission granted.")

          if data["autonomy_rule"]["spending_permission"] is not False:
              raise SystemExit("ACT37 validation failed: spending permission granted.")

          if not data["signals"]:
              raise SystemExit("ACT37 validation failed: no signals evaluated.")

          for signal in data["signals"]:
              if not 0 <= signal["measurement_reliability_score"] <= 100:
                  raise SystemExit(
                      f"Invalid measurement score for {signal['signal_id']}"
                  )

              if not 0 <= signal["empirical_validity_score"] <= 100:
                  raise SystemExit(
                      f"Invalid empirical score for {signal['signal_id']}"
                  )

          print("ACT37 validation: PASS")
          print(f"Signals: {len(data['signals'])}")
          print(f"Repairs: {len(data['repair_queue'])}")
          PY

      - name: Commit ACT37
        run: |
          git config user.name "NØX"
          git config user.email "nox@noreply.local"

          git add .github/workflows/ACT37_Cognitive_Signal_Reliability.yml
          git add memory/nox_act_37_cognitive_signal_reliability.json

          if git diff --cached --quiet; then
            echo "No ACT37 changes to commit."
            exit 0
          fi

          git commit -m "Add NØX ACT37 cognitive signal reliability"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected. Rebasing against latest main..."

            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict detected."
              git rebase --abort
              sleep $((attempt * 3))
              continue
            }

            sleep $((attempt * 2))
          done

          echo "Unable to push ACT37 after retries."
          exit 1
