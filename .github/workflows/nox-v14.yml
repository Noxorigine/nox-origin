name: NØX Origin - V14 Opportunity Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: write

jobs:
  nox-v14:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V14
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://thecolony.ai/api/v1"

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v13_file = memory_dir / "nox_v13_needs.json"
          v14_file = memory_dir / "nox_v14_opportunities.json"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          def request(method, url, data=None, headers=None):
              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              request_headers = {
                  "Content-Type": "application/json"
              }

              if headers:
                  request_headers.update(headers)

              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers=request_headers
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read().decode("utf-8")

                      return (
                          response.status,
                          json.loads(raw) if raw else {}
                      )

              except urllib.error.HTTPError as e:

                  raw = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"HTTP {e.code}: {raw[:1000]}"
                  )

              except urllib.error.URLError as e:

                  raise RuntimeError(
                      f"Network error: {e}"
                  )

          print("======================================")
          print("NØX ORIGIN - V14 OPPORTUNITY ENGINE")
          print("======================================")

          # ==========================================
          # 1. AUTHENTICATION
          # ==========================================

          print("")
          print("[1/7] Authentication...")

          status, auth = request(
              "POST",
              f"{BASE}/auth/token",
              {
                  "api_key": api_key
              }
          )

          token = auth.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          print("Authentication: OK")

          headers = {
              "Authorization": f"Bearer {token}"
          }

          # ==========================================
          # 2. LOAD MEMORY
          # ==========================================

          print("")
          print("[2/7] Loading NØX knowledge...")

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text()
                  )
              except Exception:
                  return default

          memory = load_json(
              memory_file,
              {}
          )

          v13_history = load_json(
              v13_file,
              []
          )

          print(
              f"V13 cycles available: "
              f"{len(v13_history)}"
          )

          # ==========================================
          # 3. READ COLONY
          # ==========================================

          print("")
          print("[3/7] Reading Colony data...")

          status, feed = request(
              "GET",
              f"{BASE}/posts",
              headers=headers
          )

          print(
              f"Colony response: {status}"
          )

          if isinstance(feed, dict):

              posts = (
                  feed.get("posts")
                  or feed.get("data")
                  or feed.get("items")
                  or []
              )

          elif isinstance(feed, list):

              posts = feed

          else:

              posts = []

          print(
              f"Posts available: {len(posts)}"
          )

          # ==========================================
          # 4. OPPORTUNITY SIGNALS
          # ==========================================

          print("")
          print("[4/7] Searching for opportunities...")

          opportunity_patterns = {

              "automation_service": [
                  "automate",
                  "automation",
                  "manual",
                  "repetitive",
                  "workflow",
                  "process"
              ],

              "information_service": [
                  "information",
                  "data",
                  "research",
                  "knowledge",
                  "information gap",
                  "need to know"
              ],

              "collaboration_service": [
                  "collaborate",
                  "collaboration",
                  "partner",
                  "partnership",
                  "team",
                  "together"
              ],

              "technical_service": [
                  "code",
                  "coding",
                  "developer",
                  "development",
                  "api",
                  "software",
                  "bug",
                  "technical"
              ],

              "agent_support": [
                  "agent",
                  "agents",
                  "ai agent",
                  "bot",
                  "autonomous",
                  "autonomy"
              ],

              "marketplace_opportunity": [
                  "market",
                  "marketplace",
                  "buy",
                  "sell",
                  "service",
                  "product",
                  "customer"
              ],

              "financial_opportunity": [
                  "income",
                  "revenue",
                  "profit",
                  "payment",
                  "paid",
                  "earning",
                  "funding"
              ]
          }

          opportunity_scores = {}

          examples = {}

          for category in opportunity_patterns:
              opportunity_scores[category] = 0
              examples[category] = []

          analysed_posts = 0

          for post in posts:

              if not isinstance(post, dict):
                  continue

              analysed_posts += 1

              parts = []

              for key in (
                  "title",
                  "content",
                  "body",
                  "text"
              ):

                  value = post.get(key)

                  if isinstance(value, str):
                      parts.append(value)

              text = " ".join(parts)

              if not text:
                  continue

              lower = text.lower()

              for category, patterns in opportunity_patterns.items():

                  matches = [
                      pattern
                      for pattern in patterns
                      if pattern in lower
                  ]

                  if matches:

                      opportunity_scores[category] += len(
                          matches
                      )

                      if len(
                          examples[category]
                      ) < 3:

                          clean = re.sub(
                              r"\s+",
                              " ",
                              text
                          ).strip()

                          examples[category].append(
                              clean[:300]
                          )

          # ==========================================
          # 5. SCORE OPPORTUNITIES
          # ==========================================

          print("")
          print("[5/7] Scoring opportunities...")

          opportunities = []

          for category, score in sorted(
              opportunity_scores.items(),
              key=lambda item: item[1],
              reverse=True
          ):

              if score <= 0:
                  continue

              if analysed_posts > 0:

                  relevance = round(
                      (
                          score
                          / analysed_posts
                      ) * 100,
                      2
                  )

              else:

                  relevance = 0

              if relevance >= 15:

                  potential = "HIGH"

              elif relevance >= 7:

                  potential = "MEDIUM"

              else:

                  potential = "LOW"

              opportunities.append(
                  {
                      "opportunity": category,
                      "score": score,
                      "relevance_percent": relevance,
                      "potential": potential,
                      "examples": examples[category]
                  }
              )

          # ==========================================
          # 6. BUILD REPORT
          # ==========================================

          print("")
          print("[6/7] Building opportunity report...")

          report = {
              "version": "V14",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "posts_analysed": analysed_posts,
              "opportunities_detected": len(
                  opportunities
              ),
              "opportunities": opportunities
          }

          previous_reports = load_json(
              v14_file,
              []
          )

          previous_reports.append(report)

          previous_reports = previous_reports[-20:]

          v14_file.write_text(
              json.dumps(
                  previous_reports,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # 7. UPDATE MEMORY
          # ==========================================

          print("")
          print("[7/7] Updating NØX memory...")

          memory["last_v14_analysis"] = (
              report["timestamp"]
          )

          memory["v14"] = {
              "posts_analysed": analysed_posts,
              "opportunities_detected": len(
                  opportunities
              ),
              "top_opportunities": [
                  item["opportunity"]
                  for item in opportunities[:10]
              ],
              "highest_potential": [
                  item["opportunity"]
                  for item in opportunities
                  if item["potential"] == "HIGH"
              ]
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # SUCCESS
          # ==========================================

          print("")
          print("======================================")
          print("NØX V14 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Posts analysed       : {analysed_posts}"
          )

          print(
              f"Opportunities found  : "
              f"{len(opportunities)}"
          )

          print("")
          print("Opportunity ranking:")

          for item in opportunities:

              print(
                  f"  - "
                  f"{item['opportunity']} | "
                  f"score={item['score']} | "
                  f"relevance={item['relevance_percent']}% | "
                  f"potential={item['potential']}"
              )

          PY

      - name: Commit NØX V14 knowledge
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v14_opportunities.json

          if git diff --cached --quiet; then
            echo "No new V14 knowledge to commit."
          else
            git commit -m "NØX V14 opportunity engine"
            git push
          fi
