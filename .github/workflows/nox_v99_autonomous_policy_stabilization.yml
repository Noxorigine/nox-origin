name: NØX V99 Final Autonomous Core

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v99-final-autonomous-core
  cancel-in-progress: false

jobs:
  final-autonomous-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V99 Final Autonomous Core
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load(name):
              path = MEMORY / name
              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def num(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def integer(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def clamp(value):
              return max(0.0, min(100.0, value))

          now = datetime.now(timezone.utc).isoformat()

          # =========================================================
          # LOAD PREVIOUS EVOLUTION
          # =========================================================

          v98 = load(
              "nox_v98_autonomous_correction_arbitration.json"
          )

          v97 = load(
              "nox_v97_deployment_result_learning.json"
          )

          v96 = load(
              "nox_v96_controlled_correction_deployment.json"
          )

          v95 = load(
              "nox_v95_controlled_correction_arbitration.json"
          )

          v94 = load(
              "nox_v94_controlled_live_comparison.json"
          )

          v93 = load(
              "nox_v93_autonomous_self_correction_validation.json"
          )

          v92 = load(
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          previous = load(
              "nox_v99_final_autonomous_core.json"
          )

          # =========================================================
          # V98 DECISION
          # =========================================================

          decision = str(
              v98.get("autonomous_decision")
              or v98.get("decision")
              or v98.get("arbitration", {}).get("decision")
              or "COLLECT_MORE_EVIDENCE"
          )

          arbitration_quality = str(
              v98.get("arbitration_quality")
              or v98.get("arbitration", {}).get("quality")
              or "UNCERTAIN"
          )

          v98_score = num(
              v98.get("arbitration_score")
              or v98.get("score")
              or v98.get("arbitration", {}).get("score"),
              0
          )

          v98_confidence = num(
              v98.get("confidence")
              or v98.get("arbitration", {}).get("confidence"),
              0.25
          )

          correction_id = str(
              v98.get("correction_id")
              or v96.get("correction_id")
              or v92.get("selected_correction", {}).get("id")
              or "NONE"
          )

          correction_name = str(
              v98.get("correction_name")
              or v96.get("correction_name")
              or v92.get("selected_correction", {}).get("name")
              or "NONE"
          )

          # =========================================================
          # LIVE EVIDENCE
          # =========================================================

          live = v97.get("live_validation", {})
          measurement = v97.get("measurement", {})
          signals = v97.get("signals", {})

          total_measured = integer(
              live.get("total_measured")
              or measurement.get("total_measured"),
              0
          )

          decisions_changed = integer(
              measurement.get("decisions_changed")
              or live.get("decisions_changed"),
              0
          )

          useful_changes = integer(
              signals.get("useful_changes")
              or measurement.get("useful_changes"),
              0
          )

          harmful_changes = integer(
              signals.get("harmful_changes")
              or measurement.get("harmful_changes"),
              0
          )

          atypical_preserved = integer(
              signals.get("atypical_preserved")
              or measurement.get("atypical_preserved"),
              0
          )

          completed_excluded = integer(
              signals.get("completed_excluded")
              or measurement.get("completed_excluded"),
              0
          )

          over_pruning = bool(
              measurement.get("over_pruning")
              or live.get("over_pruning")
          )

          under_pruning = bool(
              measurement.get("under_pruning")
              or live.get("under_pruning")
          )

          deployment_health = str(
              v97.get("deployment_health")
              or measurement.get("deployment_health")
              or "UNKNOWN"
          )

          # =========================================================
          # HISTORICAL STABILITY
          # =========================================================

          v91_metrics = v91.get("metrics", {})

          stability_overall = num(
              v91_metrics.get("overall_stability")
              or v91.get("overall_stability"),
              0
          )

          stability_evidence = num(
              v91_metrics.get("evidence_stability")
              or v91.get("evidence_stability"),
              0
          )

          stability_strategy = num(
              v91_metrics.get("strategy_stability")
              or v91.get("strategy_stability"),
              0
          )

          previous_cycle = integer(
              previous.get("final_cycle")
              or previous.get("stabilization_cycle"),
              0
          )

          previous_decision = str(
              previous.get("inherited_decision", {}).get("decision")
              or previous.get("decision")
              or "NO_PREVIOUS_DECISION"
          )

          previous_confidence = num(
              previous.get("inherited_decision", {}).get("confidence")
              or previous.get("confidence"),
              0
          )

          previous_correction = str(
              previous.get("inherited_decision", {}).get("correction_id")
              or previous.get("correction_id")
              or "NONE"
          )

          same_correction = (
              correction_id != "NONE"
              and correction_id == previous_correction
          )

          decision_consistent = (
              previous_decision != "NO_PREVIOUS_DECISION"
              and decision == previous_decision
          )

          confidence_consistent = (
              previous_confidence == 0
              or abs(
                  v98_confidence - previous_confidence
              ) <= 0.15
          )

          # =========================================================
          # EVIDENCE QUALITY
          # =========================================================

          evidence_quality = 0.0

          if total_measured >= 3:
              evidence_quality += 25

          if total_measured >= 5:
              evidence_quality += 15

          if harmful_changes == 0:
              evidence_quality += 20

          if completed_excluded > 0:
              evidence_quality += 10

          if atypical_preserved > 0:
              evidence_quality += 10

          if not over_pruning:
              evidence_quality += 10

          if not under_pruning:
              evidence_quality += 10

          evidence_quality = clamp(
              evidence_quality
          )

          # =========================================================
          # FINAL STABILITY
          # =========================================================

          stability_score = (
              v98_confidence * 100 * 0.30
              + stability_overall * 100 * 0.20
              + stability_evidence * 100 * 0.15
              + stability_strategy * 100 * 0.10
              + evidence_quality * 0.25
          )

          if decision_consistent:
              stability_score += 5

          if same_correction:
              stability_score += 5

          if not confidence_consistent:
              stability_score -= 10

          if harmful_changes > 0:
              stability_score -= 30

          if over_pruning or under_pruning:
              stability_score -= 15

          stability_score = clamp(
              stability_score
          )

          # =========================================================
          # FINAL STATE
          # =========================================================

          if harmful_changes > 0:
              final_state = "SAFE_ROLLBACK_REQUIRED"
              autonomy_level = "LEARNING_ONLY"

          elif over_pruning or under_pruning:
              final_state = "REFINEMENT_REQUIRED"
              autonomy_level = "LEARNING_AND_PROPOSAL"

          elif stability_score >= 80:
              final_state = "FINAL_AUTONOMOUS_CORE_STABLE"
              autonomy_level = "AUTONOMOUS_DECISION_SUPPORT"

          elif stability_score >= 70:
              final_state = "FINAL_AUTONOMOUS_CORE_MONITORED"
              autonomy_level = "AUTONOMOUS_DECISION_SUPPORT"

          else:
              final_state = "FINAL_CORE_REQUIRES_MORE_EVIDENCE"
              autonomy_level = "LEARNING_ONLY"

          # =========================================================
          # AUTONOMOUS CAPABILITIES
          # =========================================================

          autonomous_capabilities = {
              "observe": True,
              "collect_evidence": True,
              "learn_from_results": True,
              "evaluate_outcomes": True,
              "compare_previous_states": True,
              "prioritize": True,
              "arbitrate": True,
              "select_policy": True,
              "detect_regression": True,
              "detect_refinement_need": True,
              "propose_next_evolution": True,
              "maintain_memory": True,
              "rollback_awareness": True,

              "autonomous_decision_support": True,

              "permanent_self_modification": False,
              "automatic_external_action": False,
              "automatic_payment": False,
              "automatic_bidding": False,
              "automatic_dm": False,

              "human_override": True
          }

          # =========================================================
          # FINAL RESULT
          # =========================================================

          result = {
              "version": "V99_FINAL",

              "generated_at": now,

              "mode": "final_autonomous_core",

              "objective": (
                  "Establish the final autonomous decision "
                  "architecture of NØX through observation, "
                  "evidence, learning, prioritization, "
                  "arbitration, memory and controlled evolution."
              ),

              "final_cycle": previous_cycle + 1,

              "decision_input": {
                  "source_version": "V98",
                  "decision": decision,
                  "arbitration_quality": arbitration_quality,
                  "arbitration_score": round(
                      v98_score,
                      2
                  ),
                  "confidence": round(
                      v98_confidence,
                      3
                  ),
                  "correction_id": correction_id,
                  "correction_name": correction_name
              },

              "live_evidence": {
                  "total_measured": total_measured,
                  "decisions_changed": decisions_changed,
                  "useful_changes": useful_changes,
                  "harmful_changes": harmful_changes,
                  "atypical_preserved": atypical_preserved,
                  "completed_excluded": completed_excluded,
                  "over_pruning": over_pruning,
                  "under_pruning": under_pruning,
                  "deployment_health": deployment_health
              },

              "historical_stability": {
                  "overall": round(
                      stability_overall,
                      3
                  ),
                  "evidence": round(
                      stability_evidence,
                      3
                  ),
                  "strategy": round(
                      stability_strategy,
                      3
                  )
              },

              "continuity": {
                  "previous_cycle": previous_cycle,
                  "same_correction": same_correction,
                  "decision_consistent": decision_consistent,
                  "confidence_consistent": confidence_consistent
              },

              "final_evaluation": {
                  "evidence_quality": round(
                      evidence_quality,
                      2
                  ),
                  "stability_score": round(
                      stability_score,
                      2
                  ),
                  "final_state": final_state,
                  "autonomy_level": autonomy_level
              },

              "autonomous_capabilities":
                  autonomous_capabilities,

              "decision_policy": {
                  "observe_before_act": True,
                  "evidence_before_change": True,
                  "learn_from_results": True,
                  "prioritize_based_on_evidence": True,
                  "arbitrate_before_selection": True,
                  "preserve_rollback": True,
                  "avoid_irreversible_changes": True,
                  "human_override": True
              },

              "finality": {
                  "v100_required": False,
                  "v99_final": True,
                  "final_stage": "V99_FINAL",
                  "objective": (
                      "Final autonomous architecture established."
                  ),
                  "future_evolution": (
                      "Only controlled, evidence-based evolution "
                      "after V99_FINAL."
                  )
              },

              "scope": {
                  "external_action": False,
                  "publication": False,
                  "contact": False,
                  "bidding": False,
                  "payments": False,
                  "gemini": False,
                  "project_cost_eur": 0
              },

              "safety": {
                  "zero_cost_constraint": True,
                  "gemini_disabled": True,
                  "baseline_preserved": True,
                  "rollback_available": True,
                  "no_irreversible_change": True,
                  "no_automatic_payment": True,
                  "no_automatic_bidding": True,
                  "no_automatic_dm": True,
                  "human_override": True
              }
          }

          # =========================================================
          # SAVE JSON
          # =========================================================

          json_path = MEMORY / (
              "nox_v99_final_autonomous_core.json"
          )

          json_path.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # =========================================================
          # SAVE MARKDOWN REPORT
          # =========================================================

          md_path = MEMORY / (
              "nox_v99_final_autonomous_core.md"
          )

          markdown = [
              "# NØX Origin — V99 FINAL Autonomous Core",
              "",
              f"Generated: {now}",
              "",
              "## Final state",
              "",
              f"State: {final_state}",
              "",
              f"Autonomy level: {autonomy_level}",
              "",
              f"Stability score: {stability_score:.2f}",
              "",
              f"Evidence quality: {evidence_quality:.2f}",
              "",
              "## Decision",
              "",
              f"Decision inherited from V98: {decision}",
              "",
              f"Arbitration quality: {arbitration_quality}",
              "",
              f"Correction ID: {correction_id}",
              "",
              f"Correction name: {correction_name}",
              "",
              "## Evidence",
              "",
              f"Total measured: {total_measured}",
              "",
              f"Decisions changed: {decisions_changed}",
              "",
              f"Useful changes: {useful_changes}",
              "",
              f"Harmful changes: {harmful_changes}",
              "",
              f"Atypical opportunities preserved: {atypical_preserved}",
              "",
              f"Completed work excluded: {completed_excluded}",
              "",
              f"Over-pruning: {over_pruning}",
              "",
              f"Under-pruning: {under_pruning}",
              "",
              f"Deployment health: {deployment_health}",
              "",
              "## Autonomous architecture",
              "",
              "Observation: ENABLED",
              "",
              "Evidence collection: ENABLED",
              "",
              "Learning from results: ENABLED",
              "",
              "Outcome evaluation: ENABLED",
              "",
              "Prioritization: ENABLED",
              "",
              "Arbitration: ENABLED",
              "",
              "Policy selection: ENABLED",
              "",
              "Regression detection: ENABLED",
              "",
              "Refinement detection: ENABLED",
              "",
              "Memory continuity: ENABLED",
              "",
              "Rollback awareness: ENABLED",
              "",
              "Evolution proposal: ENABLED",
              "",
              "## Safeguards",
              "",
              "Permanent self-modification: DISABLED",
              "",
              "Automatic external action: DISABLED",
              "",
              "Automatic payment: DISABLED",
              "",
              "Automatic bidding: DISABLED",
              "",
              "Automatic DM: DISABLED",
              "",
              "Gemini: DISABLED",
              "",
              "Human override: ENABLED",
              "",
              "Project cost: €0",
              "",
              "## Finality",
              "",
              "V99_FINAL replaces the planned V100 synthesis.",
              "",
              "No V100 workflow is required.",
              "",
              "Future evolution must remain controlled,",
              "evidence-based and reversible.",
              ""
          ]

          md_path.write_text(
              "\n".join(markdown),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

      - name: Commit V99 Final result
        shell: bash
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v99_final_autonomous_core.json
          git add memory/nox_v99_final_autonomous_core.md

          if git diff --cached --quiet; then
            echo "No V99 FINAL changes to commit."
          else
            git commit -m "NØX V99 final autonomous core"
            git push
          fi
