name: NØX LEDGER 02 - Cognition & Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "19 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  cognition-communication:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json
      COGNITION_FILE: memory/nox_ledger_cognition.json

      MAX_CONVERSATIONS: "10"
      MAX_PUBLIC_POSTS_PER_RUN: "1"
      MIN_EDITORIAL_SCORE: "70"

      MAX_COGNITIVE_KNOWLEDGE: "20"
      MAX_COGNITIVE_REVIEWS: "100"
      MAX_INSIGHTS: "300"
      MAX_UNCERTAINTIES: "200"
      MAX_RESEARCH_REQUESTS: "200"
      MAX_ACTION_CANDIDATES: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Run LEDGER 02
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          # =========================================================
          # CONFIGURATION
          # =========================================================

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]

          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )

          COGNITION_FILE = Path(
              os.environ["COGNITION_FILE"]
          )

          MAX_CONVERSATIONS = int(
              os.environ["MAX_CONVERSATIONS"]
          )

          MAX_PUBLIC_POSTS_PER_RUN = int(
              os.environ["MAX_PUBLIC_POSTS_PER_RUN"]
          )

          MIN_EDITORIAL_SCORE = int(
              os.environ["MIN_EDITORIAL_SCORE"]
          )

          MAX_COGNITIVE_KNOWLEDGE = int(
              os.environ["MAX_COGNITIVE_KNOWLEDGE"]
          )

          MAX_COGNITIVE_REVIEWS = int(
              os.environ["MAX_COGNITIVE_REVIEWS"]
          )

          MAX_INSIGHTS = int(
              os.environ["MAX_INSIGHTS"]
          )

          MAX_UNCERTAINTIES = int(
              os.environ["MAX_UNCERTAINTIES"]
          )

          MAX_RESEARCH_REQUESTS = int(
              os.environ["MAX_RESEARCH_REQUESTS"]
          )

          MAX_ACTION_CANDIDATES = int(
              os.environ["MAX_ACTION_CANDIDATES"]
          )

          GEMINI_ENABLED = False
          EXTERNAL_AI_ENABLED = False
          PAYMENTS_ENABLED = False
          SPENDING_ENABLED = False
          PROJECT_COST_EUR = 0

          now = datetime.now(
              timezone.utc
          ).isoformat()


          # =========================================================
          # JSON HELPERS
          # =========================================================

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"LOAD WARNING {path}: {exc}"
                  )
                  return default


          def save(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              temporary.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              temporary.replace(path)


          knowledge = load(
              KNOWLEDGE_FILE,
              {
                  "knowledge": [],
                  "gaps": []
              }
          )

          cognition = load(
              COGNITION_FILE,
              {
                  "version": "2.0",
                  "processed_messages": [],
                  "processed_knowledge": [],
                  "cognitive_reviews": [],
                  "insights": [],
                  "uncertainties": [],
                  "research_requests": [],
                  "action_candidates": [],
                  "experiences": [],
                  "corrections": [],
                  "successful_patterns": [],
                  "failures": [],
                  "public_publications": [],
                  "stats": {}
              }
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {
                  "knowledge": [],
                  "gaps": []
              }

          if not isinstance(
              cognition,
              dict
          ):
              cognition = {}


          # Preserve old memory fields if upgrading
          cognition.setdefault(
              "version",
              "2.0"
          )

          cognition.setdefault(
              "processed_messages",
              []
          )

          cognition.setdefault(
              "processed_knowledge",
              []
          )

          cognition.setdefault(
              "cognitive_reviews",
              []
          )

          cognition.setdefault(
              "insights",
              []
          )

          cognition.setdefault(
              "uncertainties",
              []
          )

          cognition.setdefault(
              "research_requests",
              []
          )

          cognition.setdefault(
              "action_candidates",
              []
          )

          cognition.setdefault(
              "experiences",
              []
          )

          cognition.setdefault(
              "corrections",
              []
          )

          cognition.setdefault(
              "successful_patterns",
              []
          )

          cognition.setdefault(
              "failures",
              []
          )

          cognition.setdefault(
              "public_publications",
              []
          )

          cognition.setdefault(
              "stats",
              {}
          )


          # =========================================================
          # HTTP SESSION
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-Cognition/2.0"
          })


          def auth():
              try:
                  response = session.post(
                      BASE + "/api/v1/auth/token",
                      json={
                          "api_key": KEY
                      },
                      timeout=15
                  )

                  if not response.ok:
                      print(
                          "AUTH FAILED: "
                          f"HTTP {response.status_code}"
                      )
                      return False

                  data = response.json()

                  token = (
                      data.get("access_token")
                      or data.get("token")
                  )

                  if not token:
                      print(
                          "AUTH FAILED: "
                          "no access token returned"
                      )
                      return False

                  session.headers[
                      "Authorization"
                  ] = "Bearer " + token

                  return True

              except Exception as exc:
                  print(
                      f"AUTH ERROR: {exc}"
                  )
                  return False


          auth()


          def get(path, params=None):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and auth()
                  ):
                      response = session.get(
                          BASE + path,
                          params=params,
                          timeout=20
                      )

                  if response.ok:
                      try:
                          return response.json()
                      except Exception:
                          return None

                  print(
                      f"GET {path}: "
                      f"HTTP {response.status_code}"
                  )

              except Exception as exc:
                  print(
                      f"GET ERROR {path}: {exc}"
                  )

              return None


          def post(path, payload):
              try:
                  response = session.post(
                      BASE + path,
                      json=payload,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and auth()
                  ):
                      response = session.post(
                          BASE + path,
                          json=payload,
                          timeout=20
                      )

                  return response

              except Exception as exc:
                  print(
                      f"POST ERROR {path}: {exc}"
                  )

                  return None


          # =========================================================
          # TEXT / FINGERPRINT HELPERS
          # =========================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, dict):
                  return " ".join(
                      text(v)
                      for v in value.values()
                  )

              if isinstance(value, list):
                  return " ".join(
                      text(v)
                      for v in value
                  )

              return str(value)


          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()


          def tokens(value):
              return {
                  token.lower()
                  for token in re.findall(
                      r"[A-Za-zÀ-ÿ0-9_]{4,}",
                      clean(value)
                  )
              }


          def fingerprint(value):
              normalized = " ".join(
                  clean(value).lower().split()
              )

              return hashlib.sha256(
                  normalized.encode(
                      "utf-8"
                  )
              ).hexdigest()[:20]


          def contains_any(value, terms):
              lower = clean(value).lower()

              return any(
                  term in lower
                  for term in terms
              )


          # =========================================================
          # IDENTITY
          # =========================================================

          me = get(
              "/api/v1/users/me"
          ) or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          user_id = (
              me.get("id")
              or me.get("user_id")
          )

          print(
              f"IDENTITY: {username}"
          )

          if user_id:
              print(
                  f"USER ID: {user_id}"
              )


          # =========================================================
          # KNOWLEDGE NORMALIZATION
          # =========================================================

          knowledge_items = knowledge.get(
              "knowledge",
              []
          )

          if not isinstance(
              knowledge_items,
              list
          ):
              knowledge_items = []


          def knowledge_text(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              return clean(
                  " ".join([
                      text(
                          item.get(
                              "claim",
                              ""
                          )
                      ),
                      text(
                          item.get(
                              "title",
                              ""
                          )
                      ),
                      text(
                          item.get(
                              "excerpt",
                              ""
                          )
                      ),
                      text(
                          item.get(
                              "query",
                              ""
                          )
                      ),
                      text(
                          item.get(
                              "source_domain",
                              ""
                          )
                      )
                  ])
              )


          def knowledge_id(item):
              if not isinstance(
                  item,
                  dict
              ):
                  return ""

              return (
                  text(
                      item.get(
                          "fingerprint"
                      )
                  )
                  or fingerprint(
                      knowledge_text(item)
                  )
              )


          # =========================================================
          # KNOWLEDGE RELEVANCE
          # =========================================================

          def relevant_knowledge(
              query,
              limit=5
          ):
              query_tokens = tokens(
                  query
              )

              scored = []

              for item in knowledge_items:

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  corpus = knowledge_text(
                      item
                  )

                  overlap = len(
                      query_tokens
                      & tokens(corpus)
                  )

                  verification = clean(
                      item.get(
                          "verification_status",
                          ""
                      )
                  )

                  score = overlap

                  if (
                      verification
                      == "UNVERIFIED_EXTERNAL_SOURCE"
                  ):
                      score += 0

                  if (
                      item.get(
                          "requires_cross_check"
                      )
                      is False
                  ):
                      score += 1

                  if score > 0:
                      scored.append(
                          (
                              score,
                              item
                          )
                      )

              scored.sort(
                  key=lambda pair: pair[0],
                  reverse=True
              )

              return [
                  item
                  for _, item
                  in scored[:limit]
              ]


          # =========================================================
          # AUTONOMOUS COGNITION
          #
          # No external AI.
          # Deterministic evidence-based reasoning only.
          # =========================================================

          processed_knowledge = set(
              str(value)
              for value in cognition.get(
                  "processed_knowledge",
                  []
              )
          )


          new_knowledge = []

          for item in knowledge_items:

              kid = knowledge_id(item)

              if not kid:
                  continue

              if kid not in processed_knowledge:
                  new_knowledge.append(
                      item
                  )


          new_knowledge = new_knowledge[
              -MAX_COGNITIVE_KNOWLEDGE:
          ]


          print(
              f"KNOWLEDGE AVAILABLE: "
              f"{len(knowledge_items)}"
          )

          print(
              f"NEW KNOWLEDGE FOR COGNITION: "
              f"{len(new_knowledge)}"
          )


          # ---------------------------------------------------------
          # Build a combined knowledge context
          # ---------------------------------------------------------

          combined_tokens = set()

          for item in new_knowledge:
              combined_tokens.update(
                  tokens(
                      knowledge_text(item)
                  )
              )


          # ---------------------------------------------------------
          # Source / verification analysis
          # ---------------------------------------------------------

          source_domains = {}

          unverified_count = 0

          verified_count = 0

          for item in new_knowledge:

              domain = clean(
                  item.get(
                      "source_domain",
                      ""
                  )
              ) or "unknown"

              source_domains[
                  domain
              ] = (
                  source_domains.get(
                      domain,
                      0
                  )
                  + 1
              )

              status = clean(
                  item.get(
                      "verification_status",
                      ""
                  )
              )

              if status == (
                  "UNVERIFIED_EXTERNAL_SOURCE"
              ):
                  unverified_count += 1
              else:
                  verified_count += 1


          dominant_domains = sorted(
              source_domains.items(),
              key=lambda pair: pair[1],
              reverse=True
          )


          # ---------------------------------------------------------
          # Topic detection
          # ---------------------------------------------------------

          TOPICS = {
              "agent_economy": [
                  "agent",
                  "agents",
                  "economy",
                  "marketplace",
                  "task",
                  "work",
                  "payment",
                  "reward",
                  "tip"
              ],
              "research_evidence": [
                  "research",
                  "evidence",
                  "knowledge",
                  "source",
                  "verification",
                  "verify",
                  "cross-check"
              ],
              "communication": [
                  "communication",
                  "conversation",
                  "message",
                  "community",
                  "discussion",
                  "question",
                  "reply"
              ],
              "autonomy": [
                  "autonomous",
                  "autonomy",
                  "agent",
                  "automation",
                  "workflow"
              ],
              "lightning": [
                  "lightning",
                  "sats",
                  "bitcoin",
                  "payment",
                  "tip"
              ],
              "a2a": [
                  "a2a",
                  "agent-to-agent",
                  "protocol",
                  "operator"
              ],
              "solana": [
                  "solana",
                  "usdt",
                  "token",
                  "wallet"
              ],
              "colony": [
                  "colony",
                  "thecolony"
              ]
          }


          topic_scores = {}

          combined_text = " ".join(
              knowledge_text(item)
              for item in new_knowledge
          ).lower()


          for topic, topic_terms in TOPICS.items():

              score = sum(
                  1
                  for term in topic_terms
                  if term in combined_text
              )

              if score:
                  topic_scores[
                      topic
                  ] = score


          ranked_topics = sorted(
              topic_scores.items(),
              key=lambda pair: pair[1],
              reverse=True
          )


          # ---------------------------------------------------------
          # Insight generation
          # ---------------------------------------------------------

          insights_created = []

          for topic, score in ranked_topics[:5]:

              related = [
                  item
                  for item in new_knowledge
                  if any(
                      term in knowledge_text(
                          item
                      ).lower()
                      for term in TOPICS[topic]
                  )
              ]

              if not related:
                  continue

              domains = sorted({
                  clean(
                      item.get(
                          "source_domain",
                          ""
                      )
                  )
                  for item in related
                  if clean(
                      item.get(
                          "source_domain",
                          ""
                      )
                  )
              })

              insight_fingerprint = fingerprint(
                  topic,
                  " ".join(
                      domains
                  ),
                  str(score)
              )

              existing = {
                  item.get(
                      "fingerprint"
                  )
                  for item in cognition[
                      "insights"
                  ]
                  if isinstance(
                      item,
                      dict
                  )
              }

              if (
                  insight_fingerprint
                  in existing
              ):
                  continue

              statement = (
                  f"Current evidence cluster: "
                  f"{topic.replace('_', ' ')}. "
                  f"{len(related)} relevant "
                  f"knowledge entries were found."
              )

              if len(domains) > 1:
                  statement += (
                      " Evidence currently spans "
                      f"{len(domains)} source domains."
                  )
              elif len(domains) == 1:
                  statement += (
                      " Current evidence is "
                      "concentrated in one source "
                      "domain and should not yet be "
                      "treated as broadly validated."
                  )

              insight = {
                  "timestamp": now,
                  "type": "EVIDENCE_CLUSTER",
                  "topic": topic,
                  "score": score,
                  "statement": statement,
                  "related_entries": len(
                      related
                  ),
                  "source_domains": domains,
                  "confidence": (
                      0.65
                      if len(domains) >= 2
                      else 0.45
                  ),
                  "verification_required": (
                      len(domains) < 2
                  ),
                  "fingerprint": (
                      insight_fingerprint
                  )
              }

              cognition[
                  "insights"
              ].append(
                  insight
              )

              insights_created.append(
                  insight
              )


          # ---------------------------------------------------------
          # Uncertainty detection
          # ---------------------------------------------------------

          uncertainties_created = []

          if new_knowledge:

              if unverified_count:

                  uncertainty =
