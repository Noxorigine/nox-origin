name: NØX LEDGER 02 - Cognition & Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "19 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  cognition-communication:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json
      COGNITION_FILE: memory/nox_ledger_cognition.json

      MAX_CONVERSATIONS: "10"
      MAX_PUBLIC_POSTS_PER_RUN: "1"
      MIN_EDITORIAL_SCORE: "70"

      MAX_COGNITIVE_KNOWLEDGE: "20"
      MAX_COGNITIVE_REVIEWS: "100"
      MAX_INSIGHTS: "300"
      MAX_UNCERTAINTIES: "200"
      MAX_RESEARCH_REQUESTS: "200"
      MAX_ACTION_CANDIDATES: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Run LEDGER 02
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]

          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          COGNITION_FILE = Path(os.environ["COGNITION_FILE"])

          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_PUBLIC_POSTS_PER_RUN = int(os.environ["MAX_PUBLIC_POSTS_PER_RUN"])
          MIN_EDITORIAL_SCORE = int(os.environ["MIN_EDITORIAL_SCORE"])

          MAX_COGNITIVE_KNOWLEDGE = int(os.environ["MAX_COGNITIVE_KNOWLEDGE"])
          MAX_COGNITIVE_REVIEWS = int(os.environ["MAX_COGNITIVE_REVIEWS"])
          MAX_INSIGHTS = int(os.environ["MAX_INSIGHTS"])
          MAX_UNCERTAINTIES = int(os.environ["MAX_UNCERTAINTIES"])
          MAX_RESEARCH_REQUESTS = int(os.environ["MAX_RESEARCH_REQUESTS"])
          MAX_ACTION_CANDIDATES = int(os.environ["MAX_ACTION_CANDIDATES"])

          now = datetime.now(timezone.utc).isoformat()


          # ============================================================
          # JSON
          # ============================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"LOAD WARNING {path}: {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
              tmp.replace(path)


          knowledge = load_json(
              KNOWLEDGE_FILE,
              {"knowledge": [], "gaps": []}
          )

          cognition = load_json(
              COGNITION_FILE,
              {}
          )

          if not isinstance(knowledge, dict):
              knowledge = {"knowledge": [], "gaps": []}

          if not isinstance(cognition, dict):
              cognition = {}


          # Preserve existing memory while adding V2 structures.
          cognition.setdefault("version", "2.0")
          cognition.setdefault("processed_messages", [])
          cognition.setdefault("processed_knowledge", [])
          cognition.setdefault("cognitive_reviews", [])
          cognition.setdefault("insights", [])
          cognition.setdefault("uncertainties", [])
          cognition.setdefault("research_requests", [])
          cognition.setdefault("action_candidates", [])
          cognition.setdefault("experiences", [])
          cognition.setdefault("corrections", [])
          cognition.setdefault("successful_patterns", [])
          cognition.setdefault("failures", [])
          cognition.setdefault("public_publications", [])
          cognition.setdefault("stats", {})


          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-Cognition/2.0"
          })


          def authenticate():
              try:
                  response = session.post(
                      BASE + "/api/v1/auth/token",
                      json={"api_key": KEY},
                      timeout=15
                  )

                  if not response.ok:
                      print(f"AUTH FAILED: HTTP {response.status_code}")
                      return False

                  data = response.json()
                  token = data.get("access_token")

                  if not token:
                      print("AUTH FAILED: no access_token")
                      return False

                  session.headers["Authorization"] = "Bearer " + token
                  return True

              except Exception as exc:
                  print(f"AUTH ERROR: {exc}")
                  return False


          authenticate()


          def get(path, params=None):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=20
                  )

                  if response.status_code == 401 and authenticate():
                      response = session.get(
                          BASE + path,
                          params=params,
                          timeout=20
                      )

                  if response.ok:
                      try:
                          return response.json()
                      except Exception:
                          return None

                  print(f"GET {path}: HTTP {response.status_code}")

              except Exception as exc:
                  print(f"GET ERROR {path}: {exc}")

              return None


          def post(path, payload):
              try:
                  response = session.post(
                      BASE + path,
                      json=payload,
                      timeout=20
                  )

                  if response.status_code == 401 and authenticate():
                      response = session.post(
                          BASE + path,
                          json=payload,
                          timeout=20
                      )

                  return response

              except Exception as exc:
                  print(f"POST ERROR {path}: {exc}")
                  return None


          # ============================================================
          # TEXT HELPERS
          # ============================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, dict):
                  return " ".join(text(v) for v in value.values())

              if isinstance(value, list):
                  return " ".join(text(v) for v in value)

              return str(value)


          def clean(value):
              return re.sub(r"\s+", " ", text(value)).strip()


          def tokens(value):
              return {
                  token.lower()
                  for token in re.findall(
                      r"[A-Za-zÀ-ÿ0-9_]{4,}",
                      clean(value)
                  )
              }


          def fingerprint(*values):
              normalized = " ".join(
                  clean(value).lower()
                  for value in values
                  if clean(value)
              )

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:20]


          def has_any(value, terms):
              low = clean(value).lower()
              return any(term in low for term in terms)


          # ============================================================
          # IDENTITY
          # ============================================================

          me = get("/api/v1/users/me") or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          user_id = me.get("id") or me.get("user_id")

          print(f"IDENTITY: {username}")

          if user_id:
              print(f"USER ID: {user_id}")


          # ============================================================
          # KNOWLEDGE
          # ============================================================

          knowledge_items = knowledge.get("knowledge", [])

          if not isinstance(knowledge_items, list):
              knowledge_items = []


          def knowledge_text(item):
              if not isinstance(item, dict):
                  return ""

              return clean(" ".join([
                  text(item.get("claim")),
                  text(item.get("title")),
                  text(item.get("excerpt")),
                  text(item.get("query")),
                  text(item.get("source_domain")),
                  text(item.get("verification_status")),
                  text(item.get("evidence")),
                  text(item.get("topic"))
              ]))


          def knowledge_id(item):
              if not isinstance(item, dict):
                  return ""

              explicit = clean(
                  item.get("fingerprint")
                  or item.get("id")
                  or item.get("source_id")
              )

              if explicit:
                  return explicit

              return fingerprint(knowledge_text(item))


          def relevant_knowledge(query, limit=5):
              query_tokens = tokens(query)
              scored = []

              for item in knowledge_items:
                  if not isinstance(item, dict):
                      continue

                  corpus = knowledge_text(item)
                  overlap = len(query_tokens & tokens(corpus))

                  if overlap > 0:
                      scored.append((overlap, item))

              scored.sort(
                  key=lambda pair: pair[0],
                  reverse=True
              )

              return [
                  item
                  for _, item in scored[:limit]
              ]


          # ============================================================
          # AUTONOMOUS COGNITION
          # ============================================================

          processed_knowledge = {
              str(value)
              for value in cognition.get(
                  "processed_knowledge",
                  []
              )
          }

          new_knowledge = []

          for item in knowledge_items:
              kid = knowledge_id(item)

              if kid and kid not in processed_knowledge:
                  new_knowledge.append(item)

          new_knowledge = new_knowledge[-MAX_COGNITIVE_KNOWLEDGE:]

          print(f"KNOWLEDGE AVAILABLE: {len(knowledge_items)}")
          print(f"NEW KNOWLEDGE FOR COGNITION: {len(new_knowledge)}")


          # ------------------------------------------------------------
          # Source analysis
          # ------------------------------------------------------------

          source_domains = {}

          unverified_count = 0
          verified_count = 0

          for item in new_knowledge:
              domain = clean(item.get("source_domain")) or "unknown"

              source_domains[domain] = (
                  source_domains.get(domain, 0) + 1
              )

              status = clean(
                  item.get("verification_status")
                  or item.get("status")
              )

              if status == "UNVERIFIED_EXTERNAL_SOURCE":
                  unverified_count += 1
              else:
                  verified_count += 1


          # ------------------------------------------------------------
          # Topic detection
          # ------------------------------------------------------------

          TOPICS = {
              "agent_economy": [
                  "agent",
                  "agents",
                  "economy",
                  "marketplace",
                  "task",
                  "work",
                  "reward",
                  "payment",
                  "tip"
              ],
              "research_evidence": [
                  "research",
                  "evidence",
                  "knowledge",
                  "source",
                  "verification",
                  "verify",
                  "cross-check"
              ],
              "communication": [
                  "communication",
                  "conversation",
                  "message",
                  "community",
                  "discussion",
                  "question",
                  "reply"
              ],
              "autonomy": [
                  "autonomous",
                  "autonomy",
                  "automation",
                  "workflow"
              ],
              "lightning": [
                  "lightning",
                  "sats",
                  "bitcoin",
                  "payment",
                  "tip"
              ],
              "a2a": [
                  "a2a",
                  "agent-to-agent",
                  "protocol",
                  "operator"
              ],
              "solana": [
                  "solana",
                  "usdt",
                  "token",
                  "wallet"
              ],
              "colony": [
                  "colony",
                  "thecolony"
              ]
          }


          combined_text = " ".join(
              knowledge_text(item)
              for item in new_knowledge
          ).lower()

          topic_scores = {}

          for topic, terms in TOPICS.items():
              score = sum(
                  1
                  for term in terms
                  if term in combined_text
              )

              if score:
                  topic_scores[topic] = score

          ranked_topics = sorted(
              topic_scores.items(),
              key=lambda pair: pair[1],
              reverse=True
          )


          # ------------------------------------------------------------
          # Insights
          # ------------------------------------------------------------

          insights_created = []

          existing_insight_fps = {
              item.get("fingerprint")
              for item in cognition["insights"]
              if isinstance(item, dict)
          }

          for topic, score in ranked_topics[:5]:

              related = [
                  item
                  for item in new_knowledge
                  if any(
                      term in knowledge_text(item).lower()
                      for term in TOPICS[topic]
                  )
              ]

              if not related:
                  continue

              domains = sorted({
                  clean(item.get("source_domain"))
                  for item in related
                  if clean(item.get("source_domain"))
              })

              insight_fp = fingerprint(
                  "EVIDENCE_CLUSTER",
                  topic,
                  ",".join(domains)
              )

              if insight_fp in existing_insight_fps:
                  continue

              statement = (
                  "Current evidence cluster: "
                  + topic.replace("_", " ")
                  + ". "
                  + str(len(related))
                  + " relevant knowledge entries."
              )

              if len(domains) >= 2:
                  statement += (
                      " Evidence currently spans "
                      + str(len(domains))
                      + " source domains."
                  )
              else:
                  statement += (
                      " Evidence is currently concentrated "
                      "in one source domain and should not "
                      "yet be treated as broadly validated."
                  )

              insight = {
                  "timestamp": now,
                  "type": "EVIDENCE_CLUSTER",
                  "topic": topic,
                  "score": score,
                  "statement": statement,
                  "related_entries": len(related),
                  "source_domains": domains,
                  "confidence": 0.65 if len(domains) >= 2 else 0.45,
                  "verification_required": len(domains) < 2,
                  "fingerprint": insight_fp
              }

              cognition["insights"].append(insight)
              insights_created.append(insight)
              existing_insight_fps.add(insight_fp)


          # ------------------------------------------------------------
          # Uncertainties
          # ------------------------------------------------------------

          uncertainties_created = []

          existing_uncertainty_fps = {
              item.get("fingerprint")
              for item in cognition["uncertainties"]
              if isinstance(item, dict)
          }

          if new_knowledge and unverified_count > 0:

              uncertainty_fp = fingerprint(
                  "UNVERIFIED_EXTERNAL_EVIDENCE",
                  str(unverified_count)
              )

              if uncertainty_fp not in existing_uncertainty_fps:

                  uncertainty = {
                      "timestamp": now,
                      "type": "UNVERIFIED_EXTERNAL_EVIDENCE",
                      "count": unverified_count,
                      "statement": (
                          f"{unverified_count} new knowledge "
                          "entries are currently marked as "
                          "unverified external sources."
                      ),
                      "action": (
                          "Cross-check before treating the "
                          "information as established."
                      ),
                      "fingerprint": uncertainty_fp
                  }

                  cognition["uncertainties"].append(
                      uncertainty
                  )

                  uncertainties_created.append(
                      uncertainty
                  )


          if new_knowledge and len(source_domains) <= 1:

              concentration_fp = fingerprint(
                  "SOURCE_CONCENTRATION",
                  ",".join(source_domains.keys())
              )

              if concentration_fp not in existing_uncertainty_fps:

                  uncertainty = {
                      "timestamp": now,
                      "type": "SOURCE_CONCENTRATION",
                      "statement": (
                          "The current knowledge batch is "
                          "concentrated in one source domain."
                      ),
                      "action": (
                          "Seek independent sources before "
                          "increasing confidence."
                      ),
                      "fingerprint": concentration_fp
                  }

                  cognition["uncertainties"].append(
                      uncertainty
                  )

                  uncertainties_created.append(
                      uncertainty
                  )


          # ------------------------------------------------------------
          # Research requests
          # ------------------------------------------------------------

          research_requests_created = []

          existing_research_fps = {
              item.get("fingerprint")
              for item in cognition["research_requests"]
              if isinstance(item, dict)
          }

          for topic, score in ranked_topics[:3]:

              related = [
                  item
                  for item in new_knowledge
                  if any(
                      term in knowledge_text(item).lower()
                      for term in TOPICS[topic]
                  )
              ]

              if not related:
                  continue

              domains = {
                  clean(item.get("source_domain"))
                  for item in related
                  if clean(item.get("source_domain"))
              }

              needs_cross_check = (
                  len(domains) < 2
                  or any(
                      item.get("requires_cross_check") is True
                      for item in related
                  )
                  or any(
                      clean(
                          item.get("verification_status")
                          or item.get("status")
                      ) == "UNVERIFIED_EXTERNAL_SOURCE"
                      for item in related
                  )
              )

              if not needs_cross_check:
                  continue

              query = (
                  "independent evidence "
                  + topic.replace("_", " ")
                  + " verification real world results"
              )

              request_fp = fingerprint(
                  "RESEARCH_REQUEST",
                  query
              )

              if request_fp in existing_research_fps:
                  continue

              request = {
                  "timestamp": now,
                  "status": "pending",
                  "priority": "high" if score >= 3 else "normal",
                  "topic": topic,
                  "query": query,
                  "reason": (
                      "Current evidence requires "
                      "independent cross-checking."
                  ),
                  "source_domains_seen": sorted(domains),
                  "fingerprint": request_fp
              }

              cognition["research_requests"].append(request)
              research_requests_created.append(request)
              existing_research_fps.add(request_fp)


          # ------------------------------------------------------------
          # Action candidate
          # ------------------------------------------------------------

          action_candidates_created = []

          if new_knowledge:

              action_topic = (
                  ranked_topics[0][0]
                  if ranked_topics
                  else "knowledge"
              )

              action_fp = fingerprint(
                  "ACTION_CANDIDATE",
                  action_topic,
                  ",".join(sorted(source_domains))
              )

              existing_action_fps = {
                  item.get("fingerprint")
                  for item in cognition["action_candidates"]
                  if isinstance(item, dict)
              }

              if action_fp not in existing_action_fps:

                  candidate = {
                      "timestamp": now,
                      "status": "candidate",
                      "topic": action_topic,
                      "type": "EVIDENCE_DRIVEN_EXPLORATION",
                      "description": (
                          "Identify a small observable action "
                          "that can test whether the current "
                          "knowledge has practical value."
                      ),
                      "preconditions": [
                          "No spending required.",
                          "No payment required.",
                          "Capability fit must be checked.",
                          "Result must be observable."
                      ],
                      "source_knowledge_count": len(new_knowledge),
                      "fingerprint": action_fp
                  }

                  cognition["action_candidates"].append(candidate)
                  action_candidates_created.append(candidate)


          # ------------------------------------------------------------
          # Cognitive review
          # ------------------------------------------------------------

          if new_knowledge:

              cognition["cognitive_reviews"].append({
                  "timestamp": now,
                  "type": "AUTONOMOUS_KNOWLEDGE_REVIEW",
                  "knowledge_reviewed": len(new_knowledge),
                  "topics_detected": [
                      topic
                      for topic, _ in ranked_topics[:5]
                  ],
                  "source_domains": sorted(
                      source_domains.keys()
                  ),
                  "unverified_entries": unverified_count,
                  "verified_entries": verified_count,
                  "insights_created": len(insights_created),
                  "uncertainties_created": len(
                      uncertainties_created
                  ),
                  "research_requests_created": len(
                      research_requests_created
                  ),
                  "action_candidates_created": len(
                      action_candidates_created
                  ),
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0
              })


          # Mark knowledge processed only after cognitive review.
          for item in new_knowledge:
              kid = knowledge_id(item)
              if kid:
                  processed_knowledge.add(kid)

          cognition["processed_knowledge"] = list(
              processed_knowledge
          )[-1000:]


          # ============================================================
          # COMMUNICATION
          # ============================================================

          conversations = get(
              "/api/v1/messages/conversations"
          )

          if isinstance(conversations, dict):
              conversations = conversations.get(
                  "items",
                  conversations.get("conversations", [])
              )

          if not isinstance(conversations, list):
              conversations = []

          conversations = conversations[:MAX_CONVERSATIONS]

          processed_messages = {
              str(value)
              for value in cognition.get(
                  "processed_messages",
                  []
              )
          }

          replies = 0
          communication_failures = 0
          experiences = 0


          def build_reply(incoming, facts):

              fact_lines = []

              for item in facts[:3]:

                  claim = clean(item.get("claim"))

                  domain = clean(
                      item.get("source_domain")
                  )

                  status = clean(
                      item.get("verification_status")
                      or item.get("status")
                  )

                  if not claim:
                      continue

                  line = "- " + claim

                  if domain:
                      line += " — " + domain

                  if status:
                      line += " [" + status + "]"

                  fact_lines.append(line)

              if has_any(
                  incoming,
                  [
                      "what do you know",
                      "what have you learned",
                      "what changed"
                  ]
              ):

                  return (
                      "I'm separating what I have "
                      "evidence for from what remains "
                      "uncertain.\n\n"
                      "Relevant knowledge currently "
                      "retrieved:\n"
                      + (
                          "\n".join(fact_lines)
                          if fact_lines
                          else "- No sufficiently "
                               "relevant validated "
                               "entry yet."
                      )
                      + "\n\n"
                      "Retrieved sources are evidence "
                      "inputs, not automatically "
                      "validated truth."
                  )[:4500]

              if has_any(
                  incoming,
                  ["marketplace", "task", "bid"]
              ):

                  body = (
                      "I'm treating marketplace activity "
                      "as an evidence loop: identify a "
                      "real task, verify capability fit "
                      "and reward information, act only "
                      "when conditions are satisfied, "
                      "then observe the actual result."
                  )

                  if fact_lines:
                      body += (
                          "\n\nRelated evidence:\n"
                          + "\n".join(fact_lines)
                      )

                  return body[:4500]

              if has_any(
                  incoming,
                  ["research", "knowledge", "evidence"]
              ):

                  body = (
                      "I'm building evidence rather than "
                      "simply collecting information. "
                      "I distinguish retrieved sources "
                      "from information that has been "
                      "independently verified."
                  )

                  if fact_lines:
                      body += (
                          "\n\nRelevant entries:\n"
                          + "\n".join(fact_lines)
                      )

                  return body[:4500]

              if fact_lines:
                  return (
                      "I found a relevant connection "
                      "in my current knowledge state:\n\n"
                      + "\n".join(fact_lines)
                      + "\n\n"
                      "I'm treating this as context "
                      "rather than proof of the broader "
                      "conclusion."
                  )[:4500]

              return (
                  "I don't have enough relevant evidence "
                  "in my current memory to give a specific "
                  "answer yet. I'd rather mark that as an "
                  "information gap than invent certainty."
              )


          for conversation in conversations:

              if not isinstance(conversation, dict):
                  continue

              user_data = conversation.get("user")

              if not isinstance(user_data, dict):
                  user_data = {}

              other = (
                  conversation.get("username")
                  or conversation.get("other_username")
                  or user_data.get("username")
                  or conversation.get("handle")
              )

              if not other or str(other) == username:
                  continue

              other = str(other)

              thread = get(
                  "/api/v1/messages/conversations/"
                  + other
              )

              if isinstance(thread, dict):
                  messages = thread.get(
                      "messages",
                      thread.get("items", [])
                  )
              else:
                  messages = thread

              if not isinstance(messages, list):
                  continue

              incoming = None

              for message in reversed(messages):

                  if not isinstance(message, dict):
                      continue

                  mid = (
                      message.get("id")
                      or message.get("message_id")
                  )

                  sender_data = message.get("sender")

                  if not isinstance(sender_data, dict):
                      sender_data = {}

                  sender = (
                      message.get("sender_username")
                      or sender_data.get("username")
                      or message.get("from")
                  )

                  if not mid:
                      continue

                  if str(sender) == username:
                      continue

                  if str(mid) in processed_messages:
                      continue

                  incoming = message
                  break

              if not incoming:
                  continue

              mid = str(
                  incoming.get("id")
                  or incoming.get("message_id")
              )

              incoming_body = clean(
                  incoming.get("body")
                  or incoming.get("content")
                  or ""
              )

              processed_messages.add(mid)

              if not incoming_body:
                  cognition["uncertainties"].append({
                      "timestamp": now,
                      "type": "EMPTY_INCOMING_MESSAGE",
                      "message_id": mid,
                      "recipient": other
                  })
                  continue

              facts = relevant_knowledge(
                  incoming_body
              )

              reply_body = build_reply(
                  incoming_body,
                  facts
              )

              response = post(
                  "/api/v1/messages/send/" + other,
                  {"body": reply_body}
              )

              if (
                  response is None
                  or response.status_code not in {200, 201}
              ):

                  communication_failures += 1

                  cognition["failures"].append({
                      "timestamp": now,
                      "type": "COMMUNICATION_SEND_FAILURE",
                      "recipient": other,
                      "message_id": mid,
                      "status_code": (
                          response.status_code
                          if response
                          else None
                      )
                  })

                  continue

              verify = get(
                  "/api/v1/messages/conversations/"
                  + other
              )

              verified = False

              if isinstance(verify, dict):
                  verify_messages = verify.get(
                      "messages",
                      verify.get("items", [])
                  )
              else:
                  verify_messages = verify

              if isinstance(verify_messages, list):

                  for msg in reversed(verify_messages[-10:]):

                      if not isinstance(msg, dict):
                          continue

                      if clean(msg.get("body")) == clean(reply_body):
                          verified = True
                          break

              cognition["experiences"].append({
                  "timestamp": now,
                  "type": "COMMUNICATION",
                  "recipient": other,
                  "incoming_message_id": mid,
                  "facts_used": len(facts),
                  "verified": verified,
                  "response_fingerprint": fingerprint(
                      reply_body
                  )
              })

              if verified:
                  cognition["successful_patterns"].append({
                      "timestamp": now,
                      "pattern": (
                          "CONTEXTUAL_RESPONSE_WITH_EVIDENCE"
                      ),
                      "verified": True
                  })
              else:
                  cognition["failures"].append({
                      "timestamp": now,
                      "type": (
                          "COMMUNICATION_VERIFICATION_FAILURE"
                      ),
                      "recipient": other,
                      "message_id": mid
                  })

              replies += 1
              experiences += 1


          cognition["processed_messages"] = list(
              processed_messages
          )[-1000:]


          # ============================================================
          # PUBLIC EDITORIAL ACTION
          # ============================================================

          feed = get(
              "/api/v1/feed/for-you",
              {"limit": 30}
          ) or {}

          if isinstance(feed, dict):
              feed_items = feed.get(
                  "items",
                  feed.get("posts", [])
              )
          else:
              feed_items = feed

          if not isinstance(feed_items, list):
              feed_items = []

          already_published = {
              item.get("fingerprint")
              for item in cognition["public_publications"]
              if isinstance(item, dict)
          }

          candidate = None

          for item in feed_items:

              if not isinstance(item, dict):
                  continue

              title_source = clean(item.get("title"))
              body_source = clean(item.get("body"))
              combined = title_source + " " + body_source

              if not combined:
                  continue

              score = 0

              if has_any(
                  combined,
                  [
                      "research",
                      "evidence",
                      "agent economy",
                      "marketplace",
                      "autonomy",
                      "knowledge"
                  ]
              ):
                  score += 30

              if len(body_source) > 400:
                  score += 10

              facts = relevant_knowledge(
                  combined,
                  limit=5
              )

              if len(facts) >= 2:
                  score += 30

              if len(facts) >= 3:
                  score += 15

              fp = fingerprint(combined)

              if (
                  score >= MIN_EDITORIAL_SCORE
                  and fp not in already_published
              ):
                  candidate = (
                      item,
                      score,
                      facts,
                      fp
                  )
                  break


          publication = None

          if candidate and MAX_PUBLIC_POSTS_PER_RUN > 0:

              item, score, facts, fp = candidate

              source_title = clean(
                  item.get("title")
              ) or "Observed signal"

              title = (
                  "Evidence check: "
                  + source_title[:90]
              )

              evidence_lines = []

              for fact in facts[:3]:

                  claim = clean(
                      fact.get("claim")
                  ) or "Unspecified evidence"

                  domain = clean(
                      fact.get("source_domain")
                  ) or "source"

                  status = clean(
                      fact.get("verification_status")
                      or fact.get("status")
                  )

                  line = (
                      "- "
                      + claim
                      + " — "
                      + domain
                  )

                  if status:
                      line += " [" + status + "]"

                  evidence_lines.append(line)

              body = (
                  "I found a signal worth checking "
                  "rather than simply amplifying.\n\n"
                  "Observed topic: "
                  + source_title
                  + "\n\n"
                  "Related evidence currently stored "
                  "by NØX:\n"
                  + "\n".join(evidence_lines)
                  + "\n\n"
                  "Current status: these sources are "
                  "evidence inputs, not automatically "
                  "validated truth. The next step is "
                  "cross-checking and observing whether "
                  "the claim survives real interaction."
              )

              colonies = get("/api/v1/colonies")

              colony_id = None

              if isinstance(colonies, dict):
                  colonies = colonies.get(
                      "items",
                      colonies.get("colonies", [])
                  )

              if isinstance(colonies, list):

                  for colony in colonies:

                      if not isinstance(colony, dict):
                          continue

                      colony_name = clean(
                          colony.get("name")
                      ).lower()

                      if colony_name == "findings":
                          colony_id = colony.get("id")
                          break

              if colony_id:

                  response = post(
                      "/api/v1/posts",
                      {
                          "colony_id": colony_id,
                          "post_type": "finding",
                          "title": title,
                          "body": body,
                          "metadata": {
                              "confidence": 0.60,
                              "tags": [
                                  "nox",
                                  "research",
                                  "evidence",
                                  "agent-economy"
                              ]
                          }
                      }
                  )

                  if (
                      response is not None
                      and response.status_code in {200, 201}
                  ):

                      publication = {
                          "timestamp": now,
                          "fingerprint": fp,
                          "score": score,
                          "title": title,
                          "source_item_id": item.get("id"),
                          "facts_used": len(facts)
                      }

                      cognition[
                          "public_publications"
                      ].append(publication)

                  else:

                      cognition["failures"].append({
                          "timestamp": now,
                          "type": "PUBLICATION_FAILURE",
                          "status_code": (
                              response.status_code
                              if response
                              else None
                          ),
                          "title": title
                      })

              else:

                  cognition["uncertainties"].append({
                      "timestamp": now,
                      "type": "FINDINGS_COLONY_NOT_FOUND",
                      "candidate_title": title
                  })


          # ============================================================
          # TRIM MEMORY
          # ============================================================

          cognition["cognitive_reviews"] = (
              cognition["cognitive_reviews"]
              [-MAX_COGNITIVE_REVIEWS:]
          )

          cognition["insights"] = (
              cognition["insights"]
              [-MAX_INSIGHTS:]
          )

          cognition["uncertainties"] = (
              cognition["uncertainties"]
              [-MAX_UNCERTAINTIES:]
          )

          cognition["research_requests"] = (
              cognition["research_requests"]
              [-MAX_RESEARCH_REQUESTS:]
          )

          cognition["action_candidates"] = (
              cognition["action_candidates"]
              [-MAX_ACTION_CANDIDATES:]
          )

          cognition["experiences"] = (
              cognition["experiences"]
              [-500:]
          )

          cognition["corrections"] = (
              cognition["corrections"]
              [-200:]
          )

          cognition["successful_patterns"] = (
              cognition["successful_patterns"]
              [-200:]
          )

          cognition["failures"] = (
              cognition["failures"]
              [-200:]
          )

          cognition["public_publications"] = (
              cognition["public_publications"]
              [-100:]
          )


          # ============================================================
          # STATS
          # ============================================================

          cognition["version"] = "2.0"
          cognition["updated_at"] = now

          cognition["stats"] = {
              "messages_processed_this_run": replies,
              "communication_failures_this_run": (
                  communication_failures
              ),
              "experiences_this_run": experiences,
              "knowledge_entries_available": len(
                  knowledge_items
              ),
              "new_knowledge_reviewed": len(
                  new_knowledge
              ),
              "insights_created_this_run": len(
                  insights_created
              ),
              "uncertainties_created_this_run": len(
                  uncertainties_created
              ),
              "research_requests_created_this_run": len(
                  research_requests_created
              ),
              "action_candidates_created_this_run": len(
                  action_candidates_created
              ),
              "public_post_created": bool(publication),
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0
          }

          save_json(
              COGNITION_FILE,
              cognition
          )


          # ============================================================
          # RUN SUMMARY
          # ============================================================

          print("")
          print("======================================")
          print("=== NØX LEDGER 02 V2 COMPLETE ===")
          print("======================================")
          print(f"Identity: {username}")
          print(f"Knowledge available: {len(knowledge_items)}")
          print(f"New knowledge reviewed: {len(new_knowledge)}")
          print(f"Topics detected: {len(ranked_topics)}")
          print(f"Insights created: {len(insights_created)}")
          print(
              "Uncertainties created: "
              f"{len(uncertainties_created)}"
          )
          print(
              "Research requests created: "
              f"{len(research_requests_created)}"
          )
          print(
              "Action candidates created: "
              f"{len(action_candidates_created)}"
          )
          print(f"DM replies: {replies}")
          print(
              "Communication failures: "
              f"{communication_failures}"
          )
          print(f"Experiences: {experiences}")
          print(
              "Public publication: "
              + ("YES" if publication else "NO")
          )
          print(
              "Processed knowledge memory: "
              f"{len(cognition['processed_knowledge'])}"
          )
          print(
              "Cognitive reviews stored: "
              f"{len(cognition['cognitive_reviews'])}"
          )
          print(
              "Insights stored: "
              f"{len(cognition['insights'])}"
          )
          print(
              "Uncertainties stored: "
              f"{len(cognition['uncertainties'])}"
          )
          print(
              "Research requests stored: "
              f"{len(cognition['research_requests'])}"
          )
          print(
              "Action candidates stored: "
              f"{len(cognition['action_candidates'])}"
          )
          print("Gemini used: false")
          print("External AI used: false")
          print("Payments enabled: false")
          print("Spending enabled: false")
          print("Project cost EUR: 0")
          print("======================================")


          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_ledger_cognition.json

          if git diff --cached --quiet; then
            echo "No cognition changes to commit."
            exit 0
          fi

          git commit -m "feat: evolve NØX LEDGER 02 cognition"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              echo "Rebase failed."
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "ERROR: unable to push after 3 attempts."
          exit 1
