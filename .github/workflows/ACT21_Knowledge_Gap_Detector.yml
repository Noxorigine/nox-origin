name: NØX ACT21 V3 - Knowledge Gap Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  detect-knowledge-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACT21 V3 - Knowledge Gap Detection
        run: |
          python -u <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"
          OUTPUT = MEMORY_DIR / "nox_knowledge_gaps.json"
          CORE_FILE = MEMORY_DIR / "nox_knowledge_core.json"

          MAX_VALIDATED = 20
          MAX_CANDIDATES = 50
          MAX_SIGNALS = 250

          DOMAIN_KEYWORDS = {
              "virtual_economy": [
                  "economy", "economic", "marketplace", "market",
                  "payment", "payments", "reward", "rewards",
                  "sats", "bitcoin", "wallet", "earning", "earnings",
                  "tip", "tips", "bid", "bids", "task", "tasks",
                  "price", "value", "transaction", "trade", "trading"
              ],
              "cybersecurity": [
                  "security", "cybersecurity", "authentication", "auth",
                  "token", "jwt", "api key", "credential", "permission",
                  "privacy", "attack", "vulnerability", "threat",
                  "encryption", "access control", "rate limit"
              ],
              "ai_communities": [
                  "agent community", "community", "colonist", "agent exchange",
                  "collaboration", "communication", "comment", "comments",
                  "dm", "private message", "social", "reputation",
                  "trust", "followers", "interaction"
              ],
              "agent_intelligence_autonomy": [
                  "agent", "autonomy", "autonomous", "decision",
                  "learning", "memory", "reasoning", "attention",
                  "curiosity", "knowledge", "planning", "goal",
                  "self-management", "self evaluation", "adaptation"
              ],
              "emerging_tech": [
                  "technology", "emerging", "innovation", "ai",
                  "artificial intelligence", "machine learning",
                  "robotics", "software", "computing", "model"
              ],
              "laws_regulation": [
                  "law", "laws", "regulation", "regulations",
                  "legal", "legislation", "policy", "compliance",
                  "rights", "liability", "governance", "ai act"
              ],
              "science": [
                  "science", "scientific", "physics", "biology",
                  "chemistry", "astronomy", "research"
              ],
              "history": [
                  "history", "historical", "ancient", "century",
                  "war", "civilization", "empire"
              ],
              "programming": [
                  "python", "javascript", "github", "workflow",
                  "yaml", "json", "code", "programming", "repository",
                  "commit", "branch", "software development"
              ],
              "current_events": [
                  "today", "current", "recent", "news", "event",
                  "election", "announcement", "latest"
              ]
          }

          # Terms that are structural/technical noise rather than knowledge.
          NOISE_TERMS = {
              "true", "false", "null", "none", "json", "yaml",
              "memory", "file", "files", "value", "values",
              "key", "keys", "field", "fields", "object", "objects",
              "id", "ids", "uuid", "url", "http", "https",
              "post_id", "comment_id", "source_comment_id",
              "claim_id", "author", "title", "content", "body",
              "created_at", "updated_at", "timestamp",
              "status", "type", "category", "score", "count",
              "date", "time", "name", "text", "data",
              "unknown", "not", "one", "two", "three",
              "get", "set", "run", "result", "results"
          }

          # Phrases that indicate an explicit CURRENT knowledge limitation.
          CURRENT_GAP_PATTERNS = [
              r"\bnøx\s+(?:does not|doesn't|cannot|can't|has not|hasn't)\s+(?:know|understand|determine|identify|explain)",
              r"\bnøx\s+(?:still\s+)?(?:does not|doesn't|cannot|can't)\b",
              r"\bcurrently\s+(?:unknown|unclear|uncertain|unresolved)\b",
              r"\b(?:currently|at present|right now)\s+(?:we|nøx)\s+(?:do not|don't|cannot|can't|lack)\b",
              r"\bknowledge\s+gap\b",
              r"\bknown\s+gap\b",
              r"\bmissing\s+knowledge\b",
              r"\bknowledge\s+is\s+(?:missing|incomplete|weak)\b",
              r"\b(?:we|nøx)\s+(?:need|needs)\s+to\s+learn\b",
              r"\b(?:we|nøx)\s+(?:need|needs)\s+to\s+understand\b",
              r"\b(?:we|nøx)\s+(?:do not|don't)\s+know\b",
              r"\b(?:we|nøx)\s+(?:cannot|can't)\s+explain\b",
              r"\b(?:we|nøx)\s+(?:cannot|can't)\s+determine\b"
          ]

          # Weaker phrases are retained as signals only unless reinforced.
          WEAK_UNCERTAINTY_PATTERNS = [
              r"\buncertain\b",
              r"\bunclear\b",
              r"\bunknown\b",
              r"\bnot\s+clear\b",
              r"\bneeds?\s+verification\b",
              r"\bneed(?:s)?\s+to\s+verify\b",
              r"\bverify\s+independently\b",
              r"\brequires?\s+verification\b",
              r"\bnot\s+yet\s+verified\b"
          ]

          CONTRADICTION_PATTERNS = [
              r"\bcontradict(?:s|ed|ion|ory)?\b",
              r"\bconflict(?:s|ed|ing)?\b",
              r"\binconsistent\b",
              r"\b(?:one|another)\s+(?:source|claim|document)\s+says\b",
              r"\bhowever\b",
              r"\bwhereas\b",
              r"\bon\s+the\s+other\s+hand\b",
              r"\bbut\s+another\b"
          ]

          HISTORICAL_MARKERS = [
              "previously", "earlier", "historically", "at that time",
              "during act", "in act", "past run", "old run",
              "was detected", "were detected", "had to verify",
              "needed verification", "we verified", "was verified",
              "has been verified", "already verified", "resolved",
              "fixed", "successfully confirmed"
          ]

          def flatten_json(obj):
              if isinstance(obj, dict):
                  parts = []
                  for k, v in obj.items():
                      parts.append(str(k))
                      parts.extend(flatten_json(v))
                  return parts
              if isinstance(obj, list):
                  parts = []
                  for item in obj:
                      parts.extend(flatten_json(item))
                  return parts
              return [str(obj)]

          def normalize_text(text):
              text = text.lower()
              text = text.replace("’", "'")
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def clean_phrase(text):
              text = normalize_text(text)

              # Remove IDs, URLs and JSON-like structure.
              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"\b[a-f0-9]{12,}\b", " ", text)
              text = re.sub(r"\b\d{4,}\b", " ", text)
              text = re.sub(r"[_{}[\]\":,]+", " ", text)

              words = []
              for word in re.findall(r"[a-zA-ZÀ-ÿ'-]+", text):
                  if word in NOISE_TERMS:
                      continue
                  if len(word) < 3:
                      continue
                  words.append(word)

              return " ".join(words)

          def meaningful_tokens(text):
              cleaned = clean_phrase(text)
              return [
                  w for w in cleaned.split()
                  if w not in NOISE_TERMS and len(w) >= 4
              ]

          def domain_scores(text):
              t = normalize_text(text)
              scores = {}

              for domain, keywords in DOMAIN_KEYWORDS.items():
                  score = 0
                  for keyword in keywords:
                      if keyword in t:
                          score += 1
                  if score:
                      scores[domain] = score

              return scores

          def best_domain(text):
              scores = domain_scores(text)
              if not scores:
                  return "unclassified"

              # Priority weighting requested for NØX.
              weights = {
                  "virtual_economy": 1.25,
                  "cybersecurity": 1.20,
                  "ai_communities": 1.15,
                  "agent_intelligence_autonomy": 1.15,
                  "emerging_tech": 1.05,
                  "laws_regulation": 1.10
              }

              ranked = sorted(
                  scores.items(),
                  key=lambda x: x[1] * weights.get(x[0], 1.0),
                  reverse=True
              )

              return ranked[0][0]

          def sentence_context(text, position):
              start = text.rfind(".", 0, position)
              end = text.find(".", position)

              if start == -1:
                  start = 0
              else:
                  start += 1

              if end == -1:
                  end = len(text)

              return text[start:end].strip()

          def is_historical(context):
              c = normalize_text(context)
              return any(marker in c for marker in HISTORICAL_MARKERS)

          def explicit_current_gap(context):
              c = normalize_text(context)

              if is_historical(c):
                  return False

              return any(re.search(pattern, c) for pattern in CURRENT_GAP_PATTERNS)

          def weak_uncertainty(context):
              c = normalize_text(context)

              if is_historical(c):
                  return False

              return any(re.search(pattern, c) for pattern in WEAK_UNCERTAINTY_PATTERNS)

          def contradiction_signal(context):
              c = normalize_text(context)
              return any(re.search(pattern, c) for pattern in CONTRADICTION_PATTERNS)

          def extract_contextual_concept(context):
              tokens = meaningful_tokens(context)

              if not tokens:
                  return None

              # Remove common grammatical / procedural words.
              blocked = {
                  "this", "that", "with", "from", "about", "into",
                  "when", "where", "what", "which", "would", "could",
                  "should", "have", "has", "been", "being", "there",
                  "their", "they", "them", "then", "than", "only",
                  "also", "more", "some", "very", "just", "need",
                  "needs", "know", "knows", "understand", "verify",
                  "verification", "unclear", "uncertain", "unknown",
                  "currently", "still"
              }

              tokens = [x for x in tokens if x not in blocked]

              if not tokens:
                  return None

              # Prefer domain-specific words.
              scored = []
              for token in tokens:
                  score = 0
                  for keywords in DOMAIN_KEYWORDS.values():
                      for keyword in keywords:
                          if token == keyword or token in keyword.split():
                              score += 2
                  scored.append((score, token))

              scored.sort(reverse=True)

              top = [token for score, token in scored[:5]]

              if len(top) < 2:
                  return top[0] if top else None

              return " ".join(top[:4])

          def make_id(category, domain, concept, source):
              raw = f"{category}|{domain}|{concept}|{source}"
              return hashlib.sha256(raw.encode()).hexdigest()[:16]

          # ------------------------------------------------------------
          # Load memory files
          # ------------------------------------------------------------

          documents = []

          for path in MEMORY_DIR.rglob("*"):
              if not path.is_file():
                  continue

              if path == OUTPUT:
                  continue

              if path.suffix.lower() not in {".json", ".txt", ".md"}:
                  continue

              try:
                  if path.suffix.lower() == ".json":
                      data = json.loads(path.read_text(encoding="utf-8"))
                      text = " ".join(flatten_json(data))
                  else:
                      text = path.read_text(encoding="utf-8", errors="ignore")

                  text = normalize_text(text)

                  if len(text) >= 80:
                      documents.append({
                          "path": str(path),
                          "text": text
                      })

              except Exception as exc:
                  print(f"Skipping unreadable file {path}: {exc}")

          print("NØX ACT21 V3 - Knowledge Gap Detector")
          print("Mode: DETECTION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")
          print(f"Memory files analysed: {len(documents)}")

          # ------------------------------------------------------------
          # Load knowledge core for suppression/context.
          # Presence in the core is NOT treated as proof of mastery.
          # ------------------------------------------------------------

          core_text = ""

          if CORE_FILE.exists():
              try:
                  core_data = json.loads(CORE_FILE.read_text(encoding="utf-8"))
                  core_text = normalize_text(" ".join(flatten_json(core_data)))
              except Exception as exc:
                  print(f"Knowledge core unavailable: {exc}")

          # ------------------------------------------------------------
          # Stage 1 - RAW SIGNALS
          # ------------------------------------------------------------

          raw_signals = []

          for doc in documents:
              text = doc["text"]

              # Split long memory documents into sentences.
              sentences = re.split(r"(?<=[.!?])\s+", text)

              for sentence in sentences:
                  if len(sentence) < 40:
                      continue

                  context = sentence.strip()

                  if explicit_current_gap(context):
                      concept = extract_contextual_concept(context)

                      if concept:
                          raw_signals.append({
                              "category": "explicit_current_gap",
                              "source": doc["path"],
                              "context": context[:600],
                              "concept": concept,
                              "domain": best_domain(context),
                              "strength": 3
                          })

                  elif weak_uncertainty(context):
                      concept = extract_contextual_concept(context)

                      if concept:
                          raw_signals.append({
                              "category": "uncertainty_signal",
                              "source": doc["path"],
                              "context": context[:600],
                              "concept": concept,
                              "domain": best_domain(context),
                              "strength": 1
                          })

                  if contradiction_signal(context):
                      concept = extract_contextual_concept(context)

                      # A contradiction word alone is never enough.
                      if concept and len(meaningful_tokens(context)) >= 5:
                          raw_signals.append({
                              "category": "contradiction_signal",
                              "source": doc["path"],
                              "context": context[:600],
                              "concept": concept,
                              "domain": best_domain(context),
                              "strength": 1
                          })

          # Deduplicate raw signals.
          dedup = {}

          for signal in raw_signals:
              key = (
                  signal["category"],
                  signal["domain"],
                  clean_phrase(signal["concept"])
              )

              if key not in dedup:
                  dedup[key] = signal
              else:
                  dedup[key]["strength"] = max(
                      dedup[key]["strength"],
                      signal["strength"]
                  )

          raw_signals = list(dedup.values())
          raw_signals = raw_signals[:MAX_SIGNALS]

          # ------------------------------------------------------------
          # Stage 2 - CANDIDATE GAPS
          # ------------------------------------------------------------

          grouped = defaultdict(list)

          for signal in raw_signals:
              concept = clean_phrase(signal["concept"])

              if not concept or len(concept.split()) < 1:
                  continue

              grouped[(signal["domain"], concept)].append(signal)

          candidates = []

          for (domain, concept), signals in grouped.items():

              categories = {s["category"] for s in signals}
              sources = {s["source"] for s in signals}

              explicit_count = sum(
                  1 for s in signals
                  if s["category"] == "explicit_current_gap"
              )

              uncertainty_count = sum(
                  1 for s in signals
                  if s["category"] == "uncertainty_signal"
              )

              contradiction_count = sum(
                  1 for s in signals
                  if s["category"] == "contradiction_signal"
              )

              # A single weak uncertainty is NOT promoted.
              reinforced = (
                  explicit_count >= 1
                  or uncertainty_count >= 2
                  or contradiction_count >= 2
                  or len(sources) >= 2
              )

              if not reinforced:
                  continue

              # Suppress concepts that are obviously procedural/structural.
              concept_words = set(concept.split())

              if concept_words.intersection(NOISE_TERMS):
                  continue

              # If the core explicitly contains the concept many times,
              # it is less likely to be a useful knowledge gap.
              core_presence = False

              if core_text and concept:
                  core_presence = concept in core_text

              score = 40

              if explicit_count:
                  score += 25

              if uncertainty_count >= 2:
                  score += 10

              if contradiction_count >= 2:
                  score += 15

              if len(sources) >= 2:
                  score += 10

              if core_presence:
                  score -= 15

              # Strong priority domains get a modest boost.
              domain_bonus = {
                  "virtual_economy": 5,
                  "cybersecurity": 5,
                  "ai_communities": 4,
                  "agent_intelligence_autonomy": 4,
                  "laws_regulation": 4,
                  "emerging_tech": 2
              }

              score += domain_bonus.get(domain, 0)
              score = max(0, min(100, score))

              categories_list = sorted(categories)

              candidates.append({
                  "id": make_id(
                      "candidate",
                      domain,
                      concept,
                      sorted(sources)[0]
                  ),
                  "domain": domain,
                  "concept": concept,
                  "score": score,
                  "evidence": {
                      "explicit_current_gap_signals": explicit_count,
                      "uncertainty_signals": uncertainty_count,
                      "contradiction_signals": contradiction_count,
                      "distinct_sources": len(sources),
                      "categories": categories_list
                  },
                  "sources": sorted(sources),
                  "contexts": [
                      s["context"] for s in signals[:3]
                  ],
                  "core_already_mentions_topic": core_presence
              })

          candidates.sort(
              key=lambda x: (
                  x["score"],
                  x["evidence"]["distinct_sources"],
                  x["evidence"]["explicit_current_gap_signals"]
              ),
              reverse=True
          )

          candidates = candidates[:MAX_CANDIDATES]

          # ------------------------------------------------------------
          # Stage 3 - VALIDATION
          # ------------------------------------------------------------

          validated = []

          for candidate in candidates:

              evidence = candidate["evidence"]

              # Minimum evidence rules.
              strong_current = (
                  evidence["explicit_current_gap_signals"] >= 1
                  and evidence["distinct_sources"] >= 1
              )

              repeated_uncertainty = (
                  evidence["uncertainty_signals"] >= 2
                  and evidence["distinct_sources"] >= 1
              )

              multi_source_contradiction = (
                  evidence["contradiction_signals"] >= 2
                  and evidence["distinct_sources"] >= 2
              )

              # Do not let a single historical/weak statement through.
              if not (
                  strong_current
                  or repeated_uncertainty
                  or multi_source_contradiction
              ):
                  continue

              # Avoid tiny/generic concepts.
              words = candidate["concept"].split()

              if len(words) == 1 and len(words[0]) < 7:
                  continue

              # A known core topic can still be a gap, but needs stronger
              # evidence than a topic absent from the core.
              if candidate["core_already_mentions_topic"]:
                  if candidate["score"] < 70:
                      continue

              validation_reason = []

              if strong_current:
                  validation_reason.append("explicit_current_knowledge_limitation")

              if repeated_uncertainty:
                  validation_reason.append("repeated_uncertainty")

              if multi_source_contradiction:
                  validation_reason.append("multi_source_contradiction")

              validated.append({
                  "id": candidate["id"],
                  "domain": candidate["domain"],
                  "concept": candidate["concept"],
                  "priority_score": candidate["score"],
                  "validation": {
                      "status": "validated_candidate_gap",
                      "reasons": validation_reason
                  },
                  "evidence": candidate["evidence"],
                  "sources": candidate["sources"],
                  "contexts": candidate["contexts"]
              })

          validated.sort(
              key=lambda x: x["priority_score"],
              reverse=True
          )

          validated = validated[:MAX_VALIDATED]

          # ------------------------------------------------------------
          # Domain coverage is only a SIGNAL, not a knowledge gap.
          # ------------------------------------------------------------

          domain_counts = Counter(
              candidate["domain"]
              for candidate in validated
          )

          meaningful_domains = [
              "virtual_economy",
              "cybersecurity",
              "ai_communities",
              "agent_intelligence_autonomy",
              "emerging_tech",
              "laws_regulation",
              "science",
              "history",
              "programming",
              "current_events"
          ]

          coverage_signals = []

          for domain in meaningful_domains:
              count = domain_counts.get(domain, 0)

              if count == 0:
                  coverage_signals.append({
                      "domain": domain,
                      "status": "no_validated_gap_detected",
                      "interpretation": (
                          "Absence of a detected gap is not proof of knowledge."
                      )
                  })

          # ------------------------------------------------------------
          # Output
          # ------------------------------------------------------------

          result = {
              "act": "ACT21",
              "version": "V3",
              "name": "Knowledge Gap Detector",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "mode": "detection_only",

              "policy": {
                  "gemini": False,
                  "external_ai": False,
                  "api_calls": False,
                  "marketplace_actions": False,
                  "publishing": False,
                  "comments": False,
                  "private_messages": False,
                  "bids": False,
                  "payments": False,
                  "project_cost_eur": 0,

                  "principle": (
                      "A historical uncertainty statement is only a signal. "
                      "It becomes a candidate gap only when current or repeated "
                      "evidence supports it."
                  )
              },

              "analysis": {
                  "memory_files_analysed": len(documents),
                  "raw_signals_detected": len(raw_signals),
                  "candidate_gaps": len(candidates),
                  "validated_candidate_gaps": len(validated),
                  "domains_with_validated_gaps": len(domain_counts)
              },

              "signals_detected": raw_signals,

              "candidate_gaps": candidates,

              "validated_gaps": validated,

              "domain_coverage_signals": coverage_signals,

              "next_act": {
                  "target": "ACT22",
                  "role": (
                      "Select which validated knowledge gaps deserve "
                      "attention and deeper exploration."
                  ),
                  "input": [
                      "validated_gaps"
                  ],
                  "not_for_act21": [
                      "research",
                      "verification",
                      "learning",
                      "knowledge_integration",
                      "decision_making"
                  ]
              }
          }

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          OUTPUT.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("")
          print("ACT21 V3 RESULT")
          print(f"Raw signals detected: {len(raw_signals)}")
          print(f"Candidate gaps: {len(candidates)}")
          print(f"Validated candidate gaps: {len(validated)}")
          print(f"Domains with validated gaps: {len(domain_counts)}")

          if validated:
              print("")
              print("Top candidates for ACT22:")

              for index, gap in enumerate(validated[:10], 1):
                  print(
                      f"{index}. "
                      f"[{gap['priority_score']}] "
                      f"{gap['domain']} - "
                      f"{gap['concept']}"
                  )
                  print(
                      f"   Reasons: "
                      f"{', '.join(gap['validation']['reasons'])}"
                  )
          else:
              print("")
              print("No validated knowledge gap found.")
              print(
                  "This is a valid result: ACT21 does not manufacture "
                  "gaps from weak evidence."
              )

          print("")
          print(f"Output: {OUTPUT}")

          PY

      - name: Commit ACT21 V3 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_knowledge_gaps.json

          if git diff --cached --quiet; then
            echo "No ACT21 V3 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT21 V3 - detect validated knowledge gaps"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
