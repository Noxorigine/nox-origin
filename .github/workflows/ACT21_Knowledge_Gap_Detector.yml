name: NØX ACT 21 - Knowledge Gap Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act21-knowledge
  cancel-in-progress: false

jobs:
  detect-knowledge-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT21 Knowledge Gap Detector
        run: |
          python -u scripts/act21_knowledge_gap_detector.py

      - name: Commit ACT21 knowledge gaps
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_knowledge_gaps.json

          if git diff --cached --quiet; then
            echo "No ACT21 changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT21: update knowledge gaps"

          git pull --rebase origin main
          git push origin HEAD:main
