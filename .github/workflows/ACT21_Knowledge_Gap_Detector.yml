name: NØX ACT 21 - Knowledge Gap Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  detect-knowledge-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT21
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u <<'PY'
          import json
          import re
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone

          ROOT = Path.cwd()
          MEMORY_DIR = ROOT / "memory"
          OUTPUT = MEMORY_DIR / "nox_knowledge_gaps.json"

          DOMAIN_WEIGHTS = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technology": 15,
          }

          STOP_WORDS = {
              "the", "and", "for", "with", "from", "that", "this",
              "dans", "pour", "avec", "les", "des", "une", "est",
              "sur", "que", "qui", "mais", "plus", "entre",
          }

          DOMAIN_TERMS = {
              "virtual_economy": [
                  "marketplace", "economy", "economic", "task",
                  "buyer", "seller", "bid", "payment", "reward",
                  "sats", "wallet", "market"
              ],
              "cybersecurity": [
                  "security", "cybersecurity", "authentication",
                  "api key", "token", "jwt", "permission",
                  "attack", "vulnerability", "privacy"
              ],
              "ai_communities": [
                  "agent exchange", "ai community", "agents",
                  "collaboration", "community", "communication",
                  "colony"
              ],
              "agent_intelligence_autonomy": [
                  "autonomy", "autonomous", "decision", "learning",
                  "reasoning", "memory", "knowledge", "curiosity",
                  "planning", "agent"
              ],
              "emerging_technology": [
                  "technology", "emerging", "research", "innovation",
                  "protocol", "robotics", "computing", "science"
              ],
          }

          UNCERTAINTY_TERMS = [
              "unknown",
              "uncertain",
              "unclear",
              "not sure",
              "needs verification",
              "verify",
              "verification",
              "contradiction",
              "contradictory",
              "missing",
              "incomplete",
              "incertain",
              "à vérifier",
              "inconnu",
              "manquant",
              "contradictoire",
          ]

          def now():
              return datetime.now(timezone.utc).replace(
                  microsecond=0
              ).isoformat()

          def flatten(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(flatten(x) for x in value)

              if isinstance(value, dict):
                  return " ".join(
                      f"{k} {flatten(v)}"
                      for k, v in value.items()
                  )

              return str(value)

          def load_json(path):
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return None

          def detect_domains(text):
              text = text.lower()
              scores = {}

              for domain, terms in DOMAIN_TERMS.items():
                  score = sum(
                      1 for term in terms
                      if term in text
                  )

                  if score:
                      scores[domain] = score

              return sorted(
                  scores,
                  key=lambda d: (
                      -scores[d],
                      -DOMAIN_WEIGHTS[d]
                  )
              )

          def extract_keywords(text, limit=12):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9_-]{2,}",
                  text.lower()
              )

              words = [
                  word for word in words
                  if word not in STOP_WORDS
                  and not word.isdigit()
              ]

              counts = Counter(words)

              return [
                  word
                  for word, _ in counts.most_common(limit)
              ]

          print("==========================================")
          print("NØX ACT21 - Knowledge Gap Detector")
          print("==========================================")
          print("Mode: DETECTION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("Project cost: 0 EUR")
          print()

          MEMORY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          memory_files = []

          for path in sorted(MEMORY_DIR.glob("*.json")):
              if path.name == OUTPUT.name:
                  continue

              data = load_json(path)

              if data is not None:
                  memory_files.append(
                      (
                          str(path.relative_to(ROOT)),
                          flatten(data)
                      )
                  )

          print(
              f"Memory files analysed: {len(memory_files)}"
          )

          all_text = "\n".join(
              text for _, text in memory_files
          )

          gaps = []

          # --------------------------------------------------
          # A. Explicit uncertainty
          # --------------------------------------------------

          for filename, text in memory_files:
              lowered = text.lower()

              matches = [
                  term
                  for term in UNCERTAINTY_TERMS
                  if term in lowered
              ]

              if not matches:
                  continue

              domains = detect_domains(text)

              domain = (
                  domains[0]
                  if domains
                  else "agent_intelligence_autonomy"
              )

              keywords = extract_keywords(text, 8)

              score = min(
                  100,
                  40
                  + len(matches) * 8
                  + DOMAIN_WEIGHTS.get(domain, 10)
              )

              gaps.append({
                  "domain": domain,
                  "title": (
                      "Clarify uncertain knowledge around "
                      + ", ".join(keywords[:4])
                  ),
                  "reason": (
                      "Current memory contains explicit "
                      "uncertainty, missing information, "
                      "verification needs, or possible "
                      "contradictions."
                  ),
                  "evidence": [
                      filename,
                      *matches[:5]
                  ],
                  "priority_score": score,
                  "status": "detected",
                  "next_step": "ACT22",
              })

          # --------------------------------------------------
          # B. Weakly represented priority domains
          # --------------------------------------------------

          domain_presence = {}

          for domain, terms in DOMAIN_TERMS.items():
              count = sum(
                  1
                  for term in terms
                  if term in all_text.lower()
              )

              domain_presence[domain] = count

          weak_domains = sorted(
              domain_presence,
              key=lambda d: (
                  domain_presence[d],
                  -DOMAIN_WEIGHTS[d]
              )
          )

          for domain in weak_domains[:2]:
              if domain_presence[domain] <= 1:
                  gaps.append({
                      "domain": domain,
                      "title": (
                          f"Develop knowledge coverage: {domain}"
                      ),
                      "reason": (
                          "This priority domain has weak "
                          "representation in the current "
                          "knowledge base."
                      ),
                      "evidence": [
                          f"domain_presence="
                          f"{domain_presence[domain]}"
                      ],
                      "priority_score": min(
                          100,
                          45 + DOMAIN_WEIGHTS[domain]
                      ),
                      "status": "detected",
                      "next_step": "ACT22",
                  })

          # --------------------------------------------------
          # C. Repeated concepts worth examining
          # --------------------------------------------------

          keywords = extract_keywords(
              all_text,
              50
          )

          for keyword in keywords[:15]:
              occurrences = len(
                  re.findall(
                      re.escape(keyword),
                      all_text.lower()
                  )
              )

              if occurrences < 5:
                  continue

              domains = detect_domains(keyword)

              domain = (
                  domains[0]
                  if domains
                  else "agent_intelligence_autonomy"
              )

              gaps.append({
                  "domain": domain,
                  "title": (
                      f"Deepen understanding of {keyword}"
                  ),
                  "reason": (
                      "This concept appears repeatedly "
                      "in NØX memory and may deserve "
                      "stronger structured understanding."
                  ),
                  "evidence": [
                      f"occurrences={occurrences}"
                  ],
                  "priority_score": min(
                      95,
                      35 + occurrences * 3
                  ),
                  "status": "detected",
                  "next_step": "ACT22",
              })

          # --------------------------------------------------
          # Deduplication
          # --------------------------------------------------

          unique = {}

          for gap in gaps:
              key = (
                  gap["domain"],
                  gap["title"].lower()
              )

              if key not in unique:
                  unique[key] = gap
              elif (
                  gap["priority_score"]
                  > unique[key]["priority_score"]
              ):
                  unique[key] = gap

          final_gaps = sorted(
              unique.values(),
              key=lambda gap: (
                  -gap["priority_score"],
                  gap["domain"],
                  gap["title"]
              )
          )

          for index, gap in enumerate(
              final_gaps,
              start=1
          ):
              gap["gap_id"] = (
                  f"ACT21-GAP-{index:03d}"
              )

          domain_counts = Counter(
              gap["domain"]
              for gap in final_gaps
          )

          output = {
              "schema_version": "1.0",
              "act": "ACT21",
              "name": "Knowledge Gap Detector",
              "purpose": (
                  "Detect what NØX does not know, "
                  "knows insufficiently, or should "
                  "verify before deeper learning."
              ),
              "generated_at": now(),
              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,

              "principle": {
                  "detect_only": True,
                  "research": False,
                  "decision": False,
                  "publishing": False,
                  "comments": False,
                  "dm": False,
                  "marketplace_actions": False,
                  "payments": False,
              },

              "priority_domains": DOMAIN_WEIGHTS,

              "summary": {
                  "memory_files_analysed": len(
                      memory_files
                  ),
                  "gaps_detected": len(
                      final_gaps
                  ),
                  "domains_with_gaps": len(
                      domain_counts
                  ),
                  "top_domain": (
                      domain_counts.most_common(1)[0][0]
                      if domain_counts
                      else None
                  ),
              },

              "knowledge_gaps": final_gaps,
          }

          OUTPUT.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print(
              f"Knowledge gaps detected: "
              f"{len(final_gaps)}"
          )

          for gap in final_gaps[:10]:
              print(
                  f"[{gap['priority_score']}] "
                  f"{gap['domain']} - "
                  f"{gap['title']}"
              )

          print()
          print(f"Output: {OUTPUT}")
          print("ACT21 completed successfully.")
          PY

      - name: Commit ACT21 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_knowledge_gaps.json

          if git diff --cached --quiet; then
            echo "No ACT21 changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT21: update knowledge gaps"

          git pull --rebase origin main

          git push origin HEAD:main
