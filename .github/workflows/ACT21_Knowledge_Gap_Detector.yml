name: NØX ACT 21 - Knowledge Gap Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  detect-knowledge-gaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT21 V2
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone

          ROOT = Path.cwd()
          MEMORY_DIR = ROOT / "memory"
          OUTPUT = MEMORY_DIR / "nox_knowledge_gaps.json"
          CORE_FILE = MEMORY_DIR / "nox_knowledge_core.json"

          # ==========================================================
          # NØX ACT21 V2
          # Knowledge Gap Detector
          #
          # Purpose:
          #   Detect knowledge that appears unknown, uncertain,
          #   weakly represented, contradictory, outdated, or missing.
          #
          # Important:
          #   ACT21 DETECTS.
          #   ACT22 WILL DECIDE WHAT DESERVES DEEPER ATTENTION.
          #
          # No external AI.
          # No Gemini.
          # No API calls.
          # No publishing.
          # No marketplace actions.
          # No payments.
          # ==========================================================

          DOMAIN_WEIGHTS = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technology": 15,
          }

          DOMAIN_TERMS = {
              "virtual_economy": {
                  "marketplace", "economy", "economic", "task",
                  "buyer", "seller", "bid", "bidding", "reward",
                  "payment", "wallet", "sats", "earnings",
                  "price", "pricing", "value", "transaction",
                  "commerce", "market"
              },

              "cybersecurity": {
                  "security", "cybersecurity", "authentication",
                  "authorization", "api key", "token", "jwt",
                  "permission", "permissions", "vulnerability",
                  "attack", "privacy", "encryption", "credential",
                  "access", "threat"
              },

              "ai_communities": {
                  "agent exchange", "ai community", "agents",
                  "collaboration", "community", "communication",
                  "colony", "coordination", "interaction",
                  "social", "agent-to-agent"
              },

              "agent_intelligence_autonomy": {
                  "autonomy", "autonomous", "decision", "decisions",
                  "learning", "reasoning", "memory", "knowledge",
                  "curiosity", "planning", "intelligence",
                  "self-improvement", "attention", "observation",
                  "adaptation", "agent"
              },

              "emerging_technology": {
                  "technology", "emerging", "research", "innovation",
                  "protocol", "robotics", "computing", "science",
                  "artificial intelligence", "ai", "future",
                  "invention", "technical"
              },
          }

          # Words which are implementation artifacts rather than
          # meaningful knowledge concepts.
          TECHNICAL_NOISE = {
              "true", "false", "null", "none", "yes", "no",
              "json", "yaml", "yml", "value", "values",
              "key", "keys", "title", "name", "description",
              "id", "post_id", "comment_id", "source_comment_id",
              "author", "content", "body", "type", "status",
              "created_at", "updated_at", "timestamp",
              "score", "karma", "url", "file", "filename",
              "path", "memory", "data", "result", "results",
              "item", "items", "index", "count", "number",
              "domain", "domains", "reason", "evidence",
              "priority", "priority_score", "schema_version",
              "next_step", "act", "run", "workflow",
              "commit", "branch", "repository", "github",
              "output", "input", "metadata", "config",
              "configuration", "source", "sources"
          }

          STOP_WORDS = {
              "the", "and", "for", "with", "from", "that", "this",
              "have", "has", "been", "were", "was", "are", "not",
              "but", "you", "your", "they", "their", "about",
              "into", "than", "then", "when", "where", "what",
              "which", "will", "would", "could", "should",
              "dans", "pour", "avec", "les", "des", "une",
              "est", "sur", "que", "qui", "mais", "plus",
              "entre", "dans", "avec", "être", "avoir",
              "cette", "ce", "ces", "ses", "son", "sont",
              "pas", "par", "une", "un", "aux", "comme",
              "leur", "leurs", "peut", "doit", "faire"
          }

          # Explicit linguistic signals.
          UNCERTAINTY_PATTERNS = [
              r"\bunknown\b",
              r"\buncertain\b",
              r"\bunclear\b",
              r"\bnot sure\b",
              r"\bunsure\b",
              r"\bunknown whether\b",
              r"\bunknown if\b",
              r"\bneed(?:s)? verification\b",
              r"\bneeds? to be verified\b",
              r"\bverify\b",
              r"\bverification\b",
              r"\bto verify\b",
              r"\bnot established\b",
              r"\bnot known\b",
              r"\bpoorly understood\b",
              r"\bnot fully understood\b",
              r"\bincomplete\b",
              r"\bmissing knowledge\b",
              r"\bknowledge gap\b",
              r"\bincertain\b",
              r"\bincertitude\b",
              r"\binconnu\b",
              r"\binconnue\b",
              r"\bà vérifier\b",
              r"\ba verifier\b",
              r"\bpas certain\b",
              r"\bpas sûre?\b",
              r"\bmal compris\b",
              r"\bà confirmer\b",
              r"\ba confirmer\b",
              r"\bnon vérifié\b",
              r"\bnon verifie\b",
              r"\bcontradictoire\b",
          ]

          CONTRADICTION_PATTERNS = [
              r"\bcontradict",
              r"\bconflict",
              r"\binconsistent\b",
              r"\bdisagree\b",
              r"\bdiscrepanc",
              r"\bcontradiction\b",
              r"\bconflicting information\b",
              r"\bincohérent\b",
              r"\bincoherent\b",
              r"\bcontradictoire\b",
              r"\bincompatib",
          ]

          WEAK_KNOWLEDGE_PATTERNS = [
              r"\bpoor understanding\b",
              r"\bweak understanding\b",
              r"\blimited understanding\b",
              r"\binsufficient understanding\b",
              r"\bneeds? improvement\b",
              r"\bneeds? deeper\b",
              r"\bneeds? more research\b",
              r"\bneeds? further research\b",
              r"\bnot enough information\b",
              r"\blimited knowledge\b",
              r"\bpartial knowledge\b",
              r"\bpartially understood\b",
              r"\bunderdeveloped\b",
              r"\bfaible compréhension\b",
              r"\bcompréhension limitée\b",
              r"\bconnaissance limitée\b",
              r"\bà approfondir\b",
              r"\ba approfondir\b",
              r"\bà mieux comprendre\b",
              r"\ba mieux comprendre\b",
          ]

          def now_iso():
              return datetime.now(timezone.utc).replace(
                  microsecond=0
              ).isoformat()

          def load_json(path):
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(
                      f"WARNING: unable to parse {path}: {exc}"
                  )
                  return None

          def flatten(value):
              """
              Convert memory into searchable natural text while
              deliberately avoiding technical JSON structure.
              """
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return ""

              if isinstance(value, list):
                  return " ".join(
                      flatten(item)
                      for item in value
                  )

              if isinstance(value, dict):
                  chunks = []

                  for key, item in value.items():
                      # Keep semantic field values.
                      # Do not turn field names into knowledge.
                      if key in TECHNICAL_NOISE:
                          if isinstance(item, (str, list, dict)):
                              chunks.append(flatten(item))
                          continue

                      chunks.append(flatten(item))

                  return " ".join(chunks)

              return ""

          def normalize_text(text):
              text = text.lower()
              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )
              text = re.sub(
                  r"[A-Za-z0-9_-]{20,}",
                  " ",
                  text
              )
              text = re.sub(
                  r"\b[0-9a-f]{12,}\b",
                  " ",
                  text
              )
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )
              return text.strip()

          def meaningful_keywords(text, limit=10):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9_-]{3,}",
                  normalize_text(text)
              )

              cleaned = []

              for word in words:
                  if word in STOP_WORDS:
                      continue

                  if word in TECHNICAL_NOISE:
                      continue

                  if word.isdigit():
                      continue

                  cleaned.append(word)

              counts = Counter(cleaned)

              return [
                  word
                  for word, _ in counts.most_common(limit)
              ]

          def detect_domains(text):
              lowered = normalize_text(text)

              scores = {}

              for domain, terms in DOMAIN_TERMS.items():
                  score = 0

                  for term in terms:
                      if " " in term:
                          if term in lowered:
                              score += 2
                      else:
                          occurrences = len(
                              re.findall(
                                  rf"\b{re.escape(term)}\b",
                                  lowered
                              )
                          )
                          score += min(occurrences, 3)

                  if score:
                      scores[domain] = score

              return sorted(
                  scores,
                  key=lambda domain: (
                      -scores[domain],
                      -DOMAIN_WEIGHTS[domain]
                  )
              )

          def find_contexts(text, patterns, max_contexts=4):
              """
              Return only local contexts around explicit signals.
              This prevents one 'verify' anywhere in a huge JSON
              document from turning the entire file into a gap.
              """
              normalized = normalize_text(text)
              contexts = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      normalized,
                      flags=re.IGNORECASE
                  ):
                      start = max(
                          0,
                          match.start() - 180
                      )
                      end = min(
                          len(normalized),
                          match.end() + 220
                      )

                      context = normalized[
                          start:end
                      ].strip()

                      if context:
                          contexts.append(context)

                      if len(contexts) >= max_contexts:
                          return contexts

              return contexts

          def concept_from_context(context):
              keywords = meaningful_keywords(
                  context,
                  limit=8
              )

              # Remove generic uncertainty words.
              excluded = {
                  "unknown", "uncertain", "unclear",
                  "verify", "verification", "verification",
                  "incomplete", "missing", "contradictory",
                  "needs", "need", "research", "further",
                  "knowledge", "understanding"
              }

              useful = [
                  word
                  for word in keywords
                  if word not in excluded
              ]

              return useful[:4]

          def make_gap_id(domain, category, title):
              raw = (
                  f"{domain}|{category}|{title}"
              ).encode("utf-8")

              digest = hashlib.sha256(
                  raw
              ).hexdigest()[:10]

              return f"ACT21-{digest}"

          def add_gap(
              gaps,
              domain,
              category,
              title,
              reason,
              evidence,
              score
          ):
              if not title:
                  return

              # Never allow a technical artifact to become
              # the primary concept of a gap.
              title_words = set(
                  re.findall(
                      r"[a-zà-ÿ][a-zà-ÿ0-9_-]+",
                      title.lower()
                  )
              )

              if title_words and title_words <= (
                  TECHNICAL_NOISE | STOP_WORDS
              ):
                  return

              score = max(1, min(100, int(score)))

              gap = {
                  "gap_id": make_gap_id(
                      domain,
                      category,
                      title
                  ),
                  "domain": domain,
                  "category": category,
                  "title": title,
                  "reason": reason,
                  "evidence": evidence[:5],
                  "priority_score": score,
                  "status": "detected",
                  "next_step": "ACT22"
              }

              gaps.append(gap)

          print("==========================================")
          print("NØX ACT21 V2 - Knowledge Gap Detector")
          print("==========================================")
          print("Mode: DETECTION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Project cost: 0 EUR")
          print()

          MEMORY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          memory_files = []

          for path in sorted(
              MEMORY_DIR.glob("*.json")
          ):
              # Never analyse our own generated output as input.
              if path.name == OUTPUT.name:
                  continue

              data = load_json(path)

              if data is None:
                  continue

              text = flatten(data)

              if not text.strip():
                  continue

              memory_files.append({
                  "path": str(
                      path.relative_to(ROOT)
                  ),
                  "name": path.name,
                  "text": text
              })

          print(
              f"Memory files analysed: "
              f"{len(memory_files)}"
          )

          # ==========================================================
          # Knowledge core
          # ==========================================================

          core_text = ""

          if CORE_FILE.exists():
              core_data = load_json(CORE_FILE)

              if core_data is not None:
                  core_text = flatten(core_data)

          core_normalized = normalize_text(
              core_text
          )

          # ==========================================================
          # A. Explicit uncertainty
          # ==========================================================

          gaps = []

          for item in memory_files:
              contexts = find_contexts(
                  item["text"],
                  UNCERTAINTY_PATTERNS
              )

              for context in contexts:
                  concepts = concept_from_context(
                      context
                  )

                  if len(concepts) < 1:
                      continue

                  concept_text = " ".join(
                      concepts
                  )

                  domains = detect_domains(
                      context
                  )

                  if not domains:
                      continue

                  domain = domains[0]

                  # If the supposed concept is already strongly
                  # represented in the knowledge core, lower its
                  # priority rather than blindly declaring a gap.
                  concept_present = (
                      concept_text in core_normalized
                      or all(
                          word in core_normalized
                          for word in concepts[:2]
                      )
                  )

                  base = (
                      45
                      + DOMAIN_WEIGHTS[domain]
                      + min(
                          15,
                          len(concepts) * 3
                      )
                  )

                  if concept_present:
                      base -= 20

                  add_gap(
                      gaps=gaps,
                      domain=domain,
                      category="uncertainty",
                      title=(
                          f"Clarify uncertainty around "
                          f"{concept_text}"
                      ),
                      reason=(
                          "An explicit uncertainty or "
                          "verification signal was detected "
                          "in a local knowledge context."
                      ),
                      evidence=[
                          item["path"],
                          context
                      ],
                      score=base
                  )

          # ==========================================================
          # B. Explicit contradiction signals
          # ==========================================================

          for item in memory_files:
              contexts = find_contexts(
                  item["text"],
                  CONTRADICTION_PATTERNS
              )

              for context in contexts:
                  concepts = concept_from_context(
                      context
                  )

                  domains = detect_domains(
                      context
                  )

                  if not concepts or not domains:
                      continue

                  domain = domains[0]

                  add_gap(
                      gaps=gaps,
                      domain=domain,
                      category="contradiction_signal",
                      title=(
                          "Resolve possible contradiction "
                          "around "
                          + " ".join(concepts[:4])
                      ),
                      reason=(
                          "The memory contains an explicit "
                          "signal of conflicting or "
                          "inconsistent information."
                      ),
                      evidence=[
                          item["path"],
                          context
                      ],
                      score=(
                          70
                          + DOMAIN_WEIGHTS[domain]
                          // 2
                      )
                  )

          # ==========================================================
          # C. Explicit weak-knowledge signals
          # ==========================================================

          for item in memory_files:
              contexts = find_contexts(
                  item["text"],
                  WEAK_KNOWLEDGE_PATTERNS
              )

              for context in contexts:
                  concepts = concept_from_context(
                      context
                  )

                  domains = detect_domains(
                      context
                  )

                  if not concepts or not domains:
                      continue

                  domain = domains[0]

                  add_gap(
                      gaps=gaps,
                      domain=domain,
                      category="weak_knowledge",
                      title=(
                          "Strengthen understanding of "
                          + " ".join(concepts[:4])
                      ),
                      reason=(
                          "The memory explicitly indicates "
                          "limited, partial, weak, or "
                          "insufficient understanding."
                      ),
                      evidence=[
                          item["path"],
                          context
                      ],
                      score=(
                          50
                          + DOMAIN_WEIGHTS[domain]
                          // 2
                      )
                  )

          # ==========================================================
          # D. Domain coverage
          #
          # Important difference from V1:
          # A domain is NOT considered a gap simply because it
          # contains few keyword occurrences.
          #
          # We only create a coverage gap when there is effectively
          # no meaningful representation of that domain.
          # ==========================================================

          combined_normalized = normalize_text(
              "\n".join(
                  item["text"]
                  for item in memory_files
              )
          )

          domain_presence = {}

          for domain, terms in DOMAIN_TERMS.items():
              meaningful_hits = 0

              for term in terms:
                  if " " in term:
                      if term in combined_normalized:
                          meaningful_hits += 1
                  else:
                      if re.search(
                          rf"\b{re.escape(term)}\b",
                          combined_normalized
                      ):
                          meaningful_hits += 1

              domain_presence[domain] = meaningful_hits

          for domain, presence in domain_presence.items():
              if presence != 0:
                  continue

              add_gap(
                  gaps=gaps,
                  domain=domain,
                  category="coverage_gap",
                  title=(
                      f"Develop knowledge coverage in "
                      f"{domain.replace('_', ' ')}"
                  ),
                  reason=(
                      "No meaningful representation of this "
                      "priority domain was detected in the "
                      "current memory corpus."
                  ),
                  evidence=[
                      "domain_presence=0"
                  ],
                  score=(
                      55
                      + DOMAIN_WEIGHTS[domain]
                  )
              )

          # ==========================================================
          # E. Repeated concepts
          #
          # V2 deliberately does NOT turn every repeated word into
          # a gap.
          #
          # A repeated concept becomes a candidate only when:
          #   - it is meaningful,
          #   - it appears several times,
          #   - it belongs to a recognised domain,
          #   - and it is not already strongly represented in the
          #     knowledge core.
          # ==========================================================

          words = re.findall(
              r"[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9_-]{4,}",
              combined_normalized
          )

          filtered_words = [
              word
              for word in words
              if word not in STOP_WORDS
              and word not in TECHNICAL_NOISE
          ]

          counts = Counter(
              filtered_words
          )

          for concept, occurrences in (
              counts.most_common(30)
          ):
              if occurrences < 8:
                  continue

              if concept in core_normalized:
                  # Presence alone does not prove mastery,
                  # but it is enough to avoid manufacturing
                  # a gap from repetition alone.
                  continue

              domains = detect_domains(
                  concept
              )

              if not domains:
                  continue

              domain = domains[0]

              # High-frequency generic concepts are still
              # not automatically gaps.
              if concept in {
                  "agent",
                  "agents",
                  "knowledge",
                  "learning",
                  "technology",
                  "research",
                  "community",
                  "memory"
              }:
                  continue

              add_gap(
                  gaps=gaps,
                  domain=domain,
                  category="repeated_concept",
                  title=(
                      f"Assess depth of knowledge about "
                      f"{concept}"
                  ),
                  reason=(
                      "This meaningful concept occurs "
                      "repeatedly in memory but does not "
                      "appear strongly represented in the "
                      "knowledge core. ACT22 should decide "
                      "whether deeper learning is justified."
                  ),
                  evidence=[
                      f"occurrences={occurrences}"
                  ],
                  score=min(
                      75,
                      35
                      + occurrences
                  )
              )

          # ==========================================================
          # F. Deduplication and consolidation
          # ==========================================================

          grouped = {}

          for gap in gaps:
              key = (
                  gap["domain"],
                  gap["category"],
                  re.sub(
                      r"[^a-z0-9à-ÿ]+",
                      " ",
                      gap["title"].lower()
                  ).strip()
              )

              if key not in grouped:
                  grouped[key] = gap
              else:
                  current = grouped[key]

                  current["priority_score"] = max(
                      current["priority_score"],
                      gap["priority_score"]
                  )

                  for evidence in gap["evidence"]:
                      if evidence not in current["evidence"]:
                          current["evidence"].append(
                              evidence
                          )

          final_gaps = list(
              grouped.values()
          )

          # ==========================================================
          # G. Quality filter
          # ==========================================================

          quality_gaps = []

          for gap in final_gaps:
              title = gap["title"].lower()

              # Prevent obvious technical artifacts.
              artifact_hits = sum(
                  1
                  for token in TECHNICAL_NOISE
                  if re.search(
                      rf"\b{re.escape(token)}\b",
                      title
                  )
              )

              title_words = re.findall(
                  r"[a-zà-ÿ][a-zà-ÿ0-9_-]+",
                  title
              )

              if (
                  title_words
                  and artifact_hits >= max(
                      2,
                      len(title_words) // 2
                  )
              ):
                  continue

              # Very weak repeated-concept signals are not useful.
              if (
                  gap["category"] == "repeated_concept"
                  and gap["priority_score"] < 45
              ):
                  continue

              quality_gaps.append(
                  gap
              )

          # Sort by usefulness for ACT22.
          quality_gaps.sort(
              key=lambda gap: (
                  -gap["priority_score"],
                  gap["domain"],
                  gap["category"],
                  gap["title"]
              )
          )

          # ==========================================================
          # H. Final output
          # ==========================================================

          domain_counts = Counter(
              gap["domain"]
              for gap in quality_gaps
          )

          category_counts = Counter(
              gap["category"]
              for gap in quality_gaps
          )

          output = {
              "schema_version": "2.0",
              "act": "ACT21",
              "name": "Knowledge Gap Detector",
              "version": "V2",

              "purpose": (
                  "Detect meaningful knowledge gaps, "
                  "uncertainties, weak knowledge, contradiction "
                  "signals, and genuinely missing priority-domain "
                  "coverage for later evaluation by ACT22."
              ),

              "generated_at": now_iso(),

              "gemini_used": False,
              "external_ai_used": False,
              "api_calls": False,
              "project_cost_eur": 0,

              "principle": {
                  "detect_only": True,
                  "decision": False,
                  "research": False,
                  "verification": False,
                  "knowledge_integration": False,
                  "publishing": False,
                  "comments": False,
                  "dm": False,
                  "marketplace_actions": False,
                  "bids": False,
                  "payments": False
              },

              "quality_rules": {
                  "technical_json_noise_filtered": True,
                  "context_based_uncertainty": True,
                  "explicit_contradiction_signals": True,
                  "explicit_weak_knowledge_signals": True,
                  "repeated_word_is_not_automatically_a_gap": True,
                  "knowledge_core_checked": True,
                  "domain_inference_required": True,
                  "deduplication_enabled": True
              },

              "priority_domains": DOMAIN_WEIGHTS,

              "summary": {
                  "memory_files_analysed": len(
                      memory_files
                  ),
                  "gaps_detected": len(
                      quality_gaps
                  ),
                  "domains_with_gaps": len(
                      domain_counts
                  ),
                  "top_domain": (
                      domain_counts.most_common(1)[0][0]
                      if domain_counts
                      else None
                  ),
                  "categories": dict(
                      category_counts
                  ),
                  "domain_presence": domain_presence
              },

              "knowledge_gaps": quality_gaps
          }

          OUTPUT.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print("==========================================")
          print("ACT21 V2 RESULT")
          print("==========================================")
          print(
              f"Memory files analysed: "
              f"{len(memory_files)}"
          )
          print(
              f"Knowledge gaps detected: "
              f"{len(quality_gaps)}"
          )
          print(
              f"Domains with gaps: "
              f"{len(domain_counts)}"
          )

          if category_counts:
              print(
                  "Categories:"
              )
              for category, count in (
                  category_counts.most_common()
              ):
                  print(
                      f"  - {category}: {count}"
                  )

          print()
          print("Top candidates for ACT22:")

          for index, gap in enumerate(
              quality_gaps[:15],
              start=1
          ):
              print(
                  f"{index}. "
                  f"[{gap['priority_score']}] "
                  f"{gap['category']} | "
                  f"{gap['domain']} | "
                  f"{gap['title']}"
              )

          print()
          print(
              f"Output: {OUTPUT}"
          )
          print(
              "ACT21 V2 completed successfully."
          )
          PY

