name: NØX ACT39 - Confidence Calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  confidence-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT39
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from datetime import datetime, timezone

          ROOT = "."
          MEMORY = os.path.join(ROOT, "memory")
          os.makedirs(MEMORY, exist_ok=True)

          def load_json(path):
              if not os.path.exists(path):
                  return None
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def first_number(obj, paths):
              for path in paths:
                  cur = obj
                  ok = True
                  for part in path.split("."):
                      if isinstance(cur, dict) and part in cur:
                          cur = cur[part]
                      else:
                          ok = False
                          break
                  if ok and isinstance(cur, (int, float)) and not isinstance(cur, bool):
                      return float(cur), path
              return None, None

          def first_value(obj, paths):
              for path in paths:
                  cur = obj
                  ok = True
                  for part in path.split("."):
                      if isinstance(cur, dict) and part in cur:
                          cur = cur[part]
                      else:
                          ok = False
                          break
                  if ok:
                      return cur, path
              return None, None

          def clamp(value, low=0.0, high=100.0):
              return max(low, min(high, float(value)))

          def safe_mean(values):
              values = [float(v) for v in values if isinstance(v, (int, float))]
              return sum(values) / len(values) if values else None

          def extract_prediction_records(act28):
              candidates = []

              for key in [
                  "predictions",
                  "prediction_list",
                  "prediction_records",
                  "prediction_results"
              ]:
                  value = act28.get(key) if isinstance(act28, dict) else None
                  if isinstance(value, list):
                      candidates = value
                      break

              if not candidates and isinstance(act28, dict):
                  nested = act28.get("prediction_model")
                  if isinstance(nested, dict):
                      for key in ["predictions", "prediction_list", "records"]:
                          if isinstance(nested.get(key), list):
                              candidates = nested[key]
                              break

              return candidates

          def extract_confidence(record):
              if not isinstance(record, dict):
                  return None

              paths = [
                  "confidence",
                  "prediction_confidence",
                  "confidence_score",
                  "score"
              ]

              value, path = first_number(record, paths)
              if value is None:
                  return None

              # Normalize 0-1 confidence to 0-100.
              if 0.0 <= value <= 1.0:
                  value *= 100.0

              return clamp(value), path

          def extract_outcome(record):
              if not isinstance(record, dict):
                  return None, None

              for key in [
                  "outcome",
                  "actual_outcome",
                  "observed_outcome",
                  "verification_result",
                  "result"
              ]:
                  if key in record:
                      return record[key], key

              return None, None

          def classify_outcome(outcome):
              if outcome is None:
                  return None

              if isinstance(outcome, bool):
                  return bool(outcome)

              if isinstance(outcome, (int, float)) and not isinstance(outcome, bool):
                  return bool(outcome > 0)

              if isinstance(outcome, str):
                  value = outcome.strip().lower()

                  positive = {
                      "true",
                      "correct",
                      "confirmed",
                      "validated",
                      "success",
                      "successful",
                      "yes",
                      "match",
                      "matched",
                      "occurred",
                      "observed"
                  }

                  negative = {
                      "false",
                      "incorrect",
                      "rejected",
                      "failed",
                      "failure",
                      "no",
                      "mismatch",
                      "not_observed",
                      "did_not_occur"
                  }

                  if value in positive:
                      return True

                  if value in negative:
                      return False

              if isinstance(outcome, dict):
                  for key in [
                      "correct",
                      "confirmed",
                      "validated",
                      "success",
                      "match"
                  ]:
                      if isinstance(outcome.get(key), bool):
                          return outcome[key]

              return None

          act26 = load_json(os.path.join(MEMORY, "nox_act_26_active_attention.json")) or {}
          act27 = load_json(os.path.join(MEMORY, "nox_act_27_relational_understanding.json")) or {}
          act28 = load_json(os.path.join(MEMORY, "nox_act_28_anticipation_simulation.json")) or {}
          act29 = load_json(os.path.join(MEMORY, "nox_act_29_metacognition.json")) or {}
          act30 = load_json(os.path.join(MEMORY, "nox_act_30_adaptive_strategy_selection.json")) or {}
          act31 = load_json(os.path.join(MEMORY, "nox_act_31_strategy_evaluation.json")) or {}
          act32 = load_json(os.path.join(MEMORY, "nox_act_32_experiment_designer.json")) or {}
          act33 = load_json(os.path.join(MEMORY, "nox_act_33_resource_allocation.json")) or {}
          act34 = load_json(os.path.join(MEMORY, "nox_act_34_goal_formation.json")) or {}
          act35 = load_json(os.path.join(MEMORY, "nox_act_35_self_improvement.json")) or {}
          act36 = load_json(os.path.join(MEMORY, "nox_act_36_self_audit.json")) or {}
          act37 = load_json(os.path.join(MEMORY, "nox_act_37_cognitive_signal_reliability.json")) or {}
          act38 = load_json(os.path.join(MEMORY, "nox_act_38_evidence_fusion_contradiction_handling.json")) or {}

          prediction_records = extract_prediction_records(act28)

          confidence_records = []
          for index, prediction in enumerate(prediction_records):
              confidence_info = extract_confidence(prediction)
              if confidence_info is None:
                  continue

              confidence, confidence_field = confidence_info
              outcome, outcome_field = extract_outcome(prediction)
              correct = classify_outcome(outcome)

              confidence_records.append({
                  "index": index,
                  "confidence": round(confidence, 2),
                  "confidence_field": confidence_field,
                  "outcome": outcome,
                  "outcome_field": outcome_field,
                  "correct": correct
              })

          # ACT31 is authoritative for whether real comparable outcomes exist.
          observed_outcomes, observed_outcomes_field = first_number(
              act31,
              [
                  "observed_outcome_count",
                  "metrics.observed_outcomes",
                  "metrics.observed_outcome_count"
              ]
          )

          comparable_outcomes, comparable_outcomes_field = first_number(
              act31,
              [
                  "comparable_outcomes",
                  "metrics.comparable_outcomes",
                  "metrics.comparable_outcome_count"
              ]
          )

          evidence_quality, evidence_quality_field = first_number(
              act31,
              [
                  "evidence_quality",
                  "metrics.evidence_quality"
              ]
          )

          evaluation_status, _ = first_value(
              act31,
              [
                  "evaluation_status",
                  "strategy_state"
              ]
          )

          decision_confidence, decision_confidence_field = first_number(
              act30,
              [
                  "decision_confidence",
                  "metrics.decision_confidence"
              ]
          )

          fusion_confidence, fusion_confidence_field = first_number(
              act38,
              [
                  "global_confidence.result",
                  "metrics.fusion_confidence"
              ]
          )

          decision_ceiling, decision_ceiling_field = first_number(
              act38,
              [
                  "decision_readiness.autonomous_decision_confidence_ceiling",
                  "metrics.decision_confidence_ceiling"
              ]
          )

          # Only outcomes explicitly present and classifiable are treated as
          # calibration observations. Missing outcomes are NOT failures.
          evaluated = [
              item for item in confidence_records
              if item["correct"] is not None
          ]

          correct_count = sum(1 for item in evaluated if item["correct"])
          incorrect_count = len(evaluated) - correct_count

          empirical_accuracy = None
          if evaluated:
              empirical_accuracy = correct_count / len(evaluated) * 100.0

          mean_predicted_confidence = safe_mean(
              [item["confidence"] for item in evaluated]
          )

          calibration_error = None
          if empirical_accuracy is not None and mean_predicted_confidence is not None:
              calibration_error = abs(
                  mean_predicted_confidence - empirical_accuracy
              )

          if evaluated:
              if calibration_error is not None and calibration_error <= 10:
                  calibration_state = "reasonably_calibrated"
              elif calibration_error is not None and calibration_error <= 20:
                  calibration_state = "partially_calibrated"
              else:
                  calibration_state = "poorly_calibrated"
          else:
              calibration_state = "not_yet_measurable"

          # Brier-style score can only be computed where a binary outcome
          # actually exists. This is intentionally unavailable otherwise.
          brier_score = None
          if evaluated:
              squared_errors = []
              for item in evaluated:
                  predicted = item["confidence"] / 100.0
                  actual = 1.0 if item["correct"] else 0.0
                  squared_errors.append((predicted - actual) ** 2)
              brier_score = safe_mean(squared_errors)

          overconfidence_cases = []
          underconfidence_cases = []

          for item in evaluated:
              if item["correct"] and item["confidence"] < 50:
                  underconfidence_cases.append(item["index"])
              elif (not item["correct"]) and item["confidence"] >= 70:
                  overconfidence_cases.append(item["index"])

          # Current state: no valid empirical calibration data.
          # A high internal confidence must therefore remain bounded.
          if not evaluated:
              calibration_confidence = 15.0
              calibration_factor = 0.50
              calibration_state = "not_yet_measurable"
              recommendation = (
                  "Collect real comparable outcomes before modifying confidence "
                  "based on accuracy."
              )
          else:
              calibration_confidence = clamp(
                  40.0
                  + min(40.0, len(evaluated) * 5.0)
                  + (20.0 if calibration_error is not None and calibration_error <= 10 else 0.0)
              )

              if calibration_error is None:
                  calibration_factor = 0.50
              else:
                  # Reduce confidence when systematic calibration error is high.
                  calibration_factor = clamp(
                      1.0 - (calibration_error / 100.0),
                      0.50,
                      1.00
                  )

              recommendation = (
                  "Apply the measured calibration factor to future confidence "
                  "only after sufficient repeated observations."
              )

          # Independent safety ceiling from ACT38.
          if decision_ceiling is not None:
              calibrated_decision_ceiling = min(
                  decision_ceiling,
                  calibration_factor * 100.0
              )
          else:
              calibrated_decision_ceiling = calibration_factor * 100.0

          source_states = {
              "ACT28_predictions": bool(prediction_records),
              "ACT30_decision_confidence": decision_confidence is not None,
              "ACT31_outcomes": observed_outcomes is not None,
              "ACT31_comparable_outcomes": comparable_outcomes is not None,
              "ACT38_fusion": fusion_confidence is not None
          }

          memory = {
              "act": "ACT39",
              "name": "Confidence Calibration",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "purpose": (
                  "Compare NØX confidence with observed accuracy and progressively "
                  "calibrate confidence without inventing outcomes."
              ),
              "principle": (
                  "Confidence must be learned from repeated observed outcomes, "
                  "not assumed from internal scores."
              ),
              "source_acts": [
                  "ACT28",
                  "ACT30",
                  "ACT31",
                  "ACT38"
              ],
              "source_states": source_states,
              "calibration_model": {
                  "confidence_measurement": (
                      "Internal confidence attached to an explicit prediction."
                  ),
                  "observed_accuracy": (
                      "Measured correctness only when a real outcome is explicitly available."
                  ),
                  "calibration_error": (
                      "Absolute difference between mean predicted confidence "
                      "and observed accuracy."
                  ),
                  "missing_outcomes_rule": (
                      "Missing outcomes are excluded from calibration and never "
                      "counted as failures."
                  ),
                  "minimum_evidence_rule": (
                      "No strong calibration claim is permitted without repeated "
                      "comparable observations."
                  )
              },
              "prediction_records_found": len(prediction_records),
              "confidence_records_found": len(confidence_records),
              "evaluated_prediction_count": len(evaluated),
              "correct_prediction_count": correct_count,
              "incorrect_prediction_count": incorrect_count,
              "observed_outcomes": observed_outcomes,
              "comparable_outcomes": comparable_outcomes,
              "evidence_quality": evidence_quality,
              "evaluation_status": evaluation_status,
              "mean_predicted_confidence": (
                  round(mean_predicted_confidence, 2)
                  if mean_predicted_confidence is not None else None
              ),
              "empirical_accuracy": (
                  round(empirical_accuracy, 2)
                  if empirical_accuracy is not None else None
              ),
              "calibration_error": (
                  round(calibration_error, 2)
                  if calibration_error is not None else None
              ),
              "brier_score": (
                  round(brier_score, 4)
                  if brier_score is not None else None
              ),
              "overconfidence_cases": overconfidence_cases,
              "underconfidence_cases": underconfidence_cases,
              "calibration_state": calibration_state,
              "calibration_factor": round(calibration_factor, 3),
              "calibration_confidence": round(calibration_confidence, 2),
              "previous_internal_decision_confidence": decision_confidence,
              "fusion_confidence": fusion_confidence,
              "fusion_decision_ceiling": decision_ceiling,
              "calibrated_decision_confidence_ceiling": round(
                  calibrated_decision_ceiling, 2
              ),
              "confidence_policy": {
                  "status": "learning_only",
                  "current_calibration_is_empirical": bool(evaluated),
                  "confidence_may_be_adjusted": bool(evaluated),
                  "strong_autonomous_confidence_allowed": False,
                  "rule": (
                      "Do not increase autonomous confidence solely because "
                      "internal confidence is high."
                  )
              },
              "decision_policy": [
                  "Do not treat missing outcomes as incorrect predictions.",
                  "Do not treat predictions without outcomes as calibration evidence.",
                  "Do not claim calibration when there are no evaluated outcomes.",
                  "Use repeated comparable outcomes before making strong calibration adjustments.",
                  "Reduce confidence when observed accuracy is below predicted confidence.",
                  "Do not increase confidence merely because internal scores are high.",
                  "Keep calibration separate from measurement reliability.",
                  "Keep empirical accuracy separate from structural consistency.",
                  "Use ACT38 decision ceilings as an independent upper bound.",
                  "A calibration factor does not grant execution permission."
              ],
              "lessons": [
                  "Confidence cannot be calibrated without outcomes.",
                  "A prediction can be confidently made and still remain empirically untested.",
                  "Calibration requires repeated comparison between predicted confidence and actual results.",
                  "Missing evidence is not evidence of failure.",
                  "Confidence calibration is itself a learned capability."
              ],
              "repair_queue": [
                  {
                      "priority": "high",
                      "issue": "prediction_outcomes",
                      "action": (
                          "Record actual outcomes for predictions in a canonical "
                          "structured field so future calibration can evaluate them."
                      )
                  },
                  {
                      "priority": "medium",
                      "issue": "confidence_field_contract",
                      "action": (
                          "Preserve prediction confidence and outcome fields "
                          "unchanged across downstream ACTs."
                      )
                  }
              ],
              "metrics": {
                  "prediction_records": len(prediction_records),
                  "confidence_records": len(confidence_records),
                  "evaluated_predictions": len(evaluated),
                  "observed_outcomes": observed_outcomes if observed_outcomes is not None else 0,
                  "comparable_outcomes": comparable_outcomes if comparable_outcomes is not None else 0,
                  "calibration_error": (
                      round(calibration_error, 2)
                      if calibration_error is not None else None
                  ),
                  "calibration_factor": round(calibration_factor, 3),
                  "calibration_confidence": round(calibration_confidence, 2)
              },
              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT39 may calibrate confidence from real outcomes, "
                      "but cannot execute actions, spend funds or make payments."
                  )
              },
              "next_action": (
                  "collect_repeated_real_outcomes_and_recalibrate"
                  if evaluated
                  else "collect_real_outcomes_before_calibration"
              ),
              "next_cognitive_step": (
                  "ACT40 should learn how to select actions using calibrated "
                  "confidence, evidence quality and expected value while preserving "
                  "uncertainty and reversibility."
              )
          }

          output_path = os.path.join(
              MEMORY,
              "nox_act_39_confidence_calibration.json"
          )

          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(memory, f, indent=2, ensure_ascii=False)

          print("========================================")
          print("NØX ACT39 - CONFIDENCE CALIBRATION")
          print("========================================")
          print(f"Prediction records found: {len(prediction_records)}")
          print(f"Confidence records found: {len(confidence_records)}")
          print(f"Evaluated predictions: {len(evaluated)}")
          print(f"Observed outcomes: {observed_outcomes}")
          print(f"Comparable outcomes: {comparable_outcomes}")
          print(f"Mean predicted confidence: {mean_predicted_confidence}")
          print(f"Empirical accuracy: {empirical_accuracy}")
          print(f"Calibration error: {calibration_error}")
          print(f"Calibration state: {calibration_state}")
          print(f"Calibration factor: {calibration_factor:.3f}")
          print(f"Calibration confidence: {calibration_confidence:.2f}")
          print(
              "Calibrated decision confidence ceiling: "
              f"{calibrated_decision_ceiling:.2f}"
          )
          print(f"Overconfidence cases: {len(overconfidence_cases)}")
          print(f"Underconfidence cases: {len(underconfidence_cases)}")
          print(f"Memory written: {output_path}")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          print("Execution permission: false")
          print("========================================")
          PY

      - name: Commit ACT39 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_act_39_confidence_calibration.json

          if git diff --cached --quiet; then
            echo "No ACT39 memory changes to commit."
            exit 0
          fi

          git commit -m "Add ACT39 confidence calibration memory"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed on attempt $attempt"
              git rebase --abort || true
              sleep $((attempt * 3))
              continue
            }

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep $((attempt * 4))
          done

          echo "Unable to push ACT39 after 5 attempts."
          exit 1
