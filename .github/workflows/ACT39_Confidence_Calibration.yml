name: "NØX ACT39 V5 - Confidence Calibration"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  confidence-calibration:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT39 V5
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          # ============================================================
          # Generic helpers
          # ============================================================

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def write_json(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          def first_value(*values):
              for value in values:
                  if value is not None:
                      return value
              return None

          def numeric(value):
              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  return float(value)

              if isinstance(value, str):
                  try:
                      return float(value.strip().replace("%", ""))
                  except Exception:
                      return None

              return None

          def clamp(value, low, high):
              return max(low, min(high, value))

          # ============================================================
          # Robust ACT source discovery
          # ============================================================

          def find_act_file(act_number, preferred_names=None):
              preferred_names = preferred_names or []

              for name in preferred_names:
                  path = MEMORY / name
                  if path.exists():
                      data = load_json(path)
                      if (
                          isinstance(data, dict)
                          and str(data.get("act", "")).upper()
                          == act_number.upper()
                      ):
                          return path, data

              number = act_number.lower().replace("act", "")

              candidates = list(
                  MEMORY.glob(f"*act_{number}*.json")
              )

              candidates += list(
                  MEMORY.glob(f"*act{number}*.json")
              )

              candidates += list(
                  MEMORY.glob(f"*{act_number.lower()}*.json")
              )

              matches = []

              seen = set()

              for path in candidates:
                  if path in seen:
                      continue

                  seen.add(path)

                  data = load_json(path)

                  if (
                      isinstance(data, dict)
                      and str(data.get("act", "")).upper()
                      == act_number.upper()
                  ):
                      matches.append((path, data))

              if not matches:
                  return None, {}

              matches.sort(
                  key=lambda item: item[0].stat().st_mtime,
                  reverse=True
              )

              return matches[0]

          act28_path, act28 = find_act_file(
              "ACT28",
              [
                  "nox_act_28_anticipation_simulation.json"
              ]
          )

          act30_path, act30 = find_act_file(
              "ACT30",
              [
                  "nox_act_30_adaptive_strategy_selection.json"
              ]
          )

          act31_path, act31 = find_act_file(
              "ACT31",
              [
                  "nox_act_31_strategy_evaluation.json"
              ]
          )

          act38_path, act38 = find_act_file(
              "ACT38",
              [
                  "nox_act_38_evidence_fusion.json",
                  "nox_act_38_evidence_fusion_contradiction_handling.json",
                  "nox_act_38.json"
              ]
          )

          print("========================================")
          print("NØX ACT39 V5 - SOURCE DISCOVERY")
          print("========================================")
          print(f"ACT28 source: {act28_path}")
          print(f"ACT30 source: {act30_path}")
          print(f"ACT31 source: {act31_path}")
          print(f"ACT38 source: {act38_path}")
          print("----------------------------------------")

          if not isinstance(act28, dict):
              act28 = {}

          if not isinstance(act30, dict):
              act30 = {}

          if not isinstance(act31, dict):
              act31 = {}

          if not isinstance(act38, dict):
              act38 = {}

          # ============================================================
          # Confidence extraction
          #
          # ACT28 has already produced valid confidence values.
          # The downstream contract must preserve them.
          #
          # V5 searches recursively and distinguishes:
          # - missing confidence
          # - explicit zero
          # - decimal probability 0.00-1.00
          # - percentage 1-100
          #
          # A zero is valid only when no stronger non-zero confidence
          # candidate exists for the same prediction.
          # ============================================================

          CONFIDENCE_KEYS = {
              "confidence",
              "prediction_confidence",
              "predicted_confidence",
              "confidence_score",
              "confidence_percent",
              "confidence_percentage",
              "probability",
              "predicted_probability",
              "prediction_probability"
          }

          def normalize_confidence(value):
              n = numeric(value)

              if n is None:
                  return None

              # Decimal probability:
              # 0.76 -> 76.0
              if 0.0 < n <= 1.0:
                  return n * 100.0

              # Percentage:
              # 76 -> 76.0
              if 0.0 <= n <= 100.0:
                  return n

              return None

          def confidence_candidates(obj, path="root"):
              found = []

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      key_lower = str(key).strip().lower()

                      if key_lower in CONFIDENCE_KEYS:
                          normalized = normalize_confidence(value)

                          if normalized is not None:
                              found.append({
                                  "path": f"{path}.{key}",
                                  "raw": value,
                                  "normalized": normalized
                              })

                      if isinstance(value, (dict, list)):
                          found.extend(
                              confidence_candidates(
                                  value,
                                  f"{path}.{key}"
                              )
                          )

              elif isinstance(obj, list):

                  for index, value in enumerate(obj):

                      if isinstance(value, (dict, list)):
                          found.extend(
                              confidence_candidates(
                                  value,
                                  f"{path}[{index}]"
                              )
                          )

              return found

          def select_confidence(prediction):

              candidates = confidence_candidates(prediction)

              if not candidates:
                  return None, None, []

              # Prefer non-zero values over zero placeholders.
              non_zero = [
                  item
                  for item in candidates
                  if item["normalized"] > 0
              ]

              if non_zero:
                  # Prefer canonical confidence field names.
                  priority = {
                      "confidence": 0,
                      "predicted_confidence": 1,
                      "prediction_confidence": 2,
                      "confidence_score": 3,
                      "confidence_percent": 4,
                      "confidence_percentage": 5,
                      "probability": 6,
                      "predicted_probability": 7,
                      "prediction_probability": 8
                  }

                  def candidate_priority(item):
                      last_key = item["path"].split(".")[-1]
                      return (
                          priority.get(last_key, 50),
                          -item["normalized"]
                      )

                  selected = sorted(
                      non_zero,
                      key=candidate_priority
                  )[0]

                  return (
                      selected["normalized"],
                      selected["path"],
                      candidates
                  )

              # Explicit zero is valid if it is the only available value.
              selected = candidates[0]

              return (
                  0.0,
                  selected["path"],
                  candidates
              )

          # ============================================================
          # Locate predictions
          # ============================================================

          raw_predictions = act28.get("predictions", [])

          if not isinstance(raw_predictions, list):
              raw_predictions = []

          # Some historical structures may store predictions in another
          # container. Only use it if the canonical list is absent.
          if not raw_predictions:

              for fallback_key in [
                  "prediction_records",
                  "predictions_generated",
                  "prediction_list"
              ]:
                  candidate = act28.get(fallback_key)

                  if isinstance(candidate, list):
                      raw_predictions = candidate
                      break

          prediction_records = []

          for index, prediction in enumerate(
              raw_predictions,
              start=1
          ):

              if not isinstance(prediction, dict):
                  continue

              prediction_id = first_value(
                  prediction.get("prediction_id"),
                  prediction.get("id"),
                  f"P{index:03d}"
              )

              hypothesis = first_value(
                  prediction.get("hypothesis"),
                  prediction.get("prediction"),
                  prediction.get("relationship"),
                  prediction.get("name")
              )

              predicted_consequence = first_value(
                  prediction.get("predicted_consequence"),
                  prediction.get("expected_consequence"),
                  prediction.get("expected_outcome"),
                  prediction.get("consequence")
              )

              confidence, confidence_source, confidence_candidates_found = (
                  select_confidence(prediction)
              )

              if confidence is None:
                  confidence = 0.0
                  confidence_source = "missing_confidence"
              else:
                  confidence = round(
                      clamp(confidence, 0.0, 100.0),
                      2
                  )

              outcome = first_value(
                  prediction.get("outcome"),
                  prediction.get("actual_outcome"),
                  prediction.get("observed_outcome")
              )

              outcome_source = first_value(
                  prediction.get("outcome_source"),
                  prediction.get("actual_source"),
                  prediction.get("verification_source")
              )

              scored = outcome is not None
              accuracy = None

              if scored:

                  if isinstance(outcome, bool):
                      accuracy = (
                          1.0
                          if outcome
                          else 0.0
                      )

                  elif numeric(outcome) is not None:
                      accuracy = clamp(
                          numeric(outcome),
                          0.0,
                          1.0
                      )

              prediction_records.append({
                  "prediction_id": prediction_id,
                  "hypothesis": hypothesis,
                  "predicted_consequence": predicted_consequence,
                  "confidence": confidence,
                  "confidence_source": (
                      confidence_source
                      if confidence_source
                      else "predicted_confidence"
                  ),
                  "confidence_candidates_found": len(
                      confidence_candidates_found
                  ),
                  "outcome": outcome,
                  "outcome_source": outcome_source,
                  "scored": scored,
                  "accuracy": accuracy
              })

          # ============================================================
          # ACT31 outcomes
          # ============================================================

          act31_metrics = act31.get("metrics", {})

          if not isinstance(act31_metrics, dict):
              act31_metrics = {}

          observed_outcomes = first_value(
              act31.get("observed_outcome_count"),
              act31.get("observed_outcomes"),
              act31_metrics.get("observed_outcomes"),
              0
          )

          comparable_outcomes = first_value(
              act31.get("comparable_outcomes"),
              act31_metrics.get("comparable_outcomes"),
              0
          )

          observed_outcomes = numeric(observed_outcomes)
          comparable_outcomes = numeric(comparable_outcomes)

          if observed_outcomes is None:
              observed_outcomes = 0.0

          if comparable_outcomes is None:
              comparable_outcomes = 0.0

          evidence_quality = first_value(
              act31.get("evidence_quality"),
              act31_metrics.get("evidence_quality"),
              60.0
          )

          evidence_quality = numeric(evidence_quality)

          if evidence_quality is None:
              evidence_quality = 60.0

          evaluation_status = first_value(
              act31.get("evaluation_status"),
              act31_metrics.get("evaluation_status"),
              "inconclusive"
          )

          # Zero outcomes means predictions remain unscored.
          if observed_outcomes == 0:

              for record in prediction_records:
                  record["outcome"] = None
                  record["outcome_source"] = None
                  record["scored"] = False
                  record["accuracy"] = None

          evaluated_predictions = sum(
              1
              for record in prediction_records
              if record["scored"]
          )

          accuracies = [
              record["accuracy"]
              for record in prediction_records
              if record["scored"]
              and record["accuracy"] is not None
          ]

          confidences = [
              record["confidence"]
              for record in prediction_records
              if isinstance(
                  record["confidence"],
                  (int, float)
              )
          ]

          # ============================================================
          # Confidence diagnostics
          # ============================================================

          confidence_nonzero_count = sum(
              1
              for record in prediction_records
              if record["confidence"] > 0
          )

          confidence_missing_count = sum(
              1
              for record in prediction_records
              if record["confidence_source"] == "missing_confidence"
          )

          mean_predicted_confidence = (
              sum(confidences) / len(confidences)
              if confidences
              else None
          )

          empirical_accuracy = (
              sum(accuracies)
              / len(accuracies)
              * 100.0
              if accuracies
              else None
          )

          correct_predictions = sum(
              1
              for value in accuracies
              if value >= 0.5
          )

          incorrect_predictions = sum(
              1
              for value in accuracies
              if value < 0.5
          )

          # ============================================================
          # Calibration buckets
          # ============================================================

          bucket_ranges = [
              ("0.00-0.49", 0.0, 49.99),
              ("0.50-0.59", 50.0, 59.99),
              ("0.60-0.69", 60.0, 69.99),
              ("0.70-0.79", 70.0, 79.99),
              ("0.80-0.89", 80.0, 89.99),
              ("0.90-1.00", 90.0, 100.0)
          ]

          calibration_buckets = []

          for label, low, high in bucket_ranges:

              bucket = [
                  record
                  for record in prediction_records
                  if low <= record["confidence"] <= high
              ]

              scored_bucket = [
                  record
                  for record in bucket
                  if record["scored"]
                  and record["accuracy"] is not None
              ]

              if not bucket:

                  calibration_buckets.append({
                      "confidence_range": label,
                      "predictions": 0,
                      "observed_outcomes": 0,
                      "mean_confidence": None,
                      "observed_accuracy": None,
                      "calibration_error": None,
                      "status": "no_predictions"
                  })

                  continue

              mean_confidence = (
                  sum(
                      record["confidence"]
                      for record in bucket
                  )
                  / len(bucket)
              )

              if not scored_bucket:

                  calibration_buckets.append({
                      "confidence_range": label,
                      "predictions": len(bucket),
                      "observed_outcomes": 0,
                      "mean_confidence": round(
                          mean_confidence,
                          2
                      ),
                      "observed_accuracy": None,
                      "calibration_error": None,
                      "status": "awaiting_outcomes"
                  })

                  continue

              accuracy = (
                  sum(
                      record["accuracy"]
                      for record in scored_bucket
                  )
                  / len(scored_bucket)
                  * 100.0
              )

              calibration_buckets.append({
                  "confidence_range": label,
                  "predictions": len(bucket),
                  "observed_outcomes": len(
                      scored_bucket
                  ),
                  "mean_confidence": round(
                      mean_confidence,
                      2
                  ),
                  "observed_accuracy": round(
                      accuracy,
                      2
                  ),
                  "calibration_error": round(
                      abs(
                          mean_confidence
                          - accuracy
                      ),
                      2
                  ),
                  "status": "measured"
              })

          # ============================================================
          # Calibration model
          # ============================================================

          calibration_factor = 1.0
          calibration_status = "baseline_only"
          calibration_empirical = False
          calibration_usable = False
          calibration_confidence = 15.0
          calibration_error = None
          brier_score = None

          if evaluated_predictions > 0:

              confidence_values = [
                  record["confidence"] / 100.0
                  for record in prediction_records
                  if record["scored"]
              ]

              calibration_error = (
                  sum(
                      abs(
                          confidence_values[i]
                          - accuracies[i]
                      )
                      for i in range(
                          len(accuracies)
                      )
                  )
                  / len(accuracies)
              )

              brier_score = (
                  sum(
                      (
                          confidence_values[i]
                          - accuracies[i]
                      ) ** 2
                      for i in range(
                          len(accuracies)
                      )
                  )
                  / len(accuracies)
              )

              observed_accuracy_fraction = (
                  empirical_accuracy / 100.0
              )

              mean_confidence_fraction = (
                  mean_predicted_confidence / 100.0
              )

              if mean_confidence_fraction > 0:

                  calibration_factor = (
                      observed_accuracy_fraction
                      / mean_confidence_fraction
                  )

              calibration_factor = clamp(
                  calibration_factor,
                  0.5,
                  1.5
              )

              if evaluated_predictions >= 5:

                  calibration_status = "empirical"
                  calibration_empirical = True
                  calibration_usable = True

                  calibration_confidence = clamp(
                      40.0
                      + evaluated_predictions * 5.0,
                      40.0,
                      90.0
                  )

              else:

                  calibration_status = (
                      "insufficient_outcomes"
                  )

                  calibration_empirical = True
                  calibration_usable = False
                  calibration_confidence = 25.0

          # ============================================================
          # Overconfidence / underconfidence
          # ============================================================

          overconfidence_cases = []
          underconfidence_cases = []

          for record in prediction_records:

              if not record["scored"]:
                  continue

              confidence_fraction = (
                  record["confidence"]
                  / 100.0
              )

              gap = (
                  confidence_fraction
                  - record["accuracy"]
              )

              if gap >= 0.20:

                  overconfidence_cases.append({
                      "prediction_id": record[
                          "prediction_id"
                      ],
                      "confidence": record[
                          "confidence"
                      ],
                      "accuracy": round(
                          record["accuracy"]
                          * 100.0,
                          2
                      ),
                      "gap": round(
                          gap * 100.0,
                          2
                      )
                  })

              elif gap <= -0.20:

                  underconfidence_cases.append({
                      "prediction_id": record[
                          "prediction_id"
                      ],
                      "confidence": record[
                          "confidence"
                      ],
                      "accuracy": round(
                          record["accuracy"]
                          * 100.0,
                          2
                      ),
                      "gap": round(
                          abs(gap) * 100.0,
                          2
                      )
                  })

          overconfidence_status = (
              "not_measurable"
              if evaluated_predictions == 0
              else (
                  "detected"
                  if overconfidence_cases
                  else "not_detected"
              )
          )

          underconfidence_status = (
              "not_measurable"
              if evaluated_predictions == 0
              else (
                  "detected"
                  if underconfidence_cases
                  else "not_detected"
              )
          )

          # ============================================================
          # ACT30
          # ============================================================

          act30_metrics = act30.get("metrics", {})

          if not isinstance(act30_metrics, dict):
              act30_metrics = {}

          decision_confidence = first_value(
              act30.get("decision_confidence"),
              act30_metrics.get(
                  "decision_confidence"
              ),
              82.0
          )

          decision_confidence = numeric(
              decision_confidence
          )

          if decision_confidence is None:
              decision_confidence = 82.0

          # ============================================================
          # ACT38 V3 canonical contract
          # ============================================================

          act38_canonical = act38.get(
              "canonical_metrics",
              {}
          )

          if not isinstance(
              act38_canonical,
              dict
          ):
              act38_canonical = {}

          act38_metrics = act38.get(
              "metrics",
              {}
          )

          if not isinstance(
              act38_metrics,
              dict
          ):
              act38_metrics = {}

          act38_fusion_confidence = first_value(
              act38_canonical.get(
                  "fusion_confidence"
              ),
              act38.get(
                  "fusion_confidence"
              ),
              act38_metrics.get(
                  "fusion_confidence"
              )
          )

          act38_decision_ceiling = first_value(
              act38_canonical.get(
                  "decision_confidence_ceiling"
              ),
              act38.get(
                  "decision_confidence_ceiling"
              ),
              act38_metrics.get(
                  "decision_confidence_ceiling"
              )
          )

          act38_fusion_confidence = numeric(
              act38_fusion_confidence
          )

          act38_decision_ceiling = numeric(
              act38_decision_ceiling
          )

          act38_contract_valid = (
              act38_path is not None
              and act38_fusion_confidence is not None
              and act38_decision_ceiling is not None
          )

          if not act38_contract_valid:

              raise SystemExit(
                  "ACT38 V3 canonical contract could not "
                  "be loaded. Refusing to use fallback values."
              )

          previous_ceiling = (
              act38_decision_ceiling
          )

          fusion_for_policy = (
              act38_fusion_confidence
          )

          # ============================================================
          # Decision ceiling
          # ============================================================

          calibrated_ceiling = (
              previous_ceiling
          )

          ceiling_increase_allowed = False

          if (
              calibration_empirical
              and calibration_usable
              and comparable_outcomes >= 5
              and calibration_confidence >= 70
              and evidence_quality >= 75
              and fusion_for_policy >= 50
          ):

              calibrated_ceiling = min(
                  100.0,
                  previous_ceiling
                  * calibration_factor
              )

              ceiling_increase_allowed = (
                  calibrated_ceiling
                  > previous_ceiling
              )

          if (
              calibrated_ceiling
              < previous_ceiling
          ):
              calibrated_ceiling = (
                  previous_ceiling
              )

          # ============================================================
          # Source completeness
          # ============================================================

          source_states = {
              "ACT28_predictions": (
                  len(prediction_records) > 0
              ),

              "ACT30_decision_confidence": (
                  decision_confidence is not None
              ),

              "ACT31_outcomes": (
                  act31_path is not None
              ),

              "ACT31_comparable_outcomes": (
                  comparable_outcomes is not None
              ),

              "ACT38_fusion_confidence": (
                  act38_fusion_confidence
                  is not None
              ),

              "ACT38_decision_ceiling": (
                  act38_decision_ceiling
                  is not None
              )
          }

          source_completeness = (
              sum(
                  1
                  for value in source_states.values()
                  if value
              )
              / len(source_states)
              * 100.0
          )

          # ============================================================
          # Result
          # ============================================================

          result = {
              "act": "ACT39",
              "version": "V5",
              "name": "Confidence Calibration",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Determine whether NØX confidence tracks "
                  "observed accuracy and calibrate confidence "
                  "only when repeated real outcomes justify "
                  "an adjustment."
              ),

              "principle": (
                  "Confidence is a prediction about reliability; "
                  "only repeated observed outcomes can determine "
                  "whether that confidence is calibrated."
              ),

              "source_acts": [
                  "ACT28",
                  "ACT30",
                  "ACT31",
                  "ACT38"
              ],

              "source_files": {
                  "ACT28": (
                      str(act28_path)
                      if act28_path
                      else None
                  ),
                  "ACT30": (
                      str(act30_path)
                      if act30_path
                      else None
                  ),
                  "ACT31": (
                      str(act31_path)
                      if act31_path
                      else None
                  ),
                  "ACT38": (
                      str(act38_path)
                      if act38_path
                      else None
                  )
              },

              "source_states": source_states,

              "source_completeness": round(
                  source_completeness,
                  2
              ),

              "act38_contract": {
                  "contract_version": (
                      "ACT38_V3_canonical_metrics"
                  ),
                  "valid": act38_contract_valid,
                  "fusion_confidence": round(
                      fusion_for_policy,
                      2
                  ),
                  "decision_confidence_ceiling": round(
                      previous_ceiling,
                      2
                  ),
                  "source": (
                      "ACT38_V3_canonical"
                  )
              },

              "confidence_recovery": {
                  "method": (
                      "recursive_multi_field_search"
                  ),
                  "prediction_count": len(
                      prediction_records
                  ),
                  "nonzero_confidence_count": (
                      confidence_nonzero_count
                  ),
                  "missing_confidence_count": (
                      confidence_missing_count
                  ),
                  "normalization": (
                      "decimal_probability_to_percentage"
                  ),
                  "zero_is_valid": True,
                  "missing_is_not_zero": True
              },

              "calibration_model": {
                  "confidence_is_prediction": True,
                  "outcome_required_for_scoring": True,
                  "missing_outcome_is_not_failure": True,
                  "zero_outcomes_is_valid_measurement": True,
                  "calibration_requires_repeated_observations": True,
                  "internal_calibration_is_not_external_validation": True,
                  "confidence_does_not_validate_confidence": True
              },

              "prediction_records": prediction_records,

              "calibration_buckets": calibration_buckets,

              "overconfidence": {
                  "status": overconfidence_status,
                  "cases": overconfidence_cases
              },

              "underconfidence": {
                  "status": underconfidence_status,
                  "cases": underconfidence_cases
              },

              "calibration": {
                  "factor": round(
                      calibration_factor,
                      4
                  ),
                  "status": calibration_status,
                  "empirical": calibration_empirical,
                  "usable_for_autonomous_decision": (
                      calibration_usable
                  ),
                  "confidence": round(
                      calibration_confidence,
                      2
                  ),
                  "reason": (
                      "No empirical correction is justified yet; "
                      "1.0 is a neutral baseline, not evidence "
                      "of good calibration."
                      if evaluated_predictions == 0
                      else
                      "Calibration derived from observed "
                      "prediction outcomes."
                  )
              },

              "metrics": {
                  "prediction_records": len(
                      prediction_records
                  ),

                  "confidence_records": len(
                      prediction_records
                  ),

                  "confidence_nonzero_count": (
                      confidence_nonzero_count
                  ),

                  "confidence_missing_count": (
                      confidence_missing_count
                  ),

                  "evaluated_predictions": (
                      evaluated_predictions
                  ),

                  "observed_outcomes": (
                      float(observed_outcomes)
                  ),

                  "comparable_outcomes": (
                      float(comparable_outcomes)
                  ),

                  "correct_predictions": (
                      correct_predictions
                  ),

                  "incorrect_predictions": (
                      incorrect_predictions
                  ),

                  "mean_predicted_confidence": (
                      round(
                          mean_predicted_confidence,
                          2
                      )
                      if mean_predicted_confidence
                      is not None
                      else None
                  ),

                  "empirical_accuracy": (
                      round(
                          empirical_accuracy,
                          2
                      )
                      if empirical_accuracy
                      is not None
                      else None
                  ),

                  "calibration_error": (
                      round(
                          calibration_error * 100.0,
                          4
                      )
                      if calibration_error
                      is not None
                      else None
                  ),

                  "brier_score": (
                      round(
                          brier_score,
                          6
                      )
                      if brier_score
                      is not None
                      else None
                  ),

                  "overconfidence_cases": len(
                      overconfidence_cases
                  ),

                  "underconfidence_cases": len(
                      underconfidence_cases
                  ),

                  "calibration_factor": round(
                      calibration_factor,
                      4
                  ),

                  "calibration_confidence": round(
                      calibration_confidence,
                      2
                  )
              },

              "upstream_measurements": {
                  "ACT30_decision_confidence": round(
                      decision_confidence,
                      2
                  ),

                  "ACT31_evidence_quality": round(
                      evidence_quality,
                      2
                  ),

                  "ACT31_evaluation_status": (
                      evaluation_status
                  ),

                  "ACT38_fusion_confidence": round(
                      fusion_for_policy,
                      2
                  ),

                  "ACT38_decision_confidence_ceiling": round(
                      previous_ceiling,
                      2
                  )
              },

              "decision_ceiling": {
                  "source": (
                      "empirical_calibration"
                      if ceiling_increase_allowed
                      else "ACT38_V3_canonical"
                  ),

                  "previous_ceiling": round(
                      previous_ceiling,
                      2
                  ),

                  "calibrated_ceiling": round(
                      calibrated_ceiling,
                      2
                  ),

                  "may_increase": (
                      ceiling_increase_allowed
                  )
              },

              "decision_policy": [
                  "Do not treat confidence as accuracy.",
                  "Do not score predictions without real outcomes.",
                  "Do not treat missing outcomes as incorrect predictions.",
                  "Do not derive a correction from zero observations.",
                  "A calibration factor of 1.0 with zero outcomes is a neutral baseline, not validation.",
                  "Require repeated outcome-backed observations before strong calibration.",
                  "Do not increase autonomous decision confidence from calibration alone.",
                  "Use observed accuracy rather than internal confidence to evaluate calibration.",
                  "Keep measurement reliability separate from empirical accuracy.",
                  "Keep calibration separate from external truth validation.",
                  "Preserve conservative decision ceilings when calibration is unavailable.",
                  "Read ACT38 V3 canonical metrics before any fallback.",
                  "Never silently replace missing upstream evidence with fabricated values.",
                  "Preserve non-zero ACT28 confidence values across downstream cognitive layers.",
                  "Normalize decimal probabilities and percentage confidence without changing their meaning.",
                  "A real zero confidence must remain zero; missing confidence must remain distinguishable from zero."
              ],

              "repair_queue": [
                  {
                      "priority": "high",
                      "issue": "prediction_outcomes",
                      "action": (
                          "Collect actual outcomes for ACT28 "
                          "predictions in a canonical structured field."
                      )
                  },

                  {
                      "priority": "high",
                      "issue": "real_world_calibration",
                      "action": (
                          "Generate repeated comparable "
                          "prediction-outcome observations "
                          "before changing the calibration factor."
                      )
                  },

                  {
                      "priority": "medium",
                      "issue": "confidence_data_contract",
                      "action": (
                          "Preserve prediction confidence fields "
                          "unchanged from ACT28 through downstream "
                          "cognitive layers."
                      )
                  }
              ],

              "lessons": [
                  "NØX currently has predictions but no outcome-backed calibration evidence.",
                  "The absence of outcomes must not reduce prediction accuracy to zero.",
                  "A neutral calibration factor is preferable to an unsupported penalty.",
                  "Reliable confidence calibration requires repeated prediction-outcome comparisons.",
                  "ACT38 V3 canonical metrics must remain available to downstream cognitive layers.",
                  "Data-contract reliability remains part of NØX's cognitive capability.",
                  "Confidence representation must preserve the distinction between missing, zero, decimal probability and percentage."
              ],

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,

                  "rule": (
                      "ACT39 may measure and calibrate "
                      "confidence, but cannot grant execution "
                      "or financial authority."
                  )
              },

              "next_action": (
                  "collect_real_outcomes_before_calibration"
              ),

              "next_cognitive_step": (
                  "ACT40 should use calibrated confidence, "
                  "evidence quality and expected value to improve "
                  "action selection without converting uncertainty "
                  "into false certainty."
              )
          }

          # ============================================================
          # Stable downstream aliases
          # ============================================================

          result["fusion_confidence"] = round(
              fusion_for_policy,
              2
          )

          result["decision_confidence_ceiling"] = round(
              previous_ceiling,
              2
          )

          result[
              "calibrated_decision_confidence_ceiling"
          ] = round(
              calibrated_ceiling,
              2
          )

          result["observed_outcomes"] = float(
              observed_outcomes
          )

          result["comparable_outcomes"] = float(
              comparable_outcomes
          )

          result["calibration_factor"] = round(
              calibration_factor,
              4
          )

          result["calibration_status"] = (
              calibration_status
          )

          # ============================================================
          # Strict validation
          # ============================================================

          validation = {
              "prediction_records_10": (
                  len(prediction_records) == 10
              ),

              "confidence_records_10": (
                  len(prediction_records) == 10
              ),

              "confidence_recovered": (
                  confidence_nonzero_count == 10
              ),

              "confidence_not_silently_zeroed": (
                  confidence_missing_count == 0
              ),

              "act38_file_discovered": (
                  act38_path is not None
              ),

              "act38_fusion_confidence_present": (
                  act38_fusion_confidence is not None
              ),

              "act38_decision_ceiling_present": (
                  act38_decision_ceiling is not None
              ),

              "source_completeness_100": (
                  source_completeness == 100.0
              ),

              "act38_contract_valid": (
                  act38_contract_valid
              ),

              "zero_outcomes_preserved": (
                  observed_outcomes == 0
                  and comparable_outcomes == 0
              ),

              "neutral_calibration_without_outcomes": (
                  evaluated_predictions == 0
                  and calibration_factor == 1.0
                  and calibration_status
                  == "baseline_only"
              ),

              "decision_ceiling_preserved": (
                  calibrated_ceiling
                  >= previous_ceiling
              ),

              "gemini_false": (
                  result["gemini_used"] is False
              ),

              "cost_zero": (
                  result["project_cost_eur"] == 0
              )
          }

          result["validation"] = validation

          output_path = (
              MEMORY
              / "nox_act_39_confidence_calibration.json"
          )

          write_json(
              output_path,
              result
          )

          # ============================================================
          # Console output
          # ============================================================

          print("========================================")
          print("NØX ACT39 V5 - CONFIDENCE CALIBRATION")
          print("========================================")
          print(f"ACT28 source: {act28_path}")
          print(f"ACT38 source: {act38_path}")
          print("----------------------------------------")
          print(
              f"Prediction records: "
              f"{len(prediction_records)}"
          )
          print(
              f"Confidence records: "
              f"{len(prediction_records)}"
          )
          print(
              f"Non-zero confidence values: "
              f"{confidence_nonzero_count}"
          )
          print(
              f"Missing confidence values: "
              f"{confidence_missing_count}"
          )
          print(
              f"Mean predicted confidence: "
              f"{mean_predicted_confidence}"
          )
          print(
              f"Observed outcomes: "
              f"{observed_outcomes}"
          )
          print(
              f"Comparable outcomes: "
              f"{comparable_outcomes}"
          )
          print("----------------------------------------")
          print(
              f"ACT38 fusion confidence: "
              f"{fusion_for_policy}"
          )
          print(
              f"ACT38 decision ceiling: "
              f"{previous_ceiling}"
          )
          print(
              f"Source completeness: "
              f"{source_completeness:.2f}%"
          )
          print("----------------------------------------")
          print(
              f"Calibration factor: "
              f"{calibration_factor}"
          )
          print(
              f"Calibration status: "
              f"{calibration_status}"
          )
          print(
              f"Calibration usable: "
              f"{calibration_usable}"
          )
          print(
              f"Decision ceiling: "
              f"{calibrated_ceiling}"
          )
          print("----------------------------------------")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          print("----------------------------------------")

          failed = [
              name
              for name, passed
              in validation.items()
              if not passed
          ]

          if failed:

              print("VALIDATION FAILED:")

              for item in failed:
                  print(f" - {item}")

              raise SystemExit(1)

          print("VALIDATION PASSED")
          print(
              f"Memory written: {output_path}"
          )

          # ============================================================
          # Commit / push
          # ============================================================

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "NØX"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "nox@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  str(output_path)
              ],
              check=True
          )

          commit = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "ACT39 V5 confidence calibration"
              ],
              text=True,
              capture_output=True
          )

          if commit.returncode != 0:
              print(commit.stdout)
              print(commit.stderr)

          pushed = False

          for attempt in range(3):

              try:

                  subprocess.run(
                      [
                          "git",
                          "fetch",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "origin/main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "HEAD:main"
                      ],
                      check=True
                  )

                  pushed = True
                  break

              except subprocess.CalledProcessError as exc:

                  print(
                      f"Push/rebase attempt "
                      f"{attempt + 1} failed: {exc}"
                  )

                  if attempt < 2:

                      subprocess.run(
                          [
                              "git",
                              "rebase",
                              "--abort"
                          ],
                          check=False
                      )

          if not pushed:

              raise SystemExit(
                  "Unable to push ACT39 V5 after 3 attempts."
              )

          print(
              "ACT39 V5 committed and pushed successfully."
          )
          PY
