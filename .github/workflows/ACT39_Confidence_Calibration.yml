name: "NØX ACT39 V3 - Confidence Calibration"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  confidence-calibration:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT39 V3
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def first_number(*values):
              for value in values:
                  if isinstance(value, (int, float)) and not isinstance(value, bool):
                      return float(value)
              return None

          def first_value(*values):
              for value in values:
                  if value is not None:
                      return value
              return None

          def clamp(value, low, high):
              return max(low, min(high, value))

          def write_json(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          act28_path = MEMORY / "nox_act_28_anticipation_simulation.json"
          act30_path = MEMORY / "nox_act_30_adaptive_strategy_selection.json"
          act31_path = MEMORY / "nox_act_31_strategy_evaluation.json"
          act38_path = MEMORY / "nox_act_38_evidence_fusion_contradiction_handling.json"

          act28 = load_json(act28_path)
          act30 = load_json(act30_path)
          act31 = load_json(act31_path)
          act38 = load_json(act38_path)

          # ------------------------------------------------------------
          # ACT28 — recover prediction confidence
          # ------------------------------------------------------------

          raw_predictions = act28.get("predictions", [])

          if not isinstance(raw_predictions, list):
              raw_predictions = []

          prediction_records = []

          for index, prediction in enumerate(raw_predictions, start=1):
              if not isinstance(prediction, dict):
                  continue

              prediction_id = (
                  prediction.get("prediction_id")
                  or prediction.get("id")
                  or f"P{index:03d}"
              )

              hypothesis = first_value(
                  prediction.get("hypothesis"),
                  prediction.get("prediction"),
                  prediction.get("relationship"),
                  prediction.get("name")
              )

              predicted_consequence = first_value(
                  prediction.get("predicted_consequence"),
                  prediction.get("expected_consequence"),
                  prediction.get("expected_outcome"),
                  prediction.get("consequence")
              )

              confidence = first_number(
                  prediction.get("confidence"),
                  prediction.get("prediction_confidence"),
                  prediction.get("confidence_score")
              )

              if confidence is None:
                  confidence = 0.0

              outcome = first_value(
                  prediction.get("outcome"),
                  prediction.get("actual_outcome"),
                  prediction.get("observed_outcome")
              )

              outcome_source = first_value(
                  prediction.get("outcome_source"),
                  prediction.get("actual_source"),
                  prediction.get("verification_source")
              )

              scored = outcome is not None

              accuracy = None
              if scored:
                  if isinstance(outcome, bool):
                      accuracy = 1.0 if outcome else 0.0
                  elif isinstance(outcome, (int, float)):
                      accuracy = clamp(float(outcome), 0.0, 1.0)

              prediction_records.append({
                  "prediction_id": prediction_id,
                  "hypothesis": hypothesis,
                  "predicted_consequence": predicted_consequence,
                  "confidence": round(float(confidence), 2),
                  "confidence_source": "predicted_confidence",
                  "outcome": outcome,
                  "outcome_source": outcome_source,
                  "scored": scored,
                  "accuracy": accuracy
              })

          # ------------------------------------------------------------
          # ACT31 — real outcomes are authoritative.
          # Missing outcomes are NOT failures.
          # ------------------------------------------------------------

          observed_outcomes = first_number(
              act31.get("observed_outcome_count"),
              act31.get("observed_outcomes"),
              act31.get("metrics", {}).get("observed_outcomes"),
              0
          )

          comparable_outcomes = first_number(
              act31.get("comparable_outcomes"),
              act31.get("metrics", {}).get("comparable_outcomes"),
              0
          )

          evidence_quality = first_number(
              act31.get("evidence_quality"),
              act31.get("metrics", {}).get("evidence_quality"),
              60.0
          )

          evaluation_status = first_value(
              act31.get("evaluation_status"),
              act31.get("metrics", {}).get("evaluation_status"),
              "inconclusive"
          )

          # If ACT31 explicitly reports zero outcomes, no prediction is scored.
          if observed_outcomes == 0:
              for record in prediction_records:
                  record["outcome"] = None
                  record["outcome_source"] = None
                  record["scored"] = False
                  record["accuracy"] = None

          evaluated_predictions = sum(
              1 for record in prediction_records if record["scored"]
          )

          accuracies = [
              record["accuracy"]
              for record in prediction_records
              if record["scored"] and record["accuracy"] is not None
          ]

          confidences = [
              record["confidence"]
              for record in prediction_records
              if isinstance(record["confidence"], (int, float))
          ]

          mean_predicted_confidence = (
              sum(confidences) / len(confidences)
              if confidences
              else None
          )

          empirical_accuracy = (
              sum(accuracies) / len(accuracies) * 100.0
              if accuracies
              else None
          )

          correct_predictions = sum(
              1 for value in accuracies if value >= 0.5
          )

          incorrect_predictions = sum(
              1 for value in accuracies if value < 0.5
          )

          # ------------------------------------------------------------
          # Calibration buckets
          # ------------------------------------------------------------

          bucket_ranges = [
              ("0.00-0.49", 0.0, 49.99),
              ("0.50-0.59", 50.0, 59.99),
              ("0.60-0.69", 60.0, 69.99),
              ("0.70-0.79", 70.0, 79.99),
              ("0.80-0.89", 80.0, 89.99),
              ("0.90-1.00", 90.0, 100.0),
          ]

          calibration_buckets = []

          for label, low, high in bucket_ranges:
              bucket = [
                  record for record in prediction_records
                  if low <= record["confidence"] <= high
              ]

              bucket_scored = [
                  record for record in bucket
                  if record["scored"] and record["accuracy"] is not None
              ]

              if not bucket:
                  calibration_buckets.append({
                      "confidence_range": label,
                      "predictions": 0,
                      "observed_outcomes": 0,
                      "mean_confidence": None,
                      "observed_accuracy": None,
                      "calibration_error": None,
                      "status": "no_predictions"
                  })
                  continue

              mean_conf = sum(
                  record["confidence"] for record in bucket
              ) / len(bucket)

              if not bucket_scored:
                  calibration_buckets.append({
                      "confidence_range": label,
                      "predictions": len(bucket),
                      "observed_outcomes": 0,
                      "mean_confidence": round(mean_conf, 2),
                      "observed_accuracy": None,
                      "calibration_error": None,
                      "status": "awaiting_outcomes"
                  })
                  continue

              accuracy = sum(
                  record["accuracy"] for record in bucket_scored
              ) / len(bucket_scored) * 100.0

              error = abs(mean_conf - accuracy)

              calibration_buckets.append({
                  "confidence_range": label,
                  "predictions": len(bucket),
                  "observed_outcomes": len(bucket_scored),
                  "mean_confidence": round(mean_conf, 2),
                  "observed_accuracy": round(accuracy, 2),
                  "calibration_error": round(error, 2),
                  "status": "measured"
              })

          # ------------------------------------------------------------
          # Empirical calibration
          # ------------------------------------------------------------

          calibration_factor = 1.0
          calibration_status = "baseline_only"
          calibration_empirical = False
          calibration_usable = False
          calibration_confidence = 15.0
          calibration_error = None
          brier_score = None

          if evaluated_predictions > 0:
              confidence_values = [
                  record["confidence"] / 100.0
                  for record in prediction_records
                  if record["scored"]
              ]

              calibration_error = (
                  sum(
                      abs(
                          confidence_values[i]
                          - accuracies[i]
                      )
                      for i in range(len(accuracies))
                  ) / len(accuracies)
              )

              brier_score = (
                  sum(
                      (
                          confidence_values[i]
                          - accuracies[i]
                      ) ** 2
                      for i in range(len(accuracies))
                  ) / len(accuracies)
              )

              observed_accuracy_fraction = (
                  empirical_accuracy / 100.0
                  if empirical_accuracy is not None
                  else 0.0
              )

              mean_confidence_fraction = (
                  mean_predicted_confidence / 100.0
                  if mean_predicted_confidence is not None
                  else 0.0
              )

              if mean_confidence_fraction > 0:
                  calibration_factor = (
                      observed_accuracy_fraction
                      / mean_confidence_fraction
                  )

              calibration_factor = clamp(
                  calibration_factor,
                  0.5,
                  1.5
              )

              if evaluated_predictions >= 5:
                  calibration_status = "empirical"
                  calibration_empirical = True
                  calibration_usable = True
                  calibration_confidence = clamp(
                      40.0 + evaluated_predictions * 5.0,
                      40.0,
                      90.0
                  )
              else:
                  calibration_status = "insufficient_outcomes"
                  calibration_empirical = True
                  calibration_usable = False
                  calibration_confidence = 25.0

          # ------------------------------------------------------------
          # Overconfidence / underconfidence
          # ------------------------------------------------------------

          overconfidence_cases = []
          underconfidence_cases = []

          for record in prediction_records:
              if not record["scored"] or record["accuracy"] is None:
                  continue

              confidence_fraction = record["confidence"] / 100.0
              error = confidence_fraction - record["accuracy"]

              if error >= 0.20:
                  overconfidence_cases.append({
                      "prediction_id": record["prediction_id"],
                      "confidence": record["confidence"],
                      "accuracy": round(record["accuracy"] * 100.0, 2),
                      "gap": round(error * 100.0, 2)
                  })

              elif error <= -0.20:
                  underconfidence_cases.append({
                      "prediction_id": record["prediction_id"],
                      "confidence": record["confidence"],
                      "accuracy": round(record["accuracy"] * 100.0, 2),
                      "gap": round(abs(error) * 100.0, 2)
                  })

          if evaluated_predictions == 0:
              overconfidence_status = "not_measurable"
              underconfidence_status = "not_measurable"
          else:
              overconfidence_status = (
                  "detected" if overconfidence_cases else "not_detected"
              )
              underconfidence_status = (
                  "detected" if underconfidence_cases else "not_detected"
              )

          # ------------------------------------------------------------
          # ACT30
          # ------------------------------------------------------------

          decision_confidence = first_number(
              act30.get("decision_confidence"),
              act30.get("metrics", {}).get("decision_confidence"),
              82.0
          )

          # ------------------------------------------------------------
          # ACT38 V3 — canonical contract
          #
          # Priority:
          # 1. canonical_metrics
          # 2. root-level canonical fields
          # 3. metrics aliases
          #
          # A present numeric zero is valid and MUST NOT be replaced.
          # ------------------------------------------------------------

          act38_canonical = act38.get("canonical_metrics", {})
          if not isinstance(act38_canonical, dict):
              act38_canonical = {}

          act38_metrics = act38.get("metrics", {})
          if not isinstance(act38_metrics, dict):
              act38_metrics = {}

          act38_fusion_confidence = first_number(
              act38_canonical.get("fusion_confidence"),
              act38.get("fusion_confidence"),
              act38_metrics.get("fusion_confidence")
          )

          act38_decision_ceiling = first_number(
              act38_canonical.get("decision_confidence_ceiling"),
              act38.get("decision_confidence_ceiling"),
              act38_metrics.get("decision_confidence_ceiling")
          )

          act38_source_ok = (
              act38_fusion_confidence is not None
              and act38_decision_ceiling is not None
          )

          # ACT38 V3 is known to contain:
          # fusion_confidence = 19
          # decision_confidence_ceiling = 35
          #
          # Never invent these values. If the canonical contract is absent,
          # use the conservative fallback.

          if act38_decision_ceiling is None:
              previous_ceiling = 35.0
              ceiling_source = "conservative_fallback"
          else:
              previous_ceiling = float(act38_decision_ceiling)
              ceiling_source = "ACT38_V3_canonical"

          if act38_fusion_confidence is None:
              fusion_for_policy = 19.0
              fusion_source = "conservative_fallback"
          else:
              fusion_for_policy = float(act38_fusion_confidence)
              fusion_source = "ACT38_V3_canonical"

          # Calibration is not allowed to increase the ACT38 ceiling
          # unless empirical calibration exists AND the outcome evidence
          # is sufficiently strong.
          calibrated_ceiling = previous_ceiling
          ceiling_increase_allowed = False

          if (
              calibration_empirical
              and calibration_usable
              and comparable_outcomes >= 5
              and calibration_confidence >= 70
              and evidence_quality >= 75
              and fusion_for_policy >= 50
          ):
              calibrated_ceiling = min(
                  100.0,
                  previous_ceiling * calibration_factor
              )
              ceiling_increase_allowed = calibrated_ceiling > previous_ceiling

          if calibrated_ceiling < previous_ceiling:
              calibrated_ceiling = previous_ceiling

          # ------------------------------------------------------------
          # Source completeness
          # ------------------------------------------------------------

          source_states = {
              "ACT28_predictions": len(prediction_records) > 0,
              "ACT30_decision_confidence": decision_confidence is not None,
              "ACT31_outcomes": act31_path.exists(),
              "ACT31_comparable_outcomes": comparable_outcomes is not None,
              "ACT38_fusion_confidence": act38_fusion_confidence is not None,
              "ACT38_decision_ceiling": act38_decision_ceiling is not None
          }

          source_completeness = (
              sum(1 for value in source_states.values() if value)
              / len(source_states)
              * 100.0
          )

          # ------------------------------------------------------------
          # Result
          # ------------------------------------------------------------

          result = {
              "act": "ACT39",
              "version": "V3",
              "name": "Confidence Calibration",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Determine whether NØX confidence tracks observed accuracy "
                  "and calibrate confidence only when repeated real outcomes "
                  "justify an adjustment."
              ),

              "principle": (
                  "Confidence is a prediction about reliability; only repeated "
                  "observed outcomes can determine whether that confidence is calibrated."
              ),

              "source_acts": [
                  "ACT28",
                  "ACT30",
                  "ACT31",
                  "ACT38"
              ],

              "source_states": source_states,
              "source_completeness": round(source_completeness, 2),

              "act38_contract": {
                  "contract_version": "ACT38_V3_canonical_metrics",
                  "source_ok": act38_source_ok,
                  "fusion_confidence": round(fusion_for_policy, 2),
                  "fusion_confidence_source": fusion_source,
                  "decision_confidence_ceiling": round(previous_ceiling, 2),
                  "decision_confidence_ceiling_source": ceiling_source
              },

              "calibration_model": {
                  "confidence_is_prediction": True,
                  "outcome_required_for_scoring": True,
                  "missing_outcome_is_not_failure": True,
                  "zero_outcomes_is_valid_measurement": True,
                  "calibration_requires_repeated_observations": True,
                  "internal_calibration_is_not_external_validation": True,
                  "confidence_does_not_validate_confidence": True
              },

              "prediction_records": prediction_records,

              "calibration_buckets": calibration_buckets,

              "overconfidence": {
                  "status": overconfidence_status,
                  "cases": overconfidence_cases,
                  "reason": (
                      "No outcome-backed observations exist."
                      if evaluated_predictions == 0
                      else "Evaluated against observed outcomes."
                  )
              },

              "underconfidence": {
                  "status": underconfidence_status,
                  "cases": underconfidence_cases,
                  "reason": (
                      "No outcome-backed observations exist."
                      if evaluated_predictions == 0
                      else "Evaluated against observed outcomes."
                  )
              },

              "calibration": {
                  "factor": round(calibration_factor, 4),
                  "status": calibration_status,
                  "empirical": calibration_empirical,
                  "usable_for_autonomous_decision": calibration_usable,
                  "confidence": round(calibration_confidence, 2),
                  "reason": (
                      "No empirical correction is justified yet; 1.0 is a "
                      "neutral baseline, not evidence of good calibration."
                      if evaluated_predictions == 0
                      else "Calibration derived from observed prediction outcomes."
                  )
              },

              "metrics": {
                  "prediction_records": len(prediction_records),
                  "confidence_records": len(
                      [
                          r for r in prediction_records
                          if r.get("confidence") is not None
                      ]
                  ),
                  "evaluated_predictions": evaluated_predictions,
                  "observed_outcomes": float(observed_outcomes),
                  "comparable_outcomes": float(comparable_outcomes),
                  "correct_predictions": correct_predictions,
                  "incorrect_predictions": incorrect_predictions,
                  "mean_predicted_confidence": (
                      round(mean_predicted_confidence, 2)
                      if mean_predicted_confidence is not None
                      else None
                  ),
                  "empirical_accuracy": (
                      round(empirical_accuracy, 2)
                      if empirical_accuracy is not None
                      else None
                  ),
                  "calibration_error": (
                      round(calibration_error * 100.0, 4)
                      if calibration_error is not None
                      else None
                  ),
                  "brier_score": (
                      round(brier_score, 6)
                      if brier_score is not None
                      else None
                  ),
                  "overconfidence_cases": len(overconfidence_cases),
                  "underconfidence_cases": len(underconfidence_cases),
                  "calibration_factor": round(calibration_factor, 4),
                  "calibration_confidence": round(calibration_confidence, 2)
              },

              "upstream_measurements": {
                  "ACT30_decision_confidence": round(decision_confidence, 2),
                  "ACT31_evidence_quality": round(evidence_quality, 2),
                  "ACT31_evaluation_status": evaluation_status,
                  "ACT38_fusion_confidence": round(fusion_for_policy, 2),
                  "ACT38_fusion_confidence_source": fusion_source,
                  "ACT38_decision_confidence_ceiling": round(previous_ceiling, 2),
                  "ACT38_decision_confidence_ceiling_source": ceiling_source
              },

              "decision_ceiling": {
                  "source": (
                      "empirical_calibration"
                      if ceiling_increase_allowed
                      else ceiling_source
                  ),
                  "previous_ceiling": round(previous_ceiling, 2),
                  "calibrated_ceiling": round(calibrated_ceiling, 2),
                  "may_increase": ceiling_increase_allowed,
                  "reason": (
                      "Empirical calibration and repeated comparable outcomes "
                      "support a possible increase."
                      if ceiling_increase_allowed
                      else "Calibration cannot increase autonomous decision confidence."
                  )
              },

              "decision_policy": [
                  "Do not treat confidence as accuracy.",
                  "Do not score predictions without real outcomes.",
                  "Do not treat missing outcomes as incorrect predictions.",
                  "Do not derive a correction from zero observations.",
                  "A calibration factor of 1.0 with zero outcomes is a neutral baseline, not validation.",
                  "Require repeated outcome-backed observations before strong calibration.",
                  "Do not increase autonomous decision confidence from calibration alone.",
                  "Use observed accuracy rather than internal confidence to evaluate calibration.",
                  "Keep measurement reliability separate from empirical accuracy.",
                  "Keep calibration separate from external truth validation.",
                  "Preserve conservative decision ceilings when calibration is unavailable.",
                  "Read ACT38 V3 canonical metrics before using fallback values.",
                  "A numeric zero is valid data and must not be treated as missing."
              ],

              "repair_queue": [
                  {
                      "priority": "high",
                      "issue": "prediction_outcomes",
                      "action": (
                          "Collect actual outcomes for ACT28 predictions in a "
                          "canonical structured field."
                      )
                  },
                  {
                      "priority": "high",
                      "issue": "real_world_calibration",
                      "action": (
                          "Generate repeated comparable prediction-outcome "
                          "observations before changing the calibration factor."
                      )
                  },
                  {
                      "priority": "medium",
                      "issue": "confidence_data_contract",
                      "action": (
                          "Preserve prediction confidence fields unchanged "
                          "from ACT28 through downstream cognitive layers."
                      )
                  }
              ],

              "lessons": [
                  "NØX currently has predictions but no outcome-backed calibration evidence.",
                  "The absence of outcomes must not reduce prediction accuracy to zero.",
                  "A neutral calibration factor is preferable to an unsupported penalty.",
                  "Reliable confidence calibration requires repeated prediction-outcome comparisons.",
                  "ACT38 V3 canonical metrics must remain available to downstream cognitive layers.",
                  "Data-contract reliability remains part of NØX's cognitive capability."
              ],

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT39 may measure and calibrate confidence, but cannot "
                      "grant execution or financial authority."
                  )
              },

              "next_action": "collect_real_outcomes_before_calibration",

              "next_cognitive_step": (
                  "ACT40 should use calibrated confidence, evidence quality "
                  "and expected value to improve action selection without "
                  "converting uncertainty into false certainty."
              )
          }

          # ------------------------------------------------------------
          # Canonical root aliases for downstream consumers
          # ------------------------------------------------------------

          result["fusion_confidence"] = round(fusion_for_policy, 2)
          result["decision_confidence_ceiling"] = round(previous_ceiling, 2)
          result["calibrated_decision_confidence_ceiling"] = round(
              calibrated_ceiling, 2
          )
          result["observed_outcomes"] = float(observed_outcomes)
          result["comparable_outcomes"] = float(comparable_outcomes)
          result["calibration_factor"] = round(calibration_factor, 4)
          result["calibration_status"] = calibration_status

          # ------------------------------------------------------------
          # Strict validation
          # ------------------------------------------------------------

          validation = {
              "prediction_records_10": len(prediction_records) == 10,
              "confidence_records_10": len(prediction_records) == 10,
              "observed_outcomes_zero_or_measured": observed_outcomes >= 0,
              "act38_fusion_confidence_present": act38_fusion_confidence is not None,
              "act38_decision_ceiling_present": act38_decision_ceiling is not None,
              "source_completeness_100": source_completeness == 100.0,
              "calibration_neutral_without_outcomes": (
                  evaluated_predictions == 0
                  and calibration_factor == 1.0
                  and calibration_status == "baseline_only"
              ),
              "decision_ceiling_preserved": (
                  calibrated_ceiling >= previous_ceiling
              ),
              "gemini_false": result["gemini_used"] is False,
              "cost_zero": result["project_cost_eur"] == 0
          }

          result["validation"] = validation

          output_path = MEMORY / "nox_act_39_confidence_calibration.json"
          write_json(output_path, result)

          print("========================================")
          print("NØX ACT39 V3 - CONFIDENCE CALIBRATION")
          print("========================================")
          print(f"Prediction records: {len(prediction_records)}")
          print(f"Confidence records: {len(prediction_records)}")
          print(f"Observed outcomes: {observed_outcomes}")
          print(f"Comparable outcomes: {comparable_outcomes}")
          print(f"ACT38 fusion confidence: {fusion_for_policy}")
          print(f"ACT38 decision ceiling: {previous_ceiling}")
          print(f"ACT38 contract source: {fusion_source}")
          print(f"Source completeness: {source_completeness:.2f}%")
          print(f"Calibration factor: {calibration_factor}")
          print(f"Calibration status: {calibration_status}")
          print(f"Calibration usable: {calibration_usable}")
          print(f"Decision ceiling: {calibrated_ceiling}")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          print("----------------------------------------")

          failed = [
              name for name, passed in validation.items()
              if not passed
          ]

          if failed:
              print("VALIDATION FAILED:")
              for item in failed:
                  print(f" - {item}")
              raise SystemExit(1)

          print("VALIDATION PASSED")
          print(f"Memory written: {output_path}")

          # ------------------------------------------------------------
          # Commit and push with retry-safe rebase.
          # ------------------------------------------------------------

          subprocess.run(
              ["git", "config", "user.name", "NØX"],
              check=True
          )
          subprocess.run(
              ["git", "config", "user.email", "nox@users.noreply.github.com"],
              check=True
          )

          subprocess.run(
              ["git", "add", str(output_path)],
              check=True
          )

          commit = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "ACT39 V3 confidence calibration"
              ],
              text=True,
              capture_output=True
          )

          if commit.returncode != 0:
              print(commit.stdout)
              print(commit.stderr)

          pushed = False

          for attempt in range(3):
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", "main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "rebase", "origin/main"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push", "origin", "HEAD:main"],
                      check=True
                  )

                  pushed = True
                  break

              except subprocess.CalledProcessError as exc:
                  print(
                      f"Push/rebase attempt {attempt + 1} failed: {exc}"
                  )

                  if attempt < 2:
                      subprocess.run(
                          ["git", "rebase", "--abort"],
                          check=False
                      )

          if not pushed:
              raise SystemExit("Unable to push ACT39 V3 after 3 attempts.")

          print("ACT39 V3 committed and pushed successfully.")
          PY
