      - name: Commit ACT39 V2 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_act_39_confidence_calibration.json

          if git diff --cached --quiet; then
            echo "No ACT39 V2 changes to commit."
            exit 0
          fi

          git commit -m "Improve ACT39 confidence calibration"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              sleep $((attempt * 3))
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep $((attempt * 4))
          done

          echo "Unable to push ACT39 V2 after 5 attempts."
          exit 1
