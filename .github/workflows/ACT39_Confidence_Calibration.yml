name: NØX ACT39 V2 - Confidence Calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  confidence-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT39 V2
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          MEMORY = "memory"
          os.makedirs(MEMORY, exist_ok=True)

          def load_json(filename):
              path = os.path.join(MEMORY, filename)

              if not os.path.exists(path):
                  return {}

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: unable to read {filename}: {exc}")
                  return {}

          def is_number(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
              )

          def normalize_confidence(value):
              if not is_number(value):
                  return None

              value = float(value)

              if 0.0 <= value <= 1.0:
                  value *= 100.0

              if 0.0 <= value <= 100.0:
                  return round(value, 2)

              return None

          def normalize_key(key):
              return (
                  str(key)
                  .strip()
                  .lower()
                  .replace("-", "_")
                  .replace(" ", "_")
              )

          def recursive_find_all(obj, target_keys, results=None, path=""):
              if results is None:
                  results = []

              targets = {normalize_key(k) for k in target_keys}

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current_path = (
                          f"{path}.{key}" if path else str(key)
                      )

                      if normalize_key(key) in targets:
                          results.append(
                              {
                                  "path": current_path,
                                  "key": key,
                                  "value": value
                              }
                          )

                      recursive_find_all(
                          value,
                          target_keys,
                          results,
                          current_path
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      current_path = f"{path}[{index}]"
                      recursive_find_all(
                          value,
                          target_keys,
                          results,
                          current_path
                      )

              return results

          def recursive_find_first(obj, target_keys):
              results = recursive_find_all(obj, target_keys)
              return results[0] if results else None

          def find_prediction_list(obj):
              if not isinstance(obj, dict):
                  return []

              preferred_keys = {
                  "predictions",
                  "prediction_list",
                  "prediction_records",
                  "prediction_results"
              }

              matches = recursive_find_all(
                  obj,
                  preferred_keys
              )

              for match in matches:
                  if isinstance(match["value"], list):
                      records = [
                          item for item in match["value"]
                          if isinstance(item, dict)
                      ]

                      if records:
                          return records

              return []

          def extract_prediction_identifier(record, index):
              keys = [
                  "prediction_id",
                  "id",
                  "prediction",
                  "hypothesis",
                  "name"
              ]

              for key in keys:
                  value = record.get(key)

                  if isinstance(value, (str, int, float)):
                      return str(value)

              return f"P{index + 1:03d}"

          def extract_confidence(record):
              direct_keys = [
                  "confidence",
                  "prediction_confidence",
                  "confidence_score",
                  "probability",
                  "predicted_confidence"
              ]

              for key in direct_keys:
                  if key in record:
                      confidence = normalize_confidence(
                          record.get(key)
                      )

                      if confidence is not None:
                          return confidence, key

              matches = recursive_find_all(
                  record,
                  direct_keys
              )

              for match in matches:
                  confidence = normalize_confidence(
                      match["value"]
                  )

                  if confidence is not None:
                      return confidence, match["path"]

              return None, None

          def extract_outcome_from_record(record):
              outcome_keys = [
                  "outcome",
                  "actual_outcome",
                  "observed_outcome",
                  "verification_result",
                  "result",
                  "correct",
                  "validated",
                  "confirmed",
                  "success"
              ]

              matches = recursive_find_all(
                  record,
                  outcome_keys
              )

              for match in matches:
                  value = match["value"]

                  if isinstance(value, bool):
                      return value, match["path"]

                  if isinstance(value, str):
                      normalized = value.strip().lower()

                      if normalized in {
                          "correct",
                          "confirmed",
                          "validated",
                          "success",
                          "successful",
                          "true",
                          "yes",
                          "matched",
                          "match",
                          "occurred",
                          "observed"
                      }:
                          return True, match["path"]

                      if normalized in {
                          "incorrect",
                          "rejected",
                          "failed",
                          "failure",
                          "false",
                          "no",
                          "mismatch",
                          "not_observed",
                          "did_not_occur"
                      }:
                          return False, match["path"]

              return None, None

          def extract_number(obj, keys):
              matches = recursive_find_all(obj, keys)

              for match in matches:
                  if is_number(match["value"]):
                      return float(match["value"]), match["path"]

              return None, None

          def extract_value(obj, keys):
              matches = recursive_find_all(obj, keys)

              for match in matches:
                  return match["value"], match["path"]

              return None, None

          # ---------------------------------------------------------
          # LOAD SOURCE MEMORY
          # ---------------------------------------------------------

          act28 = load_json(
              "nox_act_28_anticipation_simulation.json"
          )

          act30 = load_json(
              "nox_act_30_adaptive_strategy_selection.json"
          )

          act31 = load_json(
              "nox_act_31_strategy_evaluation.json"
          )

          act38 = load_json(
              "nox_act_38_evidence_fusion_contradiction_handling.json"
          )

          # ---------------------------------------------------------
          # ACT28: PREDICTIONS + CONFIDENCE
          # ---------------------------------------------------------

          prediction_list = find_prediction_list(act28)

          prediction_records = []

          for index, prediction in enumerate(prediction_list):
              confidence, confidence_path = extract_confidence(
                  prediction
              )

              prediction_id = extract_prediction_identifier(
                  prediction,
                  index
              )

              hypothesis = (
                  prediction.get("hypothesis")
                  if isinstance(prediction.get("hypothesis"), str)
                  else None
              )

              consequence = (
                  prediction.get("predicted_consequence")
                  if isinstance(
                      prediction.get("predicted_consequence"),
                      str
                  )
                  else None
              )

              outcome, outcome_path = extract_outcome_from_record(
                  prediction
              )

              prediction_records.append(
                  {
                      "prediction_id": prediction_id,
                      "hypothesis": hypothesis,
                      "predicted_consequence": consequence,
                      "confidence": confidence,
                      "confidence_source": confidence_path,
                      "outcome": outcome,
                      "outcome_source": outcome_path,
                      "scored": outcome is not None,
                      "accuracy": (
                          1.0
                          if outcome is True
                          else 0.0
                          if outcome is False
                          else None
                      )
                  }
              )

          confidence_records = [
              record
              for record in prediction_records
              if record["confidence"] is not None
          ]

          # ---------------------------------------------------------
          # ACT31: AUTHORITATIVE EMPIRICAL STATE
          # ---------------------------------------------------------

          observed_outcomes, observed_outcomes_path = extract_number(
              act31,
              [
                  "observed_outcome_count",
                  "observed_outcomes"
              ]
          )

          comparable_outcomes, comparable_outcomes_path = extract_number(
              act31,
              [
                  "comparable_outcomes",
                  "comparable_outcome_count"
              ]
          )

          evidence_quality, evidence_quality_path = extract_number(
              act31,
              [
                  "evidence_quality"
              ]
          )

          evaluation_status, evaluation_status_path = extract_value(
              act31,
              [
                  "evaluation_status",
                  "strategy_state"
              ]
          )

          # ACT31 is authoritative. If it says zero outcomes,
          # prediction-level fields cannot override that state.
          if (
              observed_outcomes is not None
              and observed_outcomes <= 0
          ):
              for record in prediction_records:
                  record["outcome"] = None
                  record["outcome_source"] = None
                  record["scored"] = False
                  record["accuracy"] = None

          # ---------------------------------------------------------
          # ACT30
          # ---------------------------------------------------------

          decision_confidence, decision_confidence_path = extract_number(
              act30,
              [
                  "decision_confidence"
              ]
          )

          # ---------------------------------------------------------
          # ACT38
          # ---------------------------------------------------------

          fusion_confidence, fusion_confidence_path = extract_number(
              act38,
              [
                  "result",
                  "fusion_confidence",
                  "global_confidence",
                  "global_confidence.result"
              ]
          )

          decision_ceiling, decision_ceiling_path = extract_number(
              act38,
              [
                  "decision_confidence_ceiling",
                  "autonomous_decision_confidence_ceiling",
                  "confidence_ceiling"
              ]
          )

          # Explicitly inspect nested ACT38 structures if the generic
          # search did not find the values.
          if isinstance(act38, dict):
              global_confidence = act38.get("global_confidence")

              if isinstance(global_confidence, dict):
                  if is_number(global_confidence.get("result")):
                      fusion_confidence = float(
                          global_confidence["result"]
                      )
                      fusion_confidence_path = (
                          "global_confidence.result"
                      )

              decision_readiness = act38.get("decision_readiness")

              if isinstance(decision_readiness, dict):
                  for key in [
                      "autonomous_decision_confidence_ceiling",
                      "decision_confidence_ceiling",
                      "confidence_ceiling"
                  ]:
                      if is_number(decision_readiness.get(key)):
                          decision_ceiling = float(
                              decision_readiness[key]
                          )
                          decision_ceiling_path = (
                              f"decision_readiness.{key}"
                          )
                          break

          # ACT38 may use a different representation.
          if decision_ceiling is None:
              metrics = act38.get("metrics")

              if isinstance(metrics, dict):
                  for key in [
                      "decision_confidence_ceiling",
                      "autonomous_decision_confidence_ceiling"
                  ]:
                      if is_number(metrics.get(key)):
                          decision_ceiling = float(
                              metrics[key]
                          )
                          decision_ceiling_path = (
                              f"metrics.{key}"
                          )
                          break

          # ---------------------------------------------------------
          # EMPIRICAL CALIBRATION
          # ---------------------------------------------------------

          scored_records = [
              record
              for record in prediction_records
              if record["scored"]
              and record["accuracy"] is not None
              and record["confidence"] is not None
          ]

          correct_count = sum(
              1
              for record in scored_records
              if record["accuracy"] == 1.0
          )

          incorrect_count = sum(
              1
              for record in scored_records
              if record["accuracy"] == 0.0
          )

          if scored_records:
              mean_confidence = sum(
                  record["confidence"]
                  for record in scored_records
              ) / len(scored_records)

              empirical_accuracy = (
                  correct_count
                  / len(scored_records)
                  * 100.0
              )

              calibration_error = abs(
                  mean_confidence - empirical_accuracy
              )

              brier_score = sum(
                  (
                      record["confidence"] / 100.0
                      - record["accuracy"]
                  ) ** 2
                  for record in scored_records
              ) / len(scored_records)

          else:
              mean_confidence = None
              empirical_accuracy = None
              calibration_error = None
              brier_score = None

          # ---------------------------------------------------------
          # CONFIDENCE BUCKETS
          # ---------------------------------------------------------

          bucket_ranges = [
              (0, 49, "0.00-0.49"),
              (50, 59, "0.50-0.59"),
              (60, 69, "0.60-0.69"),
              (70, 79, "0.70-0.79"),
              (80, 89, "0.80-0.89"),
              (90, 100, "0.90-1.00")
          ]

          calibration_buckets = []

          for low, high, label in bucket_ranges:
              records = [
                  record
                  for record in prediction_records
                  if record["confidence"] is not None
                  and low <= record["confidence"] <= high
              ]

              scored_bucket = [
                  record
                  for record in records
                  if record["scored"]
              ]

              bucket_mean_confidence = (
                  sum(
                      record["confidence"]
                      for record in scored_bucket
                  ) / len(scored_bucket)
                  if scored_bucket
                  else (
                      sum(
                          record["confidence"]
                          for record in records
                      ) / len(records)
                      if records
                      else None
                  )
              )

              bucket_accuracy = (
                  sum(
                      record["accuracy"]
                      for record in scored_bucket
                  ) / len(scored_bucket)
                  if scored_bucket
                  else None
              )

              bucket_error = (
                  abs(
                      bucket_mean_confidence
                      - bucket_accuracy * 100.0
                  )
                  if bucket_accuracy is not None
                  and bucket_mean_confidence is not None
                  else None
              )

              if len(scored_bucket) >= 5:
                  bucket_status = (
                      "usable_for_calibration"
                  )
              elif scored_bucket:
                  bucket_status = (
                      "insufficient_repeated_outcomes"
                  )
              elif records:
                  bucket_status = (
                      "awaiting_outcomes"
                  )
              else:
                  bucket_status = "no_predictions"

              calibration_buckets.append(
                  {
                      "confidence_range": label,
                      "predictions": len(records),
                      "observed_outcomes": len(scored_bucket),
                      "mean_confidence": (
                          round(bucket_mean_confidence, 2)
                          if bucket_mean_confidence is not None
                          else None
                      ),
                      "observed_accuracy": (
                          round(bucket_accuracy * 100.0, 2)
                          if bucket_accuracy is not None
                          else None
                      ),
                      "calibration_error": (
                          round(bucket_error, 2)
                          if bucket_error is not None
                          else None
                      ),
                      "status": bucket_status
                  }
              )

          # ---------------------------------------------------------
          # OVER / UNDER CONFIDENCE
          # ---------------------------------------------------------

          overconfidence_cases = []
          underconfidence_cases = []

          for record in scored_records:
              confidence = record["confidence"]
              accuracy = record["accuracy"] * 100.0

              difference = confidence - accuracy

              if difference >= 10.0:
                  overconfidence_cases.append(
                      {
                          "prediction_id": record["prediction_id"],
                          "confidence": confidence,
                          "accuracy": accuracy,
                          "gap": round(difference, 2)
                      }
                  )

              elif difference <= -10.0:
                  underconfidence_cases.append(
                      {
                          "prediction_id": record["prediction_id"],
                          "confidence": confidence,
                          "accuracy": accuracy,
                          "gap": round(abs(difference), 2)
                      }
                  )

          # ---------------------------------------------------------
          # CALIBRATION FACTOR
          # ---------------------------------------------------------
          #
          # CRITICAL:
          # No empirical observations => NO correction.
          #
          # The factor remains 1.0 as a neutral baseline.
          # This is NOT evidence that NØX is calibrated.
          # It means there is insufficient evidence to correct it.

          if len(scored_records) == 0:
              calibration_factor = 1.0
              calibration_status = "baseline_only"
              calibration_confidence = 15.0
              calibration_empirical = False

          elif len(scored_records) < 5:
              calibration_factor = 1.0
              calibration_status = (
                  "insufficient_repeated_outcomes"
              )
              calibration_confidence = 30.0
              calibration_empirical = True

          else:
              ratio = (
                  empirical_accuracy
                  / mean_confidence
                  if mean_confidence > 0
                  else 1.0
              )

              calibration_factor = max(
                  0.5,
                  min(1.5, ratio)
              )

              if calibration_error <= 10.0:
                  calibration_status = (
                      "empirically_reasonably_calibrated"
                  )
              elif calibration_error <= 20.0:
                  calibration_status = (
                      "empirically_partially_calibrated"
                  )
              else:
                  calibration_status = (
                      "empirically_miscalibrated"
                  )

              calibration_confidence = min(
                  90.0,
                  40.0 + len(scored_records) * 5.0
              )

              calibration_empirical = True

          # ---------------------------------------------------------
          # DECISION CEILING
          # ---------------------------------------------------------

          if decision_ceiling is not None:
              original_ceiling = float(decision_ceiling)
          else:
              # ACT38 ceiling was not readable, so do not invent
              # a higher ceiling. Keep the known conservative limit.
              original_ceiling = 35.0

          if calibration_status == "baseline_only":
              calibrated_ceiling = original_ceiling
          else:
              calibrated_ceiling = min(
                  original_ceiling,
                  original_ceiling * calibration_factor
              )

          # ---------------------------------------------------------
          # SOURCE COMPLETENESS
          # ---------------------------------------------------------

          source_states = {
              "ACT28_predictions": len(prediction_list) > 0,
              "ACT30_decision_confidence": (
                  decision_confidence is not None
              ),
              "ACT31_outcomes": (
                  observed_outcomes is not None
              ),
              "ACT31_comparable_outcomes": (
                  comparable_outcomes is not None
              ),
              "ACT38_fusion_confidence": (
                  fusion_confidence is not None
              ),
              "ACT38_decision_ceiling": (
                  decision_ceiling is not None
              )
          }

          source_completeness = (
              round(
                  sum(
                      1
                      for value in source_states.values()
                      if value
                  )
                  / len(source_states)
                  * 100.0,
                  2
              )
          )

          # ---------------------------------------------------------
          # MEMORY
          # ---------------------------------------------------------

          memory = {
              "act": "ACT39",
              "version": "V2",
              "name": "Confidence Calibration",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Determine whether NØX confidence tracks observed "
                  "accuracy and calibrate confidence only when "
                  "repeated real outcomes justify an adjustment."
              ),

              "principle": (
                  "Confidence is a prediction about reliability; "
                  "only repeated observed outcomes can determine "
                  "whether that confidence is calibrated."
              ),

              "source_acts": [
                  "ACT28",
                  "ACT30",
                  "ACT31",
                  "ACT38"
              ],

              "source_states": source_states,
              "source_completeness": source_completeness,

              "calibration_model": {
                  "confidence_is_prediction": True,
                  "outcome_required_for_scoring": True,
                  "missing_outcome_is_not_failure": True,
                  "zero_outcomes_is_valid_measurement": True,
                  "calibration_requires_repeated_observations": True,
                  "internal_calibration_is_not_external_validation": True,
                  "confidence_does_not_validate_confidence": True
              },

              "prediction_records": prediction_records,

              "calibration_buckets": calibration_buckets,

              "overconfidence": {
                  "status": (
                      "not_measurable"
                      if not scored_records
                      else (
                          "detected"
                          if overconfidence_cases
                          else "not_detected"
                      )
                  ),
                  "cases": overconfidence_cases,
                  "reason": (
                      "No outcome-backed observations exist."
                      if not scored_records
                      else (
                          "Observed accuracy is sufficiently below "
                          "predicted confidence in at least one case."
                          if overconfidence_cases
                          else "No qualifying overconfidence cases."
                      )
                  )
              },

              "underconfidence": {
                  "status": (
                      "not_measurable"
                      if not scored_records
                      else (
                          "detected"
                          if underconfidence_cases
                          else "not_detected"
                      )
                  ),
                  "cases": underconfidence_cases,
                  "reason": (
                      "No outcome-backed observations exist."
                      if not scored_records
                      else (
                          "Observed accuracy is sufficiently above "
                          "predicted confidence in at least one case."
                          if underconfidence_cases
                          else "No qualifying underconfidence cases."
                      )
                  )
              },

              "calibration": {
                  "factor": round(
                      calibration_factor,
                      3
                  ),
                  "status": calibration_status,
                  "empirical": calibration_empirical,
                  "usable_for_autonomous_decision": False,
                  "confidence": round(
                      calibration_confidence,
                      2
                  ),
                  "reason": (
                      "No empirical correction is justified yet; "
                      "1.0 is a neutral baseline, not evidence of "
                      "good calibration."
                      if calibration_status == "baseline_only"
                      else (
                          "Calibration evidence exists but requires "
                          "more repeated observations before strong "
                          "autonomous use."
                          if len(scored_records) < 5
                          else (
                              "Calibration factor is supported by "
                              "repeated outcome-backed observations."
                          )
                      )
                  )
              },

              "metrics": {
                  "prediction_records": len(prediction_list),
                  "confidence_records": len(
                      confidence_records
                  ),
                  "evaluated_predictions": len(
                      scored_records
                  ),
                  "observed_outcomes": (
                      observed_outcomes
                      if observed_outcomes is not None
                      else 0
                  ),
                  "comparable_outcomes": (
                      comparable_outcomes
                      if comparable_outcomes is not None
                      else 0
                  ),
                  "correct_predictions": correct_count,
                  "incorrect_predictions": incorrect_count,
                  "mean_predicted_confidence": (
                      round(
                          mean_confidence,
                          2
                      )
                      if mean_confidence is not None
                      else None
                  ),
                  "empirical_accuracy": (
                      round(
                          empirical_accuracy,
                          2
                      )
                      if empirical_accuracy is not None
                      else None
                  ),
                  "calibration_error": (
                      round(
                          calibration_error,
                          2
                      )
                      if calibration_error is not None
                      else None
                  ),
                  "brier_score": (
                      round(
                          brier_score,
                          4
                      )
                      if brier_score is not None
                      else None
                  ),
                  "overconfidence_cases": len(
                      overconfidence_cases
                  ),
                  "underconfidence_cases": len(
                      underconfidence_cases
                  ),
                  "calibration_factor": round(
                      calibration_factor,
                      3
                  ),
                  "calibration_confidence": round(
                      calibration_confidence,
                      2
                  )
              },

              "upstream_measurements": {
                  "ACT30_decision_confidence": (
                      decision_confidence
                  ),
                  "ACT31_evidence_quality": (
                      evidence_quality
                  ),
                  "ACT31_evaluation_status": (
                      evaluation_status
                  ),
                  "ACT38_fusion_confidence": (
                      fusion_confidence
                  ),
                  "ACT38_decision_confidence_ceiling": (
                      decision_ceiling
                  )
              },

              "decision_ceiling": {
                  "source": (
                      decision_ceiling_path
                      if decision_ceiling_path
                      else "conservative_fallback"
                  ),
                  "previous_ceiling": round(
                      original_ceiling,
                      2
                  ),
                  "calibrated_ceiling": round(
                      calibrated_ceiling,
                      2
                  ),
                  "may_increase": False,
                  "reason": (
                      "Calibration cannot increase autonomous "
                      "decision confidence."
                  )
              },

              "decision_policy": [
                  "Do not treat confidence as accuracy.",
                  "Do not score predictions without real outcomes.",
                  "Do not treat missing outcomes as incorrect predictions.",
                  "Do not derive a correction from zero observations.",
                  "A calibration factor of 1.0 with zero outcomes is a neutral baseline, not validation.",
                  "Require repeated outcome-backed observations before strong calibration.",
                  "Do not increase autonomous decision confidence from calibration alone.",
                  "Use observed accuracy rather than internal confidence to evaluate calibration.",
                  "Keep measurement reliability separate from empirical accuracy.",
                  "Keep calibration separate from external truth validation.",
                  "Preserve conservative decision ceilings when calibration is unavailable."
              ],

              "repair_queue": [
                  {
                      "priority": "high",
                      "issue": "prediction_outcomes",
                      "action": (
                          "Collect actual outcomes for ACT28 predictions "
                          "in a canonical structured field."
                      )
                  },
                  {
                      "priority": "high",
                      "issue": "ACT38_data_contract",
                      "action": (
                          "Preserve ACT38 global confidence and decision "
                          "ceiling fields under stable canonical names."
                      )
                  },
                  {
                      "priority": "medium",
                      "issue": "confidence_data_contract",
                      "action": (
                          "Preserve prediction confidence fields unchanged "
                          "from ACT28 through downstream cognitive layers."
                      )
                  }
              ],

              "lessons": [
                  "NØX currently has predictions but no outcome-backed calibration evidence.",
                  "The absence of outcomes must not reduce prediction accuracy to zero.",
                  "A neutral calibration factor is preferable to an unsupported penalty.",
                  "Reliable confidence calibration requires repeated prediction-outcome comparisons.",
                  "Data-contract reliability remains part of NØX's cognitive capability."
              ],

              "autonomy_rule": {
                  "status": "learning_only",
                  "execution_permission": False,
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "gemini_permission": False,
                  "rule": (
                      "ACT39 may measure and calibrate confidence, "
