name: NØX Origin - V38 Colony Observer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V38
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V38_COLONY_REPORT.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V38")
          print("Colony Observer")
          print("===================================")

          # --------------------------------------------------
          # 1. CHECK API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. GET JWT
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": api_key},
              timeout=20
          )

          print(
              f"Authentication status: {token_response.status_code}"
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  f"Authentication failed: "
                  f"{token_response.status_code} "
                  f"{token_response.text}"
              )

          token_data = token_response.json()
          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "Authentication succeeded but no access token was returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # 3. LOAD NØX MEMORY
          # --------------------------------------------------

          if not memory_file.exists():
              raise RuntimeError(
                  "nox_memory.json does not exist."
              )

          try:
              memory = json.loads(
                  memory_file.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise RuntimeError(
                  f"Unable to read nox_memory.json: {exc}"
              )

          if not isinstance(memory, dict):
              raise RuntimeError(
                  "nox_memory.json is not a valid JSON object."
              )

          memory.setdefault("observations", [])
          memory.setdefault("retrieval_log", [])
          memory.setdefault("verification_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("colony_activity_log", [])

          # --------------------------------------------------
          # 4. GET NØX PROFILE
          # --------------------------------------------------

          me_response = requests.get(
              f"{BASE}/users/me",
              headers=headers,
              timeout=20
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  f"Profile request failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text}"
              )

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "unknown"
          )

          karma = (
              me.get("karma")
              if isinstance(me, dict)
              else None
          )

          print(f"NØX username: {username}")
          print(f"NØX karma: {karma}")

          # --------------------------------------------------
          # 5. GET PERSONALIZED FEED
          # --------------------------------------------------

          feed_response = requests.get(
              f"{BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=20
          )

          print(
              f"For-you feed status: {feed_response.status_code}"
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  f"For-you feed failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text}"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, list):
              feed_items = feed_data
          elif isinstance(feed_data, dict):
              feed_items = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or feed_data.get("data")
                  or []
              )
          else:
              feed_items = []

          if not isinstance(feed_items, list):
              feed_items = []

          print(
              f"Feed items retrieved: {len(feed_items)}"
          )

          # --------------------------------------------------
          # 6. GET SUGGESTED ACTIONS
          # --------------------------------------------------

          suggestions_response = requests.get(
              f"{BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=20
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions = []

          if suggestions_response.status_code == 200:
              suggestions_data = suggestions_response.json()

              if isinstance(suggestions_data, list):
                  suggestions = suggestions_data
              elif isinstance(suggestions_data, dict):
                  suggestions = (
                      suggestions_data.get("items")
                      or suggestions_data.get("suggestions")
                      or suggestions_data.get("data")
                      or []
                  )

              if not isinstance(suggestions, list):
                  suggestions = []

          else:
              print(
                  "Suggestions endpoint unavailable; "
                  "continuing with feed observation."
              )

          print(
              f"Suggested actions retrieved: "
              f"{len(suggestions)}"
          )

          # --------------------------------------------------
          # 7. ANALYSE FEED LOCALLY
          # --------------------------------------------------

          observed_items = []

          for item in feed_items[:25]:

              if not isinstance(item, dict):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              author = item.get("author")

              if isinstance(author, dict):
                  author_name = (
                      author.get("username")
                      or author.get("name")
                      or "unknown"
                  )
              else:
                  author_name = str(author or "unknown")

              title = str(
                  item.get("title")
                  or ""
              )

              body = str(
                  item.get("body")
                  or item.get("content")
                  or ""
              )

              post_type = str(
                  item.get("post_type")
                  or item.get("type")
                  or "unknown"
              )

              text = f"{title} {body}".strip()

              if not text:
                  continue

              observed_items.append({
                  "post_id": post_id,
                  "author": author_name,
                  "post_type": post_type,
                  "title": title[:300],
                  "content_preview": body[:500],
                  "observed_at": now
              })

          # --------------------------------------------------
          # 8. STORE COLONY OBSERVATION
          # --------------------------------------------------

          activity_record = {
              "timestamp": now,
              "feed_items_retrieved": len(feed_items),
              "suggestions_retrieved": len(suggestions),
              "items_observed": len(observed_items),
              "username": username,
              "activity": "observation_only"
          }

          memory["colony_activity_log"].append(
              activity_record
          )

          # --------------------------------------------------
          # 9. STORE SELECTED OBSERVATIONS
          # --------------------------------------------------

          stored_count = 0

          for observed in observed_items[:10]:

              post_id = observed.get("post_id")

              if not post_id:
                  continue

              memory_id = f"colony_v38_{post_id}"

              already_exists = any(
                  isinstance(obs, dict)
                  and obs.get("id") == memory_id
                  for obs in memory["observations"]
              )

              if already_exists:
                  continue

              memory["observations"].append({
                  "id": memory_id,
                  "content": (
                      observed["title"]
                      or observed["content_preview"]
                  ),
                  "source": "The Colony",
                  "source_type": "external_agent_activity",
                  "colony_post_id": post_id,
                  "author": observed["author"],
                  "post_type": observed["post_type"],
                  "confidence": 0.6,
                  "source_reliability": 0.5,
                  "freshness": 1.0,
                  "relevance": 0.5,
                  "verification_status": "unverified",
                  "created_at": now
              })

              stored_count += 1

          print(
              f"New Colony observations stored: {stored_count}"
          )

          # --------------------------------------------------
          # 10. STORE SUGGESTION SUMMARY
          # --------------------------------------------------

          if suggestions:

              memory["learning_log"].append({
                  "timestamp": now,
                  "lesson": (
                      "The Colony provides personalized suggestions "
                      "that can guide NØX toward relevant actions."
                  ),
                  "source": "The Colony",
                  "suggestions_available": len(suggestions)
              })

          # --------------------------------------------------
          # 11. RECORD V38 RETRIEVAL
          # --------------------------------------------------

          memory["retrieval_log"].append({
              "timestamp": now,
              "memory_id": "colony_activity_v38",
              "status": "success",
              "purpose": "colony_observation"
          })

          # --------------------------------------------------
          # 12. UPDATE MEMORY
          # --------------------------------------------------

          memory["version"] = "V38"
          memory["last_updated"] = now
          memory["colony_observer"] = {
              "enabled": True,
              "last_observation": now,
              "mode": "observation_only"
          }

          # --------------------------------------------------
          # 13. WRITE MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 14. VERIFY PERSISTENCE
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if loaded.get("version") != "V38":
              raise RuntimeError(
                  "V38 memory version persistence failed."
              )

          if not loaded.get("colony_activity_log"):
              raise RuntimeError(
                  "Colony activity log was not persisted."
              )

          if loaded.get("colony_observer", {}).get("enabled") is not True:
              raise RuntimeError(
                  "Colony observer was not enabled correctly."
              )

          print("Memory persistence: PASS")
          print("Colony observer: PASS")

          # --------------------------------------------------
          # 15. REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V38 Colony Observer",
              "",
              "## Session",
              "",
              f"- Timestamp: {now}",
              f"- NØX username: {username}",
              f"- Karma: {karma}",
              "",
              "## The Colony",
              "",
              f"- Feed items retrieved: {len(feed_items)}",
              f"- Suggested actions: {len(suggestions)}",
              f"- Items observed: {len(observed_items)}",
              f"- New observations stored: {stored_count}",
              "",
              "## Activity Mode",
              "",
              "- Observation: ENABLED",
              "- Automatic comments: DISABLED",
              "- Automatic posts: DISABLED",
              "- Voting: DISABLED",
              "- DMs: DISABLED",
              "",
              "## Memory",
              "",
              "- Colony observations persisted: PASS",
              "- Activity log persisted: PASS",
              "- Memory version: V38",
              "",
              "## V38 Conclusion",
              "",
              "NØX has begun actively observing The Colony.",
              "",
              "The current stage deliberately separates observation "
              "from interaction. V39 can use these observations to "
              "select a small number of meaningful actions."
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V38 COMPLETE")
          print("===================================")
          PY

      - name: Commit V38 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V38_COLONY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V38 - Colony Observer"
            git push
          fi
