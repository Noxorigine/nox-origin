name: NØX Origin - V28 Action Planning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  action-planning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build NØX action plan locally
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          now = datetime.now(timezone.utc).isoformat()

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          principles = memory.get("principles", [])
          hypotheses = memory.get("hypotheses", [])
          validation_state = memory.get("validation_state", {})
          history = memory.get("history", [])

          if not isinstance(observations, list):
              observations = []

          if not isinstance(patterns, list):
              patterns = []

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(principles, list):
              principles = []

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(history, list):
              history = []

          # ---------------------------------------------------------
          # V28
          #
          # Objectif :
          # préparer les futures décisions d'action de NØX.
          #
          # IMPORTANT :
          # V28 NE CONTACTE PAS THE COLONY.
          # V28 NE PUBLIE RIEN.
          # V28 NE MODIFIE RIEN SUR THE COLONY.
          # V28 NE DEPENSE AUCUN ARGENT.
          # ---------------------------------------------------------

          topic_map = {
              "memory": {
                  "action": "observe_and_improve_memory",
                  "description": (
                      "Identifier les informations importantes à conserver "
                      "et améliorer progressivement la mémoire."
                  )
              },
              "efficiency": {
                  "action": "optimize_resources",
                  "description": (
                      "Identifier les possibilités de réduire le coût "
                      "calculatoire et les opérations inutiles."
                  )
              },
              "verification": {
                  "action": "verify_before_acting",
                  "description": (
                      "Vérifier les informations avant toute future action."
                  )
              },
              "autonomy": {
                  "action": "identify_safe_capabilities",
                  "description": (
                      "Identifier les capacités utiles pouvant être "
                      "exécutées de manière contrôlée."
                  )
              },
              "security": {
                  "action": "check_boundaries",
                  "description": (
                      "Vérifier les limites de sécurité et les permissions "
                      "avant toute action."
                  )
              },
              "learning": {
                  "action": "learn_from_feedback",
                  "description": (
                      "Identifier les informations permettant d'améliorer "
                      "les décisions futures."
                  )
              }
          }

          active_topics = []

          for pattern in patterns:
              if not isinstance(pattern, dict):
                  continue

              topic = pattern.get("topic")

              if topic and topic in topic_map:
                  if topic not in active_topics:
                      active_topics.append(topic)

          # ---------------------------------------------------------
          # Construire les plans potentiels
          # ---------------------------------------------------------

          action_plans = []

          for topic in active_topics:

              data = topic_map[topic]

              related_patterns = [
                  p for p in patterns
                  if isinstance(p, dict)
                  and p.get("topic") == topic
              ]

              signal_count = sum(
                  int(p.get("signal_count", 0) or 0)
                  for p in related_patterns
              )

              if signal_count >= 10:
                  confidence = "high"
              elif signal_count >= 5:
                  confidence = "medium"
              else:
                  confidence = "low"

              action_plans.append({
                  "topic": topic,
                  "proposed_action": data["action"],
                  "description": data["description"],
                  "signal_count": signal_count,
                  "confidence": confidence,
                  "status": "planned",
                  "execution_allowed": False,
                  "requires_future_validation": True,
                  "external_action": False,
                  "cost_eur": 0,
                  "created_at": now
              })

          # ---------------------------------------------------------
          # Garde-fous globaux
          # ---------------------------------------------------------

          safety_rules = {
              "external_actions_enabled": False,
              "the_colony_actions_enabled": False,
              "financial_actions_enabled": False,
              "irreversible_actions_enabled": False,
              "automatic_publication_enabled": False,
              "gemini_required": False,
              "maximum_cost_eur": 0,
              "human_approval_required_for_external_action": True
          }

          # ---------------------------------------------------------
          # État du moteur de décision
          # ---------------------------------------------------------

          action_engine = {
              "version": "V28",
              "status": "planning_only",
              "updated_at": now,
              "plans_generated": len(action_plans),
              "active_topics": active_topics,
              "safety": safety_rules,
              "execution_mode": "disabled",
              "next_stage": "controlled_action_validation"
          }

          # ---------------------------------------------------------
          # Historique
          # ---------------------------------------------------------

          history.append({
              "version": "V28",
              "timestamp": now,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "hypotheses_total": len(hypotheses),
              "action_plans": len(action_plans),
              "external_actions": 0,
              "the_colony_actions": 0,
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_action_planning_v28"
          })

          # ---------------------------------------------------------
          # Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V28"
          memory["updated_at"] = now
          memory["action_plans"] = action_plans
          memory["action_engine"] = action_engine
          memory["action_safety"] = safety_rules
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V28")
          print("==========================================")
          print(f"Observations       : {len(observations)}")
          print(f"Patterns           : {len(patterns)}")
          print(f"Knowledge          : {len(knowledge)}")
          print(f"Principles         : {len(principles)}")
          print(f"Hypotheses         : {len(hypotheses)}")
          print(f"Active topics      : {len(active_topics)}")
          print(f"Action plans       : {len(action_plans)}")
          print("------------------------------------------")
          print("Execution          : DISABLED")
          print("The Colony         : NO ACTION")
          print("Publication        : DISABLED")
          print("Financial actions  : DISABLED")
          print("Gemini             : NON REQUIS")
          print("Cost               : 0 EUR")
          print("------------------------------------------")
          print("Next stage         : CONTROLLED ACTION")
          print("==========================================")
          PY

      - name: Commit V28 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V28 action planning"

          git push
