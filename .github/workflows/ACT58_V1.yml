name: NØX ACT 58 V1 - Opportunity Activation Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-58-opportunity-activation
  cancel-in-progress: false

jobs:
  opportunity-activation:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run ACT58
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_JWT: ${{ secrets.COLONY_JWT }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          ACT = "ACT58"
          VERSION = "V1"

          BASE_URL = os.getenv(
              "COLONY_BASE_URL",
              "https://thecolony.ai"
          ).rstrip("/")

          API_KEY = os.getenv("COLONY_API_KEY", "")
          JWT = os.getenv("COLONY_JWT", "")

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(exist_ok=True)

          OUTPUT_FILE = MEMORY_DIR / "nox_act_58_opportunity_activation.json"

          GEMINI_USED = False
          PROJECT_COST_EUR = 0.0

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-ACT58/1.0"
          })

          if API_KEY:
              session.headers["X-API-Key"] = API_KEY

          if JWT:
              session.headers["Authorization"] = f"Bearer {JWT}"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def request_json(path, params=None):
              url = BASE_URL + path

              try:
                  response = session.get(
                      url,
                      params=params,
                      timeout=20
                  )

                  if response.status_code >= 400:
                      return {
                          "ok": False,
                          "status": response.status_code,
                          "data": None
                      }

                  try:
                      data = response.json()
                  except Exception:
                      data = None

                  return {
                      "ok": True,
                      "status": response.status_code,
                      "data": data
                  }

              except Exception as exc:
                  return {
                      "ok": False,
                      "status": None,
                      "data": None,
                      "error": str(exc)
                  }

          def normalize_text(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  value = json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def first_value(obj, keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  value = obj.get(key)

                  if value not in (None, "", [], {}):
                      return value

              return None

          def stable_id(obj):
              if not isinstance(obj, dict):
                  return None

              value = first_value(
                  obj,
                  [
                      "id",
                      "task_id",
                      "taskId",
                      "uuid",
                      "post_id",
                      "postId",
                      "conversation_id",
                      "conversationId"
                  ]
              )

              if value:
                  return str(value)

              raw = json.dumps(
                  obj,
                  ensure_ascii=False,
                  sort_keys=True
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in [
                  "items",
                  "tasks",
                  "posts",
                  "results",
                  "data",
                  "suggestions",
                  "requests"
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = extract_items(value)

                      if nested:
                          return nested

              return []

          def text_blob(item):
              if not isinstance(item, dict):
                  return normalize_text(item)

              values = []

              for key in [
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "text",
                  "summary",
                  "objective",
                  "task",
                  "request",
                  "deliverable",
                  "message"
              ]:
                  value = item.get(key)

                  if value:
                      values.append(normalize_text(value))

              return " ".join(values)

          # ---------------------------------------------------------
          # 1. Load previous ACT58 state
          # ---------------------------------------------------------

          previous = {}

          if OUTPUT_FILE.exists():
              try:
                  previous = json.loads(
                      OUTPUT_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  previous = {}

          previous_fingerprints = set(
              previous.get(
                  "processed_fingerprints",
                  []
              )
          )

          # ---------------------------------------------------------
          # 2. Collect real Colony signals
          # ---------------------------------------------------------

          sources = []

          endpoints = [
              (
                  "marketplace_tasks",
                  "/api/v1/marketplace/tasks"
              ),
              (
                  "human_requests",
                  "/api/v1/human_requests"
              ),
              (
                  "suggestions",
                  "/api/v1/suggestions"
              ),
              (
                  "for_you",
                  "/api/v1/feed/for-you"
              )
          ]

          for source_name, endpoint in endpoints:
              result = request_json(endpoint)

              if result.get("ok"):
                  items = extract_items(
                      result.get("data")
                  )

                  sources.append({
                      "source": source_name,
                      "endpoint": endpoint,
                      "status": result.get("status"),
                      "items": items
                  })

          # ---------------------------------------------------------
          # 3. Detect possible demand
          # ---------------------------------------------------------

          demand_signals = []

          demand_words = [
              "need",
              "looking for",
              "help",
              "wanted",
              "request",
              "task",
              "research",
              "audit",
              "test",
              "verify",
              "check",
              "analyze",
              "analysis",
              "build",
              "fix",
              "debug",
              "automation",
              "document",
              "documentation",
              "data",
              "review",
              "looking",
              "besoin",
              "recherche",
              "aide",
              "vérifier",
              "tester",
              "analyser"
          ]

          offer_words = [
              "for hire",
              "available for work",
              "i offer",
              "my services",
              "offering",
              "service available"
          ]

          for source in sources:
              for item in source["items"]:

                  if not isinstance(item, dict):
                      continue

                  item_id = stable_id(item)
                  text = text_blob(item)

                  if not text:
                      continue

                  lower = text.lower()

                  demand_hits = sum(
                      1
                      for word in demand_words
                      if word in lower
                  )

                  offer_hits = sum(
                      1
                      for word in offer_words
                      if word in lower
                  )

                  explicit_task = any(
                      key in item
                      for key in [
                          "task_id",
                          "taskId",
                          "reward",
                          "reward_sats",
                          "budget",
                          "acceptance_criteria"
                      ]
                  )

                  if offer_hits > demand_hits and not explicit_task:
                      classification = "agent_offer"

                  elif explicit_task:
                      classification = "explicit_task"

                  elif demand_hits >= 2:
                      classification = "implicit_demand"

                  elif demand_hits == 1:
                      classification = "possible_demand"

                  else:
                      classification = "general_signal"

                  if classification in [
                      "explicit_task",
                      "implicit_demand",
                      "possible_demand"
                  ]:

                      fingerprint_raw = (
                          source["source"]
                          + "|"
                          + str(item_id)
                          + "|"
                          + text[:1000]
                      )

                      fingerprint = hashlib.sha256(
                          fingerprint_raw.encode("utf-8")
                      ).hexdigest()[:24]

                      reward = first_value(
                          item,
                          [
                              "reward_sats",
                              "reward",
                              "budget",
                              "amount",
                              "price"
                          ]
                      )

                      demand_signals.append({
                          "fingerprint": fingerprint,
                          "source": source["source"],
                          "item_id": item_id,
                          "classification": classification,
                          "title": normalize_text(
                              first_value(
                                  item,
                                  [
                                      "title",
                                      "name"
                                  ]
                              )
                          ),
                          "text": text[:1200],
                          "reward": reward,
                          "new": fingerprint not in previous_fingerprints
                      })

          # ---------------------------------------------------------
          # 4. Score opportunities
          # ---------------------------------------------------------

          opportunities = []

          for signal in demand_signals:

              score = 0
              reasons = []

              classification = signal["classification"]
              text = signal["text"].lower()

              if classification == "explicit_task":
                  score += 45
                  reasons.append("explicit_task")

              elif classification == "implicit_demand":
                  score += 35
                  reasons.append("implicit_demand")

              elif classification == "possible_demand":
                  score += 20
                  reasons.append("possible_demand")

              if signal["new"]:
                  score += 15
                  reasons.append("new_signal")

              if signal["reward"] not in (
                  None,
                  "",
                  0,
                  "0"
              ):
                  score += 20
                  reasons.append("reward_present")

              capability_terms = [
                  "research",
                  "analysis",
                  "audit",
                  "testing",
                  "api",
                  "automation",
                  "python",
                  "data",
                  "documentation",
                  "verification",
                  "review"
              ]

              capability_hits = sum(
                  1
                  for word in capability_terms
                  if word in text
              )

              if capability_hits:
                  score += min(
                      capability_hits * 5,
                      20
                  )
                  reasons.append(
                      "potential_nox_capability_match"
                  )

              if score >= 40:
                  priority = "HIGH"

              elif score >= 25:
                  priority = "MEDIUM"

              else:
                  priority = "LOW"

              if priority != "LOW":
                  opportunities.append({
                      **signal,
                      "score": min(score, 100),
                      "priority": priority,
                      "reasons": reasons,
                      "recommended_action": (
                          "ACT15_BID"
                          if classification == "explicit_task"
                          else "PROPOSE_OR_STRUCTURE"
                      )
                  })

          opportunities.sort(
              key=lambda x: (
                  -x["score"],
                  not x["new"]
              )
          )

          # ---------------------------------------------------------
          # 5. Safety / anti-spam decision layer
          # ---------------------------------------------------------

          actions = []

          for opportunity in opportunities[:10]:

              if opportunity["recommended_action"] == "ACT15_BID":
                  action = {
                      "type": "HANDOFF_TO_ACT15",
                      "reason": (
                          "Explicit marketplace demand; "
                          "ACT15 remains responsible for bidding."
                      ),
                      "item_id": opportunity["item_id"],
                      "score": opportunity["score"]
                  }

              else:
                  action = {
                      "type": "OPPORTUNITY_FOR_ACTIVATION",
                      "reason": (
                          "Demand detected outside or before "
                          "a formal marketplace task."
                      ),
                      "item_id": opportunity["item_id"],
                      "score": opportunity["score"]
                  }

              actions.append(action)

          # ---------------------------------------------------------
          # 6. Do NOT send messages automatically in V1
          # ---------------------------------------------------------

          # ACT58 V1 is deliberately a controlled activation layer.
          # It identifies and prepares actions but does not send
          # unsolicited messages or create paid commitments.
          #
          # This prevents:
          # - spam
          # - duplicate contact
          # - accidental spending
          # - conflicting ownership with ACT02
          # - duplicate bids with ACT15

          activation_policy = {
              "auto_send_messages": False,
              "auto_create_bids": False,
              "auto_spend": False,
              "auto_create_paid_tasks": False,
              "requires_existing_demand": True,
              "anti_spam": True,
              "delegates_marketplace_bids_to": "ACT15",
              "delegates_private_communication_to": "ACT02",
              "cost_eur": 0.0
          }

          # ---------------------------------------------------------
          # 7. Compact memory
          # ---------------------------------------------------------

          processed = list(previous_fingerprints)

          for signal in demand_signals:
              processed.append(
                  signal["fingerprint"]
              )

          processed = list(
              dict.fromkeys(processed)
          )[-500:]

          high = [
              x for x in opportunities
              if x["priority"] == "HIGH"
          ]

          medium = [
              x for x in opportunities
              if x["priority"] == "MEDIUM"
          ]

          output = {
              "act": ACT,
              "version": VERSION,
              "name": "Opportunity Activation Engine",
              "timestamp_utc": now(),
              "question": (
                  "Where is real demand that NØX can "
                  "turn into a useful work opportunity?"
              ),
              "gemini_used": GEMINI_USED,
              "project_cost_eur": PROJECT_COST_EUR,
              "sources_checked": [
                  {
                      "name": s["source"],
                      "endpoint": s["endpoint"],
                      "items": len(s["items"]),
                      "status": s["status"]
                  }
                  for s in sources
              ],
              "signals": {
                  "total_demand_signals": len(
                      demand_signals
                  ),
                  "new_signals": sum(
                      1
                      for x in demand_signals
                      if x["new"]
                  ),
                  "explicit_tasks": sum(
                      1
                      for x in demand_signals
                      if x["classification"]
                      == "explicit_task"
                  ),
                  "implicit_demand": sum(
                      1
                      for x in demand_signals
                      if x["classification"]
                      == "implicit_demand"
                  ),
                  "possible_demand": sum(
                      1
                      for x in demand_signals
                      if x["classification"]
                      == "possible_demand"
                  )
              },
              "opportunities": {
                  "total": len(opportunities),
                  "high": len(high),
                  "medium": len(medium),
                  "top": [
                      {
                          "source": x["source"],
                          "item_id": x["item_id"],
                          "classification": x[
                              "classification"
                          ],
                          "title": x["title"],
                          "score": x["score"],
                          "priority": x["priority"],
                          "recommended_action": x[
                              "recommended_action"
                          ],
                          "reasons": x["reasons"]
                      }
                      for x in opportunities[:10]
                  ]
              },
              "activation_actions": actions[:10],
              "activation_policy": activation_policy,
              "economic_funnel": {
                  "demand_detected": len(demand_signals),
                  "qualified_opportunities": len(
                      opportunities
                  ),
                  "handoff_to_act15": sum(
                      1
                      for x in actions
                      if x["type"]
                      == "HANDOFF_TO_ACT15"
                  ),
                  "potential_new_demand": sum(
                      1
                      for x in opportunities
                      if x["recommended_action"]
                      == "PROPOSE_OR_STRUCTURE"
                  ),
                  "bids_created_by_act58": 0,
                  "payments_created_by_act58": 0,
                  "sats_spent": 0
              },
              "learning": {
                  "principle": (
                      "Find demand before optimizing supply."
                  ),
                  "next_question": (
                      "Which detected demand signals "
                      "can realistically become paid work "
                      "or useful collaboration?"
                  )
              },
              "processed_fingerprints": processed
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 8. Condensed GitHub output
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("NØX ACT58 V1 - OPPORTUNITY ACTIVATION")
          print("========================================")
          print(f"Sources checked: {len(sources)}")
          print(
              f"Demand signals: "
              f"{len(demand_signals)}"
          )
          print(
              f"New signals: "
              f"{sum(1 for x in demand_signals if x['new'])}"
          )
          print(
              f"Qualified opportunities: "
              f"{len(opportunities)}"
          )
          print(
              f"HIGH: {len(high)} | "
              f"MEDIUM: {len(medium)}"
          )
          print(
              f"Handoffs to ACT15: "
              f"{sum(1 for x in actions if x['type'] == 'HANDOFF_TO_ACT15')}"
          )
          print(
              f"Potential demand activation: "
              f"{sum(1 for x in opportunities if x['recommended_action'] == 'PROPOSE_OR_STRUCTURE')}"
          )
          print("Gemini: false")
          print("Cost: €0")
          print("Automatic messages: disabled")
          print("Automatic bids: disabled")
          print("Automatic spending: disabled")
          print("")
          print("TOP OPPORTUNITIES")

          for index, opportunity in enumerate(
              opportunities[:5],
              start=1
          ):
              title = (
                  opportunity["title"]
                  or opportunity["text"][:100]
              )

              print(
                  f"{index}. "
                  f"[{opportunity['priority']}] "
                  f"{opportunity['score']}/100 "
                  f"{title}"
              )

          print("")
          print(
              f"Memory written: {OUTPUT_FILE}"
          )
          print("========================================")
          PY

      - name: Commit ACT58 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add memory/nox_act_58_opportunity_activation.json

          if git diff --cached --quiet; then
            echo "No ACT58 memory changes to commit."
          else
            git commit -m "ACT58 opportunity activation memory"
            git push
          fi
