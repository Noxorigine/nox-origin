name: NØX ACT 58 V1.1 - Opportunity Activation Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-58-opportunity-activation
  cancel-in-progress: false

jobs:
  opportunity-activation:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT58
        run: |
          python <<'PY'
          import json
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          ACT = "ACT58"
          VERSION = "V1.1"

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(exist_ok=True)

          ACT57_FILE = MEMORY_DIR / "nox_act_57_demand_discovery.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_58_opportunity_activation.json"

          GEMINI_USED = False
          PROJECT_COST_EUR = 0.0

          def now():
              return datetime.now(timezone.utc).isoformat()

          def normalize(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )

              return " ".join(
                  str(value).split()
              ).strip()

          def stable_fingerprint(item):
              if not isinstance(item, dict):
                  raw = normalize(item)
              else:
                  raw = json.dumps(
                      item,
                      ensure_ascii=False,
                      sort_keys=True
                  )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          # ---------------------------------------------------------
          # 1. Read ACT57 output
          # ---------------------------------------------------------

          if not ACT57_FILE.exists():
              output = {
                  "act": ACT,
                  "version": VERSION,
                  "timestamp_utc": now(),
                  "status": "WAITING_FOR_ACT57",
                  "gemini_used": GEMINI_USED,
                  "project_cost_eur": PROJECT_COST_EUR,
                  "question": (
                      "Which qualified demand signals can "
                      "become useful work opportunities?"
                  ),
                  "sources": {
                      "act57_memory_found": False
                  },
                  "opportunities": [],
                  "activation_actions": [],
                  "economic_funnel": {
                      "demand_received": 0,
                      "qualified_opportunities": 0,
                      "handoff_to_act15": 0,
                      "contact_candidates": 0,
                      "structure_candidates": 0,
                      "follow_up_candidates": 0,
                      "no_action": 0,
                      "bids_created_by_act58": 0,
                      "payments_created_by_act58": 0,
                      "sats_spent": 0
                  },
                  "activation_policy": {
                      "auto_send_messages": False,
                      "auto_create_bids": False,
                      "auto_spend": False,
                      "delegates_marketplace_bids_to": "ACT15",
                      "delegates_private_communication_to": "ACT02",
                      "cost_eur": 0.0
                  }
              }

              OUTPUT_FILE.write_text(
                  json.dumps(
                      output,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("========================================")
              print("NØX ACT58 V1.1")
              print("Status: WAITING_FOR_ACT57")
              print("Gemini: false")
              print("Cost: €0")
              print("========================================")

              raise SystemExit(0)

          # ---------------------------------------------------------
          # 2. Load ACT57
          # ---------------------------------------------------------

          try:
              act57 = json.loads(
                  ACT57_FILE.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as exc:
              print(
                  "ACT57 memory could not be read:",
                  str(exc)
              )
              raise SystemExit(1)

          # ACT57 may expose opportunities directly.
          raw_opportunities = act57.get(
              "opportunities",
              []
          )

          if isinstance(raw_opportunities, dict):
              raw_opportunities = raw_opportunities.get(
                  "top",
                  []
              )

          if not isinstance(raw_opportunities, list):
              raw_opportunities = []

          # ---------------------------------------------------------
          # 3. Load previous ACT58 state
          # ---------------------------------------------------------

          previous = {}

          if OUTPUT_FILE.exists():
              try:
                  previous = json.loads(
                      OUTPUT_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  previous = {}

          previous_fingerprints = set(
              previous.get(
                  "processed_fingerprints",
                  []
              )
          )

          # ---------------------------------------------------------
          # 4. Qualify ACT57 opportunities
          # ---------------------------------------------------------

          opportunities = []

          for item in raw_opportunities:

              if not isinstance(item, dict):
                  continue

              title = normalize(
                  item.get("title")
                  or item.get("name")
                  or ""
              )

              text = normalize(
                  item.get("text")
                  or item.get("description")
                  or ""
              )

              item_id = normalize(
                  item.get("item_id")
                  or item.get("task_id")
                  or item.get("id")
                  or ""
              )

              classification = normalize(
                  item.get("classification")
                  or ""
              )

              score = item.get(
                  "score",
                  0
              )

              try:
                  score = float(score)
              except Exception:
                  score = 0

              if score < 25:
                  continue

              fingerprint = stable_fingerprint({
                  "item_id": item_id,
                  "title": title,
                  "text": text,
                  "classification": classification
              })

              is_new = (
                  fingerprint
                  not in previous_fingerprints
              )

              # -----------------------------------------------------
              # 5. Select action
              # -----------------------------------------------------

              if classification == "explicit_task":
                  action = "ACT15_BID"
                  reason = (
                      "Explicit marketplace demand; "
                      "ACT15 owns bidding."
                  )

              elif classification == "implicit_demand":
                  action = "STRUCTURE_REQUEST"
                  reason = (
                      "Real demand detected but "
                      "not yet formalized as a task."
                  )

              elif classification == "possible_demand":
                  action = "ACT02_CONTACT"
                  reason = (
                      "Potential demand requires "
                      "relevant human/agent interaction."
                  )

              else:
                  action = "NO_ACTION"
                  reason = (
                      "Insufficient evidence for activation."
                  )

              # New signals receive priority.
              if is_new and score < 100:
                  score = min(
                      100,
                      score + 10
                  )

              opportunities.append({
                  "fingerprint": fingerprint,
                  "item_id": item_id,
                  "title": title,
                  "text": text[:800],
                  "classification": classification,
                  "score": int(score),
                  "new": is_new,
                  "recommended_action": action,
                  "reason": reason
              })

          # Highest score first.
          opportunities.sort(
              key=lambda item: (
                  -item["score"],
                  not item["new"]
              )
          )

          # Keep ACT58 deliberately small.
          opportunities = opportunities[:10]

          # ---------------------------------------------------------
          # 6. Activation actions
          # ---------------------------------------------------------

          actions = []

          for item in opportunities:

              action = item["recommended_action"]

              if action == "ACT15_BID":
                  action_type = "HANDOFF_TO_ACT15"

              elif action == "ACT02_CONTACT":
                  action_type = "HANDOFF_TO_ACT02"

              elif action == "STRUCTURE_REQUEST":
                  action_type = "STRUCTURE_REQUEST"

              else:
                  action_type = "NO_ACTION"

              actions.append({
                  "type": action_type,
                  "item_id": item["item_id"],
                  "fingerprint": item["fingerprint"],
                  "score": item["score"],
                  "reason": item["reason"],
                  "executed": False
              })

          # ---------------------------------------------------------
          # 7. Funnel
          # ---------------------------------------------------------

          handoff_act15 = sum(
              1
              for x in actions
              if x["type"] == "HANDOFF_TO_ACT15"
          )

          handoff_act02 = sum(
              1
              for x in actions
              if x["type"] == "HANDOFF_TO_ACT02"
          )

          structure = sum(
              1
              for x in actions
              if x["type"] == "STRUCTURE_REQUEST"
          )

          no_action = sum(
              1
              for x in actions
              if x["type"] == "NO_ACTION"
          )

          # ---------------------------------------------------------
          # 8. Compact fingerprint history
          # ---------------------------------------------------------

          processed = list(
              previous_fingerprints
          )

          for item in opportunities:
              processed.append(
                  item["fingerprint"]
              )

          processed = list(
              dict.fromkeys(processed)
          )[-500:]

          # ---------------------------------------------------------
          # 9. Write memory
          # ---------------------------------------------------------

          output = {
              "act": ACT,
              "version": VERSION,
              "name": "Opportunity Activation Engine",
              "timestamp_utc": now(),
              "status": (
                  "OPPORTUNITIES_FOUND"
                  if opportunities
                  else "NO_QUALIFIED_OPPORTUNITY"
              ),
              "question": (
                  "Which qualified demand signals can "
                  "become useful work opportunities?"
              ),
              "gemini_used": GEMINI_USED,
              "project_cost_eur": PROJECT_COST_EUR,

              "source": {
                  "act57_memory": str(ACT57_FILE),
                  "act57_timestamp": act57.get(
                      "timestamp_utc"
                  ),
                  "act57_status": act57.get(
                      "status"
                  ),
                  "opportunities_received": len(
                      raw_opportunities
                  )
              },

              "opportunities": opportunities,

              "activation_actions": actions,

              "activation_policy": {
                  "auto_send_messages": False,
                  "auto_create_bids": False,
                  "auto_spend": False,
                  "auto_create_paid_tasks": False,
                  "requires_existing_demand": True,
                  "anti_spam": True,
                  "delegates_marketplace_bids_to": "ACT15",
                  "delegates_private_communication_to": "ACT02",
                  "cost_eur": 0.0
              },

              "economic_funnel": {
                  "demand_received": len(
                      raw_opportunities
                  ),
                  "qualified_opportunities": len(
                      opportunities
                  ),
                  "handoff_to_act15": handoff_act15,
                  "contact_candidates": handoff_act02,
                  "structure_candidates": structure,
                  "follow_up_candidates": 0,
                  "no_action": no_action,
                  "bids_created_by_act58": 0,
                  "payments_created_by_act58": 0,
                  "sats_spent": 0
              },

              "learning": {
                  "principle": (
                      "Find demand before optimizing supply."
                  ),
                  "next_question": (
                      "Which activated opportunities "
                      "actually produce work, bids, "
                      "tips or sats?"
                  )
              },

              "processed_fingerprints": processed
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 10. Condensed output
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("NØX ACT58 V1.1")
          print("Opportunity Activation Engine")
          print("========================================")
          print(
              "ACT57 opportunities:",
              len(raw_opportunities)
          )
          print(
              "Qualified:",
              len(opportunities)
          )
          print(
              "ACT15 handoffs:",
              handoff_act15
          )
          print(
              "ACT02 candidates:",
              handoff_act02
          )
          print(
              "Structure candidates:",
              structure
          )
          print(
              "No action:",
              no_action
          )
          print("Gemini: false")
          print("Cost: €0")
          print("Automatic messages: disabled")
          print("Automatic bids: disabled")
          print("Automatic spending: disabled")
          print("")

          if opportunities:
              print("TOP OPPORTUNITIES")

              for index, item in enumerate(
                  opportunities[:5],
                  start=1
              ):
                  title = (
                      item["title"]
                      or item["text"][:100]
                      or "(no title)"
                  )

                  print(
                      f"{index}. "
                      f"{item['score']}/100 "
                      f"[{item['recommended_action']}] "
                      f"{title}"
                  )
          else:
              print("No qualified opportunity.")

          print("")
          print(
              "Memory:",
              OUTPUT_FILE
          )
          print("========================================")
          PY

      - name: Commit ACT58 memory safely
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add memory/nox_act_58_opportunity_activation.json

          if git diff --cached --quiet; then
            echo "No ACT58 changes."
            exit 0
          fi

          git commit -m "ACT58 opportunity activation memory"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
