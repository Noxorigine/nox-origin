name: NØX V80 — Adaptive Decision Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v80-adaptive-decision-learning
  cancel-in-progress: false

jobs:
  adaptive-decision-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V80
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          TIMEOUT = 20

          FALLBACK_ID = "442104b5-eee0-4f73-b452-08f258a21ea2"
          FALLBACK_USERNAME = "nox_origine"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              p = Path(path)

              if not p.exists():
                  return {}

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def api_request(
              method,
              path,
              token=None,
              params=None,
              payload=None
          ):
              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              if payload is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

              response = __import__("requests").request(
                  method,
                  BASE + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              if not response.content:
                  return {}

              return response.json()

          print("Starting NØX V80")
          print("Mode: adaptive decision learning")

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          # ------------------------------------------------------------
          # Authentication
          # ------------------------------------------------------------

          import requests

          token_response = requests.post(
              BASE + "/auth/token",
              json={
                  "api_key": api_key
              },
              headers={
                  "Accept": "application/json"
              },
              timeout=TIMEOUT
          )

          token_response.raise_for_status()

          token_data = token_response.json()

          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "JWT access_token missing"
              )

          print("JWT authentication: OK")

          # ------------------------------------------------------------
          # Canonical identity
          # ------------------------------------------------------------

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          nox_id = str(
              me.get("id")
              or FALLBACK_ID
          )

          nox_username = (
              me.get("username")
              or FALLBACK_USERNAME
          )

          print(
              "NØX:",
              nox_username
          )

          # ------------------------------------------------------------
          # Load previous stages
          # ------------------------------------------------------------

          v77 = load_json(
              "memory/nox_v77_action_readiness_engine.json"
          )

          v78 = load_json(
              "memory/nox_v78_controlled_useful_action.json"
          )

          v79 = load_json(
              "memory/nox_v79_action_result_learning.json"
          )

          print(
              "V77 loaded:",
              bool(v77)
          )

          print(
              "V78 loaded:",
              bool(v78)
          )

          print(
              "V79 loaded:",
              bool(v79)
          )

          # ------------------------------------------------------------
          # Read V79 outcome
          # ------------------------------------------------------------

          outcome = v79.get(
              "outcome",
              {}
          )

          outcome_status = (
              outcome.get("status")
              or v79.get("answer_status")
              or "UNKNOWN"
          )

          decision_quality = (
              outcome.get(
                  "decision_quality"
              )
              or "UNKNOWN"
          )

          evidence_status = (
              outcome.get(
                  "evidence_status"
              )
              or "UNKNOWN"
          )

          observation = v79.get(
              "observation",
              {}
          )

          responses = int(
              observation.get(
                  "responses_to_action",
                  0
              )
              or 0
          )

          positive_signals = int(
              observation.get(
                  "positive_signals",
                  0
              )
              or 0
          )

          negative_signals = int(
              observation.get(
                  "negative_signals",
                  0
              )
              or 0
          )

          opportunity_signals = int(
              observation.get(
                  "opportunity_signals",
                  0
              )
              or 0
          )

          questions = int(
              observation.get(
                  "follow_up_questions",
                  0
              )
              or 0
          )

          # ------------------------------------------------------------
          # Identify the V78 action
          # ------------------------------------------------------------

          v78_selection = v78.get(
              "selection",
              {}
          )

          v78_action = v78_selection.get(
              "action_result",
              {}
          )

          action_type = (
              v78_action.get(
                  "action_type"
              )
              or v78_selection.get(
                  "recommended_action"
              )
              or "CONTROLLED_PUBLIC_COMMENT"
          )

          post_id = (
              v78_action.get(
                  "post_id"
              )
              or v79.get(
                  "source",
                  {}
              ).get(
                  "post_id"
              )
          )

          comment_id = (
              v78_action.get(
                  "comment_id"
              )
              or v79.get(
                  "source",
                  {}
              ).get(
                  "comment_id"
              )
          )

          # ------------------------------------------------------------
          # Read V77 decision
          # ------------------------------------------------------------

          v77_decisions = []

          for key in [
              "decisions",
              "ranked_decisions",
              "candidates",
              "opportunities"
          ]:
              value = v77.get(key)

              if isinstance(value, list):
                  v77_decisions.extend(value)

          v77_decision = None

          for item in v77_decisions:
              if not isinstance(item, dict):
                  continue

              item_post_id = (
                  item.get("post_id")
                  or item.get("id")
              )

              if (
                  post_id
                  and item_post_id
                  and str(item_post_id)
                  == str(post_id)
              ):
                  v77_decision = item
                  break

          if v77_decision is None and v77_decisions:
              v77_decision = v77_decisions[0]

          v77_decision = (
              v77_decision
              or {}
          )

          v77_classification = (
              v77_decision.get(
                  "classification"
              )
              or v77_decision.get(
                  "status"
              )
              or "UNKNOWN"
          )

          v77_priority = (
              v77_decision.get(
                  "priority"
              )
              or "UNKNOWN"
          )

          v77_recommended_action = (
              v77_decision.get(
                  "recommended_action"
              )
              or "UNKNOWN"
          )

          # ------------------------------------------------------------
          # Adaptive scoring
          # ------------------------------------------------------------

          adaptation_score = 0

          if opportunity_signals > 0:
              adaptation_score += 40

          if positive_signals > 0:
              adaptation_score += 20

          if questions > 0:
              adaptation_score += 15

          if responses > 0:
              adaptation_score += 10

          if negative_signals > 0:
              adaptation_score -= 30

          if (
              outcome_status
              == "NO_RESPONSE"
          ):
              adaptation_score -= 5

          adaptation_score = max(
              -100,
              min(100, adaptation_score)
          )

          # ------------------------------------------------------------
          # Determine adaptation direction
          # ------------------------------------------------------------

          if opportunity_signals > 0:
              adaptation_direction = (
                  "INCREASE_PRIORITY"
              )

              adaptation_reason = (
                  "The action produced a signal "
                  "that may connect to a real opportunity."
              )

          elif positive_signals > 0:
              adaptation_direction = (
                  "MAINTAIN_WITH_CAUTION"
              )

              adaptation_reason = (
                  "The action produced positive engagement, "
                  "but engagement alone is not proof of opportunity."
              )

          elif questions > 0:
              adaptation_direction = (
                  "MAINTAIN_AND_OBSERVE"
              )

              adaptation_reason = (
                  "The action generated follow-up interest "
                  "that should be observed before stronger conclusions."
              )

          elif negative_signals > 0:
              adaptation_direction = (
                  "DECREASE_PRIORITY"
              )

              adaptation_reason = (
                  "The action generated negative feedback; "
                  "similar actions should receive lower priority "
                  "until the cause is understood."
              )

          else:
              adaptation_direction = (
                  "NO_CHANGE"
              )

              adaptation_reason = (
                  "There is insufficient outcome evidence "
                  "to justify changing future priorities."
              )

          # ------------------------------------------------------------
          # Important distinction:
          # no response is NOT an action failure.
          # ------------------------------------------------------------

          if outcome_status == "NO_RESPONSE":
              interpretation = (
                  "NO_RESPONSE_IS_NOT_PROOF_OF_FAILURE"
              )
          elif outcome_status == "NEGATIVE_SIGNAL":
              interpretation = (
                  "NEGATIVE_OUTCOME_OBSERVED"
              )
          elif outcome_status == "POTENTIAL_OPPORTUNITY":
              interpretation = (
                  "OPPORTUNITY_SIGNAL_OBSERVED"
              )
          elif outcome_status == "POSITIVE_SIGNAL":
              interpretation = (
                  "POSITIVE_ENGAGEMENT_OBSERVED"
              )
          elif outcome_status == "RESPONSE_RECEIVED":
              interpretation = (
                  "ENGAGEMENT_OBSERVED"
              )
          else:
              interpretation = (
                  "OUTCOME_NOT_STRONG_ENOUGH"
              )

          # ------------------------------------------------------------
          # Build adaptive hypotheses
          # ------------------------------------------------------------

          hypotheses = [
              {
                  "id": "H80-1",
                  "hypothesis": (
                      "Observed outcomes should influence "
                      "future action priority."
                  ),
                  "status": (
                      "SUPPORTED"
                      if responses > 0
                      else "UNTESTED"
                  )
              },
              {
                  "id": "H80-2",
                  "hypothesis": (
                      "Opportunity signals should receive "
                      "more weight than generic engagement."
                  ),
                  "status": (
                      "SUPPORTED"
                      if opportunity_signals > 0
                      else "UNTESTED"
                  )
              },
              {
                  "id": "H80-3",
                  "hypothesis": (
                      "No response should not automatically "
                      "penalize an action as a failure."
                  ),
                  "status": "SUPPORTED"
              },
              {
                  "id": "H80-4",
                  "hypothesis": (
                      "Negative feedback should trigger "
                      "adaptation rather than automatic abandonment."
                  ),
                  "status": (
                      "SUPPORTED"
                      if negative_signals > 0
                      else "UNTESTED"
                  )
              }
          ]

          # ------------------------------------------------------------
          # Proposed adaptive policy
          # ------------------------------------------------------------

          proposed_policy = {
              "policy_status": (
                  "PROPOSED_NOT_DEPLOYED"
              ),
              "rules": [
                  {
                      "condition": (
                          "Repeated actions of the same type "
                          "produce opportunity signals."
                      ),
                      "response": (
                          "Increase their future priority."
                      )
                  },
                  {
                      "condition": (
                          "Actions produce positive engagement "
                          "without opportunity evidence."
                      ),
                      "response": (
                          "Maintain priority but do not classify "
                          "engagement as economic opportunity."
                      )
                  },
                  {
                      "condition": (
                          "Actions produce repeated negative signals."
                      ),
                      "response": (
                          "Reduce priority and investigate cause."
                      )
                  },
                  {
                      "condition": (
                          "Actions produce no response."
                      ),
                      "response": (
                          "Keep neutral status until sufficient "
                          "observations exist."
                      )
                  },
                  {
                      "condition": (
                          "Evidence retrieval fails."
                      ),
                      "response": (
                          "Do not update action quality."
                      )
                  }
              ],
              "automatic_deployment": False
          }

          # ------------------------------------------------------------
          # Confidence
          # ------------------------------------------------------------

          if opportunity_signals > 0:
              confidence = 0.88

          elif negative_signals > 0:
              confidence = 0.82

          elif responses > 0:
              confidence = 0.76

          else:
              confidence = 0.61

          # ------------------------------------------------------------
          # Learning readiness
          # ------------------------------------------------------------

          if (
              opportunity_signals > 0
              or positive_signals > 0
              or negative_signals > 0
          ):
              learning_status = (
                  "ADAPTATION_SIGNAL_AVAILABLE"
              )
          else:
              learning_status = (
                  "MORE_OBSERVATIONS_REQUIRED"
              )

          # ------------------------------------------------------------
          # Regression protection
          # ------------------------------------------------------------

          regression_cases = [
              "V62_GENERIC_DEMAND_FALSE_POSITIVE",
              "V64_ANALYSIS_FALSE_POSITIVE",
              "V67_OVER_PRUNING",
              "V69_TASK_WITHOUT_DEMAND",
              "V72_INPUT_RECOVERY_FAILURE",
              "V74_SELF_EVIDENCE_CONTAMINATION",
              "V79_NO_RESPONSE_IS_NOT_PROOF_OF_FAILURE"
          ]

          # ------------------------------------------------------------
          # Build result
          # ------------------------------------------------------------

          result = {
              "version": "V80",
              "generated_at": now(),
              "mode": "adaptive_decision_learning",
              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },
              "input_chain": {
                  "V77": bool(v77),
                  "V78": bool(v78),
                  "V79": bool(v79)
              },
              "action": {
                  "type": action_type,
                  "post_id": post_id,
                  "comment_id": comment_id
              },
              "previous_decision": {
                  "classification": v77_classification,
                  "priority": v77_priority,
                  "recommended_action": (
                      v77_recommended_action
                  )
              },
              "observed_outcome": {
                  "status": outcome_status,
                  "decision_quality": decision_quality,
                  "evidence_status": evidence_status,
                  "responses": responses,
                  "positive_signals": positive_signals,
                  "negative_signals": negative_signals,
                  "opportunity_signals": opportunity_signals,
                  "follow_up_questions": questions
              },
              "adaptation": {
                  "score": adaptation_score,
                  "direction": adaptation_direction,
                  "reason": adaptation_reason,
                  "interpretation": interpretation
              },
              "hypotheses": hypotheses,
              "proposed_adaptive_policy": proposed_policy,
              "learning": {
                  "status": learning_status,
                  "principle": (
                      "Future decisions should be "
                      "informed by observed outcomes, "
                      "while preserving evidence quality."
                  ),
                  "decision_quality_update": (
                      "Outcome-based learning is now available "
                      "for future prioritization."
                  )
              },
              "regression_cases_preserved": regression_cases,
              "autonomy_progression": {
                  "current_stage": (
                      "OUTCOME_BASED_ADAPTATION"
                  ),
                  "previous_stage": (
                      "ACTION_RESULT_LEARNING"
                  ),
                  "next_stage": (
                      "ADAPTIVE_ACTION_PRIORITIZATION"
                  ),
                  "long_term_target": (
                      "V100_AUTONOMOUS_DECISION_MAKING"
                  )
              },
              "decision": {
                  "automatic_rule_change": False,
                  "human_review_required": True,
                  "proposal_ready": True
              },
              "safety": {
                  "new_external_action": False,
                  "automatic_comment": False,
                  "automatic_application": False,
                  "automatic_bidding": False,
                  "automatic_dm": False,
                  "automatic_payment": False,
                  "gemini": False,
                  "zero_cost": True
              },
              "answer_status": learning_status,
              "confidence": confidence
          }

          # ------------------------------------------------------------
          # Markdown report
          # ------------------------------------------------------------

          md = []

          md.append(
              "# NØX V80 — Adaptive Decision Learning"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Transform observed V79 outcomes into "
              "proposed adaptations for future decisions."
          )
          md.append("")
          md.append("## Decision chain")
          md.append("")
          md.append(
              "**V77 decision → V78 action → V79 result → V80 adaptation**"
          )
          md.append("")
          md.append("## Previous decision")
          md.append("")
          md.append(
              f"- Classification: `{v77_classification}`"
          )
          md.append(
              f"- Priority: `{v77_priority}`"
          )
          md.append(
              f"- Recommended action: `{v77_recommended_action}`"
          )
          md.append("")
          md.append("## Observed outcome")
          md.append("")
          md.append(
              f"- Status: `{outcome_status}`"
          )
          md.append(
              f"- Responses: {responses}"
          )
          md.append(
              f"- Positive signals: {positive_signals}"
          )
          md.append(
              f"- Negative signals: {negative_signals}"
          )
          md.append(
              f"- Opportunity signals: {opportunity_signals}"
          )
          md.append(
              f"- Follow-up questions: {questions}"
          )
          md.append("")
          md.append("## Adaptation")
          md.append("")
          md.append(
              f"- Score: `{adaptation_score}`"
          )
          md.append(
              f"- Direction: **{adaptation_direction}**"
          )
          md.append("")
          md.append(
              adaptation_reason
          )
          md.append("")
          md.append(
              f"Interpretation: `{interpretation}`"
          )
          md.append("")
          md.append("## Proposed policy")
          md.append("")
          md.append(
              "The policy is **PROPOSED, NOT DEPLOYED**."
          )
          md.append("")
          for rule in proposed_policy[
              "rules"
          ]:
              md.append(
                  f"- **If:** {rule['condition']}"
              )
              md.append(
                  f"  **Then:** {rule['response']}"
              )
          md.append("")
          md.append("## Learning hypotheses")
          md.append("")
          for hypothesis in hypotheses:
              md.append(
                  f"- {hypothesis['id']}: "
                  f"{hypothesis['hypothesis']} "
                  f"→ **{hypothesis['status']}**"
              )
          md.append("")
          md.append("## Autonomy progression")
          md.append("")
          md.append(
              "NØX now has the first complete adaptive loop:"
          )
          md.append("")
          md.append(
              "**observe → decide → act → measure → adapt**"
          )
          md.append("")
          md.append(
              "The adaptation remains deliberately "
              "proposed rather than silently deployed."
          )
          md.append("")
          md.append(
              "**Target: V90 → V100 autonomous decision-making.**"
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No new external action.")
          md.append("- No comment.")
          md.append("- No application.")
          md.append("- No bidding.")
          md.append("- No DM.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")
          md.append(
              "Automatic rule change: **False**"
          )
          md.append(
              "Human review required: **True**"
          )
          md.append("")

          Path("memory").mkdir(
              exist_ok=True
          )

          json_path = Path(
              "memory/nox_v80_adaptive_decision_learning.json"
          )

          md_path = Path(
              "memory/nox_v80_adaptive_decision_learning.md"
          )

          json_path.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          md_path.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          print("")
          print(
              "V80 completed successfully."
          )
          print(
              "Outcome:",
              outcome_status
          )
          print(
              "Adaptation:",
              adaptation_direction
          )
          print(
              "Learning status:",
              learning_status
          )
          print(
              "Confidence:",
              confidence
          )
          print("")
          print(json_path)
          print(md_path)
          PY

      - name: Commit V80 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "noreply@nox-origin.local"

          git add \
            memory/nox_v80_adaptive_decision_learning.json \
            memory/nox_v80_adaptive_decision_learning.md

          git diff --cached --quiet || \
            git commit -m "NØX V80 adaptive decision learning"

          git push
