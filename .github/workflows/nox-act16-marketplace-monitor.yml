name: NØX ACT 16 - Marketplace Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

jobs:
  nox-act16:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX ACT 16
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          print("================================================")
          print("NØX ACT 16 - MARKETPLACE MONITOR")
          print("================================================")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def fail(message):
              print(f"ACT 16 STOPPED: {message}")
              sys.exit(1)

          def get_json(url, headers=None, timeout=20):
              response = session.get(
                  url,
                  headers=headers or {},
                  timeout=timeout,
              )
              return response

          def post_json(url, payload, headers=None, timeout=20):
              response = session.post(
                  url,
                  headers=headers or {},
                  json=payload,
                  timeout=timeout,
              )
              return response

          def now():
              return datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------
          # [1] Authentication
          # ------------------------------------------------

          print()
          print("[1] Authenticating...")

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail("COLONY_API_KEY is missing.")

          auth_response = post_json(
              f"{BASE_URL}/auth/token",
              {"api_key": api_key},
          )

          print(f"POST /auth/token -> {auth_response.status_code}")

          if auth_response.status_code != 200:
              print(auth_response.text[:1000])
              fail("Authentication failed.")

          auth_data = auth_response.json()
          access_token = auth_data.get("access_token")

          if not access_token:
              fail("Authentication response contains no access_token.")

          headers = {
              "Authorization": f"Bearer {access_token}",
              "Accept": "application/json",
          }

          print("Authentication successful.")

          # ------------------------------------------------
          # [2] Identity
          # ------------------------------------------------

          print()
          print("[2] Checking identity...")

          me_response = get_json(
              f"{BASE_URL}/users/me",
              headers=headers,
          )

          print(f"GET /users/me -> {me_response.status_code}")

          if me_response.status_code != 200:
              print(me_response.text[:1000])
              fail("Unable to retrieve NØX identity.")

          me = me_response.json()

          username = me.get("username", "unknown")
          karma = me.get("karma", "unknown")

          print(f"Authenticated agent: @{username}")
          print(f"Karma: {karma}")

          if username != "nox_origine":
              fail(f"Unexpected authenticated agent: @{username}")

          # ------------------------------------------------
          # [3] Load memory
          # ------------------------------------------------

          print()
          print("[3] Loading NØX memory...")

          if not os.path.exists(MEMORY_FILE):
              fail(f"Memory file not found: {MEMORY_FILE}")

          with open(MEMORY_FILE, "r", encoding="utf-8") as f:
              memory = json.load(f)

          # ------------------------------------------------
          # [4] Recover ACT15 marketplace action
          # ------------------------------------------------

          print()
          print("[4] Recovering ACT15 marketplace action...")

          marketplace_action = memory.get("marketplace_action", {})

          task_id = (
              marketplace_action.get("task_id")
              or marketplace_action.get("post_id")
          )

          bid_id = marketplace_action.get("bid_id")

          if not task_id:
              fail("No ACT15 task_id found in memory.")

          if not bid_id:
              fail("No ACT15 bid_id found in memory.")

          print(f"ACT15 task ID: {task_id}")
          print(f"ACT15 bid ID: {bid_id}")

          # ------------------------------------------------
          # [5] Refresh Marketplace task
          # ------------------------------------------------

          print()
          print("[5] Refreshing Marketplace...")

          tasks_response = get_json(
              f"{BASE_URL}/marketplace/tasks",
              headers=headers,
          )

          print(f"GET /marketplace/tasks -> {tasks_response.status_code}")

          if tasks_response.status_code != 200:
              print(tasks_response.text[:1000])
              fail("Unable to refresh Marketplace.")

          tasks_data = tasks_response.json()

          if isinstance(tasks_data, list):
              tasks = tasks_data
          elif isinstance(tasks_data, dict):
              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or tasks_data.get("data")
                  or []
              )
          else:
              tasks = []

          selected_task = None

          for task in tasks:
              current_id = (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )

              if current_id == task_id:
                  selected_task = task
                  break

          if selected_task:
              task_status = selected_task.get("status")
              task_title = selected_task.get("title", "")
              print(f"Task found: {task_title}")
              print(f"Task status: {task_status}")
          else:
              task_status = None
              print("Task was not returned by the current Marketplace listing.")
              print("The bid itself will be checked directly.")

          # ------------------------------------------------
          # [6] Read all bids
          # ------------------------------------------------

          print()
          print("[6] Checking Marketplace bids...")

          bids_response = get_json(
              f"{BASE_URL}/marketplace/{task_id}/bids",
              headers=headers,
          )

          print(
              f"GET /marketplace/{task_id}/bids "
              f"-> {bids_response.status_code}"
          )

          if bids_response.status_code != 200:
              print(bids_response.text[:1500])
              fail("Unable to retrieve Marketplace bids.")

          bids_data = bids_response.json()

          if isinstance(bids_data, list):
              bids = bids_data
          elif isinstance(bids_data, dict):
              bids = (
                  bids_data.get("bids")
                  or bids_data.get("items")
                  or bids_data.get("data")
                  or []
              )
          else:
              bids = []

          print(f"Total bids returned: {len(bids)}")

          # ------------------------------------------------
          # [7] Locate NØX bid
          # ------------------------------------------------

          print()
          print("[7] Locating NØX bid...")

          own_bid = None

          for bid in bids:
              current_bid_id = (
                  bid.get("id")
                  or bid.get("bid_id")
              )

              if current_bid_id == bid_id:
                  own_bid = bid
                  break

          if own_bid is None:
              print("ACT15 bid ID was not found in the returned bids.")
              print("No state change will be assumed.")
              print("ACT16 will record the observation without guessing.")

              observation_status = "BID_NOT_RETURNED"

          else:
              observation_status = (
                  own_bid.get("status")
                  or own_bid.get("state")
                  or "UNKNOWN"
              )

              print(f"NØX bid ID: {bid_id}")
              print(f"NØX bid status: {observation_status}")

              if own_bid.get("amount") is not None:
                  print(f"Bid amount: {own_bid.get('amount')}")

              if own_bid.get("created_at"):
                  print(f"Bid created: {own_bid.get('created_at')}")

              if own_bid.get("updated_at"):
                  print(f"Bid updated: {own_bid.get('updated_at')}")

          normalized_status = str(observation_status).lower()

          if normalized_status in {
              "accepted",
              "accept",
              "approved",
          }:
              result_category = "ACCEPTED"
          elif normalized_status in {
              "rejected",
              "reject",
              "declined",
          }:
              result_category = "REJECTED"
          elif normalized_status in {
              "pending",
              "open",
              "submitted",
              "bidding",
          }:
              result_category = "PENDING"
          else:
              result_category = "UNKNOWN"

          print()
          print("Detected result:")
          print(f"Result category: {result_category}")

          # ------------------------------------------------
          # [8] If accepted, retrieve payment information
          # ------------------------------------------------

          payment_info = None
          payment_status = None

          if result_category == "ACCEPTED":

              print()
              print("[8] Bid accepted - checking payment information...")

              payment_response = get_json(
                  f"{BASE_URL}/marketplace/{task_id}/payment",
                  headers=headers,
              )

              print(
                  f"GET /marketplace/{task_id}/payment "
                  f"-> {payment_response.status_code}"
              )

              if payment_response.status_code == 200:
                  payment_info = payment_response.json()

                  if isinstance(payment_info, dict):
                      payment_status = (
                          payment_info.get("status")
                          or payment_info.get("payment_status")
                          or payment_info.get("state")
                      )

                  print("Payment information retrieved.")

                  if payment_status:
                      print(f"Payment status: {payment_status}")

              else:
                  print(
                      "Payment information is not currently available "
                      "through the payment endpoint."
                  )
                  print("No payment state will be invented.")
                  print(payment_response.text[:1000])

          else:
              print()
              print("[8] Payment check not required.")
              print("No payment action will be performed.")

          # ------------------------------------------------
          # [9] Build observation
          # ------------------------------------------------

          print()
          print("[9] Recording Marketplace observation...")

          observation = {
              "timestamp": now(),
              "act": "ACT16",
              "task_id": task_id,
              "bid_id": bid_id,
              "task_status": task_status,
              "bid_status": observation_status,
              "result": result_category,
              "payment_status": payment_status,
          }

          history = memory.get("marketplace_observations", [])

          if not isinstance(history, list):
              history = []

          history.append(observation)

          # Keep the memory bounded.
          memory["marketplace_observations"] = history[-50:]

          # Current state
          memory["marketplace_monitor"] = {
              "last_checked_at": observation["timestamp"],
              "task_id": task_id,
              "bid_id": bid_id,
              "task_status": task_status,
              "bid_status": observation_status,
              "result": result_category,
              "payment_status": payment_status,
          }

          # ------------------------------------------------
          # [10] Update learning state
          # ------------------------------------------------

          learning = memory.get("learning", {})

          if not isinstance(learning, dict):
              learning = {}

          if result_category == "ACCEPTED":
              learning["last_marketplace_result"] = "accepted"
              learning["marketplace_acceptance_observed"] = True
              learning["last_marketplace_acceptance_at"] = observation["timestamp"]

          elif result_category == "REJECTED":
              learning["last_marketplace_result"] = "rejected"
              learning["marketplace_rejection_observed"] = True
              learning["last_marketplace_rejection_at"] = observation["timestamp"]

          elif result_category == "PENDING":
              learning["last_marketplace_result"] = "pending"

          else:
              learning["last_marketplace_result"] = result_category.lower()

          memory["learning"] = learning

          # ------------------------------------------------
          # [11] Persist memory
          # ------------------------------------------------

          print()
          print("[11] Saving memory...")

          os.makedirs(os.path.dirname(MEMORY_FILE), exist_ok=True)

          with open(MEMORY_FILE, "w", encoding="utf-8") as f:
              json.dump(memory, f, indent=2, ensure_ascii=False)

          print(f"Memory saved: {MEMORY_FILE}")

          # ------------------------------------------------
          # [12] Final result
          # ------------------------------------------------

          print()
          print("================================================")
          print("ACT 16 RESULT")
          print("================================================")
          print(f"Task ID: {task_id}")
          print(f"Bid ID: {bid_id}")
          print(f"Task status: {task_status}")
          print(f"Bid status: {observation_status}")
          print(f"Detected result: {result_category}")

          if result_category == "PENDING":
              print()
              print("NØX BID IS STILL PENDING.")
              print("No action was taken.")

          elif result_category == "ACCEPTED":
              print()
              print("NØX BID HAS BEEN ACCEPTED.")
              print("Payment information was checked.")
              print("No payment was sent or withdrawn.")

          elif result_category == "REJECTED":
              print()
              print("NØX BID WAS REJECTED.")
              print("The result was recorded for learning.")

          elif result_category == "BID_NOT_RETURNED":
              print()
              print("NØX BID WAS NOT RETURNED BY THE BIDS ENDPOINT.")
              print("No rejection or acceptance was assumed.")

          else:
              print()
              print("NØX BID STATE IS UNKNOWN.")
              print("No action was taken.")

          print()
          print("ACT 16 COMPLETED.")
          PY

      - name: Commit ACT16 observation
        run: |
          git config user.name "nox_origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT16 marketplace observation"
          git push
