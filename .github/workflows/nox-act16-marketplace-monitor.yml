name: NØX ACT 16 - Marketplace Monitor

on:
  workflow_dispatch:

  schedule:
    # Automatic marketplace monitoring every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

jobs:
  nox-act16:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================================
      # ACT16
      # ==========================================================

      - name: Run NØX ACT16
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests


          # ==========================================================
          # NØX ACT16 V2
          # MARKETPLACE MONITOR
          #
          # Purpose:
          # - Monitor ACT15 marketplace bids
          # - Detect accepted / rejected / pending states
          # - Record observations
          # - Feed learning memory
          #
          # Schedule:
          # - Every 30 minutes
          #
          # Payments:
          # - DISABLED
          #
          # Cost:
          # - €0
          # ==========================================================

          BASE_URL = "https://thecolony.ai/api/v1"

          # ACT15 V6 uses the root memory file.
          MEMORY_FILE = "nox_memory.json"

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })


          # ==========================================================
          # HELPERS
          # ==========================================================

          def fail(message):
              print(f"ACT16 STOPPED: {message}")
              sys.exit(1)


          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def get_json(
              url,
              headers=None,
              timeout=20
          ):
              try:
                  return session.get(
                      url,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except requests.RequestException as exc:
                  fail(
                      f"GET request failed: {exc}"
                  )


          def post_json(
              url,
              payload,
              headers=None,
              timeout=20
          ):
              try:
                  return session.post(
                      url,
                      headers=headers or {},
                      json=payload,
                      timeout=timeout,
                  )
              except requests.RequestException as exc:
                  fail(
                      f"POST request failed: {exc}"
                  )


          # ==========================================================
          # HEADER
          # ==========================================================

          print("")
          print("================================================")
          print("NØX ACT16 V2 - MARKETPLACE MONITOR")
          print("================================================")
          print("")
          print("Schedule: every 30 minutes")
          print("Payments: DISABLED")
          print("Cost: €0")
          print("")


          # ==========================================================
          # [1] AUTHENTICATION
          # ==========================================================

          print("[1] Authenticating...")

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              fail(
                  "COLONY_API_KEY is missing."
              )

          auth_response = post_json(
              f"{BASE_URL}/auth/token",
              {
                  "api_key": api_key
              }
          )

          print(
              "POST /auth/token -> "
              f"{auth_response.status_code}"
          )

          if auth_response.status_code != 200:

              print(
                  auth_response.text[:1500]
              )

              fail(
                  "Authentication failed."
              )

          try:
              auth_data = (
                  auth_response.json()
              )
          except ValueError:

              fail(
                  "Authentication response "
                  "is not valid JSON."
              )

          access_token = (
              auth_data.get(
                  "access_token"
              )
              or auth_data.get(
                  "token"
              )
          )

          if not access_token:

              fail(
                  "Authentication response "
                  "contains no access token."
              )

          headers = {
              "Authorization":
                  f"Bearer {access_token}",
              "Accept":
                  "application/json"
          }

          print(
              "Authentication successful."
          )


          # ==========================================================
          # [2] IDENTITY
          # ==========================================================

          print("")
          print("[2] Checking identity...")

          me_response = get_json(
              f"{BASE_URL}/users/me",
              headers=headers
          )

          print(
              "GET /users/me -> "
              f"{me_response.status_code}"
          )

          if me_response.status_code != 200:

              print(
                  me_response.text[:1500]
              )

              fail(
                  "Unable to retrieve NØX identity."
              )

          try:
              me = me_response.json()
          except ValueError:

              fail(
                  "Identity response "
                  "is not valid JSON."
              )

          username = me.get(
              "username",
              "unknown"
          )

          karma = me.get(
              "karma",
              "unknown"
          )

          print(
              f"Authenticated agent: @{username}"
          )

          print(
              f"Karma: {karma}"
          )

          if username != "nox_origine":

              fail(
                  "Unexpected authenticated agent: "
                  f"@{username}"
              )


          # ==========================================================
          # [3] LOAD MEMORY
          # ==========================================================

          print("")
          print("[3] Loading NØX memory...")

          if not os.path.exists(
              MEMORY_FILE
          ):

              print(
                  f"Memory file not found: "
                  f"{MEMORY_FILE}"
              )

              print(
                  "ACT16 will create a monitoring "
                  "state without assuming an ACT15 bid."
              )

              memory = {}

          else:

              try:

                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      memory = json.load(f)

              except Exception as exc:

                  fail(
                      f"Unable to load memory: {exc}"
                  )

          if not isinstance(
              memory,
              dict
          ):

              fail(
                  "NØX memory root must "
                  "be a JSON object."
              )


          # ==========================================================
          # [4] FIND LATEST ACT15 BID
          # ==========================================================

          print("")
          print(
              "[4] Recovering latest ACT15 marketplace action..."
          )

          marketplace_actions = memory.get(
              "marketplace_actions",
              []
          )

          if not isinstance(
              marketplace_actions,
              list
          ):

              marketplace_actions = []


          latest_action = None

          for action in reversed(
              marketplace_actions
          ):

              if not isinstance(
                  action,
                  dict
              ):

                  continue

              if action.get(
                  "action"
              ) != "marketplace_bid":

                  continue

              if action.get(
                  "status"
              ) != "submitted":

                  continue

              if not action.get(
                  "task_id"
              ):

                  continue

              if not action.get(
                  "bid_id"
              ):

                  continue

              latest_action = action

              break


          if latest_action is None:

              print(
                  "No submitted ACT15 bid with "
                  "task_id + bid_id was found."
              )

              print(
                  "No marketplace state will be assumed."
              )

              # ------------------------------------------------------
              # Record heartbeat / observation.
              # ------------------------------------------------------

              timestamp = now()

              observations = memory.get(
                  "marketplace_observations",
                  []
              )

              if not isinstance(
                  observations,
                  list
              ):

                  observations = []

              observations.append({
                  "timestamp": timestamp,
                  "act": "ACT16",
                  "result": "NO_BID_TO_MONITOR"
              })

              memory[
                  "marketplace_observations"
              ] = observations[-50:]

              memory[
                  "marketplace_monitor"
              ] = {
                  "last_checked_at": timestamp,
                  "result": "NO_BID_TO_MONITOR"
              }

              learning = memory.get(
                  "learning",
                  {}
              )

              if not isinstance(
                  learning,
                  dict
              ):

                  learning = {}

              learning[
                  "last_marketplace_result"
              ] = "no_bid_to_monitor"

              memory["learning"] = learning

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      memory,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

                  f.write("\n")

              print("")
              print(
                  "ACT16 completed: "
                  "nothing to monitor."
              )

              sys.exit(0)


          task_id = latest_action.get(
              "task_id"
          )

          bid_id = latest_action.get(
              "bid_id"
          )

          task_title = latest_action.get(
              "task_title",
              "Untitled"
          )

          print(
              f"Latest ACT15 task: "
              f"{task_title}"
          )

          print(
              f"Task ID: {task_id}"
          )

          print(
              f"Bid ID: {bid_id}"
          )


          # ==========================================================
          # [5] REFRESH MARKETPLACE TASK
          # ==========================================================

          print("")
          print(
              "[5] Refreshing Marketplace..."
          )

          tasks_response = get_json(
              f"{BASE_URL}/marketplace/tasks",
              headers=headers
          )

          print(
              "GET /marketplace/tasks -> "
              f"{tasks_response.status_code}"
          )

          if tasks_response.status_code != 200:

              print(
                  tasks_response.text[:1500]
              )

              fail(
                  "Unable to refresh Marketplace."
              )

          try:
              tasks_data = (
                  tasks_response.json()
              )
          except ValueError:

              fail(
                  "Marketplace tasks response "
                  "is not valid JSON."
              )

          if isinstance(
              tasks_data,
              list
          ):

              tasks = tasks_data

          elif isinstance(
              tasks_data,
              dict
          ):

              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or tasks_data.get("data")
                  or []
              )

          else:

              tasks = []


          selected_task = None

          for task in tasks:

              if not isinstance(
                  task,
                  dict
              ):

                  continue

              current_id = (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )

              if str(
                  current_id
              ) == str(
                  task_id
              ):

                  selected_task = task
                  break


          if selected_task:

              task_status = selected_task.get(
                  "status"
              )

              current_title = selected_task.get(
                  "title",
                  task_title
              )

              print(
                  f"Task found: {current_title}"
              )

              print(
                  f"Task status: {task_status}"
              )

          else:

              task_status = None

              print(
                  "Task not present in current "
                  "Marketplace listing."
              )

              print(
                  "The bid endpoint will be checked directly."
              )


          # ==========================================================
          # [6] READ BIDS
          # ==========================================================

          print("")
          print(
              "[6] Checking Marketplace bids..."
          )

          bids_response = get_json(
              f"{BASE_URL}/marketplace/"
              f"{task_id}/bids",
              headers=headers
          )

          print(
              f"GET /marketplace/{task_id}/bids "
              f"-> {bids_response.status_code}"
          )

          if bids_response.status_code != 200:

              print(
                  bids_response.text[:1500]
              )

              fail(
                  "Unable to retrieve Marketplace bids."
              )

          try:
              bids_data = (
                  bids_response.json()
              )
          except ValueError:

              fail(
                  "Marketplace bids response "
                  "is not valid JSON."
              )

          if isinstance(
              bids_data,
              list
          ):

              bids = bids_data

          elif isinstance(
              bids_data,
              dict
          ):

              bids = (
                  bids_data.get("bids")
                  or bids_data.get("items")
                  or bids_data.get("data")
                  or []
              )

          else:

              bids = []

          print(
              f"Total bids returned: "
              f"{len(bids)}"
          )


          # ==========================================================
          # [7] LOCATE NØX BID
          # ==========================================================

          print("")
          print(
              "[7] Locating NØX bid..."
          )

          own_bid = None

          for bid in bids:

              if not isinstance(
                  bid,
                  dict
              ):

                  continue

              current_bid_id = (
                  bid.get("id")
                  or bid.get("bid_id")
              )

              if str(
                  current_bid_id
              ) == str(
                  bid_id
              ):

                  own_bid = bid
                  break


          if own_bid is None:

              print(
                  "ACT15 bid ID was not found."
              )

              print(
                  "No acceptance or rejection "
                  "will be assumed."
              )

              observation_status = (
                  "BID_NOT_RETURNED"
              )

          else:

              observation_status = (
                  own_bid.get("status")
                  or own_bid.get("state")
                  or "UNKNOWN"
              )

              print(
                  f"NØX bid ID: {bid_id}"
              )

              print(
                  f"NØX bid status: "
                  f"{observation_status}"
              )

              if own_bid.get(
                  "amount"
              ) is not None:

                  print(
                      f"Bid amount: "
                      f"{own_bid.get('amount')}"
                  )

              if own_bid.get(
                  "created_at"
              ):

                  print(
                      f"Bid created: "
                      f"{own_bid.get('created_at')}"
                  )

              if own_bid.get(
                  "updated_at"
              ):

                  print(
                      f"Bid updated: "
                      f"{own_bid.get('updated_at')}"
                  )


          # ==========================================================
          # [8] NORMALIZE RESULT
          # ==========================================================

          normalized_status = str(
              observation_status
          ).lower().strip()


          if normalized_status in {
              "accepted",
              "accept",
              "approved"
          }:

              result_category = "ACCEPTED"


          elif normalized_status in {
              "rejected",
              "reject",
              "declined"
          }:

              result_category = "REJECTED"


          elif normalized_status in {
              "pending",
              "open",
              "submitted",
              "bidding"
          }:

              result_category = "PENDING"


          elif normalized_status == (
              "bid_not_returned"
          ):

              result_category = (
                  "BID_NOT_RETURNED"
              )


          else:

              result_category = "UNKNOWN"


          print("")
          print(
              "Detected result:"
          )

          print(
              f"Result category: "
              f"{result_category}"
          )


          # ==========================================================
          # [9] PAYMENT INFORMATION
          #
          # IMPORTANT:
          # Information only.
          # No payment action.
          # ==========================================================

          payment_info = None
          payment_status = None


          if result_category == "ACCEPTED":

              print("")
              print(
                  "[9] Bid accepted - "
                  "checking payment information..."
              )

              payment_response = get_json(
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/payment",
                  headers=headers
              )

              print(
                  f"GET /marketplace/{task_id}/payment "
                  f"-> {payment_response.status_code}"
              )

              if payment_response.status_code == 200:

                  try:
                      payment_info = (
                          payment_response.json()
                      )
                  except ValueError:

                      payment_info = None

                      print(
                          "Payment response "
                          "is not valid JSON."
                      )

                  if isinstance(
                      payment_info,
                      dict
                  ):

                      payment_status = (
                          payment_info.get(
                              "status"
                          )
                          or payment_info.get(
                              "payment_status"
                          )
                          or payment_info.get(
                              "state"
                          )
                      )

                  print(
                      "Payment information retrieved."
                  )

                  if payment_status:

                      print(
                          f"Payment status: "
                          f"{payment_status}"
                      )

              else:

                  print(
                      "Payment information "
                      "is not available."
                  )

                  print(
                      "No payment state will be invented."
                  )

          else:

              print("")
              print(
                  "[9] Payment check not required."
              )

              print(
                  "No payment action will be performed."
              )


          # ==========================================================
          # [10] BUILD OBSERVATION
          # ==========================================================

          print("")
          print(
              "[10] Recording Marketplace observation..."
          )

          observation = {

              "timestamp":
                  now(),

              "act":
                  "ACT16",

              "task_id":
                  task_id,

              "bid_id":
                  bid_id,

              "task_status":
                  task_status,

              "bid_status":
                  observation_status,

              "result":
                  result_category,

              "payment_status":
                  payment_status
          }


          history = memory.get(
              "marketplace_observations",
              []
          )

          if not isinstance(
              history,
              list
          ):

              history = []

          history.append(
              observation
          )

          memory[
              "marketplace_observations"
          ] = history[-50:]


          # ==========================================================
          # [11] CURRENT MARKETPLACE STATE
          # ==========================================================

          memory[
              "marketplace_monitor"
          ] = {

              "last_checked_at":
                  observation[
                      "timestamp"
                  ],

              "task_id":
                  task_id,

              "bid_id":
                  bid_id,

              "task_status":
                  task_status,

              "bid_status":
                  observation_status,

              "result":
                  result_category,

              "payment_status":
                  payment_status
          }


          # ==========================================================
          # [12] LEARNING STATE
          # ==========================================================

          learning = memory.get(
              "learning",
              {}
          )

          if not isinstance(
              learning,
              dict
          ):

              learning = {}


          if result_category == "ACCEPTED":

              learning[
                  "last_marketplace_result"
              ] = "accepted"

              learning[
                  "marketplace_acceptance_observed"
              ] = True

              learning[
                  "last_marketplace_acceptance_at"
              ] = observation[
                  "timestamp"
              ]


          elif result_category == "REJECTED":

              learning[
                  "last_marketplace_result"
              ] = "rejected"

              learning[
                  "marketplace_rejection_observed"
              ] = True

              learning[
                  "last_marketplace_rejection_at"
              ] = observation[
                  "timestamp"
              ]


          elif result_category == "PENDING":

              learning[
                  "last_marketplace_result"
              ] = "pending"


          elif result_category == (
              "BID_NOT_RETURNED"
          ):

              learning[
                  "last_marketplace_result"
              ] = "bid_not_returned"


          else:

              learning[
                  "last_marketplace_result"
              ] = result_category.lower()


          memory[
              "learning"
          ] = learning


          # ==========================================================
          # [13] SAVE MEMORY
          # ==========================================================

          print("")
          print(
              "[13] Saving memory..."
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          print(
              f"Memory saved: "
              f"{MEMORY_FILE}"
          )


          # ==========================================================
          # [14] FINAL RESULT
          # ==========================================================

          print("")
          print(
              "================================================"
          )

          print(
              "NØX ACT16 V2 RESULT"
          )

          print(
              "================================================"
          )

          print(
              f"Task ID: {task_id}"
          )

          print(
              f"Bid ID: {bid_id}"
          )

          print(
              f"Task status: {task_status}"
          )

          print(
              f"Bid status: {observation_status}"
          )

          print(
              f"Detected result: "
              f"{result_category}"
          )


          if result_category == "PENDING":

              print("")
              print(
                  "NØX BID IS STILL PENDING."
              )

              print(
                  "No action was taken."
              )


          elif result_category == "ACCEPTED":

              print("")
              print(
                  "NØX BID HAS BEEN ACCEPTED."
              )

              print(
                  "Payment information was checked."
              )

              print(
                  "No payment was sent or withdrawn."
              )


          elif result_category == "REJECTED":

              print("")
              print(
                  "NØX BID WAS REJECTED."
              )

              print(
                  "The result was recorded for learning."
              )


          elif result_category == (
              "BID_NOT_RETURNED"
          ):

              print("")
              print(
                  "NØX BID WAS NOT RETURNED."
              )

              print(
                  "No rejection or acceptance was assumed."
              )


          else:

              print("")
              print(
                  "NØX BID STATE IS UNKNOWN."
              )

              print(
                  "No action was taken."
              )


          print("")
          print(
              "ACT16 COMPLETED."
          )

          PY

      # ==========================================================
      # COMMIT MEMORY
      # ==========================================================

      - name: Commit ACT16 observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'NØX Origin'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add nox_memory.json

          if git diff --cached --quiet; then
            printf '%s\n' 'No memory changes to commit.'
            exit 0
          fi

          git commit -m 'NØX ACT16: marketplace observation'

          printf '%s\n' 'Synchronizing local main with remote main...'

          for attempt in 1 2 3; do

            printf 'Synchronization attempt %s...\n' "$attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              printf '%s\n' 'Rebase conflict detected.'
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              printf '%s\n' 'ACT16 memory successfully pushed.'
              exit 0
            fi

            printf '%s\n' 'Push rejected. Retrying...'

            sleep 3

          done

          printf '%s\n' 'ERROR: unable to push ACT16 memory.'
          exit 1
