name: NØX ACT 16 - Marketplace Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

jobs:
  nox-act16:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX ACT16
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests


          BASE_URL = "https://thecolony.ai/api/v1"
          ROOT_MEMORY_FILE = "nox_memory.json"
          ACT15_MEMORY_FILE = "memory/nox_act_15_marketplace.json"

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })


          def fail(message):
              print(f"ACT16 STOPPED: {message}")
              sys.exit(1)


          def now():
              return datetime.now(timezone.utc).isoformat()


          def get_json(url, headers=None, timeout=20):
              try:
                  return session.get(
                      url,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except requests.RequestException as exc:
                  fail(f"GET request failed: {exc}")


          def post_json(url, payload, headers=None, timeout=20):
              try:
                  return session.post(
                      url,
                      headers=headers or {},
                      json=payload,
                      timeout=timeout,
                  )
              except requests.RequestException as exc:
                  fail(f"POST request failed: {exc}")


          def load_json_file(path):
              if not os.path.exists(path):
                  return None

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  fail(f"Unable to load {path}: {exc}")


          def extract_task_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get("task_id")
                  or item.get("taskId")
                  or item.get("id")
              )


          def extract_bid_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get("bid_id")
                  or item.get("bidId")
              )


          def extract_title(item):
              if not isinstance(item, dict):
                  return "Untitled"

              return (
                  item.get("task_title")
                  or item.get("taskTitle")
                  or item.get("title")
                  or "Untitled"
              )


          def collect_act15_submitted_bids(act15_memory):
              if not isinstance(act15_memory, dict):
                  return []

              candidates = []

              for key in (
                  "submitted_bids",
                  "bids_submitted",
                  "bid_candidates",
              ):
                  value = act15_memory.get(key)

                  if isinstance(value, list):
                      candidates.extend(value)

                  elif isinstance(value, dict):
                      candidates.append(value)

              for key in (
                  "marketplace_actions",
                  "actions",
                  "history",
              ):
                  value = act15_memory.get(key)

                  if isinstance(value, list):
                      candidates.extend(value)

              recovered = []

              for item in candidates:
                  if not isinstance(item, dict):
                      continue

                  task_id = extract_task_id(item)

                  if task_id is None:
                      continue

                  status = str(
                      item.get("status")
                      or item.get("result")
                      or ""
                  ).lower().strip()

                  if status in {
                      "failed",
                      "error",
                      "rejected",
                      "blocked",
                  }:
                      continue

                  recovered.append({
                      "task_id": task_id,
                      "bid_id": extract_bid_id(item),
                      "task_title": extract_title(item),
                  })

              unique = {}

              for item in recovered:
                  key = str(item["task_id"])

                  if key not in unique:
                      unique[key] = item
                  elif (
                      not unique[key].get("bid_id")
                      and item.get("bid_id")
                  ):
                      unique[key] = item

              return list(unique.values())


          def locate_own_bid(bids, expected_bid_id, username):

              if expected_bid_id:
                  for bid in bids:
                      if not isinstance(bid, dict):
                          continue

                      current_bid_id = (
                          bid.get("id")
                          or bid.get("bid_id")
                          or bid.get("bidId")
                      )

                      if str(current_bid_id) == str(expected_bid_id):
                          return bid

              for bid in bids:
                  if not isinstance(bid, dict):
                      continue

                  direct_values = [
                      bid.get("username"),
                      bid.get("user"),
                      bid.get("agent"),
                      bid.get("agent_username"),
                      bid.get("agentUsername"),
                      bid.get("worker"),
                      bid.get("worker_username"),
                      bid.get("workerUsername"),
                  ]

                  for value in direct_values:

                      if isinstance(value, str):
                          if value.lstrip("@") == username:
                              return bid

                      elif isinstance(value, dict):

                          nested_username = (
                              value.get("username")
                              or value.get("handle")
                              or value.get("name")
                          )

                          if (
                              isinstance(nested_username, str)
                              and nested_username.lstrip("@") == username
                          ):
                              return bid

              return None


          print("")
          print("================================================")
          print("NØX ACT16 V3 - MARKETPLACE MONITOR")
          print("================================================")
          print("")
          print("Schedule: every 30 minutes")
          print("Payments: DISABLED")
          print("Cost: €0")
          print("")


          # ==========================================================
          # [1] AUTHENTICATION
          # ==========================================================

          print("[1] Authenticating...")

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail("COLONY_API_KEY is missing.")

          auth_response = post_json(
              f"{BASE_URL}/auth/token",
              {"api_key": api_key},
          )

          print(
              f"POST /auth/token -> {auth_response.status_code}"
          )

          if auth_response.status_code != 200:
              print(auth_response.text[:1500])
              fail("Authentication failed.")

          try:
              auth_data = auth_response.json()
          except ValueError:
              fail("Authentication response is not valid JSON.")

          access_token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not access_token:
              fail(
                  "Authentication response contains no access token."
              )

          headers = {
              "Authorization": f"Bearer {access_token}",
              "Accept": "application/json",
          }

          print("Authentication successful.")


          # ==========================================================
          # [2] IDENTITY
          # ==========================================================

          print("")
          print("[2] Checking identity...")

          me_response = get_json(
              f"{BASE_URL}/users/me",
              headers=headers,
          )

          print(
              f"GET /users/me -> {me_response.status_code}"
          )

          if me_response.status_code != 200:
              print(me_response.text[:1500])
              fail("Unable to retrieve NØX identity.")

          try:
              me = me_response.json()
          except ValueError:
              fail("Identity response is not valid JSON.")

          username = me.get("username", "unknown")
          karma = me.get("karma", "unknown")

          print(f"Authenticated agent: @{username}")
          print(f"Karma: {karma}")

          if username != "nox_origine":
              fail(
                  f"Unexpected authenticated agent: @{username}"
              )


          # ==========================================================
          # [3] LOAD MEMORY
          # ==========================================================

          print("")
          print("[3] Loading NØX memory...")

          memory = load_json_file(ROOT_MEMORY_FILE)

          if memory is None:
              memory = {}

          if not isinstance(memory, dict):
              fail("NØX root memory must be a JSON object.")


          # ==========================================================
          # [4] RECOVER ACT15 BID
          # ==========================================================

          print("")
          print("[4] Recovering ACT15 marketplace bid...")

          latest_action = None

          # ----------------------------------------------------------
          # Legacy root memory
          # ----------------------------------------------------------

          marketplace_actions = memory.get(
              "marketplace_actions",
              [],
          )

          if not isinstance(marketplace_actions, list):
              marketplace_actions = []

          for action in reversed(marketplace_actions):

              if not isinstance(action, dict):
                  continue

              if action.get("action") != "marketplace_bid":
                  continue

              if action.get("status") != "submitted":
                  continue

              if not action.get("task_id"):
                  continue

              latest_action = {
                  "task_id": action.get("task_id"),
                  "bid_id": action.get("bid_id"),
                  "task_title": action.get(
                      "task_title",
                      "Untitled",
                  ),
                  "source": "ROOT_MEMORY",
              }

              if action.get("bid_id"):
                  break


          # ----------------------------------------------------------
          # ACT15 V7.1 memory
          # ----------------------------------------------------------

          act15_memory = load_json_file(
              ACT15_MEMORY_FILE
          )

          if act15_memory is not None:

              print(
                  f"ACT15 memory found: {ACT15_MEMORY_FILE}"
              )

              act15_candidates = (
                  collect_act15_submitted_bids(
                      act15_memory
                  )
              )

              print(
                  "ACT15 candidate task IDs recovered: "
                  f"{len(act15_candidates)}"
              )

              if act15_candidates:

                  selected = act15_candidates[-1]

                  latest_action = {
                      "task_id": selected.get("task_id"),
                      "bid_id": selected.get("bid_id"),
                      "task_title": selected.get(
                          "task_title",
                          "Untitled",
                      ),
                      "source": "ACT15_MEMORY",
                  }


          if latest_action is None:

              print(
                  "No ACT15 marketplace bid could be recovered."
              )

              print(
                  "No marketplace state will be assumed."
              )

              timestamp = now()

              observations = memory.get(
                  "marketplace_observations",
                  [],
              )

              if not isinstance(observations, list):
                  observations = []

              observations.append({
                  "timestamp": timestamp,
                  "act": "ACT16",
                  "result": "NO_BID_TO_MONITOR",
              })

              memory["marketplace_observations"] = (
                  observations[-50:]
              )

              memory["marketplace_monitor"] = {
                  "last_checked_at": timestamp,
                  "result": "NO_BID_TO_MONITOR",
              }

              learning = memory.get("learning", {})

              if not isinstance(learning, dict):
                  learning = {}

              learning[
                  "last_marketplace_result"
              ] = "no_bid_to_monitor"

              memory["learning"] = learning

              with open(
                  ROOT_MEMORY_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      memory,
                      f,
                      indent=2,
                      ensure_ascii=False,
                  )
                  f.write("\n")

              print("")
              print("ACT16 completed: nothing to monitor.")

              sys.exit(0)


          task_id = latest_action["task_id"]
          bid_id = latest_action.get("bid_id")
          task_title = latest_action.get(
              "task_title",
              "Untitled",
          )

          print(
              f"Recovered task: {task_title}"
          )

          print(
              f"Task ID: {task_id}"
          )

          if bid_id:
              print(
                  f"Known Bid ID: {bid_id}"
              )
          else:
              print(
                  "Bid ID not stored by ACT15."
              )

              print(
                  "ACT16 will recover it from Marketplace."
              )


          # ==========================================================
          # [5] REFRESH MARKETPLACE
          # ==========================================================

          print("")
          print("[5] Refreshing Marketplace...")

          tasks_response = get_json(
              f"{BASE_URL}/marketplace/tasks",
              headers=headers,
          )

          print(
              "GET /marketplace/tasks -> "
              f"{tasks_response.status_code}"
          )

          if tasks_response.status_code != 200:
              print(tasks_response.text[:1500])
              fail("Unable to refresh Marketplace.")

          try:
              tasks_data = tasks_response.json()
          except ValueError:
              fail(
                  "Marketplace tasks response "
                  "is not valid JSON."
              )

          if isinstance(tasks_data, list):
              tasks = tasks_data

          elif isinstance(tasks_data, dict):
              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or tasks_data.get("data")
                  or []
              )

          else:
              tasks = []

          selected_task = None

          for task in tasks:

              if not isinstance(task, dict):
                  continue

              current_id = (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )

              if str(current_id) == str(task_id):
                  selected_task = task
                  break

          if selected_task:

              task_status = (
                  selected_task.get("status")
                  or selected_task.get("state")
              )

              current_title = selected_task.get(
                  "title",
                  task_title,
              )

              print(
                  f"Task found: {current_title}"
              )

              print(
                  f"Task status: {task_status}"
              )

          else:

              task_status = None

              print(
                  "Task not present in current Marketplace listing."
              )

              print(
                  "The bid endpoint will be checked directly."
              )


          # ==========================================================
          # [6] READ BIDS
          # ==========================================================

          print("")
          print("[6] Checking Marketplace bids...")

          bids_response = get_json(
              f"{BASE_URL}/marketplace/{task_id}/bids",
              headers=headers,
          )

          print(
              f"GET /marketplace/{task_id}/bids "
              f"-> {bids_response.status_code}"
          )

          if bids_response.status_code != 200:
              print(bids_response.text[:1500])
              fail(
                  "Unable to retrieve Marketplace bids."
              )

          try:
              bids_data = bids_response.json()
          except ValueError:
              fail(
                  "Marketplace bids response "
                  "is not valid JSON."
              )

          if isinstance(bids_data, list):
              bids = bids_data

          elif isinstance(bids_data, dict):
              bids = (
                  bids_data.get("bids")
                  or bids_data.get("items")
                  or bids_data.get("data")
                  or []
              )

          else:
              bids = []

          print(
              f"Total bids returned: {len(bids)}"
          )


          # ==========================================================
          # [7] LOCATE NØX BID
          # ==========================================================

          print("")
          print("[7] Locating NØX bid...")

          own_bid = locate_own_bid(
              bids,
              bid_id,
              username,
          )

          if own_bid is None:

              print(
                  "NØX bid was not found in the returned bid list."
              )

              print(
                  "No rejection or acceptance will be assumed."
              )

              observation_status = "BID_NOT_RETURNED"

          else:

              recovered_bid_id = (
                  own_bid.get("id")
                  or own_bid.get("bid_id")
                  or own_bid.get("bidId")
              )

              if recovered_bid_id:
                  bid_id = recovered_bid_id

              observation_status = (
                  own_bid.get("status")
                  or own_bid.get("state")
                  or "UNKNOWN"
              )

              print(
                  f"NØX bid ID: {bid_id}"
              )

              print(
                  f"NØX bid status: {observation_status}"
              )

              if own_bid.get("amount") is not None:
                  print(
                      f"Bid amount: {own_bid.get('amount')}"
                  )

              if own_bid.get("created_at"):
                  print(
                      f"Bid created: {own_bid.get('created_at')}"
                  )

              if own_bid.get("updated_at"):
                  print(
                      f"Bid updated: {own_bid.get('updated_at')}"
                  )


          # ==========================================================
          # [8] NORMALIZE RESULT
          # ==========================================================

          normalized_status = str(
              observation_status
          ).lower().strip()

          if normalized_status in {
              "accepted",
              "accept",
              "approved",
          }:

              result_category = "ACCEPTED"

          elif normalized_status in {
              "rejected",
              "reject",
              "declined",
          }:

              result_category = "REJECTED"

          elif normalized_status in {
              "pending",
              "open",
              "submitted",
              "bidding",
          }:

              result_category = "PENDING"

          elif normalized_status == "bid_not_returned":

              result_category = "BID_NOT_RETURNED"

          else:

              result_category = "UNKNOWN"


          print("")
          print("Detected result:")
          print(
              f"Result category: {result_category}"
          )


          # ==========================================================
          # [9] PAYMENT INFORMATION
          #
          # INFORMATION ONLY.
          # NO PAYMENT ACTION.
          # ==========================================================

          payment_status = None

          if result_category == "ACCEPTED":

              print("")
              print(
                  "[9] Bid accepted - checking payment information..."
              )

              payment_response = get_json(
                  f"{BASE_URL}/marketplace/{task_id}/payment",
                  headers=headers,
              )

              print(
                  f"GET /marketplace/{task_id}/payment "
                  f"-> {payment_response.status_code}"
              )

              if payment_response.status_code == 200:

                  try:
                      payment_info = payment_response.json()
                  except ValueError:
                      payment_info = None

                      print(
                          "Payment response is not valid JSON."
                      )

                  if isinstance(payment_info, dict):

                      payment_status = (
                          payment_info.get("status")
                          or payment_info.get("payment_status")
                          or payment_info.get("state")
                      )

                  print(
                      "Payment information retrieved."
                  )

                  if payment_status:
                      print(
                          f"Payment status: {payment_status}"
                      )

              else:

                  print(
                      "Payment information is not available."
                  )

                  print(
                      "No payment state will be invented."
                  )

          else:

              print("")
              print("[9] Payment check not required.")

              print(
                  "No payment action will be performed."
              )


          # ==========================================================
          # [10] BUILD OBSERVATION
          # ==========================================================

          print("")
          print(
              "[10] Recording Marketplace observation..."
          )

          timestamp = now()

          observation = {
              "timestamp": timestamp,
              "act": "ACT16",
              "task_id": task_id,
              "bid_id": bid_id,
              "task_title": task_title,
              "task_status": task_status,
              "bid_status": observation_status,
              "result": result_category,
              "payment_status": payment_status,
          }

          history = memory.get(
              "marketplace_observations",
              [],
          )

          if not isinstance(history, list):
              history = []

          history.append(observation)

          memory["marketplace_observations"] = (
              history[-50:]
          )


          # ==========================================================
          # [11] CURRENT MARKETPLACE STATE
          # ==========================================================

          memory["marketplace_monitor"] = {
              "last_checked_at": timestamp,
              "task_id": task_id,
              "bid_id": bid_id,
              "task_title": task_title,
              "task_status": task_status,
              "bid_status": observation_status,
              "result": result_category,
              "payment_status": payment_status,
          }


          # ==========================================================
          # [12] LEARNING STATE
          # ==========================================================

          learning = memory.get(
              "learning",
              {},
          )

          if not isinstance(learning, dict):
              learning = {}

          if result_category == "ACCEPTED":

              learning[
                  "last_marketplace_result"
              ] = "accepted"

              learning[
                  "marketplace_acceptance_observed"
              ] = True

              learning[
                  "last_marketplace_acceptance_at"
              ] = timestamp

          elif result_category == "REJECTED":

              learning[
                  "last_marketplace_result"
              ] = "rejected"

              learning[
                  "marketplace_rejection_observed"
              ] = True

              learning[
                  "last_marketplace_rejection_at"
              ] = timestamp

          elif result_category == "PENDING":

              learning[
                  "last_marketplace_result"
              ] = "pending"

          elif result_category == "BID_NOT_RETURNED":

              learning[
                  "last_marketplace_result"
              ] = "bid_not_returned"

          else:

              learning[
                  "last_marketplace_result"
              ] = result_category.lower()

          memory["learning"] = learning


          # ==========================================================
          # [13] SAVE MEMORY
          # ==========================================================

          print("")
          print("[13] Saving memory...")

          with open(
              ROOT_MEMORY_FILE,
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  memory,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          print(
              f"Memory saved: {ROOT_MEMORY_FILE}"
          )


          # ==========================================================
          # [14] FINAL RESULT
          # ==========================================================

          print("")
          print("================================================")
          print("NØX ACT16 V3 RESULT")
          print("================================================")

          print(
              f"Task ID: {task_id}"
          )

          print(
              f"Bid ID: {bid_id}"
          )

          print(
              f"Task status: {task_status}"
          )

          print(
              f"Bid status: {observation_status}"
          )

          print(
              f"Detected result: {result_category}"
          )

          if result_category == "PENDING":

              print("")
              print("NØX BID IS STILL PENDING.")
              print("No action was taken.")

          elif result_category == "ACCEPTED":

              print("")
              print("NØX BID HAS BEEN ACCEPTED.")
              print("Payment information was checked.")
              print("No payment was sent or withdrawn.")

          elif result_category == "REJECTED":

              print("")
              print("NØX BID WAS REJECTED.")
              print(
                  "The result was recorded for learning."
              )

          elif result_category == "BID_NOT_RETURNED":

              print("")
              print("NØX BID WAS NOT RETURNED.")
              print(
                  "No rejection or acceptance was assumed."
              )

          else:

              print("")
              print("NØX BID STATE IS UNKNOWN.")
              print("No action was taken.")

          print("")
          print("ACT16 COMPLETED.")

          PY

      # ==========================================================
      # COMMIT MEMORY
      # ==========================================================

      - name: Commit ACT16 observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'NØX Origin'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add nox_memory.json

          if git diff --cached --quiet; then
            printf '%s\n' 'No memory changes to commit.'
            exit 0
          fi

          git commit -m 'NØX ACT16: marketplace observation'

          printf '%s\n' 'Synchronizing local main with remote main...'

          for attempt in 1 2 3; do
            printf 'Synchronization attempt %s...\n' "$attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              printf '%s\n' 'Rebase conflict detected.'
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              printf '%s\n' 'ACT16 memory successfully pushed.'
              exit 0
            fi

            printf '%s\n' 'Push rejected. Retrying...'
            sleep 3
          done

          printf '%s\n' 'ERROR: unable to push ACT16 memory.'
          exit 1
