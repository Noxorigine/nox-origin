name: NØX ACT 16 - Marketplace Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

jobs:
  nox-act16:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      ROOT_MEMORY_FILE: nox_memory.json
      ACT15_MEMORY_FILE: memory/nox_act_15_marketplace.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT16 Marketplace Monitor
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          ROOT_MEMORY_FILE = os.environ["ROOT_MEMORY_FILE"]
          ACT15_MEMORY_FILE = os.environ["ACT15_MEMORY_FILE"]

          SESSION = requests.Session()
          SESSION.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT16-Marketplace-Monitor/4.0",
          })

          print("=" * 48)
          print("NØX ACT16 V4 - MARKETPLACE MONITOR")
          print("=" * 48)
          print()
          print("Schedule: every 30 minutes")
          print("Payments: DISABLED")
          print("Cost: €0")
          print()

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def safe_get(url, headers=None, timeout=30):
              try:
                  return SESSION.get(
                      url,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except Exception as exc:
                  print(f"GET exception: {exc}")
                  return None

          def safe_post(url, payload, headers=None, timeout=30):
              try:
                  return SESSION.post(
                      url,
                      json=payload,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except Exception as exc:
                  print(f"POST exception: {exc}")
                  return None

          def load_json_file(path):
              if not os.path.exists(path):
                  return {}
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Could not load {path}: {exc}")
                  return {}

          def extract_task_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "marketplace_task_id",
                  "marketplaceTaskId",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              task = obj.get("task")
              if isinstance(task, dict):
                  for key in ("id", "task_id", "taskId"):
                      value = task.get(key)
                      if value:
                          return str(value)

              return None

          def extract_bid_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "bid_id",
                  "bidId",
                  "id",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              bid = obj.get("bid")
              if isinstance(bid, dict):
                  for key in ("id", "bid_id", "bidId"):
                      value = bid.get(key)
                      if value:
                          return str(value)

              return None

          def extract_title(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "title",
                  "task_title",
                  "taskTitle",
                  "name",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              task = obj.get("task")
              if isinstance(task, dict):
                  for key in ("title", "name"):
                      value = task.get(key)
                      if value:
                          return str(value)

              return None

          def collect_act15_candidates(memory):
              found = []

              def walk(obj):
                  if isinstance(obj, dict):
                      task_id = extract_task_id(obj)

                      if task_id:
                          bid_id = extract_bid_id(obj)
                          status = str(
                              obj.get("status")
                              or obj.get("result")
                              or obj.get("outcome")
                              or ""
                          ).lower()

                          failed_markers = (
                              "error",
                              "failed",
                              "blocked",
                              "rejected",
                              "not_submitted",
                          )

                          if not any(marker in status for marker in failed_markers):
                              found.append({
                                  "task_id": task_id,
                                  "bid_id": bid_id,
                                  "title": extract_title(obj),
                              })

                      for value in obj.values():
                          walk(value)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item)

              walk(memory)

              unique = []
              seen = set()

              for item in found:
                  key = (
                      item.get("task_id"),
                      item.get("bid_id"),
                  )
                  if key in seen:
                      continue
                  seen.add(key)
                  unique.append(item)

              return unique

          def flatten_strings(obj, path=""):
              values = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      child_path = f"{path}.{key}" if path else str(key)
                      values.extend(flatten_strings(value, child_path))

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      child_path = f"{path}[{index}]"
                      values.extend(flatten_strings(value, child_path))

              elif isinstance(obj, (str, int)):
                  values.append((path, str(obj)))

              return values

          def normalize_identity(value):
              if value is None:
                  return ""

              value = str(value).strip().lower()

              if value.startswith("@"):
                  value = value[1:]

              return value

          def identity_matches(value, identity_values):
              normalized = normalize_identity(value)

              if not normalized:
                  return False

              for candidate in identity_values:
                  candidate_normalized = normalize_identity(candidate)

                  if not candidate_normalized:
                      continue

                  if normalized == candidate_normalized:
                      return True

              return False

          def bid_contains_nox(bid, identity_values):
              if not isinstance(bid, dict):
                  return False, []

              matches = []

              # First inspect semantically likely identity fields.
              identity_keys = {
                  "username",
                  "user_name",
                  "userName",
                  "handle",
                  "agent",
                  "agent_name",
                  "agentName",
                  "agent_handle",
                  "agentHandle",
                  "bidder",
                  "bidder_name",
                  "bidderName",
                  "author",
                  "owner",
                  "creator",
                  "user",
                  "profile",
                  "account",
                  "identity",
              }

              def inspect(obj, path=""):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          child_path = f"{path}.{key}" if path else str(key)

                          if key in identity_keys:
                              if isinstance(value, str):
                                  if identity_matches(value, identity_values):
                                      matches.append(child_path)
                              elif isinstance(value, dict):
                                  for nested_path, nested_value in flatten_strings(
                                      value,
                                      child_path,
                                  ):
                                      if identity_matches(
                                          nested_value,
                                          identity_values,
                                      ):
                                          matches.append(nested_path)

                          inspect(value, child_path)

                  elif isinstance(obj, list):
                      for index, value in enumerate(obj):
                          inspect(value, f"{path}[{index}]")

              inspect(bid)

              # Fallback: inspect every string in the bid.
              # This handles undocumented API nesting without assuming
              # a particular schema.
              if not matches:
                  for path, value in flatten_strings(bid):
                      if identity_matches(value, identity_values):
                          matches.append(path)

              return bool(matches), matches

          def find_own_bid(bids, identity_values, expected_bid_id=None):
              if not isinstance(bids, list):
                  return None, []

              # Exact bid ID gets priority.
              if expected_bid_id:
                  expected = str(expected_bid_id)

                  for bid in bids:
                      if not isinstance(bid, dict):
                          continue

                      bid_id = extract_bid_id(bid)

                      if bid_id and bid_id == expected:
                          return bid, ["exact_bid_id"]

              # Then identify NØX.
              for bid in bids:
                  matched, paths = bid_contains_nox(
                      bid,
                      identity_values,
                  )

                  if matched:
                      return bid, paths

              return None, []

          print("[1] Authenticating...")

          auth_response = safe_post(
              f"{BASE_URL}/auth/token",
              {"api_key": API_KEY},
          )

          if auth_response is None:
              raise SystemExit("Authentication request failed.")

          print(
              f"POST /auth/token -> {auth_response.status_code}"
          )

          if auth_response.status_code != 200:
              print(auth_response.text[:1000])
              raise SystemExit("Authentication failed.")

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit(
                  "Authentication succeeded but no token was returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          print("Authentication successful.")
          print()

          print("[2] Checking identity...")

          me_response = safe_get(
              f"{BASE_URL}/users/me",
              headers=headers,
          )

          if me_response is None:
              raise SystemExit("Identity request failed.")

          print(
              f"GET /users/me -> {me_response.status_code}"
          )

          if me_response.status_code != 200:
              print(me_response.text[:1000])
              raise SystemExit("Identity check failed.")

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("agent_handle")
              or me.get("name")
          )

          user_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("userId")
          )

          print(f"Authenticated agent: @{username or 'unknown'}")
          print(f"User ID: {user_id or 'unknown'}")
          print(f"Karma: {me.get('karma', 'unknown')}")
          print()

          identity_values = []

          for value in (
              username,
              me.get("handle"),
              me.get("username"),
              me.get("agent_handle"),
              me.get("agentHandle"),
              user_id,
              me.get("agent_id"),
              me.get("agentId"),
          ):
              if value is not None:
                  identity_values.append(str(value))

          # Always include the known canonical handle.
          identity_values.append("nox_origine")
          identity_values.append("@nox_origine")

          print("[3] Loading NØX memory...")

          root_memory = load_json_file(ROOT_MEMORY_FILE)
          act15_memory = load_json_file(ACT15_MEMORY_FILE)

          print()

          print("[4] Recovering ACT15 marketplace bid...")

          if os.path.exists(ACT15_MEMORY_FILE):
              print(
                  f"ACT15 memory found: {ACT15_MEMORY_FILE}"
              )
          else:
              print("ACT15 memory file not found.")

          act15_candidates = collect_act15_candidates(
              act15_memory
          )

          print(
              f"ACT15 candidate task IDs recovered: "
              f"{len(act15_candidates)}"
          )

          target = (
              act15_candidates[-1]
              if act15_candidates
              else None
          )

          if target is None:
              print(
                  "No ACT15 marketplace candidate was recovered."
              )

              observation = {
                  "timestamp": now_iso(),
                  "action": "marketplace_observation",
                  "source": "ACT16_V4",
                  "result": "NO_BID_TO_MONITOR",
                  "task_id": None,
                  "bid_id": None,
                  "task_status": None,
                  "bid_status": "NO_BID_TO_MONITOR",
                  "payment_checked": False,
                  "payment_action": "none",
                  "gemini_used": False,
                  "project_cost_eur": 0,
              }

              if not isinstance(root_memory, dict):
                  root_memory = {}

              observations = root_memory.setdefault(
                  "marketplace_observations",
                  [],
              )

              if not isinstance(observations, list):
                  observations = []
                  root_memory["marketplace_observations"] = observations

              observations.append(observation)

              with open(
                  ROOT_MEMORY_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      root_memory,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              print("Heartbeat observation saved.")
              raise SystemExit(0)

          task_id = target["task_id"]
          expected_bid_id = target.get("bid_id")
          title = target.get("title") or "Unknown task"

          print(f"Recovered task: {title}")
          print(f"Task ID: {task_id}")

          if expected_bid_id:
              print(f"Stored bid ID: {expected_bid_id}")
          else:
              print("Bid ID not stored by ACT15.")
              print(
                  "ACT16 will recover it from Marketplace."
              )

          print()

          print("[5] Refreshing Marketplace...")

          marketplace_response = safe_get(
              f"{BASE_URL}/marketplace/tasks?limit=30",
              headers=headers,
          )

          if marketplace_response is None:
              print("Marketplace refresh failed.")
              tasks = []
          else:
              print(
                  "GET /marketplace/tasks -> "
                  f"{marketplace_response.status_code}"
              )

              if marketplace_response.status_code == 200:
                  marketplace_data = marketplace_response.json()

                  if isinstance(marketplace_data, dict):
                      tasks = marketplace_data.get("items", [])
                  elif isinstance(marketplace_data, list):
                      tasks = marketplace_data
                  else:
                      tasks = []
              else:
                  tasks = []

          task_in_listing = None

          for task in tasks:
              if not isinstance(task, dict):
                  continue

              candidate_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("taskId")
              )

              if candidate_id and str(candidate_id) == str(task_id):
                  task_in_listing = task
                  break

          if task_in_listing:
              print("Task found in current Marketplace listing.")
          else:
              print(
                  "Task not present in current Marketplace listing."
              )
              print(
                  "The bid endpoint will be checked directly."
              )

          print()

          print("[6] Checking Marketplace bids...")

          bids_response = safe_get(
              f"{BASE_URL}/marketplace/{task_id}/bids",
              headers=headers,
          )

          if bids_response is None:
              raise SystemExit(
                  "Marketplace bids request failed."
              )

          print(
              f"GET /marketplace/{task_id}/bids -> "
              f"{bids_response.status_code}"
          )

          if bids_response.status_code != 200:
              print(bids_response.text[:1500])

              observation = {
                  "timestamp": now_iso(),
                  "action": "marketplace_observation",
                  "source": "ACT16_V4",
                  "result": "BIDS_ENDPOINT_ERROR",
                  "task_id": task_id,
                  "bid_id": expected_bid_id,
                  "task_title": title,
                  "task_status": (
                      task_in_listing.get("status")
                      if task_in_listing
                      else None
                  ),
                  "bid_status": "BIDS_ENDPOINT_ERROR",
                  "payment_checked": False,
                  "payment_action": "none",
                  "gemini_used": False,
                  "project_cost_eur": 0,
              }

              root_memory.setdefault(
                  "marketplace_observations",
                  [],
              ).append(observation)

              with open(
                  ROOT_MEMORY_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      root_memory,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              raise SystemExit(
                  "ACT16 could not read Marketplace bids."
              )

          bids_data = bids_response.json()

          if isinstance(bids_data, dict):
              bids = (
                  bids_data.get("items")
                  or bids_data.get("bids")
                  or bids_data.get("data")
                  or []
              )
          elif isinstance(bids_data, list):
              bids = bids_data
          else:
              bids = []

          if not isinstance(bids, list):
              bids = []

          print(f"Total bids returned: {len(bids)}")
          print()

          print("[7] Locating NØX bid...")

          own_bid, match_paths = find_own_bid(
              bids,
              identity_values,
              expected_bid_id=expected_bid_id,
          )

          bid_id = None
          bid_status_raw = None
          bid_status = "BID_NOT_RETURNED"

          if own_bid:
              bid_id = extract_bid_id(own_bid)

              for key in (
                  "status",
                  "state",
                  "bid_status",
                  "bidStatus",
              ):
                  if own_bid.get(key) is not None:
                      bid_status_raw = own_bid.get(key)
                      break

              normalized_status = str(
                  bid_status_raw or ""
              ).strip().lower()

              if normalized_status in {
                  "accepted",
                  "approved",
                  "won",
                  "selected",
              }:
                  bid_status = "ACCEPTED"

              elif normalized_status in {
                  "rejected",
                  "declined",
                  "lost",
                  "denied",
              }:
                  bid_status = "REJECTED"

              elif normalized_status in {
                  "pending",
                  "submitted",
                  "active",
                  "bidding",
                  "open",
                  "under_review",
                  "review",
              }:
                  bid_status = "PENDING"

              elif normalized_status:
                  bid_status = normalized_status.upper()

              else:
                  bid_status = "UNKNOWN_BID_STATUS"

              print("NØX bid FOUND.")
              print(f"Bid ID: {bid_id}")
              print(f"Bid status: {bid_status}")
              print(
                  "Identity match path(s): "
                  + ", ".join(match_paths[:10])
              )

          else:
              print(
                  "NØX bid was not found in the returned bid list."
              )
              print(
                  "No rejection or acceptance will be assumed."
              )

              # Diagnostic output is deliberately limited to keys
              # and compact scalar identity-like values. Secrets are
              # never printed.
              print()
              print("[7A] Bid schema diagnostic...")

              for index, bid in enumerate(bids[:8], start=1):
                  if not isinstance(bid, dict):
                      print(
                          f"Bid #{index}: non-dict response"
                      )
                      continue

                  print(
                      f"Bid #{index} top-level keys: "
                      f"{sorted(str(k) for k in bid.keys())}"
                  )

                  identity_like = []

                  for path, value in flatten_strings(bid):
                      low_path = path.lower()

                      if any(
                          marker in low_path
                          for marker in (
                              "user",
                              "agent",
                              "bidder",
                              "author",
                              "owner",
                              "creator",
                              "handle",
                              "username",
                              "profile",
                              "account",
                              "identity",
                          )
                      ):
                          identity_like.append(
                              f"{path}={value[:120]}"
                          )

                  for item in identity_like[:15]:
                      print(f"  {item}")

              print()

          print()

          print("[8] Determining Marketplace result...")

          task_status = None

          if task_in_listing:
              task_status = (
                  task_in_listing.get("status")
                  or task_in_listing.get("state")
                  or task_in_listing.get("task_status")
              )

          if bid_status == "ACCEPTED":
              detected_result = "BID_ACCEPTED"
          elif bid_status == "REJECTED":
              detected_result = "BID_REJECTED"
          elif bid_status == "PENDING":
              detected_result = "BID_PENDING"
          elif own_bid:
              detected_result = "BID_STATUS_UNKNOWN"
          else:
              detected_result = "BID_NOT_RETURNED"

          print(f"Task status: {task_status}")
          print(f"Bid status: {bid_status}")
          print(f"Detected result: {detected_result}")
          print()

          print("[9] Payment check...")

          payment_checked = False
          payment_info = None

          if bid_status == "ACCEPTED":
              print(
                  "Bid accepted/selected. "
                  "Checking payment information only."
              )

              payment_checked = True

              payment_candidates = [
                  f"{BASE_URL}/marketplace/{task_id}/payment",
                  f"{BASE_URL}/marketplace/{task_id}/payout",
              ]

              for payment_url in payment_candidates:
                  payment_response = safe_get(
                      payment_url,
                      headers=headers,
                  )

                  if payment_response is None:
                      continue

                  if payment_response.status_code == 200:
                      try:
                          payment_info = payment_response.json()
                      except Exception:
                          payment_info = {
                              "raw": payment_response.text[:1000]
                          }
                      break

              print(
                  "Payment information may be recorded, "
                  "but NO payment action will be performed."
              )
          else:
              print("Payment check not required.")

          print("No payment action will be performed.")
          print()

          print("[10] Recording Marketplace observation...")

          observation = {
              "timestamp": now_iso(),
              "action": "marketplace_observation",
              "source": "ACT16_V4",
              "result": detected_result,
              "task_id": task_id,
              "bid_id": bid_id,
              "task_title": title,
              "task_status": task_status,
              "bid_status": bid_status,
              "bid_status_raw": bid_status_raw,
              "total_bids_returned": len(bids),
              "identity_match_paths": match_paths[:10],
              "payment_checked": payment_checked,
              "payment_action": "none",
              "payment_info_observed": (
                  payment_info is not None
              ),
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          observations = root_memory.setdefault(
              "marketplace_observations",
              [],
          )

          if not isinstance(observations, list):
              observations = []
              root_memory["marketplace_observations"] = observations

          observations.append(observation)

          # Keep memory bounded.
          if len(observations) > 500:
              root_memory["marketplace_observations"] = (
                  observations[-500:]
              )

          root_memory["act16_last_marketplace_observation"] = (
              observation
          )

          print()
          print("[13] Saving memory...")

          with open(
              ROOT_MEMORY_FILE,
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  root_memory,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print(f"Memory saved: {ROOT_MEMORY_FILE}")

          print()
          print("=" * 48)
          print("NØX ACT16 V4 RESULT")
          print("=" * 48)
          print(f"Task ID: {task_id}")
          print(f"Bid ID: {bid_id}")
          print(f"Task status: {task_status}")
          print(f"Bid status: {bid_status}")
          print(f"Detected result: {detected_result}")
          print()

          if bid_status == "ACCEPTED":
              print("NØX BID WAS ACCEPTED.")
              print("No payment action was performed.")
          elif bid_status == "REJECTED":
              print("NØX BID WAS REJECTED.")
          elif bid_status == "PENDING":
              print("NØX BID IS STILL PENDING.")
          elif bid_status == "BID_NOT_RETURNED":
              print("NØX BID WAS NOT RETURNED.")
              print(
                  "No rejection or acceptance was assumed."
              )
          else:
              print(
                  "NØX BID STATUS COULD NOT BE FULLY CLASSIFIED."
              )

          print()
          print("ACT16 COMPLETED.")

          PY

      - name: Commit and push ACT16 memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No ACT16 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT16: marketplace observation"

          echo "Synchronizing local main with remote main..."

          for attempt in 1 2 3; do
            echo "Synchronization attempt ${attempt}..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT16 memory successfully pushed."
              exit 0
            fi

            echo "Push failed on attempt ${attempt}."

            if [ "${attempt}" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "Unable to push ACT16 memory after 3 attempts."
          exit 1
