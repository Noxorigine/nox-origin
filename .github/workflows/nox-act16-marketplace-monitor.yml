name: NØX ACT 16 - Marketplace Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

jobs:
  nox-act16:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      ROOT_MEMORY_FILE: nox_memory.json
      ACT15_MEMORY_FILE: memory/nox_act_15_marketplace.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT16 Marketplace Monitor
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          ROOT_MEMORY_FILE = os.environ["ROOT_MEMORY_FILE"]
          ACT15_MEMORY_FILE = os.environ["ACT15_MEMORY_FILE"]

          SESSION = requests.Session()
          SESSION.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT16-Marketplace-Monitor/5.0",
          })

          print("=" * 48)
          print("NØX ACT16 V5 - MARKETPLACE MONITOR")
          print("=" * 48)
          print()
          print("Schedule: every 30 minutes")
          print("Payments: DISABLED")
          print("Cost: €0")
          print()

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_json_file(path):
              if not os.path.exists(path):
                  return {}

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Could not load {path}: {exc}")
                  return {}

          def safe_get(url, headers=None, timeout=30):
              try:
                  return SESSION.get(
                      url,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except Exception as exc:
                  print(f"GET exception: {exc}")
                  return None

          def extract_task_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "marketplace_task_id",
                  "marketplaceTaskId",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              task = obj.get("task")

              if isinstance(task, dict):
                  for key in ("id", "task_id", "taskId"):
                      value = task.get(key)
                      if value:
                          return str(value)

              return None

          def extract_bid_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "bid_id",
                  "bidId",
                  "id",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              bid = obj.get("bid")

              if isinstance(bid, dict):
                  for key in ("id", "bid_id", "bidId"):
                      value = bid.get(key)
                      if value:
                          return str(value)

              return None

          def extract_title(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "title",
                  "task_title",
                  "taskTitle",
                  "name",
              ):
                  value = obj.get(key)
                  if value:
                      return str(value)

              task = obj.get("task")

              if isinstance(task, dict):
                  for key in ("title", "name"):
                      value = task.get(key)
                      if value:
                          return str(value)

              return None

          def collect_act15_candidates(memory):
              found = []

              def walk(obj):
                  if isinstance(obj, dict):
                      task_id = extract_task_id(obj)

                      if task_id:
                          found.append({
                              "task_id": task_id,
                              "bid_id": extract_bid_id(obj),
                              "title": extract_title(obj),
                          })

                      for value in obj.values():
                          walk(value)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item)

              walk(memory)

              unique = []
              seen = set()

              for item in found:
                  key = (
                      item.get("task_id"),
                      item.get("bid_id"),
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(item)

              return unique

          def flatten_strings(obj, path=""):
              values = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      child = f"{path}.{key}" if path else str(key)
                      values.extend(
                          flatten_strings(value, child)
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      child = f"{path}[{index}]"
                      values.extend(
                          flatten_strings(value, child)
                      )

              elif isinstance(obj, (str, int)):
                  values.append((path, str(obj)))

              return values

          def normalize(value):
              if value is None:
                  return ""

              value = str(value).strip().lower()

              if value.startswith("@"):
                  value = value[1:]

              return value

          def matches_identity(value, identity_values):
              normalized = normalize(value)

              if not normalized:
                  return False

              return any(
                  normalized == normalize(candidate)
                  for candidate in identity_values
                  if candidate is not None
              )

          def bid_matches_nox(bid, identity_values):
              if not isinstance(bid, dict):
                  return False, []

              matches = []

              identity_keys = {
                  "id",
                  "username",
                  "user_name",
                  "userName",
                  "handle",
                  "agent",
                  "agent_id",
                  "agentId",
                  "agent_name",
                  "agentName",
                  "agent_handle",
                  "agentHandle",
                  "bidder",
                  "bidder_id",
                  "bidderId",
                  "bidder_name",
                  "bidderName",
                  "author",
                  "owner",
                  "creator",
                  "user",
                  "profile",
                  "account",
                  "identity",
              }

              # Explicit recursive inspection.
              def inspect(obj, path=""):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          child = (
                              f"{path}.{key}"
                              if path
                              else str(key)
                          )

                          key_lower = str(key).lower()

                          if (
                              key in identity_keys
                              or any(
                                  marker in key_lower
                                  for marker in (
                                      "user",
                                      "agent",
                                      "bidder",
                                      "handle",
                                      "username",
                                  )
                              )
                          ):
                              if isinstance(value, str):
                                  if matches_identity(
                                      value,
                                      identity_values,
                                  ):
                                      matches.append(child)

                              elif isinstance(value, (int, float)):
                                  if matches_identity(
                                      str(value),
                                      identity_values,
                                  ):
                                      matches.append(child)

                          inspect(value, child)

                  elif isinstance(obj, list):
                      for index, value in enumerate(obj):
                          inspect(
                              value,
                              f"{path}[{index}]",
                          )

              inspect(bid)

              # Fallback over every scalar value.
              if not matches:
                  for path, value in flatten_strings(bid):
                      if matches_identity(
                          value,
                          identity_values,
                      ):
                          matches.append(path)

              return bool(matches), matches

          def find_own_bid(bids, identity_values, expected_bid_id=None):
              if not isinstance(bids, list):
                  return None, []

              if expected_bid_id:
                  for bid in bids:
                      if not isinstance(bid, dict):
                          continue

                      bid_id = extract_bid_id(bid)

                      if (
                          bid_id
                          and str(bid_id)
                          == str(expected_bid_id)
                      ):
                          return bid, ["exact_bid_id"]

              for bid in bids:
                  matched, paths = bid_matches_nox(
                      bid,
                      identity_values,
                  )

                  if matched:
                      return bid, paths

              return None, []

          def get_bids(task_id, headers):
              response = safe_get(
                  f"{BASE_URL}/marketplace/{task_id}/bids",
                  headers=headers,
              )

              if response is None:
                  return None, None

              if response.status_code != 200:
                  return response, []

              try:
                  data = response.json()
              except Exception:
                  return response, []

              if isinstance(data, dict):
                  bids = (
                      data.get("items")
                      or data.get("bids")
                      or data.get("data")
                      or []
                  )
              elif isinstance(data, list):
                  bids = data
              else:
                  bids = []

              if not isinstance(bids, list):
                  bids = []

              return response, bids

          print("[1] Authenticating...")

          auth_response = SESSION.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(
              f"POST /auth/token -> "
              f"{auth_response.status_code}"
          )

          if auth_response.status_code != 200:
              print(auth_response.text[:1000])
              raise SystemExit("Authentication failed.")

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit(
                  "No authentication token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          print("Authentication successful.")
          print()

          print("[2] Checking identity...")

          me_response = safe_get(
              f"{BASE_URL}/users/me",
              headers=headers,
          )

          print(
              f"GET /users/me -> "
              f"{me_response.status_code}"
          )

          if me_response is None or me_response.status_code != 200:
              if me_response is not None:
                  print(me_response.text[:1000])
              raise SystemExit("Identity check failed.")

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("agent_handle")
              or me.get("name")
          )

          user_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("userId")
          )

          print(
              f"Authenticated agent: "
              f"@{username or 'unknown'}"
          )
          print(
              f"User ID: "
              f"{user_id or 'unknown'}"
          )
          print(
              f"Karma: "
              f"{me.get('karma', 'unknown')}"
          )
          print()

          identity_values = [
              username,
              me.get("username"),
              me.get("handle"),
              me.get("agent_handle"),
              me.get("agentHandle"),
              user_id,
              me.get("agent_id"),
              me.get("agentId"),
              "nox_origine",
              "@nox_origine",
          ]

          print("[3] Loading NØX memory...")

          root_memory = load_json_file(
              ROOT_MEMORY_FILE
          )

          act15_memory = load_json_file(
              ACT15_MEMORY_FILE
          )

          print()

          print("[4] Recovering ACT15 marketplace candidates...")

          if os.path.exists(ACT15_MEMORY_FILE):
              print(
                  f"ACT15 memory found: "
                  f"{ACT15_MEMORY_FILE}"
              )
          else:
              print("ACT15 memory not found.")

          candidates = collect_act15_candidates(
              act15_memory
          )

          print(
              f"ACT15 candidate task IDs recovered: "
              f"{len(candidates)}"
          )

          if not candidates:
              print(
                  "No ACT15 marketplace candidates "
                  "were recovered."
              )

              observation = {
                  "timestamp": now_iso(),
                  "action": "marketplace_observation",
                  "source": "ACT16_V5",
                  "result": "NO_BID_TO_MONITOR",
                  "task_id": None,
                  "bid_id": None,
                  "task_status": None,
                  "bid_status": "NO_BID_TO_MONITOR",
                  "payment_checked": False,
                  "payment_action": "none",
                  "gemini_used": False,
                  "project_cost_eur": 0,
              }

              root_memory.setdefault(
                  "marketplace_observations",
                  [],
              ).append(observation)

              with open(
                  ROOT_MEMORY_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      root_memory,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              raise SystemExit(0)

          print()
          print(
              "[5] Verifying ACT15 candidates "
              "against Marketplace bids..."
          )

          own_bid = None
          own_task = None
          own_match_paths = []
          total_checked = 0

          # Do NOT assume the last ACT15 candidate was submitted.
          # Verify candidates directly against Marketplace.
          for candidate in reversed(candidates):
              task_id = candidate["task_id"]
              expected_bid_id = candidate.get("bid_id")
              title = candidate.get("title") or "Unknown task"

              total_checked += 1

              print(
                  f"Checking candidate "
                  f"{total_checked}/{len(candidates)}: "
                  f"{task_id}"
              )

              response, bids = get_bids(
                  task_id,
                  headers,
              )

              if response is None:
                  print("  Bids request failed.")
                  continue

              print(
                  f"  GET /marketplace/{task_id}/bids "
                  f"-> {response.status_code}"
              )

              if response.status_code != 200:
                  print("  Candidate skipped.")
                  continue

              print(
                  f"  Bids returned: {len(bids)}"
              )

              found_bid, match_paths = find_own_bid(
                  bids,
                  identity_values,
                  expected_bid_id,
              )

              if found_bid:
                  own_bid = found_bid
                  own_task = candidate
                  own_match_paths = match_paths

                  print(
                      "  NØX BID FOUND ON THIS TASK."
                  )
                  break

              print(
                  "  No NØX bid on this task."
              )

          if own_task is None:
              print()
              print(
                  "No ACT15 candidate could be verified "
                  "as a submitted NØX bid."
              )

              detected_result = "BID_NOT_VERIFIED"

              observation = {
                  "timestamp": now_iso(),
                  "action": "marketplace_observation",
                  "source": "ACT16_V5",
                  "result": detected_result,
                  "task_id": None,
                  "bid_id": None,
                  "task_status": None,
                  "bid_status": "BID_NOT_VERIFIED",
                  "candidates_checked": total_checked,
                  "candidate_count": len(candidates),
                  "payment_checked": False,
                  "payment_action": "none",
                  "gemini_used": False,
                  "project_cost_eur": 0,
              }

              root_memory.setdefault(
                  "marketplace_observations",
                  [],
              ).append(observation)

              if len(
                  root_memory["marketplace_observations"]
              ) > 500:
                  root_memory["marketplace_observations"] = (
                      root_memory[
                          "marketplace_observations"
                      ][-500:]
                  )

              root_memory[
                  "act16_last_marketplace_observation"
              ] = observation

              print()
              print("[10] Recording Marketplace observation...")

              with open(
                  ROOT_MEMORY_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      root_memory,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              print()
              print("[13] Saving memory...")
              print(
                  f"Memory saved: {ROOT_MEMORY_FILE}"
              )

              print()
              print("=" * 48)
              print("NØX ACT16 V5 RESULT")
              print("=" * 48)
              print(
                  "No submitted NØX bid could be verified "
                  "on the recovered ACT15 candidates."
              )
              print(
                  "No rejection or acceptance was assumed."
              )
              print()
              print("ACT16 COMPLETED.")

              raise SystemExit(0)

          task_id = own_task["task_id"]
          title = (
              own_task.get("title")
              or "Unknown task"
          )

          bid_id = extract_bid_id(own_bid)

          print()
          print("[6] Verified NØX Marketplace bid...")
          print(f"Task: {title}")
          print(f"Task ID: {task_id}")
          print(f"Bid ID: {bid_id}")
          print(
              "Identity match path(s): "
              + ", ".join(own_match_paths[:10])
          )

          bid_status_raw = None

          for key in (
              "status",
              "state",
              "bid_status",
              "bidStatus",
          ):
              if own_bid.get(key) is not None:
                  bid_status_raw = own_bid.get(key)
                  break

          normalized_status = str(
              bid_status_raw or ""
          ).strip().lower()

          if normalized_status in {
              "accepted",
              "approved",
              "won",
              "selected",
          }:
              bid_status = "ACCEPTED"

          elif normalized_status in {
              "rejected",
              "declined",
              "lost",
              "denied",
          }:
              bid_status = "REJECTED"

          elif normalized_status in {
              "pending",
              "submitted",
              "active",
              "bidding",
              "open",
              "under_review",
              "review",
          }:
              bid_status = "PENDING"

          elif normalized_status:
              bid_status = normalized_status.upper()

          else:
              bid_status = "UNKNOWN_BID_STATUS"

          print()
          print("[7] Refreshing Marketplace task status...")

          marketplace_response = safe_get(
              f"{BASE_URL}/marketplace/tasks?limit=30",
              headers=headers,
          )

          task_in_listing = None

          if marketplace_response is not None:
              print(
                  "GET /marketplace/tasks -> "
                  f"{marketplace_response.status_code}"
              )

              if marketplace_response.status_code == 200:
                  try:
                      marketplace_data = (
                          marketplace_response.json()
                      )

                      if isinstance(
                          marketplace_data,
                          dict,
                      ):
                          tasks = marketplace_data.get(
                              "items",
                              [],
                          )
                      elif isinstance(
                          marketplace_data,
                          list,
                      ):
                          tasks = marketplace_data
                      else:
                          tasks = []

                      for task in tasks:
                          if not isinstance(
                              task,
                              dict,
                          ):
                              continue

                          candidate_id = (
                              task.get("id")
                              or task.get("task_id")
                              or task.get("taskId")
                          )

                          if (
                              candidate_id
                              and str(candidate_id)
                              == str(task_id)
                          ):
                              task_in_listing = task
                              break

                  except Exception:
                      tasks = []

          if task_in_listing:
              task_status = (
                  task_in_listing.get("status")
                  or task_in_listing.get("state")
                  or task_in_listing.get("task_status")
              )
          else:
              task_status = None

          print(
              f"Task status: {task_status}"
          )

          print()
          print("[8] Determining Marketplace result...")

          if bid_status == "ACCEPTED":
              detected_result = "BID_ACCEPTED"
          elif bid_status == "REJECTED":
              detected_result = "BID_REJECTED"
          elif bid_status == "PENDING":
              detected_result = "BID_PENDING"
          else:
              detected_result = "BID_STATUS_UNKNOWN"

          print(
              f"Bid status: {bid_status}"
          )
          print(
              f"Detected result: {detected_result}"
          )

          print()
          print("[9] Payment check...")

          payment_checked = False

          if bid_status == "ACCEPTED":
              print(
                  "Bid accepted/selected."
              )
              print(
                  "Payment information will not trigger "
                  "any payment action."
              )
          else:
              print("Payment check not required.")

          print("No payment action will be performed.")

          print()
          print("[10] Recording Marketplace observation...")

          observation = {
              "timestamp": now_iso(),
              "action": "marketplace_observation",
              "source": "ACT16_V5",
              "result": detected_result,
              "task_id": task_id,
              "bid_id": bid_id,
              "task_title": title,
              "task_status": task_status,
              "bid_status": bid_status,
              "bid_status_raw": bid_status_raw,
              "identity_match_paths": own_match_paths[:10],
              "candidates_checked": total_checked,
              "candidate_count": len(candidates),
              "payment_checked": payment_checked,
              "payment_action": "none",
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          root_memory.setdefault(
              "marketplace_observations",
              [],
          ).append(observation)

          if len(
              root_memory["marketplace_observations"]
          ) > 500:
              root_memory["marketplace_observations"] = (
                  root_memory[
                      "marketplace_observations"
                  ][-500:]
              )

          root_memory[
              "act16_last_marketplace_observation"
          ] = observation

          print()
          print("[13] Saving memory...")

          with open(
              ROOT_MEMORY_FILE,
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  root_memory,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print(
              f"Memory saved: {ROOT_MEMORY_FILE}"
          )

          print()
          print("=" * 48)
          print("NØX ACT16 V5 RESULT")
          print("=" * 48)
          print(f"Task ID: {task_id}")
          print(f"Bid ID: {bid_id}")
          print(f"Task status: {task_status}")
          print(f"Bid status: {bid_status}")
          print(f"Detected result: {detected_result}")
          print(
              f"Candidates checked: "
              f"{total_checked}/{len(candidates)}"
          )
          print()

          if detected_result == "BID_ACCEPTED":
              print("NØX BID WAS ACCEPTED.")
              print(
                  "No payment action was performed."
              )
          elif detected_result == "BID_REJECTED":
              print("NØX BID WAS REJECTED.")
          elif detected_result == "BID_PENDING":
              print("NØX BID IS STILL PENDING.")
          else:
              print(
                  "NØX BID WAS FOUND, BUT ITS STATUS "
                  "COULD NOT BE FULLY CLASSIFIED."
              )

          print()
          print("ACT16 COMPLETED.")

          PY

      - name: Commit and push ACT16 memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No ACT16 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT16: marketplace observation"

          echo "Synchronizing local main with remote main..."

          for attempt in 1 2 3; do
            echo "Synchronization attempt ${attempt}..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT16 memory successfully pushed."
              exit 0
            fi

            echo "Push failed on attempt ${attempt}."

            if [ "${attempt}" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "Unable to push ACT16 memory after 3 attempts."
          exit 1
