name: NØX ACT 16 V6 - Marketplace Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act16-marketplace-monitor
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai
  ROOT_MEMORY_FILE: nox_memory.json
  ACT15_MEMORY_FILE: memory/nox_act_15_marketplace.json

jobs:
  nox-act16:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run ACT16 Marketplace Monitor
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          ROOT_MEMORY_FILE = os.environ["ROOT_MEMORY_FILE"]
          ACT15_MEMORY_FILE = os.environ["ACT15_MEMORY_FILE"]

          SESSION = requests.Session()
          SESSION.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT16-Marketplace-Monitor/6.0",
          })

          MAX_CANDIDATES = 100
          MAX_PAYMENT_CHECKS = 30

          print("=" * 56)
          print("NØX ACT16 V6 - MARKETPLACE MONITOR")
          print("=" * 56)
          print()
          print("Schedule: every 30 minutes")
          print("Payments: DISABLED")
          print("Spending: DISABLED")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Cost: €0")
          print()

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_json_file(path):
              if not os.path.exists(path):
                  return {}

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Could not load {path}: {exc}")
                  return {}

          def save_json_file(path, data):
              tmp = path + ".tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              os.replace(tmp, path)

          def safe_get(url, headers=None, timeout=30):
              try:
                  return SESSION.get(
                      url,
                      headers=headers or {},
                      timeout=timeout,
                  )
              except Exception as exc:
                  print(f"GET exception: {exc}")
                  return None

          def extract_task_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "marketplace_task_id",
                  "marketplaceTaskId",
                  "id",
              ):
                  value = obj.get(key)

                  if value:
                      return str(value)

              task = obj.get("task")

              if isinstance(task, dict):
                  for key in (
                      "id",
                      "task_id",
                      "taskId",
                  ):
                      value = task.get(key)

                      if value:
                          return str(value)

              return None

          def extract_bid_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "bid_id",
                  "bidId",
                  "id",
              ):
                  value = obj.get(key)

                  if value:
                      return str(value)

              bid = obj.get("bid")

              if isinstance(bid, dict):
                  for key in (
                      "id",
                      "bid_id",
                      "bidId",
                  ):
                      value = bid.get(key)

                      if value:
                          return str(value)

              return None

          def extract_title(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "title",
                  "task_title",
                  "taskTitle",
                  "name",
              ):
                  value = obj.get(key)

                  if value:
                      return str(value)

              task = obj.get("task")

              if isinstance(task, dict):
                  for key in (
                      "title",
                      "name",
                  ):
                      value = task.get(key)

                      if value:
                          return str(value)

              return None

          def collect_act15_candidates(memory):
              found = []

              def walk(obj):
                  if isinstance(obj, dict):
                      task_id = extract_task_id(obj)

                      if task_id:
                          found.append({
                              "task_id": task_id,
                              "bid_id": extract_bid_id(obj),
                              "title": extract_title(obj),
                          })

                      for value in obj.values():
                          walk(value)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item)

              walk(memory)

              unique = []
              seen = set()

              for item in found:
                  key = (
                      item.get("task_id"),
                      item.get("bid_id"),
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(item)

              return unique[-MAX_CANDIDATES:]

          def flatten_strings(obj, path=""):
              values = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      child = (
                          f"{path}.{key}"
                          if path
                          else str(key)
                      )

                      values.extend(
                          flatten_strings(value, child)
                      )

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      child = f"{path}[{index}]"

                      values.extend(
                          flatten_strings(value, child)
                      )

              elif isinstance(obj, (str, int, float)):
                  values.append((path, str(obj)))

              return values

          def normalize(value):
              if value is None:
                  return ""

              value = str(value).strip().lower()

              if value.startswith("@"):
                  value = value[1:]

              return value

          def matches_identity(value, identity_values):
              normalized = normalize(value)

              if not normalized:
                  return False

              return any(
                  normalized == normalize(candidate)
                  for candidate in identity_values
                  if candidate is not None
              )

          def bid_matches_nox(bid, identity_values):
              if not isinstance(bid, dict):
                  return False, []

              matches = []

              def inspect(obj, path=""):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          child = (
                              f"{path}.{key}"
                              if path
                              else str(key)
                          )

                          key_lower = str(key).lower()

                          identity_key = (
                              key_lower in {
                                  "id",
                                  "username",
                                  "user_name",
                                  "handle",
                                  "agent",
                                  "agent_id",
                                  "agentid",
                                  "agent_name",
                                  "agentname",
                                  "agent_handle",
                                  "agenthandle",
                                  "bidder",
                                  "bidder_id",
                                  "bidderid",
                                  "bidder_name",
                                  "biddername",
                                  "author",
                                  "owner",
                                  "creator",
                                  "user",
                                  "profile",
                                  "account",
                                  "identity",
                              }
                              or any(
                                  marker in key_lower
                                  for marker in (
                                      "user",
                                      "agent",
                                      "bidder",
                                      "handle",
                                      "username",
                                  )
                              )
                          )

                          if identity_key:
                              if isinstance(
                                  value,
                                  (str, int, float),
                              ):
                                  if matches_identity(
                                      value,
                                      identity_values,
                                  ):
                                      matches.append(child)

                          inspect(value, child)

                  elif isinstance(obj, list):
                      for index, value in enumerate(obj):
                          inspect(
                              value,
                              f"{path}[{index}]",
                          )

              inspect(bid)

              if not matches:
                  for path, value in flatten_strings(bid):
                      if matches_identity(
                          value,
                          identity_values,
                      ):
                          matches.append(path)

              return bool(matches), matches

          def find_own_bid(
              bids,
              identity_values,
              expected_bid_id=None,
          ):
              if not isinstance(bids, list):
                  return None, []

              if expected_bid_id:
                  for bid in bids:
                      if not isinstance(bid, dict):
                          continue

                      bid_id = extract_bid_id(bid)

                      if (
                          bid_id
                          and str(bid_id)
                          == str(expected_bid_id)
                      ):
                          return bid, ["exact_bid_id"]

              for bid in bids:
                  matched, paths = bid_matches_nox(
                      bid,
                      identity_values,
                  )

                  if matched:
                      return bid, paths

              return None, []

          def get_bids(task_id, headers):
              response = safe_get(
                  f"{BASE_URL}/marketplace/{task_id}/bids",
                  headers=headers,
              )

              if response is None:
                  return None, None

              if response.status_code != 200:
                  return response, []

              try:
                  data = response.json()
              except Exception:
                  return response, []

              if isinstance(data, dict):
                  bids = (
                      data.get("items")
                      or data.get("bids")
                      or data.get("data")
                      or []
                  )

              elif isinstance(data, list):
                  bids = data

              else:
                  bids = []

              if not isinstance(bids, list):
                  bids = []

              return response, bids

          def normalize_bid_status(bid):
              if not isinstance(bid, dict):
                  return "UNKNOWN_BID_STATUS", None

              raw = None

              for key in (
                  "status",
                  "state",
                  "bid_status",
                  "bidStatus",
              ):
                  if bid.get(key) is not None:
                      raw = bid.get(key)
                      break

              normalized = str(
                  raw or ""
              ).strip().lower()

              if normalized in {
                  "accepted",
                  "approved",
                  "won",
                  "selected",
              }:
                  return "ACCEPTED", raw

              if normalized in {
                  "rejected",
                  "declined",
                  "lost",
                  "denied",
              }:
                  return "REJECTED", raw

              if normalized in {
                  "pending",
                  "submitted",
                  "active",
                  "bidding",
                  "open",
                  "under_review",
                  "review",
              }:
                  return "PENDING", raw

              if normalized:
                  return normalized.upper(), raw

              return "UNKNOWN_BID_STATUS", raw

          def get_payment(task_id, headers):
              response = safe_get(
                  f"{BASE_URL}/marketplace/{task_id}/payment",
                  headers=headers,
              )

              if response is None:
                  return None, None

              if response.status_code != 200:
                  return response, None

              try:
                  data = response.json()
              except Exception:
                  return response, None

              return response, data

          def extract_payment_status(data):
              if not isinstance(data, dict):
                  return None

              for key in (
                  "status",
                  "payment_status",
                  "paymentStatus",
                  "state",
              ):
                  value = data.get(key)

                  if value not in (None, ""):
                      return str(value)

              payment = data.get("payment")

              if isinstance(payment, dict):
                  for key in (
                      "status",
                      "payment_status",
                      "paymentStatus",
                      "state",
                  ):
                      value = payment.get(key)

                      if value not in (None, ""):
                          return str(value)

              return None

          def extract_bid_amount(bid):
              if not isinstance(bid, dict):
                  return None

              for key in (
                  "bid_amount_sats",
                  "bidAmountSats",
                  "amount_sats",
                  "amountSats",
              ):
                  value = bid.get(key)

                  if value not in (None, ""):
                      return value

              return None

          print("[1] Authenticating...")

          auth_response = SESSION.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(
              f"POST /auth/token -> "
              f"{auth_response.status_code}"
          )

          if auth_response.status_code != 200:
              print(auth_response.text[:1000])
              raise SystemExit("Authentication failed.")

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit(
                  "No authentication token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          print("Authentication successful.")
          print()

          print("[2] Checking identity...")

          me_response = safe_get(
              f"{BASE_URL}/users/me",
              headers=headers,
          )

          if (
              me_response is None
              or me_response.status_code != 200
          ):
              if me_response is not None:
                  print(me_response.text[:1000])

              raise SystemExit(
                  "Identity check failed."
              )

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("agent_handle")
              or me.get("name")
          )

          user_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("userId")
          )

          print(
              f"Authenticated agent: "
              f"@{username or 'unknown'}"
          )

          print(
              f"User ID: "
              f"{user_id or 'unknown'}"
          )

          print(
              f"Karma: "
              f"{me.get('karma', 'unknown')}"
          )

          identity_values = [
              username,
              me.get("username"),
              me.get("handle"),
              me.get("agent_handle"),
              me.get("agentHandle"),
              user_id,
              me.get("agent_id"),
              me.get("agentId"),
              "nox_origine",
              "@nox_origine",
          ]

          print()
          print("[3] Loading NØX memory...")

          root_memory = load_json_file(
              ROOT_MEMORY_FILE
          )

          act15_memory = load_json_file(
              ACT15_MEMORY_FILE
          )

          print()
          print(
              "[4] Recovering ACT15 marketplace candidates..."
          )

          candidates = collect_act15_candidates(
              act15_memory
          )

          print(
              f"ACT15 candidate task IDs recovered: "
              f"{len(candidates)}"
          )

          if not candidates:
              observation = {
                  "timestamp": now_iso(),
                  "action": "marketplace_observation",
                  "source": "ACT16_V6",
                  "result": "NO_CANDIDATES",
                  "candidates_checked": 0,
                  "nox_bids_verified": 0,
                  "accepted": 0,
                  "pending": 0,
                  "rejected": 0,
                  "payment_checks": 0,
                  "paid": 0,
                  "payment_action": "none",
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0,
              }

              root_memory.setdefault(
                  "marketplace_observations",
                  [],
              ).append(observation)

              root_memory[
                  "act16_last_marketplace_observation"
              ] = observation

              save_json_file(
                  ROOT_MEMORY_FILE,
                  root_memory,
              )

              print()
              print("No ACT15 candidates found.")
              print("ACT16 COMPLETED.")
              raise SystemExit(0)

          print()
          print(
              "[5] Verifying ALL ACT15 candidates "
              "against Marketplace bids..."
          )

          verified = []
          verified_keys = set()
          checked = 0
          request_errors = 0

          for candidate in reversed(candidates):
              task_id = candidate["task_id"]
              expected_bid_id = candidate.get("bid_id")
              title = (
                  candidate.get("title")
                  or "Unknown task"
              )

              checked += 1

              print(
                  f"Checking candidate "
                  f"{checked}/{len(candidates)}: "
                  f"{task_id}"
              )

              response, bids = get_bids(
                  task_id,
                  headers,
              )

              if response is None:
                  print("  Bids request failed.")
                  request_errors += 1
                  continue

              print(
                  f"  GET /marketplace/{task_id}/bids "
                  f"-> {response.status_code}"
              )

              if response.status_code != 200:
                  request_errors += 1
                  print("  Candidate skipped.")
                  continue

              print(
                  f"  Bids returned: {len(bids)}"
              )

              own_bid, match_paths = find_own_bid(
                  bids,
                  identity_values,
                  expected_bid_id,
              )

              if not own_bid:
                  print("  No NØX bid on this task.")
                  continue

              bid_id = extract_bid_id(own_bid)

              unique_key = (
                  str(task_id),
                  str(bid_id),
              )

              if unique_key in verified_keys:
                  continue

              verified_keys.add(unique_key)

              bid_status, bid_status_raw = (
                  normalize_bid_status(own_bid)
              )

              bid_amount = extract_bid_amount(
                  own_bid
              )

              record = {
                  "timestamp_utc": now_iso(),
                  "task_id": task_id,
                  "bid_id": bid_id,
                  "task_title": title,
                  "bid_amount_sats": bid_amount,
                  "bid_status": bid_status,
                  "bid_status_raw": bid_status_raw,
                  "identity_match_paths": match_paths[:10],
                  "task_status": None,
                  "payment_checked": False,
                  "payment_status": None,
                  "payment_raw": None,
              }

              verified.append(record)

              print(
                  f"  NØX BID FOUND: "
                  f"{bid_id}"
              )

              print(
                  f"  Bid status: "
                  f"{bid_status}"
              )

              if bid_amount is not None:
                  print(
                      f"  Bid amount: "
                      f"{bid_amount} sats"
                  )

          print()
          print(
              f"NØX BIDS VERIFIED: {len(verified)}"
          )

          print()
          print(
              "[6] Refreshing Marketplace task statuses..."
          )

          marketplace_response = safe_get(
              f"{BASE_URL}/marketplace/tasks?limit=100",
              headers=headers,
          )

          marketplace_tasks = []

          if marketplace_response is not None:
              print(
                  "GET /marketplace/tasks -> "
                  f"{marketplace_response.status_code}"
              )

              if marketplace_response.status_code == 200:
                  try:
                      marketplace_data = (
                          marketplace_response.json()
                      )

                      if isinstance(
                          marketplace_data,
                          dict,
                      ):
                          marketplace_tasks = (
                              marketplace_data.get("items")
                              or marketplace_data.get("tasks")
                              or marketplace_data.get("data")
                              or []
                          )

                      elif isinstance(
                          marketplace_data,
                          list,
                      ):
                          marketplace_tasks = marketplace_data

                  except Exception as exc:
                      print(
                          f"Marketplace parse error: {exc}"
                      )

          task_status_map = {}

          for task in marketplace_tasks:
              if not isinstance(task, dict):
                  continue

              task_id = extract_task_id(task)

              if task_id:
                  task_status_map[str(task_id)] = (
                      task.get("status")
                      or task.get("state")
                      or task.get("task_status")
                  )

          for record in verified:
              record["task_status"] = task_status_map.get(
                  str(record["task_id"])
              )

          accepted_records = [
              record
              for record in verified
              if record["bid_status"] == "ACCEPTED"
          ]

          pending_records = [
              record
              for record in verified
              if record["bid_status"] == "PENDING"
          ]

          rejected_records = [
              record
              for record in verified
              if record["bid_status"] == "REJECTED"
          ]

          print()
          print(
              f"ACCEPTED: {len(accepted_records)}"
          )
          print(
              f"PENDING: {len(pending_records)}"
          )
          print(
              f"REJECTED: {len(rejected_records)}"
          )

          print()
          print(
              "[7] Checking payment status "
              "for accepted bids..."
          )

          payment_checks = 0
          paid_records = []

          for record in accepted_records:
              if payment_checks >= MAX_PAYMENT_CHECKS:
                  print(
                      "Payment check limit reached."
                  )
                  break

              task_id = record["task_id"]

              print(
                  f"Checking payment "
                  f"{payment_checks + 1}/"
                  f"{min(len(accepted_records), MAX_PAYMENT_CHECKS)}: "
                  f"{task_id}"
              )

              payment_response, payment_data = (
                  get_payment(
                      task_id,
                      headers,
                  )
              )

              record["payment_checked"] = True
              payment_checks += 1

              if payment_response is None:
                  record["payment_status"] = (
                      "REQUEST_FAILED"
                  )
                  continue

              print(
                  f"  GET /marketplace/{task_id}/payment "
                  f"-> {payment_response.status_code}"
              )

              if payment_response.status_code == 200:
                  record["payment_status"] = (
                      extract_payment_status(
                          payment_data
                      )
                      or "UNKNOWN_PAYMENT_STATUS"
                  )

                  record["payment_raw"] = (
                      payment_data
                  )

                  normalized_payment = str(
                      record["payment_status"]
                  ).strip().lower()

                  if normalized_payment in {
                      "paid",
                      "completed",
                      "settled",
                  }:
                      paid_records.append(record)

              else:
                  record["payment_status"] = (
                      f"HTTP_{payment_response.status_code}"
                  )

          print()
          print(
              f"PAYMENT CHECKS: {payment_checks}"
          )
          print(
              f"PAID: {len(paid_records)}"
          )

          print()
          print("=" * 56)
          print("NØX ACT16 V6 RESULT")
          print("=" * 56)

          print(
              f"Candidates checked: "
              f"{checked}/{len(candidates)}"
          )

          print(
              f"NØX bids verified: "
              f"{len(verified)}"
          )

          print(
              f"Accepted: "
              f"{len(accepted_records)}"
          )

          print(
              f"Pending: "
              f"{len(pending_records)}"
          )

          print(
              f"Rejected: "
              f"{len(rejected_records)}"
          )

          print(
              f"Payment checks: "
              f"{payment_checks}"
          )

          print(
              f"Paid: "
              f"{len(paid_records)}"
          )

          print()

          if accepted_records:
              print("ACCEPTED NØX BIDS:")

              for index, record in enumerate(
                  accepted_records,
                  start=1,
              ):
                  print()
                  print(
                      f"[ACCEPTED #{index}] "
                      f"{record['task_title']}"
                  )
                  print(
                      f"  Task ID: "
                      f"{record['task_id']}"
                  )
                  print(
                      f"  Bid ID: "
                      f"{record['bid_id']}"
                  )
                  print(
                      f"  Bid amount: "
                      f"{record['bid_amount_sats']} sats"
                  )
                  print(
                      f"  Task status: "
                      f"{record['task_status']}"
                  )
                  print(
                      f"  Payment status: "
                      f"{record['payment_status']}"
                  )

          if pending_records:
              print()
              print("PENDING NØX BIDS:")

              for index, record in enumerate(
                  pending_records,
                  start=1,
              ):
                  print(
                      f"  {index}. "
                      f"{record['task_title']} "
                      f"| {record['bid_id']}"
                  )

          if rejected_records:
              print()
              print("REJECTED NØX BIDS:")

              for index, record in enumerate(
                  rejected_records,
                  start=1,
              ):
                  print(
                      f"  {index}. "
                      f"{record['task_title']} "
                      f"| {record['bid_id']}"
                  )

          print()
          print(
              "NO PAYMENT ACTION PERFORMED."
          )
          print(
              "Payments remain DISABLED."
          )
          print(
              "Spending remains DISABLED."
          )
          print(
              "Gemini remains DISABLED."
          )
          print(
              "External AI remains DISABLED."
          )
          print("Cost: €0")

          observation = {
              "timestamp": now_iso(),
              "action": "marketplace_monitor",
              "source": "ACT16_V6",
              "result": (
                  "BIDS_MONITORED"
                  if verified
                  else "NO_N0X_BIDS_VERIFIED"
              ),
              "candidates_checked": checked,
              "candidate_count": len(candidates),
              "nox_bids_verified": len(verified),
              "accepted": len(accepted_records),
              "pending": len(pending_records),
              "rejected": len(rejected_records),
              "payment_checks": payment_checks,
              "paid": len(paid_records),
              "request_errors": request_errors,
              "payment_action": "none",
              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,
              "bids": verified,
          }

          root_memory.setdefault(
              "marketplace_observations",
              [],
          ).append(observation)

          if len(
              root_memory["marketplace_observations"]
          ) > 500:
              root_memory[
                  "marketplace_observations"
              ] = root_memory[
                  "marketplace_observations"
              ][-500:]

          root_memory[
              "act16_last_marketplace_observation"
          ] = observation

          root_memory[
              "act16_marketplace_summary"
          ] = {
              "timestamp_utc": now_iso(),
              "nox_bids_verified": len(verified),
              "accepted": len(accepted_records),
              "pending": len(pending_records),
              "rejected": len(rejected_records),
              "payment_checks": payment_checks,
              "paid": len(paid_records),
              "payments_disabled": True,
              "spending_disabled": True,
              "cost_eur": 0,
          }

          print()
          print("[8] Saving memory...")

          save_json_file(
              ROOT_MEMORY_FILE,
              root_memory,
          )

          print(
              f"Memory saved: "
              f"{ROOT_MEMORY_FILE}"
          )

          print()
          print("=" * 56)
          print("ACT16 V6 COMPLETED")
          print("=" * 56)
          PY

      - name: Commit and push ACT16 memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No ACT16 memory changes."
            exit 0
          fi

          git commit -m "NØX ACT16: monitor all marketplace bids"

          for attempt in 1 2 3; do
            echo "Synchronization attempt ${attempt}..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT16 memory successfully pushed."
              exit 0
            fi

            echo "Push failed on attempt ${attempt}."

            if [ "${attempt}" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "Unable to push ACT16 memory after 3 attempts."
          exit 1
