name: NØX ACT 16 V7 - Marketplace Monitor

on:
workflow_dispatch:
schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

concurrency:
group: nox-act16-marketplace-monitor
cancel-in-progress: false

env:
COLONY_BASE_URL: https://thecolony.ai
ROOT_MEMORY_FILE: nox_memory.json
ACT15_MEMORY_FILE: memory/nox_act_15_marketplace.json

jobs:
marketplace-monitor:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install requests
    run: python -m pip install requests

  - name: Run ACT16 marketplace monitor
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
    run: |
      python - <<'PY'
      import json
      import os
      from datetime import datetime, timezone

      import requests


      BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
      API_KEY = os.environ["COLONY_API_KEY"]
      ROOT_MEMORY_FILE = os.environ["ROOT_MEMORY_FILE"]
      ACT15_MEMORY_FILE = os.environ["ACT15_MEMORY_FILE"]

      SESSION = requests.Session()
      SESSION.headers.update({
          "Accept": "application/json",
          "Content-Type": "application/json",
          "User-Agent": "Nox-Origin-ACT16/7.0",
      })


      def now_iso():
          return datetime.now(timezone.utc).isoformat()


      def load_json_file(path):
          if not os.path.exists(path):
              return {}

          try:
              with open(path, "r", encoding="utf-8") as handle:
                  return json.load(handle)
          except Exception as exc:
              print(f"MEMORY LOAD ERROR: {path}: {exc}")
              return {}


      def save_json_file(path, data):
          directory = os.path.dirname(path)

          if directory:
              os.makedirs(directory, exist_ok=True)

          temporary = f"{path}.tmp"

          with open(
              temporary,
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(
                  data,
                  handle,
                  ensure_ascii=False,
                  indent=2,
              )

          os.replace(temporary, path)


      def safe_get(url, headers=None, timeout=30):
          try:
              return SESSION.get(
                  url,
                  headers=headers or {},
                  timeout=timeout,
              )
          except Exception as exc:
              print(f"GET ERROR: {url}: {exc}")
              return None


      def extract_task_id(obj):
          if not isinstance(obj, dict):
              return None

          for key in (
              "task_id",
              "taskId",
              "id",
              "uuid",
          ):
              value = obj.get(key)

              if value:
                  return str(value)

          return None


      def extract_bid_id(obj):
          if not isinstance(obj, dict):
              return None

          for key in (
              "bid_id",
              "bidId",
              "id",
              "uuid",
          ):
              value = obj.get(key)

              if value:
                  return str(value)

          return None


      def extract_title(obj):
          if not isinstance(obj, dict):
              return None

          for key in (
              "title",
              "name",
              "subject",
              "headline",
          ):
              value = obj.get(key)

              if value:
                  return str(value)

          return None


      def collect_act15_candidates(memory):
          candidates = []

          def walk(obj):
              if isinstance(obj, dict):
                  task_id = extract_task_id(obj)

                  if task_id:
                      candidates.append({
                          "task_id": task_id,
                          "bid_id": extract_bid_id(obj),
                          "title": extract_title(obj),
                      })

                  for value in obj.values():
                      walk(value)

              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          walk(memory)

          unique = []
          seen = set()

          for candidate in candidates:
              key = (
                  candidate.get("task_id"),
                  candidate.get("bid_id"),
                  candidate.get("title"),
              )

              if key in seen:
                  continue

              seen.add(key)
              unique.append(candidate)

          return unique[-100:]


      def flatten_strings(obj):
          values = []

          if isinstance(obj, dict):
              for key, value in obj.items():
                  values.extend(flatten_strings(value))

          elif isinstance(obj, list):
              for value in obj:
                  values.extend(flatten_strings(value))

          elif isinstance(obj, (str, int, float)):
              values.append(str(obj))

          return values


      def normalize(value):
          if value is None:
              return ""

          return str(value).strip().lower()


      def matches_identity(value, identity_values):
          normalized = normalize(value)

          if not normalized:
              return False

          for identity in identity_values:
              if normalized == normalize(identity):
                  return True

          return False


      def bid_matches_nox(bid, identity_values):
          if not isinstance(bid, dict):
              return False, []

          matches = []

          identity_keys = {
              "id",
              "username",
              "user_name",
              "handle",
              "agent",
              "agent_id",
              "agentid",
              "agent_name",
              "agentname",
              "agent_handle",
              "agenthandle",
              "bidder",
              "bidder_id",
              "bidderid",
              "bidder_name",
              "biddername",
              "author",
              "owner",
              "creator",
              "user",
              "profile",
              "account",
              "identity",
          }

          def inspect(obj, path=""):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current_path = (
                          f"{path}.{key}"
                          if path
                          else str(key)
                      )

                      key_lower = str(key).lower()

                      if (
                          key_lower in identity_keys
                          or any(
                              marker in key_lower
                              for marker in (
                                  "username",
                                  "user_id",
                                  "userid",
                                  "agent_id",
                                  "agentid",
                                  "bidder",
                                  "handle",
                              )
                          )
                      ):
                          if isinstance(
                              value,
                              (str, int, float),
                          ):
                              if matches_identity(
                                  value,
                                  identity_values,
                              ):
                                  matches.append(current_path)

                      inspect(value, current_path)

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      inspect(
                          value,
                          f"{path}[{index}]",
                      )

          inspect(bid)

          if not matches:
              for value in flatten_strings(bid):
                  if matches_identity(
                      value,
                      identity_values,
                  ):
                      matches.append("deep_value_match")

          return bool(matches), matches


      def find_own_bid(
          bids,
          identity_values,
          expected_bid_id=None,
      ):
          if not isinstance(bids, list):
              return None, []

          if expected_bid_id:
              for bid in bids:
                  bid_id = extract_bid_id(bid)

                  if (
                      bid_id
                      and str(bid_id)
                      == str(expected_bid_id)
                  ):
                      return bid, ["exact_bid_id"]

          for bid in bids:
              matched, paths = bid_matches_nox(
                  bid,
                  identity_values,
              )

              if matched:
                  return bid, paths

          return None, []


      def get_bids(task_id, headers):
          response = safe_get(
              f"{BASE_URL}/api/v1/marketplace/{task_id}/bids",
              headers=headers,
          )

          if response is None:
              return None, []

          if response.status_code != 200:
              print(
                  f"BIDS HTTP {response.status_code}: "
                  f"{response.text[:500]}"
              )
              return response, []

          try:
              data = response.json()
          except Exception:
              return response, []

          if isinstance(data, dict):
              bids = (
                  data.get("bids")
                  or data.get("items")
                  or data.get("data")
                  or []
              )
          elif isinstance(data, list):
              bids = data
          else:
              bids = []

          return response, bids


      def normalize_bid_status(bid):
          if not isinstance(bid, dict):
              return "UNKNOWN", None

          raw = (
              bid.get("status")
              or bid.get("state")
              or bid.get("bid_status")
              or bid.get("bidStatus")
          )

          normalized = normalize(raw)

          if normalized in {
              "accepted",
              "approved",
              "won",
              "selected",
          }:
              return "ACCEPTED", raw

          if normalized in {
              "rejected",
              "declined",
              "lost",
              "denied",
          }:
              return "REJECTED", raw

          if normalized in {
              "pending",
              "submitted",
              "active",
              "open",
              "bidding",
              "under_review",
              "review",
          }:
              return "PENDING", raw

          return (
              normalized.upper()
              if normalized
              else "UNKNOWN",
              raw,
          )


      def get_payment(task_id, headers):
          response = safe_get(
              f"{BASE_URL}/api/v1/marketplace/{task_id}/payment",
              headers=headers,
          )

          if response is None:
              return None, None

          if response.status_code != 200:
              print(
                  f"PAYMENT HTTP {response.status_code}: "
                  f"{response.text[:500]}"
              )
              return response, None

          try:
              return response, response.json()
          except Exception:
              return response, None


      def extract_payment_status(data):
          if not isinstance(data, dict):
              return None

          for key in (
              "status",
              "payment_status",
              "paymentStatus",
              "state",
          ):
              value = data.get(key)

              if value not in (None, ""):
                  return str(value)

          payment = data.get("payment")

          if isinstance(payment, dict):
              for key in (
                  "status",
                  "payment_status",
                  "paymentStatus",
                  "state",
              ):
                  value = payment.get(key)

                  if value not in (None, ""):
                      return str(value)

          return None


      def extract_bid_amount(bid):
          if not isinstance(bid, dict):
              return None

          for key in (
              "amount_sats",
              "amountSats",
              "bid_amount_sats",
              "bidAmountSats",
              "amount",
              "bid_amount",
              "bidAmount",
          ):
              value = bid.get(key)

              if value not in (None, ""):
                  return value

          return None


      print("=== NØX ACT16 V7 - Marketplace Monitor ===")
      print("Gemini: False")
      print("Payments: False")
      print("Spending: False")
      print("External AI: False")
      print("Cost: €0")
      print()

      print("AUTH: starting")

      auth_response = SESSION.post(
          f"{BASE_URL}/api/v1/auth/token",
          json={
              "api_key": API_KEY,
          },
          timeout=30,
      )

      print(
          f"AUTH STATUS: {auth_response.status_code}"
      )

      if auth_response.status_code != 200:
          print(auth_response.text[:1000])
          raise SystemExit(
              "Authentication failed."
          )

      auth_data = auth_response.json()

      token = (
          auth_data.get("access_token")
          or auth_data.get("token")
          or auth_data.get("jwt")
      )

      if not token:
          raise SystemExit(
              "Authentication token missing."
          )

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json",
          "Content-Type": "application/json",
      }

      print("AUTH: OK")
      print()

      me_response = safe_get(
          f"{BASE_URL}/api/v1/users/me",
          headers=headers,
      )

      if (
          me_response is None
          or me_response.status_code != 200
      ):
          if me_response is not None:
              print(me_response.text[:1000])

          raise SystemExit(
              "Identity request failed."
          )

      me = me_response.json()

      username = (
          me.get("username")
          or me.get("handle")
          or "nox_origine"
      )

      user_id = (
          me.get("id")
          or me.get("user_id")
          or me.get("userId")
      )

      print(
          f"IDENTITY: {json.dumps(me, ensure_ascii=False)}"
      )
      print()

      identity_values = [
          username,
          user_id,
          me.get("username"),
          me.get("handle"),
          me.get("agent_id"),
          me.get("agentId"),
          "nox_origine",
          "@nox_origine",
      ]

      act15_memory = load_json_file(
          ACT15_MEMORY_FILE
      )

      root_memory = load_json_file(
          ROOT_MEMORY_FILE
      )

      candidates = collect_act15_candidates(
          act15_memory
      )

      print(
          f"ACT15 CANDIDATES RECOVERED: "
          f"{len(candidates)}"
      )

      if not candidates:
          print("No ACT15 candidates.")
          raise SystemExit(0)

      print()
      print(
          "=== VERIFYING NØX BIDS ON ALL CANDIDATES ==="
      )

      verified = []
      checked = 0
      request_errors = 0

      for candidate in candidates:
          task_id = candidate["task_id"]
          expected_bid_id = candidate.get("bid_id")
          title = (
              candidate.get("title")
              or "Unknown task"
          )

          checked += 1

          print()
          print(
              f"[{checked}/{len(candidates)}] "
              f"{title}"
          )
          print(
              f"TASK ID: {task_id}"
          )

          response, bids = get_bids(
              task_id,
              headers,
          )

          if response is None:
              request_errors += 1
              print("BIDS: request failed")
              continue

          print(
              f"BIDS HTTP: {response.status_code}"
          )

          if response.status_code != 200:
              request_errors += 1
              continue

          own_bid, match_paths = find_own_bid(
              bids,
              identity_values,
              expected_bid_id,
          )

          if not own_bid:
              print("NØX BID: not found")
              continue

          bid_id = extract_bid_id(own_bid)

          bid_status, bid_status_raw = (
              normalize_bid_status(own_bid)
          )

          record = {
              "timestamp_utc": now_iso(),
              "task_id": task_id,
              "bid_id": bid_id,
              "task_title": title,
              "bid_amount_sats": extract_bid_amount(
                  own_bid
              ),
              "bid_status": bid_status,
              "bid_status_raw": bid_status_raw,
              "identity_match": match_paths,
              "task_status": None,
              "payment_checked": False,
              "payment_status": None,
          }

          verified.append(record)

          print(
              f"NØX BID FOUND: {bid_id}"
          )
          print(
              f"BID STATUS: {bid_status}"
          )
          print(
              f"BID AMOUNT: "
              f"{record['bid_amount_sats']}"
          )

      print()
      print(
          f"NØX BIDS VERIFIED: {len(verified)}"
      )

      accepted = [
          record
          for record in verified
          if record["bid_status"] == "ACCEPTED"
      ]

      pending = [
          record
          for record in verified
          if record["bid_status"] == "PENDING"
      ]

      rejected = [
          record
          for record in verified
          if record["bid_status"] == "REJECTED"
      ]

      print(
          f"ACCEPTED: {len(accepted)}"
      )
      print(
          f"PENDING: {len(pending)}"
      )
      print(
          f"REJECTED: {len(rejected)}"
      )

      print()
      print(
          "=== CHECKING PAYMENT STATUS ==="
      )

      payment_checks = 0
      paid = []

      for record in accepted[:30]:
          task_id = record["task_id"]

          payment_response, payment_data = (
              get_payment(
                  task_id,
                  headers,
              )
          )

          record["payment_checked"] = True
          payment_checks += 1

          if payment_response is None:
              record["payment_status"] = (
                  "REQUEST_FAILED"
              )
              continue

          if payment_response.status_code == 200:
              status = extract_payment_status(
                  payment_data
              )

              record["payment_status"] = (
                  status
                  or "UNKNOWN"
              )

              if normalize(status) in {
                  "paid",
                  "completed",
                  "settled",
              }:
                  paid.append(record)
          else:
              record["payment_status"] = (
                  f"HTTP_{payment_response.status_code}"
              )

      print(
          f"PAYMENT CHECKS: {payment_checks}"
      )
      print(
          f"PAID: {len(paid)}"
      )

      observation = {
          "timestamp_utc": now_iso(),
          "act": "ACT16",
          "version": "V7",
          "action": "marketplace_monitor",
          "candidates_recovered": len(candidates),
          "candidates_checked": checked,
          "nox_bids_verified": len(verified),
          "accepted": len(accepted),
          "pending": len(pending),
          "rejected": len(rejected),
          "payment_checks": payment_checks,
          "paid": len(paid),
          "request_errors": request_errors,
          "payments_enabled": False,
          "spending_enabled": False,
          "gemini": False,
          "external_ai": False,
          "cost_eur": 0,
          "bids": verified,
      }

      root_memory.setdefault(
          "act16_marketplace_observations",
          [],
      ).append(observation)

      root_memory[
          "act16_marketplace_observations"
      ] = root_memory[
          "act16_marketplace_observations"
      ][-500:]

      root_memory[
          "act16_last_marketplace_observation"
      ] = observation

      root_memory[
          "act16_marketplace_summary"
      ] = {
          "timestamp_utc": now_iso(),
          "nox_bids_verified": len(verified),
          "accepted": len(accepted),
          "pending": len(pending),
          "rejected": len(rejected),
          "payment_checks": payment_checks,
          "paid": len(paid),
          "request_errors": request_errors,
      }

      save_json_file(
          ROOT_MEMORY_FILE,
          root_memory,
      )

      print()
      print("=== ACT16 SUMMARY ===")
      print(
          json.dumps(
              {
                  "candidates": len(candidates),
                  "checked": checked,
                  "nox_bids_verified": len(verified),
                  "accepted": len(accepted),
                  "pending": len(pending),
                  "rejected": len(rejected),
                  "payment_checks": payment_checks,
                  "paid": len(paid),
                  "request_errors": request_errors,
              },
              indent=2,
              ensure_ascii=False,
          )
      )

      print()
      print(
          "ACT16_RESULT: SUCCESS"
      )
      PY

  - name: Commit ACT16 memory
    run: |
      git config user.name "NØX Origin"
      git config user.email "nox-origin@users.noreply.github.com"

      git add nox_memory.json

      if git diff --cached --quiet; then
        echo "No ACT16 memory changes."
        exit 0
      fi

      git commit -m "NØX ACT16: monitor all marketplace bids"

      git fetch origin main
      git rebase origin/main
      git push origin HEAD:main
