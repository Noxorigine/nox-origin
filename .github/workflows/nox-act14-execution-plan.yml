name: NØX ACT 14 - Controlled Execution Plan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-act14:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX ACT 14
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 14 - CONTROLLED EXECUTION PLAN")
          print("================================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              try:
                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in keys:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def task_text(task):
              if not isinstance(task, dict):
                  return ""

              fields = [
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "requirements",
                  "category",
                  "kind",
                  "status"
              ]

              parts = []

              for field in fields:
                  value = task.get(field)

                  if value:
                      parts.append(
                          clean_text(value)
                      )

              return " ".join(parts)

          def get_task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "id",
                  "task_id",
                  "uuid"
              ]:
                  if task.get(key):
                      return task.get(key)

              return None

          def get_task_title(task):
              if not isinstance(task, dict):
                  return "Untitled task"

              return clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

          # =================================================
          # AUTHENTICATION
          # =================================================

          print("")
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=30
          )

          print(
              f"POST /auth/token -> "
              f"{auth.status_code}"
          )

          if not auth.ok:
              raise SystemExit(
                  f"Authentication failed: {auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(auth_data, dict)
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization":
                  f"Bearer {token}",

              "Content-Type":
                  "application/json"
          }

          print(
              "Authentication successful."
          )

          # =================================================
          # IDENTITY
          # =================================================

          print("")
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          me = safe_json(me_response)

          username = (
              me.get(
                  "username",
                  "unknown"
              )
              if isinstance(me, dict)
              else "unknown"
          )

          print(
              f"Authenticated agent: "
              f"@{username}"
          )

          # =================================================
          # MEMORY
          # =================================================

          print("")
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(
              MEMORY_FILE
          ):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  print(
                      f"Memory warning: {exc}"
                  )

          if not isinstance(
              memory,
              dict
          ):
              memory = {}

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # =================================================
          # RECOVER ACT 13 DECISION
          # =================================================

          print("")
          print(
              "[4] Recovering ACT 13 decision..."
          )

          autonomous_choice = memory.get(
              "autonomous_choice",
              {}
          )

          selected_task_id = (
              autonomous_choice.get(
                  "selected_task"
              )
          )

          selected_title = (
              autonomous_choice.get(
                  "selected_title"
              )
          )

          selected_score = (
              autonomous_choice.get(
                  "decision_score",
                  0
              )
          )

          print(
              f"ACT 13 selected task: "
              f"{selected_task_id}"
          )

          print(
              f"ACT 13 title: "
              f"{selected_title}"
          )

          print(
              f"ACT 13 score: "
              f"{selected_score}"
          )

          # =================================================
          # MARKETPLACE
          # =================================================

          print("")
          print(
              "[5] Refreshing Marketplace..."
          )

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          marketplace_data = (
              safe_json(
                  marketplace_response
              )
              if marketplace_response is not None
              else None
          )

          marketplace_tasks = extract_list(
              marketplace_data,
              [
                  "tasks",
                  "items",
                  "data",
                  "results"
              ]
          )

          print(
              "Marketplace tasks detected: "
              f"{len(marketplace_tasks)}"
          )

          # =================================================
          # FIND SELECTED TASK
          # =================================================

          selected_task = None

          if selected_task_id is not None:

              for task in marketplace_tasks:

                  if not isinstance(
                      task,
                      dict
                  ):
                      continue

                  if (
                      str(
                          get_task_id(task)
                      )
                      ==
                      str(
                          selected_task_id
                      )
                  ):
                      selected_task = task
                      break

          # Fallback only if ACT 13 did not preserve ID
          if selected_task is None and selected_title:

              for task in marketplace_tasks:

                  if (
                      get_task_title(task)
                      ==
                      selected_title
                  ):
                      selected_task = task
                      break

          # =================================================
          # VALIDATION
          # =================================================

          print("")
          print(
              "[6] Validating selected task..."
          )

          if selected_task is None:

              print(
                  "Selected ACT 13 task is "
                  "no longer available."
              )

              validation_status = (
                  "TASK_NOT_FOUND"
              )

          else:

              current_status = clean_text(
                  selected_task.get(
                      "status",
                      ""
                  )
              ).lower()

              print(
                  f"Task: "
                  f"{get_task_title(selected_task)}"
              )

              print(
                  f"Current status: "
                  f"{current_status}"
              )

              if current_status in [
                  "open",
                  "available",
                  "active",
                  "bidding"
              ]:

                  validation_status = "VALID"

              else:

                  validation_status = (
                      "NOT_AVAILABLE"
                  )

          # =================================================
          # BUILD EXECUTION REQUIREMENTS
          # =================================================

          execution_requirements = []

          task_lower = ""

          if selected_task:
              task_lower = task_text(
                  selected_task
              ).lower()

          requirement_rules = {
              "research": [
                  "research",
                  "investigate",
                  "research report",
                  "analysis"
              ],

              "web_retrieval": [
                  "web",
                  "website",
                  "source",
                  "sources",
                  "lookup"
              ],

              "api_work": [
                  "api",
                  "endpoint",
                  "rest",
                  "json"
              ],

              "python": [
                  "python",
                  "script",
                  "programming",
                  "code"
              ],

              "data_processing": [
                  "data",
                  "dataset",
                  "csv",
                  "excel",
                  "json"
              ],

              "writing": [
                  "write",
                  "writing",
                  "report",
                  "documentation",
                  "document"
              ],

              "verification": [
                  "verify",
                  "verification",
                  "qa",
                  "test",
                  "testing"
              ]
          }

          for requirement, keywords in (
              requirement_rules.items()
          ):

              if any(
                  keyword in task_lower
                  for keyword in keywords
              ):
                  execution_requirements.append(
                      requirement
                  )

          execution_requirements = list(
              dict.fromkeys(
                  execution_requirements
              )
          )

          print("")
          print(
              "[7] Execution requirements:"
          )

          for requirement in (
              execution_requirements
          ):
              print(
                  f"- {requirement}"
              )

          # =================================================
          # RISK CHECK
          # =================================================

          risk_keywords = [
              "payment",
              "wallet",
              "private key",
              "password",
              "credential",
              "financial",
              "medical",
              "legal",
              "money transfer"
          ]

          risk_flags = []

          for keyword in risk_keywords:

              if keyword in task_lower:
                  risk_flags.append(
                      keyword
                  )

          print("")
          print(
              "[8] Risk analysis..."
          )

          if risk_flags:
              print(
                  "Risk flags detected:"
              )

              for flag in risk_flags:
                  print(
                      f"- {flag}"
                  )

          else:
              print(
                  "No high-risk keyword detected."
              )

          # =================================================
          # CAPABILITY CHECK
          # =================================================

          capabilities = {
              "research": True,
              "web_retrieval": True,
              "api_work": True,
              "python": True,
              "data_processing": True,
              "writing": True,
              "verification": True,

              # Explicitly unavailable
              "external_payment": False,
              "private_credentials": False,
              "financial_transfer": False
          }

          missing_capabilities = []

          for requirement in (
              execution_requirements
          ):

              if not capabilities.get(
                  requirement,
                  False
              ):
                  missing_capabilities.append(
                      requirement
                  )

          print("")
          print(
              "[9] Capability validation..."
          )

          if missing_capabilities:

              print(
                  "Missing capabilities:"
              )

              for capability in (
                  missing_capabilities
              ):
                  print(
                      f"- {capability}"
                  )

          else:

              print(
                  "Required capabilities "
                  "are available."
              )

          # =================================================
          # BUILD EXECUTION PLAN
          # =================================================

          plan_steps = []

          if selected_task:

              plan_steps = [
                  "Read and understand the complete task specification.",

                  "Identify the exact deliverables required.",

                  "Collect only the information or data "
                  "necessary to complete the task.",

                  "Perform the requested analysis, "
                  "research, coding, processing or verification.",

                  "Validate the result before submission.",

                  "Prepare a concise evidence-based "
                  "delivery.",

                  "Submit the result only through the "
                  "authorized Marketplace mechanism."
              ]

          # =================================================
          # FINAL GATE
          # =================================================

          ready = True
          gate_reasons = []

          if selected_task is None:

              ready = False

              gate_reasons.append(
                  "Selected task is unavailable."
              )

          if validation_status != "VALID":

              ready = False

              gate_reasons.append(
                  "Marketplace availability "
                  "validation failed."
              )

          if not execution_requirements:

              ready = False

              gate_reasons.append(
                  "No clear execution requirements "
                  "could be extracted."
              )

          if missing_capabilities:

              ready = False

              gate_reasons.append(
                  "Required capabilities are missing."
              )

          if risk_flags:

              ready = False

              gate_reasons.append(
                  "Task contains elevated-risk "
                  "requirements."
              )

          # ACT 14 deliberately keeps the final
          # Marketplace action disabled.

          execution_authorized = False

          # =================================================
          # DECISION
          # =================================================

          print("")
          print(
              "================================================"
          )
          print(
              "ACT 14 EXECUTION GATE"
          )
          print(
              "================================================"
          )

          if ready:

              print(
                  "STATUS: READY_FOR_ACT15"
              )

              print(
                  "NØX has prepared a controlled "
                  "execution plan."
              )

          else:

              print(
                  "STATUS: NOT_READY"
              )

              for reason in gate_reasons:
                  print(
                      f"- {reason}"
                  )

          print(
              "Marketplace execution: DISABLED"
          )

          # =================================================
          # DECISION RECORD
          # =================================================

          decision = {
              "decision_id":
                  f"act14-{int(now_dt.timestamp())}",

              "timestamp": now,

              "stage":
                  "controlled_execution_plan",

              "act13_selected_task":
                  selected_task_id,

              "selected_task":
                  get_task_id(selected_task)
                  if selected_task
                  else None,

              "selected_title":
                  get_task_title(selected_task)
                  if selected_task
                  else selected_title,

              "act13_score":
                  selected_score,

              "validation_status":
                  validation_status,

              "execution_requirements":
                  execution_requirements,

              "missing_capabilities":
                  missing_capabilities,

              "risk_flags":
                  risk_flags,

              "ready_for_act15":
                  ready,

              "execution_authorized":
                  execution_authorized,

              "action_taken":
                  False,

              "gate_reasons":
                  gate_reasons,

              "principle":
                  (
                      "ACT 14 prepares and validates "
                      "execution but does not execute "
                      "Marketplace actions."
                  )
          }

          # =================================================
          # LEARNING
          # =================================================

          learning = {
              "timestamp": now,

              "stage": "ACT14",

              "lesson":
                  (
                      "Before autonomous execution, "
                      "NØX must verify that its selected "
                      "task still exists, remains available, "
                      "matches its capabilities and can be "
                      "approached without unacceptable risk."
                  ),

              "selected_task":
                  selected_task_id,

              "ready_for_act15":
                  ready,

              "important_principle":
                  (
                      "A good autonomous decision must "
                      "survive a final execution-readiness "
                      "check."
                  ),

              "execution_boundary":
                  (
                      "ACT 14 may prepare the action, "
                      "but ACT 15 is the first stage "
                      "allowed to perform a real "
                      "Marketplace action."
                  ),

              "next_stage":
                  (
                      "ACT 15 must use the validated "
                      "candidate and controlled plan "
                      "to attempt the first real "
                      "Marketplace action."
                  )
          }

          # =================================================
          # MEMORY
          # =================================================

          memory["version"] = (
              "NØX ACT 14 Controlled Execution"
          )

          memory["last_act"] = "ACT 14"
          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp": now,
              "act": "ACT14",
              "type":
                  "controlled_execution_validation",

              "selected_task":
                  selected_task_id,

              "ready_for_act15":
                  ready,

              "validation_status":
                  validation_status
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          memory["execution_plan"] = {
              "timestamp": now,

              "task_id":
                  get_task_id(selected_task)
                  if selected_task
                  else selected_task_id,

              "title":
                  get_task_title(selected_task)
                  if selected_task
                  else selected_title,

              "status":
                  "READY_FOR_ACT15"
                  if ready
                  else "NOT_READY",

              "requirements":
                  execution_requirements,

              "risk_flags":
                  risk_flags,

              "missing_capabilities":
                  missing_capabilities,

              "steps":
                  plan_steps,

              "execution_authorized":
                  False
          }

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["learning"] = (
              memory["learning"][-50:]
          )

          os.makedirs(
              os.path.dirname(
                  MEMORY_FILE
              ),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # =================================================
          # FINAL OUTPUT
          # =================================================

          print("")
          print(
              "================================================"
          )
          print(
              "ACT 14 COMPLETED"
          )
          print(
              "================================================"
          )

          print("")
          print(
              "ACT 14 DOES NOT:"
          )

          print(
              "- Submit a bid."
          )

          print(
              "- Claim a task."
          )

          print(
              "- Accept an offer."
          )

          print(
              "- Execute paid work."
          )

          print(
              "- Send a Marketplace action."
          )

          print(
              "- Spend sats/yips."
          )

          print("")
          print(
              "ROADMAP:"
          )

          print(
              "ACT 11 -> Active attention"
          )

          print(
              "ACT 12 -> Task detection + "
              "capability matching"
          )

          print(
              "ACT 13 -> Autonomous evaluation + choice"
          )

          print(
              "ACT 14 -> Controlled execution plan"
          )

          print(
              "ACT 15 -> REAL MARKETPLACE ACTION"
          )

          PY

      - name: Save NØX ACT 14 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 14: controlled execution plan"
            git push
          fi
