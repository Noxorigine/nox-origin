name: NØX Global Memory Cleaner V1

on:
  workflow_dispatch:
  schedule:
    # Chaque dimanche à 04:17 UTC
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: nox-global-memory-cleaner
  cancel-in-progress: false

jobs:
  global-memory-cleaner:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Global Memory Cleaner
        shell: bash
        run: |
          python <<'PY'
          import os
          import json
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path(".")
          REPORT_DIR = ROOT / "memory" / "_cleaner"
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)

          # ------------------------------------------------------------
          # CONFIGURATION
          # ------------------------------------------------------------

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              ".venv",
              "venv",
          }

          # Fichiers que le cleaner ne doit jamais modifier.
          PROTECTED_NAMES = {
              "README.md",
              "LICENSE",
          }

          # Extensions considérées comme textuelles.
          TEXT_EXTENSIONS = {
              ".md",
              ".txt",
              ".json",
              ".yaml",
              ".yml",
              ".csv",
          }

          # Répertoires dont le contenu peut représenter de la mémoire.
          MEMORY_HINTS = {
              "memory",
              "memories",
              "knowledge",
              "knowledge_core",
              "observations",
              "interactions",
              "decisions",
              "results",
              "failures",
              "learning",
              "relations",
              "attention",
              "research",
              "marketplace",
          }

          # ------------------------------------------------------------
          # STATISTIQUES
          # ------------------------------------------------------------

          stats = {
              "files_scanned": 0,
              "memory_files_scanned": 0,
              "duplicates_found": 0,
              "duplicates_modified": 0,
              "temporary_candidates": 0,
              "archived": 0,
              "protected": 0,
              "contradictions_candidates": 0,
              "uncertain_candidates": 0,
              "files_modified": 0,
              "bytes_scanned": 0,
              "errors": 0,
          }

          duplicate_groups = []
          temporary_candidates = []
          uncertain_candidates = []

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def excluded(path: Path) -> bool:
              return any(part in EXCLUDED_DIRS for part in path.parts)

          def is_text_file(path: Path) -> bool:
              return path.suffix.lower() in TEXT_EXTENSIONS

          def is_memory_path(path: Path) -> bool:
              parts = {p.lower() for p in path.parts}
              return bool(parts & MEMORY_HINTS)

          def file_hash(path: Path):
              h = hashlib.sha256()

              try:
                  with path.open("rb") as f:
                      while True:
                          chunk = f.read(1024 * 1024)
                          if not chunk:
                              break
                          h.update(chunk)
                  return h.hexdigest()
              except Exception:
                  stats["errors"] += 1
                  return None

          def safe_text(path: Path):
              try:
                  return path.read_text(encoding="utf-8")
              except Exception:
                  return None

          # ------------------------------------------------------------
          # SCAN
          # ------------------------------------------------------------

          all_files = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if excluded(path):
                  continue

              # Ne jamais analyser les propres rapports du cleaner.
              try:
                  path.relative_to(REPORT_DIR)
                  continue
              except ValueError:
                  pass

              stats["files_scanned"] += 1

              try:
                  stats["bytes_scanned"] += path.stat().st_size
              except Exception:
                  pass

              all_files.append(path)

              if is_memory_path(path):
                  stats["memory_files_scanned"] += 1

          print("=== NØX GLOBAL MEMORY CLEANER V1 ===")
          print()
          print(f"Timestamp:          {now.isoformat()}")
          print(f"Files scanned:      {stats['files_scanned']}")
          print(f"Memory files:       {stats['memory_files_scanned']}")
          print(f"Bytes scanned:      {stats['bytes_scanned']}")
          print()

          # ------------------------------------------------------------
          # DUPLICATES
          #
          # Détection uniquement.
          # Aucune suppression automatique en V1.
          # ------------------------------------------------------------

          hashes = {}

          for path in all_files:
              if path.name in PROTECTED_NAMES:
                  stats["protected"] += 1
                  continue

              try:
                  # Les petits fichiers texte sont les plus pertinents
                  # pour une détection de doublons mémoire.
                  if not is_text_file(path):
                      continue

                  digest = file_hash(path)

                  if not digest:
                      continue

                  hashes.setdefault(digest, []).append(str(path))

              except Exception:
                  stats["errors"] += 1

          for digest, paths in hashes.items():
              if len(paths) > 1:
                  stats["duplicates_found"] += len(paths) - 1

                  duplicate_groups.append({
                      "hash": digest,
                      "files": paths,
                  })

          # ------------------------------------------------------------
          # TEMPORARY FILES
          #
          # Détection uniquement.
          # ------------------------------------------------------------

          temporary_markers = (
              ".tmp",
              ".temp",
              ".bak",
              ".old",
              "~",
          )

          for path in all_files:
              name = path.name.lower()

              if any(
                  name.endswith(marker)
                  for marker in temporary_markers
              ):
                  temporary_candidates.append(str(path))

          stats["temporary_candidates"] = len(temporary_candidates)

          # ------------------------------------------------------------
          # UNCERTAINTY / CONTRADICTION CANDIDATES
          #
          # On signale, mais on ne décide pas automatiquement.
          # ------------------------------------------------------------

          contradiction_markers = (
              "contradiction",
              "conflict",
              "contradict",
          )

          uncertainty_markers = (
              "uncertain",
              "unknown",
              "requires_validation",
              "waiting_for_knowledge",
              "no_data",
          )

          for path in all_files:
              if not is_text_file(path):
                  continue

              name = path.name.lower()

              if any(marker in name for marker in contradiction_markers):
                  stats["contradictions_candidates"] += 1

              if any(marker in name for marker in uncertainty_markers):
                  stats["uncertain_candidates"] += 1

          # ------------------------------------------------------------
          # REPORT
          # ------------------------------------------------------------

          report = {
              "cleaner": "GLOBAL",
              "version": "V1",
              "timestamp": now.isoformat(),
              "mode": "SAFE_ANALYSIS",
              "stats": stats,
              "duplicates": duplicate_groups[:100],
              "temporary_candidates": temporary_candidates[:100],
              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,
              "destructive_actions": False,
          }

          report_path = REPORT_DIR / "latest.json"
          report_path.write_text(
              json.dumps(report, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          # Rapport humain très condensé.
          summary_path = REPORT_DIR / "latest.txt"

          summary = f"""=== NØX GLOBAL MEMORY CLEANER V1 ===

          Timestamp:          {now.isoformat()}

          Files scanned:      {stats['files_scanned']}
          Memory files:       {stats['memory_files_scanned']}
          Bytes scanned:      {stats['bytes_scanned']}

          Duplicates found:   {stats['duplicates_found']}
          Temporary candidates:{stats['temporary_candidates']}
          Protected:          {stats['protected']}
          Contradictions:     {stats['contradictions_candidates']}
          Uncertain:          {stats['uncertain_candidates']}

          Files modified:     {stats['files_modified']}
          Errors:             {stats['errors']}

          Gemini used:        false
          External AI used:   false
          Project cost EUR:   0

          Mode: SAFE_ANALYSIS
          Destructive actions:false
          Status: OK
          """

          summary_path.write_text(
              summary,
              encoding="utf-8"
          )

          print(summary)

          print("Reports:")
          print(f"  {report_path}")
          print(f"  {summary_path}")

          PY

      - name: Commit cleaner reports
        shell: bash
        run: |
          git config user.name "NØX Memory Cleaner"
          git config user.email "nox-memory-cleaner@users.noreply.github.com"

          git add memory/_cleaner/latest.json
          git add memory/_cleaner/latest.txt

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "chore: update global memory cleaner report"
          git push
