name: NØX Global Memory Cleaner V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: nox-global-memory-cleaner
  cancel-in-progress: false

jobs:
  global-memory-inventory:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Inspect global memory
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          ROOT = Path(".")
          REPORT_DIR = ROOT / "memory" / "_cleaner"
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              ".venv",
              "venv",
          }

          TEXT_EXTENSIONS = {
              ".md",
              ".txt",
              ".json",
              ".yaml",
              ".yml",
              ".csv",
          }

          # IMPORTANT:
          # Cette liste sert uniquement à identifier les fichiers
          # potentiellement liés à la mémoire.
          MEMORY_HINTS = {
              "memory",
              "memories",
              "knowledge",
              "knowledge_core",
              "observations",
              "interactions",
              "decisions",
              "results",
              "failures",
              "learning",
              "relations",
              "attention",
              "research",
              "marketplace",
          }

          def excluded(path):
              return any(part in EXCLUDED_DIRS for part in path.parts)

          def is_text(path):
              return path.suffix.lower() in TEXT_EXTENSIONS

          def is_memory_candidate(path):
              parts = {p.lower() for p in path.parts}
              return bool(parts & MEMORY_HINTS)

          files = []
          memory_files = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if excluded(path):
                  continue

              # Ne pas analyser les rapports produits par ce workflow.
              try:
                  path.relative_to(REPORT_DIR)
                  continue
              except ValueError:
                  pass

              try:
                  size = path.stat().st_size
              except Exception:
                  size = 0

              relative = str(path)

              item = {
                  "path": relative,
                  "size_bytes": size,
                  "extension": path.suffix.lower() or "[none]",
                  "directory": str(path.parent),
                  "is_text": is_text(path),
              }

              files.append(item)

              if is_memory_candidate(path):
                  memory_files.append(item)

          # ------------------------------------------------------------
          # STATISTIQUES
          # ------------------------------------------------------------

          directories = Counter()
          extensions = Counter()
          memory_directories = Counter()
          memory_extensions = Counter()

          for item in files:
              directories[item["directory"]] += 1
              extensions[item["extension"]] += 1

          for item in memory_files:
              memory_directories[item["directory"]] += 1
              memory_extensions[item["extension"]] += 1

          largest = sorted(
              memory_files,
              key=lambda x: x["size_bytes"],
              reverse=True
          )[:30]

          # ------------------------------------------------------------
          # CONSOLE REPORT
          # ------------------------------------------------------------

          print("=== NØX GLOBAL MEMORY CLEANER V1.1 ===")
          print("MODE: INVENTORY ONLY")
          print()

          print(f"Timestamp:      {now.isoformat()}")
          print(f"All files:      {len(files)}")
          print(f"Memory files:   {len(memory_files)}")
          print()

          print("=== MEMORY DIRECTORIES ===")

          for directory, count in sorted(
              memory_directories.items(),
              key=lambda x: (-x[1], x[0])
          ):
              print(f"{count:4}  {directory}")

          print()

          print("=== MEMORY EXTENSIONS ===")

          for extension, count in sorted(
              memory_extensions.items(),
              key=lambda x: (-x[1], x[0])
          ):
              print(f"{count:4}  {extension}")

          print()

          print("=== LARGEST MEMORY FILES ===")

          for item in largest:
              size_kb = item["size_bytes"] / 1024
              print(
                  f"{size_kb:10.1f} KB  {item['path']}"
              )

          print()

          print("=== ALL MEMORY FILE PATHS ===")

          for item in sorted(memory_files, key=lambda x: x["path"]):
              print(item["path"])

          print()

          print("=== SAFETY ===")
          print("Files modified:      0")
          print("Files deleted:       0")
          print("Destructive actions: false")
          print("Gemini used:         false")
          print("External AI used:    false")
          print("Project cost EUR:    0")
          print("Status:              OK")

          # ------------------------------------------------------------
          # JSON REPORT
          # ------------------------------------------------------------

          report = {
              "cleaner": "GLOBAL",
              "version": "V1.1",
              "timestamp": now.isoformat(),
              "mode": "INVENTORY_ONLY",

              "totals": {
                  "all_files": len(files),
                  "memory_files": len(memory_files),
              },

              "memory_directories": dict(
                  sorted(
                      memory_directories.items(),
                      key=lambda x: (-x[1], x[0])
                  )
              ),

              "memory_extensions": dict(
                  sorted(
                      memory_extensions.items(),
                      key=lambda x: (-x[1], x[0])
                  )
              ),

              "largest_memory_files": largest,

              "memory_files": sorted(
                  memory_files,
                  key=lambda x: x["path"]
              ),

              "safety": {
                  "files_modified": 0,
                  "files_deleted": 0,
                  "destructive_actions": False,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0
              }
          }

          json_path = REPORT_DIR / "inventory-v1.1.json"

          json_path.write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # HUMAN REPORT
          # ------------------------------------------------------------

          txt_path = REPORT_DIR / "inventory-v1.1.txt"

          with txt_path.open("w", encoding="utf-8") as out:

              out.write("=== NØX GLOBAL MEMORY CLEANER V1.1 ===\n")
              out.write("MODE: INVENTORY ONLY\n\n")

              out.write(
                  f"Timestamp:    {now.isoformat()}\n"
              )
              out.write(
                  f"All files:    {len(files)}\n"
              )
              out.write(
                  f"Memory files: {len(memory_files)}\n\n"
              )

              out.write("=== MEMORY DIRECTORIES ===\n")

              for directory, count in sorted(
                  memory_directories.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  out.write(f"{count:4}  {directory}\n")

              out.write("\n=== MEMORY EXTENSIONS ===\n")

              for extension, count in sorted(
                  memory_extensions.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  out.write(f"{count:4}  {extension}\n")

              out.write("\n=== LARGEST MEMORY FILES ===\n")

              for item in largest:
                  size_kb = item["size_bytes"] / 1024
                  out.write(
                      f"{size_kb:10.1f} KB  {item['path']}\n"
                  )

              out.write("\n=== ALL MEMORY FILE PATHS ===\n")

              for item in sorted(memory_files, key=lambda x: x["path"]):
                  out.write(f"{item['path']}\n")

              out.write("\n=== SAFETY ===\n")
              out.write("Files modified:      0\n")
              out.write("Files deleted:       0\n")
              out.write("Destructive actions: false\n")
              out.write("Gemini used:         false\n")
              out.write("External AI used:    false\n")
              out.write("Project cost EUR:    0\n")
              out.write("Status:              OK\n")

          print()
          print("Reports created:")
          print(f"  {json_path}")
          print(f"  {txt_path}")

          PY

      - name: Commit inventory reports
        shell: bash
        run: |
          git config user.name "NØX Memory Cleaner"
          git config user.email "nox-memory-cleaner@users.noreply.github.com"

          git add memory/_cleaner/inventory-v1.1.json
          git add memory/_cleaner/inventory-v1.1.txt

          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
            exit 0
          fi

          git commit -m "chore: inventory global memory"
          git push
