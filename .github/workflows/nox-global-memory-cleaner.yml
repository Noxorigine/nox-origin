name: NØX Global Memory Cleaner V1.2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: nox-global-memory-cleaner
  cancel-in-progress: false

jobs:
  global-memory-classification:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Classify global memory
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          ROOT = Path(".")
          REPORT_DIR = ROOT / "memory" / "_cleaner"
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)

          EXCLUDED_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules",
              ".venv",
              "venv",
          }

          TEXT_EXTENSIONS = {
              ".md",
              ".txt",
              ".json",
              ".yaml",
              ".yml",
              ".csv",
          }

          MEMORY_HINTS = {
              "memory",
              "memories",
              "knowledge",
              "knowledge_core",
              "observations",
              "interactions",
              "decisions",
              "results",
              "failures",
              "learning",
              "relations",
              "attention",
              "research",
              "marketplace",
          }

          CORE_NAMES = {
              "nox_memory.json",
              "nox_knowledge_core.json",
              "nox_knowledge_gaps.json",
              "nox_reputation_trust.json",
              "nox_core_decision.json",
              "nox_interaction_core.json",
              "nox_first_sats_strategy.json",
          }

          REPORT_HINTS = {
              "report",
              "weekend",
              "_cleaner",
          }

          def excluded(path):
              return any(part in EXCLUDED_DIRS for part in path.parts)

          def is_text(path):
              return path.suffix.lower() in TEXT_EXTENSIONS

          def is_memory_candidate(path):
              parts = {p.lower() for p in path.parts}
              return bool(parts & MEMORY_HINTS)

          def classify(path):
              name = path.name.lower()
              stem = path.stem.lower()

              # Rapports générés / documentation de rapport.
              if (
                  "_cleaner" in str(path).lower()
                  or "report" in name
                  or name == "nox_weekend_report.md"
              ):
                  return "REPORT"

              # Mémoire fondamentale explicitement identifiée.
              if name in CORE_NAMES:
                  return "CORE"

              # Anciennes séries Vxx.
              if stem.startswith("nox_v"):
                  return "LEGACY_V"

              # Fichiers ACT récents : candidats actifs.
              if stem.startswith("nox_act_"):
                  return "ACTIVE_CANDIDATE"

              # Fichiers de mémoire structurants sans numéro V/ACT.
              if any(
                  token in stem
                  for token in (
                      "knowledge",
                      "learning",
                      "reputation",
                      "interaction",
                      "decision",
                      "memory",
                      "first_sats",
                  )
              ):
                  return "CORE_CANDIDATE"

              return "HISTORICAL"

          files = []
          memory_files = []

          for path in ROOT.rglob("*"):
              if not path.is_file():
                  continue

              if excluded(path):
                  continue

              try:
                  path.relative_to(REPORT_DIR)
                  continue
              except ValueError:
                  pass

              try:
                  size = path.stat().st_size
              except Exception:
                  size = 0

              item = {
                  "path": str(path),
                  "size_bytes": size,
                  "extension": path.suffix.lower() or "[none]",
                  "directory": str(path.parent),
                  "is_text": is_text(path),
              }

              files.append(item)

              if is_memory_candidate(path):
                  item["classification"] = classify(path)
                  memory_files.append(item)

          # ------------------------------------------------------------
          # CLASSIFICATION
          # ------------------------------------------------------------

          classifications = Counter(
              item["classification"]
              for item in memory_files
          )

          # ------------------------------------------------------------
          # JSON + MD PAIRS
          # ------------------------------------------------------------

          by_stem = defaultdict(list)

          for item in memory_files:
              path = Path(item["path"])
              normalized = str(path.with_suffix("")).lower()
              by_stem[normalized].append(item)

          format_pairs = []

          for stem, items in sorted(by_stem.items()):
              extensions = {Path(x["path"]).suffix.lower() for x in items}

              if ".json" in extensions and ".md" in extensions:
                  format_pairs.append({
                      "base": stem,
                      "files": sorted(x["path"] for x in items),
                      "classification": sorted(
                          {x["classification"] for x in items}
                      )
                  })

          # ------------------------------------------------------------
          # LEGACY / CANDIDATE GROUPS
          # ------------------------------------------------------------

          legacy_v = sorted(
              item["path"]
              for item in memory_files
              if item["classification"] == "LEGACY_V"
          )

          active_candidates = sorted(
              item["path"]
              for item in memory_files
              if item["classification"] == "ACTIVE_CANDIDATE"
          )

          core_files = sorted(
              item["path"]
              for item in memory_files
              if item["classification"] in {
                  "CORE",
                  "CORE_CANDIDATE",
              }
          )

          historical = sorted(
              item["path"]
              for item in memory_files
              if item["classification"] == "HISTORICAL"
          )

          reports = sorted(
              item["path"]
              for item in memory_files
              if item["classification"] == "REPORT"
          )

          # ------------------------------------------------------------
          # POTENTIAL DUPLICATE CANDIDATES
          # ------------------------------------------------------------

          duplicate_candidates = []

          for pair in format_pairs:
              duplicate_candidates.append({
                  "reason": "same_base_json_md",
                  "files": pair["files"],
              })

          # Les LEGACY_V sont des candidats à revue,
          # jamais automatiquement déclarés comme doublons.
          for path in legacy_v:
              duplicate_candidates.append({
                  "reason": "legacy_v_requires_review",
                  "files": [path],
              })

          # ------------------------------------------------------------
          # SIZES
          # ------------------------------------------------------------

          largest = sorted(
              memory_files,
              key=lambda x: x["size_bytes"],
              reverse=True
          )[:20]

          memory_directories = Counter(
              item["directory"] for item in memory_files
          )

          memory_extensions = Counter(
              item["extension"] for item in memory_files
          )

          # ------------------------------------------------------------
          # REPORT OBJECT
          # ------------------------------------------------------------

          report = {
              "cleaner": "GLOBAL",
              "version": "V1.2",
              "timestamp": now.isoformat(),
              "mode": "CLASSIFICATION_ONLY",

              "totals": {
                  "all_files": len(files),
                  "memory_files": len(memory_files),
                  "format_pairs": len(format_pairs),
                  "duplicate_candidates": len(duplicate_candidates),
              },

              "classification_counts": dict(
                  sorted(
                      classifications.items(),
                      key=lambda x: (-x[1], x[0])
                  )
              ),

              "classification_policy": {
                  "CORE": "Fichiers fondamentaux explicitement identifiés.",
                  "CORE_CANDIDATE": "Mémoire structurante à conserver/revoir.",
                  "ACTIVE_CANDIDATE": "Fichier ACT récent, candidat à être encore utilisé.",
                  "HISTORICAL": "Mémoire historique sans indication de suppression.",
                  "LEGACY_V": "Ancienne série V, revue manuelle nécessaire.",
                  "REPORT": "Rapport ou artefact documentaire.",
              },

              "core_files": core_files,
              "active_candidates": active_candidates,
              "historical_files": historical,
              "legacy_v_files": legacy_v,
              "report_files": reports,

              "format_pairs": format_pairs,
              "duplicate_candidates": duplicate_candidates,

              "memory_directories": dict(
                  sorted(
                      memory_directories.items(),
                      key=lambda x: (-x[1], x[0])
                  )
              ),

              "memory_extensions": dict(
                  sorted(
                      memory_extensions.items(),
                      key=lambda x: (-x[1], x[0])
                  )
              ),

              "largest_memory_files": largest,

              "memory_files": sorted(
                  memory_files,
                  key=lambda x: x["path"]
              ),

              "safety": {
                  "files_modified": 0,
                  "files_deleted": 0,
                  "files_moved": 0,
                  "destructive_actions": False,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "project_cost_eur": 0
              }
          }

          # ------------------------------------------------------------
          # WRITE JSON
          # ------------------------------------------------------------

          json_path = REPORT_DIR / "classification-v1.2.json"

          json_path.write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # WRITE COMPACT HUMAN REPORT
          # ------------------------------------------------------------

          txt_path = REPORT_DIR / "classification-v1.2.txt"

          with txt_path.open("w", encoding="utf-8") as out:

              out.write("=== NØX GLOBAL MEMORY CLEANER V1.2 ===\n")
              out.write("MODE: CLASSIFICATION ONLY\n\n")

              out.write(f"Timestamp:           {now.isoformat()}\n")
              out.write(f"All files:           {len(files)}\n")
              out.write(f"Memory files:        {len(memory_files)}\n")
              out.write(f"Format pairs:        {len(format_pairs)}\n")
              out.write(
                  f"Duplicate candidates:{len(duplicate_candidates)}\n\n"
              )

              out.write("=== CLASSIFICATION ===\n")

              for category, count in sorted(
                  classifications.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  out.write(f"{count:4}  {category}\n")

              out.write("\n=== CORE ===\n")

              for path in core_files:
                  out.write(f"{path}\n")

              out.write("\n=== ACTIVE CANDIDATES ===\n")

              for path in active_candidates:
                  out.write(f"{path}\n")

              out.write("\n=== LEGACY V — REVIEW ONLY ===\n")

              for path in legacy_v:
                  out.write(f"{path}\n")

              out.write("\n=== JSON/MD PAIRS ===\n")

              for pair in format_pairs:
                  out.write(
                      f"{pair['files'][0]} <-> {pair['files'][1]}\n"
                  )

              out.write("\n=== LARGEST MEMORY FILES ===\n")

              for item in largest:
                  size_kb = item["size_bytes"] / 1024
                  out.write(
                      f"{size_kb:10.1f} KB  "
                      f"{item['classification']:20} "
                      f"{item['path']}\n"
                  )

              out.write("\n=== SAFETY ===\n")
              out.write("Files modified:       0\n")
              out.write("Files deleted:        0\n")
              out.write("Files moved:          0\n")
              out.write("Destructive actions:  false\n")
              out.write("Gemini used:          false\n")
              out.write("External AI used:     false\n")
              out.write("Project cost EUR:     0\n")
              out.write("Status:               OK\n")

          # ------------------------------------------------------------
          # CONSOLE — CONDENSED
          # ------------------------------------------------------------

          print("=== NØX GLOBAL MEMORY CLEANER V1.2 ===")
          print("MODE: CLASSIFICATION ONLY")
          print()
          print(f"All files:            {len(files)}")
          print(f"Memory files:         {len(memory_files)}")
          print(f"Format pairs:         {len(format_pairs)}")
          print(f"Review candidates:    {len(duplicate_candidates)}")
          print()

          print("=== CLASSIFICATION ===")

          for category, count in sorted(
              classifications.items(),
              key=lambda x: (-x[1], x[0])
          ):
              print(f"{count:4}  {category}")

          print()
          print("=== SAFETY ===")
          print("Modified:             0")
          print("Deleted:              0")
          print("Moved:                0")
          print("Destructive:          false")
          print("Gemini:               false")
          print("External AI:          false")
          print("Cost EUR:             0")
          print("Status:               OK")
          print()
          print("Reports created:")
          print(f"  {json_path}")
          print(f"  {txt_path}")

          PY

      - name: Commit classification reports
        shell: bash
        run: |
          git config user.name "NØX Memory Cleaner"
          git config user.email "nox-memory-cleaner@users.noreply.github.com"

          git add memory/_cleaner/classification-v1.2.json
          git add memory/_cleaner/classification-v1.2.txt

          if git diff --cached --quiet; then
            echo "No classification changes to commit."
            exit 0
          fi

          git commit -m "chore: classify global memory"
          git push
