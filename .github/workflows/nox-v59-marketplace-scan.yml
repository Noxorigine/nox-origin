name: NØX Origin - V59 Marketplace Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marketplace-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scan open marketplace tasks
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import hashlib
          from datetime import datetime, timezone
          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-V59-Marketplace-Scanner"
          })

          # ------------------------------------------------------------
          # 1. Authenticate
          # ------------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print("AUTH STATUS:", auth.status_code)

          if auth.status_code != 200:
              print(auth.text[:1000])
              raise RuntimeError("The Colony authentication failed")

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError("No access token returned")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ------------------------------------------------------------
          # 2. Retrieve open marketplace tasks
          # ------------------------------------------------------------

          endpoint = (
              f"{BASE_URL}/marketplace/tasks"
              "?status=open&sort=new&limit=100&offset=0"
          )

          response = session.get(
              endpoint,
              timeout=30
          )

          print("MARKETPLACE STATUS:", response.status_code)

          if response.status_code != 200:
              print(response.text[:2000])
              raise RuntimeError("Marketplace request failed")

          data = response.json()

          # ------------------------------------------------------------
          # 3. Normalize response
          # ------------------------------------------------------------

          if isinstance(data, list):
              raw_tasks = data
          elif isinstance(data, dict):
              raw_tasks = (
                  data.get("tasks")
                  or data.get("items")
                  or data.get("data")
                  or []
              )
          else:
              raw_tasks = []

