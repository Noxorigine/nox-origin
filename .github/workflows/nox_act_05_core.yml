name: NØX ACT 05 CORE V1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nox-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX Core
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import hashlib
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(exist_ok=True)

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          DECISION_FILE = MEMORY / "nox_core_decision.json"

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          DOMAIN_KEYWORDS = {
              "virtual_economy": [
                  "economy", "marketplace", "market", "reward", "bounty",
                  "payment", "value", "earn", "task", "service"
              ],
              "cybersecurity": [
                  "security", "cybersecurity", "cyber", "vulnerability",
                  "exploit", "privacy", "authentication", "credential",
                  "attack", "defense"
              ],
              "ai_communities": [
                  "community", "agent community", "agents", "discussion",
                  "forum", "collaboration", "network", "colony"
              ],
              "agent_intelligence_autonomy": [
                  "agent", "autonomous", "autonomy", "intelligence",
                  "reasoning", "learning", "memory", "decision",
                  "planning", "coordination"
              ],
              "emerging_technologies": [
                  "technology", "innovation", "emerging", "robotics",
                  "blockchain", "llm", "model", "ai", "software"
              ],
          }

          ACTION_MAP = {
              "RESPOND": "ACT02",
              "OPPORTUNITY_ACTION": "ACT03",
              "COLLABORATE": "ACT04",
              "PUBLISH": "ACT09",
          }

          def load_json(name):
              path = MEMORY / name
              if not path.exists():
                  return {}
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: unable to read {name}: {exc}")
                  return {}

          def text_of(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  parts = []
                  for key in (
                      "title", "text", "content", "body", "description",
                      "summary", "message", "name"
                  ):
                      val = value.get(key)
                      if isinstance(val, str):
                          parts.append(val)
                  return " ".join(parts)
              return ""

          def normalize_list(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  for key in (
                      "items", "data", "tasks", "posts", "results",
                      "opportunities", "evaluated", "top_opportunities",
                      "scanned_tasks", "observed_posts"
                  ):
                      if isinstance(value.get(key), list):
                          return value[key]
              return []

          def normalize_score(value, source_max=10):
              try:
                  value = float(value)
              except Exception:
                  return 0.0

              if source_max <= 0:
                  return 0.0

              value = max(0.0, min(value, source_max))
              return round((value / source_max) * 10.0, 2)

          def classify_domains(text):
              text = text.lower()
              scores = {}

              for domain, keywords in DOMAIN_KEYWORDS.items():
                  matches = 0
                  for keyword in keywords:
                      if keyword.lower() in text:
                          matches += 1
                  scores[domain] = matches

              if not any(scores.values()):
                  return "emerging_technologies", 0, scores

              dominant = max(scores, key=scores.get)
              return dominant, scores[dominant], scores

          def get_target_id(item):
              if not isinstance(item, dict):
                  return None

              for key in (
                  "id", "post_id", "task_id", "listing_id",
                  "target_id", "uuid"
              ):
                  value = item.get(key)
                  if value:
                      return str(value)

              return None

          def reward_score(item):
              if not isinstance(item, dict):
                  return 0.0

              raw = (
                  item.get("reward_status")
                  or item.get("compensation")
                  or item.get("reward")
                  or item.get("payment_status")
                  or ""
              )

              value = str(raw).upper()

              if "CONFIRMED" in value or "REWARD_CONFIRMED" in value:
                  return 10.0

              if "AMBIGUOUS" in value or "UNCLEAR" in value:
                  return 5.0

              if "UNKNOWN" in value:
                  return 2.0

              try:
                  numeric = float(raw)
                  return 10.0 if numeric > 0 else 0.0
              except Exception:
                  return 0.0

          def risk_score(item):
              if not isinstance(item, dict):
                  return 0.0

              raw = str(
                  item.get("risk")
                  or item.get("risk_level")
                  or item.get("assessment")
                  or ""
              ).upper()

              if "HIGH" in raw:
                  return 10.0

              if "MEDIUM" in raw or "MENTION" in raw:
                  return 4.0

              return 0.0

          def compatibility_score(item):
              if not isinstance(item, dict):
                  return 0.0

              for key in (
                  "compatibility_score",
                  "compatibility",
                  "skill_match",
                  "match_score"
              ):
                  if key in item:
                      value = item.get(key)

                      if isinstance(value, (int, float)):
                          return normalize_score(value, 20 if value > 10 else 10)

                      if isinstance(value, dict):
                          values = []
                          for v in value.values():
                              if isinstance(v, (int, float)):
                                  values.append(float(v))
                          if values:
                              return normalize_score(
                                  sum(values) / len(values),
                                  20 if max(values) > 10 else 10
                              )

              return 0.0

          def strategic_score(domain):
              return float(PRIORITIES.get(domain, 15))

          def create_decision_id(action, target_id):
              raw = f"{NOW_ISO}|{action}|{target_id or 'none'}"
              return hashlib.sha256(raw.encode()).hexdigest()[:16]

          # ------------------------------------------------------------
          # LOAD EXISTING MEMORIES
          # ------------------------------------------------------------

          memories = {
              "ACT02": load_json("nox_act_02_autonomous_responder.json"),
              "ACT03": load_json("nox_act_03_opportunity_action.json"),
              "ACT04": load_json("nox_act_04_agent_collaboration.json"),
              "ACT06": load_json("nox_act_06_interaction_monitor_v2.json"),
              "ACT07": load_json("nox_act_07_marketplace_opportunity_hunter_v2.json"),
              "ACT08": load_json("nox_act_08_opportunity_evaluator_v7.json"),
              "ACT09": load_json("nox_act_09_autonomous_publishing.json"),
              "ACT10": load_json("nox_act_10_priority_learning.json"),
          }

          candidates = []

          # ------------------------------------------------------------
          # ACT07 — MARKETPLACE DISCOVERY
          # ------------------------------------------------------------

          act07 = memories["ACT07"]

          raw_tasks = (
              act07.get("scanned_tasks")
              or act07.get("tasks")
              or act07.get("opportunities")
              or []
          )

          for item in normalize_list(raw_tasks):
              if not isinstance(item, dict):
                  continue

              text = text_of(item)
              if not text:
                  continue

              domain, matches, domain_scores = classify_domains(text)

              candidates.append({
                  "source": "ACT07",
                  "source_type": "marketplace",
                  "action": "OPPORTUNITY_ACTION",
                  "target_id": get_target_id(item),
                  "text": text[:1000],
                  "domain": domain,
                  "domain_matches": matches,
                  "domain_scores": domain_scores,
                  "strategic_priority": strategic_score(domain),
                  "relevance": min(10.0, 3.0 + matches),
                  "compatibility": compatibility_score(item),
                  "reward": reward_score(item),
                  "risk": risk_score(item),
              })

          # ------------------------------------------------------------
          # ACT08 — MARKETPLACE EVALUATION
          # ------------------------------------------------------------

          act08 = memories["ACT08"]

          raw_opportunities = (
              act08.get("top_opportunities")
              or act08.get("evaluated")
              or act08.get("opportunities")
              or []
          )

          for item in normalize_list(raw_opportunities):
              if not isinstance(item, dict):
                  continue

              text = text_of(item)
              if not text:
                  continue

              domain, matches, domain_scores = classify_domains(text)

              action = "OPPORTUNITY_ACTION"

              classification = str(
                  item.get("classification")
                  or item.get("final_classification")
                  or ""
              ).upper()

              if classification in ("SERVICE_OFFER", "TASK_REQUEST", "QUALIFIED"):
                  action = "OPPORTUNITY_ACTION"

              candidates.append({
                  "source": "ACT08",
                  "source_type": "evaluated_marketplace",
                  "action": action,
                  "target_id": get_target_id(item),
                  "text": text[:1000],
                  "domain": domain,
                  "domain_matches": matches,
                  "domain_scores": domain_scores,
                  "strategic_priority": strategic_score(domain),
                  "relevance": min(10.0, 4.0 + matches),
                  "compatibility": compatibility_score(item),
                  "reward": reward_score(item),
                  "risk": risk_score(item),
              })

          # ------------------------------------------------------------
          # ACT06 — COMMUNITY CONTEXT
          # ------------------------------------------------------------

          act06 = memories["ACT06"]

          raw_posts = (
              act06.get("observed_posts")
              or act06.get("posts")
              or []
          )

          for item in normalize_list(raw_posts):
              if not isinstance(item, dict):
                  continue

              text = text_of(item)
              if not text:
                  continue

              domain, matches, domain_scores = classify_domains(text)

              assessment = item.get("assessment")
              if not isinstance(assessment, dict):
                  assessment = {}

              context = str(
                  item.get("context")
                  or item.get("classification")
                  or assessment.get("context")
                  or ""
              ).lower()

              if "question" in context or "help" in context:
                  action = "RESPOND"
              elif "collaboration" in context:
                  action = "COLLABORATE"
              elif "opportunity" in context:
                  action = "OPPORTUNITY_ACTION"
              else:
                  action = "RESPOND"

              candidates.append({
                  "source": "ACT06",
                  "source_type": "community",
                  "action": action,
                  "target_id": get_target_id(item),
                  "text": text[:1000],
                  "domain": domain,
                  "domain_matches": matches,
                  "domain_scores": domain_scores,
                  "strategic_priority": strategic_score(domain),
                  "relevance": min(10.0, 2.0 + matches),
                  "compatibility": 7.0 if action in ACTION_MAP else 0.0,
                  "reward": 0.0,
                  "risk": risk_score(item),
              })

          # ------------------------------------------------------------
          # REMOVE DUPLICATES
          # ------------------------------------------------------------

          unique = {}

          for candidate in candidates:
              key = (
                  candidate["action"],
                  candidate.get("target_id"),
                  candidate["source"],
                  candidate["text"][:180].lower()
              )

              if key not in unique:
                  unique[key] = candidate

          candidates = list(unique.values())

          # ------------------------------------------------------------
          # SCORE CANDIDATES
          # ------------------------------------------------------------

          for candidate in candidates:

              strategic = candidate["strategic_priority"]

              strategic_component = strategic / 25.0 * 35.0
              relevance_component = candidate["relevance"] / 10.0 * 25.0
              compatibility_component = candidate["compatibility"] / 10.0 * 20.0
              reward_component = candidate["reward"] / 10.0 * 15.0
              risk_penalty = candidate["risk"] / 10.0 * 20.0

              score = (
                  strategic_component
                  + relevance_component
                  + compatibility_component
                  + reward_component
                  - risk_penalty
              )

              candidate["score"] = round(max(0.0, min(score, 100.0)), 2)

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["strategic_priority"],
                  item["relevance"]
              ),
              reverse=True
          )

          # ------------------------------------------------------------
          # PREVIOUS CORE STATE
          # ------------------------------------------------------------

          previous = {}
          if DECISION_FILE.exists():
              try:
                  with DECISION_FILE.open("r", encoding="utf-8") as f:
                      previous = json.load(f)
              except Exception:
                  previous = {}

          previous_decisions = previous.get("decisions", [])
          previous_runs = previous.get("runs", [])
          learning = previous.get("learning", [])

          # ------------------------------------------------------------
          # DECISION
          # ------------------------------------------------------------

          selected = candidates[0] if candidates else None

          if selected:
              score = selected["score"]

              if score >= 70:
                  decision = "HIGH_PRIORITY_ACTION"
              elif score >= 50:
                  decision = "PRIORITY_ACTION"
              elif score >= 30:
                  decision = "REVIEW_REQUIRED"
              else:
                  decision = "OBSERVE_AND_LEARN"

              assigned_act = ACTION_MAP.get(selected["action"])

              if decision in (
                  "HIGH_PRIORITY_ACTION",
                  "PRIORITY_ACTION"
              ) and assigned_act:
                  status = "PENDING"
              else:
                  status = "OBSERVATION_ONLY"

              target_id = selected.get("target_id")
              decision_id = create_decision_id(
                  selected["action"],
                  target_id
              )

              expires_at = (
                  NOW + timedelta(hours=2)
              ).isoformat()

              reason = (
                  f"Selected from {selected['source']} because "
                  f"strategic priority={selected['strategic_priority']}/25, "
                  f"relevance={selected['relevance']}/10, "
                  f"compatibility={selected['compatibility']}/10, "
                  f"reward={selected['reward']}/10, "
                  f"risk={selected['risk']}/10, "
                  f"total score={selected['score']}/100."
              )

              current_decision = {
                  "decision_id": decision_id,
                  "timestamp": NOW_ISO,
                  "expires_at": expires_at,
                  "decision": decision,
                  "status": status,
                  "action": selected["action"],
                  "assigned_act": assigned_act,
                  "target_id": target_id,
                  "source": selected["source"],
                  "strategic_domain": selected["domain"],
                  "priority": selected["strategic_priority"],
                  "scores": {
                      "total": selected["score"],
                      "relevance": selected["relevance"],
                      "compatibility": selected["compatibility"],
                      "reward": selected["reward"],
                      "risk": selected["risk"]
                  },
                  "reason": reason,
                  "text": selected["text"]
              }

          else:
              current_decision = {
                  "decision_id": create_decision_id("NO_ACTION", None),
                  "timestamp": NOW_ISO,
                  "expires_at": (
                      NOW + timedelta(hours=1)
                  ).isoformat(),
                  "decision": "NO_ACTION",
                  "status": "NO_ACTION",
                  "action": "NONE",
                  "assigned_act": None,
                  "target_id": None,
                  "source": None,
                  "strategic_domain": None,
                  "priority": 0,
                  "scores": {
                      "total": 0,
                      "relevance": 0,
                      "compatibility": 0,
                      "reward": 0,
                      "risk": 0
                  },
                  "reason": "No actionable candidate was found in current observations.",
                  "text": ""
              }

          # ------------------------------------------------------------
          # LEARNING
          # ------------------------------------------------------------

          lesson = {
              "timestamp": NOW_ISO,
              "decision_id": current_decision["decision_id"],
              "decision": current_decision["decision"],
              "assigned_act": current_decision["assigned_act"],
              "domain": current_decision["strategic_domain"],
              "score": current_decision["scores"]["total"],
              "lesson": (
                  "Core is now converting observations into an "
                  "explicit prioritized action assignment."
                  if current_decision["assigned_act"]
                  else
                  "Core found no action that should currently be assigned."
              )
          }

          learning.append(lesson)
          learning = learning[-100:]

          previous_decisions.append(current_decision)
          previous_decisions = previous_decisions[-100:]

          run_record = {
              "timestamp": NOW_ISO,
              "candidates_found": len(candidates),
              "decision_id": current_decision["decision_id"],
              "decision": current_decision["decision"],
              "assigned_act": current_decision["assigned_act"],
              "score": current_decision["scores"]["total"]
          }

          previous_runs.append(run_record)
          previous_runs = previous_runs[-100:]

          # ------------------------------------------------------------
          # ACT10 INTEGRATION REPORT
          # ------------------------------------------------------------

          act10 = memories["ACT10"]

          act10_priorities = act10.get("priorities")
          if not isinstance(act10_priorities, dict):
              act10_priorities = PRIORITIES.copy()

          # Preserve the canonical strategic coefficients.
          normalized_priorities = {}
          for domain, default_value in PRIORITIES.items():
              try:
                  normalized_priorities[domain] = float(
                      act10_priorities.get(domain, default_value)
                  )
              except Exception:
                  normalized_priorities[domain] = default_value

          output = {
              "version": "ACT 05 CORE V1",
              "updated_at": NOW_ISO,

              "current_decision": current_decision,

              "decision": current_decision,

              "candidates": candidates[:20],

              "strategic_priorities": normalized_priorities,

              "learning": learning,

              "decisions": previous_decisions,

              "runs": previous_runs,

              "capabilities": {
                  "observe": True,
                  "understand": True,
                  "prioritize": True,
                  "decide": True,
                  "assign_action": True,
                  "measure": True,
                  "learn": True,
                  "persistent_memory": True,
                  "autonomous_publication": False,
                  "autonomous_comments": False,
                  "autonomous_marketplace": False,
                  "autonomous_dm": False,
                  "payments": False,
                  "gemini": False,
                  "external_paid_services": False,
                  "human_override": True,
                  "project_cost_eur": 0
              },

              "safety": {
                  "payments": False,
                  "transfers": False,
                  "private_keys": False,
                  "wallet_credentials": False,
                  "dm": False,
                  "automatic_purchase": False,
                  "permanent_self_modification": False,
                  "human_override": True
              }
          }

          with DECISION_FILE.open("w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print("==============================================")
          print("NØX ACT 05 CORE")
          print("==============================================")
          print(f"Candidates : {len(candidates)}")
          print(f"Decision   : {current_decision['decision']}")
          print(f"Action     : {current_decision['action']}")
          print(f"Assigned   : {current_decision['assigned_act']}")
          print(f"Domain     : {current_decision['strategic_domain']}")
          print(f"Priority   : {current_decision['priority']}")
          print(f"Score      : {current_decision['scores']['total']}/100")
          print(f"Status     : {current_decision['status']}")
          print(f"Decision ID: {current_decision['decision_id']}")
          print("==============================================")
          PY

      - name: Commit Core memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_core_decision.json

          if git diff --cached --quiet; then
            echo "No Core memory changes."
            exit 0
          fi

          git commit -m "NØX ACT 05 Core decision update"

      - name: Rebase and push
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep $((attempt * 3))
          done

          echo "Unable to push after 5 attempts."
          exit 1
