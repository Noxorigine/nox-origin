name: NØX ACT 05 CORE V2 — Decision Lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run NØX ACT 05 CORE V2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import hashlib
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"
          MEMORY_DIR.mkdir(exist_ok=True)

          CORE_FILE = MEMORY_DIR / "nox_core_decision.json"

          NOW = datetime.now(timezone.utc)

          DECISION_TTL_HOURS = 2
          EXPIRED_COOLDOWN_HOURS = 6
          FAILED_COOLDOWN_HOURS = 12
          EXECUTED_COOLDOWN_HOURS = 6

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15
          }

          ACT_FILES = {
              "ACT02": MEMORY_DIR / "nox_act_02_autonomous_responder.json",
              "ACT03": MEMORY_DIR / "nox_act_03_opportunity_action.json",
              "ACT04": MEMORY_DIR / "nox_act_04_agent_collaboration.json",
              "ACT06": MEMORY_DIR / "nox_act_06_interaction_monitor_v2.json",
              "ACT07": MEMORY_DIR / "nox_act_07_marketplace_hunter_v2.json",
              "ACT08": MEMORY_DIR / "nox_act_08_marketplace_evaluator_v7.json",
              "ACT09": MEMORY_DIR / "nox_act_09_autonomous_publishing.json",
              "ACT10": MEMORY_DIR / "nox_act_10_priority_learning.json",
          }

          def load_json(path):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          return json.load(f)
              except Exception as e:
                  print(f"[WARN] Could not load {path}: {e}")
              return {}

          def ensure_list(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, dict):
                  return [value]
              return []

          def parse_dt(value):
              if not value:
                  return None

              try:
                  text = str(value).replace("Z", "+00:00")
                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          def iso(dt):
              return dt.astimezone(timezone.utc).isoformat()

          def decision_key(source, target_id, action):
              return f"{source}|{target_id}|{action}"

          def hash_id(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]

          # ---------------------------------------------------------
          # LOAD EXISTING CORE MEMORY
          # ---------------------------------------------------------

          core = load_json(CORE_FILE)

          if not isinstance(core, dict):
              core = {}

          core.setdefault("version", "ACT 05 CORE V2")
          core["updated_at"] = iso(NOW)

          core["strategic_priorities"] = PRIORITIES

          decisions = ensure_list(core.get("decisions"))
          runs = ensure_list(core.get("runs"))
          learning = ensure_list(core.get("learning"))
          candidates_memory = ensure_list(core.get("candidates"))

          # ---------------------------------------------------------
          # LOAD ACT MEMORIES
          # ---------------------------------------------------------

          memories = {}

          for act, path in ACT_FILES.items():
              memories[act] = load_json(path)

          # ---------------------------------------------------------
          # EXTRACT CANDIDATES
          # ---------------------------------------------------------

          candidates = []

          # ACT08 evaluator
          act08 = memories.get("ACT08", {})

          possible_lists = [
              act08.get("candidates"),
              act08.get("qualified"),
              act08.get("evaluated_tasks"),
              act08.get("opportunities"),
          ]

          for collection in possible_lists:
              if isinstance(collection, list):
                  for item in collection:
                      if isinstance(item, dict):
                          candidates.append({
                              "source": "ACT08",
                              **item
                          })

          # ACT07 hunter fallback
          if not candidates:
              act07 = memories.get("ACT07", {})

              for key in ["candidates", "qualified", "opportunities", "tasks"]:
                  collection = act07.get(key)

                  if isinstance(collection, list):
                      for item in collection:
                          if isinstance(item, dict):
                              candidates.append({
                                  "source": "ACT07",
                                  **item
                              })

          # Normalize candidate fields
          normalized = []

          for item in candidates:
              target_id = (
                  item.get("target_id")
                  or item.get("task_id")
                  or item.get("id")
                  or item.get("opportunity_id")
              )

              if not target_id:
                  raw = json.dumps(item, sort_keys=True)
                  target_id = "generated-" + hash_id(raw)

              source = str(item.get("source", "UNKNOWN"))

              action = (
                  item.get("action")
                  or item.get("recommended_action")
                  or "OPPORTUNITY_ACTION"
              )

              strategic_domain = (
                  item.get("strategic_domain")
                  or item.get("domain")
                  or item.get("category")
                  or "emerging_technologies"
              )

              strategic_domain = str(strategic_domain).lower()

              # Domain normalization
              domain_aliases = {
                  "virtual economy": "virtual_economy",
                  "virtual-economy": "virtual_economy",
                  "economy": "virtual_economy",
                  "cyber security": "cybersecurity",
                  "cyber-security": "cybersecurity",
                  "ai communities": "ai_communities",
                  "ai community": "ai_communities",
                  "agent intelligence": "agent_intelligence_autonomy",
                  "agent autonomy": "agent_intelligence_autonomy",
                  "agent intelligence/autonomy": "agent_intelligence_autonomy",
                  "emerging technology": "emerging_technologies",
                  "emerging tech": "emerging_technologies",
              }

              strategic_domain = domain_aliases.get(
                  strategic_domain,
                  strategic_domain
              )

              if strategic_domain not in PRIORITIES:
                  strategic_domain = "emerging_technologies"

              priority = PRIORITIES[strategic_domain]

              score = item.get("score")
              total_score = item.get("total_score")

              try:
                  score = float(score)
              except Exception:
                  score = None

              try:
                  total_score = float(total_score)
              except Exception:
                  total_score = None

              if total_score is None:
                  total_score = score if score is not None else 0

              relevance = item.get("relevance", item.get("relevance_score", 0))
              compatibility = item.get("compatibility", item.get("compatibility_score", 0))
              reward = item.get("reward_score", item.get("reward", 0))
              risk = item.get("risk_score", item.get("risk", 0))

              def num(value):
                  try:
                      return float(value)
                  except Exception:
                      return 0.0

              relevance = num(relevance)
              compatibility = num(compatibility)
              reward = num(reward)
              risk = num(risk)

              text = (
                  item.get("text")
                  or item.get("title")
                  or item.get("description")
                  or item.get("name")
                  or str(target_id)
              )

              normalized.append({
                  "source": source,
                  "target_id": str(target_id),
                  "action": str(action),
                  "strategic_domain": strategic_domain,
                  "priority": priority,
                  "score": round(total_score, 2),
                  "relevance": relevance,
                  "compatibility": compatibility,
                  "reward": reward,
                  "risk": risk,
                  "text": str(text)[:1000],
              })

          # Remove duplicates
          unique = {}

          for candidate in normalized:
              key = decision_key(
                  candidate["source"],
                  candidate["target_id"],
                  candidate["action"]
              )

              existing = unique.get(key)

              if existing is None or candidate["score"] > existing["score"]:
                  unique[key] = candidate

          candidates = list(unique.values())

          # ---------------------------------------------------------
          # DECISION LIFECYCLE
          # ---------------------------------------------------------

          active_decisions = []
          recent_blocked = []

          for decision in decisions:

              if not isinstance(decision, dict):
                  continue

              target_id = str(decision.get("target_id", ""))
              source = str(decision.get("source", ""))
              action = str(decision.get("action", ""))

              status = str(
                  decision.get("status", "")
              ).upper()

              timestamp = parse_dt(decision.get("timestamp"))
              expires_at = parse_dt(decision.get("expires_at"))

              key = decision_key(source, target_id, action)

              # ACTIVE = must not create another decision
              if status in {"PENDING", "CLAIMED", "IN_PROGRESS"}:

                  if expires_at and expires_at > NOW:
                      active_decisions.append(key)

                  elif timestamp:
                      if NOW - timestamp < timedelta(hours=DECISION_TTL_HOURS):
                          active_decisions.append(key)

              # EXPIRED = temporary cooldown
              elif status == "EXPIRED":

                  if timestamp and NOW - timestamp < timedelta(hours=EXPIRED_COOLDOWN_HOURS):
                      recent_blocked.append(key)

              # FAILED = longer cooldown
              elif status == "FAILED":

                  if timestamp and NOW - timestamp < timedelta(hours=FAILED_COOLDOWN_HOURS):
                      recent_blocked.append(key)

              # EXECUTED = wait for new evidence
              elif status == "EXECUTED":

                  if timestamp and NOW - timestamp < timedelta(hours=EXECUTED_COOLDOWN_HOURS):
                      recent_blocked.append(key)

          # ---------------------------------------------------------
          # SELECT BEST AVAILABLE CANDIDATE
          # ---------------------------------------------------------

          ranked = sorted(
              candidates,
              key=lambda x: (
                  x["score"],
                  x["priority"],
                  x["reward"],
                  x["compatibility"],
                  x["relevance"],
                  -x["risk"]
              ),
              reverse=True
          )

          selected = None
          skipped_active = []
          skipped_cooldown = []

          for candidate in ranked:

              key = decision_key(
                  candidate["source"],
                  candidate["target_id"],
                  candidate["action"]
              )

              if key in active_decisions:
                  skipped_active.append(candidate["target_id"])
                  continue

              if key in recent_blocked:
                  skipped_cooldown.append(candidate["target_id"])
                  continue

              selected = candidate
              break

          # ---------------------------------------------------------
          # CREATE DECISION
          # ---------------------------------------------------------

          if selected:

              decision_seed = (
                  f"{NOW.isoformat()}|"
                  f"{selected['source']}|"
                  f"{selected['target_id']}|"
                  f"{selected['action']}"
              )

              decision_id = hash_id(decision_seed)

              expires = NOW + timedelta(hours=DECISION_TTL_HOURS)

              decision = {
                  "decision_id": decision_id,
                  "timestamp": iso(NOW),
                  "expires_at": iso(expires),
                  "decision": "HIGH_PRIORITY_ACTION",
                  "status": "PENDING",
                  "action": selected["action"],
                  "assigned_act": (
                      "ACT03"
                      if selected["action"] == "OPPORTUNITY_ACTION"
                      else None
                  ),
                  "target_id": selected["target_id"],
                  "source": selected["source"],
                  "strategic_domain": selected["strategic_domain"],
                  "priority": selected["priority"],
                  "scores": {
                      "total": selected["score"],
                      "relevance": selected["relevance"],
                      "compatibility": selected["compatibility"],
                      "reward": selected["reward"],
                      "risk": selected["risk"]
                  },
                  "reason": (
                      "Highest available strategic opportunity after "
                      "applying lifecycle protection, duplicate suppression "
                      "and cooldown rules."
                  ),
                  "text": selected["text"]
              }

              decisions.append(decision)

              core["current_decision"] = decision

              learning.append({
                  "timestamp": iso(NOW),
                  "type": "DECISION_LIFECYCLE",
                  "lesson": (
                      "Core selected a new action only after excluding "
                      "active, recently expired, failed or recently executed "
                      "decisions."
                  ),
                  "selected_target": selected["target_id"],
                  "strategic_domain": selected["strategic_domain"],
                  "assigned_act": decision["assigned_act"]
              })

              outcome = "NEW_ACTION"

          else:

              # Keep the existing active decision if one exists.
              existing_active = None

              for d in reversed(decisions):

                  if not isinstance(d, dict):
                      continue

                  status = str(d.get("status", "")).upper()

                  if status not in {"PENDING", "CLAIMED", "IN_PROGRESS"}:
                      continue

                  expires_at = parse_dt(d.get("expires_at"))

                  if expires_at and expires_at > NOW:
                      existing_active = d
                      break

              if existing_active:

                  core["current_decision"] = existing_active

                  learning.append({
                      "timestamp": iso(NOW),
                      "type": "WAIT",
                      "lesson": (
                          "An active decision already exists. "
                          "Core waits for its outcome instead of "
                          "creating a duplicate decision."
                      ),
                      "decision_id": existing_active.get("decision_id"),
                      "target_id": existing_active.get("target_id")
                  })

                  outcome = "WAIT_FOR_OUTCOME"

              else:

                  wait_decision = {
                      "decision_id": hash_id(
                          f"{NOW.isoformat()}|WAIT_FOR_OUTCOME"
                      ),
                      "timestamp": iso(NOW),
                      "expires_at": iso(
                          NOW + timedelta(hours=DECISION_TTL_HOURS)
                      ),
                      "decision": "WAIT_FOR_OUTCOME",
                      "status": "WAITING",
                      "action": "NONE",
                      "assigned_act": None,
                      "target_id": None,
                      "source": "ACT05",
                      "strategic_domain": None,
                      "priority": 0,
                      "scores": {
                          "total": 0,
                          "relevance": 0,
                          "compatibility": 0,
                          "reward": 0,
                          "risk": 0
                      },
                      "reason": (
                          "No candidate is currently actionable because "
                          "available opportunities are protected by an "
                          "active decision or cooldown."
                      ),
                      "text": (
                          "WAIT: awaiting outcome or new evidence."
                      )
                  }

                  core["current_decision"] = wait_decision

                  learning.append({
                      "timestamp": iso(NOW),
                      "type": "WAIT",
                      "lesson": (
                          "Core found no eligible new action and "
                          "waited for an outcome or new evidence."
                      ),
                      "active_decisions": len(active_decisions),
                      "cooldown_decisions": len(recent_blocked)
                  })

                  outcome = "WAIT"

          # ---------------------------------------------------------
          # RUN RECORD
          # ---------------------------------------------------------

          run_record = {
              "timestamp": iso(NOW),
              "status": "SUCCESS",
              "candidates_seen": len(candidates),
              "active_decisions": len(active_decisions),
              "cooldown_decisions": len(recent_blocked),
              "skipped_active": len(skipped_active),
              "skipped_cooldown": len(skipped_cooldown),
              "outcome": outcome,
              "decision": core["current_decision"].get("decision"),
              "assigned_act": core["current_decision"].get("assigned_act"),
              "target_id": core["current_decision"].get("target_id"),
              "strategic_domain": core["current_decision"].get("strategic_domain"),
          }

          runs.append(run_record)

          # Keep memory bounded but persistent.
          core["decisions"] = decisions[-200:]
          core["runs"] = runs[-100:]
          core["learning"] = learning[-100:]
          core["candidates"] = normalized[-50:]

          # ---------------------------------------------------------
          # CAPABILITIES / SAFETY
          # ---------------------------------------------------------

          core["capabilities"] = {
              "observe": True,
              "understand": True,
              "prioritize": True,
              "decide": True,
              "assign_action": True,
              "measure": True,
              "learn": True,
              "persistent_memory": True,
              "decision_lifecycle": True,
              "duplicate_suppression": True,
              "autonomous_publication": False,
              "autonomous_comments": False,
              "marketplace": False,
              "DM": False,
              "payments": False,
              "gemini": False,
              "external_paid": False,
              "human_override": True,
              "project_cost_eur": 0
          }

          core["safety"] = {
              "payments": False,
              "transfers": False,
              "private_keys": False,
              "wallet_credentials": False,
              "DM": False,
              "automatic_purchase": False,
              "permanent_self_modification": False,
              "human_override": True
          }

          core["decision_policy"] = {
              "active_statuses": [
                  "PENDING",
                  "CLAIMED",
                  "IN_PROGRESS"
              ],
              "expired_cooldown_hours": EXPIRED_COOLDOWN_HOURS,
              "failed_cooldown_hours": FAILED_COOLDOWN_HOURS,
              "executed_cooldown_hours": EXECUTED_COOLDOWN_HOURS,
              "decision_ttl_hours": DECISION_TTL_HOURS,
              "duplicate_suppression": True,
              "wait_for_outcome": True
          }

          # ---------------------------------------------------------
          # WRITE
          # ---------------------------------------------------------

          with CORE_FILE.open("w", encoding="utf-8") as f:
              json.dump(core, f, indent=2, ensure_ascii=False)

          print("==============================================")
          print("NØX ACT 05 CORE V2")
          print("==============================================")
          print(f"Candidates:          {len(candidates)}")
          print(f"Active decisions:    {len(active_decisions)}")
          print(f"Cooldown decisions:  {len(recent_blocked)}")
          print(f"Skipped active:      {len(skipped_active)}")
          print(f"Skipped cooldown:    {len(skipped_cooldown)}")
          print(f"Outcome:             {outcome}")
          print(
              "Decision:            "
              + str(core["current_decision"].get("decision"))
          )
          print(
              "Assigned ACT:        "
              + str(core["current_decision"].get("assigned_act"))
          )
          print(
              "Target:              "
              + str(core["current_decision"].get("target_id"))
          )
          print("==============================================")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_core_decision.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT05 CORE V2 decision lifecycle"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0

            echo "Push attempt $i failed, retrying..."
            git rebase --abort || true
            sleep 2
          done

          echo "Unable to push after retries."
          exit 1
