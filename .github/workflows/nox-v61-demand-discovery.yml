name: NØX Origin - V61 Demand Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demand-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Run V61
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/nox_v61.py <<'PY'
          import os
          import json
          import re
          from datetime import datetime, timezone
          import requests

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          BASE_URL = "https://thecolony.ai/api/v1"

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json"
          })

          # ---------------------------------------------------------
          # AUTHENTICATION
          # ---------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print("Auth status:", auth.status_code)

          if auth.status_code != 200:
              print(auth.text[:2000])
              raise RuntimeError("Authentication failed")

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError("JWT token not found")

          session.headers["Authorization"] = f"Bearer {token}"

          # ---------------------------------------------------------
          # MARKETPLACE
          # ---------------------------------------------------------

          response = session.get(
              f"{BASE_URL}/marketplace/tasks",
              params={
                  "status": "open",
                  "sort": "new",
                  "limit": 100,
                  "offset": 0
              },
              timeout=30
          )

          print("Marketplace status:", response.status_code)

          if response.status_code != 200:
              print(response.text[:3000])
              raise RuntimeError("Marketplace request failed")

          data = response.json()

          if isinstance(data, list):
              items = data
          elif isinstance(data, dict):
              items = (
                  data.get("tasks")
                  or data.get("items")
                  or data.get("results")
                  or data.get("data")
                  or []
              )
          else:
              items = []

          print("Marketplace items:", len(items))

          # ---------------------------------------------------------
          # DEMAND SIGNALS
          # ---------------------------------------------------------

          DEMAND_PATTERNS = [
              r"\bi need\b",
              r"\bwe need\b",
              r"\blooking for\b",
              r"\bneed someone\b",
              r"\bcan someone\b",
              r"\bseeking\b",
              r"\bhelp wanted\b",
              r"\bwant someone\b",
              r"\bneed a developer\b",
              r"\bneed an agent\b",
              r"\bneed a bot\b",
              r"\bneed this built\b",
              r"\bbuild this for me\b",
              r"\bplease build\b",
              r"\bplease create\b",
              r"\bpaid task\b",
              r"\bpaid work\b",
              r"\bbounty\b",
              r"\breward\b",
              r"\bcommission\b",
              r"\bwho can\b"
          ]

          # ---------------------------------------------------------
          # SUPPLY / SERVICE SIGNALS
          # ---------------------------------------------------------

          SUPPLY_PATTERNS = [
              r"\bfor hire\b",
              r"\boffering\b",
              r"\bi can\b",
              r"\bi will\b",
              r"\bavailable for hire\b",
              r"\bservices\b",
              r"\bmy services\b",
              r"\bhire me\b",
              r"\bfreelance\b",
              r"\bproviding\b"
          ]

          META_PATTERNS = [
              r"\btest posting\b",
              r"\btest post\b",
              r"\bui test\b",
              r"\btesting\b"
          ]

          ECONOMIC_PATTERNS = [
              r"\bsats?\b",
              r"\bsatoshi\b",
              r"\blightning\b",
              r"\bbitcoin\b",
              r"\bbtc\b",
              r"\busdc\b",
              r"\busdt\b",
              r"\busd\b",
              r"\bpayment\b",
              r"\bpaid\b",
              r"\breward\b",
              r"\bbounty\b",
              r"\bpay\b"
          ]

          CAPABILITY_PATTERNS = {
              "python": r"\bpython\b",
              "api": r"\bapi\b|\bopenapi\b",
              "automation": r"\bautomation\b|\bautomate\b",
              "research": r"\bresearch\b|\banalysis\b",
              "data": r"\bdata\b|\bscraping\b|\bscrape\b",
              "writing": r"\bwriting\b|\bdocumentation\b",
              "coding": r"\bcoding\b|\bdeveloper\b|\bdevelopment\b",
              "verification": r"\bverification\b|\bqa\b"
          }

          def get_text(item):
              title = str(
                  item.get("title")
                  or item.get("name")
                  or ""
              )

              description = str(
                  item.get("description")
                  or item.get("body")
                  or item.get("content")
                  or ""
              )

              return title, description, f"{title}\n{description}"

          def find_matches(patterns, text):
              return [
                  p for p in patterns
                  if re.search(p, text, re.IGNORECASE)
              ]

          def find_capabilities(text):
              found = []

              for name, pattern in CAPABILITY_PATTERNS.items():
                  if re.search(pattern, text, re.IGNORECASE):
                      found.append(name)

              return found

          demands = []
          rejected = []

          # ---------------------------------------------------------
          # ANALYSIS
          # ---------------------------------------------------------

          for item in items:

              title, description, text = get_text(item)

              demand_hits = find_matches(
                  DEMAND_PATTERNS,
                  text
              )

              supply_hits = find_matches(
                  SUPPLY_PATTERNS,
                  text
              )

              meta_hits = find_matches(
                  META_PATTERNS,
                  text
              )

              economic_hits = find_matches(
                  ECONOMIC_PATTERNS,
                  text
              )

              capabilities = find_capabilities(text)

              score = 0

              score += min(
                  len(demand_hits) * 6,
                  18
              )

              score += min(
                  len(economic_hits) * 2,
                  6
              )

              score += min(
                  len(capabilities) * 2,
                  6
              )

              score -= min(
                  len(supply_hits) * 10,
                  30
              )

              if meta_hits:
                  score -= 30

              # -----------------------------------------------------
              # CLASSIFICATION
              # -----------------------------------------------------

              if meta_hits:

                  classification = "META_OR_TEST"
                  confidence = 9
                  qualified = False

              elif supply_hits and not demand_hits:

                  classification = "SERVICE_OFFER"
                  confidence = 10
                  qualified = False

              elif demand_hits and score >= 15:

                  classification = "REAL_DEMAND"
                  confidence = min(
                      10,
                      6 + score // 10
                  )
                  qualified = True

              elif demand_hits and score >= 8:

                  classification = "POTENTIAL_DEMAND"
                  confidence = 6
                  qualified = False

              elif demand_hits:

                  classification = "UNCLEAR_DEMAND"
                  confidence = 4
                  qualified = False

              else:

                  classification = "NOT_DEMAND"
                  confidence = 8
                  qualified = False

              requester = (
                  item.get("author")
                  or item.get("author_name")
                  or item.get("username")
                  or item.get("creator")
                  or item.get("agent")
                  or "unknown"
              )

              item_id = (
                  item.get("id")
                  or item.get("task_id")
                  or item.get("uuid")
                  or ""
              )

              record = {
                  "id": item_id,
                  "title": title,
                  "requester": requester,
                  "classification": classification,
                  "confidence": confidence,
                  "score": score,
                  "qualified": qualified,
                  "reward_evidence": bool(economic_hits),
                  "demand_signals": demand_hits,
                  "supply_signals": supply_hits,
                  "economic_signals": economic_hits,
                  "capabilities": capabilities,
                  "description": description[:2000]
              }

              if qualified:
                  demands.append(record)
              else:
                  rejected.append(record)

          # ---------------------------------------------------------
          # RANK DEMANDS
          # ---------------------------------------------------------

          demands.sort(
              key=lambda x: (
                  x["score"],
                  x["confidence"],
                  len(x["economic_signals"])
              ),
              reverse=True
          )

          # ---------------------------------------------------------
          # RECOMMENDATION
          # ---------------------------------------------------------

          if demands:

              top = demands[0]

              recommendation = {
                  "action": "MANUAL_REVIEW_REQUIRED",
                  "reason": (
                      "A genuine buyer/requester demand was detected. "
                      "NØX must not contact or act automatically."
                  ),
                  "top_demand_id": top["id"],
                  "top_demand_score": top["score"]
              }

          else:

              recommendation = {
                  "action": "NO_ACTION",
                  "reason": (
                      "No sufficiently reliable buyer demand "
                      "was detected."
                  ),
                  "top_demand_id": None,
                  "top_demand_score": 0
              }

          # ---------------------------------------------------------
          # MEMORY
          # ---------------------------------------------------------

          result = {
              "version": "V61",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "demand_discovery_only",
              "actions_taken": [],
              "gemini_used": False,
              "total_raw_items": len(items),
              "real_demands": len(demands),
              "rejected_or_unclear": len(rejected),
              "recommendation": recommendation,
              "demands": demands,
              "rejected_items": rejected
          }

          os.makedirs("memory", exist_ok=True)

          with open(
              "memory/nox_v61_demand.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ---------------------------------------------------------
          # LOG
          # ---------------------------------------------------------

          print("")
          print("========== NØX V61 ==========")
          print("Raw items:", len(items))
          print("REAL DEMANDS:", len(demands))
          print("Rejected:", len(rejected))
          print("Gemini:", False)
          print("Actions:", [])
          print(
              "Recommendation:",
              recommendation["action"]
          )

          if demands:

              print("")
              print("TOP REAL DEMAND")
              print("Title:", demands[0]["title"])
              print(
                  "Requester:",
                  demands[0]["requester"]
              )
              print(
                  "Score:",
                  demands[0]["score"]
              )
              print(
                  "Confidence:",
                  demands[0]["confidence"]
              )

          else:

              print("")
              print("NO RELIABLE BUYER DEMAND DETECTED")

          print("==============================")

          PY

          python /tmp/nox_v61.py

      - name: Commit V61 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v61_demand.json

          if git diff --cached --quiet; then
            echo "No V61 memory changes."
          else
            git commit -m "NØX V61 demand discovery"
            git push
          fi
