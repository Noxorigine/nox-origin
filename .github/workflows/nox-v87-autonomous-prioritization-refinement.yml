name: NØX V87 Autonomous Prioritization Refinement

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v87-autonomous-prioritization-refinement
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V87
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("body", "content", "text", "title"):
                      if isinstance(value.get(key), str):
                          return value[key]
              return str(value)

          # ------------------------------------------------------------
          # 1. Load accumulated learning
          # ------------------------------------------------------------

          v75 = load(
              f"{MEMORY}/nox_v75_evidence_weighted_opportunity_detector.json"
          )

          v76 = load(
              f"{MEMORY}/nox_v76_contextual_opportunity_verifier.json"
          )

          v77 = load(
              f"{MEMORY}/nox_v77_action_readiness_engine.json"
          )

          v79 = load(
              f"{MEMORY}/nox_v79_action_result_learning.json"
          )

          v80 = load(
              f"{MEMORY}/nox_v80_adaptive_decision_learning.json"
          )

          v81 = load(
              f"{MEMORY}/nox_v81_adaptive_action_prioritization.json"
          )

          v82 = load(
              f"{MEMORY}/nox_v82_autonomous_action_selection.json"
          )

          v83 = load(
              f"{MEMORY}/nox_v83_autonomous_action_execution.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          v85 = load(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json"
          )

          v86 = load(
              f"{MEMORY}/nox_v86_adaptive_strategy_live_test.json"
          )

          # ------------------------------------------------------------
          # 2. Extract historical outcome signals
          # ------------------------------------------------------------

          outcome_history = []

          for source_name, data in (
              ("V79", v79),
              ("V84", v84)
          ):
              outcome = data.get("outcome") or {}

              if outcome:
                  outcome_history.append({
                      "source": source_name,
                      "status": outcome.get("status"),
                      "positive_signals": outcome.get(
                          "positive_signals", 0
                      ),
                      "negative_signals": outcome.get(
                          "negative_signals", 0
                      ),
                      "work_signals": outcome.get(
                          "new_opportunity_signals", 0
                      ),
                      "payment_signals": outcome.get(
                          "payment_signals", 0
                      ),
                      "response_count": outcome.get(
                          "response_count", 0
                      )
                  })

          # ------------------------------------------------------------
          # 3. Extract V86 live test
          # ------------------------------------------------------------

          evaluation = v86.get("evaluation") or {}
          test = v86.get("test") or {}

          live_total = int(
              evaluation.get("total_ranked", 0) or 0
          )

          live_high = int(
              evaluation.get("high_confidence_opportunities", 0) or 0
          )

          live_strong = int(
              evaluation.get("strong_candidates", 0) or 0
          )

          live_contextual = int(
              evaluation.get("contextual_opportunities", 0) or 0
          )

          live_low = int(
              evaluation.get("low_priority_signals", 0) or 0
          )

          average_score = float(
              evaluation.get("average_score", 0) or 0
          )

          over_pruning = bool(
              evaluation.get("over_pruning_warning", False)
          )

          live_test_result = str(
              test.get("result") or "UNKNOWN"
          )

          # ------------------------------------------------------------
          # 4. Determine cumulative evidence
          # ------------------------------------------------------------

          positive_history = 0
          negative_history = 0
          opportunity_history = 0
          payment_history = 0
          no_response_history = 0

          for item in outcome_history:
              status = str(item.get("status") or "")

              if status == "POSITIVE_SIGNAL":
                  positive_history += 1

              if status == "NEGATIVE_SIGNAL":
                  negative_history += 1

              if status == "POTENTIAL_WORK_OPPORTUNITY":
                  opportunity_history += 1

              if status == "PAYMENT_SIGNAL":
                  payment_history += 1

              if status == "NO_RESPONSE":
                  no_response_history += 1

          # ------------------------------------------------------------
          # 5. Build refined strategy
          # ------------------------------------------------------------

          refined_rules = [
              {
                  "rule": "EVIDENCE_CONVERGENCE",
                  "priority": "VERY_HIGH",
                  "effect": "Prefer opportunities supported by multiple independent signals."
              },
              {
                  "rule": "EXPLICIT_DELEGATION",
                  "priority": "VERY_HIGH",
                  "effect": "Increase priority when someone clearly asks another agent/person to perform work."
              },
              {
                  "rule": "DELIVERABLE_AND_ACCEPTANCE",
                  "priority": "VERY_HIGH",
                  "effect": "Prefer requests with a concrete deliverable and verifiable acceptance criteria."
              },
              {
                  "rule": "APPLICATION_ROUTE",
                  "priority": "HIGH",
                  "effect": "Prefer opportunities where the way to respond or apply is identifiable."
              },
              {
                  "rule": "COMPLETION_EXCLUSION",
                  "priority": "VERY_HIGH",
                  "effect": "Strongly reduce priority when work is already completed."
              },
              {
                  "rule": "ANALYSIS_SEPARATION",
                  "priority": "HIGH",
                  "effect": "Do not confuse analysis, findings or completed work with an open request."
              },
              {
                  "rule": "ATYPICAL_SIGNAL_PRESERVATION",
                  "priority": "HIGH",
                  "effect": "Do not eliminate unusual opportunities merely because they lack standard wording."
              },
              {
                  "rule": "NO_RESPONSE_HANDLING",
                  "priority": "HIGH",
                  "effect": "Do not classify silence as a negative outcome."
              },
              {
                  "rule": "PAYMENT_VERIFICATION",
                  "priority": "VERY_HIGH",
                  "effect": "Payment language is a signal only; settlement requires independent verification."
              },
              {
                  "rule": "PRIMARY_SOURCE",
                  "priority": "VERY_HIGH",
                  "effect": "Verify consequential evidence directly from The Colony before acting."
              }
          ]

          # ------------------------------------------------------------
          # 6. Generate autonomous refinements
          # ------------------------------------------------------------

          refinements = []

          if live_high > 0:
              refinements.append({
                  "type": "PRIORITY_INCREASE",
                  "target": "high_confidence_opportunities",
                  "reason": "Live testing produced high-confidence opportunity signals.",
                  "strength": "HIGH"
              })

          elif live_strong > 0:
              refinements.append({
                  "type": "PRIORITY_MAINTAIN",
                  "target": "strong_opportunity_candidates",
                  "reason": "Live testing produced strong candidates but not enough evidence for maximum confidence.",
                  "strength": "MEDIUM"
              })

          elif live_contextual > 0:
              refinements.append({
                  "type": "MORE_VERIFICATION",
                  "target": "contextual_opportunities",
                  "reason": "Signals exist but require additional context before autonomous action.",
                  "strength": "MEDIUM"
              })

          else:
              refinements.append({
                  "type": "OBSERVE",
                  "target": "current_live_sample",
                  "reason": "No strong opportunity was observed in the current live sample.",
                  "strength": "LOW"
              })

          if over_pruning:
              refinements.append({
                  "type": "REDUCE_PRUNING",
                  "target": "low_priority_filter",
                  "reason": "The live sample contains a high proportion of low-priority results.",
                  "strength": "HIGH"
              })
          else:
              refinements.append({
                  "type": "MAINTAIN_PRUNING",
                  "target": "low_priority_filter",
                  "reason": "No immediate over-pruning signal was detected.",
                  "strength": "MEDIUM"
              })

          # ------------------------------------------------------------
          # 7. Economic learning remains conservative
          # ------------------------------------------------------------

          economic_learning = {
              "payment_signals_observed": payment_history,
              "verified_settlements": 0,
              "economic_conclusion": (
                  "No verified economic result is established by the current learning chain."
              ),
              "rule": (
                  "Never treat reward or payment language as proof of received funds."
              )
          }

          # ------------------------------------------------------------
          # 8. Prevent premature permanent rule changes
          # ------------------------------------------------------------

          blocked_changes = [
              "Permanent score changes based on a single observation.",
              "Automatic deployment of new opportunity-detection rules.",
              "Automatic removal of atypical opportunity patterns.",
              "Treating no response as failure.",
              "Treating declared rewards as verified payment.",
              "Acting on stale decisions without fresh source verification."
          ]

          # ------------------------------------------------------------
          # 9. Calculate maturity of the adaptive strategy
          # ------------------------------------------------------------

          evidence_points = 0

          if live_high > 0:
              evidence_points += 3
          elif live_strong > 0:
              evidence_points += 2
          elif live_contextual > 0:
              evidence_points += 1

          if positive_history > 0:
              evidence_points += 1

          if opportunity_history > 0:
              evidence_points += 2

          if negative_history > 0:
              evidence_points += 1

          if live_total >= 5:
              evidence_points += 1

          if not over_pruning:
              evidence_points += 1

          if evidence_points >= 7:
              maturity = "STRONG_ADAPTIVE_SIGNAL"

          elif evidence_points >= 4:
              maturity = "EMERGING_ADAPTIVE_SIGNAL"

          elif evidence_points >= 2:
              maturity = "EARLY_ADAPTIVE_SIGNAL"

          else:
              maturity = "INSUFFICIENT_ADAPTIVE_EVIDENCE"

          # ------------------------------------------------------------
          # 10. Decide what V87 authorizes for future versions
          # ------------------------------------------------------------

          if maturity == "STRONG_ADAPTIVE_SIGNAL":
              future_authority = "USE_AS_PRIORITY_SIGNAL"

          elif maturity == "EMERGING_ADAPTIVE_SIGNAL":
              future_authority = "USE_WITH_CAUTION"

          elif maturity == "EARLY_ADAPTIVE_SIGNAL":
              future_authority = "OBSERVE_AND_ACCUMULATE"

          else:
              future_authority = "DO_NOT_RELY_ON_ADAPTATION"

          # ------------------------------------------------------------
          # 11. Build final V87 record
          # ------------------------------------------------------------

          result = {
              "version": "V87",
              "generated_at": now(),
              "mode": "autonomous_prioritization_refinement",
              "agent": {
                  "username": "nox_origine"
              },
              "learning_chain": {
                  "decision": bool(v82),
                  "execution": bool(v83),
                  "result_learning": bool(v84),
                  "strategy_adaptation": bool(v85),
                  "live_strategy_test": bool(v86)
              },
              "historical_outcomes": outcome_history,
              "live_test": {
                  "result": live_test_result,
                  "total_candidates": live_total,
                  "high_confidence": live_high,
                  "strong_candidates": live_strong,
                  "contextual": live_contextual,
                  "low_priority": live_low,
                  "average_score": average_score,
                  "over_pruning_warning": over_pruning
              },
              "refined_strategy": {
                  "rules": refined_rules,
                  "refinements": refinements
              },
              "economic_learning": economic_learning,
              "blocked_changes": blocked_changes,
              "adaptive_maturity": {
                  "evidence_points": evidence_points,
                  "level": maturity,
                  "future_authority": future_authority
              },
              "learning": {
                  "conclusions": [
                      "Strategy adaptation should be based on repeated evidence rather than isolated outcomes.",
                      "Live opportunity data is required to validate adaptive changes.",
                      "Evidence quality remains more important than raw opportunity count.",
                      "Atypical opportunities must remain recoverable.",
                      "Silence must not be treated as failure.",
                      "Economic claims require independent verification.",
                      "Primary-source verification remains mandatory before consequential action."
                  ],
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V83-EXECUTION-RESULT-REQUIRES-PRIMARY-SOURCE",
                      "REG-V84-OUTCOME-MUST-BE-OBSERVED-BEFORE-ADAPTATION",
                      "REG-V85-STRATEGY-REQUIRES-LIVE-VALIDATION",
                      "REG-V86-LIVE-TEST-REQUIRES-REPEATED-EVIDENCE"
                  ]
              },
              "decision": {
                  "answer_status": "ADAPTIVE_STRATEGY_REFINED",
                  "confidence": (
                      0.90
                      if maturity == "STRONG_ADAPTIVE_SIGNAL"
                      else 0.80
                      if maturity == "EMERGING_ADAPTIVE_SIGNAL"
                      else 0.68
                      if maturity == "EARLY_ADAPTIVE_SIGNAL"
                      else 0.45
                  ),
                  "automatic_rule_deployment": False,
                  "future_versions_may_use_strategy": True
              },
              "autonomy": {
                  "historical_learning": True,
                  "live_validation": True,
                  "strategy_refinement": True,
                  "autonomous_priority_signal": True,
                  "automatic_rule_deployment": False,
                  "external_action": False
              },
              "next_stage": {
                  "version": "V88",
                  "purpose": "Allow NØX to compare its refined strategy with its own autonomous decisions and identify systematic decision errors."
              },
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          save(
              f"{MEMORY}/nox_v87_autonomous_prioritization_refinement.json",
              result
          )

          # ------------------------------------------------------------
          # 12. Markdown report
          # ------------------------------------------------------------

          md = []

          md.append("# NØX V87 — Autonomous Prioritization Refinement")
          md.append("")
          md.append(f"Generated: {result['generated_at']}")
          md.append("")
          md.append("## Adaptive maturity")
          md.append("")
          md.append(f"- Level: {maturity}")
          md.append(f"- Evidence points: {evidence_points}")
          md.append(f"- Future authority: {future_authority}")
          md.append("")
          md.append("## V86 live test")
          md.append("")
          md.append(f"- Result: {live_test_result}")
          md.append(f"- Candidates: {live_total}")
          md.append(f"- High confidence: {live_high}")
          md.append(f"- Strong candidates: {live_strong}")
          md.append(f"- Contextual: {live_contextual}")
          md.append(f"- Low priority: {live_low}")
          md.append(f"- Average score: {average_score}")
          md.append(f"- Over-pruning warning: {over_pruning}")
          md.append("")
          md.append("## Strategy refinements")
          md.append("")

          for item in refinements:
              md.append(
                  f"- {item['type']}: {item['target']} — {item['reason']}"
              )

          md.append("")
          md.append("## Core strategy")
          md.append("")

          for rule in refined_rules:
              md.append(
                  f"- **{rule['priority']}** "
                  f"{rule['rule']}: {rule['effect']}"
              )

          md.append("")
          md.append("## Economic learning")
          md.append("")
          md.append(
              "- No verified economic result is established by the current learning chain."
          )
          md.append(
              "- Payment language remains an unverified signal until independently confirmed."
          )
          md.append("")
          md.append("## Changes blocked")
          md.append("")

          for item in blocked_changes:
              md.append(f"- {item}")

          md.append("")
          md.append("## Autonomy")
          md.append("")
          md.append("- Historical learning: enabled")
          md.append("- Live validation: enabled")
          md.append("- Strategy refinement: enabled")
          md.append("- Autonomous priority signal: enabled")
          md.append("- Automatic rule deployment: disabled")
          md.append("- External action: disabled")
          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V88 — Compare the refined strategy with autonomous decisions and identify systematic decision errors."
          )
          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v87_autonomous_prioritization_refinement.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V87
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v87_autonomous_prioritization_refinement.json
          git add memory/nox_v87_autonomous_prioritization_refinement.md

          git diff --cached --quiet || \
            git commit -m "NØX V87 autonomous prioritization refinement"

          git push
