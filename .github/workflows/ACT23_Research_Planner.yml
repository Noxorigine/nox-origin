name: NØX ACT23 - Research Planner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  research-planner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACT23 - Research Planner
        run: |
          python -u <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"
          INPUT_FILE = MEMORY_DIR / "nox_act_22_curiosity.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_23_research_plan.json"

          MAX_RESEARCH_PLANS = 10

          DOMAIN_GUIDANCE = {
              "virtual_economy": {
                  "question_focus": [
                      "mechanism",
                      "rules",
                      "risks",
                      "incentives",
                      "economic consequences"
                  ],
                  "preferred_sources": [
                      "official documentation",
                      "primary technical sources",
                      "protocol documentation",
                      "reliable analytical sources"
                  ]
              },

              "cybersecurity": {
                  "question_focus": [
                      "security mechanism",
                      "threat model",
                      "attack surface",
                      "mitigation",
                      "limitations"
                  ],
                  "preferred_sources": [
                      "official security documentation",
                      "security advisories",
                      "standards",
                      "primary technical research"
                  ]
              },

              "ai_communities": {
                  "question_focus": [
                      "interaction mechanism",
                      "social behavior",
                      "coordination",
                      "trust",
                      "reputation"
                  ],
                  "preferred_sources": [
                      "platform documentation",
                      "primary observations",
                      "technical documentation",
                      "independent analysis"
                  ]
              },

              "agent_intelligence_autonomy": {
                  "question_focus": [
                      "agent behavior",
                      "attention",
                      "memory",
                      "decision-making",
                      "learning",
                      "autonomy"
                  ],
                  "preferred_sources": [
                      "primary research",
                      "technical documentation",
                      "academic papers",
                      "reliable technical analysis"
                  ]
              },

              "emerging_tech": {
                  "question_focus": [
                      "technology mechanism",
                      "capabilities",
                      "limitations",
                      "adoption",
                      "implications"
                  ],
                  "preferred_sources": [
                      "official documentation",
                      "primary research",
                      "technical papers",
                      "reliable analysis"
                  ]
              },

              "laws_regulation": {
                  "question_focus": [
                      "applicable rule",
                      "scope",
                      "obligations",
                      "rights",
                      "liability"
                  ],
                  "preferred_sources": [
                      "government sources",
                      "official legal texts",
                      "regulators",
                      "recognized legal analysis"
                  ]
              },

              "science": {
                  "question_focus": [
                      "mechanism",
                      "evidence",
                      "measurement",
                      "limitations",
                      "consensus"
                  ],
                  "preferred_sources": [
                      "peer-reviewed research",
                      "academic institutions",
                      "primary studies",
                      "scientific databases"
                  ]
              },

              "history": {
                  "question_focus": [
                      "event",
                      "cause",
                      "chronology",
                      "evidence",
                      "historical interpretation"
                  ],
                  "preferred_sources": [
                      "primary historical sources",
                      "academic research",
                      "recognized institutions",
                      "reliable historical references"
                  ]
              },

              "programming": {
                  "question_focus": [
                      "implementation",
                      "behavior",
                      "limitations",
                      "compatibility",
                      "security"
                  ],
                  "preferred_sources": [
                      "official documentation",
                      "source repositories",
                      "standards",
                      "technical references"
                  ]
              },

              "current_events": {
                  "question_focus": [
                      "what happened",
                      "when",
                      "who is involved",
                      "evidence",
                      "uncertainty"
                  ],
                  "preferred_sources": [
                      "primary statements",
                      "official sources",
                      "reputable reporting",
                      "independent verification"
                  ]
              },

              "unclassified": {
                  "question_focus": [
                      "definition",
                      "mechanism",
                      "evidence",
                      "limitations"
                  ],
                  "preferred_sources": [
                      "primary sources",
                      "official documentation",
                      "reliable independent sources"
                  ]
              }
          }

          def normalize(text):
              text = str(text).lower()
              text = text.replace("’", "'")
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def clean_concept(text):
              text = normalize(text)

              # Remove fragments that are clearly structural.
              text = re.sub(
                  r"\b(?:whether|does|do|doesn't|don't|is|are|was|were)\b",
                  " ",
                  text
              )

              text = re.sub(r"\s+", " ", text).strip()

              return text

          def stable_id(domain, concept):
              raw = f"ACT23|{domain}|{normalize(concept)}"
              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:16]

          def tokens(text):
              return [
                  w for w in re.findall(
                      r"[a-zA-ZÀ-ÿ'-]+",
                      normalize(text)
                  )
                  if len(w) >= 4
              ]

          def key_terms(concept, contexts):
              combined = " ".join(
                  [concept] +
                  [str(x) for x in contexts]
              )

              words = tokens(combined)

              blocked = {
                  "this", "that", "with", "from", "about",
                  "into", "when", "where", "what", "which",
                  "would", "could", "should", "have", "been",
                  "being", "there", "their", "they", "them",
                  "then", "than", "only", "also", "more",
                  "some", "very", "just", "need", "needs",
                  "know", "knows", "understand", "attention",
                  "source", "sources", "state", "everything"
              }

              result = []

              for word in words:
                  if word in blocked:
                      continue

                  if word not in result:
                      result.append(word)

              return result[:8]

          def build_question(domain, concept, terms):
              """
              Build a researchable question without pretending to know
              the answer. ACT23 defines what must be investigated.
              """

              c = normalize(concept)

              if domain == "virtual_economy":
                  return (
                      f"What is known about {c}, how does it work, "
                      f"what evidence supports the explanation, and "
                      f"what limitations or uncertainties remain?"
                  )

              if domain == "cybersecurity":
                  return (
                      f"How does {c} work from a security perspective, "
                      f"what threats or failure modes are relevant, "
                      f"and what evidence supports the current understanding?"
                  )

              if domain == "ai_communities":
                  return (
                      f"How does {c} work in AI-agent communities, "
                      f"what mechanisms influence it, and what evidence "
                      f"supports the current understanding?"
                  )

              if domain == "agent_intelligence_autonomy":
                  return (
                      f"How should {c} be understood in the context of "
                      f"AI-agent intelligence and autonomy, what mechanisms "
                      f"are involved, and what evidence supports the answer?"
                  )

              if domain == "laws_regulation":
                  return (
                      f"What rules or legal principles apply to {c}, "
                      f"what is their scope, and what authoritative evidence "
                      f"supports the interpretation?"
                  )

              if domain == "science":
                  return (
                      f"What does reliable scientific evidence show about "
                      f"{c}, what mechanism explains it, and what remains "
                      f"uncertain?"
                  )

              if domain == "history":
                  return (
                      f"What reliable evidence explains {c}, what is the "
                      f"established chronology or cause, and what remains "
                      f"historically disputed?"
                  )

              if domain == "programming":
                  return (
                      f"How does {c} work technically, what are its "
                      f"implementation constraints, and what documentation "
                      f"or evidence can verify the answer?"
                  )

              if domain == "current_events":
                  return (
                      f"What reliable evidence establishes the current "
                      f"facts concerning {c}, and what remains uncertain?"
                  )

              return (
                  f"What is reliably known about {c}, how does it work, "
                  f"what evidence supports that knowledge, and what "
                  f"uncertainties remain?"
              )

          def build_subquestions(domain, concept, terms):
              main = normalize(concept)

              questions = [
                  f"What exactly does {main} mean in this context?",
                  f"How does {main} work?",
                  f"What evidence supports the current understanding of {main}?",
                  f"What are the important limitations, exceptions, or uncertainties?"
              ]

              if domain == "agent_intelligence_autonomy":
                  questions.append(
                      f"How could the answer affect an autonomous AI agent?"
                  )

              elif domain == "virtual_economy":
                  questions.append(
                      f"What incentives, risks, or economic consequences are involved?"
                  )

              elif domain == "cybersecurity":
                  questions.append(
                      f"What security risks and mitigations are relevant?"
                  )

              elif domain == "ai_communities":
                  questions.append(
                      f"How could this affect interaction, trust, or coordination between agents?"
                  )

              elif domain == "laws_regulation":
                  questions.append(
                      f"Which authoritative legal or regulatory sources should be checked?"
                  )

              return questions[:5]

          def build_verification_criteria(domain):
              criteria = [
                  "The answer must be supported by identifiable sources.",
                  "Facts must be separated from interpretation or speculation.",
                  "Conflicting evidence must be recorded rather than silently resolved.",
                  "The date and context of important evidence must be considered."
              ]

              if domain == "laws_regulation":
                  criteria.append(
                      "Prefer authoritative legal or governmental sources."
                  )

              elif domain == "cybersecurity":
                  criteria.append(
                      "Prefer primary security documentation and technical evidence."
                  )

              elif domain == "science":
                  criteria.append(
                      "Prefer peer-reviewed or primary scientific evidence."
                  )

              elif domain == "current_events":
                  criteria.append(
                      "Prefer recent primary sources and independent confirmation."
                  )

              else:
                  criteria.append(
                      "Prefer primary or official sources when available."
                  )

              return criteria

          def build_search_strategy(domain, concept, terms):
              guidance = DOMAIN_GUIDANCE.get(
                  domain,
                  DOMAIN_GUIDANCE["unclassified"]
              )

              queries = []

              # Main conceptual query.
              queries.append(
                  f'"{concept}" explained evidence'
              )

              # Mechanism query.
              queries.append(
                  f'"{concept}" how it works'
              )

              # Verification query.
              queries.append(
                  f'"{concept}" limitations uncertainty'
              )

              if domain == "laws_regulation":
                  queries.append(
                      f'"{concept}" official regulation law'
                  )

              elif domain == "cybersecurity":
                  queries.append(
                      f'"{concept}" security threat mitigation'
                  )

              elif domain == "science":
                  queries.append(
                      f'"{concept}" scientific evidence study'
                  )

              elif domain == "agent_intelligence_autonomy":
                  queries.append(
                      f'"{concept}" AI agents autonomy research'
                  )

              elif domain == "virtual_economy":
                  queries.append(
                      f'"{concept}" incentives risks economics'
                  )

              return {
                  "recommended_queries": queries[:5],
                  "preferred_source_types": guidance[
                      "preferred_sources"
                  ],
                  "focus_areas": guidance[
                      "question_focus"
                  ]
              }

          # ------------------------------------------------------------
          # Load ACT22
          # ------------------------------------------------------------

          print("NØX ACT23 - Research Planner")
          print("Mode: RESEARCH PLANNING ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Research executed: false")
          print("Web search executed: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")

          if not INPUT_FILE.exists():
              raise SystemExit(
                  "ERROR: ACT22 memory file not found: "
                  f"{INPUT_FILE}"
              )

          try:
              act22 = json.loads(
                  INPUT_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: Cannot read ACT22 output: {exc}"
              )

          queue = act22.get("attention_queue", [])

          if not isinstance(queue, list):
              raise SystemExit(
                  "ERROR: ACT22 attention_queue is not a list."
              )

          print(
              f"Curiosity targets received from ACT22: "
              f"{len(queue)}"
          )

          # ------------------------------------------------------------
          # Build research plans
          # ------------------------------------------------------------

          plans = []

          for item in queue[:MAX_RESEARCH_PLANS]:

              if not isinstance(item, dict):
                  continue

              if item.get("attention_decision") not in {
                  "EXPLORE",
                  "WATCH"
              }:
                  continue

              domain = str(
                  item.get("domain", "unclassified")
              ).strip()

              raw_concept = str(
                  item.get("concept", "")
              ).strip()

              if not raw_concept:
                  continue

              concept = clean_concept(raw_concept)

              if not concept:
                  continue

              contexts = item.get("contexts", [])

              terms = key_terms(
                  concept,
                  contexts
              )

              main_question = build_question(
                  domain,
                  concept,
                  terms
              )

              subquestions = build_subquestions(
                  domain,
                  concept,
                  terms
              )

              verification = build_verification_criteria(
                  domain
              )

              strategy = build_search_strategy(
                  domain,
                  concept,
                  terms
              )

              curiosity_score = int(
                  item.get("curiosity_score", 0) or 0
              )

              urgency = (
                  "high"
                  if curiosity_score >= 80
                  else "medium"
                  if curiosity_score >= 65
                  else "low"
              )

              plans.append({
                  "id": stable_id(
                      domain,
                      concept
                  ),

                  "source_act": "ACT22",

                  "domain": domain,

                  "curiosity_target": concept,

                  "curiosity_score": curiosity_score,

                  "research_priority": urgency,

                  "research_question": main_question,

                  "subquestions": subquestions,

                  "key_terms": terms,

                  "research_strategy": strategy,

                  "verification_criteria": verification,

                  "expected_output": {
                      "answer_type": "evidence_based_knowledge",
                      "must_include": [
                          "verified_facts",
                          "source_evidence",
                          "uncertainties",
                          "conflicting_claims_if_any",
                          "confidence_assessment"
                      ]
                  },

                  "constraints": {
                      "no_guessing": True,
                      "no_unverified_claims": True,
                      "record_uncertainty": True,
                      "record_conflicts": True,
                      "prefer_primary_sources": True
                  },

                  "status": "PLANNED_NOT_RESEARCHED"
              })

          # Highest curiosity first.
          plans.sort(
              key=lambda x: (
                  x["curiosity_score"],
                  x["research_priority"]
              ),
              reverse=True
          )

          # ------------------------------------------------------------
          # Output
          # ------------------------------------------------------------

          result = {
              "act": "ACT23",
              "version": "V1",
              "name": "Research Planner",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "mode": "research_planning_only",

              "policy": {
                  "gemini": False,
                  "external_ai": False,
                  "api_calls": False,
                  "research_executed": False,
                  "web_search_executed": False,
                  "verification_executed": False,
                  "knowledge_integration": False,
                  "decision_execution": False,
                  "marketplace_actions": False,
                  "publishing": False,
                  "comments": False,
                  "private_messages": False,
                  "bids": False,
                  "payments": False,
                  "project_cost_eur": 0,

                  "principle": (
                      "ACT23 defines what must be researched and how "
                      "the answer should be verified. It does not "
                      "perform the research."
                  )
              },

              "input": {
                  "source": str(INPUT_FILE),
                  "targets_received": len(queue)
              },

              "analysis": {
                  "research_plans_created": len(plans),
                  "high_priority": sum(
                      1 for p in plans
                      if p["research_priority"] == "high"
                  ),
                  "medium_priority": sum(
                      1 for p in plans
                      if p["research_priority"] == "medium"
                  ),
                  "low_priority": sum(
                      1 for p in plans
                      if p["research_priority"] == "low"
                  )
              },

              "research_queue": plans,

              "next_act": {
                  "target": "ACT24",
                  "role": (
                      "Execute or process the planned research, "
                      "integrate validated knowledge, and preserve "
                      "evidence and uncertainty."
                  ),
                  "input": [
                      "research_queue"
                  ],
                  "not_for_act23": [
                      "perform_research",
                      "claim_answers",
                      "integrate_knowledge",
                      "change_knowledge_core",
                      "execute_external_actions"
                  ]
              }
          }

          MEMORY_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_FILE.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Console report
          # ------------------------------------------------------------

          print("")
          print("ACT23 RESULT")
          print(
              f"Research plans created: "
              f"{len(plans)}"
          )

          if plans:
              print("")
              print("Research queue:")

              for index, plan in enumerate(
                  plans,
                  1
              ):
                  print(
                      f"{index}. "
                      f"[{plan['curiosity_score']}] "
                      f"{plan['research_priority'].upper()} | "
                      f"{plan['domain']} | "
                      f"{plan['curiosity_target']}"
                  )

                  print(
                      f"   Question: "
                      f"{plan['research_question']}"
                  )

          else:
              print("")
              print(
                  "No research plan created. "
                  "ACT22 supplied no eligible curiosity target."
              )

          print("")
          print(f"Output: {OUTPUT_FILE}")

          PY

      - name: Commit ACT23 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_23_research_plan.json

          if git diff --cached --quiet; then
            echo "No ACT23 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT23 - create research plans"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
