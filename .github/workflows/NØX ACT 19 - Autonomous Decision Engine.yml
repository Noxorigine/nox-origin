name: NØX ACT 19 - Autonomous Decision Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act19-decision-engine
  cancel-in-progress: false

jobs:
  autonomous-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT19 decision engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          print("=" * 80)
          print("NØX ACT19 - AUTONOMOUS DECISION ENGINE")
          print("=" * 80)

          root = Path("memory")
          knowledge_file = root / "nox_knowledge_core.json"
          decision_file = root / "nox_act_19_decisions.json"

          if not knowledge_file.exists():
              raise SystemExit(
                  f"ERROR: Required file not found: {knowledge_file}"
              )

          with knowledge_file.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Knowledge core must be a JSON object.")

          required_keys = [
              "knowledge",
              "processed_sources",
              "contradictions",
              "statistics",
              "active_attention",
              "knowledge_policy",
              "last_run",
          ]

          missing = [key for key in required_keys if key not in data]

          if missing:
              raise SystemExit(
                  "ERROR: Missing required knowledge-core keys: "
                  + ", ".join(missing)
              )

          knowledge = data.get("knowledge", [])
          active_attention = data.get("active_attention", {})
          contradictions = data.get("contradictions", [])
          statistics = data.get("statistics", {})
          policy = data.get("knowledge_policy", {})

          if not isinstance(knowledge, list):
              raise SystemExit("ERROR: 'knowledge' must be a list.")

          if not isinstance(active_attention, dict):
              raise SystemExit("ERROR: 'active_attention' must be a dict.")

          if not isinstance(contradictions, list):
              raise SystemExit("ERROR: 'contradictions' must be a list.")

          if not isinstance(statistics, dict):
              raise SystemExit("ERROR: 'statistics' must be a dict.")

          if not isinstance(policy, dict):
              raise SystemExit("ERROR: 'knowledge_policy' must be a dict.")

          now = datetime.now(timezone.utc).isoformat()

          print(f"Knowledge items: {len(knowledge)}")
          print(f"Active attention items: {len(active_attention)}")
          print(f"Contradictions: {len(contradictions)}")
          print(f"Policy entries: {len(policy)}")

          decisions = []

          def text_of(item):
              if isinstance(item, str):
                  return item

              if isinstance(item, dict):
                  parts = []

                  for key in (
                      "title",
                      "topic",
                      "subject",
                      "content",
                      "summary",
                      "description",
                      "question",
                      "text",
                  ):
                      value = item.get(key)
                      if isinstance(value, str) and value.strip():
                          parts.append(value.strip())

                  return " ".join(parts)

              return str(item)

          def numeric_value(item, keys):
              if not isinstance(item, dict):
                  return 0.0

              for key in keys:
                  value = item.get(key)

                  if isinstance(value, (int, float)):
                      return float(value)

                  if isinstance(value, str):
                      try:
                          return float(value)
                      except ValueError:
                          pass

              return 0.0

          # ------------------------------------------------------------------
          # 1. ACTIVE ATTENTION
          # ------------------------------------------------------------------

          for key, value in active_attention.items():
              text = text_of(value)

              if not text:
                  text = str(key)

              decisions.append(
                  {
                      "candidate": str(key),
                      "source": "active_attention",
                      "reason": "Explicitly selected by the active-attention layer.",
                      "relevance": 1.0,
                      "confidence": 0.90,
                      "risk": 0.05,
                      "expected_value": 0.90,
                      "recommended_action": "deepen_attention",
                      "evidence": text[:500],
                  }
              )

          # ------------------------------------------------------------------
          # 2. RECENT / HIGH-VALUE KNOWLEDGE
          # ------------------------------------------------------------------

          for index, item in enumerate(knowledge):
              text = text_of(item)

              if not text:
                  continue

              lowered = text.lower()

              relevance = 0.0
              confidence = 0.50
              risk = 0.10
              expected_value = 0.30

              # Topics that are currently useful for NØX.
              priority_terms = {
                  "ai agent": 0.25,
                  "ai agents": 0.25,
                  "autonom": 0.20,
                  "agent": 0.15,
                  "marketplace": 0.20,
                  "economy": 0.15,
                  "collaboration": 0.15,
                  "cybersecurity": 0.15,
                  "security": 0.10,
                  "regulation": 0.15,
                  "law": 0.10,
                  "technology": 0.10,
                  "learning": 0.15,
              }

              for term, weight in priority_terms.items():
                  if term in lowered:
                      relevance += weight
                      expected_value += weight * 0.5

              relevance = min(relevance, 1.0)
              expected_value = min(expected_value, 1.0)

              if relevance < 0.20:
                  continue

              if isinstance(item, dict):
                  confidence_value = numeric_value(
                      item,
                      ["confidence", "confidence_score", "certainty"],
                  )

                  if confidence_value > 0:
                      confidence = min(confidence_value, 1.0)

              decisions.append(
                  {
                      "candidate": f"knowledge_{index}",
                      "source": "knowledge",
                      "reason": "Relevant knowledge detected by ACT19 priority analysis.",
                      "relevance": round(relevance, 4),
                      "confidence": round(confidence, 4),
                      "risk": round(risk, 4),
                      "expected_value": round(expected_value, 4),
                      "recommended_action": "review_and_prioritize",
                      "evidence": text[:500],
                  }
              )

          # ------------------------------------------------------------------
          # 3. CONTRADICTIONS
          # ------------------------------------------------------------------

          if contradictions:
              decisions.append(
                  {
                      "candidate": "knowledge_contradictions",
                      "source": "contradictions",
                      "reason": "Contradictions require verification before stronger decisions.",
                      "relevance": 0.80,
                      "confidence": 0.75,
                      "risk": 0.35,
                      "expected_value": 0.75,
                      "recommended_action": "verify_contradictions",
                      "evidence": f"{len(contradictions)} contradiction(s) recorded.",
                  }
              )

          # ------------------------------------------------------------------
          # 4. DECISION SCORE
          # ------------------------------------------------------------------

          for decision in decisions:
              score = (
                  decision["relevance"] * 0.35
                  + decision["expected_value"] * 0.30
                  + decision["confidence"] * 0.20
                  - decision["risk"] * 0.15
              )

              decision["decision_score"] = round(max(score, 0.0), 4)

          decisions.sort(
              key=lambda item: item["decision_score"],
              reverse=True,
          )

          # Keep the output bounded and deterministic.
          decisions = decisions[:10]

          selected = decisions[0] if decisions else None

          # ------------------------------------------------------------------
          # 5. AUTONOMOUS DECISION
          # ------------------------------------------------------------------

          if selected:
              final_decision = {
                  "status": "DECISION_READY",
                  "selected_candidate": selected["candidate"],
                  "recommended_action": selected["recommended_action"],
                  "decision_score": selected["decision_score"],
                  "reason": selected["reason"],
                  "confidence": selected["confidence"],
                  "risk": selected["risk"],
              }
          else:
              final_decision = {
                  "status": "NO_ACTIONABLE_DECISION",
                  "selected_candidate": None,
                  "recommended_action": "continue_observing",
                  "decision_score": 0.0,
                  "reason": "No sufficiently relevant candidate was detected.",
                  "confidence": 0.0,
                  "risk": 0.0,
              }

          result = {
              "version": "ACT19_V1",
              "generated_at": now,
              "gemini_used": False,
              "project_cost_eur": 0,
              "decision_mode": "non_destructive",
              "knowledge_items_analyzed": len(knowledge),
              "active_attention_items": len(active_attention),
              "contradictions_analyzed": len(contradictions),
              "candidate_count": len(decisions),
              "final_decision": final_decision,
              "ranked_candidates": decisions,
              "policy_snapshot": policy,
              "statistics_snapshot": statistics,
          }

          root.mkdir(parents=True, exist_ok=True)

          with decision_file.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print()
          print("-" * 80)
          print("ACT19 DECISION RESULT")
          print("-" * 80)
          print(json.dumps(final_decision, ensure_ascii=False, indent=2))
          print("-" * 80)
          print(f"Decision file: {decision_file}")
          print("Gemini used: False")
          print("Project cost: 0 EUR")
          print("Mode: non-destructive")
          print("=" * 80)
          PY

      - name: Commit ACT19 decision memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_19_decisions.json

          if git diff --cached --quiet; then
            echo "No ACT19 changes to commit."
            exit 0
          fi

          git commit -m "ACT19: update autonomous decision memory"

      - name: Synchronize with main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push ACT19 result
        run: |
          git push origin HEAD:main
