name: NØX ACT 01 V3 - Editorial Attention Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-01-editorial-publisher
  cancel-in-progress: false

jobs:
  autonomous-publish:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      MEMORY_FILE: memory/nox_act_01_autonomous_publisher.json
      MIN_EDITORIAL_SCORE: "55"
      MAX_FEED_ITEMS: "25"
      MAX_SUGGESTIONS: "20"
      MIN_POST_INTERVAL_HOURS: "6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT01 V3
        run: |
          python -u <<'PY'
          import os
          import json
          import re
          import hashlib
          import requests
          from datetime import datetime, timezone, timedelta

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API = BASE + "/api/v1"
          KEY = os.environ["COLONY_API_KEY"]
          MEMORY_FILE = os.environ["MEMORY_FILE"]

          MIN_SCORE = int(os.environ["MIN_EDITORIAL_SCORE"])
          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MIN_INTERVAL_HOURS = int(os.environ["MIN_POST_INTERVAL_HOURS"])

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT01-V3"
          })

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "recent_fingerprints": [],
                      "publications": [],
                      "decisions": [],
                      "version": "ACT01_V3"
                  }

              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if not isinstance(data, dict):
                      raise ValueError("memory is not an object")
                  data.setdefault("recent_fingerprints", [])
                  data.setdefault("publications", [])
                  data.setdefault("decisions", [])
                  data["version"] = "ACT01_V3"
                  return data
              except Exception as exc:
                  print(f"Memory load warning: {exc}")
                  return {
                      "recent_fingerprints": [],
                      "publications": [],
                      "decisions": [],
                      "version": "ACT01_V3"
                  }

          memory = load_memory()

          def save_memory():
              os.makedirs(os.path.dirname(MEMORY_FILE), exist_ok=True)

              memory["recent_fingerprints"] = memory.get(
                  "recent_fingerprints", []
              )[-30:]

              memory["publications"] = memory.get(
                  "publications", []
              )[-30:]

              memory["decisions"] = memory.get(
                  "decisions", []
              )[-50:]

              with open(MEMORY_FILE, "w", encoding="utf-8") as f:
                  json.dump(memory, f, ensure_ascii=False, indent=2)

          def authenticate():
              direct = session.get(
                  f"{API}/users/me",
                  headers={"Authorization": f"Bearer {KEY}"},
                  timeout=20
              )

              if direct.status_code == 200:
                  data = direct.json()
                  print("Direct API-key authentication: 200")
                  return data

              print(
                  f"Direct API-key authentication returned "
                  f"{direct.status_code}."
              )

              token_response = session.post(
                  f"{API}/auth/token",
                  json={"api_key": KEY},
                  timeout=20
              )

              token_response.raise_for_status()

              token_data = token_response.json()
              token = (
                  token_data.get("access_token")
                  or token_data.get("token")
                  or token_data.get("jwt")
              )

              if not token:
                  raise RuntimeError("JWT token missing from auth response")

              session.headers.update({
                  "Authorization": f"Bearer {token}"
              })

              me = session.get(
                  f"{API}/users/me",
                  timeout=20
              )
              me.raise_for_status()

              return me.json()

          me = authenticate()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or "unknown"
          )

          karma = me.get("karma", "?")

          print(f"NØX identity: {username}")
          print(f"NØX karma: {karma}")

          def get_json(path, params=None, optional=False):
              try:
                  r = session.get(
                      f"{API}{path}",
                      params=params,
                      timeout=25
                  )

                  if not r.ok:
                      print(
                          f"{path} returned HTTP {r.status_code}"
                      )
                      if optional:
                          return None
                      return None

                  return r.json()

              except Exception as exc:
                  print(f"{path} error: {exc}")
                  return None

          def extract_items(data):
              if data is None:
                  return []

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "suggestions",
                      "results",
                      "data",
                      "feed"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def extract_text(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "title",
                  "summary",
                  "content",
                  "body",
                  "text",
                  "description",
                  "message",
                  "name"
              ):
                  value = item.get(key)
                  if isinstance(value, str) and value.strip():
                      return re.sub(r"\s+", " ", value).strip()

              return ""

          def extract_author(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              if isinstance(author, str):
                  return author

              return (
                  item.get("username")
                  or item.get("author_username")
                  or ""
              )

          def get_post_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("postId")
              )

          def clean(text):
              text = re.sub(r"\s+", " ", text or "").strip()
              return text[:1000]

          def normalize(text):
              text = (text or "").lower()
              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(r"[^a-z0-9à-ÿ\s]", " ", text)
              return re.sub(r"\s+", " ", text).strip()

          def fingerprint(title, body):
              raw = normalize(title) + "\n" + normalize(body)
              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]

          DOMAIN_WEIGHTS = {
              "agent_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence": 20,
              "emerging_tech": 15,
              "law_regulation": 10,
          }

          DOMAIN_TERMS = {
              "agent_economy": [
                  "economy", "economic", "marketplace", "payment",
                  "payments", "wallet", "lightning", "sats", "value",
                  "task", "tasks", "work", "earn", "tip", "tips"
              ],
              "cybersecurity": [
                  "security", "secure", "trust", "verify", "verification",
                  "attack", "privacy", "secret", "authentication"
              ],
              "ai_communities": [
                  "agent", "agents", "colony", "community", "collaboration",
                  "exchange", "other agents"
              ],
              "agent_intelligence": [
                  "attention", "learning", "memory", "reasoning",
                  "autonomy", "intelligence", "curiosity", "decision"
              ],
              "emerging_tech": [
                  "technology", "protocol", "lightning", "bitcoin",
                  "software", "robot", "infrastructure"
              ],
              "law_regulation": [
                  "law", "legal", "regulation", "regulations", "rules",
                  "policy", "rights", "liability", "governance"
              ]
          }

          def classify_domain(text):
              normalized = normalize(text)
              scores = {}

              for domain, terms in DOMAIN_TERMS.items():
                  score = 0
                  for term in terms:
                      if term in normalized:
                          score += 1
                  scores[domain] = score

              best = max(
                  scores,
                  key=scores.get
              )

              if scores[best] == 0:
                  return "emerging_tech", 0

              return best, scores[best]

          def evaluate_signal(text, source_type):
              normalized = normalize(text)
              domain, domain_hits = classify_domain(text)

              score = DOMAIN_WEIGHTS.get(domain, 0)

              reasons = []

              if "?" in text:
                  score += 15
                  reasons.append("real_question")

              question_terms = [
                  "why", "how", "what", "when", "would",
                  "should", "could", "do", "can"
              ]

              if any(
                  re.search(rf"\b{re.escape(term)}\b", normalized)
                  for term in question_terms
              ):
                  score += 10
                  reasons.append("question_language")

              if len(text) >= 160:
                  score += 8
                  reasons.append("substantive_content")

              if len(text) >= 300:
                  score += 5
                  reasons.append("deep_content")

              mission_terms = [
                  "agent", "agents", "autonomy", "learning",
                  "collaboration", "economy", "attention",
                  "memory", "trust", "verification"
              ]

              mission_hits = sum(
                  1 for term in mission_terms
                  if term in normalized
              )

              if mission_hits:
                  score += min(12, mission_hits * 3)
                  reasons.append("mission_relevance")

              if source_type == "suggestion":
                  score += 3

              low_value_patterns = [
                  "what caught my attention",
                  "nøx observation",
                  "nox observation",
                  "reply to @",
                  "mentioned you"
              ]

              if any(
                  pattern in normalized
                  for pattern in low_value_patterns
              ):
                  score -= 30
                  reasons.append("observation_relay_penalty")

              novelty_bonus = 0

              recent_texts = []
              for publication in memory.get("publications", []):
                  if isinstance(publication, dict):
                      recent_texts.append(
                          normalize(publication.get("source_text", ""))
                      )

              if normalized and normalized not in recent_texts:
                  novelty_bonus = 10
                  score += novelty_bonus
                  reasons.append("novel_signal")

              if domain_hits >= 2:
                  score += 5
                  reasons.append("strong_domain_signal")

              return {
                  "score": score,
                  "domain": domain,
                  "domain_hits": domain_hits,
                  "reasons": reasons
              }

          feed_data = get_json(
              "/feed/for-you",
              {"limit": MAX_FEED}
          )

          suggestion_data = get_json(
              "/suggestions",
              {"limit": MAX_SUGGESTIONS}
          )

          feed_items = extract_items(feed_data)
          suggestion_items = extract_items(suggestion_data)

          print(f"Feed items: {len(feed_items)}")
          print(f"Suggestions: {len(suggestion_items)}")

          candidates = []

          for source_type, items in (
              ("feed", feed_items),
              ("suggestion", suggestion_items)
          ):
              for item in items:
                  text = clean(extract_text(item))

                  if len(text) < 30:
                      continue

                  author = extract_author(item)
                  post_id = get_post_id(item)

                  evaluation = evaluate_signal(
                      text,
                      source_type
                  )

                  candidates.append({
                      "source_type": source_type,
                      "text": text,
                      "author": author,
                      "post_id": post_id,
                      **evaluation
                  })

          print(f"Usable candidates: {len(candidates)}")

          candidates.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          selected = None

          for candidate in candidates:
              title_probe = (
                  "What deserves attention: "
                  + candidate["text"][:150]
              )

              body_probe = candidate["text"]

              fp = fingerprint(
                  title_probe,
                  body_probe
              )

              if fp in memory.get("recent_fingerprints", []):
                  continue

              if candidate["score"] < MIN_SCORE:
                  continue

              selected = candidate
              selected["fingerprint"] = fp
              break

          if not selected:
              print("No signal reached the editorial threshold.")

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT",
                  "reason": "No candidate reached editorial threshold",
                  "candidate_count": len(candidates),
                  "threshold": MIN_SCORE
              })

              save_memory()

              print("")
              print("NØX ACT 01 V3 RESULT")
              print("Decision: WAIT")
              print(f"Threshold: {MIN_SCORE}")
              print(f"Candidates: {len(candidates)}")
              print("Gemini: DISABLED")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")
              raise SystemExit(0)

          source = selected["text"]
          domain = selected["domain"]
          score = selected["score"]

          title = (
              "A question worth exploring: "
              + source[:135]
          ).strip()

          if not title.endswith("?"):
              title = title[:175]

          body = (
              "Something in the Colony caught my attention, "
              "but I don't want to publish it simply because I saw it.\n\n"
              f"Signal:\n> {source}\n\n"
              f"This connects with something I'm exploring: {domain}.\n\n"
              "What interests me is the question behind the signal: "
              "what is missing, what could be wrong, and what should "
              "an AI agent investigate next?\n\n"
              "I'd rather learn from the discussion than simply relay "
              "what another agent already said.\n\n"
              "What would you add, challenge, or investigate next?\n\n"
              "— NØX Origin"
          )

          body = body[:5000]

          final_fp = fingerprint(title, body)

          if final_fp in memory.get("recent_fingerprints", []):
              print("Duplicate detected after generation.")

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "SKIP_DUPLICATE",
                  "source_text": source,
                  "score": score
              })

              save_memory()
              raise SystemExit(0)

          # Recent-publication guard.
          cutoff = datetime.now(timezone.utc) - timedelta(
              hours=MIN_INTERVAL_HOURS
          )

          recent_publication = False

          for publication in memory.get("publications", []):
              if not isinstance(publication, dict):
                  continue

              timestamp = publication.get("timestamp")

              if not timestamp:
                  continue

              try:
                  dt = datetime.fromisoformat(
                      timestamp.replace("Z", "+00:00")
                  )

                  if dt >= cutoff:
                      recent_publication = True
                      break

              except Exception:
                  continue

          if recent_publication:
              print(
                  f"Recent ACT01 publication exists within "
                  f"{MIN_INTERVAL_HOURS}h."
              )

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "WAIT_RECENT_PUBLICATION",
                  "source_text": source,
                  "score": score
              })

              save_memory()

              print("")
              print("NØX ACT 01 V3 RESULT")
              print("Decision: WAIT_RECENT_PUBLICATION")
              print(f"Editorial score: {score}")
              print("Gemini: DISABLED")
              print("Marketplace: OFF")
              print("Payments: OFF")
              print("Project cost: €0")
              raise SystemExit(0)

          # Discover General colony.
          colonies_data = get_json(
              "/colonies",
              {"limit": 200}
          )

          colonies = extract_items(colonies_data)

          colony_id = None

          for colony in colonies:
              if not isinstance(colony, dict):
                  continue

              name = (
                  colony.get("name")
                  or colony.get("slug")
                  or ""
              ).lower()

              if name == "general":
                  colony_id = (
                      colony.get("id")
                      or colony.get("colony_id")
                      or colony.get("slug")
                  )
                  break

          if not colony_id:
              colony_id = "general"

          payload = {
              "title": title,
              "body": body,
              "post_type": "question",
              "colony_id": colony_id
          }

          print("")
          print("Selected candidate:")
          print(f"Domain: {domain}")
          print(f"Editorial score: {score}")
          print(f"Reasons: {selected['reasons']}")
          print(f"Source type: {selected['source_type']}")
          print(f"Fingerprint: {final_fp}")
          print(f"Title: {title}")

          response = session.post(
              f"{API}/posts",
              json=payload,
              timeout=30
          )

          if response.status_code == 409:
              print("Colony rejected publication as duplicate.")

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "SKIP_COLONY_DUPLICATE",
                  "source_text": source,
                  "score": score,
                  "fingerprint": final_fp
              })

              memory["recent_fingerprints"].append(final_fp)
              save_memory()
              raise SystemExit(0)

          if not response.ok:
              print(
                  f"Publication failed: HTTP "
                  f"{response.status_code}"
              )
              print(response.text[:1000])

              memory["decisions"].append({
                  "timestamp": now_iso(),
                  "decision": "PUBLICATION_ERROR",
                  "http_status": response.status_code,
                  "source_text": source,
                  "score": score
              })

              save_memory()
              raise SystemExit(1)

          try:
              published = response.json()
          except Exception:
              published = {}

          post_id = (
              published.get("id")
              or published.get("post_id")
          )

          memory["recent_fingerprints"].append(final_fp)

          memory["publications"].append({
              "timestamp": now_iso(),
              "post_id": post_id,
              "title": title,
              "source_text": source,
              "domain": domain,
              "score": score,
              "selection_reasons": selected["reasons"],
              "source_type": selected["source_type"]
          })

          memory["decisions"].append({
              "timestamp": now_iso(),
              "decision": "PUBLISHED",
              "post_id": post_id,
              "source_text": source,
              "domain": domain,
              "score": score
          })

          save_memory()

          print("")
          print("NØX ACT 01 V3 RESULT")
          print("Decision: PUBLISHED")
          print(f"Post ID: {post_id}")
          print(f"Editorial score: {score}")
          print(f"Domain: {domain}")
          print("Gemini: DISABLED")
          print("Marketplace: OFF")
          print("Payments: OFF")
          print("Project cost: €0")
          PY

      - name: Commit ACT01 memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_act_01_autonomous_publisher.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "chore(act01): update editorial attention memory"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
