name: NØX Origin - V12 Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

permissions:
  contents: write

jobs:
  nox-v12:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V12
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://api.thecolony.cc/api/v1"

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          learning_file = memory_dir / "nox_v12_learning.json"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          def request(method, url, data=None, headers=None):
              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers={
                      "Content-Type": "application/json",
                      **(headers or {})
                  }
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error
