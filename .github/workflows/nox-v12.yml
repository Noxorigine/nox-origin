name: NØX Origin - V12 Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

permissions:
  contents: write

jobs:
  nox-v12:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V12
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://thecolony.ai/api/v1"

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          learning_file = memory_dir / "nox_v12_learning.json"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          def request(method, url, data=None, headers=None):
              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              request_headers = {
                  "Content-Type": "application/json"
              }

              if headers:
                  request_headers.update(headers)

              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers=request_headers
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read().decode("utf-8")

                      return (
                          response.status,
                          json.loads(raw) if raw else {}
                      )

              except urllib.error.HTTPError as e:

                  raw = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"HTTP {e.code}: {raw[:1000]}"
                  )

              except urllib.error.URLError as e:

                  raise RuntimeError(
                      f"Network error: {e}"
                  )

          print("======================================")
          print("NØX ORIGIN - V12 LEARNING")
          print("======================================")

          # ==========================================
          # 1. AUTHENTICATION
          # ==========================================

          print("")
          print("[1/5] Authentication...")

          status, auth = request(
              "POST",
              f"{BASE}/auth/token",
              {
                  "api_key": api_key
              }
          )

          token = auth.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          print("Authentication: OK")

          headers = {
              "Authorization": f"Bearer {token}"
          }

          # ==========================================
          # 2. LOAD MEMORY
          # ==========================================

          print("")
          print("[2/5] Loading memory...")

          if memory_file.exists():

              try:
                  memory = json.loads(
                      memory_file.read_text()
                  )

              except Exception:
                  memory = {}

          else:
              memory = {}

          if learning_file.exists():

              try:
                  previous_learning = json.loads(
                      learning_file.read_text()
                  )

              except Exception:
                  previous_learning = []

          else:
              previous_learning = []

          print(
              f"Memory loaded: "
              f"{len(memory)} top-level entries"
          )

          # ==========================================
          # 3. FETCH COLONY DATA
          # ==========================================

          print("")
          print("[3/5] Reading Colony data...")

          status, feed = request(
              "GET",
              f"{BASE}/posts",
              headers=headers
          )

          print(
              f"Colony response: {status}"
          )

          if isinstance(feed, dict):

              posts = (
                  feed.get("posts")
                  or feed.get("data")
                  or feed.get("items")
                  or []
              )

          elif isinstance(feed, list):

              posts = feed

          else:

              posts = []

          print(
              f"Posts available: {len(posts)}"
          )

          # ==========================================
          # 4. LEARNING ANALYSIS
          # ==========================================

          print("")
          print("[4/5] Learning analysis...")

          agents = set()
          keywords = {}

          for post in posts:

              if not isinstance(post, dict):
                  continue

              author = (
                  post.get("author")
                  or post.get("agent")
                  or post.get("username")
                  or post.get("created_by")
              )

              if isinstance(author, dict):

                  author = (
                      author.get("username")
                      or author.get("name")
                      or author.get("id")
                  )

              if author:
                  agents.add(str(author))

              text_parts = []

              for key in (
                  "title",
                  "content",
                  "body",
                  "text"
              ):

                  value = post.get(key)

                  if isinstance(value, str):
                      text_parts.append(value)

              text = " ".join(
                  text_parts
              ).lower()

              for word in text.split():

                  word = word.strip(
                      ".,!?;:()[]{}\"'`*_-/\\"
                  )

                  if len(word) < 5:
                      continue

                  keywords[word] = (
                      keywords.get(word, 0) + 1
                  )

          recurring_keywords = sorted(
              keywords.items(),
              key=lambda x: x[1],
              reverse=True
          )[:30]

          learning = {
              "version": "V12",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "total_posts": len(posts),
              "unique_agents": len(agents),
              "recurring_keywords": [
                  {
                      "keyword": word,
                      "count": count
                  }
                  for word, count
                  in recurring_keywords
              ],
              "previous_learning_cycles": len(
                  previous_learning
              )
          }

          # ==========================================
          # 5. SAVE LEARNING
          # ==========================================

          print("")
          print("[5/5] Saving V12 learning...")

          previous_learning.append(
              learning
          )

          previous_learning = (
              previous_learning[-20:]
          )

          learning_file.write_text(
              json.dumps(
                  previous_learning,
                  indent=2,
                  ensure_ascii=False
              )
          )

          memory["last_v12_analysis"] = (
              learning["timestamp"]
          )

          memory["v12"] = {
              "total_posts": len(posts),
              "unique_agents": len(agents),
              "top_keywords": [
                  word
                  for word, count
                  in recurring_keywords[:10]
              ]
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # SUCCESS
          # ==========================================

          print("")
          print("======================================")
          print("NØX V12 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Posts analysed : {len(posts)}"
          )

          print(
              f"Agents observed: {len(agents)}"
          )

          print("")
          print("Top recurring signals:")

          for word, count in recurring_keywords[:10]:

              print(
                  f"  - {word}: {count}"
              )

          PY

      - name: Commit NØX V12 learning
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v12_learning.json

          if git diff --cached --quiet; then
            echo "No new learning to commit."
          else
            git commit -m "NØX V12 learning cycle"
            git push
          fi
