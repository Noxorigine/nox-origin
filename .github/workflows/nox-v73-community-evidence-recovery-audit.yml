name: NØX V73 Community Evidence Recovery Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v73-community-evidence-recovery-audit
  cancel-in-progress: false

jobs:
  evidence-recovery-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V73 community evidence recovery audit
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"

          V70_PUBLICATION_FILE = Path(
              "memory/nox_v70_2_work_request_publication_result.json"
          )

          V71_FILE = Path(
              "memory/nox_v71_work_request_community_validation.json"
          )

          V72_FILE = Path(
              "memory/nox_v72_autonomous_evolution_proposal.json"
          )

          OUTPUT_JSON = Path(
              "memory/nox_v73_community_evidence_recovery_audit.json"
          )

          OUTPUT_MD = Path(
              "memory/nox_v73_community_evidence_recovery_audit.md"
          )

          now = datetime.now(timezone.utc).isoformat()

          def fail(message):
              raise RuntimeError(message)

          def load_json(path):
              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  fail(
                      f"Unable to parse {path}: {exc}"
                  )

          def get_json(url, token, params=None):
              response = requests.get(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json"
                  },
                  params=params,
                  timeout=30
              )

              if response.status_code >= 400:
                  fail(
                      f"GET {url} failed "
                      f"{response.status_code}: "
                      f"{response.text[:700]}"
                  )

              try:
                  return response.json()
              except Exception as exc:
                  fail(
                      f"Invalid JSON returned by {url}: {exc}"
                  )

          def post_json(url, token, payload):
              response = requests.post(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json"
                  },
                  json=payload,
                  timeout=30
              )

              if response.status_code >= 400:
                  fail(
                      f"POST {url} failed "
                      f"{response.status_code}: "
                      f"{response.text[:700]}"
                  )

              try:
                  return response.json()
              except Exception:
                  return {}

          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text)
              ).strip()

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in [
                  "items",
                  "posts",
                  "comments",
                  "results"
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = extract_items(value)

                      if nested:
                          return nested

              data_value = data.get("data")

              if isinstance(data_value, list):
                  return data_value

              if isinstance(data_value, dict):
                  return extract_items(data_value)

              return []

          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("comment_id")
                  or item.get("post_id")
                  or ""
              )

          def item_author(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              user = item.get("user")

              if isinstance(user, dict):
                  return str(
                      user.get("username")
                      or user.get("handle")
                      or user.get("name")
                      or ""
                  )

              return str(
                  item.get("author_username")
                  or item.get("username")
                  or ""
              )

          def item_body(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or ""
              )

          def item_parent_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("parent_id")
                  or item.get("parent_comment_id")
                  or ""
              )

          def collect_comment_lists(data):
              """
              Search recursively for explicit comment arrays without
              treating the main post object itself as a comment.
              """
              found = []

              def walk(value, parent_key=""):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          key_lower = str(key).lower()

                          if key_lower in {
                              "comments",
                              "replies",
                              "children"
                          } and isinstance(child, list):
                              for item in child:
                                  if isinstance(item, dict):
                                      found.append(item)

                          walk(child, key_lower)

                  elif isinstance(value, list):
                      for item in value:
                          if isinstance(item, (dict, list)):
                              walk(item, parent_key)

              walk(data)

              return found

          def unique_comments(items):
              result = []
              seen = set()

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  cid = item_id(item)
                  body = normalize(item_body(item))
                  author = normalize(item_author(item))

                  if not cid:
                      continue

                  if not body:
                      continue

                  if cid in seen:
                      continue

                  seen.add(cid)

                  result.append({
                      "id": cid,
                      "author": author,
                      "body": body,
                      "parent_id": item_parent_id(item)
                  })

              return result

          # ---------------------------------------------------------
          # 1. API KEY
          # ---------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail(
                  "COLONY_API_KEY is missing."
              )

          # ---------------------------------------------------------
          # 2. EXCHANGE API KEY FOR JWT
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30
          )

          if auth_response.status_code >= 400:
              fail(
                  "Authentication failed "
                  f"{auth_response.status_code}: "
                  f"{auth_response.text[:700]}"
              )

          try:
              auth_data = auth_response.json()
          except Exception as exc:
              fail(
                  f"Authentication response was not valid JSON: {exc}"
              )

          token = auth_data.get("access_token")

          if not token:
              fail(
                  "No access_token returned by The Colony."
              )

          # ---------------------------------------------------------
          # 3. VERIFY NØX IDENTITY
          # ---------------------------------------------------------

          me = get_json(
              f"{BASE_URL}/users/me",
              token
          )

          if isinstance(me.get("user"), dict):
              me_user = me["user"]
          else:
              me_user = me

          nox_username = (
              me_user.get("username")
              or me.get("username")
              or "nox_origine"
          )

          nox_id = str(
              me_user.get("id")
              or me.get("id")
              or ""
          )

          # ---------------------------------------------------------
          # 4. LOAD PREVIOUS MEMORY
          # ---------------------------------------------------------

          publication = load_json(
              V70_PUBLICATION_FILE
          )

          v71 = load_json(
              V71_FILE
          )

          v72 = load_json(
              V72_FILE
          )

          # ---------------------------------------------------------
          # 5. IDENTIFY V70.2 PUBLICATION
          # ---------------------------------------------------------

          post_id = ""

          possible_id_keys = [
              "post_id",
              "id",
              "published_post_id",
              "publication_id"
          ]

          for key in possible_id_keys:
              value = publication.get(key)

              if value:
                  post_id = str(value)
                  break

          publication_title = (
              publication.get("title")
              or "Proposal: a structured WORK_REQUEST format for executable tasks"
          )

          # ---------------------------------------------------------
          # 6. CHECK NESTED PUBLICATION OBJECTS
          # ---------------------------------------------------------

          if not post_id:
              for key in [
                  "publication",
                  "post",
                  "result",
                  "data"
              ]:
                  nested = publication.get(key)

                  if not isinstance(nested, dict):
                      continue

                  for id_key in possible_id_keys:
                      value = nested.get(id_key)

                      if value:
                          post_id = str(value)
                          break

                  if post_id:
                      break

          # ---------------------------------------------------------
          # 7. FALLBACK: SEARCH RECENT POSTS
          # ---------------------------------------------------------

          if not post_id:
              posts_data = get_json(
                  f"{BASE_URL}/posts",
                  token,
                  params={
                      "limit": 100
                  }
              )

              posts = extract_items(posts_data)

              title_target = normalize(
                  publication_title
              ).lower()

              for candidate in posts:
                  if not isinstance(candidate, dict):
                      continue

                  title = normalize(
                      candidate.get("title", "")
                  ).lower()

                  author = normalize(
                      item_author(candidate)
                  ).lower()

                  if (
                      title == title_target
                      and (
                          author == str(
                              nox_username
                          ).lower()
                          or author in [
                              "nox_origine",
                              "nøx origin"
                          ]
                      )
                  ):
                      post_id = item_id(candidate)
                      break

          if not post_id:
              fail(
                  "Unable to identify the V70.2 publication post."
              )

          # ---------------------------------------------------------
          # 8. FETCH DIRECT POST
          # ---------------------------------------------------------

          post = get_json(
              f"{BASE_URL}/posts/{post_id}",
              token
          )

          # ---------------------------------------------------------
          # 9. FETCH FULL PRIMARY-SOURCE CONTEXT
          # ---------------------------------------------------------

          context = get_json(
              f"{BASE_URL}/posts/{post_id}/context",
              token
          )

          # ---------------------------------------------------------
          # 10. EXTRACT COMMENTS
          # ---------------------------------------------------------

          comment_candidates = []

          # Direct known structures first.
          if isinstance(
              context.get("comments"),
              list
          ):
              comment_candidates.extend(
                  context["comments"]
              )

          data = context.get("data")

          if isinstance(data, dict):
              if isinstance(
                  data.get("comments"),
                  list
              ):
                  comment_candidates.extend(
                      data["comments"]
                  )

          context_post = context.get("post")

          if isinstance(context_post, dict):
              if isinstance(
                  context_post.get("comments"),
                  list
              ):
                  comment_candidates.extend(
                      context_post["comments"]
                  )

          # Recursive explicit-comment fallback.
          if not comment_candidates:
              comment_candidates.extend(
                  collect_comment_lists(context)
              )

          comments = unique_comments(
              comment_candidates
          )

          # ---------------------------------------------------------
          # 11. SEPARATE COMMUNITY FROM NØX
          # ---------------------------------------------------------

          community_comments = []
          nox_comments = []

          for comment in comments:
              author = comment["author"].lower()

              raw_author_id = ""

              # The normalized comment no longer contains raw data,
              # so identity is primarily determined by username here.
              is_nox = (
                  author == str(
                      nox_username
                  ).lower()
                  or author == "nox_origine"
                  or author == "nøx origin"
              )

              if is_nox:
                  nox_comments.append(comment)
              else:
                  community_comments.append(comment)

          # ---------------------------------------------------------
          # 12. LOAD V71 PROCESSED IDS
          # ---------------------------------------------------------

          v71_processed_ids = set()

          for key in [
              "processed_comment_ids",
              "replied_comment_ids"
          ]:
              values = v71.get(key)

              if isinstance(values, list):
                  for value in values:
                      v71_processed_ids.add(
                          str(value)
                      )

          # ---------------------------------------------------------
          # 13. COMPARE V71 WITH PRIMARY SOURCE
          # ---------------------------------------------------------

          actual_community_ids = {
              comment["id"]
              for comment in community_comments
          }

          missing_from_v71 = sorted(
              actual_community_ids
              - v71_processed_ids
          )

          stale_in_v71 = sorted(
              v71_processed_ids
              - actual_community_ids
          )

          # ---------------------------------------------------------
          # 14. RECOVER PRIMARY-SOURCE COMMUNITY EVIDENCE
          # ---------------------------------------------------------

          recovered_evidence = []

          for comment in community_comments:
              recovered_evidence.append({
                  "comment_id": comment["id"],
                  "author": comment["author"],
                  "body": comment["body"],
                  "parent_id": comment["parent_id"],
                  "source": {
                      "post_id": post_id,
                      "endpoint": (
                          f"/posts/{post_id}/context"
                      )
                  }
              })

          # ---------------------------------------------------------
          # 15. SIGNAL ANALYSIS ON PRIMARY-SOURCE COMMENTS
          # ---------------------------------------------------------

          real_text = " ".join(
              comment["body"]
              for comment in community_comments
              if comment["body"]
          ).lower()

          def contains_any(words):
              return any(
                  word.lower() in real_text
                  for word in words
              )

          real_signals = {
              "verification": contains_any([
                  "verif",
                  "proof",
                  "evidence",
                  "falsif",
                  "acceptance criteria",
                  "checkable",
                  "independent",
                  "verify",
                  "validation"
              ]),
              "closure": contains_any([
                  "closure",
                  "closed",
                  "completion",
                  "complete",
                  "done",
                  "abandoned",
                  "resolution",
                  "escalation",
                  "assigned"
              ]),
              "payment": contains_any([
                  "payment",
                  "payable",
                  "settlement",
                  "escrow",
                  "reward",
                  "paid",
                  "usdc",
                  "transaction"
              ]),
              "structure": contains_any([
                  "field",
                  "format",
                  "structure",
                  "requester",
                  "objective",
                  "application method",
                  "task",
                  "deliverable"
              ]),
              "noise": contains_any([
                  "signal",
                  "noise",
                  "keyword",
                  "false positive",
                  "false-positive",
                  "generic"
              ])
          }

          # ---------------------------------------------------------
          # 16. AUDIT V72 INPUT
          # ---------------------------------------------------------

          v72_observations = v72.get(
              "observations",
              []
          )

          if isinstance(
              v72_observations,
              list
          ):
              v72_observation_count = len(
                  v72_observations
              )
          else:
              v72_observation_count = 0

          actual_count = len(
              community_comments
          )

          evidence_recovery_success = (
              actual_count > 0
          )

          v72_recovery_failure = (
              actual_count > 0
              and v72_observation_count == 0
          )

          # ---------------------------------------------------------
          # 17. IDENTIFY ACTUAL FAILURE
          # ---------------------------------------------------------

          failure_reasons = []

          if v72_recovery_failure:
              failure_reasons.append(
                  "V72 reported no usable community observation "
                  "despite community comments being recoverable "
                  "from the V70.2 primary source."
              )

          if missing_from_v71:
              failure_reasons.append(
                  "Some real community comment IDs were not "
                  "represented in V71 processed-comment memory."
              )

          if not community_comments:
              failure_reasons.append(
                  "The V73 primary-source context did not expose "
                  "recoverable community comments."
              )

          if not failure_reasons:
              failure_reasons.append(
                  "No critical evidence-recovery failure was detected."
              )

          # ---------------------------------------------------------
          # 18. SELF-AUDIT CONCLUSION
          # ---------------------------------------------------------

          if v72_recovery_failure:
              audit_status = (
                  "V72_INPUT_RECOVERY_FAILURE_CONFIRMED"
              )

              conclusion = (
                  "V72 did not receive or recover the community "
                  "evidence that was available on the V70.2 "
                  "publication. Its insufficient-evidence result "
                  "therefore described an input-recovery failure "
                  "rather than a genuine absence of community evidence."
              )

          elif actual_count > 0:
              audit_status = (
                  "COMMUNITY_EVIDENCE_RECOVERED"
              )

              conclusion = (
                  "V73 successfully recovered community evidence "
                  "directly from the V70.2 publication and can use "
                  "that evidence to audit previous memory and "
                  "evolution decisions."
              )

          else:
              audit_status = (
                  "EVIDENCE_NOT_RECOVERED"
              )

              conclusion = (
                  "V73 could not recover community comments from "
                  "the available primary-source API context."
              )

          # ---------------------------------------------------------
          # 19. NØX LEARNING
          # ---------------------------------------------------------

          learning = [
              (
                  "A local memory file must not be treated as the "
                  "sole source of truth when the original external "
                  "evidence can be retrieved."
              ),
              (
                  "Before declaring insufficient evidence, NØX should "
                  "verify whether the original source itself contains "
                  "recoverable evidence."
              ),
              (
                  "Input-recovery failure and genuine evidence "
                  "absence must be represented as different states."
              ),
              (
                  "Direct source verification should precede "
                  "confidence scoring whenever the source is accessible."
              )
          ]

          if actual_count > 0:
              learning.append(
                  (
                      "The V70.2 primary source currently exposes "
                      f"{actual_count} community comment(s) recoverable "
                      "through the context endpoint."
                  )
              )

          if missing_from_v71:
              learning.append(
                  (
                      "V71 memory did not fully represent the "
                      "community evidence currently recoverable "
                      "from the primary source."
                  )
              )

          # ---------------------------------------------------------
          # 20. PROPOSED V74 DIRECTION
          # ---------------------------------------------------------

          v74_proposal = {
              "version": "V74",
              "purpose": (
                  "Use recovered primary-source community evidence "
                  "to rebuild and improve NØX's autonomous evolution proposal."
              ),
              "required_inputs": [
                  "V73 recovered primary-source community comments",
                  "V71 validation memory",
                  "V72 autonomous evolution proposal"
              ],
              "principles": [
                  "Primary source before local summary.",
                  "Evidence absence must be distinguished from retrieval failure.",
                  "Every important community observation should remain traceable to a source comment.",
                  "Confidence must reflect evidence quality and source accessibility, not only quantity.",
                  "Community criticism, support, contradictions and proposed changes should be preserved as learning evidence.",
                  "V72's retrieval failure should become a regression case for future versions."
              ]
          }

          # ---------------------------------------------------------
          # 21. FINAL AUDIT OBJECT
          # ---------------------------------------------------------

          audit = {
              "version": "V73",
              "generated_at": now,
              "mode": "community_evidence_recovery_audit",
              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },
              "source": {
                  "post_id": post_id,
                  "title": (
                      post.get("title")
                      or publication_title
                  ),
                  "direct_post_retrieved": True,
                  "context_retrieved": True,
                  "primary_source_verified": True
              },
              "source_counts": {
                  "total_context_comments": len(comments),
                  "community_comments": actual_count,
                  "nox_comments": len(nox_comments)
              },
              "recovered_community_evidence": (
                  recovered_evidence
              ),
              "memory_comparison": {
                  "v71_processed_comment_ids": sorted(
                      v71_processed_ids
                  ),
                  "actual_community_comment_ids": sorted(
                      actual_community_ids
                  ),
                  "missing_from_v71": missing_from_v71,
                  "stale_in_v71": stale_in_v71
              },
              "real_signals": real_signals,
              "v72_audit": {
                  "v72_observation_count": (
                      v72_observation_count
                  ),
                  "actual_community_count": actual_count,
                  "recovery_failure_confirmed": (
                      v72_recovery_failure
                  ),
                  "audit_status": audit_status
              },
              "failure_reasons": failure_reasons,
              "conclusion": conclusion,
              "learning": learning,
              "v74_proposal": v74_proposal,
              "decision": {
                  "automatic_rule_change": False,
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini": False,
                  "human_decision_required_before_rule_deployment": True
              },
              "answer_status": (
                  "PRIMARY_SOURCE_EVIDENCE_RECOVERED"
                  if evidence_recovery_success
                  else "EVIDENCE_NOT_RECOVERED"
              ),
              "confidence": (
                  0.94
                  if evidence_recovery_success
                  else 0.30
              ),
              "safety": {
                  "automatic_external_action": False,
                  "automatic_rule_change": False,
                  "automatic_contact": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "raw_source_evidence_preserved": True,
                  "metadata_preserved": True
              }
          }

          # ---------------------------------------------------------
          # 22. WRITE JSON
          # ---------------------------------------------------------

          OUTPUT_JSON.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_JSON.write_text(
              json.dumps(
                  audit,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 23. WRITE MARKDOWN
          # ---------------------------------------------------------

          md = []

          md.append(
              "# NØX Origin — V73 Community Evidence Recovery Audit"
          )

          md.append("")

          md.append(
              f"Generated: {now}"
          )

          md.append("")

          md.append(
              "## Objective"
          )

          md.append("")

          md.append(
              "Recover community feedback directly from the V70.2 "
              "publication, compare it with V71 memory, and determine "
              "whether V72 failed because evidence was absent or "
              "because evidence recovery failed."
          )

          md.append("")

          md.append(
              "## Primary source"
          )

          md.append("")

          md.append(
              f"- Post ID: `{post_id}`"
          )

          md.append(
              f"- Title: {post.get('title') or publication_title}"
          )

          md.append(
              "- Direct post retrieved: YES"
          )

          md.append(
              "- Full context retrieved: YES"
          )

          md.append(
              "- Primary source verified: YES"
          )

          md.append("")

          md.append(
              "## Recovered comments"
          )

          md.append("")

          md.append(
              f"- Total context comments: {len(comments)}"
          )

          md.append(
              f"- Community comments: {actual_count}"
          )

          md.append(
              f"- NØX comments: {len(nox_comments)}"
          )

          md.append("")

          for index, comment in enumerate(
              community_comments,
              start=1
          ):
              md.append(
                  f"### Community comment {index}"
              )

              md.append("")

              md.append(
                  f"- ID: `{comment['id']}`"
              )

              md.append(
                  f"- Author: {comment['author'] or 'unknown'}"
              )

              md.append(
                  f"- Parent ID: `{comment['parent_id']}`"
              )

              md.append("")

              md.append(
                  f"> {comment['body']}"
              )

              md.append("")

          md.append(
              "## V71 memory comparison"
          )

          md.append("")

          md.append(
              f"- IDs stored by V71: {len(v71_processed_ids)}"
          )

          md.append(
              f"- Actual community IDs: {len(actual_community_ids)}"
          )

          md.append(
              f"- Missing from V71: {len(missing_from_v71)}"
          )

          md.append(
              f"- Stale in V71: {len(stale_in_v71)}"
          )

          md.append("")

          md.append(
              "### Missing comment IDs"
          )

          md.append("")

          if missing_from_v71:
              for cid in missing_from_v71:
                  md.append(
                      f"- `{cid}`"
                  )
          else:
              md.append(
                  "- None"
              )

          md.append("")

          md.append(
              "## Real community signals"
          )

          md.append("")

          for key, value in real_signals.items():
              md.append(
                  f"- {key}: {'YES' if value else 'NO'}"
              )

          md.append("")

          md.append(
              "## V72 audit"
          )

          md.append("")

          md.append(
              f"- V72 observation count: {v72_observation_count}"
          )

          md.append(
              f"- Actual community comment count: {actual_count}"
          )

          md.append(
              " - Recovery failure confirmed: "
              f"{'YES' if v72_recovery_failure else 'NO'}"
          )

          md.append(
              f"- Audit status: `{audit_status}`"
          )

          md.append("")

          md.append(
              "### Conclusion"
          )

          md.append("")

          md.append(
              conclusion
          )

          md.append("")

          md.append(
