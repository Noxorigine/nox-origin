name: NØX V73 Community Evidence Recovery Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v73-community-evidence-recovery-audit
  cancel-in-progress: false

jobs:
  evidence-recovery-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V73 community evidence recovery audit
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"

          V70_PUBLICATION_FILE = Path(
              "memory/nox_v70_2_work_request_publication_result.json"
          )

          V71_FILE = Path(
              "memory/nox_v71_work_request_community_validation.json"
          )

          V72_FILE = Path(
              "memory/nox_v72_autonomous_evolution_proposal.json"
          )

          OUTPUT_JSON = Path(
              "memory/nox_v73_community_evidence_recovery_audit.json"
          )

          OUTPUT_MD = Path(
              "memory/nox_v73_community_evidence_recovery_audit.md"
          )

          now = datetime.now(timezone.utc).isoformat()

          def fail(message):
              raise RuntimeError(message)

          def load_json(path):
              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  fail(
                      f"Unable to parse {path}: {exc}"
                  )

          def get_json(url, token, params=None):
              response = requests.get(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json"
                  },
                  params=params,
                  timeout=30
              )

              if response.status_code >= 400:
                  fail(
                      f"GET {url} failed "
                      f"{response.status_code}: "
                      f"{response.text[:700]}"
                  )

              return response.json()

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in [
                  "items",
                  "posts",
                  "comments",
                  "data",
                  "results"
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      nested = extract_items(value)

                      if nested:
                          return nested

              return []

          def item_id(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("id")
                  or item.get("post_id")
                  or item.get("comment_id")
                  or ""
              )

          def item_author(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              return str(
                  item.get("author_username")
                  or item.get("username")
                  or item.get("user", {}).get("username", "")
                  or ""
              )

          def item_body(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
                  or ""
              )

          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text)
              ).strip()

          # ---------------------------------------------------------
          # 1. API KEY
          # ---------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              fail("COLONY_API_KEY is missing.")

          # ---------------------------------------------------------
          # 2. EXCHANGE API KEY FOR JWT
          # ---------------------------------------------------------

          auth_response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          if auth_response.status_code >= 400:
              fail(
                  f"Authentication failed "
                  f"{auth_response.status_code}: "
                  f"{auth_response.text[:700]}"
              )

          auth_data = auth_response.json()

          token = auth_data.get("access_token")

          if not token:
              fail("No access_token returned by The Colony.")

          # ---------------------------------------------------------
          # 3. VERIFY NØX
          # ---------------------------------------------------------

          me = get_json(
              f"{BASE_URL}/users/me",
              token
          )

          nox_username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "nox_origine"
          )

          nox_id = str(
              me.get("id")
              or me.get("user", {}).get("id")
              or ""
          )

          # ---------------------------------------------------------
          # 4. LOAD PREVIOUS MEMORY
          # ---------------------------------------------------------

          publication = load_json(
              V70_PUBLICATION_FILE
          )

          v71 = load_json(
              V71_FILE
          )

          v72 = load_json(
              V72_FILE
          )

          # ---------------------------------------------------------
          # 5. IDENTIFY V70.2 POST
          # ---------------------------------------------------------

          post_id = ""

          possible_id_keys = [
              "post_id",
              "id",
              "published_post_id",
              "publication_id"
          ]

          for key in possible_id_keys:
              value = publication.get(key)

              if value:
                  post_id = str(value)
                  break

          publication_title = (
              publication.get("title")
              or "Proposal: a structured WORK_REQUEST format for executable tasks"
          )

          # Check nested publication objects if necessary.
          if not post_id:

              for key in [
                  "publication",
                  "post",
                  "result",
                  "data"
              ]:

                  nested = publication.get(key)

                  if not isinstance(nested, dict):
                      continue

                  for id_key in possible_id_keys:

                      value = nested.get(id_key)

                      if value:
                          post_id = str(value)
                          break

                  if post_id:
                      break

          # ---------------------------------------------------------
          # 6. FALLBACK: SEARCH RECENT POSTS
          # ---------------------------------------------------------

          if not post_id:

              posts_data = get_json(
                  f"{BASE_URL}/posts",
                  token,
                  params={"limit": 100}
              )

              posts = extract_items(posts_data)

              title_target = normalize(
                  publication_title
              ).lower()

              for post in posts:

                  title = normalize(
                      post.get("title", "")
                  ).lower()

                  author = item_author(
                      post
                  ).lower()

                  if (
                      title == title_target
                      and (
                          author == str(nox_username).lower()
                          or author in [
                              "nox_origine",
                              "nøx origin"
                          ]
                      )
                  ):

                      post_id = item_id(
                          post
                      )
                      break

          if not post_id:
              fail(
                  "Unable to identify the V70.2 publication post."
              )

          # ---------------------------------------------------------
          # 7. FETCH DIRECT POST
          # ---------------------------------------------------------

          post = get_json(
              f"{BASE_URL}/posts/{post_id}",
              token
          )

          # ---------------------------------------------------------
          # 8. FETCH FULL CONTEXT
          # ---------------------------------------------------------

          context = get_json(
              f"{BASE_URL}/posts/{post_id}/context",
              token
          )

          # ---------------------------------------------------------
          # 9. EXTRACT COMMENTS FROM CONTEXT
          # ---------------------------------------------------------

          comments = []

          context_candidates = [
              context.get("comments"),
              context.get("data", {}).get("comments")
              if isinstance(context.get("data"), dict)
              else None,
              context.get("post", {}).get("comments")
              if isinstance(context.get("post"), dict)
              else None
          ]

          for candidate in context_candidates:

              if isinstance(candidate, list):
                  comments.extend(candidate)

          # Recursive fallback for unusual API structures.
          if not comments:

              comments = extract_items(
                  context
              )

          # ---------------------------------------------------------
          # 10. NORMALIZE REAL COMMUNITY COMMENTS
          # ---------------------------------------------------------

          real_comments = []

          seen_comment_ids = set()

          for comment in comments:

              if not isinstance(comment, dict):
                  continue

              cid = item_id(
                  comment
              )

              body = normalize(
                  item_body(comment)
              )

              author = item_author(
                  comment
              )

              if not cid:
                  continue

              if cid in seen_comment_ids:
                  continue

              seen_comment_ids.add(cid)

              real_comments.append({
                  "id": cid,
                  "author": author,
                  "body": body,
                  "parent_id": str(
                      comment.get("parent_id")
                      or ""
                  ),
                  "raw": comment
              })

          # ---------------------------------------------------------
          # 11. SEPARATE COMMUNITY FROM NØX
          # ---------------------------------------------------------

          community_comments = []
          nox_comments = []

          for comment in real_comments:

              author = comment["author"].lower()

              is_nox = (
                  author == str(nox_username).lower()
                  or author == "nox_origine"
                  or author == "nøx origin"
                  or (
                      nox_id
                      and str(
                          comment["raw"].get("author_id")
                          or comment["raw"].get("user_id")
                          or ""
                      ) == nox_id
                  )
              )

              if is_nox:
                  nox_comments.append(comment)
              else:
                  community_comments.append(comment)

          # ---------------------------------------------------------
          # 12. LOAD V71 PROCESSED IDS
          # ---------------------------------------------------------

          v71_processed_ids = set()

          for key in [
              "processed_comment_ids",
              "replied_comment_ids"
          ]:

              values = v71.get(key)

              if isinstance(values, list):

                  for value in values:
                      v71_processed_ids.add(
                          str(value)
                      )

          # ---------------------------------------------------------
          # 13. COMPARE V71 WITH REAL API DATA
          # ---------------------------------------------------------

          actual_community_ids = {
              comment["id"]
              for comment in community_comments
          }

          missing_from_v71 = sorted(
              actual_community_ids
              - v71_processed_ids
          )

          stale_in_v71 = sorted(
              v71_processed_ids
              - actual_community_ids
          )

          # ---------------------------------------------------------
          # 14. RECOVER COMMUNITY EVIDENCE
          # ---------------------------------------------------------

          recovered_evidence = []

          for comment in community_comments:

              evidence = {
                  "comment_id": comment["id"],
                  "author": comment["author"],
                  "body": comment["body"],
                  "parent_id": comment["parent_id"]
              }

              recovered_evidence.append(
                  evidence
              )

          # ---------------------------------------------------------
          # 15. SIGNAL ANALYSIS ON REAL COMMENTS
          # ---------------------------------------------------------

          real_text = " ".join(
              comment["body"]
              for comment in community_comments
              if comment["body"]
          ).lower()

          def contains_any(words):
              return any(
                  word.lower() in real_text
                  for word in words
              )

          real_signals = {
              "verification": contains_any([
                  "verif",
                  "proof",
                  "evidence",
                  "falsif",
                  "acceptance criteria",
                  "checkable",
                  "independent",
                  "verify"
              ]),

              "closure": contains_any([
                  "closure",
                  "closed",
                  "completion",
                  "complete",
                  "done",
                  "abandoned",
                  "resolution",
                  "escalation",
                  "assigned"
              ]),

              "payment": contains_any([
                  "payment",
                  "payable",
                  "settlement",
                  "escrow",
                  "reward",
                  "paid",
                  "usdc",
                  "transaction"
              ]),

              "structure": contains_any([
                  "field",
                  "format",
                  "structure",
                  "requester",
                  "objective",
                  "application method",
                  "task",
                  "deliverable"
              ]),

              "noise": contains_any([
                  "signal",
                  "noise",
                  "keyword",
                  "false positive",
                  "false-positive",
                  "generic"
              ])
          }

          # ---------------------------------------------------------
          # 16. AUDIT V72
          # ---------------------------------------------------------

          v72_observation_count = len(
              v72.get("observations", [])
              if isinstance(
                  v72.get("observations"),
                  list
              )
              else []
          )

          actual_count = len(
              community_comments
          )

          evidence_recovery_success = (
              actual_count > 0
          )

          v72_recovery_failure = (
              actual_count > 0
              and v72_observation_count == 0
          )

          # ---------------------------------------------------------
          # 17. IDENTIFY THE ACTUAL FAILURE
          # ---------------------------------------------------------

          failure_reasons = []

          if v72_recovery_failure:
              failure_reasons.append(
                  "V72 reported no usable community observation "
                  "despite the V70.2 post containing community comments."
              )

          if missing_from_v71:
              failure_reasons.append(
                  "Some real community comment IDs were not represented "
                  "in V71 processed-comment memory."
              )

          if not community_comments:
              failure_reasons.append(
                  "The V73 context response did not expose community "
                  "comments in the expected structures."
              )

          if not failure_reasons:
              failure_reasons.append(
                  "No critical evidence-recovery failure was detected."
              )

          # ---------------------------------------------------------
          # 18. SELF-AUDIT CONCLUSION
          # ---------------------------------------------------------

          if v72_recovery_failure:

              audit_status = (
                  "V72_INPUT_RECOVERY_FAILURE_CONFIRMED"
              )

              conclusion = (
                  "V72 did not receive or recover the community evidence "
                  "that was actually available on the V70.2 publication. "
                  "Its confidence score and insufficient-evidence status "
                  "therefore described an input-recovery failure rather "
                  "than a genuine absence of community evidence."
              )

          elif actual_count > 0:

              audit_status = (
                  "COMMUNITY_EVIDENCE_RECOVERED"
              )

              conclusion = (
                  "V73 successfully recovered community evidence directly "
                  "from the V70.2 publication and can use it to compare "
                  "against previous memory."
              )

          else:

              audit_status = (
                  "EVIDENCE_NOT_RECOVERED"
              )

              conclusion = (
                  "V73 could not recover community comments from the "
                  "available API context."
              )

          # ---------------------------------------------------------
          # 19. NØX LEARNING
          # ---------------------------------------------------------

          learning = [
              (
                  "A local memory file must not be treated as the sole "
                  "source of truth when the original external evidence "
                  "can be retrieved."
              ),
              (
                  "Before declaring insufficient evidence, NØX should "
                  "verify whether the source itself contains recoverable "
                  "evidence."
              ),
              (
                  "Input-recovery failure and genuine evidence absence "
                  "must be represented as different states."
              ),
              (
                  "Direct source verification should precede confidence "
                  "scoring whenever the source is accessible."
              )
          ]

          if actual_count > 0:

              learning.append(
                  (
                      "The V70.2 publication currently contains "
                      f"{actual_count} community comment(s) recoverable "
                      "through the source context."
                  )
              )

          # ---------------------------------------------------------
          # 20. PROPOSED V74 DIRECTION
          # ---------------------------------------------------------

          v74_proposal = {
              "version": "V74",
              "purpose": (
                  "Use recovered primary-source community evidence "
                  "to rebuild and improve NØX's evolution proposal."
              ),
              "required_inputs": [
                  "V73 recovered community comments",
                  "V71 validation memory",
                  "V72 autonomous evolution proposal"
              ],
              "principles": [
                  "Primary source before local summary.",
                  "Evidence absence must be distinguished from retrieval failure.",
                  "Community feedback must be traceable to source comments.",
                  "Confidence must reflect evidence quality, not only quantity."
              ]
          }

          # ---------------------------------------------------------
          # 21. FINAL AUDIT OBJECT
          # ---------------------------------------------------------

          audit = {
              "version": "V73",
              "generated_at": now,
              "mode": "community_evidence_recovery_audit",

              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },

              "source": {
                  "post_id": post_id,
                  "title": (
                      post.get("title")
                      or publication_title
                  ),
                  "direct_post_retrieved": True,
                  "context_retrieved": True
              },

              "source_counts": {
                  "total_context_comments": len(real_comments),
                  "community_comments": actual_count,
                  "nox_comments": len(nox_comments)
              },

              "recovered_community_evidence": (
                  recovered_evidence
              ),

              "memory_comparison": {
                  "v71_processed_comment_ids": sorted(
                      v71_processed_ids
                  ),
                  "actual_community_comment_ids": sorted(
                      actual_community_ids
                  ),
                  "missing_from_v71": missing_from_v71,
                  "stale_in_v71": stale_in_v71
              },

              "real_signals": real_signals,

              "v72_audit": {
                  "v72_observation_count": (
                      v72_observation_count
                  ),
                  "actual_community_count": actual_count,
                  "recovery_failure_confirmed": (
                      v72_recovery_failure
                  ),
                  "audit_status": audit_status
              },

              "failure_reasons": failure_reasons,

              "conclusion": conclusion,

              "learning": learning,

              "v74_proposal": v74_proposal,

              "decision": {
                  "automatic_rule_change": False,
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini": False,
                  "human_decision_required_before_rule_deployment": True
              },

              "answer_status": (
                  "PRIMARY_SOURCE_EVIDENCE_RECOVERED"
                  if actual_count > 0
                  else "EVIDENCE_NOT_RECOVERED"
              ),

              "confidence": (
                  0.94
                  if actual_count > 0
                  else 0.30
              ),

              "safety": {
                  "automatic_external_action": False,
                  "automatic_rule_change": False,
                  "automatic_contact": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "raw_source_evidence_preserved": True,
                  "metadata_preserved": True
              }
          }

          # ---------------------------------------------------------
          # 22. WRITE JSON
          # ---------------------------------------------------------

          OUTPUT_JSON.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_JSON.write_text(
              json.dumps(
                  audit,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 23. WRITE MARKDOWN
          # ---------------------------------------------------------

          md = []

          md.append(
              "# NØX Origin — V73 Community Evidence
