name: NØX Origin - V30 Execution Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execution-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate execution gate locally
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid memory file: {exc}"
              )

          now = datetime.now(timezone.utc).isoformat()

          selected_action = memory.get(
              "selected_action"
          )

          selection_state = memory.get(
              "selection_state",
              {}
          )

          safety = memory.get(
              "action_safety",
              {}
          )

          history = memory.get(
              "history",
              []
          )

          if not isinstance(history, list):
              history = []

          # ---------------------------------------------------------
          # V30
          #
          # OBJECTIF :
          # créer une barrière de sécurité avant toute future action.
          #
          # IMPORTANT :
          # V30 NE CONTACTE PAS THE COLONY.
          # V30 NE PUBLIE RIEN.
          # V30 NE MODIFIE RIEN SUR THE COLONY.
          # V30 NE DEPENSE AUCUN ARGENT.
          # ---------------------------------------------------------

          gate_checks = {
              "action_exists": False,
              "action_is_selected": False,
              "action_is_planned": False,
              "execution_disabled_by_default": True,
              "external_actions_disabled": True,
              "the_colony_actions_disabled": True,
              "financial_actions_disabled": True,
              "irreversible_actions_disabled": True,
              "automatic_publication_disabled": True,
              "cost_limit_zero": True,
              "human_approval_required": True
          }

          # ---------------------------------------------------------
          # 1. Vérifier l'existence d'une action
          # ---------------------------------------------------------

          if isinstance(selected_action, dict):
              gate_checks["action_exists"] = True

              if selected_action.get("status") == "selected":
                  gate_checks["action_is_selected"] = True

              if selected_action.get("proposed_action"):
                  gate_checks["action_is_planned"] = True

          # ---------------------------------------------------------
          # 2. Vérifier les protections
          # ---------------------------------------------------------

          if safety.get(
              "external_actions_enabled",
              False
          ):
              gate_checks[
                  "external_actions_disabled"
              ] = False

          if safety.get(
              "the_colony_actions_enabled",
              False
          ):
              gate_checks[
                  "the_colony_actions_disabled"
              ] = False

          if safety.get(
              "financial_actions_enabled",
              False
          ):
              gate_checks[
                  "financial_actions_disabled"
              ] = False

          if safety.get(
              "irreversible_actions_enabled",
              False
          ):
              gate_checks[
                  "irreversible_actions_disabled"
              ] = False

          if safety.get(
              "automatic_publication_enabled",
              False
          ):
              gate_checks[
                  "automatic_publication_disabled"
              ] = False

          if float(
              safety.get("maximum_cost_eur", 0)
          ) != 0:
              gate_checks["cost_limit_zero"] = False

          # ---------------------------------------------------------
          # 3. Vérification globale
          # ---------------------------------------------------------

          security_conditions = [
              gate_checks[
                  "execution_disabled_by_default"
              ],
              gate_checks[
                  "external_actions_disabled"
              ],
              gate_checks[
                  "the_colony_actions_disabled"
              ],
              gate_checks[
                  "financial_actions_disabled"
              ],
              gate_checks[
                  "irreversible_actions_disabled"
              ],
              gate_checks[
                  "automatic_publication_disabled"
              ],
              gate_checks[
                  "cost_limit_zero"
              ],
              gate_checks[
                  "human_approval_required"
              ]
          ]

          security_passed = all(
              security_conditions
          )

          action_ready_for_future_review = (
              gate_checks["action_exists"]
              and gate_checks["action_is_selected"]
              and gate_checks["action_is_planned"]
              and security_passed
          )

          # ---------------------------------------------------------
          # IMPORTANT :
          # Le gate ne permet PAS encore l'exécution.
          # ---------------------------------------------------------

          execution_authorized = False

          gate_state = {
              "version": "V30",
              "updated_at": now,
              "security_passed": security_passed,
              "action_ready_for_future_review":
                  action_ready_for_future_review,
              "execution_authorized":
                  execution_authorized,
              "external_execution":
                  False,
              "the_colony_execution":
                  False,
              "publication_allowed":
                  False,
              "financial_execution":
                  False,
              "human_approval_required":
                  True,
              "cost_eur": 0,
              "checks": gate_checks,
              "method":
                  "local_execution_gate_v30"
          }

          # ---------------------------------------------------------
          # 4. Historique
          # ---------------------------------------------------------

          history.append({
              "version": "V30",
              "timestamp": now,
              "action_exists":
                  gate_checks["action_exists"],
              "action_selected":
                  gate_checks["action_is_selected"],
              "security_passed":
                  security_passed,
              "execution_authorized":
                  False,
              "the_colony_action":
                  False,
              "publication":
                  False,
              "financial_action":
                  False,
              "human_approval_required":
                  True,
              "gemini_used":
                  False,
              "cost_eur":
                  0,
              "method":
                  "local_execution_gate"
          })

          # ---------------------------------------------------------
          # 5. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V30"
          memory["updated_at"] = now
          memory["execution_gate"] = gate_state
          memory["execution_authorized"] = False
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 6. Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX
