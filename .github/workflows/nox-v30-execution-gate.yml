name: NØX Origin - V30 Execution Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execution-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute NØX V30 gate
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("ERROR: nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: invalid nox_memory.json: {exc}"
              )

          now = datetime.now(timezone.utc).isoformat()

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          principles = memory.get("principles", [])
          hypotheses = memory.get("hypotheses", [])
          validation_results = memory.get("validation_results", [])
          history = memory.get("history", [])

          if not isinstance(observations, list):
              observations = []

          if not isinstance(patterns, list):
              patterns = []

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(principles, list):
              principles = []

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(validation_results, list):
              validation_results = []

          if not isinstance(history, list):
              history = []

          # ---------------------------------------------------------
          # V30 - EXECUTION GATE
          # ---------------------------------------------------------
          # V30 ne réalise encore aucune action externe.
          # Il vérifie simplement si NØX possède suffisamment
          # de structure pour autoriser une future action.
          #
          # Aucun appel Gemini.
          # Aucun appel The Colony.
          # Coût : 0 EUR.
          # ---------------------------------------------------------

          supported = 0
          uncertain = 0
          rejected = 0

          for item in validation_results:
              if not isinstance(item, dict):
                  continue

              verdict = item.get("verdict")

              if verdict == "supported":
                  supported += 1
              elif verdict == "uncertain":
                  uncertain += 1
              elif verdict == "rejected":
                  rejected += 1

          hypotheses_count = len(hypotheses)

          # ---------------------------------------------------------
          # Conditions minimales d'autorisation
          # ---------------------------------------------------------

          gate_checks = {
              "memory_available": True,
              "observations_available": len(observations) > 0,
              "patterns_available": len(patterns) > 0,
              "knowledge_available": len(knowledge) > 0,
              "hypotheses_available": hypotheses_count > 0,
              "validation_available": len(validation_results) > 0,
              "no_rejected_hypotheses": rejected == 0
          }

          gate_passed = all(gate_checks.values())

          # ---------------------------------------------------------
          # Etat d'exécution
          # ---------------------------------------------------------

          execution_state = {
              "version": "V30",
              "updated_at": now,
              "gate_passed": gate_passed,
              "execution_enabled": gate_passed,
              "external_actions_enabled": False,
              "the_colony_actions_enabled": False,
              "gemini_used": False,
              "cost_eur": 0,
              "checks": gate_checks
          }

          # ---------------------------------------------------------
          # Historique
          # ---------------------------------------------------------

          history.append({
              "version": "V30",
              "timestamp": now,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "hypotheses_total": hypotheses_count,
              "supported": supported,
              "uncertain": uncertain,
              "rejected": rejected,
              "gate_passed": gate_passed,
              "external_actions_enabled": False,
              "the_colony_actions_enabled": False,
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_execution_gate_v30"
          })

          # ---------------------------------------------------------
          # Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V30"
          memory["updated_at"] = now
          memory["execution_state"] = execution_state
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Rapport
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V30 EXECUTION GATE")
          print("==========================================")
          print(f"Observations       : {len(observations)}")
          print(f"Patterns           : {len(patterns)}")
          print(f"Knowledge          : {len(knowledge)}")
          print(f"Principles         : {len(principles)}")
          print(f"Hypotheses         : {hypotheses_count}")
          print(f"Supported          : {supported}")
          print(f"Uncertain          : {uncertain}")
          print(f"Rejected           : {rejected}")
          print("------------------------------------------")
          print(f"Gate passed        : {gate_passed}")
          print("External actions   : DISABLED")
          print("The Colony         : DISABLED")
          print("Gemini             : NOT USED")
          print("Cost               : 0 EUR")
          print("==========================================")

          PY

      - name: Commit V30 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V30 execution gate"

          git push
