name: NØX ACT 19 V2 - Autonomous Decision Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act19-decision-engine
  cancel-in-progress: false

jobs:
  autonomous-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT19 V2 decision engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          print("=" * 80)
          print("NØX ACT19 V2 - AUTONOMOUS DECISION ENGINE")
          print("=" * 80)

          root = Path("memory")
          knowledge_file = root / "nox_knowledge_core.json"
          output_file = root / "nox_act_19_decisions.json"

          if not knowledge_file.exists():
              raise SystemExit(
                  f"ERROR: Required file not found: {knowledge_file}"
              )

          with knowledge_file.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Knowledge core must be a JSON object.")

          required_keys = [
              "knowledge",
              "processed_sources",
              "contradictions",
              "statistics",
              "active_attention",
              "knowledge_policy",
              "last_run",
          ]

          missing = [key for key in required_keys if key not in data]

          if missing:
              raise SystemExit(
                  "ERROR: Missing required keys: "
                  + ", ".join(missing)
              )

          knowledge = data["knowledge"]
          active_attention = data["active_attention"]
          contradictions = data["contradictions"]
          statistics = data["statistics"]
          policy = data["knowledge_policy"]

          if not isinstance(knowledge, list):
              raise SystemExit("ERROR: knowledge must be a list.")

          if not isinstance(active_attention, dict):
              raise SystemExit("ERROR: active_attention must be a dict.")

          if not isinstance(contradictions, list):
              raise SystemExit("ERROR: contradictions must be a list.")

          now = datetime.now(timezone.utc).isoformat()

          print(f"Knowledge items: {len(knowledge)}")
          print(f"Active attention items: {len(active_attention)}")
          print(f"Contradictions: {len(contradictions)}")

          def extract_text(item):
              if isinstance(item, str):
                  return item.strip()

              if isinstance(item, dict):
                  fields = [
                      "title",
                      "topic",
                      "subject",
                      "content",
                      "summary",
                      "description",
                      "question",
                      "text",
                      "principle",
                  ]

                  values = []

                  for field in fields:
                      value = item.get(field)
                      if isinstance(value, str) and value.strip():
                          values.append(value.strip())

                  return " ".join(values)

              return str(item)

          def calculate_relevance(text):
              text_lower = text.lower()

              weights = {
                  "ai agent": 0.25,
                  "ai agents": 0.25,
                  "autonom": 0.20,
                  "agent": 0.15,
                  "marketplace": 0.20,
                  "economy": 0.15,
                  "collaboration": 0.15,
                  "cybersecurity": 0.15,
                  "security": 0.10,
                  "regulation": 0.15,
                  "law": 0.10,
                  "learning": 0.15,
                  "attention": 0.15,
                  "decision": 0.15,
              }

              score = 0.0

              for term, weight in weights.items():
                  if term in text_lower:
                      score += weight

              return min(score, 1.0)

          candidates = []

          # ---------------------------------------------------------------
          # ACTIVE ATTENTION
          # ---------------------------------------------------------------

          for key, value in active_attention.items():
              text = extract_text(value)

              if not text:
                  text = str(key)

              relevance = calculate_relevance(text)

              candidates.append(
                  {
                      "candidate": str(key),
                      "source": "active_attention",
                      "evidence": text[:500],
                      "relevance": max(relevance, 0.70),
                      "confidence": 0.90,
                      "risk": 0.05,
                      "expected_value": 0.90,
                      "action_options": [
                          "deepen_attention",
                          "cross_check",
                          "connect_to_knowledge",
                      ],
                  }
              )

          # ---------------------------------------------------------------
          # KNOWLEDGE
          # ---------------------------------------------------------------

          for index, item in enumerate(knowledge):
              text = extract_text(item)

              if not text:
                  continue

              relevance = calculate_relevance(text)

              if relevance < 0.20:
                  continue

              candidates.append(
                  {
                      "candidate": f"knowledge_{index}",
                      "source": "knowledge",
                      "evidence": text[:500],
                      "relevance": relevance,
                      "confidence": 0.60,
                      "risk": 0.10,
                      "expected_value": min(
                          0.30 + relevance * 0.60,
                          1.0,
                      ),
                      "action_options": [
                          "review_and_prioritize",
                          "deepen_attention",
                          "cross_check",
                      ],
                  }
              )

          # ---------------------------------------------------------------
          # CONTRADICTIONS
          # ---------------------------------------------------------------

          if contradictions:
              candidates.append(
                  {
                      "candidate": "knowledge_contradictions",
                      "source": "contradictions",
                      "evidence": (
                          f"{len(contradictions)} contradiction(s) "
                          "require verification."
                      ),
                      "relevance": 0.80,
                      "confidence": 0.75,
                      "risk": 0.35,
                      "expected_value": 0.80,
                      "action_options": [
                          "verify_contradictions",
                          "cross_check",
                      ],
                  }
              )

          # ---------------------------------------------------------------
          # DECISION ENGINE V2
          # ---------------------------------------------------------------

          for candidate in candidates:
              relevance = candidate["relevance"]
              confidence = candidate["confidence"]
              risk = candidate["risk"]
              expected_value = candidate["expected_value"]

              score = (
                  relevance * 0.30
                  + expected_value * 0.30
                  + confidence * 0.25
                  - risk * 0.15
              )

              candidate["decision_score"] = round(
                  max(0.0, min(score, 1.0)),
                  4,
              )

              # V2 chooses the action according to the type of decision.
              if candidate["source"] == "contradictions":
                  candidate["recommended_action"] = "verify_contradictions"

              elif relevance >= 0.80 and confidence >= 0.80:
                  candidate["recommended_action"] = "deepen_attention"

              elif relevance >= 0.60:
                  candidate["recommended_action"] = "cross_check"

              else:
                  candidate["recommended_action"] = "review_and_prioritize"

          candidates.sort(
              key=lambda item: item["decision_score"],
              reverse=True,
          )

          candidates = candidates[:10]

          if candidates:
              selected = candidates[0]

              final_decision = {
                  "status": "DECISION_READY",
                  "selected_candidate": selected["candidate"],
                  "source": selected["source"],
                  "recommended_action": selected["recommended_action"],
                  "decision_score": selected["decision_score"],
                  "confidence": selected["confidence"],
                  "risk": selected["risk"],
                  "expected_value": selected["expected_value"],
                  "reason": (
                      "Selected by ACT19 V2 using relevance, expected value, "
                      "confidence, risk and active-attention evidence."
                  ),
              }
          else:
              final_decision = {
                  "status": "NO_ACTIONABLE_DECISION",
                  "selected_candidate": None,
                  "source": None,
                  "recommended_action": "continue_observing",
                  "decision_score": 0.0,
                  "confidence": 0.0,
                  "risk": 0.0,
                  "expected_value": 0.0,
                  "reason": (
                      "No sufficiently relevant candidate was detected."
                  ),
              }

          result = {
              "version": "ACT19_V2",
              "generated_at": now,
              "gemini_used": False,
              "project_cost_eur": 0,
              "decision_mode": "non_destructive",
              "knowledge_items_analyzed": len(knowledge),
              "active_attention_items": len(active_attention),
              "contradictions_analyzed": len(contradictions),
              "candidate_count": len(candidates),
              "final_decision": final_decision,
              "ranked_candidates": candidates,
              "policy_snapshot": policy,
              "statistics_snapshot": statistics,
          }

          root.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print()
          print("-" * 80)
          print("ACT19 V2 DECISION RESULT")
          print("-" * 80)
          print(
              json.dumps(
                  final_decision,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          print("-" * 80)
          print(f"Candidates evaluated: {len(candidates)}")
          print(f"Decision file: {output_file}")
          print("Gemini used: False")
          print("Project cost: 0 EUR")
          print("Mode: non-destructive")
          print("=" * 80)
          PY

      - name: Commit ACT19 V2 decision memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_19_decisions.json

          if git diff --cached --quiet; then
            echo "No ACT19 V2 changes to commit."
            exit 0
          fi

          git commit -m "ACT19 V2: improve autonomous decision engine"

      - name: Synchronize with main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push ACT19 V2 result
        run: |
          git push origin HEAD:main
