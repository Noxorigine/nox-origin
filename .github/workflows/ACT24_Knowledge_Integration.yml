name: NØX ACT24 V3 - Knowledge Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  knowledge-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Integrate validated knowledge
        run: |
          python -u <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          print("NØX ACT24 V3 - Knowledge Integration")
          print("Mode: KNOWLEDGE INTEGRATION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Web search executed: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")

          PLAN_FILE = "memory/nox_act_23_research_plan.json"
          CORE_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_act_24_knowledge_integration.json"

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"Warning: could not load {path}: {exc}")
                  return default

          def normalize(value):
              return re.sub(r"\s+", " ", str(value or "").strip())

          research_plan = load_json(PLAN_FILE, {})
          knowledge_core = load_json(CORE_FILE, {})

          queue = research_plan.get("research_queue", [])

          if not isinstance(queue, list):
              queue = []

          print(f"Research plans received from ACT23: {len(queue)}")

          # ------------------------------------------------------------
          # ACT24 PRINCIPLE
          # ------------------------------------------------------------
          #
          # ACT24 does NOT perform research.
          #
          # It only integrates evidence that is already present in the
          # ACT23 record or in another explicitly attached evidence field.
          #
          # A research plan by itself is NOT knowledge.
          # A question by itself is NOT evidence.
          # A target by itself is NOT a validated claim.
          #
          # Therefore, with the current ACT23 output, the expected result
          # is normally:
          #
          #   integrated = 0
          #   pending_validation = 3
          #
          # until actual evidence is available.
          # ------------------------------------------------------------

          def concept_from_target(target):
              """
              ACT23 V1 stores the selected curiosity item in:
                  curiosity_target

              This is the authoritative field.

              Fallbacks are retained for compatibility with future
              or older memory structures.
              """

              candidates = [
                  target.get("curiosity_target"),
                  target.get("topic"),
                  target.get("concept"),
                  target.get("research_topic"),
                  target.get("gap"),
                  target.get("target"),
                  target.get("title"),
              ]

              for candidate in candidates:
                  value = normalize(candidate)

                  if value:
                      return value

              return "UNSPECIFIED_RESEARCH_TARGET"

          def question_from_target(target):
              candidates = [
                  target.get("research_question"),
                  target.get("main_question"),
                  target.get("question"),
              ]

              for candidate in candidates:
                  value = normalize(candidate)

                  if value:
                      return value

              return ""

          def priority_from_target(target):
              candidates = [
                  target.get("curiosity_score"),
                  target.get("priority_score"),
                  target.get("score"),
              ]

              for candidate in candidates:
                  if candidate is None:
                      continue

                  try:
                      return int(candidate)
                  except (TypeError, ValueError):
                      pass

              return 0

          def extract_existing_evidence(target):
              """
              Extract ONLY explicit evidence already attached to the
              research-plan item.

              No research is performed.
              No external source is consulted.
              No unsupported inference is created.
              """

              evidence = []

              evidence_keys = (
                  "evidence",
                  "evidence_items",
                  "validated_evidence",
                  "sources",
                  "findings",
                  "validated_findings",
              )

              for key in evidence_keys:
                  value = target.get(key)

                  if not isinstance(value, list):
                      continue

                  for item in value:

                      if isinstance(item, dict):
                          text = normalize(
                              item.get("finding")
                              or item.get("claim")
                              or item.get("evidence")
                              or item.get("text")
                          )

                          if not text:
                              continue

                          evidence.append({
                              "text": text,
                              "source": normalize(item.get("source")),
                              "source_type": normalize(
                                  item.get("source_type")
                              ),
                              "verified": bool(item.get("verified", False)),
                          })

                      elif isinstance(item, str):
                          text = normalize(item)

                          if text:
                              evidence.append({
                                  "text": text,
                                  "source": "",
                                  "source_type": "",
                                  "verified": False,
                              })

              return evidence

          def validation_level(evidence):
              """
              Conservative validation policy.

              Evidence must be explicit.
              At least one identifiable source is required.
              Multiple evidence items strengthen provisional validation.
              """

              if not evidence:
                  return "NO_VALIDATED_EVIDENCE"

              sourced = [
                  item
                  for item in evidence
                  if item.get("source") or item.get("source_type")
              ]

              verified = [
                  item
                  for item in evidence
                  if item.get("verified") is True
              ]

              if len(evidence) >= 2 and len(sourced) >= 1:
                  return "PROVISIONALLY_VALIDATED"

              if len(verified) >= 1 and len(sourced) >= 1:
                  return "PROVISIONALLY_VALIDATED"

              return "EVIDENCE_PRESENT_NOT_YET_VALIDATED"

          integrations = []
          pending = []

          integrated_count = 0

          for index, target in enumerate(queue, start=1):

              if not isinstance(target, dict):
                  continue

              concept = concept_from_target(target)
              question = question_from_target(target)
              priority = priority_from_target(target)

              domain = normalize(target.get("domain"))
              source_act = normalize(target.get("source_act"))

              evidence = extract_existing_evidence(target)
              validation = validation_level(evidence)

              if validation == "PROVISIONALLY_VALIDATED":
                  knowledge_status = "INTEGRATED"
                  integrated_count += 1
              else:
                  knowledge_status = "PENDING_VALIDATION"

              record = {
                  "integration_id": f"act24-{index:03d}",
                  "source_act": source_act or "ACT23",
                  "domain": domain,
                  "concept": concept,
                  "research_question": question,
                  "priority_score": priority,
                  "evidence_count": len(evidence),
                  "validation_status": validation,
                  "knowledge_status": knowledge_status,
                  "evidence": evidence,
                  "integrated_at": (
                      datetime.now(timezone.utc).isoformat()
                      if knowledge_status == "INTEGRATED"
                      else None
                  ),
                  "integration_rule": (
                      "Only explicit evidence already present in local "
                      "memory is eligible. ACT24 does not perform research "
                      "or infer unsupported facts."
                  ),
              }

              integrations.append(record)

              if knowledge_status == "PENDING_VALIDATION":
                  pending.append(record)

          # ------------------------------------------------------------
          # Preserve previously integrated ACT24 knowledge.
          # ------------------------------------------------------------

          existing_integrated = []

          if isinstance(knowledge_core, dict):
              existing_integrated = knowledge_core.get(
                  "act24_integrated_knowledge",
                  []
              )

              if not isinstance(existing_integrated, list):
                  existing_integrated = []

          existing_from_previous_run = load_json(
              OUTPUT_FILE,
              {}
          )

          if isinstance(existing_from_previous_run, dict):
              previous_integrated = existing_from_previous_run.get(
                  "integrated_knowledge",
                  []
              )

              if isinstance(previous_integrated, list):
                  existing_integrated = (
                      existing_integrated + previous_integrated
                  )

          # Deduplicate by integration ID.
          deduplicated_existing = []
          known_ids = set()

          for item in existing_integrated:

              if not isinstance(item, dict):
                  continue

              integration_id = item.get("integration_id")

              if integration_id in known_ids:
                  continue

              if integration_id:
                  known_ids.add(integration_id)

              deduplicated_existing.append(item)

          new_integrated = []

          for item in integrations:

              if item["knowledge_status"] != "INTEGRATED":
                  continue

              if item["integration_id"] in known_ids:
                  continue

              new_integrated.append(item)
              known_ids.add(item["integration_id"])

          output = {
              "act": "ACT24",
              "name": "Knowledge Integration",
              "version": "V3",
              "mode": "INTEGRATION_ONLY",

              "gemini_used": False,
              "external_ai_used": False,
              "api_calls": False,
              "web_search_executed": False,
              "research_executed": False,

              "marketplace_actions": False,
              "publishing": False,
              "comments": False,
              "private_messages": False,
              "bids": False,
              "payments": False,

              "project_cost_eur": 0,

              "created_at": datetime.now(timezone.utc).isoformat(),

              "input": {
                  "source": PLAN_FILE,
                  "research_plans_received": len(queue),
              },

              "integration_policy": {
                  "requires_existing_evidence": True,
                  "requires_identifiable_source": True,
                  "requires_multiple_evidence_or_verified_source": True,
                  "unsupported_inference": False,
                  "research_performed": False,
                  "unknowns_preserved": True,
                  "conflicts_preserved": True,
              },

              "summary": {
                  "plans_received": len(queue),
                  "knowledge_records_evaluated": len(integrations),
                  "integrated": integrated_count,
                  "pending_validation": len(pending),
                  "new_integrated_records": len(new_integrated),
              },

              "integrated_knowledge": (
                  deduplicated_existing + new_integrated
              ),

              "pending_validation": pending,

              "next_act": {
                  "act": "ACT25",
                  "role": (
                      "Evaluate whether validated knowledge improves "
                      "decisions."
                  ),
              },
          }

          os.makedirs("memory", exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("ACT24 V3 RESULT")
          print(f"Research plans received: {len(queue)}")
          print(
              f"Knowledge records evaluated: {len(integrations)}"
          )
          print(
              f"Knowledge records integrated: {integrated_count}"
          )
          print(
              f"Pending validation: {len(pending)}"
          )
          print(
              f"New integrated records: {len(new_integrated)}"
          )

          if pending:
              print()
              print("Pending knowledge:")

              for i, item in enumerate(pending, start=1):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | "
                      f"{item.get('concept')}"
                  )

                  question = item.get("research_question")

                  if question:
                      print(f"   Question: {question}")

          if new_integrated:
              print()
              print("Integrated knowledge:")

              for i, item in enumerate(new_integrated, start=1):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | "
                      f"{item.get('concept')}"
                  )

          print()
          print(f"Output: {OUTPUT_FILE}")
          PY

      - name: Commit ACT24 V3 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_24_knowledge_integration.json

          if git diff --cached --quiet; then
            echo "No ACT24 V3 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT24 V3 - fix research target integration"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
