name: NØX ACT24 V2 - Knowledge Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  knowledge-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Integrate validated knowledge
        run: |
          python -u <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          print("NØX ACT24 V2 - Knowledge Integration")
          print("Mode: KNOWLEDGE INTEGRATION ONLY")
          print("Gemini: false")
          print("External AI: false")
          print("API calls: false")
          print("Web search executed: false")
          print("Marketplace actions: false")
          print("Publishing: false")
          print("Comments/DMs: false")
          print("Payments: false")
          print("Project cost: 0 EUR")

          PLAN_FILE = "memory/nox_act_23_research_plan.json"
          CORE_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_act_24_knowledge_integration.json"

          def load_json(path, default):
              if not os.path.exists(path):
                  return default
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          research_plan = load_json(PLAN_FILE, {})
          knowledge_core = load_json(CORE_FILE, {})

          queue = research_plan.get("research_queue", [])

          print(f"Research plans received from ACT23: {len(queue)}")

          # ACT24 does NOT perform research.
          # It only integrates evidence already present in local memory.

          def normalize(text):
              return re.sub(r"\s+", " ", str(text or "").strip())

          def extract_existing_evidence(target):
              evidence = []

              for key in (
                  "evidence",
                  "evidence_items",
                  "validated_evidence",
                  "sources",
                  "findings",
                  "validated_findings",
              ):
                  value = target.get(key)

                  if isinstance(value, list):
                      for item in value:
                          if isinstance(item, dict):
                              text = normalize(
                                  item.get("finding")
                                  or item.get("claim")
                                  or item.get("evidence")
                                  or item.get("text")
                              )

                              if text:
                                  evidence.append({
                                      "text": text,
                                      "source": item.get("source"),
                                      "source_type": item.get("source_type"),
                                  })

                          elif isinstance(item, str) and normalize(item):
                              evidence.append({
                                  "text": normalize(item),
                                  "source": None,
                                  "source_type": None,
                              })

              return evidence

          # ACT23 V1 stores the research target under "topic".
          # Keep fallbacks for compatibility with future/older structures.
          def concept_from_target(target):
              candidates = [
                  target.get("topic"),
                  target.get("concept"),
                  target.get("research_topic"),
                  target.get("gap"),
                  target.get("target"),
                  target.get("title"),
              ]

              for candidate in candidates:
                  value = normalize(candidate)
                  if value:
                      return value

              return "UNSPECIFIED_RESEARCH_TARGET"

          def question_from_target(target):
              candidates = [
                  target.get("research_question"),
                  target.get("main_question"),
                  target.get("question"),
              ]

              for candidate in candidates:
                  value = normalize(candidate)
                  if value:
                      return value

              return ""

          def validation_level(evidence):
              if not evidence:
                  return "NO_VALIDATED_EVIDENCE"

              with_source = [
                  e for e in evidence
                  if e.get("source") or e.get("source_type")
              ]

              if len(evidence) >= 2 and len(with_source) >= 1:
                  return "PROVISIONALLY_VALIDATED"

              return "EVIDENCE_PRESENT_NOT_YET_VALIDATED"

          integrations = []
          pending = []
          integrated_count = 0

          for index, target in enumerate(queue, start=1):
              if not isinstance(target, dict):
                  continue

              priority = target.get(
                  "curiosity_score",
                  target.get("score", target.get("priority_score", 0))
              )

              domain = normalize(target.get("domain"))
              concept = concept_from_target(target)
              question = question_from_target(target)

              evidence = extract_existing_evidence(target)
              level = validation_level(evidence)

              record = {
                  "integration_id": f"act24-{index:03d}",
                  "domain": domain,
                  "concept": concept,
                  "research_question": question,
                  "priority_score": priority,
                  "evidence_count": len(evidence),
                  "validation_status": level,
                  "knowledge_status": (
                      "INTEGRATED"
                      if level == "PROVISIONALLY_VALIDATED"
                      else "PENDING_VALIDATION"
                  ),
                  "evidence": evidence,
                  "integrated_at": (
                      datetime.now(timezone.utc).isoformat()
                      if level == "PROVISIONALLY_VALIDATED"
                      else None
                  ),
                  "integration_rule": (
                      "Only evidence already present in local memory is eligible. "
                      "ACT24 does not perform research or infer unsupported facts."
                  ),
              }

              integrations.append(record)

              if level == "PROVISIONALLY_VALIDATED":
                  integrated_count += 1
              else:
                  pending.append(record)

          existing_integrated = []

          if isinstance(knowledge_core, dict):
              existing_integrated = knowledge_core.get(
                  "act24_integrated_knowledge",
                  []
              )

              if not isinstance(existing_integrated, list):
                  existing_integrated = []

          known_ids = {
              item.get("integration_id")
              for item in existing_integrated
              if isinstance(item, dict)
          }

          new_integrated = [
              item
              for item in integrations
              if item["knowledge_status"] == "INTEGRATED"
              and item["integration_id"] not in known_ids
          ]

          output = {
              "act": "ACT24",
              "name": "Knowledge Integration",
              "version": "V2",
              "mode": "INTEGRATION_ONLY",
              "gemini_used": False,
              "external_ai_used": False,
              "api_calls": False,
              "web_search_executed": False,
              "research_executed": False,
              "project_cost_eur": 0,
              "created_at": datetime.now(timezone.utc).isoformat(),

              "input": {
                  "source": PLAN_FILE,
                  "research_plans_received": len(queue),
              },

              "integration_policy": {
                  "requires_existing_evidence": True,
                  "requires_source_or_multiple_evidence": True,
                  "unsupported_inference": False,
                  "research_performed": False,
                  "unknowns_preserved": True,
              },

              "summary": {
                  "plans_received": len(queue),
                  "integrated": integrated_count,
                  "pending_validation": len(pending),
                  "new_integrated_records": len(new_integrated),
              },

              "integrated_knowledge": (
                  existing_integrated + new_integrated
              ),

              "pending_validation": pending,

              "next_act": {
                  "act": "ACT25",
                  "role": (
                      "Evaluate whether validated knowledge improves "
                      "decisions."
                  ),
              },
          }

          os.makedirs("memory", exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print()
          print("ACT24 V2 RESULT")
          print(f"Research plans received: {len(queue)}")
          print(f"Knowledge records integrated: {integrated_count}")
          print(f"Pending validation: {len(pending)}")
          print(f"New integrated records: {len(new_integrated)}")

          if pending:
              print()
              print("Pending knowledge:")

              for i, item in enumerate(pending, start=1):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | {item.get('concept')}"
                  )

                  if item.get("research_question"):
                      print(
                          f"   Question: {item.get('research_question')}"
                      )

          if new_integrated:
              print()
              print("Integrated knowledge:")

              for i, item in enumerate(new_integrated, start=1):
                  print(
                      f"{i}. [{item.get('priority_score')}] "
                      f"{item.get('domain')} | {item.get('concept')}"
                  )

          print()
          print(f"Output: {OUTPUT_FILE}")
          PY

      - name: Commit ACT24 V2 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_24_knowledge_integration.json

          if git diff --cached --quiet; then
            echo "No ACT24 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT24 V2 - improve knowledge target mapping"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
