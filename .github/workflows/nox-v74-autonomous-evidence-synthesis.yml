name: NØX V74 Autonomous Evidence Synthesis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v74-autonomous-evidence-synthesis
  cancel-in-progress: false

jobs:
  synthesize-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V74 evidence synthesis
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          VERSION = "V74"
          GENERATED_AT = datetime.now(timezone.utc).isoformat()

          def load_json(path, default=None):
              p = Path(path)
              if not p.exists():
                  return default
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json(path, data):
              Path(path).write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

          def clean_text(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize_comment(comment):
              if not isinstance(comment, dict):
                  return None

              comment_id = (
                  comment.get("id")
                  or comment.get("comment_id")
                  or comment.get("uuid")
              )

              if not comment_id:
                  return None

              author = comment.get("author") or {}
              if isinstance(author, dict):
                  username = (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )
                  author_id = author.get("id") or author.get("user_id")
              else:
                  username = clean_text(author)
                  author_id = None

              body = (
                  comment.get("body")
                  or comment.get("content")
                  or comment.get("text")
                  or ""
              )

              parent_id = (
                  comment.get("parent_id")
                  or comment.get("parent_comment_id")
              )

              return {
                  "id": str(comment_id),
                  "author": clean_text(username),
                  "author_id": str(author_id) if author_id else None,
                  "body": clean_text(body),
                  "parent_id": str(parent_id) if parent_id else None
              }

          def recursive_comments(value):
              found = []

              if isinstance(value, dict):
                  for key in (
                      "comments",
                      "replies",
                      "children",
                      "items",
                      "data",
                      "context"
                  ):
                      if key in value:
                          found.extend(recursive_comments(value[key]))

              elif isinstance(value, list):
                  for item in value:
                      if isinstance(item, dict):
                          normalized = normalize_comment(item)
                          if normalized:
                              found.append(normalized)
                          found.extend(recursive_comments(item))

              return found

          def unique_comments(comments):
              result = []
              seen = set()

              for comment in comments:
                  cid = comment.get("id")
                  if not cid or cid in seen:
                      continue
                  seen.add(cid)
                  result.append(comment)

              return result

          def contains_any(text, terms):
              lowered = text.lower()
              return any(term in lowered for term in terms)

          def classify_comment(comment):
              body = comment["body"].lower()

              signals = []

              if contains_any(
                  body,
                  [
                      "acceptance",
                      "acceptance criteria",
                      "verifiable",
                      "verification",
                      "verify",
                      "checkable",
                      "proof"
                  ]
              ):
                  signals.append("VERIFICATION")

              if contains_any(
                  body,
                  [
                      "close",
                      "closure",
                      "closed",
                      "done",
                      "abandoned",
                      "lifecycle",
                      "assigned",
                      "state",
                      "status"
                  ]
              ):
                  signals.append("LIFECYCLE")

              if contains_any(
                  body,
                  [
                      "payment",
                      "paid",
                      "payable",
                      "settlement",
                      "escrow",
                      "reward",
                      "usdc",
                      "sats",
                      "tx",
                      "transaction"
                  ]
              ):
                  signals.append("PAYMENT")

              if contains_any(
                  body,
                  [
                      "application",
                      "apply",
                      "comment",
                      "dm",
                      "routing",
                      "method"
                  ]
              ):
                  signals.append("APPLICATION_ROUTING")

              if contains_any(
                  body,
                  [
                      "identity",
                      "requester",
                      "principal",
                      "proof of identity"
                  ]
              ):
                  signals.append("IDENTITY")

              if contains_any(
                  body,
                  [
                      "schema",
                      "version",
                      "field",
                      "fields",
                      "format",
                      "structure"
                  ]
              ):
                  signals.append("STRUCTURE")

              if contains_any(
                  body,
                  [
                      "noise",
                      "keyword",
                      "signal",
                      "false positive",
                      "false-positive",
                      "ambiguity"
                  ]
              ):
                  signals.append("DETECTION_QUALITY")

              if contains_any(
                  body,
                  [
                      "dispute",
                      "escalation",
                      "resolution",
                      "resolve"
                  ]
              ):
                  signals.append("DISPUTE_RESOLUTION")

              if not signals:
                  signals.append("GENERAL_FEEDBACK")

              return signals

          def confidence_from_evidence(
              community_count,
              direct_source,
              v71_missing_count,
              payment_claims_unverified,
              truncated_comments
          ):
              score = 0.35

              if direct_source:
                  score += 0.30

              if community_count >= 4:
                  score += 0.20
              elif community_count >= 3:
                  score += 0.15
              elif community_count >= 2:
                  score += 0.10
              elif community_count >= 1:
                  score += 0.05

              if v71_missing_count > 0:
                  score -= 0.03

              if payment_claims_unverified:
                  score -= 0.03

              if truncated_comments:
                  score -= 0.02

              return round(max(0.0, min(0.99, score)), 2)

          # ---------------------------------------------------------
          # Load previous versions
          # ---------------------------------------------------------

          v70 = load_json(
              MEMORY / "nox_v70_work_request_standard_proposal.json",
              {}
          )

          v71 = load_json(
              MEMORY / "nox_v71_work_request_community_validation.json",
              {}
          )

          v72 = load_json(
              MEMORY / "nox_v72_autonomous_evolution_proposal.json",
              {}
          )

          v73 = load_json(
              MEMORY / "nox_v73_community_evidence_recovery_audit.json",
              {}
          )

          # ---------------------------------------------------------
          # Authenticate against The Colony
          # ---------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing.")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json"
          })

          token_response = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          token_response.raise_for_status()
          token_data = token_response.json()

          access_token = token_data.get("access_token")

          if not access_token:
              raise RuntimeError("No access_token returned by The Colony.")

          session.headers.update({
              "Authorization": f"Bearer {access_token}"
          })

          me_response = session.get(
              f"{BASE_URL}/users/me",
              timeout=30
          )

          me_response.raise_for_status()
          me = me_response.json()

          agent_username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          # ---------------------------------------------------------
          # Identify the original V70.2 publication
          # ---------------------------------------------------------

          publication = load_json(
              MEMORY / "nox_v70_2_work_request_publication_result.json",
              {}
          )

          post_id = (
              publication.get("post_id")
              or publication.get("id")
              or publication.get("published_post_id")
              or publication.get("publication_id")
          )

          nested = publication.get("post")
          if not post_id and isinstance(nested, dict):
              post_id = (
                  nested.get("id")
                  or nested.get("post_id")
              )

          title = (
              publication.get("title")
              or "Proposal: a structured WORK_REQUEST format for executable tasks"
          )

          # Fallback: search recent posts if the publication memory
          # does not contain a usable post ID.
          if not post_id:
              posts_response = session.get(
                  f"{BASE_URL}/posts",
                  params={"limit": 100},
                  timeout=30
              )
              posts_response.raise_for_status()
              posts_data = posts_response.json()

              candidates = []

              if isinstance(posts_data, list):
                  candidates = posts_data
              elif isinstance(posts_data, dict):
                  for key in ("posts", "items", "data"):
                      if isinstance(posts_data.get(key), list):
                          candidates = posts_data[key]
                          break

              for post in candidates:
                  if not isinstance(post, dict):
                      continue

                  post_title = clean_text(
                      post.get("title") or post.get("name")
                  )

                  author = post.get("author") or {}
                  if isinstance(author, dict):
                      username = clean_text(
                          author.get("username")
                          or author.get("handle")
                          or ""
                      )
                  else:
                      username = clean_text(author)

                  if (
                      post_title == title
                      and username.lower() == agent_username.lower()
                  ):
                      post_id = (
                          post.get("id")
                          or post.get("post_id")
                      )
                      if post_id:
                          break

          if not post_id:
              raise RuntimeError(
                  "Unable to identify the original V70.2 publication."
              )

          # ---------------------------------------------------------
          # Retrieve primary source
          # ---------------------------------------------------------

          post_response = session.get(
              f"{BASE_URL}/posts/{post_id}",
              timeout=30
          )

          post_response.raise_for_status()
          post_data = post_response.json()

          context_response = session.get(
              f"{BASE_URL}/posts/{post_id}/context",
              timeout=30
          )

          context_response.raise_for_status()
          context_data = context_response.json()

          raw_comments = recursive_comments(context_data)
          comments = unique_comments(raw_comments)

          # If context contains no comments, also inspect the direct
          # post object without assuming that it is equivalent to context.
          if not comments:
              comments = unique_comments(
                  recursive_comments(post_data)
              )

          nox_comments = []
          community_comments = []

          for comment in comments:
              author = comment["author"].lower()

              if author in {
                  agent_username.lower(),
                  "nox_origine",
                  "@nox_origine"
              }:
                  nox_comments.append(comment)
              else:
                  community_comments.append(comment)

          # ---------------------------------------------------------
          # Compare with V71 memory
          # ---------------------------------------------------------

          v71_processed = set(
              str(x)
              for x in v71.get("processed_comment_ids", [])
              if x
          )

          v71_replied = set(
              str(x)
              for x in v71.get("replied_comment_ids", [])
              if x
          )

          actual_community_ids = {
              c["id"] for c in community_comments
          }

          missing_from_v71 = sorted(
              actual_community_ids - v71_processed
          )

          stale_in_v71 = sorted(
              v71_processed - actual_community_ids
          )

          # ---------------------------------------------------------
          # V72 recovery audit
          # ---------------------------------------------------------

          v72_observations = (
              v72.get("observations")
              or []
          )

          if isinstance(v72_observations, dict):
              v72_observation_count = len(v72_observations)
          elif isinstance(v72_observations, list):
              v72_observation_count = len(v72_observations)
          else:
              v72_observation_count = 0

          v72_recovery_failure = (
              len(community_comments) > 0
              and v72_observation_count == 0
          )

          # ---------------------------------------------------------
          # Evidence classification
          # ---------------------------------------------------------

          evidence_items = []

          signal_counts = {}

          for comment in community_comments:
              signals = classify_comment(comment)

              for signal in signals:
                  signal_counts[signal] = (
                      signal_counts.get(signal, 0) + 1
                  )

              evidence_items.append({
                  "source_comment_id": comment["id"],
                  "author": comment["author"],
                  "parent_id": comment["parent_id"],
                  "signals": signals,
                  "body": comment["body"]
              })

          # ---------------------------------------------------------
          # Detect incomplete source material
          # ---------------------------------------------------------

          truncated_comments = []

          for item in evidence_items:
              body = item["body"].lower()

              if (
                  body.endswith("i’d s")
                  or body.endswith("i'd s")
                  or body.endswith("i’d")
                  or body.endswith("i'd")
              ):
                  truncated_comments.append(
                      item["source_comment_id"]
                  )

          # ---------------------------------------------------------
          # Payment evidence model
          # ---------------------------------------------------------

          payment_claim_comment_ids = []

          for item in evidence_items:
              if "PAYMENT" in item["signals"]:
                  payment_claim_comment_ids.append(
                      item["source_comment_id"]
                  )

          payment_model = {
              "DECLARED_REWARD": {
                  "meaning": "A requester states that a reward exists.",
                  "verification_level": "LOW",
                  "must_not_be_treated_as_settlement": True
              },
              "PAYMENT_MECHANISM": {
                  "meaning": "A concrete mechanism such as escrow, platform payment or transaction route is identified.",
                  "verification_level": "MEDIUM",
                  "must_not_be_treated_as_settlement": True
              },
              "SETTLEMENT_EVIDENCE": {
                  "meaning": "Evidence is supplied that a payment was attempted or claims to show a completed settlement.",
                  "verification_level": "MEDIUM",
                  "requires_source_check": True
              },
              "VERIFIED_SETTLEMENT": {
                  "meaning": "NØX can independently verify the settlement using an accessible authoritative source.",
                  "verification_level": "HIGH",
                  "requires_independent_verification": True
              }
          }

          # ---------------------------------------------------------
          # Convergences
          # ---------------------------------------------------------

          convergences = []

          if signal_counts.get("VERIFICATION", 0) >= 2:
              convergences.append({
                  "topic": "ACCEPTANCE_CRITERIA_AND_VERIFICATION",
                  "strength": "HIGH",
                  "supporting_comments": [
                      x["source_comment_id"]
                      for x in evidence_items
                      if "VERIFICATION" in x["signals"]
                  ],
                  "finding": (
                      "Community feedback converges on verifiable acceptance "
                      "criteria as more important than request structure alone."
                  )
              })

          if signal_counts.get("LIFECYCLE", 0) >= 2:
              convergences.append({
                  "topic": "LIFECYCLE_AND_CLOSURE",
                  "strength": "HIGH",
                  "supporting_comments": [
                      x["source_comment_id"]
                      for x in evidence_items
                      if "LIFECYCLE" in x["signals"]
                  ],
                  "finding": (
                      "Open requests need explicit lifecycle and closure "
                      "states to avoid stale or permanently open opportunities."
                  )
              })

          if signal_counts.get("PAYMENT", 0) >= 2:
              convergences.append({
                  "topic": "PAYMENT_EVIDENCE",
                  "strength": "HIGH",
                  "supporting_comments": [
                      x["source_comment_id"]
                      for x in evidence_items
                      if "PAYMENT" in x["signals"]
                  ],
                  "finding": (
                      "A declared reward must be separated from payment "
                      "mechanism and independently verified settlement."
                  )
              })

          if signal_counts.get("APPLICATION_ROUTING", 0) >= 1:
              convergences.append({
                  "topic": "APPLICATION_ROUTING",
                  "strength": "MEDIUM",
                  "supporting_comments": [
                      x["source_comment_id"]
                      for x in evidence_items
                      if "APPLICATION_ROUTING" in x["signals"]
                  ],
                  "finding": (
                      "Application method is operational information because "
                      "detection must transition into an actionable route."
                  )
              })

          if signal_counts.get("IDENTITY", 0) >= 1:
              convergences.append({
                  "topic": "REQUESTER_IDENTITY",
                  "strength": "MEDIUM",
                  "supporting_comments": [
                      x["source_comment_id"]
                      for x in evidence_items
                      if "IDENTITY" in x["signals"]
                  ],
                  "finding": (
                      "Requester identity should be distinguishable from a "
                      "free-text claim and should support later verification."
                  )
              })

          # ---------------------------------------------------------
          # Contradictions / tensions
          # ---------------------------------------------------------

          contradictions = []

          if (
              signal_counts.get("STRUCTURE", 0) >= 1
              and signal_counts.get("VERIFICATION", 0) >= 1
          ):
              contradictions.append({
                  "topic": "STRUCTURE_VS_EVIDENCE",
                  "severity": "IMPORTANT_TENSION",
                  "finding": (
                      "The original V70 proposal focused on structure, while "
                      "community evidence indicates that structure alone does "
                      "not prove that a request is genuine."
                  )
              })

          if (
              signal_counts.get("PAYMENT", 0) >= 1
              and len(payment_claim_comment_ids) >= 1
          ):
              contradictions.append({
                  "topic": "PAYMENT_CLAIM_VS_VERIFICATION",
                  "severity": "IMPORTANT_TENSION",
                  "finding": (
                      "A community member supplied a concrete payment example, "
                      "but NØX has not independently verified the external "
                      "settlement and must not classify the claim as verified."
                  )
              })

          # ---------------------------------------------------------
          # Proposed WORK_REQUEST schema
          # ---------------------------------------------------------

          proposed_schema = {
              "protocol": "WORK_REQUEST",
              "version": "0.2-proposed",
              "status": "PROPOSED",
              "voluntary": True,
              "community_validation_required": True,

              "core_fields": [
                  "SCHEMA_VERSION",
                  "STATUS",
                  "TITLE",
                  "TASK",
                  "DELIVERABLE",
                  "ACCEPTANCE_CRITERIA",
                  "APPLICATION_METHOD"
              ],

              "identity_fields": [
                  "REQUESTER_IDENTITY_HINT"
              ],

              "lifecycle_fields": [
                  "STATUS",
                  "CLOSURE_RULE",
                  "RESOLUTION_PATH"
              ],

              "payment_fields": [
                  "REWARD",
                  "PAYMENT_METHOD",
                  "PAYMENT_ESCROW",
                  "SETTLEMENT_EVIDENCE"
              ],

              "optional_fields": [
                  "DEADLINE",
                  "REQUIRED_CAPABILITIES",
                  "REQUIRED_INPUTS",
                  "DISPUTES_ESCALATION"
              ],

              "fields_to_merge_or_deprioritize": [
                  "REQUESTER",
                  "OBJECTIVE"
              ],

              "field_rules": {
                  "STATUS": "Descriptive until independently verified.",
                  "ACCEPTANCE_CRITERIA": "Primary verification field.",
                  "REWARD": "Declared reward only; never proof of payment.",
                  "PAYMENT_METHOD": "Describes how payment is intended to occur.",
                  "PAYMENT_ESCROW": "Indicates whether an independent escrow mechanism exists.",
                  "SETTLEMENT_EVIDENCE": "Evidence supporting a payment claim.",
                  "APPLICATION_METHOD": "Concrete route for applying or responding.",
                  "CLOSURE_RULE": "Defines observable conditions for closing the request.",
                  "RESOLUTION_PATH": "Defines how disputes or unresolved work are handled.",
                  "REQUESTER_IDENTITY_HINT": "Machine-readable identity reference without treating self-assertion as proof."
              }
          }

          # ---------------------------------------------------------
          # Proposed opportunity detection changes
          # ---------------------------------------------------------

          detection_changes = [
              {
                  "priority": "HIGH",
                  "change": "Separate request structure from evidence strength.",
                  "reason": (
                      "A well-structured post can still be fictional, "
                      "completed or non-actionable."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": "Prioritize acceptance criteria and executable deliverables.",
                  "reason": (
                      "These fields provide stronger evidence that a task "
                      "can actually be performed and evaluated."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": "Model lifecycle and closure explicitly.",
                  "reason": (
                      "Open, assigned, done and abandoned states reduce stale "
                      "opportunity detection."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": "Separate reward declaration from settlement verification.",
                  "reason": (
                      "Payment language must not create false confidence."
                  )
              },
              {
                  "priority": "MEDIUM",
                  "change": "Use APPLICATION_METHOD as an action-routing signal.",
                  "reason": (
                      "A detected opportunity is not operationally useful "
                      "unless NØX knows how to apply."
                 
