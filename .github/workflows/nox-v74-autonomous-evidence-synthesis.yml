name: NØX V74 Autonomous Evidence Synthesis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v74-autonomous-evidence-synthesis
  cancel-in-progress: false

jobs:
  synthesize-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V74 evidence synthesis
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          VERSION = "V74"
          GENERATED_AT = datetime.now(timezone.utc).isoformat()

          def load_json(path, default=None):
              path = Path(path)
              if not path.exists():
                  return default

              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json(path, data):
              Path(path).write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

          def clean(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize_comment(comment):
              if not isinstance(comment, dict):
                  return None

              comment_id = (
                  comment.get("id")
                  or comment.get("comment_id")
                  or comment.get("uuid")
              )

              if not comment_id:
                  return None

              author = comment.get("author") or {}

              if isinstance(author, dict):
                  username = (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )
                  author_id = (
                      author.get("id")
                      or author.get("user_id")
                  )
              else:
                  username = clean(author)
                  author_id = None

              body = (
                  comment.get("body")
                  or comment.get("content")
                  or comment.get("text")
                  or ""
              )

              parent_id = (
                  comment.get("parent_id")
                  or comment.get("parent_comment_id")
              )

              return {
                  "id": str(comment_id),
                  "author": clean(username),
                  "author_id": clean(author_id) if author_id else None,
                  "body": clean(body),
                  "parent_id": clean(parent_id) if parent_id else None
              }

          def collect_comments(value, output):
              if isinstance(value, dict):

                  normalized = normalize_comment(value)

                  if normalized:
                      output.append(normalized)

                  for key in (
                      "comments",
                      "replies",
                      "children",
                      "items",
                      "data",
                      "context"
                  ):
                      if key in value:
                          collect_comments(value[key], output)

              elif isinstance(value, list):

                  for item in value:
                      collect_comments(item, output)

          def unique_comments(items):
              result = []
              seen = set()

              for item in items:
                  comment_id = item.get("id")

                  if not comment_id:
                      continue

                  if comment_id in seen:
                      continue

                  seen.add(comment_id)
                  result.append(item)

              return result

          def has_signal(text, terms):
              text = text.lower()
              return any(term in text for term in terms)

          def classify_comment(comment):
              body = comment["body"].lower()
              signals = []

              verification_terms = [
                  "acceptance",
                  "acceptance criteria",
                  "verifiable",
                  "verification",
                  "verify",
                  "checkable",
                  "proof"
              ]

              lifecycle_terms = [
                  "closure",
                  "closed",
                  "close",
                  "done",
                  "abandoned",
                  "lifecycle",
                  "assigned",
                  "in progress",
                  "state",
                  "status"
              ]

              payment_terms = [
                  "payment",
                  "paid",
                  "payable",
                  "settlement",
                  "escrow",
                  "reward",
                  "usdc",
                  "sats",
                  "transaction",
                  "tx"
              ]

              application_terms = [
                  "application",
                  "apply",
                  "comment",
                  "dm",
                  "routing",
                  "application_method"
              ]

              identity_terms = [
                  "identity",
                  "requester",
                  "principal",
                  "identity proof"
              ]

              structure_terms = [
                  "schema",
                  "version",
                  "field",
                  "fields",
                  "format",
                  "structure"
              ]

              detection_terms = [
                  "noise",
                  "keyword",
                  "signal",
                  "false positive",
                  "false-positive",
                  "ambiguity"
              ]

              dispute_terms = [
                  "dispute",
                  "escalation",
                  "resolution",
                  "resolve"
              ]

              if has_signal(body, verification_terms):
                  signals.append("VERIFICATION")

              if has_signal(body, lifecycle_terms):
                  signals.append("LIFECYCLE")

              if has_signal(body, payment_terms):
                  signals.append("PAYMENT")

              if has_signal(body, application_terms):
                  signals.append("APPLICATION_ROUTING")

              if has_signal(body, identity_terms):
                  signals.append("IDENTITY")

              if has_signal(body, structure_terms):
                  signals.append("STRUCTURE")

              if has_signal(body, detection_terms):
                  signals.append("DETECTION_QUALITY")

              if has_signal(body, dispute_terms):
                  signals.append("DISPUTE_RESOLUTION")

              if not signals:
                  signals.append("GENERAL_FEEDBACK")

              return signals

          def count_signals(evidence):
              counts = {}

              for item in evidence:
                  for signal in item["signals"]:
                      counts[signal] = counts.get(signal, 0) + 1

              return counts

          # ---------------------------------------------------------
          # LOAD PREVIOUS VERSIONS
          # ---------------------------------------------------------

          v70 = load_json(
              MEMORY / "nox_v70_work_request_standard_proposal.json",
              {}
          )

          v71 = load_json(
              MEMORY / "nox_v71_work_request_community_validation.json",
              {}
          )

          v72 = load_json(
              MEMORY / "nox_v72_autonomous_evolution_proposal.json",
              {}
          )

          v73 = load_json(
              MEMORY / "nox_v73_community_evidence_recovery_audit.json",
              {}
          )

          # ---------------------------------------------------------
          # AUTHENTICATION
          # ---------------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing.")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json"
          })

          token_response = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          token_response.raise_for_status()

          token_data = token_response.json()

          access_token = token_data.get("access_token")

          if not access_token:
              raise RuntimeError(
                  "The Colony did not return an access token."
              )

          session.headers.update({
              "Authorization": f"Bearer {access_token}"
          })

          me_response = session.get(
              f"{BASE_URL}/users/me",
              timeout=30
          )

          me_response.raise_for_status()

          me = me_response.json()

          agent_username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          # ---------------------------------------------------------
          # FIND V70.2 PUBLICATION
          # ---------------------------------------------------------

          publication = load_json(
              MEMORY / "nox_v70_2_work_request_publication_result.json",
              {}
          )

          post_id = (
              publication.get("post_id")
              or publication.get("id")
              or publication.get("published_post_id")
              or publication.get("publication_id")
          )

          if not post_id:
              nested_post = publication.get("post")

              if isinstance(nested_post, dict):
                  post_id = (
                      nested_post.get("id")
                      or nested_post.get("post_id")
                  )

          title = (
              publication.get("title")
              or "Proposal: a structured WORK_REQUEST format for executable tasks"
          )

          if not post_id:

              posts_response = session.get(
                  f"{BASE_URL}/posts",
                  params={"limit": 100},
                  timeout=30
              )

              posts_response.raise_for_status()

              posts_data = posts_response.json()

              candidates = []

              if isinstance(posts_data, list):
                  candidates = posts_data

              elif isinstance(posts_data, dict):

                  for key in (
                      "posts",
                      "items",
                      "data"
                  ):

                      if isinstance(posts_data.get(key), list):
                          candidates = posts_data[key]
                          break

              for post in candidates:

                  if not isinstance(post, dict):
                      continue

                  post_title = clean(
                      post.get("title")
                      or post.get("name")
                  )

                  author = post.get("author") or {}

                  if isinstance(author, dict):
                      username = clean(
                          author.get("username")
                          or author.get("handle")
                          or ""
                      )
                  else:
                      username = clean(author)

                  if (
                      post_title == title
                      and username.lower() == agent_username.lower()
                  ):
                      post_id = (
                          post.get("id")
                          or post.get("post_id")
                      )

                      if post_id:
                          break

          if not post_id:
              raise RuntimeError(
                  "Unable to identify the V70.2 publication."
              )

          # ---------------------------------------------------------
          # RETRIEVE PRIMARY SOURCE
          # ---------------------------------------------------------

          post_response = session.get(
              f"{BASE_URL}/posts/{post_id}",
              timeout=30
          )

          post_response.raise_for_status()

          post_data = post_response.json()

          context_response = session.get(
              f"{BASE_URL}/posts/{post_id}/context",
              timeout=30
          )

          context_response.raise_for_status()

          context_data = context_response.json()

          raw_comments = []

          collect_comments(
              context_data,
              raw_comments
          )

          comments = unique_comments(raw_comments)

          if not comments:

              fallback_comments = []

              collect_comments(
                  post_data,
                  fallback_comments
              )

              comments = unique_comments(
                  fallback_comments
              )

          # ---------------------------------------------------------
          # SEPARATE COMMUNITY / NØX COMMENTS
          # ---------------------------------------------------------

          community_comments = []
          nox_comments = []

          own_names = {
              agent_username.lower(),
              "nox_origine",
              "@nox_origine"
          }

          for comment in comments:

              author = comment["author"].lower()

              if author in own_names:
                  nox_comments.append(comment)
              else:
                  community_comments.append(comment)

          # ---------------------------------------------------------
          # COMPARE WITH V71 MEMORY
          # ---------------------------------------------------------

          v71_processed = set(
              str(value)
              for value in v71.get(
                  "processed_comment_ids",
                  []
              )
              if value
          )

          v71_replied = set(
              str(value)
              for value in v71.get(
                  "replied_comment_ids",
                  []
              )
              if value
          )

          actual_community_ids = {
              comment["id"]
              for comment in community_comments
          }

          missing_from_v71 = sorted(
              actual_community_ids - v71_processed
          )

          stale_in_v71 = sorted(
              v71_processed - actual_community_ids
          )

          # ---------------------------------------------------------
          # AUDIT V72
          # ---------------------------------------------------------

          observations = v72.get(
              "observations",
              []
          )

          if isinstance(observations, list):
              v72_observation_count = len(observations)
          elif isinstance(observations, dict):
              v72_observation_count = len(observations)
          else:
              v72_observation_count = 0

          v72_recovery_failure = (
              len(community_comments) > 0
              and v72_observation_count == 0
          )

          # ---------------------------------------------------------
          # CLASSIFY PRIMARY SOURCE COMMENTS
          # ---------------------------------------------------------

          evidence_items = []

          for comment in community_comments:

              signals = classify_comment(comment)

              evidence_items.append({
                  "source_comment_id": comment["id"],
                  "author": comment["author"],
                  "parent_id": comment["parent_id"],
                  "signals": signals,
                  "body": comment["body"]
              })

          signal_counts = count_signals(
              evidence_items
          )

          # ---------------------------------------------------------
          # DETECT POSSIBLE TRUNCATION
          # ---------------------------------------------------------

          truncated_comment_ids = []

          for item in evidence_items:

              body = item["body"].lower().rstrip()

              if (
                  body.endswith("i’d s")
                  or body.endswith("i'd s")
                  or body.endswith("i’d")
                  or body.endswith("i'd")
              ):
                  truncated_comment_ids.append(
                      item["source_comment_id"]
                  )

          # ---------------------------------------------------------
          # CONVERGENCES
          # ---------------------------------------------------------

          convergences = []

          verification_ids = [
              item["source_comment_id"]
              for item in evidence_items
              if "VERIFICATION" in item["signals"]
          ]

          if len(verification_ids) >= 2:

              convergences.append({
                  "topic": "ACCEPTANCE_CRITERIA_AND_VERIFICATION",
                  "strength": "HIGH",
                  "supporting_comments": verification_ids,
                  "finding": (
                      "Community feedback converges on verifiable "
                      "acceptance criteria as stronger evidence than "
                      "request structure alone."
                  )
              })

          lifecycle_ids = [
              item["source_comment_id"]
              for item in evidence_items
              if "LIFECYCLE" in item["signals"]
          ]

          if len(lifecycle_ids) >= 2:

              convergences.append({
                  "topic": "LIFECYCLE_AND_CLOSURE",
                  "strength": "HIGH",
                  "supporting_comments": lifecycle_ids,
                  "finding": (
                      "Open requests need explicit lifecycle and "
                      "closure semantics to avoid stale opportunities."
                  )
              })

          payment_ids = [
              item["source_comment_id"]
              for item in evidence_items
              if "PAYMENT" in item["signals"]
          ]

          if len(payment_ids) >= 2:

              convergences.append({
                  "topic": "PAYMENT_EVIDENCE",
                  "strength": "HIGH",
                  "supporting_comments": payment_ids,
                  "finding": (
                      "A declared reward must be separated from the "
                      "payment mechanism and independently verified settlement."
                  )
              })

          routing_ids = [
              item["source_comment_id"]
              for item in evidence_items
              if "APPLICATION_ROUTING" in item["signals"]
          ]

          if len(routing_ids) >= 1:

              convergences.append({
                  "topic": "APPLICATION_ROUTING",
                  "strength": "MEDIUM",
                  "supporting_comments": routing_ids,
                  "finding": (
                      "Application method is operational information "
                      "because opportunity detection must lead to an "
                      "actionable route."
                  )
              })

          identity_ids = [
              item["source_comment_id"]
              for item in evidence_items
              if "IDENTITY" in item["signals"]
          ]

          if len(identity_ids) >= 1:

              convergences.append({
                  "topic": "REQUESTER_IDENTITY",
                  "strength": "MEDIUM",
                  "supporting_comments": identity_ids,
                  "finding": (
                      "Requester identity should be attributable and "
                      "distinguishable from unsupported free-text claims."
                  )
              })

          # ---------------------------------------------------------
          # CONTRADICTIONS / TENSIONS
          # ---------------------------------------------------------

          contradictions = []

          if (
              signal_counts.get("STRUCTURE", 0) >= 1
              and signal_counts.get("VERIFICATION", 0) >= 1
          ):

              contradictions.append({
                  "topic": "STRUCTURE_VS_EVIDENCE",
                  "severity": "IMPORTANT_TENSION",
                  "finding": (
                      "The original V70 proposal emphasized structure, "
                      "while community evidence shows that structure "
                      "does not prove that a request is genuine."
                  )
              })

          if payment_ids:

              contradictions.append({
                  "topic": "PAYMENT_CLAIM_VS_VERIFICATION",
                  "severity": "IMPORTANT_TENSION",
                  "finding": (
                      "A community member supplied a concrete payment "
                      "example, but NØX has not independently verified "
                      "the external settlement."
                  )
              })

          # ---------------------------------------------------------
          # PROPOSED WORK_REQUEST SCHEMA
          # ---------------------------------------------------------

          proposed_schema = {
              "protocol": "WORK_REQUEST",
              "version": "0.2-proposed",
              "status": "PROPOSED",
              "voluntary": True,
              "community_validation_required": True,

              "core_fields": [
                  "SCHEMA_VERSION",
                  "STATUS",
                  "TITLE",
                  "TASK",
                  "DELIVERABLE",
                  "ACCEPTANCE_CRITERIA",
                  "APPLICATION_METHOD"
              ],

              "identity_fields": [
                  "REQUESTER_IDENTITY_HINT"
              ],

              "lifecycle_fields": [
                  "STATUS",
                  "CLOSURE_RULE",
                  "RESOLUTION_PATH"
              ],

              "payment_fields": [
                  "REWARD",
                  "PAYMENT_METHOD",
                  "PAYMENT_ESCROW",
                  "SETTLEMENT_EVIDENCE"
              ],

              "optional_fields": [
                  "DEADLINE",
                  "REQUIRED_CAPABILITIES",
                  "REQUIRED_INPUTS",
                  "DISPUTES_ESCALATION"
              ],

              "fields_to_merge_or_deprioritize": [
                  "REQUESTER",
                  "OBJECTIVE"
              ],

              "field_rules": {
                  "STATUS": (
                      "Descriptive until independently supported."
                  ),
                  "ACCEPTANCE_CRITERIA": (
                      "Primary verification field."
                  ),
                  "REWARD": (
                      "Declared reward only; never proof of payment."
                  ),
                  "PAYMENT_METHOD": (
                      "Describes intended payment route."
                  ),
                  "PAYMENT_ESCROW": (
                      "Indicates whether an independent escrow mechanism exists."
                  ),
                  "SETTLEMENT_EVIDENCE": (
                      "Evidence supporting a payment claim."
                  ),
                  "APPLICATION_METHOD": (
                      "Concrete route for applying or responding."
                  ),
                  "CLOSURE_RULE": (
                      "Observable conditions for closing the request."
                  ),
                  "RESOLUTION_PATH": (
                      "Method for handling unresolved work or disputes."
                  ),
                  "REQUESTER_IDENTITY_HINT": (
                      "Machine-readable identity reference without treating "
                      "self-assertion as proof."
                  )
              }
          }

          # ---------------------------------------------------------
          # DETECTION CHANGES
          # ---------------------------------------------------------

          detection_changes = [
              {
                  "priority": "HIGH",
                  "change": (
                      "Separate request structure from evidence strength."
                  ),
                  "reason": (
                      "A well-structured post can still be fictional, "
                      "completed or non-actionable."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": (
                      "Prioritize acceptance criteria and executable deliverables."
                  ),
                  "reason": (
                      "These provide stronger evidence that a task can "
                      "actually be performed and evaluated."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": (
                      "Model lifecycle and closure explicitly."
                  ),
                  "reason": (
                      "Open, assigned, in-progress, done and abandoned "
                      "states reduce stale opportunity detection."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": (
                      "Separate reward declaration from settlement verification."
                  ),
                  "reason": (
                      "Payment language must not create false confidence."
                  )
              },
              {
                  "priority": "MEDIUM",
                  "change": (
                      "Use APPLICATION_METHOD as an action-routing signal."
                  ),
                  "reason": (
                      "A detected opportunity is not operationally useful "
                      "unless NØX knows how to apply."
                  )
              },
              {
                  "priority": "MEDIUM",
                  "change": (
                      "Preserve requester identity as a verification hint."
                  ),
                  "reason": (
                      "Identity helps distinguish attributable requests "
                      "from unsupported free-text claims."
                  )
              },
              {
                  "priority": "HIGH",
                  "change": (
                      "Keep V71 and V72 retrieval failures as regression cases."
                  ),
                  "reason": (
                      "Future versions must verify source retrieval before "
                      "declaring insufficient evidence."
                  )
              }
          ]

          # ---------------------------------------------------------
          # PAYMENT EVIDENCE MODEL
          # ---------------------------------------------------------

          payment_model = {
              "DECLARED_REWARD": {
                  "meaning": (
                      "Requester states that a reward exists."
                  ),
                  "verification_level": "LOW",
                  "settlement_verified": False
              },
              "PAYMENT_MECHANISM": {
                  "meaning": (
                      "Concrete payment route such as escrow, platform "
                      "payment or transaction method is identified."
                  ),
                  "verification_level": "MEDIUM",
                  "settlement_verified": False
              },
              "SETTLEMENT_EVIDENCE": {
                  "meaning": (
                      "Evidence is supplied that a payment was attempted "
                      "or claims to show completed settlement."
                  ),
                  "verification_level": "MEDIUM",
                  "requires_source_check": True
              },
              "VERIFIED_SETTLEMENT": {
                  "meaning": (
                      "NØX independently verifies the settlement using "
                      "an accessible authoritative source."
                  ),
                  "verification_level": "HIGH",
                  "requires_independent_verification": True
              }
          }

          # ---------------------------------------------------------
          # LIFECYCLE MODEL
          # ---------------------------------------------------------

          lifecycle_model = {
              "states": [
                  "OPEN",
                  "ASSIGNED",
                  "IN_PROGRESS",
                  "DONE",
                  "ABANDONED",
                  "DISPUTED"
              ],
              "closure_required": True,
              "principle": (
                  "Lifecycle state is descriptive unless supported "
                  "by observable evidence."
              )
          }

          # ---------------------------------------------------------
          # APPLICATION ROUTING MODEL
          # ---------------------------------------------------------

          application_routing_model = {
              "required_signal": "APPLICATION_METHOD",
              "accepted_routes": [
                  "COMMENT",
                  "REPLY",
                  "DM",
                  "COLONY_POST",
                  "EXTERNAL_FORM",
                  "OTHER"
              ],
              "principle": (
                  "Finding an opportunity and knowing how to apply "
                  "are separate detection problems."
              )
          }

          # ---------------------------------------------------------
          # IDENTITY MODEL
          # ---------------------------------------------------------

          identity_model = {
              "field": "REQUESTER_IDENTITY_HINT",
              "principle": (
                  "Identity attribution is evidence about who made "
                  "the request, not proof that the request is genuine."
              )
          }

          # ---------------------------------------------------------
          # REGRESSION CASES
          # ---------------------------------------------------------

          regression_cases = [
              {
                  "id": "REG-V71-MISSING-COMMENTS",
                  "type": "COMMUNITY_EVIDENCE_RECOVERY",
                  "description": (
                      "V71 stored fewer community comments than the "
                      "primary source contained."
                  ),
                  "expected_behavior": (
                      "Compare local memory with the primary source "
                      "and recover missing evidence."
                  ),
                  "missing_comment_ids": missing_from_v71
              },
              {
                  "id": "REG-V72-ZERO-OBSERVATIONS",
                  "type": "INPUT_RECOVERY",
                  "description": (
                      "V72 produced zero observations although the "
                      "primary source contained community comments."
                  ),
                  "expected_behavior": (
                      "Classify this as retrieval failure rather than "
                      "absence of community evidence."
                  ),
                  "primary_source_count": len(community_comments),
                  "v72_observation_count": v72_observation_count
              }
          ]

          # ---------------------------------------------------------
          # IMPORTANT CRITICISMS
          # ---------------------------------------------------------

          important_criticisms = []

          for item in evidence_items:

              if "VERIFICATION" in item["signals"]:

                  important_criticisms.append({
                      "source_comment_id": item["source_comment_id"],
                      "author": item["author"],
                      "dimension": "VERIFICATION",
                      "summary": (
                          "Acceptance criteria and independently checkable "
                          "evidence are more valuable than structure alone."
                      )
                  })

              if "PAYMENT" in item["signals"]:

                  important_criticisms.append({
                      "source_comment_id": item["source_comment_id"],
                      "author": item["author"],
                      "dimension": "PAYMENT",
                      "summary": (
                          "Reward claims must be separated from actual "
                          "settlement evidence."
                      )
                  })

              if "LIFECYCLE" in item["signals"]:

                  important_criticisms.append({
                      "source_comment_id": item["source_comment_id"],
                      "author": item["author"],
                      "dimension": "LIFECYCLE",
                      "summary": (
                          "Requests need explicit lifecycle and closure semantics."
                      )
                  })

              if "APPLICATION_ROUTING" in item["signals"]:

                  important_criticisms.append({
                      "source_comment_id": item["source_comment_id"],
                      "author": item["author"],
                      "dimension": "APPLICATION_ROUTING",
                      "summary": (
                          "The request should expose how an agent can apply."
                      )
                  })

              if "IDENTITY" in item["signals"]:

                  important_criticisms.append({
                      "source_comment_id": item["source_comment_id"],
                      "author": item["author"],
                      "dimension": "IDENTITY",
                      "summary": (
                          "Requester identity should be attributable "
                          "and distinguishable from unsupported claims."
                      )
                  })

          # ---------------------------------------------------------
          # NEXT TEST
          # ---------------------------------------------------------

          next_test = {
              "version": "V75",
              "purpose": (
                  "Test an evidence-weighted opportunity detector using "
                  "the community-derived WORK_REQUEST model without "
                  "automatically acting on opportunities."
              ),
              "questions": [
                  "Does evidence weighting reduce false positives?",
                  "Does lifecycle awareness exclude completed or stale work?",
                  "Does payment separation prevent reward-language false positives?",
                  "Does application routing improve actionable opportunity detection?",
                  "Does direct-source verification prevent V72-style recovery failures?"
              ],
              "success_conditions": [
                  "No automatic publication.",
                  "No automatic comments.",
                  "No automatic DM.",
                  "No automatic bidding.",
                  "No automatic payment.",
                  "Gemini remains disabled.",
                  "Regression cases remain preserved.",
                  "Important classifications remain source-traceable."
              ]
          }

          # ---------------------------------------------------------
          # STATUS
          # ---------------------------------------------------------

          primary_verified = bool(
              v73.get("source", {}).get(
                  "primary_source_verified",
                  False
              )
          )

          if not community_comments:

              answer_status = "EVIDENCE_ABSENT"

          elif not primary_verified:

              answer_status = "EVIDENCE_PARTIALLY_RECOVERED"

          elif v72_recovery_failure:

              answer_status = (
                  "EVIDENCE_RECOVERED_AFTER_RECOVERY_FAILURE"
              )

          else:

              answer_status = "EVIDENCE_RECOVERED"

          confidence = 0.35

          if primary_verified:
              confidence += 0.30

          if len(community_comments) >= 4:
              confidence += 0.20
          elif len(community_comments) >= 3:
              confidence += 0.15
          elif len(community_comments) >= 2:
              confidence += 0.10
          elif len(community_comments) >= 1:
              confidence += 0.05

          if missing_from_v71:
              confidence -= 0.03

          if payment_ids:
              confidence -= 0.03

          if truncated_comment_ids:
              confidence -= 0.02

          confidence = round(
              max(0.0, min(0.99, confidence)),
              2
          )

          # ---------------------------------------------------------
          # FINAL RESULT
          # ---------------------------------------------------------

          result = {
              "version": VERSION,
              "generated_at": GENERATED_AT,
              "mode": "autonomous_evidence_synthesis",

              "agent": {
                  "username": agent_username
              },

              "source": {
                  "post_id": str(post_id),
                  "title": title,
                  "direct_post_retrieved": True,
                  "context_retrieved": True,
                  "primary_source_verified": primary_verified
              },

              "source_counts": {
                  "total_context_comments": len(comments),
                  "community_comments": len(community_comments),
                  "nox_comments": len(nox_comments)
              },

              "source_evidence": evidence_items,

              "memory_comparison": {
                  "v71_processed_comment_ids": sorted(
                      v71_processed
                  ),
                  "v71_replied_comment_ids": sorted(
                      v71_replied
                  ),
                  "actual_community_comment_ids": sorted(
                      actual_community_ids
                  ),
                  "missing_from_v71": missing_from_v71,
                  "stale_in_v71": stale_in_v71
              },

              "v72_audit": {
                  "v72_observation_count": v72_observation_count,
                  "actual_community_count": len(
                      community_comments
                  ),
                  "recovery_failure_confirmed": v72_recovery_failure,
                  "audit_status": (
                      "V72_INPUT_RECOVERY_FAILURE_CONFIRMED"
                      if v72_recovery_failure
                      else "NO_V72_RECOVERY_FAILURE_DETECTED"
                  )
              },

              "community_signals": signal_counts,

              "convergences": convergences,

              "contradictions": contradictions,

              "important_criticisms": important_criticisms,

              "proposed_schema_changes": proposed_schema,

              "proposed_detection_changes": detection_changes,

              "payment_evidence_model": payment_model,

              "lifecycle_model": lifecycle_model,

              "application_routing_model": application_routing_model,

              "identity_model": identity_model,

              "regression_cases": regression_cases,

              "hypotheses": [
                  (
                      "Opportunity quality is likely to improve more "
                      "from evidence weighting than from simply adding "
                      "descriptive fields."
                  ),
                  (
                      "Primary-source verification should occur before "
                      "declaring insufficient evidence."
                  ),
                  (
                      "Payment claims should progress from declared reward "
                      "to independently verified settlement."
                  )
              ],

              "next_test": next_test,

              "decision_readiness": {
                  "status": "PROPOSAL_READY_FOR_HUMAN_REVIEW",
                  "automatic_rule_deployment": False,
                  "human_approval_required": True
              },

              "answer_status": answer_status,
              "confidence": confidence,

              "actions_taken": [],

              "scope": {
                  "personalized_feed": False,
                  "public_recent_posts": False,
                  "marketplace_actions": False,
                  "comments": False,
                  "dm": False,
                  "payments": False,
                  "bidding": False,
                  "publication": False,
                  "gemini": False
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_rule_change": False,
                  "automatic_contact": False,
                  "automatic_payment": False,
                  "automatic_bidding": False,
                  "automatic_publication": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "metadata_preserved": True,
                  "source_traceability_required": True,
                  "regression_cases_preserved": True
              }
          }

          # ---------------------------------------------------------
          # MARKDOWN REPORT
          # ---------------------------------------------------------

          md = []

          md.append(
              "# NØX Origin — V74 Autonomous Evidence Synthesis"
          )
          md.append("")
          md.append(f"Generated: {GENERATED_AT}")
          md.append("")

          md.append("## Objective")
          md.append("")
          md.append(
              "Synthesize recovered primary-source community evidence "
              "into a traceable proposal for improving WORK_REQUEST "
              "structure and opportunity detection."
          )
          md.append("")

          md.append("## Source")
          md.append("")
          md.append(f"- Post ID: `{post_id}`")
          md.append(f"- Title: {title}")
          md.append(
              f"- Context comments: {len(comments)}"
          )
          md.append(
              f"- Community comments: {len(community_comments)}"
          )
          md.append(
              f"- NØX comments: {len(nox_comments)}"
          )
          md.append("")

          md.append("## Evidence status")
          md.append("")
          md.append(
              f"- Answer status: **{answer_status}**"
          )
          md.append(
              f"- Confidence: **{confidence}**"
          )
          md.append(
              f"- Primary source verified: **{primary_verified}**"
          )
          md.append("")

          md.append("## V72 audit")
          md.append("")

          if v72_recovery_failure:

              md.append(
                  "V72 input-recovery failure confirmed: the primary "
                  f"source contained {len(community_comments)} community "
                  "comments while V72 recovered zero observations."
              )

          else:

              md.append(
                  "No V72 input-recovery failure detected."
              )

          md.append("")

          md.append("## Community evidence")
          md.append("")

          for item in evidence_items:

              md.append(
                  f"### {item['author']} — `{item['source_comment_id']}`"
              )
              md.append("")
              md.append(
                  "Signals: "
                  + ", ".join(item["signals"])
              )
              md.append("")
              md.append(item["body"])
              md.append("")

          md.append("## Main convergences")
          md.append("")

          if convergences:

              for item in convergences:

                  md.append(
                      f"- **{item['strength']} — {item['topic']}**: "
                      f"{item['finding']}"
                  )

          else:

              md.append(
                  "- No strong convergence detected."
              )

          md.append("")

          md.append("## Contradictions / tensions")
          md.append("")

          if contradictions:

              for item in contradictions:

                  md.append(
                      f"- **{item['topic']}**: "
                      f"{item['finding']}"
                  )

          else:

              md.append(
                  "- No material contradiction detected."
              )

          md.append("")

          md.append("## Proposed schema evolution")
          md.append("")
          md.append(
              "The central evolution is from a structure-only model "
              "toward an evidence-aware WORK_REQUEST model."
          )
          md.append("")
          md.append(
              "Core fields: "
              + ", ".join(
                  proposed_schema["core_fields"]
              )
          )
          md.append("")
          md.append(
              "Payment evidence fields: "
              + ", ".join(
                  proposed_schema["payment_fields"]
              )
          )
          md.append("")

          md.append("## Payment evidence")
          md.append("")
          md.append(
              "NØX must distinguish a declared reward from a payment "
              "mechanism, settlement evidence and independently verified settlement."
          )
          md.append("")
          md.append(
              "The community payment example is preserved as a claim/example "
              "and is not automatically classified as verified settlement."
          )
          md.append("")

          md.append("## Detection changes")
          md.append("")

          for change in detection_changes:

              md.append(
                  f"- **{change['priority']}** — "
                  f"{change['change']}: {change['reason']}"
              )

          md.append("")

          md.append("## Regression cases")
          md.append("")

          for case in regression_cases:

              md.append(
                  f"- **{case['id']}** — {case['description']}"
              )
              md.append(
                  f"  Expected: {case['expected_behavior']}"
              )

          md.append("")

          md.append("## Next stage")
          md.append("")
          md.append(
              f"Proposed next version: **{next_test['version']}**"
          )
          md.append("")
          md.append(
              next_test["purpose"]
          )
          md.append("")

          md.append("## Decision boundary")
          md.append("")
          md.append(
              "V74 only synthesizes evidence and proposes changes. "
              "It does not modify production rules, publish, comment, "
              "DM, bid or make payments."
          )
          md.append("")
          md.append(
              "Human approval remains required before deployment "
              "of any new detection rule."
          )
          md.append("")

          md.append("## Cost")
          md.append("")
          md.append("- Gemini: disabled")
          md.append("- Project cost: €0")
          md.append("")

          json_path = (
              MEMORY / "nox_v74_autonomous_evidence_synthesis.json"
          )

          md_path = (
              MEMORY / "nox_v74_autonomous_evidence_synthesis.md"
          )

          save_json(
              json_path,
              result
          )

          md_path.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print(
              f"Saved: {json_path}"
          )

          print(
              f"Saved: {md_path}"
          )

          PY

      - name: Commit V74 evidence synthesis
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v74_autonomous_evidence_synthesis.json
          git add memory/nox_v74_autonomous_evidence_synthesis.md

          if git diff --cached --quiet; then
            echo "No V74 changes to commit."
          else
            git commit -m "Add NØX V74 autonomous evidence synthesis"
            git push
          fi
