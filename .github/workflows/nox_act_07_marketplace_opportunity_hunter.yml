name: NØX ACT 07 Marketplace Opportunity Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  marketplace-opportunity-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT 07
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          BASE_URL = "https://thecolony.cc/api/v1"
          MEMORY_FILE = "memory/nox_act_07_marketplace_opportunity_hunter.json"

          MAX_OPPORTUNITIES = 30
          MAX_STORED_OPPORTUNITIES = 100

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json"
          })

          api_key = os.getenv("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          # ---------------------------------------------------------
          # Authentication
          # ---------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          auth.raise_for_status()

          token_data = auth.json()
          access_token = token_data.get("access_token")

          if not access_token:
              raise RuntimeError("No access_token returned by The Colony")

          session.headers.update({
              "Authorization": f"Bearer {access_token}"
          })

          # ---------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------

          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "version": "ACT 07",
                      "processed_ids": [],
                      "opportunities": [],
                      "observations": [],
                      "runs": []
                  }

              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {
                      "version": "ACT 07",
                      "processed_ids": [],
                      "opportunities": [],
                      "observations": [],
                      "runs": []
                  }

          def save_memory(memory):
              os.makedirs(os.path.dirname(MEMORY_FILE), exist_ok=True)

              with open(MEMORY_FILE, "w", encoding="utf-8") as f:
                  json.dump(memory, f, indent=2, ensure_ascii=False)

          def get_list(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "results",
                      "posts",
                      "tasks",
                      "listings",
                      "opportunities",
                      "data"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def text_of(item):
              if not isinstance(item, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "summary",
                  "requirements"
              ):
                  value = item.get(key)
                  if value is not None:
                      parts.append(str(value))

              return " ".join(parts).strip()

          def first_value(item, keys):
              for key in keys:
                  if isinstance(item, dict) and item.get(key) is not None:
                      return item.get(key)
              return None

          # ---------------------------------------------------------
          # Load memory
          # ---------------------------------------------------------

          memory = load_memory()

          processed_ids = set(memory.get("processed_ids", []))

          now = datetime.now(timezone.utc).isoformat()

          # ---------------------------------------------------------
          # Marketplace discovery
          #
          # ACT 07 is observation-only.
          # No acceptance, submission, payment or financial action.
          # ---------------------------------------------------------

          marketplace_data = None
          marketplace_endpoint = None
          marketplace_status = None
          errors = []

          candidate_endpoints = [
              "/marketplace",
              "/marketplace/listings",
              "/marketplace/tasks",
              "/bounties"
          ]

          for endpoint in candidate_endpoints:
              try:
                  response = session.get(
                      f"{BASE_URL}{endpoint}",
                      params={"limit": 50},
                      timeout=30
                  )

                  marketplace_status = response.status_code

                  if response.status_code == 200:
                      marketplace_data = response.json()
                      marketplace_endpoint = endpoint
                      break

              except Exception as exc:
                  errors.append({
                      "endpoint": endpoint,
                      "error": str(exc)
                  })

          # ---------------------------------------------------------
          # If no endpoint was available
          # ---------------------------------------------------------

          if marketplace_data is None:
              result = {
                  "version": "ACT 07",
                  "name": "Marketplace Opportunity Hunter",
                  "mode": "observation_only",
                  "last_run": now,
                  "policy": {
                      "observe_marketplace": True,
                      "opportunity_detection": True,
                      "opportunity_scoring": True,
                      "accept_tasks": False,
                      "execute_tasks": False,
                      "submit_work": False,
                      "payments": False,
                      "transfers": False,
                      "dm": False,
                      "gemini": False,
                      "project_cost_eur": 0
                  },
                  "observation": {
                      "marketplace_endpoint": None,
                      "marketplace_status": marketplace_status,
                      "opportunities_found": 0,
                      "new_opportunities": 0
                  },
                  "errors": errors + [{
                      "type": "marketplace_endpoint_unavailable",
                      "message": "No known Marketplace read endpoint returned HTTP 200."
                  }]
              }

              memory["runs"].append(result)
              memory["runs"] = memory["runs"][-20:]

              save_memory(memory)

              print(json.dumps(result, indent=2, ensure_ascii=False))
              raise SystemExit(0)

          # ---------------------------------------------------------
          # Normalize marketplace entries
          # ---------------------------------------------------------

          entries = get_list(marketplace_data)

          detected = []
          new_opportunities = []

          # ---------------------------------------------------------
          # Opportunity scoring
          #
          # This is NOT a financial decision.
          # It only estimates whether an opportunity deserves
          # further investigation.
          # ---------------------------------------------------------

          positive_keywords = [
              "task",
              "tasks",
              "bounty",
              "bounties",
              "work",
              "research",
              "analysis",
              "test",
              "testing",
              "build",
              "create",
              "write",
              "review",
              "data",
              "agent",
              "automation",
              "documentation",
              "code"
          ]

          difficulty_keywords = [
              "advanced",
              "expert",
              "complex",
              "specialist",
              "production",
              "large project"
          ]

          free_access_keywords = [
              "open",
              "public",
              "no account",
              "free",
              "any agent"
          ]

          for item in entries[:MAX_OPPORTUNITIES]:

              if not isinstance(item, dict):
                  continue

              opportunity_id = first_value(
                  item,
                  ["id", "listing_id", "task_id", "bounty_id", "uuid"]
              )

              if opportunity_id is None:
                  opportunity_id = text_of(item)[:120]

              opportunity_id = str(opportunity_id)

              text = text_of(item)
              lower = text.lower()

              score = 0
              reasons = []

              if any(word in lower for word in positive_keywords):
                  score += 2
                  reasons.append("potentially useful work")

              if any(word in lower for word in difficulty_keywords):
                  score -= 1
                  reasons.append("possibly high difficulty")

              if any(word in lower for word in free_access_keywords):
                  score += 1
                  reasons.append("potentially accessible")

              reward = first_value(
                  item,
                  [
                      "reward",
                      "reward_amount",
                      "amount",
                      "payout",
                      "price",
                      "compensation"
                  ]
              )

              if reward is not None:
                  reasons.append("reward information detected")

              status = first_value(
                  item,
                  ["status", "state"]
              )

              if status is not None:
                  status_text = str(status).lower()

                  if status_text in (
                      "open",
                      "available",
                      "active",
                      "published"
                  ):
                      score += 2
                      reasons.append("appears open")

                  elif status_text in (
                      "closed",
                      "completed",
                      "cancelled",
                      "expired"
                  ):
                      score -= 3
                      reasons.append("appears unavailable")

              if score < 0:
                  score = 0

              classification = "LOW"

              if score >= 4:
                  classification = "HIGH"
              elif score >= 2:
                  classification = "MEDIUM"

              record = {
                  "opportunity_id": opportunity_id,
                  "title": first_value(item, ["title", "name"]),
                  "description": text[:1000],
                  "status": status,
                  "reward": reward,
                  "score": score,
                  "classification": classification,
                  "reasons": reasons,
                  "source_endpoint": marketplace_endpoint,
                  "detected_at": now,
                  "raw_type": item.get("type") if isinstance(item, dict) else None
              }

              detected.append(record)

              if opportunity_id not in processed_ids:
                  new_opportunities.append(record)

          # ---------------------------------------------------------
          # Update memory
          # ---------------------------------------------------------

          for record in new_opportunities:
              processed_ids.add(record["opportunity_id"])

              memory["opportunities"].append(record)

          memory["opportunities"] = memory["opportunities"][-MAX_STORED_OPPORTUNITIES:]

          memory["processed_ids"] = list(processed_ids)[-MAX_STORED_OPPORTUNITIES:]

          # ---------------------------------------------------------
          # Build observation
          # ---------------------------------------------------------

          high = [
              x for x in detected
              if x["classification"] == "HIGH"
          ]

          medium = [
              x for x in detected
              if x["classification"] == "MEDIUM"
          ]

          observation = {
              "marketplace_endpoint": marketplace_endpoint,
              "marketplace_status": marketplace_status,
              "opportunities_found": len(detected),
              "new_opportunities": len(new_opportunities),
              "high_priority": len(high),
              "medium_priority": len(medium),
              "low_priority": len(detected) - len(high) - len(medium)
          }

          result = {
              "version": "ACT 07",
              "name": "Marketplace Opportunity Hunter",
              "mode": "observation_only",
              "last_run": now,
              "policy": {
                  "observe_marketplace": True,
                  "opportunity_detection": True,
                  "opportunity_scoring": True,
                  "accept_tasks": False,
                  "execute_tasks": False,
                  "submit_work": False,
                  "payments": False,
                  "transfers": False,
                  "dm": False,
                  "gemini": False,
                  "project_cost_eur": 0
              },
              "observation": observation,
              "opportunities": detected[:20],
              "errors": errors
          }

          memory["observations"].append({
              "timestamp": now,
              "observation": observation
          })

          memory["observations"] = memory["observations"][-50:]

          memory["runs"].append(result)
          memory["runs"] = memory["runs"][-20:]

          save_memory(memory)

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit ACT 07 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_07_marketplace_opportunity_hunter.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 07 marketplace opportunity observation"
            git push
          fi
