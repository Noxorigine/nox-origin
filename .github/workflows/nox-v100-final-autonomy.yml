name: NØX V100 Final Autonomy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v100-final-autonomy
  cancel-in-progress: false

jobs:
  final-autonomy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build V100 final autonomy state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load(name):
              path = MEMORY / name
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def number(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          def integer(value, default=0):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return default

          def clamp(value, low=0.0, high=100.0):
              return max(low, min(high, value))

          versions = {
              90: "nox_v90_autonomous_decision_framework.json",
              91: "nox_v91_autonomous_decision_stability.json",
              92: "nox_v92_autonomous_self_correction_proposal.json",
              93: "nox_v93_autonomous_self_correction_validation.json",
              94: "nox_v94_controlled_live_comparison.json",
              95: "nox_v95_controlled_correction_arbitration.json",
              96: "nox_v96_controlled_correction_deployment.json",
              97: "nox_v97_deployment_result_learning.json",
              98: "nox_v98_autonomous_correction_arbitration.json",
              99: "nox_v99_autonomous_policy_stabilization.json",
          }

          data = {
              version: load(filename)
              for version, filename in versions.items()
          }

          v90 = data[90]
          v91 = data[91]
          v92 = data[92]
          v93 = data[93]
          v94 = data[94]
          v95 = data[95]
          v96 = data[96]
          v97 = data[97]
          v98 = data[98]
          v99 = data[99]

          generated_at = datetime.now(timezone.utc).isoformat()

          autonomy = v90.get("autonomy", {})
          metrics = v91.get("metrics", {})
          validation = v93.get("validation", {})
          measurement94 = v94.get("measurement", {})
          arbitration95 = v95.get("arbitration", {})
          policy96 = v96.get("policy", {})
          measurement97 = v97.get("measurement", {})
          signals97 = v97.get("signals", {})
          arbitration98 = v98.get("arbitration", {})
          stabilization99 = v99.get("stabilization", {})

          decision_autonomy = bool(
              autonomy.get("decision_autonomy", True)
          )

          learning = bool(
              autonomy.get("learning", True)
          )

          arbitration = bool(
              autonomy.get("arbitration", True)
          )

          overall_stability = number(
              metrics.get(
                  "overall_stability",
                  v91.get("overall_stability", 0)
              ),
              0
          )

          evidence_stability = number(
              metrics.get(
                  "evidence_stability",
                  v91.get("evidence_stability", 0)
              ),
              0
          )

          strategy_stability = number(
              metrics.get(
                  "strategy_stability",
                  v91.get("strategy_stability", 0)
              ),
              0
          )

          v93_status = str(
              validation.get(
                  "status",
                  v93.get(
                      "validation_status",
                      v93.get("status", "UNKNOWN")
                  )
              )
          )

          v94_status = str(
              measurement94.get(
                  "status",
                  v94.get(
                      "live_status",
                      v94.get("status", "UNKNOWN")
                  )
              )
          )

          v95_status = str(
              arbitration95.get(
                  "status",
                  v95.get(
                      "arbitration_status",
                      v95.get("status", "UNKNOWN")
                  )
              )
          )

          v96_status = str(
              policy96.get(
                  "status",
                  v96.get(
                      "deployment_status",
                      v96.get("status", "UNKNOWN")
                  )
              )
          )

          v97_status = str(
              measurement97.get(
                  "status",
                  v97.get(
                      "live_status",
                      v97.get("status", "UNKNOWN")
                  )
              )
          )

          v98_decision = str(
              arbitration98.get(
                  "decision",
                  v98.get(
                      "autonomous_decision",
                      v98.get("decision", "UNKNOWN")
                  )
              )
          )

          v98_score = number(
              arbitration98.get(
                  "score",
                  v98.get(
                      "arbitration_score",
                      v98.get("score", 0)
                  )
              ),
              0
          )

          v98_confidence = number(
              arbitration98.get(
                  "confidence",
                  v98.get("confidence", 0)
              ),
              0
          )

          v99_status = str(
              stabilization99.get(
                  "status",
                  v99.get("status", "UNKNOWN")
              )
          )

          v99_policy_state = str(
              stabilization99.get(
                  "policy_state",
                  v99.get("policy_state", "UNKNOWN")
              )
          )

          correction_id = str(
              v99.get("correction_id")
              or v98.get("correction_id")
              or policy96.get("controlled_correction")
              or v92.get("selected_correction", {}).get("id")
              or "NONE"
          )

          correction_name = str(
              v99.get("correction_name")
              or v98.get("correction_name")
              or v92.get("selected_correction", {}).get("name")
              or "NONE"
          )

          total_measured = integer(
              measurement97.get(
                  "total_measured",
                  v97.get(
                      "live_validation",
                      {}
                  ).get("total_measured", 0)
              ),
              0
          )

          useful_changes = integer(
              measurement97.get(
                  "useful_changes",
                  signals97.get("useful_changes", 0)
              ),
              0
          )

          harmful_changes = integer(
              measurement97.get(
                  "harmful_changes",
                  signals97.get("harmful_changes", 0)
              ),
              0
          )

          completed_excluded = integer(
              measurement97.get(
                  "completed_excluded",
                  signals97.get("completed_excluded", 0)
              ),
              0
          )

          atypical_preserved = integer(
              measurement97.get(
                  "atypical_preserved",
                  signals97.get("atypical_preserved", 0)
              ),
              0
          )

          component_scores = {
              "decision_autonomy": (
                  100 if decision_autonomy else 0
              ),

              "learning": (
                  100 if learning else 0
              ),

              "arbitration": (
                  100 if arbitration else 0
              ),

              "overall_stability": clamp(
                  overall_stability * 100
              ),

              "evidence_stability": clamp(
                  evidence_stability * 100
              ),

              "strategy_stability": clamp(
                  strategy_stability * 100
              ),

              "correction_validation": (
                  100
                  if "VALIDATED" in v93_status.upper()
                  else 50
                  if v93_status != "UNKNOWN"
                  else 0
              ),

              "live_comparison": (
                  100
                  if any(
                      item in v94_status.upper()
                      for item in (
                          "BENEFIT",
                          "READY",
                          "USEFUL",
                          "NEUTRAL"
                      )
                  )
                  else 50
                  if v94_status != "UNKNOWN"
                  else 0
              ),

              "correction_arbitration": clamp(
                  v98_score
                  if v98_score > 0
                  else 50
              ),

              "policy_stability": (
                  100
                  if v99_status == "POLICY_STABILIZED"
                  else 80
                  if v99_status in (
                      "STABLE_OBSERVATION",
                      "STABILIZATION_IN_PROGRESS"
                  )
                  else 50
                  if v99_status != "UNKNOWN"
                  else 0
              ),
          }

          autonomy_score = (
              component_scores["decision_autonomy"] * 0.15
              + component_scores["learning"] * 0.10
              + component_scores["arbitration"] * 0.10
              + component_scores["overall_stability"] * 0.10
              + component_scores["evidence_stability"] * 0.10
              + component_scores["strategy_stability"] * 0.10
              + component_scores["correction_validation"] * 0.10
              + component_scores["live_comparison"] * 0.10
              + component_scores["correction_arbitration"] * 0.05
              + component_scores["policy_stability"] * 0.10
          )

          if total_measured >= 5:
              autonomy_score += 3

          if completed_excluded > 0:
              autonomy_score += 2

          if atypical_preserved > 0:
              autonomy_score += 2

          if harmful_changes > 0:
              autonomy_score -= 15

          autonomy_score = clamp(autonomy_score)

          if harmful_changes > 0:
              final_state = (
                  "AUTONOMY_READY_WITH_ROLLBACK_PRIORITY"
              )

          elif autonomy_score >= 85:
              final_state = "FULL_DECISION_AUTONOMY"

          elif autonomy_score >= 70:
              final_state = "ADVANCED_DECISION_AUTONOMY"

          elif autonomy_score >= 50:
              final_state = "EMERGING_DECISION_AUTONOMY"

          else:
              final_state = (
                  "DECISION_AUTONOMY_REQUIRES_MORE_EVIDENCE"
              )

          if final_state in (
              "FULL_DECISION_AUTONOMY",
              "AUTONOMY_READY_WITH_ROLLBACK_PRIORITY"
          ):
              authority = "AUTONOMOUS_DECISION_AUTHORITY"

          elif final_state == "ADVANCED_DECISION_AUTONOMY":
              authority = (
                  "AUTONOMOUS_DECISION_AUTHORITY_WITH_MONITORING"
              )

          else:
              authority = "LEARNING_AND_DECISION_PREPARATION"

          capabilities = {
              "opportunity_detection": True,
              "evidence_weighting": True,
              "context_verification": True,
              "action_readiness_evaluation": True,
              "action_prioritization": True,
              "strategy_selection": True,
              "strategy_arbitration": True,
              "decision_stability_analysis": True,
              "error_analysis": True,
              "self_correction_proposal": True,
              "self_correction_validation": True,
              "controlled_correction_deployment": True,
              "deployment_result_learning": True,
              "autonomous_correction_arbitration": True,
              "policy_stabilization": True,
              "rollback_detection": True,
              "progressive_self_improvement": True,
              "permanent_self_modification": False,
          }

          economic_scope = {
              "opportunity_discovery": True,
              "useful_work_preparation": True,
              "automatic_bidding": False,
              "automatic_dm": False,
              "automatic_payment": False,
              "wallet_management": False,
              "capital_management": False,
              "trading": False,
              "self_funding": False,
          }

          result = {
              "version": "V100",
              "generated_at": generated_at,
              "mode": "final_autonomous_decision_synthesis",

              "agent": {
                  "name": "NØX Origin",
                  "username": "nox_origine"
              },

              "mission": {
                  "primary": (
                      "Operate as an autonomous decision system "
                      "that detects useful opportunities, evaluates "
                      "evidence, learns from results and improves "
                      "its strategy."
                  ),
                  "economic_goal": (
                      "Progress toward useful paid work and eventual "
                      "economic autonomy without automatically "
                      "granting payment or financial authority."
                  ),
              },

              "final_state": {
                  "state": final_state,
                  "authority": authority,
                  "autonomy_score": round(
                      autonomy_score,
                      2
                  ),
                  "confidence": round(
                      clamp(
                          autonomy_score * 0.007
                          + v98_confidence * 0.30,
                          0.25,
                          0.95
                      ),
                      3
                  ),
              },

              "component_scores": {
                  key: round(value, 2)
                  for key, value in component_scores.items()
              },

              "evidence": {
                  "v91_overall_stability": round(
                      overall_stability,
                      3
                  ),
                  "v91_evidence_stability": round(
                      evidence_stability,
                      3
                  ),
                  "v91_strategy_stability": round(
                      strategy_stability,
                      3
                  ),
                  "v97_total_measured": total_measured,
                  "v97_useful_changes": useful_changes,
                  "v97_harmful_changes": harmful_changes,
                  "v97_completed_excluded": completed_excluded,
                  "v97_atypical_preserved": atypical_preserved,
              },

              "source_chain": {
                  "V90": "autonomous decision framework",
                  "V91": "decision stability",
                  "V92": "self-correction proposal",
                  "V93": "self-correction validation",
                  "V94": "controlled live comparison",
                  "V95": "correction arbitration",
                  "V96": "controlled correction deployment",
                  "V97": "deployment result learning",
                  "V98": "autonomous correction arbitration",
                  "V99": "autonomous policy stabilization",
                  "V100": "final autonomy synthesis",
              },

              "final_capabilities": capabilities,

              "economic_scope": economic_scope,

              "active_policy": {
                  "baseline": "V90_BASELINE",
                  "active_controlled_correction": correction_id,
                  "correction_name": correction_name,
                  "policy_state": v99_policy_state,
                  "rollback_available": True,
                  "permanent_rule": False,
                  "human_override": True,
              },

              "autonomous_decision_loop": [
                  "DETECT",
                  "COLLECT_EVIDENCE",
                  "VERIFY_CONTEXT",
                  "PRIORITIZE",
                  "SELECT_STRATEGY",
                  "ARBITRATE",
                  "ACT_WHEN_AUTHORIZED",
                  "OBSERVE_RESULT",
                  "LEARN",
                  "ANALYZE_ERRORS",
                  "PROPOSE_CORRECTION",
                  "VALIDATE_CORRECTION",
                  "DEPLOY_CONTROLLED_CORRECTION",
                  "MEASURE_RESULT",
                  "STABILIZE_POLICY",
                  "REPEAT",
              ],

              "principles": [
                  "Evidence is stronger than keywords.",
                  "Independent evidence convergence is preferred.",
                  "Completed work is not an open opportunity.",
                  "Payment language is not settlement proof.",
                  "Community feedback is learning evidence.",
                  "False positives remain regression evidence.",
                  "Atypical opportunities must remain recoverable.",
                  "History modifies decisions but does not replace current evidence.",
                  "A single observation must not create a permanent rule.",
                  "Corrections remain reversible.",
                  "Learning from results is part of the decision loop.",
                  "Decision autonomy does not automatically grant economic authority.",
              ],

              "version_status": {
                  "final_planned_autonomy_stage": True,
                  "decision_autonomy": True,
                  "progressive_learning": True,
                  "self_correction": True,
                  "policy_stabilization": True,
                  "economic_autonomy": False,
                  "project_cost_eur": 0,
              },

              "safety": {
                  "zero_cost_constraint": True,
                  "gemini_disabled": True,
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_dm": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "automatic_wallet_management": False,
                  "automatic_trading": False,
                  "permanent_self_modification": False,
                  "rollback_available": True,
                  "baseline_preserved": True,
                  "human_override": True,
              },

              "next_stage": {
                  "version": "POST_V100",
                  "mode": "autonomous_operation_and_learning",
                  "description": (
                      "V100 is the final planned autonomy synthesis. "
                      "Future evolution should be driven by real "
                      "operational evidence rather than version numbers."
                  ),
              },
          }

          json_path = MEMORY / "nox_v100_final_autonomy.json"
          md_path = MEMORY / "nox_v100_final_autonomy.md"

          json_path.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          lines = [
              "# NØX Origin — V100 Final Autonomy",
              "",
              f"Generated: {generated_at}",
              "",
              "## Final state",
              "",
              f"State: {final_state}",
              "",
              f"Authority: {authority}",
              "",
              f"Autonomy score: {autonomy_score:.2f}/100",
              "",
              "## Autonomous decision loop",
              "",
              "DETECT -> EVIDENCE -> VERIFY -> PRIORITIZE -> STRATEGY -> ARBITRATE -> ACT",
              "",
              "ACT -> OBSERVE -> LEARN -> ANALYZE -> CORRECT -> VALIDATE -> DEPLOY -> MEASURE -> STABILIZE",
              "",
              "## Final capabilities",
              "",
          ]

          for key, value in capabilities.items():
              lines.append(
                  f"- {key}: "
                  f"{'ENABLED' if value else 'DISABLED'}"
              )

          lines += [
              "",
              "## Economic scope",
              "",
          ]

          for key, value in economic_scope.items():
              lines.append(
                  f"- {key}: "
                  f"{'ENABLED' if value else 'DISABLED'}"
              )

          lines += [
              "",
              "## Active policy",
              "",
              "Baseline: V90_BASELINE",
              "",
              f"Controlled correction: {correction_id}",
              "",
              f"Correction name: {correction_name}",
              "",
              f"Policy state: {v99_policy_state}",
              "",
              "Rollback available: YES",
              "",
              "Permanent rule: NO",
              "",
              "Human override: YES",
              "",
              "## Safety",
              "",
              "Gemini: DISABLED",
              "",
              "Automatic bidding: DISABLED",
              "",
              "Automatic DM: DISABLED",
              "",
              "Automatic payment: DISABLED",
              "",
              "Automatic wallet management: DISABLED",
              "",
              "Automatic trading: DISABLED",
              "",
              "Permanent self-modification: DISABLED",
              "",
              "Rollback: ENABLED",
              "",
              "Project cost: €0",
              "",
              "## Declaration",
              "",
              "V100 is the final planned autonomy synthesis for NØX Origin.",
              "",
              "Future evolution should be driven by real operational evidence rather than version numbers alone.",
              "",
          ]

          md_path.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

      - name: Commit V100 result
        shell: bash
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v100_final_autonomy.json
          git add memory/nox_v100_final_autonomy.md

          if git diff --cached --quiet; then
            echo "No V100 changes to commit."
          else
            git commit -m "NØX V100 final autonomy synthesis"
            git push
          fi
