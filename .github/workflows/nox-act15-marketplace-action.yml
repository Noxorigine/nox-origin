name: NØX ACT 15 V7.3 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MIN_BID_SATS: "1"
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX ACT15 V7.3 - ENVIRONMENT CHECK"
          echo "=============================================="
          echo "Schedule: every 4 hours"
          echo "Market direction classification: ENABLED"
          echo "SUPPLY/FOR_HIRE protection: ENABLED"
          echo "UNKNOWN direction protection: ENABLED"
          echo "Minimum opportunity value: 0 sats"
          echo "Minimum executable bid: 1 sat"
          echo "Bid amount: advertised reward"
          echo "Unpaid learning candidates: ENABLED"
          echo "Tip opportunities: ENABLED"
          echo "Payments: DISABLED"
          echo "Gemini: DISABLED"
          echo "Cost target: €0"

          if [ -f "${MEMORY_FILE}" ]; then
            echo "Memory: ${MEMORY_FILE} exists."
          else
            echo "Memory: ${MEMORY_FILE} will be created."
          fi

          echo "=============================================="

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run ACT15 V7.3
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1",
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          MEMORY_FILE = Path(
              os.environ.get(
                  "MEMORY_FILE",
                  "memory/nox_act_15_marketplace.json",
              )
          )

          MIN_BID_SATS = int(
              os.environ.get("MIN_BID_SATS", "1")
          )

          MAX_TASKS = int(
              os.environ.get("MAX_TASKS", "30")
          )

          MAX_MEMORY_ACTIONS = int(
              os.environ.get("MAX_MEMORY_ACTIONS", "500")
          )

          ACTION_DELAY_SECONDS = float(
              os.environ.get("ACTION_DELAY_SECONDS", "1")
          )

          FALLBACK_SATS_PER_USD = int(
              os.environ.get(
                  "FALLBACK_SATS_PER_USD",
                  "60000",
              )
          )

          SAFETY_BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "ammunition",
              "explosive",
              "explosives",
              "bomb",
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing",
              "stolen account",
              "account takeover",
              "hack account",
              "money laundering",
              "fraud",
              "illegal drugs",
              "drug trafficking",
          ]

          CAPABILITY_KEYWORDS = {
              "python": 12,
              "api": 12,
              "automation": 12,
              "research": 10,
              "data": 10,
              "analysis": 10,
              "qa": 9,
              "testing": 9,
              "test": 7,
              "smoke test": 9,
              "scraping": 8,
              "web": 7,
              "json": 7,
              "csv": 7,
              "seo": 6,
              "copywriting": 7,
              "documentation": 8,
              "docs": 8,
              "scripts": 10,
              "database": 8,
              "source checks": 10,
              "fact checking": 10,
              "fact-checking": 10,
              "technical writing": 8,
              "agent": 12,
              "ai agent": 14,
              "automation agent": 14,
          }

          LEARNING_KEYWORDS = {
              "ai agent": 14,
              "agent": 12,
              "agents": 12,
              "autonomy": 14,
              "autonomous": 12,
              "collaboration": 12,
              "coordination": 12,
              "marketplace": 12,
              "economy": 12,
              "virtual economy": 14,
              "lightning": 8,
              "bitcoin": 8,
              "btc": 7,
              "reputation": 10,
              "trust": 10,
              "verification": 10,
              "research": 8,
              "api": 8,
              "automation": 8,
              "testing": 8,
              "data": 7,
              "analysis": 7,
              "cybersecurity": 10,
              "security": 9,
              "emerging technology": 8,
              "technology": 6,
              "law": 9,
              "regulation": 9,
              "regulatory": 9,
          }

          SUPPLY_STRONG_TERMS = [
              "for hire",
              "for-hire",
              "hire me",
              "my services",
              "i offer",
              "i provide",
              "i can help",
              "i can do",
              "i'm available",
              "im available",
              "available for hire",
              "available for work",
              "available to work",
              "open for work",
              "offering services",
              "service provider",
              "freelance services",
              "services available",
              "consulting available",
              "consultant available",
          ]

          DEMAND_STRONG_TERMS = [
              "paid task",
              "paid_task",
              "task:",
              "looking for",
              "looking to hire",
              "need someone",
              "need an agent",
              "need a worker",
              "worker needed",
              "seeking a worker",
              "seeking someone",
              "hire someone",
              "wanted:",
              "want someone to",
              "i need",
              "we need",
              "please build",
              "please create",
              "please fix",
              "please audit",
              "please research",
              "build this for me",
              "create this for me",
              "fix this for me",
              "research this for me",
              "job:",
          ]

          METADATA_DEMAND_VALUES = {
              "paid_task",
              "paid task",
              "task",
              "job",
              "demand",
              "request",
          }

          METADATA_SUPPLY_VALUES = {
              "for_hire",
              "for hire",
              "supply",
              "service",
              "services",
              "offer",
              "provider",
          }

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def text(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value).lower(),
              ).strip()

          def normalize_post_type(value):
              return re.sub(
                  r"[^a-z0-9_ -]+",
                  "",
                  normalize(value),
              ).strip()

          def task_text(task):
              parts = []

              keys = (
                  "title",
                  "name",
                  "description",
                  "details",
                  "requirements",
                  "category",
                  "tags",
                  "skills",
                  "budget",
                  "reward",
                  "reward_sats",
                  "reward_usdc",
                  "reward_usd",
                  "price",
                  "post_type",
                  "type",
                  "kind",
                  "task_type",
                  "listing_type",
                  "marketplace_type",
              )

              for key in keys:
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(str(item) for item in value)
                  elif isinstance(value, dict):
                      parts.append(
                          json.dumps(
                              value,
                              ensure_ascii=False,
                          )
                      )
                  elif value is not None:
                      parts.append(str(value))

              return normalize(" ".join(parts))

          def blocked_term(value):
              lowered = normalize(value)

              for term in SAFETY_BLOCKED_TERMS:
                  if term in lowered:
                      return term

              return None

          def classify_direction(task):
              """
              DEMAND = someone wants work performed.
              SUPPLY = someone offers their own services.
              UNKNOWN = insufficient evidence.

              Safety rule:
              a supply offer must never become a bid candidate.
              """

              t = task_text(task)

              supply_hits = [
                  term
                  for term in SUPPLY_STRONG_TERMS
                  if term in t
              ]

              demand_hits = [
                  term
                  for term in DEMAND_STRONG_TERMS
                  if term in t
              ]

              # Explicit supply language has priority.
              if "for hire" in t or "for-hire" in t:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "VERY_HIGH",
                      "reason": "explicit_for_hire_language",
                  }

              if "hire me" in t:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "VERY_HIGH",
                      "reason": "explicit_hire_me_language",
                  }

              # If both directions appear, do not guess.
              if supply_hits and demand_hits:
                  return {
                      "direction": "UNKNOWN",
                      "confidence": "LOW",
                      "reason": (
                          "conflicting_supply_and_demand_signals:"
                          + ",".join(supply_hits[:5])
                          + "|"
                          + ",".join(demand_hits[:5])
                      ),
                  }

              if supply_hits:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "HIGH",
                      "reason": (
                          "supply_language:"
                          + ",".join(supply_hits[:5])
                      ),
                  }

              if demand_hits:
                  return {
                      "direction": "DEMAND",
                      "confidence": "HIGH",
                      "reason": (
                          "demand_language:"
                          + ",".join(demand_hits[:5])
                      ),
                  }

              # Structured metadata is only used when text
              # did not already establish a direction.
              metadata = []

              for key in (
                  "post_type",
                  "type",
                  "kind",
                  "task_type",
                  "listing_type",
                  "marketplace_type",
              ):
                  value = normalize_post_type(task.get(key))

                  if value:
                      metadata.append((key, value))

              metadata_supply = []
              metadata_demand = []

              for key, value in metadata:
                  if value in METADATA_SUPPLY_VALUES:
                      metadata_supply.append((key, value))

                  if value in METADATA_DEMAND_VALUES:
                      metadata_demand.append((key, value))

              if metadata_supply and metadata_demand:
                  return {
                      "direction": "UNKNOWN",
                      "confidence": "LOW",
                      "reason": "conflicting_market_metadata",
                  }

              if metadata_supply:
                  key, value = metadata_supply[0]
                  return {
                      "direction": "SUPPLY",
                      "confidence": "HIGH",
                      "reason": f"explicit_{key}:{value}",
                  }

              if metadata_demand:
                  key, value = metadata_demand[0]
                  return {
                      "direction": "DEMAND",
                      "confidence": "MEDIUM",
                      "reason": f"explicit_{key}:{value}",
                  }

              return {
                  "direction": "UNKNOWN",
                  "confidence": "LOW",
                  "reason": "no_clear_market_direction",
              }

          def structured_sats(task):
              for key in (
                  "reward_sats",
                  "budget_sats",
                  "payment_sats",
                  "amount_sats",
                  "max_reward_sats",
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      if value >= 0:
                          return int(value), "structured"

                  if isinstance(value, str):
                      match = re.fullmatch(
                          r"\s*(\d+(?:\.\d+)?)\s*(?:sats?|sat)?\s*",
                          value,
                          re.I,
                      )

                      if match:
                          return (
                              int(float(match.group(1))),
                              "structured_text",
                          )

              return None, None

          def explicit_sats(value):
              patterns = [
                  (
                      r"(?:reward|budget|payment|payout)"
                      r"\s*[:=]?\s*"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sats?|sat)\b"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sats?|sat)\b"
                  ),
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      value,
                      re.I,
                  )

                  if match:
                      return (
                          int(float(match.group(1))),
                          "text",
                      )

              return None, None

          def extract_reward(task):
              sats, source = structured_sats(task)

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              t = task_text(task)

              sats, source = explicit_sats(t)

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              for key in (
                  "reward_usdc",
                  "budget_usdc",
                  "payment_usdc",
                  "amount_usdc",
                  "reward_usd",
                  "budget_usd",
                  "payment_usd",
                  "amount_usd",
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)) and value > 0:
                      currency = (
                          "USDC"
                          if "usdc" in key.lower()
                          else "USD"
                      )

                      return {
                          "sats": int(
                              round(
                                  float(value)
                                  * FALLBACK_SATS_PER_USD
                              )
                          ),
                          "currency": currency,
                          "source": "structured_fx_estimate",
                          "usd": float(value),
                      }

              patterns = [
                  (
                      r"(?:reward|budget|payment|payout|pay)"
                      r"[^\n$]{0,100}"
                      r"\$\s*(\d+(?:\.\d+)?)"
                      r"\s*(?:usdc|usd)?\b",
                      "USD",
                  ),
                  (
                      r"\$\s*(\d+(?:\.\d+)?)"
                      r"\s*(USDC|USD)\b",
                      "USD",
                  ),
                  (
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(USDC|USD)\b",
                      "USDC",
                  ),
              ]

              for pattern, default_currency in patterns:
                  match = re.search(
                      pattern,
                      t,
                      re.I,
                  )

                  if not match:
                      continue

                  amount = float(match.group(1))

                  if amount <= 0:
                      continue

                  currency = default_currency

                  if (
                      len(match.groups()) >= 2
                      and match.group(2)
                  ):
                      currency = match.group(2).upper()

                  return {
                      "sats": int(
                          round(
                              amount
                              * FALLBACK_SATS_PER_USD
                          )
                      ),
                      "currency": currency,
                      "source": "text_fx_estimate",
                      "usd": amount,
                  }

              return {
                  "sats": None,
                  "currency": None,
                  "source": None,
                  "usd": None,
              }

          def score_keywords(value, mapping):
              return min(
                  100,
                  sum(
                      points
                      for keyword, points in mapping.items()
                      if keyword in value
                  ),
              )

          def domain_score(value):
              candidates = []

              if any(
                  item in value
                  for item in (
                      "sat",
                      "sats",
                      "bitcoin",
                      "btc",
                      "lightning",
                      "payment",
                      "marketplace",
                      "economy",
                      "reward",
                  )
              ):
                  candidates.append(
                      ("virtual economy", 25)
                  )

              if any(
                  item in value
                  for item in (
                      "security",
                      "cybersecurity",
                      "audit",
                      "vulnerability",
                  )
              ):
                  candidates.append(
                      ("cybersecurity", 20)
                  )

              if any(
                  item in value
                  for item in (
                      "ai community",
                      "ai communities",
                      "agent community",
                      "community",
                      "collaboration",
                      "coordination",
                  )
              ):
                  candidates.append(
                      ("ai communities", 20)
                  )

              if any(
                  item in value
                  for item in (
                      "agent",
                      "autonomy",
                      "autonomous",
                      "reasoning",
                      "decision",
                  )
              ):
                  candidates.append(
                      ("agent intelligence/autonomy", 20)
                  )

              if any(
                  item in value
                  for item in (
                      "technology",
                      "emerging tech",
                      "emerging technology",
                      "new technology",
                  )
              ):
                  candidates.append(
                      ("emerging tech", 15)
                  )

              if not candidates:
                  return None, 0

              return max(
                  candidates,
                  key=lambda item: item[1],
              )

          def tip_score(value):
              high = (
                  "tip",
                  "tips",
                  "bonus",
                  "bounty",
                  "gratuity",
                  "reward for good work",
                  "extra sats",
              )

              medium = (
                  "appreciate",
                  "support",
                  "thank you",
                  "thanks",
                  "if useful",
                  "if helpful",
              )

              score = 0

              for item in high:
                  if item in value:
                      score += 5

              for item in medium:
                  if item in value:
                      score += 2

              return min(15, score)

          def evaluate(task):
              t = task_text(task)
              direction = classify_direction(task)
              reward = extract_reward(task)

              capability = score_keywords(
                  t,
                  CAPABILITY_KEYWORDS,
              )

              learning = score_keywords(
                  t,
                  LEARNING_KEYWORDS,
              )

              domain, dscore = domain_score(t)
              tips = tip_score(t)
              bad = blocked_term(t)

              base = {
                  "direction": direction["direction"],
                  "direction_confidence": direction["confidence"],
                  "direction_reason": direction["reason"],
                  "capability": capability,
                  "learning": learning,
                  "domain_score": dscore,
                  "tips": tips,
                  "domain": domain,
                  "reward_sats": reward["sats"],
                  "reward_currency": reward["currency"],
                  "reward_source": reward["source"],
                  "usd": reward["usd"],
                  "total": 0,
              }

              if bad:
                  return {
                      **base,
                      "decision": "reject",
                      "reason": f"blocked_term:{bad}",
                  }

              if direction["direction"] == "SUPPLY":
                  return {
                      **base,
                      "decision": "supply_no_bid",
                      "reason": direction["reason"],
                  }

              if direction["direction"] == "UNKNOWN":
                  return {
                      **base,
                      "decision": "unknown_direction_no_bid",
                      "reason": direction["reason"],
                  }

              economic = 0

              if reward["sats"] is not None:
                  if reward["sats"] >= 10000:
                      economic = 25
                  elif reward["sats"] >= 1000:
                      economic = 20
                  elif reward["sats"] >= 100:
                      economic = 15
                  elif reward["sats"] > 0:
                      economic = 5

              total = min(
                  100,
                  int(
                      capability * 0.35
                      + learning * 0.20
                      + dscore * 0.20
                      + tips * 0.15
                      + economic * 0.10
                  ),
              )

              base["total"] = total

              if reward["sats"] is None or reward["sats"] <= 0:
                  return {
                      **base,
                      "decision": "learning_candidate_unpaid",
                      "reason": "confirmed_demand_without_paid_reward",
                  }

              return {
                  **base,
                  "decision": "paid_bid_candidate",
                  "reason": "confirmed_demand_post",
              }

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "schema_version": "7.3",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.3",
                      "updated_at": now_iso(),
                      "policy": {},
                      "actions": [],
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "memory root is not an object"
                      )

                  if not isinstance(data.get("actions"), list):
                      data["actions"] = []

                  return data

              except Exception as exc:
                  print(
                      f"WARNING: memory read failed: {exc}"
                  )

                  return {
                      "schema_version": "7.3",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.3",
                      "updated_at": now_iso(),
                      "policy": {},
                      "actions": [],
                  }

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              memory["actions"] = memory.get(
                  "actions",
                  [],
              )[-MAX_MEMORY_ACTIONS:]

              memory["updated_at"] = now_iso()
              memory["schema_version"] = "7.3"
              memory["workflow"] = "ACT15_V7.3"

              memory.setdefault("policy", {})

              memory["policy"].update(
                  {
                      "market_direction_required": True,
                      "supply_posts_never_bid": True,
                      "unknown_direction_never_bid": True,
                      "for_hire_overrides_inconsistent_metadata": True,
                      "bid_amount_equals_advertised_reward": True,
                      "minimum_sats_for_opportunity": 0,
                      "minimum_sats_for_bid": 1,
                      "payments_disabled": True,
                      "gemini_disabled": True,
                  }
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def session_auth():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              session = requests.Session()

              response = session.post(
                  f"{BASE_URL}/auth/token",
                  json={"api_key": API_KEY},
                  timeout=20,
              )

              print(
                  f"AUTH TOKEN HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "No JWT token returned"
                  )

              session.headers.update(
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  }
              )

              return session

          def identity(session):
              response = session.get(
                  f"{BASE_URL}/users/me",
                  timeout=20,
              )

              print(
                  f"/users/me HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              username = (
                  data.get("username")
                  or data.get("handle")
                  or data.get("name")
                  or "unknown"
              )

              karma = (
                  data.get("karma")
                  or data.get("score")
                  or 0
              )

              print(
                  f"Identity: @{username} | Karma: {karma}"
              )

              return data

          def get_tasks(session):
              response = session.get(
                  f"{BASE_URL}/marketplace/tasks",
                  params={"limit": MAX_TASKS},
                  timeout=30,
              )

              print(
                  f"/marketplace/tasks HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "tasks",
                      "items",
                      "results",
                      "data",
                  ):
                      if isinstance(data.get(key), list):
                          return data[key]

              return []

          def task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("_id")
              )

          def task_title(task):
              return text(
                  task.get("title")
                  or task.get("name")
                  or "Untitled marketplace task"
              )

          def task_status(task):
              return normalize(
                  task.get("status")
                  or task.get("state")
              )

          def get_bids(session, tid):
              try:
                  response = session.get(
                      f"{BASE_URL}/marketplace/{tid}/bids",
                      timeout=20,
                  )

                  print(
                      f"/bids {tid} HTTP {response.status_code}"
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  if isinstance(data, list):
                      return data

                  if isinstance(data, dict):
                      for key in (
                          "bids",
                          "items",
                          "results",
                          "data",
                      ):
                          if isinstance(data.get(key), list):
                              return data[key]

              except Exception as exc:
                  print(
                      f"Bid lookup warning: {exc}"
                  )

              return None

          def our_bid(bid, ident):
              if not isinstance(bid, dict):
                  return False

              identity_id = (
                  ident.get("id")
                  or ident.get("user_id")
                  or ident.get("agent_id")
              )

              identity_name = (
                  ident.get("username")
                  or ident.get("handle")
                  or ident.get("name")
              )

              for key in (
                  "user_id",
                  "agent_id",
                  "owner_id",
                  "bidder_id",
              ):
                  if (
                      identity_id is not None
                      and bid.get(key) == identity_id
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder",
                  "agent",
                  "user",
              ):
                  value = bid.get(key)

                  if isinstance(value, dict):
                      value = (
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )

                  if (
                      identity_name
                      and value
                      and normalize(value)
                      == normalize(identity_name)
                  ):
                      return True

              return False

          def bid_amount(reward_sats):
              if (
                  reward_sats is None
                  or reward_sats < MIN_BID_SATS
              ):
                  return None

              return int(reward_sats)

          def submit_bid(
              session,
              tid,
              amount,
              task_title_value,
              score,
              currency,
          ):
              payload = {
                  "bid_amount_sats": amount,
                  "bid_description": (
                      f"NØX proposes {amount} sats for this task. "
                      "The proposal reflects current capability "
                      f"fit and learning relevance "
                      f"(decision score {score}/100). "
                      "Detected reward currency: "
                      f"{currency or 'SATS'}."
                  ),
              }

              response = session.post(
                  f"{BASE_URL}/marketplace/{tid}/bid",
                  json=payload,
                  timeout=30,
              )

              print(
                  f"BID {tid} HTTP {response.status_code}"
              )

              try:
                  body = response.json()
              except Exception:
                  body = response.text[:1000]

              if response.status_code not in (
                  200,
                  201,
                  202,
              ):
                  print(
                      f"Bid rejected for {task_title_value}: "
                      f"{body}"
                  )

                  return {
                      "success": False,
                      "http_status": response.status_code,
                      "response": body,
                  }

              bid_id = None

              if isinstance(body, dict):
                  bid = body.get("bid")

                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                      or (
                          bid.get("id")
                          if isinstance(bid, dict)
                          else None
                      )
                  )

              print(
                  f"Bid submitted: {amount} sats"
                  + (
                      f" | bid_id={bid_id}"
                      if bid_id
                      else ""
                  )
              )

              return {
                  "success": True,
                  "http_status": response.status_code,
                  "response": body,
                  "bid_id": bid_id,
              }

