name: NØX ACT 15 V5 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  autonomous-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Verify ACT15 installation
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - INSTALLATION CHECK"
          echo "=============================================="

          if [ ! -f "scripts/act15.py" ]; then
            echo "ERROR: scripts/act15.py is missing."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "OK: scripts/act15.py exists."

      - name: Run NØX ACT15
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - AUTONOMOUS MARKETPLACE"
          echo "=============================================="

          python scripts/act15.py

      - name: Show memory status
        if: always()
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - MEMORY"
          echo "=============================================="

          if [ -f "memory/nox_memory.json" ]; then
            python -c "import json; d=json.load(open('memory/nox_memory.json', encoding='utf-8')); print('Marketplace actions recorded:', len(d.get('marketplace_actions', [])))"
          else
            echo "No marketplace memory file."
          fi

      - name: Commit ACT15 memory
        if: always()
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes."
            exit 0
          fi

          git commit -m "NØX ACT15: update marketplace memory"
          git push origin HEAD:${GITHUB_REF_NAME}
