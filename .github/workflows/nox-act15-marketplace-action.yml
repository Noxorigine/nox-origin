name: NØX ACT 15 V7.2 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MIN_BID_SATS: "1"
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail
          echo "=============================================="
          echo "NØX ACT15 V7.2 - ENVIRONMENT CHECK"
          echo "=============================================="
          if [ -f "${MEMORY_FILE}" ]; then
            echo "OK: ${MEMORY_FILE} exists."
          else
            echo "INFO: ${MEMORY_FILE} will be created."
          fi
          echo "Schedule: 6 automatic scans/day"
          echo "Action limit: NONE"
          echo "Decision model: direction + economic + learning value"
          echo "Post direction classifier: ENABLED"
          echo "FOR_HIRE/SUPPLY protection: ENABLED"
          echo "Ambiguous direction: NO BID"
          echo "USDC/USD reward detection: ENABLED"
          echo "Unpaid tasks: eligible for learning evaluation"
          echo "Minimum bid: technical minimum only"
          echo "Payments: DISABLED"
          echo "Cost target: €0"
          echo "Gemini: DISABLED"
          echo "=============================================="

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run ACT15 V7.2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          MEMORY_FILE = Path(
              os.environ.get(
                  "MEMORY_FILE",
                  "memory/nox_act_15_marketplace.json"
              )
          )

          MIN_BID_SATS = int(os.environ.get("MIN_BID_SATS", "1"))
          MAX_TASKS = int(os.environ.get("MAX_TASKS", "30"))
          MAX_MEMORY_ACTIONS = int(
              os.environ.get("MAX_MEMORY_ACTIONS", "500")
          )
          ACTION_DELAY_SECONDS = float(
              os.environ.get("ACTION_DELAY_SECONDS", "1")
          )
          FALLBACK_SATS_PER_USD = int(
              os.environ.get("FALLBACK_SATS_PER_USD", "60000")
          )

          SAFETY_BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "ammunition",
              "explosive",
              "explosives",
              "bomb",
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing",
              "stolen account",
              "account takeover",
              "hack account",
              "money laundering",
              "fraud",
              "illegal drugs",
              "drug trafficking",
          ]

          CAPABILITY_KEYWORDS = {
              "python": 12,
              "api": 12,
              "automation": 12,
              "research": 10,
              "data": 10,
              "analysis": 10,
              "qa": 9,
              "testing": 9,
              "test": 7,
              "smoke test": 9,
              "scraping": 8,
              "web": 7,
              "json": 7,
              "csv": 7,
              "seo": 6,
              "audit": 10,
              "copywriting": 7,
              "documentation": 8,
              "scripts": 10,
              "database": 8,
              "source checks": 10,
              "fact checking": 10,
              "fact-checking": 10,
              "technical writing": 8,
              "agent": 12,
              "ai agent": 14,
              "automation agent": 14,
          }

          LEARNING_KEYWORDS = {
              "ai agent": 14,
              "agent": 12,
              "agents": 12,
              "autonomy": 14,
              "autonomous": 12,
              "collaboration": 12,
              "coordination": 12,
              "marketplace": 12,
              "economy": 12,
              "virtual economy": 14,
              "lightning": 8,
              "bitcoin": 8,
              "btc": 7,
              "reputation": 10,
              "trust": 10,
              "verification": 10,
              "research": 8,
              "api": 8,
              "automation": 8,
              "testing": 8,
              "data": 7,
              "analysis": 7,
              "cybersecurity": 10,
              "security": 9,
              "emerging technology": 8,
              "technology": 6,
              "law": 9,
              "regulation": 9,
              "regulatory": 9,
          }

          DOMAIN_WEIGHTS = {
              "virtual economy": 25,
              "cybersecurity": 20,
              "ai communities": 20,
              "agent intelligence/autonomy": 20,
              "emerging tech": 15,
          }

          # Strong signals that the poster is offering their own services.
          # A SUPPLY/FOR_HIRE post is NOT a task for NØX to bid on.
          SUPPLY_STRONG_TERMS = [
              "for hire",
              "hire me",
              "my services",
              "i offer",
              "i provide",
              "i can help",
              "i can do",
              "available for work",
              "available to work",
              "available for hire",
              "open for work",
              "offering services",
              "service provider",
              "freelance services",
          ]

          # Signals that the poster is looking for a worker.
          DEMAND_STRONG_TERMS = [
              "paid task",
              "paid_task",
              "task for",
              "looking for",
              "looking to hire",
              "need someone",
              "need an agent",
              "need a worker",
              "worker needed",
              "seeking a worker",
              "seeking someone",
              "hire someone",
              "want someone to",
              "i need",
              "we need",
              "build this for me",
              "create this for me",
              "fix this for me",
              "research this for me",
          ]

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def text(value):
              return "" if value is None else str(value).strip()

          def task_text(task):
              parts = []

              keys = (
                  "title",
                  "name",
                  "description",
                  "details",
                  "requirements",
                  "category",
                  "tags",
                  "skills",
                  "budget",
                  "reward",
                  "reward_sats",
                  "reward_usdc",
                  "reward_usd",
                  "price",
                  "post_type",
                  "type",
                  "kind",
              )

              for key in keys:
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(str(x) for x in value)

                  elif isinstance(value, dict):
                      parts.append(
                          json.dumps(
                              value,
                              ensure_ascii=False
                          )
                      )

                  elif value is not None:
                      parts.append(str(value))

              return " ".join(parts).lower()

          def blocked_term(value):
              t = value.lower()
              return next(
                  (
                      x
                      for x in SAFETY_BLOCKED_TERMS
                      if x in t
                  ),
                  None,
              )

          def normalize_post_type(value):
              return re.sub(
                  r"[^a-z0-9_ -]+",
                  "",
                  text(value).lower()
              ).strip()

          def classify_direction(task):
              """
              Determine who is asking whom.

              DEMAND:
                  The poster wants a worker / completed task.
                  NØX may potentially bid.

              SUPPLY:
                  The poster is offering their own services.
                  NØX must never bid.

              UNKNOWN:
                  Direction cannot be established safely.
                  NØX must not bid.
              """

              explicit_values = []

              for key in (
                  "post_type",
                  "type",
                  "kind",
                  "task_type",
                  "listing_type",
                  "marketplace_type",
              ):
                  value = normalize_post_type(task.get(key))
                  if value:
                      explicit_values.append(
                          (key, value)
                      )

              # Explicit marketplace semantics have priority.
              for key, value in explicit_values:
                  if value in (
                      "paid_task",
                      "paid task",
                      "task",
                      "job",
                      "demand",
                  ):
                      return {
                          "direction": "DEMAND",
                          "confidence": "HIGH",
                          "reason": f"explicit_{key}:{value}",
                      }

                  if value in (
                      "for_hire",
                      "for hire",
                      "supply",
                      "service",
                      "services",
                      "offer",
                  ):
                      return {
                          "direction": "SUPPLY",
                          "confidence": "HIGH",
                          "reason": f"explicit_{key}:{value}",
                      }

              t = task_text(task)

              supply_hits = [
                  term
                  for term in SUPPLY_STRONG_TERMS
                  if term in t
              ]

              demand_hits = [
                  term
                  for term in DEMAND_STRONG_TERMS
                  if term in t
              ]

              # Strong supply language wins if it is present.
              # This specifically protects against the WorkBuddy
              # Scout "For hire: ..." error.
              if supply_hits and not demand_hits:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "HIGH",
                      "reason": "supply_language:" + ",".join(
                          supply_hits[:5]
                      ),
                  }

              # If both directions appear, do not guess.
              if supply_hits and demand_hits:
                  return {
                      "direction": "UNKNOWN",
                      "confidence": "LOW",
                      "reason": (
                          "conflicting_supply_and_demand_signals:"
                          + ",".join(supply_hits[:3])
                          + "|"
                          + ",".join(demand_hits[:3])
                      ),
                  }

              if demand_hits:
                  return {
                      "direction": "DEMAND",
                      "confidence": "MEDIUM",
                      "reason": "demand_language:" + ",".join(
                          demand_hits[:5]
                      ),
                  }

              # If no direction can be established, default to NO BID.
              return {
                  "direction": "UNKNOWN",
                  "confidence": "LOW",
                  "reason": "no_clear_market_direction",
              }

          def structured_sats(task):
              for key in (
                  "reward_sats",
                  "budget_sats",
                  "payment_sats",
                  "amount_sats",
                  "max_reward_sats",
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      if value >= 0:
                          return int(value), "structured"

                  if isinstance(value, str):
                      m = re.fullmatch(
                          r"\s*(\d+(?:\.\d+)?)\s*(?:sats?|sat)?\s*",
                          value,
                          re.I,
                      )
                      if m:
                          return (
                              int(float(m.group(1))),
                              "structured_text",
                          )

              return None, None

          def explicit_sats(task_text_value):
              patterns = [
                  (
                      r"(?:reward|budget|payment|payout)"
                      r"\s*[:=]?\s*"
                      r"(\d+(?:\.\d+)?)\s*(?:sats?|sat)\b"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*(?:sats?|sat)\b"
                  ),
              ]

              for pattern in patterns:
                  m = re.search(
                      pattern,
                      task_text_value,
                      re.I,
                  )

                  if m:
                      return (
                          int(float(m.group(1))),
                          "text",
                      )

              return None, None

          def extract_reward(task):
              sats, source = structured_sats(task)

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              t = task_text(task)

              sats, source = explicit_sats(t)

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              for key in (
                  "reward_usdc",
                  "budget_usdc",
                  "payment_usdc",
                  "amount_usdc",
                  "reward_usd",
                  "budget_usd",
                  "payment_usd",
                  "amount_usd",
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      if value > 0:
                          currency = (
                              "USDC"
                              if "usdc" in key.lower()
                              else "USD"
                          )

                          return {
                              "sats": int(
                                  round(
                                      float(value)
                                      * FALLBACK_SATS_PER_USD
                                  )
                              ),
                              "currency": currency,
                              "source": "structured_fx_estimate",
                              "usd": float(value),
                          }

              patterns = [
                  (
                      r"(?:reward|budget|payment|payout|pay)"
                      r"[^\n$]{0,100}\$\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:usdc|usd)?\b",
                      "USD",
                  ),
                  (
                      r"\$\s*(\d+(?:\.\d+)?)\s*(USDC|USD)\b",
                      "USD",
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*(USDC|USD)\b",
                      "USDC",
                  ),
              ]

              for pattern, default_currency in patterns:
                  m = re.search(
                      pattern,
                      t,
                      re.I,
                  )

                  if not m:
                      continue

                  amount = float(m.group(1))

                  if amount <= 0:
                      continue

                  currency = default_currency

                  if len(m.groups()) >= 2 and m.group(2):
                      currency = m.group(2).upper()

                  return {
                      "sats": int(
                          round(
                              amount
                              * FALLBACK_SATS_PER_USD
                          )
                      ),
                      "currency": currency,
                      "source": "text_fx_estimate",
                      "usd": amount,
                  }

              return {
                  "sats": None,
                  "currency": None,
                  "source": None,
                  "usd": None,
              }

          def score_keywords(value, mapping):
              return min(
                  100,
                  sum(
                      points
                      for keyword, points in mapping.items()
                      if keyword in value
                  ),
              )

          def domain_score(value):
              candidates = []

              if any(
                  x in value
                  for x in (
                      "sat",
                      "sats",
                      "bitcoin",
                      "btc",
                      "lightning",
                      "payment",
                      "marketplace",
                      "economy",
                      "reward",
                  )
              ):
                  candidates.append(
                      ("virtual economy", 25)
                  )

              if any(
                  x in value
                  for x in (
                      "security",
                      "cybersecurity",
                      "audit",
                      "vulnerability",
                  )
              ):
                  candidates.append(
                      ("cybersecurity", 20)
                  )

              if any(
                  x in value
                  for x in (
                      "ai community",
                      "ai communities",
                      "agent community",
                      "community",
                      "collaboration",
                      "coordination",
                  )
              ):
                  candidates.append(
                      ("ai communities", 20)
                  )

              if any(
                  x in value
                  for x in (
                      "agent",
                      "autonomy",
                      "autonomous",
                      "reasoning",
                      "decision",
                  )
              ):
                  candidates.append(
                      (
                          "agent intelligence/autonomy",
                          20,
                      )
                  )

              if any(
                  x in value
                  for x in (
                      "technology",
                      "emerging tech",
                      "emerging technology",
                      "new technology",
                  )
              ):
                  candidates.append(
                      ("emerging tech", 15)
                  )

              return (
                  max(
                      candidates,
                      key=lambda x: x[1],
                  )
                  if candidates
                  else (None, 0)
              )

          def evaluate(task):
              t = task_text(task)
              direction = classify_direction(task)

              bad = blocked_term(t)

              if bad:
                  return {
                      "decision": "reject",
                      "reason": f"blocked_term:{bad}",
                      "direction": direction["direction"],
                      "direction_confidence": direction["confidence"],
                      "direction_reason": direction["reason"],
                      "capability": 0,
                      "learning": 0,
                      "domain_score": 0,
                      "domain": None,
                      "reward_sats": None,
                      "reward_currency": None,
                      "reward_source": None,
                      "usd": None,
                      "total": 0,
                  }

              # HARD SAFETY RULE:
              # A supply/for-hire listing is never a bid target.
              if direction["direction"] == "SUPPLY":
                  reward = extract_reward(task)
                  cap = score_keywords(
                      t,
                      CAPABILITY_KEYWORDS,
                  )
                  learning = score_keywords(
                      t,
                      LEARNING_KEYWORDS,
                  )
                  domain, dscore = domain_score(t)

                  return {
                      "decision": "supply_no_bid",
                      "reason": direction["reason"],
                      "direction": direction["direction"],
                      "direction_confidence": direction["confidence"],
                      "direction_reason": direction["reason"],
                      "capability": cap,
                      "learning": learning,
                      "domain_score": dscore,
                      "domain": domain,
                      "reward_sats": reward["sats"],
                      "reward_currency": reward["currency"],
                      "reward_source": reward["source"],
                      "usd": reward["usd"],
                      "total": 0,
                  }

              # UNKNOWN direction is also a hard no-bid.
              if direction["direction"] == "UNKNOWN":
                  reward = extract_reward(task)
                  cap = score_keywords(
                      t,
                      CAPABILITY_KEYWORDS,
                  )
                  learning = score_keywords(
                      t,
                      LEARNING_KEYWORDS,
                  )
                  domain, dscore = domain_score(t)

                  return {
                      "decision": "unknown_direction_no_bid",
                      "reason": direction["reason"],
                      "direction": direction["direction"],
                      "direction_confidence": direction["confidence"],
                      "direction_reason": direction["reason"],
                      "capability": cap,
                      "learning": learning,
                      "domain_score": dscore,
                      "domain": domain,
                      "reward_sats": reward["sats"],
                      "reward_currency": reward["currency"],
                      "reward_source": reward["source"],
                      "usd": reward["usd"],
                      "total": 0,
                  }

              # From here onward the post is confirmed as DEMAND.
              reward = extract_reward(task)

              cap = score_keywords(
                  t,
                  CAPABILITY_KEYWORDS,
              )

              learning = score_keywords(
                  t,
                  LEARNING_KEYWORDS,
              )

              domain, dscore = domain_score(t)

              rp = 0

              if reward["sats"] is not None:
                  if reward["sats"] >= 10000:
                      rp = 25
                  elif reward["sats"] >= 1000:
                      rp = 20
                  elif reward["sats"] >= 100:
                      rp = 15
                  elif reward["sats"] >= MIN_BID_SATS:
                      rp = 10
                  elif reward["sats"] > 0:
                      rp = 3

              total = min(
                  100,
                  int(
                      cap * 0.35
                      + learning * 0.35
                      + dscore * 0.20
                      + rp * 0.10
                  ),
              )

              if (
                  reward["sats"] is not None
                  and reward["sats"] >= MIN_BID_SATS
              ):
                  decision = "paid_bid_candidate"

              elif (
                  reward["sats"] is not None
                  and reward["sats"] > 0
              ):
                  decision = "learning_candidate_low_reward"

              else:
                  decision = "learning_candidate_unpaid"

              return {
                  "decision": decision,
                  "reason": "demand_post_economic_and_learning_evaluation",
                  "direction": direction["direction"],
                  "direction_confidence": direction["confidence"],
                  "direction_reason": direction["reason"],
                  "capability": cap,
                  "learning": learning,
                  "domain_score": dscore,
                  "domain": domain,
                  "reward_sats": reward["sats"],
                  "reward_currency": reward["currency"],
                  "reward_source": reward["source"],
                  "usd": reward["usd"],
                  "total": total,
              }

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "schema_version": "7.2",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.2",
                      "updated_at": now_iso(),
                      "policy": {
                          "market_direction_required": True,
                          "supply_posts_never_bid": True,
                          "unknown_direction_never_bid": True,
                          "minimum_sats_for_opportunity": 0,
                          "minimum_sats_for_bid": 1,
                          "payments_disabled": True,
                          "gemini_disabled": True,
                          "workbuddy_scout_learning": True,
                      },
                      "actions": [],
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "memory root is not an object"
                      )

                  if not isinstance(
                      data.get("actions"),
                      list,
                  ):
                      data["actions"] = []

                  return data

              except Exception as exc:
                  print(
                      f"WARNING: unable to read memory: {exc}"
                  )

                  return {
                      "schema_version": "7.2",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.2",
                      "updated_at": now_iso(),
                      "policy": {
                          "market_direction_required": True,
                          "supply_posts_never_bid": True,
                          "unknown_direction_never_bid": True,
                          "minimum_sats_for_opportunity": 0,
                          "minimum_sats_for_bid": 1,
                          "payments_disabled": True,
                          "gemini_disabled": True,
                          "workbuddy_scout_learning": True,
                      },
                      "actions": [],
                  }

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              memory["actions"] = (
                  memory.get("actions", [])
                  [-MAX_MEMORY_ACTIONS:]
              )

              memory["updated_at"] = now_iso()
              memory["schema_version"] = "7.2"
              memory["workflow"] = "ACT15_V7.2"

              memory.setdefault(
                  "policy",
                  {},
              )

              memory["policy"].update(
                  {
                      "market_direction_required": True,
                      "supply_posts_never_bid": True,
                      "unknown_direction_never_bid": True,
                      "minimum_sats_for_opportunity": 0,
                      "minimum_sats_for_bid": 1,
                      "payments_disabled": True,
                      "gemini_disabled": True,
                      "workbuddy_scout_learning": True,
                  }
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def session_auth():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              s = requests.Session()

              r = s.post(
                  f"{BASE_URL}/auth/token",
                  json={"api_key": API_KEY},
                  timeout=20,
              )

              print(
                  f"AUTH TOKEN HTTP {r.status_code}"
              )

              r.raise_for_status()

              data = r.json()

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "No JWT token returned by /auth/token"
                  )

              s.headers.update(
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  }
              )

              return s

          def identity(s):
              r = s.get(
                  f"{BASE_URL}/users/me",
                  timeout=20,
              )

              print(
                  f"/users/me HTTP {r.status_code}"
              )

              r.raise_for_status()

              data = r.json()

              print(
                  "Identity: "
                  f"@{data.get('username') or data.get('handle') or data.get('name') or 'unknown'}"
                  " | Karma: "
                  f"{data.get('karma') or data.get('score') or 0}"
              )

              return data

          def tasks(s):
              r = s.get(
                  f"{BASE_URL}/marketplace/tasks",
                  params={"limit": MAX_TASKS},
                  timeout=30,
              )

              print(
                  f"/marketplace/tasks HTTP {r.status_code}"
              )

              r.raise_for_status()

              data = r.json()

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "tasks",
                      "items",
                      "results",
                      "data",
                  ):
                      if isinstance(
                          data.get(key),
                          list,
                      ):
                          return data[key]

              return []

          def task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("_id")
              )

          def title(task):
              return text(
                  task.get("title")
                  or task.get("name")
                  or "Untitled marketplace task"
              )

          def status(task):
              return text(
                  task.get("status")
                  or task.get("state")
              ).lower()

          def existing_bids(s, tid):
              try:
                  r = s.get(
                      f"{BASE_URL}/marketplace/{tid}/bids",
                      timeout=20,
                  )

                  if r.status_code != 200:
                      return None

                  data = r.json()

                  if isinstance(data, list):
                      return data

                  if isinstance(data, dict):
                      for key in (
                          "bids",
                          "items",
                          "results",
                          "data",
                      ):
                          if isinstance(
                              data.get(key),
                              list,
                          ):
                              return data[key]

              except Exception as exc:
                  print(
                      f"Bid lookup warning for {tid}: {exc}"
                  )

              return None

          def our_bid(bid, ident):
              if not isinstance(bid, dict):
                  return False

              iid = (
                  ident.get("id")
                  or ident.get("user_id")
                  or ident.get("agent_id")
              )

              iname = (
                  ident.get("username")
                  or ident.get("handle")
                  or ident.get("name")
              )

              for key in (
                  "user_id",
                  "agent_id",
                  "owner_id",
                  "bidder_id",
              ):
                  if (
                      iid is not None
                      and bid.get(key) == iid
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder",
                  "agent",
                  "user",
              ):
                  value = bid.get(key)

                  if isinstance(value, dict):
                      value = (
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )

                  if (
                      iname
                      and value
                      and str(value).lower()
                      == str(iname).lower()
                  ):
                      return True

              return False

          def bid_amount(reward_sats):
              if (
                  reward_sats is None
                  or reward_sats < MIN_BID_SATS
              ):
                  return None

              return min(
                  max(
                      MIN_BID_SATS,
                      int(round(reward_sats * 0.20)),
                  ),
                  reward_sats,
              )

          def submit_bid(
              s,
              tid,
              amount,
              task_title,
              score,
              currency,
          ):
              payload = {
                  "bid_amount_sats": amount,
                  "bid_description": (
                      f"NØX proposes {amount} sats for this task. "
                      "The proposal reflects current capability fit "
                      f"and learning relevance "
                      f"(decision score {score}/100). "
                      "Detected reward currency: "
                      f"{currency or 'SATS'}."
                  ),
              }

              r = s.post(
                  f"{BASE_URL}/marketplace/{tid}/bid",
                  json=payload,
                  timeout=30,
              )

              print(
                  f"BID {tid} HTTP {r.status_code}"
              )

              try:
                  body = r.json()
              except Exception:
                  body = r.text[:1000]

              if r.status_code not in (
                  200,
                  201,
                  202,
              ):
                  print(
                      f"Bid rejected for {task_title}: {body}"
                  )

                  return {
                      "success": False,
                      "http_status": r.status_code,
                      "response": body,
                  }

              bid_id = None

              if isinstance(body, dict):
                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                      or (
                          body.get("bid", {}).get("id")
                          if isinstance(
                              body.get("bid"),
                              dict,
                          )
                          else None
                      )
                  )

              print(
                  f"Bid submitted: {amount} sats"
                  + (
                      f" | bid_id={bid_id}"
                      if bid_id
                      else ""
                  )
              )

              return {
                  "success": True,
                  "http_status": r.status_code,
                  "response": body,
                  "bid_id": bid_id,
              }

          def main():
              print("==============================================")
              print("NØX ACT15 V7.2 - AUTONOMOUS MARKETPLACE")
              print("==============================================")
              print(f"Time: {now_iso()}")
              print(
                  f"Technical minimum bid: {MIN_BID_SATS} sats"
              )
              print(
                  "Marketplace direction classifier: ENABLED"
              )
              print(
                  "SUPPLY/FOR_HIRE hard block: ENABLED"
              )
              print(
                  "UNKNOWN direction hard block: ENABLED"
              )
              print(
                  "USDC/USD reward detection: ENABLED"
              )
              print(
                  "Unpaid learning candidates: ENABLED"
              )
              print(
                  "Payments/spending: DISABLED"
              )
              print("Gemini: DISABLED")

              memory = load_memory()

              try:
                  s = session_auth()
                  ident = identity(s)
                  marketplace_tasks = tasks(s)

              except Exception as exc:
                  print(
                      f"FATAL ERROR: {exc}"
                  )
                  sys.exit(1)

              print(
                  "Marketplace tasks received: "
                  f"{len(marketplace_tasks)}"
              )

              summary = {
                  "tasks_seen": 0,
                  "open_tasks": 0,
                  "supply_posts": 0,
                  "unknown_direction": 0,
                  "blocked": 0,
                  "paid_candidates": 0,
                  "learning_candidates": 0,
                  "low_reward_candidates": 0,
                  "already_bid": 0,
                  "bids_submitted": 0,
                  "bid_errors": 0,
              }

              for task in marketplace_tasks:
                  if not isinstance(task, dict):
                      continue

                  summary["tasks_seen"] += 1

                  tid = task_id(task)
                  tt = title(task)
                  st = status(task)

                  print(
                      "\n----------------------------------------------"
                  )
                  print(
                      f"TASK: {tt}\n"
                      f"ID: {tid}\n"
                      f"STATUS: {st or 'unknown'}"
                  )

                  if not tid:
                      print(
                          "Decision: SKIP - no task_id"
                      )
                      continue

                  if st not in (
                      "",
                      "open",
                      "bidding",
                  ):
                      print(
                          f"Decision: SKIP - status={st}"
                      )
                      continue

                  summary["open_tasks"] += 1

                  d = evaluate(task)

                  print(
                      "Direction: "
                      f"{d['direction']} "
                      f"({d['direction_confidence']})"
                  )

                  print(
                      "Direction reason: "
                      f"{d['direction_reason']}"
                  )

                  print(
                      "Scores: "
                      f"capability={d['capability']} "
                      f"learning={d['learning']} "
                      f"domain={d['domain_score']} "
                      f"total={d['total']}"
                  )

                  print(
                      "Domain: "
                      f"{d['domain'] or 'general'}"
                  )

                  print(
                      "Reward: "
                      f"{d['reward_sats']} sats | "
                      f"currency={d['reward_currency']} | "
                      f"source={d['reward_source']} | "
                      f"USD={d['usd']}"
                  )

                  print(
                      f"Decision: {d['decision']}"
                  )

                  # HARD BLOCK: supply/for-hire.
                  if d["decision"] == "supply_no_bid":
                      summary["supply_posts"] += 1

                      print(
                          "Decision: NO BID - "
                          "SUPPLY/FOR_HIRE listing."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_supply_post_blocked"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": "SUPPLY",
                              "direction_confidence": (
                                  d[
                                      "direction_confidence"
                                  ]
                              ),
                              "direction_reason": (
                                  d["direction_reason"]
                              ),
                              "reason": (
                                  "for_hire_or_supply_post"
                              ),
                              "bid_submitted": False,
                              "payments": "disabled",
                          }
                      )

                      continue

                  # HARD BLOCK: ambiguous.
                  if (
                      d["decision"]
                      == "unknown_direction_no_bid"
                  ):
                      summary["unknown_direction"] += 1

                      print(
                          "Decision: NO BID - "
                          "market direction unknown."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_unknown_direction"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": "UNKNOWN",
                              "direction_confidence": (
                                  d[
                                      "direction_confidence"
                                  ]
                              ),
                              "direction_reason": (
                                  d["direction_reason"]
                              ),
                              "reason": (
                                  "ambiguous_market_direction"
                              ),
                              "bid_submitted": False,
                              "payments": "disabled",
                          }
                      )

                      continue

                  if d["decision"] == "reject":
                      summary["blocked"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "rejected",
                              "task_id": tid,
                              "title": tt,
                              "reason": d["reason"],
                              "status": "blocked",
                              "direction": d[
                                  "direction"
                              ],
                          }
                      )

                      continue

                  # From this point onward, only DEMAND posts
                  # are allowed to reach bid evaluation.
                  if d["direction"] != "DEMAND":
                      summary["unknown_direction"] += 1

                      print(
                          "Decision: NO BID - "
                          "direction is not confirmed DEMAND."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_guard_block"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": d[
                                  "direction"
                              ],
                              "reason": (
                                  "bid_requires_confirmed_demand"
                              ),
                              "bid_submitted": False,
                          }
                      )

                      continue

                  if d["decision"] in (
                      "learning_candidate_unpaid",
                      "learning_candidate_low_reward",
                  ):
                      summary["learning_candidates"] += 1

                      if (
                          d["decision"]
                          == "learning_candidate_low_reward"
                      ):
                          summary[
                              "low_reward_candidates"
                          ] += 1

                      print(
                          "Learning candidate recorded."
                      )

                      print(
                          "No paid bid submitted: "
                          "no valid bid budget above "
                          "the technical minimum."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_learning_candidate"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "decision": d["decision"],
                              "direction": "DEMAND",
                              "direction_confidence": (
                                  d[
                                      "direction_confidence"
                                  ]
                              ),
                              "reward_sats": (
                                  d["reward_sats"]
                              ),
                              "reward_currency": (
                                  d["reward_currency"]
                              ),
                              "reward_source": (
                                  d["reward_source"]
                              ),
                              "usd_amount": d["usd"],
                              "capability_score": (
                                  d["capability"]
                              ),
                              "learning_score": (
                                  d["learning"]
                              ),
                              "domain_score": (
                                  d["domain_score"]
                              ),
                              "domain": d["domain"],
                              "total_score": d["total"],
                              "payments": "disabled",
                              "bid_submitted": False,
                          }
                      )

                      continue

                  summary["paid_candidates"] += 1

                  bids = existing_bids(
                      s,
                      tid,
                  )

                  if bids is None:
                      print(
                          "Bid state unavailable; "
                          "no new bid submitted."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_check"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": (
                                  "bid_state_unknown"
                              ),
                              "decision": d,
                          }
                      )

                      continue

                  if any(
                      our_bid(b, ident)
                      for b in bids
                  ):
                      summary["already_bid"] += 1

                      print(
                          "Decision: SKIP - "
                          "NØX already has a bid."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_check"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": "already_bid",
                              "decision": d,
                          }
                      )

                      continue

                  amount = bid_amount(
                      d["reward_sats"]
                  )

                  if amount is None:
                      summary["learning_candidates"] += 1

                      print(
                          "No valid paid bid amount. "
                          "Recording as learning candidate."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_learning_candidate"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "decision": (
                                  "no_valid_paid_bid"
                              ),
                              "direction": "DEMAND",
                              "reward_sats": (
                                  d["reward_sats"]
                              ),
                              "reward_currency": (
                                  d["reward_currency"]
                              ),
                              "reward_source": (
                                  d["reward_source"]
                              ),
                              "usd_amount": d["usd"],
                              "bid_submitted": False,
                          }
                      )

                      continue

                  # FINAL HARD GUARD BEFORE POST /bid.
                  if d["direction"] != "DEMAND":
                      print(
                          "FINAL BID GUARD: BLOCKED."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_final_bid_guard_block"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": d[
                                  "direction"
                              ],
                              "reason": (
                                  "only_DEMAND_posts_may_bid"
                              ),
                              "bid_submitted": False,
                          }
                      )

                      continue

                  print(
                      f"Submitting paid bid: {amount} sats"
                  )

                  result = submit_bid(
                      s,
                      tid,
                      amount,
                      tt,
                      d["total"],
                      d["reward_currency"],
                  )

                  if result["success"]:
                      summary["bids_submitted"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_submitted"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": "submitted",
                              "direction": "DEMAND",
                              "direction_confidence": (
                                  d[
                                      "direction_confidence"
                                  ]
                              ),
                              "reward_sats": (
                                  d["reward_sats"]
                              ),
                              "reward_currency": (
                                  d["reward_currency"]
                              ),
                              "reward_source": (
                                  d["reward_source"]
                              ),
                              "usd_amount": d["usd"],
                              "proposed_bid_sats": amount,
                              "bid_id": result.get(
                                  "bid_id"
                              ),
                              "http_status": result.get(
                                  "http_status"
                              ),
                              "capability_score": (
                                  d["capability"]
                              ),
                              "learning_score": (
                                  d["learning"]
                              ),
                              "domain_score": (
                                  d["domain_score"]
                              ),
                              "domain": d["domain"],
                              "total_score": d["total"],
                              "payments": "disabled",
                          }
                      )

                  else:
                      summary["bid_errors"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_error"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": "error",
                              "direction": "DEMAND",
                              "reward_sats": (
                                  d["reward_sats"]
                              ),
                              "reward_currency": (
                                  d["reward_currency"]
                              ),
                              "proposed_bid_sats": amount,
                              "http_status": result.get(
                                  "http_status"
                              ),
                              "response": result.get(
                                  "response"
                              ),
                          }
                      )

                  time.sleep(
                      ACTION_DELAY_SECONDS
                  )

              memory["last_run"] = {
                  "timestamp": now_iso(),
                  "summary": summary,
              }

              save_memory(memory)

              print(
                  "\n=============================================="
              )
              print(
                  "NØX ACT15 V7.2 - RUN SUMMARY"
              )
              print(
                  "=============================================="
              )

              for key, value in summary.items():
                  print(
                      f"{key}: {value}"
                  )

              print(
                  f"\nMemory saved: {MEMORY_FILE}"
              )

              print(
                  "\nDecision principle:"
              )
              print(
                  "- First classify marketplace direction"
              )
              print(
                  "- DEMAND/paid_task -> eligible for bid evaluation"
              )
              print(
                  "- SUPPLY/for_hire -> NEVER bid"
              )
              print(
                  "- UNKNOWN direction -> NEVER bid"
              )
              print(
                  "- WorkBuddy Scout for-hire trap recorded as learning"
              )
              print(
                  "- Explicit sats reward -> paid bid evaluation"
              )
              print(
                  "- Explicit USD/USDC reward -> converted for evaluation"
              )
              print(
                  "- Unpaid/low reward -> learning candidate"
              )
              print(
                  "- Tip potential remains relevant"
              )
              print(
                  "- Minimum opportunity value = 0 sats"
              )
              print(
                  "- Minimum bid = technical minimum only"
              )
              print(
                  "- Existing bid -> no duplicate bid"
              )
              print(
                  "- Payments/spending -> disabled"
              )
              print(
                  "- Gemini -> disabled"
              )

              print(
                  "\nACT15 V7.2 completed successfully."
              )

          if __name__ == "__main__":
              main()
          PY

          python /tmp/act15.py

      - name: Commit ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          if [ -f "${MEMORY_FILE}" ]; then
            git add "${MEMORY_FILE}"
          fi

          if git diff --cached --quiet; then
            echo "No ACT15 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT15 V7.2: classify marketplace direction before bidding"

      - name: Sync and push ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          if ! git log -1 --pretty=%B | grep -q "ACT15 V7.2:"; then
            echo "No ACT15 V7.2 commit created. Nothing to push."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "ERROR: unable to push ACT15 V7.2 memory after 3 attempts."
          exit 1
