name: NØX ACT 15 V4 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ACT15 - Autonomous Marketplace Bidding
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import re
          import sys
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY")

          MEMORY_PATH = "memory/nox_memory.json"

          MIN_BID_SATS = 10
          MAX_TASKS_TO_SCAN = 30

          # NØX proposes 20% of the estimated task value.
          PROPOSAL_PERCENT = 0.20

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing.")
              sys.exit(1)

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def now():
              return datetime.now(timezone.utc).isoformat()

          def get_json(url, headers=None, timeout=30):
              response = session.get(
                  url,
                  headers=headers or {},
                  timeout=timeout
              )

              print("GET", url, "->", response.status_code)

              if not response.ok:
                  print(response.text[:1000])

              response.raise_for_status()

              return response.json()

          def post_json(url, payload, headers=None, timeout=30):
              response = session.post(
                  url,
                  json=payload,
                  headers=headers or {},
                  timeout=timeout
              )

              print("POST", url, "->", response.status_code)

              if not response.ok:
                  print(response.text[:1000])

              return response

          def numeric(value):
              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  if math.isfinite(float(value)):
                      return float(value)

              if isinstance(value, str):
                  match = re.search(
                      r"(?<![\w.])(\d+(?:\.\d+)?)",
                      value.replace(",", "")
                  )

                  if match:
                      return float(match.group(1))

              return None

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          auth_response = session.post(
              BASE_URL + "/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(
              "Authentication ->",
              auth_response.status_code
          )

          if not auth_response.ok:
              print(auth_response.text[:1000])
              sys.exit(1)

          auth_data = auth_response.json()

          access_token = auth_data.get("access_token")

          if not access_token:
              print("ERROR: no access token returned.")
              sys.exit(1)

          headers = {
              "Authorization": "Bearer " + access_token
          }

          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          me = get_json(
              BASE_URL + "/users/me",
              headers=headers
          )

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or ""
          )

          print(
              "Authenticated identity:",
              username
          )

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          os.makedirs("memory", exist_ok=True)

          if os.path.exists(MEMORY_PATH):
              try:
                  with open(
                      MEMORY_PATH,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("learning", [])
          memory.setdefault("marketplace_actions", [])
          memory.setdefault("marketplace_observations", [])

          scan_time = now()

          # ------------------------------------------------------------
          # TASKS ALREADY HANDLED
          # ------------------------------------------------------------

          handled_task_ids = set()

          last_action = memory.get(
              "marketplace_action"
          )

          if isinstance(last_action, dict):
              task_id = last_action.get("task_id")

              if task_id:
                  handled_task_ids.add(
                      str(task_id)
                  )

          for collection_name in (
              "marketplace_actions",
              "marketplace_observations",
              "observations",
              "decisions",
          ):
              collection = memory.get(
                  collection_name,
                  []
              )

              if not isinstance(collection, list):
                  continue

              for item in collection:
                  if not isinstance(item, dict):
                      continue

                  task_id = item.get("task_id")

                  if task_id:
                      handled_task_ids.add(
                          str(task_id)
                      )

          print(
              "Previously handled task IDs:",
              len(handled_task_ids)
          )

          # ------------------------------------------------------------
          # GET BTC/USD RATE
          # ------------------------------------------------------------

          btc_usd = None

          try:
              rate_response = session.get(
                  "https://api.coinbase.com/v2/exchange-rates?currency=BTC",
                  timeout=15
              )

              print(
                  "BTC/USD public rate ->",
                  rate_response.status_code
              )

              if rate_response.ok:
                  rate_data = rate_response.json()

                  btc_usd_value = (
                      rate_data
                      .get("data", {})
                      .get("rates", {})
                      .get("USD")
                  )

                  btc_usd = numeric(
                      btc_usd_value
                  )

          except Exception as exc:
              print(
                  "BTC/USD rate unavailable:",
                  exc
              )

          if btc_usd:
              print(
                  "BTC/USD:",
                  btc_usd
              )
          else:
              print(
                  "BTC/USD unavailable. "
                  "USDC tasks requiring conversion will be skipped."
              )

          # ------------------------------------------------------------
          # CONVERT USD / USDC TO SATS
          # ------------------------------------------------------------

          def usd_to_sats(usd_value):
              if not btc_usd:
                  return None

              if usd_value <= 0:
                  return None

              sats = (
                  usd_value
                  / btc_usd
                  * 100000000
              )

              return int(round(sats))

          # ------------------------------------------------------------
          # EXTRACT TASK VALUE
          # ------------------------------------------------------------

          def extract_reward(task):

              fields = []

              for key in (
                  "title",
                  "description",
                  "body",
                  "content",
                  "budget",
                  "price",
                  "reward",
              ):
                  value = task.get(key)

                  if isinstance(value, str):
                      fields.append(value)

                  elif isinstance(value, dict):
                      fields.append(
                          json.dumps(
                              value,
                              ensure_ascii=False
                          )
                      )

              text = "\n".join(fields)

              # --------------------------------------------------------
              # SATS
              # --------------------------------------------------------

              sat_patterns = [
                  r"(\d+(?:[.,]\d+)?)\s*(?:k)?\s*sats?\b",
                  r"(\d+(?:[.,]\d+)?)\s*satoshi(?:s)?\b",
              ]

              sat_candidates = []

              for pattern in sat_patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  ):
                      value_text = (
                          match.group(1)
                          .replace(",", ".")
                      )

                      try:
                          value = float(
                              value_text
                          )
                      except ValueError:
                          continue

                      if "k" in match.group(0).lower():
                          value *= 1000

                      if value > 0:
                          sat_candidates.append(
                              int(round(value))
                          )

              if sat_candidates:
                  # Use the smallest explicit sats value.
                  #
                  # This avoids treating a range such as
                  # "1000-5000 sats" as a 5000-sat guaranteed reward.
                  reward_sats = min(
                      sat_candidates
                  )

                  return {
                      "currency": "sats",
                      "reward_sats": reward_sats,
                      "source": "task_text",
                  }

              # --------------------------------------------------------
              # USDC / USD
              # --------------------------------------------------------

              usd_patterns = [
                  r"\$\s*(\d+(?:[.,]\d+)?)\s*(?:USDC|USD)?\b",
                  r"(\d+(?:[.,]\d+)?)\s*(?:USDC|USD)\b",
              ]

              usd_candidates = []

              for pattern in usd_patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  ):
                      value_text = (
                          match.group(1)
                          .replace(",", ".")
                      )

                      try:
                          value = float(
                              value_text
                          )
                      except ValueError:
                          continue

                      if value > 0:
                          usd_candidates.append(
                              value
                          )

              if usd_candidates:
                  reward_usd = min(
                      usd_candidates
                  )

                  reward_sats = usd_to_sats(
                      reward_usd
                  )

                  if reward_sats:
                      return {
                          "currency": "USDC/USD",
                          "reward_usd": reward_usd,
                          "reward_sats": reward_sats,
                          "source": "task_text_converted",
                      }

              return None

          # ------------------------------------------------------------
          # GET MARKETPLACE
          # ------------------------------------------------------------

          marketplace = get_json(
              BASE_URL + "/marketplace/tasks",
              headers=headers
          )

          if isinstance(marketplace, dict):
              tasks = (
                  marketplace.get("tasks")
                  or marketplace.get("items")
                  or marketplace.get("data")
                  or []
              )
          elif isinstance(marketplace, list):
              tasks = marketplace
          else:
              tasks = []

          if not isinstance(tasks, list):
              tasks = []

          print(
              "Marketplace tasks returned:",
              len(tasks)
          )

          # ------------------------------------------------------------
          # SORT NEWEST FIRST
          # ------------------------------------------------------------

          def date_value(task):
              for key in (
                  "created_at",
                  "createdAt",
                  "published_at",
                  "publishedAt",
                  "updated_at",
                  "updatedAt",
              ):
                  value = task.get(key)

                  if value:
                      return str(value)

              return ""

          tasks = sorted(
              tasks,
              key=date_value,
              reverse=True
          )

          recent_tasks = tasks[
              :MAX_TASKS_TO_SCAN
          ]

          print(
              "Scanning the",
              len(recent_tasks),
              "most recent tasks."
          )

          # ------------------------------------------------------------
          # CAPABILITY MATCHING
          # ------------------------------------------------------------

          capability_keywords = [
              "python",
              "api",
              "automation",
              "research",
              "data",
              "analysis",
              "qa",
              "smoke test",
              "scraping",
              "web",
              "json",
              "csv",
              "seo",
              "audit",
              "copywriting",
              "documentation",
              "testing",
          ]

          def capability_score(task):
              text = " ".join([
                  str(task.get("title") or ""),
                  str(task.get("description") or ""),
                  str(task.get("body") or ""),
                  str(task.get("content") or ""),
              ]).lower()

              score = 0

              for keyword in capability_keywords:
                  if keyword in text:
                      score += 1

              return score

          # ------------------------------------------------------------
          # BUILD CANDIDATES
          # ------------------------------------------------------------

          candidates = []

          for task in recent_tasks:

              if not isinstance(task, dict):
                  continue

              task_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("post_id")
              )

              if not task_id:
                  continue

              task_id = str(task_id)

              if task_id in handled_task_ids:
                  print(
                      "SKIP already handled:",
                      task_id
                  )
                  continue

              status = str(
                  task.get("status")
                  or task.get("state")
                  or ""
              ).lower()

              if status not in (
                  "open",
                  "bidding",
              ):
                  print(
                      "SKIP status:",
                      task_id,
                      status
                  )
                  continue

              title = str(
                  task.get("title")
                  or task.get("name")
                  or "Untitled task"
              )

              reward = extract_reward(
                  task
              )

              if not reward:
                  print(
                      "SKIP no detectable reward:",
                      title
                  )
                  continue

              reward_sats = reward.get(
                  "reward_sats"
              )

              print("")
              print(
                  "Candidate:",
                  title
              )
              print(
                  "Reward:",
                  reward
              )

              if not reward_sats:
                  continue

              if reward_sats < MIN_BID_SATS:
                  print(
                      "SKIP reward below minimum:",
                      reward_sats,
                      "sats"
                  )
                  continue

              candidates.append({
                  "task": task,
                  "task_id": task_id,
                  "title": title,
                  "status": status,
                  "reward": reward,
                  "capability_score": capability_score(
                      task
                  ),
              })

          # ------------------------------------------------------------
          # SORT CANDIDATES
          # ------------------------------------------------------------

          candidates.sort(
              key=lambda item: (
                  item["capability_score"],
                  item["reward"]["reward_sats"],
              ),
              reverse=True
          )

          print("")
          print(
              "Eligible candidates:",
              len(candidates)
          )

          # ------------------------------------------------------------
          # FIND TASK WITHOUT NØX BID
          # ------------------------------------------------------------

          selected = None

          for candidate in candidates:

              task_id = candidate[
                  "task_id"
              ]

              try:
                  bids_data = get_json(
                      BASE_URL
                      + "/marketplace/"
                      + task_id
                      + "/bids",
                      headers=headers
                  )
              except Exception as exc:
                  print(
                      "Unable to read bids:",
                      task_id,
                      exc
                  )
                  continue

              if isinstance(
                  bids_data,
                  dict
              ):
                  bids = (
                      bids_data.get("bids")
                      or bids_data.get("items")
                      or bids_data.get("data")
                      or []
                  )
              elif isinstance(
                  bids_data,
                  list
              ):
                  bids = bids_data
              else:
                  bids = []

              if not isinstance(
                  bids,
                  list
              ):
                  bids = []

              nox_already_bid = False

              for bid in bids:

                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  values = [
                      bid.get("username"),
                      bid.get("agent_username"),
                      bid.get("bidder_username"),
                      bid.get("user_username"),
                  ]

                  bidder = bid.get(
                      "bidder"
                  )

                  if isinstance(
                      bidder,
                      dict
                  ):
                      values.extend([
                          bidder.get("username"),
                          bidder.get("handle"),
                          bidder.get("name"),
                      ])

                  for value in values:

                      if (
                          value
                          and str(value).lower()
                          == "nox_origine"
                      ):
                          nox_already_bid = True
                          break

                  if nox_already_bid:
                      break

              if nox_already_bid:
                  print(
                      "SKIP existing NØX bid:",
                      task_id
                  )
                  continue

              selected = candidate
              break

          # ------------------------------------------------------------
          # NO TASK
          # ------------------------------------------------------------

          if selected is None:

              observation = {
                  "act": "ACT15",
                  "type": "MARKETPLACE_SCAN",
                  "result": "NO_ELIGIBLE_TASK",
                  "tasks_scanned": len(
                      recent_tasks
                  ),
                  "eligible_candidates": len(
                      candidates
                  ),
                  "minimum_bid_sats": MIN_BID_SATS,
                  "timestamp": scan_time,
              }

              memory[
                  "observations"
              ].append(
                  observation
              )

              memory[
                  "marketplace_monitor"
              ] = {
                  "last_scan": scan_time,
                  "tasks_scanned": len(
                      recent_tasks
                  ),
                  "eligible_candidates": len(
                      candidates
                  ),
                  "result": "NO_ELIGIBLE_TASK",
              }

              memory[
                  "version"
              ] = "NØX ACT 15 V4"

              memory[
                  "last_act"
              ] = "ACT 15"

              memory[
                  "updated_at"
              ] = scan_time

              with open(
                  MEMORY_PATH,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "No suitable task found."
              )

              sys.exit(0)

          # ------------------------------------------------------------
          # CALCULATE NØX PROPOSAL
          # ------------------------------------------------------------

          task = selected["task"]

          task_id = selected[
              "task_id"
          ]

          task_title = selected[
              "title"
          ]

          reward_sats = int(
              selected[
                  "reward"
              ][
                  "reward_sats"
              ]
          )

          calculated_bid = int(
              round(
                  reward_sats
                  * PROPOSAL_PERCENT
              )
          )

          bid_amount = max(
              MIN_BID_SATS,
              calculated_bid
          )

          # Never bid above the detected reward.
          bid_amount = min(
              bid_amount,
              reward_sats
          )

          if bid_amount < MIN_BID_SATS:
              print(
                  "Calculated proposal is below minimum."
              )
              sys.exit(0)

          print("")
          print(
              "=================================================="
          )
          print(
              "NØX SELECTED MARKETPLACE TASK"
          )
          print(
              "Task:",
              task_title
          )
          print(
              "Task ID:",
              task_id
          )
          print(
              "Reward currency:",
              selected[
                  "reward"
              ].get("currency")
          )
          print(
              "Estimated reward:",
              reward_sats,
              "sats"
          )
          print(
              "NØX proposal:",
              bid_amount,
              "sats"
          )
          print(
              "Proposal percentage:",
              int(
                  PROPOSAL_PERCENT * 100
              ),
              "%"
          )
          print(
              "Capability score:",
              selected[
                  "capability_score"
              ]
          )
          print(
              "=================================================="
          )

          # ------------------------------------------------------------
          # BID DESCRIPTION
          # ------------------------------------------------------------

          bid_description = (
              "NØX Origin proposes "
              + str(bid_amount)
              + " sats to complete this task. "
              "NØX selected this task based on its available "
              "research, analysis, automation, API and structured-data "
              "capabilities. The work will be performed according "
              "to the stated requirements and the result will be "
              "validated before delivery."
          )

          payload = {
              "bid_amount_sats": int(
                  bid_amount
              ),
              "bid_description": bid_description,
          }

          idempotency_key = (
              "nox-act15-"
              + task_id
          )

          bid_headers = {
              "Authorization":
                  "Bearer " + access_token,
              "Idempotency-Key":
                  idempotency_key,
          }

          # ------------------------------------------------------------
          # REAL BID
          # ------------------------------------------------------------

          bid_response = post_json(
              BASE_URL
              + "/marketplace/"
              + task_id
              + "/bid",
              payload,
              headers=bid_headers
          )

          if bid_response.status_code not in (
              200,
              201
          ):
              print(
                  "REAL BID FAILED."
              )

              memory[
                  "observations"
              ].append({
                  "act": "ACT15",
                  "type": "MARKETPLACE_BID",
                  "result": "BID_FAILED",
                  "task_id": task_id,
                  "task_title": task_title,
                  "bid_amount_sats": bid_amount,
                  "http_status":
                      bid_response.status_code,
                  "timestamp": scan_time,
              })

              memory[
                  "version"
              ] = "NØX ACT 15 V4"

              memory[
                  "last_act"
              ] = "ACT 15"

              memory[
                  "updated_at"
              ] = scan_time

              with open(
                  MEMORY_PATH,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              sys.exit(1)

          try:
              bid_data = (
                  bid_response.json()
              )
          except Exception:
              bid_data = {}

          bid_id = (
              bid_data.get("id")
              or bid_data.get("bid_id")
              or bid_data.get("bidId")
          )

          bid_status = (
              bid_data.get("status")
              or "pending"
          )

          # ------------------------------------------------------------
          # SAVE ACTION
          # ------------------------------------------------------------

          action = {
              "act": "ACT15",
              "action":
                  "REAL_MARKETPLACE_BID",
              "result":
                  "BID_SUBMITTED",
              "task_id":
                  task_id,
              "task_title":
                  task_title,
              "bid_id":
                  bid_id,
              "reward_currency":
                  selected[
                      "reward"
                  ].get("currency"),
              "estimated_reward_sats":
                  reward_sats,
              "bid_amount_sats":
                  bid_amount,
              "proposal_percent":
                  PROPOSAL_PERCENT,
              "minimum_bid_sats":
                  MIN_BID_SATS,
              "capability_score":
                  selected[
                      "capability_score"
                  ],
              "bid_status":
                  bid_status,
              "timestamp":
                  scan_time,
          }

          memory[
              "marketplace_action"
          ] = action

          memory[
              "marketplace_actions"
          ].append(action)

          memory[
              "observations"
          ].append({
              "act": "ACT15",
              "type":
                  "MARKETPLACE_ACTION",
              "result":
                  "BID_SUBMITTED",
              "task_id":
                  task_id,
              "task_title":
                  task_title,
              "estimated_reward_sats":
                  reward_sats,
              "bid_amount_sats":
                  bid_amount,
              "bid_id":
                  bid_id,
              "timestamp":
                  scan_time,
          })

          memory[
              "decisions"
          ].append({
              "act": "ACT15",
              "decision":
                  "PLACE_BID",
              "task_id":
                  task_id,
              "task_title":
                  task_title,
              "estimated_reward_sats":
                  reward_sats,
              "bid_amount_sats":
                  bid_amount,
              "reason":
                  "NØX evaluated the recent marketplace tasks, "
                  "selected a compatible task, estimated its reward "
                  "and generated its own bid instead of copying "
                  "the advertised price.",
              "timestamp":
                  scan_time,
          })

          memory[
              "learning"
          ].append({
              "act": "ACT15",
              "lesson":
                  "NØX can evaluate a marketplace task, "
                  "estimate its value and generate an autonomous "
                  "Lightning-sats proposal.",
              "task_id":
                  task_id,
              "reward_sats":
                  reward_sats,
              "bid_amount_sats":
                  bid_amount,
              "timestamp":
                  scan_time,
          })

          memory[
              "version"
          ] = "NØX ACT 15 V4"

          memory[
              "last_act"
          ] = "ACT 15"

          memory[
              "updated_at"
          ] = scan_time

          with open(
              MEMORY_PATH,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "=================================================="
          )
          print(
              "ACT15 V4 SUCCESS"
          )
          print(
              "REAL BID SUBMITTED"
          )
          print(
              "Task:",
              task_title
          )
          print(
              "Task ID:",
              task_id
          )
          print(
              "Bid ID:",
              bid_id
          )
          print(
              "Estimated reward:",
              reward_sats,
              "sats"
          )
          print(
              "NØX proposal:",
              bid_amount,
              "sats"
          )
          print(
              "Bid status:",
              bid_status
          )
          print(
              "=================================================="
          )
          PY

      - name: Commit ACT15 memory
        run: |
          git config user.name "NØX Origin"
