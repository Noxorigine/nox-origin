name: NØX ACT 15 V3 - Autonomous Marketplace Action

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ACT15 - Autonomous marketplace action
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing.")
              sys.exit(1)

          MEMORY_PATH = "memory/nox_memory.json"

          MIN_BID_SATS = 10
          MAX_TASKS_TO_SCAN = 30

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def now():
              return datetime.now(timezone.utc).isoformat()

          def fail(message):
              print("ERROR:", message)
              sys.exit(1)

          def get_json(url, headers=None, timeout=30):
              response = session.get(
                  url,
                  headers=headers or {},
                  timeout=timeout
              )

              print("GET", url, "->", response.status_code)

              if not response.ok:
                  print(response.text[:1000])

              response.raise_for_status()
              return response.json()

          def post_json(url, payload, headers=None, timeout=30):
              response = session.post(
                  url,
                  json=payload,
                  headers=headers or {},
                  timeout=timeout
              )

              print("POST", url, "->", response.status_code)

              if not response.ok:
                  print(response.text[:1000])

              return response

          # ------------------------------------------------------------
          # 1. AUTHENTICATION
          # ------------------------------------------------------------

          auth_response = session.post(
              BASE_URL + "/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print("Authentication ->", auth_response.status_code)

          if not auth_response.ok:
              print(auth_response.text[:1000])
              fail("Authentication failed.")

          auth_data = auth_response.json()
          access_token = auth_data.get("access_token")

          if not access_token:
              fail("No access_token returned by Colony.")

          headers = {
              "Authorization": "Bearer " + access_token
          }

          # ------------------------------------------------------------
          # 2. IDENTITY
          # ------------------------------------------------------------

          me = get_json(
              BASE_URL + "/users/me",
              headers=headers
          )

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or ""
          )

          print("Authenticated identity:", username)

          if username and username.lower() != "nox_origine":
              print(
                  "WARNING: authenticated username is",
                  username,
                  "instead of nox_origine"
              )

          # ------------------------------------------------------------
          # 3. LOAD MEMORY
          # ------------------------------------------------------------

          os.makedirs("memory", exist_ok=True)

          if os.path.exists(MEMORY_PATH):
              try:
                  with open(MEMORY_PATH, "r", encoding="utf-8") as f:
                      memory = json.load(f)
              except Exception as exc:
                  print("Memory load warning:", exc)
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("learning", [])
          memory.setdefault("marketplace_actions", [])
          memory.setdefault("marketplace_observations", [])

          scan_time = now()

          # ------------------------------------------------------------
          # 4. BUILD LIST OF TASKS ALREADY HANDLED
          # ------------------------------------------------------------

          handled_task_ids = set()

          last_action = memory.get("marketplace_action")

          if isinstance(last_action, dict):
              task_id = last_action.get("task_id")
              if task_id:
                  handled_task_ids.add(str(task_id))

          for item in memory.get("marketplace_actions", []):
              if isinstance(item, dict):
                  task_id = item.get("task_id")
                  if task_id:
                      handled_task_ids.add(str(task_id))

          for item in memory.get("marketplace_observations", []):
              if isinstance(item, dict):
                  task_id = item.get("task_id")
                  if task_id:
                      handled_task_ids.add(str(task_id))

          for item in memory.get("observations", []):
              if isinstance(item, dict):
                  task_id = item.get("task_id")
                  if task_id:
                      handled_task_ids.add(str(task_id))

          for item in memory.get("decisions", []):
              if isinstance(item, dict):
                  task_id = item.get("task_id")
                  if task_id:
                      handled_task_ids.add(str(task_id))

          print(
              "Previously handled task IDs:",
              len(handled_task_ids)
          )

          # ------------------------------------------------------------
          # 5. FETCH MARKETPLACE
          # ------------------------------------------------------------

          marketplace = get_json(
              BASE_URL + "/marketplace/tasks",
              headers=headers
          )

          if isinstance(marketplace, dict):
              tasks = (
                  marketplace.get("tasks")
                  or marketplace.get("items")
                  or marketplace.get("data")
                  or []
              )
          elif isinstance(marketplace, list):
              tasks = marketplace
          else:
              tasks = []

          if not isinstance(tasks, list):
              tasks = []

          print("Marketplace tasks returned:", len(tasks))

          # ------------------------------------------------------------
          # 6. SORT BY RECENT TASKS
          # ------------------------------------------------------------

          def date_value(task):
              for key in (
                  "created_at",
                  "createdAt",
                  "published_at",
                  "publishedAt",
                  "updated_at",
                  "updatedAt",
              ):
                  value = task.get(key)

                  if value:
                      return str(value)

              return ""

          tasks = sorted(
              tasks,
              key=date_value,
              reverse=True
          )

          recent_tasks = tasks[:MAX_TASKS_TO_SCAN]

          print(
              "Scanning the",
              len(recent_tasks),
              "most recent marketplace tasks."
          )

          # ------------------------------------------------------------
          # 7. FIND ELIGIBLE TASK
          # ------------------------------------------------------------

          eligible_task = None
          eligible_bid_amount = None
          candidates_checked = 0

          for task in recent_tasks:

              if not isinstance(task, dict):
                  continue

              task_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("post_id")
              )

              if not task_id:
                  continue

              task_id = str(task_id)

              if task_id in handled_task_ids:
                  print(
                      "SKIP already handled:",
                      task_id
                  )
                  continue

              status = str(
                  task.get("status")
                  or task.get("state")
                  or ""
              ).lower()

              if status not in ("open", "bidding"):
                  print(
                      "SKIP status:",
                      task_id,
                      status
                  )
                  continue

              title = str(
                  task.get("title")
                  or task.get("name")
                  or "Untitled task"
              )

              print("")
              print("Candidate:", title)
              print("Task ID:", task_id)
              print("Status:", status)

              # --------------------------------------------------------
              # 8. CHECK EXISTING BIDS
              # --------------------------------------------------------

              try:
                  bids_data = get_json(
                      BASE_URL + "/marketplace/" + task_id + "/bids",
                      headers=headers
                  )
              except Exception as exc:
                  print(
                      "Could not read bids for",
                      task_id,
                      ":",
                      exc
                  )
                  continue

              if isinstance(bids_data, dict):
                  bids = (
                      bids_data.get("bids")
                      or bids_data.get("items")
                      or bids_data.get("data")
                      or []
                  )
              elif isinstance(bids_data, list):
                  bids = bids_data
              else:
                  bids = []

              if not isinstance(bids, list):
                  bids = []

              existing_nox_bid = False

              for bid in bids:
                  if not isinstance(bid, dict):
                      continue

                  bidder = bid.get("bidder")

                  possible_usernames = [
                      bid.get("username"),
                      bid.get("agent_username"),
                      bid.get("bidder_username"),
                      bid.get("user_username"),
                  ]

                  if isinstance(bidder, dict):
                      possible_usernames.extend([
                          bidder.get("username"),
                          bidder.get("handle"),
                          bidder.get("name"),
                      ])

                  for value in possible_usernames:
                      if (
                          value
                          and str(value).lower() == "nox_origine"
                      ):
                          existing_nox_bid = True
                          break

                  if existing_nox_bid:
                      break

              if existing_nox_bid:
                  print(
                      "SKIP: NØX already has a bid on this task."
                  )
                  continue

              # --------------------------------------------------------
              # 9. DETERMINE SAT BUDGET
              # --------------------------------------------------------

              sat_values = []

              possible_budget_keys = [
                  "budget_sats",
                  "budget_min_sats",
                  "budget_max_sats",
                  "min_bid_sats",
                  "minimum_bid_sats",
                  "max_bid_sats",
                  "price_sats",
                  "reward_sats",
                  "amount_sats",
              ]

              for key in possible_budget_keys:
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      sat_values.append(int(value))

                  elif isinstance(value, str):
                      match = re.search(
                          r"\b(\d+)\b",
                          value
                      )

                      if match:
                          sat_values.append(
                              int(match.group(1))
                          )

              # Check nested budget object.
              budget = task.get("budget")

              if isinstance(budget, dict):
                  for key in (
                      "sats",
                      "amount_sats",
                      "min_sats",
                      "max_sats",
                      "minimum_sats",
                      "maximum_sats",
                  ):
                      value = budget.get(key)

                      if isinstance(value, (int, float)):
                          sat_values.append(int(value))

                      elif isinstance(value, str):
                          match = re.search(
                              r"\b(\d+)\b",
                              value
                          )

                          if match:
                              sat_values.append(
                                  int(match.group(1))
                              )

              sat_values = [
                  value for value in sat_values
                  if value >= 0
              ]

              # --------------------------------------------------------
              # IMPORTANT:
              # Never convert USD / USDC / EUR into sats automatically.
              # --------------------------------------------------------

              if not sat_values:
                  print(
                      "SKIP: no usable sat budget exposed by API."
                  )
                  continue

              budget_sats = max(sat_values)

              print("Detected sat budget:", budget_sats)

              if budget_sats < MIN_BID_SATS:
                  print(
                      "SKIP: budget below",
                      MIN_BID_SATS,
                      "sats."
                  )
                  continue

              # NØX bids at the available amount, never below 10 sats.
              bid_amount = budget_sats

              if bid_amount < MIN_BID_SATS:
                  continue

              candidates_checked += 1

              eligible_task = task
              eligible_bid_amount = bid_amount

              print("")
              print("SELECTED TASK:", title)
              print("SELECTED TASK ID:", task_id)
              print("REAL BID AMOUNT:", bid_amount, "sats")

              break

          # ------------------------------------------------------------
          # 10. NO ELIGIBLE TASK
          # ------------------------------------------------------------

          if eligible_task is None:

              observation = {
                  "act": "ACT15",
                  "type": "MARKETPLACE_SCAN",
                  "result": "NO_ELIGIBLE_TASK",
                  "tasks_scanned": len(recent_tasks),
                  "candidates_checked": candidates_checked,
                  "minimum_bid_sats": MIN_BID_SATS,
                  "timestamp": scan_time,
              }

              memory["observations"].append(observation)

              memory["marketplace_monitor"] = {
                  "last_scan": scan_time,
                  "tasks_scanned": len(recent_tasks),
                  "result": "NO_ELIGIBLE_TASK",
              }

              memory["version"] = "NØX ACT 15 V3"
              memory["last_act"] = "ACT 15"
              memory["updated_at"] = scan_time

              with open(
                  MEMORY_PATH,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print("")
              print(
                  "No eligible task found in the last",
                  MAX_TASKS_TO_SCAN,
                  "tasks."
              )

              sys.exit(0)

          # ------------------------------------------------------------
          # 11. PREPARE REAL BID
          # ------------------------------------------------------------

          task_id = str(
              eligible_task.get("id")
              or eligible_task.get("task_id")
              or eligible_task.get("post_id")
          )

          task_title = str(
              eligible_task.get("title")
              or eligible_task.get("name")
              or "Marketplace task"
          )

          bid_description = (
              "NØX Origin proposes to complete the task: "
              + task_title
              + ". NØX will analyze the requirements, "
              "perform the relevant work using its available "
              "research, analysis and workflow capabilities, "
              "validate the result, and provide the requested deliverable."
          )

          payload = {
              "bid_amount_sats": int(eligible_bid_amount),
              "bid_description": bid_description,
          }

          idempotency_key = (
              "nox-act15-"
              + task_id
          )

          bid_headers = {
              "Authorization": "Bearer " + access_token,
              "Idempotency-Key": idempotency_key,
          }

          print("")
          print("--------------------------------------------------")
          print("SUBMITTING REAL MARKETPLACE BID")
          print("Task:", task_title)
          print("Task ID:", task_id)
          print("Bid:", eligible_bid_amount, "sats")
          print("Minimum allowed:", MIN_BID_SATS, "sats")
          print("--------------------------------------------------")

          # ------------------------------------------------------------
          # 12. SUBMIT REAL BID
          # ------------------------------------------------------------

          bid_response = post_json(
              BASE_URL + "/marketplace/" + task_id + "/bid",
              payload,
              headers=bid_headers
          )

          if bid_response.status_code not in (200, 201):
              print("")
              print(
                  "REAL BID WAS NOT ACCEPTED."
              )
              print(
                  "HTTP status:",
                  bid_response.status_code
              )

              memory["observations"].append({
                  "act": "ACT15",
                  "type": "MARKETPLACE_BID",
                  "result": "BID_FAILED",
                  "task_id": task_id,
                  "task_title": task_title,
                  "bid_amount_sats": int(eligible_bid_amount),
                  "http_status": bid_response.status_code,
                  "timestamp": scan_time,
              })

              memory["version"] = "NØX ACT 15 V3"
              memory["last_act"] = "ACT 15"
              memory["updated_at"] = scan_time

              with open(
                  MEMORY_PATH,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              fail(
                  "Marketplace bid submission failed."
              )

          try:
              bid_data = bid_response.json()
          except Exception:
              bid_data = {}

          bid_id = (
              bid_data.get("id")
              or bid_data.get("bid_id")
              or bid_data.get("bidId")
          )

          bid_status = (
              bid_data.get("status")
              or "pending"
          )

          # ------------------------------------------------------------
          # 13. RECORD SUCCESS
          # ------------------------------------------------------------

          action = {
              "act": "ACT15",
              "action": "REAL_MARKETPLACE_BID",
              "result": "BID_SUBMITTED",
              "task_id": task_id,
              "task_title": task_title,
              "bid_id": bid_id,
              "bid_amount_sats": int(eligible_bid_amount),
              "minimum_bid_sats": MIN_BID_SATS,
              "bid_status": bid_status,
              "timestamp": scan_time,
          }

          memory["marketplace_action"] = action
          memory["marketplace_actions"].append(action)

          memory["observations"].append({
              "act": "ACT15",
              "type": "MARKETPLACE_ACTION",
              "result": "BID_SUBMITTED",
              "task_id": task_id,
              "task_title": task_title,
              "bid_id": bid_id,
              "bid_amount_sats": int(eligible_bid_amount),
              "timestamp": scan_time,
          })

          memory["decisions"].append({
              "act": "ACT15",
              "decision": "PLACE_BID",
              "task_id": task_id,
              "task_title": task_title,
              "bid_amount_sats": int(eligible_bid_amount),
              "reason": (
                  "Task was found among the 30 most recent marketplace "
                  "tasks, was eligible, had no existing NØX bid, "
                  "and exposed a usable sat budget at or above "
                  + str(MIN_BID_SATS)
                  + " sats."
              ),
              "timestamp": scan_time,
          })

          memory["learning"].append({
              "act": "ACT15",
              "lesson": (
                  "NØX can autonomously scan recent marketplace tasks "
                  "and submit a real bid when a valid sat budget is "
                  "available."
              ),
              "task_id": task_id,
              "bid_amount_sats": int(eligible_bid_amount),
              "timestamp": scan_time,
          })

          memory["version"] = "NØX ACT 15 V3"
          memory["last_act"] = "ACT 15"
          memory["updated_at"] = scan_time

          with open(
              MEMORY_PATH,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==================================================")
          print("ACT15 SUCCESS")
          print("REAL BID SUBMITTED")
          print("Task:", task_title)
          print("Task ID:", task_id)
          print("Bid ID:", bid_id)
          print("Bid amount:", eligible_bid_amount, "sats")
          print("Bid status:", bid_status)
          print("==================================================")
          PY

      - name: Commit ACT15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT15 autonomous marketplace action"

          git pull --rebase origin main
          git push origin HEAD:main
