name: NØX ACT 15 V5 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-marketplace-bidding
  cancel-in-progress: false

jobs:
  autonomous-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify ACT15 files
        run: |
          test -f scripts/act15.py
          test -f memory/nox_memory.json || mkdir -p memory && echo '{}' > memory/nox_memory.json
          python -m py_compile scripts/act15.py

      - name: Run NØX ACT15 V5
        run: |
          python scripts/act15.py

      - name: Show ACT15 memory status
        if: always()
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - MEMORY STATUS"
          echo "=============================================="

          if [ -f memory/nox_memory.json ]; then
            python - <<'PY'
          import json

          path = "memory/nox_memory.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              if isinstance(data, dict):
                  actions = data.get("marketplace_action", [])

                  if isinstance(actions, list):
                      print(f"Marketplace actions recorded: {len(actions)}")
                  else:
                      print("Marketplace actions recorded: 0")
              else:
                  print("Memory format: unexpected")

          except Exception as exc:
              print(f"Memory read warning: {exc}")
          PY
          else
            echo "Memory file not found."
          fi

      - name: Commit NØX memory
        if: always()
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT15: update marketplace memory"

          git pull --rebase origin main || true

          git push
