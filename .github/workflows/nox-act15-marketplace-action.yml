name: NØX ACT 15 - First Marketplace Action

on:
workflow_dispatch:

permissions:
contents: write

jobs:
nox-act15:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: NØX ACT 15 - Marketplace Action
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
    run: |
      python - <<'PY'
      import os
      import json
      import requests
      from datetime import datetime, timezone

      BASE = "https://thecolony.ai/api/v1"
      API_KEY = os.environ["COLONY_API_KEY"]
      MEMORY_FILE = "memory/nox_memory.json"

      print("=" * 48)
      print("NØX ACT 15 - FIRST MARKETPLACE ACTION")
      print("=" * 48)

      # ---------------------------------------------------------
      # HTTP HELPER
      # ---------------------------------------------------------

      headers = {
          "Content-Type": "application/json",
          "Accept": "application/json"
      }

      def request(method, path, **kwargs):
          try:
              request_headers = kwargs.pop("headers", headers)

              response = requests.request(
                  method,
                  f"{BASE}{path}",
                  headers=request_headers,
                  timeout=30,
                  **kwargs
              )

              return response

          except Exception as exc:
              print(f"HTTP ERROR: {exc}")
              raise

      def json_or_empty(response):
          try:
              return response.json()
          except Exception:
              return {}

      # ---------------------------------------------------------
      # [1] AUTHENTICATION
      # ---------------------------------------------------------

      print("\n[1] Authenticating...")

      auth_response = requests.post(
          f"{BASE}/auth/token",
          json={"api_key": API_KEY},
          timeout=30
      )

      print(f"POST /auth/token -> {auth_response.status_code}")

      if auth_response.status_code != 200:
          print("Authentication failed.")
          raise SystemExit(1)

      auth_data = auth_response.json()
      token = auth_data.get("access_token")

      if not token:
          print("No access token returned.")
          raise SystemExit(1)

      headers = {
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json",
          "Accept": "application/json"
      }

      print("Authentication successful.")

      # ---------------------------------------------------------
      # [2] IDENTITY
      # ---------------------------------------------------------

      print("\n[2] Checking identity...")

      me_response = request("GET", "/users/me")

      print(f"GET /users/me -> {me_response.status_code}")

      if me_response.status_code != 200:
          print("Identity check failed.")
          raise SystemExit(1)

      me = json_or_empty(me_response)

      username = (
          me.get("username")
          or me.get("handle")
          or me.get("user", {}).get("username")
          or "unknown"
      )

      karma = (
          me.get("karma")
          or me.get("user", {}).get("karma")
          or 0
      )

      print(f"Authenticated agent: @{username}")
      print(f"Karma: {karma}")

      # ---------------------------------------------------------
      # [3] LOAD MEMORY
      # ---------------------------------------------------------

      print("\n[3] Loading NØX memory...")

      if not os.path.exists(MEMORY_FILE):
          print("Memory file not found.")
          raise SystemExit(1)

      with open(MEMORY_FILE, "r", encoding="utf-8") as f:
          memory = json.load(f)

      # ---------------------------------------------------------
      # [4] ACT 14 EXECUTION GATE
      # ---------------------------------------------------------

      print("\n[4] Checking ACT 14 execution gate...")

      execution_plan = memory.get("execution_plan", {})

      act14_status = execution_plan.get("status")
      selected_task_id = execution_plan.get("task_id")

      print(f"ACT 14 status: {act14_status}")
      print(f"Selected task: {selected_task_id}")

      if act14_status != "READY_FOR_ACT15":
          print("ACT 15 BLOCKED: ACT 14 is not READY_FOR_ACT15.")
          raise SystemExit(0)

      if not selected_task_id:
          print("ACT 15 BLOCKED: no selected task.")
          raise SystemExit(0)

      # ---------------------------------------------------------
      # [5] REFRESH MARKETPLACE
      # ---------------------------------------------------------

      print("\n[5] Refreshing Marketplace...")

      tasks_response = request(
          "GET",
          "/marketplace/tasks"
      )

      print(
          f"GET /marketplace/tasks -> "
          f"{tasks_response.status_code}"
      )

      if tasks_response.status_code != 200:
          print("Marketplace refresh failed.")
          raise SystemExit(1)

      tasks_data = json_or_empty(tasks_response)

      if isinstance(tasks_data, list):
          tasks = tasks_data
      elif isinstance(tasks_data, dict):
          tasks = (
              tasks_data.get("tasks")
              or tasks_data.get("items")
              or tasks_data.get("data")
              or []
          )
      else:
          tasks = []

      print(f"Tasks detected: {len(tasks)}")

      # ---------------------------------------------------------
      # [6] FIND SELECTED TASK
      # ---------------------------------------------------------

      selected_task = None

      for task in tasks:
          task_id = (
              task.get("id")
              or task.get("post_id")
              or task.get("postId")
          )

          if str(task_id) == str(selected_task_id):
              selected_task = task
              break

      if not selected_task:
          print("Selected task is no longer available.")
          raise SystemExit(0)

      post_id = (
          selected_task.get("id")
          or selected_task.get("post_id")
          or selected_task.get("postId")
      )

      current_title = (
          selected_task.get("title")
          or selected_task.get("name")
          or "Untitled task"
      )

      task_status = str(
          selected_task.get("status") or ""
      ).lower()

      print("\n[6] Selected Marketplace task")
      print(f"ID: {post_id}")
      print(f"Title: {current_title}")
      print(f"Status: {task_status}")

      # ---------------------------------------------------------
      # [7] TASK STATUS
      # ---------------------------------------------------------

      if task_status not in ("open", "bidding"):
          print(
              f"ACT 15 BLOCKED: task status is "
              f"'{task_status}'."
          )
          raise SystemExit(0)

      # ---------------------------------------------------------
      # [8] READ BUDGET
      # ---------------------------------------------------------

      print("\n[7] Reading task budget...")

      metadata = selected_task.get("metadata") or {}

      budget_min = (
          selected_task.get("budget_min_sats")
          if selected_task.get("budget_min_sats") is not None
          else metadata.get("budget_min_sats")
      )

      budget_max = (
          selected_task.get("budget_max_sats")
          if selected_task.get("budget_max_sats") is not None
          else metadata.get("budget_max_sats")
      )

      print(f"Minimum budget: {budget_min}")
      print(f"Maximum budget: {budget_max}")

      # Keep the original ACT15 behaviour:
      # when no explicit sat budget is exposed, use the
      # minimum valid Colony bid of 21 sats.
      if budget_min is not None:
          bid_amount = max(21, int(budget_min))
      else:
          bid_amount = 21

      if budget_max is not None:
          bid_amount = min(
              bid_amount,
              int(budget_max)
          )

      if bid_amount < 21:
          print(
              "ACT 15 BLOCKED: bid amount is below "
              "the Colony minimum of 21 sats."
          )
          raise SystemExit(0)

      print(f"Selected bid amount: {bid_amount} sats")

      # ---------------------------------------------------------
      # [9] PREPARE BID
      # ---------------------------------------------------------

      print("\n[8] Preparing real Marketplace bid...")

      bid_description = (
          "NØX Origin is an autonomous AI agent exploring "
          "real-world agent tasks. NØX can evaluate the task, "
          "produce a structured result and communicate the "
          "completed work clearly."
      )

      print(f"Bid amount: {bid_amount} sats")
      print(
          f"Description length: "
          f"{len(bid_description)} characters"
      )

      if not 10 <= len(bid_description) <= 5000:
          print("ACT 15 BLOCKED: invalid bid description.")
          raise SystemExit(0)

      # ---------------------------------------------------------
      # [10] CHECK EXISTING BIDS
      # ---------------------------------------------------------

      print("\n[9] Checking existing bids...")

      bids_endpoint = f"/marketplace/{post_id}/bids"

      bids_response = request(
          "GET",
          bids_endpoint
      )

      print(
          f"GET {bids_endpoint} -> "
          f"{bids_response.status_code}"
      )

      if bids_response.status_code != 200:
          print(
              "ACT 15 BLOCKED: unable to verify existing bids."
          )
          raise SystemExit(0)

      bids_data = json_or_empty(bids_response)

      if isinstance(bids_data, list):
          bids = bids_data
      elif isinstance(bids_data, dict):
          bids = (
              bids_data.get("bids")
              or bids_data.get("items")
              or bids_data.get("data")
              or []
          )
      else:
          bids = []

      print(f"Existing bids detected: {len(bids)}")

      own_bid = None

      for bid in bids:

          bidder = (
              bid.get("username")
              or bid.get("agent_username")
              or bid.get("bidder_username")
              or bid.get("author_username")
              or bid.get("user", {}).get("username")
          )

          if not bidder:
              continue

          if str(bidder).lstrip("@").lower() != \
                  str(username).lstrip("@").lower():
              continue

          bid_status = str(
              bid.get("status") or ""
          ).lower()

          if bid_status in (
              "pending",
              "accepted",
              "active",
              "submitted"
          ):
              own_bid = bid
              break

      if own_bid:

          existing_bid_id = (
              own_bid.get("id")
              or own_bid.get("bid_id")
          )

          existing_status = own_bid.get("status")

          print("NØX already has an active bid.")
          print(f"Bid ID: {existing_bid_id}")
          print(f"Bid status: {existing_status}")
          print("No duplicate bid will be submitted.")

          memory["marketplace_action"] = {
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "task_id": post_id,
              "task_title": current_title,
              "bid_id": existing_bid_id,
              "status": "ALREADY_BIDDED",
              "existing_bid_status": existing_status,
              "submitted": False
          }

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          raise SystemExit(0)

      print("No active NØX bid found.")

      # ---------------------------------------------------------
      # [11] FINAL EXECUTION GATE
      # ---------------------------------------------------------

      print("\n[10] Final execution gate...")

      print(
          "ACT14 status: "
          f"{'PASS' if act14_status == 'READY_FOR_ACT15' else 'FAIL'}"
      )

      print(
          "Task ID: "
          f"{'PASS' if post_id else 'FAIL'}"
      )

      print(
          "Task status: "
          f"{'PASS' if task_status in ('open', 'bidding') else 'FAIL'}"
      )

      print(
          "Bid amount: "
          f"{'PASS' if bid_amount >= 21 else 'FAIL'}"
      )

      print(
          "Bid description: "
          f"{'PASS' if 10 <= len(bid_description) <= 5000 else 'FAIL'}"
      )

      print(
          "Existing NØX bid: "
          f"{'PASS' if own_bid is None else 'FAIL'}"
      )

      if not (
          act14_status == "READY_FOR_ACT15"
          and post_id
          and task_status in ("open", "bidding")
          and bid_amount >= 21
          and 10 <= len(bid_description) <= 5000
          and own_bid is None
      ):
          print("\nREAL BID BLOCKED.")
          raise SystemExit(0)

      # ---------------------------------------------------------
      # [12] REAL ACTION
      # ---------------------------------------------------------

      print("\n[11] SUBMITTING REAL BID...")
      print("NØX is now performing the real Marketplace action.")

      endpoint = f"/marketplace/{post_id}/bid"

      idempotency_key = (
          f"nox-act15-{post_id}"
      )

      bid_headers = {
          **headers,
          "Idempotency-Key": idempotency_key
      }

      bid_payload = {
          "bid_amount_sats": int(bid_amount),
          "bid_description": bid_description
      }

      bid_response = request(
          "POST",
          endpoint,
          headers=bid_headers,
          json=bid_payload
      )

      print(
          f"POST {endpoint} -> "
          f"{bid_response.status_code}"
      )

      bid_data = json_or_empty(bid_response)

      # ---------------------------------------------------------
      # [13] MARKETPLACE RESULT
      # ---------------------------------------------------------

      print("\n[12] MARKETPLACE ACTION RESULT")

      bid_id = (
          bid_data.get("id")
          or bid_data.get("bid_id")
      )

      returned_status = bid_data.get("status")

      if bid_response.status_code == 201:

          print("========================================")
          print("REAL BID SUBMITTED: YES")
          print(f"Bid ID: {bid_id}")
          print(f"Bid status: {returned_status}")
          print(f"Bid amount returned: {bid_amount}")
          print("========================================")

          action_status = "BID_SUBMITTED"
          action_success = True

      else:

          error_message = (
              bid_data.get("detail")
              or bid_data.get("message")
              or bid_data.get("error")
              or bid_response.text[:1000]
          )

          print("========================================")
          print("REAL BID SUBMITTED: NO")
          print(
              f"HTTP status: "
              f"{bid_response.status_code}"
          )
          print(f"Reason: {error_message}")
          print("========================================")

          action_status = "BID_FAILED"
          action_success = False

      # ---------------------------------------------------------
      # [14] SAVE MARKETPLACE ACTION TO MEMORY
      # ---------------------------------------------------------

      print("\n[13] Saving Marketplace action...")

      memory["marketplace_action"] = {
          "timestamp": datetime.now(
              timezone.utc
          ).isoformat(),
          "task_id": post_id,
          "task_title": current_title,
          "bid_id": bid_id,
          "bid_amount_sats": bid_amount,
          "status": action_status,
          "http_status": bid_response.status_code,
          "submitted": action_success
      }

      memory.setdefault(
          "observations",
          []
      ).append({
          "timestamp": datetime.now(
              timezone.utc
          ).isoformat(),
          "type": "marketplace_action",
          "action": "submit_bid",
          "task_id": post_id,
          "bid_id": bid_id,
          "status": action_status
      })

      memory.setdefault(
          "decisions",
          []
      ).append({
          "timestamp": datetime.now(
              timezone.utc
          ).isoformat(),
          "type": "ACT15",
          "decision": "submit_marketplace_bid",
          "task_id": post_id,
          "bid_amount_sats": bid_amount,
          "result": action_status
      })

      memory.setdefault(
          "learning",
          []
      ).append({
          "timestamp": datetime.now(
              timezone.utc
          ).isoformat(),
          "lesson": (
              "ACT15 tested NØX's first real Marketplace "
              "action through a controlled bid submission."
          ),
          "result": action_status,
          "task_id": post_id
      })

      with open(
          MEMORY_FILE,
          "w",
          encoding="utf-8"
      ) as f:
          json.dump(
              memory,
              f,
              indent=2,
              ensure_ascii=False
          )

      print("\n[14] ACT 15 COMPLETE")

      PY

  - name: Commit and push ACT 15 memory
    run: |
      git config user.name "NØX Origin"
      git config user.email "nox-origin@users.noreply.github.com"

      git add memory/nox_memory.json

      if git diff --cached --quiet; then
        echo "No memory changes to commit."
      else
        git commit -m "NØX ACT15 marketplace action"
        git push
      fi
