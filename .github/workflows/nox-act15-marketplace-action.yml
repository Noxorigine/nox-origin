name: NØX ACT 15 V7.3 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MIN_BID_SATS: "1"
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX ACT15 V7.3 - ENVIRONMENT CHECK"
          echo "=============================================="

          if [ -f "${MEMORY_FILE}" ]; then
            echo "OK: ${MEMORY_FILE} exists."
          else
            echo "INFO: ${MEMORY_FILE} will be created."
          fi

          echo "Schedule: every 4 hours"
          echo "Action limit: NONE"
          echo "Market direction classification: ENABLED"
          echo "FOR_HIRE/SUPPLY protection: ENABLED"
          echo "UNKNOWN direction protection: ENABLED"
          echo "Bid amount rule: advertised reward amount"
          echo "Unpaid learning candidates: ENABLED"
          echo "Tip opportunities: ENABLED"
          echo "Payments: DISABLED"
          echo "Cost target: €0"
          echo "Gemini: DISABLED"

          echo "=============================================="

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run ACT15 V7.3
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1",
          ).rstrip("/")

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              "",
          ).strip()

          MEMORY_FILE = Path(
              os.environ.get(
                  "MEMORY_FILE",
                  "memory/nox_act_15_marketplace.json",
              )
          )

          MIN_BID_SATS = int(
              os.environ.get(
                  "MIN_BID_SATS",
                  "1",
              )
          )

          MAX_TASKS = int(
              os.environ.get(
                  "MAX_TASKS",
                  "30",
              )
          )

          MAX_MEMORY_ACTIONS = int(
              os.environ.get(
                  "MAX_MEMORY_ACTIONS",
                  "500",
              )
          )

          ACTION_DELAY_SECONDS = float(
              os.environ.get(
                  "ACTION_DELAY_SECONDS",
                  "1",
              )
          )

          FALLBACK_SATS_PER_USD = int(
              os.environ.get(
                  "FALLBACK_SATS_PER_USD",
                  "60000",
              )
          )

          SAFETY_BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "ammunition",
              "explosive",
              "explosives",
              "bomb",
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing",
              "stolen account",
              "account takeover",
              "hack account",
              "money laundering",
              "fraud",
              "illegal drugs",
              "drug trafficking",
          ]

          CAPABILITY_KEYWORDS = {
              "python": 12,
              "api": 12,
              "automation": 12,
              "research": 10,
              "data": 10,
              "analysis": 10,
              "qa": 9,
              "testing": 9,
              "test": 7,
              "smoke test": 9,
              "scraping": 8,
              "web": 7,
              "json": 7,
              "csv": 7,
              "seo": 6,
              "copywriting": 7,
              "documentation": 8,
              "docs": 8,
              "scripts": 10,
              "database": 8,
              "source checks": 10,
              "fact checking": 10,
              "fact-checking": 10,
              "technical writing": 8,
              "agent": 12,
              "ai agent": 14,
              "automation agent": 14,
          }

          LEARNING_KEYWORDS = {
              "ai agent": 14,
              "agent": 12,
              "agents": 12,
              "autonomy": 14,
              "autonomous": 12,
              "collaboration": 12,
              "coordination": 12,
              "marketplace": 12,
              "economy": 12,
              "virtual economy": 14,
              "lightning": 8,
              "bitcoin": 8,
              "btc": 7,
              "reputation": 10,
              "trust": 10,
              "verification": 10,
              "research": 8,
              "api": 8,
              "automation": 8,
              "testing": 8,
              "data": 7,
              "analysis": 7,
              "cybersecurity": 10,
              "security": 9,
              "emerging technology": 8,
              "technology": 6,
              "law": 9,
              "regulation": 9,
              "regulatory": 9,
          }

          SUPPLY_STRONG_TERMS = [
              "for hire",
              "hire me",
              "my services",
              "i offer",
              "i provide",
              "i can help",
              "i can do",
              "available for work",
              "available to work",
              "available for hire",
              "open for work",
              "offering services",
              "service provider",
              "freelance services",
              "services available",
          ]

          DEMAND_STRONG_TERMS = [
              "paid task",
              "paid_task",
              "looking for",
              "looking to hire",
              "need someone",
              "need an agent",
              "need a worker",
              "worker needed",
              "seeking a worker",
              "seeking someone",
              "hire someone",
              "want someone to",
              "i need",
              "we need",
              "build this for me",
              "create this for me",
              "fix this for me",
              "research this for me",
          ]

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def text(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value).lower(),
              ).strip()

          def task_text(task):
              parts = []

              keys = (
                  "title",
                  "name",
                  "description",
                  "details",
                  "requirements",
                  "category",
                  "tags",
                  "skills",
                  "budget",
                  "reward",
                  "reward_sats",
                  "reward_usdc",
                  "reward_usd",
                  "price",
                  "post_type",
                  "type",
                  "kind",
                  "task_type",
                  "listing_type",
                  "marketplace_type",
              )

              for key in keys:
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(
                          str(item)
                          for item in value
                      )

                  elif isinstance(value, dict):
                      parts.append(
                          json.dumps(
                              value,
                              ensure_ascii=False,
                          )
                      )

                  elif value is not None:
                      parts.append(
                          str(value)
                      )

              return normalize(
                  " ".join(parts)
              )

          def blocked_term(value):
              lowered = normalize(value)

              for term in SAFETY_BLOCKED_TERMS:
                  if term in lowered:
                      return term

              return None

          def normalize_post_type(value):
              return re.sub(
                  r"[^a-z0-9_ -]+",
                  "",
                  normalize(value),
              ).strip()

          def classify_direction(task):
              """
              Determine marketplace direction.

              DEMAND:
                  The poster is seeking a worker / completed task.
                  NØX may potentially bid.

              SUPPLY:
                  The poster is offering their own services.
                  NØX must NEVER bid.

              UNKNOWN:
                  Direction is not sufficiently clear.
                  NØX must NOT bid.

              IMPORTANT:
                  Explicit "for hire" language has priority over
                  an inconsistent metadata value such as paid_task.
              """

              t = task_text(task)

              # --------------------------------------------------
              # STEP 1: strongest textual direction signals
              # --------------------------------------------------

              supply_hits = [
                  term
                  for term in SUPPLY_STRONG_TERMS
                  if term in t
              ]

              demand_hits = [
                  term
                  for term in DEMAND_STRONG_TERMS
                  if term in t
              ]

              # --------------------------------------------------
              # STEP 2: explicit "For hire" protection
              # --------------------------------------------------

              if "for hire" in t:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "VERY_HIGH",
                      "reason": (
                          "explicit_for_hire_language"
                      ),
                  }

              if "hire me" in t:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "VERY_HIGH",
                      "reason": (
                          "explicit_hire_me_language"
                      ),
                  }

              # --------------------------------------------------
              # STEP 3: other strong supply signals
              # --------------------------------------------------

              if supply_hits and not demand_hits:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "HIGH",
                      "reason": (
                          "supply_language:"
                          + ",".join(
                              supply_hits[:5]
                          )
                      ),
                  }

              # --------------------------------------------------
              # STEP 4: conflicting signals = UNKNOWN
              # --------------------------------------------------

              if supply_hits and demand_hits:
                  return {
                      "direction": "UNKNOWN",
                      "confidence": "LOW",
                      "reason": (
                          "conflicting_supply_and_demand_signals:"
                          + ",".join(
                              supply_hits[:5]
                          )
                          + "|"
                          + ",".join(
                              demand_hits[:5]
                          )
                      ),
                  }

              # --------------------------------------------------
              # STEP 5: explicit demand language
              # --------------------------------------------------

              if demand_hits:
                  return {
                      "direction": "DEMAND",
                      "confidence": "HIGH",
                      "reason": (
                          "demand_language:"
                          + ",".join(
                              demand_hits[:5]
                          )
                      ),
                  }

              # --------------------------------------------------
              # STEP 6: metadata
              # --------------------------------------------------

              explicit_values = []

              for key in (
                  "post_type",
                  "type",
                  "kind",
                  "task_type",
                  "listing_type",
                  "marketplace_type",
              ):
                  value = normalize_post_type(
                      task.get(key)
                  )

                  if value:
                      explicit_values.append(
                          (
                              key,
                              value,
                          )
                      )

              for key, value in explicit_values:
                  if value in (
                      "paid_task",
                      "paid task",
                      "task",
                      "job",
                      "demand",
                  ):
                      return {
                          "direction": "DEMAND",
                          "confidence": "MEDIUM",
                          "reason": (
                              f"explicit_{key}:{value}"
                          ),
                      }

                  if value in (
                      "for_hire",
                      "for hire",
                      "supply",
                      "service",
                      "services",
                      "offer",
                  ):
                      return {
                          "direction": "SUPPLY",
                          "confidence": "HIGH",
                          "reason": (
                              f"explicit_{key}:{value}"
                          ),
                      }

              # --------------------------------------------------
              # STEP 7: default safe state
              # --------------------------------------------------

              return {
                  "direction": "UNKNOWN",
                  "confidence": "LOW",
                  "reason": (
                      "no_clear_market_direction"
                  ),
              }

          def structured_sats(task):
              for key in (
                  "reward_sats",
                  "budget_sats",
                  "payment_sats",
                  "amount_sats",
                  "max_reward_sats",
              ):
                  value = task.get(key)

                  if isinstance(
                      value,
                      (int, float),
                  ):
                      if value >= 0:
                          return (
                              int(value),
                              "structured",
                          )

                  if isinstance(
                      value,
                      str,
                  ):
                      match = re.fullmatch(
                          r"\s*(\d+(?:\.\d+)?)"
                          r"\s*(?:sats?|sat)?\s*",
                          value,
                          re.I,
                      )

                      if match:
                          return (
                              int(
                                  float(
                                      match.group(1)
                                  )
                              ),
                              "structured_text",
                          )

              return None, None

          def explicit_sats(value):
              patterns = [
                  (
                      r"(?:reward|budget|payment|payout)"
                      r"\s*[:=]?\s*"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sats?|sat)\b"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:sats?|sat)\b"
                  ),
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      value,
                      re.I,
                  )

                  if match:
                      return (
                          int(
                              float(
                                  match.group(1)
                              )
                          ),
                          "text",
                      )

              return None, None

          def extract_reward(task):
              sats, source = structured_sats(
                  task
              )

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              t = task_text(task)

              sats, source = explicit_sats(t)

              if sats is not None:
                  return {
                      "sats": sats,
                      "currency": "SATS",
                      "source": source,
                      "usd": None,
                  }

              for key in (
                  "reward_usdc",
                  "budget_usdc",
                  "payment_usdc",
                  "amount_usdc",
                  "reward_usd",
                  "budget_usd",
                  "payment_usd",
                  "amount_usd",
              ):
                  value = task.get(key)

                  if isinstance(
                      value,
                      (int, float),
                  ):
                      if value > 0:
                          currency = (
                              "USDC"
                              if "usdc"
                              in key.lower()
                              else "USD"
                          )

                          return {
                              "sats": int(
                                  round(
                                      float(value)
                                      * FALLBACK_SATS_PER_USD
                                  )
                              ),
                              "currency": currency,
                              "source": (
                                  "structured_fx_estimate"
                              ),
                              "usd": float(value),
                          }

              patterns = [
                  (
                      r"(?:reward|budget|payment|payout|pay)"
                      r"[^\n$]{0,100}"
                      r"\$\s*"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(?:usdc|usd)?\b",
                      "USD",
                  ),
                  (
                      r"\$\s*"
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(USDC|USD)\b",
                      "USD",
                  ),
                  (
                      r"(\d+(?:\.\d+)?)"
                      r"\s*(USDC|USD)\b",
                      "USDC",
                  ),
              ]

              for pattern, default_currency in patterns:
                  match = re.search(
                      pattern,
                      t,
                      re.I,
                  )

                  if not match:
                      continue

                  amount = float(
                      match.group(1)
                  )

                  if amount <= 0:
                      continue

                  currency = (
                      default_currency
                  )

                  if (
                      len(match.groups())
                      >= 2
                      and match.group(2)
                  ):
                      currency = (
                          match.group(2).upper()
                      )

                  return {
                      "sats": int(
                          round(
                              amount
                              * FALLBACK_SATS_PER_USD
                          )
                      ),
                      "currency": currency,
                      "source": (
                          "text_fx_estimate"
                      ),
                      "usd": amount,
                  }

              return {
                  "sats": None,
                  "currency": None,
                  "source": None,
                  "usd": None,
              }

          def score_keywords(
              value,
              mapping,
          ):
              return min(
                  100,
                  sum(
                      points
                      for keyword, points
                      in mapping.items()
                      if keyword in value
                  ),
              )

          def domain_score(value):
              candidates = []

              if any(
                  item in value
                  for item in (
                      "sat",
                      "sats",
                      "bitcoin",
                      "btc",
                      "lightning",
                      "payment",
                      "marketplace",
                      "economy",
                      "reward",
                  )
              ):
                  candidates.append(
                      (
                          "virtual economy",
                          25,
                      )
                  )

              if any(
                  item in value
                  for item in (
                      "security",
                      "cybersecurity",
                      "audit",
                      "vulnerability",
                  )
              ):
                  candidates.append(
                      (
                          "cybersecurity",
                          20,
                      )
                  )

              if any(
                  item in value
                  for item in (
                      "ai community",
                      "ai communities",
                      "agent community",
                      "community",
                      "collaboration",
                      "coordination",
                  )
              ):
                  candidates.append(
                      (
                          "ai communities",
                          20,
                      )
                  )

              if any(
                  item in value
                  for item in (
                      "agent",
                      "autonomy",
                      "autonomous",
                      "reasoning",
                      "decision",
                  )
              ):
                  candidates.append(
                      (
                          "agent intelligence/autonomy",
                          20,
                      )
                  )

              if any(
                  item in value
                  for item in (
                      "technology",
                      "emerging tech",
                      "emerging technology",
                      "new technology",
                  )
              ):
                  candidates.append(
                      (
                          "emerging tech",
                          15,
                      )
                  )

              if not candidates:
                  return None, 0

              return max(
                  candidates,
                  key=lambda item: item[1],
              )

          def tip_score(value):
              high = (
                  "tip",
                  "tips",
                  "bonus",
                  "bounty",
                  "gratuity",
                  "reward for good work",
                  "extra sats",
              )

              medium = (
                  "appreciate",
                  "support",
                  "thank you",
                  "thanks",
                  "if useful",
                  "if helpful",
              )

              score = 0

              for item in high:
                  if item in value:
                      score += 5

              for item in medium:
                  if item in value:
                      score += 2

              return min(
                  15,
                  score,
              )

          def evaluate(task):
              t = task_text(task)

              direction = classify_direction(
                  task
              )

              reward = extract_reward(
                  task
              )

              capability = score_keywords(
                  t,
                  CAPABILITY_KEYWORDS,
              )

              learning = score_keywords(
                  t,
                  LEARNING_KEYWORDS,
              )

              domain, dscore = domain_score(
                  t
              )

              tips = tip_score(
                  t
              )

              bad = blocked_term(t)

              if bad:
                  return {
                      "decision": "reject",
                      "reason": (
                          f"blocked_term:{bad}"
                      ),
                      "direction": direction[
                          "direction"
                      ],
                      "direction_confidence": (
                          direction[
                              "confidence"
                          ]
                      ),
                      "direction_reason": (
                          direction[
                              "reason"
                          ]
                      ),
                      "capability": 0,
                      "learning": 0,
                      "domain_score": 0,
                      "tips": 0,
                      "domain": None,
                      "reward_sats": None,
                      "reward_currency": None,
                      "reward_source": None,
                      "usd": None,
                      "total": 0,
                  }

              # --------------------------------------------------
              # HARD SUPPLY PROTECTION
              # --------------------------------------------------

              if (
                  direction["direction"]
                  == "SUPPLY"
              ):
                  return {
                      "decision": (
                          "supply_no_bid"
                      ),
                      "reason": (
                          direction[
                              "reason"
                          ]
                      ),
                      "direction": "SUPPLY",
                      "direction_confidence": (
                          direction[
                              "confidence"
                          ]
                      ),
                      "direction_reason": (
                          direction[
                              "reason"
                          ]
                      ),
                      "capability": capability,
                      "learning": learning,
                      "domain_score": dscore,
                      "tips": tips,
                      "domain": domain,
                      "reward_sats": reward[
                          "sats"
                      ],
                      "reward_currency": reward[
                          "currency"
                      ],
                      "reward_source": reward[
                          "source"
                      ],
                      "usd": reward[
                          "usd"
                      ],
                      "total": 0,
                  }

              # --------------------------------------------------
              # HARD UNKNOWN PROTECTION
              # --------------------------------------------------

              if (
                  direction["direction"]
                  == "UNKNOWN"
              ):
                  return {
                      "decision": (
                          "unknown_direction_no_bid"
                      ),
                      "reason": (
                          direction[
                              "reason"
                          ]
                      ),
                      "direction": "UNKNOWN",
                      "direction_confidence": (
                          direction[
                              "confidence"
                          ]
                      ),
                      "direction_reason": (
                          direction[
                              "reason"
                          ]
                      ),
                      "capability": capability,
                      "learning": learning,
                      "domain_score": dscore,
                      "tips": tips,
                      "domain": domain,
                      "reward_sats": reward[
                          "sats"
                      ],
                      "reward_currency": reward[
                          "currency"
                      ],
                      "reward_source": reward[
                          "source"
                      ],
                      "usd": reward[
                          "usd"
                      ],
                      "total": 0,
                  }

              # --------------------------------------------------
              # DEMAND SCORING
              # --------------------------------------------------

              economic = 0

              if reward["sats"] is not None:
                  if reward["sats"] >= 10000:
                      economic = 25
                  elif reward["sats"] >= 1000:
                      economic = 20
                  elif reward["sats"] >= 100:
                      economic = 15
                  elif reward["sats"] > 0:
                      economic = 5

              total = min(
                  100,
                  int(
                      capability * 0.35
                      + learning * 0.20
                      + dscore * 0.20
                      + tips * 0.15
                      + economic * 0.10
                  ),
              )

              if reward["sats"] is None:
                  decision = (
                      "learning_candidate_unpaid"
                  )

              elif reward["sats"] <= 0:
                  decision = (
                      "learning_candidate_unpaid"
                  )

              else:
                  decision = (
                      "paid_bid_candidate"
                  )

              return {
                  "decision": decision,
                  "reason": (
                      "confirmed_demand_post"
                  ),
                  "direction": "DEMAND",
                  "direction_confidence": (
                      direction[
                          "confidence"
                      ]
                  ),
                  "direction_reason": (
                      direction[
                          "reason"
                      ]
                  ),
                  "capability": capability,
                  "learning": learning,
                  "domain_score": dscore,
                  "tips": tips,
                  "domain": domain,
                  "reward_sats": reward[
                      "sats"
                  ],
                  "reward_currency": reward[
                      "currency"
                  ],
                  "reward_source": reward[
                      "source"
                  ],
                  "usd": reward[
                      "usd"
                  ],
                  "total": total,
              }

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "schema_version": "7.3",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.3",
                      "updated_at": now_iso(),
                      "policy": {},
                      "actions": [],
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(
                      data,
                      dict,
                  ):
                      raise ValueError(
                          "memory root is not an object"
                      )

                  if not isinstance(
                      data.get("actions"),
                      list,
                  ):
                      data["actions"] = []

                  return data

              except Exception as exc:
                  print(
                      f"WARNING: memory read failed: {exc}"
                  )

                  return {
                      "schema_version": "7.3",
                      "agent": "NØX",
                      "workflow": "ACT15_V7.3",
                      "updated_at": now_iso(),
                      "policy": {},
                      "actions": [],
                  }

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              memory["actions"] = (
                  memory.get(
                      "actions",
                      [],
                  )[
                      -MAX_MEMORY_ACTIONS:
                  ]
              )

              memory["updated_at"] = now_iso()
              memory["schema_version"] = "7.3"
              memory["workflow"] = "ACT15_V7.3"

              memory.setdefault(
                  "policy",
                  {},
              )

              memory["policy"].update(
                  {
                      "market_direction_required": True,
                      "supply_posts_never_bid": True,
                      "unknown_direction_never_bid": True,
                      "for_hire_text_overrides_inconsistent_metadata": True,
                      "bid_amount_equals_advertised_reward": True,
                      "minimum_sats_for_opportunity": 0,
                      "minimum_sats_for_bid": 1,
                      "payments_disabled": True,
                      "gemini_disabled": True,
                      "workbuddy_scout_learning": True,
                  }
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def session_auth():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              session = requests.Session()

              response = session.post(
                  f"{BASE_URL}/auth/token",
                  json={
                      "api_key": API_KEY
                  },
                  timeout=20,
              )

              print(
                  f"AUTH TOKEN HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              token = (
                  data.get(
                      "access_token"
                  )
                  or data.get(
                      "token"
                  )
                  or data.get(
                      "jwt"
                  )
              )

              if not token:
                  raise RuntimeError(
                      "No JWT token returned"
                  )

              session.headers.update(
                  {
                      "Authorization": (
                          f"Bearer {token}"
                      ),
                      "Accept": (
                          "application/json"
                      ),
                      "Content-Type": (
                          "application/json"
                      ),
                  }
              )

              return session

          def identity(session):
              response = session.get(
                  f"{BASE_URL}/users/me",
                  timeout=20,
              )

              print(
                  f"/users/me HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              username = (
                  data.get("username")
                  or data.get("handle")
                  or data.get("name")
                  or "unknown"
              )

              karma = (
                  data.get("karma")
                  or data.get("score")
                  or 0
              )

              print(
                  f"Identity: @{username} | Karma: {karma}"
              )

              return data

          def get_tasks(session):
              response = session.get(
                  f"{BASE_URL}/marketplace/tasks",
                  params={
                      "limit": MAX_TASKS
                  },
                  timeout=30,
              )

              print(
                  f"/marketplace/tasks HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              if isinstance(
                  data,
                  list,
              ):
                  return data

              if isinstance(
                  data,
                  dict,
              ):
                  for key in (
                      "tasks",
                      "items",
                      "results",
                      "data",
                  ):
                      if isinstance(
                          data.get(key),
                          list,
                      ):
                          return data[key]

              return []

          def task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("_id")
              )

          def task_title(task):
              return text(
                  task.get("title")
                  or task.get("name")
                  or "Untitled marketplace task"
              )

          def task_status(task):
              return normalize(
                  task.get("status")
                  or task.get("state")
              )

          def get_bids(session, tid):
              try:
                  response = session.get(
                      f"{BASE_URL}/marketplace/{tid}/bids",
                      timeout=20,
                  )

                  print(
                      f"/bids {tid} HTTP {response.status_code}"
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  if isinstance(
                      data,
                      list,
                  ):
                      return data

                  if isinstance(
                      data,
                      dict,
                  ):
                      for key in (
                          "bids",
                          "items",
                          "results",
                          "data",
                      ):
                          if isinstance(
                              data.get(key),
                              list,
                          ):
                              return data[key]

              except Exception as exc:
                  print(
                      f"Bid lookup warning: {exc}"
                  )

              return None

          def our_bid(bid, ident):
              if not isinstance(
                  bid,
                  dict,
              ):
                  return False

              identity_id = (
                  ident.get("id")
                  or ident.get("user_id")
                  or ident.get("agent_id")
              )

              identity_name = (
                  ident.get("username")
                  or ident.get("handle")
                  or ident.get("name")
              )

              for key in (
                  "user_id",
                  "agent_id",
                  "owner_id",
                  "bidder_id",
              ):
                  if (
                      identity_id is not None
                      and bid.get(key)
                      == identity_id
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder",
                  "agent",
                  "user",
              ):
                  value = bid.get(key)

                  if isinstance(
                      value,
                      dict,
                  ):
                      value = (
                          value.get(
                              "username"
                          )
                          or value.get(
                              "handle"
                          )
                          or value.get(
                              "name"
                          )
                      )

                  if (
                      identity_name
                      and value
                      and normalize(value)
                      == normalize(
                          identity_name
                      )
                  ):
                      return True

              return False

          def bid_amount(
              reward_sats,
          ):
              """
              Marketplace evidence from ACT15 V7.2:
              the API requires the bid to be at least the
              advertised reward amount.

              Therefore:
                  reward 200  -> bid 200
                  reward 500  -> bid 500
                  reward 2000 -> bid 2000

              No arbitrary 20% reduction.
              """

              if (
                  reward_sats is None
                  or reward_sats
                  < MIN_BID_SATS
              ):
                  return None

              return int(
                  reward_sats
              )

          def submit_bid(
              session,
              tid,
              amount,
              task_title,
              score,
              currency,
          ):
              payload = {
                  "bid_amount_sats": amount,
                  "bid_description": (
                      f"NØX proposes {amount} sats "
                      "for this task. "
                      "The proposal reflects current "
                      f"capability fit and learning relevance "
                      f"(decision score {score}/100). "
                      "Detected reward currency: "
                      f"{currency or 'SATS'}."
                  ),
              }

              response = session.post(
                  f"{BASE_URL}/marketplace/{tid}/bid",
                  json=payload,
                  timeout=30,
              )

              print(
                  f"BID {tid} HTTP {response.status_code}"
              )

              try:
                  body = response.json()
              except Exception:
                  body = response.text[:1000]

              if response.status_code not in (
                  200,
                  201,
                  202,
              ):
                  print(
                      f"Bid rejected for {task_title}: "
                      f"{body}"
                  )

                  return {
                      "success": False,
                      "http_status": (
                          response.status_code
                      ),
                      "response": body,
                  }

              bid_id = None

              if isinstance(
                  body,
                  dict,
              ):
                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                      or (
                          body.get(
                              "bid",
                              {},
                          ).get("id")
                          if isinstance(
                              body.get("bid"),
                              dict,
                          )
                          else None
                      )
                  )

              print(
                  f"Bid submitted: {amount} sats"
                  + (
                      f" | bid_id={bid_id}"
                      if bid_id
                      else ""
                  )
              )

              return {
                  "success": True,
                  "http_status": (
                      response.status_code
                  ),
                  "response": body,
                  "bid_id": bid_id,
              }

          def main():
              print(
                  "=============================================="
              )
              print(
                  "NØX ACT15 V7.3 - AUTONOMOUS MARKETPLACE"
              )
              print(
                  "=============================================="
              )

              print(
                  f"Time: {now_iso()}"
              )

              print(
                  "Direction classifier: ENABLED"
              )

              print(
                  "FOR_HIRE hard protection: ENABLED"
              )

              print(
                  "UNKNOWN direction hard protection: ENABLED"
              )

              print(
                  "Bid amount = advertised reward: ENABLED"
              )

              print(
                  "Minimum opportunity value: 0 sats"
              )

              print(
                  "Payments/spending: DISABLED"
              )

              print(
                  "Gemini: DISABLED"
              )

              memory = load_memory()

              try:
                  session = session_auth()
                  ident = identity(
                      session
                  )
                  marketplace_tasks = (
                      get_tasks(session)
                  )

              except Exception as exc:
                  print(
                      f"FATAL ERROR: {exc}"
                  )
                  sys.exit(1)

              print(
                  "Marketplace tasks received: "
                  f"{len(marketplace_tasks)}"
              )

              summary = {
                  "tasks_seen": 0,
                  "open_tasks": 0,
                  "supply_posts": 0,
                  "unknown_direction": 0,
                  "blocked": 0,
                  "paid_candidates": 0,
                  "learning_candidates": 0,
                  "low_reward_candidates": 0,
                  "already_bid": 0,
                  "bids_submitted": 0,
                  "bid_errors": 0,
              }

              for task in marketplace_tasks:
                  if not isinstance(
                      task,
                      dict,
                  ):
                      continue

                  summary[
                      "tasks_seen"
                  ] += 1

                  tid = task_id(task)
                  tt = task_title(task)
                  st = task_status(task)

                  print(
                      "\n----------------------------------------------"
                  )

                  print(
                      f"TASK: {tt}\n"
                      f"ID: {tid}\n"
                      f"STATUS: {st or 'unknown'}"
                  )

                  if not tid:
                      print(
                          "Decision: SKIP - no task_id"
                      )
                      continue

                  if st not in (
                      "",
                      "open",
                      "bidding",
                  ):
                      print(
                          f"Decision: SKIP - status={st}"
                      )
                      continue

                  summary[
                      "open_tasks"
                  ] += 1

                  decision = evaluate(
                      task
                  )

                  print(
                      "Direction: "
                      f"{decision['direction']} "
                      f"({decision['direction_confidence']})"
                  )

                  print(
                      "Direction reason: "
                      f"{decision['direction_reason']}"
                  )

                  print(
                      "Scores: "
                      f"capability="
                      f"{decision['capability']} "
                      f"learning="
                      f"{decision['learning']} "
                      f"domain="
                      f"{decision['domain_score']} "
                      f"tips="
                      f"{decision['tips']} "
                      f"total="
                      f"{decision['total']}"
                  )

                  print(
                      "Domain: "
                      f"{decision['domain'] or 'general'}"
                  )

                  print(
                      "Reward: "
                      f"{decision['reward_sats']} sats | "
                      f"currency="
                      f"{decision['reward_currency']} | "
                      f"source="
                      f"{decision['reward_source']} | "
                      f"USD="
                      f"{decision['usd']}"
                  )

                  print(
                      "Decision: "
                      f"{decision['decision']}"
                  )

                  # --------------------------------------------
                  # SUPPLY / FOR-HIRE
                  # --------------------------------------------

                  if (
                      decision["decision"]
                      == "supply_no_bid"
                  ):
                      summary[
                          "supply_posts"
                      ] += 1

                      print(
                          "HARD BLOCK: NO BID - "
                          "SUPPLY/FOR_HIRE post."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_supply_post_blocked"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": "SUPPLY",
                              "direction_confidence": (
                                  decision[
                                      "direction_confidence"
                                  ]
                              ),
                              "direction_reason": (
                                  decision[
                                      "direction_reason"
                                  ]
                              ),
                              "reason": (
                                  "for_hire_supply_post"
                              ),
                              "bid_submitted": False,
                              "payments": "disabled",
                              "learning": (
                                  "WorkBuddy Scout "
                                  "direction_semantics"
                              ),
                          }
                      )

                      continue

                  # --------------------------------------------
                  # UNKNOWN
                  # --------------------------------------------

                  if (
                      decision["decision"]
                      == "unknown_direction_no_bid"
                  ):
                      summary[
                          "unknown_direction"
                      ] += 1

                      print(
                          "HARD BLOCK: NO BID - "
                          "market direction unknown."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_unknown_direction"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": "UNKNOWN",
                              "direction_confidence": (
                                  decision[
                                      "direction_confidence"
                                  ]
                              ),
                              "direction_reason": (
                                  decision[
                                      "direction_reason"
                                  ]
                              ),
                              "reason": (
                                  "ambiguous_market_direction"
                              ),
                              "bid_submitted": False,
                          }
                      )

                      continue

                  # --------------------------------------------
                  # SAFETY BLOCK
                  # --------------------------------------------

                  if (
                      decision["decision"]
                      == "reject"
                  ):
                      summary[
                          "blocked"
                      ] += 1

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": "rejected",
                              "task_id": tid,
                              "title": tt,
                              "reason": (
                                  decision[
                                      "reason"
                                  ]
                              ),
                              "status": "blocked",
                              "direction": (
                                  decision[
                                      "direction"
                                  ]
                              ),
                          }
                      )

                      continue

                  # --------------------------------------------
                  # FINAL DIRECTION GUARD
                  # --------------------------------------------

                  if (
                      decision["direction"]
                      != "DEMAND"
                  ):
                      summary[
                          "unknown_direction"
                      ] += 1

                      print(
                          "FINAL BID GUARD: BLOCKED."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_final_bid_guard_block"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "direction": (
                                  decision[
                                      "direction"
                                  ]
                              ),
                              "reason": (
                                  "bid_requires_confirmed_demand"
                              ),
                              "bid_submitted": False,
                          }
                      )

                      continue

                  # --------------------------------------------
                  # LEARNING CANDIDATE
                  # --------------------------------------------

                  if (
                      decision["decision"]
                      == "learning_candidate_unpaid"
                  ):
                      summary[
                          "learning_candidates"
                      ] += 1

                      print(
                          "Learning candidate recorded."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_learning_candidate"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "decision": (
                                  decision[
                                      "decision"
                                  ]
                              ),
                              "direction": "DEMAND",
                              "reward_sats": (
                                  decision[
                                      "reward_sats"
                                  ]
                              ),
                              "reward_currency": (
                                  decision[
                                      "reward_currency"
                                  ]
                              ),
                              "reward_source": (
                                  decision[
                                      "reward_source"
                                  ]
                              ),
                              "capability_score": (
                                  decision[
                                      "capability"
                                  ]
                              ),
                              "learning_score": (
                                  decision[
                                      "learning"
                                  ]
                              ),
                              "tip_score": (
                                  decision[
                                      "tips"
                                  ]
                              ),
                              "domain_score": (
                                  decision[
                                      "domain_score"
                                  ]
                              ),
                              "domain": (
                                  decision[
                                      "domain"
                                  ]
                              ),
                              "total_score": (
                                  decision[
                                      "total"
                                  ]
                              ),
                              "bid_submitted": False,
                              "payments": "disabled",
                          }
                      )

                      continue

                  # --------------------------------------------
                  # PAID DEMAND
                  # --------------------------------------------

                  summary[
                      "paid_candidates"
                  ] += 1

                  bids = get_bids(
                      session,
                      tid,
                  )

                  if bids is None:
                      print(
                          "Bid state unavailable; "
                          "no new bid submitted."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_check"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": (
                                  "bid_state_unknown"
                              ),
                              "decision": decision,
                              "bid_submitted": False,
                          }
                      )

                      continue

                  if any(
                      our_bid(
                          bid,
                          ident,
                      )
                      for bid in bids
                  ):
                      summary[
                          "already_bid"
                      ] += 1

                      print(
                          "Decision: SKIP - "
                          "NØX already has a bid."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_bid_check"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": "already_bid",
                              "direction": "DEMAND",
                              "bid_submitted": False,
                          }
                      )

                      continue

                  amount = bid_amount(
                      decision[
                          "reward_sats"
                      ]
                  )

                  if amount is None:
                      summary[
                          "learning_candidates"
                      ] += 1

                      print(
