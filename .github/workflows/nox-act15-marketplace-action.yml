                print(
                    "ACT15_RESULT: FAILED",
                    file=sys.stderr
                )
                print(
                    f"ERROR: {exc}",
                    file=sys.stderr
                )
                raise


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail

          echo "Python:"
          python --version

          echo "Gemini: false"
          echo "External AI: false"
          echo "Payments: false"
          echo "Spending: false"
          echo "Marketplace: true"
          echo "Real bids: true"
          echo "Cost: 0"

      - name: Install requests
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT15
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$ACT15_SCRIPT" > /tmp/act15.py

          test -s /tmp/act15.py

          echo "ACT15 script created:"
          wc -l /tmp/act15.py

          python /tmp/act15.py

      - name: Persist ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$MEMORY_FILE" ]; then
            echo "No memory file created."
            exit 0
          fi

          git config user.name "nox-origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MEMORY_FILE"

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "chore: persist ACT15 marketplace memory"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true

              git reset --mixed origin/main
              git add "$MEMORY_FILE"

              if git diff --cached --quiet; then
                echo "Changes already present after synchronization."
                exit 0
              fi

              git commit -m "chore: persist ACT15 marketplace memory"
            fi

            if git push origin HEAD:main; then
              echo "Memory push succeeded."
              exit 0
            fi

            sleep 2
          done

          echo "Unable to push ACT15 memory after 3 attempts."
          exit 1
