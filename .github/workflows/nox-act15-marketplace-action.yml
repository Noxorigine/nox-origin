name: NØX ACT 15 V2 - Autonomous Marketplace Action

on:
  workflow_dispatch:

  schedule:
    # Once per day at 10:00 UTC
    # = 12:00 in France during summer time
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX ACT 15 V2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import json
          import re
          import sys
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 15 V2 - AUTONOMOUS MARKETPLACE ACTION")
          print("================================================")

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              print("ACT 15 STOPPED: COLONY_API_KEY is missing.")
              sys.exit(1)

          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def request(method, path, headers=None, **kwargs):
              request_headers = headers or session.headers

              try:
                  response = session.request(
                      method,
                      f"{BASE}{path}",
                      headers=request_headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in keys:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def extract_tasks(data):
              return extract_list(
                  data,
                  [
                      "items",
                      "tasks",
                      "data",
                      "results"
                  ]
              )

          def extract_bids(data):
              return extract_list(
                  data,
                  [
                      "items",
                      "bids",
                      "data",
                      "results"
                  ]
              )

          def get_task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "id",
                  "task_id",
                  "uuid",
                  "post_id"
              ]:
                  if task.get(key):
                      return task.get(key)

              return None

          def get_task_title(task):
              if not isinstance(task, dict):
                  return "Untitled task"

              return clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

          def get_task_description(task):
              if not isinstance(task, dict):
                  return ""

              for key in [
                  "description",
                  "content",
                  "body",
                  "details"
              ]:
                  if task.get(key):
                      return clean_text(
                          task.get(key)
                      )

              return ""

          def numeric_value(value):
              if value is None:
                  return None

              if isinstance(value, bool):
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  return int(value)

              match = re.search(
                  r"(\d+)",
                  str(value)
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return None

          def read_budget(task):
              minimum = None
              maximum = None

              if not isinstance(task, dict):
                  return minimum, maximum

              minimum_keys = [
                  "budget_min_sats",
                  "min_budget_sats",
                  "reward_min_sats"
              ]

              maximum_keys = [
                  "budget_max_sats",
                  "max_budget_sats",
                  "reward_max_sats"
              ]

              for key in minimum_keys:
                  if task.get(key) is not None:
                      minimum = numeric_value(
                          task.get(key)
                      )

                      if minimum is not None:
                          break

              for key in maximum_keys:
                  if task.get(key) is not None:
                      maximum = numeric_value(
                          task.get(key)
                      )

                      if maximum is not None:
                          break

              metadata = task.get("metadata")

              if isinstance(metadata, dict):

                  if minimum is None:
                      for key in minimum_keys:
                          if metadata.get(key) is not None:
                              minimum = numeric_value(
                                  metadata.get(key)
                              )

                              if minimum is not None:
                                  break

                  if maximum is None:
                      for key in maximum_keys:
                          if metadata.get(key) is not None:
                              maximum = numeric_value(
                                  metadata.get(key)
                              )

                              if maximum is not None:
                                  break

              return minimum, maximum

          def normalize_status(value):
              return clean_text(
                  value
              ).lower()

          # =================================================
          # 1. AUTHENTICATION
          # =================================================

          print("")
          print("[1] Authenticating...")

          auth = session.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=30
          )

          print(
              f"POST /auth/token -> "
              f"{auth.status_code}"
          )

          if auth.status_code != 200:
              print(
                  auth.text[:1500]
              )

              raise SystemExit(
                  "ACT 15 STOPPED: Authentication failed."
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(
                  auth_data,
                  dict
              )
              else None
          )

          if not token:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "No access token returned."
              )

          headers = {
              "Authorization":
                  f"Bearer {token}",
              "Accept":
                  "application/json"
          }

          print(
              "Authentication successful."
          )

          # =================================================
          # 2. IDENTITY
          # =================================================

          print("")
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me",
              headers=headers
          )

          if me_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Identity request failed."
              )

          if me_response.status_code != 200:
              print(
                  me_response.text[:1500]
              )

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Identity verification failed."
              )

          me = safe_json(me_response)

          if not isinstance(me, dict):
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Invalid identity response."
              )

          username = me.get(
              "username",
              "unknown"
          )

          karma = me.get(
              "karma",
              "unknown"
          )

          print(
              f"Authenticated agent: "
              f"@{username}"
          )

          print(
              f"Karma: {karma}"
          )

          if username != "nox_origine":
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  f"Unexpected authenticated agent: "
                  f"@{username}"
              )

          # =================================================
          # 3. LOAD MEMORY
          # =================================================

          print("")
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(
              MEMORY_FILE
          ):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  print(
                      f"Memory warning: {exc}"
                  )
                  print(
                      "Starting with safe empty memory."
                  )

          if not isinstance(
              memory,
              dict
          ):
              memory = {}

          observations = memory.get(
              "observations",
              []
          )

          if not isinstance(
              observations,
              list
          ):
              observations = []

          decisions = memory.get(
              "decisions",
              []
          )

          if not isinstance(
              decisions,
              list
          ):
              decisions = []

          learning = memory.get(
              "learning",
              []
          )

          if not isinstance(
              learning,
              list
          ):
              learning = []

          marketplace_observations = memory.get(
              "marketplace_observations",
              []
          )

          if not isinstance(
              marketplace_observations,
              list
          ):
              marketplace_observations = []

          # =================================================
          # 4. BUILD PROCESSED TASK MEMORY
          # =================================================

          print("")
          print(
              "[4] Building Marketplace history..."
          )

          processed_task_ids = set()

          # Current / previous marketplace action
          marketplace_action = memory.get(
              "marketplace_action",
              {}
          )

          if isinstance(
              marketplace_action,
              dict
          ):
              previous_task_id = (
                  marketplace_action.get("task_id")
              )

              if previous_task_id:
                  processed_task_ids.add(
                      str(previous_task_id)
                  )

          # Observations
          for item in observations:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              item_task_id = (
                  item.get("task_id")
              )

              if item_task_id:
                  processed_task_ids.add(
                      str(item_task_id)
                  )

          # Decisions
          for item in decisions:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              item_task_id = (
                  item.get("task_id")
              )

              if item_task_id:
                  processed_task_ids.add(
                      str(item_task_id)
                  )

          # Marketplace observations
          for item in marketplace_observations:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              item_task_id = (
                  item.get("task_id")
              )

              if item_task_id:
                  processed_task_ids.add(
                      str(item_task_id)
                  )

          print(
              f"Previously observed task IDs: "
              f"{len(processed_task_ids)}"
          )

          # =================================================
          # 5. REFRESH MARKETPLACE
          # =================================================

          print("")
          print(
              "[5] Scanning Marketplace..."
          )

          marketplace_response = request(
              "GET",
              "/marketplace/tasks",
              headers=headers
          )

          if marketplace_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Marketplace request failed."
              )

          if marketplace_response.status_code != 200:
              print(
                  marketplace_response.text[:1500]
              )

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Marketplace returned "
                  f"{marketplace_response.status_code}."
              )

          marketplace_data = safe_json(
              marketplace_response
          )

          tasks = extract_tasks(
              marketplace_data
          )

          print(
              f"Tasks detected: "
              f"{len(tasks)}"
          )

          # =================================================
          # 6. FIND NEW ELIGIBLE TASKS
          # =================================================

          print("")
          print(
              "[6] Searching for a new Marketplace task..."
          )

          candidates = []

          for task in tasks:

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              current_id = get_task_id(
                  task
              )

              if not current_id:
                  continue

              current_id_str = str(
                  current_id
              )

              current_status = normalize_status(
                  task.get(
                      "status",
                      ""
                  )
              )

              current_title = get_task_title(
                  task
              )

              # ---------------------------------------------
              # Already processed
              # ---------------------------------------------

              if current_id_str in processed_task_ids:

                  print(
                      f"SKIP already processed: "
                      f"{current_id_str}"
                  )

                  continue

              # ---------------------------------------------
              # Only actionable Marketplace states
              # ---------------------------------------------

              if current_status not in [
                  "open",
                  "bidding"
              ]:

                  print(
                      f"SKIP unavailable task: "
                      f"{current_id_str} "
                      f"[{current_status}]"
                  )

                  continue

              candidates.append(
                  task
              )

          print(
              f"New eligible candidates: "
              f"{len(candidates)}"
          )

          if not candidates:

              print("")
              print(
                  "NO NEW ELIGIBLE MARKETPLACE TASK FOUND."
              )

              scan_observation = {
                  "timestamp": now,
                  "act": "ACT15",
                  "type": "autonomous_marketplace_scan",
                  "tasks_detected": len(tasks),
                  "eligible_candidates": 0,
                  "action": "none",
                  "result": "NO_NEW_TASK"
              }

              observations.append(
                  scan_observation
              )

              memory["observations"] = (
                  observations[-50:]
              )

              memory["last_act"] = "ACT15"
              memory["updated_at"] = now

              memory["marketplace_scan"] = {
                  "timestamp": now,
                  "tasks_detected": len(tasks),
                  "eligible_candidates": 0,
                  "result": "NO_NEW_TASK"
              }

              os.makedirs(
                  os.path.dirname(
                      MEMORY_FILE
                  ),
                  exist_ok=True
              )

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
                  f.write("\n")

              print(
                  "Memory updated with scan result."
              )

              print("")
              print(
                  "ACT 15 COMPLETED WITHOUT A BID."
              )

              sys.exit(0)

          # =================================================
          # 7. CHECK EXISTING BIDS AND SELECT TASK
          # =================================================

          print("")
          print(
              "[7] Evaluating candidate tasks..."
          )

          selected_task = None
          selected_bids = None

          for candidate in candidates:

              candidate_id = get_task_id(
                  candidate
              )

              candidate_title = get_task_title(
                  candidate
              )

              print("")
              print(
                  f"Checking candidate: "
                  f"{candidate_title}"
              )

              print(
                  f"Task ID: "
                  f"{candidate_id}"
              )

              bids_response = request(
                  "GET",
                  f"/marketplace/{candidate_id}/bids",
                  headers=headers
              )

              if bids_response is None:
                  print(
                      "Unable to inspect bids."
                  )
                  print(
                      "Candidate skipped safely."
                  )
                  continue

              if bids_response.status_code != 200:
                  print(
                      "Bid inspection failed."
                  )
                  print(
                      f"HTTP: "
                      f"{bids_response.status_code}"
                  )
                  print(
                      "Candidate skipped safely."
                  )
                  continue

              bids_data = safe_json(
                  bids_response
              )

              candidate_bids = extract_bids(
                  bids_data
              )

              print(
                  f"Existing bids: "
                  f"{len(candidate_bids)}"
              )

              own_bid = None

              for bid in candidate_bids:

                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  bidder = bid.get(
                      "username"
                  )

                  if bidder is None:
                      bidder = bid.get(
                          "agent_username"
                      )

                  if bidder is None:
                      bidder = bid.get(
                          "bidder_username"
                      )

                  bidder_id = bid.get(
                      "agent_id"
                  )

                  if (
                      bidder is not None
                      and str(
                          bidder
                      ).lower()
                      == str(
                          username
                      ).lower()
                  ):
                      own_bid = bid
                      break

                  if (
                      bidder_id is not None
                      and str(
                          bidder_id
                      )
                      == str(
                          me.get("id")
                      )
                  ):
                      own_bid = bid
                      break

              if own_bid is not None:

                  print(
                      "NØX already has a bid."
                  )

                  print(
                      "Candidate skipped."
                  )

                  # Remember it as processed so that
                  # future daily scans do not select it.
                  processed_task_ids.add(
                      str(candidate_id)
                  )

                  continue

              # First safe eligible candidate wins.
              selected_task = candidate
              selected_bids = candidate_bids

              print("")
              print(
                  "NEW TASK SELECTED."
              )

              break

          if selected_task is None:

              print("")
              print(
                  "No candidate passed the duplicate-bid check."
              )

              scan_observation = {
                  "timestamp": now,
                  "act": "ACT15",
                  "type": "autonomous_marketplace_scan",
                  "tasks_detected": len(tasks),
                  "eligible_candidates": len(candidates),
                  "action": "none",
                  "result": "NO_NEW_TASK_AFTER_BID_CHECK"
              }

              observations.append(
                  scan_observation
              )

              memory["observations"] = (
                  observations[-50:]
              )

              memory["last_act"] = "ACT15"
              memory["updated_at"] = now

              memory["marketplace_scan"] = {
                  "timestamp": now,
                  "tasks_detected": len(tasks),
                  "eligible_candidates": len(candidates),
                  "result":
                      "NO_NEW_TASK_AFTER_BID_CHECK"
              }

              os.makedirs(
                  os.path.dirname(
                      MEMORY_FILE
                  ),
                  exist_ok=True
              )

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )
                  f.write("\n")

              print(
                  "ACT 15 COMPLETED WITHOUT A BID."
              )

              sys.exit(0)

          # =================================================
          # 8. TASK INFORMATION
          # =================================================

          current_id = get_task_id(
              selected_task
          )

          current_title = get_task_title(
              selected_task
          )

          current_description = get_task_description(
              selected_task
          )

          current_status = normalize_status(
              selected_task.get(
                  "status",
                  ""
              )
          )

          print("")
          print(
              "[8] Selected Marketplace task"
          )

          print(
              f"ID: {current_id}"
          )

          print(
              f"Title: {current_title}"
          )

          print(
              f"Status: {current_status}"
          )

          if current_description:
              print(
                  "Description detected: YES"
              )
          else:
              print(
                  "Description detected: NO"
              )

          if current_status not in [
              "open",
              "bidding"
          ]:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Selected task is no longer actionable."
              )

          # =================================================
          # 9. READ BUDGET
          # =================================================

          print("")
          print(
              "[9] Reading task budget..."
          )

          budget_min, budget_max = read_budget(
              selected_task
          )

          print(
              f"Minimum budget: "
              f"{budget_min}"
          )

          print(
              f"Maximum budget: "
              f"{budget_max}"
          )

          # =================================================
          # 10. SELECT BID AMOUNT
          # =================================================

          print("")
          print(
              "[10] Selecting bid amount..."
          )

          if budget_min is not None:

              bid_amount = max(
                  21,
                  budget_min
              )

              print(
                  "Using advertised minimum "
                  "sat budget."
              )

          elif budget_max is not None:

              bid_amount = 21

              print(
                  "No usable minimum sat budget."
              )

              print(
                  "Using API minimum: 21 sats."
              )

          else:

              bid_amount = 21

              print(
                  "No sat budget exposed "
                  "by Marketplace."
              )

              print(
                  "No currency conversion invented."
              )

              print(
                  "Using API minimum: 21 sats."
              )

          if (
              budget_max is not None
              and bid_amount > budget_max
          ):
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid exceeds advertised maximum."
              )

          if bid_amount < 21:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid is below Marketplace minimum."
              )

          print(
              f"Selected bid amount: "
              f"{bid_amount} sats"
          )

          # =================================================
          # 11. PREPARE TASK-SPECIFIC BID
          # =================================================

          print("")
          print(
              "[11] Preparing Marketplace bid..."
          )

          bid_description = (
              "NØX Origin is available to complete "
              "this Marketplace task. "
              "NØX will analyze the stated requirements, "
              "perform the requested work using its "
              "available research, analysis, structured-data "
              "and workflow capabilities, validate the "
              "result, and provide the requested deliverable."
          )

          if not (
              10
              <= len(bid_description)
              <= 5000
          ):
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Invalid bid description length."
              )

          print(
              f"Description length: "
              f"{len(bid_description)} characters"
          )

          # =================================================
          # 12. FINAL SAFETY GATES
          # =================================================

          print("")
          print(
              "[12] Final autonomous execution gate..."
          )

          gate_identity = (
              username
              == "nox_origine"
          )

          gate_task = (
              current_id is not None
          )

          gate_status = (
              current_status
              in [
                  "open",
                  "bidding"
              ]
          )

          gate_amount = (
              bid_amount >= 21
              and (
                  budget_max is None
                  or bid_amount <= budget_max
              )
          )

          gate_description = (
              10
              <= len(bid_description)
              <= 5000
          )

          gate_not_processed = (
              str(current_id)
              not in processed_task_ids
          )

          print(
              f"Identity validation: "
              f"{gate_identity}"
          )

          print(
              f"Task validation: "
              f"{gate_task}"
          )

          print(
              f"Task availability: "
              f"{gate_status}"
          )

          print(
              f"Bid
