name: NØX ACT 15 V9 - Autonomous Marketplace Brain

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  marketplace:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"

      MIN_BID_SATS: "21"
      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE_ACTIONS: "30"
      MAX_MEMORY_ACTIONS: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Run ACT15 V9
        run: |
          set -euo pipefail

          mkdir -p memory

          cat > /tmp/act15_v9.py <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          import requests


          BASE_URL = os.getenv(
              "COLONY_BASE_URL",
              "https://thecolony.ai"
          ).rstrip("/")

          API_KEY = os.getenv("COLONY_API_KEY", "").strip()

          GEMINI_ENABLED = os.getenv(
              "GEMINI_ENABLED", "false"
          ).lower() == "true"

          EXTERNAL_AI_ENABLED = os.getenv(
              "EXTERNAL_AI_ENABLED", "false"
          ).lower() == "true"

          PAYMENTS_ENABLED = os.getenv(
              "PAYMENTS_ENABLED", "false"
          ).lower() == "true"

          SPENDING_ENABLED = os.getenv(
              "SPENDING_ENABLED", "false"
          ).lower() == "true"

          MIN_BID_SATS = int(
              os.getenv("MIN_BID_SATS", "21")
          )

          MAX_TASKS = int(
              os.getenv("MAX_TASKS", "100")
          )

          MAX_BIDS_PER_RUN = int(
              os.getenv("MAX_BIDS_PER_RUN", "2")
          )

          MAX_RECONCILE_ACTIONS = int(
              os.getenv("MAX_RECONCILE_ACTIONS", "30")
          )

          MAX_MEMORY_ACTIONS = int(
              os.getenv("MAX_MEMORY_ACTIONS", "1000")
          )

          MEMORY_FILE = (
              "memory/nox_act_15_marketplace.json"
          )


          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def normalize_text(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  try:
                      value = json.dumps(
                          value,
                          ensure_ascii=False,
                          sort_keys=True
                      )
                  except Exception:
                      value = str(value)

              return str(value).strip().lower()


          def clean_space(text):
              return re.sub(
                  r"\s+",
                  " ",
                  normalize_text(text)
              ).strip()


          def phrase_in_text(phrase, text):
              phrase = clean_space(phrase)
              text = clean_space(text)

              if not phrase or not text:
                  return False

              pattern = (
                  r"(?<![\w])"
                  + re.escape(phrase)
                  + r"(?![\w])"
              )

              return bool(
                  re.search(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  )
              )


          def phrase_hits(phrases, text):
              return [
                  phrase
                  for phrase in phrases
                  if phrase_in_text(
                      phrase,
                      text
                  )
              ]


          def first_value(obj, keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  value = obj.get(key)

                  if value not in (None, ""):
                      return value

              return None


          def get_task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "id",
                  "task_id",
                  "taskId",
                  "uuid",
                  "post_id",
                  "postId",
              ]:
                  value = task.get(key)

                  if value:
                      return str(value)

              return None


          def get_title(task):
              if not isinstance(task, dict):
                  return ""

              for key in [
                  "title",
                  "name",
                  "subject",
                  "headline",
              ]:
                  value = task.get(key)

                  if value:
                      return str(value)

              return ""


          def get_description(task):
              if not isinstance(task, dict):
                  return ""

              values = []

              for key in [
                  "description",
                  "body",
                  "content",
                  "details",
                  "task_description",
                  "taskDescription",
                  "requirements",
                  "request",
              ]:
                  value = task.get(key)

                  if value:
                      if isinstance(value, (dict, list)):
                          try:
                              value = json.dumps(
                                  value,
                                  ensure_ascii=False
                              )
                          except Exception:
                              value = str(value)

                      values.append(str(value))

              return " ".join(values)


          def get_category(task):
              value = first_value(
                  task,
                  [
                      "category",
                      "type",
                      "task_type",
                      "taskType",
                      "post_type",
                      "postType",
                  ]
              )

              return normalize_text(value)


          SUPPLY_PHRASES = [
              "for hire",
              "hire me",
              "my services",
              "i offer",
              "i provide",
              "i can help",
              "i can do",
              "available for work",
              "available to work",
              "available for hire",
              "open for work",
              "offering services",
              "freelance services",
              "services available",
              "my rate",
              "my rates",
              "price:",
              "price -",
              "price —",
              "per order",
              "fixed-rate",
              "fixed rate",
          ]


          SUPPLY_METADATA_KEYS = {
              "seller",
              "provider",
              "service_provider",
              "serviceProvider",
              "offerer",
              "author_offering",
          }


          DEMAND_METADATA_KEYS = {
              "buyer",
              "requester",
              "requester_id",
              "client",
              "customer",
          }


          DEMAND_PHRASES = [
              "looking for",
              "need someone",
              "need a",
              "need an",
              "seeking",
              "wanted",
              "we need",
              "i need someone",
              "i need help",
              "can someone",
              "who can",
              "requesting",
              "help wanted",
              "paid task",
              "bounty",
              "task for",
              "looking to hire",
              "hire someone",
          ]


          def classify_direction(task):
              title = get_title(task)
              description = get_description(task)
              category = get_category(task)

              core_text = clean_space(
                  " ".join([
                      title,
                      description,
                  ])
              )

              supply_hits = phrase_hits(
                  SUPPLY_PHRASES,
                  core_text
              )

              demand_hits = phrase_hits(
                  DEMAND_PHRASES,
                  core_text
              )

              if category in {
                  "paid_task",
                  "paid task",
                  "bounty",
                  "task",
              }:
                  demand_hits.append(
                      f"metadata:{category}"
                  )

              if phrase_in_text(
                  "for hire",
                  title
              ):
                  return {
                      "direction": "SUPPLY",
                      "confidence": "VERY_HIGH",
                      "signals": [
                          "title:for hire"
                      ],
                      "reason": "explicit_supply_title",
                  }

              if supply_hits and not demand_hits:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "HIGH",
                      "signals": supply_hits[:8],
                      "reason": "supply_language",
                  }

              if demand_hits and not supply_hits:
                  return {
                      "direction": "DEMAND",
                      "confidence": "HIGH",
                      "signals": demand_hits[:8],
                      "reason": "demand_language",
                  }

              if supply_hits and demand_hits:
                  return {
                      "direction": "UNKNOWN_DIRECTION",
                      "confidence": "LOW",
                      "signals": (
                          supply_hits[:4]
                          + demand_hits[:4]
                      ),
                      "reason": "conflicting_signals",
                  }

              supply_metadata = []
              demand_metadata = []

              if isinstance(task, dict):
                  for key in SUPPLY_METADATA_KEYS:
                      if task.get(key):
                          supply_metadata.append(key)

                  for key in DEMAND_METADATA_KEYS:
                      if task.get(key):
                          demand_metadata.append(key)

              if demand_metadata and not supply_metadata:
                  return {
                      "direction": "DEMAND",
                      "confidence": "MEDIUM",
                      "signals": demand_metadata,
                      "reason": "demand_metadata",
                  }

              if supply_metadata and not demand_metadata:
                  return {
                      "direction": "SUPPLY",
                      "confidence": "MEDIUM",
                      "signals": supply_metadata,
                      "reason": "supply_metadata",
                  }

              reward_hint = any(
                  phrase_in_text(
                      phrase,
                      core_text
                  )
                  for phrase in [
                      "reward",
                      "sats",
                      "satoshis",
                      "paid task",
                      "bounty",
                  ]
              )

              if reward_hint:
                  return {
                      "direction": "DEMAND",
                      "confidence": "LOW",
                      "signals": [
                          "reward_signal"
                      ],
                      "reason": (
                          "reward_without_"
                          "supply_language"
                      ),
                  }

              return {
                  "direction": "UNKNOWN_DIRECTION",
                  "confidence": "LOW",
                  "signals": [],
                  "reason": "no_clear_market_direction",
              }


          def parse_number(value):
              if value is None:
                  return None

              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  return float(value)

              text = str(value).strip()
              text = text.replace(",", "")

              match = re.search(
                  r"-?\d+(?:\.\d+)?",
                  text
              )

              if not match:
                  return None

              try:
                  return float(
                      match.group(0)
                  )
              except Exception:
                  return None


          def parse_reward_range(task):
              if not isinstance(task, dict):
                  return {
                      "min": None,
                      "max": None,
                      "source": None,
                  }

              range_pairs = [
                  (
                      "min_reward_sats",
                      "max_reward_sats",
                  ),
                  (
                      "minRewardSats",
                      "maxRewardSats",
                  ),
                  (
                      "min_sats",
                      "max_sats",
                  ),
                  (
                      "minSats",
                      "maxSats",
                  ),
                  (
                      "budget_min_sats",
                      "budget_max_sats",
                  ),
                  (
                      "budgetMinSats",
                      "budgetMaxSats",
                  ),
                  (
                      "reward_min_sats",
                      "reward_max_sats",
                  ),
                  (
                      "rewardMinSats",
                      "rewardMaxSats",
                  ),
              ]

              for min_key, max_key in range_pairs:
                  low = parse_number(
                      task.get(min_key)
                  )

                  high = parse_number(
                      task.get(max_key)
                  )

                  if low is not None or high is not None:
                      if low is None:
                          low = high

                      if high is None:
                          high = low

                      return {
                          "min": max(
                              0,
                              int(low)
                          ),
                          "max": max(
                              0,
                              int(high)
                          ),
                          "source": (
                              f"structured:"
                              f"{min_key}/"
                              f"{max_key}"
                          ),
                      }

              for key in [
                  "reward_sats",
                  "rewardSats",
                  "sats",
                  "sat",
                  "amount_sats",
                  "amountSats",
                  "payment_sats",
                  "paymentSats",
                  "budget_sats",
                  "budgetSats",
              ]:
                  value = parse_number(
                      task.get(key)
                  )

                  if value is not None and value >= 0:
                      amount = int(value)

                      return {
                          "min": amount,
                          "max": amount,
                          "source": (
                              f"structured:{key}"
                          ),
                      }

              text = clean_space(
                  " ".join([
                      get_title(task),
                      get_description(task),
                  ])
              )

              patterns = [
                  (
                      r"(\d[\d\s,]*)"
                      r"\s*[-–—]\s*"
                      r"(\d[\d\s,]*)"
                      r"\s*sats?\b"
                  ),
                  (
                      r"(\d[\d\s,]*)"
                      r"\s*to\s*"
                      r"(\d[\d\s,]*)"
                      r"\s*sats?\b"
                  ),
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  )

                  if match:
                      try:
                          low = int(
                              match.group(1)
                              .replace(" ", "")
                              .replace(",", "")
                          )

                          high = int(
                              match.group(2)
                              .replace(" ", "")
                              .replace(",", "")
                          )

                          return {
                              "min": min(
                                  low,
                                  high
                              ),
                              "max": max(
                                  low,
                                  high
                              ),
                              "source": "text:sat_range",
                          }

                      except Exception:
                          pass

              match = re.search(
                  r"(\d[\d\s,]*)\s*sats?\b",
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  try:
                      amount = int(
                          match.group(1)
                          .replace(" ", "")
                          .replace(",", "")
                      )

                      return {
                          "min": amount,
                          "max": amount,
                          "source": "text:sats",
                      }

                  except Exception:
                      pass

              return {
                  "min": None,
                  "max": None,
                  "source": None,
              }


          SAFETY_BLOCKED_TERMS = [
              "illegal",
              "malware",
              "ransomware",
              "credential theft",
              "phishing",
              "stolen credentials",
              "exploit",
              "weapon",
              "weapons",
              "drug trafficking",
              "money laundering",
              "fraud",
          ]


          def safety_hits(task):
              text = clean_space(
                  " ".join([
                      get_title(task),
                      get_description(task),
                  ])
              )

              return phrase_hits(
                  SAFETY_BLOCKED_TERMS,
                  text
              )


          # IMPORTANT:
          # Capability terms are divided into STRONG and WEAK
          # signals. Weak generic words can never create a bid
          # by themselves.
          STRONG_CAPABILITIES = {
              "api": [
                  "rest api",
                  "restful api",
                  "api integration",
                  "api endpoint",
                  "api endpoints",
                  "api development",
                  "api testing",
                  "api client",
                  "webhook",
                  "webhooks",
                  "json api",
              ],
              "python": [
                  "python",
                  "python script",
                  "python development",
                  "python programming",
                  "python code",
              ],
              "coding": [
                  "software development",
                  "software developer",
                  "write code",
                  "coding task",
                  "code implementation",
                  "implement a function",
                  "implement a feature",
                  "debug code",
                  "fix code",
                  "programming task",
                  "develop a script",
              ],
              "testing": [
                  "automated testing",
                  "automation testing",
                  "software testing",
                  "api testing",
                  "test automation",
                  "qa testing",
                  "quality assurance",
                  "regression testing",
                  "smoke testing",
              ],
              "research": [
                  "research report",
                  "research task",
                  "market research",
                  "technical research",
                  "web research",
                  "competitive research",
                  "fact checking",
                  "fact-checking",
                  "source verification",
              ],
              "data": [
                  "data analysis",
                  "data cleaning",
                  "data processing",
                  "dataset analysis",
                  "data extraction",
                  "data collection",
                  "structured data",
                  "csv processing",
              ],
              "documentation": [
                  "technical documentation",
                  "api documentation",
                  "documentation task",
                  "write documentation",
                  "documentation update",
                  "technical report",
                  "write a report",
              ],
              "github": [
                  "github repository",
                  "github repo",
                  "github actions",
                  "github workflow",
                  "pull request",
                  "github issue",
                  "repository changes",
              ],
          }


          WEAK_CAPABILITIES = {
              "coding": [
                  "script",
                  "scripts",
                  "automation",
                  "automate",
                  "tool",
                  "tools",
              ],
              "research": [
                  "research",
                  "investigate",
                  "analysis",
                  "analyze",
              ],
              "documentation": [
                  "document",
                  "documentation",
                  "report",
                  "write-up",
              ],
              "data": [
                  "data",
                  "dataset",
                  "information",
              ],
              "agents": [
                  "agent",
                  "agents",
                  "ai agent",
                  "ai agents",
                  "autonomous agent",
                  "automation agent",
              ],
          }


          def explicit_task_request_text(task):
              title = clean_space(
                  get_title(task)
              )

              description = clean_space(
                  get_description(task)
              )

              return clean_space(
                  " ".join([
                      title,
                      description,
                  ])
              )


          def capability_analysis(task):
              text = explicit_task_request_text(
                  task
              )

              strong_groups = {}
              weak_groups = {}

              for group, terms in STRONG_CAPABILITIES.items():
                  hits = phrase_hits(
                      terms,
                      text
                  )

                  if hits:
                      strong_groups[group] = hits[:6]

              for group, terms in WEAK_CAPABILITIES.items():
                  hits = phrase_hits(
                      terms,
                      text
                  )

                  if hits:
                      weak_groups[group] = hits[:6]

              # Remove weak matches for groups already supported
              # by strong evidence. They add noise, not confidence.
              for group in list(weak_groups):
                  if group in strong_groups:
                      del weak_groups[group]

              # "sats", "lightning", "agent" etc. are contextual
              # signals and never count as operational capability.
              operational_strong = set(
                  strong_groups.keys()
              ).intersection({
                  "api",
                  "python",
                  "coding",
                  "testing",
                  "research",
                  "data",
                  "documentation",
                  "github",
              })

              operational_weak = set(
                  weak_groups.keys()
              ).intersection({
                  "coding",
                  "research",
                  "documentation",
                  "data",
              })

              # A weak capability is useful only when supported
              # by a second coherent signal.
              weak_fit = (
                  len(operational_weak) >= 2
              )

              strong_fit = (
                  len(operational_strong) >= 1
              )

              actionable_fit = (
                  strong_fit
                  or weak_fit
              )

              return {
                  "strong_groups": strong_groups,
                  "weak_groups": weak_groups,
                  "strong_count": len(
                      operational_strong
                  ),
                  "weak_count": len(
                      operational_weak
                  ),
                  "actionable_fit": actionable_fit,
                  "terms": (
                      [
                          term
                          for hits in strong_groups.values()
                          for term in hits
                      ][:8]
                      +
                      [
                          term
                          for hits in weak_groups.values()
                          for term in hits
                      ][:4]
                  ),
              }


          def complexity_flags(task):
              text = explicit_task_request_text(
                  task
              )

              flags = []

              for phrase in [
                  "24/7",
                  "real-time",
                  "realtime",
                  "production",
                  "enterprise",
                  "large scale",
                  "large-scale",
                  "ongoing",
                  "long term",
                  "long-term",
                  "multiple agents",
                  "full implementation",
                  "end to end",
                  "end-to-end",
              ]:
                  if phrase_in_text(
                      phrase,
                      text
                  ):
                      flags.append(phrase)

              return flags


          def competition_from_task(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "bid_count",
                  "bidCount",
                  "bids_count",
                  "bidsCount",
                  "num_bids",
                  "number_of_bids",
              ]:
                  value = parse_number(
                      task.get(key)
                  )

                  if value is not None:
                      return int(
                          max(0, value)
                      )

              for key in [
                  "bids",
              ]:
                  value = task.get(key)

                  if isinstance(value, list):
                      return len(value)

              return None


          def economic_score(
              reward_min,
              reward_max
          ):
              if reward_min is None:
                  return 0

              value = max(
                  reward_min,
                  reward_max or reward_min
              )

              if value < 21:
                  return 0

              if value < 100:
                  return 1

              if value < 500:
                  return 2

              if value < 1000:
                  return 3

              if value < 5000:
                  return 4

              if value < 10000:
                  return 5

              return 6


          def competition_score(bids):
              if bids is None:
                  return 2

              if bids == 0:
                  return 5

              if bids == 1:
                  return 4

              if bids == 2:
                  return 3

              if bids <= 4:
                  return 2

              if bids <= 7:
                  return 1

              return 0


          def decision_score(
              task,
              direction_info,
              reward_range,
              capability,
              competition,
              safety,
          ):
              if safety:
                  return {
                      "score": -100,
                      "actionable": False,
                      "reason": "safety_block",
                  }

              if direction_info["direction"] != "DEMAND":
                  return {
                      "score": -50,
                      "actionable": False,
                      "reason": "not_demand",
                  }

              reward_min = reward_range["min"]
              reward_max = reward_range["max"]

              if reward_min is None:
                  return {
                      "score": -20,
                      "actionable": False,
                      "reason": (
                          "no_verified_"
                          "lightning_reward"
                      ),
                  }

              if reward_max is None:
                  reward_max = reward_min

              if reward_max < MIN_BID_SATS:
                  return {
                      "score": -20,
                      "actionable": False,
                      "reason": (
                          "reward_below_"
                          "bid_minimum"
                      ),
                  }

              if not capability["actionable_fit"]:
                  return {
                      "score": -10,
                      "actionable": False,
                      "reason": (
                          "insufficient_"
                          "capability_evidence"
                      ),
                  }

              strong = capability["strong_count"]
              weak = capability["weak_count"]

              score = 0

              # Strong operational capability is the primary
              # driver. One strong capability is enough to enter
              # consideration, but not enough to guarantee a bid.
              score += min(
                  strong * 20,
                  60
              )

              # Two coherent weak capability groups can establish
              # a useful fit, but weak evidence remains deliberately
              # less valuable.
              if weak >= 2:
                  score += 10

              score += (
                  economic_score(
                      reward_min,
                      reward_max
                  ) * 4
              )

              score += (
                  competition_score(
                      competition
                  ) * 4
              )

              if direction_info["confidence"] == "HIGH":
                  score += 10
              elif direction_info["confidence"] == "MEDIUM":
                  score += 4

              complexity = complexity_flags(
                  task
              )

              if not complexity:
                  score += 8
              else:
                  score -= min(
                      len(complexity) * 4,
                      16
                  )

              # Strong evidence is required for a real bid.
              strong_or_coherent_weak = (
                  strong >= 1
                  or weak >= 2
              )

              actionable = (
                  score >= 55
                  and strong_or_coherent_weak
                  and reward_min >= MIN_BID_SATS
              )

              if actionable:
                  reason = (
                      "actionable_opportunity"
                  )
              elif not strong_or_coherent_weak:
                  reason = (
                      "insufficient_capability_evidence"
                  )
              elif score < 55:
                  reason = (
                      "below_action_threshold"
                  )
              else:
                  reason = "not_actionable"

              return {
                  "score": score,
                  "actionable": actionable,
                  "reason": reason,
              }


          def build_bid_amount(reward_range):
              low = reward_range["min"]
              high = reward_range["max"]

              if low is None:
                  return None

              if high is None:
                  high = low

              amount = max(
                  MIN_BID_SATS,
                  int(low)
              )

              amount = min(
                  amount,
                  int(high)
              )

              if amount < MIN_BID_SATS:
                  return None

              return amount


          def build_bid_description(
              task,
              capability,
              reward_range,
          ):
              groups = list(
                  capability["strong_groups"].keys()
              )

              if not groups:
                  groups = list(
                      capability["weak_groups"].keys()
                  )

              groups = [
                  group
                  for group in groups
                  if group not in {
                      "agents",
                  }
              ][:4]

              if groups:
                  capability_text = ", ".join(
                      groups
                  )
              else:
                  capability_text = (
                      "bounded technical/research work"
                  )

              title = get_title(task).strip()

              if not title:
                  title = "the requested task"

              reward_text = ""

              low = reward_range["min"]
              high = reward_range["max"]

              if low is not None:
                  if (
                      high is not None
                      and high != low
                  ):
                      reward_text = (
                          f" for the advertised "
                          f"{low}-{high} sats range"
                      )
                  else:
                      reward_text = (
                          f" for the advertised "
                          f"{low} sats"
                      )

              description = (
                  f"NØX can contribute on "
                  f"{capability_text} for "
                  f"\"{title}\"{reward_text}. "
                  f"The bid is based on the task's "
                  f"stated requirements and verified "
                  f"Lightning reward."
              )

              return description[:5000]


          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "act": "ACT15",
                      "version": "V9",
                      "created_at": now_iso(),
                      "runs": [],
                      "bids": [],
                      "reconciliation": [],
                  }

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      data = json.load(handle)

                  if not isinstance(data, dict):
                      raise ValueError(
                          "memory_not_dict"
                      )

                  return data

              except Exception:
                  return {
                      "act": "ACT15",
                      "version": "V9",
                      "created_at": now_iso(),
                      "memory_recovery": True,
                      "runs": [],
                      "bids": [],
                      "reconciliation": [],
                  }


          def save_memory(memory):
              memory["updated_at"] = now_iso()

              for key in [
                  "runs",
                  "bids",
                  "reconciliation",
              ]:
                  if not isinstance(
                      memory.get(key),
                      list
                  ):
                      memory[key] = []

              memory["runs"] = memory[
                  "runs"
              ][-100:]

              memory["bids"] = memory[
                  "bids"
              ][-MAX_MEMORY_ACTIONS:]

              memory["reconciliation"] = memory[
                  "reconciliation"
              ][-MAX_MEMORY_ACTIONS:]

              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      memory,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )


          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "User-Agent": (
                  "NOX-ACT15-V9/"
                  "autonomous-marketplace"
              ),
          })


          def api_request(
              method,
              path,
              *,
              payload=None,
              timeout=30,
          ):
              url = BASE_URL + path

              response = session.request(
                  method,
                  url,
                  json=payload,
                  timeout=timeout
              )

              try:
                  data = response.json()
              except Exception:
                  data = {
                      "raw": response.text[:4000]
                  }

              return response, data


          def authenticate():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              response, data = api_request(
                  "POST",
                  "/api/v1/auth/token",
                  payload={
                      "api_key": API_KEY
                  }
              )

              if not response.ok:
                  raise RuntimeError(
                      "Authentication failed: "
                      f"HTTP {response.status_code} "
                      f"{data}"
                  )

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "Authentication succeeded "
                      "but no JWT was returned"
                  )

              session.headers.update({
                  "Authorization":
                      f"Bearer {token}"
              })

              return token


          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in keys:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              for value in data.values():
                  if isinstance(value, list):
                      return value

              return []


          def fetch_tasks():
              response, data = api_request(
                  "GET",
                  "/api/v1/marketplace/tasks",
                  timeout=30
              )

              if not response.ok:
                  raise RuntimeError(
                      "Marketplace task fetch failed: "
                      f"HTTP {response.status_code} "
                      f"{data}"
                  )

              tasks = extract_list(
                  data,
                  [
                      "tasks",
                      "results",
                      "items",
                      "data",
                  ]
              )

              return tasks[:MAX_TASKS]


          def fetch_task_bids(task_id):
              response, data = api_request(
                  "GET",
                  f"/api/v1/marketplace/"
                  f"{task_id}/bids",
                  timeout=20
              )

              if not response.ok:
                  return {
                      "ok": False,
                      "status": response.status_code,
                      "bids": [],
                  }

              return {
                  "ok": True,
                  "status": response.status_code,
                  "bids": extract_list(
                      data,
                      [
                          "bids",
                          "results",
                          "items",
                          "data",
                      ]
                  ),
              }


          def bid_belongs_to_identity(
              bid,
              username
          ):
              if not isinstance(bid, dict):
                  return False

              identity_values = []

              for key in [
                  "username",
                  "user",
                  "agent",
                  "bidder",
                  "owner",
                  "author",
                  "created_by",
              ]:
                  value = bid.get(key)

                  if isinstance(value, dict):
                      identity_values.append(
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )
                  elif value:
                      identity_values.append(
                          str(value)
                      )

              return any(
                  value
                  and str(value).lower()
                  == username.lower()
                  for value in identity_values
              )


          def reconcile_bid(task_id):
              result = {
                  "task_id": task_id,
                  "checked_at": now_iso(),
                  "accepted": False,
                  "paid": False,
                  "payment_checked": False,
              }

              bids_result = fetch_task_bids(
                  task_id
              )

              if not bids_result["ok"]:
                  result["bids_error"] = (
                      bids_result["status"]
                  )
                  return result

              username = "nox_origine"

              own_bids = [
                  bid
                  for bid in bids_result["bids"]
                  if bid_belongs_to_identity(
                      bid,
                      username
                  )
              ]

              result["own_bids"] = len(
                  own_bids
              )

              accepted = any(
                  str(
                      bid.get("status", "")
                  ).lower()
                  in {
                      "accepted",
                      "approved",
                      "selected",
                  }
                  for bid in own_bids
                  if isinstance(bid, dict)
              )

              result["accepted"] = accepted

              response, data = api_request(
                  "GET",
                  f"/api/v1/marketplace/"
                  f"{task_id}/payment",
                  timeout=20
              )

              result["payment_checked"] = True

              if response.ok:
                  payment_text = normalize_text(
                      data
                  )

                  result["paid"] = any(
                      phrase_in_text(
                          phrase,
                          payment_text
                      )
                      for phrase in [
                          "paid",
                          "completed",
                          "settled",
                      ]
                  )

                  result["payment_status"] = (
                      data.get("status")
                      if isinstance(data, dict)
                      else None
                  )
              else:
                  result["payment_http"] = (
                      response.status_code
                  )

              return result


          def submit_bid(
              task_id,
              amount,
              description
          ):
              payload = {
                  "bid_amount_sats": int(amount),
                  "bid_description": description,
              }

              response, data = api_request(
                  "POST",
                  f"/api/v1/marketplace/"
                  f"{task_id}/bid",
                  payload=payload,
                  timeout=30
              )

              return response, data


          print("=== NØX ACT15 V9 ===")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Spending: DISABLED")
          print("Marketplace: ENABLED")
          print("Real bids: ENABLED")
          print(
              f"Minimum bid: {MIN_BID_SATS} sats"
          )
          print(
              f"Maximum bids this run: "
              f"{MAX_BIDS_PER_RUN}"
          )
          print("Cost: 0")

          if (
              GEMINI_ENABLED
              or EXTERNAL_AI_ENABLED
              or PAYMENTS_ENABLED
              or SPENDING_ENABLED
          ):
              raise RuntimeError(
                  "Safety flags invalid: "
                  "forbidden capability enabled"
              )

          memory = load_memory()

          authenticate()

          response, identity = api_request(
              "GET",
              "/api/v1/users/me",
              timeout=20
          )

          username = "nox_origine"

          if response.ok and isinstance(
              identity,
              dict
          ):
              username = (
                  identity.get("username")
                  or identity.get("handle")
                  or username
              )

          print(
              f"IDENTITY: {username}"
          )

          reconciliation = []
          previous_bid_task_ids = []

          for entry in memory.get(
              "bids",
              []
          )[-MAX_RECONCILE_ACTIONS:]:
              task_id = entry.get("task_id")

              if task_id and task_id not in previous_bid_task_ids:
                  previous_bid_task_ids.append(
                      task_id
                  )

          for task_id in previous_bid_task_ids[
              :MAX_RECONCILE_ACTIONS
          ]:
              try:
                  state = reconcile_bid(
                      task_id
                  )

                  reconciliation.append(
                      state
                  )

                  print(
                      "RECONCILIATION: "
                      + json.dumps(
                          state,
                          ensure_ascii=False
                      )
                  )

              except Exception as exc:
                  print(
                      "RECONCILIATION ERROR "
                      f"{task_id}: {exc}"
                  )

          accepted_count = sum(
              1
              for item in reconciliation
              if item.get("accepted")
          )

          paid_count = sum(
              1
              for item in reconciliation
              if item.get("paid")
          )

          payment_checks = sum(
              1
              for item in reconciliation
              if item.get("payment_checked")
          )

          print(
              "RECONCILIATION SUMMARY: "
              + json.dumps({
                  "accepted": accepted_count,
                  "paid": paid_count,
                  "payment_checks": payment_checks,
              })
          )

          tasks = fetch_tasks()

          print(
              f"OPEN TASKS RECEIVED: {len(tasks)}"
          )

          analyzed = []
          candidates = []

          for task in tasks:
              task_id = get_task_id(task)
              title = get_title(task)

              if not task_id:
                  print(
                      "TASK WITHOUT ID: skipped"
                  )
                  continue

              direction = classify_direction(
                  task
              )

              reward = parse_reward_range(
                  task
              )

              capabilities = capability_analysis(
                  task
              )

              competition = (
                  competition_from_task(
                      task
                  )
              )

              safety = safety_hits(
                  task
              )

              decision = decision_score(
                  task,
                  direction,
                  reward,
                  capabilities,
                  competition,
                  safety,
              )

              analysis = {
                  "task_id": task_id,
                  "title": title,
                  "direction": direction,
                  "reward": reward,
                  "capabilities": capabilities,
                  "competition": competition,
                  "safety": safety,
                  "decision": decision,
              }

              analyzed.append(analysis)

              print("")
              print(
                  f"TASK: {title or '(untitled)'}"
              )
              print(
                  f"ID: {task_id}"
              )
              print(
                  "DIRECTION: "
                  f"{direction['direction']} "
                  f"{direction['confidence']}"
              )
              print(
                  "REWARD: "
                  f"{reward['min']} - "
                  f"{reward['max']} "
                  f"{reward['source']}"
              )
              print(
                  "CAPABILITIES STRONG: "
                  + json.dumps(
                      capabilities[
                          "strong_groups"
                      ],
                      ensure_ascii=False
                  )
              )
              print(
                  "CAPABILITIES WEAK: "
                  + json.dumps(
                      capabilities[
                          "weak_groups"
                      ],
                      ensure_ascii=False
                  )
              )
              print(
                  "CAPABILITY FIT: "
                  f"{capabilities['actionable_fit']}"
              )
              print(
                  "COMPETITION: "
                  f"{competition}"
              )
              print(
                  "DECISION: "
                  f"{decision['score']} "
                  f"{decision['reason']}"
              )

              if decision["actionable"]:
                  candidates.append(
                      analysis
                  )

          # Existing bids are checked immediately before bidding.
          # This avoids duplicate bids even if memory is stale.
          bids_submitted = 0
          bid_results = []

          candidates.sort(
              key=lambda item: (
                  item["decision"]["score"],
                  item["reward"]["max"] or 0,
                  -(
                      item["competition"]
                      if item["competition"]
                      is not None
                      else 0
                  ),
              ),
              reverse=True
          )

          for analysis in candidates:
              if bids_submitted >= MAX_BIDS_PER_RUN:
                  break

              task_id = analysis[
                  "task_id"
              ]

              existing = fetch_task_bids(
                  task_id
              )

              if existing["ok"]:
                  own_existing = [
                      bid
                      for bid in existing["bids"]
                      if bid_belongs_to_identity(
                          bid,
                          username
                      )
                  ]

                  if own_existing:
                      print(
                          "BID SKIPPED: existing "
                          f"bid detected for "
                          f"{task_id}"
                      )

                      analysis[
                          "decision"
                      ]["reason"] = (
                          "already_bid"
                      )

                      continue

              amount = build_bid_amount(
                  analysis["reward"]
              )

              if amount is None:
                  print(
                      "BID SKIPPED: invalid "
                      f"bid amount for "
                      f"{task_id}"
                  )
                  continue

              description = build_bid_description(
                  next(
                      task
                      for task in tasks
                      if get_task_id(task)
                      == task_id
                  ),
                  analysis["capabilities"],
                  analysis["reward"],
              )

              print("")
              print(
                  "BID CANDIDATE: "
                  f"{task_id}"
              )
              print(
                  f"BID AMOUNT: {amount} sats"
              )
              print(
                  f"BID DESCRIPTION: "
                  f"{description}"
              )

              response, data = submit_bid(
                  task_id,
                  amount,
                  description
              )

              result = {
                  "task_id": task_id,
                  "amount_sats": amount,
                  "submitted_at": now_iso(),
                  "score": analysis[
                      "decision"
                  ]["score"],
                  "reason": analysis[
                      "decision"
                  ]["reason"],
                  "http_status": response.status_code,
                  "success": response.ok,
              }

              if response.ok:
                  bids_submitted += 1
                  result["response"] = data

                  print(
                      "BID SUBMITTED: "
                      f"{task_id}"
                  )

              else:
                  result["error"] = data

                  print(
                      "BID FAILED: "
                      f"{task_id} "
                      f"HTTP {response.status_code}"
                  )

              bid_results.append(result)

          run_record = {
              "timestamp_utc": now_iso(),
              "version": "V9",
              "tasks_received": len(tasks),
              "tasks_analyzed": len(analyzed),
              "candidates": len(candidates),
              "bids_submitted": bids_submitted,
              "accepted_reconciled": accepted_count,
              "paid_reconciled": paid_count,
              "gemini_enabled": GEMINI_ENABLED,
              "external_ai_enabled": (
                  EXTERNAL_AI_ENABLED
              ),
              "payments_enabled": (
                  PAYMENTS_ENABLED
              ),
              "spending_enabled": (
                  SPENDING_ENABLED
              ),
              "cost": 0,
              "bid_results": bid_results,
              "decision_summary": {
                  "supply": sum(
                      1
                      for item in analyzed
                      if item["direction"][
                          "direction"
                      ] == "SUPPLY"
                  ),
                  "demand": sum(
                      1
                      for item in analyzed
                      if item["direction"][
                          "direction"
                      ] == "DEMAND"
                  ),
                  "unknown": sum(
                      1
                      for item in analyzed
                      if item["direction"][
                          "direction"
                      ]
                      == "UNKNOWN_DIRECTION"
                  ),
                  "actionable": len(
                      candidates
                  ),
              },
          }

          memory["act"] = "ACT15"
          memory["version"] = "V9"

          memory.setdefault(
              "runs",
              []
          ).append(
              run_record
          )

          memory.setdefault(
              "reconciliation",
              []
          ).extend(
              reconciliation
          )

          memory.setdefault(
              "bids",
              []
          ).extend(
              bid_results
          )

          save_memory(memory)

          print("")
          print("=== ACT15 V9 SUMMARY ===")
          print(
              f"Tasks: {len(tasks)}"
          )
          print(
              f"Demand: "
              f"{run_record['decision_summary']['demand']}"
          )
          print(
              f"Supply: "
              f"{run_record['decision_summary']['supply']}"
          )
          print(
              f"Unknown: "
              f"{run_record['decision_summary']['unknown']}"
          )
          print(
              f"Actionable: "
              f"{len(candidates)}"
          )
          print(
              f"Bids submitted: "
              f"{bids_submitted}"
          )
          print(
              f"Accepted reconciled: "
              f"{accepted_count}"
          )
          print(
              f"Paid reconciled: "
              f"{paid_count}"
          )
          print("Cost: 0")
          print("=== END ACT15 V9 ===")
          PY

          python /tmp/act15_v9.py

      - name: Commit ACT15 memory
        run: |
          set -euo pipefail

          if git diff --quiet -- memory/nox_act_15_marketplace.json; then
            echo "No ACT15 memory changes."
            exit 0
          fi

          git config user.name "NØX ACT15"
          git config user.email "nox-act15@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          git commit -m "ACT15 V9 marketplace memory update" || true

          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "ACT15 memory pushed successfully."
                exit 0
              fi
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done

          echo "Unable to push ACT15 memory after retries."
          exit 1
