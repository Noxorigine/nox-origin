      - name: Commit ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          if [ -f "${MEMORY_FILE}" ]; then
            git add "${MEMORY_FILE}"
          fi

          if git diff --cached --quiet; then
            echo "No ACT15 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT15 V7: autonomous marketplace decision learning"

      - name: Sync and push ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          if ! git log -1 --pretty=%B | grep -q "ACT15 V7:"; then
            echo "No ACT15 commit created. Nothing to push."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "ERROR: unable to push ACT15 memory after 3 attempts."
          exit 1
