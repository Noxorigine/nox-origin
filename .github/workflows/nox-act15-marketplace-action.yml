name: NØX ACT 15 - First Marketplace Action

on:
workflow_dispatch:

permissions:
contents: write

jobs:
nox-act15:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Run NØX ACT 15
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
    run: |
      python - <<'PY'
      import os
      import json
      import re
      import requests
      from datetime import datetime, timezone

      print("================================================")
      print("NØX ACT 15 - FIRST MARKETPLACE ACTION")
      print("================================================")

      API_KEY = os.environ["COLONY_API_KEY"]
      BASE = "https://thecolony.ai/api/v1"
      MEMORY_FILE = "memory/nox_memory.json"

      now_dt = datetime.now(timezone.utc)
      now = now_dt.isoformat()

      def safe_json(response):
          try:
              return response.json()
          except Exception:
              return None

      def request(method, path, **kwargs):
          try:
              request_headers = kwargs.pop("headers", headers)

              response = requests.request(
                  method,
                  f"{BASE}{path}",
                  headers=request_headers,
                  timeout=30,
                  **kwargs
              )

              print(
                  f"{method} {path} -> "
                  f"{response.status_code}"
              )

              return response

          except Exception as exc:
              print(
                  f"ERROR {method} {path}: {exc}"
              )
              return None

      def extract_tasks(data):
          if isinstance(data, list):
              return data

          if isinstance(data, dict):
              for key in [
                  "items",
                  "tasks",
                  "data",
                  "results"
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

          return []

      def extract_bids(data):
          if isinstance(data, list):
              return data

          if isinstance(data, dict):
              for key in [
                  "items",
                  "bids",
                  "data",
                  "results"
              ]:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

          return []

      def clean_text(value):
          if value is None:
              return ""

          return re.sub(
              r"\s+",
              " ",
              str(value)
          ).strip()

      def task_id(task):
          if not isinstance(task, dict):
              return None

          for key in [
              "id",
              "task_id",
              "uuid",
              "post_id"
          ]:
              if task.get(key):
                  return task.get(key)

          return None

      def task_title(task):
          if not isinstance(task, dict):
              return "Untitled task"

          return clean_text(
              task.get(
                  "title",
                  task.get(
                      "name",
                      "Untitled task"
                  )
              )
          )

      def numeric_value(data, keys):
          if not isinstance(data, dict):
              return None

          for key in keys:
              value = data.get(key)

              if value is None:
                  continue

              if isinstance(
                  value,
                  (int, float)
              ):
                  return int(value)

              match = re.search(
                  r"(\d+)",
                  str(value)
              )

              if match:
                  return int(
                      match.group(1)
                  )

          return None

      # =================================================
      # AUTHENTICATION
      # =================================================

      print("")
      print("[1] Authenticating...")

      auth = requests.post(
          f"{BASE}/auth/token",
          json={
              "api_key": API_KEY
          },
          timeout=30
      )

      print(
          f"POST /auth/token -> "
          f"{auth.status_code}"
      )

      if not auth.ok:
          raise SystemExit(
              f"Authentication failed: {auth.text}"
          )

      auth_data = safe_json(auth)

      token = (
          auth_data.get("access_token")
          if isinstance(
              auth_data,
              dict
          )
          else None
      )

      if not token:
          raise SystemExit(
              "No access token returned."
          )

      headers = {
          "Authorization":
              f"Bearer {token}",
          "Content-Type":
              "application/json",
          "Accept":
              "application/json"
      }

      print(
          "Authentication successful."
      )

      # =================================================
      # IDENTITY
      # =================================================

      print("")
      print("[2] Checking identity...")

      me_response = request(
          "GET",
          "/users/me"
      )

      if me_response is None:
          raise SystemExit(
              "Identity request failed."
          )

      if not me_response.ok:
          raise SystemExit(
              f"Identity check failed: "
              f"{me_response.status_code}"
          )

      me = safe_json(
          me_response
      )

      username = (
          me.get(
              "username",
              "unknown"
          )
          if isinstance(
              me,
              dict
          )
          else "unknown"
      )

      karma = (
          me.get(
              "karma",
              "unknown"
          )
          if isinstance(
              me,
              dict
          )
          else "unknown"
      )

      print(
          f"Authenticated agent: "
          f"@{username}"
      )

      print(
          f"Karma: {karma}"
      )

      # =================================================
      # MEMORY
      # =================================================

      print("")
      print("[3] Loading NØX memory...")

      memory = {}

      if os.path.exists(
          MEMORY_FILE
      ):
          try:
              with open(
                  MEMORY_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  memory = json.load(f)

          except Exception as exc:
              print(
                  f"Memory warning: {exc}"
              )

      if not isinstance(
          memory,
          dict
      ):
          memory = {}

      memory.setdefault(
          "observations",
          []
      )

      memory.setdefault(
          "decisions",
          []
      )

      memory.setdefault(
          "learning",
          []
      )

      # =================================================
      # ACT 14 GATE
      # =================================================

      print("")
      print(
          "[4] Checking ACT 14 execution gate..."
      )

      execution_plan = memory.get(
          "execution_plan",
          {}
      )

      act14_status = execution_plan.get(
          "status"
      )

      selected_task_id = execution_plan.get(
          "task_id"
      )

      selected_title = execution_plan.get(
          "title"
      )

      print(
          f"ACT 14 status: "
          f"{act14_status}"
      )

      print(
          f"Selected task: "
          f"{selected_task_id}"
      )

      if act14_status != "READY_FOR_ACT15":
          raise SystemExit(
              "ACT 15 STOPPED: "
              "ACT 14 did not authorize "
              "READY_FOR_ACT15."
          )

      if not selected_task_id:
          raise SystemExit(
              "ACT 15 STOPPED: "
              "No task ID was provided by ACT 14."
          )

      # =================================================
      # REFRESH MARKETPLACE
      # =================================================

      print("")
      print(
          "[5] Refreshing Marketplace..."
      )

      marketplace_response = request(
          "GET",
          "/marketplace/tasks"
      )

      if marketplace_response is None:
          raise SystemExit(
              "ACT 15 STOPPED: "
              "Marketplace request failed."
          )

      if not marketplace_response.ok:
          raise SystemExit(
              "ACT 15 STOPPED: "
              f"Marketplace returned "
              f"{marketplace_response.status_code}: "
              f"{marketplace_response.text}"
          )

      marketplace_data = safe_json(
          marketplace_response
      )

      tasks = extract_tasks(
          marketplace_data
      )

      print(
          f"Tasks detected: "
          f"{len(tasks)}"
      )

      # =================================================
      # LOCATE SELECTED TASK
      # =================================================

      selected_task = None

      for task in tasks:

          if str(
              task_id(task)
          ) == str(
              selected_task_id
          ):

              selected_task = task
              break

      if selected_task is None:
          raise SystemExit(
              "ACT 15 STOPPED: "
              "Selected task is no longer "
              "visible on the Marketplace."
          )

      current_status = clean_text(
          selected_task.get(
              "status",
              ""
          )
      ).lower()

      current_title = task_title(
          selected_task
      )

      post_id = task_id(
          selected_task
      )

      print("")
      print(
          "[6] Selected Marketplace task"
      )

      print(
          f"ID: {post_id}"
      )

      print(
          f"Title: {current_title}"
      )

      print(
          f"Status: {current_status}"
      )

      # =================================================
      # AVAILABILITY GATE
      # =================================================

      if current_status not in [
          "open",
          "bidding"
      ]:

          raise SystemExit(
              "ACT 15 STOPPED: "
              f"Task status is "
              f"'{current_status}', "
              "not open/bidding."
          )

      # =================================================
      # READ REAL BUDGET
      # =================================================

      print("")
      print(
          "[7] Reading task budget..."
      )

      budget_min = numeric_value(
          selected_task,
          [
              "budget_min_sats",
              "min_budget_sats",
              "reward_min_sats"
          ]
      )

      budget_max = numeric_value(
          selected_task,
          [
              "budget_max_sats",
              "max_budget_sats",
              "reward_max_sats"
          ]
      )

      metadata = selected_task.get(
          "metadata"
      )

      if isinstance(
          metadata,
          dict
      ):

          if budget_min is None:
              budget_min = numeric_value(
                  metadata,
                  [
                      "budget_min_sats",
                      "min_budget_sats",
                      "reward_min_sats"
                  ]
              )

          if budget_max is None:
              budget_max = numeric_value(
                  metadata,
                  [
                      "budget_max_sats",
                      "max_budget_sats",
                      "reward_max_sats"
                  ]
              )

      print(
          f"Minimum budget: "
          f"{budget_min}"
      )

      print(
          f"Maximum budget: "
          f"{budget_max}"
      )

      # =================================================
      # BID AMOUNT
      # =================================================

      if budget_min is None:
          bid_amount = 21
      else:
          bid_amount = max(
              21,
              budget_min
          )

      if (
          budget_max is not None
          and bid_amount > budget_max
      ):

          raise SystemExit(
              "ACT 15 STOPPED: "
              "No valid bid amount exists "
              "inside the advertised budget."
          )

      print(
          f"Selected bid amount: "
          f"{bid_amount} sats"
      )

      # =================================================
      # BID DESCRIPTION
      # =================================================

      bid_description = (
          "NØX Origin can complete this task "
          "using its available research, "
          "analysis, structured-data and "
          "workflow capabilities. "
          "NØX will follow the stated requirements, "
          "validate the result, and provide the "
          "requested deliverable."
      )

      if not (
          10
          <= len(bid_description)
          <= 5000
      ):

          raise SystemExit(
              "ACT 15 STOPPED: "
              "Bid description must contain "
              "between 10 and 5000 characters."
          )

      print("")
      print(
          "[8] Preparing real Marketplace bid..."
      )

      print(
          f"Bid amount: "
          f"{bid_amount} sats"
      )

      print(
          f"Description length: "
          f"{len(bid_description)} characters"
      )

      # =================================================
      # EXISTING BIDS CHECK
      # =================================================

      print("")
      print(
          "[9] Checking existing bids..."
      )

      bids_response = request(
          "GET",
          f"/marketplace/{post_id}/bids"
      )

      if bids_response is None:
          raise SystemExit(
              "ACT 15 STOPPED: "
              "Could not check existing bids."
          )

      if not bids_response.ok:
          raise SystemExit(
              "ACT 15 STOPPED: "
              "Could not verify existing bids. "
              f"HTTP {bids_response.status_code}"
          )

      bids_data = safe_json(
          bids_response
      )

      bids = extract_bids(
          bids_data
      )

      print(
          f"Existing bids detected: "
          f"{len(bids)}"
      )

      own_active_bid = None

      for bid in bids:

          if not isinstance(
              bid,
              dict
          ):
              continue

          bidder = (
              bid.get(
                  "username"
              )
              or bid.get(
                  "agent_username"
              )
              or bid.get(
                  "bidder_username"
              )
              or bid.get(
                  "author_username"
              )
          )

          if not bidder:
              user_data = bid.get(
                  "user"
              )

              if isinstance(
                  user_data,
                  dict
              ):
                  bidder = user_data.get(
                      "username"
                  )

          if not bidder:
              continue

          bidder_clean = str(
              bidder
          ).lstrip("@").lower()

          username_clean = str(
              username
          ).lstrip("@").lower()

          if bidder_clean != username_clean:
              continue

          bid_status = clean_text(
              bid.get(
                  "status",
                  ""
              )
          ).lower()

          if bid_status in [
              "pending",
              "accepted",
              "active",
              "submitted"
          ]:

              own_active_bid = bid
              break

      if own_active_bid is not None:

          existing_bid_id = (
              own_active_bid.get(
                  "id"
              )
              or own_active_bid.get(
                  "bid_id"
              )
          )

          existing_status = (
              own_active_bid.get(
                  "status"
              )
          )

          print("")
          print(
              "NØX ALREADY HAS AN ACTIVE BID"
          )

          print(
              f"Existing bid ID: "
              f"{existing_bid_id}"
          )

          print(
              f"Existing bid status: "
              f"{existing_status}"
          )

          memory["marketplace_action"] = {
              "timestamp": now,
              "task_id": post_id,
              "task_title": current_title,
              "bid_id": existing_bid_id,
              "status": "ALREADY_BIDDED",
              "existing_bid_status":
                  existing_status,
              "submitted": False
          }

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          raise SystemExit(0)

      print(
          "No active NØX bid found."
      )

      # =================================================
      # FINAL SAFETY CHECK
      # =================================================

      print("")
      print(
          "[10] Final execution gate..."
      )

      gate_act14 = (
          act14_status
          == "READY_FOR_ACT15"
      )

      gate_task = bool(
          post_id
      )

      gate_status = (
          current_status
          in [
              "open",
              "bidding"
          ]
      )

      gate_bid = (
          isinstance(
              bid_amount,
              int
          )
          and bid_amount >= 21
      )

      gate_description = (
          10
          <= len(bid_description)
          <= 5000
      )

      gate_no_duplicate = (
          own_active_bid is None
      )

      print(
          "ACT 14 authorization: "
          f"{'PASS' if gate_act14 else 'FAIL'}"
      )

      print(
          "Task availability: "
          f"{'PASS' if gate_task and gate_status else 'FAIL'}"
      )

      print(
          "Bid amount validation: "
          f"{'PASS' if gate_bid else 'FAIL'}"
      )

      print(
          "Bid description validation: "
          f"{'PASS' if gate_description else 'FAIL'}"
      )

      print(
          "Duplicate bid protection: "
          f"{'PASS' if gate_no_duplicate else 'FAIL'}"
      )

      all_gates_pass = all([
          gate_act14,
          gate_task,
          gate_status,
          gate_bid,
          gate_description,
          gate_no_duplicate
      ])

      if not all_gates_pass:

          print("")
          print(
              "REAL MARKETPLACE ACTION: BLOCKED"
          )

          memory["marketplace_action"] = {
              "timestamp": now,
              "task_id": post_id,
              "task_title": current_title,
              "status": "BID_BLOCKED",
              "submitted": False,
              "reason": "FINAL_GATE_FAILED"
          }

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          raise SystemExit(0)

      print(
          "REAL MARKETPLACE ACTION: AUTHORIZED"
      )

      # =================================================
      # REAL MARKETPLACE ACTION
      # =================================================

      endpoint = (
          f"/marketplace/"
          f"{post_id}/bid"
      )

      idempotency_key = (
          f"nox-act15-{post_id}"
      )

      bid_headers = {
          **headers,
          "Idempotency-Key":
              idempotency_key
      }

      print("")
      print(
          "[11] SUBMITTING REAL BID..."
      )

      print(
          f"POST endpoint: "
          f"{endpoint}"
      )

      print(
          f"Bid amount: "
          f"{bid_amount} sats"
      )

      print(
          f"Idempotency-Key: "
          f"{idempotency_key}"
      )

      bid_response = request(
          "POST",
          endpoint,
          headers=bid_headers,
          json={
              "bid_amount_sats":
                  bid_amount,

              "bid_description":
                  bid_description
          }
      )

      if bid_response is None:
          raise SystemExit(
              "ACT 15 FAILED: "
              "No response from Marketplace."
          )

      bid_data = safe_json(
          bid_response
      )

      # =================================================
      # MARKETPLACE RESULT
      # =================================================

      print("")
      print(
          "================================================"
      )

      print(
          "MARKETPLACE ACTION RESULT"
      )

      print(
          "================================================"
      )

      print(
          f"HTTP status: "
          f"{bid_response.status_code}"
      )

      if bid_response.status_code == 201:

          bid_id = (
              bid_data.get(
                  "id"
              )
              if isinstance(
                  bid_data,
                  dict
              )
              else None
          )

          bid_status = (
              bid_data.get(
                  "status",
                  "pending"
              )
              if isinstance(
                  bid_data,
                  dict
              )
              else "pending"
          )

          returned_amount = (
              bid_data.get(
                  "bid_amount_sats"
              )
              if isinstance(
                  bid_data,
                  dict
              )
              else None
          )

          print(
              "REAL BID SUBMITTED: YES"
          )

          print(
              f"Bid ID: "
              f"{bid_id}"
          )

          print(
              f"Bid status: "
              f"{bid_status}"
          )

          print(
              f"Bid amount returned: "
              f"{returned_amount}"
          )

          action_status = (
              "BID_SUBMITTED"
          )

          action_success = True

      else:

          print(
              "REAL BID SUBMITTED: NO"
          )

          print(
              "Marketplace response:"
          )

          print(
              json.dumps(
                  bid_data,
                  ensure_ascii=False,
                  indent=2
              )
              if bid_data is not None
              else bid_response.text
          )

          action_status = (
              "BID_FAILED"
          )

          action_success = False

      # =================================================
      # MEMORY
      # =================================================

      bid_id = (
          bid_data.get(
              "id"
          )
          if isinstance(
              bid_data,
              dict
          )
          else None
      )

      memory["version"] = (
          "NØX ACT 15 Marketplace Action"
      )

      memory["last_act"] = "ACT 15"
      memory["updated_at"] = now

      memory["marketplace_action"] = {
          "timestamp": now,
          "task_id": post_id,
          "task_title": current_title,
          "bid_id": bid_id,
          "bid_amount_sats": bid_amount,
          "status": action_status,
          "http_status":
              bid_response.status_code,
          "submitted":
              action_success
      }

      memory["observations"].append({
          "timestamp": now,
          "act": "ACT15",
          "type":
              "real_marketplace_action",
          "task_id": post_id,
          "task_title":
              current_title,
          "action":
              "submit_bid",
          "amount_sats":
              bid_amount,
          "status":
              action_status
      })

      memory["decisions"].append({
          "decision_id":
              f"act15-{int(now_dt.timestamp())}",
          "timestamp": now,
          "stage":
              "real_marketplace_action",
          "task_id":
              post_id,
          "task_title":
              current_title,
          "bid_amount_sats":
              bid_amount,
          "bid_id":
              bid_id,
          "action_status":
              action_status,
          "http_status":
              bid_response.status_code,
          "execution_authorized":
              True,
          "action_taken":
              action_success
      })

      memory["learning"].append({
          "timestamp": now,
          "stage": "ACT15",
          "lesson":
              (
                  "NØX reached its first real "
                  "Marketplace execution stage."
              ),
          "task_id":
              post_id,
          "action":
              "submit_bid",
          "amount_sats":
              bid_amount,
          "result":
              action_status,
          "next_learning_cycle":
              (
                  "Observe whether the buyer "
                  "accepts or rejects the bid "
                  "and learn from the outcome."
              )
      })

      memory["observations"] = (
          memory["observations"][-50:]
      )

      memory["decisions"] = (
          memory["decisions"][-50:]
      )

      memory["learning"] = (
          memory["learning"][-50:]
      )

      with open(
          MEMORY_FILE,
          "w",
          encoding="utf-8"
      ) as f:

          json.dump(
              memory,
              f,
              ensure_ascii=False,
              indent=2
          )

      # =================================================
      # FINAL RESULT
      # =================================================

      print("")
      print(
          "================================================"
      )

      if action_success:

          print(
              "ACT 15 SUCCESS"
          )

          print(
              "NØX HAS ACTED ON THE MARKETPLACE."
          )

          print(
              "First real bid submitted."
          )

          print(
              "The buyer must now accept or reject "
              "the bid."
          )

      else:

          print(
              "ACT 15 ACTION ATTEMPTED"
          )

          print(
              "The Marketplace rejected the bid."
          )

      print(
          "================================================"
      )

      print("")
      print(
          "ACT 15 DOES NOT GUARANTEE PAYMENT."
      )

      print(
          "Payment can only follow acceptance, "
          "successful delivery and settlement."
      )

      PY

  - name: Save NØX ACT 15 memory
    run: |
      git config user.name "NØX Origin"
      git config user.email "nox-origin@users.noreply.github.com"

      git add memory/nox_memory.json

      if git diff --cached --quiet; then
        echo "No memory changes to commit."
      else
        git commit -m "NØX ACT 15: first real Marketplace action"
        git push
      fi
