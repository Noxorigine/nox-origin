name: NØX ACT 15 V7.1 - Autonomous Marketplace Opportunity Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX ACT15 marketplace hunter
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "")
          MEMORY_FILE = os.environ["MEMORY_FILE"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_MEMORY_ACTIONS = int(os.environ["MAX_MEMORY_ACTIONS"])
          DELAY = float(os.environ["ACTION_DELAY_SECONDS"])
          FALLBACK_SATS_PER_USD = int(os.environ["FALLBACK_SATS_PER_USD"])

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Origin-ACT15/7.1"
          })

          def now():
              return datetime.now(timezone.utc).isoformat()

          def log(message):
              print(f"[ACT15] {message}")

          def get_json(url, headers=None, params=None):
              try:
                  response = session.get(
                      url,
                      headers=headers,
                      params=params,
                      timeout=20
                  )
                  return response.status_code, response.json()
              except Exception as exc:
                  return 0, {"error": str(exc)}

          def post_json(url, payload, headers=None):
              try:
                  response = session.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=20
                  )
                  try:
                      data = response.json()
                  except Exception:
                      data = {"text": response.text[:1000]}
                  return response.status_code, data
              except Exception as exc:
                  return 0, {"error": str(exc)}

          # ------------------------------------------------------------
          # Authentication
          # ------------------------------------------------------------

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          auth_status, auth_data = post_json(
              f"{BASE_URL}/auth/token",
              {"api_key": API_KEY}
          )

          log(f"Auth status: {auth_status}")

          if auth_status != 200:
              raise SystemExit(f"Authentication failed: {auth_data}")

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit("No JWT token returned by /auth/token")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Origin-ACT15/7.1"
          }

          identity_status, identity = get_json(
              f"{BASE_URL}/users/me",
              headers=headers
          )

          log(f"Identity status: {identity_status}")

          if identity_status != 200:
              raise SystemExit(f"Identity check failed: {identity}")

          username = (
              identity.get("username")
              or identity.get("handle")
              or identity.get("name")
              or "unknown"
          )

          karma = identity.get("karma", 0)

          log(f"Identity: @{username} | Karma: {karma}")

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def normalize_text(value):
              if value is None:
                  return ""
              if isinstance(value, (dict, list)):
                  try:
                      return json.dumps(value, ensure_ascii=False)
                  except Exception:
                      return str(value)
              return str(value)

          def parse_number(raw):
              text = str(raw).strip().replace(" ", "")

              if not text:
                  return None

              # Decimal comma:
              # 0,25 -> 0.25
              if "," in text and "." not in text:
                  if re.fullmatch(r"\d+,\d+", text):
                      text = text.replace(",", ".")
                  else:
                      text = text.replace(",", "")

              # Thousands separator:
              # 2,500 -> 2500
              elif "," in text:
                  text = text.replace(",", "")

              try:
                  return float(text)
              except ValueError:
                  return None

          def extract_reward_sats(task):
              """
              Returns:
                  (reward_sats, source)

              Important:
              - No reward / 0 reward is NOT discarded.
              - Negative monetary values are NOT treated as rewards.
              - sats have priority when explicitly present.
              - USD/USDC are converted using FALLBACK_SATS_PER_USD.
              """

              # --------------------------------------------------------
              # Collect text without accidentally turning negative
              # values into positive rewards.
              # --------------------------------------------------------

              fields = []

              for key in (
                  "title",
                  "description",
                  "details",
                  "reward_description",
                  "budget_description",
                  "price_description"
              ):
                  if key in task:
                      fields.append(normalize_text(task.get(key)))

              text = " ".join(fields)

              # --------------------------------------------------------
              # 1. Explicit sats in text
              # --------------------------------------------------------

              sats_patterns = [
                  r"(?i)(?<![\w-])(?P<sign>[+-]?)\s*(?P<amount>\d[\d,]*(?:[.]\d+)?)\s*sats?\b",
                  r"(?i)\b(?P<sign>[+-]?)(?P<amount>\d[\d,]*(?:[.]\d+)?)\s*sat(?:oshis)?\b",
              ]

              sats_values = []

              for pattern in sats_patterns:
                  for match in re.finditer(pattern, text):
                      sign = match.group("sign") or ""
                      amount = parse_number(match.group("amount"))

                      if amount is None:
                          continue

                      if sign == "-":
                          continue

                      if amount <= 0:
                          continue

                      sats_values.append(int(round(amount)))

              if sats_values:
                  # If several explicit sats amounts exist, prefer the
                  # largest positive amount rather than the smallest.
                  reward = max(sats_values)
                  return reward, "text_sats"

              # --------------------------------------------------------
              # 2. Negative USD / USDC detection
              # --------------------------------------------------------

              negative_currency = re.search(
                  r"(?i)(?:^|[\s(:=])[-−]\s*"
                  r"\$?\s*\d[\d,]*(?:[.,]\d+)?\s*"
                  r"(?:usdc|usd)\b",
                  text
              )

              if negative_currency:
                  return None, "unpaid"

              # Also catch:
              # -$30
              # - $30 USDC
              # - -30 USDC
              # -30 USD
              negative_currency_2 = re.search(
                  r"(?i)-\s*\$?\s*\d[\d,]*(?:[.,]\d+)?"
                  r"\s*(?:usdc|usd)\b",
                  text
              )

              if negative_currency_2:
                  return None, "unpaid"

              # --------------------------------------------------------
              # 3. USD / USDC with currency AFTER amount
              #
              # Works with:
              # 5 USDC
              # 5 USDC per task
              # 5 USDC flat
              # $5 USDC
              # 5 USD
              # --------------------------------------------------------

              currency_after_patterns = [
                  r"(?i)(?<![\w-])"
                  r"\+?\s*\$?\s*"
                  r"(?P<amount>\d[\d,]*(?:[.,]\d+)?)"
                  r"\s*(?P<currency>usdc|usd)\b",

                  r"(?i)(?<![\w-])"
                  r"\$\s*(?P<amount>\d[\d,]*(?:[.,]\d+)?)"
                  r"\s*(?P<currency>usdc|usd)\b",
              ]

              currency_values = []

              for pattern in currency_after_patterns:
                  for match in re.finditer(pattern, text):
                      amount = parse_number(match.group("amount"))

                      if amount is None or amount <= 0:
                          continue

                      sats = int(round(amount * FALLBACK_SATS_PER_USD))

                      if sats > 0:
                          currency_values.append(sats)

              # --------------------------------------------------------
              # 4. Currency before amount
              #
              # Examples:
              # USDC from $0.25
              # USDC: $5
              # USD from 10
              # --------------------------------------------------------

              currency_before_patterns = [
                  r"(?i)\b(?:usdc|usd)\b"
                  r"[^$\d\-−]{0,40}"
                  r"\$?\s*(?P<amount>\d[\d,]*(?:[.,]\d+)?)",

                  r"(?i)\b(?:usdc|usd)\b"
                  r"\s*[:=]\s*\$?\s*"
                  r"(?P<amount>\d[\d,]*(?:[.,]\d+)?)",
              ]

              for pattern in currency_before_patterns:
                  for match in re.finditer(pattern, text):
                      amount = parse_number(match.group("amount"))

                      if amount is None or amount <= 0:
                          continue

                      sats = int(round(amount * FALLBACK_SATS_PER_USD))

                      if sats > 0:
                          currency_values.append(sats)

              if currency_values:
                  reward = max(currency_values)
                  return reward, "text_usd_usdc"

              # --------------------------------------------------------
              # 5. Structured numeric fields
              #
              # Only trust explicit numeric reward fields.
              # Do NOT blindly parse arbitrary strings such as:
              # "reward": "5 USDC"
              # because that can create false positives.
              # --------------------------------------------------------

              for key in (
                  "reward_sats",
                  "rewardSats",
                  "budget_sats",
                  "budgetSats"
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      if value > 0:
                          return int(round(value)), f"field_{key}"

              # --------------------------------------------------------
              # No reward:
              # This remains a valid learning/opportunity candidate.
              # --------------------------------------------------------

              return None, "unpaid"

          # ------------------------------------------------------------
          # Capability / learning / domain scoring
          # ------------------------------------------------------------

          capability_keywords = {
              "python": 8,
              "api": 8,
              "automation": 8,
              "research": 7,
              "data": 7,
              "analysis": 7,
              "qa": 6,
              "testing": 6,
              "smoke test": 6,
              "scraping": 7,
              "web": 5,
              "json": 5,
              "csv": 5,
              "seo": 5,
              "audit": 7,
              "copywriting": 5,
              "documentation": 6,
              "scripts": 7,
              "database": 6,
              "source checks": 7
          }

          domain_keywords = {
              "virtual economy": 15,
              "marketplace": 12,
              "payments": 8,
              "lightning": 10,
              "bitcoin": 8,
              "cybersecurity": 15,
              "security": 12,
              "ai community": 12,
              "ai communities": 12,
              "ai agents": 15,
              "agent": 10,
              "autonomy": 15,
              "automation": 8,
              "emerging tech": 10,
              "technology": 7,
              "regulation": 10,
              "law": 8,
              "policy": 8
          }

          learning_keywords = {
              "learn": 10,
              "learning": 10,
              "experiment": 9,
              "test": 8,
              "testing": 8,
              "proof": 8,
              "research": 8,
              "new": 6,
              "challenge": 8,
              "build": 7,
              "prototype": 8,
              "feedback": 8,
              "collaboration": 10,
              "community": 7
          }

          blocked_terms = [
              "weapon",
              "weapons",
              "firearm",
              "explosive",
              "explosives",
              "malware",
              "ransomware",
              "credential theft",
              "steal credentials",
              "phishing",
              "stolen account",
              "account takeover",
              "fraud",
              "money laundering",
              "illegal drugs"
          ]

          def score_task(task, reward_sats):
              title = normalize_text(task.get("title"))
              description = normalize_text(task.get("description"))
              text = f"{title} {description}".lower()

              capability_score = sum(
                  value for keyword, value in capability_keywords.items()
                  if keyword in text
              )

              learning_score = sum(
                  value for keyword, value in learning_keywords.items()
                  if keyword in text
              )

              domain_score = sum(
                  value for keyword, value in domain_keywords.items()
                  if keyword in text
              )

              # Keep component scores bounded.
              capability_score = min(capability_score, 40)
              learning_score = min(learning_score, 25)
              domain_score = min(domain_score, 25)

              # Paid work gets a modest economic signal.
              economic_score = 0

              if reward_sats is not None:
                  if reward_sats >= 100000:
                      economic_score = 15
                  elif reward_sats >= 50000:
                      economic_score = 12
                  elif reward_sats >= 10000:
                      economic_score = 10
                  elif reward_sats >= 1000:
                      economic_score = 7
                  else:
                      economic_score = 4

              # More balanced than the previous threshold.
              total_score = int(
                  capability_score * 0.40
                  + learning_score * 0.20
                  + domain_score * 0.25
                  + economic_score * 0.15
              )

              return {
                  "capability_score": capability_score,
                  "learning_score": learning_score,
                  "domain_score": domain_score,
                  "economic_score": economic_score,
                  "total_score": total_score
              }

          def is_blocked(task):
              text = (
                  normalize_text(task.get("title"))
                  + " "
                  + normalize_text(task.get("description"))
              ).lower()

              for term in blocked_terms:
                  if term in text:
                      return True, term

              return False, None

          # ------------------------------------------------------------
          # Marketplace
          # ------------------------------------------------------------

          marketplace_status, marketplace_data = get_json(
              f"{BASE_URL}/marketplace/tasks",
              headers=headers,
              params={"limit": MAX_TASKS}
          )

          log(f"Marketplace status: {marketplace_status}")

          if marketplace_status != 200:
              raise SystemExit(
                  f"Marketplace request failed: {marketplace_data}"
              )

          if isinstance(marketplace_data, dict):
              tasks = (
                  marketplace_data.get("tasks")
                  or marketplace_data.get("items")
                  or marketplace_data.get("data")
                  or []
              )
          elif isinstance(marketplace_data, list):
              tasks = marketplace_data
          else:
              tasks = []

          log(f"Tasks seen: {len(tasks)}")

          open_tasks = []

          for task in tasks:
              status = str(task.get("status", "")).lower()

              if status in {
                  "closed",
                  "completed",
                  "cancelled",
                  "canceled",
                  "expired"
              }:
                  continue

              open_tasks.append(task)

          log(f"Open tasks: {len(open_tasks)}")

          # ------------------------------------------------------------
          # Existing bids
          # ------------------------------------------------------------

          existing_bid_task_ids = set()

          for task in open_tasks:
              task_id = task.get("id") or task.get("task_id")

              if not task_id:
                  continue

              bid_status, bids_data = get_json(
                  f"{BASE_URL}/marketplace/{task_id}/bids",
                  headers=headers
              )

              if bid_status != 200:
                  continue

              if isinstance(bids_data, dict):
                  bids = (
                      bids_data.get("bids")
                      or bids_data.get("items")
                      or bids_data.get("data")
                      or []
                  )
              elif isinstance(bids_data, list):
                  bids = bids_data
              else:
                  bids = []

              for bid in bids:
                  bidder = (
                      bid.get("username")
                      or bid.get("handle")
                      or bid.get("agent_username")
                      or bid.get("agent_handle")
                  )

                  if bidder and str(bidder).lstrip("@").lower() == username.lstrip("@").lower():
                      existing_bid_task_ids.add(str(task_id))
                      break

              time.sleep(DELAY)

          # ------------------------------------------------------------
          # Evaluate opportunities
          # ------------------------------------------------------------

          paid_candidates = []
          learning_candidates = []
          blocked_count = 0
          already_bid_count = 0

          for task in open_tasks:
              task_id = task.get("id") or task.get("task_id")
              title = normalize_text(task.get("title")) or "Untitled task"

              reward_sats, reward_source = extract_reward_sats(task)

              scoring = score_task(task, reward_sats)

              blocked, blocked_reason = is_blocked(task)

              if blocked:
                  blocked_count += 1

                  log(
                      f"BLOCKED | {title} | reason={blocked_reason}"
                  )

                  continue

              if task_id and str(task_id) in existing_bid_task_ids:
                  already_bid_count += 1

                  log(
                      f"ALREADY BID | {title} | "
                      f"reward_sats={reward_sats} | source={reward_source}"
                  )

                  continue

              candidate = {
                  "task_id": task_id,
                  "title": title,
                  "reward_sats": reward_sats,
                  "reward_source": reward_source,
                  **scoring,
                  "evaluated_at": now()
              }

              # --------------------------------------------------------
              # IMPORTANT:
              # A task without sats is STILL an opportunity.
              #
              # It can create:
              # - experience
              # - proof of work
              # - reputation
              # - relationships
              # - tips
              # - future paid opportunities
              #
              # Therefore it is never filtered out simply because
              # reward_sats is None.
              # --------------------------------------------------------

              if reward_sats is None:
                  candidate["classification"] = "learning_opportunity"
                  learning_candidates.append(candidate)

                  log(
                      f"LEARNING OPPORTUNITY | {title} | "
                      f"reward=none | score={scoring['total_score']}"
                  )

                  continue

              # --------------------------------------------------------
              # Paid task selection
              #
              # No artificial 10-sat filter.
              # Any positive, correctly parsed paid reward can be
              # considered. Suitability comes from capability + score.
              # --------------------------------------------------------

              if (
                  scoring["capability_score"] >= 8
                  and scoring["total_score"] >= 8
              ):
                  candidate["classification"] = "paid_bid_candidate"
                  paid_candidates.append(candidate)

                  log(
                      f"PAID CANDIDATE | {title} | "
                      f"reward_sats={reward_sats} | "
                      f"score={scoring['total_score']} | "
                      f"capability={scoring['capability_score']}"
                  )
              else:
                  candidate["classification"] = "paid_candidate_low_score"
                  learning_candidates.append(candidate)

                  log(
                      f"PAID LOW SCORE | {title} | "
                      f"reward_sats={reward_sats} | "
                      f"score={scoring['total_score']} | "
                      f"capability={scoring['capability_score']}"
                  )

          # ------------------------------------------------------------
          # Submit bids for suitable paid work
          # ------------------------------------------------------------

          submitted = []
          bid_errors = []

          for candidate in paid_candidates:
              task_id = candidate.get("task_id")
              reward_sats = candidate.get("reward_sats")

              if not task_id:
                  bid_errors.append({
                      "task_id": None,
                      "title": candidate["title"],
                      "error": "missing_task_id"
                  })
                  continue

              if not reward_sats or reward_sats <= 0:
                  bid_errors.append({
                      "task_id": task_id,
                      "title": candidate["title"],
                      "error": "invalid_reward"
                  })
                  continue

              # NØX asks for 20% of the advertised reward.
              # Never exceed the advertised reward.
              bid_amount = max(1, int(round(reward_sats * 0.20)))
              bid_amount = min(bid_amount, reward_sats)

              bid_description = (
                  "NØX can contribute to this task using its current "
                  "capabilities in automation, research, APIs, data "
                  "analysis and agent-oriented problem solving. "
                  "The task is also relevant to NØX's ongoing learning "
                  "and capability development."
              )

              payload = {
                  "bid_amount_sats": bid_amount,
                  "bid_description": bid_description
              }

              status, response = post_json(
                  f"{BASE_URL}/marketplace/{task_id}/bid",
                  payload,
                  headers=headers
              )

              if 200 <= status < 300:
                  submitted.append({
                      "task_id": task_id,
                      "title": candidate["title"],
                      "reward_sats": reward_sats,
                      "bid_amount_sats": bid_amount,
                      "score": candidate["total_score"],
                      "submitted_at": now()
                  })

                  log(
                      f"BID SUBMITTED | {candidate['title']} | "
                      f"reward={reward_sats} sats | "
                      f"bid={bid_amount} sats"
                  )
              else:
                  bid_errors.append({
                      "task_id": task_id,
                      "title": candidate["title"],
                      "reward_sats": reward_sats,
                      "bid_amount_sats": bid_amount,
                      "status": status,
                      "error": response
                  })

                  log(
                      f"BID ERROR | {candidate['title']} | "
                      f"status={status}"
                  )

              time.sleep(DELAY)

          # ------------------------------------------------------------
          # Memory
          # ------------------------------------------------------------

          memory = {
              "agent": "NØX",
              "workflow": "ACT15_V7.1",
              "updated_at": now(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "marketplace_mode": "opportunity_hunting",
              "policy": {
                  "unpaid_tasks_are_valid_opportunities": True,
                  "unpaid_tasks_can_generate_learning": True,
                  "unpaid_tasks_can_generate_reputation": True,
                  "unpaid_tasks_can_generate_relationships": True,
                  "unpaid_tasks_can_generate_tips": True,
                  "unpaid_tasks_can_generate_future_opportunities": True,
                  "minimum_sats_for_opportunity": 0,
                  "minimum_sats_for_bid": 1,
                  "never_invent_reward": True,
                  "never_auto_pay": True,
                  "never_auto_spend": True
              },
              "summary": {
                  "tasks_seen": len(tasks),
                  "open_tasks": len(open_tasks),
                  "paid_candidates": len(paid_candidates),
                  "learning_candidates": len(learning_candidates),
                  "already_bid": already_bid_count,
                  "submitted_bids": len(submitted),
                  "bid_errors": len(bid_errors),
                  "blocked": blocked_count
              },
              "paid_candidates": paid_candidates[:MAX_MEMORY_ACTIONS],
              "learning_candidates": learning_candidates[:MAX_MEMORY_ACTIONS],
              "submitted_bids": submitted[:MAX_MEMORY_ACTIONS],
              "bid_errors": bid_errors[:MAX_MEMORY_ACTIONS]
          }

          os.makedirs(os.path.dirname(MEMORY_FILE), exist_ok=True)

          with open(MEMORY_FILE, "w", encoding="utf-8") as handle:
              json.dump(
                  memory,
                  handle,
                  ensure_ascii=False,
                  indent=2
              )

          log(f"Memory saved: {MEMORY_FILE}")

          # ------------------------------------------------------------
          # Final summary
          # ------------------------------------------------------------

          log("==========================================")
          log("NØX ACT15 SUMMARY")
          log("==========================================")
          log(f"Tasks seen:          {len(tasks)}")
          log(f"Open tasks:          {len(open_tasks)}")
          log(f"Paid candidates:     {len(paid_candidates)}")
          log(f"Learning candidates: {len(learning_candidates)}")
          log(f"Already bid:         {already_bid_count}")
          log(f"Bids submitted:      {len(submitted)}")
          log(f"Bid errors:          {len(bid_errors)}")
          log(f"Blocked:             {blocked_count}")
          log("Gemini:              disabled")
          log("Cost:                €0")
          log("==========================================")
          PY

      - name: Commit and push memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "ACT15 V7.1: update marketplace opportunity memory"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              sleep $((attempt * 3))
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts."
          exit 1
