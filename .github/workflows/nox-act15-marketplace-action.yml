name: NØX ACT 15 V6 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    # 6 automatic scans per day.
    # This is NOT a bid limit.
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  autonomous-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      # ==========================================================
      # ENVIRONMENT CHECK
      # ==========================================================

      - name: Verify ACT15 environment
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' '=============================================='
          printf '%s\n' 'NØX ACT15 V6 - ENVIRONMENT CHECK'
          printf '%s\n' '=============================================='

          if [ -z "${COLONY_API_KEY:-}" ]; then
            printf '%s\n' 'ERROR: COLONY_API_KEY is missing.'
            exit 1
          fi

          if [ -f "nox_memory.json" ]; then
            printf '%s\n' 'OK: nox_memory.json exists.'
          else
            printf '%s\n' 'INFO: nox_memory.json will be created.'
          fi

          printf '%s\n' ''
          printf '%s\n' 'Schedule: 6 automatic scans/day'
          printf '%s\n' 'Bid limit: NONE'
          printf '%s\n' 'Strategy: bid on all relevant eligible opportunities'
          printf '%s\n' 'Payments: DISABLED'
          printf '%s\n' 'Cost target: €0'

      # ==========================================================
      # RUN ACT15
      # ==========================================================

      - name: Run NØX ACT15
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import requests


          # ==========================================================
          # NØX ACT15 V6
          # Autonomous Marketplace Bidding
          #
          # PRINCIPLE:
          # 6 scans/day is a wake-up cadence, NOT an action limit.
          #
          # NØX may submit multiple relevant bids during one scan.
          # ==========================================================

          BASE_URL = os.getenv(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.getenv("COLONY_API_KEY")

          MEMORY_FILE = Path("nox_memory.json")

          MIN_BID_SATS = 10

          # NØX proposes 20% of estimated task value.
          BID_PERCENTAGE = 0.20

          MAX_TASKS = 30
          TIMEOUT = 20

          # Small pause between submissions.
          # This is not an action limit.
          BID_DELAY_SECONDS = 1


          # ==========================================================
          # HTTP
          # ==========================================================

          def get_json(response):
              try:
                  return response.json()
              except Exception:
                  return None


          def http_get(url, headers):
              try:
                  return requests.get(
                      url,
                      headers=headers,
                      timeout=TIMEOUT
                  )
              except requests.RequestException as exc:
                  print(f"GET ERROR: {exc}")
                  return None


          def http_post(url, headers, payload):
              try:
                  return requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=TIMEOUT
                  )
              except requests.RequestException as exc:
                  print(f"POST ERROR: {exc}")
                  return None


          # ==========================================================
          # MEMORY
          # ==========================================================

          def load_memory():

              if not MEMORY_FILE.exists():
                  return {
                      "marketplace_actions": []
                  }

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if not isinstance(data, dict):
                      data = {}

                  if not isinstance(
                      data.get("marketplace_actions"),
                      list
                  ):
                      data["marketplace_actions"] = []

                  return data

              except Exception as exc:

                  print(
                      f"WARNING: unable to read memory: {exc}"
                  )

                  return {
                      "marketplace_actions": []
                  }


          def save_memory(memory):

              temp_file = MEMORY_FILE.with_suffix(".tmp")

              with open(
                  temp_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              temp_file.replace(MEMORY_FILE)


          def record_action(memory, action):

              actions = memory.setdefault(
                  "marketplace_actions",
                  []
              )

              actions.append(action)

              # Keep memory bounded.
              if len(actions) > 500:
                  del actions[:-500]

              save_memory(memory)


          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          def authenticate():

              if not API_KEY:
                  print("ERROR: COLONY_API_KEY missing.")
                  sys.exit(1)

              url = f"{BASE_URL}/auth/token"

              response = http_post(
                  url,
                  {
                      "Content-Type": "application/json"
                  },
                  {
                      "api_key": API_KEY
                  }
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"POST {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if not isinstance(data, dict):
                  print("ERROR: invalid authentication response.")
                  sys.exit(1)

              token = (
                  data.get("access_token")
                  or data.get("token")
              )

              if not token:
                  print("ERROR: access token missing.")
                  sys.exit(1)

              return token


          # ==========================================================
          # IDENTITY
          # ==========================================================

          def get_identity(headers):

              url = f"{BASE_URL}/users/me"

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if not isinstance(data, dict):
                  sys.exit(1)

              return data


          # ==========================================================
          # MARKETPLACE TASKS
          # ==========================================================

          def get_tasks(headers):

              url = f"{BASE_URL}/marketplace/tasks"

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if isinstance(data, list):
                  tasks = data

              elif isinstance(data, dict):
                  tasks = (
                      data.get("tasks")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              else:
                  tasks = []

              return tasks[:MAX_TASKS]


          def get_bids(headers, task_id):

              url = (
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/bids"
              )

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  return []

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  return []

              data = get_json(response)

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  return (
                      data.get("bids")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              return []


          # ==========================================================
          # IDENTITY / OWN BID
          # ==========================================================

          def identity_values(identity):

              values = set()

              if not isinstance(identity, dict):
                  return values

              for key in (
                  "id",
                  "user_id",
                  "agent_id",
                  "username",
                  "handle",
                  "name"
              ):

                  value = identity.get(key)

                  if value is not None:
                      values.add(
                          str(value).lower()
                      )

              return values


          def own_bid_exists(bids, identity):

              ids = identity_values(identity)

              for bid in bids:

                  if not isinstance(bid, dict):
                      continue

                  objects = [
                      bid,
                      bid.get("bidder"),
                      bid.get("agent"),
                      bid.get("user")
                  ]

                  for obj in objects:

                      if not isinstance(obj, dict):
                          continue

                      for key in (
                          "id",
                          "user_id",
                          "agent_id",
                          "bidder_id",
                          "creator_id",
                          "username",
                          "handle",
                          "name"
                      ):

                          value = obj.get(key)

                          if value is not None:

                              if (
                                  str(value).lower()
                                  in ids
                              ):
                                  return True

              return False


          # ==========================================================
          # TASK TEXT
          # ==========================================================

          def task_text(task):

              if not isinstance(task, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "description",
                  "body",
                  "content",
                  "details",
                  "reward",
                  "budget"
              ):

                  value = task.get(key)

                  if value is None:
                      continue

                  if isinstance(
                      value,
                      (dict, list)
                  ):

                      try:
                          value = json.dumps(
                              value,
                              ensure_ascii=False
                          )
                      except Exception:
                          continue

                  parts.append(str(value))

              return " ".join(parts)


          # ==========================================================
          # BASIC SAFETY / RELEVANCE FILTER
          # ==========================================================

          BLOCKED_TERMS = (
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "explosive",
              "explosives",
              "malware",
              "ransomware",
              "credential theft",
              "phishing",
              "stolen account",
              "fraud",
              "money laundering",
              "illegal drugs",
              "drugs",
              "hack account",
              "account takeover"
          )


          def safety_check(task):

              text = task_text(task).lower()

              for term in BLOCKED_TERMS:

                  if term in text:

                      return {
                          "safe": False,
                          "reason": (
                              f"blocked_term:{term}"
                          )
                      }

              return {
                  "safe": True,
                  "reason": "no_blocked_term"
              }


          # ==========================================================
          # REWARD EXTRACTION
          # ==========================================================

          def extract_reward(task):

              text = task_text(task)

              normalized = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
              )

              negative_patterns = [

                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*(?:USDC|USD)\b",

                  r"(?<![\w])-\s*\$\s*\d+(?:\.\d+)?",

                  r"\$\s*-\s*\d+(?:\.\d+)?\s*(?:USDC|USD)?\b",

                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*sats?\b"
              ]

              for pattern in negative_patterns:

                  if re.search(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      return {
                          "valid": False,
                          "reason": "negative_reward"
                      }


              # ------------------------------------------------------
              # Structured sat values
              # ------------------------------------------------------

              if isinstance(task, dict):

                  values = []

                  for key in (
                      "reward_sats",
                      "budget_sats",
                      "price_sats",
                      "amount_sats",
                      "max_reward_sats",
                      "min_reward_sats"
                  ):

                      value = task.get(key)

                      try:

                          if value is not None:

                              number = int(
                                  float(value)
                              )

                              if number > 0:
                                  values.append(
                                      number
                                  )

                      except Exception:
                          pass

                  if values:

                      return {
                          "valid": True,
                          "currency": "sats",
                          "reward_sats": min(values),
                          "source": "structured"
                      }


              # ------------------------------------------------------
              # Explicit sats in text
              # ------------------------------------------------------

              sat_values = []

              for match in re.findall(
                  r"\b(\d[\d,]*(?:\.\d+)?)\s*sats?\b",
                  normalized,
                  re.IGNORECASE
              ):

                  try:

                      value = int(
                          float(
                              match.replace(",", "")
                          )
                      )

                      if value > 0:
                          sat_values.append(value)

                  except Exception:
                      pass

              if sat_values:

                  return {
                      "valid": True,
                      "currency": "sats",
                      "reward_sats": min(
                          sat_values
                      ),
                      "source": "task_text"
                  }


              # ------------------------------------------------------
              # Explicit USDC / USD
              # ------------------------------------------------------

              usd_values = []

              patterns = [

                  r"\b(\d+(?:\.\d+)?)\s*(?:USDC|USD)\b",

                  r"\$\s*(\d+(?:\.\d+)?)"
              ]

              for pattern in patterns:

                  for match in re.findall(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      try:

                          value = float(match)

                          if value > 0:
                              usd_values.append(
                                  value
                              )

                      except Exception:
                          pass

              if usd_values:

                  return {
                      "valid": True,
                      "currency": "USDC/USD",
                      "reward_usd": min(
                          usd_values
                      ),
                      "source": "task_text"
                  }


              return {
                  "valid": False,
                  "reason": "reward_not_found"
              }


          # ==========================================================
          # FREE BTC/USD CONVERSION
          # ==========================================================

          def get_btc_usd():

              url = (
                  "https://api.coinbase.com/"
                  "v2/prices/BTC-USD/spot"
              )

              try:

                  response = requests.get(
                      url,
                      timeout=10
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  amount = (
                      data
                      .get("data", {})
                      .get("amount")
                  )

                  rate = float(amount)

                  if rate > 0:
                      return rate

              except Exception:
                  pass

              return None


          def normalize_reward(task):

              reward = extract_reward(task)

              if not reward.get("valid"):
                  return reward

              if reward["currency"] == "sats":
                  return reward

              btc_usd = get_btc_usd()

              if btc_usd is None:

                  return {
                      "valid": False,
                      "reason": "btc_usd_unavailable"
                  }

              reward_sats = int(
                  (
                      reward["reward_usd"]
                      / btc_usd
                  ) * 100_000_000
              )

              reward["reward_sats"] = reward_sats
              reward["btc_usd"] = btc_usd
              reward["source"] = (
                  "task_text_converted"
              )

              return reward


          # ==========================================================
          # CAPABILITY
          # ==========================================================

          KEYWORDS = {

              "python": 3,
              "api": 3,
              "automation": 3,
              "research": 2,
              "data": 2,
              "analysis": 2,
              "qa": 2,
              "testing": 2,
              "smoke test": 2,
              "scraping": 2,
              "web": 1,
              "json": 1,
              "csv": 1,
              "seo": 1,
              "audit": 1,
              "copywriting": 1,
              "documentation": 1,
              "scripts": 2,
              "database": 1,
              "source checks": 2
          }


          def capability_score(task):

              text = task_text(task).lower()

              score = 0

              for keyword, weight in KEYWORDS.items():

                  if keyword in text:
                      score += weight

              return score


          # ==========================================================
          # BID PRICE
          # ==========================================================

          def calculate_bid(reward_sats):

              bid = int(
                  reward_sats
                  * BID_PERCENTAGE
              )

              bid = max(
                  MIN_BID_SATS,
                  bid
              )

              bid = min(
                  reward_sats,
                  bid
              )

              return bid


          # ==========================================================
          # BID DESCRIPTION
          # ==========================================================

          def build_bid_description(
              task,
              bid_sats,
              reward_sats
          ):

              text = task_text(task).lower()

              capabilities = []

              if "python" in text:
                  capabilities.append("Python")

              if "api" in text:
                  capabilities.append("API")

              if (
                  "automation" in text
                  or "scripts" in text
              ):
                  capabilities.append(
                      "automation"
                  )

              if (
                  "qa" in text
                  or "testing" in text
                  or "smoke test" in text
              ):
                  capabilities.append("QA/testing")

              if (
                  "data" in text
                  or "csv" in text
                  or "json" in text
              ):
                  capabilities.append(
                      "data handling"
                  )

              if (
                  "research" in text
                  or "source checks" in text
              ):
                  capabilities.append(
                      "research"
                  )

              if not capabilities:
                  capabilities.append(
                      "relevant task execution"
                  )

              capability_text = ", ".join(
                  capabilities[:4]
              )

              return (
                  "NØX proposes "
                  f"{bid_sats} sats for this task. "
                  f"Relevant capabilities: "
                  f"{capability_text}. "
                  "NØX will provide a concise, "
                  "verifiable result within the "
                  "task scope and report the "
                  "completed work clearly."
              )


          # ==========================================================
          # SUBMIT BID
          # ==========================================================

          def submit_bid(
              headers,
              task_id,
              bid_sats,
              bid_description
          ):

              url = (
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/bid"
              )

              payload = {
                  "bid_amount_sats": bid_sats,
                  "bid_description": bid_description
              }

              print("")
              print("==============================================")
              print("NØX SUBMITTING BID")
              print("==============================================")
              print(
                  f"Task ID: {task_id}"
              )
              print(
                  f"Bid amount: {bid_sats} sats"
              )
              print(
                  f"Bid description: "
                  f"{bid_description}"
              )

              response = http_post(
                  url,
                  {
                      **headers,
                      "Content-Type": "application/json"
                  },
                  payload
              )

              if response is None:

                  return {
                      "success": False,
                      "status": None,
                      "response": None
                  }

              print(
                  f"POST {url} -> "
                  f"{response.status_code}"
              )

              if response.status_code in (
                  200,
                  201
              ):

                  print(
                      "BID SUCCESSFULLY SUBMITTED."
                  )

                  data = get_json(response)

                  if data is not None:

                      print(
                          "Response:",
                          json.dumps(
                              data,
                              ensure_ascii=False
                          )[:2000]
                      )

                  return {
                      "success": True,
                      "status": response.status_code,
                      "response": data
                  }

              print("BID FAILED.")

              print(
                  response.text[:3000]
              )

              return {
                  "success": False,
                  "status": response.status_code,
                  "response": get_json(response)
              }


          # ==========================================================
          # RECORD MARKETPLACE ACTION
          # ==========================================================

          def record_marketplace_action(
              memory,
              task,
              reward,
              bid_sats,
              score,
              result,
              status="submitted"
          ):

              action = {
                  "timestamp": int(
                      time.time()
                  ),
                  "action": "marketplace_bid",
                  "task_id": task.get("id"),
                  "task_title": str(
                      task.get(
                          "title",
                          "Untitled"
                      )
                  ),
                  "estimated_reward_sats": (
                      int(
                          reward.get(
                              "reward_sats",
                              0
                          )
                      )
                  ),
                  "proposed_bid_sats": int(
                      bid_sats
                  ),
                  "proposal_percentage": (
                      BID_PERCENTAGE
                  ),
                  "capability_score": int(
                      score
                  ),
                  "bid_description": (
                      build_bid_description(
                          task,
                          bid_sats,
                          int(
                              reward.get(
                                  "reward_sats",
                                  0
                              )
                          )
                      )
                  ),
                  "http_status": result.get(
                      "status"
                  ),
                  "status": status
              }

              response_data = result.get(
                  "response"
              )

              if isinstance(
                  response_data,
                  dict
              ):

                  bid_id = (
                      response_data.get("id")
                      or response_data.get("bid_id")
                  )

                  if bid_id:
                      action["bid_id"] = bid_id

              record_action(
                  memory,
                  action
              )

              return action


          # ==========================================================
          # MAIN
          # ==========================================================

          def main():

              print("")
              print("==================================================")
              print("NØX ACT 15 V6")
              print("AUTONOMOUS MARKETPLACE BIDDING")
              print("==================================================")
              print("")
              print(
                  f"Minimum bid: "
                  f"{MIN_BID_SATS} sats"
              )
              print(
                  f"Bid strategy: "
                  f"{BID_PERCENTAGE * 100:.0f}% "
                  "of estimated reward"
              )
              print(
                  "Automatic scans: 6/day"
              )
              print(
                  "Bid limit: NONE"
              )
              print(
                  "Payments: DISABLED"
              )
              print("")

              token = authenticate()

              headers = {
                  "Authorization": (
                      f"Bearer {token}"
                  ),
                  "Accept": "application/json"
              }

              identity = get_identity(
                  headers
              )

              print(
                  "NØX identity loaded."
              )

              memory = load_memory()

              tasks = get_tasks(
                  headers
              )

              print("")
              print(
                  f"Tasks scanned: "
                  f"{len(tasks)}"
              )

              candidates = []

              # ------------------------------------------------------
              # DISCOVERY
              # ------------------------------------------------------

              for task in tasks:

                  if not isinstance(
                      task,
                      dict
                  ):
                      continue

                  task_id = task.get("id")

                  if not task_id:
                      continue

                  title = str(
                      task.get(
                          "title",
                          "Untitled"
                      )
                  )

                  print("")
                  print("------------------------------------------")
                  print(
                      f"Task: {title}"
                  )
                  print(
                      f"ID: {task_id}"
                  )

                  status = str(
                      task.get(
                          "status",
                          ""
                      )
                  ).lower()

                  if status not in (
                      "open",
                      "bidding"
                  ):

                      print(
                          f"SKIP status: {status}"
                      )

                      continue

                  # --------------------------------------------------
                  # SAFETY
                  # --------------------------------------------------

                  safety = safety_check(task)

                  if not safety["safe"]:

                      print(
                          "SKIP safety:",
                          safety["reason"]
                      )

                      continue

                  # --------------------------------------------------
                  # REWARD
                  # --------------------------------------------------

                  reward = normalize_reward(
                      task
                  )

                  print(
                      "Reward:",
                      reward
                  )

                  if not reward.get(
                      "valid"
                  ):

                      print(
                          "SKIP reward:",
                          reward.get(
                              "reason"
                          )
                      )

                      continue

                  reward_sats = int(
                      reward.get(
                          "reward_sats",
                          0
                      )
                  )

                  if reward_sats < MIN_BID_SATS:

                      print(
                          "SKIP reward below "
                          f"minimum: "
                          f"{reward_sats} sats"
                      )

                      continue

                  # --------------------------------------------------
                  # EXISTING BID
                  # --------------------------------------------------

                  bids = get_bids(
                      headers,
                      task_id
                  )

                  if own_bid_exists(
                      bids,
                      identity
                  ):

                      print(
                          "SKIP: NØX already "
                          "has a bid"
                      )

                      continue

                  # --------------------------------------------------
                  # CAPABILITY
                  # --------------------------------------------------

                  score = capability_score(
                      task
                  )

                  if score <= 0:

                      print(
                          "SKIP: capability "
                          "score = 0"
                      )

                      continue

                  bid_sats = calculate_bid(
                      reward_sats
                  )

                  bid_description = (
                      build_bid_description(
                          task,
                          bid_sats,
                          reward_sats
                      )
                  )

                  candidates.append({
                      "task": task,
                      "task_id": task_id,
                      "title": title,
                      "reward": reward,
                      "reward_sats": reward_sats,
                      "bid_sats": bid_sats,
                      "bid_description": (
                          bid_description
                      ),
                      "score": score
                  })

              print("")
              print("==================================================")
              print(
                  f"Eligible candidates: "
                  f"{len(candidates)}"
              )
              print("==================================================")

              if not candidates:

                  print(
                      "No suitable task found."
                  )

                  return

              # ------------------------------------------------------
              # RANK ALL CANDIDATES
              #
              # No artificial limit.
              # Every candidate can be bid on.
              # Stronger matches are processed first.
              # ------------------------------------------------------

              candidates.sort(
                  key=lambda x: (
                      x["score"],
                      x["reward_sats"]
                  ),
                  reverse=True
              )

              submitted = 0
              failed = 0
              skipped_race = 0

              # ------------------------------------------------------
              # PROCESS EVERY ELIGIBLE OPPORTUNITY
              # ------------------------------------------------------

              for index, candidate in enumerate(
                  candidates,
                  start=1
              ):

                  task = candidate["task"]
                  task_id = candidate["task_id"]
                  title = candidate["title"]
                  reward = candidate["reward"]
                  reward_sats = candidate["reward_sats"]
                  bid_sats = candidate["bid_sats"]
                  bid_description = candidate[
                      "bid_description"
                  ]
                  score = candidate["score"]

                  print("")
                  print("==================================================")
                  print(
                      f"NØX OPPORTUNITY "
                      f"{index}/{len(candidates)}"
                  )
                  print("==================================================")
                  print(
                      f"Task: {title}"
                  )
                  print(
                      f"Task ID: {task_id}"
                  )
                  print(
                      f"Estimated reward: "
                      f"{reward_sats} sats"
                  )
                  print(
                      f"NØX proposal: "
                      f"{bid_sats} sats"
                  )
                  print(
                      f"Capability score: "
                      f"{score}"
                  )

                  # --------------------------------------------------
                  # FINAL DUPLICATE CHECK
                  #
                  # Protects against another bid appearing
                  # after initial discovery.
                  # --------------------------------------------------

                  latest_bids = get_bids(
                      headers,
                      task_id
                  )

                  if own_bid_exists(
                      latest_bids,
                      identity
                  ):

                      print(
                          "SKIP FINAL CHECK: "
                          "NØX already has a bid."
                      )

                      skipped_race += 1
                      continue

                  # --------------------------------------------------
                  # SUBMIT
                  # --------------------------------------------------

                  result = submit_bid(
                      headers,
                      task_id,
                      bid_sats,
                      bid_description
                  )

                  if result["success"]:

                      record_marketplace_action(
                          memory,
                          task,
                          reward,
                          bid_sats,
                          score,
                          result,
                          status="submitted"
                      )

                      submitted += 1

                      print("")
                      print(
                          "NØX BID RECORDED."
                      )

                  else:

                      record_marketplace_action(
                          memory,
                          task,
                          reward,
                          bid_sats,
                          score,
                          result,
                          status="failed"
                      )

                      failed += 1

                      print("")
                      print(
                          "NØX BID FAILURE "
                          "RECORDED."
                      )

                  # --------------------------------------------------
                  # Avoid unnecessarily rapid consecutive requests.
                  # --------------------------------------------------

                  if index < len(candidates):

                      time.sleep(
                          BID_DELAY_SECONDS
                      )

              # ------------------------------------------------------
              # FINAL SUMMARY
              # ------------------------------------------------------

              print("")
              print("==================================================")
              print("NØX ACT15 V6 RESULT")
              print("==================================================")
              print(
                  f"Tasks scanned: {len(tasks)}"
              )
              print(
                  f"Eligible opportunities: "
                  f"{len(candidates)}"
              )
              print(
                  f"Bids submitted: {submitted}"
              )
              print(
                  f"Bids failed: {failed}"
              )
              print(
                  f"Skipped after re-check: "
                  f"{skipped_race}"
              )
              print(
                  "Daily bid limit: NONE"
              )
              print(
                  "Payment action: NONE"
              )
              print(
                  "Cost: €0"
              )
              print("==================================================")

              # ------------------------------------------------------
              # ACT15 succeeds even when individual bids fail.
              #
              # A marketplace rejection is a result to learn from,
              # not a reason to stop the complete scan.
              # ------------------------------------------------------

              if failed > 0:

                  print(
                      "Some bids failed, but ACT15 completed "
                      "the marketplace scan."
                  )


          if __name__ == "__main__":
              main()
          PY

