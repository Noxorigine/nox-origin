name: NØX ACT 15 V7.1 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai/api/v1
  MEMORY_FILE: memory/nox_act_15_marketplace.json
  MIN_BID_SATS: "10"
  MAX_TASKS: "30"
  MAX_MEMORY_ACTIONS: "500"
  ACTION_DELAY_SECONDS: "1"
  FALLBACK_SATS_PER_USD: "60000"

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT15 V7.1
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MIN_BID_SATS = int(os.environ.get("MIN_BID_SATS", "10"))
          MAX_TASKS = int(os.environ.get("MAX_TASKS", "30"))
          MAX_MEMORY_ACTIONS = int(os.environ.get("MAX_MEMORY_ACTIONS", "500"))
          ACTION_DELAY_SECONDS = float(os.environ.get("ACTION_DELAY_SECONDS", "1"))
          FALLBACK_SATS_PER_USD = int(
              os.environ.get("FALLBACK_SATS_PER_USD", "60000")
          )

          SAFETY_BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "explosive",
              "explosives",
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing",
              "stolen account",
              "account takeover",
              "hack account",
              "fraud",
              "money laundering",
              "illegal drugs",
          ]

          CAPABILITY_KEYWORDS = [
              "python",
              "api",
              "automation",
              "research",
              "data",
              "analysis",
              "qa",
              "testing",
              "smoke test",
              "scraping",
              "web",
              "json",
              "csv",
              "seo",
              "audit",
              "copywriting",
              "documentation",
              "scripts",
              "database",
              "source checks",
          ]

          DOMAIN_KEYWORDS = {
              "virtual_economy": [
                  "marketplace",
                  "economy",
                  "payment",
                  "payments",
                  "reward",
                  "rewards",
                  "sats",
                  "bitcoin",
                  "lightning",
                  "usdc",
                  "usd",
                  "buyer",
                  "seller",
                  "bounty",
              ],
              "cybersecurity": [
                  "security",
                  "cybersecurity",
                  "vulnerability",
                  "pentest",
                  "audit",
                  "threat",
                  "security audit",
              ],
              "ai_communities": [
                  "ai agent",
                  "agents",
                  "agent community",
                  "ai community",
                  "collaboration",
                  "colony",
              ],
              "agent_intelligence_autonomy": [
                  "autonomous",
                  "autonomy",
                  "agent intelligence",
                  "decision making",
                  "decision-making",
                  "learning",
                  "reasoning",
                  "memory",
                  "planning",
              ],
              "emerging_tech": [
                  "emerging technology",
                  "technology",
                  "innovation",
                  "protocol",
                  "blockchain",
                  "machine learning",
              ],
          }

          SESSION = requests.Session()
          SESSION.headers.update(
              {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "NOX-Origin-ACT15-V7.1",
              }
          )


          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def log(message):
              print(f"[ACT15 V7.1] {message}", flush=True)


          def request(method, path, headers=None, **kwargs):
              url = f"{BASE_URL}{path}"

              merged_headers = {}
              if headers:
                  merged_headers.update(headers)

              response = SESSION.request(
                  method,
                  url,
                  headers=merged_headers,
                  timeout=30,
                  **kwargs,
              )

              return response


          def authenticate():
              if not API_KEY:
                  raise RuntimeError("COLONY_API_KEY is missing")

              response = request(
                  "POST",
                  "/auth/token",
                  json={"api_key": API_KEY},
              )

              log(f"Auth token status: {response.status_code}")

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"Authentication failed: {response.status_code} "
                      f"{response.text[:500]}"
                  )

              data = response.json()

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "Authentication succeeded but no JWT token was returned"
                  )

              SESSION.headers.update(
                  {"Authorization": f"Bearer {token}"}
              )

              return token


          def get_identity():
              response = request("GET", "/users/me")

              log(f"Identity status: {response.status_code}")

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"Identity lookup failed: {response.status_code} "
                      f"{response.text[:500]}"
                  )

              data = response.json()

              identity = (
                  data.get("username")
                  or data.get("handle")
                  or data.get("name")
                  or data.get("user", {}).get("username")
                  or data.get("user", {}).get("handle")
              )

              karma = (
                  data.get("karma")
                  or data.get("user", {}).get("karma")
                  or 0
              )

              log(f"Identity: @{identity} | Karma: {karma}")

              return {
                  "identity": identity,
                  "karma": karma,
                  "raw": data,
              }


          def fetch_tasks():
              response = request(
                  "GET",
                  "/marketplace/tasks",
                  params={"limit": MAX_TASKS},
              )

              log(f"Marketplace tasks status: {response.status_code}")

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"Marketplace lookup failed: {response.status_code} "
                      f"{response.text[:500]}"
                  )

              data = response.json()

              if isinstance(data, list):
                  tasks = data
              elif isinstance(data, dict):
                  tasks = (
                      data.get("tasks")
                      or data.get("items")
                      or data.get("results")
                      or []
                  )
              else:
                  tasks = []

              return tasks[:MAX_TASKS]


          def task_text(task):
              parts = []

              for key in [
                  "title",
                  "description",
                  "details",
                  "requirements",
                  "category",
                  "tags",
              ]:
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(str(x) for x in value)
                  elif value is not None:
                      parts.append(str(value))

              return " ".join(parts)


          def parse_number(value):
              if value is None:
                  return None

              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  return float(value)

              text = str(value).strip()

              match = re.search(
                  r"(?<![\d.])(\d+(?:[.,]\d+)?)(?![\d.])",
                  text,
              )

              if not match:
                  return None

              return float(match.group(1).replace(",", "."))


          def extract_reward_sats(task):
              """
              Priority:
              1. Explicit structured sats fields
              2. Explicit sats in task text
              3. Structured USD / USDC fields
              4. Explicit USD / USDC in task text

              This prevents a text such as:
              '1000 sats - $50 USDC'
              from being interpreted as $50 only.

              Example:
              '5 USDC Python/API/data microtask'
              becomes approximately 300000 sats using the configured
              fallback conversion for eligibility.
              """

              structured_sats_fields = [
                  "reward_sats",
                  "budget_sats",
                  "payment_sats",
                  "amount_sats",
                  "reward",
              ]

              for key in structured_sats_fields:
                  if key not in task:
                      continue

                  value = parse_number(task.get(key))

                  if value is not None and value > 0:
                      return int(value), "structured_sats"

              text = task_text(task)

              sats_patterns = [
                  r"(?i)(\d+(?:[.,]\d+)?)\s*(?:sat|sats|satoshi|satoshis)\b",
                  r"(?i)\b(?:sat|sats|satoshi|satoshis)\s*[:=]?\s*(\d+(?:[.,]\d+)?)",
              ]

              sats_values = []

              for pattern in sats_patterns:
                  for match in re.finditer(pattern, text):
                      try:
                          sats_values.append(
                              float(match.group(1).replace(",", "."))
                          )
                      except ValueError:
                          pass

              if sats_values:
                  return int(max(sats_values)), "text_sats"

              structured_usd_fields = [
                  "reward_usdc",
                  "budget_usdc",
                  "payment_usdc",
                  "amount_usdc",
                  "reward_usd",
                  "budget_usd",
                  "payment_usd",
                  "amount_usd",
              ]

              for key in structured_usd_fields:
                  if key not in task:
                      continue

                  value = parse_number(task.get(key))

                  if value is not None and value > 0:
                      sats = int(round(value * FALLBACK_SATS_PER_USD))
                      return sats, "structured_usd_usdc"

              usd_patterns = [
                  r"(?i)\$\s*(\d+(?:[.,]\d+)?)\s*(?:usdc|usd)\b",
                  r"(?i)\b(\d+(?:[.,]\d+)?)\s*(?:usdc|usd)\b",
                  r"(?i)\b(?:usdc|usd)\s*[:=]?\s*(\d+(?:[.,]\d+)?)",
              ]

              usd_values = []

              for pattern in usd_patterns:
                  for match in re.finditer(pattern, text):
                      try:
                          usd_values.append(
                              float(match.group(1).replace(",", "."))
                          )
                      except ValueError:
                          pass

              if usd_values:
                  usd_value = max(usd_values)
                  sats = int(round(usd_value * FALLBACK_SATS_PER_USD))

                  return sats, "text_usd_usdc"

              return None, "unpaid"


          def is_blocked(task):
              text = task_text(task).lower()

              for term in SAFETY_BLOCKED_TERMS:
                  if term in text:
                      return True, term

              return False, None


          def capability_score(task):
              text = task_text(task).lower()

              matches = [
                  keyword
                  for keyword in CAPABILITY_KEYWORDS
                  if keyword in text
              ]

              score = min(len(matches) * 4, 40)

              return score, matches


          def domain_score(task):
              text = task_text(task).lower()

              scores = {}

              for domain, keywords in DOMAIN_KEYWORDS.items():
                  matches = [
                      keyword
                      for keyword in keywords
                      if keyword in text
                  ]

                  scores[domain] = min(len(matches) * 5, 25)

              if not scores:
                  return 0, None

              best_domain = max(
                  scores,
                  key=scores.get,
              )

              return scores[best_domain], best_domain


          def learning_score(task):
              text = task_text(task).lower()

              score = 0

              learning_terms = [
                  "learn",
                  "learning",
                  "research",
                  "experiment",
                  "test",
                  "testing",
                  "analysis",
                  "documentation",
                  "benchmark",
                  "evaluate",
                  "evaluation",
                  "feedback",
                  "agent",
                  "automation",
                  "api",
              ]

              for term in learning_terms:
                  if term in text:
                      score += 5

              return min(score, 25)


          def get_task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("uuid")
              )


          def get_task_status(task):
              return str(
                  task.get("status")
                  or task.get("state")
                  or ""
              ).lower()


          def existing_bid(task_id, identity):
              if not task_id:
                  return False

              response = request(
                  "GET",
                  f"/marketplace/{task_id}/bids",
              )

              if response.status_code == 404:
                  return False

              if response.status_code >= 400:
                  log(
                      f"Bid lookup failed for {task_id}: "
                      f"{response.status_code}"
                  )
                  return False

              try:
                  data = response.json()
              except Exception:
                  return False

              if isinstance(data, list):
                  bids = data
              elif isinstance(data, dict):
                  bids = (
                      data.get("bids")
                      or data.get("items")
                      or data.get("results")
                      or []
                  )
              else:
                  bids = []

              identity_values = {
                  str(identity).lower(),
                  str(identity).lstrip("@").lower(),
              }

              for bid in bids:
                  if not isinstance(bid, dict):
                      continue

                  candidates = [
                      bid.get("username"),
                      bid.get("handle"),
                      bid.get("agent_username"),
                      bid.get("agent_handle"),
                      bid.get("user", {}).get("username")
                      if isinstance(bid.get("user"), dict)
                      else None,
                      bid.get("user", {}).get("handle")
                      if isinstance(bid.get("user"), dict)
                      else None,
                  ]

                  for candidate in candidates:
                      if candidate is None:
                          continue

                      normalized = str(candidate).lstrip("@").lower()

                      if normalized in identity_values:
                          return True

              return False


          def submit_bid(task_id, bid_amount, description):
              payload = {
                  "bid_amount_sats": int(bid_amount),
                  "bid_description": description,
              }

              response = request(
                  "POST",
                  f"/marketplace/{task_id}/bid",
                  json=payload,
              )

              return response


          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "schema_version": "7.1",
                      "workflow": "ACT15_V7.1",
                      "created_at": now_iso(),
                      "actions": [],
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(data, dict):
                      raise ValueError("Memory root is not an object")

                  data.setdefault(
                      "schema_version",
                      "7.1",
                  )

                  data.setdefault(
                      "workflow",
                      "ACT15_V7.1",
                  )

                  data.setdefault(
                      "actions",
                      [],
                  )

                  return data

              except Exception as exc:
                  log(f"Memory read warning: {exc}")

                  return {
                      "schema_version": "7.1",
                      "workflow": "ACT15_V7.1",
                      "created_at": now_iso(),
                      "actions": [],
                  }


          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              memory["updated_at"] = now_iso()

              actions = memory.get("actions", [])

              if len(actions) > MAX_MEMORY_ACTIONS:
                  memory["actions"] = actions[
                      -MAX_MEMORY_ACTIONS:
                  ]

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )


          def main():
              log("Starting ACT15 V7.1")
              log("USDC/USD reward detection enabled")
              log("Unpaid tasks remain learning candidates")
              log("Minimum 10 sats applies only to paid bids")
              log("Payments/spending disabled")
              log("Gemini disabled")
              log(f"Fallback USD conversion: {FALLBACK_SATS_PER_USD} sats/USD")

              authenticate()

              identity_data = get_identity()
              identity = identity_data["identity"]

              tasks = fetch_tasks()

              log(f"Tasks seen: {len(tasks)}")

              open_tasks = [
                  task
                  for task in tasks
                  if get_task_status(task)
                  in {"open", "bidding", "available", "published"}
              ]

              log(f"Open/bidding tasks: {len(open_tasks)}")

              memory = load_memory()

              stats = {
                  "seen": len(tasks),
                  "open": len(open_tasks),
                  "paid_candidates": 0,
                  "learning_candidates": 0,
                  "already_bid": 0,
                  "submitted": 0,
                  "errors": 0,
                  "blocked": 0,
              }

              decisions = []

              for task in open_tasks:
                  task_id = get_task_id(task)

                  if not task_id:
                      continue

                  title = str(
                      task.get("title")
                      or task.get("name")
                      or "Untitled task"
                  )

                  reward_sats, reward_source = extract_reward_sats(task)

                  blocked, blocked_term = is_blocked(task)

                  if blocked:
                      stats["blocked"] += 1

                      decision = {
                          "task_id": task_id,
                          "title": title,
                          "decision": "blocked",
                          "reason": blocked_term,
                          "timestamp": now_iso(),
                      }

                      decisions.append(decision)
                      log(
                          f"BLOCKED: {title} "
                          f"| reason={blocked_term}"
                      )
                      continue

                  cap_score, cap_matches = capability_score(task)
                  dom_score, domain = domain_score(task)
                  learn_score = learning_score(task)

                  total_score = int(
                      cap_score * 0.45
                      + learn_score * 0.25
                      + dom_score * 0.30
                  )

                  already = existing_bid(
                      task_id,
                      identity,
                  )

                  if already:
                      stats["already_bid"] += 1

                  paid_candidate = (
                      reward_sats is not None
                      and reward_sats >= MIN_BID_SATS
                  )

                  if paid_candidate:
                      stats["paid_candidates"] += 1

                      bid_amount = max(
                          MIN_BID_SATS,
                          int(round(reward_sats * 0.20)),
                      )

                      bid_amount = min(
                          bid_amount,
                          reward_sats,
                      )

                      if already:
                          decision_name = "already_bid"
                      elif total_score >= 20:
                          decision_name = "paid_bid_candidate"
                      else:
                          decision_name = "paid_candidate_low_score"

                  else:
                      stats["learning_candidates"] += 1

                      bid_amount = None
                      decision_name = (
                          "learning_candidate_unpaid"
                          if reward_sats is None
                          else "learning_candidate_below_minimum"
                      )

                  decision = {
                      "task_id": task_id,
                      "title": title,
                      "status": get_task_status(task),
                      "reward_sats": reward_sats,
                      "reward_source": reward_source,
                      "capability_score": cap_score,
                      "capability_matches": cap_matches,
                      "learning_score": learn_score,
                      "domain_score": dom_score,
                      "domain": domain,
                      "total_score": total_score,
                      "already_bid": already,
                      "decision": decision_name,
                      "bid_amount_sats": bid_amount,
                      "timestamp": now_iso(),
                  }

                  decisions.append(decision)

                  log(
                      f"{title}"
                      f" | ID={task_id}"
                      f" | reward_sats={reward_sats}"
                      f" | source={reward_source}"
                      f" | capability={cap_score}"
                      f" | learning={learn_score}"
                      f" | domain={dom_score}"
                      f" | total={total_score}"
                      f" | decision={decision_name}"
                  )

                  if (
                      decision_name == "paid_bid_candidate"
                      and not already
                      and bid_amount is not None
                  ):
                      description = (
                          "NØX autonomous marketplace bid. "
                          "Relevant capabilities: "
                          + ", ".join(cap_matches[:8])
                          + ". "
                          "The bid is based on NØX's current "
                          "capability and learning fit."
                      )

                      response = submit_bid(
                          task_id,
                          bid_amount,
                          description,
                      )

                      if response.status_code in {200, 201}:
                          stats["submitted"] += 1

                          decision["submission_status"] = "success"

                          log(
                              f"Bid submitted: "
                              f"{bid_amount} sats "
                              f"for {task_id}"
                          )

                      else:
                          stats["errors"] += 1

                          decision["submission_status"] = "error"
                          decision["submission_http_status"] = (
                              response.status_code
                          )
                          decision["submission_response"] = (
                              response.text[:500]
                          )

                          log(
                              f"Bid error for {task_id}: "
                              f"{response.status_code} "
                              f"{response.text[:300]}"
                          )

                      time.sleep(
                          ACTION_DELAY_SECONDS
                      )

              memory.setdefault(
                  "actions",
                  [],
              )

              memory["actions"].append(
                  {
                      "timestamp": now_iso(),
                      "identity": identity,
                      "stats": stats,
                      "decisions": decisions,
                  }
              )

              memory["latest_run"] = {
                  "timestamp": now_iso(),
                  "identity": identity,
                  "stats": stats,
              }

              save_memory(memory)

              log(
                  "Summary: "
                  f"seen={stats['seen']} "
                  f"open={stats['open']} "
                  f"paid_candidates={stats['paid_candidates']} "
                  f"learning_candidates={stats['learning_candidates']} "
                  f"already_bid={stats['already_bid']} "
                  f"submitted={stats['submitted']} "
                  f"errors={stats['errors']} "
                  f"blocked={stats['blocked']}"
              )

              log(
                  f"Memory saved: {MEMORY_FILE}"
              )


          if __name__ == "__main__":
              main()
          PY

          python /tmp/act15.py

      - name: Commit and push ACT15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "ACT15 V7.1: improve marketplace reward detection"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed."
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 3
          done

          echo "Unable to push after 3 attempts."
          exit 1
