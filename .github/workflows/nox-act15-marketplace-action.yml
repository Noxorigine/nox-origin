name: NØX ACT 15 V9.1 - Autonomous Marketplace Brain

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  autonomous-marketplace:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"

      MIN_BID_SATS: "1"
      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE_ACTIONS: "30"
      MAX_MEMORY_ACTIONS: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run ACT15 V9.1
        run: |
          cat > /tmp/act15_v9_1.py <<'PY'
          import os
          import re
          import json
          import time
          from datetime import datetime, timezone

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          MIN_BID_SATS = int(os.environ.get("MIN_BID_SATS", "1"))
          MAX_TASKS = int(os.environ.get("MAX_TASKS", "100"))
          MAX_BIDS_PER_RUN = int(os.environ.get("MAX_BIDS_PER_RUN", "2"))
          MAX_RECONCILE_ACTIONS = int(os.environ.get("MAX_RECONCILE_ACTIONS", "30"))
          MAX_MEMORY_ACTIONS = int(os.environ.get("MAX_MEMORY_ACTIONS", "1000"))

          MEMORY_PATH = "memory/nox_act_15_marketplace.json"

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })


          def now():
              return datetime.now(timezone.utc).isoformat()


          def first_value(obj, keys):
              if not isinstance(obj, dict):
                  return None
              for key in keys:
                  value = obj.get(key)
                  if value not in (None, ""):
                      return value
              return None


          def api(method, path, **kwargs):
              url = BASE_URL + path
              return session.request(method, url, timeout=30, **kwargs)


          def authenticate():
              response = api(
                  "POST",
                  "/api/v1/auth/token",
                  json={"api_key": API_KEY},
              )
              response.raise_for_status()

              data = response.json()
              token = data.get("access_token") or data.get("token")

              if not token:
                  raise RuntimeError("Authentication succeeded but no JWT was returned")

              session.headers["Authorization"] = f"Bearer {token}"
              return token


          def load_memory():
              os.makedirs(os.path.dirname(MEMORY_PATH), exist_ok=True)

              if not os.path.exists(MEMORY_PATH):
                  return {
                      "act": "ACT15",
                      "version": "V9.1",
                      "created_at": now(),
                      "runs": [],
                      "bids": [],
                      "reconciliation": [],
                  }

              try:
                  with open(MEMORY_PATH, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, dict):
                      raise ValueError("memory root is not an object")

                  data.setdefault("runs", [])
                  data.setdefault("bids", [])
                  data.setdefault("reconciliation", [])
                  return data

              except Exception as exc:
                  print(f"MEMORY WARNING: {exc}")
                  return {
                      "act": "ACT15",
                      "version": "V9.1",
                      "created_at": now(),
                      "memory_recovered": True,
                      "runs": [],
                      "bids": [],
                      "reconciliation": [],
                  }


          def save_memory(memory):
              memory["version"] = "V9.1"
              memory["updated_at"] = now()

              memory["runs"] = memory.get("runs", [])[-MAX_MEMORY_ACTIONS:]
              memory["bids"] = memory.get("bids", [])[-MAX_MEMORY_ACTIONS:]
              memory["reconciliation"] = memory.get(
                  "reconciliation", []
              )[-MAX_MEMORY_ACTIONS:]

              tmp = MEMORY_PATH + ".tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(memory, f, indent=2, ensure_ascii=False)

              os.replace(tmp, MEMORY_PATH)


          def get_task_id(task):
              return first_value(task, [
                  "id",
                  "task_id",
                  "taskId",
                  "uuid",
              ])


          def get_title(task):
              value = first_value(task, [
                  "title",
                  "name",
                  "subject",
              ])
              return str(value or "").strip()


          def get_description(task):
              value = first_value(task, [
                  "description",
                  "body",
                  "content",
                  "details",
              ])
              return str(value or "").strip()


          def get_category(task):
              value = first_value(task, [
                  "category",
                  "type",
                  "task_type",
              ])
              return str(value or "").strip()


          def get_author_text(task):
              author = task.get("author")

              if isinstance(author, dict):
                  values = [
                      author.get("username"),
                      author.get("name"),
                      author.get("display_name"),
                  ]
                  return " ".join(str(x) for x in values if x)

              return str(author or "")


          def task_text(task):
              return " ".join([
                  get_title(task),
                  get_description(task),
                  get_category(task),
                  get_author_text(task),
              ]).strip()


          SUPPLY_PHRASES = [
              "for hire",
              "available for hire",
              "i can do",
              "i can help",
              "i offer",
              "offering",
              "my services",
              "services available",
              "available to work",
              "looking for clients",
          ]

          DEMAND_PHRASES = [
              "need someone",
              "looking for someone",
              "looking for an agent",
              "need an agent",
              "need help",
              "i need",
              "we need",
              "seeking",
              "wanted",
              "request",
              "task required",
              "work needed",
              "hire someone",
              "hiring",
              "paid task",
          ]

          REWARD_SIGNAL_RE = re.compile(
              r"\b\d+(?:\.\d+)?\s*(?:sats?|sat|satoshi|satoshis)\b",
              re.IGNORECASE,
          )


          def has_phrase(text, phrases):
              lowered = text.lower()
              return any(
                  re.search(
                      r"(?<!\w)" + re.escape(phrase) + r"(?!\w)",
                      lowered,
                  )
                  for phrase in phrases
              )


          def classify_direction(task):
              title = get_title(task)
              description = get_description(task)

              text = f"{title} {description}".strip()

              title_supply = has_phrase(title, SUPPLY_PHRASES)
              body_supply = has_phrase(description, SUPPLY_PHRASES)

              title_demand = has_phrase(title, DEMAND_PHRASES)
              body_demand = has_phrase(description, DEMAND_PHRASES)

              structured_paid = False

              for key in [
                  "paid",
                  "is_paid",
                  "paid_task",
                  "reward",
                  "budget",
              ]:
                  value = task.get(key)

                  if isinstance(value, bool) and value:
                      structured_paid = True

                  elif isinstance(value, (int, float)) and value > 0:
                      structured_paid = True

                  elif isinstance(value, dict):
                      for nested_key in [
                          "sats",
                          "amount_sats",
                          "min_sats",
                          "max_sats",
                      ]:
                          nested_value = value.get(nested_key)
                          if isinstance(nested_value, (int, float)) and nested_value > 0:
                              structured_paid = True

              if title_supply:
                  return "SUPPLY", "VERY_HIGH"

              if body_supply and body_demand:
                  return "UNKNOWN", "CONFLICT"

              if body_supply:
                  return "SUPPLY", "HIGH"

              if title_demand or body_demand:
                  return "DEMAND", "HIGH"

              if structured_paid or REWARD_SIGNAL_RE.search(text):
                  return "DEMAND", "LOW"

              return "UNKNOWN", "LOW"


          def parse_reward_range(task):
              title = get_title(task)
              description = get_description(task)
              text = f"{title} {description}"

              candidates = []

              def add(value, source):
                  try:
                      value = int(float(value))
                  except Exception:
                      return

                  if value > 0:
                      candidates.append((value, value, source))

              # Explicit structured sats fields.
              for key in [
                  "reward_sats",
                  "reward_amount_sats",
                  "budget_sats",
                  "min_reward_sats",
                  "max_reward_sats",
              ]:
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      add(value, f"field:{key}")

              for parent_key in ["reward", "budget", "payment"]:
                  parent = task.get(parent_key)

                  if isinstance(parent, dict):
                      min_value = first_value(parent, [
                          "min_sats",
                          "minimum_sats",
                          "min_reward_sats",
                          "amount_sats",
                          "sats",
                      ])

                      max_value = first_value(parent, [
                          "max_sats",
                          "maximum_sats",
                          "max_reward_sats",
                          "amount_sats",
                          "sats",
                      ])

                      if min_value is not None or max_value is not None:
                          try:
                              low = int(float(min_value or max_value))
                              high = int(float(max_value or min_value))
                              if low > 0 and high > 0:
                                  candidates.append(
                                      (min(low, high), max(low, high), f"field:{parent_key}")
                                  )
                          except Exception:
                              pass

              range_patterns = [
                  re.compile(
                      r"\b(\d[\d,]*)\s*(?:-|to)\s*(\d[\d,]*)\s*(?:sats?|sat|satoshi|satoshis)\b",
                      re.IGNORECASE,
                  ),
                  re.compile(
                      r"\b(\d[\d,]*)\s*(?:sats?|sat|satoshi|satoshis)\b",
                      re.IGNORECASE,
                  ),
              ]

              for pattern in range_patterns:
                  for match in pattern.finditer(text):
                      values = [
                          int(x.replace(",", ""))
                          for x in match.groups()
                      ]

                      if len(values) == 1:
                          candidates.append(
                              (values[0], values[0], "text:sats")
                          )
                      elif len(values) == 2:
                          candidates.append(
                              (
                                  min(values[0], values[1]),
                                  max(values[0], values[1]),
                                  "text:sats_range",
                              )
                          )

              if not candidates:
                  return None, None, None

              low, high, source = max(
                  candidates,
                  key=lambda item: item[1],
              )

              return low, high, source


          BLOCKED_TERMS = [
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos attack",
              "steal credentials",
              "bypass authentication",
              "exploit a real target",
              "weapon",
              "explosive",
          ]


          def safety_hits(task):
              text = task_text(task).lower()

              return [
                  term
                  for term in BLOCKED_TERMS
                  if re.search(r"(?<!\w)" + re.escape(term) + r"(?!\w)", text)
              ]


          STRONG_CAPABILITIES = {
              "api": [
                  "rest api",
                  "restful api",
                  "api integration",
                  "api endpoint",
                  "api endpoints",
                  "api development",
                  "api testing",
                  "api client",
                  "webhook",
                  "webhooks",
                  "json api",
              ],
              "python": [
                  "python",
                  "python script",
                  "python development",
                  "python programming",
                  "python code",
              ],
              "coding": [
                  "software development",
                  "software developer",
                  "write code",
                  "coding task",
                  "code implementation",
                  "implement a function",
                  "implement a feature",
                  "debug code",
                  "debugging code",
                  "fix code",
                  "programming task",
                  "develop a script",
                  "develop software",
              ],
              "testing": [
                  "automated testing",
                  "automation testing",
                  "software testing",
                  "api testing",
                  "test automation",
                  "qa testing",
                  "quality assurance",
                  "regression testing",
                  "smoke testing",
              ],
              "research": [
                  "research report",
                  "research task",
                  "market research",
                  "technical research",
                  "web research",
                  "competitive research",
                  "fact checking",
                  "source verification",
                  "conduct research",
                  "perform research",
              ],
              "data": [
                  "data analysis",
                  "data cleaning",
                  "data processing",
                  "data extraction",
                  "data collection",
                  "dataset analysis",
                  "structured data",
                  "csv processing",
                  "analyze data",
                  "clean data",
              ],
              "documentation": [
                  "technical documentation",
                  "api documentation",
                  "documentation task",
                  "documentation update",
                  "write documentation",
                  "technical report",
                  "write a report",
                  "prepare a report",
              ],
              "github": [
                  "github repository",
                  "github repo",
                  "github actions",
                  "github workflow",
                  "pull request",
                  "github issue",
                  "repository changes",
              ],
          }


          WEAK_CAPABILITIES = {
              "coding": [
                  "script",
                  "scripts",
                  "automation",
                  "automate",
                  "tool",
                  "tools",
              ],
              "research": [
                  "research",
                  "investigate",
                  "analysis",
                  "analyze",
              ],
              "documentation": [
                  "document",
                  "documentation",
                  "report",
                  "write-up",
              ],
              "data": [
                  "data",
                  "dataset",
                  "information",
              ],
              "agents": [
                  "agent",
                  "agents",
                  "ai agent",
                  "ai agents",
                  "autonomous agent",
                  "automation agent",
              ],
          }


          def capability_analysis(task):
              text = task_text(task).lower()

              strong = {}
              weak = {}

              for group, phrases in STRONG_CAPABILITIES.items():
                  hits = []

                  for phrase in phrases:
                      if re.search(
                          r"(?<!\w)" + re.escape(phrase) + r"(?!\w)",
                          text,
                      ):
                          hits.append(phrase)

                  if hits:
                      strong[group] = sorted(set(hits))

              for group, phrases in WEAK_CAPABILITIES.items():
                  hits = []

                  for phrase in phrases:
                      if re.search(
                          r"(?<!\w)" + re.escape(phrase) + r"(?!\w)",
                          text,
                      ):
                          hits.append(phrase)

                  if hits:
                      weak[group] = sorted(set(hits))

              # Weak mentions cannot create a capability when the same
              # capability already has strong evidence.
              for group in list(weak.keys()):
                  if group in strong:
                      del weak[group]

              # IMPORTANT:
              # Weak evidence NEVER authorizes a real bid by itself.
              # It is retained only as contextual evidence.
              operational_strong = {
                  group: hits
                  for group, hits in strong.items()
                  if group in {
                      "api",
                      "python",
                      "coding",
                      "testing",
                      "research",
                      "data",
                      "documentation",
                      "github",
                  }
              }

              strong_count = len(operational_strong)

              return {
                  "strong": strong,
                  "weak": weak,
                  "operational_strong": operational_strong,
                  "strong_count": strong_count,
                  "capability_fit": strong_count >= 1,
              }


          def complexity_flags(task):
              text = task_text(task).lower()

              flags = []

              if len(text) > 2500:
                  flags.append("long_spec")

              if len(re.findall(r"\b(?:must|require|required|deliver|deadline)\b", text)) >= 8:
                  flags.append("high_requirements")

              if len(re.findall(r"\b(?:multiple|several|integrate|integration|deploy|production)\b", text)) >= 5:
                  flags.append("multi_step")

              return flags


          def fetch_task_bids(post_id):
              response = api(
                  "GET",
                  f"/api/v1/marketplace/{post_id}/bids",
              )

              if response.status_code != 200:
                  return None

              try:
                  data = response.json()
              except Exception:
                  return None

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in ["bids", "items", "results", "data"]:
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []


          def competition_from_task(post_id):
              bids = fetch_task_bids(post_id)

              if bids is None:
                  return None

              return len(bids)


          def economic_score(low, high):
              if low is None or high is None:
                  return -20

              if high < MIN_BID_SATS:
                  return -30

              if low >= 1000:
                  return 30

              if low >= 500:
                  return 25

              if low >= 100:
                  return 18

              if low >= 50:
                  return 10

              return 5


          def competition_score(competition):
              if competition is None:
                  return 0

              if competition == 0:
                  return 12

              if competition <= 2:
                  return 8

              if competition <= 5:
                  return 4

              if competition <= 10:
                  return 0

              return -8


          def decision_score(
              direction,
              reward_low,
              reward_high,
              capabilities,
              safety,
              complexity,
              competition,
          ):
              if safety:
                  return -100, "blocked_safety"

              if direction != "DEMAND":
                  if direction == "SUPPLY":
                      return -50, "not_demand"
                  return -40, "unknown_direction"

              if reward_low is None or reward_high is None:
                  return -20, "no_verified_lightning_reward"

              if reward_high < MIN_BID_SATS:
                  return -30, "reward_below_minimum"

              # V9.1 hard gate:
              # at least one operational STRONG capability is mandatory.
              if not capabilities["capability_fit"]:
                  return -10, "no_strong_operational_capability"

              score = 35
              score += min(capabilities["strong_count"] * 10, 30)
              score += economic_score(reward_low, reward_high)
              score += competition_score(competition)

              for flag in complexity:
                  if flag == "long_spec":
                      score -= 5
                  elif flag == "high_requirements":
                      score -= 8
                  elif flag == "multi_step":
                      score -= 5

              if score >= 55:
                  return score, "bid_candidate"

              return score, "score_below_threshold"


          def build_bid_amount(reward_low, reward_high):
              if reward_low is None or reward_high is None:
                  return None

              amount = max(MIN_BID_SATS, int(reward_low))

              if amount > reward_high:
                  return None

              return amount


          def build_bid_description(task, capabilities, amount):
              groups = list(capabilities["operational_strong"].keys())

              if not groups:
                  return None

              group_text = ", ".join(groups)

              title = get_title(task)

              description = (
                  f"NØX can contribute on '{title}' using verified capabilities "
                  f"in {group_text}. Proposed bid: {amount} sats. "
                  f"Work would be scoped to the requested deliverable and "
                  f"validated against the task requirements."
              )

              return description[:5000]


          def bid_belongs_to_identity(bid, username):
              if not isinstance(bid, dict):
                  return False

              possible = [
                  bid.get("username"),
                  bid.get("bidder_username"),
                  bid.get("agent_username"),
                  bid.get("author_username"),
              ]

              bidder = bid.get("bidder")

              if isinstance(bidder, dict):
                  possible.extend([
                      bidder.get("username"),
                      bidder.get("name"),
                  ])

              return username in {
                  str(value).strip()
                  for value in possible
                  if value not in (None, "")
              }


          def get_own_bids():
              response = api("GET", "/api/v1/marketplace/tasks")

              if response.status_code != 200:
                  return []

              try:
                  data = response.json()
              except Exception:
                  return []

              if isinstance(data, list):
                  tasks = data
              elif isinstance(data, dict):
                  tasks = (
                      data.get("tasks")
                      or data.get("items")
                      or data.get("results")
                      or data.get("data")
                      or []
                  )
              else:
                  tasks = []

              return tasks


          def reconcile(memory, username):
              accepted = 0
              paid = 0
              checks = 0
              actions = 0

              tasks = get_own_bids()

              for task in tasks:
                  if actions >= MAX_RECONCILE_ACTIONS:
                      break

                  post_id = get_task_id(task)

                  if not post_id:
                      continue

                  bids = fetch_task_bids(post_id)

                  if not bids:
                      continue

                  own_bids = [
                      bid
                      for bid in bids
                      if bid_belongs_to_identity(bid, username)
                  ]

                  if not own_bids:
                      continue

                  for bid in own_bids:
                      actions += 1

                      status = str(
                          first_value(bid, [
                              "status",
                              "state",
                          ]) or ""
                      ).lower()

                      if status in {
                          "accepted",
                          "approved",
                          "winner",
                      }:
                          accepted += 1

                      payment_response = api(
                          "GET",
                          f"/api/v1/marketplace/{post_id}/payment",
                      )

                      payment_status = None

                      if payment_response.status_code == 200:
                          checks += 1

                          try:
                              payment_data = payment_response.json()
                          except Exception:
                              payment_data = {}

                          if isinstance(payment_data, dict):
                              payment_status = first_value(
                                  payment_data,
                                  [
                                      "status",
                                      "payment_status",
                                  ],
                              )

                              if str(payment_status).lower() in {
                                  "paid",
                                  "completed",
                                  "settled",
                              }:
                                  paid += 1

                      memory["reconciliation"].append({
                          "timestamp_utc": now(),
                          "post_id": post_id,
                          "bid_id": first_value(
                              bid,
                              ["id", "bid_id", "uuid"],
                          ),
                          "bid_status": status,
                          "payment_status": payment_status,
                      })

              return {
                  "accepted": accepted,
                  "paid": paid,
                  "payment_checks": checks,
              }


          print("=== NØX ACT15 V9.1 ===")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Spending: DISABLED")
          print("Marketplace: ENABLED")
          print("Real bids: ENABLED")
          print(f"Minimum bid: {MIN_BID_SATS} sats")
          print(f"Maximum bids this run: {MAX_BIDS_PER_RUN}")
          print("Capability gate: STRONG operational capability REQUIRED")
          print("Weak capability evidence: CONTEXT ONLY")
          print("Cost: 0")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          authenticate()

          me_response = api("GET", "/api/v1/users/me")
          me_response.raise_for_status()
          me = me_response.json()

          username = first_value(
              me,
              ["username", "handle", "name"],
          ) or "nox_origine"

          print(f"IDENTITY: {username}")

          memory = load_memory()

          reconciliation = reconcile(memory, username)

          print(
              "RECONCILIATION SUMMARY: "
              + json.dumps(reconciliation, ensure_ascii=False)
          )

          response = api(
              "GET",
              "/api/v1/marketplace/tasks",
              params={"limit": MAX_TASKS},
          )

          response.raise_for_status()

          payload = response.json()

          if isinstance(payload, list):
              tasks = payload
          elif isinstance(payload, dict):
              tasks = (
                  payload.get("tasks")
                  or payload.get("items")
                  or payload.get("results")
                  or payload.get("data")
                  or []
              )
          else:
              tasks = []

          tasks = tasks[:MAX_TASKS]

          print(f"OPEN TASKS RECEIVED: {len(tasks)}")

          run_record = {
              "timestamp_utc": now(),
              "version": "V9.1",
              "tasks_received": len(tasks),
              "bids_attempted": 0,
              "bids_created": [],
              "decisions": [],
              "reconciliation": reconciliation,
          }

          existing_bid_ids = set()

          for old_bid in memory.get("bids", []):
              if isinstance(old_bid, dict):
                  task_id = old_bid.get("task_id")
                  if task_id:
                      existing_bid_ids.add(str(task_id))

          bids_this_run = 0

          for task in tasks:
              post_id = get_task_id(task)

              if not post_id:
                  continue

              title = get_title(task)

              direction, direction_confidence = classify_direction(task)

              reward_low, reward_high, reward_source = parse_reward_range(task)

              capabilities = capability_analysis(task)

              complexity = complexity_flags(task)

              safety = safety_hits(task)

              competition = None

              if direction == "DEMAND" and capabilities["capability_fit"]:
                  competition = competition_from_task(post_id)

              score, reason = decision_score(
                  direction,
                  reward_low,
                  reward_high,
                  capabilities,
                  safety,
                  complexity,
                  competition,
              )

              print()
              print(f"TASK: {title}")
              print(f"ID: {post_id}")
              print(
                  f"DIRECTION: {direction} {direction_confidence}"
              )
              print(
                  f"REWARD: {reward_low} - {reward_high} {reward_source}"
              )
              print(
                  "CAPABILITIES STRONG: "
                  + json.dumps(
                      capabilities["strong"],
                      ensure_ascii=False,
                  )
              )
              print(
                  "CAPABILITIES WEAK: "
                  + json.dumps(
                      capabilities["weak"],
                      ensure_ascii=False,
                  )
              )
              print(
                  f"CAPABILITY FIT: {capabilities['capability_fit']}"
              )
              print(f"COMPETITION: {competition}")
              print(f"DECISION: {score} {reason}")

              decision_record = {
                  "timestamp_utc": now(),
                  "task_id": post_id,
                  "title": title,
                  "direction": direction,
                  "direction_confidence": direction_confidence,
                  "reward_low_sats": reward_low,
                  "reward_high_sats": reward_high,
                  "reward_source": reward_source,
                  "capabilities_strong": capabilities["strong"],
                  "capabilities_weak": capabilities["weak"],
                  "capability_fit": capabilities["capability_fit"],
                  "competition": competition,
                  "complexity": complexity,
                  "safety_hits": safety,
                  "score": score,
                  "reason": reason,
              }

              run_record["decisions"].append(decision_record)

              if reason != "bid_candidate":
                  continue

              if bids_this_run >= MAX_BIDS_PER_RUN:
                  continue

              if str(post_id) in existing_bid_ids:
                  print("BID: SKIPPED already tracked")
                  continue

              amount = build_bid_amount(
                  reward_low,
                  reward_high,
              )

              if amount is None:
                  print("BID: SKIPPED invalid bid amount")
                  continue

              description = build_bid_description(
                  task,
                  capabilities,
                  amount,
              )

              if not description:
                  print("BID: SKIPPED no valid capability description")
                  continue

              print(
                  f"BID: ATTEMPT {amount} sats on {post_id}"
              )

              bid_response = api(
                  "POST",
                  f"/api/v1/marketplace/{post_id}/bid",
                  json={
                      "bid_amount_sats": amount,
                      "bid_description": description,
                  },
              )

              if bid_response.status_code in (200, 201):
                  bids_this_run += 1
                  run_record["bids_attempted"] += 1

                  try:
                      bid_data = bid_response.json()
                  except Exception:
                      bid_data = {}

                  bid_id = first_value(
                      bid_data,
                      ["id", "bid_id", "uuid"],
                  )

                  record = {
                      "timestamp_utc": now(),
                      "task_id": post_id,
                      "task_title": title,
                      "bid_id": bid_id,
                      "bid_amount_sats": amount,
                      "score": score,
                      "reason": reason,
                      "capabilities_strong": capabilities["strong"],
                  }

                  memory["bids"].append(record)
                  run_record["bids_created"].append(record)

                  existing_bid_ids.add(str(post_id))

                  print(
                      "BID: SUCCESS "
                      + json.dumps(
                          {
                              "task_id": post_id,
                              "bid_id": bid_id,
                              "amount_sats": amount,
                          },
                          ensure_ascii=False,
                      )
                  )

              else:
                  print(
                      f"BID: FAILED HTTP {bid_response.status_code}"
                  )

                  try:
                      print(
                          "BID ERROR: "
                          + json.dumps(
                              bid_response.json(),
                              ensure_ascii=False,
                          )
                      )
                  except Exception:
                      print(
                          "BID ERROR: "
                          + bid_response.text[:1000]
                      )

          memory["runs"].append(run_record)

          save_memory(memory)

          print()
          print(
              "RUN SUMMARY: "
              + json.dumps(
                  {
                      "tasks": len(tasks),
                      "bids_attempted": run_record["bids_attempted"],
                      "bids_created": len(run_record["bids_created"]),
                      "accepted": reconciliation["accepted"],
                      "paid": reconciliation["paid"],
                      "cost": 0,
                  },
                  ensure_ascii=False,
              )
          )

          print("=== ACT15 V9.1 COMPLETE ===")
          PY

          python /tmp/act15_v9_1.py

      - name: Commit ACT15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          if git diff --cached --quiet; then
            echo "No ACT15 memory changes to commit."
            exit 0
          fi

          git commit -m "Update ACT15 marketplace memory"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 3
          done

          exit 1
