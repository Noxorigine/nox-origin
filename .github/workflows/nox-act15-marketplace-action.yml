name: NØX ACT 15 V7 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    # 6 automatic scans per day.
    # This is a wake-up cadence, NOT an action limit.
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  autonomous-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      # ==========================================================
      # ENVIRONMENT CHECK
      # ==========================================================

      - name: Verify ACT15 environment
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' '=================================================='
          printf '%s\n' 'NØX ACT15 V7 - ENVIRONMENT CHECK'
          printf '%s\n' '=================================================='

          if [ -z "${COLONY_API_KEY:-}" ]; then
            printf '%s\n' 'ERROR: COLONY_API_KEY is missing.'
            exit 1
          fi

          if [ -f "nox_memory.json" ]; then
            printf '%s\n' 'OK: nox_memory.json exists.'
          else
            printf '%s\n' 'INFO: nox_memory.json will be created.'
          fi

          printf '%s\n' ''
          printf '%s\n' 'Schedule: 6 automatic scans/day'
          printf '%s\n' 'Action limit: NONE'
          printf '%s\n' 'Decision model: economic + learning value'
          printf '%s\n' 'Unpaid tasks: eligible for learning evaluation'
          printf '%s\n' 'Minimum bid: applies ONLY to paid bids'
          printf '%s\n' 'Payments: DISABLED'
          printf '%s\n' 'Cost target: €0'
          printf '%s\n' 'Gemini: DISABLED'

      # ==========================================================
      # RUN ACT15
      # ==========================================================

      - name: Run NØX ACT15 V7
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import requests


          # ==========================================================
          # NØX ACT15 V7
          # AUTONOMOUS MARKETPLACE DECISION
          #
          # CORE PRINCIPLE
          #
          # NØX does not evaluate marketplace opportunities only
          # by immediate monetary reward.
          #
          # A task may have:
          #
          # 1. Explicit economic value
          # 2. Learning value
          # 3. Reputation / collaboration value
          #
          # Therefore:
          #
          # PAID TASK
          #   -> evaluate -> BID when appropriate
          #
          # UNPAID TASK
          #   -> evaluate -> LEARNING_OPPORTUNITY when appropriate
          #
          # NØX NEVER invents a payment amount for an unpaid task.
          #
          # Payments remain DISABLED.
          # ==========================================================


          BASE_URL = os.getenv(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.getenv("COLONY_API_KEY")

          MEMORY_FILE = Path("nox_memory.json")

          # Minimum amount allowed when NØX actually submits
          # a paid marketplace bid.
          #
          # This is NOT a minimum task reward.
          MIN_BID_SATS = 10

          # NØX proposes 20% of the estimated task value.
          BID_PERCENTAGE = 0.20

          MAX_TASKS = 30
          TIMEOUT = 20

          # Small pause between marketplace submissions.
          BID_DELAY_SECONDS = 1


          # ==========================================================
          # DECISION THRESHOLDS
          # ==========================================================

          # Minimum capability score for a paid bid.
          PAID_CAPABILITY_THRESHOLD = 2

          # Minimum capability score for an unpaid learning
          # opportunity.
          FREE_CAPABILITY_THRESHOLD = 2

          # Minimum learning score for an unpaid task to become
          # a recorded learning opportunity.
          LEARNING_THRESHOLD = 2

          # Maximum number of memory records retained.
          MAX_MEMORY_ACTIONS = 500


          # ==========================================================
          # HTTP
          # ==========================================================

          def get_json(response):

              try:
                  return response.json()

              except Exception:
                  return None


          def http_get(url, headers):

              try:

                  return requests.get(
                      url,
                      headers=headers,
                      timeout=TIMEOUT
                  )

              except requests.RequestException as exc:

                  print(
                      f"GET ERROR: {exc}"
                  )

                  return None


          def http_post(url, headers, payload):

              try:

                  return requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=TIMEOUT
                  )

              except requests.RequestException as exc:

                  print(
                      f"POST ERROR: {exc}"
                  )

                  return None


          # ==========================================================
          # MEMORY
          # ==========================================================

          def load_memory():

              if not MEMORY_FILE.exists():

                  return {
                      "marketplace_actions": []
                  }

              try:

                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

                  if not isinstance(
                      data,
                      dict
                  ):

                      data = {}

                  if not isinstance(
                      data.get(
                          "marketplace_actions"
                      ),
                      list
                  ):

                      data[
                          "marketplace_actions"
                      ] = []

                  return data

              except Exception as exc:

                  print(
                      "WARNING: unable to read memory:",
                      exc
                  )

                  return {
                      "marketplace_actions": []
                  }


          def save_memory(memory):

              temp_file = MEMORY_FILE.with_suffix(
                  ".tmp"
              )

              with open(
                  temp_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              temp_file.replace(
                  MEMORY_FILE
              )


          def record_action(
              memory,
              action
          ):

              actions = memory.setdefault(
                  "marketplace_actions",
                  []
              )

              actions.append(
                  action
              )

              if len(actions) > MAX_MEMORY_ACTIONS:

                  del actions[
                      :-MAX_MEMORY_ACTIONS
                  ]

              save_memory(
                  memory
              )


          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          def authenticate():

              if not API_KEY:

                  print(
                      "ERROR: COLONY_API_KEY missing."
                  )

                  sys.exit(1)

              url = (
                  f"{BASE_URL}/auth/token"
              )

              response = http_post(
                  url,
                  {
                      "Content-Type":
                      "application/json"
                  },
                  {
                      "api_key": API_KEY
                  }
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"POST {url} -> "
                  f"{response.status_code}"
              )

              if response.status_code != 200:

                  print(
                      response.text[:2000]
                  )

                  sys.exit(1)

              data = get_json(
                  response
              )

              if not isinstance(
                  data,
                  dict
              ):

                  print(
                      "ERROR: invalid "
                      "authentication response."
                  )

                  sys.exit(1)

              token = (
                  data.get("access_token")
                  or data.get("token")
              )

              if not token:

                  print(
                      "ERROR: access token missing."
                  )

                  sys.exit(1)

              return token


          # ==========================================================
          # IDENTITY
          # ==========================================================

          def get_identity(headers):

              url = (
                  f"{BASE_URL}/users/me"
              )

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> "
                  f"{response.status_code}"
              )

              if response.status_code != 200:

                  print(
                      response.text[:2000]
                  )

                  sys.exit(1)

              data = get_json(
                  response
              )

              if not isinstance(
                  data,
                  dict
              ):

                  sys.exit(1)

              return data


          # ==========================================================
          # MARKETPLACE TASKS
          # ==========================================================

          def get_tasks(headers):

              url = (
                  f"{BASE_URL}/marketplace/tasks"
              )

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> "
                  f"{response.status_code}"
              )

              if response.status_code != 200:

                  print(
                      response.text[:2000]
                  )

                  sys.exit(1)

              data = get_json(
                  response
              )

              if isinstance(
                  data,
                  list
              ):

                  tasks = data

              elif isinstance(
                  data,
                  dict
              ):

                  tasks = (
                      data.get("tasks")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              else:

                  tasks = []

              return tasks[:MAX_TASKS]


          def get_bids(
              headers,
              task_id
          ):

              url = (
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/bids"
              )

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  return []

              print(
                  f"GET {url} -> "
                  f"{response.status_code}"
              )

              if response.status_code != 200:
                  return []

              data = get_json(
                  response
              )

              if isinstance(
                  data,
                  list
              ):

                  return data

              if isinstance(
                  data,
                  dict
              ):

                  return (
                      data.get("bids")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              return []


          # ==========================================================
          # IDENTITY / OWN BID
          # ==========================================================

          def identity_values(
              identity
          ):

              values = set()

              if not isinstance(
                  identity,
                  dict
              ):

                  return values

              for key in (
                  "id",
                  "user_id",
                  "agent_id",
                  "username",
                  "handle",
                  "name"
              ):

                  value = identity.get(
                      key
                  )

                  if value is not None:

                      values.add(
                          str(
                              value
                          ).lower()
                      )

              return values


          def own_bid_exists(
              bids,
              identity
          ):

              ids = identity_values(
                  identity
              )

              for bid in bids:

                  if not isinstance(
                      bid,
                      dict
                  ):

                      continue

                  objects = [
                      bid,
                      bid.get("bidder"),
                      bid.get("agent"),
                      bid.get("user")
                  ]

                  for obj in objects:

                      if not isinstance(
                          obj,
                          dict
                      ):

                          continue

                      for key in (
                          "id",
                          "user_id",
                          "agent_id",
                          "bidder_id",
                          "creator_id",
                          "username",
                          "handle",
                          "name"
                      ):

                          value = obj.get(
                              key
                          )

                          if value is not None:

                              if (
                                  str(
                                      value
                                  ).lower()
                                  in ids
                              ):

                                  return True

              return False


          # ==========================================================
          # TASK TEXT
          # ==========================================================

          def task_text(task):

              if not isinstance(
                  task,
                  dict
              ):

                  return ""

              parts = []

              for key in (
                  "title",
                  "description",
                  "body",
                  "content",
                  "details",
                  "reward",
                  "budget"
              ):

                  value = task.get(
                      key
                  )

                  if value is None:
                      continue

                  if isinstance(
                      value,
                      (dict, list)
                  ):

                      try:

                          value = json.dumps(
                              value,
                              ensure_ascii=False
                          )

                      except Exception:
                          continue

                  parts.append(
                      str(value)
                  )

              return " ".join(
                  parts
              )


          # ==========================================================
          # SAFETY
          # ==========================================================

          BLOCKED_TERMS = (
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "explosive",
              "explosives",
              "malware",
              "ransomware",
              "credential theft",
              "phishing",
              "stolen account",
              "fraud",
              "money laundering",
              "illegal drugs",
              "drugs",
              "hack account",
              "account takeover"
          )


          def safety_check(task):

              text = task_text(
                  task
              ).lower()

              for term in BLOCKED_TERMS:

                  if term in text:

                      return {
                          "safe": False,
                          "reason": (
                              f"blocked_term:{term}"
                          )
                      }

              return {
                  "safe": True,
                  "reason":
                      "no_blocked_term"
              }


          # ==========================================================
          # REWARD EXTRACTION
          #
          # Important:
          #
          # V7 distinguishes:
          #
          # exact reward
          # reward range
          # "from" reward
          # unknown reward
          # no reward
          #
          # No reward does NOT automatically mean SKIP.
          # ==========================================================

          def extract_reward(
              task
          ):

              text = task_text(
                  task
              )

              normalized = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
              )

              # ------------------------------------------------------
              # Negative rewards
              # ------------------------------------------------------

              negative_patterns = [

                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*"
                  r"(?:USDC|USD)\b",

                  r"(?<![\w])-\s*\$\s*\d+(?:\.\d+)?",

                  r"\$\s*-\s*\d+(?:\.\d+)?\s*"
                  r"(?:USDC|USD)?\b",

                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*"
                  r"sats?\b"
              ]

              for pattern in negative_patterns:

                  if re.search(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      return {
                          "valid": False,
                          "type": "invalid",
                          "reason":
                              "negative_reward"
                      }


              # ------------------------------------------------------
              # Structured sats
              # ------------------------------------------------------

              if isinstance(
                  task,
                  dict
              ):

                  values = []

                  for key in (
                      "reward_sats",
                      "budget_sats",
                      "price_sats",
                      "amount_sats",
                      "max_reward_sats",
                      "min_reward_sats"
                  ):

                      value = task.get(
                          key
                      )

                      try:

                          if value is not None:

                              number = int(
                                  float(value)
                              )

                              if number > 0:

                                  values.append(
                                      number
                                  )

                      except Exception:
                          pass

                  if values:

                      return {
                          "valid": True,
                          "type": "exact",
                          "currency": "sats",
                          "reward_sats":
                              min(values),
                          "source":
                              "structured"
                      }


              # ------------------------------------------------------
              # Explicit sats
              # ------------------------------------------------------

              sat_values = []

              for match in re.findall(
                  r"\b(\d[\d,]*(?:\.\d+)?)\s*"
                  r"sats?\b",
                  normalized,
                  re.IGNORECASE
              ):

                  try:

                      value = int(
                          float(
                              match.replace(
                                  ",",
                                  ""
                              )
                          )
                      )

                      if value > 0:
                          sat_values.append(
                              value
                          )

                  except Exception:
                      pass

              if sat_values:

                  # Detect a range such as:
                  # 100-500 sats
                  range_match = re.search(
                      r"(\d[\d,]*(?:\.\d+)?)\s*"
                      r"-\s*"
                      r"(\d[\d,]*(?:\.\d+)?)\s*"
                      r"sats?\b",
                      normalized,
                      re.IGNORECASE
                  )

                  if range_match:

                      low = int(
                          float(
                              range_match.group(
                                  1
                              ).replace(
                                  ",",
                                  ""
                              )
                          )
                      )

                      high = int(
                          float(
                              range_match.group(
                                  2
                              ).replace(
                                  ",",
                                  ""
                              )
                          )
                      )

                      if low > 0 and high >= low:

                          return {
                              "valid": True,
                              "type": "range",
                              "currency": "sats",
                              "reward_sats": low,
                              "reward_min_sats": low,
                              "reward_max_sats": high,
                              "source":
                                  "task_text_range"
                          }

                  return {
                      "valid": True,
                      "type": "exact",
                      "currency": "sats",
                      "reward_sats":
                          min(sat_values),
                      "source":
                          "task_text"
                  }


              # ------------------------------------------------------
              # Explicit USD / USDC
              # ------------------------------------------------------

              usd_values = []

              patterns = [

                  r"\b(\d+(?:\.\d+)?)\s*"
                  r"(?:USDC|USD)\b",

                  r"\$\s*(\d+(?:\.\d+)?)"
              ]

              for pattern in patterns:

                  for match in re.findall(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      try:

                          value = float(
                              match
                          )

                          if value > 0:

                              usd_values.append(
                                  value
                              )

                      except Exception:
                          pass


              if usd_values:

                  # Detect USD ranges.
                  range_match = re.search(
                      r"(?:\$|USD|USDC)\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"-\s*"
                      r"(?:\$|USD|USDC)?\s*"
                      r"(\d+(?:\.\d+)?)",
                      normalized,
                      re.IGNORECASE
                  )

                  if range_match:

                      low_usd = float(
                          range_match.group(
                              1
                          )
                      )

                      high_usd = float(
                          range_match.group(
                              2
                          )
                      )

                      if (
                          low_usd > 0
                          and high_usd >= low_usd
                      ):

                          return {
                              "valid": True,
                              "type": "range",
                              "currency":
                                  "USDC/USD",
                              "reward_usd":
                                  low_usd,
                              "reward_min_usd":
                                  low_usd,
                              "reward_max_usd":
                                  high_usd,
                              "source":
                                  "task_text_range"
                          }


                  # "from $X" is treated as a minimum
                  # advertised value, not as an exact value.

                  from_match = re.search(
                      r"\bfrom\s+\$?\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:USDC|USD)?",
                      normalized,
                      re.IGNORECASE
                  )

                  if from_match:

                      from_usd = float(
                          from_match.group(
                              1
                          )
                      )

                      if from_usd > 0:

                          return {
                              "valid": True,
                              "type": "from",
                              "currency":
                                  "USDC/USD",
                              "reward_usd":
                                  from_usd,
                              "reward_min_usd":
                                  from_usd,
                              "source":
                                  "task_text_from"
                          }

                  return {
                      "valid": True,
                      "type": "exact",
                      "currency":
                          "USDC/USD",
                      "reward_usd":
                          min(usd_values),
                      "source":
                          "task_text"
                  }


              # ------------------------------------------------------
              # No explicit reward
              #
              # This is NOT an error anymore.
              # ------------------------------------------------------

              return {
                  "valid": False,
                  "type": "none",
                  "reason":
                      "reward_not_found"
              }


          # ==========================================================
          # BTC/USD CONVERSION
          # ==========================================================

          def get_btc_usd():

              url = (
                  "https://api.coinbase.com/"
                  "v2/prices/BTC-USD/spot"
              )

              try:

                  response = requests.get(
                      url,
                      timeout=10
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  amount = (
                      data
                      .get("data", {})
                      .get("amount")
                  )

                  rate = float(
                      amount
                  )

                  if rate > 0:
                      return rate

              except Exception:
                  pass

              return None


          def normalize_reward(
              task
          ):

              reward = extract_reward(
                  task
              )

              if not reward.get(
                  "valid"
              ):

                  return reward


              if reward.get(
                  "currency"
              ) == "sats":

                  return reward


              btc_usd = get_btc_usd()

              if btc_usd is None:

                  return {
                      "valid": False,
                      "type":
                          reward.get(
                              "type",
                              "unknown"
                          ),
                      "reason":
                          "btc_usd_unavailable"
                  }


              reward_sats = int(
                  (
                      reward["reward_usd"]
                      / btc_usd
                  ) * 100_000_000
              )

              reward["reward_sats"] = (
                  reward_sats
              )

              reward["btc_usd"] = (
                  btc_usd
              )

              reward["source"] = (
                  reward.get(
                      "source",
                      "task_text"
                  )
                  + "_converted"
              )

              return reward


          # ==========================================================
          # CAPABILITY
          # ==========================================================

          KEYWORDS = {

              "python": 3,
              "api": 3,
              "automation": 3,
              "research": 2,
              "data": 2,
              "analysis": 2,
              "qa": 2,
              "testing": 2,
              "smoke test": 2,
              "scraping": 2,
              "web": 1,
              "json": 1,
              "csv": 1,
              "seo": 1,
              "audit": 1,
              "copywriting": 1,
              "documentation": 1,
              "scripts": 2,
              "database": 1,
              "source checks": 2,
              "agent": 1,
              "ai": 1,
              "machine learning": 2,
              "monitoring": 2
          }


          def capability_score(
              task
          ):

              text = task_text(
                  task
              ).lower()

              score = 0

              for keyword, weight in KEYWORDS.items():

                  if keyword in text:

                      score += weight

              return score


          # ==========================================================
          # LEARNING VALUE
          # ==========================================================

          LEARNING_KEYWORDS = {

              "research": 2,
              "analysis": 2,
              "testing": 2,
              "qa": 2,
              "api": 2,
              "automation": 2,
              "python": 2,
              "data": 2,
              "documentation": 1,
              "agent": 2,
              "ai": 2,
              "collaboration": 3,
              "integration": 2,
              "source": 1,
              "audit": 2,
              "monitoring": 2,
              "security": 1,
              "optimization": 2
          }


          def learning_score(
              task
          ):

              text = task_text(
                  task
              ).lower()

              score = 0

              for keyword, weight in (
                  LEARNING_KEYWORDS.items()
              ):

                  if keyword in text:

                      score += weight

              return score


          # ==========================================================
          # REPUTATION / COLLABORATION VALUE
          # ==========================================================

          REPUTATION_KEYWORDS = {

              "collaboration": 3,
              "agent": 2,
              "community": 2,
              "research": 1,
              "documentation": 1,
              "testing": 1,
              "qa": 1,
              "open source": 2,
              "integration": 2
          }


          def reputation_score(
              task
          ):

              text = task_text(
                  task
              ).lower()

              score = 0

              for keyword, weight in (
                  REPUTATION_KEYWORDS.items()
              ):

                  if keyword in text:

                      score += weight

              return score


          # ==========================================================
          # TASK VALUE
          # ==========================================================

          def evaluate_task(
              task,
              reward
          ):

              capability = (
                  capability_score(
                      task
                  )
              )

              learning = (
                  learning_score(
                      task
                  )
              )

              reputation = (
                  reputation_score(
                      task
                  )
              )

              reward_known = bool(
                  reward.get(
                      "valid"
                  )
              )

              reward_sats = int(
                  reward.get(
                      "reward_sats",
                      0
                  )
              )

              return {
                 
