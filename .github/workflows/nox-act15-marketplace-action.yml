name: NØX ACT 15 - First Marketplace Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-act15:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX ACT 15
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 15 - FIRST MARKETPLACE ACTION")
          print("================================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              try:
                  request_headers = kwargs.pop("headers", headers)

                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=request_headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def extract_tasks(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in [
                      "items",
                      "tasks",
                      "data",
                      "results"
                  ]:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "id",
                  "task_id",
                  "uuid"
              ]:
                  if task.get(key):
                      return task.get(key)

              return None

          def task_title(task):
              if not isinstance(task, dict):
                  return "Untitled task"

              return clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

          def numeric_value(task, keys):
              if not isinstance(task, dict):
                  return None

              for key in keys:
                  value = task.get(key)

                  if value is None:
                      continue

                  if isinstance(
                      value,
                      (int, float)
                  ):
                      return int(value)

                  match = re.search(
                      r"(\d+)",
                      str(value)
                  )

                  if match:
                      return int(
                          match.group(1)
                      )

              return None

          # =================================================
          # AUTHENTICATION
          # =================================================

          print("")
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=30
          )

          print(
              f"POST /auth/token -> "
              f"{auth.status_code}"
          )

          if not auth.ok:
              raise SystemExit(
                  f"Authentication failed: {auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(auth_data, dict)
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization":
                  f"Bearer {token}",
              "Content-Type":
                  "application/json"
          }

          print(
              "Authentication successful."
          )

          # =================================================
          # IDENTITY
          # =================================================

          print("")
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          me = safe_json(me_response)

          username = (
              me.get(
                  "username",
                  "unknown"
              )
              if isinstance(me, dict)
              else "unknown"
          )

          karma = (
              me.get(
                  "karma",
                  "unknown"
              )
              if isinstance(me, dict)
              else "unknown"
          )

          print(
              f"Authenticated agent: "
              f"@{username}"
          )

          print(
              f"Karma: {karma}"
          )

          # =================================================
          # MEMORY
          # =================================================

          print("")
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(
              MEMORY_FILE
          ):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  print(
                      f"Memory warning: {exc}"
                  )

          if not isinstance(
              memory,
              dict
          ):
              memory = {}

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # =================================================
          # ACT 14 GATE
          # =================================================

          print("")
          print(
              "[4] Checking ACT 14 execution gate..."
          )

          execution_plan = memory.get(
              "execution_plan",
              {}
          )

          act14_status = execution_plan.get(
              "status"
          )

          selected_task_id = execution_plan.get(
              "task_id"
          )

          selected_title = execution_plan.get(
              "title"
          )

          print(
              f"ACT 14 status: "
              f"{act14_status}"
          )

          print(
              f"Selected task: "
              f"{selected_task_id}"
          )

          if act14_status != "READY_FOR_ACT15":
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "ACT 14 did not authorize "
                  "READY_FOR_ACT15."
              )

          if not selected_task_id:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "No task ID was provided by ACT 14."
              )

          # =================================================
          # REFRESH MARKETPLACE
          # =================================================

          print("")
          print(
              "[5] Refreshing Marketplace..."
          )

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          if marketplace_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Marketplace request failed."
              )

          if not marketplace_response.ok:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  f"Marketplace returned "
                  f"{marketplace_response.status_code}: "
                  f"{marketplace_response.text}"
              )

          marketplace_data = safe_json(
              marketplace_response
          )

          tasks = extract_tasks(
              marketplace_data
          )

          print(
              f"Tasks detected: "
              f"{len(tasks)}"
          )

          # =================================================
          # LOCATE SELECTED TASK
          # =================================================

          selected_task = None

          for task in tasks:

              if str(
                  task_id(task)
              ) == str(
                  selected_task_id
              ):

                  selected_task = task
                  break

          if selected_task is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Selected task is no longer "
                  "visible on the Marketplace."
              )

          current_status = clean_text(
              selected_task.get(
                  "status",
                  ""
              )
          ).lower()

          current_title = task_title(
              selected_task
          )

          print("")
          print(
              "[6] Selected Marketplace task"
          )

          print(
              f"ID: {task_id(selected_task)}"
          )

          print(
              f"Title: {current_title}"
          )

          print(
              f"Status: {current_status}"
          )

          # =================================================
          # AVAILABILITY GATE
          # =================================================

          if current_status not in [
              "open",
              "bidding"
          ]:

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  f"Task status is "
                  f"'{current_status}', "
                  "not open/bidding."
              )

          # =================================================
          # READ REAL BUDGET
          # =================================================

          print("")
          print(
              "[7] Reading task budget..."
          )

          budget_min = numeric_value(
              selected_task,
              [
                  "budget_min_sats",
                  "min_budget_sats",
                  "reward_min_sats"
              ]
          )

          budget_max = numeric_value(
              selected_task,
              [
                  "budget_max_sats",
                  "max_budget_sats",
                  "reward_max_sats"
              ]
          )

          metadata = selected_task.get(
              "metadata"
          )

          if isinstance(
              metadata,
              dict
          ):

              if budget_min is None:
                  budget_min = numeric_value(
                      metadata,
                      [
                          "budget_min_sats",
                          "min_budget_sats"
                      ]
                  )

              if budget_max is None:
                  budget_max = numeric_value(
                      metadata,
                      [
                          "budget_max_sats",
                          "max_budget_sats"
                      ]
                  )

          print(
              f"Minimum budget: "
              f"{budget_min}"
          )

          print(
              f"Maximum budget: "
              f"{budget_max}"
          )

          # =================================================
          # BID AMOUNT
          # =================================================

          if budget_min is None:
              bid_amount = 21
          else:
              bid_amount = max(
                  21,
                  budget_min
              )

          if (
              budget_max is not None
              and bid_amount > budget_max
          ):

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "No valid bid amount exists "
                  "inside the advertised budget."
              )

          print(
              f"Selected bid amount: "
              f"{bid_amount} sats"
          )

          # =================================================
          # BID DESCRIPTION
          # =================================================

          bid_description = (
              "NØX Origin can complete this task "
              "using its available research, "
              "analysis, structured-data and "
              "workflow capabilities. "
              "NØX will follow the stated requirements, "
              "validate the result, and provide the "
              "requested deliverable."
          )

          if not (
              10
              <= len(bid_description)
              <= 5000
          ):

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid description must contain "
                  "between 10 and 5000 characters."
              )

          print("")
          print(
              "[8] Preparing real Marketplace bid..."
          )

          print(
              f"Bid amount: "
              f"{bid_amount} sats"
          )

          print(
              f"Description length: "
              f"{len(bid_description)} characters"
          )

          # =================================================
          # FINAL SAFETY CHECK
          # =================================================

          print("")
          print(
              "[9] Final execution gate..."
          )

          print(
              "ACT 14 authorization: PASS"
          )

          print(
              "Task availability: PASS"
          )

          print(
              "Bid amount validation: PASS"
          )

          print(
              "Bid description validation: PASS"
          )

          print(
              "REAL MARKETPLACE ACTION: AUTHORIZED"
          )

          # =================================================
          # REAL MARKETPLACE ACTION
          # =================================================

          post_id = task_id(
              selected_task
          )

          endpoint = (
              f"/marketplace/"
              f"{post_id}/bid"
          )

          idempotency_key = (
              f"nox-act15-{post_id}"
          )

          bid_headers = {
              **headers,
              "Idempotency-Key":
                  idempotency_key
          }

          print("")
          print(
              "[10] SUBMITTING REAL BID..."
          )

          print(
              f"POST endpoint: "
              f"{endpoint}"
          )

          bid_response = request(
              "POST",
              endpoint,
              headers=bid_headers,
              json={
                  "bid_amount_sats":
                      bid_amount,

                  "bid_description":
                      bid_description
              }
          )

          if bid_response is None:
              raise SystemExit(
                  "ACT 15 FAILED: "
                  "No response from Marketplace."
              )

          bid_data = safe_json(
              bid_response
          )

          print("")
          print(
              "================================================"
          )

          print(
              "MARKETPLACE ACTION RESULT"
          )

          print(
              "================================================"
          )

          print(
              f"HTTP status: "
              f"{bid_response.status_code}"
          )

          # =================================================
          # SUCCESS
          # =================================================

          if bid_response.status_code == 201:

              bid_id = (
                  bid_data.get("id")
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else None
              )

              bid_status = (
                  bid_data.get(
                      "status",
                      "pending"
                  )
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else "pending"
              )

              returned_amount = (
                  bid_data.get(
                      "bid_amount_sats"
                  )
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else None
              )

              print(
                  "REAL BID SUBMITTED: YES"
              )

              print(
                  f"Bid ID: {bid_id}"
              )

              print(
                  f"Bid status: {bid_status}"
              )

              print(
                  f"Bid amount returned: "
                  f"{returned_amount}"
              )

              action_status = (
                  "BID_SUBMITTED"
              )

              action_success = True

          # =================================================
          # API REJECTION
          # =================================================

          else:

              print(
                  "REAL BID SUBMITTED: NO"
              )

              print(
                  "Marketplace response:"
              )

              print(
                  json.dumps(
                      bid_data,
                      ensure_ascii=False,
                      indent=2
                  )
                  if bid_data is not None
                  else bid_response.text
              )

              action_status = (
                  "BID_FAILED"
              )

              action_success = False

          # =================================================
          # MEMORY
          # =================================================

          bid_id = (
              bid_data.get("id")
              if isinstance(
                  bid_data,
                  dict
              )
              else None
          )

          decision = {
              "decision_id":
                  f"act15-{int(now_dt.timestamp())}",

              "timestamp": now,

              "stage":
                  "real_marketplace_action",

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "bid_amount_sats":
                  bid_amount,

              "bid_id":
                  bid_id,

              "action_status":
                  action_status,

              "http_status":
                  bid_response.status_code,

              "execution_authorized":
                  True,

              "action_taken":
                  action_success,

              "result":
                  (
                      "NØX submitted its first "
                      "real Marketplace bid."
                      if action_success
                      else
                      "NØX attempted its first "
                      "real Marketplace bid, "
                      "but the Marketplace rejected it."
                  )
          }

          learning = {
              "timestamp": now,

              "stage":
                  "ACT15",

              "lesson":
                  (
                      "Autonomous decision becomes "
                      "real-world action when NØX "
                      "submits a Marketplace bid."
                  ),

              "task_id":
                  post_id,

              "action":
                  "submit_bid",

              "amount_sats":
                  bid_amount,

              "result":
                  action_status,

              "important_principle":
                  (
                      "A successful bid is not yet "
                      "a successful task. NØX must "
                      "observe whether the buyer "
                      "accepts the bid and then "
                      "learn from the outcome."
                  ),

              "next_learning_cycle":
                  (
                      "Observe bid outcome, acceptance "
                      "or rejection, then adapt future "
                      "Marketplace choices."
                  )
          }

          memory["version"] = (
              "NØX ACT 15 Marketplace Action"
          )

          memory["last_act"] = "ACT 15"
          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp": now,

              "act": "ACT15",

              "type":
                  "real_marketplace_action",

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "action":
                  "submit_bid",

              "amount_sats":
                  bid_amount,

              "status":
                  action_status
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          memory["marketplace_action"] = {
              "timestamp": now,

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "bid_id":
                  bid_id,

              "bid_amount_sats":
                  bid_amount,

              "status":
                  action_status,

              "http_status":
                  bid_response.status_code,

              "submitted":
                  action_success
          }

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["learning"] = (
              memory["learning"][-50:]
          )

          os.makedirs(
              os.path.dirname(
                  MEMORY_FILE
              ),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # =================================================
          # FINAL RESULT
          # =================================================

          print("")
          print(
              "================================================"
          )

          if action_success:

              print(
                  "ACT 15 SUCCESS"
              )

              print(
                  "NØX HAS ACTED ON THE MARKETPLACE."
              )

              print(
                  "First real bid submitted."
              )

              print(
                  "Status: PENDING"
              )

              print(
                  "The buyer must now accept or reject "
                  "the bid."
              )

          else:

              print(
                  "ACT 15 ACTION ATTEMPTED"
              )

              print(
                  "The Marketplace rejected the bid."
              )

          print(
              "================================================"
          )

          print("")
          print(
              "ACT 15 DOES NOT GUARANTEE PAYMENT."
          )

          print(
              "Payment can only follow acceptance, "
              "successful delivery and settlement."
          )

          PY

      - name: Save NØX ACT 15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 15: first real Marketplace action"
            git push
          fi
