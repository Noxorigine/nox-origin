                          "Recorded as learning candidate."
                      )

                      memory[
                          "actions"
                      ].append(
                          {
                              "timestamp": now_iso(),
                              "action": (
                                  "marketplace_learning_candidate"
                              ),
                              "task_id": tid,
                              "title": tt,
                              "status": st,
                              "decision": (
                                  "no_valid_bid_amount"
                              ),
                              "
