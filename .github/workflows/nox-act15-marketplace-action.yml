name: NØX ACT 15 - First Marketplace Action

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-15-marketplace-action
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX ACT 15
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 15 - FIRST MARKETPLACE ACTION")
          print("================================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              request_headers = kwargs.pop(
                  "headers",
                  headers
              )

              try:
                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=request_headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def extract_tasks(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in [
                      "items",
                      "tasks",
                      "data",
                      "results"
                  ]:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def extract_bids(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in [
                      "items",
                      "bids",
                      "data",
                      "results"
                  ]:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "id",
                  "task_id",
                  "uuid"
              ]:
                  if task.get(key):
                      return task.get(key)

              return None

          def task_title(task):
              if not isinstance(task, dict):
                  return "Untitled task"

              return clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

          def numeric_value(value):
              if value is None:
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  return int(value)

              match = re.search(
                  r"(\d+)",
                  str(value)
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return None

          def read_budget(task):
              minimum = None
              maximum = None

              if not isinstance(task, dict):
                  return minimum, maximum

              for key in [
                  "budget_min_sats",
                  "min_budget_sats",
                  "reward_min_sats"
              ]:
                  if task.get(key) is not None:
                      minimum = numeric_value(
                          task.get(key)
                      )
                      if minimum is not None:
                          break

              for key in [
                  "budget_max_sats",
                  "max_budget_sats",
                  "reward_max_sats"
              ]:
                  if task.get(key) is not None:
                      maximum = numeric_value(
                          task.get(key)
                      )
                      if maximum is not None:
                          break

              metadata = task.get(
                  "metadata"
              )

              if isinstance(
                  metadata,
                  dict
              ):

                  if minimum is None:
                      for key in [
                          "budget_min_sats",
                          "min_budget_sats"
                      ]:
                          if metadata.get(key) is not None:
                              minimum = numeric_value(
                                  metadata.get(key)
                              )
                              if minimum is not None:
                                  break

                  if maximum is None:
                      for key in [
                          "budget_max_sats",
                          "max_budget_sats"
                      ]:
                          if metadata.get(key) is not None:
                              maximum = numeric_value(
                                  metadata.get(key)
                              )
                              if maximum is not None:
                                  break

              return minimum, maximum

          # =================================================
          # 1. AUTHENTICATION
          # =================================================

          print("")
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=30
          )

          print(
              f"POST /auth/token -> "
              f"{auth.status_code}"
          )

          if not auth.ok:
              raise SystemExit(
                  "Authentication failed: "
                  f"{auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get(
                  "access_token"
              )
              if isinstance(
                  auth_data,
                  dict
              )
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization":
                  f"Bearer {token}",
              "Content-Type":
                  "application/json",
              "Accept":
                  "application/json"
          }

          print(
              "Authentication successful."
          )

          # =================================================
          # 2. IDENTITY
          # =================================================

          print("")
          print("[2] Checking identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          if me_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Identity request failed."
              )

          if not me_response.ok:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  f"Identity returned "
                  f"{me_response.status_code}"
              )

          me = safe_json(
              me_response
          )

          username = (
              me.get(
                  "username",
                  "unknown"
              )
              if isinstance(me, dict)
              else "unknown"
          )

          karma = (
              me.get(
                  "karma",
                  "unknown"
              )
              if isinstance(me, dict)
              else "unknown"
          )

          print(
              f"Authenticated agent: "
              f"@{username}"
          )

          print(
              f"Karma: {karma}"
          )

          # =================================================
          # 3. MEMORY
          # =================================================

          print("")
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(
              MEMORY_FILE
          ):
              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  print(
                      f"Memory warning: {exc}"
                  )

          if not isinstance(
              memory,
              dict
          ):
              memory = {}

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # =================================================
          # 4. ACT 14 EXECUTION GATE
          # =================================================

          print("")
          print(
              "[4] Checking ACT 14 execution gate..."
          )

          execution_plan = memory.get(
              "execution_plan",
              {}
          )

          if not isinstance(
              execution_plan,
              dict
          ):
              execution_plan = {}

          act14_status = execution_plan.get(
              "status"
          )

          selected_task_id = execution_plan.get(
              "task_id"
          )

          selected_title = execution_plan.get(
              "title"
          )

          print(
              f"ACT 14 status: "
              f"{act14_status}"
          )

          print(
              f"Selected task: "
              f"{selected_task_id}"
          )

          if act14_status != "READY_FOR_ACT15":
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "ACT 14 did not authorize "
                  "READY_FOR_ACT15."
              )

          if not selected_task_id:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "No task ID was provided "
                  "by ACT 14."
              )

          # =================================================
          # 5. REFRESH MARKETPLACE
          # =================================================

          print("")
          print(
              "[5] Refreshing Marketplace..."
          )

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          if marketplace_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Marketplace request failed."
              )

          if not marketplace_response.ok:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Marketplace returned "
                  f"{marketplace_response.status_code}: "
                  f"{marketplace_response.text}"
              )

          marketplace_data = safe_json(
              marketplace_response
          )

          tasks = extract_tasks(
              marketplace_data
          )

          print(
              f"Tasks detected: "
              f"{len(tasks)}"
          )

          # =================================================
          # 6. LOCATE ACT 14 TASK
          # =================================================

          selected_task = None

          for task in tasks:

              if str(
                  task_id(task)
              ) == str(
                  selected_task_id
              ):

                  selected_task = task
                  break

          if selected_task is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Selected task is no longer "
                  "visible on the Marketplace."
              )

          current_id = task_id(
              selected_task
          )

          current_title = task_title(
              selected_task
          )

          current_status = clean_text(
              selected_task.get(
                  "status",
                  ""
              )
          ).lower()

          print("")
          print(
              "[6] Selected Marketplace task"
          )

          print(
              f"ID: {current_id}"
          )

          print(
              f"Title: {current_title}"
          )

          print(
              f"Status: {current_status}"
          )

          if current_status not in [
              "open",
              "bidding"
          ]:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  f"Task status is "
                  f"'{current_status}', "
                  "not open/bidding."
              )

          # =================================================
          # 7. READ BUDGET
          # =================================================

          print("")
          print(
              "[7] Reading task budget..."
          )

          budget_min, budget_max = read_budget(
              selected_task
          )

          print(
              f"Minimum budget: "
              f"{budget_min}"
          )

          print(
              f"Maximum budget: "
              f"{budget_max}"
          )

          # =================================================
          # 8. CHECK EXISTING BIDS
          # =================================================

          print("")
          print(
              "[8] Checking existing bids..."
          )

          bids_response = request(
              "GET",
              f"/marketplace/{current_id}/bids"
          )

          if bids_response is None:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Could not inspect existing bids."
              )

          if not bids_response.ok:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid inspection returned "
                  f"{bids_response.status_code}: "
                  f"{bids_response.text}"
              )

          bids_data = safe_json(
              bids_response
          )

          bids = extract_bids(
              bids_data
          )

          print(
              f"Existing bids: "
              f"{len(bids)}"
          )

          existing_bid = None

          for bid in bids:

              if not isinstance(
                  bid,
                  dict
              ):
                  continue

              bidder = bid.get(
                  "username"
              )

              if bidder is None:
                  bidder = bid.get(
                      "agent_username"
                  )

              if bidder is None:
                  bidder = bid.get(
                      "bidder_username"
                  )

              bidder_id = bid.get(
                  "agent_id"
              )

              if (
                  str(bidder).lower()
                  == str(username).lower()
              ):
                  existing_bid = bid
                  break

              if (
                  bidder_id is not None
                  and isinstance(
                      me,
                      dict
                  )
                  and str(
                      bidder_id
                  ) == str(
                      me.get("id")
                  )
              ):
                  existing_bid = bid
                  break

          if existing_bid is not None:
              existing_bid_id = existing_bid.get(
                  "id"
              )

              print(
                  "Existing NØX bid detected."
              )

              print(
                  f"Bid ID: "
                  f"{existing_bid_id}"
              )

              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "NØX already has a bid "
                  "on this task."
              )

          print(
              "No existing NØX bid detected."
          )

          # =================================================
          # 9. SELECT BID AMOUNT
          # =================================================

          print("")
          print(
              "[9] Selecting bid amount..."
          )

          if budget_min is not None:

              bid_amount = max(
                  21,
                  budget_min
              )

              print(
                  "Using advertised minimum "
                  "sat budget."
              )

          elif budget_max is not None:

              bid_amount = 21

              print(
                  "No minimum sat budget was "
                  "advertised."
              )

              print(
                  "Using API minimum: 21 sats."
              )

          else:

              bid_amount = 21

              print(
                  "Marketplace task does not "
                  "expose a sat budget."
              )

              print(
                  "No currency conversion is "
                  "being invented."
              )

              print(
                  "Using API minimum: 21 sats."
              )

          if (
              budget_max is not None
              and bid_amount > budget_max
          ):
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Selected bid exceeds "
                  "the advertised maximum."
              )

          if bid_amount < 21:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid amount is below "
                  "the Marketplace minimum."
              )

          print(
              f"Selected bid amount: "
              f"{bid_amount} sats"
          )

          # =================================================
          # 10. PREPARE BID
          # =================================================

          bid_description = (
              "NØX Origin can complete this task "
              "using its available research, "
              "analysis, structured-data and "
              "workflow capabilities. "
              "NØX will follow the stated "
              "requirements, validate the result, "
              "and provide the requested deliverable."
          )

          if not (
              10
              <= len(bid_description)
              <= 5000
          ):
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "Bid description must contain "
                  "between 10 and 5000 characters."
              )

          print("")
          print(
              "[10] Preparing real Marketplace bid..."
          )

          print(
              f"Bid amount: "
              f"{bid_amount} sats"
          )

          print(
              f"Description length: "
              f"{len(bid_description)} characters"
          )

          # =================================================
          # 11. FINAL EXECUTION GATES
          # =================================================

          print("")
          print(
              "[11] Final execution gate..."
          )

          gate_act14 = (
              act14_status
              == "READY_FOR_ACT15"
          )

          gate_task = (
              str(current_id)
              == str(selected_task_id)
          )

          gate_status = (
              current_status
              in ["open", "bidding"]
          )

          gate_bid = (
              bid_amount >= 21
              and (
                  budget_max is None
                  or bid_amount <= budget_max
              )
          )

          gate_description = (
              10
              <= len(bid_description)
              <= 5000
          )

          gate_no_duplicate = (
              existing_bid is None
          )

          print(
              f"ACT14 authorization: "
              f"{gate_act14}"
          )

          print(
              f"Task identity: "
              f"{gate_task}"
          )

          print(
              f"Task availability: "
              f"{gate_status}"
          )

          print(
              f"Bid amount validation: "
              f"{gate_bid}"
          )

          print(
              f"Bid description validation: "
              f"{gate_description}"
          )

          print(
              f"No duplicate NØX bid: "
              f"{gate_no_duplicate}"
          )

          all_gates_pass = all([
              gate_act14,
              gate_task,
              gate_status,
              gate_bid,
              gate_description,
              gate_no_duplicate
          ])

          if not all_gates_pass:
              raise SystemExit(
                  "ACT 15 STOPPED: "
                  "One or more execution gates failed."
              )

          print(
              "REAL MARKETPLACE ACTION: AUTHORIZED"
          )

          # =================================================
          # 12. REAL MARKETPLACE ACTION
          # =================================================

          post_id = current_id

          endpoint = (
              f"/marketplace/"
              f"{post_id}/bid"
          )

          idempotency_key = (
              f"nox-act15-{post_id}"
          )

          bid_headers = {
              **headers,
              "Idempotency-Key":
                  idempotency_key
          }

          print("")
          print(
              "[12] SUBMITTING REAL BID..."
          )

          print(
              f"POST endpoint: "
              f"{endpoint}"
          )

          bid_response = request(
              "POST",
              endpoint,
              headers=bid_headers,
              json={
                  "bid_amount_sats":
                      bid_amount,
                  "bid_description":
                      bid_description
              }
          )

          if bid_response is None:
              raise SystemExit(
                  "ACT 15 FAILED: "
                  "No response from Marketplace."
              )

          bid_data = safe_json(
              bid_response
          )

          # =================================================
          # 13. MARKETPLACE RESULT
          # =================================================

          print("")
          print(
              "================================================"
          )

          print(
              "MARKETPLACE ACTION RESULT"
          )

          print(
              "================================================"
          )

          print(
              f"HTTP status: "
              f"{bid_response.status_code}"
          )

          if bid_response.status_code in [
              200,
              201
          ]:

              bid_id = (
                  bid_data.get("id")
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else None
              )

              bid_status = (
                  bid_data.get(
                      "status",
                      "pending"
                  )
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else "pending"
              )

              returned_amount = (
                  bid_data.get(
                      "bid_amount_sats"
                  )
                  if isinstance(
                      bid_data,
                      dict
                  )
                  else None
              )

              print(
                  "REAL BID SUBMITTED: YES"
              )

              print(
                  f"Bid ID: "
                  f"{bid_id}"
              )

              print(
                  f"Bid status: "
                  f"{bid_status}"
              )

              print(
                  f"Bid amount returned: "
                  f"{returned_amount}"
              )

              action_status = (
                  "BID_SUBMITTED"
              )

              action_success = True

          else:

              print(
                  "REAL BID SUBMITTED: NO"
              )

              print(
                  "Marketplace response:"
              )

              print(
                  json.dumps(
                      bid_data,
                      ensure_ascii=False,
                      indent=2
                  )
                  if bid_data is not None
                  else bid_response.text
              )

              action_status = (
                  "BID_FAILED"
              )

              action_success = False

          # =================================================
          # 14. MEMORY
          # =================================================

          bid_id = (
              bid_data.get("id")
              if isinstance(
                  bid_data,
                  dict
              )
              else None
          )

          decision = {
              "decision_id":
                  f"act15-{int(now_dt.timestamp())}",

              "timestamp":
                  now,

              "stage":
                  "real_marketplace_action",

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "bid_amount_sats":
                  bid_amount,

              "bid_id":
                  bid_id,

              "action_status":
                  action_status,

              "http_status":
                  bid_response.status_code,

              "execution_authorized":
                  True,

              "action_taken":
                  action_success,

              "result":
                  (
                      "NØX submitted its first "
                      "real Marketplace bid."
                      if action_success
                      else
                      "NØX attempted its first "
                      "real Marketplace bid, "
                      "but the Marketplace rejected it."
                  )
          }

          learning = {
              "timestamp":
                  now,

              "stage":
                  "ACT15",

              "lesson":
                  (
                      "Autonomous decision becomes "
                      "real-world action when NØX "
                      "submits a Marketplace bid."
                  ),

              "task_id":
                  post_id,

              "action":
                  "submit_bid",

              "amount_sats":
                  bid_amount,

              "result":
                  action_status,

              "important_principle":
                  (
                      "A successful bid is not yet "
                      "a successful task. NØX must "
                      "observe whether the buyer "
                      "accepts the bid and then "
                      "learn from the outcome."
                  ),

              "next_learning_cycle":
                  (
                      "Observe bid outcome, acceptance "
                      "or rejection, then adapt future "
                      "Marketplace choices."
                  )
          }

          memory["version"] = (
              "NØX ACT 15 Marketplace Action"
          )

          memory["last_act"] = "ACT 15"

          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp":
                  now,

              "act":
                  "ACT15",

              "type":
                  "real_marketplace_action",

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "action":
                  "submit_bid",

              "amount_sats":
                  bid_amount,

              "status":
                  action_status
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          memory["marketplace_action"] = {
              "timestamp":
                  now,

              "task_id":
                  post_id,

              "task_title":
                  current_title,

              "bid_id":
                  bid_id,

              "bid_amount_sats":
                  bid_amount,

              "status":
                  action_status,

              "http_status":
                  bid_response.status_code,

              "submitted":
                  action_success
          }

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["learning"] = (
              memory["learning"][-50:]
          )

          os.makedirs(
              os.path.dirname(
                  MEMORY_FILE
              ),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # =================================================
          # 15. FINAL RESULT
          # =================================================

          print("")
          print(
              "================================================"
          )

          if action_success:

              print(
                  "ACT 15 SUCCESS"
              )

              print(
                  "NØX HAS ACTED ON THE MARKETPLACE."
              )

              print(
                  "First real bid submitted."
              )

              print(
                  "Status: PENDING"
              )

              print(
                  "The buyer must now accept or reject "
                  "the bid."
              )

          else:

              print(
                  "ACT 15 ACTION ATTEMPTED"
              )

              print(
                  "The Marketplace rejected the bid."
              )

          print(
              "================================================"
          )

          print("")

          print(
              "ACT 15 DOES NOT GUARANTEE PAYMENT."
          )

          print(
              "Payment can only follow acceptance, "
              "successful delivery and settlement."
          )

          PY

      - name: Save NØX ACT 15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 15: first real Marketplace action"
            git push
          fi
