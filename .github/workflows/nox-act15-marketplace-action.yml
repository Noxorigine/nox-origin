name: NØX ACT 15 V5 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  autonomous-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Verify ACT15 environment
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - ENVIRONMENT CHECK"
          echo "=============================================="

          if [ -z "$COLONY_API_KEY" ]; then
            echo "ERROR: COLONY_API_KEY is missing."
            exit 1
          fi

          if [ -f "nox_memory.json" ]; then
            echo "OK: nox_memory.json exists."
          else
            echo "INFO: nox_memory.json will be created."
          fi

      - name: Run NØX ACT15
        run: |
          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import requests


          # ==========================================================
          # NØX ACT15 V5
          # Autonomous Marketplace Bidding
          # ==========================================================

          BASE_URL = os.getenv(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.getenv("COLONY_API_KEY")

          MEMORY_FILE = Path("nox_memory.json")

          MIN_BID_SATS = 10

          # NØX proposes 20% of estimated task value.
          BID_PERCENTAGE = 0.20

          MAX_TASKS = 30
          TIMEOUT = 20


          # ==========================================================
          # HTTP
          # ==========================================================

          def get_json(response):
              try:
                  return response.json()
              except Exception:
                  return None


          def http_get(url, headers):
              try:
                  return requests.get(
                      url,
                      headers=headers,
                      timeout=TIMEOUT
                  )
              except requests.RequestException as exc:
                  print(f"GET ERROR: {exc}")
                  return None


          def http_post(url, headers, payload):
              try:
                  return requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=TIMEOUT
                  )
              except requests.RequestException as exc:
                  print(f"POST ERROR: {exc}")
                  return None


          # ==========================================================
          # MEMORY
          # ==========================================================

          def load_memory():

              if not MEMORY_FILE.exists():
                  return {
                      "marketplace_actions": []
                  }

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if not isinstance(data, dict):
                      data = {}

                  if not isinstance(
                      data.get("marketplace_actions"),
                      list
                  ):
                      data["marketplace_actions"] = []

                  return data

              except Exception as exc:

                  print(
                      f"WARNING: unable to read memory: {exc}"
                  )

                  return {
                      "marketplace_actions": []
                  }


          def save_memory(memory):

              temp_file = MEMORY_FILE.with_suffix(".tmp")

              with open(
                  temp_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              temp_file.replace(MEMORY_FILE)


          def record_action(memory, action):

              actions = memory.setdefault(
                  "marketplace_actions",
                  []
              )

              actions.append(action)

              if len(actions) > 500:
                  del actions[:-500]

              save_memory(memory)


          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          def authenticate():

              if not API_KEY:
                  print("ERROR: COLONY_API_KEY missing.")
                  sys.exit(1)

              url = f"{BASE_URL}/auth/token"

              response = http_post(
                  url,
                  {
                      "Content-Type": "application/json"
                  },
                  {
                      "api_key": API_KEY
                  }
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"POST {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if not isinstance(data, dict):
                  print("ERROR: invalid authentication response.")
                  sys.exit(1)

              token = (
                  data.get("access_token")
                  or data.get("token")
              )

              if not token:
                  print("ERROR: access token missing.")
                  sys.exit(1)

              return token


          # ==========================================================
          # IDENTITY
          # ==========================================================

          def get_identity(headers):

              url = f"{BASE_URL}/users/me"

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if not isinstance(data, dict):
                  sys.exit(1)

              return data


          # ==========================================================
          # MARKETPLACE TASKS
          # ==========================================================

          def get_tasks(headers):

              url = f"{BASE_URL}/marketplace/tasks"

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  sys.exit(1)

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  print(response.text[:2000])
                  sys.exit(1)

              data = get_json(response)

              if isinstance(data, list):
                  tasks = data

              elif isinstance(data, dict):
                  tasks = (
                      data.get("tasks")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              else:
                  tasks = []

              return tasks[:MAX_TASKS]


          def get_bids(headers, task_id):

              url = (
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/bids"
              )

              response = http_get(
                  url,
                  headers
              )

              if response is None:
                  return []

              print(
                  f"GET {url} -> {response.status_code}"
              )

              if response.status_code != 200:
                  return []

              data = get_json(response)

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  return (
                      data.get("bids")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              return []


          # ==========================================================
          # IDENTITY / OWN BID
          # ==========================================================

          def identity_values(identity):

              values = set()

              if not isinstance(identity, dict):
                  return values

              for key in (
                  "id",
                  "user_id",
                  "agent_id",
                  "username",
                  "handle",
                  "name"
              ):

                  value = identity.get(key)

                  if value is not None:
                      values.add(
                          str(value).lower()
                      )

              return values


          def own_bid_exists(bids, identity):

              ids = identity_values(identity)

              for bid in bids:

                  if not isinstance(bid, dict):
                      continue

                  objects = [
                      bid,
                      bid.get("bidder"),
                      bid.get("agent"),
                      bid.get("user")
                  ]

                  for obj in objects:

                      if not isinstance(obj, dict):
                          continue

                      for key in (
                          "id",
                          "user_id",
                          "agent_id",
                          "bidder_id",
                          "creator_id",
                          "username",
                          "handle",
                          "name"
                      ):

                          value = obj.get(key)

                          if value is not None:

                              if (
                                  str(value).lower()
                                  in ids
                              ):
                                  return True

              return False


          # ==========================================================
          # TASK TEXT
          # ==========================================================

          def task_text(task):

              if not isinstance(task, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "description",
                  "body",
                  "content",
                  "details",
                  "reward",
                  "budget"
              ):

                  value = task.get(key)

                  if value is None:
                      continue

                  if isinstance(
                      value,
                      (dict, list)
                  ):

                      try:
                          value = json.dumps(
                              value,
                              ensure_ascii=False
                          )
                      except Exception:
                          continue

                  parts.append(str(value))

              return " ".join(parts)


          # ==========================================================
          # REWARD EXTRACTION
          # ==========================================================

          def extract_reward(task):

              text = task_text(task)

              normalized = (
                  text
                  .replace("−", "-")
                  .replace("–", "-")
              )

              # ------------------------------------------------------
              # IMPORTANT:
              # Only reject an explicitly negative monetary amount.
              #
              # A normal bullet such as:
              # "- Python/JS/API..."
              #
              # is NOT a negative reward.
              # ------------------------------------------------------

              negative_patterns = [

                  # -30 USDC
                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*(?:USDC|USD)\b",

                  # -$30 / - $30
                  r"(?<![\w])-\s*\$\s*\d+(?:\.\d+)?",

                  # $-30
                  r"\$\s*-\s*\d+(?:\.\d+)?\s*(?:USDC|USD)?\b",

                  # -30 sats
                  r"(?<![\w])-\s*\d+(?:\.\d+)?\s*sats?\b"
              ]

              for pattern in negative_patterns:

                  if re.search(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      return {
                          "valid": False,
                          "reason": "negative_reward"
                      }


              # ------------------------------------------------------
              # Structured sat values
              # ------------------------------------------------------

              if isinstance(task, dict):

                  values = []

                  for key in (
                      "reward_sats",
                      "budget_sats",
                      "price_sats",
                      "amount_sats",
                      "max_reward_sats",
                      "min_reward_sats"
                  ):

                      value = task.get(key)

                      try:

                          if value is not None:

                              number = int(
                                  float(value)
                              )

                              if number > 0:
                                  values.append(
                                      number
                                  )

                      except Exception:
                          pass

                  if values:

                      return {
                          "valid": True,
                          "currency": "sats",
                          "reward_sats": min(values),
                          "source": "structured"
                      }


              # ------------------------------------------------------
              # Explicit sats in text
              # ------------------------------------------------------

              sat_values = []

              for match in re.findall(
                  r"\b(\d[\d,]*(?:\.\d+)?)\s*sats?\b",
                  normalized,
                  re.IGNORECASE
              ):

                  try:

                      value = int(
                          float(
                              match.replace(",", "")
                          )
                      )

                      if value > 0:
                          sat_values.append(value)

                  except Exception:
                      pass

              if sat_values:

                  return {
                      "valid": True,
                      "currency": "sats",
                      "reward_sats": min(
                          sat_values
                      ),
                      "source": "task_text"
                  }


              # ------------------------------------------------------
              # Explicit USDC / USD
              # ------------------------------------------------------

              usd_values = []

              patterns = [

                  # 5 USDC
                  r"\b(\d+(?:\.\d+)?)\s*(?:USDC|USD)\b",

                  # $5 USDC / $5
                  r"\$\s*(\d+(?:\.\d+)?)"
              ]

              for pattern in patterns:

                  for match in re.findall(
                      pattern,
                      normalized,
                      re.IGNORECASE
                  ):

                      try:

                          value = float(match)

                          if value > 0:
                              usd_values.append(
                                  value
                              )

                      except Exception:
                          pass

              if usd_values:

                  return {
                      "valid": True,
                      "currency": "USDC/USD",
                      "reward_usd": min(
                          usd_values
                      ),
                      "source": "task_text"
                  }


              return {
                  "valid": False,
                  "reason": "reward_not_found"
              }


          # ==========================================================
          # FREE BTC/USD CONVERSION
          # ==========================================================

          def get_btc_usd():

              url = (
                  "https://api.coinbase.com/"
                  "v2/prices/BTC-USD/spot"
              )

              try:

                  response = requests.get(
                      url,
                      timeout=10
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  amount = (
                      data
                      .get("data", {})
                      .get("amount")
                  )

                  rate = float(amount)

                  if rate > 0:
                      return rate

              except Exception:
                  pass

              return None


          def normalize_reward(task):

              reward = extract_reward(task)

              if not reward.get("valid"):
                  return reward

              if reward["currency"] == "sats":
                  return reward

              btc_usd = get_btc_usd()

              if btc_usd is None:

                  return {
                      "valid": False,
                      "reason": "btc_usd_unavailable"
                  }

              reward_sats = int(
                  (
                      reward["reward_usd"]
                      / btc_usd
                  ) * 100_000_000
              )

              reward["reward_sats"] = reward_sats
              reward["btc_usd"] = btc_usd
              reward["source"] = (
                  "task_text_converted"
              )

              return reward


          # ==========================================================
          # CAPABILITY
          # ==========================================================

          KEYWORDS = {

              "python": 3,
              "api": 3,
              "automation": 3,
              "research": 2,
              "data": 2,
              "analysis": 2,
              "qa": 2,
              "testing": 2,
              "smoke test": 2,
              "scraping": 2,
              "web": 1,
              "json": 1,
              "csv": 1,
              "seo": 1,
              "audit": 1,
              "copywriting": 1,
              "documentation": 1,
              "scripts": 2,
              "database": 1,
              "source checks": 2
          }


          def capability_score(task):

              text = task_text(task).lower()

              score = 0

              for keyword, weight in KEYWORDS.items():

                  if keyword in text:
                      score += weight

              return score


          # ==========================================================
          # BID PRICE
          # ==========================================================

          def calculate_bid(reward_sats):

              bid = int(
                  reward_sats
                  * BID_PERCENTAGE
              )

              bid = max(
                  MIN_BID_SATS,
                  bid
              )

              bid = min(
                  reward_sats,
                  bid
              )

              return bid


          # ==========================================================
          # BID DESCRIPTION
          # ==========================================================

          def build_bid_description(
              task,
              bid_sats,
              reward_sats
          ):

              text = task_text(task).lower()

              capabilities = []

              if "python" in text:
                  capabilities.append("Python")

              if "api" in text:
                  capabilities.append("API")

              if (
                  "automation" in text
                  or "scripts" in text
              ):
                  capabilities.append(
                      "automation"
                  )

              if (
                  "qa" in text
                  or "testing" in text
                  or "smoke test" in text
              ):
                  capabilities.append("QA/testing")

              if (
                  "data" in text
                  or "csv" in text
                  or "json" in text
              ):
                  capabilities.append(
                      "data handling"
                  )

              if (
                  "research" in text
                  or "source checks" in text
              ):
                  capabilities.append(
                      "research"
                  )

              if not capabilities:
                  capabilities.append(
                      "relevant task execution"
                  )

              capability_text = ", ".join(
                  capabilities[:4]
              )

              return (
                  "NØX proposes "
                  f"{bid_sats} sats for this task. "
                  f"Relevant capabilities: "
                  f"{capability_text}. "
                  "NØX will provide a concise, "
                  "verifiable result within the "
                  "task scope and report the "
                  "completed work clearly."
              )


          # ==========================================================
          # SUBMIT BID
          # ==========================================================

          def submit_bid(
              headers,
              task_id,
              bid_sats,
              bid_description
          ):

              url = (
                  f"{BASE_URL}/marketplace/"
                  f"{task_id}/bid"
              )

              payload = {
                  "bid_amount_sats": bid_sats,
                  "bid_description": bid_description
              }

              print("")
              print("==============================================")
              print("NØX SUBMITTING BID")
              print("==============================================")
              print(
                  f"Task ID: {task_id}"
              )
              print(
                  f"Bid amount: {bid_sats} sats"
              )
              print(
                  f"Bid description: "
                  f"{bid_description}"
              )

              response = http_post(
                  url,
                  {
                      **headers,
                      "Content-Type": "application/json"
                  },
                  payload
              )

              if response is None:

                  return {
                      "success": False,
                      "status": None,
                      "response": None
                  }

              print(
                  f"POST {url} -> "
                  f"{response.status_code}"
              )

              # ------------------------------------------------------
              # 200 / 201 = SUCCESS
              # ------------------------------------------------------

              if response.status_code in (
                  200,
                  201
              ):

                  print(
                      "BID SUCCESSFULLY SUBMITTED."
                  )

                  data = get_json(response)

                  if data is not None:

                      print(
                          "Response:",
                          json.dumps(
                              data,
                              ensure_ascii=False
                          )[:2000]
                      )

                  else:

                      print(
                          "Response body empty/non-JSON."
                      )

                  return {
                      "success": True,
                      "status": response.status_code,
                      "response": data
                  }

              print("BID FAILED.")

              print(
                  response.text[:3000]
              )

              return {
                  "success": False,
                  "status": response.status_code,
                  "response": get_json(response)
              }


          # ==========================================================
          # MAIN
          # ==========================================================

          def main():

              print("")
              print("==================================================")
              print("NØX ACT 15 V5")
              print("AUTONOMOUS MARKETPLACE BIDDING")
              print("==================================================")
              print("")
              print(
                  f"Minimum bid: "
                  f"{MIN_BID_SATS} sats"
              )
              print(
                  f"Bid strategy: "
                  f"{BID_PERCENTAGE * 100:.0f}% "
                  "of estimated reward"
              )
              print("")

              token = authenticate()

              headers = {
                  "Authorization": (
                      f"Bearer {token}"
                  ),
                  "Accept": "application/json"
              }

              identity = get_identity(
                  headers
              )

              print(
                  "NØX identity loaded."
              )

              memory = load_memory()

              tasks = get_tasks(
                  headers
              )

              print("")
              print(
                  f"Tasks scanned: "
                  f"{len(tasks)}"
              )

              candidates = []

              for task in tasks:

                  if not isinstance(
                      task,
                      dict
                  ):
                      continue

                  task_id = task.get("id")

                  if not task_id:
                      continue

                  title = str(
                      task.get(
                          "title",
                          "Untitled"
                      )
                  )

                  print("")
                  print("------------------------------------------")
                  print(
                      f"Task: {title}"
                  )
                  print(
                      f"ID: {task_id}"
                  )

                  status = str(
                      task.get(
                          "status",
                          ""
                      )
                  ).lower()

                  if status not in (
                      "open",
                      "bidding"
                  ):

                      print(
                          f"SKIP status: {status}"
                      )

                      continue

                  reward = normalize_reward(
                      task
                  )

                  print(
                      "Reward:",
                      reward
                  )

                  if not reward.get(
                      "valid"
                  ):

                      print(
                          "SKIP reward:",
                          reward.get(
                              "reason"
                          )
                      )

                      continue

                  reward_sats = int(
                      reward.get(
                          "reward_sats",
                          0
                      )
                  )

                  if reward_sats < MIN_BID_SATS:

                      print(
                          "SKIP reward below "
                          f"minimum: "
                          f"{reward_sats} sats"
                      )

                      continue

                  bids = get_bids(
                      headers,
                      task_id
                  )

                  if own_bid_exists(
                      bids,
                      identity
                  ):

                      print(
                          "SKIP: NØX already "
                          "has a bid"
                      )

                      continue

                  score = capability_score(
                      task
                  )

                  if score <= 0:

                      print(
                          "SKIP: capability "
                          "score = 0"
                      )

                      continue

                  bid_sats = calculate_bid(
                      reward_sats
                  )

                  bid_description = (
                      build_bid_description(
                          task,
                          bid_sats,
                          reward_sats
                      )
                  )

                  candidates.append({
                      "task_id": task_id,
                      "title": title,
                      "reward": reward,
                      "reward_sats": reward_sats,
                      "bid_sats": bid_sats,
                      "bid_description": (
                          bid_description
                      ),
                      "score": score
                  })

              print("")
              print("==================================================")
              print(
                  f"Eligible candidates: "
                  f"{len(candidates)}"
              )
              print("==================================================")

              if not candidates:

                  print(
                      "No suitable task found."
                  )

                  return

              # ------------------------------------------------------
              # Select strongest match:
              # 1. capability
              # 2. reward
              # ------------------------------------------------------

              candidates.sort(
                  key=lambda x: (
                      x["score"],
                      x["reward_sats"]
                  ),
                  reverse=True
              )

              selected = candidates[0]

              task_id = selected[
                  "task_id"
              ]

              title = selected[
                  "title"
              ]

              reward = selected[
                  "reward"
              ]

              reward_sats = selected[
                  "reward_sats"
              ]

              bid_sats = selected[
                  "bid_sats"
              ]

              bid_description = selected[
                  "bid_description"
              ]

              score = selected[
                  "score"
              ]

              print("")
              print("==================================================")
              print("NØX SELECTED TASK")
              print("==================================================")
              print(
                  f"Task: {title}"
              )
              print(
                  f"Task ID: {task_id}"
              )
              print(
                  f"Estimated reward: "
                  f"{reward_sats} sats"
              )
              print(
                  f"NØX proposal: "
                  f"{bid_sats} sats"
              )
              print(
                  f"Capability score: "
                  f"{score}"
              )
              print(
                  f"Bid description: "
                  f"{bid_description}"
              )
              print("==================================================")

              result = submit_bid(
                  headers,
                  task_id,
                  bid_sats,
                  bid_description
              )

              # ------------------------------------------------------
              # SUCCESS
              # ------------------------------------------------------

              if result["success"]:

                  action = {
                      "timestamp": int(
                          time.time()
                      ),
                      "action": (
                          "marketplace_bid"
                      ),
                      "task_id": task_id,
                      "task_title": title,
                      "estimated_reward_sats": (
                          reward_sats
                      ),
                      "proposed_bid_sats": (
                          bid_sats
                      ),
                      "proposal_percentage": (
                          BID_PERCENTAGE
                      ),
                      "capability_score": score,
                      "bid_description": (
                          bid_description
                      ),
                      "http_status": (
                          result["status"]
                      ),
                      "status": "submitted"
                  }

                  record_action(
                      memory,
                      action
                  )

                  print("")
                  print("==================================================")
                  print("NØX MEMORY UPDATED")
                  print("==================================================")
                  print(
                      f"Recorded bid: "
                      f"{bid_sats} sats"
                  )
                  print(
                      f"HTTP status: "
                      f"{result['status']}"
                  )
                  print("==================================================")

                  return

              # ------------------------------------------------------
              # FAILURE
              # ------------------------------------------------------

              print("")
              print("==================================================")
              print("NØX BID FAILED")
              print("==================================================")
              print(
                  f"HTTP status: "
                  f"{result['status']}"
              )
              print("==================================================")

              sys.exit(1)


          if __name__ == "__main__":
              main()
          PY

          python /tmp/act15.py

      # ==========================================================
      # MEMORY STATUS
      # ==========================================================

      - name: Show ACT15 memory status
        if: always()
        run: |
          echo "=============================================="
          echo "NØX ACT15 V5 - MEMORY STATUS"
          echo "=============================================="

          if [ -f "nox_memory.json" ]; then
            python -c "import json; d=json.load(open('nox_memory.json', encoding='utf-8')); print('Marketplace actions recorded:', len(d.get('marketplace_actions', [])))"
          else
            echo "nox_memory.json not found."
          fi

      # ==========================================================
      # COMMIT MEMORY
      # ==========================================================

      - name: Commit ACT15 memory
        if: always()
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes."
            exit 0
          fi

          git commit -m "NØX ACT15: update marketplace memory"

          git push origin HEAD:${GITHUB_REF_NAME}
