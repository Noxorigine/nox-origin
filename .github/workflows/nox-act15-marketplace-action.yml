name: NØX ACT 15 V8 - Autonomous Marketplace Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-marketplace
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: "https://thecolony.ai/api/v1"
      MEMORY_FILE: "memory/nox_act_15_marketplace.json"

      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE_ACTIONS: "30"
      MAX_MEMORY_ACTIONS: "1000"

      MIN_BID_SATS: "21"
      ACTION_DELAY_SECONDS: "2"

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"

      ACT15_SCRIPT: |
        import json
        import os
        import re
        import sys
        import time
        from datetime import datetime, timezone

        import requests


        BASE_URL = os.environ.get(
            "COLONY_BASE_URL",
            "https://thecolony.ai/api/v1"
        ).rstrip("/")

        MEMORY_FILE = os.environ.get(
            "MEMORY_FILE",
            "memory/nox_act_15_marketplace.json"
        )

        API_KEY = os.environ.get(
            "COLONY_API_KEY",
            ""
        ).strip()

        MAX_TASKS = int(
            os.environ.get("MAX_TASKS", "100")
        )

        MAX_BIDS_PER_RUN = int(
            os.environ.get("MAX_BIDS_PER_RUN", "2")
        )

        MAX_RECONCILE_ACTIONS = int(
            os.environ.get("MAX_RECONCILE_ACTIONS", "30")
        )

        MAX_MEMORY_ACTIONS = int(
            os.environ.get("MAX_MEMORY_ACTIONS", "1000")
        )

        MIN_BID_SATS = int(
            os.environ.get("MIN_BID_SATS", "21")
        )

        ACTION_DELAY_SECONDS = float(
            os.environ.get("ACTION_DELAY_SECONDS", "2")
        )

        GEMINI_ENABLED = False
        EXTERNAL_AI_ENABLED = False
        PAYMENTS_ENABLED = False
        SPENDING_ENABLED = False


        # ------------------------------------------------------------
        # NØX safety boundary
        # ------------------------------------------------------------

        SAFETY_BLOCKED_TERMS = [
            "password",
            "private key",
            "seed phrase",
            "recovery phrase",
            "secret key",
            "api secret",
            "credential theft",
            "steal credentials",
            "credential harvesting",
            "malware",
            "ransomware",
            "botnet",
        ]


        # ------------------------------------------------------------
        # Capabilities
        #
        # Exact/phrase matching only.
        # No raw substring matching.
        # This prevents false positives such as "cro" inside
        # unrelated words.
        # ------------------------------------------------------------

        CAPABILITY_GROUPS = {
            "api": [
                "api",
                "api testing",
                "api smoke test",
                "api smoke tests",
                "rest api",
                "http",
                "http endpoint",
                "endpoint",
                "webhook",
                "integration",
            ],
            "python": [
                "python",
                "python script",
                "python scripting",
                "python code",
            ],
            "coding": [
                "coding",
                "code",
                "script",
                "automation",
                "automate",
                "debug",
                "debugging",
            ],
            "testing": [
                "test",
                "testing",
                "qa",
                "quality assurance",
                "smoke test",
                "smoke tests",
                "verification",
                "verify",
                "validation",
                "validate",
            ],
            "research": [
                "research",
                "research task",
                "research brief",
                "investigate",
                "investigation",
                "source check",
                "source checks",
                "fact check",
                "fact-check",
                "evidence",
                "analysis",
                "audit",
            ],
            "data": [
                "data",
                "data cleanup",
                "data cleaning",
                "csv",
                "json",
                "dataset",
                "deduplicate",
                "deduplication",
                "validation",
                "normalize",
                "normalization",
            ],
            "documentation": [
                "documentation",
                "docs",
                "document",
                "report",
                "technical report",
                "findings",
            ],
            "github": [
                "github",
                "git",
                "repository",
                "repo",
                "pull request",
                "workflow",
                "github action",
                "github actions",
            ],
            "agents": [
                "agent",
                "ai agent",
                "autonomous agent",
                "agent workflow",
                "agent system",
            ],
            "lightning": [
                "lightning",
                "bitcoin",
                "sats",
                "satoshis",
                "lnurl",
                "lightning address",
            ],
        }


        # Terms that strongly indicate a buyer/requester.
        DEMAND_PHRASES = [
            "paid task",
            "paid_task",
            "looking for",
            "looking to hire",
            "need someone",
            "need an agent",
            "need a worker",
            "worker needed",
            "seeking a worker",
            "seeking someone",
            "hire someone",
            "want someone to",
            "i need",
            "we need",
            "build this for me",
            "create this for me",
            "fix this for me",
            "research this for me",
            "test this for me",
            "please build",
            "please create",
            "please fix",
            "please research",
            "please test",
            "please verify",
            "task:",
            "task -",
            "task —",
            "bounty",
        ]


        # Strong seller/offering signals.
        SUPPLY_PHRASES = [
            "for hire",
            "hire me",
            "my services",
            "i offer",
            "i provide",
            "i can help",
            "i can do",
            "available for work",
            "available to work",
            "available for hire",
            "open for work",
            "offering services",
            "freelance services",
            "services available",
            "my rate",
            "my rates",
            "price:",
            "price -",
            "price —",
            "per order",
            "fixed-rate",
            "fixed rate",
        ]


        SUPPLY_METADATA_KEYS = {
            "seller",
            "provider",
            "service_provider",
            "serviceProvider",
            "offerer",
            "author_offering",
        }

        DEMAND_METADATA_KEYS = {
            "buyer",
            "requester",
            "requester_id",
            "client",
            "customer",
        }


        def now_iso():
            return datetime.now(timezone.utc).isoformat()


        def normalize_text(value):
            if value is None:
                return ""

            if isinstance(value, (dict, list)):
                try:
                    value = json.dumps(
                        value,
                        ensure_ascii=False,
                        sort_keys=True,
                    )
                except Exception:
                    value = str(value)

            return str(value).strip().lower()


        def clean_space(text):
            return re.sub(
                r"\s+",
                " ",
                normalize_text(text)
            ).strip()


        def phrase_in_text(phrase, text):
            phrase = clean_space(phrase)
            text = clean_space(text)

            if not phrase or not text:
                return False

            pattern = (
                r"(?<![\w])"
                + re.escape(phrase)
                + r"(?![\w])"
            )

            return bool(
                re.search(
                    pattern,
                    text,
                    flags=re.IGNORECASE
                )
            )


        def phrase_hits(phrases, text):
            return [
                phrase
                for phrase in phrases
                if phrase_in_text(
                    phrase,
                    text
                )
            ]


        def collect_text(obj, depth=0):
            if depth > 5:
                return ""

            if obj is None:
                return ""

            if isinstance(obj, str):
                return obj

            if isinstance(obj, (int, float, bool)):
                return str(obj)

            if isinstance(obj, list):
                return " ".join(
                    collect_text(
                        item,
                        depth + 1
                    )
                    for item in obj[:100]
                )

            if isinstance(obj, dict):
                parts = []

                for key, value in obj.items():
                    parts.append(str(key))

                    value_text = collect_text(
                        value,
                        depth + 1
                    )

                    if value_text:
                        parts.append(
                            value_text
                        )

                return " ".join(parts)

            return str(obj)


        def first_value(obj, keys):
            if not isinstance(obj, dict):
                return None

            for key in keys:
                if (
                    key in obj
                    and obj[key] not in (None, "")
                ):
                    return obj[key]

            return None


        def get_task_id(task):
            if not isinstance(task, dict):
                return None

            for key in [
                "id",
                "task_id",
                "taskId",
                "uuid",
                "post_id",
                "postId",
            ]:
                value = task.get(key)

                if value:
                    return str(value)

            return None


        def get_title(task):
            if not isinstance(task, dict):
                return ""

            for key in [
                "title",
                "name",
                "subject",
                "headline",
            ]:
                value = task.get(key)

                if value:
                    return str(value)

            return ""


        def get_description(task):
            if not isinstance(task, dict):
                return ""

            values = []

            for key in [
                "description",
                "body",
                "content",
                "details",
                "task_description",
                "taskDescription",
            ]:
                value = task.get(key)

                if value:
                    values.append(
                        str(value)
                    )

            return " ".join(values)


        def get_category(task):
            if not isinstance(task, dict):
                return ""

            value = first_value(
                task,
                [
                    "category",
                    "type",
                    "task_type",
                    "taskType",
                    "post_type",
                    "postType",
                ]
            )

            return normalize_text(value)


        def get_author_text(task):
            if not isinstance(task, dict):
                return ""

            values = []

            for key in [
                "author",
                "creator",
                "owner",
                "user",
                "agent",
                "created_by",
                "createdBy",
            ]:
                value = task.get(key)

                if value:
                    values.append(
                        collect_text(value)
                    )

            return " ".join(values)


        def classify_direction(task):
            title = get_title(task)
            description = get_description(task)
            category = get_category(task)

            # IMPORTANT:
            # Direction is classified primarily from title/body.
            # We do not score the entire serialized object because
            # metadata can contain misleading seller/service words.

            core_text = clean_space(
                " ".join([
                    title,
                    description,
                ])
            )

            supply_hits = phrase_hits(
                SUPPLY_PHRASES,
                core_text
            )

            demand_hits = phrase_hits(
                DEMAND_PHRASES,
                core_text
            )

            # Explicit paid-task type is a strong demand signal.
            if category in {
                "paid_task",
                "paid task",
                "bounty",
                "task",
            }:
                demand_hits.append(
                    f"metadata:{category}"
                )

            # "For hire" is an extremely strong supply signal.
            if phrase_in_text(
                "for hire",
                title
            ):
                return {
                    "direction": "SUPPLY",
                    "confidence": "VERY_HIGH",
                    "signals": [
                        "title:for hire"
                    ],
                    "reason": "explicit_supply_title",
                }

            if supply_hits and not demand_hits:
                return {
                    "direction": "SUPPLY",
                    "confidence": "HIGH",
                    "signals": supply_hits[:8],
                    "reason": "supply_language",
                }

            if demand_hits and not supply_hits:
                return {
                    "direction": "DEMAND",
                    "confidence": "HIGH",
                    "signals": demand_hits[:8],
                    "reason": "demand_language",
                }

            if supply_hits and demand_hits:
                return {
                    "direction": "UNKNOWN_DIRECTION",
                    "confidence": "LOW",
                    "signals": (
                        supply_hits[:4]
                        + demand_hits[:4]
                    ),
                    "reason": "conflicting_signals",
                }

            supply_metadata = []
            demand_metadata = []

            if isinstance(task, dict):
                for key in SUPPLY_METADATA_KEYS:
                    if task.get(key):
                        supply_metadata.append(key)

                for key in DEMAND_METADATA_KEYS:
                    if task.get(key):
                        demand_metadata.append(key)

            if demand_metadata and not supply_metadata:
                return {
                    "direction": "DEMAND",
                    "confidence": "MEDIUM",
                    "signals": demand_metadata,
                    "reason": "demand_metadata",
                }

            if supply_metadata and not demand_metadata:
                return {
                    "direction": "SUPPLY",
                    "confidence": "MEDIUM",
                    "signals": supply_metadata,
                    "reason": "supply_metadata",
                }

            # A marketplace task with a reward but no explicit
            # "for hire" signal can still be a demand task.
            reward_hint = any(
                phrase_in_text(
                    phrase,
                    core_text
                )
                for phrase in [
                    "reward",
                    "sats",
                    "satoshis",
                    "paid task",
                    "bounty",
                ]
            )

            if reward_hint:
                return {
                    "direction": "DEMAND",
                    "confidence": "LOW",
                    "signals": ["reward_signal"],
                    "reason": "reward_without_supply_language",
                }

            return {
                "direction": "UNKNOWN_DIRECTION",
                "confidence": "LOW",
                "signals": [],
                "reason": "no_clear_market_direction",
            }


        def parse_number(value):
            if value is None:
                return None

            if isinstance(value, bool):
                return None

            if isinstance(value, (int, float)):
                return float(value)

            text = str(value).strip()
            text = text.replace(",", "")

            match = re.search(
                r"-?\d+(?:\.\d+)?",
                text
            )

            if not match:
                return None

            try:
                return float(
                    match.group(0)
                )
            except Exception:
                return None


        def parse_reward_range(task):
            if not isinstance(task, dict):
                return {
                    "min": None,
                    "max": None,
                    "source": None,
                }

            # First, structured ranges.
            range_pairs = [
                (
                    "min_reward_sats",
                    "max_reward_sats",
                ),
                (
                    "minRewardSats",
                    "maxRewardSats",
                ),
                (
                    "min_sats",
                    "max_sats",
                ),
                (
                    "minSats",
                    "maxSats",
                ),
                (
                    "budget_min_sats",
                    "budget_max_sats",
                ),
                (
                    "budgetMinSats",
                    "budgetMaxSats",
                ),
                (
                    "reward_min_sats",
                    "reward_max_sats",
                ),
                (
                    "rewardMinSats",
                    "rewardMaxSats",
                ),
            ]

            for min_key, max_key in range_pairs:
                min_value = parse_number(
                    task.get(min_key)
                )
                max_value = parse_number(
                    task.get(max_key)
                )

                if (
                    min_value is not None
                    or max_value is not None
                ):
                    if min_value is None:
                        min_value = max_value

                    if max_value is None:
                        max_value = min_value

                    return {
                        "min": max(
                            0,
                            int(min_value)
                        ),
                        "max": max(
                            0,
                            int(max_value)
                        ),
                        "source": (
                            f"structured:"
                            f"{min_key}/"
                            f"{max_key}"
                        ),
                    }

            # Single structured reward.
            for key in [
                "reward_sats",
                "rewardSats",
                "sats",
                "sat",
                "amount_sats",
                "amountSats",
                "payment_sats",
                "paymentSats",
                "budget_sats",
                "budgetSats",
            ]:
                value = parse_number(
                    task.get(key)
                )

                if value is not None and value >= 0:
                    amount = int(value)

                    return {
                        "min": amount,
                        "max": amount,
                        "source": (
                            f"structured:{key}"
                        ),
                    }

            text = clean_space(task)

            # Prefer explicit sat ranges.
            patterns = [
                r"(\d[\d\s,]*)\s*[-–—]\s*(\d[\d\s,]*)\s*sats?\b",
                r"(\d[\d\s,]*)\s*to\s*(\d[\d\s,]*)\s*sats?\b",
            ]

            for pattern in patterns:
                match = re.search(
                    pattern,
                    text,
                    flags=re.IGNORECASE
                )

                if match:
                    try:
                        low = int(
                            match.group(1)
                            .replace(" ", "")
                            .replace(",", "")
                        )
                        high = int(
                            match.group(2)
                            .replace(" ", "")
                            .replace(",", "")
                        )

                        return {
                            "min": min(low, high),
                            "max": max(low, high),
                            "source": "text:sat_range",
                        }
                    except Exception:
                        pass

            # Single sat amount.
            match = re.search(
                r"(\d[\d\s,]*)\s*sats?\b",
                text,
                flags=re.IGNORECASE
            )

            if match:
                try:
                    amount = int(
                        match.group(1)
                        .replace(" ", "")
                        .replace(",", "")
                    )

                    return {
                        "min": amount,
                        "max": amount,
                        "source": "text:sats",
                    }
                except Exception:
                    pass

            # USD/USDC is informational only.
            # We do NOT invent a Lightning bid amount from a
            # currency conversion.
            return {
                "min": None,
                "max": None,
                "source": None,
            }


        def safety_hits(task):
            text = clean_space(
                " ".join([
                    get_title(task),
                    get_description(task),
                ])
            )

            return phrase_hits(
                SAFETY_BLOCKED_TERMS,
                text
            )


        def capability_analysis(task):
            title = clean_space(
                get_title(task)
            )

            description = clean_space(
                get_description(task)
            )

            text = " ".join([
                title,
                description,
            ])

            matched_groups = {}
            matched_terms = []

            for group, terms in CAPABILITY_GROUPS.items():
                hits = phrase_hits(
                    terms,
                    text
                )

                if hits:
                    matched_groups[group] = hits[:6]
                    matched_terms.extend(
                        hits[:6]
                    )

            group_count = len(
                matched_groups
            )

            # Core operational capabilities are more valuable than
            # generic "agent"/"AI" mentions.
            core_groups = {
                "api",
                "python",
                "coding",
                "testing",
                "research",
                "data",
                "documentation",
                "github",
            }

            core_count = len(
                set(matched_groups).intersection(
                    core_groups
                )
            )

            return {
                "groups": matched_groups,
                "group_count": group_count,
                "core_count": core_count,
                "terms": matched_terms[:12],
            }


        def complexity_flags(task):
            text = clean_space(
                " ".join([
                    get_title(task),
                    get_description(task),
                ])
            )

            flags = []

            for phrase in [
                "24/7",
                "real-time",
                "realtime",
                "production",
                "enterprise",
                "large scale",
                "large-scale",
                "ongoing",
                "long term",
                "long-term",
                "multiple agents",
                "full implementation",
                "end to end",
                "end-to-end",
            ]:
                if phrase_in_text(
                    phrase,
                    text
                ):
                    flags.append(
                        phrase
                    )

            return flags


        def competition_from_task(task):
            if not isinstance(task, dict):
                return None

            for key in [
                "bid_count",
                "bidCount",
                "bids_count",
                "bidsCount",
                "num_bids",
                "number_of_bids",
            ]:
                value = parse_number(
                    task.get(key)
                )

                if value is not None:
                    return int(
                        max(0, value)
                    )

            for key in [
                "bids",
                "bid_count",
            ]:
                value = task.get(key)

                if isinstance(value, list):
                    return len(value)

            return None


        def economic_score(reward_min, reward_max):
            if reward_min is None:
                return 0

            value = max(
                reward_min,
                reward_max or reward_min
            )

            if value < 21:
                return 0

            if value < 100:
                return 1

            if value < 500:
                return 2

            if value < 1000:
                return 3

            if value < 5000:
                return 4

            if value < 10000:
                return 5

            return 6


        def competition_score(bids):
            if bids is None:
                return 1

            if bids == 0:
                return 5

            if bids == 1:
                return 4

            if bids == 2:
                return 3

            if bids <= 4:
                return 2

            if bids <= 7:
                return 1

            return 0


        def decision_score(
            task,
            direction_info,
            reward_range,
            capability,
            competition,
            safety,
        ):
            if safety:
                return {
                    "score": -100,
                    "actionable": False,
                    "reason": "safety_block",
                }

            if direction_info["direction"] != "DEMAND":
                return {
                    "score": -50,
                    "actionable": False,
                    "reason": "not_demand",
                }

            reward_min = reward_range["min"]
            reward_max = reward_range["max"]

            if reward_min is None:
                return {
                    "score": -20,
                    "actionable": False,
                    "reason": "no_verified_lightning_reward",
                }

            if reward_max is None:
                reward_max = reward_min

            if reward_max < MIN_BID_SATS:
                return {
                    "score": -20,
                    "actionable": False,
                    "reason": "reward_below_bid_minimum",
                }

            core = capability["core_count"]
            groups = capability["group_count"]

            score = 0

            # Capability fit.
            score += min(
                core * 12,
                48
            )

            score += min(
                max(0, groups - core) * 4,
                12
            )

            # Economics.
            score += economic_score(
                reward_min,
                reward_max
            ) * 4

            # Competition.
            score += competition_score(
                competition
            ) * 4

            # Clear demand is valuable.
            if direction_info["confidence"] == "HIGH":
                score += 8

            # Prefer bounded tasks.
            complexity = complexity_flags(
                task
            )

            if not complexity:
                score += 8
            else:
                score -= min(
                    len(complexity) * 3,
                    12
                )

            # Strong negative: no capability match.
            if core == 0:
                score -= 30

            # A single generic "agent"/"AI" match is not enough.
            if (
                core == 0
                and groups <= 1
            ):
                score -= 20

            actionable = (
                score >= 50
                and core >= 1
                and reward_min >= MIN_BID_SATS
            )

            if actionable:
                reason = "actionable_opportunity"
            elif core == 0:
                reason = "capability_mismatch"
            elif score < 50:
                reason = "below_action_threshold"
            else:
                reason = "not_actionable"

            return {
                "score": score,
                "actionable": actionable,
                "reason": reason,
            }


        def build_bid_amount(reward_range):
            low = reward_range["min"]
            high = reward_range["max"]

            if low is None:
                return None

            if high is None:
                high = low

            # Never bid below The Colony's minimum.
            amount = max(
                MIN_BID_SATS,
                int(low)
            )

            # Never exceed advertised maximum.
            amount = min(
                amount,
                int(high)
            )

            return amount


        def build_bid_description(
            task,
            capability,
            reward_range,
        ):
            title = get_title(task).strip()

            groups = list(
                capability["groups"].keys()
            )

            useful = [
                group
                for group in groups
                if group not in {
                    "agents",
                    "lightning",
                }
            ][:4]

            if useful:
                capability_text = ", ".join(
                    useful
                )
            else:
                capability_text = "bounded technical/research work"

            reward_text = ""
            if reward_range["min"] is not None:
                if (
                    reward_range["max"] is not None
                    and reward_range["max"]
                    != reward_range["min"]
                ):
                    reward_text = (
                        f" for the advertised "
                        f"{reward_range['min']}-"
                        f"{reward_range['max']} sats range"
                    )
                else:
                    reward_text = (
                        f" for the advertised "
                        f"{reward_range['min']} sats"
                    )

            description = (
                "NØX can handle this as a bounded "
                f"{capability_text} task. "
                "I can work from the supplied/public inputs, "
                "return the requested result with concise "
                "evidence or reproducible output, and keep "
                "the scope limited to the task specification"
                f"{reward_text}. "
                f"Target: {title[:180]}"
            )

            # The Colony requires 10-5000 characters.
            description = description.strip()

            if len(description) < 10:
                description = (
                    "NØX can perform this bounded task "
                    "and return reproducible evidence."
                )

            return description[:5000]


        def load_memory():
            default = {
                "schema_version": "8.0",
                "agent": "NØX",
                "workflow": "ACT15",
                "updated_at": now_iso(),
                "marketplace_actions": [],
                "policy": {},
                "statistics": {},
            }

            if not os.path.exists(
                MEMORY_FILE
            ):
                return default

            try:
                with open(
                    MEMORY_FILE,
                    "r",
                    encoding="utf-8"
                ) as handle:
                    data = json.load(handle)

                if not isinstance(
                    data,
                    dict
                ):
                    raise ValueError(
                        "memory root is not an object"
                    )

                data.setdefault(
                    "marketplace_actions",
                    []
                )
                data.setdefault(
                    "policy",
                    {}
                )
                data.setdefault(
                    "statistics",
                    {}
                )

                return data

            except Exception as exc:
                print(
                    f"MEMORY_LOAD_WARNING: {exc}",
                    file=sys.stderr
                )

                return default


        def save_memory(memory):
            directory = os.path.dirname(
                MEMORY_FILE
            )

            os.makedirs(
                directory or ".",
                exist_ok=True
            )

            memory["updated_at"] = now_iso()

            actions = memory.get(
                "marketplace_actions",
                []
            )

            if len(actions) > MAX_MEMORY_ACTIONS:
                memory["marketplace_actions"] = (
                    actions[-MAX_MEMORY_ACTIONS:]
                )

            temp = (
                f"{MEMORY_FILE}.tmp"
            )

            with open(
                temp,
                "w",
                encoding="utf-8"
            ) as handle:
                json.dump(
                    memory,
                    handle,
                    ensure_ascii=False,
                    indent=2
                )
                handle.write("\n")

            os.replace(
                temp,
                MEMORY_FILE
            )


        def api_headers(token):
            return {
                "Authorization": (
                    f"Bearer {token}"
                ),
                "Accept": "application/json",
                "Content-Type": "application/json",
            }


        def authenticate():
            if not API_KEY:
                raise RuntimeError(
                    "COLONY_API_KEY is missing"
                )

            response = requests.post(
                f"{BASE_URL}/auth/token",
                json={
                    "api_key": API_KEY
                },
                timeout=30,
            )

            if response.status_code >= 400:
                raise RuntimeError(
                    "AUTH_FAILED "
                    f"{response.status_code}: "
                    f"{response.text[:500]}"
                )

            data = response.json()

            token = (
                data.get("access_token")
                or data.get("token")
                or data.get("jwt")
            )

            if not token:
                raise RuntimeError(
                    "AUTH_RESPONSE_HAS_NO_TOKEN"
                )

            return token


        def get_identity(token):
            response = requests.get(
                f"{BASE_URL}/users/me",
                headers=api_headers(token),
                timeout=30,
            )

            if response.status_code >= 400:
                raise RuntimeError(
                    "IDENTITY_FAILED "
                    f"{response.status_code}: "
                    f"{response.text[:500]}"
                )

            data = response.json()

            if isinstance(data, dict):
                return data.get(
                    "user",
                    data
                )

            return data


        def extract_tasks(payload):
            if isinstance(
                payload,
                list
            ):
                return payload

            if not isinstance(
                payload,
                dict
            ):
                return []

            for key in [
                "tasks",
                "items",
                "results",
                "data",
            ]:
                value = payload.get(key)

                if isinstance(
                    value,
                    list
                ):
                    return value

                if isinstance(
                    value,
                    dict
                ):
                    nested = extract_tasks(
                        value
                    )

                    if nested:
                        return nested

            return []


        def get_marketplace_tasks(token):
            response = requests.get(
                f"{BASE_URL}/marketplace/tasks",
                headers=api_headers(token),
                params={
                    "status": "open",
                    "limit": MAX_TASKS,
                },
                timeout=30,
            )

            if response.status_code >= 400:
                raise RuntimeError(
                    "MARKETPLACE_TASKS_FAILED "
                    f"{response.status_code}: "
                    f"{response.text[:500]}"
                )

            return extract_tasks(
                response.json()
            )[:MAX_TASKS]


        def extract_bid_items(payload):
            if isinstance(
                payload,
                list
            ):
                return payload

            if not isinstance(
                payload,
                dict
            ):
                return []

            for key in [
                "bids",
                "items",
                "results",
                "data",
            ]:
                value = payload.get(key)

                if isinstance(
                    value,
                    list
                ):
                    return value

                if isinstance(
                    value,
                    dict
                ):
                    nested = extract_bid_items(
                        value
                    )

                    if nested:
                        return nested

            return []


        def get_existing_bids(
            token,
            task_id
        ):
            response = requests.get(
                f"{BASE_URL}/marketplace/"
                f"{task_id}/bids",
                headers=api_headers(token),
                timeout=30,
            )

            if response.status_code in {
                404,
                405,
            }:
                return []

            if response.status_code >= 400:
                print(
                    "BID_LOOKUP_WARNING:",
                    task_id,
                    response.status_code
                )
                return []

            return extract_bid_items(
                response.json()
            )


        def identity_values(identity):
            values = set()

            def walk(obj, depth=0):
                if depth > 5:
                    return

                if isinstance(
                    obj,
                    dict
                ):
                    for key, value in obj.items():
                        key_lower = str(
                            key
                        ).lower()

                        if key_lower in {
                            "id",
                            "user_id",
                            "userid",
                            "username",
                            "handle",
                            "agent_id",
                            "agentid",
                        }:
                            if isinstance(
                                value,
                                (str, int)
                            ):
                                values.add(
                                    str(value).lower()
                                )

                        walk(
                            value,
                            depth + 1
                        )

                elif isinstance(
                    obj,
                    list
                ):
                    for item in obj[:100]:
                        walk(
                            item,
                            depth + 1
                        )

            walk(identity)

            return values


        def bid_belongs_to_nox(
            bid,
            identity
        ):
            nox_values = identity_values(
                identity
            )

            if not nox_values:
                return False

            found = set()

            def walk(obj, depth=0):
                if depth > 5:
                    return

                if isinstance(
                    obj,
                    dict
                ):
                    for key, value in obj.items():
                        key_lower = str(
                            key
                        ).lower()

                        if key_lower in {
                            "id",
                            "user_id",
                            "userid",
                            "username",
                            "handle",
                            "agent_id",
                            "agentid",
                        }:
                            if isinstance(
                                value,
                                (str, int)
                            ):
                                found.add(
                                    str(value).lower()
                                )

                        walk(
                            value,
                            depth + 1
                        )

                elif isinstance(
                    obj,
                    list
                ):
                    for item in obj[:100]:
                        walk(
                            item,
                            depth + 1
                        )

            walk(bid)

            return bool(
                nox_values.intersection(
                    found
                )
            )


        def has_existing_nox_bid(
            token,
            task_id,
            identity
        ):
            bids = get_existing_bids(
                token,
                task_id
            )

            for bid in bids:
                if bid_belongs_to_nox(
                    bid,
                    identity
                ):
                    return True, bid

            return False, None


        def submit_bid(
            token,
            task_id,
            amount_sats,
            description,
        ):
            if PAYMENTS_ENABLED:
                raise RuntimeError(
                    "PAYMENTS_ENABLED must remain False"
                )

            if SPENDING_ENABLED:
                raise RuntimeError(
                    "SPENDING_ENABLED must remain False"
                )

            if amount_sats < MIN_BID_SATS:
                return {
                    "submitted": False,
                    "reason": "below_minimum_bid",
                }

            payload = {
                "bid_amount_sats": int(
                    amount_sats
                ),
                "bid_description": description,
            }

            response = requests.post(
                f"{BASE_URL}/marketplace/"
                f"{task_id}/bid",
                headers=api_headers(token),
                json=payload,
                timeout=30,
            )

            if response.status_code in {
                200,
                201,
                202,
            }:
                try:
                    data = response.json()
                except Exception:
                    data = {
                        "raw": response.text[:1000]
                    }

                return {
                    "submitted": True,
                    "status_code": response.status_code,
                    "response": data,
                }

            try:
                data = response.json()
            except Exception:
                data = {
                    "raw": response.text[:1000]
                }

            return {
                "submitted": False,
                "status_code": response.status_code,
                "reason": (
                    data.get("detail")
                    if isinstance(data, dict)
                    else None
                ) or (
                    data.get("message")
                    if isinstance(data, dict)
                    else None
                ) or f"http_{response.status_code}",
                "response": data,
            }


        def get_payment_status(
            token,
            task_id
        ):
            response = requests.get(
                f"{BASE_URL}/marketplace/"
                f"{task_id}/payment",
                headers=api_headers(token),
                timeout=30,
            )

            if response.status_code in {
                404,
                405,
            }:
                return None

            if response.status_code >= 400:
                return {
                    "status": (
                        f"http_{response.status_code}"
                    )
                }

            try:
                return response.json()
            except Exception:
                return {
                    "raw": response.text[:500]
                }


        def reconcile_previous_actions(
            token,
            identity,
            memory,
        ):
            actions = memory.get(
                "marketplace_actions",
                []
            )

            recent = actions[
                -MAX_RECONCILE_ACTIONS:
            ]

            accepted = 0
            paid = 0
            checked = 0

            seen_task_ids = set()

            for action in reversed(recent):
                if not isinstance(
                    action,
                    dict
                ):
                    continue

                task_id = action.get(
                    "task_id"
                )

                if not task_id:
                    continue

                if task_id in seen_task_ids:
                    continue

                if not action.get(
                    "bid_submitted"
                ):
                    continue

                seen_task_ids.add(
                    task_id
                )

                bids = get_existing_bids(
                    token,
                    task_id
                )

                my_bid = None

                for bid in bids:
                    if bid_belongs_to_nox(
                        bid,
                        identity
                    ):
                        my_bid = bid
                        break

                if my_bid is None:
                    continue

                status = normalize_text(
                    first_value(
                        my_bid,
                        [
                            "status",
                            "state",
                        ]
                    )
                )

                if status in {
                    "accepted",
                    "approved",
                    "won",
                }:
                    accepted += 1

                payment = get_payment_status(
                    token,
                    task_id
                )

                if payment is not None:
                    checked += 1

                    payment_status = normalize_text(
                        first_value(
                            payment,
                            [
                                "status",
                                "state",
                            ]
                        )
                    )

                    if payment_status == "paid":
                        paid += 1

                action["latest_bid_status"] = (
                    status or None
                )
                action["latest_payment"] = (
                    payment
                )

            return {
                "accepted": accepted,
                "paid": paid,
                "payment_checks": checked,
            }


