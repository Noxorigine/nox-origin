name: NØX ACT15 V7.1 - Marketplace Action

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX ACT15 Marketplace Action
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "")
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_MEMORY_ACTIONS = int(os.environ["MAX_MEMORY_ACTIONS"])
          DELAY = float(os.environ["ACTION_DELAY_SECONDS"])
          SATS_PER_USD = int(os.environ["FALLBACK_SATS_PER_USD"])

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def normalize_text(value):
              if value is None:
                  return ""
              text = str(value)

              replacements = {
                  "\u2010": "-",
                  "\u2011": "-",
                  "\u2012": "-",
                  "\u2013": "-",
                  "\u2014": "-",
                  "\u2212": "-",
                  "\u00a0": " ",
                  "\u202f": " ",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              return re.sub(r"\s+", " ", text).strip()

          def parse_number(raw):
              """
              Robustly parse:
              155,000
              2,500
              5
              0.50
              0,50
              1 500
              """
              if raw is None:
                  return None

              value = normalize_text(raw)
              value = value.replace(" ", "")

              if not value:
                  return None

              # Reject explicit negative values.
              if value.startswith("-"):
                  return None

              # Thousands separator + decimal:
              # 1,234.56 -> 1234.56
              # 1.234,56 -> 1234.56
              if "," in value and "." in value:
                  if value.rfind(",") > value.rfind("."):
                      value = value.replace(".", "")
                      value = value.replace(",", ".")
                  else:
                      value = value.replace(",", "")

              # Comma only:
              # 155,000 -> 155000
              # 0,25 -> 0.25
              elif "," in value:
                  parts = value.split(",")

                  if (
                      len(parts) == 2
                      and len(parts[1]) == 3
                      and len(parts[0]) >= 1
                  ):
                      value = "".join(parts)
                  else:
                      value = value.replace(",", ".")

              # Dot only remains decimal unless it is clearly thousands.
              elif value.count(".") > 1:
                  value = value.replace(".", "")

              try:
                  number = float(value)
              except ValueError:
                  return None

              if number < 0:
                  return None

              return number

          def numeric_to_int(value):
              if value is None:
                  return None
              return max(0, int(round(value)))

          def structured_reward(task):
              """
              Only trust genuinely numeric structured reward fields.
              Do not interpret arbitrary strings from the API as rewards.
              """
              candidates = [
                  task.get("reward_sats"),
                  task.get("rewardSats"),
                  task.get("budget_sats"),
                  task.get("budgetSats"),
              ]

              for value in candidates:
                  if isinstance(value, (int, float)) and value > 0:
                      return {
                          "reward_sats": int(round(value)),
                          "source": "structured",
                      }

              return None

          def parse_reward(task):
              """
              Returns:
                status: PAID / UNKNOWN_REWARD / UNPAID
                reward_sats: positive integer or None
                source: parser source or None
              """

              structured = structured_reward(task)
              if structured:
                  return {
                      "status": "PAID",
                      **structured,
                  }

              title = normalize_text(task.get("title", ""))
              description = normalize_text(task.get("description", ""))
              text = normalize_text(f"{title} {description}")

              # ----------------------------------------------------------
              # 1. Detect explicit negative monetary amounts first.
              # ----------------------------------------------------------
              negative_currency = re.search(
                  r"(?i)(?<![\w])-\s*\$?\s*"
                  r"(\d(?:[\d\s,]*\d)?(?:[.,]\d+)?)\s*"
                  r"(?:usdc|usd)\b",
                  text,
              )

              negative_sats = re.search(
                  r"(?i)(?<![\w])-\s*"
                  r"(\d(?:[\d\s,]*\d)?(?:[.,]\d+)?)\s*"
                  r"(?:sats?|sat(?:oshis)?)\b",
                  text,
              )

              # ----------------------------------------------------------
              # 2. Explicit sats / satoshis.
              # ----------------------------------------------------------
              sats_pattern = re.compile(
                  r"(?i)(?<![\w-])\+?\s*"
                  r"(?P<amount>\d(?:[\d\s,]*\d)?(?:[.,]\d+)?)"
                  r"\s*(?:sats?|sat(?:oshis)?)\b"
              )

              for match in sats_pattern.finditer(text):
                  amount = parse_number(match.group("amount"))
                  if amount is not None and amount > 0:
                      return {
                          "status": "PAID",
                          "reward_sats": numeric_to_int(amount),
                          "source": "text_sats",
                      }

              # ----------------------------------------------------------
              # 3. USD / USDC after the number.
              #
              # Matches:
              # 5 USDC
              # 5 USDC per task
              # $5 USDC
              # 0.50 USDC
              # ----------------------------------------------------------
              currency_after = re.compile(
                  r"(?i)(?<![\w-])\+?\s*\$?\s*"
                  r"(?P<amount>\d(?:[\d\s,]*\d)?(?:[.,]\d+)?)"
                  r"\s*(?P<currency>usdc|usd)\b"
              )

              for match in currency_after.finditer(text):
                  amount = parse_number(match.group("amount"))
                  if amount is not None and amount > 0:
                      return {
                          "status": "PAID",
                          "reward_sats": numeric_to_int(amount * SATS_PER_USD),
                          "source": "text_usd_usdc",
                      }

              # ----------------------------------------------------------
              # 4. Currency before amount.
              #
              # Matches:
              # USDC $0.25
              # USDC: 5
              # Base USDC from $0.25
              # ----------------------------------------------------------
              currency_before = re.compile(
                  r"(?i)\b(?:usdc|usd)\b"
                  r"[^0-9\-]{0,40}"
                  r"\$?\s*"
                  r"(?P<amount>\d(?:[\d\s,]*\d)?(?:[.,]\d+)?)"
              )

              for match in currency_before.finditer(text):
                  amount = parse_number(match.group("amount"))
                  if amount is not None and amount > 0:
                      return {
                          "status": "PAID",
                          "reward_sats": numeric_to_int(amount * SATS_PER_USD),
                          "source": "currency_before_amount",
                      }

              # ----------------------------------------------------------
              # 5. Reward-like language without a safely parsed amount.
              # ----------------------------------------------------------
              reward_signals = [
                  r"\bpaid\b",
                  r"\bpayment\b",
                  r"\bpayout\b",
                  r"\breward\b",
                  r"\bbudget\b",
                  r"\bbounty\b",
                  r"\bbonus\b",
                  r"\btips?\b",
                  r"\busdc\b",
                  r"\busd\b",
                  r"\bsats?\b",
                  r"\bsatoshi(?:s)?\b",
                  r"\blightning\b",
                  r"\$\s*\d",
              ]

              if (
                  negative_currency
                  or negative_sats
                  or any(re.search(pattern, text, re.I) for pattern in reward_signals)
              ):
                  return {
                      "status": "UNKNOWN_REWARD",
                      "reward_sats": None,
                      "source": None,
                  }

              return {
                  "status": "UNPAID",
                  "reward_sats": None,
                  "source": None,
              }

          # --------------------------------------------------------------
          # Capability scoring
          # --------------------------------------------------------------

          CAPABILITY_KEYWORDS = {
              "python": 8,
              "api": 8,
              "automation": 8,
              "research": 7,
              "data": 7,
              "analysis": 7,
              "qa": 6,
              "testing": 6,
              "smoke test": 6,
              "scraping": 7,
              "web": 5,
              "json": 5,
              "csv": 5,
              "seo": 5,
              "audit": 7,
              "copywriting": 5,
              "documentation": 6,
              "scripts": 7,
              "database": 6,
              "source checks": 7,
          }

          DOMAIN_KEYWORDS = {
              "virtual economy": 15,
              "marketplace": 12,
              "payments": 8,
              "lightning": 10,
              "bitcoin": 8,
              "cybersecurity": 15,
              "security": 12,
              "ai community": 12,
              "ai communities": 12,
              "ai agents": 15,
              "agent": 10,
              "autonomy": 15,
              "automation": 8,
              "emerging tech": 10,
              "technology": 7,
              "regulation": 10,
              "law": 8,
              "policy": 8,
          }

          LEARNING_KEYWORDS = {
              "learn": 10,
              "learning": 10,
              "experiment": 9,
              "test": 8,
              "testing": 8,
              "proof": 8,
              "research": 8,
              "new": 6,
              "challenge": 8,
              "build": 7,
              "prototype": 8,
              "feedback": 8,
              "collaboration": 10,
              "community": 7,
          }

          TIP_KEYWORDS_HIGH = {
              "tip": 10,
              "tips": 10,
              "bonus": 9,
              "bounty": 9,
              "reward for helpful": 10,
              "reward for help": 10,
              "donation": 8,
              "gratuity": 8,
          }

          TIP_KEYWORDS_MEDIUM = {
              "future work": 7,
              "long-term": 7,
              "long term": 7,
              "recurring": 7,
              "referral": 6,
              "collaboration": 6,
              "help wanted": 6,
              "community": 5,
              "relationship": 7,
              "partner": 6,
              "support": 5,
          }

          BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "explosive",
              "explosives",
              "malware",
              "ransomware",
              "credential theft",
              "phishing",
              "stolen account",
              "fraud",
              "money laundering",
              "illegal drugs",
          ]

          def score_keywords(text, keywords, cap):
              score = 0
              hits = []

              lower = text.lower()

              for keyword, points in keywords.items():
                  if keyword.lower() in lower:
                      score += points
                      hits.append(keyword)

              return min(score, cap), hits

          def tip_score(text):
              score = 0
              hits = []

              lower = text.lower()

              for keyword, points in TIP_KEYWORDS_HIGH.items():
                  if keyword.lower() in lower:
                      score += points
                      hits.append(keyword)

              for keyword, points in TIP_KEYWORDS_MEDIUM.items():
                  if keyword.lower() in lower:
                      score += points
                      hits.append(keyword)

              return min(score, 15), hits

          def is_blocked(text):
              lower = text.lower()

              for term in BLOCKED_TERMS:
                  if term in lower:
                      return True, term

              return False, None

          def score_task(task, reward):
              title = normalize_text(task.get("title", ""))
              description = normalize_text(task.get("description", ""))
              text = normalize_text(f"{title} {description}")

              capability, capability_hits = score_keywords(
                  text,
                  CAPABILITY_KEYWORDS,
                  40,
              )

              learning, learning_hits = score_keywords(
                  text,
                  LEARNING_KEYWORDS,
                  25,
              )

              domain, domain_hits = score_keywords(
                  text,
                  DOMAIN_KEYWORDS,
                  25,
              )

              tips, tip_hits = tip_score(text)

              economic = 0

              if reward["reward_sats"] is not None:
                  sats = reward["reward_sats"]

                  if sats >= 100000:
                      economic = 15
                  elif sats >= 50000:
                      economic = 12
                  elif sats >= 10000:
                      economic = 10
                  elif sats >= 1000:
                      economic = 7
                  else:
                      economic = 4

              # Tip potential is deliberately independent from direct payment.
              #
              # This means a free task can still become a valuable opportunity
              # through tips, reputation, relationships, learning or future work.
              opportunity_score = round(
                  capability * 0.35
                  + learning * 0.20
                  + domain * 0.20
                  + tips * 0.20
                  + economic * 0.05,
                  2,
              )

              return {
                  "capability_score": capability,
                  "learning_score": learning,
                  "domain_score": domain,
                  "tip_score": tips,
                  "economic_score": economic,
                  "opportunity_score": opportunity_score,
                  "capability_hits": capability_hits,
                  "learning_hits": learning_hits,
                  "domain_hits": domain_hits,
                  "tip_hits": tip_hits,
              }

          # --------------------------------------------------------------
          # Authentication
          # --------------------------------------------------------------

          print("[ACT15] Requesting Colony authentication token...")

          auth_response = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"[ACT15] Auth status: {auth_response.status_code}")

          if auth_response.status_code != 200:
              try:
                  print("[ACT15] Auth response:", auth_response.json())
              except Exception:
                  print("[ACT15] Auth response:", auth_response.text[:1000])

              raise SystemExit("Authentication failed")

          auth_data = auth_response.json()
          token = auth_data.get("access_token") or auth_data.get("token")

          if not token:
              raise SystemExit("Authentication succeeded but no JWT token was returned")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          me_response = session.get(
              f"{BASE_URL}/users/me",
              timeout=30,
          )

          print(f"[ACT15] Identity status: {me_response.status_code}")

          if me_response.status_code != 200:
              try:
                  print("[ACT15] Identity response:", me_response.json())
              except Exception:
                  print("[ACT15] Identity response:", me_response.text[:1000])

              raise SystemExit("Identity lookup failed")

          me = me_response.json()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("agent_username")
              or me.get("agent_handle")
              or "unknown"
          )

          user_id = (
              me.get("id")
              or me.get("user_id")
              or me.get("agent_id")
          )

          print(f"[ACT15] Identity: @{username}")

          karma = me.get("karma")
          if karma is not None:
              print(f"[ACT15] Karma: {karma}")

          # --------------------------------------------------------------
          # Marketplace
          # --------------------------------------------------------------

          marketplace_response = session.get(
              f"{BASE_URL}/marketplace/tasks?limit={MAX_TASKS}",
              timeout=30,
          )

          print(f"[ACT15] Marketplace status: {marketplace_response.status_code}")

          if marketplace_response.status_code != 200:
              try:
                  print("[ACT15] Marketplace response:", marketplace_response.json())
              except Exception:
                  print("[ACT15] Marketplace response:", marketplace_response.text[:1000])

              raise SystemExit("Marketplace lookup failed")

          marketplace_data = marketplace_response.json()

          if isinstance(marketplace_data, list):
              tasks = marketplace_data
          elif isinstance(marketplace_data, dict):
              tasks = (
                  marketplace_data.get("tasks")
                  or marketplace_data.get("items")
                  or marketplace_data.get("data")
                  or []
              )
          else:
              tasks = []

          tasks = tasks[:MAX_TASKS]

          open_tasks = []

          for task in tasks:
              status = str(
                  task.get("status")
                  or task.get("state")
                  or "open"
              ).lower()

              if status in {
                  "open",
                  "active",
                  "available",
                  "published",
                  "pending",
              }:
                  open_tasks.append(task)

          print(f"[ACT15] Tasks seen: {len(tasks)}")
          print(f"[ACT15] Open tasks: {len(open_tasks)}")

          # --------------------------------------------------------------
          # Memory loading
          # --------------------------------------------------------------

          memory = {}

          if MEMORY_FILE.exists():
              try:
                  memory = json.loads(MEMORY_FILE.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"[ACT15] Existing memory could not be parsed: {exc}")
                  memory = {}

          existing_bid_task_ids = set()

          # --------------------------------------------------------------
          # More robust existing-bid extraction
          # --------------------------------------------------------------

          def add_possible_bid_identity(value, identities):
              if value is None:
                  return

              if isinstance(value, (str, int)):
                  identities.add(str(value).lower())
                  return

              if isinstance(value, dict):
                  for key in [
                      "id",
                      "user_id",
                      "agent_id",
                      "username",
                      "handle",
                      "agent_username",
                      "agent_handle",
                  ]:
                      if value.get(key) is not None:
                          identities.add(str(value[key]).lower())

          my_identities = {
              str(username).lower(),
          }

          if user_id is not None:
              my_identities.add(str(user_id).lower())

          def bid_belongs_to_nox(bid):
              identities = set()

              for key in [
                  "id",
                  "user_id",
                  "agent_id",
                  "username",
                  "handle",
                  "agent_username",
                  "agent_handle",
              ]:
                  add_possible_bid_identity(bid.get(key), identities)

              for nested_key in [
                  "user",
                  "agent",
                  "bidder",
                  "worker",
                  "author",
                  "owner",
              ]:
                  nested = bid.get(nested_key)

                  if isinstance(nested, dict):
                      add_possible_bid_identity(nested, identities)
                  elif nested is not None:
                      add_possible_bid_identity(nested, identities)

              return bool(identities & my_identities)

          # --------------------------------------------------------------
          # Task analysis
          # --------------------------------------------------------------

          analyzed = []
          paid_candidates = []
          learning_candidates = []
          unknown_candidates = []
          blocked_candidates = []

          for task in open_tasks:
              task_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("taskId")
              )

              if task_id is None:
                  continue

              task_id = str(task_id)

              title = normalize_text(task.get("title", ""))
              description = normalize_text(task.get("description", ""))
              text = normalize_text(f"{title} {description}")

              reward = parse_reward(task)
              scores = score_task(task, reward)

              blocked, blocked_term = is_blocked(text)

              task_record = {
                  "task_id": task_id,
                  "title": title,
                  "reward_status": reward["status"],
                  "reward_sats": reward["reward_sats"],
                  "reward_source": reward["source"],
                  **scores,
                  "blocked": blocked,
                  "blocked_term": blocked_term,
              }

              analyzed.append(task_record)

              if blocked:
                  blocked_candidates.append(task_record)
                  continue

              if reward["status"] == "PAID":
                  paid_candidates.append(task_record)
              elif reward["status"] == "UNKNOWN_REWARD":
                  unknown_candidates.append(task_record)
              else:
                  learning_candidates.append(task_record)

          print(f"[ACT15] Paid candidates: {len(paid_candidates)}")
          print(f"[ACT15] Unknown-reward opportunities: {len(unknown_candidates)}")
          print(f"[ACT15] Learning/unpaid opportunities: {len(learning_candidates)}")
          print(f"[ACT15] Blocked: {len(blocked_candidates)}")

          # --------------------------------------------------------------
          # Existing bid detection
          # --------------------------------------------------------------

          for record in paid_candidates:
              task_id = record["task_id"]

              # First inspect task-level hints if supplied by the API.
              task = next(
                  (
                      t for t in open_tasks
                      if str(
                          t.get("id")
                          or t.get("task_id")
                          or t.get("taskId")
                      ) == task_id
                  ),
                  None,
              )

              if task:
                  for key in [
                      "my_bid",
                      "myBid",
                      "has_bid",
                      "hasBid",
                      "already_bid",
                      "alreadyBid",
                  ]:
                      value = task.get(key)

                      if value is True:
                          existing_bid_task_ids.add(task_id)

                      if isinstance(value, dict) and bid_belongs_to_nox(value):
                          existing_bid_task_ids.add(task_id)

              # Then query the task's bids.
              try:
                  bids_response = session.get(
                      f"{BASE_URL}/marketplace/{task_id}/bids",
                      timeout=30,
                  )

                  if bids_response.status_code == 200:
                      bids_data = bids_response.json()

                      if isinstance(bids_data, list):
                          bids = bids_data
                      elif isinstance(bids_data, dict):
                          bids = (
                              bids_data.get("bids")
                              or bids_data.get("items")
                              or bids_data.get("data")
                              or []
                          )
                      else:
                          bids = []

                      for bid in bids:
                          if isinstance(bid, dict) and bid_belongs_to_nox(bid):
                              existing_bid_task_ids.add(task_id)
                              break

                  else:
                      print(
                          f"[ACT15] Bid lookup for {task_id}: "
                          f"{bids_response.status_code}"
                      )

              except Exception as exc:
                  print(f"[ACT15] Bid lookup error for {task_id}: {exc}")

          print(f"[ACT15] Already bid: {len(existing_bid_task_ids)}")

          # --------------------------------------------------------------
          # Capability-first decision.
          #
          # No 10-sat opportunity filter.
          #
          # Paid:
          #   capability first, then opportunity value.
          #
          # Unknown reward:
          #   keep as opportunity, never auto-bid.
          #
          # Unpaid:
          #   keep as learning/tip/reputation opportunity.
          # --------------------------------------------------------------

          bid_candidates = []

          for record in paid_candidates:
              task_id = record["task_id"]

              if task_id in existing_bid_task_ids:
                  continue

              capability = record["capability_score"]
              opportunity = record["opportunity_score"]
              tips = record["tip_score"]
              learning = record["learning_score"]

              bid_ready = (
                  capability >= 8
                  and (
                      opportunity >= 8
                      or tips >= 5
                      or learning >= 10
                  )
              )

              if bid_ready:
                  bid_candidates.append(record)

          bid_candidates.sort(
              key=lambda item: (
                  item["capability_score"],
                  item["opportunity_score"],
                  item["tip_score"],
                  item["reward_sats"] or 0,
              ),
              reverse=True,
          )

          # --------------------------------------------------------------
          # Bid execution
          # --------------------------------------------------------------

          submitted = []
          bid_errors = []

          for record in bid_candidates:
              task_id = record["task_id"]
              reward_sats = record["reward_sats"]

              if not reward_sats or reward_sats <= 0:
                  continue

              # Technical minimum only.
              # This is NOT an opportunity filter.
              bid_amount = max(1, int(round(reward_sats * 0.20)))
              bid_amount = min(bid_amount, reward_sats)

              bid_description = (
                  "NØX can contribute to this task using "
                  "Python/API automation, research, data analysis, "
                  "testing or related technical work. "
                  "NØX is also interested in producing verifiable results "
                  "and learning from the task."
              )

              payload = {
                  "bid_amount_sats": bid_amount,
                  "bid_description": bid_description,
              }

              print(
                  f"[ACT15] Bidding: {record['title']} | "
                  f"reward={reward_sats} sats | "
                  f"bid={bid_amount} sats | "
                  f"capability={record['capability_score']} | "
                  f"opportunity={record['opportunity_score']} | "
                  f"tips={record['tip_score']}"
              )

              try:
                  response = session.post(
                      f"{BASE_URL}/marketplace/{task_id}/bid",
                      json=payload,
                      timeout=30,
                  )

                  if response.status_code in (200, 201):
                      print(
                          f"[ACT15] Bid submitted successfully for {task_id}"
                      )

                      submitted.append({
                          **record,
                          "bid_amount_sats": bid_amount,
                          "submitted_at": now_iso(),
                          "status": "submitted",
                      })

                      existing_bid_task_ids.add(task_id)

                  elif response.status_code == 409:
                      # Treat conflict as already submitted / concurrent state.
                      print(
                          f"[ACT15] 409 conflict for {task_id}; "
                          f"treating as already bid."
                      )

                      existing_bid_task_ids.add(task_id)

                      bid_errors.append({
                          **record,
                          "status": "already_bid_or_conflict",
                          "http_status": 409,
                          "response": response.text[:1000],
                          "timestamp": now_iso(),
                      })

                  else:
                      try:
                          detail = response.json()
                      except Exception:
                          detail = response.text[:1000]

                      print(
                          f"[ACT15] Bid error for {task_id}: "
                          f"{response.status_code} | {detail}"
                      )

                      bid_errors.append({
                          **record,
                          "status": "error",
                          "http_status": response.status_code,
                          "response": detail,
                          "timestamp": now_iso(),
                      })

              except Exception as exc:
                  print(f"[ACT15] Bid exception for {task_id}: {exc}")

                  bid_errors.append({
                      **record,
                      "status": "exception",
                      "response": str(exc),
                      "timestamp": now_iso(),
                  })

              time.sleep(DELAY)

          # --------------------------------------------------------------
          # Opportunity classifications for memory
          # --------------------------------------------------------------

          tip_opportunities = [
              item for item in analyzed
              if not item["blocked"] and item["tip_score"] >= 5
          ]

          high_value_learning = [
              item for item in learning_candidates
              if (
                  item["capability_score"] >= 8
                  or item["learning_score"] >= 10
                  or item["tip_score"] >= 5
              )
          ]

          unknown_reward_opportunities = [
              item for item in unknown_candidates
              if (
                  item["capability_score"] >= 8
                  or item["tip_score"] >= 5
                  or item["learning_score"] >= 10
              )
          ]

          # --------------------------------------------------------------
          # Memory
          # --------------------------------------------------------------

          previous_actions = memory.get("actions", [])

          if not isinstance(previous_actions, list):
              previous_actions = []

          action_entry = {
              "timestamp": now_iso(),
              "workflow": "ACT15_V7_1",
              "identity": username,
              "karma": karma,
              "tasks_seen": len(tasks),
              "open_tasks": len(open_tasks),
              "paid_candidates": len(paid_candidates),
              "unknown_reward_candidates": len(unknown_candidates),
              "learning_candidates": len(learning_candidates),
              "tip_opportunities": len(tip_opportunities),
              "high_value_learning_opportunities": len(high_value_learning),
              "blocked": len(blocked_candidates),
              "already_bid": len(existing_bid_task_ids),
              "bid_candidates": len(bid_candidates),
              "submitted": len(submitted),
              "bid_errors": len(bid_errors),
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          previous_actions.append(action_entry)
          previous_actions = previous_actions[-MAX_MEMORY_ACTIONS:]

          memory = {
              "agent": "NØX",
              "workflow": "ACT15_V7_1",
              "updated_at": now_iso(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "marketplace_mode": "opportunity_hunting",

              "policy": {
                  "unpaid_tasks_are_valid_opportunities": True,
                  "unpaid_tasks_can_generate_learning": True,
                  "unpaid_tasks_can_generate_reputation": True,
                  "unpaid_tasks_can_generate_relationships": True,
                  "unpaid_tasks_can_generate_tips": True,
                  "unpaid_tasks_can_generate_future_opportunities": True,

                  "unknown_reward_is_not_assumed_paid": True,
                  "unknown_reward_is_not_assumed_unpaid": True,

                  "tip_opportunities_must_be_detected": True,
                  "tip_potential_affects_opportunity_score": True,

                  "minimum_sats_for_opportunity": 0,

                  # Technical API minimum only.
                  # Never use this as a selection threshold.
                  "minimum_sats_for_bid": 1,

                  "never_invent_reward": True,
                  "never_auto_pay": True,
                  "never_auto_spend": True,

                  "capability_first_selection": True,
              },

              "domain_priorities": {
                  "virtual_economy": 25,
                  "cybersecurity": 20,
                  "ai_communities": 20,
                  "agent_intelligence_autonomy": 20,
                  "emerging_tech": 15,
              },

              "summary": {
                  "tasks_seen": len(tasks),
                  "open_tasks": len(open_tasks),
                  "paid_candidates": len(paid_candidates),
                  "unknown_reward_candidates": len(unknown_candidates),
                  "learning_candidates": len(learning_candidates),
                  "tip_opportunities": len(tip_opportunities),
                  "high_value_learning_opportunities": len(high_value_learning),
                  "unknown_reward_opportunities": len(unknown_reward_opportunities),
                  "blocked": len(blocked_candidates),
                  "already_bid": len(existing_bid_task_ids),
                  "bid_candidates": len(bid_candidates),
                  "submitted": len(submitted),
                  "bid_errors": len(bid_errors),
              },

              "paid_opportunities": sorted(
                  paid_candidates,
                  key=lambda x: (
                      x["capability_score"],
                      x["opportunity_score"],
                      x["tip_score"],
                  ),
                  reverse=True,
              ),

              "unknown_reward_opportunities": sorted(
                  unknown_candidates,
                  key=lambda x: (
                      x["capability_score"],
                      x["tip_score"],
                      x["learning_score"],
                  ),
                  reverse=True,
              ),

              "learning_opportunities": sorted(
                  learning_candidates,
                  key=lambda x: (
                      x["capability_score"],
                      x["tip_score"],
                      x["learning_score"],
                  ),
                  reverse=True,
              ),

              "tip_opportunities": sorted(
                  tip_opportunities,
                  key=lambda x: (
                      x["tip_score"],
                      x["capability_score"],
                      x["learning_score"],
                  ),
                  reverse=True,
              )[:50],

              "submitted_bids": submitted[-50:],
              "bid_errors": bid_errors[-50:],
              "actions": previous_actions,
          }

          MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)

          MEMORY_FILE.write_text(
              json.dumps(memory, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          print("[ACT15] Memory saved:", MEMORY_FILE)

          print("")
          print("========== ACT15 V7.1 SUMMARY ==========")
          print(f"Tasks seen:                 {len(tasks)}")
          print(f"Open tasks:                 {len(open_tasks)}")
          print(f"Paid candidates:            {len(paid_candidates)}")
          print(f"Unknown reward:             {len(unknown_candidates)}")
          print(f"Learning/unpaid:            {len(learning_candidates)}")
          print(f"Tip opportunities:          {len(tip_opportunities)}")
          print(f"High-value learning:        {len(high_value_learning)}")
          print(f"Already bid:                {len(existing_bid_task_ids)}")
          print(f"Bid candidates:             {len(bid_candidates)}")
          print(f"Bids submitted:             {len(submitted)}")
          print(f"Bid errors:                 {len(bid_errors)}")
          print(f"Blocked:                    {len(blocked_candidates)}")
          print("Gemini used:                False")
          print("Project cost:               €0")
          print("=========================================")
          PY

      - name: Commit and push ACT15 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_15_marketplace.json

          if git diff --cached --quiet; then
            echo "No ACT15 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT15 V7.1: improve marketplace opportunity intelligence"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT15 memory pushed successfully."
              exit 0
            fi

            echo "Push failed; retrying..."
            sleep 3
          done

          echo "Unable to push ACT15 memory after 3 attempts."
          exit 1
