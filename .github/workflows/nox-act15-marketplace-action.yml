name: NØX ACT15 V7.1 - Marketplace Action

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

env:
  COLONY_BASE_URL: https://thecolony.ai/api/v1
  MEMORY_FILE: memory/nox_act_15_marketplace.json
  MAX_TASKS: "30"
  MAX_MEMORY_ACTIONS: "500"
  ACTION_DELAY_SECONDS: "1"
  FALLBACK_SATS_PER_USD: "60000"

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT15 Marketplace Action
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_MEMORY_ACTIONS = int(os.environ["MAX_MEMORY_ACTIONS"])
          ACTION_DELAY_SECONDS = float(os.environ["ACTION_DELAY_SECONDS"])
          FALLBACK_SATS_PER_USD = int(os.environ["FALLBACK_SATS_PER_USD"])

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          print("========== NØX ACT15 V7.1 - Marketplace Action ==========")

          # ------------------------------------------------------------
          # Authentication
          # ------------------------------------------------------------
          print("[ACT15] Requesting Colony authentication token...")

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=20,
          )

          print(f"[ACT15] Auth status: {auth.status_code}")

          if auth.status_code != 200:
              try:
                  print(auth.json())
              except Exception:
                  print(auth.text[:1000])
              raise SystemExit(1)

          auth_data = auth.json()
          token = auth_data.get("access_token") or auth_data.get("token")

          if not token:
              raise RuntimeError("Authentication token missing.")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ------------------------------------------------------------
          # Identity
          # ------------------------------------------------------------
          me = session.get(
              f"{BASE_URL}/users/me",
              timeout=20,
          )

          print(f"[ACT15] Identity status: {me.status_code}")

          if me.status_code != 200:
              try:
                  print(me.json())
              except Exception:
                  print(me.text[:1000])
              raise SystemExit(1)

          me_data = me.json()

          identity = (
              me_data.get("handle")
              or me_data.get("username")
              or me_data.get("name")
              or me_data.get("user", {}).get("handle")
              or me_data.get("user", {}).get("username")
          )

          karma = (
              me_data.get("karma")
              or me_data.get("user", {}).get("karma")
          )

          print(f"[ACT15] Identity: @{identity}" if identity and not str(identity).startswith("@") else f"[ACT15] Identity: {identity}")

          if karma is not None:
              print(f"[ACT15] Karma: {karma}")

          # ------------------------------------------------------------
          # Marketplace
          # ------------------------------------------------------------
          marketplace = session.get(
              f"{BASE_URL}/marketplace/tasks?limit={MAX_TASKS}",
              timeout=30,
          )

          print(f"[ACT15] Marketplace status: {marketplace.status_code}")

          if marketplace.status_code != 200:
              try:
                  print(marketplace.json())
              except Exception:
                  print(marketplace.text[:2000])
              raise SystemExit(1)

          marketplace_data = marketplace.json()

          if isinstance(marketplace_data, dict):
              tasks = (
                  marketplace_data.get("items")
                  or marketplace_data.get("tasks")
                  or marketplace_data.get("results")
                  or marketplace_data.get("data")
                  or []
              )
          elif isinstance(marketplace_data, list):
              tasks = marketplace_data
          else:
              tasks = []

          if not isinstance(tasks, list):
              tasks = []

          tasks = tasks[:MAX_TASKS]

          print(f"[ACT15] Tasks seen: {len(tasks)}")

          # ------------------------------------------------------------
          # Open task filter
          # ------------------------------------------------------------
          open_tasks = []

          for task in tasks:
              if not isinstance(task, dict):
                  continue

              status = str(
                  task.get("status")
                  or task.get("state")
                  or "open"
              ).lower().strip()

              # IMPORTANT:
              # The Colony currently uses "bidding" for marketplace
              # tasks that are still available for bids.
              if status in {
                  "open",
                  "active",
                  "available",
                  "published",
                  "pending",
                  "bidding",
              }:
                  open_tasks.append(task)

          print(f"[ACT15] Open tasks: {len(open_tasks)}")

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------
          def clean_text(value):
              return str(value or "").replace("\n", " ").strip()

          def parse_number(value):
              if value is None:
                  return None

              text = str(value).strip()
              text = text.replace("\u00a0", " ")

              if not text:
                  return None

              text = re.sub(r"[^\d,.\-]", "", text)

              if not text:
                  return None

              if "," in text and "." in text:
                  if text.rfind(",") > text.rfind("."):
                      text = text.replace(".", "").replace(",", ".")
                  else:
                      text = text.replace(",", "")
              elif "," in text:
                  parts = text.split(",")

                  if len(parts) == 2 and len(parts[1]) <= 2:
                      text = text.replace(",", ".")
                  else:
                      text = text.replace(",", "")

              try:
                  return float(text)
              except ValueError:
                  return None

          def parse_reward(task):
              """
              Returns:
                reward_sats
                reward_source
                reward_state
              """

              structured_fields = [
                  "reward_sats",
                  "rewardSats",
                  "budget_sats",
                  "budgetSats",
              ]

              for field in structured_fields:
                  if field in task and task.get(field) is not None:
                      value = parse_number(task.get(field))

                      if value is not None and value > 0:
                          return int(round(value)), f"field:{field}", "PAID"

              title = clean_text(task.get("title"))
              body = clean_text(
                  task.get("body")
                  or task.get("description")
                  or task.get("summary")
                  or ""
              )

              text = f"{title} {body}"

              # --------------------------------------------------------
              # Negative reward must never become a positive reward.
              # --------------------------------------------------------
              negative_currency = re.search(
                  r"[-]\s*\$?\s*[\d.,]+\s*(?:USDC|USD|sats?|satoshis?)",
                  text,
                  flags=re.I,
              )

              if negative_currency:
                  return None, "negative_reward", "UNKNOWN_REWARD"

              negative_sats = re.search(
                  r"[-]\s*[\d.,]+\s*(?:sats?|satoshis?)",
                  text,
                  flags=re.I,
              )

              if negative_sats:
                  return None, "negative_reward", "UNKNOWN_REWARD"

              # --------------------------------------------------------
              # Satoshis
              # --------------------------------------------------------
              sats_patterns = [
                  r"([\d][\d,.\s]*)\s*(?:sats?|satoshis?)\b",
                  r"\b(?:sats?|satoshis?)\s*[:=]\s*([\d][\d,.\s]*)",
              ]

              for pattern in sats_patterns:
                  match = re.search(pattern, text, flags=re.I)

                  if match:
                      value = parse_number(match.group(1))

                      if value is not None and value > 0:
                          return int(round(value)), "text_sats", "PAID"

              # --------------------------------------------------------
              # USD / USDC
              # --------------------------------------------------------
              currency_patterns = [
                  r"\$\s*([\d][\d,.\s]*)\s*(?:USDC|USD)\b",
                  r"\b([\d][\d,.\s]*)\s*(?:USDC|USD)\b",
                  r"\b(?:USDC|USD)\s*\$?\s*([\d][\d,.\s]*)",
              ]

              for pattern in currency_patterns:
                  matches = re.finditer(pattern, text, flags=re.I)

                  for match in matches:
                      value = parse_number(match.group(1))

                      if value is None or value <= 0:
                          continue

                      sats = int(round(value * FALLBACK_SATS_PER_USD))

                      if sats > 0:
                          return sats, "text_usd_usdc", "PAID"

              # --------------------------------------------------------
              # "Base USDC from $0.25" and similar constructions.
              # --------------------------------------------------------
              base_pattern = re.search(
                  r"(?:USDC|USD).*?\$\s*([\d][\d,.\s]*)",
                  text,
                  flags=re.I,
              )

              if base_pattern:
                  value = parse_number(base_pattern.group(1))

                  if value is not None and value > 0:
                      sats = int(round(value * FALLBACK_SATS_PER_USD))
                      return sats, "text_currency_base", "PAID"

              # --------------------------------------------------------
              # Reward signals without a numeric value.
              # --------------------------------------------------------
              reward_signals = [
                  "paid",
                  "payment",
                  "reward",
                  "tip",
                  "tips",
                  "bounty",
                  "lightning payment",
                  "lightning",
                  "usdc",
                  "usd",
                  "sats",
                  "satoshi",
                  "per task",
                  "for hire",
              ]

              if any(signal in text.lower() for signal in reward_signals):
                  return None, "reward_signal_without_numeric_value", "UNKNOWN_REWARD"

              return None, "no_reward_signal", "UNPAID"

          def capability_score(text):
              keywords = [
                  "python",
                  "javascript",
                  "js",
                  "api",
                  "automation",
                  "coding",
                  "programming",
                  "data",
                  "data analysis",
                  "data extraction",
                  "web scraping",
                  "scraping",
                  "research",
                  "security",
                  "cybersecurity",
                  "qa",
                  "testing",
                  "audit",
                  "technical",
              ]

              score = 0

              lower = text.lower()

              for keyword in keywords:
                  if keyword in lower:
                      score += 4

              return min(score, 40)

          def domain_score(text):
              lower = text.lower()

              domains = {
                  "virtual_economy": [
                      "economy",
                      "marketplace",
                      "payment",
                      "sats",
                      "lightning",
                      "usdc",
                      "bounty",
                      "reward",
                  ],
                  "cybersecurity": [
                      "security",
                      "cybersecurity",
                      "audit",
                      "vulnerability",
                      "pentest",
                      "authentication",
                      "api security",
                  ],
                  "ai_communities": [
                      "agent",
                      "ai",
                      "community",
                      "collaboration",
                      "exchange",
                      "colony",
                  ],
                  "agent_intelligence_autonomy": [
                      "autonomous",
                      "autonomy",
                      "agent",
                      "reasoning",
                      "learning",
                      "decision",
                      "intelligence",
                  ],
                  "emerging_tech": [
                      "automation",
                      "blockchain",
                      "protocol",
                      "emerging",
                      "technology",
                      "llm",
                  ],
              }

              weights = {
                  "virtual_economy": 25,
                  "cybersecurity": 20,
                  "ai_communities": 20,
                  "agent_intelligence_autonomy": 20,
                  "emerging_tech": 15,
              }

              score = 0

              for domain, keywords in domains.items():
                  if any(keyword in lower for keyword in keywords):
                      score += weights[domain] * 0.2

              return min(round(score), 25)

          def learning_score(text):
              lower = text.lower()

              keywords = [
                  "learn",
                  "learning",
                  "research",
                  "analysis",
                  "experiment",
                  "testing",
                  "test",
                  "proof",
                  "documentation",
                  "knowledge",
                  "experience",
                  "benchmark",
                  "audit",
              ]

              score = 0

              for keyword in keywords:
                  if keyword in lower:
                      score += 4

              return min(score, 25)

          def tip_score(text):
              lower = text.lower()

              high = [
                  "tip",
                  "tips",
                  "bonus",
                  "bounty",
                  "reward",
                  "sats",
                  "lightning",
              ]

              medium = [
                  "reputation",
                  "referral",
                  "future work",
                  "ongoing work",
                  "long-term",
                  "relationship",
                  "community",
              ]

              score = 0

              for keyword in high:
                  if keyword in lower:
                      score += 3

              for keyword in medium:
                  if keyword in lower:
                      score += 2

              return min(score, 15)

          def economic_score(reward_sats):
              if not reward_sats:
                  return 0

              if reward_sats >= 300000:
                  return 10

              if reward_sats >= 100000:
                  return 8

              if reward_sats >= 30000:
                  return 6

              if reward_sats >= 10000:
                  return 4

              if reward_sats >= 1000:
                  return 2

              return 1

          # ------------------------------------------------------------
          # Existing bid detection
          # ------------------------------------------------------------
          def already_bid(task):
              direct_fields = [
                  "my_bid",
                  "myBid",
                  "has_bid",
                  "hasBid",
                  "already_bid",
                  "alreadyBid",
              ]

              for field in direct_fields:
                  value = task.get(field)

                  if value is True:
                      return True

                  if isinstance(value, dict):
                      return True

              task_id = (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("taskId")
              )

              if not task_id:
                  return False

              try:
                  response = session.get(
                      f"{BASE_URL}/marketplace/{task_id}/bids",
                      timeout=20,
                  )

                  if response.status_code != 200:
                      return False

                  data = response.json()

                  if isinstance(data, dict):
                      bids = (
                          data.get("items")
                          or data.get("bids")
                          or data.get("results")
                          or data.get("data")
                          or []
                      )
                  elif isinstance(data, list):
                      bids = data
                  else:
                      bids = []

                  if not isinstance(bids, list):
                      return False

                  for bid in bids:
                      if not isinstance(bid, dict):
                          continue

                      candidate_values = [
                          bid.get("handle"),
                          bid.get("username"),
                          bid.get("user_handle"),
                          bid.get("userHandle"),
                          bid.get("agent_handle"),
                          bid.get("agentHandle"),
                      ]

                      nested = bid.get("user") or bid.get("agent")

                      if isinstance(nested, dict):
                          candidate_values.extend([
                              nested.get("handle"),
                              nested.get("username"),
                          ])

                      for value in candidate_values:
                          if value is None:
                              continue

                          value = str(value).lstrip("@").lower()

                          if value == str(identity).lstrip("@").lower():
                              return True

              except Exception:
                  pass

              return False

          # ------------------------------------------------------------
          # Analyse opportunities
          # ------------------------------------------------------------
          paid_candidates = []
          unknown_candidates = []
          learning_candidates = []
          tip_opportunities = []
          high_value_learning = []
          already_bid_count = 0

          for task in open_tasks:
              title = clean_text(task.get("title"))
              body = clean_text(
                  task.get("body")
                  or task.get("description")
                  or task.get("summary")
                  or ""
              )

              combined = f"{title} {body}"

              reward_sats, reward_source, reward_state = parse_reward(task)

              capability = capability_score(combined)
              learning = learning_score(combined)
              domain = domain_score(combined)
              tips = tip_score(combined)
              economic = economic_score(reward_sats)

              opportunity = round(
                  capability * 0.35
                  + learning * 0.20
                  + domain * 0.20
                  + tips * 0.20
                  + economic * 0.05,
                  2,
              )

              record = {
                  "task_id": task.get("id") or task.get("task_id") or task.get("taskId"),
                  "title": title,
                  "status": task.get("status"),
                  "reward_sats": reward_sats,
                  "reward_source": reward_source,
                  "reward_state": reward_state,
                  "capability_score": capability,
                  "learning_score": learning,
                  "domain_score": domain,
                  "tip_score": tips,
                  "economic_score": economic,
                  "opportunity_score": opportunity,
              }

              if reward_state == "PAID":
                  paid_candidates.append(record)

              elif reward_state == "UNKNOWN_REWARD":
                  unknown_candidates.append(record)

              else:
                  learning_candidates.append(record)

              if tips >= 5:
                  tip_opportunities.append(record)

              if learning >= 10 or capability >= 16:
                  high_value_learning.append(record)

              if already_bid(task):
                  already_bid_count += 1

          print(f"[ACT15] Paid candidates: {len(paid_candidates)}")
          print(f"[ACT15] Unknown-reward opportunities: {len(unknown_candidates)}")
          print(f"[ACT15] Learning/unpaid opportunities: {len(learning_candidates)}")
          print(f"[ACT15] Tip opportunities: {len(tip_opportunities)}")
          print(f"[ACT15] High-value learning: {len(high_value_learning)}")
          print(f"[ACT15] Already bid: {already_bid_count}")

          # ------------------------------------------------------------
          # Capability-first selection
          # ------------------------------------------------------------
          bid_candidates = []

          for candidate in paid_candidates:
              capability = candidate["capability_score"]
              opportunity = candidate["opportunity_score"]
              tips = candidate["tip_score"]
              learning = candidate["learning_score"]

              bid_ready = (
                  capability >= 8
                  and (
                      opportunity >= 8
                      or tips >= 5
                      or learning >= 10
                  )
              )

              if bid_ready:
                  bid_candidates.append(candidate)

          print(f"[ACT15] Bid candidates: {len(bid_candidates)}")

          # ------------------------------------------------------------
          # Submit bids
          # ------------------------------------------------------------
          bids_submitted = 0
          bid_errors = 0
          blocked = 0

          for candidate in bid_candidates:
              task_id = candidate["task_id"]
              reward_sats = candidate["reward_sats"]

              if not task_id or not reward_sats:
                  continue

              # Technical minimum only.
              # This is NOT an opportunity-selection threshold.
              bid_amount = max(1, round(reward_sats * 0.20))
              bid_amount = min(bid_amount, reward_sats)

              description = (
                  "NØX can handle this task using autonomous "
                  "research, coding, API, automation, analysis, "
                  "or verification capabilities as appropriate. "
                  "Deliverables can be provided with clear proof."
              )

              payload = {
                  "bid_amount_sats": bid_amount,
                  "bid_description": description,
              }

              try:
                  response = session.post(
                      f"{BASE_URL}/marketplace/{task_id}/bid",
                      json=payload,
                      timeout=30,
                  )

                  if response.status_code in (200, 201):
                      bids_submitted += 1

                      print(
                          f"[ACT15] Bid submitted: "
                          f"{candidate['title'][:100]} "
                          f"({bid_amount} sats)"
                      )

                  elif response.status_code == 409:
                      already_bid_count += 1

                      print(
                          f"[ACT15] Bid conflict/already submitted: "
                          f"{candidate['title'][:100]}"
                      )

                  elif response.status_code in (401, 403):
                      blocked += 1

                      print(
                          f"[ACT15] Bid blocked ({response.status_code}): "
                          f"{candidate['title'][:100]}"
                      )

                  else:
                      bid_errors += 1

                      try:
                          detail = response.json()
                      except Exception:
                          detail = response.text[:1000]

                      print(
                          f"[ACT15] Bid error {response.status_code}: "
                          f"{candidate['title'][:100]}"
                      )
                      print(f"[ACT15] Response: {detail}")

              except Exception as exc:
                  bid_errors += 1
                  print(
                      f"[ACT15] Bid exception for "
                      f"{candidate['title'][:100]}: {exc}"
                  )

              time.sleep(ACTION_DELAY_SECONDS)

          # ------------------------------------------------------------
          # Memory
          # ------------------------------------------------------------
          MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)

          memory = {
              "workflow": "ACT15_V7.1",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "identity": identity,
              "karma": karma,
              "tasks_seen": len(tasks),
              "open_tasks": len(open_tasks),
              "paid_candidates": paid_candidates,
              "unknown_reward_opportunities": unknown_candidates,
              "learning_unpaid_opportunities": learning_candidates,
              "tip_opportunities": tip_opportunities,
              "high_value_learning": high_value_learning,
              "bid_candidates": bid_candidates,
              "bids_submitted": bids_submitted,
              "bid_errors": bid_errors,
              "blocked": blocked,
              "already_bid": already_bid_count,
              "policy": {
                  "minimum_sats_for_opportunity": 0,
                  "minimum_sats_for_bid": 1,
                  "minimum_sats_for_bid_is_technical_only": True,
                  "capability_first_selection": True,
                  "unpaid_opportunities_are_valid": True,
                  "unknown_reward_not_assumed_paid_or_unpaid": True,
                  "tip_opportunities_must_be_detected": True,
                  "tip_potential_affects_opportunity_score": True,
                  "never_invent_reward": True,
                  "never_auto_pay": True,
                  "never_auto_spend": True,
                  "gemini_used": False,
                  "project_cost_eur": 0,
              },
          }

          # Preserve history.
          existing = []

          if MEMORY_FILE.exists():
              try:
                  previous = json.loads(MEMORY_FILE.read_text())
                  if isinstance(previous, dict):
                      existing = previous.get("history", [])
              except Exception:
                  existing = []

          if not isinstance(existing, list):
              existing = []

          history_entry = {
              "timestamp": memory["timestamp"],
              "tasks_seen": memory["tasks_seen"],
              "open_tasks": memory["open_tasks"],
              "paid_candidates": len(paid_candidates),
              "unknown_reward_opportunities": len(unknown_candidates),
              "learning_unpaid_opportunities": len(learning_candidates),
              "tip_opportunities": len(tip_opportunities),
              "high_value_learning": len(high_value_learning),
              "bid_candidates": len(bid_candidates),
              "bids_submitted": bids_submitted,
              "bid_errors": bid_errors,
              "blocked": blocked,
              "already_bid": already_bid_count,
          }

          existing.append(history_entry)
          existing = existing[-MAX_MEMORY_ACTIONS:]

          memory["history"] = existing

          MEMORY_FILE.write_text(
              json.dumps(memory, indent=2, ensure_ascii=False)
          )

          print(f"[ACT15] Memory saved: {MEMORY_FILE}")

          # ------------------------------------------------------------
          # Git commit / push
          # ------------------------------------------------------------
          subprocess.run(
              ["git", "config", "user.name", "NØX Origin"],
              check=True,
          )

          subprocess.run(
              ["git", "config", "user.email", "nox-origin@users.noreply.github.com"],
              check=True,
          )

          subprocess.run(
              ["git", "add", str(MEMORY_FILE)],
              check=True,
          )

          diff_check = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if diff_check.returncode != 0:
              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "ACT15 V7.1: update marketplace memory",
                  ],
                  check=True,
              )

              push_success = False

              for attempt in range(3):
                  try:
                      subprocess.run(
                          ["git", "fetch", "origin", "main"],
                          check=True,
                      )

                      subprocess.run(
                          ["git", "rebase", "origin/main"],
                          check=True,
                      )

                      subprocess.run(
                          ["git", "push", "origin", "HEAD:main"],
                          check=True,
                      )

                      push_success = True
                      break

                  except subprocess.CalledProcessError as exc:
                      print(
                          f"[ACT15] Git push attempt {attempt + 1} failed: {exc}"
                      )

                      if attempt < 2:
                          subprocess.run(
                              ["git", "rebase", "--abort"],
                              check=False,
                          )
                          time.sleep(3)

              if not push_success:
                  raise RuntimeError(
                      "Could not push ACT15 memory after 3 attempts."
                  )

          else:
              print("[ACT15] No memory changes to commit.")

          # ------------------------------------------------------------
          # Summary
          # ------------------------------------------------------------
          print("\n========== ACT15 V7.1 SUMMARY ==========")
          print(f"Tasks seen:                 {len(tasks)}")
          print(f"Open tasks:                 {len(open_tasks)}")
