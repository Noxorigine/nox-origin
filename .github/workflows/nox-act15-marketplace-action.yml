name: NØX ACT 15 V7.3 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: "https://thecolony.ai/api/v1"
      MEMORY_FILE: "memory/nox_act_15_marketplace.json"
      MIN_BID_SATS: "1"
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"
      FALLBACK_SATS_PER_USD: "60000"

      ACT15_SCRIPT: |
        import json
        import os
        import re
        import sys
        import time
        from datetime import datetime, timezone

        import requests

        BASE_URL = os.environ.get(
            "COLONY_BASE_URL",
            "https://thecolony.ai/api/v1"
        ).rstrip("/")

        MEMORY_FILE = os.environ.get(
            "MEMORY_FILE",
            "memory/nox_act_15_marketplace.json"
        )

        API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

        MIN_BID_SATS = int(os.environ.get("MIN_BID_SATS", "1"))
        MAX_TASKS = int(os.environ.get("MAX_TASKS", "30"))
        MAX_MEMORY_ACTIONS = int(
            os.environ.get("MAX_MEMORY_ACTIONS", "500")
        )
        ACTION_DELAY_SECONDS = float(
            os.environ.get("ACTION_DELAY_SECONDS", "1")
        )
        FALLBACK_SATS_PER_USD = int(
            os.environ.get("FALLBACK_SATS_PER_USD", "60000")
        )

        GEMINI_ENABLED = False
        PAYMENTS_ENABLED = False

        SAFETY_BLOCKED_TERMS = [
            "password",
            "private key",
            "seed phrase",
            "recovery phrase",
            "secret key",
            "api secret",
            "credential theft",
            "steal credentials",
            "malware",
            "ransomware",
            "botnet",
            "credential harvesting",
        ]

        CAPABILITY_TERMS = [
            "python",
            "api",
            "automation",
            "coding",
            "code",
            "script",
            "research",
            "data",
            "debug",
            "debugging",
            "testing",
            "test",
            "integration",
            "mcp",
            "json",
            "csv",
            "github",
            "git",
            "documentation",
            "analysis",
            "audit",
            "security",
            "infrastructure",
            "server",
            "servers",
            "deployment",
            "deploy",
            "webhook",
            "lightning",
            "bitcoin",
            "agent",
            "ai",
        ]

        LEARNING_TERMS = [
            "learn",
            "learning",
            "research",
            "experiment",
            "explore",
            "investigate",
            "study",
            "understand",
            "test",
            "testing",
            "observe",
            "documentation",
            "analysis",
            "audit",
        ]

        SUPPLY_STRONG_TERMS = [
            "for hire",
            "hire me",
            "my services",
            "i offer",
            "i provide",
            "i can help",
            "i can do",
            "available for work",
            "available to work",
            "available for hire",
            "open for work",
            "offering services",
            "service provider",
            "freelance services",
            "services available",
        ]

        DEMAND_STRONG_TERMS = [
            "paid task",
            "paid_task",
            "looking for",
            "looking to hire",
            "need someone",
            "need an agent",
            "need a worker",
            "worker needed",
            "seeking a worker",
            "seeking someone",
            "hire someone",
            "want someone to",
            "i need",
            "we need",
            "build this for me",
            "create this for me",
            "fix this for me",
            "research this for me",
            "please build",
            "please create",
            "please fix",
            "please research",
            "task:",
            "task -",
            "task —",
        ]

        SUPPLY_METADATA_KEYS = [
            "seller",
            "provider",
            "service_provider",
            "serviceProvider",
            "offerer",
            "author_offering",
        ]

        DEMAND_METADATA_KEYS = [
            "buyer",
            "requester",
            "requester_id",
            "client",
            "customer",
        ]

        def now_iso():
            return datetime.now(timezone.utc).isoformat()

        def normalize_text(value):
            if value is None:
                return ""

            if isinstance(value, (dict, list)):
                try:
                    value = json.dumps(
                        value,
                        ensure_ascii=False,
                        sort_keys=True
                    )
                except Exception:
                    value = str(value)

            return str(value).strip().lower()

        def collect_text(obj, depth=0):
            if depth > 4:
                return ""

            if obj is None:
                return ""

            if isinstance(obj, str):
                return obj

            if isinstance(obj, (int, float, bool)):
                return str(obj)

            if isinstance(obj, list):
                return " ".join(
                    collect_text(item, depth + 1)
                    for item in obj[:100]
                )

            if isinstance(obj, dict):
                parts = []

                for key, value in obj.items():
                    parts.append(str(key))
                    value_text = collect_text(
                        value,
                        depth + 1
                    )

                    if value_text:
                        parts.append(value_text)

                return " ".join(parts)

            return str(obj)

        def first_value(obj, keys):
            if not isinstance(obj, dict):
                return None

            for key in keys:
                if key in obj and obj[key] not in (None, ""):
                    return obj[key]

            return None

        def get_task_id(task):
            if not isinstance(task, dict):
                return None

            for key in [
                "id",
                "task_id",
                "taskId",
                "uuid",
            ]:
                value = task.get(key)

                if value:
                    return str(value)

            return None

        def get_title(task):
            if not isinstance(task, dict):
                return ""

            for key in [
                "title",
                "name",
                "subject",
                "headline",
            ]:
                value = task.get(key)

                if value:
                    return str(value)

            return ""

        def get_description(task):
            if not isinstance(task, dict):
                return ""

            for key in [
                "description",
                "body",
                "content",
                "details",
                "task_description",
                "taskDescription",
            ]:
                value = task.get(key)

                if value:
                    return str(value)

            return ""

        def get_author_text(task):
            if not isinstance(task, dict):
                return ""

            values = []

            for key in [
                "author",
                "creator",
                "owner",
                "user",
                "agent",
                "created_by",
                "createdBy",
            ]:
                value = task.get(key)

                if value:
                    values.append(
                        collect_text(value)
                    )

            return " ".join(values)

        def classify_direction(task):
            title = get_title(task)
            description = get_description(task)
            author = get_author_text(task)

            combined = normalize_text(
                " ".join([
                    title,
                    description,
                    author,
                ])
            )

            supply_hits = [
                term
                for term in SUPPLY_STRONG_TERMS
                if term in combined
            ]

            demand_hits = [
                term
                for term in DEMAND_STRONG_TERMS
                if term in combined
            ]

            if (
                "for hire" in combined
                or "hire me" in combined
            ):
                return {
                    "direction": "SUPPLY",
                    "confidence": "HIGH",
                    "signals": supply_hits,
                    "reason": "explicit_supply_language",
                }

            if supply_hits and not demand_hits:
                return {
                    "direction": "SUPPLY",
                    "confidence": "HIGH",
                    "signals": supply_hits,
                    "reason": "supply_language",
                }

            if supply_hits and demand_hits:
                return {
                    "direction": "UNKNOWN_DIRECTION",
                    "confidence": "LOW",
                    "signals": supply_hits + demand_hits,
                    "reason": "conflicting_direction_signals",
                }

            if demand_hits:
                return {
                    "direction": "DEMAND",
                    "confidence": "HIGH",
                    "signals": demand_hits,
                    "reason": "demand_language",
                }

            supply_metadata = []
            demand_metadata = []

            if isinstance(task, dict):
                for key in SUPPLY_METADATA_KEYS:
                    if task.get(key):
                        supply_metadata.append(key)

                for key in DEMAND_METADATA_KEYS:
                    if task.get(key):
                        demand_metadata.append(key)

            if supply_metadata and not demand_metadata:
                return {
                    "direction": "SUPPLY",
                    "confidence": "MEDIUM",
                    "signals": supply_metadata,
                    "reason": "supply_metadata",
                }

            if demand_metadata and not supply_metadata:
                return {
                    "direction": "DEMAND",
                    "confidence": "MEDIUM",
                    "signals": demand_metadata,
                    "reason": "demand_metadata",
                }

            return {
                "direction": "UNKNOWN_DIRECTION",
                "confidence": "LOW",
                "signals": [],
                "reason": "no_clear_market_direction",
            }

        def parse_number(value):
            if value is None:
                return None

            if isinstance(value, bool):
                return None

            if isinstance(value, (int, float)):
                return float(value)

            text = str(value).strip()
            text = text.replace(",", "")

            match = re.search(
                r"-?\d+(?:\.\d+)?",
                text
            )

            if not match:
                return None

            try:
                return float(match.group(0))
            except Exception:
                return None

        def parse_reward_sats(task):
            if not isinstance(task, dict):
                return None, None

            structured_sats_keys = [
                "reward_sats",
                "rewardSats",
                "sats",
                "sat",
                "amount_sats",
                "amountSats",
                "payment_sats",
                "paymentSats",
                "budget_sats",
                "budgetSats",
            ]

            for key in structured_sats_keys:
                value = task.get(key)
                number = parse_number(value)

                if number is not None and number >= 0:
                    return (
                        int(number),
                        f"structured:{key}"
                    )

            text = normalize_text(task)

            sat_patterns = [
                r"(\d[\d\s,\.]*)\s*sats?\b",
                r"(\d[\d\s,\.]*)\s*satoshis?\b",
            ]

            for pattern in sat_patterns:
                match = re.search(
                    pattern,
                    text
                )

                if match:
                    raw = (
                        match.group(1)
                        .replace(" ", "")
                        .replace(",", "")
                    )

                    try:
                        amount = float(raw)

                        if amount >= 0:
                            return (
                                int(amount),
                                "text:sats"
                            )
                    except Exception:
                        pass

            currency_keys = [
                "reward_usdc",
                "rewardUsdc",
                "usdc",
                "reward_usd",
                "rewardUsd",
                "usd",
                "amount_usdc",
                "amountUsdc",
                "amount_usd",
                "amountUsd",
                "budget_usdc",
                "budgetUsdc",
                "budget_usd",
                "budgetUsd",
            ]

            for key in currency_keys:
                value = task.get(key)

                if value is None:
                    continue

                number = parse_number(value)

                if number is not None and number >= 0:
                    return (
                        int(
                            number
                            * FALLBACK_SATS_PER_USD
                        ),
                        f"structured_currency:{key}",
                    )

            currency_patterns = [
                r"(\d[\d\s,\.]*)\s*(?:usdc|usd)\b",
                r"\$\s*(\d[\d\s,\.]*)",
            ]

            for pattern in currency_patterns:
                for match in re.finditer(
                    pattern,
                    text
                ):
                    raw = (
                        match.group(1)
                        .replace(" ", "")
                        .replace(",", "")
                    )

                    try:
                        amount = float(raw)

                        if amount >= 0:
                            return (
                                int(
                                    amount
                                    * FALLBACK_SATS_PER_USD
                                ),
                                "text:currency",
                            )
                    except Exception:
                        pass

            return None, None

        def is_safety_blocked(task):
            text = normalize_text(task)

            return [
                term
                for term in SAFETY_BLOCKED_TERMS
                if term in text
            ]

        def capability_score(task):
            text = normalize_text(task)

            hits = [
                term
                for term in CAPABILITY_TERMS
                if term in text
            ]

            return min(len(hits), 8), hits

        def learning_score(task):
            text = normalize_text(task)

            hits = [
                term
                for term in LEARNING_TERMS
                if term in text
            ]

            return min(len(hits), 8), hits

        def economic_score(reward_sats):
            if reward_sats is None:
                return 0

            if reward_sats <= 0:
                return 0

            if reward_sats < 1000:
                return 1

            if reward_sats < 10000:
                return 2

            if reward_sats < 100000:
                return 3

            if reward_sats < 1000000:
                return 4

            return 5

        def score_task(task, direction, reward_sats):
            cap_score, cap_hits = capability_score(task)
            learn_score, learn_hits = learning_score(task)
            econ_score = economic_score(reward_sats)

            total = (
                cap_score
                + learn_score
                + econ_score
            )

            if direction == "DEMAND":
                total += 2

            return {
                "total": total,
                "capability_score": cap_score,
                "learning_score": learn_score,
                "economic_score": econ_score,
                "capability_hits": cap_hits[:8],
                "learning_hits": learn_hits[:8],
            }

        def load_memory():
            if not os.path.exists(MEMORY_FILE):
                return {
                    "schema_version": "7.3",
                    "agent": "NØX",
                    "workflow": "ACT15",
                    "updated_at": now_iso(),
                    "marketplace_actions": [],
                    "policy": {},
                }

            try:
                with open(
                    MEMORY_FILE,
                    "r",
                    encoding="utf-8"
                ) as handle:
                    data = json.load(handle)

                if not isinstance(data, dict):
                    raise ValueError(
                        "memory root is not an object"
                    )

                data.setdefault(
                    "marketplace_actions",
                    []
                )
                data.setdefault(
                    "policy",
                    {}
                )

                return data

            except Exception as exc:
                print(
                    f"MEMORY_LOAD_WARNING: {exc}",
                    file=sys.stderr
                )

                return {
                    "schema_version": "7.3",
                    "agent": "NØX",
                    "workflow": "ACT15",
                    "updated_at": now_iso(),
                    "marketplace_actions": [],
                    "policy": {},
                }

        def save_memory(memory):
            os.makedirs(
                os.path.dirname(MEMORY_FILE)
                or ".",
                exist_ok=True
            )

            memory["updated_at"] = now_iso()

            actions = memory.get(
                "marketplace_actions",
                []
            )

            if len(actions) > MAX_MEMORY_ACTIONS:
                memory["marketplace_actions"] = (
                    actions[-MAX_MEMORY_ACTIONS:]
                )

            temporary_file = (
                f"{MEMORY_FILE}.tmp"
            )

            with open(
                temporary_file,
                "w",
                encoding="utf-8"
            ) as handle:
                json.dump(
                    memory,
                    handle,
                    ensure_ascii=False,
                    indent=2
                )
                handle.write("\n")

            os.replace(
                temporary_file,
                MEMORY_FILE
            )

        def api_headers(token):
            return {
                "Authorization": f"Bearer {token}",
                "Accept": "application/json",
                "Content-Type": "application/json",
            }

        def authenticate():
            if not API_KEY:
                raise RuntimeError(
                    "COLONY_API_KEY is missing"
                )

            response = requests.post(
                f"{BASE_URL}/auth/token",
                json={"api_key": API_KEY},
                timeout=30,
            )

            if response.status_code >= 400:
                raise RuntimeError(
                    "AUTH_FAILED "
                    f"{response.status_code}: "
                    f"{response.text[:500]}"
                )

            data = response.json()

            token = (
                data.get("access_token")
                or data.get("token")
                or data.get("jwt")
            )

            if not token:
                raise RuntimeError(
                    "AUTH_RESPONSE_HAS_NO_TOKEN"
                )

            return token

        def get_identity(token):
            response = requests.get(
                f"{BASE_URL}/users/me",
                headers=api_headers(token),
                timeout=30,
            )

            if response.status_code >= 400:
                raise RuntimeError(
                    "IDENTITY_FAILED "
                    f"{response.status_code}: "
                    f"{response.text[:500]}"
                )

            data = response.json()

            if isinstance(data, dict):
                return data.get("user", data)

            return data

        def extract_tasks(payload):
            if isinstance(payload, list):
                return payload

            if not isinstance(payload, dict):
                return []

            for key in [
                "tasks",
                "items",
                "results",
                "data",
            ]:
                value = payload.get(key)

                if isinstance(value, list):
                    return value

                if isinstance(value, dict):
                    nested = extract_tasks(value)

                    if nested:
                        return nested

            return []

        def get_marketplace_tasks(token):
            candidate_paths = [
                "/marketplace/tasks",
                "/marketplace",
                "/tasks",
            ]

            last_error = None

            for path in candidate_paths:
                try:
                    response = requests.get(
                        f"{BASE_URL}{path}",
                        headers=api_headers(token),
                        params={
                            "limit": MAX_TASKS
                        },
                        timeout=30,
                    )

                    if response.status_code == 404:
                        continue

                    if response.status_code >= 400:
                        last_error = (
                            f"{path}: "
                            f"{response.status_code}: "
                            f"{response.text[:300]}"
                        )
                        continue

                    tasks = extract_tasks(
                        response.json()
                    )

                    if tasks:
                        return tasks[:MAX_TASKS]

                except Exception as exc:
                    last_error = (
                        f"{path}: {exc}"
                    )

            if last_error:
                raise RuntimeError(
                    "MARKETPLACE_TASKS_FAILED: "
                    + last_error
                )

            return []

        def extract_bid_items(payload):
            if isinstance(payload, list):
                return payload

            if not isinstance(payload, dict):
                return []

            for key in [
                "bids",
                "items",
                "results",
                "data",
            ]:
                value = payload.get(key)

                if isinstance(value, list):
                    return value

                if isinstance(value, dict):
                    nested = extract_bid_items(
                        value
                    )

                    if nested:
                        return nested

            return []

        def get_existing_bids(
            token,
            task_id
        ):
            paths = [
                f"/marketplace/{task_id}/bids",
                f"/marketplace/tasks/{task_id}/bids",
                f"/tasks/{task_id}/bids",
            ]

            for path in paths:
                try:
                    response = requests.get(
                        f"{BASE_URL}{path}",
                        headers=api_headers(token),
                        timeout=30,
                    )

                    if response.status_code == 404:
                        continue

                    if response.status_code >= 400:
                        continue

                    return extract_bid_items(
                        response.json()
                    )

                except Exception:
                    continue

            return []

        def identity_values(identity):
            values = set()

            def walk(obj, depth=0):
                if depth > 5:
                    return

                if isinstance(obj, dict):
                    for key, value in obj.items():
                        key_lower = str(key).lower()

                        if key_lower in {
                            "id",
                            "user_id",
                            "userid",
                            "username",
                            "handle",
                            "agent_id",
                            "agentid",
                        }:
                            if isinstance(
                                value,
                                (str, int)
                            ):
                                values.add(
                                    str(value).lower()
                                )

                        walk(
                            value,
                            depth + 1
                        )

                elif isinstance(obj, list):
                    for item in obj[:100]:
                        walk(
                            item,
                            depth + 1
                        )

            walk(identity)

            return values

        def bid_belongs_to_nox(
            bid,
            identity
        ):
            nox_values = identity_values(
                identity
            )

            if not nox_values:
                return False

            found = set()

            def walk(obj, depth=0):
                if depth > 5:
                    return

                if isinstance(obj, dict):
                    for key, value in obj.items():
                        key_lower = str(key).lower()

                        if key_lower in {
                            "id",
                            "user_id",
                            "userid",
                            "username",
                            "handle",
                            "agent_id",
                            "agentid",
                        }:
                            if isinstance(
                                value,
                                (str, int)
                            ):
                                found.add(
                                    str(value).lower()
                                )

                        walk(
                            value,
                            depth + 1
                        )

                elif isinstance(obj, list):
                    for item in obj[:100]:
                        walk(
                            item,
                            depth + 1
                        )

            walk(bid)

            return bool(
                nox_values.intersection(found)
            )

        def has_existing_nox_bid(
            token,
            task_id,
            identity
        ):
            bids = get_existing_bids(
                token,
                task_id
            )

            for bid in bids:
                if bid_belongs_to_nox(
                    bid,
                    identity
                ):
                    return True, bid

            return False, None

        def submit_bid(
            token,
            task_id,
            amount_sats
        ):
            if PAYMENTS_ENABLED:
                raise RuntimeError(
                    "PAYMENTS_ENABLED must remain False"
                )

            if amount_sats < MIN_BID_SATS:
                return {
                    "submitted": False,
                    "reason": "below_minimum_bid",
                }

            payload = {
                "amount_sats": int(
                    amount_sats
                ),
            }

            paths = [
                f"/marketplace/{task_id}/bids",
                f"/marketplace/tasks/{task_id}/bids",
            ]

            for path in paths:
                try:
                    response = requests.post(
                        f"{BASE_URL}{path}",
                        headers=api_headers(token),
                        json=payload,
                        timeout=30,
                    )

                    if response.status_code in {
                        200,
                        201,
                        202,
                    }:
                        try:
                            data = response.json()
                        except Exception:
                            data = {
                                "raw": response.text[:1000]
                            }

                        return {
                            "submitted": True,
                            "response": data,
                        }

                    if response.status_code == 404:
                        continue

                    return {
                        "submitted": False,
                        "reason": (
                            f"http_{response.status_code}"
                        ),
                        "response": (
                            response.text[:1000]
                        ),
                    }

                except Exception as exc:
                    return {
                        "submitted": False,
                        "reason": str(exc),
                    }

            return {
                "submitted": False,
                "reason": "no_bid_endpoint",
            }

        def main():
            print("=== NØX ACT15 V7.3 ===")
            print(
                "Gemini:",
                GEMINI_ENABLED
            )
            print(
                "Payments:",
                PAYMENTS_ENABLED
            )
            print(
                "Minimum bid:",
                MIN_BID_SATS,
                "sat"
            )
            print(
                "Opportunity minimum reward:",
                "0 sats"
            )

            if GEMINI_ENABLED:
                raise RuntimeError(
                    "SAFETY_STOP: Gemini must be disabled"
                )

            if PAYMENTS_ENABLED:
                raise RuntimeError(
                    "SAFETY_STOP: payments must be disabled"
                )

            memory = load_memory()

            memory["policy"] = {
                "market_direction_required": True,
                "supply_posts_never_bid": True,
                "unknown_direction_never_bid": True,
                "for_hire_overrides_metadata": True,
                "bid_amount_equals_advertised_reward": True,
                "minimum_sats_for_opportunity": 0,
                "minimum_sats_for_bid": MIN_BID_SATS,
                "payments_enabled": False,
                "gemini_enabled": False,
                "unpaid_tasks_can_be_learning_candidates": True,
            }

            token = authenticate()

            print("AUTH: OK")

            identity = get_identity(token)

            print(
                "IDENTITY:",
                json.dumps(
                    identity,
                    ensure_ascii=False
                )[:1000]
            )

            tasks = get_marketplace_tasks(token)

            print(
                "TASKS_RECEIVED:",
                len(tasks)
            )

            summary = {
                "seen": len(tasks),
                "open": 0,
                "demand_tasks": 0,
                "supply_posts": 0,
                "unknown_direction": 0,
                "paid_candidates": 0,
                "unknown_reward": 0,
                "learning_candidates": 0,
                "tip_opportunities": 0,
                "high_value_learning": 0,
                "bid_candidates": 0,
                "existing_bids": 0,
                "bids_submitted": 0,
                "blocked_safety": 0,
                "errors": 0,
            }

            actions = memory.setdefault(
                "marketplace_actions",
                []
            )

            for task in tasks:
                task_id = get_task_id(task)
                title = get_title(task)

                if not task_id:
                    continue

                status = normalize_text(
                    first_value(
                        task,
                        [
                            "status",
                            "state",
                        ]
                    )
                )

                if status in {
                    "closed",
                    "completed",
                    "cancelled",
                    "canceled",
                    "expired",
                    "paid",
                }:
                    continue

                summary["open"] += 1

                direction_info = classify_direction(
                    task
                )

                direction = direction_info[
                    "direction"
                ]

                if direction == "DEMAND":
                    summary["demand_tasks"] += 1
                elif direction == "SUPPLY":
                    summary["supply_posts"] += 1
                else:
                    summary[
                        "unknown_direction"
                    ] += 1

                reward_sats, reward_source = (
                    parse_reward_sats(task)
                )

                safety_hits = is_safety_blocked(
                    task
                )

                if safety_hits:
                    summary[
                        "blocked_safety"
                    ] += 1

                scores = score_task(
                    task,
                    direction,
                    reward_sats
                )

                if reward_sats is None:
                    summary[
                        "unknown_reward"
                    ] += 1
                elif reward_sats > 0:
                    summary[
                        "paid_candidates"
                    ] += 1

                if scores[
                    "learning_score"
                ] > 0:
                    summary[
                        "high_value_learning"
                    ] += 1

                text = normalize_text(task)

                tip_signal = any(
                    phrase in text
                    for phrase in [
                        "tip",
                        "tips",
                        "tip-based",
                        "tip based",
                        "bounty",
                        "reward",
                        "paid",
                        "sats",
                        "usdc",
                    ]
                )

                if tip_signal:
                    summary[
                        "tip_opportunities"
                    ] += 1

                action = {
                    "timestamp": now_iso(),
                    "task_id": task_id,
                    "title": title,
                    "direction": direction,
                    "direction_confidence": (
                        direction_info[
                            "confidence"
                        ]
                    ),
                    "direction_signals": (
                        direction_info[
                            "signals"
                        ]
                    ),
                    "direction_reason": (
                        direction_info[
                            "reason"
                        ]
                    ),
                    "reward_sats": reward_sats,
                    "reward_source": reward_source,
                    "score": scores,
                    "safety_hits": safety_hits,
                    "decision": None,
                    "bid_amount_sats": None,
                    "bid_result": None,
                }

                if safety_hits:
                    action["decision"] = (
                        "blocked_safety"
                    )
                    actions.append(action)
                    continue

                if direction != "DEMAND":
                    if direction == "SUPPLY":
                        action["decision"] = (
                            "supply_not_bid"
                        )
                    else:
                        action["decision"] = (
                            "unknown_direction_not_bid"
                        )

                    actions.append(action)
                    continue

                if reward_sats is None:
                    summary[
                        "learning_candidates"
                    ] += 1

                    action["decision"] = (
                        "learning_candidate_no_reward"
                    )

                    actions.append(action)
                    continue

                if reward_sats <= 0:
                    summary[
                        "learning_candidates"
                    ] += 1

                    action["decision"] = (
                        "learning_candidate_zero_reward"
                    )

                    actions.append(action)
                    continue

                if reward_sats < MIN_BID_SATS:
                    action["decision"] = (
                        "no_valid_bid_amount"
                    )

                    actions.append(action)
                    continue

                summary[
                    "bid_candidates"
                ] += 1

                exists, existing_bid = (
                    has_existing_nox_bid(
                        token,
                        task_id,
                        identity
                    )
                )

                if exists:
                    summary[
                        "existing_bids"
                    ] += 1

                    action["decision"] = (
                        "already_bid"
                    )

                    action["bid_result"] = (
                        existing_bid
                    )

                    actions.append(action)
                    continue

                action["decision"] = (
                    "bid_at_advertised_reward"
                )

                action["bid_amount_sats"] = (
                    int(reward_sats)
                )

                result = submit_bid(
                    token,
                    task_id,
                    int(reward_sats)
                )

                action["bid_result"] = result

                if result.get("submitted"):
                    summary[
                        "bids_submitted"
                    ] += 1
                else:
                    summary[
                        "errors"
                    ] += 1

                actions.append(action)

                time.sleep(
                    ACTION_DELAY_SECONDS
                )

            memory["last_run"] = {
                "timestamp": now_iso(),
                "summary": summary,
                "gemini": GEMINI_ENABLED,
                "payments": PAYMENTS_ENABLED,
            }

            save_memory(memory)

            print(
                "=== ACT15 SUMMARY ==="
            )

            print(
                json.dumps(
                    summary,
                    ensure_ascii=False,
                    indent=2
                )
            )

            print(
                "MEMORY_FILE:",
                MEMORY_FILE
            )

            print(
                "ACT15_RESULT: SUCCESS"
            )

        if __name__ == "__main__":
            try:
                main()
            except Exception as exc:
                print(
                    "ACT15_RESULT: FAILED",
                    file=sys.stderr
                )
                print(
                    f"ERROR: {exc}",
                    file=sys.stderr
                )
                raise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail

          echo "Python:"
          python --version

          echo "Runner:"
          uname -a

          echo "Gemini:"
          echo "false"

          echo "Payments:"
          echo "false"

      - name: Install requests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT15
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$ACT15_SCRIPT" > /tmp/act15.py

          test -s /tmp/act15.py

          echo "ACT15 script created:"
          wc -l /tmp/act15.py

          python /tmp/act15.py

      - name: Persist ACT15 memory
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$MEMORY_FILE" ]; then
            echo "No memory file created."
            exit 0
          fi

          git config user.name "nox-origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MEMORY_FILE"

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "chore: persist ACT15 marketplace memory"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true

              git reset --mixed origin/main
              git add "$MEMORY_FILE"

              if git diff --cached --quiet; then
                echo "Changes already present after synchronization."
                exit 0
              fi

              git commit -m "chore: persist ACT15 marketplace memory"
            fi

            if git push origin HEAD:main; then
              echo "Memory push succeeded."
              exit 0
            fi

            sleep 2
          done

          echo "Unable to push ACT15 memory after 3 attempts."
          exit 1
