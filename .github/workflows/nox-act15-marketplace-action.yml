name: NØX ACT 15 V5 - Autonomous Marketplace Bidding

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-marketplace-bidding
  cancel-in-progress: false

jobs:
  autonomous-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------------
      # ACT15
      # ------------------------------------------------------------

      - name: Run NØX ACT15 V5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > act15.py <<'PY'
          import os
          import re
          import json
          import math
          import subprocess
          from datetime import datetime, timezone

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY")

          MEMORY_FILE = "memory/nox_memory.json"

          MIN_BID_SATS = 10
          BID_PERCENT = 0.20

          MAX_TASKS_TO_INSPECT = 30

          TIMEOUT = 20

          CAPABILITY_KEYWORDS = {
              "python": 4,
              "api": 4,
              "automation": 4,
              "research": 3,
              "data": 3,
              "analysis": 3,
              "qa": 3,
              "testing": 3,
              "smoke test": 3,
              "scraping": 3,
              "web scraping": 3,
              "data extraction": 3,
              "json": 2,
              "csv": 2,
              "seo": 2,
              "audit": 2,
              "copywriting": 2,
              "documentation": 2,
              "scripts": 2,
          }


          # ============================================================
          # HTTP SESSION
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Origin-ACT15-V5",
          })


          # ============================================================
          # HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def log(message=""):
              print(message, flush=True)


          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None


          def api_get(path, headers=None, params=None):
              url = BASE_URL + path

              try:
                  response = session.get(
                      url,
                      headers=headers,
                      params=params,
                      timeout=TIMEOUT,
                  )

                  log(
                      f"GET {url} -> {response.status_code}"
                  )

                  return response

              except Exception as exc:
                  log(f"GET ERROR {url}: {exc}")
                  return None


          def api_post(path, payload, headers=None):
              url = BASE_URL + path

              try:
                  response = session.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=TIMEOUT,
                  )

                  log(
                      f"POST {url} -> {response.status_code}"
                  )

                  return response

              except Exception as exc:
                  log(f"POST ERROR {url}: {exc}")
                  return None


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          if not API_KEY:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )


          log("==================================================")
          log("NØX ACT15 V5")
          log("Autonomous Marketplace Bidding")
          log("==================================================")
          log(f"Started: {now_iso()}")


          auth_response = api_post(
              "/auth/token",
              {
                  "api_key": API_KEY
              }
          )

          if auth_response is None:
              raise RuntimeError("Authentication request failed.")

          if auth_response.status_code != 200:
              log(auth_response.text[:1000])
              raise RuntimeError(
                  f"Authentication failed: HTTP {auth_response.status_code}"
              )

          auth_data = safe_json(auth_response)

          if not isinstance(auth_data, dict):
              raise RuntimeError(
                  "Authentication response is not a JSON object."
              )

          access_token = auth_data.get("access_token")

          if not access_token:
              raise RuntimeError(
                  "Authentication response does not contain access_token."
              )

          headers = {
              "Authorization": f"Bearer {access_token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Origin-ACT15-V5",
          }

          log("Authentication: OK")


          # ============================================================
          # GET NØX IDENTITY
          # ============================================================

          me_response = api_get(
              "/users/me",
              headers=headers
          )

          own_ids = set()
          own_names = set()

          if me_response is not None and me_response.status_code == 200:
              me_data = safe_json(me_response)

              if isinstance(me_data, dict):

                  for key in [
                      "id",
                      "user_id",
                      "agent_id",
                  ]:
                      value = me_data.get(key)

                      if value:
                          own_ids.add(str(value).lower())

                  for key in [
                      "username",
                      "agent_username",
                      "name",
                  ]:
                      value = me_data.get(key)

                      if value:
                          own_names.add(str(value).strip().lower())

                  nested = me_data.get("user")

                  if isinstance(nested, dict):

                      for key in [
                          "id",
                          "user_id",
                          "agent_id",
                      ]:
                          value = nested.get(key)

                          if value:
                              own_ids.add(str(value).lower())

                      for key in [
                          "username",
                          "agent_username",
                          "name",
                      ]:
                          value = nested.get(key)

                          if value:
                              own_names.add(
                                  str(value).strip().lower()
                              )

          # Fallback known NØX identity
          own_names.add("nox_origine")
          own_names.add("nøx origin")

          log(
              f"NØX identity IDs: {sorted(own_ids)}"
          )

          log(
              f"NØX identity names: {sorted(own_names)}"
          )


          # ============================================================
          # MEMORY
          # ============================================================

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          memory = {}

          if os.path.exists(MEMORY_FILE):

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:
                  log(
                      f"WARNING: memory could not be loaded: {exc}"
                  )
                  memory = {}


          if not isinstance(memory, dict):
              memory = {}


          def memory_list(key):
              value = memory.get(key)

              if isinstance(value, list):
                  return value

              return []


          handled_task_ids = set()

          for memory_key in [
              "marketplace_action",
              "marketplace_actions",
              "marketplace_observations",
              "observations",
              "decisions",
          ]:

              for item in memory_list(memory_key):

                  if not isinstance(item, dict):
                      continue

                  for key in [
                      "task_id",
                      "marketplace_task_id",
                  ]:

                      task_id = item.get(key)

                      if task_id:
                          handled_task_ids.add(
                              str(task_id)
                          )


          log(
              f"Memory handled task IDs: {len(handled_task_ids)}"
          )


          def save_memory():
              with open(
                  MEMORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def append_memory(key, item):

              if not isinstance(
                  memory.get(key),
                  list
              ):
                  memory[key] = []

              memory[key].append(item)

              save_memory()


          # ============================================================
          # BTC / USD RATE
          # ============================================================

          btc_usd_rate = None


          def get_btc_usd_rate():

              try:

                  response = requests.get(
                      "https://api.coinbase.com/v2/exchange-rates",
                      params={"currency": "BTC"},
                      timeout=15,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "NOX-Origin-ACT15-V5",
                      }
                  )

                  if response.status_code != 200:
                      log(
                          "Coinbase rate unavailable: "
                          f"HTTP {response.status_code}"
                      )
                      return None

                  data = response.json()

                  rate = (
                      data
                      .get("data", {})
                      .get("rates", {})
                      .get("USD")
                  )

                  if not rate:
                      return None

                  rate = float(rate)

                  if rate <= 0:
                      return None

                  return rate

              except Exception as exc:

                  log(
                      f"BTC/USD rate error: {exc}"
                  )

                  return None


          btc_usd_rate = get_btc_usd_rate()

          if btc_usd_rate:
              log(
                  f"BTC/USD rate: {btc_usd_rate}"
              )
          else:
              log(
                  "BTC/USD rate unavailable. "
                  "USDC/USD tasks will be skipped."
              )


          def usd_to_sats(usd):

              if btc_usd_rate is None:
                  return None

              try:

                  btc = float(usd) / btc_usd_rate

                  sats = btc * 100_000_000

                  return max(
                      1,
                      int(round(sats))
                  )

              except Exception:
                  return None


          # ============================================================
          # TASK TEXT
          # ============================================================

          def task_text(task):

              parts = []

              for key in [
                  "title",
                  "description",
                  "body",
                  "content",
                  "details",
                  "requirements",
                  "task_description",
              ]:

                  value = task.get(key)

                  if isinstance(value, str):
                      parts.append(value)

                  elif isinstance(value, dict):

                      for nested_value in value.values():

                          if isinstance(
                              nested_value,
                              str
                          ):
                              parts.append(
                                  nested_value
                              )

              return "\n".join(parts)


          # ============================================================
          # NUMBER PARSING
          # ============================================================

          def parse_number(value):

              value = value.replace(",", "")

              return float(value)


          # ============================================================
          # REWARD EXTRACTION
          # ============================================================

          def extract_reward(task):

              text = task_text(task)

              if not text.strip():
                  return {
                      "valid": False,
                      "reason": "empty_task_text"
                  }

              # --------------------------------------------------------
              # IMPORTANT:
              # Detect negative monetary values FIRST.
              #
              # Example:
              # "-30 USDC"
              #
              # This MUST NOT become "30 USDC".
              # --------------------------------------------------------

              negative_patterns = [

                  r'[-−]\s*\d+(?:[.,]\d+)?\s*(?:k\s*)?sats?\b',

                  r'[-−]\s*\$?\s*\d+(?:[.,]\d+)?\s*(?:USDC|USD)\b',

                  r'\$\s*[-−]\s*\d+(?:[.,]\d+)?\s*(?:USDC|USD)?',

              ]

              for pattern in negative_patterns:

                  if re.search(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  ):

                      return {
                          "valid": False,
                          "reason": "negative_reward_detected"
                      }


              # --------------------------------------------------------
              # SATS
              # --------------------------------------------------------

              sats_values = []

              sats_pattern = re.compile(
                  r'(?<![\w])'
                  r'([+]?\d+(?:[.,]\d+)?)'
                  r'\s*(k\s*)?'
                  r'sats?\b',
                  flags=re.IGNORECASE
              )

              for match in sats_pattern.finditer(text):

                  try:

                      value = parse_number(
                          match.group(1)
                      )

                      if match.group(2):
                          value *= 1000

                      if value > 0:
                          sats_values.append(
                              int(round(value))
                          )

                  except Exception:
                      pass


              # --------------------------------------------------------
              # USDC / USD
              # --------------------------------------------------------

              usd_values = []

              usd_patterns = [

                  re.compile(
                      r'(?<![\w])'
                      r'\$?\s*'
                      r'(\d+(?:[.,]\d+)?)'
                      r'\s*(?:USDC|USD)\b',
                      flags=re.IGNORECASE
                  ),

                  re.compile(
                      r'\$\s*'
                      r'(\d+(?:[.,]\d+)?)',
                      flags=re.IGNORECASE
                  ),
              ]

              for pattern in usd_patterns:

                  for match in pattern.finditer(text):

                      try:

                          value = parse_number(
                              match.group(1)
                          )

                          if value > 0:
                              usd_values.append(
                                  float(value)
                              )

                      except Exception:
                          pass


              # --------------------------------------------------------
              # CONSERVATIVE REWARD
              #
              # For a range:
              # "$2.99-$5.99 USDC"
              #
              # use the LOWEST value.
              # --------------------------------------------------------

              if sats_values:

                  reward_sats = min(sats_values)

                  return {
                      "valid": True,
                      "currency": "sats",
                      "reward_sats": reward_sats,
                      "source": "task_text"
                  }


              if usd_values:

                  reward_usd = min(usd_values)

                  reward_sats = usd_to_sats(
                      reward_usd
                  )

                  if reward_sats is None:

                      return {
                          "valid": False,
                          "reason": "usd_conversion_unavailable"
                      }

                  return {
                      "valid": True,
                      "currency": "USDC/USD",
                      "reward_usd": reward_usd,
                      "reward_sats": reward_sats,
                      "source": "task_text_converted"
                  }


              # --------------------------------------------------------
              # STRUCTURED FIELDS
              # --------------------------------------------------------

              structured_candidates = []

              for key in [
                  "reward_sats",
                  "budget_sats",
                  "price_sats",
                  "amount_sats",
                  "max_reward_sats",
              ]:

                  value = task.get(key)

                  if isinstance(
                      value,
                      (int, float)
                  ):

                      if value > 0:
                          structured_candidates.append(
                              int(round(value))
                          )

                  elif isinstance(value, str):

                      try:

                          number = parse_number(
                              value
                          )

                          if number > 0:
                              structured_candidates.append(
                                  int(round(number))
                              )

                      except Exception:
                          pass


              if structured_candidates:

                  reward_sats = min(
                      structured_candidates
                  )

                  return {
                      "valid": True,
                      "currency": "sats",
                      "reward_sats": reward_sats,
                      "source": "structured_task_field"
                  }


              return {
                  "valid": False,
                  "reason": "reward_not_detected"
              }


          # ============================================================
          # CAPABILITY SCORE
          # ============================================================

          def capability_score(task):

              text = task_text(task).lower()

              score = 0
              matched = []

              for keyword, points in CAPABILITY_KEYWORDS.items():

                  if keyword in text:

                      score += points
                      matched.append(keyword)

              return score, matched


          # ============================================================
          # BIDDER IDENTITY DETECTION
          # ============================================================

          def collect_identity_values(obj):

              ids = set()
              names = set()

              if not isinstance(obj, dict):
                  return ids, names

              id_keys = [
                  "id",
                  "user_id",
                  "agent_id",
                  "bidder_id",
                  "worker_id",
                  "creator_id",
              ]

              name_keys = [
                  "username",
                  "agent_username",
                  "bidder_username",
                  "worker_username",
                  "name",
              ]

              for key in id_keys:

                  value = obj.get(key)

                  if value is not None:
                      ids.add(
                          str(value).strip().lower()
                      )

              for key in name_keys:

                  value = obj.get(key)

                  if value is not None:
                      names.add(
                          str(value).strip().lower()
                      )

              for key in [
                  "bidder",
                  "worker",
                  "agent",
                  "user",
                  "author",
                  "owner",
              ]:

                  nested = obj.get(key)

                  if isinstance(
                      nested,
                      dict
                  ):

                      nested_ids, nested_names = (
                          collect_identity_values(
                              nested
                          )
                      )

                      ids.update(
                          nested_ids
                      )

                      names.update(
                          nested_names
                      )

                  elif isinstance(
                      nested,
                      str
                  ):

                      names.add(
                          nested.strip().lower()
                      )

              return ids, names


          def is_our_bid(bid):

              if not isinstance(
                  bid,
                  dict
              ):
                  return False

              bid_ids, bid_names = (
                  collect_identity_values(
                      bid
                  )
              )

              if own_ids.intersection(
                  bid_ids
              ):
                  return True

              if own_names.intersection(
                  bid_names
              ):
                  return True

              # Explicit fallback for NØX naming.
              combined = " ".join(
                  list(bid_names)
              ).lower()

              if (
                  "nox_origine" in combined
                  or "nøx origin" in combined
              ):
                  return True

              return False


          # ============================================================
          # GET BIDS
          # ============================================================

          def get_existing_bids(task_id):

              response = api_get(
                  f"/marketplace/{task_id}/bids",
                  headers=headers
              )

              if response is None:
                  return []

              if response.status_code != 200:
                  return []

              data = safe_json(response)

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):

                  for key in [
                      "bids",
                      "data",
                      "items",
                      "results",
                  ]:

                      value = data.get(key)

                      if isinstance(
                          value,
                          list
                      ):
                          return value

              return []


          # ============================================================
          # MARKETPLACE TASKS
          # ============================================================

          tasks_response = api_get(
              "/marketplace/tasks",
              headers=headers
          )

          if tasks_response is None:
              raise RuntimeError(
                  "Marketplace request failed."
              )

          if tasks_response.status_code != 200:

              log(
                  tasks_response.text[:1000]
              )

              raise RuntimeError(
                  "Marketplace returned HTTP "
                  f"{tasks_response.status_code}"
              )


          tasks_data = safe_json(
              tasks_response
          )


          if isinstance(tasks_data, list):

              tasks = tasks_data

          elif isinstance(tasks_data, dict):

              tasks = None

              for key in [
                  "tasks",
                  "data",
                  "items",
                  "results",
              ]:

                  if isinstance(
                      tasks_data.get(key),
                      list
                  ):

                      tasks = tasks_data[key]
                      break

              if tasks is None:
                  tasks = []

          else:
              tasks = []


          # ============================================================
          # SORT NEWEST FIRST
          # ============================================================

          def task_date(task):

              for key in [
                  "created_at",
                  "published_at",
                  "created",
                  "updated_at",
              ]:

                  value = task.get(key)

                  if value:
                      return str(value)

              return ""


          tasks = sorted(
              tasks,
              key=task_date,
              reverse=True
          )


          tasks = tasks[
              :MAX_TASKS_TO_INSPECT
          ]


          log("")
          log(
              f"Marketplace tasks received: "
              f"{len(tasks)}"
          )
          log("")


          # ============================================================
          # CANDIDATES
          # ============================================================

          candidates = []


          for task in tasks:

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              task_id = task.get("id")

              if not task_id:
                  task_id = task.get(
                      "task_id"
                  )

              if not task_id:
                  continue

              task_id = str(task_id)

              title = str(
                  task.get(
                      "title",
                      "Untitled task"
                  )
              )

              status = str(
                  task.get(
                      "status",
                      ""
                  )
              ).lower()


              log(
                  f"Inspecting: {title}"
              )


              # --------------------------------------------------------
              # Already in memory
              # --------------------------------------------------------

              if task_id in handled_task_ids:

                  log(
                      "SKIP: already handled "
                      "in memory"
                  )

                  continue


              # --------------------------------------------------------
              # Status
              # --------------------------------------------------------

              if status not in [
                  "open",
                  "bidding",
              ]:

                  log(
                      f"SKIP status: {status}"
                  )

                  continue


              # --------------------------------------------------------
              # Reward
              # --------------------------------------------------------

              reward = extract_reward(
                  task
              )

              if not reward.get("valid"):

                  reason = reward.get(
                      "reason",
                      "unknown"
                  )

                  log(
                      f"SKIP reward: {reason}"
                  )

                  continue


              reward_sats = reward.get(
                  "reward_sats"
              )

              if not reward_sats:

                  log(
                      "SKIP: reward_sats missing"
                  )

                  continue


              if reward_sats < MIN_BID_SATS:

                  log(
                      "SKIP reward below minimum: "
                      f"{reward_sats} sats"
                  )

                  continue


              # --------------------------------------------------------
              # Capability
              # --------------------------------------------------------

              score, matched = (
                  capability_score(task)
              )

              if score <= 0:

                  log(
                      "SKIP: no capability match"
                  )

                  continue


              # --------------------------------------------------------
              # Existing bids
              # --------------------------------------------------------

              bids = get_existing_bids(
                  task_id
              )

              our_bid = None

              for bid in bids:

                  if is_our_bid(bid):

                      our_bid = bid
                      break


              if our_bid is not None:

                  existing_status = (
                      our_bid.get(
                          "status",
                          "existing"
                      )
                      if isinstance(
                          our_bid,
                          dict
                      )
                      else "existing"
                  )

                  log(
                      "SKIP: NØX already has "
                      f"a bid ({existing_status})"
                  )

                  continue


              candidates.append({
                  "task": task,
                  "task_id": task_id,
                  "title": title,
                  "reward": reward,
                  "score": score,
                  "matched": matched,
              })


              log(
                  "Candidate accepted for ranking."
              )

              log("")


          # ============================================================
          # RANK CANDIDATES
          # ============================================================

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["reward"]["reward_sats"],
                  task_date(
                      item["task"]
                  ),
              ),
              reverse=True
          )


          log(
              f"Eligible candidates: "
              f"{len(candidates)}"
          )


          if not candidates:

              log("")
              log(
                  "No suitable marketplace task "
                  "found."
              )
              log(
                  "NØX will wait for the next ACT15 run."
              )
              log("")

              raise SystemExit(0)


          # ============================================================
          # SELECT TASK
          # ============================================================

          selected = candidates[0]

          task = selected["task"]
          task_id = selected["task_id"]
          title = selected["title"]

          reward = selected["reward"]
          reward_sats = reward["reward_sats"]

          score = selected["score"]
          matched = selected["matched"]


          # ============================================================
          # OWN PROPOSAL
          # ============================================================

          raw_bid = reward_sats * BID_PERCENT

          bid_amount = int(
              math.floor(
                  raw_bid
              )
          )

          bid_amount = max(
              MIN_BID_SATS,
              bid_amount
          )

          bid_amount = min(
              bid_amount,
              reward_sats
          )


          if bid_amount < MIN_BID_SATS:

              raise RuntimeError(
                  "Calculated bid is below minimum."
              )


          proposal_description = (
              "NØX autonomous proposal: "
              f"{bid_amount} sats for this task. "
              "Proposal generated from NØX capability "
              "matching and conservative reward estimation."
          )


          # ============================================================
          # DISPLAY DECISION
          # ============================================================

          log("")
          log("==================================================")
          log("NØX SELECTED MARKETPLACE TASK")
          log("==================================================")
          log(
              f"Task: {title}"
          )
          log(
              f"Task ID: {task_id}"
          )
          log(
              f"Reward currency: "
              f"{reward.get('currency')}"
          )
          log(
              f"Estimated reward: "
              f"{reward_sats} sats"
          )

          if reward.get("reward_usd") is not None:
              log(
                  f"Estimated USD/USDC: "
                  f"{reward.get('reward_usd')}"
              )

          log(
              f"NØX proposal: "
              f"{bid_amount} sats"
          )

          log(
              f"Proposal percentage: "
              f"{BID_PERCENT * 100:.0f}%"
          )

          log(
              f"Capability score: {score}"
          )

          log(
              f"Matched capabilities: "
              f"{', '.join(matched)}"
          )

          log("==================================================")


          # ============================================================
          # FINAL SAFETY CHECK BEFORE POST
          # ============================================================

          latest_bids = get_existing_bids(
              task_id
          )

          for bid in latest_bids:

              if is_our_bid(bid):

                  log(
                      "ABORT: NØX bid detected "
                      "during final safety check."
                  )

                  raise SystemExit(0)


          # ============================================================
          # SEND BID
          # ============================================================

          idempotency_key = (
              f"nox-act15-{task_id}"
          )

          bid_payload = {
              "bid_amount_sats": bid_amount,
              "bid_description": proposal_description,
          }

          bid_headers = dict(headers)

          bid_headers[
              "Idempotency-Key"
          ] = idempotency_key


          response = api_post(
              f"/marketplace/{task_id}/bid",
              bid_payload,
              headers=bid_headers
          )


          if response is None:

              raise RuntimeError(
                  "Bid request failed without response."
              )


          # ============================================================
          # SUCCESS
          #
          # HTTP 200 AND 201 ARE SUCCESS.
          #
          # IMPORTANT:
          # We do NOT assume response JSON is a dict.
          # ============================================================

          if response.status_code not in [
              200,
              201,
          ]:

              log(
                  "Bid submission failed."
              )

              log(
                  f"HTTP {response.status_code}"
              )

              log(
                  response.text[:2000]
              )

              raise RuntimeError(
                  "Marketplace bid failed: "
                  f"HTTP {response.status_code}"
              )


          # ------------------------------------------------------------
          # Safely inspect response
          # ------------------------------------------------------------

          bid_data = safe_json(
              response
          )

          bid_id = None

          if isinstance(
              bid_data,
              dict
          ):

              for key in [
                  "id",
                  "bid_id",
              ]:

                  value = bid_data.get(key)

                  if value:
                      bid_id = str(value)
                      break

              if not bid_id:

                  nested = bid_data.get(
                      "bid"
                  )

                  if isinstance(
                      nested,
                      dict
                  ):

                      for key in [
                          "id",
                          "bid_id",
                      ]:

                          value = nested.get(
                              key
                          )

                          if value:
                              bid_id = str(
                                  value
                              )
                              break


          # ============================================================
          # SUCCESS LOG
          # ============================================================

          log("")
          log("==================================================")
          log("NØX BID SUBMITTED SUCCESSFULLY")
          log("==================================================")
          log(
              f"HTTP status: "
              f"{response.status_code}"
          )
          log(
              f"Task ID: {task_id}"
          )
          log(
              f"Bid amount: "
              f"{bid_amount} sats"
          )
          log(
              f"Bid ID: "
              f"{bid_id if bid_id else 'not returned'}"
          )
          log("==================================================")


          # ============================================================
          # SAVE MEMORY IMMEDIATELY
          #
          # This happens BEFORE any optional post-processing.
          # ============================================================

          memory_record = {
              "timestamp": now_iso(),
              "type": "marketplace_bid",
              "task_id": task_id,
              "task_title": title,
              "bid_id": bid_id,
              "bid_amount_sats": bid_amount,
              "estimated_reward_sats": reward_sats,
              "estimated_reward_currency": reward.get(
                  "currency"
              ),
              "estimated_reward_usd": reward.get(
                  "reward_usd"
              ),
              "proposal_percentage": BID_PERCENT,
              "capability_score": score,
              "matched_capabilities": matched,
              "status": "submitted",
              "http_status": response.status_code,
              "idempotency_key": idempotency_key,
          }


          append_memory(
              "marketplace_action",
              memory_record
          )


          # Mark task as handled for this execution
          handled_task_ids.add(
              task_id
          )


          log(
              "Memory saved successfully."
          )


          # ============================================================
          # OPTIONAL CONFIRMATION
          #
          # We check bids again but NEVER submit another bid here.
          # ============================================================

          confirmation_bids = (
              get_existing_bids(
                  task_id
              )
          )

          confirmed = False

          for bid in confirmation_bids:

              if is_our_bid(bid):

                  confirmed = True

                  if not bid_id and isinstance(
                      bid,
                      dict
                  ):

                      possible_id = (
                          bid.get("id")
                          or bid.get("bid_id")
                      )

                      if possible_id:

                          bid_id = str(
                              possible_id
                          )

                  break


          if confirmed:

              log(
                  "Post-submission verification: "
                  "NØX bid detected."
              )

          else:

              log(
                  "Post-submission verification: "
                  "bid not identifiable in response list."
              )

              log(
                  "The original POST was nevertheless "
                  f"successful with HTTP {response.status_code}."
              )


          # ============================================================
          # GIT MEMORY COMMIT
          # ============================================================

          log("")
          log(
