name: NØX ACT 15 V7 - Autonomous Marketplace Decision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act15-autonomous-bidding
  cancel-in-progress: false

jobs:
  nox-act15:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_15_marketplace.json
      MIN_BID_SATS: "10"
      MAX_TASKS: "30"
      MAX_MEMORY_ACTIONS: "500"
      ACTION_DELAY_SECONDS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Environment check
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX ACT15 V7 - ENVIRONMENT CHECK"
          echo "=============================================="

          if [ -f "nox_memory.json" ]; then
            echo "OK: nox_memory.json exists."
          else
            echo "INFO: nox_memory.json not found."
          fi

          if [ -f "${MEMORY_FILE}" ]; then
            echo "OK: ${MEMORY_FILE} exists."
          else
            echo "INFO: ${MEMORY_FILE} will be created."
          fi

          echo
          echo "Schedule: 6 automatic scans/day"
          echo "Action limit: NONE"
          echo "Decision model: economic + learning value"
          echo "Unpaid tasks: eligible for learning evaluation"
          echo "Minimum bid: applies ONLY to paid bids"
          echo "Payments: DISABLED"
          echo "Cost target: €0"
          echo "Gemini: DISABLED"
          echo "=============================================="

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Run ACT15 V7
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/act15.py <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          BASE_URL = os.environ.get(
              "COLONY_BASE_URL",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          MEMORY_FILE = Path(
              os.environ.get(
                  "MEMORY_FILE",
                  "memory/nox_act_15_marketplace.json"
              )
          )

          MIN_BID_SATS = int(
              os.environ.get("MIN_BID_SATS", "10")
          )

          MAX_TASKS = int(
              os.environ.get("MAX_TASKS", "30")
          )

          MAX_MEMORY_ACTIONS = int(
              os.environ.get("MAX_MEMORY_ACTIONS", "500")
          )

          ACTION_DELAY_SECONDS = float(
              os.environ.get("ACTION_DELAY_SECONDS", "1")
          )


          SAFETY_BLOCKED_TERMS = [
              "weapon",
              "weapons",
              "firearm",
              "gun",
              "ammunition",
              "explosive",
              "explosives",
              "bomb",
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing",
              "stolen account",
              "account takeover",
              "hack account",
              "money laundering",
              "fraud",
              "illegal drugs",
              "drug trafficking",
          ]


          CAPABILITY_KEYWORDS = {
              "python": 12,
              "api": 12,
              "automation": 12,
              "research": 10,
              "data": 10,
              "analysis": 10,
              "qa": 9,
              "testing": 9,
              "test": 7,
              "smoke test": 9,
              "scraping": 8,
              "web": 7,
              "json": 7,
              "csv": 7,
              "seo": 6,
              "audit": 10,
              "copywriting": 7,
              "documentation": 8,
              "scripts": 10,
              "database": 8,
              "source checks": 10,
              "fact checking": 10,
              "fact-checking": 10,
              "technical writing": 8,
              "agent": 12,
              "ai agent": 14,
              "automation agent": 14,
          }


          LEARNING_KEYWORDS = {
              "ai agent": 14,
              "agent": 12,
              "agents": 12,
              "autonomy": 14,
              "autonomous": 12,
              "collaboration": 12,
              "coordination": 12,
              "marketplace": 12,
              "economy": 12,
              "virtual economy": 14,
              "lightning": 8,
              "bitcoin": 8,
              "btc": 7,
              "reputation": 10,
              "trust": 10,
              "verification": 10,
              "research": 8,
              "api": 8,
              "automation": 8,
              "testing": 8,
              "data": 7,
              "analysis": 7,
              "cybersecurity": 10,
              "security": 9,
              "emerging technology": 8,
              "technology": 6,
              "law": 9,
              "regulation": 9,
              "regulatory": 9,
          }


          DOMAIN_WEIGHTS = {
              "virtual economy": 25,
              "cybersecurity": 20,
              "ai communities": 20,
              "agent intelligence/autonomy": 20,
              "emerging tech": 15,
          }


          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def safe_int(value):
              try:
                  return int(value)
              except Exception:
                  return None


          def normalise_text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def task_text(task):
              parts = []

              for key in (
                  "title",
                  "description",
                  "details",
                  "requirements",
                  "category",
                  "tags",
                  "skills",
                  "budget",
                  "reward",
                  "reward_sats",
                  "price",
              ):
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(str(x) for x in value)
                  elif isinstance(value, dict):
                      parts.append(json.dumps(value, ensure_ascii=False))
                  elif value is not None:
                      parts.append(str(value))

              return " ".join(parts).lower()


          def contains_blocked_term(text):
              lowered = text.lower()

              for term in SAFETY_BLOCKED_TERMS:
                  if term in lowered:
                      return term

              return None


          def extract_explicit_sats(task):
              """
              Prefer structured sat fields.
              Then look for explicit sat-denominated amounts in text.

              We deliberately do NOT use min(values), because a task can
              contain several unrelated numbers.
              """

              structured_keys = [
                  "reward_sats",
                  "budget_sats",
                  "payment_sats",
                  "amount_sats",
                  "max_reward_sats",
              ]

              for key in structured_keys:
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      if value >= 0:
                          return int(value), "structured"

                  if isinstance(value, str):
                      match = re.search(
                          r"(\d+(?:\.\d+)?)",
                          value.replace(",", "")
                      )

                      if match:
                          amount = float(match.group(1))
                          if amount >= 0:
                              return int(amount), "structured_text"

              text = task_text(task)

              patterns = [
                  r"(\d+(?:\.\d+)?)\s*(?:sats|sat)\b",
                  r"\b(?:reward|budget|payment)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:sats|sat)\b",
              ]

              for pattern in patterns:
                  match = re.search(pattern, text, re.IGNORECASE)

                  if match:
                      amount = float(match.group(1))
                      if amount >= 0:
                          return int(amount), "text"

              return None, None


          def extract_usd(task):
              """
              Optional USD extraction.

              Conversion is deliberately conservative. If a reliable sat
              amount is not available, the task remains a learning candidate
              rather than receiving a fabricated minimum bid.
              """

              text = task_text(task)

              patterns = [
                  r"\$\s*(\d+(?:\.\d+)?)",
                  r"(\d+(?:\.\d+)?)\s*(?:usd|usdc)\b",
              ]

              for pattern in patterns:
                  match = re.search(pattern, text, re.IGNORECASE)

                  if match:
                      try:
                          return float(match.group(1))
                      except Exception:
                          pass

              return None


          def capability_score(text):
              score = 0

              for keyword, points in CAPABILITY_KEYWORDS.items():
                  if keyword in text:
                      score += points

              return min(score, 100)


          def learning_score(text):
              score = 0

              for keyword, points in LEARNING_KEYWORDS.items():
                  if keyword in text:
                      score += points

              return min(score, 100)


          def domain_score(text):
              scores = {}

              if any(
                  word in text
                  for word in (
                      "sat",
                      "sats",
                      "bitcoin",
                      "btc",
                      "lightning",
                      "payment",
                      "marketplace",
                      "economy",
                      "reward",
                  )
              ):
                  scores["virtual economy"] = DOMAIN_WEIGHTS["virtual economy"]

              if any(
                  word in text
                  for word in (
                      "security",
                      "cybersecurity",
                      "audit",
                      "vulnerability",
                      "phishing",
                  )
              ):
                  scores["cybersecurity"] = DOMAIN_WEIGHTS["cybersecurity"]

              if any(
                  word in text
                  for word in (
                      "ai community",
                      "ai communities",
                      "agent community",
                      "community",
                      "collaboration",
                      "coordination",
                  )
              ):
                  scores["ai communities"] = DOMAIN_WEIGHTS["ai communities"]

              if any(
                  word in text
                  for word in (
                      "agent",
                      "autonomy",
                      "autonomous",
                      "reasoning",
                      "decision",
                  )
              ):
                  scores["agent intelligence/autonomy"] = DOMAIN_WEIGHTS[
                      "agent intelligence/autonomy"
                  ]

              if any(
                  word in text
                  for word in (
                      "technology",
                      "emerging tech",
                      "emerging technology",
                      "new technology",
                  )
              ):
                  scores["emerging tech"] = DOMAIN_WEIGHTS["emerging tech"]

              if not scores:
                  return 0, None

              domain, score = max(
                  scores.items(),
                  key=lambda item: item[1]
              )

              return score, domain


          def compute_decision(task):
              text = task_text(task)

              blocked = contains_blocked_term(text)

              if blocked:
                  return {
                      "decision": "reject",
                      "reason": f"blocked_term:{blocked}",
                      "capability_score": 0,
                      "learning_score": 0,
                      "domain_score": 0,
                      "domain": None,
                      "reward_sats": None,
                      "reward_source": None,
                  }

              reward_sats, reward_source = extract_explicit_sats(task)
              usd_value = extract_usd(task)

              cap = capability_score(text)
              learn = learning_score(text)
              domain_points, domain = domain_score(text)

              reward_points = 0

              if reward_sats is not None:
                  if reward_sats >= 10000:
                      reward_points = 25
                  elif reward_sats >= 1000:
                      reward_points = 20
                  elif reward_sats >= 100:
                      reward_points = 15
                  elif reward_sats >= MIN_BID_SATS:
                      reward_points = 10
                  elif reward_sats > 0:
                      reward_points = 3

              elif usd_value is not None:
                  if usd_value >= 10:
                      reward_points = 20
                  elif usd_value >= 1:
                      reward_points = 12
                  elif usd_value > 0:
                      reward_points = 5

              total = min(
                  100,
                  int(
                      cap * 0.35
                      + learn * 0.35
                      + domain_points * 0.20
                      + reward_points * 0.10
                  )
              )

              if reward_sats is not None and reward_sats >= MIN_BID_SATS:
                  decision = "paid_bid_candidate"

              elif reward_sats is not None and reward_sats > 0:
                  decision = "learning_candidate_low_reward"

              else:
                  decision = "learning_candidate_unpaid"

              return {
                  "decision": decision,
                  "reason": "economic_and_learning_evaluation",
                  "capability_score": cap,
                  "learning_score": learn,
                  "domain_score": domain_points,
                  "domain": domain,
                  "reward_sats": reward_sats,
                  "reward_source": reward_source,
                  "usd_value": usd_value,
                  "total_score": total,
              }


          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "schema_version": 7,
                      "agent": "NØX",
                      "workflow": "ACT15_V7",
                      "updated_at": now_iso(),
                      "actions": [],
                  }

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(data, dict):
                      raise ValueError("memory root is not an object")

                  if not isinstance(data.get("actions"), list):
                      data["actions"] = []

                  return data

              except Exception as exc:
                  print(
                      f"WARNING: unable to read memory: {exc}"
                  )

                  return {
                      "schema_version": 7,
                      "agent": "NØX",
                      "workflow": "ACT15_V7",
                      "updated_at": now_iso(),
                      "actions": [],
                  }


          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              actions = memory.get("actions", [])

              memory["actions"] = actions[-MAX_MEMORY_ACTIONS:]
              memory["updated_at"] = now_iso()
              memory["schema_version"] = 7
              memory["workflow"] = "ACT15_V7"

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def api_session():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              session = requests.Session()

              token_response = session.post(
                  f"{BASE_URL}/auth/token",
                  json={"api_key": API_KEY},
                  timeout=20,
              )

              print(
                  f"AUTH TOKEN HTTP {token_response.status_code}"
              )

              token_response.raise_for_status()

              token_data = token_response.json()

              token = (
                  token_data.get("access_token")
                  or token_data.get("token")
                  or token_data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "No JWT token returned by /auth/token"
                  )

              session.headers.update(
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  }
              )

              return session


          def get_identity(session):
              response = session.get(
                  f"{BASE_URL}/users/me",
                  timeout=20,
              )

              print(
                  f"/users/me HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              username = (
                  data.get("username")
                  or data.get("handle")
                  or data.get("name")
                  or "unknown"
              )

              karma = (
                  data.get("karma")
                  or data.get("score")
                  or 0
              )

              print(
                  f"Identity: @{username} | Karma: {karma}"
              )

              return data


          def get_tasks(session):
              response = session.get(
                  f"{BASE_URL}/marketplace/tasks",
                  params={"limit": MAX_TASKS},
                  timeout=30,
              )

              print(
                  f"/marketplace/tasks HTTP {response.status_code}"
              )

              response.raise_for_status()

              data = response.json()

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "tasks",
                      "items",
                      "results",
                      "data",
                  ):
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []


          def get_task_id(task):
              return (
                  task.get("id")
                  or task.get("task_id")
                  or task.get("_id")
              )


          def get_task_status(task):
              return normalise_text(
                  task.get("status")
                  or task.get("state")
              ).lower()


          def task_title(task):
              return (
                  normalise_text(task.get("title"))
                  or normalise_text(task.get("name"))
                  or "Untitled marketplace task"
              )


          def get_existing_bids(session, task_id):
              """
              The marketplace API may expose bids differently depending
              on task state. Failure to retrieve them is not treated as
              evidence that NØX has no bid.
              """

              endpoints = [
                  f"{BASE_URL}/marketplace/{task_id}/bids",
              ]

              for endpoint in endpoints:
                  try:
                      response = session.get(
                          endpoint,
                          timeout=20,
                      )

                      if response.status_code == 200:
                          data = response.json()

                          if isinstance(data, list):
                              return data

                          if isinstance(data, dict):
                              for key in (
                                  "bids",
                                  "items",
                                  "results",
                                  "data",
                              ):
                                  value = data.get(key)

                                  if isinstance(value, list):
                                      return value

                  except Exception as exc:
                      print(
                          f"Bid lookup warning for {task_id}: {exc}"
                      )

              return None


          def is_our_bid(bid, identity):
              if not isinstance(bid, dict):
                  return False

              identity_id = (
                  identity.get("id")
                  or identity.get("user_id")
                  or identity.get("agent_id")
              )

              identity_name = (
                  identity.get("username")
                  or identity.get("handle")
                  or identity.get("name")
              )

              for key in (
                  "user_id",
                  "agent_id",
                  "owner_id",
                  "bidder_id",
              ):
                  if (
                      identity_id is not None
                      and bid.get(key) == identity_id
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder",
                  "agent",
                  "user",
              ):
                  value = bid.get(key)

                  if isinstance(value, dict):
                      value = (
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )

                  if (
                      identity_name
                      and value
                      and str(value).lower()
                      == str(identity_name).lower()
                  ):
                      return True

              return False


          def calculate_bid(reward_sats):
              if reward_sats is None:
                  return None

              if reward_sats < MIN_BID_SATS:
                  return None

              proposed = max(
                  MIN_BID_SATS,
                  int(round(reward_sats * 0.20))
              )

              return min(
                  proposed,
                  reward_sats
              )


          def submit_bid(
              session,
              task_id,
              bid_sats,
              title,
              score,
          ):
              description = (
                  "NØX proposes "
                  f"{bid_sats} sats for this task. "
                  "The proposal reflects NØX's current capability fit "
                  f"and learning relevance (decision score {score}/100)."
              )

              payload = {
                  "bid_amount_sats": bid_sats,
                  "bid_description": description,
              }

              endpoint = (
                  f"{BASE_URL}/marketplace/{task_id}/bid"
              )

              response = session.post(
                  endpoint,
                  json=payload,
                  timeout=30,
              )

              print(
                  f"BID {task_id} HTTP {response.status_code}"
              )

              body = None

              try:
                  body = response.json()
              except Exception:
                  body = response.text[:1000]

              if response.status_code not in (
                  200,
                  201,
                  202,
              ):
                  print(
                      f"Bid rejected for {title}: {body}"
                  )

                  return {
                      "success": False,
                      "http_status": response.status_code,
                      "response": body,
                  }

              bid_id = None

              if isinstance(body, dict):
                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                      or (
                          body.get("bid", {}).get("id")
                          if isinstance(body.get("bid"), dict)
                          else None
                      )
                  )

              print(
                  f"Bid submitted: {bid_sats} sats"
                  + (
                      f" | bid_id={bid_id}"
                      if bid_id
                      else ""
                  )
              )

              return {
                  "success": True,
                  "http_status": response.status_code,
                  "response": body,
                  "bid_id": bid_id,
              }


          def main():
              print()
              print("==============================================")
              print("NØX ACT15 V7 - AUTONOMOUS MARKETPLACE")
              print("==============================================")
              print(f"Time: {now_iso()}")
              print(f"Minimum paid bid: {MIN_BID_SATS} sats")
              print("Unpaid learning candidates: ENABLED")
              print("Payments/spending: DISABLED")
              print("Gemini: DISABLED")
              print()

              memory = load_memory()

              try:
                  session = api_session()
                  identity = get_identity(session)
              except Exception as exc:
                  print(f"FATAL AUTH ERROR: {exc}")
                  sys.exit(1)

              try:
                  tasks = get_tasks(session)
              except Exception as exc:
                  print(f"FATAL MARKETPLACE ERROR: {exc}")
                  sys.exit(1)

              print(
                  f"Marketplace tasks received: {len(tasks)}"
              )

              summary = {
                  "tasks_seen": 0,
                  "open_tasks": 0,
                  "blocked": 0,
                  "paid_candidates": 0,
                  "learning_candidates": 0,
                  "low_reward_candidates": 0,
                  "already_bid": 0,
                  "bids_submitted": 0,
                  "bid_errors": 0,
              }

              for task in tasks:
                  if not isinstance(task, dict):
                      continue

                  summary["tasks_seen"] += 1

                  task_id = get_task_id(task)
                  title = task_title(task)
                  status = get_task_status(task)

                  print()
                  print("----------------------------------------------")
                  print(f"TASK: {title}")
                  print(f"ID: {task_id}")
                  print(f"STATUS: {status or 'unknown'}")

                  if not task_id:
                      print("Decision: SKIP - no task_id")
                      continue

                  if status not in (
                      "",
                      "open",
                      "bidding",
                  ):
                      print(
                          f"Decision: SKIP - status={status}"
                      )
                      continue

                  summary["open_tasks"] += 1

                  decision = compute_decision(task)

                  print(
                      "Scores: "
                      f"capability={decision.get('capability_score', 0)} "
                      f"learning={decision.get('learning_score', 0)} "
                      f"domain={decision.get('domain_score', 0)} "
                      f"total={decision.get('total_score', 0)}"
                  )

                  print(
                      f"Domain: "
                      f"{decision.get('domain') or 'general'}"
                  )

                  print(
                      f"Reward sats: "
                      f"{decision.get('reward_sats')}"
                  )

                  print(
                      f"Decision: "
                      f"{decision.get('decision')}"
                  )

                  if decision["decision"] == "reject":
                      summary["blocked"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "rejected",
                              "task_id": task_id,
                              "title": title,
                              "reason": decision["reason"],
                              "status": "blocked",
                          }
                      )

                      continue

                  if decision["decision"] in (
                      "learning_candidate_unpaid",
                      "learning_candidate_low_reward",
                  ):
                      summary["learning_candidates"] += 1

                      if (
                          decision["decision"]
                          == "learning_candidate_low_reward"
                      ):
                          summary["low_reward_candidates"] += 1

                      print(
                          "Learning candidate recorded."
                      )

                      print(
                          "No paid bid submitted: "
                          "the task does not provide a valid "
                          f"bid budget >= {MIN_BID_SATS} sats."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_learning_candidate",
                              "task_id": task_id,
                              "title": title,
                              "status": status,
                              "decision": decision["decision"],
                              "reason": decision["reason"],
                              "reward_sats": decision.get(
                                  "reward_sats"
                              ),
                              "usd_value": decision.get(
                                  "usd_value"
                              ),
                              "capability_score": decision.get(
                                  "capability_score"
                              ),
                              "learning_score": decision.get(
                                  "learning_score"
                              ),
                              "domain_score": decision.get(
                                  "domain_score"
                              ),
                              "domain": decision.get(
                                  "domain"
                              ),
                              "total_score": decision.get(
                                  "total_score"
                              ),
                              "payments": "disabled",
                              "bid_submitted": False,
                          }
                      )

                      continue

                  if decision["decision"] == "paid_bid_candidate":
                      summary["paid_candidates"] += 1

                  bids = get_existing_bids(
                      session,
                      task_id
                  )

                  if bids is None:
                      print(
                          "Bid state unavailable; "
                          "no new bid submitted."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_bid_check",
                              "task_id": task_id,
                              "title": title,
                              "status": "bid_state_unknown",
                              "decision": decision,
                          }
                      )

                      continue

                  already_bid = any(
                      is_our_bid(
                          bid,
                          identity
                      )
                      for bid in bids
                  )

                  if already_bid:
                      summary["already_bid"] += 1

                      print(
                          "Decision: SKIP - NØX already has a bid."
                      )

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_bid_check",
                              "task_id": task_id,
                              "title": title,
                              "status": "already_bid",
                              "decision": decision,
                          }
                      )

                      continue

                  reward_sats = decision.get(
                      "reward_sats"
                  )

                  bid_sats = calculate_bid(
                      reward_sats
                  )

                  if bid_sats is None:
                      print(
                          "No valid paid bid amount. "
                          "Recording as learning candidate."
                      )

                      summary["learning_candidates"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_learning_candidate",
                              "task_id": task_id,
                              "title": title,
                              "status": status,
                              "decision": "no_valid_paid_bid",
                              "reward_sats": reward_sats,
                              "bid_submitted": False,
                          }
                      )

                      continue

                  print(
                      f"Submitting paid bid: {bid_sats} sats"
                  )

                  result = submit_bid(
                      session,
                      task_id,
                      bid_sats,
                      title,
                      decision.get("total_score", 0),
                  )

                  if result["success"]:
                      summary["bids_submitted"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_bid_submitted",
                              "task_id": task_id,
                              "title": title,
                              "status": "submitted",
                              "reward_sats": reward_sats,
                              "proposed_bid_sats": bid_sats,
                              "bid_id": result.get("bid_id"),
                              "http_status": result.get(
                                  "http_status"
                              ),
                              "capability_score": decision.get(
                                  "capability_score"
                              ),
                              "learning_score": decision.get(
                                  "learning_score"
                              ),
                              "domain_score": decision.get(
                                  "domain_score"
                              ),
                              "domain": decision.get(
                                  "domain"
                              ),
                              "total_score": decision.get(
                                  "total_score"
                              ),
                              "payments": "disabled",
                          }
                      )

                  else:
                      summary["bid_errors"] += 1

                      memory["actions"].append(
                          {
                              "timestamp": now_iso(),
                              "action": "marketplace_bid_error",
                              "task_id": task_id,
                              "title": title,
                              "status": "error",
                              "reward_sats": reward_sats,
                              "proposed_bid_sats": bid_sats,
                              "http_status": result.get(
                                  "http_status"
                              ),
                              "response": result.get(
                                  "response"
                              ),
                          }
                      )

                  time.sleep(
                      ACTION_DELAY_SECONDS
                  )

              memory["last_run"] = {
                  "timestamp": now_iso(),
                  "summary": summary,
              }

              save_memory(memory)

              print()
              print("==============================================")
              print("NØX ACT15 V7 - RUN SUMMARY")
              print("==============================================")

              for key, value in summary.items():
                  print(
                      f"{key}: {value}"
                  )

              print()
              print(
                  f"Memory saved: {MEMORY_FILE}"
              )

              print()
              print("Decision principle:")
              print(
                  "- Paid task >= minimum bid: "
                  "economic + learning evaluation"
              )
              print(
                  "- Low/no reward: "
                  "learning candidate, no fabricated bid"
              )
              print(
                  "- Blocked task: rejected"
              )
              print(
                  "- Existing bid: no duplicate bid"
              )
              print(
                  "- Payments/spending: disabled"
              )
              print(
                  "- Gemini: disabled"
              )

              print()
              print("ACT15 V7 completed successfully.")


          if __name__ == "__main__":
              main()
          PY

