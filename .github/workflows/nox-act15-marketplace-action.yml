      # ==========================================================
      # MEMORY STATUS
      # ==========================================================

      - name: Show ACT15 memory status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' '=============================================='
          printf '%s\n' 'NØX ACT15 V6 - MEMORY STATUS'
          printf '%s\n' '=============================================='

          if [ -f "nox_memory.json" ]; then
            python -c 'import json; d=json.load(open("nox_memory.json", encoding="utf-8")); print("Marketplace actions recorded:", len(d.get("marketplace_actions", [])))'
          else
            printf '%s\n' 'nox_memory.json not found.'
          fi

      # ==========================================================
      # COMMIT MEMORY
      # ==========================================================

      - name: Commit ACT15 memory
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'NØX Origin'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add nox_memory.json

          if git diff --cached --quiet; then
            printf '%s\n' 'No memory changes.'
            exit 0
          fi

          git commit -m 'NØX ACT15: update marketplace memory'

          # --------------------------------------------------------
          # Protect against another workflow pushing to main.
          # No force push.
          # --------------------------------------------------------

          for attempt in 1 2 3; do

            printf 'Git synchronization attempt %s...\n' "$attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              printf '%s\n' 'Rebase conflict detected.'
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              printf '%s\n' 'Memory successfully pushed.'
              exit 0
            fi

            printf '%s\n' 'Push rejected. Retrying...'
            sleep 3

          done

          printf '%s\n' 'ERROR: unable to push ACT15 memory after 3 attempts.'
          exit 1
