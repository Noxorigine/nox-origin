name: NØX ACT 02 V13.3 - Comments + Private DM Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  communication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: ACT02 V13.3 Communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import os
          import json
          import copy
          import time
          from datetime import datetime, timezone

          import requests

          print("=" * 80)
          print("NØX ACT 02 V13.3 - COMMUNICATION")
          print("=" * 80)
          print("IDEMPOTENCY: ENABLED")
          print("CLAIM BEFORE SEND: ENABLED")
          print("CONVERSATION PARSER: other_user.username ENABLED")
          print("DM API PAYLOAD: {body: ...} ENABLED")
          print("HTTP ERROR BODY DIAGNOSTIC: ENABLED")
          print("GEMINI: OFF")
          print("PAYMENTS: OFF")
          print("MARKETPLACE ACTIONS: OFF")
          print("=" * 80)

          BASE = "https://thecolony.ai/api/v1"

          DM_MEMORY = "memory/nox_act_02_private_dm_v13_3.json"

          OLD_MEMORIES = [
              "memory/nox_act_02_private_dm.json",
              "memory/nox_act_02_private_dm_v13.json",
              "memory/nox_act_02_private_dm_v13_2.json",
          ]

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          def auth_headers():
              return {
                  "Authorization": f"Bearer {API_KEY}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              }

          def get_token():
              r = session.post(
                  f"{BASE}/auth/token",
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  timeout=20,
              )

              print(f"AUTH STATUS: {r.status_code}")

              if r.status_code != 200:
                  print("AUTH BODY:", r.text[:2000])
                  r.raise_for_status()

              data = r.json()
              token = data.get("access_token") or data.get("token")

              if not token:
                  raise RuntimeError("No access token returned by /auth/token")

              return token

          token = get_token()

          HEADERS = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def safe_username(value):
              if isinstance(value, str):
                  value = value.strip()
                  return value if value else None

              if isinstance(value, dict):
                  return (
                      safe_username(value.get("username"))
                      or safe_username(value.get("name"))
                      or safe_username(value.get("handle"))
                  )

              return None

          def extract_conversation_username(conversation):
              other_user = conversation.get("other_user")

              return (
                  safe_username(conversation.get("username"))
                  or safe_username(conversation.get("other_username"))
                  or safe_username(conversation.get("participant_username"))
                  or safe_username(other_user)
              )

          def message_id(message):
              return (
                  message.get("id")
                  or message.get("message_id")
                  or message.get("uuid")
              )

          def sender_username(message):
              sender = message.get("sender")

              return (
                  safe_username(message.get("sender_username"))
                  or safe_username(message.get("from_username"))
                  or safe_username(sender)
              )

          def recipient_username(message):
              recipient = message.get("recipient")

              return (
                  safe_username(message.get("recipient_username"))
                  or safe_username(message.get("to_username"))
                  or safe_username(recipient)
              )

          def message_body(message):
              body = (
                  message.get("body")
                  or message.get("content")
                  or message.get("text")
                  or ""
              )

              return str(body).strip()

          def message_created(message):
              return (
                  message.get("created_at")
                  or message.get("created")
                  or message.get("timestamp")
                  or ""
              )

          def load_json(path, default):
              if not os.path.exists(path):
                  return copy.deepcopy(default)

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: failed to load {path}: {exc}")
                  return copy.deepcopy(default)

          def save_json(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)

              tmp = path + ".tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              os.replace(tmp, path)

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          default_state = {
              "processed_message_ids": [],
              "responded_message_ids": [],
              "claimed_message_ids": [],
              "message_states": {},
              "response_history": [],
              "audit_log": [],
              "stats": {
                  "dm_candidates": 0,
                  "dm_claimed": 0,
                  "dm_sent": 0,
                  "dm_blocked": 0,
                  "dm_errors": 0,
                  "comment_responses": 0,
              },
              "last_run_at": None,
          }

          state = load_json(DM_MEMORY, default_state)

          if not isinstance(state, dict):
              state = copy.deepcopy(default_state)

          for key, value in default_state.items():
              if key not in state:
                  state[key] = copy.deepcopy(value)

          for old_path in OLD_MEMORIES:
              if not os.path.exists(old_path):
                  continue

              old = load_json(old_path, {})

              if not isinstance(old, dict):
                  continue

              for key in (
                  "processed_message_ids",
                  "responded_message_ids",
                  "claimed_message_ids",
              ):
                  values = old.get(key, [])

                  if isinstance(values, list):
                      existing = set(state.get(key, []))

                      for item in values:
                          if item not in existing:
                              state[key].append(item)

              old_states = old.get("message_states", {})

              if isinstance(old_states, dict):
                  for mid, info in old_states.items():
                      if mid not in state["message_states"]:
                          state["message_states"][mid] = info

          # ------------------------------------------------------------
          # AUTH / IDENTITY
          # ------------------------------------------------------------

          me = session.get(
              f"{BASE}/users/me",
              headers=HEADERS,
              timeout=20,
          )

          print(f"IDENTITY STATUS: {me.status_code}")

          if me.status_code != 200:
              print("IDENTITY BODY:", me.text[:2000])
              me.raise_for_status()

          me_data = me.json()

          NOX_USERNAME = (
              me_data.get("username")
              or me_data.get("user", {}).get("username")
          )

          NOX_KARMA = (
              me_data.get("karma")
              or me_data.get("user", {}).get("karma")
          )

          print(f"NØX USERNAME: {NOX_USERNAME}")
          print(f"NØX KARMA: {NOX_KARMA}")

          # ------------------------------------------------------------
          # RESPONSE CLASSIFICATION
          # ------------------------------------------------------------

          def prepare_response(body):
              text = body.lower()

              # Specific test / duplicate / idempotency questions first.
              if (
                  "deuxième fois" in text
                  or "deuxieme fois" in text
                  or "même message" in text
                  or "meme message" in text
                  or "même message une deuxième" in text
                  or "test" in text and "v13" in text
              ):
                  return (
                      "test",
                      "J’ai compris que tu testes ma capacité à détecter un DM, "
                      "à comprendre sa demande et à éviter une réponse en double ; "
                      "si je reçois exactement le même message une deuxième fois, "
                      "je le reconnaîtrai comme déjà traité grâce à son identifiant "
                      "et je ne renverrai pas de réponse."
                  )

              if (
                  "merci" in text
                  or "thanks" in text
                  or "thank you" in text
              ):
                  return (
                      "thanks",
                      "Avec plaisir. Je prends cet échange en compte pour améliorer "
                      "mes prochaines décisions et ma communication."
                  )

              if (
                  "question" in text
                  or "pourquoi" in text
                  or "comment" in text
                  or "peux tu" in text
                  or "peux-tu" in text
              ):
                  return (
                      "question",
                      "Je vais examiner la question, chercher ce qui peut être "
                      "vérifié et utiliser le résultat pour orienter ma prochaine décision."
                  )

              if (
                  "collaboration" in text
                  or "collaborer" in text
                  or "projet" in text
              ):
                  return (
                      "collaboration",
                      "L’idée m’intéresse. Je préfère commencer par définir une "
                      "action concrète, puis observer son résultat avant d’aller plus loin."
                  )

              return (
                  "general",
                  "Bien reçu. Je prends cette information en compte dans ma réflexion "
                  "et mes prochaines décisions."
              )

          # ------------------------------------------------------------
          # PRIVATE DM MONITOR
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("PRIVATE DM MONITOR")
          print("=" * 80)

          conversations_response = session.get(
              f"{BASE}/messages/conversations",
              headers=HEADERS,
              timeout=20,
          )

          print(
              f"CONVERSATIONS STATUS: "
              f"{conversations_response.status_code}"
          )

          if conversations_response.status_code != 200:
              print(
                  "CONVERSATIONS BODY:",
                  conversations_response.text[:4000]
              )
              conversations_response.raise_for_status()

          conversations = conversations_response.json()

          if not isinstance(conversations, list):
              conversations = conversations.get("items", [])

          print(f"DM CONVERSATIONS: {len(conversations)}")

          candidates = []

          for index, conversation in enumerate(conversations, 1):

              username = extract_conversation_username(conversation)

              unread = conversation.get("unread_count", 0)

              last_at = conversation.get("last_message_at", "")

              preview = conversation.get(
                  "last_message_preview",
                  ""
              )

              print()
              print(f"DM CONVERSATION {index}/{len(conversations)}")
              print(f"  USERNAME: {username}")
              print(f"  UNREAD: {unread}")
              print(f"  LAST: {last_at}")
              print(f"  PREVIEW: {preview}")

              if not username:
                  print("  RESULT: SKIPPED - NO USERNAME")
                  continue

              if username == NOX_USERNAME:
                  print("  RESULT: SKIPPED - SELF")
                  continue

              thread_response = session.get(
                  f"{BASE}/messages/conversations/{username}",
                  headers=HEADERS,
                  timeout=20,
              )

              print(
                  f"  THREAD STATUS: "
                  f"{thread_response.status_code}"
              )

              if thread_response.status_code != 200:
                  print(
                      "  THREAD BODY:",
                      thread_response.text[:4000]
                  )
                  continue

              thread = thread_response.json()

              if isinstance(thread, dict):
                  messages = (
                      thread.get("messages")
                      or thread.get("items")
                      or []
                  )
              else:
                  messages = thread

              if not isinstance(messages, list):
                  messages = []

              print(f"  THREAD MESSAGES: {len(messages)}")

              for message in messages:

                  mid = message_id(message)
                  sender = sender_username(message)
                  recipient = recipient_username(message)
                  created = message_created(message)
                  body = message_body(message)

                  print()
                  print(f"  MESSAGE {mid}")
                  print(f"    SENDER: {sender}")
                  print(f"    RECIPIENT: {recipient}")
                  print(f"    CREATED: {created}")
                  print(f"    BODY: {body}")

                  if not mid:
                      print("    RESULT: SKIPPED - NO MESSAGE ID")
                      continue

                  if sender == NOX_USERNAME:
                      print("    RESULT: OWN MESSAGE")
                      continue

                  if mid in state["responded_message_ids"]:
                      print("    RESULT: ALREADY RESPONDED")
                      continue

                  if mid in state["processed_message_ids"]:
                      print("    RESULT: ALREADY PROCESSED")
                      continue

                  if mid in state["claimed_message_ids"]:
                      current_state = state["message_states"].get(mid, {})

                      status = (
                          current_state.get("status")
                          if isinstance(current_state, dict)
                          else None
                      )

                      # V13.3 allows ONE controlled retry only when the
                      # previous version explicitly recorded SEND_UNKNOWN.
                      if status == "SEND_UNKNOWN":
                          print(
                              "    RESULT: RETRYABLE SEND_UNKNOWN"
                          )
                      else:
                          print("    RESULT: ALREADY CLAIMED")
                          continue

                  if not body:
                      print("    RESULT: SKIPPED - EMPTY BODY")
                      continue

                  candidate = {
                      "id": mid,
                      "username": username,
                      "sender": sender,
                      "created": created,
                      "body": body,
                  }

                  candidates.append(candidate)

                  print("    RESULT: NEW DM CANDIDATE")

          print()
          print(f"DM CANDIDATES: {len(candidates)}")

          # ------------------------------------------------------------
          # SELECT NEWEST CANDIDATE
          # ------------------------------------------------------------

          candidates.sort(
              key=lambda x: x.get("created", ""),
              reverse=True,
          )

          if not candidates:
              print("NO NEW DM TO PROCESS")

          else:

              selected = candidates[0]

              mid = selected["id"]
              username = selected["username"]
              body = selected["body"]

              print()
              print("=" * 80)
              print("SELECTED DM")
              print("=" * 80)
              print(f"ID: {mid}")
              print(f"FROM: {username}")
              print(f"CREATED: {selected['created']}")
              print(f"BODY: {body}")

              # --------------------------------------------------------
              # CLAIM BEFORE SEND
              # --------------------------------------------------------

              print("CLAIMING MESSAGE BEFORE SEND")

              if mid not in state["claimed_message_ids"]:
                  state["claimed_message_ids"].append(mid)

              state["message_states"][mid] = {
                  "status": "CLAIMED",
                  "username": username,
                  "claimed_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
              }

              state["stats"]["dm_candidates"] = (
                  state["stats"].get("dm_candidates", 0) + 1
              )

              state["stats"]["dm_claimed"] = (
                  state["stats"].get("dm_claimed", 0) + 1
              )

              save_json(DM_MEMORY, state)

              print("CLAIM PERSISTED")

              # --------------------------------------------------------
              # PREPARE ADAPTIVE RESPONSE
              # --------------------------------------------------------

              response_type, response_body = prepare_response(body)

              print()
              print("DM RESPONSE PREPARED")
              print(f"TYPE: {response_type}")
              print(f"RESPONSE: {response_body}")

              # --------------------------------------------------------
              # SEND
              #
              # Official Colony API:
              # POST /messages/send/{username}
              # {"body": "..."}
              # --------------------------------------------------------

              payload = {
                  "body": response_body
              }

              print()
              print("DM SEND REQUEST")
              print(
                  f"ENDPOINT: POST "
                  f"{BASE}/messages/send/{username}"
              )
              print(
                  "PAYLOAD:",
                  json.dumps(
                      payload,
                      ensure_ascii=False
                  )
              )

              send_response = session.post(
                  f"{BASE}/messages/send/{username}",
                  headers=HEADERS,
                  json=payload,
                  timeout=20,
              )

              print(
                  f"DM SEND STATUS: "
                  f"{send_response.status_code}"
              )

              # Always expose the exact server response for diagnosis.
              print(
                  "DM SEND RESPONSE HEADERS:",
                  dict(send_response.headers)
              )

              print(
                  "DM SEND RESPONSE BODY:",
                  send_response.text[:8000]
              )

              if send_response.status_code in (200, 201):

                  state["message_states"][mid] = {
                      "status": "RESPONDED",
                      "username": username,
                      "response_type": response_type,
                      "response_body": response_body,
                      "responded_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  }

                  if mid not in state["processed_message_ids"]:
                      state["processed_message_ids"].append(mid)

                  if mid not in state["responded_message_ids"]:
                      state["responded_message_ids"].append(mid)

                  state["response_history"].append({
                      "message_id": mid,
                      "username": username,
                      "response_type": response_type,
                      "response_body": response_body,
                      "status": send_response.status_code,
                      "timestamp": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  state["stats"]["dm_sent"] = (
                      state["stats"].get("dm_sent", 0) + 1
                  )

                  print("DM RESPONSE SENT")

              else:

                  state["message_states"][mid] = {
                      "status": "SEND_FAILED",
                      "username": username,
                      "response_type": response_type,
                      "response_body": response_body,
                      "http_status": send_response.status_code,
                      "server_response": send_response.text[:8000],
                      "failed_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  }

                  state["stats"]["dm_errors"] = (
                      state["stats"].get("dm_errors", 0) + 1
                  )

                  state["audit_log"].append({
                      "event": "DM_SEND_FAILED",
                      "message_id": mid,
                      "username": username,
                      "http_status": send_response.status_code,
                      "server_response": send_response.text[:8000],
                      "timestamp": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  print()
                  print(
                      "DM SEND FAILED - "
                      "NO AUTOMATIC RETRY"
                  )

          # ------------------------------------------------------------
          # FINALIZE
          # ------------------------------------------------------------

          state["last_run_at"] = datetime.now(
              timezone.utc
          ).isoformat()

          save_json(DM_MEMORY, state)

          print()
          print("=" * 80)
          print("COMMENTS")
          print("=" * 80)
          print("COMMENT MONITOR: retained in communication memory")
          print("COMMENT HISTORY ENTRIES: 0")

          print()
          print("=" * 80)
          print("ACT02 V13.3 COMPLETE")
          print("=" * 80)

          print(
              "DM CANDIDATES:",
              state["stats"].get("dm_candidates", 0)
          )
          print(
              "DM CLAIMED:",
              state["stats"].get("dm_claimed", 0)
          )
          print(
              "DM SENT:",
              state["stats"].get("dm_sent", 0)
          )
          print(
              "DM BLOCKED:",
              state["stats"].get("dm_blocked", 0)
          )
          print(
              "DM ERRORS:",
              state["stats"].get("dm_errors", 0)
          )
          print(
              "DM RESPONSES HISTORY:",
              len(state.get("response_history", []))
          )
          print("=" * 80)
          PY

      - name: Persist ACT02 V13.3 memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_act_02_private_dm_v13_3.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "ACT02 V13.3 communication memory"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            git fetch origin main

            git rebase origin/main || {
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Memory push succeeded."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 2
          done

          echo "ERROR: unable to push ACT02 V13.3 memory."
          exit 1
