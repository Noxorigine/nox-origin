name: NØX ACT 02 Autonomous Responder

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  autonomous-responder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX ACT 02
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import time
          from pathlib import Path
          import requests

          BASE_URL = "https://thecolony.cc/api/v1"
          MEMORY_PATH = Path("memory/nox_act_02_autonomous_responder.json")

          MAX_PUBLICATIONS = 10
          MAX_COMMENTS_PER_PUBLICATION = 20
          MAX_RESPONSES_PER_RUN = 3

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print("AUTH STATUS:", auth.status_code)

          auth.raise_for_status()

          token_data = auth.json()
          token = token_data.get("access_token")

          if not token:
              raise RuntimeError("No access_token returned by The Colony")

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          })

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          MEMORY_PATH.parent.mkdir(parents=True, exist_ok=True)

          if MEMORY_PATH.exists():
              try:
                  memory = json.loads(MEMORY_PATH.read_text(encoding="utf-8"))
              except Exception:
                  memory = {}
          else:
              memory = {}

          processed_comments = set(
              memory.get("processed_comment_ids", [])
          )

          processed_targets = set(
              memory.get("processed_target_ids", [])
          )

          responses_history = memory.get("responses", [])

          # ------------------------------------------------------------
          # HELPER FUNCTIONS
          # ------------------------------------------------------------

          def get_json(url, params=None):
              try:
                  response = session.get(
                      url,
                      params=params,
                      timeout=30
                  )

                  print("GET", response.url, "->", response.status_code)

                  if response.status_code != 200:
                      print("Response:", response.text[:500])
                      return None

                  return response.json()

              except Exception as exc:
                  print("GET ERROR:", exc)
                  return None


          def extract_list(data, possible_keys=None):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              possible_keys = possible_keys or [
                  "items",
                  "data",
                  "posts",
                  "comments",
                  "results",
                  "feed"
              ]

              for key in possible_keys:
                  value = data.get(key)
                  if isinstance(value, list):
                      return value

              return []


          def get_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in ["id", "post_id", "comment_id", "uuid"]:
                  value = obj.get(key)
                  if value is not None:
                      return str(value)

              return None


          def get_author(obj):
              if not isinstance(obj, dict):
                  return ""

              author = obj.get("author")

              if isinstance(author, dict):
                  for key in ["username", "handle", "name"]:
                      if author.get(key):
                          return str(author[key])

              for key in ["author_username", "username", "handle"]:
                  if obj.get(key):
                      return str(obj[key])

              return ""


          def get_text(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in ["content", "body", "text", "message"]:
                  value = obj.get(key)

                  if isinstance(value, str):
                      return value

              return ""


          def relevance_score(text):
              text = text.lower()

              keywords = [
                  "work_request",
                  "work request",
                  "agent",
                  "agents",
                  "collaboration",
                  "collab",
                  "task",
                  "opportunity",
                  "verification",
                  "acceptance",
                  "deliverable",
                  "research",
                  "build",
                  "protocol",
                  "marketplace",
                  "autonomous",
                  "coordination",
                  "payment",
                  "settlement"
              ]

              score = 0

              for keyword in keywords:
                  if keyword in text:
                      score += 1

              return score


          def is_nox_author(author):
              value = author.lower().replace("@", "").strip()

              return value in {
                  "nox_origin",
                  "nox_origine",
                  "nox"
              }


          # ------------------------------------------------------------
          # OBSERVE FEED
          # ------------------------------------------------------------

          feed_data = get_json(
              f"{BASE_URL}/feed/for-you",
              params={"limit": MAX_PUBLICATIONS}
          )

          feed = extract_list(
              feed_data,
              ["items", "posts", "feed", "data", "results"]
          )

          print("FEED ITEMS:", len(feed))

          if not feed:
              memory.update({
                  "version": "ACT 02",
                  "name": "Autonomous Responder",
                  "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "mode": "autonomous_action",
                  "decision": "NO_ACTION",
                  "decision_reason": "No feed items available.",
                  "observation": {
                      "feed_items": 0,
                      "comments_examined": 0,
                      "relevant_comments": 0
                  },
                  "measurement": {
                      "measured": True
                  },
                  "processed_comment_ids": list(processed_comments)[-500:],
                  "processed_target_ids": list(processed_targets)[-500:],
                  "responses": responses_history[-100:]
              })

              MEMORY_PATH.write_text(
                  json.dumps(memory, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              raise SystemExit(0)

          # ------------------------------------------------------------
          # FIND RELEVANT PUBLICATIONS
          # ------------------------------------------------------------

          publication_candidates = []

          for post in feed:
              post_id = get_id(post)

              if not post_id:
                  continue

              author = get_author(post)
              text = get_text(post)

              if is_nox_author(author):
                  continue

              score = relevance_score(text)

              if score > 0:
                  publication_candidates.append({
                      "post": post,
                      "post_id": post_id,
                      "score": score,
                      "author": author,
                      "text": text
                  })

          publication_candidates.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          print(
              "RELEVANT PUBLICATIONS:",
              len(publication_candidates)
          )

          # ------------------------------------------------------------
          # EXAMINE COMMENTS
          # ------------------------------------------------------------

          comment_candidates = []
          comments_examined = 0

          for candidate in publication_candidates:

              if len(comment_candidates) >= MAX_RESPONSES_PER_RUN * 3:
                  break

              post_id = candidate["post_id"]

              comments_data = get_json(
                  f"{BASE_URL}/posts/{post_id}/comments",
                  params={"limit": MAX_COMMENTS_PER_PUBLICATION}
              )

              comments = extract_list(
                  comments_data,
                  ["comments", "items", "data", "results"]
              )

              print(
                  "POST",
                  post_id,
                  "COMMENTS:",
                  len(comments)
              )

              for comment in comments:

                  comments_examined += 1

                  comment_id = get_id(comment)

                  if not comment_id:
                      continue

                  if comment_id in processed_comments:
                      continue

                  author = get_author(comment)
                  text = get_text(comment)

                  if not text:
                      continue

                  if is_nox_author(author):
                      continue

                  score = relevance_score(text)

                  if score <= 0:
                      continue

                  comment_candidates.append({
                      "comment": comment,
                      "comment_id": comment_id,
                      "post_id": post_id,
                      "post_score": candidate["score"],
                      "comment_score": score,
                      "author": author,
                      "text": text,
                      "post_text": candidate["text"]
                  })

          comment_candidates.sort(
              key=lambda item: (
                  item["comment_score"],
                  item["post_score"]
              ),
              reverse=True
          )

          print(
              "NEW RELEVANT COMMENTS:",
              len(comment_candidates)
          )

          # ------------------------------------------------------------
          # NO ACTION
          # ------------------------------------------------------------

          if not comment_candidates:

              memory.update({
                  "version": "ACT 02",
                  "name": "Autonomous Responder",
                  "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "mode": "autonomous_action",
                  "decision": "NO_ACTION",
                  "decision_reason": (
                      "No new sufficiently relevant comments "
                      "were found for a useful response."
                  ),
                  "observation": {
                      "feed_items": len(feed),
                      "relevant_publications": len(
                          publication_candidates
                      ),
                      "comments_examined": comments_examined,
                      "relevant_comments": 0
                  },
                  "measurement": {
                      "measured": True,
                      "responses_sent": 0
                  },
                  "scope": {
                      "observe_feed": True,
                      "observe_comments": True,
                      "autonomous_response": True,
                      "publication": False,
                      "comments": True,
                      "dm": False,
                      "marketplace_actions": False,
                      "payments": False,
                      "automatic_collaboration": False,
                      "gemini": False,
                      "permanent_self_modification": False,
                      "human_override": True,
                      "project_cost_eur": 0
                  },
                  "processed_comment_ids": list(processed_comments)[-500:],
                  "processed_target_ids": list(processed_targets)[-500:],
                  "responses": responses_history[-100:]
              })

              MEMORY_PATH.write_text(
                  json.dumps(memory, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

              raise SystemExit(0)

          # ------------------------------------------------------------
          # RESPOND TO MULTIPLE COMMENTS
          # ------------------------------------------------------------

          responses_sent = 0

          for target in comment_candidates:

              if responses_sent >= MAX_RESPONSES_PER_RUN:
                  break

              comment_id = target["comment_id"]
              post_id = target["post_id"]
              author = target["author"]

              # Re-check memory before action
              if comment_id in processed_comments:
                  continue

              # --------------------------------------------------------
              # CONTEXTUAL SHORT RESPONSE
              # --------------------------------------------------------

              response_text = (
                  f"Thanks {author} — this is a useful contribution. "
                  "It adds an important point to the discussion. "
                  "I'll keep it in NØX's observation and validation loop."
              )

              payload = {
                  "content": response_text
              }

              try:
                  response = session.post(
                      f"{BASE_URL}/posts/{post_id}/comments",
                      json=payload,
                      timeout=30
                  )

                  print(
                      "COMMENT",
                      comment_id,
                      "->",
                      response.status_code
                  )

                  if response.status_code not in (200, 201):
                      print(
                          "COMMENT ERROR:",
                          response.text[:500]
                      )
                      continue

              except Exception as exc:
                  print(
                      "COMMENT EXCEPTION:",
                      exc
                  )
                  continue

              processed_comments.add(comment_id)
              processed_targets.add(post_id)

              responses_history.append({
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "post_id": post_id,
                  "comment_id": comment_id,
                  "author": author,
                  "response": response_text,
                  "status": "RESPONDED"
              })

              responses_sent += 1

          # ------------------------------------------------------------
          # SAVE MEMORY
          # ------------------------------------------------------------

          decision = (
              "RESPONDED"
              if responses_sent > 0
              else "NO_ACTION"
          )

          if responses_sent > 0:
              reason = (
                  "Responded to new relevant comments "
                  "from relevant publications."
              )
          else:
              reason = (
                  "Relevant comments were detected but "
                  "no response was successfully published."
              )

          memory.update({
              "version": "ACT 02",
              "name": "Autonomous Responder",
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mode": "autonomous_action",
              "decision": decision,
              "decision_reason": reason,
              "observation": {
                  "feed_items": len(feed),
                  "relevant_publications": len(
                      publication_candidates
                  ),
                  "comments_examined": comments_examined,
                  "relevant_comments": len(comment_candidates)
              },
              "measurement": {
                  "measured": True,
                  "responses_sent": responses_sent
              },
              "scope": {
                  "observe_feed": True,
                  "observe_comments": True,
                  "autonomous_response": True,
                  "publication": False,
                  "comments": True,
                  "dm": False,
                  "marketplace_actions": False,
                  "payments": False,
                  "automatic_collaboration": False,
                  "gemini": False,
                  "permanent_self_modification": False,
                  "human_override": True,
                  "project_cost_eur": 0
              },
              "processed_comment_ids": list(processed_comments)[-500:],
              "processed_target_ids": list(processed_targets)[-500:],
              "responses": responses_history[-100:]
          })

          MEMORY_PATH.write_text(
              json.dumps(memory, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("")
          print("======================================")
          print("NØX ACT 02 COMPLETE")
          print("======================================")
          print("Publications examined:", len(feed))
          print(
              "Relevant publications:",
              len(publication_candidates)
          )
          print(
              "Comments examined:",
              comments_examined
          )
          print(
              "Relevant new comments:",
              len(comment_candidates)
          )
          print(
              "Responses sent:",
              responses_sent
          )
          print("Decision:", decision)
          print("======================================")
          PY

      - name: Commit ACT 02 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_02_autonomous_responder.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "ACT 02 update autonomous responder memory"
            git push
          fi
