      - name: Commit ACT02 V9 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_act_02_communication.json \
            memory/nox_act_02_private_dm.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "ACT02 V9: stable private DM communication"

      - name: Rebase and push memory
        run: |
          for attempt in 1 2 3; do
            git fetch origin main

            git rebase origin/main && \
            git push origin HEAD:main && \
            exit 0

            git rebase --abort || true
            sleep $((attempt * 3))
          done

          echo "Unable to push ACT02 V9 memory after 3 attempts."
          exit 1
