name: NØX ACT 02 V14 - Cognitive Communication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Diagnose Romu conversation
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/act02_diag.py <<'PY'
          import os
          import requests
          import json

          BASE = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]

          r = requests.post(
              f"{BASE}/api/v1/auth/token",
              json={"api_key": API_KEY},
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              timeout=20,
          )

          r.raise_for_status()
          token = r.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }

          r = requests.get(
              f"{BASE}/api/v1/messages/conversations/romu",
              headers=headers,
              timeout=20,
          )

          print(f"HTTP: {r.status_code}")

          data = r.json()

          if isinstance(data, dict):
              messages = (
                  data.get("messages")
                  or data.get("items")
                  or data.get("data")
                  or []
              )
          elif isinstance(data, list):
              messages = data
          else:
              messages = []

          print(f"Messages found: {len(messages)}")
          print("")

          for i, msg in enumerate(messages[-8:], 1):
              print(f"--- MESSAGE {i} ---")
              print("ID:", msg.get("id"))
              print("Sender:", msg.get("sender"))
              print("Sender username:", msg.get("sender_username"))
              print("From:", msg.get("from_username"))
              print("Recipient:", msg.get("recipient"))
              print("Recipient username:", msg.get("recipient_username"))
              print("To:", msg.get("to_username"))
              print("Timestamp:", msg.get("timestamp"))
              print("Created:", msg.get("created_at"))
              print("Body:", msg.get("body"))
              print("Content:", msg.get("content"))
              print("")
          PY

          python /tmp/act02_diag.py
