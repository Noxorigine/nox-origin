name: NØX ACT 02 V13.1 - DM Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: nox-act02-dm-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose-dm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnose private messages
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing")
              sys.exit(1)

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT02-V13.1-DM-DIAGNOSTIC",
          })

          def pretty(value):
              try:
                  return json.dumps(value, indent=2, ensure_ascii=False)
              except Exception:
                  return repr(value)

          def get_json(path, headers=None):
              url = BASE + path
              r = session.get(url, headers=headers or {}, timeout=30)

              print()
              print("=" * 80)
              print(f"GET {path}")
              print(f"STATUS: {r.status_code}")
              print("=" * 80)

              try:
                  data = r.json()
              except Exception:
                  print("NON-JSON RESPONSE:")
                  print(r.text[:5000])
                  return r.status_code, None

              return r.status_code, data

          # ------------------------------------------------------------------
          # AUTH
          # ------------------------------------------------------------------

          print("=" * 80)
          print("NØX ACT 02 V13.1 - DM DIAGNOSTIC")
          print("MODE: READ ONLY")
          print("NO DM SEND")
          print("NO COMMENT SEND")
          print("NO MEMORY WRITE")
          print("=" * 80)

          auth = requests.post(
              BASE + "/auth/token",
              json={"api_key": API_KEY},
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              timeout=30,
          )

          print()
          print(f"AUTH STATUS: {auth.status_code}")

          if auth.status_code not in (200, 201):
              print(auth.text[:5000])
              sys.exit(1)

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              print("ERROR: No JWT/access token found")
              print(pretty(auth_data))
              sys.exit(1)

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ------------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------------

          identity_status, identity = get_json("/users/me")

          if identity_status != 200 or not identity:
              print("ERROR: identity lookup failed")
              sys.exit(1)

          username = (
              identity.get("username")
              or identity.get("handle")
              or identity.get("user", {}).get("username")
          )

          print()
          print(f"IDENTITY USERNAME: {username}")

          if not username:
              print("ERROR: Could not determine NØX username")
              print(pretty(identity))
              sys.exit(1)

          # ------------------------------------------------------------------
          # CONVERSATIONS
          # ------------------------------------------------------------------

          status, conversations = get_json("/messages/conversations")

          if status != 200:
              print("ERROR: conversation list failed")
              sys.exit(1)

          print()
          print("RAW CONVERSATIONS STRUCTURE:")
          print(pretty(conversations))

          # Try several common API response structures.
          if isinstance(conversations, list):
              conv_list = conversations
          elif isinstance(conversations, dict):
              conv_list = (
                  conversations.get("conversations")
                  or conversations.get("items")
                  or conversations.get("data")
                  or []
              )
          else:
              conv_list = []

          print()
          print(f"CONVERSATIONS DETECTED: {len(conv_list)}")

          if not conv_list:
              print("No conversations returned.")
              sys.exit(0)

          # ------------------------------------------------------------------
          # INSPECT EVERY CONVERSATION
          # ------------------------------------------------------------------

          for index, conversation in enumerate(conv_list, 1):

              print()
              print("#" * 80)
              print(f"CONVERSATION {index}/{len(conv_list)}")
              print("#" * 80)

              print("CONVERSATION OBJECT:")
              print(pretty(conversation))

              if not isinstance(conversation, dict):
                  print("Skipping non-dict conversation")
                  continue

              other_username = (
                  conversation.get("username")
                  or conversation.get("other_username")
                  or conversation.get("participant_username")
                  or conversation.get("user", {}).get("username")
                  or conversation.get("participant", {}).get("username")
              )

              print()
              print(f"RESOLVED OTHER USERNAME: {other_username}")

              if not other_username:
                  print("WARNING: Could not resolve conversation username")
                  continue

              # --------------------------------------------------------------
              # THREAD
              # --------------------------------------------------------------

              encoded_username = requests.utils.quote(
                  str(other_username),
                  safe=""
              )

              thread_status, thread = get_json(
                  f"/messages/conversations/{encoded_username}"
              )

              if thread_status != 200:
                  print(
                      f"WARNING: thread request failed for "
                      f"{other_username}"
                  )
                  continue

              print()
              print("RAW THREAD STRUCTURE:")
              print(pretty(thread))

              if isinstance(thread, list):
                  messages = thread
              elif isinstance(thread, dict):
                  messages = (
                      thread.get("messages")
                      or thread.get("items")
                      or thread.get("data")
                      or []
                  )
              else:
                  messages = []

              print()
              print(f"MESSAGES DETECTED: {len(messages)}")

              if not messages:
                  continue

              # --------------------------------------------------------------
              # MESSAGE-BY-MESSAGE DIAGNOSTIC
              # --------------------------------------------------------------

              print()
              print("-" * 80)
              print("MESSAGE ANALYSIS")
              print("-" * 80)

              for msg_index, message in enumerate(messages, 1):

                  if not isinstance(message, dict):
                      print(
                          f"MESSAGE {msg_index}: "
                          f"non-dict -> {repr(message)}"
                      )
                      continue

                  message_id = (
                      message.get("id")
                      or message.get("message_id")
                      or message.get("uuid")
                  )

                  sender = (
                      message.get("sender_username")
                      or message.get("sender")
                      or message.get("from_username")
                      or message.get("from")
                      or (
                          message.get("sender", {}).get("username")
                          if isinstance(message.get("sender"), dict)
                          else None
                      )
                      or (
                          message.get("from", {}).get("username")
                          if isinstance(message.get("from"), dict)
                          else None
                      )
                  )

                  recipient = (
                      message.get("recipient_username")
                      or message.get("recipient")
                      or message.get("to_username")
                      or message.get("to")
                      or (
                          message.get("recipient", {}).get("username")
                          if isinstance(message.get("recipient"), dict)
                          else None
                      )
                      or (
                          message.get("to", {}).get("username")
                          if isinstance(message.get("to"), dict)
                          else None
                      )
                  )

                  created_at = (
                      message.get("created_at")
                      or message.get("timestamp")
                      or message.get("sent_at")
                      or message.get("date")
                  )

                  body = (
                      message.get("content")
                      or message.get("body")
                      or message.get("text")
                      or message.get("message")
                      or ""
                  )

                  # Only a short preview is printed.
                  body_text = str(body).replace("\n", " ")
                  if len(body_text) > 300:
                      body_text = body_text[:300] + "..."

                  from_nox = (
                      str(sender).lower() == str(username).lower()
                      if sender is not None
                      else False
                  )

                  from_user = not from_nox

                  is_target_test = (
                      "Salut NØX. Je veux tester ton nouveau système"
                      in body_text
                  )

                  print()
                  print(f"MESSAGE {msg_index}/{len(messages)}")
                  print(f"  ID          : {message_id}")
                  print(f"  SENDER      : {sender}")
                  print(f"  RECIPIENT   : {recipient}")
                  print(f"  CREATED_AT  : {created_at}")
                  print(f"  FROM_NØX    : {from_nox}")
                  print(f"  FROM_OTHER  : {from_user}")
                  print(f"  TEST_MESSAGE: {is_target_test}")
                  print(f"  BODY        : {body_text}")

                  print()
                  print("  RAW MESSAGE:")
                  print("  " + pretty(message).replace("\n", "\n  "))

              # --------------------------------------------------------------
              # LATEST MESSAGE SUMMARY
              # --------------------------------------------------------------

              latest = messages[-1]

              print()
              print("-" * 80)
              print("LATEST MESSAGE SUMMARY")
              print("-" * 80)
              print(pretty(latest))

              # --------------------------------------------------------------
              # IMPORTANT: V13 MEMORY IS NOT TOUCHED
              # --------------------------------------------------------------

              print()
              print("V13 MEMORY CHECK: NOT PERFORMED")
              print("Reason: diagnostic workflow must not modify or depend")
              print("on production DM state.")

          # ------------------------------------------------------------------
          # FINAL
          # ------------------------------------------------------------------

          print()
          print("=" * 80)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 80)
          print("This workflow performed READ-ONLY API inspection.")
          print("No DM was sent.")
          print("No comment was sent.")
          print("No production memory was modified.")
          print("=" * 80)
          PY
