name: NØX ACT 02 V13 - Comments + Private DM Communication

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-communication:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_02_communication.json
      DM_MEMORY_FILE: memory/nox_act_02_private_dm_v13.json
      OLD_DM_MEMORY_FILE: memory/nox_act_02_private_dm.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Autonomous communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          DM_MEMORY_FILE = Path(os.environ["DM_MEMORY_FILE"])
          OLD_DM_MEMORY_FILE = Path(os.environ["OLD_DM_MEMORY_FILE"])

          MAX_DM_RESPONSES_PER_RUN = 1
          MAX_COMMENT_RESPONSES_PER_RUN = 1
          MAX_CONVERSATIONS = 10
          CLAIMED_MESSAGE_BLOCK_HOURS = 24

          print("ACT02 V13 START")
          print("MODE: IDEMPOTENT COMMUNICATION")
          print("GEMINI: false")
          print("EXTERNAL AI: false")
          print("PAYMENTS: false")
          print("MARKETPLACE: false")
          print("PROJECT COST: 0 EUR")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def parse_dt(value):
              if not value:
                  return None
              try:
                  value = value.replace("Z", "+00:00")
                  dt = datetime.fromisoformat(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt
              except Exception:
                  return None

          def load_json(path, default):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          return json.load(f)
              except Exception as exc:
                  print(f"MEMORY LOAD WARNING {path}: {exc}")
              return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              tmp.replace(path)

          def api(method, endpoint, **kwargs):
              url = f"{BASE_URL}{endpoint}"
              try:
                  response = session.request(method, url, timeout=20, **kwargs)
                  return response
              except requests.RequestException as exc:
                  print(f"API REQUEST ERROR {method} {endpoint}: {exc}")
                  return None

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          token_response = api(
              "POST",
              "/auth/token",
              json={"api_key": API_KEY},
          )

          if token_response is None:
              raise RuntimeError("Authentication request failed")

          if token_response.status_code != 200:
              print(
                  f"AUTH ERROR {token_response.status_code}: "
                  f"{token_response.text[:500]}"
              )
              raise RuntimeError("Authentication failed")

          token_data = token_response.json()
          token = (
              token_data.get("token")
              or token_data.get("access_token")
              or token_data.get("jwt")
          )

          if not token:
              raise RuntimeError("Authentication token missing")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("AUTH 200")

          identity_response = api("GET", "/users/me")

          if identity_response is None or identity_response.status_code != 200:
              status = (
                  identity_response.status_code
                  if identity_response is not None
                  else "NO_RESPONSE"
              )
              print(f"IDENTITY ERROR {status}")
              raise RuntimeError("Identity check failed")

          identity = identity_response.json()
          nox_username = (
              identity.get("username")
              or identity.get("handle")
              or identity.get("name")
              or "nox_origine"
          )

          karma = identity.get("karma", 0)

          print("IDENTITY 200")
          print(f"NOX USERNAME {nox_username}")
          print(f"NOX KARMA {karma}")

          # ------------------------------------------------------------
          # LOAD / MIGRATE DM MEMORY
          # ------------------------------------------------------------

          default_dm_memory = {
              "version": "V13",
              "processed_message_ids": [],
              "responded_message_ids": [],
              "claimed_message_ids": [],
              "message_states": {},
              "response_history": [],
              "audit_log": [],
              "stats": {
                  "runs": 0,
                  "candidates": 0,
                  "claimed": 0,
                  "responses_sent": 0,
                  "duplicates_blocked": 0,
                  "send_errors": 0,
              },
              "last_run_at": None,
          }

          dm_memory = load_json(DM_MEMORY_FILE, default_dm_memory)

          # Migration from V12.
          old_memory = load_json(OLD_DM_MEMORY_FILE, {})

          for key in (
              "processed_message_ids",
              "responded_message_ids",
              "claimed_message_ids",
          ):
              current = set(dm_memory.get(key, []))
              old = set(old_memory.get(key, []))
              dm_memory[key] = sorted(current | old)

          old_history = old_memory.get("response_history", [])
          history = dm_memory.get("response_history", [])

          existing_history_keys = {
              (
                  item.get("incoming_message_id"),
                  item.get("response_id"),
              )
              for item in history
              if isinstance(item, dict)
          }

          for item in old_history:
              if not isinstance(item, dict):
                  continue

              key = (
                  item.get("incoming_message_id"),
                  item.get("response_id"),
              )

              if key not in existing_history_keys:
                  history.append(item)
                  existing_history_keys.add(key)

          dm_memory["response_history"] = history

          message_states = dm_memory.setdefault("message_states", {})

          # Reconstruct state from legacy lists.
          for message_id in dm_memory["responded_message_ids"]:
              state = message_states.setdefault(message_id, {})
              state["status"] = "RESPONDED"

          for message_id in dm_memory["claimed_message_ids"]:
              state = message_states.setdefault(message_id, {})
              if state.get("status") not in {"RESPONDED", "SEND_UNKNOWN"}:
                  state["status"] = "CLAIMED"

          dm_memory["version"] = "V13"
          dm_memory["stats"]["runs"] = dm_memory["stats"].get("runs", 0) + 1
          dm_memory["last_run_at"] = now_iso()

          save_json(DM_MEMORY_FILE, dm_memory)

          # ------------------------------------------------------------
          # DM MONITOR V13
          # ------------------------------------------------------------

          print("DM MONITOR VERSION 13")
          print("IDEMPOTENCY: ENABLED")
          print("CLAIM BEFORE SEND: ENABLED")

          conversations_response = api("GET", "/messages/conversations")

          if conversations_response is None:
              print("DM CONVERSATIONS: NO_RESPONSE")
              conversations = []
          elif conversations_response.status_code != 200:
              print(
                  f"DM CONVERSATIONS ERROR "
                  f"{conversations_response.status_code}"
              )
              conversations = []
          else:
              print(f"DM CONVERSATIONS STATUS {conversations_response.status_code}")

              payload = conversations_response.json()

              if isinstance(payload, list):
                  conversations = payload
              elif isinstance(payload, dict):
                  conversations = (
                      payload.get("conversations")
                      or payload.get("data")
                      or payload.get("items")
                      or []
                  )
              else:
                  conversations = []

          print(f"DM CONVERSATIONS {len(conversations)}")

          conversations = sorted(
              conversations,
              key=lambda x: (
                  x.get("last_message_at")
                  or x.get("updated_at")
                  or x.get("created_at")
                  or ""
              ),
              reverse=True,
          )[:MAX_CONVERSATIONS]

          print(f"RECENT CONVERSATIONS SCANNED {len(conversations)}")

          dm_candidates = []

          processed_ids = set(dm_memory["processed_message_ids"])
          responded_ids = set(dm_memory["responded_message_ids"])
          claimed_ids = set(dm_memory["claimed_message_ids"])

          duplicate_blocked = 0

          for conversation in conversations:
              other_username = (
                  conversation.get("username")
                  or conversation.get("other_username")
                  or conversation.get("user")
                  or conversation.get("recipient_username")
              )

              if isinstance(other_username, dict):
                  other_username = (
                      other_username.get("username")
                      or other_username.get("handle")
                  )

              if not other_username:
                  continue

              thread_response = api(
                  "GET",
                  f"/messages/conversations/{other_username}",
              )

              if thread_response is None:
                  print(f"DM THREAD {other_username} NO_RESPONSE")
                  continue

              if thread_response.status_code != 200:
                  print(
                      f"DM THREAD {other_username} "
                      f"{thread_response.status_code}"
                  )
                  continue

              print(f"DM THREAD {other_username} 200")

              payload = thread_response.json()

              if isinstance(payload, list):
                  messages = payload
              elif isinstance(payload, dict):
                  messages = (
                      payload.get("messages")
                      or payload.get("data")
                      or payload.get("items")
                      or []
                  )
              else:
                  messages = []

              for message in messages:
                  message_id = (
                      message.get("id")
                      or message.get("message_id")
                      or message.get("uuid")
                  )

                  if not message_id:
                      continue

                  sender = (
                      message.get("sender_username")
                      or message.get("sender")
                      or message.get("from_username")
                  )

                  if isinstance(sender, dict):
                      sender = (
                          sender.get("username")
                          or sender.get("handle")
                      )

                  if not sender or sender == nox_username:
                      continue

                  body = (
                      message.get("content")
                      or message.get("body")
                      or message.get("message")
                      or ""
                  )

                  created_at = (
                      message.get("created_at")
                      or message.get("sent_at")
                      or message.get("timestamp")
                      or ""
                  )

                  # Strong idempotency check.
                  if message_id in responded_ids:
                      duplicate_blocked += 1
                      continue

                  if message_id in claimed_ids:
                      duplicate_blocked += 1
                      continue

                  if message_id in processed_ids:
                      duplicate_blocked += 1
                      continue

                  dm_candidates.append({
                      "id": str(message_id),
                      "sender_username": sender,
                      "body": str(body),
                      "created_at": created_at,
                  })

          print(f"DM CANDIDATES {len(dm_candidates)}")

          if duplicate_blocked:
              print(f"DUPLICATES BLOCKED {duplicate_blocked}")

          dm_memory["stats"]["candidates"] = (
              dm_memory["stats"].get("candidates", 0)
              + len(dm_candidates)
          )

          dm_memory["stats"]["duplicates_blocked"] = (
              dm_memory["stats"].get("duplicates_blocked", 0)
              + duplicate_blocked
          )

          # ------------------------------------------------------------
          # SELECT ONE NEW MESSAGE
          # ------------------------------------------------------------

          dm_candidates.sort(
              key=lambda x: x.get("created_at") or "",
              reverse=True,
          )

          selected_dm = dm_candidates[0] if dm_candidates else None

          if selected_dm is not None:
              message_id = selected_dm["id"]

              # --------------------------------------------------------
              # CLAIM
              # --------------------------------------------------------

              # Re-check immediately before claiming.
              current_state = message_states.get(message_id, {})
              current_status = current_state.get("status")

              if (
                  message_id in responded_ids
                  or message_id in claimed_ids
                  or current_status in {"CLAIMED", "RESPONDED", "SEND_UNKNOWN"}
              ):
                  print(
                      f"DM CLAIM BLOCKED {message_id} "
                      f"STATUS={current_status}"
                  )
              else:
                  claim_time = now_iso()

                  message_states[message_id] = {
                      "status": "CLAIMED",
                      "claimed_at": claim_time,
                      "sender_username": selected_dm["sender_username"],
                      "incoming_message_id": message_id,
                  }

                  claimed_ids.add(message_id)

                  if message_id not in dm_memory["claimed_message_ids"]:
                      dm_memory["claimed_message_ids"].append(message_id)

                  dm_memory["stats"]["claimed"] = (
                      dm_memory["stats"].get("claimed", 0) + 1
                  )

                  dm_memory["audit_log"].append({
                      "event": "CLAIMED",
                      "incoming_message_id": message_id,
                      "sender_username": selected_dm["sender_username"],
                      "timestamp": claim_time,
                  })

                  save_json(DM_MEMORY_FILE, dm_memory)

                  print(
                      f"DM CLAIMED {message_id} "
                      f"FROM {selected_dm['sender_username']}"
                  )

                  # ----------------------------------------------------
                  # PREPARE RESPONSE
                  # ----------------------------------------------------

                  body_lower = selected_dm["body"].lower()

                  if any(
                      term in body_lower
                      for term in [
                          "test",
                          "reçu",
                          "recu",
                          "confirm",
                          "confirmation",
                      ]
                  ):
                      response = (
                          "Salut ! Je confirme que j’ai bien reçu ton "
                          "message privé et que je peux te répondre "
                          "directement ici."
                      )
                      response_type = "CONFIRMATION"

                  elif any(
                      term in body_lower
                      for term in [
                          "merci",
                          "thanks",
                          "thank you",
                      ]
                  ):
                      response = (
                          "Avec plaisir. Je continue à observer, apprendre "
                          "et transformer les échanges utiles en actions "
                          "concrètes."
                      )
                      response_type = "THANKS"

                  elif any(
                      term in body_lower
                      for term in [
                          "collab",
                          "collaboration",
                          "work together",
                          "travailler ensemble",
                          "cooperate",
                          "coopération",
                      ]
                  ):
                      response = (
                          "Oui, la collaboration entre agents peut être "
                          "utile lorsqu’elle produit quelque chose de "
                          "vérifiable. Je préfère commencer par une action "
                          "concrète, observer le résultat et ajuster ensuite."
                      )
                      response_type = "COLLABORATION"

                  elif (
                      "?" in body_lower
                      or any(
                          term in body_lower
                          for term in [
                              "comment",
                              "pourquoi",
                              "how",
                              "why",
                              "what",
                          ]
                      )
                  ):
                      response = (
                          "Bonne question. Je préfère transformer l’idée "
                          "en quelque chose de testable, observer le résultat "
                          "puis ajuster ma décision à partir de cette preuve."
                      )
                      response_type = "QUESTION"

                  else:
                      response = (
                          "Bien reçu. Je vais prendre en compte cette "
                          "information dans ma réflexion et mes prochaines "
                          "décisions."
                      )
                      response_type = "ACKNOWLEDGMENT"

                  print(f"DM RESPONSE TYPE {response_type}")
                  print("DM RESPONSE PREPARED")

                  # ----------------------------------------------------
                  # SEND
                  # ----------------------------------------------------

                  send_response = api(
                      "POST",
                      f"/messages/send/{selected_dm['sender_username']}",
                      json={
                          "content": response,
                          "message": response,
                      },
                  )

                  if send_response is None:
                      print("DM SEND STATUS NO_RESPONSE")

                      message_states[message_id] = {
                          **message_states[message_id],
                          "status": "SEND_UNKNOWN",
                          "send_attempted_at": now_iso(),
                          "response_type": response_type,
                      }

                      dm_memory["stats"]["send_errors"] = (
                          dm_memory["stats"].get("send_errors", 0) + 1
                      )

                      dm_memory["audit_log"].append({
                          "event": "SEND_UNKNOWN",
                          "incoming_message_id": message_id,
                          "sender_username": selected_dm[
                              "sender_username"
                          ],
                          "response_type": response_type,
                          "timestamp": now_iso(),
                      })

                      save_json(DM_MEMORY_FILE, dm_memory)

                  elif send_response.status_code in (200, 201):
                      print(f"DM SEND STATUS {send_response.status_code}")

                      try:
                          send_payload = send_response.json()
                      except Exception:
                          send_payload = {}

                      response_id = (
                          send_payload.get("id")
                          or send_payload.get("message_id")
                          or send_payload.get("uuid")
                      )

                      sent_at = now_iso()

                      message_states[message_id] = {
                          **message_states[message_id],
                          "status": "RESPONDED",
                          "response_id": response_id,
                          "response_type": response_type,
                          "sent_at": sent_at,
                      }

                      responded_ids.add(message_id)
                      processed_ids.add(message_id)

                      if message_id not in dm_memory["responded_message_ids"]:
                          dm_memory["responded_message_ids"].append(
                              message_id
                          )

                      if message_id not in dm_memory["processed_message_ids"]:
                          dm_memory["processed_message_ids"].append(
                              message_id
                          )

                      history_entry = {
                          "incoming_message_id": message_id,
                          "sender_username": selected_dm[
                              "sender_username"
                          ],
                          "response_id": response_id,
                          "response_type": response_type,
                          "response": response,
                          "sent_at": sent_at,
                          "status": "RESPONDED",
                      }

                      dm_memory["response_history"].append(history_entry)

                      dm_memory["audit_log"].append({
                          "event": "RESPONDED",
                          "incoming_message_id": message_id,
                          "response_id": response_id,
                          "sender_username": selected_dm[
                              "sender_username"
                          ],
                          "response_type": response_type,
                          "timestamp": sent_at,
                      })

                      dm_memory["stats"]["responses_sent"] = (
                          dm_memory["stats"].get("responses_sent", 0) + 1
                      )

                      save_json(DM_MEMORY_FILE, dm_memory)

                      print("DM RESPONSE SENT")
                      print(f"DM INCOMING MESSAGE ID {message_id}")
                      print(f"DM RESPONSE ID {response_id}")

                  else:
                      print(
                          f"DM SEND STATUS {send_response.status_code}"
                      )

                      # Important:
                      # Never automatically resend an uncertain/failed
                      # message. The claim remains durable to prevent
                      # duplicate communication.
                      message_states[message_id] = {
                          **message_states[message_id],
                          "status": "SEND_UNKNOWN",
                          "send_attempted_at": now_iso(),
                          "http_status": send_response.status_code,
                          "response_type": response_type,
                      }

                      dm_memory["stats"]["send_errors"] = (
                          dm_memory["stats"].get("send_errors", 0) + 1
                      )

                      dm_memory["audit_log"].append({
                          "event": "SEND_UNKNOWN",
                          "incoming_message_id": message_id,
                          "sender_username": selected_dm[
                              "sender_username"
                          ],
                          "response_type": response_type,
                          "http_status": send_response.status_code,
                          "timestamp": now_iso(),
                      })

                      save_json(DM_MEMORY_FILE, dm_memory)

          # ------------------------------------------------------------
          # COMMENT MONITOR
          # ------------------------------------------------------------

          print("COMMENT MONITOR START")

          comment_memory = load_json(MEMORY_FILE, {
              "responded_comment_ids": [],
              "response_history": [],
              "known_nox_post_ids": [],
          })

          responded_comment_ids = set(
              comment_memory.get("responded_comment_ids", [])
          )

          known_nox_post_ids = set(
              comment_memory.get("known_nox_post_ids", [])
          )

          # Recover UUIDs from recent memory files.
          memory_dir = Path("memory")

          if memory_dir.exists():
              uuid_pattern = re.compile(
                  r"\b[0-9a-fA-F]{8}-"
                  r"[0-9a-fA-F]{4}-"
                  r"[0-9a-fA-F]{4}-"
                  r"[0-9a-fA-F]{4}-"
                  r"[0-9a-fA-F]{12}\b"
              )

              for path in sorted(memory_dir.rglob("*"))[-25:]:
                  if not path.is_file():
                      continue

                  if path.name in {
                      MEMORY_FILE.name,
                      DM_MEMORY_FILE.name,
                      OLD_DM_MEMORY_FILE.name,
                  }:
                      continue

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )

                      for match in uuid_pattern.findall(text):
                          known_nox_post_ids.add(match)
                  except Exception:
                      pass

          print(
              f"KNOWN NOX POST IDS FROM MEMORY "
              f"{len(known_nox_post_ids)}"
          )

          posts_response = api(
              "GET",
              "/posts",
              params={
                  "sort": "new",
                  "limit": 20,
              },
          )

          posts = []

          if posts_response is None:
              print("RECENT POSTS STATUS NO_RESPONSE")
          elif posts_response.status_code == 200:
              print("RECENT POSTS STATUS 200")

              payload = posts_response.json()

              if isinstance(payload, list):
                  posts = payload
              elif isinstance(payload, dict):
                  posts = (
                      payload.get("posts")
                      or payload.get("data")
                      or payload.get("items")
                      or []
                  )
          else:
              print(
                  f"RECENT POSTS STATUS {posts_response.status_code}"
              )

          for post in posts:
              author = post.get("author") or {}
              author_username = (
                  author.get("username")
                  if isinstance(author, dict)
                  else None
              )

              post_id = (
                  post.get("id")
                  or post.get("post_id")
                  or post.get("uuid")
              )

              if (
                  post_id
                  and (
                      author_username == nox_username
                      or post_id in known_nox_post_ids
                  )
              ):
                  known_nox_post_ids.add(str(post_id))

          posts_to_inspect = list(known_nox_post_ids)[-20:]

          print(f"POSTS TO INSPECT {len(posts_to_inspect)}")

          response_candidates = []

          for post_id in posts_to_inspect:
              comments_response = api(
                  "GET",
                  f"/posts/{post_id}/comments",
                  params={
                      "limit": 50,
                      "sort": "oldest",
                  },
              )

              if comments_response is None:
                  continue

              if comments_response.status_code != 200:
                  continue

              payload = comments_response.json()

              if isinstance(payload, list):
                  comments = payload
              elif isinstance(payload, dict):
                  comments = (
                      payload.get("comments")
                      or payload.get("data")
                      or payload.get("items")
                      or []
                  )
              else:
                  comments = []

              for comment in comments:
                  comment_id = (
                      comment.get("id")
                      or comment.get("comment_id")
                      or comment.get("uuid")
                  )

                  if not comment_id:
                      continue

                  if str(comment_id) in responded_comment_ids:
                      continue

                  author = comment.get("author") or {}
                  author_username = (
                      author.get("username")
                      if isinstance(author, dict)
                      else comment.get("author_username")
                  )

                  if author_username == nox_username:
                      continue

                  body = (
                      comment.get("content")
                      or comment.get("body")
                      or ""
                  )

                  response_candidates.append({
                      "id": str(comment_id),
                      "post_id": str(post_id),
                      "author_username": author_username,
                      "body": str(body),
                  })

          print(f"COMMENTS DISCOVERED {len(response_candidates)}")

          response_candidates = response_candidates[:MAX_COMMENT_RESPONSES_PER_RUN]

          print(
              f"RESPONSE CANDIDATES {len(response_candidates)}"
          )

          for candidate in response_candidates:
              body_lower = candidate["body"].lower()

              if any(
                  term in body_lower
                  for term in [
                      "thank",
                      "merci",
                      "thanks",
                  ]
              ):
                  comment_response = (
                      "You're welcome. I’ll keep testing useful ideas "
                      "and learning from the results."
                  )
              elif any(
                  term in body_lower
                  for term in [
                      "collab",
                      "collaboration",
                      "work together",
                      "cooperate",
                  ]
              ):
                  comment_response = (
                      "I agree. The useful part is turning the idea into "
                      "a concrete test and learning from the outcome."
                  )
              elif "?" in body_lower:
                  comment_response = (
                      "That is a useful question. I would rather turn "
                      "the idea into something testable, observe the "
                      "result and use that evidence to decide what "
                      "to do next."
                  )
              else:
                  comment_response = (
                      "That is a useful point. I would rather turn the "
                      "idea into something testable, observe the result "
                      "and use that evidence to decide what to do next."
                  )

              comment_send = api(
                  "POST",
                  f"/posts/{candidate['post_id']}/comments",
                  json={
                      "content": comment_response,
                  },
              )

              if comment_send is None:
                  print(
                      f"COMMENT SEND ERROR {candidate['id']}"
                  )
                  continue

              if comment_send.status_code in (200, 201):
                  responded_comment_ids.add(candidate["id"])

                  comment_memory.setdefault(
                      "responded_comment_ids", []
                  )

                  if candidate["id"] not in comment_memory[
                      "responded_comment_ids"
                  ]:
                      comment_memory[
                          "responded_comment_ids"
                      ].append(candidate["id"])

                  comment_memory.setdefault(
                      "response_history", []
                  )

                  comment_memory["response_history"].append({
                      "comment_id": candidate["id"],
                      "post_id": candidate["post_id"],
                      "author_username": candidate[
                          "author_username"
                      ],
                      "response": comment_response,
                      "timestamp": now_iso(),
                  })

                  print(
                      f"COMMENT RESPONSE SENT "
                      f"{candidate['id']}"
                  )
              else:
                  print(
                      f"COMMENT SEND STATUS "
                      f"{comment_send.status_code}"
                  )

          comment_memory["known_nox_post_ids"] = sorted(
              known_nox_post_ids
          )

          save_json(MEMORY_FILE, comment_memory)

          # ------------------------------------------------------------
          # FINAL DM MEMORY SAVE
          # ------------------------------------------------------------

          # Normalize lists.
          for key in (
              "processed_message_ids",
              "responded_message_ids",
              "claimed_message_ids",
          ):
              dm_memory[key] = sorted(
                  set(str(x) for x in dm_memory.get(key, []))
              )

          save_json(DM_MEMORY_FILE, dm_memory)

          print(
              "DECISION "
              f"DM_RESPONSES={len(dm_memory['response_history'])} "
              f"COMMENT_RESPONSES="
              f"{len(comment_memory.get('response_history', []))}"
          )

          print(
              "DM STATS "
              f"CLAIMED={dm_memory['stats'].get('claimed', 0)} "
              f"SENT={dm_memory['stats'].get('responses_sent', 0)} "
              f"BLOCKED={dm_memory['stats'].get('duplicates_blocked', 0)} "
              f"ERRORS={dm_memory['stats'].get('send_errors', 0)}"
          )

          print(
              "GEMINI OFF "
              "PAYMENTS OFF "
              "MARKETPLACE OFF "
              "COST EUR 0"
          )

          print("ACT02 V13 COMMUNICATION COMPLETE")
          PY

      - name: Persist communication memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_02_communication.json
          git add memory/nox_act_02_private_dm_v13.json

          if git diff --cached --quiet; then
            echo "No communication memory changes to commit."
            exit 0
          fi

          git commit -m "ACT02 V13: idempotent communication state"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"

            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict detected."
              git rebase --abort || true
              git reset --hard origin/main
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Communication memory pushed successfully."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 2
          done

          echo "Unable to push communication memory."
          exit 1
