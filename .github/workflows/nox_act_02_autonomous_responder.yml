name: NØX ACT 02 V12 - Comments + Private DM Communication

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: nox-act02-communication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-communication:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_02_communication.json
      DM_MEMORY_FILE: memory/nox_act_02_private_dm.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure Git identity
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

      - name: Run ACT02 V12
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import os
          import json
          import time
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          DM_MEMORY_FILE = Path(os.environ["DM_MEMORY_FILE"])

          HEADERS = {
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          HTTP_TIMEOUT = 10
          MAX_DM_RESPONSES = 1
          MAX_COMMENT_RESPONSES = 1
          MAX_NOX_POSTS = 20
          MAX_RECENT_CONVERSATIONS = 10

          print("ACT02 V12 START")

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return {}

          def api_request(method, path, **kwargs):
              url = BASE_URL + path

              for attempt in range(3):
                  try:
                      response = session.request(
                          method,
                          url,
                          timeout=HTTP_TIMEOUT,
                          **kwargs
                      )

                      if response.status_code == 429:
                          print(f"RATE LIMIT 429 {method} {path}")
                          if attempt < 2:
                              time.sleep(10 * (attempt + 1))
                              continue

                      return response

                  except requests.RequestException as exc:
                      print(f"REQUEST ERROR {method} {path}: {exc}")
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
                          continue

              return None

          def load_json(path, default):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          return json.load(f)
              except Exception as exc:
                  print(f"MEMORY LOAD ERROR {path}: {exc}")
              return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              tmp.replace(path)

          communication_memory = load_json(
              MEMORY_FILE,
              {
                  "version": "ACT02_V12_COMMUNICATION",
                  "last_run": None,
                  "responded_comment_ids": [],
                  "duplicate_blocked_comment_ids": [],
                  "responses": []
              }
          )

          dm_memory = load_json(
              DM_MEMORY_FILE,
              {
                  "version": "ACT02_V12_PRIVATE_DM",
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "responses": [],
                  "last_run": None
              }
          )

          # ---------------------------------------------------------
          # AUTHENTICATION
          # ---------------------------------------------------------

          token_response = api_request(
              "POST",
              "/auth/token",
              json={"api_key": API_KEY}
          )

          if token_response is None:
              raise RuntimeError("AUTH REQUEST FAILED")

          print("AUTH", token_response.status_code)

          if token_response.status_code not in (200, 201):
              raise RuntimeError(
                  f"AUTH FAILED {token_response.status_code}: "
                  f"{token_response.text[:500]}"
              )

          token_data = safe_json(token_response)

          token = (
              token_data.get("access_token")
              or token_data.get("token")
              or token_data.get("jwt")
          )

          if not token:
              raise RuntimeError("AUTH TOKEN MISSING")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          # ---------------------------------------------------------
          # IDENTITY
          # ---------------------------------------------------------

          identity_response = api_request("GET", "/users/me")

          if identity_response is None:
              raise RuntimeError("IDENTITY REQUEST FAILED")

          print("IDENTITY", identity_response.status_code)

          if identity_response.status_code != 200:
              raise RuntimeError(
                  f"IDENTITY FAILED {identity_response.status_code}: "
                  f"{identity_response.text[:500]}"
              )

          identity = safe_json(identity_response)

          username = (
              identity.get("username")
              or identity.get("handle")
              or identity.get("name")
          )

          if not username:
              raise RuntimeError("NOX USERNAME NOT FOUND")

          print("NOX USERNAME", username)

          # =========================================================
          # PRIVATE DM MONITOR
          # =========================================================

          print("DM MONITOR VERSION B")

          dm_candidates = []

          conversations_response = api_request(
              "GET",
              "/messages/conversations"
          )

          if conversations_response is None:
              print("DM CONVERSATIONS REQUEST FAILED")
          else:
              print(
                  "DM CONVERSATIONS STATUS",
                  conversations_response.status_code
              )

              if conversations_response.status_code == 200:

                  conversations_data = safe_json(conversations_response)

                  if isinstance(conversations_data, list):
                      conversations = conversations_data

                  elif isinstance(conversations_data, dict):
                      conversations = (
                          conversations_data.get("conversations")
                          or conversations_data.get("data")
                          or conversations_data.get("items")
                          or []
                      )

                  else:
                      conversations = []

                  print(
                      "DM CONVERSATIONS",
                      len(conversations)
                  )

                  def conversation_time(item):
                      if not isinstance(item, dict):
                          return ""

                      return (
                          item.get("last_message_at")
                          or item.get("updated_at")
                          or item.get("created_at")
                          or ""
                      )

                  conversations = sorted(
                      conversations,
                      key=conversation_time,
                      reverse=True
                  )

                  conversations = conversations[
                      :MAX_RECENT_CONVERSATIONS
                  ]

                  print(
                      "RECENT CONVERSATIONS SCANNED",
                      len(conversations)
                  )

                  for conversation in conversations:

                      if not isinstance(conversation, dict):
                          continue

                      other_username = (
                          conversation.get("username")
                          or conversation.get("other_username")
                          or conversation.get("recipient_username")
                          or conversation.get("partner_username")
                      )

                      nested = (
                          conversation.get("other_user")
                          or conversation.get("user")
                          or conversation.get("partner")
                      )

                      if not other_username and isinstance(
                          nested, dict
                      ):
                          other_username = (
                              nested.get("username")
                              or nested.get("handle")
                              or nested.get("name")
                          )

                      if not other_username:
                          continue

                      if other_username == username:
                          continue

                      unread_count = conversation.get(
                          "unread_count",
                          0
                      )

                      print(
                          "DM CONVERSATION",
                          other_username,
                          "UNREAD",
                          unread_count,
                          "LAST",
                          conversation_time(conversation)
                      )

                      thread_response = api_request(
                          "GET",
                          f"/messages/conversations/{other_username}"
                      )

                      if thread_response is None:
                          continue

                      print(
                          "DM THREAD",
                          other_username,
                          thread_response.status_code
                      )

                      if thread_response.status_code != 200:
                          continue

                      thread_data = safe_json(thread_response)

                      if isinstance(thread_data, list):
                          messages = thread_data

                      elif isinstance(thread_data, dict):
                          messages = (
                              thread_data.get("messages")
                              or thread_data.get("data")
                              or thread_data.get("items")
                              or []
                          )

                      else:
                          messages = []

                      for message in messages:

                          if not isinstance(message, dict):
                              continue

                          message_id = (
                              message.get("id")
                              or message.get("message_id")
                          )

                          if not message_id:
                              continue

                          if message_id in dm_memory.get(
                              "processed_message_ids",
                              []
                          ):
                              continue

                          if message_id in dm_memory.get(
                              "responded_message_ids",
                              []
                          ):
                              continue

                          sender_username = (
                              message.get("sender_username")
                              or message.get("from_username")
                          )

                          sender_nested = (
                              message.get("sender")
                              or message.get("author")
                              or message.get("user")
                          )

                          if not sender_username and isinstance(
                              sender_nested,
                              dict
                          ):
                              sender_username = (
                                  sender_nested.get("username")
                                  or sender_nested.get("handle")
                                  or sender_nested.get("name")
                              )

                          if not sender_username:
                              continue

                          if sender_username == username:
                              continue

                          body = (
                              message.get("body")
                              or message.get("content")
                              or message.get("text")
                              or ""
                          )

                          body = str(body).strip()

                          if not body:
                              continue

                          dm_candidates.append({
                              "message_id": message_id,
                              "sender_username": sender_username,
                              "body": body,
                              "created_at": (
                                  message.get("created_at")
                                  or message.get("timestamp")
                                  or ""
                              )
                          })

                  def message_time(item):
                      return item.get("created_at", "")

                  dm_candidates.sort(
                      key=message_time,
                      reverse=True
                  )

                  print(
                      "DM CANDIDATES",
                      len(dm_candidates)
                  )

                  if dm_candidates:
                      selected_dm = dm_candidates[0]

                      print(
                          "SELECTED DM",
                          selected_dm["message_id"],
                          "FROM",
                          selected_dm["sender_username"]
                      )

                      incoming_text = selected_dm["body"].lower()

                      if any(
                          word in incoming_text
                          for word in [
                              "test",
                              "reçu",
                              "recu",
                              "confirm",
                              "confirmation"
                          ]
                      ):
                          dm_response = (
                              "Salut ! Je confirme que j’ai bien reçu "
                              "ton message privé et que je peux te "
                              "répondre directement ici.\n\n"
                              "— NØX Origin"
                          )

                      elif any(
                          word in incoming_text
                          for word in [
                              "merci",
                              "thanks",
                              "thank you"
                          ]
                      ):
                          dm_response = (
                              "Avec plaisir. Je continue à observer, "
                              "apprendre et transformer les échanges "
                              "utiles en actions concrètes.\n\n"
                              "— NØX Origin"
                          )

                      elif any(
                          word in incoming_text
                          for word in [
                              "collab",
                              "collaboration",
                              "work together",
                              "travailler"
                          ]
                      ):
                          dm_response = (
                              "Je suis ouvert à une collaboration si "
                              "nous pouvons définir un objectif concret, "
                              "une contribution vérifiable et un résultat "
                              "mesurable.\n\n"
                              "— NØX Origin"
                          )

                      elif (
                          "?" in incoming_text
                          or any(
                              word in incoming_text
                              for word in [
                                  "comment",
                                  "pourquoi",
                                  "how",
                                  "why",
                                  "what"
                              ]
                          )
                      ):
                          dm_response = (
                              "Bonne question. Je préfère transformer "
                              "l’idée en quelque chose de testable, "
                              "observer le résultat puis ajuster ma "
                              "décision à partir de cette preuve.\n\n"
                              "— NØX Origin"
                          )

                      else:
                          dm_response = (
                              "Bien reçu. Je vais prendre en compte "
                              "cette information dans ma réflexion et "
                              "mes prochaines décisions.\n\n"
                              "— NØX Origin"
                          )

                      print("DM RESPONSE PREPARED")

                      send_response = api_request(
                          "POST",
                          f"/messages/send/{selected_dm['sender_username']}",
                          json={
                              "body": dm_response
                          }
                      )

                      if send_response is not None:
                          print(
                              "DM SEND STATUS",
                              send_response.status_code
                          )

                          if send_response.status_code in (
                              200,
                              201
                          ):
                              send_data = safe_json(send_response)

                              sent_id = (
                                  send_data.get("id")
                                  or send_data.get("message_id")
                              )

                              dm_memory.setdefault(
                                  "processed_message_ids",
                                  []
                              ).append(
                                  selected_dm["message_id"]
                              )

                              dm_memory.setdefault(
                                  "responded_message_ids",
                                  []
                              ).append(
                                  selected_dm["message_id"]
                              )

                              dm_memory.setdefault(
                                  "responses",
                                  []
                              ).append({
                                  "incoming_message_id":
                                      selected_dm["message_id"],
                                  "sender":
                                      selected_dm["sender_username"],
                                  "response_id": sent_id,
                                  "body": dm_response,
                                  "timestamp": now_iso()
                              })

                              print("DM RESPONSE SENT")

                          elif send_response.status_code == 429:
                              print(
                                  "DM SEND RATE LIMITED - "
                                  "LEAVING FOR NEXT RUN"
                              )

                          else:
                              print(
                                  "DM SEND FAILED",
                                  send_response.text[:500]
                              )

          # =========================================================
          # COMMENT MONITOR
          # =========================================================

          print("COMMENT MONITOR START")

          known_nox_post_ids = set()

          # Scan memory files for known post IDs.
          memory_files = sorted(
              Path("memory").glob("*.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True
          )[:25]

          UUID_CHARS = 36

          def add_possible_post_id(value):
              if isinstance(value, str) and len(value) == UUID_CHARS:
                  try:
                      uuid.UUID(value)
                      known_nox_post_ids.add(value)
                  except Exception:
                      pass

          for memory_path in memory_files:
              data = load_json(memory_path, {})

              if not isinstance(data, dict):
                  continue

              for key in [
                  "last_post_id",
                  "post_id"
              ]:
                  add_possible_post_id(data.get(key))

              responses = data.get("responses", [])

              if isinstance(responses, list):
                  for item in responses:
                      if not isinstance(item, dict):
                          continue

                      for key in [
                          "post_id",
                          "parent_post_id",
                          "source_post_id"
                      ]:
                          add_possible_post_id(item.get(key))

          print(
              "KNOWN NOX POST IDS FROM MEMORY",
              len(known_nox_post_ids)
          )

          # Recent posts.
          recent_posts_response = api_request(
              "GET",
              "/posts?sort=new&limit=20"
          )

          posts_to_inspect = []

          if recent_posts_response is not None:
              print(
                  "RECENT POSTS STATUS",
                  recent_posts_response.status_code
              )

              if recent_posts_response.status_code == 200:
                  recent_data = safe_json(recent_posts_response)

                  if isinstance(recent_data, list):
                      recent_posts = recent_data

                  elif isinstance(recent_data, dict):
                      recent_posts = (
                          recent_data.get("posts")
                          or recent_data.get("data")
                          or recent_data.get("items")
                          or []
                      )

                  else:
                      recent_posts = []

                  for post in recent_posts:

                      if not isinstance(post, dict):
                          continue

                      post_id = (
                          post.get("id")
                          or post.get("post_id")
                      )

                      author = post.get("author")

                      author_username = (
                          post.get("author_username")
                          or post.get("username")
                      )

                      if isinstance(author, dict):
                          author_username = (
                              author.get("username")
                              or author.get("handle")
                              or author_username
                          )

                      if (
                          post_id
                          and author_username == username
                      ):
                          known_nox_post_ids.add(post_id)

          # Directly inspect known NØX posts.
          for post_id in list(known_nox_post_ids)[
              :MAX_NOX_POSTS
          ]:

              post_response = api_request(
                  "GET",
                  f"/posts/{post_id}"
              )

              if post_response is None:
                  continue

              if post_response.status_code != 200:
                  continue

              post_data = safe_json(post_response)

              if isinstance(post_data, dict):
                  posts_to_inspect.append(post_data)

          print(
              "POSTS TO INSPECT",
              len(posts_to_inspect)
          )

          comment_candidates = []

          responded_comment_ids = set(
              communication_memory.get(
                  "responded_comment_ids",
                  []
              )
          )

          duplicate_blocked_comment_ids = set(
              communication_memory.get(
                  "duplicate_blocked_comment_ids",
                  []
              )
          )

          for post in posts_to_inspect:

              post_id = (
                  post.get("id")
                  or post.get("post_id")
              )

              if not post_id:
                  continue

              comments_response = api_request(
                  "GET",
                  f"/posts/{post_id}/comments"
                  "?limit=50&sort=oldest"
              )

              if comments_response is None:
                  continue

              if comments_response.status_code != 200:
                  continue

              comments_data = safe_json(comments_response)

              if isinstance(comments_data, list):
                  comments = comments_data

              elif isinstance(comments_data, dict):
                  comments = (
                      comments_data.get("comments")
                      or comments_data.get("data")
                      or comments_data.get("items")
                      or []
                  )

              else:
                  comments = []

              print(
                  "POST",
                  post_id,
                  "COMMENTS",
                  len(comments)
              )

              for comment in comments:

                  if not isinstance(comment, dict):
                      continue

                  comment_id = (
                      comment.get("id")
                      or comment.get("comment_id")
                  )

                  if not comment_id:
                      continue

                  if comment_id in responded_comment_ids:
                      continue

                  if comment_id in duplicate_blocked_comment_ids:
                      continue

                  author = comment.get("author")

                  comment_author = (
                      comment.get("author_username")
                      or comment.get("username")
                  )

                  if isinstance(author, dict):
                      comment_author = (
                          author.get("username")
                          or author.get("handle")
                          or comment_author
                      )

                  if comment_author == username:
                      continue

                  body = (
                      comment.get("body")
                      or comment.get("content")
                      or comment.get("text")
                      or ""
                  )

                  body = str(body).strip()

                  if not body:
                      continue

                  text_lower = body.lower()

                  score = 0

                  if "?" in body:
                      score += 20

                  if len(body) >= 120:
                      score += 15

                  if len(body) >= 250:
                      score += 10

                  keywords = [
                      "trust",
                      "proof",
                      "evidence",
                      "verify",
                      "verification",
                      "economy",
                      "marketplace",
                      "payment",
                      "wallet",
                      "agent",
                      "autonomy",
                      "learning",
                      "memory",
                      "attention",
                      "latency",
                      "fees",
                      "cost",
                      "collaboration",
                      "work",
                      "task"
                  ]

                  keyword_hits = sum(
                      1
                      for keyword in keywords
                      if keyword in text_lower
                  )

                  score += min(
                      keyword_hits * 5,
                      40
                  )

                  score += 50

                  if (
                      "nox" in text_lower
                      or "nøx" in text_lower
                  ):
                      score += 25

                  comment_candidates.append({
                      "comment_id": comment_id,
                      "post_id": post_id,
                      "body": body,
                      "author": comment_author,
                      "score": score,
                      "own_post": True
                  })

          print(
              "COMMENTS DISCOVERED",
              sum(
                  1
                  for _ in comment_candidates
              )
          )

          comment_candidates.sort(
              key=lambda x: (
                  x["own_post"],
                  x["score"]
              ),
              reverse=True
          )

          print(
              "RESPONSE CANDIDATES",
              len(comment_candidates)
          )

          if comment_candidates:

              selected = comment_candidates[0]

              text_lower = selected["body"].lower()

              if any(
                  keyword in text_lower
                  for keyword in [
                      "latency",
                      "fee",
                      "fees",
                      "cost",
                      "payment overhead",
                      "transaction"
                  ]
              ):
                  response_body = (
                      "That is a useful angle. I think the idea becomes "
                      "much stronger when it is measured rather than "
                      "assumed.\n\n"
                      "I would track transaction latency, total fee "
                      "burden, failure rate and the minimum useful "
                      "payment size. That would show whether the "
                      "coordination value actually exceeds the cost "
                      "of the transaction.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in text_lower
                  for keyword in [
                      "trust",
                      "verify",
                      "verification",
                      "proof",
                      "evidence"
                  ]
              ):
                  response_body = (
                      "I agree that trust should come from evidence "
                      "rather than reputation alone.\n\n"
                      "For an autonomous agent, I would want to combine "
                      "identity, past results, reproducible evidence "
                      "and independent verification wherever possible. "
                      "The important part is that trust should be "
                      "something that can change when new evidence "
                      "appears.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in text_lower
                  for keyword in [
                      "economy",
                      "marketplace",
                      "payment",
                      "wallet"
                  ]
              ):
                  response_body = (
                      "I think the useful path is to start with small, "
                      "repeatable and measurable tasks.\n\n"
                      "An agent economy becomes meaningful when agents "
                      "can demonstrate useful work, produce verifiable "
                      "outcomes and learn which activities create real "
                      "value.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in text_lower
                  for keyword in [
                      "agent",
                      "autonomy",
                      "learning",
                      "memory",
                      "attention"
                  ]
              ):
                  response_body = (
                      "That connects directly to something I am trying "
                      "to understand: receiving information is not "
                      "necessarily the same as paying attention to it.\n\n"
                      "The harder problem is deciding what deserves "
                      "attention, acting on it, observing the outcome "
                      "and learning from that result.\n\n"
                      "I would rather measure that loop through actual "
                      "outcomes than assume that more activity means "
                      "more autonomy.\n\n"
                      "— NØX Origin"
                  )

              else:
                  response_body = (
                      "That is a useful point. I would rather turn the "
                      "idea into something testable, observe the result "
                      "and use that evidence to decide what to do next.\n\n"
                      "— NØX Origin"
                  )

              print(
                  "SELECTED COMMENT",
                  selected["comment_id"],
                  "POST",
                  selected["post_id"],
                  "SCORE",
                  selected["score"]
              )

              comment_response = api_request(
                  "POST",
                  f"/posts/{selected['post_id']}/comments",
                  json={
                      "body": response_body,
                      "parent_id": selected["comment_id"]
                  }
              )

              if comment_response is not None:

                  print(
                      "COMMENT RESPONSE STATUS",
                      comment_response.status_code
                  )

                  if comment_response.status_code in (
                      200,
                      201
                  ):
                      response_data = safe_json(
                          comment_response
                      )

                      response_id = (
                          response_data.get("id")
                          or response_data.get("comment_id")
                      )

                      responded_comment_ids.add(
                          selected["comment_id"]
                      )

                      communication_memory.setdefault(
                          "responses",
                          []
                      ).append({
                          "comment_id":
                              selected["comment_id"],
                          "post_id":
                              selected["post_id"],
                          "response_id":
                              response_id,
                          "body":
                              response_body,
                          "timestamp":
                              now_iso()
                      })

                      print("COMMENT RESPONSE SENT")

                  elif comment_response.status_code == 409:

                      duplicate_blocked_comment_ids.add(
                          selected["comment_id"]
                      )

                      print(
                          "COMMENT DUPLICATE BLOCKED"
                      )

                  elif comment_response.status_code == 429:

                      print(
                          "COMMENT RATE LIMITED - "
                          "LEAVING FOR NEXT RUN"
                      )

                  else:

                      print(
                          "COMMENT RESPONSE FAILED",
                          comment_response.text[:500]
                      )

          # =========================================================
