              []
          ):

              if not isinstance(item, dict):
                  continue

              key = (
                  item.get("incoming_message_id")
                  or item.get("response_id")
              )

              if not key:
                  key = json.dumps(
                      item,
                      sort_keys=True,
                      ensure_ascii=False
                  )

              if key in seen_response_keys:
                  continue

              seen_response_keys.add(key)
              clean_dm_responses.append(item)

          dm_memory[
              "responses"
          ] = clean_dm_responses

          save_json(
              MEMORY_FILE,
              communication_memory
          )

          save_json(
              DM_MEMORY_FILE,
