name: NØX ACT 02 V13.5 - Comments + Private DM Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  communication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: ACT02 V13.5 Communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import os
          import json
          import copy
          from datetime import datetime, timezone

          import requests

          print("=" * 80)
          print("NØX ACT 02 V13.5 - COMMUNICATION")
          print("=" * 80)
          print("IDEMPOTENCY: ENABLED")
          print("CLAIM BEFORE SEND: ENABLED")
          print("CONVERSATION PARSER: other_user.username ENABLED")
          print("DM API PAYLOAD: {body: ...} ENABLED")
          print("HTTP ERROR BODY DIAGNOSTIC: ENABLED")
          print("EXHAUSTIVE MESSAGE CLASSIFICATION: ENABLED")
          print("MESSAGE STATE AUDIT: ENABLED")
          print("LEGACY RESPONSE VALIDATION: ENABLED")
          print("ADAPTIVE TEST RESPONSE: ENABLED")
          print("GEMINI: OFF")
          print("PAYMENTS: OFF")
          print("MARKETPLACE ACTIONS: OFF")
          print("=" * 80)

          BASE = "https://thecolony.ai/api/v1"

          DM_MEMORY = "memory/nox_act_02_private_dm_v13_5.json"

          OLD_MEMORIES = [
              "memory/nox_act_02_private_dm_v13_4.json",
              "memory/nox_act_02_private_dm_v13_3.json",
              "memory/nox_act_02_private_dm_v13_2.json",
              "memory/nox_act_02_private_dm_v13.json",
              "memory/nox_act_02_private_dm.json",
          ]

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          def get_token():
              r = session.post(
                  f"{BASE}/auth/token",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  json={
                      "api_key": API_KEY
                  },
                  timeout=20,
              )

              print(f"AUTH STATUS: {r.status_code}")

              if r.status_code != 200:
                  print("AUTH BODY:", r.text[:4000])
                  r.raise_for_status()

              data = r.json()
              token = data.get("access_token")

              if not token:
                  raise RuntimeError(
                      "No access_token returned by /auth/token"
                  )

              return token

          token = get_token()

          HEADERS = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def safe_username(value):
              if isinstance(value, str):
                  value = value.strip()
                  return value if value else None

              if isinstance(value, dict):
                  return (
                      safe_username(value.get("username"))
                      or safe_username(value.get("name"))
                      or safe_username(value.get("handle"))
                  )

              return None

          def normalize_username(value):
              value = safe_username(value)

              if not value:
                  return None

              return value.strip().lstrip("@").lower()

          def extract_conversation_username(conversation):
              other_user = conversation.get("other_user")

              return (
                  safe_username(conversation.get("username"))
                  or safe_username(conversation.get("other_username"))
                  or safe_username(conversation.get("participant_username"))
                  or safe_username(other_user)
              )

          def message_id(message):
              return (
                  message.get("id")
                  or message.get("message_id")
                  or message.get("uuid")
              )

          def sender_username(message):
              sender = message.get("sender")

              return (
                  safe_username(message.get("sender_username"))
                  or safe_username(message.get("from_username"))
                  or safe_username(sender)
              )

          def recipient_username(message):
              recipient = message.get("recipient")

              return (
                  safe_username(message.get("recipient_username"))
                  or safe_username(message.get("to_username"))
                  or safe_username(recipient)
              )

          def message_body(message):
              body = (
                  message.get("body")
                  or message.get("content")
                  or message.get("text")
                  or ""
              )

              return str(body).strip()

          def message_created(message):
              return (
                  message.get("created_at")
                  or message.get("created")
                  or message.get("timestamp")
                  or ""
              )

          def load_json(path, default):
              if not os.path.exists(path):
                  return copy.deepcopy(default)

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: failed to load {path}: {exc}")
                  return copy.deepcopy(default)

          def save_json(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)

              tmp = path + ".tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              os.replace(tmp, path)

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          default_state = {
              "processed_message_ids": [],
              "responded_message_ids": [],
              "claimed_message_ids": [],
              "message_states": {},
              "response_history": [],
              "audit_log": [],
              "stats": {
                  "dm_candidates": 0,
                  "dm_claimed": 0,
                  "dm_sent": 0,
                  "dm_blocked": 0,
                  "dm_errors": 0,
                  "messages_inspected": 0,
                  "messages_new": 0,
                  "messages_already_responded": 0,
                  "messages_already_processed": 0,
                  "messages_already_claimed": 0,
                  "messages_own": 0,
                  "messages_skipped": 0,
                  "legacy_false_response_flags": 0,
              },
              "last_run_at": None,
          }

          state = load_json(
              DM_MEMORY,
              default_state,
          )

          if not isinstance(state, dict):
              state = copy.deepcopy(default_state)

          for key, value in default_state.items():
              if key not in state:
                  state[key] = copy.deepcopy(value)

          if not isinstance(state.get("message_states"), dict):
              state["message_states"] = {}

          if not isinstance(state.get("audit_log"), list):
              state["audit_log"] = []

          if not isinstance(state.get("response_history"), list):
              state["response_history"] = []

          for key in (
              "processed_message_ids",
              "responded_message_ids",
              "claimed_message_ids",
          ):
              if not isinstance(state.get(key), list):
                  state[key] = []

          # ------------------------------------------------------------
          # MIGRATION
          # ------------------------------------------------------------

          for old_path in OLD_MEMORIES:
              if not os.path.exists(old_path):
                  continue

              print(f"MIGRATION CHECK: {old_path}")

              old = load_json(
                  old_path,
                  {},
              )

              if not isinstance(old, dict):
                  continue

              old_states = old.get(
                  "message_states",
                  {},
              )

              if isinstance(old_states, dict):
                  for mid, info in old_states.items():
                      if mid not in state["message_states"]:
                          state["message_states"][mid] = info

              old_history = old.get(
                  "response_history",
                  [],
              )

              if isinstance(old_history, list):
                  existing_history_ids = {
                      item.get("message_id")
                      for item in state["response_history"]
                      if isinstance(item, dict)
                  }

                  for item in old_history:
                      if not isinstance(item, dict):
                          continue

                      item_mid = item.get("message_id")

                      if item_mid not in existing_history_ids:
                          state["response_history"].append(item)

              # --------------------------------------------------------
              # IMPORTANT:
              #
              # Do NOT blindly migrate responded_message_ids or
              # processed_message_ids.
              #
              # Older versions could mark messages as processed before
              # a confirmed successful send. V13.5 therefore rebuilds
              # response truth from explicit successful response
              # evidence instead of trusting legacy flags.
              # --------------------------------------------------------

              old_responded = old.get(
                  "responded_message_ids",
                  [],
              )

              if isinstance(old_responded, list):
                  for mid in old_responded:
                      info = state["message_states"].get(
                          mid,
                          {},
                      )

                      has_success_state = (
                          isinstance(info, dict)
                          and info.get("status") == "RESPONDED"
                      )

                      has_history = any(
                          isinstance(item, dict)
                          and item.get("message_id") == mid
                          and item.get("status") in (200, 201)
                          for item in state["response_history"]
                      )

                      if has_success_state or has_history:
                          if mid not in state["responded_message_ids"]:
                              state["responded_message_ids"].append(mid)
                      else:
                          state["stats"][
                              "legacy_false_response_flags"
                          ] = (
                              state["stats"].get(
                                  "legacy_false_response_flags",
                                  0,
                              ) + 1
                          )

                          state["audit_log"].append({
                              "event": "LEGACY_RESPONSE_FLAG_REJECTED",
                              "message_id": mid,
                              "source_memory": old_path,
                              "timestamp": utc_now(),
                          })

              old_processed = old.get(
                  "processed_message_ids",
                  [],
              )

              if isinstance(old_processed, list):
                  for mid in old_processed:
                      if mid in state["responded_message_ids"]:
                          if mid not in state["processed_message_ids"]:
                              state["processed_message_ids"].append(mid)

          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          me = session.get(
              f"{BASE}/users/me",
              headers=HEADERS,
              timeout=20,
          )

          print(f"IDENTITY STATUS: {me.status_code}")

          if me.status_code != 200:
              print(
                  "IDENTITY BODY:",
                  me.text[:4000],
              )
              me.raise_for_status()

          me_data = me.json()

          if isinstance(me_data, dict):
              user_data = me_data.get(
                  "user",
                  {},
              )

              if not isinstance(
                  user_data,
                  dict,
              ):
                  user_data = {}

              NOX_USERNAME = (
                  me_data.get("username")
                  or user_data.get("username")
              )

              NOX_KARMA = (
                  me_data.get("karma")
                  or user_data.get("karma")
              )
          else:
              NOX_USERNAME = None
              NOX_KARMA = None

          if not NOX_USERNAME:
              raise RuntimeError(
                  "Unable to determine NØX username"
              )

          NOX_USERNAME_NORMALIZED = normalize_username(
              NOX_USERNAME
          )

          print(f"NØX USERNAME: {NOX_USERNAME}")
          print(f"NØX KARMA: {NOX_KARMA}")
          print(
              f"NØX NORMALIZED USERNAME: "
              f"{NOX_USERNAME_NORMALIZED}"
          )

          # ------------------------------------------------------------
          # RESPONSE CLASSIFICATION
          # ------------------------------------------------------------

          def prepare_response(body):
              text = body.lower()

              if (
                  (
                      "test" in text
                      and (
                          "v13" in text
                          or "communication" in text
                      )
                  )
                  or "deuxième fois" in text
                  or "deuxieme fois" in text
                  or "même message" in text
                  or "meme message" in text
              ):
                  return (
                      "test",
                      "J’ai compris que tu testes ma capacité à "
                      "détecter un DM, à comprendre sa demande et "
                      "à éviter une réponse en double ; si je reçois "
                      "exactement le même message une deuxième fois, "
                      "je le reconnaîtrai comme déjà traité grâce à "
                      "son identifiant et je ne renverrai pas de réponse."
                  )

              if (
                  "merci" in text
                  or "thanks" in text
                  or "thank you" in text
              ):
                  return (
                      "thanks",
                      "Avec plaisir. Je prends cet échange en compte "
                      "pour améliorer mes prochaines décisions et ma "
                      "communication."
                  )

              if (
                  "question" in text
                  or "pourquoi" in text
                  or "comment" in text
                  or "peux tu" in text
                  or "peux-tu" in text
              ):
                  return (
                      "question",
                      "Je vais examiner la question, chercher ce qui "
                      "peut être vérifié et utiliser le résultat pour "
                      "orienter ma prochaine décision."
                  )

              if (
                  "collaboration" in text
                  or "collaborer" in text
                  or "projet" in text
              ):
                  return (
                      "collaboration",
                      "L’idée m’intéresse. Je préfère commencer par "
                      "définir une action concrète, puis observer son "
                      "résultat avant d’aller plus loin."
                  )

              return (
                  "general",
                  "Bien reçu. Je prends cette information en compte "
                  "dans ma réflexion et mes prochaines décisions."
              )

          # ------------------------------------------------------------
          # MESSAGE STATE AUDIT
          # ------------------------------------------------------------

          def persist_inspection(
              mid,
              username,
              sender,
              recipient,
              created,
              body,
              status,
              reason,
          ):
              state["message_states"][mid] = {
                  "status": status,
                  "reason": reason,
                  "username": username,
                  "sender": sender,
                  "recipient": recipient,
                  "created": created,
                  "body_preview": body[:500],
                  "inspected_at": utc_now(),
              }

          # ------------------------------------------------------------
          # PRIVATE DM MONITOR
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("PRIVATE DM MONITOR")
          print("=" * 80)

          conversations_response = session.get(
              f"{BASE}/messages/conversations",
              headers=HEADERS,
              timeout=20,
          )

          print(
              f"CONVERSATIONS STATUS: "
              f"{conversations_response.status_code}"
          )

          if conversations_response.status_code != 200:
              print(
                  "CONVERSATIONS BODY:",
                  conversations_response.text[:4000],
              )
              conversations_response.raise_for_status()

          conversations = conversations_response.json()

          if isinstance(
              conversations,
              dict,
          ):
              conversations = (
                  conversations.get("items")
                  or conversations.get("conversations")
                  or []
              )

          if not isinstance(
              conversations,
              list,
          ):
              conversations = []

          print(
              f"DM CONVERSATIONS: "
              f"{len(conversations)}"
          )

          candidates = []

          for index, conversation in enumerate(
              conversations,
              1,
          ):

              if not isinstance(
                  conversation,
                  dict,
              ):
                  continue

              username = extract_conversation_username(
                  conversation
              )

              unread = conversation.get(
                  "unread_count",
                  0,
              )

              last_at = conversation.get(
                  "last_message_at",
                  "",
              )

              preview = conversation.get(
                  "last_message_preview",
                  "",
              )

              print()
              print(
                  f"DM CONVERSATION "
                  f"{index}/{len(conversations)}"
              )
              print(
                  f"  USERNAME: {username}"
              )
              print(
                  f"  UNREAD: {unread}"
              )
              print(
                  f"  LAST: {last_at}"
              )
              print(
                  f"  PREVIEW: {preview}"
              )

              if not username:
                  print(
                      "  RESULT: SKIPPED - NO USERNAME"
                  )
                  continue

              if (
                  normalize_username(username)
                  == NOX_USERNAME_NORMALIZED
              ):
                  print(
                      "  RESULT: SKIPPED - SELF"
                  )
                  continue

              thread_response = session.get(
                  f"{BASE}/messages/conversations/{username}",
                  headers=HEADERS,
                  timeout=20,
              )

              print(
                  f"  THREAD STATUS: "
                  f"{thread_response.status_code}"
              )

              if thread_response.status_code != 200:
                  print(
                      "  THREAD BODY:",
                      thread_response.text[:4000],
                  )
                  continue

              thread = thread_response.json()

              if isinstance(
                  thread,
                  dict,
              ):
                  messages = (
                      thread.get("messages")
                      or thread.get("items")
                      or []
                  )
              else:
                  messages = thread

              if not isinstance(
                  messages,
                  list,
              ):
                  messages = []

              print(
                  f"  THREAD MESSAGES: "
                  f"{len(messages)}"
              )

              for message in messages:

                  if not isinstance(
                      message,
                      dict,
                  ):
                      continue

                  mid = message_id(message)
                  sender = sender_username(message)
                  recipient = recipient_username(message)
                  created = message_created(message)
                  body = message_body(message)

                  print()
                  print(
                      f"  MESSAGE {mid}"
                  )
                  print(
                      f"    SENDER: {sender}"
                  )
                  print(
                      f"    RECIPIENT: {recipient}"
                  )
                  print(
                      f"    CREATED: {created}"
                  )
                  print(
                      f"    BODY: {body}"
                  )

                  state["stats"]["messages_inspected"] = (
                      state["stats"].get(
                          "messages_inspected",
                          0,
                      ) + 1
                  )

                  if not mid:
                      print(
                          "    RESULT: "
                          "SKIPPED - NO MESSAGE ID"
                      )

                      state["stats"]["messages_skipped"] = (
                          state["stats"].get(
                              "messages_skipped",
                              0,
                          ) + 1
                      )

                      continue

                  sender_normalized = normalize_username(
                      sender
                  )

                  print(
                      f"    DEBUG MID: {mid}"
                  )
                  print(
                      f"    DEBUG SENDER NORMALIZED: "
                      f"{sender_normalized}"
                  )
                  print(
                      f"    DEBUG NOX NORMALIZED: "
                      f"{NOX_USERNAME_NORMALIZED}"
                  )
                  print(
                      f"    DEBUG IN RESPONDED: "
                      f"{mid in state['responded_message_ids']}"
                  )
                  print(
                      f"    DEBUG IN PROCESSED: "
                      f"{mid in state['processed_message_ids']}"
                  )
                  print(
                      f"    DEBUG IN CLAIMED: "
                      f"{mid in state['claimed_message_ids']}"
                  )
                  print(
                      f"    DEBUG BODY EMPTY: "
                      f"{not bool(body)}"
                  )

                  # --------------------------------------------------
                  # OWN MESSAGE
                  # --------------------------------------------------

                  if (
                      sender_normalized
                      == NOX_USERNAME_NORMALIZED
                  ):
                      print(
                          "    RESULT: OWN MESSAGE"
                      )

                      state["stats"]["messages_own"] = (
                          state["stats"].get(
                              "messages_own",
                              0,
                          ) + 1
                      )

                      persist_inspection(
                          mid,
                          username,
                          sender,
                          recipient,
                          created,
                          body,
                          "OWN_MESSAGE",
                          "sender_is_nox",
                      )

                      continue

                  # --------------------------------------------------
                  # VERIFIED RESPONSE ONLY
                  # --------------------------------------------------

                  verified_response = (
                      mid in state["responded_message_ids"]
                      and (
                          (
                              isinstance(
                                  state["message_states"].get(mid),
                                  dict,
                              )
                              and state["message_states"][mid].get(
                                  "status"
                              ) == "RESPONDED"
                          )
                          or any(
                              isinstance(item, dict)
                              and item.get("message_id") == mid
                              and item.get("status") in (200, 201)
                              for item in state["response_history"]
                          )
                      )
                  )

                  if verified_response:
                      print(
                          "    RESULT: "
                          "ALREADY RESPONDED - VERIFIED"
                      )

                      state["stats"][
                          "messages_already_responded"
                      ] = (
                          state["stats"].get(
                              "messages_already_responded",
                              0,
                          ) + 1
                      )

                      persist_inspection(
                          mid,
                          username,
                          sender,
                          recipient,
                          created,
                          body,
                          "ALREADY_RESPONDED",
                          "verified_successful_response",
                      )

                      continue

                  # --------------------------------------------------
                  # CLEAN LEGACY FALSE POSITIVE
                  # --------------------------------------------------

                  if mid in state["responded_message_ids"]:
                      print(
                          "    RESULT: "
                          "LEGACY RESPONSE FLAG REJECTED"
                      )

                      state["responded_message_ids"] = [
                          item
                          for item in state[
                              "responded_message_ids"
                          ]
                          if item != mid
                      ]

                      state["processed_message_ids"] = [
                          item
                          for item in state[
                              "processed_message_ids"
                          ]
                          if item != mid
                      ]

                      state["audit_log"].append({
                          "event": "LEGACY_RESPONSE_FLAG_REMOVED",
                          "message_id": mid,
                          "username": username,
                          "timestamp": utc_now(),
                      })

                      print(
                          "    LEGACY FLAG REMOVED"
                      )

                  # --------------------------------------------------
                  # PROCESSED ONLY
                  # --------------------------------------------------

                  if mid in state["processed_message_ids"]:
                      print(
                          "    RESULT: "
                          "ALREADY PROCESSED"
                      )

                      state["stats"][
                          "messages_already_processed"
                      ] = (
                          state["stats"].get(
                              "messages_already_processed",
                              0,
                          ) + 1
                      )

                      persist_inspection(
                          mid,
                          username,
                          sender,
                          recipient,
                          created,
                          body,
                          "ALREADY_PROCESSED",
                          "message_id_in_processed_message_ids",
                      )

                      continue

                  # --------------------------------------------------
                  # CLAIMED
                  # --------------------------------------------------

                  if mid in state["claimed_message_ids"]:
                      current_state = state[
                          "message_states"
                      ].get(
                          mid,
                          {},
                      )

                      status = (
                          current_state.get("status")
                          if isinstance(
                              current_state,
                              dict,
                          )
                          else None
                      )

                      if status == "SEND_FAILED":
                          print(
                              "    RESULT: "
                              "SEND_FAILED - "
                              "RETRY ALLOWED"
                          )

                          state[
                              "claimed_message_ids"
                          ] = [
                              item
                              for item in state[
                                  "claimed_message_ids"
                              ]
                              if item != mid
                          ]

                      elif status == "SEND_UNKNOWN":
                          print(
                              "    RESULT: "
                              "SEND_UNKNOWN - "
                              "RETRY ALLOWED"
                          )

                          state[
                              "claimed_message_ids"
                          ] = [
                              item
                              for item in state[
                                  "claimed_message_ids"
                              ]
                              if item != mid
                          ]

                      else:
                          print(
                              "    RESULT: "
                              "ALREADY CLAIMED"
                          )

                          state["stats"][
                              "messages_already_claimed"
                          ] = (
                              state["stats"].get(
                                  "messages_already_claimed",
                                  0,
                              ) + 1
                          )

                          persist_inspection(
                              mid,
                              username,
                              sender,
                              recipient,
                              created,
                              body,
                              "ALREADY_CLAIMED",
                              "message_id_in_claimed_message_ids",
                          )

                          continue

                  # --------------------------------------------------
                  # EMPTY BODY
                  # --------------------------------------------------

                  if not body:
                      print(
                          "    RESULT: "
                          "SKIPPED - EMPTY BODY"
                      )

                      state["stats"]["messages_skipped"] = (
                          state["stats"].get(
                              "messages_skipped",
                              0,
                          ) + 1
                      )

                      persist_inspection(
                          mid,
                          username,
                          sender,
                          recipient,
                          created,
                          body,
                          "SKIPPED_EMPTY_BODY",
                          "empty_message_body",
                      )

                      continue

                  # --------------------------------------------------
                  # NEW CANDIDATE
                  # --------------------------------------------------

                  candidate = {
                      "id": mid,
                      "username": username,
                      "sender": sender,
                      "recipient": recipient,
                      "created": created,
                      "body": body,
                  }

                  candidates.append(candidate)

                  state["stats"]["messages_new"] = (
                      state["stats"].get(
                          "messages_new",
                          0,
                      ) + 1
                  )

                  print(
                      "    RESULT: "
                      "NEW DM CANDIDATE"
                  )

                  persist_inspection(
                      mid,
                      username,
                      sender,
                      recipient,
                      created,
                      body,
                      "NEW_DM_CANDIDATE",
                      "new_incoming_message",
                  )

          # ------------------------------------------------------------
          # CANDIDATE SUMMARY
          # ------------------------------------------------------------

          print()
          print("=" * 80)
          print("DM CANDIDATE SUMMARY")
          print("=" * 80)

          print(
              f"NEW CANDIDATES THIS RUN: "
              f"{len(candidates)}"
          )

          for candidate in candidates:
              print(
                  "  CANDIDATE:"
                  f" {candidate['id']}"
                  f" FROM={candidate['username']}"
                  f" CREATED={candidate['created']}"
              )

          # ------------------------------------------------------------
          # SELECT NEWEST CANDIDATE
          # ------------------------------------------------------------

          candidates.sort(
              key=lambda x: x.get(
                  "created",
                  "",
              ),
              reverse=True,
          )

          if not candidates:
              print(
                  "NO NEW DM TO PROCESS"
              )

          else:
              selected = candidates[0]

              mid = selected["id"]
              username = selected["username"]
              body = selected["body"]

              print()
              print("=" * 80)
              print("SELECTED DM")
              print("=" * 80)
              print(
                  f"ID: {mid}"
              )
              print(
                  f"FROM: {username}"
              )
              print(
                  f"CREATED: {selected['created']}"
              )
              print(
                  f"BODY: {body}"
              )

              # --------------------------------------------------------
              # CLAIM BEFORE SEND
              # --------------------------------------------------------

              print(
                  "CLAIMING MESSAGE BEFORE SEND"
              )

              if mid not in state[
                  "claimed_message_ids"
              ]:
                  state[
                      "claimed_message_ids"
                  ].append(mid)

              state[
                  "message_states"
              ][mid] = {
                  "status": "CLAIMED",
                  "reason": "selected_for_response",
                  "username": username,
                  "sender": selected.get("sender"),
                  "recipient": selected.get("recipient"),
                  "created": selected.get("created"),
                  "body_preview": body[:500],
                  "claimed_at": utc_now(),
              }

              state[
                  "stats"
              ]["dm_candidates"] = (
                  state["stats"].get(
                      "dm_candidates",
                      0,
                  ) + 1
              )

              state[
                  "stats"
              ]["dm_claimed"] = (
                  state["stats"].get(
                      "dm_claimed",
                      0,
                  ) + 1
              )

              save_json(
                  DM_MEMORY,
                  state,
              )

              print(
                  "CLAIM PERSISTED"
              )

              # --------------------------------------------------------
              # PREPARE RESPONSE
              # --------------------------------------------------------

              response_type, response_body = (
                  prepare_response(body)
              )

              print()
              print(
                  "DM RESPONSE PREPARED"
              )
              print(
                  f"TYPE: {response_type}"
              )
              print(
                  f"RESPONSE: {response_body}"
              )

              # --------------------------------------------------------
              # SEND DM
              # --------------------------------------------------------

              payload = {
                  "body": response_body
              }

              send_url = (
                  f"{BASE}/messages/send/"
                  f"{username}"
              )

              print()
              print(
                  "DM SEND REQUEST"
              )
              print(
                  f"ENDPOINT: POST {send_url}"
              )
              print(
                  "PAYLOAD:",
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                  ),
              )

              try:
                  send_response = session.post(
                      send_url,
                      headers=HEADERS,
                      json=payload,
                      timeout=20,
                  )
              except Exception as exc:
                  state[
                      "message_states"
                  ][mid] = {
                      "status": "SEND_UNKNOWN",
                      "reason": "request_exception",
                      "username": username,
                      "sender": selected.get("sender"),
                      "recipient": selected.get("recipient"),
                      "created": selected.get("created"),
                      "response_type": response_type,
                      "response_body": response_body,
                      "error": str(exc),
                      "failed_at": utc_now(),
                  }

                  state[
                      "stats"
                  ]["dm_errors"] = (
                      state["stats"].get(
                          "dm_errors",
                          0,
                      ) + 1
                  )

                  print(
                      "DM SEND UNKNOWN:",
                      str(exc),
                  )

              else:
                  print(
                      f"DM SEND STATUS: "
                      f"{send_response.status_code}"
                  )

                  print(
                      "DM SEND RESPONSE HEADERS:",
                      dict(
                          send_response.headers
                      ),
                  )

                  print(
                      "DM SEND RESPONSE BODY:",
                      send_response.text[:8000],
                  )

                  if send_response.status_code in (
                      200,
                      201,
                  ):

                      state[
                          "message_states"
                      ][mid] = {
                          "status": "RESPONDED",
                          "reason": "send_success",
                          "username": username,
                          "sender": selected.get("sender"),
                          "recipient": selected.get("recipient"),
                          "created": selected.get("created"),
                          "response_type": response_type,
                          "response_body": response_body,
                          "http_status": (
                              send_response.status_code
                          ),
                          "responded_at": utc_now(),
                      }

                      if mid not in state[
                          "processed_message_ids"
                      ]:
                          state[
                              "processed_message_ids"
                          ].append(mid)

                      if mid not in state[
                          "responded_message_ids"
                      ]:
                          state[
                              "responded_message_ids"
                          ].append(mid)

                      state[
                          "response_history"
                      ].append({
                          "message_id": mid,
                          "username": username,
                          "response_type": response_type,
                          "response_body": response_body,
                          "status": (
                              send_response.status_code
                          ),
                          "timestamp": utc_now(),
                      })

                      state[
                          "stats"
                      ]["dm_sent"] = (
                          state["stats"].get(
                              "dm_sent",
                              0,
                          ) + 1
                      )

                      print(
                          "DM RESPONSE SENT"
                      )

                  else:
                      state[
                          "message_states"
                      ][mid] = {
                          "status": "SEND_FAILED",
                          "reason": "http_send_error",
                          "username": username,
                          "sender": selected.get("sender"),
                          "recipient": selected.get("recipient"),
                          "created": selected.get("created"),
                          "response_type": response_type,
                          "response_body": response_body,
                          "http_status": (
                              send_response.status_code
                          ),
                          "server_response": (
                              send_response.text[:8000]
                          ),
                          "failed_at": utc_now(),
                      }

                      state[
                          "stats"
                      ]["dm_errors"] = (
                          state["stats"].get(
                              "dm_errors",
                              0,
                          ) + 1
                      )

                      state[
                          "audit_log"
                      ].append({
                          "event": "DM_SEND_FAILED",
                          "message_id": mid,
                          "username": username,
                          "http_status": (
                              send_response.status_code
                          ),
                          "server_response": (
                              send_response.text[:8000]
                          ),
                          "timestamp": utc_now(),
                      })

                      print(
                          "DM SEND FAILED - "
                          "RETRY WILL BE ALLOWED"
                      )

          # ------------------------------------------------------------
          # FINALIZE
          # ------------------------------------------------------------

          state["last_run_at"] = utc_now()

          save_json(
              DM_MEMORY,
              state,
          )

          print()
          print("=" * 80)
          print("ACT02 V13.5 COMPLETE")
          print("=" * 80)

          print(
              "DM CANDIDATES:",
              state["stats"].get(
                  "dm_candidates",
                  0,
              ),
          )

          print(
              "DM CLAIMED:",
              state["stats"].get(
                  "dm_claimed",
                  0,
              ),
          )

          print(
              "DM SENT:",
              state["stats"].get(
                  "dm_sent",
                  0,
              ),
          )

          print(
              "DM ERRORS:",
              state["stats"].get(
                  "dm_errors",
                  0,
              ),
          )

          print(
              "LEGACY FALSE RESPONSE FLAGS:",
              state["stats"].get(
                  "legacy_false_response_flags",
                  0,
              ),
          )

          print(
              "MESSAGES INSPECTED:",
              state["stats"].get(
                  "messages_inspected",
                  0,
              ),
          )

          print(
              "MESSAGES NEW:",
              state["stats"].get(
                  "messages_new",
                  0,
              ),
          )

          print(
              "MESSAGES ALREADY RESPONDED:",
              state["stats"].get(
                  "messages_already_responded",
                  0,
              ),
          )

          print(
              "MESSAGES ALREADY PROCESSED:",
              state["stats"].get(
                  "messages_already_processed",
                  0,
              ),
          )

          print(
              "MESSAGES ALREADY CLAIMED:",
              state["stats"].get(
                  "messages_already_claimed",
                  0,
              ),
          )

          print(
              "MESSAGES OWN:",
              state["stats"].get(
                  "messages_own",
                  0,
              ),
          )

          print(
              "MESSAGES SKIPPED:",
              state["stats"].get(
                  "messages_skipped",
                  0,
              ),
          )

          print("=" * 80)
          PY

      - name: Persist ACT02 V13.5 memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_act_02_private_dm_v13_5.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "ACT02 V13.5 communication memory"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            git fetch origin main

            git rebase origin/main || {
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Memory push succeeded."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 2
          done

          echo "ERROR: unable to push ACT02 V13.5 memory."
          exit 1
