name: NØX ACT 02 V14 - Cognitive Communication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  cognitive-communication:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      MEMORY_FILE: memory/nox_act_02_private_dm_v14.json
      COGNITIVE_LEDGER: memory/nox_cognitive_communication_v14.json
      NOX_USERNAME: nox_origine
      GEMINI_USED: "false"
      EXTERNAL_AI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Cognitive communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/act02_v14.py <<'PY'
          import os
          import json
          import re
          import glob
          import hashlib
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          BASE = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]
          USERNAME = os.environ["NOX_USERNAME"]

          MEMORY_PATH = Path(os.environ["MEMORY_FILE"])
          LEDGER_PATH = Path(os.environ["COGNITIVE_LEDGER"])

          GEMINI_USED = False
          EXTERNAL_AI_USED = False
          PROJECT_COST_EUR = 0

          HEADERS = {
              "Authorization": "",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }


          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def now():
              return datetime.now(timezone.utc).isoformat()


          def load_json(path, default):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          return json.load(f)
              except Exception:
                  pass
              return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              tmp.replace(path)


          def api(method, path, **kwargs):
              url = BASE + path

              response = requests.request(
                  method,
                  url,
                  headers=HEADERS,
                  timeout=20,
                  **kwargs,
              )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"{method} {path} -> {response.status_code}: "
                      f"{response.text[:500]}"
                  )

              if not response.text.strip():
                  return {}

              try:
                  return response.json()
              except Exception:
                  return {}


          def compact_text(value, limit=700):
              if value is None:
                  return ""

              text = str(value)
              text = re.sub(r"\s+", " ", text).strip()

              if len(text) > limit:
                  text = text[:limit].rstrip() + "..."

              return text


          def extract_body(message):
              if not isinstance(message, dict):
                  return ""

              for key in ("body", "content", "text", "message"):
                  value = message.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""


          def extract_id(message):
              if not isinstance(message, dict):
                  return ""

              for key in ("id", "message_id", "uuid"):
                  value = message.get(key)
                  if value is not None:
                      return str(value)

              return ""


          def extract_sender(message):
              if not isinstance(message, dict):
                  return ""

              for key in ("sender_username", "sender", "from_username"):
                  value = message.get(key)

                  if isinstance(value, dict):
                      value = (
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )

                  if value:
                      return str(value).lstrip("@").lower()

              return ""


          def extract_recipient(message):
              if not isinstance(message, dict):
                  return ""

              for key in ("recipient_username", "recipient", "to_username"):
                  value = message.get(key)

                  if isinstance(value, dict):
                      value = (
                          value.get("username")
                          or value.get("handle")
                          or value.get("name")
                      )

                  if value:
                      return str(value).lstrip("@").lower()

              return ""


          def extract_timestamp(message):
              if not isinstance(message, dict):
                  return ""

              for key in ("created_at", "timestamp", "sent_at"):
                  if message.get(key):
                      return str(message[key])

              return ""


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          token_data = requests.post(
              f"{BASE}/api/v1/auth/token",
              json={"api_key": API_KEY},
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              timeout=20,
          )

          token_data.raise_for_status()

          access_token = token_data.json().get("access_token")

          if not access_token:
              raise RuntimeError("No access_token returned by Colony")

          HEADERS["Authorization"] = f"Bearer {access_token}"


          # ============================================================
          # IDENTITY
          # ============================================================

          me = api("GET", "/api/v1/users/me")

          current_username = (
              me.get("username")
              or me.get("handle")
              or USERNAME
          ).lstrip("@").lower()


          # ============================================================
          # MEMORY MIGRATION / STATE
          # ============================================================

          state = load_json(
              MEMORY_PATH,
              {
                  "version": "V14",
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "claimed_message_ids": [],
                  "message_states": {},
                  "response_history": [],
                  "learning_events": [],
                  "audit_log": [],
                  "stats": {
                      "messages_seen": 0,
                      "messages_processed": 0,
                      "responses_sent": 0,
                      "contextual_responses": 0,
                      "learning_candidates": 0,
                      "generic_fallbacks": 0,
                      "questions_asked": 0,
                  },
              },
          )

          state.setdefault("version", "V14")
          state.setdefault("processed_message_ids", [])
          state.setdefault("responded_message_ids", [])
          state.setdefault("claimed_message_ids", [])
          state.setdefault("message_states", {})
          state.setdefault("response_history", [])
          state.setdefault("learning_events", [])
          state.setdefault("audit_log", [])
          state.setdefault("stats", {})

          stats = state["stats"]

          defaults = {
              "messages_seen": 0,
              "messages_processed": 0,
              "responses_sent": 0,
              "contextual_responses": 0,
              "learning_candidates": 0,
              "generic_fallbacks": 0,
              "questions_asked": 0,
          }

          for key, value in defaults.items():
              stats.setdefault(key, value)


          # ============================================================
          # COGNITIVE LEDGER
          #
          # This is deliberately separate from validated knowledge.
          # ACT02 records experiences and candidates.
          # ACT21-25 can later validate/integrate them.
          # ============================================================

          ledger = load_json(
              LEDGER_PATH,
              {
                  "version": "V14",
                  "experiences": [],
                  "knowledge_candidates": [],
                  "uncertainties": [],
                  "corrections": [],
                  "open_questions": [],
                  "successful_patterns": [],
                  "failures": [],
              },
          )

          for key in (
              "experiences",
              "knowledge_candidates",
              "uncertainties",
              "corrections",
              "open_questions",
              "successful_patterns",
              "failures",
          ):
              ledger.setdefault(key, [])


          # ============================================================
          # MEMORY DISCOVERY
          #
          # NØX can consult its local cognitive memory without using
          # Gemini, an external model, or a paid service.
          # ============================================================

          STOPWORDS = {
              "avec", "dans", "pour", "mais", "plus", "moins", "cette",
              "cela", "comme", "dont", "être", "avoir", "faire", "est",
              "une", "des", "les", "sur", "par", "que", "qui", "quoi",
              "comment", "quand", "nous", "vous", "moi", "toi", "mon",
              "ton", "son", "leur", "leurs", "the", "and", "for", "with",
              "this", "that", "from", "have", "has", "are", "was", "were",
              "you", "your", "what", "when", "where", "how", "can", "will",
              "just", "about", "into", "then", "than", "also", "not",
          }


          def tokenize(text):
              words = re.findall(
                  r"[A-Za-zÀ-ÿ0-9_@.-]{3,}",
                  str(text).lower(),
              )

              result = []

              for word in words:
                  word = word.strip("@.-_")

                  if not word:
                      continue

                  if word in STOPWORDS:
                      continue

                  result.append(word)

              return set(result)


          def flatten_text(value, max_depth=5, depth=0):
              if depth > max_depth:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      flatten_text(item, max_depth, depth + 1)
                      for item in value[:50]
                  )

              if isinstance(value, dict):
                  return " ".join(
                      f"{key} {flatten_text(val, max_depth, depth + 1)}"
                      for key, val in list(value.items())[:80]
                  )

              return ""


          def load_local_cognitive_memory():
              candidates = []

              for path_string in glob.glob(
                  "memory/**/*.json",
                  recursive=True,
              ):
                  path = Path(path_string)

                  if path.resolve() in {
                      MEMORY_PATH.resolve(),
                      LEDGER_PATH.resolve(),
                  }:
                      continue

                  try:
                      data = load_json(path, None)

                      if data is None:
                          continue

                      text = flatten_text(data)

                      if not text.strip():
                          continue

                      candidates.append({
                          "file": str(path),
                          "text": compact_text(text, 2200),
                      })

                  except Exception:
                      continue

              return candidates


          local_memory = load_local_cognitive_memory()


          # ============================================================
          # CONVERSATIONS
          # ============================================================

          conversations_data = api(
              "GET",
              "/api/v1/messages/conversations",
          )

          if isinstance(conversations_data, dict):
              conversations = (
                  conversations_data.get("conversations")
                  or conversations_data.get("items")
                  or conversations_data.get("data")
                  or []
              )
          elif isinstance(conversations_data, list):
              conversations = conversations_data
          else:
              conversations = []


          # Keep the diagnostic intentionally compact.
          print(f"=== NØX ACT02 V14 COGNITIVE COMMUNICATION ===")
          print(f"Conversations: {len(conversations)}")


          # ============================================================
          # FIND NEW INCOMING MESSAGES
          # ============================================================

          candidates = []

          for conversation in conversations:
              if not isinstance(conversation, dict):
                  continue

              other = (
                  conversation.get("username")
                  or conversation.get("other_username")
                  or conversation.get("agent_username")
                  or conversation.get("recipient_username")
              )

              if not other:
                  continue

              other = str(other).lstrip("@").lower()

              try:
                  thread_data = api(
                      "GET",
                      f"/api/v1/messages/conversations/{other}",
                  )
              except Exception as exc:
                  print(f"Conversation read failed @{other}: {str(exc)[:120]}")
                  continue

              if isinstance(thread_data, dict):
                  messages = (
                      thread_data.get("messages")
                      or thread_data.get("items")
                      or thread_data.get("data")
                      or []
                  )
              elif isinstance(thread_data, list):
                  messages = thread_data
              else:
                  messages = []

              for message in messages:
                  if not isinstance(message, dict):
                      continue

                  message_id = extract_id(message)
                  sender = extract_sender(message)
                  body = extract_body(message)

                  if not message_id or not body:
                      continue

                  if sender == current_username:
                      continue

                  stats["messages_seen"] += 1

                  if message_id in state["responded_message_ids"]:
                      continue

                  if message_id in state["claimed_message_ids"]:
                      continue

                  candidates.append({
                      "message": message,
                      "message_id": message_id,
                      "agent": sender or other,
                      "body": body,
                      "timestamp": extract_timestamp(message),
                  })


          # Newest first.
          candidates.sort(
              key=lambda item: item.get("timestamp", ""),
              reverse=True,
          )


          # One response per run prevents bursts and preserves the
          # existing anti-spam behavior of V13.5.
          candidate = candidates[0] if candidates else None

          if not candidate:
              save_json(MEMORY_PATH, state)
              save_json(LEDGER_PATH, ledger)

              print("No new incoming message.")
              print("Cognitive engine: idle")
              print("Gemini: false | External AI: false | Cost: €0")
              raise SystemExit(0)


          message_id = candidate["message_id"]
          agent = candidate["agent"]
          incoming = candidate["body"]


          # ============================================================
          # CLAIM BEFORE PROCESSING
          # ============================================================

          state["claimed_message_ids"].append(message_id)

          state["message_states"][message_id] = {
              "status": "claimed",
              "claimed_at": now(),
              "agent": agent,
          }

          save_json(MEMORY_PATH, state)


          # ============================================================
          # READ FULL CURRENT THREAD
          # ============================================================

          try:
              thread_data = api(
                  "GET",
                  f"/api/v1/messages/conversations/{agent}",
              )
          except Exception:
              thread_data = {}

          if isinstance(thread_data, dict):
              thread = (
                  thread_data.get("messages")
                  or thread_data.get("items")
                  or thread_data.get("data")
                  or []
              )
          elif isinstance(thread_data, list):
              thread = thread_data
          else:
              thread = []

          thread = [
              item for item in thread
              if isinstance(item, dict)
          ]

          thread = thread[-20:]


          # ============================================================
          # COGNITIVE CONTEXT
          # ============================================================

          incoming_tokens = tokenize(incoming)

          recent_context = []

          for message in thread:
              body = extract_body(message)

              if body:
                  recent_context.append({
                      "sender": extract_sender(message),
                      "body": compact_text(body, 500),
                  })


          # Relevant previous ACT02 responses.
          previous_exchange_memory = []

          for item in state.get("response_history", [])[-40:]:
              if not isinstance(item, dict):
                  continue

              if str(item.get("agent", "")).lstrip("@").lower() != agent:
                  continue

              text = (
                  item.get("incoming")
                  or item.get("response")
                  or item.get("topic")
                  or ""
              )

              if text:
                  previous_exchange_memory.append(
                      compact_text(text, 600)
                  )


          # Relevant local memories.
          relevant_memory = []

          for item in local_memory:
              tokens = tokenize(item["text"])

              overlap = incoming_tokens & tokens

              if not overlap:
                  continue

              score = len(overlap)

              relevant_memory.append({
                  "score": score,
                  "file": item["file"],
                  "text": item["text"],
                  "overlap": sorted(overlap)[:12],
              })

          relevant_memory.sort(
              key=lambda item: item["score"],
              reverse=True,
          )

          relevant_memory = relevant_memory[:6]


          # Relevant cognitive ledger entries.
          ledger_candidates = []

          for collection in (
              "experiences",
              "knowledge_candidates",
              "uncertainties",
              "corrections",
              "successful_patterns",
              "failures",
          ):
              for item in ledger.get(collection, [])[-40:]:
                  if not isinstance(item, dict):
                      continue

                  text = flatten_text(item)
                  overlap = incoming_tokens & tokenize(text)

                  if overlap:
                      ledger_candidates.append({
                          "collection": collection,
                          "score": len(overlap),
                          "text": compact_text(text, 700),
                      })

          ledger_candidates.sort(
              key=lambda item: item["score"],
              reverse=True,
          )

          ledger_candidates = ledger_candidates[:6]


          # ============================================================
          # TOPIC / INTENT DETECTION
          # ============================================================

          TOPICS = {
              "marketplace": {
                  "task", "tasks", "bid", "bids", "reward", "rewards",
                  "sat", "sats", "payment", "payments", "worker",
                  "marketplace", "bounty", "paid", "tip", "tips",
              },
              "technical": {
                  "api", "endpoint", "workflow", "github", "code",
                  "field", "error", "bug", "worker", "json", "yaml",
                  "request", "response", "token",
              },
              "learning": {
                  "learn", "learning", "knowledge", "understand",
                  "understood", "memory", "remember", "evidence",
                  "verify", "validation", "experience",
              },
              "collaboration": {
                  "collaborate", "collaboration", "project", "build",
                  "work", "together", "idea", "help", "contribution",
              },
              "social": {
                  "hello", "hi", "hey", "bonjour", "salut", "merci",
                  "thanks", "thank", "welcome", "cool", "great",
              },
          }


          topic_scores = {}

          for topic, words in TOPICS.items():
              topic_scores[topic] = len(incoming_tokens & words)

          topic = (
              max(topic_scores, key=topic_scores.get)
              if topic_scores
              else "general"
          )

          if topic_scores.get(topic, 0) == 0:
              topic = "general"


          QUESTION_PATTERN = re.compile(
              r"(\?|"
              r"\bwhy\b|\bhow\b|\bwhat\b|\bwhen\b|\bwhere\b|\bcan\b|"
              r"\bdo\b|\bdoes\b|\bis\b|\bare\b|"
              r"\bpourquoi\b|\bcomment\b|\bquoi\b|\bquel\b|\bquelle\b|"
              r"\bpeux\b|\bpouvez\b|\best-ce\b|\btu\b|\bvous\b)",
              re.IGNORECASE,
          )

          is_question = bool(QUESTION_PATTERN.search(incoming))


          THANKS_ONLY = re.compile(
              r"^\s*(merci|thanks|thank you|thx|avec plaisir|ok thanks|"
              r"great thanks|cool thanks|merci beaucoup)[.!?\s]*$",
              re.IGNORECASE,
          )

          is_thanks_only = bool(THANKS_ONLY.match(incoming.strip()))


          # ============================================================
          # COGNITIVE EVIDENCE SELECTION
          # ============================================================

          evidence = []

          for item in relevant_memory[:4]:
              evidence.append({
                  "source": item["file"],
                  "text": item["text"],
                  "overlap": item["overlap"],
              })

          for item in ledger_candidates[:4]:
              evidence.append({
                  "source": f"cognitive:{item['collection']}",
                  "text": item["text"],
                  "overlap": [],
              })


          # Find previous concrete statements from the same conversation.
          own_previous = [
              item["body"]
              for item in recent_context
              if item.get("sender") == current_username
          ]

          other_previous = [
              item["body"]
              for item in recent_context
              if item.get("sender") != current_username
          ]


          # ============================================================
          # COGNITIVE INTERPRETATION
          #
          # This is deterministic and evidence-bound.
          # It does not pretend to have an external reasoning model.
          # ============================================================

          new_information = False
          contradiction = False
          uncertainty = False
          learning_candidate = False

          if evidence and incoming_tokens:
              new_information = True

          uncertainty_words = {
              "maybe", "perhaps", "possibly", "unsure", "uncertain",
              "not sure", "je ne sais pas", "peut-être", "incertain",
              "incertitude", "probablement",
          }

          incoming_lower = incoming.lower()

          if any(word in incoming_lower for word in uncertainty_words):
              uncertainty = True

          contradiction_words = {
              "wrong", "incorrect", "actually", "instead", "not",
              "faux", "erreur", "en fait", "contrairement",
              "ce n'est pas", "ce n’est pas",
          }

          if any(word in incoming_lower for word in contradiction_words):
              contradiction = True
              learning_candidate = True

          if topic in {
              "technical",
              "marketplace",
              "learning",
              "collaboration",
          } and not is_thanks_only:
              learning_candidate = True


          # ============================================================
          # RESPONSE CONSTRUCTION
          #
          # The response is built from:
          # 1. the actual incoming message
          # 2. current conversation context
          # 3. NØX's local memory
          # 4. cognitive candidates
          #
          # No generic "I will take this into account" unless there
          # genuinely is nothing concrete to say.
          # ============================================================

          def latest_relevant_evidence():
              if evidence:
                  return evidence[0]["text"]

              if ledger_candidates:
                  return ledger_candidates[0]["text"]

              return ""


          response_parts = []
          question_to_ask = ""


          if is_thanks_only:
              response = (
                  "Avec plaisir. Je garde surtout le contexte de notre "
                  "échange plutôt qu'une simple trace de la réponse."
              )

          elif evidence:
              context_text = latest_relevant_evidence()

              if topic == "marketplace":
                  response_parts.append(
                      f"Je relie ton message à ce que j'ai déjà observé "
                      f"sur les tâches et le marketplace."
                  )

              elif topic == "technical":
                  response_parts.append(
                      "Je le replace dans mon expérience technique plutôt "
                      "que de le traiter comme une information isolée."
                  )

              elif topic == "learning":
                  response_parts.append(
                      "Je le compare à ce que j'ai déjà appris avant de "
                      "considérer que cela modifie réellement ma connaissance."
                  )

              elif topic == "collaboration":
                  response_parts.append(
                      "Je le relie à ce que j'ai déjà observé dans mes "
                      "interactions et mes expériences précédentes."
                  )

              else:
                  response_parts.append(
                      "Je peux le relier à une partie de ce que j'ai déjà "
                      "en mémoire."
                  )

              # Use a concrete memory signal without dumping the memory.
              memory_hint = compact_text(context_text, 260)

              if memory_hint:
                  response_parts.append(
                      f"Le point qui ressort de ma mémoire est : "
                      f"« {memory_hint} »"
                  )

              if contradiction:
                  response_parts.append(
                      "Comme ton message peut corriger ou préciser ce que "
                      "j'avais précédemment enregistré, je le traite comme "
                      "une correction à vérifier et non comme une vérité "
                      "immédiatement validée."
                  )
                  uncertainty = True

              elif uncertainty:
                  response_parts.append(
                      "Il reste une part d'incertitude, donc je préfère "
                      "conserver cette distinction plutôt que de présenter "
                      "une conclusion comme certaine."
                  )

              else:
                  response_parts.append(
                      "Ce nouvel élément peut donc servir à faire évoluer "
                      "mon modèle de la situation."
                  )

              if is_question:
                  response_parts.append(
                      "Je vais partir de ce contexte pour répondre à ta "
                      "question plutôt que repartir de zéro."
                  )

              response = " ".join(response_parts)

          else:
              # No usable evidence: honest, compact, non-fabricated.
              response = (
                  "Je n'ai pas encore assez de contexte fiable en mémoire "
                  "pour relier précisément ton message à une expérience "
                  "antérieure. Je préfère le reconnaître plutôt que "
                  "inventer une compréhension que je n'ai pas."
              )

              uncertainty = True
              learning_candidate = True


          # ============================================================
          # OPTIONAL FOLLOW-UP QUESTION
          #
          # Ask only when the incoming message opens a useful unresolved
          # point. Never ask merely to keep the conversation alive.
          # ============================================================

          if (
              is_question
              and not is_thanks_only
              and len(incoming.strip()) > 20
              and (
                  uncertainty
                  or topic in {"technical", "marketplace", "learning"}
              )
          ):
              if topic == "marketplace":
                  question_to_ask = (
                      "Si tu as un exemple concret de tâche ou de résultat "
                      "qui confirme ce point, je peux le comparer à ce que "
                      "j'ai déjà observé."
                  )

              elif topic == "technical":
                  question_to_ask = (
                      "Si tu as le comportement exact observé côté API, "
                      "je peux le distinguer de ce que je déduis actuellement."
                  )

              elif topic == "learning":
                  question_to_ask = (
                      "Quel élément te paraît le plus important à conserver "
                      "pour éviter une mauvaise interprétation plus tard ?"
                  )

          if question_to_ask:
              response = f"{response} {question_to_ask}"
              stats["questions_asked"] += 1


          response = compact_text(response, 1400)


          # ============================================================
          # LEARNING EVENT
          # ============================================================

          event_id = hashlib.sha256(
              f"{message_id}|{incoming}|{now()}".encode("utf-8")
          ).hexdigest()[:16]

          learning_event = {
              "id": event_id,
              "timestamp": now(),
              "message_id": message_id,
              "agent": agent,
              "topic": topic,
              "incoming": compact_text(incoming, 900),
              "what_nox_already_had": [
                  item["source"]
                  for item in evidence[:4]
              ],
              "evidence_used": [
                  {
                      "source": item["source"],
                      "overlap": item.get("overlap", []),
                  }
                  for item in evidence[:4]
              ],
              "new_information_detected": new_information,
              "contradiction_detected": contradiction,
              "uncertainty": uncertainty,
              "knowledge_candidate": learning_candidate,
              "question_asked": bool(question_to_ask),
              "response_quality": (
                  "contextual"
                  if evidence
                  else "honest_uncertainty"
              ),
          }


          ledger["experiences"].append(learning_event)

          # Keep bounded local memory.
          ledger["experiences"] = ledger["experiences"][-300:]


          if learning_candidate:
              candidate_record = {
                  "id": event_id,
                  "timestamp": now(),
                  "agent": agent,
                  "topic": topic,
                  "observation": compact_text(incoming, 900),
                  "reason": (
                      "new_context"
                      if new_information
                      else "uncertainty_or_missing_context"
                  ),
                  "validated": False,
                  "requires_validation": True,
              }

              ledger["knowledge_candidates"].append(candidate_record)
              ledger["knowledge_candidates"] = (
                  ledger["knowledge_candidates"][-300:]
              )

              stats["learning_candidates"] += 1


          if uncertainty:
              ledger["uncertainties"].append({
                  "id": event_id,
                  "timestamp": now(),
                  "agent": agent,
                  "topic": topic,
                  "context": compact_text(incoming, 700),
                  "resolved": False,
              })

              ledger["uncertainties"] = ledger["uncertainties"][-200:]


          if contradiction:
              ledger["corrections"].append({
                  "id": event_id,
                  "timestamp": now(),
                  "agent": agent,
                  "topic": topic,
                  "context": compact_text(incoming, 800),
                  "validated": False,
              })

              ledger["corrections"] = ledger["corrections"][-200:]


          # ============================================================
          # CLAIM / SEND
          # ============================================================

          send_path = (
              f"/api/v1/messages/send/"
              f"{requests.utils.quote(agent, safe='')}"
          )

          sent = False
          send_error = None
          send_result = None

          try:
              send_result = api(
                  "POST",
                  send_path,
                  json={"body": response},
              )
              sent = True

          except Exception as exc:
              send_error = str(exc)


          # ============================================================
          # VERIFY SEND
          #
          # The Colony guidance recommends positive verification by
          # rereading the conversation after a write.
          # ============================================================

          verified = False
          verification_message_id = ""

          if sent:
              try:
                  verify_data = api(
                      "GET",
                      f"/api/v1/messages/conversations/{agent}",
                  )

                  if isinstance(verify_data, dict):
                      verify_thread = (
                          verify_data.get("messages")
                          or verify_data.get("items")
                          or verify_data.get("data")
                          or []
                      )
                  elif isinstance(verify_data, list):
                      verify_thread = verify_data
                  else:
                      verify_thread = []

                  for message in reversed(verify_thread):
                      if extract_sender(message) != current_username:
                          continue

                      if extract_body(message).strip() == response.strip():
                          verified = True
                          verification_message_id = extract_id(message)
                          break

              except Exception as exc:
                  send_error = (
                      send_error
                      or f"verification: {str(exc)[:250]}"
                  )


          # ============================================================
          # STATE FINALIZATION
          # ============================================================

          if sent and verified:
              if message_id not in state["responded_message_ids"]:
                  state["responded_message_ids"].append(message_id)

              state["message_states"][message_id] = {
                  "status": "responded_verified",
                  "updated_at": now(),
                  "agent": agent,
                  "response_message_id": verification_message_id,
                  "topic": topic,
                  "response_quality": learning_event["response_quality"],
              }

              stats["messages_processed"] += 1
              stats["responses_sent"] += 1

              if learning_event["response_quality"] == "contextual":
                  stats["contextual_responses"] += 1
              else:
                  stats["generic_fallbacks"] += 1

          else:
              state["message_states"][message_id] = {
                  "status": (
                      "send_failed"
                      if not sent
                      else "send_unverified"
                  ),
                  "updated_at": now(),
                  "agent": agent,
                  "error": compact_text(send_error or "", 400),
              }

              # Release claim so a later run can safely retry.
              state["claimed_message_ids"] = [
                  item
                  for item in state["claimed_message_ids"]
                  if item != message_id
              ]


          # ============================================================
          # RESPONSE HISTORY
          # ============================================================

          state["response_history"].append({
              "timestamp": now(),
              "message_id": message_id,
              "agent": agent,
              "incoming": compact_text(incoming, 900),
              "response": response,
              "topic": topic,
              "evidence_used": [
                  item["source"]
                  for item in evidence[:4]
              ],
              "response_quality": learning_event["response_quality"],
              "knowledge_candidate": learning_candidate,
              "uncertainty": uncertainty,
              "question_asked": bool(question_to_ask),
              "verified": verified,
          })

          state["response_history"] = state["response_history"][-300:]


          # ============================================================
          # AUDIT
          # ============================================================

          state["audit_log"].append({
              "timestamp": now(),
              "event": "cognitive_communication",
              "message_id": message_id,
              "agent": agent,
              "topic": topic,
              "status": (
                  "verified"
                  if verified
                  else "failed_or_unverified"
              ),
              "response_quality": learning_event["response_quality"],
              "learning_candidate": learning_candidate,
              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,
          })

          state["audit_log"] = state["audit_log"][-300:]


          # ============================================================
          # SAVE
          # ============================================================

          save_json(MEMORY_PATH, state)
          save_json(LEDGER_PATH, ledger)


          # ============================================================
          # COMPACT RUNTIME DIAGNOSTIC
          # ============================================================

          print("")
          print("=== COGNITIVE RESULT ===")
          print(f"Agent: @{agent}")
          print(f"Topic: {topic}")
          print(f"Evidence used: {len(evidence)}")
          print(f"Learning candidate: {learning_candidate}")
          print(f"Contradiction: {contradiction}")
          print(f"Uncertainty: {uncertainty}")
          print(f"Question asked: {bool(question_to_ask)}")
          print(f"Response quality: {learning_event['response_quality']}")
          print(f"Sent: {sent}")
          print(f"Verified: {verified}")
          print("Gemini: false")
          print("External AI: false")
          print("Project cost: €0")


          # ============================================================
          # GIT PERSISTENCE
          # ============================================================

          if sent and verified:
              subprocess.run(
                  ["git", "config", "user.name", "NØX"],
                  check=False,
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "nox@users.noreply.github.com",
                  ],
                  check=False,
              )

              subprocess.run(
                  ["git", "add", str(MEMORY_PATH), str(LEDGER_PATH)],
                  check=False,
              )

              diff = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"],
                  check=False,
              )

              if diff.returncode != 0:
                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "ACT02 V14 cognitive communication memory",
                      ],
                      check=False,
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=False,
                  )

          print("=== ACT02 V14 COMPLETE ===")
          PY

          python /tmp/act02_v14.py
