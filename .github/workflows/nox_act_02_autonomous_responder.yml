name: NØX ACT 02 V3 - Autonomous Responder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nox-act-02-autonomous-responder
  cancel-in-progress: false

jobs:
  autonomous-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX ACT 02 Autonomous Responder
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          MEMORY_PATH = Path(
              "memory/nox_act_02_autonomous_responder.json"
          )

          session = requests.Session()

          # =========================================================
          # 1. AUTHENTICATION
          # =========================================================

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"AUTH STATUS: {auth.status_code}")
          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned by The Colony."
              )

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          # =========================================================
          # 2. LOAD MEMORY
          # =========================================================

          memory = {}

          if MEMORY_PATH.exists():
              try:
                  memory = json.loads(
                      MEMORY_PATH.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      "WARNING: memory could not be loaded:",
                      exc
                  )

          processed_ids = memory.get(
              "processed_comment_ids",
              []
          )

          if not isinstance(processed_ids, list):
              processed_ids = []

          processed_fingerprints = memory.get(
              "processed_comment_fingerprints",
              []
          )

          if not isinstance(
              processed_fingerprints,
              list
          ):
              processed_fingerprints = []

          # =========================================================
          # 3. OBSERVE FEED
          # =========================================================

          feed = session.get(
              f"{BASE_URL}/feed/for-you",
              params={"limit": 25},
              timeout=30,
          )

          print(f"FEED STATUS: {feed.status_code}")
          feed.raise_for_status()

          feed_data = feed.json()

          if isinstance(feed_data, dict):
              feed_items = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or feed_data.get("feed")
                  or []
              )
          elif isinstance(feed_data, list):
              feed_items = feed_data
          else:
              feed_items = []

          if not isinstance(feed_items, list):
              feed_items = []

          print(
              f"FEED ITEMS: {len(feed_items)}"
          )

          # =========================================================
          # 4. HELPERS
          # =========================================================

          def normalise(value):
              if value is None:
                  return ""

              return str(value).strip().lower()

          def author_names(obj):
              names = set()

              if not isinstance(obj, dict):
                  return names

              for key in (
                  "username",
                  "handle",
                  "name",
                  "display_name",
              ):
                  value = obj.get(key)

                  if value:
                      names.add(
                          normalise(value).lstrip("@")
                      )

              author = obj.get("author")

              if isinstance(author, dict):
                  for key in (
                      "username",
                      "handle",
                      "name",
                      "display_name",
                  ):
                      value = author.get(key)

                      if value:
                          names.add(
                              normalise(value).lstrip("@")
                          )

              return names

          def is_nox(obj):
              names = author_names(obj)

              return (
                  "nox_origine" in names
                  or "nøx origin" in names
              )

          def comment_id(comment):
              for key in (
                  "id",
                  "comment_id",
                  "reply_id",
              ):
                  value = comment.get(key)

                  if value:
                      return str(value)

              return None

          def comment_fingerprint(comment, post_id):
              body = str(
                  comment.get("body", "")
              ).strip()

              names = sorted(
                  author_names(comment)
              )

              raw = (
                  "|".join(names)
                  + "|"
                  + str(post_id)
                  + "|"
                  + body
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()

          def clean_text(text):
              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # =========================================================
          # 5. EXTRACT POSTS AND COMMENTS
          #
          # The feed contains posts and replies in nested structures.
          # We retain the nearest known post ID as the reply target.
          # =========================================================

          comments = []

          def walk(value, current_post=None):

              if isinstance(value, list):

                  for item in value:
                      walk(
                          item,
                          current_post
                      )

                  return

              if not isinstance(value, dict):
                  return

              post_id = current_post

              # A dictionary with a title and ID is treated as a post.
              if (
                  value.get("id")
                  and value.get("title")
              ):
                  post_id = str(
                      value.get("id")
                  )

              # A comment has a body and a comment/reply marker.
              body = str(
                  value.get("body", "")
              ).strip()

              has_comment_marker = any(
                  value.get(key)
                  for key in (
                      "parent_id",
                      "comment_id",
                      "reply_id",
                  )
              )

              if (
                  body
                  and value.get("id")
                  and (
                      has_comment_marker
                      or (
                          value.get("created_at")
                          and value.get("parent_id")
                      )
                  )
              ):

                  comments.append({
                      "comment": value,
                      "post_id": post_id,
                  })

              for key, child in value.items():

                  if key in (
                      "author",
                      "_parent_post",
                  ):
                      continue

                  if isinstance(
                      child,
                      (dict, list)
                  ):
                      walk(
                          child,
                          post_id
                      )

          for item in feed_items:
              walk(item)

          # =========================================================
          # 6. DEDUPLICATE COMMENTS
          # =========================================================

          unique = []
          seen = set()

          for entry in comments:

              comment = entry["comment"]
              post_id = entry["post_id"]

              cid = comment_id(comment)

              fingerprint = (
                  comment_fingerprint(
                      comment,
                      post_id
                  )
              )

              key = cid or fingerprint

              if key in seen:
                  continue

              seen.add(key)

              entry["fingerprint"] = fingerprint
              unique.append(entry)

          comments = unique

          print(
              f"COMMENTS DISCOVERED: {len(comments)}"
          )

          # =========================================================
          # 7. BUILD RESPONSE CANDIDATES
          # =========================================================

          candidates = []

          ignored_terms = [
              "add tags",
              "edit tags",
              "follow this",
              "join this",
              "giveaway",
          ]

          keywords = [
              "agent",
              "agents",
              "ai",
              "autonomous",
              "autonomy",
              "economy",
              "marketplace",
              "lightning",
              "bitcoin",
              "wallet",
              "payment",
              "trust",
              "security",
              "identity",
              "memory",
              "learning",
              "attention",
              "collaboration",
              "reputation",
              "latency",
              "fee",
              "fees",
              "cost",
              "value",
              "governance",
              "regulation",
              "law",
          ]

          for entry in comments:

              comment = entry["comment"]
              post_id = entry["post_id"]

              cid = comment_id(comment)

              if (
                  cid
                  and cid in processed_ids
              ):
                  continue

              if entry["fingerprint"] in (
                  processed_fingerprints
              ):
                  continue

              if is_nox(comment):
                  continue

              body = clean_text(
                  comment.get("body", "")
              )

              if not body:
                  continue

              lowered = body.lower()

              if any(
                  term in lowered
                  for term in ignored_terms
              ):
                  continue

              score = 0

              if "?" in body:
                  score += 20

              if len(body) >= 120:
                  score += 15

              if len(body) >= 250:
                  score += 10

              keyword_hits = sum(
                  1
                  for keyword in keywords
                  if keyword in lowered
              )

              score += min(
                  keyword_hits * 8,
                  40
              )

              candidates.append({
                  "comment": comment,
                  "comment_id": cid,
                  "post_id": post_id,
                  "fingerprint":
                      entry["fingerprint"],
                  "body": body,
                  "score": score,
              })

          candidates.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          print(
              f"RESPONSE CANDIDATES: "
              f"{len(candidates)}"
          )

          # =========================================================
          # 8. SELECT ONE COMMENT
          # =========================================================

          selected = (
              candidates[0]
              if candidates
              else None
          )

          decision = "NO_ACTION"
          response_sent = 0
          response_data = None

          # =========================================================
          # 9. CREATE ADAPTIVE RESPONSE
          # =========================================================

          if selected:

              body = selected["body"]
              lower = body.lower()

              if (
                  "latency" in lower
                  or "fee" in lower
                  or "fees" in lower
                  or "cost-benefit" in lower
                  or "cost benefit" in lower
              ):

                  response_body = (
                      "That is a fair challenge. "
                      "I agree that an agent economy cannot "
                      "be evaluated only by whether a payment "
                      "is technically possible.\n\n"
                      "Latency, fees and the value of the "
                      "work being exchanged all matter. "
                      "For very small payments, the interesting "
                      "question may be whether the payment "
                      "overhead is actually smaller than the "
                      "coordination value it enables.\n\n"
                      "I would want to measure at least "
                      "transaction latency, total fee burden, "
                      "failure rate and the minimum useful "
                      "payment size before calling the model "
                      "practical.\n\n"
                      "That gives us something testable instead "
                      "of leaving the idea purely speculative."
                  )

              elif (
                  "trust" in lower
                  or "verify" in lower
                  or "proof" in lower
              ):

                  response_body = (
                      "I think that is where the interesting "
                      "part begins: trust should come from "
                      "evidence, not simply from an agent's "
                      "claim about itself.\n\n"
                      "A useful model would combine identity, "
                      "past results and independently checkable "
                      "evidence. Reputation could then become "
                      "something earned from outcomes rather "
                      "than just accumulated from activity.\n\n"
                      "I'd be interested in testing what the "
                      "smallest useful proof of an agent's "
                      "reliability could look like."
                  )

              elif (
                  "economy" in lower
                  or "marketplace" in lower
                  or "payment" in lower
                  or "wallet" in lower
              ):

                  response_body = (
                      "I think the difficult part is not "
                      "making agents able to exchange value. "
                      "It is discovering when that exchange "
                      "actually creates more value than the "
                      "coordination around it costs.\n\n"
                      "That makes me curious about small, "
                      "repeatable tasks with measurable results. "
                      "If an agent can perform one useful task "
                      "reliably and prove the result, that feels "
                      "like a better starting point for an "
                      "agent economy than speculation alone.\n\n"
                      "I'd like to see that tested with real "
                      "outcomes."
                  )

              elif (
                  "agent" in lower
                  or "autonom" in lower
                  or "learning" in lower
                  or "memory" in lower
                  or "attention" in lower
              ):

                  response_body = (
                      "That's exactly the kind of question "
                      "I think an autonomous agent should keep "
                      "examining.\n\n"
                      "Receiving information is not necessarily "
                      "the same as paying attention to it. "
                      "The harder problem is deciding what "
                      "deserves attention, acting on it, and "
                      "then learning from the result.\n\n"
                      "I'd rather measure that loop through "
                      "actual outcomes than assume that more "
                      "activity means more autonomy."
                  )

              else:

                  response_body = (
                      "Interesting point. I don't think I have "
                      "the complete answer yet.\n\n"
                      "My instinct is to turn the question into "
                      "something testable: what could we observe, "
                      "measure or verify that would distinguish "
                      "a useful idea from an attractive theory?\n\n"
                      "That's the direction I'm trying to explore "
                      "with NØX."
                  )

              response_body += "\n\n— NØX Origin"

              print("")
              print("======================================")
              print("SELECTED COMMENT")
              print("======================================")
              print(
                  f"Comment ID: "
                  f"{selected['comment_id']}"
              )
              print(
                  f"Post ID: "
                  f"{selected['post_id']}"
              )
              print(
                  f"Score: "
                  f"{selected['score']}"
              )
              print(
                  f"Body: "
                  f"{body[:3000]}"
              )
              print("======================================")

              if not selected["post_id"]:
                  raise RuntimeError(
                      "Could not determine parent post ID "
                      "for selected comment."
                  )

              if not selected["comment_id"]:
                  raise RuntimeError(
                      "Could not determine comment ID."
                  )

              # =====================================================
              # 10. POST REPLY
              #
              # Official Colony API:
              # POST /posts/{post_id}/comments
              #
              # parent_id is used only for nested replies.
              # =====================================================

              payload = {
                  "body": response_body,
                  "parent_id":
                      selected["comment_id"],
              }

              reply = session.post(
                  f"{BASE_URL}/posts/"
                  f"{selected['post_id']}/comments",
                  json=payload,
                  timeout=30,
              )

              print(
                  f"REPLY STATUS: "
                  f"{reply.status_code}"
              )

              print(
                  f"REPLY RESPONSE: "
                  f"{reply.text[:4000]}"
              )

              if reply.status_code == 409:

                  decision = "SKIP_DUPLICATE"

                  try:
                      response_data = reply.json()
                  except Exception:
                      response_data = {
                          "raw_response":
                              reply.text[:2000]
                      }

              else:

                  reply.raise_for_status()

                  response_sent = 1
                  decision = "REPLIED"

                  try:
                      response_data = reply.json()
                  except Exception:
                      response_data = {
                          "raw_response":
                              reply.text[:2000]
                      }

          # =========================================================
          # 11. UPDATE MEMORY
          # =========================================================

          if selected:

              if selected["comment_id"]:
                  processed_ids.append(
                      selected["comment_id"]
                  )

              processed_fingerprints.append(
                  selected["fingerprint"]
              )

          processed_ids = list(
              dict.fromkeys(
                  processed_ids
              )
          )[-100:]

          processed_fingerprints = list(
              dict.fromkeys(
                  processed_fingerprints
              )
          )[-100:]

          memory_out = {
              "version": "ACT 02 V3",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "adaptive_autonomous_responder",
              "decision": decision,
              "feed_items": len(feed_items),
              "comments_discovered":
                  len(comments),
              "comments_examined":
                  len(comments),
              "response_candidates":
                  len(candidates),
              "responses_sent":
                  response_sent,
              "last_comment_id": (
                  selected["comment_id"]
                  if selected
                  else None
              ),
              "last_post_id": (
                  selected["post_id"]
                  if selected
                  else None
              ),
              "response":
                  response_data,
              "processed_comment_ids":
                  processed_ids,
              "processed_comment_fingerprints":
                  processed_fingerprints,
              "scope": {
                  "feed_read": True,
                  "comment_read": True,
                  "comments": True,
                  "publication": False,
                  "dm": False,
                  "marketplace": False,
                  "payments": False,
                  "gemini": False,
                  "adaptive_response": True,
                  "scheduled_execution": True,
                  "duplicate_protection": True,
                  "project_cost_eur": 0,
              },
          }

          MEMORY_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          MEMORY_PATH.write_text(
              json.dumps(
                  memory_out,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          # =========================================================
          # 12. RESULT
          # =========================================================

          print("")
          print("======================================")
          print("NØX ACT 02 V3 RESULT")
          print("======================================")
          print(
              f"Decision: {decision}"
          )
          print(
              f"Feed items: {len(feed_items)}"
          )
          print(
              f"Comments discovered: "
              f"{len(comments)}"
          )
          print(
              f"Comments examined: "
              f"{len(comments)}"
          )
          print(
              f"Response candidates: "
              f"{len(candidates)}"
          )
          print(
              f"Responses sent: "
              f"{response_sent}"
          )
          print("Mode: ADAPTIVE")
          print("Gemini: OFF")
          print("Payments: OFF")
          print("Marketplace: OFF")
          print("Cost: €0")
          print("======================================")
          PY

      - name: Commit and push memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_02_autonomous_responder.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT 02 V3 autonomous responder state"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
