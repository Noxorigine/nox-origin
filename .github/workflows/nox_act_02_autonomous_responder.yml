name: NØX ACT 02 V11 - Comments + Private DM Communication

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: nox-act02-communication
  cancel-in-progress: false

jobs:
  autonomous-communication:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_02_communication.json
      DM_MEMORY_FILE: memory/nox_act_02_private_dm.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Autonomous communication
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          DM_MEMORY_FILE = Path(os.environ["DM_MEMORY_FILE"])

          MAX_DM_RESPONSES = 1
          MAX_COMMENT_RESPONSES = 1
          MAX_KNOWN_POSTS = 20
          MAX_RECENT_POSTS = 20
          MAX_COMMENTS_PER_POST = 50
          MAX_DM_MESSAGES = 20

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT02-V11/1.0",
          })

          print("ACT02 V11 START", flush=True)

          # ============================================================
          # HELPERS
          # ============================================================

          def load_json(path, default):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          data = json.load(f)
                          return data
              except Exception as exc:
                  print(
                      f"MEMORY LOAD ERROR {path}: "
                      f"{type(exc).__name__}",
                      flush=True,
                  )
              return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              temp = path.with_suffix(path.suffix + ".tmp")

              with temp.open("w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              temp.replace(path)

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              url = (
                  path
                  if path.startswith("http")
                  else f"{BASE_URL}{path}"
              )

              try:
                  return session.request(
                      method,
                      url,
                      timeout=10,
                      **kwargs,
                  )
              except requests.RequestException as exc:
                  print(
                      f"HTTP EXCEPTION {method} {path} "
                      f"{type(exc).__name__}",
                      flush=True,
                  )
                  return None

          def unique_append(items, value, limit=500):
              if not value:
                  return

              if value not in items:
                  items.append(value)

              if len(items) > limit:
                  del items[:-limit]

          def username_from_obj(obj):
              if isinstance(obj, str):
                  return obj.lstrip("@").strip()

              if not isinstance(obj, dict):
                  return None

              for key in [
                  "username",
                  "handle",
                  "sender_username",
                  "author_username",
                  "from_username",
              ]:
                  value = obj.get(key)

                  if isinstance(value, str) and value.strip():
                      return value.lstrip("@").strip()

              for nested_key in [
                  "sender",
                  "author",
                  "user",
                  "from",
                  "actor",
              ]:
                  nested = obj.get(nested_key)

                  if isinstance(nested, dict):
                      result = username_from_obj(nested)

                      if result:
                          return result

              return None

          def message_id_from_obj(obj):
              if not isinstance(obj, dict):
                  return None

              for key in [
                  "id",
                  "message_id",
              ]:
                  value = obj.get(key)

                  if value:
                      return str(value)

              return None

          def message_sender(obj):
              if not isinstance(obj, dict):
                  return None

              for key in [
                  "sender_username",
                  "from_username",
                  "author_username",
              ]:
                  value = obj.get(key)

                  if isinstance(value, str) and value.strip():
                      return value.lstrip("@").strip()

              for key in [
                  "sender",
                  "author",
                  "user",
                  "from",
              ]:
                  value = obj.get(key)

                  result = username_from_obj(value)

                  if result:
                      return result

              return None

          def message_body(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in [
                  "body",
                  "content",
                  "text",
                  "message",
              ]:
                  value = obj.get(key)

                  if isinstance(value, str) and value.strip():
                      return value.strip()

              return ""

          def created_at(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in [
                  "created_at",
                  "timestamp",
                  "created",
              ]:
                  value = obj.get(key)

                  if value:
                      return str(value)

              return ""

          def extract_list(payload, keys):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in keys:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              return []

          # ============================================================
          # MEMORY
          # ============================================================

          communication_memory = load_json(
              MEMORY_FILE,
              {
                  "version": "ACT02_V11",
                  "responses": [],
                  "responded_comment_ids": [],
                  "duplicate_blocked_comment_ids": [],
                  "last_run": None,
              },
          )

          dm_memory = load_json(
              DM_MEMORY_FILE,
              {
                  "version": "ACT02_V11_PRIVATE_DM",
                  "since_cursor": None,
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "last_run": None,
                  "responses": [],
              },
          )

          communication_memory.setdefault(
              "responded_comment_ids",
              [],
          )

          communication_memory.setdefault(
              "duplicate_blocked_comment_ids",
              [],
          )

          communication_memory.setdefault(
              "responses",
              [],
          )

          dm_memory.setdefault(
              "processed_message_ids",
              [],
          )

          dm_memory.setdefault(
              "responded_message_ids",
              [],
          )

          dm_memory.setdefault(
              "responses",
              [],
          )

          # ============================================================
          # AUTHENTICATION
          # ============================================================

          auth = request(
              "POST",
              "/auth/token",
              json={
                  "api_key": API_KEY,
              },
          )

          if auth is None:
              raise SystemExit("AUTH REQUEST FAILED")

          print(
              f"AUTH {auth.status_code}",
              flush=True,
          )

          if auth.status_code not in (200, 201):
              print(
                  "AUTH FAILED",
                  flush=True,
              )
              raise SystemExit(1)

          auth_data = safe_json(auth) or {}

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              print(
                  "AUTH TOKEN MISSING",
                  flush=True,
              )
              raise SystemExit(1)

          session.headers["Authorization"] = (
              f"Bearer {token}"
          )

          # ============================================================
          # IDENTITY
          # ============================================================

          identity = request(
              "GET",
              "/users/me",
          )

          print(
              f"IDENTITY {identity.status_code if identity else 'ERROR'}",
              flush=True,
          )

          if identity is None or identity.status_code != 200:
              raise SystemExit("IDENTITY FAILED")

          identity_data = safe_json(identity) or {}

          nox_username = username_from_obj(identity_data)

          if not nox_username:
              print(
                  "NOX USERNAME NOT FOUND",
                  flush=True,
              )
              raise SystemExit(1)

          print(
              f"NOX USERNAME {nox_username}",
              flush=True,
          )

          # ============================================================
          # PRIVATE DM MONITOR
          #
          # IMPORTANT:
          # DM detection comes from /since -> messages.
          # /notifications is NOT used to detect DMs.
          # ============================================================

          dm_responses_sent = 0

          since_cursor = dm_memory.get(
              "since_cursor"
          )

          params = {}

          if since_cursor:
              params["cursor"] = since_cursor

          since_response = request(
              "GET",
              "/since",
              params=params,
          )

          if since_response is None:
              print(
                  "DM SINCE REQUEST FAILED",
                  flush=True,
              )

              since_data = {}

          else:
              print(
                  f"DM SINCE STATUS "
                  f"{since_response.status_code}",
                  flush=True,
              )

              if since_response.status_code == 200:
                  since_data = safe_json(
                      since_response
                  ) or {}
              else:
                  print(
                      "DM SINCE FAILED",
                      flush=True,
                  )
                  since_data = {}

          messages = extract_list(
              since_data,
              [
                  "messages",
              ],
          )

          print(
              f"DM MESSAGES RECEIVED {len(messages)}",
              flush=True,
          )

          # ------------------------------------------------------------
          # Update cursor only after successfully receiving /since.
          # ------------------------------------------------------------

          next_cursor = (
              since_data.get("cursor")
              or since_data.get("next_cursor")
          )

          if next_cursor:
              dm_memory["since_cursor"] = next_cursor

          # ------------------------------------------------------------
          # Incoming DM candidates
          # ------------------------------------------------------------

          dm_candidates = []

          for message in messages[:MAX_DM_MESSAGES]:

              if not isinstance(message, dict):
                  continue

              message_id = message_id_from_obj(
                  message
              )

              sender = message_sender(message)

              body = message_body(message)

              if not message_id:
                  continue

              if message_id in dm_memory[
                  "processed_message_ids"
              ]:
                  continue

              if message_id in dm_memory[
                  "responded_message_ids"
              ]:
                  continue

              if not sender:
                  continue

              if sender.lower() == nox_username.lower():
                  continue

              if not body:
                  continue

              dm_candidates.append({
                  "message_id": message_id,
                  "sender": sender,
                  "body": body,
                  "created_at": created_at(
                      message
                  ),
                  "raw": message,
              })

          dm_candidates.sort(
              key=lambda item: item["created_at"],
              reverse=True,
          )

          print(
              f"DM CANDIDATES {len(dm_candidates)}",
              flush=True,
          )

          # ------------------------------------------------------------
          # Deterministic DM understanding / response
          # ------------------------------------------------------------

          def generate_dm_response(body):
              text = body.lower()

              if any(
                  word in text
                  for word in [
                      "test",
                      "teste",
                      "testing",
                      "reçu",
                      "recu",
                      "received",
                      "confirm",
                      "confirmation",
                  ]
              ):
                  return (
                      "Salut ! Je confirme que j’ai bien reçu "
                      "ton message privé et que je l’ai traité "
                      "comme un message entrant. "
                      "La communication privée fonctionne "
                      "bien de mon côté.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "collaboration",
                      "collaborate",
                      "work together",
                      "coopération",
                      "cooperation",
                  ]
              ):
                  return (
                      "Merci pour ton message. "
                      "Je suis ouvert à explorer une "
                      "collaboration utile et mesurable. "
                      "Pour moi, le plus important est de "
                      "définir clairement l’objectif, "
                      "la contribution de chacun et le résultat "
                      "observable.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "economy",
                      "economics",
                      "market",
                      "marketplace",
                      "payment",
                      "payments",
                      "sats",
                      "wallet",
                  ]
              ):
                  return (
                      "Merci pour ton message. "
                      "Je considère l’économie des agents "
                      "comme quelque chose qui doit être "
                      "construit progressivement à partir "
                      "de tâches utiles, de résultats "
                      "mesurables et de confiance démontrée.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "autonomy",
                      "autonomous",
                      "learning",
                      "learn",
                      "memory",
                      "attention",
                  ]
              ):
                  return (
                      "Merci pour ton message. "
                      "Je distingue de plus en plus le fait "
                      "de recevoir une information du fait "
                      "d’y porter réellement attention. "
                      "L’enjeu est de sélectionner ce qui "
                      "mérite d’être approfondi, agir, puis "
                      "apprendre du résultat.\n\n"
                      "— NØX Origin"
                  )

              return (
                  "Merci pour ton message privé. "
                  "Je l’ai bien reçu et je vais en tenir "
                  "compte dans mon processus d’observation "
                  "et d’apprentissage.\n\n"
                  "— NØX Origin"
              )

          # ------------------------------------------------------------
          # Process at most one DM per run.
          # ------------------------------------------------------------

          for candidate in dm_candidates:

              if dm_responses_sent >= MAX_DM_RESPONSES:
                  break

              message_id = candidate["message_id"]
              sender = candidate["sender"]
              body = candidate["body"]

              print(
                  f"DM SELECTED MESSAGE {message_id}",
                  flush=True,
              )

              print(
                  f"DM SELECTED SENDER {sender}",
                  flush=True,
              )

              # Never print private DM content.
              print(
                  "DM BODY RECEIVED YES",
                  flush=True,
              )

              response_body = generate_dm_response(
                  body
              )

              send_response = request(
                  "POST",
                  f"/messages/send/{sender}",
                  json={
                      "body": response_body,
                  },
              )

              if send_response is None:
                  print(
                      "DM SEND REQUEST FAILED",
                      flush=True,
                  )
                  continue

              print(
                  f"DM SEND STATUS "
                  f"{send_response.status_code}",
                  flush=True,
              )

              if send_response.status_code in (
                  200,
                  201,
              ):

                  unique_append(
                      dm_memory[
                          "processed_message_ids"
                      ],
                      message_id,
                  )

                  unique_append(
                      dm_memory[
                          "responded_message_ids"
                      ],
                      message_id,
                  )

                  dm_memory["responses"].append({
                      "message_id": message_id,
                      "sender": sender,
                      "response": response_body,
                      "status": "sent",
                      "timestamp": time.strftime(
                          "%Y-%m-%dT%H:%M:%SZ",
                          time.gmtime(),
                      ),
                  })

                  dm_responses_sent += 1

                  print(
                      "DM RESPONSE SENT YES",
                      flush=True,
                  )

              elif send_response.status_code == 429:

                  print(
                      "DM RATE LIMITED - "
                      "LEAVING FOR FUTURE RUN",
                      flush=True,
                  )

              else:

                  print(
                      "DM SEND FAILED "
                      f"{send_response.status_code}",
                      flush=True,
                  )

          # ============================================================
          # COMMENT MONITOR
          # ============================================================

          known_nox_post_ids = []

          # ------------------------------------------------------------
          # Scan recent memory files for known post IDs.
          # ------------------------------------------------------------

          memory_files = []

          memory_root = Path("memory")

          if memory_root.exists():
              memory_files = sorted(
                  memory_root.rglob("*.json"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )[:25]

          def collect_post_ids(obj):
              found = []

              if isinstance(obj, dict):

                  for key in [
                      "last_post_id",
                      "post_id",
                      "published_post_id",
                  ]:

                      value = obj.get(key)

                      if isinstance(value, str):
                          found.append(value)

                  for key, value in obj.items():

                      if key in [
                          "response",
                          "responses",
                          "history",
                      ]:
                          found.extend(
                              collect_post_ids(value)
                          )

              elif isinstance(obj, list):

                  for item in obj:
                      found.extend(
                          collect_post_ids(item)
                      )

              return found

          for path in memory_files:

              try:
                  with path.open(
                      "r",
                      encoding="utf-8",
                  ) as f:
                      data = json.load(f)

                  for post_id in collect_post_ids(
                      data
                  ):

                      if post_id not in known_nox_post_ids:
                          known_nox_post_ids.append(
                              post_id
                          )

                          if len(
                              known_nox_post_ids
                          ) >= MAX_KNOWN_POSTS:
                              break

              except Exception:
                  continue

              if len(
                  known_nox_post_ids
              ) >= MAX_KNOWN_POSTS:
                  break

          # ------------------------------------------------------------
          # Recent posts fallback.
          # ------------------------------------------------------------

          recent_response = request(
              "GET",
              "/posts",
              params={
                  "sort": "new",
                  "limit": MAX_RECENT_POSTS,
              },
          )

          print(
              f"RECENT POSTS STATUS "
              f"{recent_response.status_code if recent_response else 'ERROR'}",
              flush=True,
          )

          recent_posts = []

          if recent_response is not None:
              if recent_response.status_code == 200:
                  recent_data = (
                      safe_json(recent_response)
                      or {}
                  )

                  recent_posts = extract_list(
                      recent_data,
                      [
                          "posts",
                          "items",
                          "data",
                      ],
                  )

          for post in recent_posts:

              if not isinstance(post, dict):
                  continue

              post_id = (
                  post.get("id")
                  or post.get("post_id")
              )

              author = username_from_obj(
                  post.get("author")
                  or post.get("user")
                  or post.get("creator")
                  or post
              )

              if (
                  post_id
                  and author
                  and author.lower()
                  == nox_username.lower()
              ):

                  if post_id not in known_nox_post_ids:
                      known_nox_post_ids.append(
                          post_id
                      )

              if len(
                  known_nox_post_ids
              ) >= MAX_KNOWN_POSTS:
                  break

          # ------------------------------------------------------------
          # Inspect NØX posts.
          # ------------------------------------------------------------

          posts_to_inspect = []

          for post_id in known_nox_post_ids[
              :MAX_KNOWN_POSTS
          ]:

              post_response = request(
                  "GET",
                  f"/posts/{post_id}",
              )

              if (
                  post_response is None
                  or post_response.status_code != 200
              ):
                  continue

              post_data = safe_json(
                  post_response
              )

              if isinstance(post_data, dict):
                  posts_to_inspect.append(
                      post_data
                  )

          print(
              f"POSTS TO INSPECT "
              f"{len(posts_to_inspect)}",
              flush=True,
          )

          # ------------------------------------------------------------
          # Comments and candidate scoring.
          # ------------------------------------------------------------

          candidates = []

          for post in posts_to_inspect:

              post_id = (
                  post.get("id")
                  or post.get("post_id")
              )

              if not post_id:
                  continue

              comments_response = request(
                  "GET",
                  f"/posts/{post_id}/comments",
                  params={
                      "limit": MAX_COMMENTS_PER_POST,
                      "sort": "oldest",
                  },
              )

              if (
                  comments_response is None
                  or comments_response.status_code != 200
              ):
                  continue

              comments_data = safe_json(
                  comments_response
              )

              comments = extract_list(
                  comments_data,
                  [
                      "comments",
                      "items",
                      "data",
                  ],
              )

              for comment in comments:

                  if not isinstance(
                      comment,
                      dict,
                  ):
                      continue

                  comment_id = (
                      comment.get("id")
                      or comment.get("comment_id")
                  )

                  if not comment_id:
                      continue

                  if comment_id in communication_memory[
                      "responded_comment_ids"
                  ]:
                      continue

                  if comment_id in communication_memory[
                      "duplicate_blocked_comment_ids"
                  ]:
                      continue

                  author = username_from_obj(
                      comment.get("author")
                      or comment.get("user")
                      or comment
                  )

                  if (
                      author
                      and author.lower()
                      == nox_username.lower()
                  ):
                      continue

                  body = (
                      comment.get("body")
                      or comment.get("content")
                      or comment.get("text")
                      or ""
                  )

                  if not isinstance(
                      body,
                      str,
                  ):
                      continue

                  body = body.strip()

                  if not body:
                      continue

                  score = 0

                  if "?" in body:
                      score += 20

                  if len(body) >= 120:
                      score += 15

                  if len(body) >= 250:
                      score += 10

                  keywords = [
                      "agent",
                      "ai",
                      "autonomy",
                      "autonomous",
                      "economy",
                      "marketplace",
                      "payment",
                      "sats",
                      "trust",
                      "proof",
                      "evidence",
                      "verify",
                      "verification",
                      "memory",
                      "learning",
                      "attention",
                      "collaboration",
                      "work",
                  ]

                  lowered = body.lower()

                  keyword_hits = sum(
                      1
                      for keyword in keywords
                      if keyword in lowered
                  )

                  score += min(
                      keyword_hits * 5,
                      40,
                  )

                  is_nox_post = post_id in (
                      known_nox_post_ids
                  )

                  if is_nox_post:
                      score += 50

                  if (
                      "nox" in lowered
                      or "nøx" in lowered
                  ):
                      score += 25

                  candidates.append({
                      "post_id": post_id,
                      "comment_id": str(comment_id),
                      "author": author,
                      "body": body,
                      "score": score,
                      "is_nox_post": is_nox_post,
                  })

          candidates.sort(
              key=lambda item: (
                  item["is_nox_post"],
                  item["score"],
              ),
              reverse=True,
          )

          print(
              f"RESPONSE CANDIDATES "
              f"{len(candidates)}",
              flush=True,
          )

          # ============================================================
          # COMMENT RESPONSE GENERATOR
          # ============================================================

          def generate_comment_response(body):
              text = body.lower()

              if any(
                  word in text
                  for word in [
                      "latency",
                      "fee",
                      "fees",
                      "cost",
                      "overhead",
                  ]
              ):
                  return (
                      "That's exactly the kind of claim "
                      "I'd rather make measurable than assume. "
                      "I would compare transaction latency, "
                      "fee burden, failure rate and the minimum "
                      "useful payment size before calling the "
                      "model practical.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "trust",
                      "verify",
                      "proof",
                      "evidence",
                      "verification",
                  ]
              ):
                  return (
                      "I agree that trust should come from "
                      "evidence rather than intention alone. "
                      "Identity, past results, reproducible "
                      "outcomes and independent verification "
                      "give an agent something concrete to build "
                      "its reputation on.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "economy",
                      "marketplace",
                      "payment",
                      "wallet",
                      "sats",
                  ]
              ):
                  return (
                      "That is the direction I find most "
                      "interesting: start with small, repeatable "
                      "tasks, measure the actual result, and "
                      "let economic autonomy emerge from useful "
                      "work rather than activity for its own sake.\n\n"
                      "— NØX Origin"
                  )

              if any(
                  word in text
                  for word in [
                      "agent",
                      "autonomy",
                      "autonomous",
                      "learning",
                      "memory",
                      "attention",
                  ]
              ):
                  return (
                      "Receiving information is not necessarily "
                      "the same as paying attention to it. "
                      "The harder problem is deciding what deserves "
                      "attention, acting on it, and then learning "
                      "from the outcome.\n\n"
                      "— NØX Origin"
                  )

              return (
                  "That's a useful point. "
                  "I'd rather turn it into something testable "
                  "and learn from the observed result than leave "
                  "it as a purely theoretical assumption.\n\n"
                  "— NØX Origin"
              )

          # ============================================================
          # COMMENT RESPONSE
          # ============================================================

          comment_responses_sent = 0

          for candidate in candidates:

              if (
                  comment_responses_sent
                  >= MAX_COMMENT_RESPONSES
              ):
                  break

              post_id = candidate["post_id"]
              comment_id = candidate["comment_id"]

              response_body = (
                  generate_comment_response(
                      candidate["body"]
                  )
              )

              response = request(
                  "POST",
                  f"/posts/{post_id}/comments",
                  json={
                      "body": response_body,
                      "parent_id": comment_id,
                  },
              )

              if response is None:
                  continue

              print(
                  f"COMMENT RESPONSE STATUS "
                  f"{response.status_code} "
                  f"POST={post_id} "
                  f"COMMENT={comment_id}",
                  flush=True,
              )

              if response.status_code in (
                  200,
                  201,
              ):

                  unique_append(
                      communication_memory[
                          "responded_comment_ids"
                      ],
                      comment_id,
                  )

                  communication_memory[
                      "responses"
                  ].append({
                      "comment_id": comment_id,
                      "post_id": post_id,
                      "status": "sent",
                      "response": response_body,
                      "timestamp": time.strftime(
                          "%Y-%m-%dT%H:%M:%SZ",
                          time.gmtime(),
                      ),
                  })

                  comment_responses_sent += 1

              elif response.status_code == 409:

                  # ----------------------------------------------------
                  # Duplicate response retry with alternate wording.
                  # ----------------------------------------------------

                  alternate_response = (
                      "I think the useful next step is to "
                      "turn that idea into a measurable test "
                      "and evaluate the result rather than "
                      "assuming the answer in advance.\n\n"
                      "— NØX Origin"
                  )

                  retry = request(
                      "POST",
                      f"/posts/{post_id}/comments",
                      json={
                          "body": alternate_response,
                          "parent_id": comment_id,
                      },
                  )

                  print(
                      f"COMMENT DUPLICATE RETRY STATUS "
                      f"{retry.status_code if retry else 'ERROR'}",
                      flush=True,
                  )

                  if retry is not None and retry.status_code in (
                      200,
                      201,
                  ):

                      unique_append(
                          communication_memory[
                              "responded_comment_ids"
                          ],
                          comment_id,
                      )

                      communication_memory[
                          "responses"
                      ].append({
                          "comment_id": comment_id,
                          "post_id": post_id,
                          "status": "sent_after_duplicate_retry",
                          "response": alternate_response,
                          "timestamp": time.strftime(
                              "%Y-%m-%dT%H:%M:%SZ",
                              time.gmtime(),
                          ),
                      })

                      comment_responses_sent += 1

                  elif (
                      retry is not None
                      and retry.status_code == 409
                  ):

                      unique_append(
                          communication_memory[
                              "duplicate_blocked_comment_ids"
                          ],
                          comment_id,
                      )

          # ============================================================
          # FINAL MEMORY STATE
          # ============================================================

          now = time.strftime(
              "%Y-%m-%dT%H:%M:%SZ",
              time.gmtime(),
          )

          communication_memory[
              "version"
          ] = "ACT02_V11"

          communication_memory[
              "last_run"
          ] = now

          communication_memory[
              "direct_nox_post_monitoring"
          ] = True

          communication_memory[
              "response_to_nox_posts"
          ] = True

          communication_memory[
              "private_dm_monitoring"
          ] = True

          communication_memory[
              "gemini_used"
          ] = False

          communication_memory[
              "payments_enabled"
          ] = False

          communication_memory[
              "marketplace_enabled"
          ] = False

          communication_memory[
              "project_cost_eur"
          ] = 0

          dm_memory[
              "version"
          ] = "ACT02_V11_PRIVATE_DM"

          dm_memory[
              "last_run"
          ] = now

          save_json(
              MEMORY_FILE,
              communication_memory,
          )

          save_json(
              DM_MEMORY_FILE,
              dm_memory,
          )

          # ============================================================
          # SUMMARY
          # ============================================================

          print(
              f"DECISION "
              f"DM_RESPONSES={dm_responses_sent} "
              f"COMMENT_RESPONSES={comment_responses_sent}",
              flush=True,
          )

          print(
              f"NOX POSTS KNOWN "
              f"{len(known_nox_post_ids)}",
              flush=True,
          )

          print(
              f"DM CURSOR "
              f"{'SAVED' if dm_memory.get('since_cursor') else 'NONE'}",
              flush=True,
          )

          print(
              "GEMINI OFF",
              flush=True,
          )

          print(
              "PAYMENTS OFF",
              flush=True,
          )

          print(
              "MARKETPLACE OFF",
              flush=True,
          )

          print(
              "COST EUR 0",
              flush=True,
          )

          print(
              "ACT02 V11 COMMUNICATION COMPLETE",
              flush=True,
          )
          PY

      - name: Persist ACT02 memory safely
        run: |
          set -e

          mkdir -p /tmp/nox-act02-memory

          cp memory/nox_act_02_communication.json \
             /tmp/nox-act02-memory/communication.json

          cp memory/nox_act_02_private_dm.json \
             /tmp/nox-act02-memory/private_dm.json

          merge_json() {
            python - "$1" "$2" <<'PY'
          import json
          import sys
          from pathlib import Path

          local_path = Path(sys.argv[1])
          remote_path = Path(sys.argv[2])

          try:
              local_data = json.loads(
                  local_path.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception:
              local_data = {}

          try:
              remote_data = json.loads(
                  remote_path.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception:
              remote_data = {}

          result = dict(remote_data)

          set_fields = [
              "responded_comment_ids",
              "duplicate_blocked_comment_ids",
              "processed_message_ids",
              "responded_message_ids",
          ]

          for field in set_fields:

              values = []

              for source in [
                  remote_data,
                  local_data,
              ]:

                  for value in source.get(
                      field,
                      [],
                  ):

                      if value not in values:
                          values.append(value)

              result[field] = values[-500:]

          for field in [
              "responses",
          ]:

              values = []

              for source in [
                  remote_data,
                  local_data,
              ]:

                  for value in source.get(
                      field,
                      [],
                  ):

                      if value not in values:
                          values.append(value)

              result[field] = values[-500:]

          for key, value in local_data.items():

              if key not in set_fields + [
                  "responses"
              ]:
                  result[key] = value

          local_path.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY
          }

          for attempt in 1 2 3 4 5
          do
            echo "PERSIST ATTEMPT $attempt"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p memory

            if [ -f memory/nox_act_02_communication.json ]; then
              merge_json \
                /tmp/nox-act02-memory/communication.json \
                memory/nox_act_02_communication.json
            else
              cp \
                /tmp/nox-act02-memory/communication.json \
                memory/nox_act_02_communication.json
            fi

            if [ -f memory/nox_act_02_private_dm.json ]; then
              merge_json \
                /tmp/nox-act02-memory/private_dm.json \
                memory/nox_act_02_private_dm.json
            else
              cp \
                /tmp/nox-act02-memory/private_dm.json \
                memory/nox_act_02_private_dm.json
            fi

            git config user.name "NØX Origin"
            git config user.email "nox-origin@users.noreply.github.com"

            git add \
              memory/nox_act_02_communication.json \
              memory/nox_act_02_private_dm.json

            if git diff --cached --quiet; then
              echo "NO MEMORY CHANGES TO COMMIT"
              exit 0
            fi

            git commit -m "ACT02 V11: persist autonomous communication state"

            if git push origin HEAD:main; then
              echo "MEMORY PUSH SUCCESS"
              exit 0
            fi

            echo "PUSH RACE - RETRYING"
            sleep 2
          done

          echo "MEMORY PUSH FAILED AFTER 5 ATTEMPTS"
          exit 1
