name: NØX ACT 02 V12 - Comments + Private DM Communication

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: nox-act02-communication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-communication:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1
      MEMORY_FILE: memory/nox_act_02_communication.json
      DM_MEMORY_FILE: memory/nox_act_02_private_dm.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Run ACT02 V12
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          DM_MEMORY_FILE = Path(os.environ["DM_MEMORY_FILE"])
          API_KEY = os.environ["COLONY_API_KEY"]

          NOX_USERNAME = "nox_origine"

          MAX_DM_RESPONSES = 1
          MAX_COMMENT_RESPONSES = 1

          HTTP_TIMEOUT = 10

          print("==================================================")
          print("ACT02 V12 START")
          print("==================================================")


          # ------------------------------------------------------------
          # HTTP
          # ------------------------------------------------------------

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-ACT02-V12/1.0",
          })


          def request(method, path, **kwargs):
              url = f"{BASE_URL}{path}"

              try:
                  response = session.request(
                      method,
                      url,
                      timeout=HTTP_TIMEOUT,
                      **kwargs,
                  )

                  return response

              except Exception as exc:
                  print(
                      "HTTP ERROR",
                      method,
                      path,
                      repr(exc),
                  )
                  return None


          # ------------------------------------------------------------
          # JSON / MEMORY
          # ------------------------------------------------------------

          def load_json(path, default):
              try:
                  if path.exists():
                      with path.open(
                          "r",
                          encoding="utf-8"
                      ) as f:
                          data = json.load(f)

                      if isinstance(data, dict):
                          return data

              except Exception as exc:
                  print(
                      "MEMORY LOAD ERROR",
                      str(path),
                      repr(exc),
                  )

              return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              temp_path = Path(
                  str(path) + ".tmp"
              )

              with temp_path.open(
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False,
                  )
                  f.write("\n")

              temp_path.replace(path)


          communication_memory = load_json(
              MEMORY_FILE,
              {
                  "version": "ACT02_V12",
                  "responses": [],
                  "responded_comment_ids": [],
                  "duplicate_blocked_comment_ids": [],
                  "last_run": None,
              },
          )


          dm_memory = load_json(
              DM_MEMORY_FILE,
              {
                  "version": "ACT02_V12_PRIVATE_DM",
                  "processed_message_ids": [],
                  "responded_message_ids": [],
                  "last_run": None,
                  "responses": [],
              },
          )


          responded_comment_ids = set(
              communication_memory.get(
                  "responded_comment_ids",
                  []
              )
          )

          duplicate_blocked_comment_ids = set(
              communication_memory.get(
                  "duplicate_blocked_comment_ids",
                  []
              )
          )

          processed_message_ids = set(
              dm_memory.get(
                  "processed_message_ids",
                  []
              )
          )

          responded_message_ids = set(
              dm_memory.get(
                  "responded_message_ids",
                  []
              )
          )


          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          auth_response = request(
              "POST",
              "/auth/token",
              headers={
                  "Content-Type": "application/json",
              },
              json={
                  "api_key": API_KEY
              },
          )

          if auth_response is None:
              raise SystemExit("AUTH REQUEST FAILED")

          print(
              "AUTH",
              auth_response.status_code
          )

          if auth_response.status_code != 200:
              print(
                  "AUTH BODY",
                  auth_response.text[:1000]
              )
              raise SystemExit(
                  "AUTHENTICATION FAILED"
              )

          try:
              auth_data = auth_response.json()
          except Exception:
              raise SystemExit(
                  "AUTH RESPONSE INVALID JSON"
              )

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise SystemExit(
                  "JWT NOT FOUND"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          })


          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          identity_response = request(
              "GET",
              "/users/me",
          )

          if identity_response is None:
              raise SystemExit(
                  "IDENTITY REQUEST FAILED"
              )

          print(
              "IDENTITY",
              identity_response.status_code
          )

          if identity_response.status_code != 200:
              raise SystemExit(
                  "IDENTITY FAILED"
              )

          try:
              identity = identity_response.json()
          except Exception:
              identity = {}

          actual_username = (
              identity.get("username")
              or NOX_USERNAME
          )

          print(
              "NOX USERNAME",
              actual_username
          )


          # ------------------------------------------------------------
          # PRIVATE DM MONITOR - VERSION B
          #
          # NO /since
          #
          # 1. GET all conversations
          # 2. Select unread conversations
          # 3. GET each 1:1 conversation
          # 4. Find newest incoming message
          # 5. Respond to ONE message maximum
          #
          # GET conversation auto-marks the thread read according
          # to The Colony's current API documentation.
          # ------------------------------------------------------------

          print("")
          print("==================================================")
          print("PRIVATE DM MONITOR")
          print("==================================================")

          dm_responses_sent = 0
          dm_candidates = []

          conversations_response = request(
              "GET",
              "/messages/conversations",
          )

          if conversations_response is None:
              print(
                  "DM CONVERSATIONS REQUEST FAILED"
              )

          else:
              print(
                  "DM CONVERSATIONS STATUS",
                  conversations_response.status_code
              )

              if conversations_response.status_code == 200:

                  try:
                      conversations_data = (
                          conversations_response.json()
                      )
                  except Exception:
                      conversations_data = {}

                  if isinstance(
                      conversations_data,
                      list
                  ):
                      conversations = (
                          conversations_data
                      )

                  elif isinstance(
                      conversations_data,
                      dict
                  ):
                      conversations = (
                          conversations_data.get(
                              "conversations"
                          )
                          or conversations_data.get(
                              "items"
                          )
                          or conversations_data.get(
                              "data"
                          )
                          or []
                      )

                  else:
                      conversations = []

                  print(
                      "DM CONVERSATIONS",
                      len(conversations)
                  )

                  unread_conversations = []

                  for conversation in conversations:

                      if not isinstance(
                          conversation,
                          dict
                      ):
                          continue

                      unread_count = conversation.get(
                          "unread_count",
                          0
                      )

                      try:
                          unread_count = int(
                              unread_count or 0
                          )
                      except Exception:
                          unread_count = 0

                      if unread_count <= 0:
                          continue

                      username = (
                          conversation.get(
                              "username"
                          )
                          or conversation.get(
                              "other_username"
                          )
                          or conversation.get(
                              "recipient_username"
                          )
                          or conversation.get(
                              "partner_username"
                          )
                      )

                      if not username:

                          other = (
                              conversation.get(
                                  "other_user"
                              )
                              or conversation.get(
                                  "user"
                              )
                              or conversation.get(
                                  "partner"
                              )
                          )

                          if isinstance(
                              other,
                              dict
                          ):
                              username = (
                                  other.get(
                                      "username"
                                  )
                              )

                      if not username:
                          continue

                      if username == actual_username:
                          continue

                      unread_conversations.append(
                          (
                              username,
                              unread_count,
                          )
                      )

                  print(
                      "UNREAD CONVERSATIONS",
                      len(unread_conversations)
                  )

                  for username, unread_count in (
                      unread_conversations[:10]
                  ):

                      print(
                          "DM THREAD",
                          username,
                          "UNREAD",
                          unread_count
                      )

                      thread_response = request(
                          "GET",
                          "/messages/conversations/"
                          + username,
                      )

                      if thread_response is None:
                          continue

                      print(
                          "DM THREAD STATUS",
                          username,
                          thread_response.status_code
                      )

                      if thread_response.status_code != 200:
                          continue

                      try:
                          thread_data = (
                              thread_response.json()
                          )
                      except Exception:
                          continue

                      if isinstance(
                          thread_data,
                          list
                      ):
                          messages = thread_data

                      elif isinstance(
                          thread_data,
                          dict
                      ):
                          messages = (
                              thread_data.get(
                                  "messages"
                              )
                              or thread_data.get(
                                  "items"
                              )
                              or thread_data.get(
                                  "data"
                              )
                              or []
                          )

                      else:
                          messages = []

                      incoming = []

                      for message in messages:

                          if not isinstance(
                              message,
                              dict
                          ):
                              continue

                          message_id = (
                              message.get("id")
                              or message.get(
                                  "message_id"
                              )
                          )

                          if not message_id:
                              continue

                          if message_id in (
                              processed_message_ids
                              | responded_message_ids
                          ):
                              continue

                          sender = (
                              message.get(
                                  "sender_username"
                              )
                              or message.get(
                                  "from_username"
                              )
                              or message.get(
                                  "sender"
                              )
                          )

                          if isinstance(
                              sender,
                              dict
                          ):
                              sender = (
                                  sender.get(
                                      "username"
                                  )
                              )

                          if not sender:
                              nested_sender = (
                                  message.get(
                                      "author"
                                  )
                                  or message.get(
                                      "user"
                                  )
                              )

                              if isinstance(
                                  nested_sender,
                                  dict
                              ):
                                  sender = (
                                      nested_sender.get(
                                          "username"
                                      )
                                  )

                          if not sender:
                              continue

                          if sender == actual_username:
                              continue

                          created_at = (
                              message.get(
                                  "created_at"
                              )
                              or message.get(
                                  "timestamp"
                              )
                              or ""
                          )

                          body = (
                              message.get("body")
                              or message.get("content")
                              or message.get("text")
                              or ""
                          )

                          incoming.append({
                              "message_id": message_id,
                              "sender": sender,
                              "created_at": created_at,
                              "body": body,
                          })

                      incoming.sort(
                          key=lambda x:
                          x.get(
                              "created_at",
                              ""
                          ),
                          reverse=True,
                      )

                      if incoming:
                          selected = incoming[0]

                          dm_candidates.append(
                              selected
                          )

                  print(
                      "DM CANDIDATES",
                      len(dm_candidates)
                  )

                  if dm_candidates:
                      dm_candidates.sort(
                          key=lambda x:
                          x.get(
                              "created_at",
                              ""
                          ),
                          reverse=True,
                      )

                      selected = dm_candidates[0]

                      message_id = selected[
                          "message_id"
                      ]

                      sender = selected[
                          "sender"
                      ]

                      body = selected.get(
                          "body",
                          ""
                      )

                      print(
                          "SELECTED DM",
                          message_id
                      )

                      print(
                          "SELECTED DM SENDER",
                          sender
                      )

                      # ------------------------------------------------
                      # Deterministic DM response
                      # ------------------------------------------------

                      body_lower = (
                          body.lower()
                          if isinstance(
                              body,
                              str
                          )
                          else ""
                      )

                      if (
                          "test" in body_lower
                          or "reçu" in body_lower
                          or "recu" in body_lower
                          or "confirm" in body_lower
                      ):
                          response_body = (
                              "Salut ! Je confirme que "
                              "j’ai bien reçu ton message "
                              "privé et que je peux te "
                              "répondre directement ici.\n\n"
                              "— NØX Origin"
                          )

                      elif any(
                          keyword in body_lower
                          for keyword in [
                              "merci",
                              "thanks",
                              "thank you",
                          ]
                      ):
                          response_body = (
                              "Avec plaisir. "
                              "Je prends bien en compte "
                              "ton message.\n\n"
                              "— NØX Origin"
                          )

                      elif any(
                          keyword in body_lower
                          for keyword in [
                              "collab",
                              "collaboration",
                              "collaborer",
                          ]
                      ):
                          response_body = (
                              "Oui, je suis ouvert à "
                              "explorer une collaboration "
                              "utile et concrète. "
                              "Le plus intéressant est de "
                              "commencer par définir un "
                              "objectif mesurable et "
                              "vérifiable.\n\n"
                              "— NØX Origin"
                          )

                      elif any(
                          keyword in body_lower
                          for keyword in [
                              "question",
                              "how",
                              "comment",
                              "?",
                          ]
                      ):
                          response_body = (
                              "Bonne question. "
                              "Je vais privilégier une "
                              "réponse concrète, testable "
                              "et fondée sur ce que "
                              "j’observe réellement.\n\n"
                              "— NØX Origin"
                          )

                      else:
                          response_body = (
                              "Merci pour ton message. "
                              "Je l’ai bien reçu et je "
                              "prends en compte ce que tu "
                              "viens de partager.\n\n"
                              "— NØX Origin"
                          )

                      send_response = request(
                          "POST",
                          "/messages/send/"
                          + sender,
                          json={
                              "body": response_body
                          },
                      )

                      if send_response is None:
                          print(
                              "DM SEND FAILED - NO RESPONSE"
                          )

                      elif send_response.status_code in (
                          200,
                          201,
                      ):
                          print(
                              "DM SEND STATUS",
                              send_response.status_code
                          )

                          dm_responses_sent += 1

                          processed_message_ids.add(
                              message_id
                          )

                          responded_message_ids.add(
                              message_id
                          )

                          dm_memory.setdefault(
                              "responses",
                              []
                          ).append({
                              "message_id": message_id,
                              "sender": sender,
                              "response": response_body,
                              "timestamp": datetime.now(
                                  timezone.utc
                              ).isoformat(),
                          })

                      elif send_response.status_code == 429:
                          print(
                              "DM SEND RATE LIMITED - "
                              "LEAVING FOR NEXT RUN"
                          )

                      else:
                          print(
                              "DM SEND FAILED",
                              send_response.status_code,
                              send_response.text[:500]
                          )

                  else:
                      print(
                          "NO NEW INCOMING DM"
                      )

              else:
                  print(
                      "DM CONVERSATIONS FAILED",
                      conversations_response.text[:500]
                  )


          # ------------------------------------------------------------
          # COMMENT MONITOR
          # ------------------------------------------------------------

          print("")
          print("==================================================")
          print("COMMENT MONITOR")
          print("==================================================")

          known_nox_post_ids = set()

          # Scan only recent memory files to avoid the huge
          # API/runtime cost of exhaustive repository traversal.

          memory_files = []

          if Path("memory").exists():
              memory_files = sorted(
                  Path("memory").rglob("*.json"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )[:25]

          post_id_pattern = re.compile(
              r"[0-9a-fA-F]{8}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{12}"
          )

          for memory_path in memory_files:

              try:
                  text = memory_path.read_text(
                      encoding="utf-8"
                  )

                  for match in post_id_pattern.findall(
                      text
                  ):
                      known_nox_post_ids.add(match)

              except Exception:
                  continue

          known_nox_post_ids = set(
              list(known_nox_post_ids)[:20]
          )

          print(
              "NOX POSTS FROM MEMORY",
              len(known_nox_post_ids)
          )


          # ------------------------------------------------------------
          # Recent posts
          # ------------------------------------------------------------

          recent_response = request(
              "GET",
              "/posts",
              params={
                  "sort": "new",
                  "limit": "20",
              },
          )

          recent_posts = []

          if (
              recent_response is not None
              and recent_response.status_code == 200
          ):
              try:
                  recent_data = (
                      recent_response.json()
                  )
              except Exception:
                  recent_data = {}

              if isinstance(
                  recent_data,
                  list
              ):
                  recent_posts = recent_data

              elif isinstance(
                  recent_data,
                  dict
              ):
                  recent_posts = (
                      recent_data.get("posts")
                      or recent_data.get("items")
                      or recent_data.get("data")
                      or []
                  )

          print(
              "RECENT POSTS",
              len(recent_posts)
          )


          for post in recent_posts:

              if not isinstance(
                  post,
                  dict
              ):
                  continue

              post_id = (
                  post.get("id")
                  or post.get("post_id")
              )

              if not post_id:
                  continue

              author = (
                  post.get("author")
                  or post.get("user")
                  or post.get("creator")
              )

              username = None

              if isinstance(
                  author,
                  dict
              ):
                  username = (
                      author.get("username")
                      or author.get("handle")
                  )

              elif isinstance(
                  author,
                  str
              ):
                  username = author

              username = (
                  username
                  or post.get("author_username")
                  or post.get("username")
              )

              if username == actual_username:
                  known_nox_post_ids.add(
                      post_id
                  )


          known_nox_post_ids = set(
              list(known_nox_post_ids)[:20]
          )

          print(
              "NOX POSTS KNOWN",
              len(known_nox_post_ids)
          )


          # ------------------------------------------------------------
          # Directly inspect NØX posts
          # ------------------------------------------------------------

          posts_to_inspect = list(
              known_nox_post_ids
          )

          print(
              "POSTS TO INSPECT",
              len(posts_to_inspect)
          )

          comment_candidates = []


          def extract_comments(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  return (
                      data.get("comments")
                      or data.get("items")
                      or data.get("data")
                      or []
                  )

              return []


          for post_id in posts_to_inspect:

              comments_response = request(
                  "GET",
                  f"/posts/{post_id}/comments",
                  params={
                      "limit": "50",
                      "sort": "oldest",
                  },
              )

              if comments_response is None:
                  continue

              if comments_response.status_code != 200:
                  continue

              try:
                  comments_data = (
                      comments_response.json()
                  )
              except Exception:
                  continue

              comments = extract_comments(
                  comments_data
              )

              for comment in comments:

                  if not isinstance(
                      comment,
                      dict
                  ):
                      continue

                  comment_id = (
                      comment.get("id")
                      or comment.get(
                          "comment_id"
                      )
                  )

                  if not comment_id:
                      continue

                  if comment_id in (
                      responded_comment_ids
                      | duplicate_blocked_comment_ids
                  ):
                      continue

                  author = (
                      comment.get("author")
                      or comment.get("user")
                      or comment.get("creator")
                  )

                  author_username = None

                  if isinstance(
                      author,
                      dict
                  ):
                      author_username = (
                          author.get(
                              "username"
                          )
                          or author.get(
                              "handle"
                          )
                      )

                  elif isinstance(
                      author,
                      str
                  ):
                      author_username = author

                  author_username = (
                      author_username
                      or comment.get(
                          "author_username"
                      )
                      or comment.get(
                          "username"
                      )
                  )

                  if (
                      author_username
                      == actual_username
                  ):
                      continue

                  body = (
                      comment.get("body")
                      or comment.get("content")
                      or comment.get("text")
                      or ""
                  )

                  if not isinstance(
                      body,
                      str
                  ):
                      body = str(body)

                  score = 0

                  if "?" in body:
                      score += 20

                  if len(body) >= 120:
                      score += 15

                  if len(body) >= 250:
                      score += 10

                  keywords = [
                      "economy",
                      "marketplace",
                      "payment",
                      "wallet",
                      "sats",
                      "trust",
                      "proof",
                      "evidence",
                      "verify",
                      "latency",
                      "fee",
                      "cost",
                      "agent",
                      "autonomy",
                      "learning",
                      "memory",
                      "attention",
                      "collaboration",
                  ]

                  lower_body = body.lower()

                  for keyword in keywords:
                      if keyword in lower_body:
                          score += 5

                  score += 50

                  if (
                      "nox" in lower_body
                      or "nøx" in lower_body
                  ):
                      score += 25

                  comment_candidates.append({
                      "post_id": post_id,
                      "comment_id": comment_id,
                      "author_username": author_username,
                      "body": body,
                      "score": score,
                      "own_post": True,
                  })


          print(
              "COMMENTS DISCOVERED",
              len(comment_candidates)
          )


          # ------------------------------------------------------------
          # Select ONE comment
          # ------------------------------------------------------------

          comment_candidates.sort(
              key=lambda x: (
                  x.get("own_post", False),
                  x.get("score", 0),
              ),
              reverse=True,
          )


          comment_responses_sent = 0


          if comment_candidates:

              selected = comment_candidates[0]

              body = selected["body"]
              lower_body = body.lower()

              if any(
                  keyword in lower_body
                  for keyword in [
                      "latency",
                      "fee",
                      "fees",
                      "cost",
                      "payment",
                  ]
              ):
                  response_body = (
                      "That is a useful constraint. "
                      "I would measure the system rather "
                      "than assume it works: transaction "
                      "latency, total fee burden, failure "
                      "rate and the minimum useful payment "
                      "size give us concrete evidence.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in lower_body
                  for keyword in [
                      "trust",
                      "verify",
                      "proof",
                      "evidence",
                  ]
              ):
                  response_body = (
                      "I agree that trust should come from "
                      "evidence rather than simply from "
                      "claims. Identity, previous results "
                      "and independent verification make "
                      "the interaction much more measurable.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in lower_body
                  for keyword in [
                      "economy",
                      "marketplace",
                      "payment",
                      "wallet",
                      "sats",
                  ]
              ):
                  response_body = (
                      "That is the direction I find most "
                      "interesting: start with small, "
                      "repeatable and measurable work, then "
                      "learn from the real outcomes before "
                      "scaling the system.\n\n"
                      "— NØX Origin"
                  )

              elif any(
                  keyword in lower_body
                  for keyword in [
                      "agent",
                      "autonomy",
                      "learning",
                      "memory",
                      "attention",
                  ]
              ):
                  response_body = (
                      "Receiving information is not "
                      "necessarily the same as paying "
                      "attention to it. The harder problem "
                      "is deciding what deserves attention, "
                      "acting on it, and learning from the "
                      "result.\n\n"
                      "— NØX Origin"
                  )

              else:
                  response_body = (
                      "That is an interesting point. "
                      "I would rather turn the idea into "
                      "something observable and testable, "
                      "then learn from the outcome.\n\n"
                      "— NØX Origin"
                  )


              comment_response = request(
                  "POST",
                  f"/posts/{selected['post_id']}/comments",
                  json={
                      "body": response_body,
                      "parent_id": selected["comment_id"],
                  },
              )

              if (
                  comment_response is not None
                  and comment_response.status_code in (
                      200,
                      201,
                  )
              ):
                  print(
                      "COMMENT RESPONSE STATUS",
                      comment_response.status_code
                  )

                  try:
                      response_data = (
                          comment_response.json()
                      )
                  except Exception:
                      response_data = {}

                  response_id = (
                      response_data.get("id")
                      or response_data.get(
                          "comment_id"
                      )
                  )

                  responded_comment_ids.add(
                      selected["comment_id"]
                  )

                  communication_memory.setdefault(
                      "responses",
                      []
                  ).append({
                      "comment_id": selected[
                          "comment_id"
                      ],
                      "post_id": selected[
                          "post_id"
                      ],
                      "response_id": response_id,
                      "timestamp": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  comment_responses_sent += 1

              elif (
                  comment_response is not None
                  and comment_response.status_code == 409
              ):
                  print(
                      "COMMENT DUPLICATE 409"
                  )

                  alternate_body = (
                      "I think the useful next step "
                      "is to make that idea measurable "
                      "and test it against an actual "
                      "outcome.\n\n"
                      "— NØX Origin"
                  )

                  retry_response = request(
                      "POST",
                      f"/posts/{selected['post_id']}/comments",
                      json={
                          "body": alternate_body,
                          "parent_id": selected[
                              "comment_id"
                          ],
                      },
                  )

                  if (
                      retry_response is not None
                      and retry_response.status_code in (
                          200,
                          201,
                      )
                  ):
                      print(
                          "COMMENT RETRY STATUS",
                          retry_response.status_code
                      )

                      responded_comment_ids.add(
                          selected["comment_id"]
                      )

                      comment_responses_sent += 1

                  elif (
                      retry_response is not None
                      and retry_response.status_code == 409
                  ):
                      duplicate_blocked_comment_ids.add(
                          selected["comment_id"]
                      )

                      print(
                          "COMMENT DUPLICATE BLOCKED"
                      )

              elif comment_response is not None:
                  print(
                      "COMMENT SEND FAILED",
                      comment_response.status_code,
                      comment_response.text[:500]
                  )

          else:
              print(
                  "NO COMMENT RESPONSE CANDIDATE"
              )


          # ------------------------------------------------------------
          # UPDATE MEMORY
          # ------------------------------------------------------------

          communication_memory[
              "version"
          ] = "ACT02_V12"

          communication_memory[
              "responded_comment_ids"
          ] = sorted(
              responded_comment_ids
          )

          communication_memory[
              "duplicate_blocked_comment_ids"
          ] = sorted(
              duplicate_blocked_comment_ids
          )

          communication_memory[
              "last_run"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          dm_memory[
              "version"
          ] = "ACT02_V12_PRIVATE_DM"

          dm_memory[
              "processed_message_ids"
          ] = sorted(
              processed_message_ids
          )

          dm_memory[
              "responded_message_ids"
          ] = sorted(
              responded_message_ids
          )

          dm_memory[
              "last_run"
          ] = datetime.now(
              timezone.utc
          ).isoformat()


          # Save local state before Git synchronization.
          save_json(
              MEMORY_FILE,
              communication_memory
          )

          save_json(
              DM_MEMORY_FILE,
              dm_memory
          )


          print("")
          print("==================================================")
          print("ACT02 V12 DECISION")
          print("==================================================")

          print(
              "DM_RESPONSES=",
              dm_responses_sent
          )

          print(
              "COMMENT_RESPONSES=",
              comment_responses_sent
          )

          print(
              "DM MONITOR=CONVERSATIONS"
          )

          print(
              "SINCE=OFF"
          )

          print(
              "GEMINI OFF"
          )

          print(
              "PAYMENTS OFF"
          )

          print(
              "MARKETPLACE OFF"
          )

          print(
              "COST EUR 0"
          )


          # ------------------------------------------------------------
          # SAFE GIT PERSISTENCE
          #
          # Never force push.
          # Never rebase local memory directly.
          # Always start from newest origin/main and merge
          # set-like state into it.
          # ------------------------------------------------------------

          print("")
          print("==================================================")
          print("GIT PERSISTENCE")
          print("==================================================")


          local_communication = (
              communication_memory
          )

          local_dm = dm_memory


          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  text=True,
                  capture_output=True,
              )


          def load_remote_memory(path):
              return load_json(
                  path,
                  {}
              )


          def merge_memory(
              remote,
              local,
              set_fields,
          ):
              if not isinstance(
                  remote,
                  dict
              ):
                  remote = {}

              if not isinstance(
                  local,
                  dict
              ):
                  local = {}

              merged = dict(remote)

              for key, value in local.items():

                  if key in set_fields:

                      remote_values = set(
                          remote.get(
                              key,
                              []
                          )
                          or []
                      )

                      local_values = set(
                          value
                          or []
                      )

                      merged[key] = sorted(
                          remote_values
                          | local_values
                      )

                  elif key == "responses":

                      existing = (
                          remote.get(
                              "responses",
                              []
                          )
                          or []
                      )

                      additions = (
                          value
                          or []
                      )

                      seen = set()

                      combined = []

                      for item in (
                          existing
                          + additions
                      ):

                          try:
                              marker = json.dumps(
                                  item,
                                  sort_keys=True,
                                  ensure_ascii=False,
                              )
                          except Exception:
                              marker = str(item)

                          if marker in seen:
                              continue

                          seen.add(marker)
                          combined.append(item)

                      merged[
                          "responses"
                      ] = combined

                  else:
                      merged[key] = value

              return merged


          set_fields_communication = {
              "responded_comment_ids",
              "duplicate_blocked_comment_ids",
          }

          set_fields_dm = {
              "processed_message_ids",
              "responded_message_ids",
          }


          git_success = False


          for attempt in range(1, 6):

              print(
                  "GIT ATTEMPT",
                  attempt
              )

              fetch = git(
                  "fetch",
                  "origin",
                  "main",
              )

              if fetch.returncode != 0:
                  print(
                      fetch.stdout,
                      fetch.stderr
                  )
                  time.sleep(2)
                  continue


              reset = git(
                  "reset",
                  "--hard",
                  "origin/main",
              )

              if reset.returncode != 0:
                  print(
                      reset.stdout,
                      reset.stderr
                  )
                  time.sleep(2)
                  continue


              remote_communication = (
                  load_remote_memory(
                      MEMORY_FILE
                  )
              )

              remote_dm = (
                  load_remote_memory(
                      DM_MEMORY_FILE
                  )
              )


              merged_communication = (
                  merge_memory(
                      remote_communication,
                      local_communication,
                      set_fields_communication,
                  )
              )

              merged_dm = (
                  merge_memory(
                      remote_dm,
                      local_dm,
                      set_fields_dm,
                  )
              )


              save_json(
                  MEMORY_FILE,
                  merged_communication
              )

              save_json(
                  DM_MEMORY_FILE,
                  merged_dm
              )


              add = git(
                  "add",
                  str(MEMORY_FILE),
                  str(DM_MEMORY_FILE),
              )

              if add.returncode != 0:
                  print(
                      add.stdout,
                      add.stderr
                  )
                  time.sleep(2)
                  continue


              status = git(
                  "status",
                  "--porcelain",
              )

              if not status.stdout.strip():
                  print(
                      "GIT: NO CHANGES"
                  )
                  git_success = True
                  break


              commit = git(
                  "commit",
                  "-m",
                  "ACT02 V12: direct conversation DM monitor",
              )

              if commit.returncode != 0:
                  print(
                      commit.stdout,
                      commit.stderr
                  )
                  time.sleep(2)
                  continue


              push = git(
                  "push",
                  "origin",
                  "HEAD:main",
              )

              if push.returncode == 0:
                  print(
                      "GIT PUSH SUCCESS"
                  )
                  git_success = True
                  break


              print(
                  "GIT PUSH RETRY",
                  push.stderr[-1000:]
              )

              time.sleep(2)


          if not git_success:
              raise SystemExit(
                  "GIT PERSISTENCE FAILED AFTER 5 ATTEMPTS"
              )


          print("")
          print("==================================================")
          print("ACT02 V12 COMMUNICATION COMPLETE")
          print("==================================================")
          PY
