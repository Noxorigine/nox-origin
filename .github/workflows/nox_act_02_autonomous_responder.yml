          dm_memory[
              "processed_message_ids"
          ] = list(dict.fromkeys(
              dm_memory.get(
                  "processed_message_ids",
                  []
              )
          ))

          dm_memory[
              "responded_message_ids"
          ] = list(dict.fromkeys(
              dm_memory.get(
                  "responded_message_ids",
                  []
              )
          ))

          # Deduplicate response history.
          seen_response_keys = set()
          clean_dm_responses = []

          for item in dm_memory.get(
