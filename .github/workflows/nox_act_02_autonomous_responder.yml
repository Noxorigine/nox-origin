name: NØX ACT 02 V13.1 - DM Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: nox-act02-dm-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose-dm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnose private messages
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              print("ERROR: COLONY_API_KEY is missing")
              sys.exit(1)

          def request_json(method, path, payload=None, token=None):
              url = BASE + path

              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "NOX-ACT02-V13.1-DM-DIAGNOSTIC",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      status = response.status

                      try:
                          parsed = json.loads(raw)
                      except Exception:
                          parsed = raw

                      return status, parsed

              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")

                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = raw

                  return error.code, parsed

              except Exception as error:
                  print(f"REQUEST ERROR: {type(error).__name__}: {error}")
                  return 0, None

          def pretty(value):
              try:
                  return json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False
                  )
              except Exception:
                  return repr(value)

          print("=" * 80)
          print("NØX ACT 02 V13.1 - DM DIAGNOSTIC")
          print("MODE: READ ONLY")
          print("NO DM SEND")
          print("NO COMMENT SEND")
          print("NO MEMORY WRITE")
          print("=" * 80)

          # ================================================================
          # AUTH
          # ================================================================

          print()
          print("AUTHENTICATION")

          auth_status, auth_data = request_json(
              "POST",
              "/auth/token",
              {"api_key": API_KEY},
          )

          print(f"AUTH STATUS: {auth_status}")

          if auth_status not in (200, 201):
              print("AUTH RESPONSE:")
              print(pretty(auth_data))
              sys.exit(1)

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              print("ERROR: No access token found")
              print(pretty(auth_data))
              sys.exit(1)

          print("JWT TOKEN: FOUND")

          # ================================================================
          # IDENTITY
          # ================================================================

          print()
          print("IDENTITY")

          identity_status, identity = request_json(
              "GET",
              "/users/me",
              token=token,
          )

          print(f"IDENTITY STATUS: {identity_status}")

          if identity_status != 200:
              print(pretty(identity))
              sys.exit(1)

          username = (
              identity.get("username")
              or identity.get("handle")
              or (
                  identity.get("user", {}).get("username")
                  if isinstance(identity.get("user"), dict)
                  else None
              )
          )

          print(f"NØX USERNAME: {username}")

          if not username:
              print("ERROR: Unable to determine NØX username")
              print(pretty(identity))
              sys.exit(1)

          # ================================================================
          # CONVERSATIONS
          # ================================================================

          print()
          print("=" * 80)
          print("CONVERSATIONS")
          print("=" * 80)

          conversation_status, conversation_data = request_json(
              "GET",
              "/messages/conversations",
              token=token,
          )

          print(f"CONVERSATIONS STATUS: {conversation_status}")

          if conversation_status != 200:
              print(pretty(conversation_data))
              sys.exit(1)

          print()
          print("RAW CONVERSATION RESPONSE:")
          print(pretty(conversation_data))

          if isinstance(conversation_data, list):
              conversations = conversation_data

          elif isinstance(conversation_data, dict):
              conversations = (
                  conversation_data.get("conversations")
                  or conversation_data.get("items")
                  or conversation_data.get("data")
                  or []
              )

          else:
              conversations = []

          print()
          print(f"CONVERSATIONS DETECTED: {len(conversations)}")

          if not conversations:
              print("NO CONVERSATIONS FOUND")
              sys.exit(0)

          # ================================================================
          # EACH CONVERSATION
          # ================================================================

          for index, conversation in enumerate(conversations, 1):

              print()
              print("#" * 80)
              print(f"CONVERSATION {index}/{len(conversations)}")
              print("#" * 80)

              print("RAW CONVERSATION:")
              print(pretty(conversation))

              if not isinstance(conversation, dict):
                  print("SKIPPED: conversation is not an object")
                  continue

              other_username = (
                  conversation.get("username")
                  or conversation.get("other_username")
                  or conversation.get("participant_username")
                  or (
                      conversation.get("user", {}).get("username")
                      if isinstance(conversation.get("user"), dict)
                      else None
                  )
                  or (
                      conversation.get("participant", {}).get("username")
                      if isinstance(conversation.get("participant"), dict)
                      else None
                  )
              )

              print()
              print(f"RESOLVED USERNAME: {other_username}")

              if not other_username:
                  print("WARNING: Could not resolve username")
                  continue

              encoded_username = urllib.parse.quote(
                  str(other_username),
                  safe=""
              )

              path = f"/messages/conversations/{encoded_username}"

              print()
              print(f"THREAD REQUEST: {path}")

              thread_status, thread_data = request_json(
                  "GET",
                  path,
                  token=token,
              )

              print(f"THREAD STATUS: {thread_status}")

              if thread_status != 200:
                  print("THREAD RESPONSE:")
                  print(pretty(thread_data))
                  continue

              print()
              print("RAW THREAD RESPONSE:")
              print(pretty(thread_data))

              if isinstance(thread_data, list):
                  messages = thread_data

              elif isinstance(thread_data, dict):
                  messages = (
                      thread_data.get("messages")
                      or thread_data.get("items")
                      or thread_data.get("data")
                      or []
                  )

              else:
                  messages = []

              print()
              print(f"MESSAGES DETECTED: {len(messages)}")

              if not messages:
                  continue

              # ============================================================
              # MESSAGE ANALYSIS
              # ============================================================

              for message_index, message in enumerate(messages, 1):

                  print()
                  print("-" * 80)
                  print(
                      f"MESSAGE {message_index}/{len(messages)}"
                  )
                  print("-" * 80)

                  if not isinstance(message, dict):
                      print("NON-OBJECT MESSAGE:")
                      print(repr(message))
                      continue

                  message_id = (
                      message.get("id")
                      or message.get("message_id")
                      or message.get("uuid")
                  )

                  sender = (
                      message.get("sender_username")
                      or message.get("sender")
                      or message.get("from_username")
                      or message.get("from")
                  )

                  if isinstance(sender, dict):
                      sender = sender.get("username")

                  recipient = (
                      message.get("recipient_username")
                      or message.get("recipient")
                      or message.get("to_username")
                      or message.get("to")
                  )

                  if isinstance(recipient, dict):
                      recipient = recipient.get("username")

                  created_at = (
                      message.get("created_at")
                      or message.get("timestamp")
                      or message.get("sent_at")
                      or message.get("date")
                  )

                  body = (
                      message.get("content")
                      or message.get("body")
                      or message.get("text")
                      or message.get("message")
                      or ""
                  )

                  body_text = str(body).replace("\n", " ")

                  from_nox = (
                      str(sender).lower() == str(username).lower()
                      if sender is not None
                      else False
                  )

                  from_other = not from_nox

                  is_test_message = (
                      "Salut NØX. Je veux tester ton nouveau système"
                      in body_text
                  )

                  print(f"ID           : {message_id}")
                  print(f"SENDER       : {sender}")
                  print(f"RECIPIENT    : {recipient}")
                  print(f"CREATED_AT   : {created_at}")
                  print(f"FROM_NØX     : {from_nox}")
                  print(f"FROM_OTHER   : {from_other}")
                  print(f"TEST_MESSAGE : {is_test_message}")
                  print(f"BODY         : {body_text}")

                  print()
                  print("RAW MESSAGE OBJECT:")
                  print(pretty(message))

              # ============================================================
              # LATEST MESSAGE
              # ============================================================

              print()
              print("=" * 80)
              print("LATEST MESSAGE")
              print("=" * 80)

              print(pretty(messages[-1]))

          # ================================================================
          # END
          # ================================================================

          print()
          print("=" * 80)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 80)
          print("READ ONLY: YES")
          print("DM SENT: NO")
          print("COMMENT SENT: NO")
          print("MEMORY MODIFIED: NO")
          print("=" * 80)
          PY
