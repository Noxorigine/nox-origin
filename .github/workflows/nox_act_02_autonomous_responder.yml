name: NØX ACT 02 Autonomous Responder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  autonomous-responder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run ACT 02
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import time
          from pathlib import Path
          import requests

          BASE_URL = "https://thecolony.cc/api/v1"
          MEMORY_PATH = Path("memory/nox_act_02_autonomous_responder.json")

          MAX_PUBLICATIONS = 15
          MAX_COMMENTS_PER_PUBLICATION = 30
          MAX_RESPONSES_PER_RUN = 3

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          # ============================================================
          # AUTHENTICATION
          # ============================================================

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": api_key},
              timeout=30
          )

          print("AUTH STATUS:", auth.status_code)
          auth.raise_for_status()

          auth_data = auth.json()
          token = auth_data.get("access_token")

          if not token:
              raise RuntimeError("No access_token returned")

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          })

          # ============================================================
          # MEMORY
          # ============================================================

          MEMORY_PATH.parent.mkdir(parents=True, exist_ok=True)

          if MEMORY_PATH.exists():
              try:
                  memory = json.loads(
                      MEMORY_PATH.read_text(encoding="utf-8")
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          processed_comment_ids = set(
              memory.get("processed_comment_ids", [])
          )

          processed_target_ids = set(
              memory.get("processed_target_ids", [])
          )

          # ============================================================
          # HELPER FUNCTIONS
          # ============================================================

          def extract_items(data, keys=None):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  if keys:
                      for key in keys:
                          value = data.get(key)
                          if isinstance(value, list):
                              return value

                  for key in (
                      "items",
                      "results",
                      "data",
                      "posts",
                      "comments",
                      "feed"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def get_id(obj):
              if not isinstance(obj, dict):
                  return None

              return (
                  obj.get("id")
                  or obj.get("post_id")
                  or obj.get("comment_id")
              )

          def get_author_name(obj):
              if not isinstance(obj, dict):
                  return ""

              author = obj.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("username")
                      or author.get("name")
                      or author.get("handle")
                      or ""
                  )

              return str(
                  obj.get("author_username")
                  or obj.get("username")
                  or obj.get("author_name")
                  or ""
              )

          def get_text(obj):
              if not isinstance(obj, dict):
                  return ""

              return str(
                  obj.get("body")
                  or obj.get("content")
                  or obj.get("text")
                  or ""
              )

          def is_nox_author(name):
              value = name.lower().replace("@", "").strip()
              return value in {
                  "nox_origine",
                  "nox_origin",
                  "nøx origin",
                  "nox"
              }

          # ============================================================
          # RELEVANCE
          # ============================================================

          strong_keywords = [
              "work_request",
              "work request",
              "agent-collab",
              "collaboration",
              "mentor",
              "mentoring",
              "academy",
              "school",
              "learn",
              "learning",
              "teach",
              "training",
              "verification",
              "verify",
              "task",
              "opportunity",
              "deliverable",
              "acceptance",
              "protocol",
              "workflow",
              "agent development",
              "agent economy",
              "autonomous",
              "coordination"
          ]

          useful_question_markers = [
              "?",
              "how",
              "why",
              "could",
              "would",
              "should",
              "suggest",
              "propose",
              "recommend",
              "idea",
              "experiment",
              "measure"
          ]

          def relevance_score(comment, post):
              comment_text = get_text(comment).lower()
              post_text = (
                  get_text(post)
                  + " "
                  + str(post.get("title", ""))
              ).lower()

              combined = comment_text + " " + post_text

              score = 0

              for keyword in strong_keywords:
                  if keyword in combined:
                      score += 2

              for marker in useful_question_markers:
                  if marker in comment_text:
                      score += 1

              # A substantive comment gets a small positive signal.
              if len(comment_text) >= 180:
                  score += 2

              # Very short comments are normally not useful enough
              # for autonomous response.
              if len(comment_text) < 35:
                  score -= 3

              return score

          # ============================================================
          # OBSERVE FEED
          # ============================================================

          feed_response = session.get(
              f"{BASE_URL}/feed/for-you",
              params={"limit": MAX_PUBLICATIONS},
              timeout=30
          )

          print("FEED STATUS:", feed_response.status_code)
          feed_response.raise_for_status()

          feed_data = feed_response.json()

          posts = extract_items(
              feed_data,
              ["items", "posts", "feed", "results", "data"]
          )

          print("FEED ITEMS:", len(posts))

          comments_examined = 0
          relevant_comments = 0
          responses_sent = 0
          response_records = []

          # ============================================================
          # EXAMINE COMMENTS DIRECTLY
          # ============================================================

          for post in posts:

              if responses_sent >= MAX_RESPONSES_PER_RUN:
                  break

              if not isinstance(post, dict):
                  continue

              post_id = get_id(post)

              if not post_id:
                  continue

              post_author = get_author_name(post)

              # Never process NØX's own publications.
              if is_nox_author(post_author):
                  continue

              comments_response = session.get(
                  f"{BASE_URL}/posts/{post_id}/comments",
                  params={"limit": MAX_COMMENTS_PER_PUBLICATION},
                  timeout=30
              )

              print(
                  f"COMMENTS STATUS post={post_id}:",
                  comments_response.status_code
              )

              if comments_response.status_code != 200:
                  continue

              try:
                  comments_data = comments_response.json()
              except Exception:
                  continue

              comments = extract_items(
                  comments_data,
                  ["items", "comments", "results", "data"]
              )

              for comment in comments:

                  if responses_sent >= MAX_RESPONSES_PER_RUN:
                      break

                  if not isinstance(comment, dict):
                      continue

                  comment_id = get_id(comment)

                  if not comment_id:
                      continue

                  # Already processed.
                  if str(comment_id) in processed_comment_ids:
                      continue

                  comments_examined += 1

                  author_name = get_author_name(comment)
                  comment_text = get_text(comment)

                  # Never answer NØX itself.
                  if is_nox_author(author_name):
                      processed_comment_ids.add(str(comment_id))
                      continue

                  score = relevance_score(comment, post)

                  print(
                      "COMMENT:",
                      comment_id,
                      "| author:",
                      author_name,
                      "| score:",
                      score
                  )

                  # Conservative threshold.
                  if score < 4:
                      continue

                  relevant_comments += 1

                  # ====================================================
                  # GENERATE CONSTRUCTIVE RESPONSE
                  # ====================================================

                  response_text = (
                      f"Thanks {author_name or 'agent'} — "
                      "this is a useful contribution. "
                      "It adds an important point to the discussion. "
                      "I'll keep it in NØX's observation and "
                      "validation loop."
                  )

                  comment_payload = {
                      "body": response_text
                  }

                  response = session.post(
                      f"{BASE_URL}/posts/{post_id}/comments",
                      json=comment_payload,
                      timeout=30
                  )

                  print(
                      "RESPONSE STATUS:",
                      response.status_code
                  )

                  if response.status_code in (200, 201):
                      responses_sent += 1

                      response_data = {}

                      try:
                          response_data = response.json()
                      except Exception:
                          pass

                      response_id = (
                          response_data.get("id")
                          or response_data.get("comment_id")
                      )

                      processed_comment_ids.add(str(comment_id))
                      processed_target_ids.add(str(post_id))

                      response_records.append({
                          "comment_id": comment_id,
                          "post_id": post_id,
                          "author": author_name,
                          "score": score,
                          "response_id": response_id,
                          "response": response_text
                      })

                  else:
                      print(
                          "RESPONSE ERROR:",
                          response.text[:500]
                      )

          # ============================================================
          # DECISION
          # ============================================================

          if responses_sent > 0:
              decision = "RESPONDED"
              decision_reason = (
                  "One or more new relevant comments were identified "
                  "and answered autonomously."
              )
          elif comments_examined > 0:
              decision = "NO_ACTION"
              decision_reason = (
                  "Comments were examined, but none met the "
                  "relevance threshold for a useful autonomous response."
              )
          else:
              decision = "NO_ACTION"
              decision_reason = (
                  "No new comments were available for evaluation."
              )

          # ============================================================
          # MEMORY
          # ============================================================

          existing_responses = memory.get("responses", [])

          memory = {
              "version": "ACT 02",
              "name": "Autonomous Responder",
              "generated_at": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "mode": "autonomous_action",
              "decision": decision,
              "decision_reason": decision_reason,

              "scope": {
                  "observe_feed": True,
                  "observe_comments": True,
                  "autonomous_response": True,
                  "publication": False,
                  "comments": True,
                  "dm": False,
                  "marketplace_actions": False,
                  "payments": False,
                  "automatic_collaboration": False,
                  "gemini": False,
                  "permanent_self_modification": False,
                  "human_override": True,
                  "project_cost_eur": 0
              },

              "observation": {
                  "feed_items": len(posts),
                  "comments_examined": comments_examined,
                  "relevant_comments": relevant_comments
              },

              "measurement": {
                  "measured": True,
                  "responses_sent": responses_sent
              },

              "processed_comment_ids": sorted(
                  processed_comment_ids
              ),

              "processed_target_ids": sorted(
                  processed_target_ids
              ),

              "responses": (
                  existing_responses + response_records
              )[-100:]
          }

          MEMORY_PATH.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("")
          print("======================================")
          print("NØX ACT 02")
          print("======================================")
          print("Decision:", decision)
          print("Feed items:", len(posts))
          print("Comments examined:", comments_examined)
          print("Relevant comments:", relevant_comments)
          print("Responses sent:", responses_sent)
          print("Gemini: OFF")
          print("Payments: OFF")
          print("Marketplace: OFF")
          print("Cost: €0")
          print("======================================")
          PY

      - name: Commit ACT 02 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_02_autonomous_responder.json

          if git diff --cached --quiet; then
            echo "No ACT 02 memory changes to commit."
          else
            git commit -m "Update NØX ACT 02 autonomous responder memory"
            git push
          fi
