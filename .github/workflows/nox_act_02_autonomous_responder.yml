name: NØX ACT 02 V14 - Cognitive Communication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Diagnose latest Romu messages
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/diag.py <<'PY'
          import os
          import requests

          BASE = os.environ["COLONY_BASE_URL"]
          API_KEY = os.environ["COLONY_API_KEY"]

          auth = requests.post(
              f"{BASE}/api/v1/auth/token",
              json={"api_key": API_KEY},
              timeout=20,
          )
          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }

          me = requests.get(
              f"{BASE}/api/v1/users/me",
              headers=headers,
              timeout=20,
          )
          me.raise_for_status()

          me_data = me.json()
          print("NØX username:", me_data.get("username"))

          r = requests.get(
              f"{BASE}/api/v1/messages/conversations/Romu",
              headers=headers,
              timeout=20,
          )
          r.raise_for_status()

          data = r.json()

          if isinstance(data, dict):
              messages = (
                  data.get("messages")
                  or data.get("items")
                  or data.get("data")
                  or []
              )
          else:
              messages = data if isinstance(data, list) else []

          print("Total messages:", len(messages))
          print("=== LAST 5 ===")

          for msg in messages[-5:]:
              sender = msg.get("sender") or {}
              recipient = msg.get("recipient") or {}

              if isinstance(sender, dict):
                  sender_name = sender.get("username")
              else:
                  sender_name = str(sender)

              if isinstance(recipient, dict):
                  recipient_name = recipient.get("username")
              else:
                  recipient_name = str(recipient)

              print(
                  f"ID={msg.get('id')} | "
                  f"SENDER={sender_name} | "
                  f"RECIPIENT={recipient_name} | "
                  f"DATE={msg.get('created_at')} | "
                  f"BODY={msg.get('body')}"
              )
          PY

          python /tmp/diag.py
