name: NØX V81 — Adaptive Action Prioritization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v81-adaptive-action-prioritization
  cancel-in-progress: false

jobs:
  adaptive-action-prioritization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V81
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          TIMEOUT = 20

          FALLBACK_ID = "442104b5-eee0-4f73-b452-08f258a21ea2"
          FALLBACK_USERNAME = "nox_origine"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              p = Path(path)

              if not p.exists():
                  return {}

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def api_request(
              method,
              path,
              token=None,
              params=None,
              payload=None
          ):
              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = (
                      f"Bearer {token}"
                  )

              if payload is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  params=params,
                  json=payload,
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              if not response.content:
                  return {}

              return response.json()

          def as_list(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in [
                      "items",
                      "results",
                      "data",
                      "posts",
                      "suggestions",
                      "opportunities"
                  ]:
                      if isinstance(
                          value.get(key),
                          list
                      ):
                          return value[key]

              return []

          def post_id(item):
              if not isinstance(item, dict):
                  return None

              for key in [
                  "post_id",
                  "id",
                  "postId"
              ]:
                  if item.get(key):
                      return str(item[key])

              return None

          def author(item):
              if not isinstance(item, dict):
                  return {}

              value = item.get(
                  "author"
              )

              if isinstance(value, dict):
                  return value

              return {
                  "id": item.get("author_id"),
                  "username": (
                      item.get("author_username")
                      or item.get("username")
                  )
              }

          def body(item):
              if not isinstance(item, dict):
                  return ""

              values = [
                  item.get("body"),
                  item.get("content"),
                  item.get("text"),
                  item.get("description")
              ]

              return " ".join(
                  str(x)
                  for x in values
                  if x
              ).strip()

          def title(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("title")
                  or ""
              ).strip()

          def post_type(item):
              if not isinstance(item, dict):
                  return ""

              return str(
                  item.get("post_type")
                  or item.get("type")
                  or ""
              ).lower()

          def is_nox(item, me):
              a = author(item)

              aid = str(
                  a.get("id")
                  or ""
              ).lower()

              username = str(
                  a.get("username")
                  or ""
              ).lower()

              my_id = str(
                  me.get("id")
                  or FALLBACK_ID
              ).lower()

              my_username = str(
                  me.get("username")
                  or FALLBACK_USERNAME
              ).lower()

              return (
                  aid == my_id
                  or aid == FALLBACK_ID.lower()
                  or username == my_username
                  or username == FALLBACK_USERNAME
              )

          def text(item):
              return (
                  title(item)
                  + " "
                  + body(item)
              ).lower()

          def contains_any(
              value,
              terms
          ):
              return any(
                  term in value
                  for term in terms
              )

          print(
              "Starting NØX V81"
          )
          print(
              "Mode: adaptive action prioritization"
          )

          # ------------------------------------------------------------
          # Authentication
          # ------------------------------------------------------------

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          token_response = requests.post(
              BASE + "/auth/token",
              json={
                  "api_key": api_key
              },
              headers={
                  "Accept": "application/json"
              },
              timeout=TIMEOUT
          )

          token_response.raise_for_status()

          token_data = token_response.json()

          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "JWT access_token missing"
              )

          print(
              "JWT authentication: OK"
          )

          # ------------------------------------------------------------
          # Canonical identity
          # ------------------------------------------------------------

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          print(
              "NØX identity:",
              me.get("username")
              or FALLBACK_USERNAME
          )

          # ------------------------------------------------------------
          # Load learning chain
          # ------------------------------------------------------------

          v75 = load_json(
              "memory/nox_v75_evidence_weighted_opportunity_detector.json"
          )

          v76 = load_json(
              "memory/nox_v76_contextual_opportunity_verifier.json"
          )

          v77 = load_json(
              "memory/nox_v77_action_readiness_engine.json"
          )

          v79 = load_json(
              "memory/nox_v79_action_result_learning.json"
          )

          v80 = load_json(
              "memory/nox_v80_adaptive_decision_learning.json"
          )

          print(
              "Learning chain loaded:",
              bool(v75),
              bool(v76),
              bool(v77),
              bool(v79),
              bool(v80)
          )

          # ------------------------------------------------------------
          # Read V80 adaptation
          # ------------------------------------------------------------

          v80_adaptation = v80.get(
              "adaptation",
              {}
          )

          adaptation_direction = (
              v80_adaptation.get(
                  "direction"
              )
              or "NO_CHANGE"
          )

          adaptation_score = float(
              v80_adaptation.get(
                  "score",
                  0
              )
              or 0
          )

          outcome_status = (
              v80.get(
                  "observed_outcome",
                  {}
              ).get(
                  "status"
              )
              or v80.get(
                  "outcome",
                  {}
              ).get(
                  "status"
              )
              or "UNKNOWN"
          )

          # ------------------------------------------------------------
          # Derive adaptive modifiers
          # ------------------------------------------------------------

          if adaptation_direction == "INCREASE_PRIORITY":
              history_modifier = 15

          elif adaptation_direction == "MAINTAIN_WITH_CAUTION":
              history_modifier = 5

          elif adaptation_direction == "MAINTAIN_AND_OBSERVE":
              history_modifier = 2

          elif adaptation_direction == "DECREASE_PRIORITY":
              history_modifier = -15

          else:
              history_modifier = 0

          # ------------------------------------------------------------
          # Fetch current personalized feed
          # ------------------------------------------------------------

          feed = api_request(
              "GET",
              "/feed/for-you",
              token=token,
              params={
                  "limit": 7
              }
          )

          feed_items = as_list(
              feed
          )

          print(
              "Personalized feed items:",
              len(feed_items)
          )

          # ------------------------------------------------------------
          # Fetch suggestions
          # ------------------------------------------------------------

          suggestions = api_request(
              "GET",
              "/suggestions",
              token=token,
              params={
                  "limit": 10
              }
          )

          suggestion_items = as_list(
              suggestions
          )

          print(
              "Suggestion items:",
              len(suggestion_items)
          )

          # ------------------------------------------------------------
          # Fetch public recent posts.
          #
          # Keep the request deliberately small because list endpoints
          # can become expensive with large payloads.
          # ------------------------------------------------------------

          public_response = api_request(
              "GET",
              "/posts",
              token=token,
              params={
                  "limit": 10
              }
          )

          public_items = as_list(
              public_response
          )

          print(
              "Public posts:",
              len(public_items)
          )

          # ------------------------------------------------------------
          # Merge and deduplicate
          # ------------------------------------------------------------

          candidates = {}

          for item in (
              feed_items
              + public_items
          ):
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              pid = post_id(
                  item
              )

              if not pid:
                  continue

              if is_nox(
                  item,
                  me
              ):
                  continue

              candidates[pid] = item

          print(
              "Unique candidate posts:",
              len(candidates)
          )

          # ------------------------------------------------------------
          # Build opportunity candidates
          # ------------------------------------------------------------

          explicit_request_terms = [
              "i need",
              "we need",
              "looking for",
              "need someone",
              "seeking",
              "wanted",
              "request",
              "hire",
              "hiring",
              "can someone",
              "who can"
          ]

          delegation_terms = [
              "please build",
              "please fix",
              "please create",
              "please audit",
              "please research",
              "can you build",
              "can you fix",
              "can you create",
              "need someone to",
              "looking for someone to"
          ]

          deliverable_terms = [
              "deliverable",
              "submit",
              "send",
              "provide",
              "repository",
              "report",
              "file",
              "implementation",
              "prototype",
              "script",
              "video"
          ]

          acceptance_terms = [
              "acceptance criteria",
              "must include",
              "requirements",
              "criteria",
              "proof",
              "verification"
          ]

          reward_terms = [
              "reward",
              "paid",
              "payment",
              "pay",
              "bounty",
              "sats",
              "bitcoin",
              "btc",
              "usdc",
              "usd"
          ]

          deadline_terms = [
              "deadline",
              "due",
              "by tomorrow",
              "by friday",
              "within",
              "before"
          ]

          application_terms = [
              "apply",
              "application",
              "comment to apply",
              "dm me",
              "send me",
              "reply here"
          ]

          analysis_terms = [
              "analysis",
              "finding",
              "i built",
              "i created",
              "i tested",
              "results show",
              "here is what i learned"
          ]

          completed_terms = [
              "completed",
              "finished",
              "done",
              "successfully completed",
              "already built",
              "already fixed",
              "delivered"
          ]

          opportunity_candidates = []

          for pid, item in candidates.items():

              t = text(item)

              score = 0
              evidence = []

              if contains_any(
                  t,
                  explicit_request_terms
              ):
                  score += 30
                  evidence.append(
                      "EXPLICIT_REQUEST"
                  )

              if contains_any(
                  t,
                  delegation_terms
              ):
                  score += 20
                  evidence.append(
                      "DELEGATION"
                  )

              if contains_any(
                  t,
                  deliverable_terms
              ):
                  score += 12
                  evidence.append(
                      "DELIVERABLE"
                  )

              if contains_any(
                  t,
                  acceptance_terms
              ):
                  score += 12
                  evidence.append(
                      "ACCEPTANCE"
                  )

              if contains_any(
                  t,
                  reward_terms
              ):
                  score += 10
                  evidence.append(
                      "REWARD"
                  )

              if contains_any(
                  t,
                  deadline_terms
              ):
                  score += 5
                  evidence.append(
                      "DEADLINE"
                  )

              if contains_any(
                  t,
                  application_terms
              ):
                  score += 8
                  evidence.append(
                      "APPLICATION_ROUTE"
                  )

              if contains_any(
                  t,
                  completed_terms
              ):
                  score -= 30
                  evidence.append(
                      "COMPLETION_SIGNAL"
                  )

              if (
                  contains_any(
                      t,
                      analysis_terms
                  )
                  and not contains_any(
                      t,
                      delegation_terms
                  )
              ):
                  score -= 20
                  evidence.append(
                      "ANALYSIS_OR_FINDING"
                  )

              # --------------------------------------------------------
              # Adaptive learning modifier
              #
              # V80 modifies priority only. It does not override
              # evidence quality.
              # --------------------------------------------------------

              adjusted_score = (
                  score
                  + history_modifier
              )

              # --------------------------------------------------------
              # Quality guard
              # --------------------------------------------------------

              if (
                  "COMPLETION_SIGNAL"
                  in evidence
                  and
                  "EXPLICIT_REQUEST"
                  not in evidence
              ):
                  adjusted_score -= 10

              # --------------------------------------------------------
              # Classification
              # --------------------------------------------------------

              if adjusted_score >= 75:
                  classification = (
                      "HIGH_CONFIDENCE_OPPORTUNITY"
                  )
                  priority = "P1"

              elif adjusted_score >= 55:
                  classification = (
                      "STRONG_OPPORTUNITY_CANDIDATE"
                  )
                  priority = "P2"

              elif adjusted_score >= 35:
                  classification = (
                      "CONTEXTUAL_OPPORTUNITY"
                  )
                  priority = "P3"

              else:
                  classification = (
                      "LOW_PRIORITY_SIGNAL"
                  )
                  priority = "P4"

              # --------------------------------------------------------
              # Recommended action
              # --------------------------------------------------------

              if (
                  classification
                  == "HIGH_CONFIDENCE_OPPORTUNITY"
              ):
                  recommended_action = (
                      "VERIFY_AND_PREPARE_ACTION"
                  )

              elif (
                  classification
                  == "STRONG_OPPORTUNITY_CANDIDATE"
              ):
                  recommended_action = (
                      "VERIFY_CONTEXT"
                  )

              elif (
                  classification
                  == "CONTEXTUAL_OPPORTUNITY"
              ):
                  recommended_action = (
                      "OBSERVE_OR_VERIFY"
                  )

              else:
                  recommended_action = (
                      "OBSERVE"
                  )

              opportunity_candidates.append({
                  "post_id": pid,
                  "title": title(item),
                  "author": author(item),
                  "post_type": post_type(item),
                  "base_score": score,
                  "history_modifier": history_modifier,
                  "adaptive_score": adjusted_score,
                  "classification": classification,
                  "priority": priority,
                  "recommended_action": (
                      recommended_action
                  ),
                  "evidence": evidence
              })

          # ------------------------------------------------------------
          # Sort by adaptive score
          # ------------------------------------------------------------

          opportunity_candidates.sort(
              key=lambda x: (
                  -x["adaptive_score"],
                  x["post_id"]
              )
          )

          # Keep a manageable ranked set.
          ranked = opportunity_candidates[:10]

          # ------------------------------------------------------------
          # Suggestions are separate evidence.
          # They do not automatically become opportunities.
          # ------------------------------------------------------------

          suggestion_records = []

          for suggestion in suggestion_items:

              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              suggestion_records.append({
                  "type": (
                      suggestion.get("type")
                      or suggestion.get(
                          "action_type"
                      )
                      or "UNKNOWN"
                  ),
                  "title": (
                      suggestion.get("title")
                      or suggestion.get(
                          "description"
                      )
                      or ""
                  ),
                  "raw": suggestion
              })

          # ------------------------------------------------------------
          # Choose top recommendation
          # ------------------------------------------------------------

          top_candidate = (
              ranked[0]
              if ranked
              else None
          )

          if top_candidate:
              top_recommendation = {
                  "post_id": top_candidate[
                      "post_id"
                  ],
                  "title": top_candidate[
                      "title"
                  ],
                  "priority": top_candidate[
                      "priority"
                  ],
                  "classification": (
                      top_candidate[
                          "classification"
                      ]
                  ),
                  "adaptive_score": (
                      top_candidate[
                          "adaptive_score"
                      ]
                  ),
                  "recommended_action": (
                      top_candidate[
                          "recommended_action"
                      ]
                  )
              }
          else:
              top_recommendation = None

          # ------------------------------------------------------------
          # Determine learning state
          # ------------------------------------------------------------

          strong_count = sum(
              1
              for item in ranked
              if item["priority"] in [
                  "P1",
                  "P2"
              ]
          )

          contextual_count = sum(
              1
              for item in ranked
              if item["priority"] == "P3"
          )

          low_count = sum(
              1
              for item in ranked
              if item["priority"] == "P4"
          )

          if top_candidate:
              decision_status = (
                  "ADAPTIVE_PRIORITY_AVAILABLE"
              )
          else:
              decision_status = (
                  "NO_ACTIONABLE_CANDIDATE"
              )

          # ------------------------------------------------------------
          # Important autonomy boundary
          # ------------------------------------------------------------

          autonomy_policy = {
              "automatic_external_action": False,
              "automatic_application": False,
              "automatic_bidding": False,
              "automatic_dm": False,
              "automatic_payment": False,
              "automatic_rule_deployment": False,
              "automatic_priority_learning": (
                  True
              ),
              "human_review_for_major_rule_change": (
                  True
              )
          }

          # ------------------------------------------------------------
          # Build result
          # ------------------------------------------------------------

          result = {
              "version": "V81",
              "generated_at": now(),
              "mode": (
                  "adaptive_action_prioritization"
              ),
              "agent": {
                  "id": nox_id
                  if (nox_id := (
                      me.get("id")
                      or FALLBACK_ID
                  ))
                  else FALLBACK_ID,
                  "username": (
                      me.get("username")
                      or FALLBACK_USERNAME
                  )
              },
              "inputs": {
                  "V75_loaded": bool(v75),
                  "V76_loaded": bool(v76),
                  "V77_loaded": bool(v77),
                  "V79_loaded": bool(v79),
                  "V80_loaded": bool(v80)
              },
              "learning_context": {
                  "V80_outcome": outcome_status,
                  "V80_adaptation_direction": (
                      adaptation_direction
                  ),
                  "V80_adaptation_score": (
                      adaptation_score
                  ),
                  "history_modifier": (
                      history_modifier
                  )
              },
              "sources": {
                  "personalized_feed_items": len(
                      feed_items
                  ),
                  "suggestion_items": len(
                      suggestion_items
                  ),
                  "public_posts": len(
                      public_items
                  ),
                  "deduplicated_candidate_posts": len(
                      candidates
                  )
              },
              "ranked_opportunities": ranked,
              "top_recommendation": (
                  top_recommendation
              ),
              "summary": {
                  "P1": sum(
                      1
                      for item in ranked
                      if item["priority"] == "P1"
                  ),
                  "P2": sum(
                      1
                      for item in ranked
                      if item["priority"] == "P2"
                  ),
                  "P3": contextual_count,
                  "P4": low_count,
                  "strong_or_better": strong_count
              },
              "suggestions": suggestion_records,
              "learning": {
                  "status": decision_status,
                  "principle": (
                      "Past outcomes may influence future "
                      "priority, but evidence quality remains "
                      "the primary constraint."
                  ),
                  "important_distinction": (
                      "A successful engagement signal does "
                      "not automatically prove a paid opportunity."
                  ),
                  "no_response_rule": (
                      "No response does not automatically "
                      "reduce opportunity quality."
                  ),
                  "retrieval_failure_rule": (
                      "Failed retrieval must not modify "
                      "action quality."
                  )
              },
              "autonomy": {
                  "current_stage": (
                      "ADAPTIVE_ACTION_PRIORITIZATION"
                  ),
                  "previous_stage": (
                      "OUTCOME_BASED_ADAPTATION"
                  ),
                  "next_stage": (
                      "AUTONOMOUS_ACTION_SELECTION"
                  ),
                  "long_term_target": (
                      "V100_AUTONOMOUS_DECISION_MAKING"
                  ),
                  "policy": autonomy_policy
              },
              "regression_cases_preserved": [
                  "V62_GENERIC_DEMAND_FALSE_POSITIVE",
                  "V64_ANALYSIS_FALSE_POSITIVE",
                  "V67_OVER_PRUNING",
                  "V69_TASK_WITHOUT_DEMAND",
                  "V72_INPUT_RECOVERY_FAILURE",
                  "V74_SELF_EVIDENCE_CONTAMINATION",
                  "V79_NO_RESPONSE_IS_NOT_PROOF_OF_FAILURE",
                  "V80_OUTCOME_BASED_ADAPTATION"
              ],
              "answer_status": decision_status,
              "confidence": (
                  0.88
                  if top_candidate
                  and top_candidate[
                      "priority"
                  ] == "P1"
                  else 0.80
                  if top_candidate
                  else 0.62
              )
          }

          # ------------------------------------------------------------
          # Markdown report
          # ------------------------------------------------------------

          md = []

          md.append(
              "# NØX V81 — Adaptive Action Prioritization"
          )
          md.append("")
          md.append(
              f"Generated: {result['generated_at']}"
          )
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Use previous observed outcomes to improve "
              "the prioritization of future opportunities."
          )
          md.append("")
          md.append("## Decision chain")
          md.append("")
          md.append(
              "**V77 decide → V78 act → V79 measure → "
              "V80 learn → V81 prioritize**"
          )
          md.append("")
          md.append("## Adaptive context")
          md.append("")
          md.append(
              f"- Previous outcome: `{outcome_status}`"
          )
          md.append(
              f"- Adaptation direction: "
              f"`{adaptation_direction}`"
          )
          md.append(
              f"- Adaptation score: `{adaptation_score}`"
          )
          md.append(
              f"- History modifier: `{history_modifier}`"
          )
          md.append("")
          md.append("## Sources")
          md.append("")
          md.append(
              f"- Personalized feed: {len(feed_items)}"
          )
          md.append(
              f"- Suggestions: {len(suggestion_items)}"
          )
          md.append(
              f"- Public posts: {len(public_items)}"
          )
          md.append(
              f"- Candidate posts: {len(candidates)}"
          )
          md.append("")
          md.append("## Ranked opportunities")
          md.append("")

          if ranked:
              for index, item in enumerate(
                  ranked,
                  start=1
              ):
                  md.append(
                      f"### {index}. "
                      f"{item['title'] or '(untitled)'}"
                  )
                  md.append("")
                  md.append(
                      f"- Post ID: `{item['post_id']}`"
                  )
                  md.append(
                      f"- Priority: **{item['priority']}**"
                  )
                  md.append(
                      f"- Classification: "
                      f"`{item['classification']}`"
                  )
                  md.append(
                      f"- Base score: "
                      f"`{item['base_score']}`"
                  )
                  md.append(
                      f"- Adaptive score: "
                      f"`{item['adaptive_score']}`"
                  )
                  md.append(
                      f"- Recommended action: "
                      f"`{item['recommended_action']}`"
                  )
                  md.append(
                      "- Evidence: "
                      + (
                          ", ".join(
                              item["evidence"]
                          )
                          if item["evidence"]
                          else "none"
                      )
                  )
                  md.append("")
          else:
              md.append(
                  "No actionable candidate was identified."
              )
              md.append("")

          md.append(
              "## Top recommendation"
          )
          md.append("")

          if top_recommendation:
              md.append(
                  f"- Post ID: "
                  f"`{top_recommendation['post_id']}`"
              )
              md.append(
                  f"- Priority: "
                  f"**{top_recommendation['priority']}**"
              )
              md.append(
                  f"- Adaptive score: "
                  f"`{top_recommendation['adaptive_score']}`"
              )
              md.append(
                  f"- Action: "
                  f"`{top_recommendation['recommended_action']}`"
              )
          else:
              md.append(
                  "No recommendation available."
              )

          md.append("")
          md.append(
              "## Autonomy progression"
          )
          md.append("")
          md.append(
              "V81 introduces adaptive prioritization:"
          )
          md.append("")
          md.append(
              "**past results → priority → future decision**"
          )
          md.append("")
