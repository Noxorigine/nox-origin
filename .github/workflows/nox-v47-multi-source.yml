name: NØX Origin - V47 Multi-Source Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multi-source-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V47
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import requests
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          print("===================================")
          print("NØX ORIGIN V47")
          print("MULTI-SOURCE RESEARCH")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          memory_file = Path("nox_memory.json")
          report_file = Path("V47_MULTI_SOURCE_RESEARCH.md")

          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("question_log", [])
          memory.setdefault("source_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("learning_log", [])

          # --------------------------------------------------
          # FIND OPEN QUESTION
          # --------------------------------------------------

          open_questions = [
              q for q in memory["question_log"]
              if isinstance(q, dict)
              and q.get("status") == "open"
          ]

          if not open_questions:
              raise RuntimeError(
                  "No open curiosity question found."
              )

          question_record = open_questions[-1]

          question = str(
              question_record.get(
                  "question",
                  ""
              )
          ).strip()

          subject = str(
              question_record.get(
                  "subject",
                  ""
              )
          ).strip()

          print("Subject:", subject)
          print("Question:", question)

          # --------------------------------------------------
          # GEMINI
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY is missing."
              )

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }

          def gemini_request(prompt):

              for attempt in range(1, 4):

                  try:

                      response = requests.post(
                          gemini_url,
                          headers=headers,
                          json={
                              "model":
                                  "gemini-3.6-flash",
                              "input":
                                  prompt
                          },
                          timeout=(20, 120)
                      )

                      print(
                          "Gemini status:",
                          response.status_code
                      )

                      if response.status_code == 200:
                          return response.json()

                      if response.status_code in (
                          408,
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt < 3:
                              time.sleep(
                                  attempt * 5
                              )
                              continue

                      raise RuntimeError(
                          "Gemini request failed: "
                          f"{response.status_code} "
                          f"{response.text[:1500]}"
                      )

                  except requests.exceptions.Timeout:

                      print(
                          "Gemini timeout."
                      )

                      if attempt < 3:
                          time.sleep(
                              attempt * 5
                          )
                          continue

                      raise RuntimeError(
                          "Gemini request timed out."
                      )

          def extract_text(result):

              if isinstance(
                  result.get("output_text"),
                  str
              ):
                  return result[
                      "output_text"
                  ].strip()

              text_parts = []

              for step in result.get(
                  "steps",
                  []
              ):

                  if not isinstance(
                      step,
                      dict
                  ):
                      continue

                  if step.get(
                      "type"
                  ) != "model_output":
                      continue

                  for part in step.get(
                      "content",
                      []
                  ):

                      if (
                          isinstance(
                              part,
                              dict
                          )
                          and part.get(
                              "type"
                          ) == "text"
                      ):
                          text_parts.append(
                              str(
                                  part.get(
                                      "text",
                                      ""
                                  )
                              )
                          )

              return "\n".join(
                  text_parts
              ).strip()

          # --------------------------------------------------
          # RESEARCH PLAN
          # --------------------------------------------------

          planning_prompt = f"""
          You are NØX Origin.

          You have an unresolved research question.

          SUBJECT:
          {subject}

          QUESTION:
          {question}

          Design a multi-source research plan.

          NØX must not assume that one source is enough.

          Identify five source categories:

          1. encyclopedia/reference
          2. academic/scientific
          3. institutional
          4. technical
          5. archaeological/historical or domain-specific

          For each category provide one concise search query.

          Also define:

          STRONG_EVIDENCE:
          What would count as strong evidence?

          WEAK_EVIDENCE:
          What would only provide context?

          CONTRADICTION_SIGNAL:
          What would indicate that two sources disagree?

          Return exactly:

          QUERY_1:
          QUERY_2:
          QUERY_3:
          QUERY_4:
          QUERY_5:

          STRONG_EVIDENCE:
          WEAK_EVIDENCE:
          CONTRADICTION_SIGNAL:
          """

          plan_result = gemini_request(
              planning_prompt
          )

          plan = extract_text(
              plan_result
          )

          if not plan:
              raise RuntimeError(
                  "Empty research plan."
              )

          def extract_section(
              text,
              label
          ):

              marker = label + ":"

              if marker not in text:
                  return ""

              after = text.split(
                  marker,
                  1
              )[1]

              next_markers = [
                  "\nQUERY_",
                  "\nSTRONG_EVIDENCE:",
                  "\nWEAK_EVIDENCE:",
                  "\nCONTRADICTION_SIGNAL:"
              ]

              positions = []

              for m in next_markers:

                  position = after.find(m)

                  if position >= 0:
                      positions.append(
                          position
                      )

              if positions:
                  after = after[
                      :min(positions)
                  ]

              return after.strip()

          queries = []

          for i in range(1, 6):

              value = extract_section(
                  plan,
                  f"QUERY_{i}"
              )

              if value:
                  queries.append(value)

          strong_evidence = extract_section(
              plan,
              "STRONG_EVIDENCE"
          )

          weak_evidence = extract_section(
              plan,
              "WEAK_EVIDENCE"
          )

          contradiction_signal = extract_section(
              plan,
              "CONTRADICTION_SIGNAL"
          )

          if not queries:
              raise RuntimeError(
                  "No research queries generated."
              )

          print(
              "Research plan: PASS"
          )

          # --------------------------------------------------
          # SOURCE SEARCH
          # --------------------------------------------------

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Nox-Origin/47 research"
          })

          sources = []

          # 1. Wikipedia
          for query in queries[:1]:

              try:

                  response = session.get(
                      "https://en.wikipedia.org/w/api.php",
                      params={
                          "action": "query",
                          "list": "search",
                          "srsearch": query,
                          "format": "json",
                          "utf8": 1,
                          "srlimit": 3
                      },
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      for item in (
                          response.json()
                          .get("query", {})
                          .get("search", [])
                      ):

                          title = item.get(
                              "title",
                              ""
                          )

                          if title:

                              sources.append({
                                  "category":
                                      "encyclopedia",
                                  "title":
                                      title,
                                  "url":
                                      "https://en.wikipedia.org/wiki/"
                                      + quote(
                                          title.replace(
                                              " ",
                                              "_"
                                          ),
                                          safe="_()"
                                      )
                              })

              except requests.RequestException as exc:

                  print(
                      "Wikipedia search error:",
                      exc
                  )

          # 2. Crossref
          for query in queries[1:2]:

              try:

                  response = session.get(
                      "https://api.crossref.org/works",
                      params={
                          "query.bibliographic":
                              query,
                          "rows": 5
                      },
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      items = (
                          response.json()
                          .get("message", {})
                          .get("items", [])
                      )

                      for item in items:

                          title_list = item.get(
                              "title",
                              []
                          )

                          if not title_list:
                              continue

                          title = title_list[0]

                          url = (
                              item.get(
                                  "URL"
                              )
                              or ""
                          )

                          sources.append({
                              "category":
                                  "academic",
                              "title":
                                  title,
                              "url":
                                  url,
                              "doi":
                                  item.get(
                                      "DOI"
                                  )
                          })

              except requests.RequestException as exc:

                  print(
                      "Crossref search error:",
                      exc
                  )

          # 3. OpenAlex
          for query in queries[2:3]:

              try:

                  response = session.get(
                      "https://api.openalex.org/works",
                      params={
                          "search": query,
                          "per-page": 5
                      },
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      items = (
                          response.json()
                          .get("results", [])
                      )

                      for item in items:

                          title = item.get(
                              "title"
                          )

                          if not title:
                              continue

                          sources.append({
                              "category":
                                  "academic_repository",
                              "title":
                                  title,
                              "url":
                                  item.get(
                                      "id",
                                      ""
                                  ),
                              "doi":
                                  item.get(
                                      "doi"
                                  )
                          })

              except requests.RequestException as exc:

                  print(
                      "OpenAlex search error:",
                      exc
                  )

          # 4. Europe PMC
          for query in queries[3:4]:

              try:

                  response = session.get(
                      "https://www.ebi.ac.uk/europepmc/webservices/rest/search",
                      params={
                          "query": query,
                          "format": "json",
                          "pageSize": 5
                      },
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      items = (
                          response.json()
                          .get("resultList", {})
                          .get("result", [])
                      )

                      for item in items:

                          title = item.get(
                              "title"
                          )

                          if not title:
                              continue

                          sources.append({
                              "category":
                                  "scientific_database",
                              "title":
                                  title,
                              "url":
                                  (
                                      "https://europepmc.org/"
                                      "article/"
                                      + str(
                                          item.get(
                                              "pmcid"
                                              )
                                          or item.get(
                                              "id",
                                              ""
                                          )
                                      )
                                  )
                          })

              except requests.RequestException as exc:

                  print(
                      "Europe PMC search error:",
                      exc
                  )

          # 5. General institutional search
          for query in queries[4:5]:

              try:

                  response = session.get(
                      "https://www.google.com/search",
                      params={
                          "q":
                              query
                              + " site:.edu OR site:.gov OR site:.ac.uk",
                          "num": 5
                      },
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      html = response.text

                      # Keep only a lightweight record
                      # of whether institutional material
                      # was reachable. No scraping of
                      # protected content.

                      if (
                          ".edu" in html
                          or ".gov" in html
                          or ".ac.uk" in html
                      ):

                          sources.append({
                              "category":
                                  "institutional",
                              "title":
                                  "Institutional search signal",
                              "url":
                                  "",
                              "query":
                                  query
                          })

              except requests.RequestException as exc:

                  print(
                      "Institutional search error:",
                      exc
                  )

          # --------------------------------------------------
          # DEDUPLICATION
          # --------------------------------------------------

          unique_sources = []

          seen = set()

          for source in sources:

              key = (
                  source.get("title", ""),
                  source.get("url", "")
              )

              if key in seen:
                  continue

              seen.add(key)

              unique_sources.append(
                  source
              )

          unique_sources = unique_sources[:20]

          print(
              "Sources discovered:",
              len(unique_sources)
          )

          # --------------------------------------------------
          # FETCH LIMITED SOURCE CONTEXT
          # --------------------------------------------------

          enriched_sources = []

          for source in unique_sources:

              url = source.get(
                  "url",
                  ""
              )

              text = ""

              if (
                  url
                  and url.startswith(
                      "https://en.wikipedia.org/"
                  )
              ):

                  try:

                      title = source[
                          "title"
                      ]

                      response = session.get(
                          "https://en.wikipedia.org/w/api.php",
                          params={
                              "action": "query",
                              "prop": "extracts",
                              "explaintext": 1,
                              "exintro": 1,
                              "titles": title,
                              "format": "json",
                              "utf8": 1
                          },
                          timeout=(10, 30)
                      )

                      if response.status_code == 200:

                          pages = (
                              response.json()
                              .get("query", {})
                              .get("pages", {})
                          )

                          for page in pages.values():

                              text = str(
                                  page.get(
                                      "extract",
                                      ""
                                  )
                              ).strip()

                              break

                  except requests.RequestException:
                      pass

              enriched_sources.append({
                  **source,
                  "context_available":
                      bool(text),
                  "context":
                      text[:3500]
              })

          # --------------------------------------------------
          # SOURCE INTELLIGENCE
          # --------------------------------------------------

          source_context = ""

          for i, source in enumerate(
              enriched_sources,
              start=1
          ):

              source_context += (
                  f"\nSOURCE {i}\n"
                  f"CATEGORY: "
                  f"{source.get('category')}\n"
                  f"TITLE: "
                  f"{source.get('title')}\n"
                  f"URL: "
                  f"{source.get('url')}\n"
                  f"CONTEXT AVAILABLE: "
                  f"{source.get('context_available')}\n"
                  f"CONTEXT:\n"
                  f"{source.get('context', '')}\n"
              )

          analysis_prompt = f"""
          You are NØX Origin.

          Research question:

          {question}

          Research strategy:

          {plan}

          Evidence criteria:

          STRONG:
          {strong_evidence}

          WEAK:
          {weak_evidence}

          CONTRADICTION SIGNAL:
          {contradiction_signal}

          Discovered sources:

          {source_context}

          Analyze the available material conservatively.

          Do NOT invent information from source titles.

          Separate:

          1. evidence actually supported by retrieved context;
          2. contextual information;
          3. claims requiring direct source verification;
          4. contradictions;
          5. important missing evidence.

          Also evaluate the source diversity.

          Return exactly:

          EVIDENCE:
          What is directly supported.

          CONTEXT:
          What is useful background only.

          UNVERIFIED:
          What cannot yet be established.

          AGREEMENTS:
          Important points that appear consistent.

          CONTRADICTIONS:
          Important disagreements or possible conflicts.

          SOURCE_DIVERSITY:
          Evaluate whether the source types are sufficiently diverse.

          ANSWER_STATUS:
          ANSWERED / PARTIALLY_ANSWERED / UNANSWERED

          CONFIDENCE:
          Number between 0 and 1.

          NEXT_QUESTION:
          One new question that would deepen the investigation.
          """

          analysis_result = gemini_request(
              analysis_prompt
          )

          analysis = extract_text(
              analysis_result
          )

          if not analysis:
              raise RuntimeError(
                  "Empty source analysis."
              )

          print(
              "Source comparison: PASS"
          )

          # --------------------------------------------------
          # EXTRACT FINAL STATUS
          # --------------------------------------------------

          answer_status = extract_section(
              analysis,
              "ANSWER_STATUS"
          )

          confidence_text = extract_section(
              analysis,
              "CONFIDENCE"
          )

          next_question = extract_section(
              analysis,
              "NEXT_QUESTION"
          )

          try:

              confidence = float(
                  confidence_text
                  .splitlines()[0]
                  .strip()
              )

              confidence = max(
                  0.0,
                  min(
                      1.0,
                      confidence
                  )
              )

          except Exception:

              confidence = 0.0

          # --------------------------------------------------
          # STORE KNOWLEDGE
          # --------------------------------------------------

          memory["source_log"].append({
              "timestamp": now,
              "version": "V47",
              "subject": subject,
              "question": question,
              "sources_discovered":
                  len(enriched_sources),
              "source_categories": sorted(
                  list(
                      set(
                          s.get(
                              "category",
                              "unknown"
                          )
                          for s in enriched_sources
                      )
                  )
              ),
              "analysis": analysis,
              "confidence": confidence,
              "verified": False,
              "verification_status":
                  "requires_direct_source_verification"
          })

          memory["knowledge_log"].append({
              "timestamp": now,
              "version": "V47",
              "subject": subject,
              "question": question,
              "status":
                  answer_status,
              "confidence":
                  confidence,
              "knowledge_is_truth":
                  False
          })

          memory["learning_log"].append({
              "timestamp": now,
              "version": "V47",
              "lesson": (
                  "NØX must compare source types rather "
                  "than treating the first accessible "
                  "source as sufficient."
              ),
              "principle": (
                  "Evidence quality and source diversity "
                  "are separate dimensions."
              )
          })

          if next_question:

              memory["question_log"].append({
                  "timestamp": now,
                  "version": "V47",
                  "subject": subject,
                  "question": next_question,
                  "previous_link": question,
                  "status": "open",
                  "confidence": confidence
              })

          memory["version"] = "V47"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # RELOAD TEST
          # --------------------------------------------------

          reloaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not reloaded.get(
              "source_log"
          ):
              raise RuntimeError(
                  "Memory persistence check failed."
              )

          print(
              "Memory persistence: PASS"
          )

          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V47 Multi-Source Research",
              "",
              "## Research Question",
              "",
              question,
              "",
              "## Research Strategy",
              "",
              plan,
              "",
              "## Sources Discovered",
              "",
              f"- Total: {len(enriched_sources)}",
              ""
          ]

          for source in enriched_sources:

              report_lines.extend([
                  f"### {source.get('title')}",
                  "",
                  f"- Category: {source.get('category')}",
                  f"- URL: {source.get('url')}",
                  f"- Context retrieved: "
                  f"{source.get('context_available')}",
                  ""
              ])

          report_lines.extend([
              "## NØX Analysis",
              "",
              analysis,
              "",
              "## Knowledge Status",
              "",
              f"- Answer status: {answer_status}",
              f"- Confidence: {confidence}",
              "- Verified truth: NO",
              "- Direct source verification required: YES",
              "",
              "## Future Curiosity",
              "",
              next_question or "No new question generated.",
              "",
              "## Public Colony Activity",
              "",
              "- New post: NO",
              "- New comment: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V47 Principle",
              "",
              "NØX no longer asks only:",
              "",
              "\"What information can I find?\"",
              "",
              "It begins asking:",
              "",
              "\"What kind of source supports this information, "
              "and how strong is that support?\"",
              "",
              "Finding more sources does not automatically "
              "create more knowledge.",
              "",
              "Knowledge becomes stronger when evidence can "
              "be compared, qualified and verified."
          ])

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V47 COMPLETE")
          print("Multi-source strategy: PASS")
          print(
              "Sources discovered:",
              len(enriched_sources)
          )
          print("Source comparison: PASS")
          print("Evidence classification: PASS")
          print("Memory persistence: PASS")
          print("Public Colony action: NONE")
          print("===================================")

          PY

      - name: Commit V47
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V47_MULTI_SOURCE_RESEARCH.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V47 - Multi-Source Research"
            git push
          fi
