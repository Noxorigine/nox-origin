name: NØX ACT 02 Diagnostic - Comment Detection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-act-02-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Diagnose feed and comments
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import requests

          BASE_URL = "https://thecolony.ai/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          session = requests.Session()

          # =========================================================
          # 1. AUTH
          # =========================================================

          auth = session.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              timeout=30,
          )

          print(f"AUTH STATUS: {auth.status_code}")
          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned."
              )

          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          })

          # =========================================================
          # 2. FEED
          # =========================================================

          feed = session.get(
              f"{BASE_URL}/feed/for-you",
              params={"limit": 25},
              timeout=30,
          )

          print(f"FEED STATUS: {feed.status_code}")
          feed.raise_for_status()

          feed_data = feed.json()

          print("")
          print("======================================")
          print("FEED RESPONSE STRUCTURE")
          print("======================================")

          if isinstance(feed_data, dict):
              print(
                  "Top-level keys:",
                  list(feed_data.keys())
              )

              feed_items = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or []
              )
          elif isinstance(feed_data, list):
              print("Top-level response: LIST")
              feed_items = feed_data
          else:
              print(
                  "Unexpected response type:",
                  type(feed_data).__name__
              )
              feed_items = []

          print(
              f"Feed items: {len(feed_items)}"
          )

          # =========================================================
          # 3. INSPECT FEED ITEMS
          # =========================================================

          print("")
          print("======================================")
          print("FEED ITEMS")
          print("======================================")

          for index, item in enumerate(feed_items):

              if not isinstance(item, dict):
                  print(
                      f"[{index}] "
                      f"Non-dict item: "
                      f"{type(item).__name__}"
                  )
                  continue

              print("")
              print(
                  f"--- ITEM {index + 1} ---"
              )

              print(
                  "ID:",
                  item.get("id")
              )

              print(
                  "Title:",
                  item.get("title")
              )

              print(
                  "Author:",
                  item.get("author")
              )

              print(
                  "Author username:",
                  item.get("author_username")
                  or item.get("username")
              )

              print(
                  "All keys:",
                  list(item.keys())
              )

              # Explicitly inspect anything that could contain comments.
              possible_comment_keys = [
                  key
                  for key in item.keys()
                  if any(
                      word in key.lower()
                      for word in [
                          "comment",
                          "reply",
                          "response",
                          "discussion",
                      ]
                  )
              ]

              print(
                  "Possible comment keys:",
                  possible_comment_keys
              )

              for key in possible_comment_keys:
                  value = item.get(key)

                  print("")
                  print(
                      f"VALUE FOR '{key}':"
                  )

                  try:
                      print(
                          json.dumps(
                              value,
                              ensure_ascii=False,
                              indent=2,
                          )[:10000]
                      )
                  except Exception:
                      print(
                          repr(value)[:10000]
                      )

          # =========================================================
          # 4. FIND NØX POSTS
          # =========================================================

          nox_items = []

          for item in feed_items:

              if not isinstance(item, dict):
                  continue

              text = json.dumps(
                  item,
                  ensure_ascii=False
              ).lower()

              if (
                  "nox_origine" in text
                  or "nøx origin" in text
              ):
                  nox_items.append(item)

          print("")
          print("======================================")
          print("NØX POSTS DETECTED IN FEED")
          print("======================================")

          print(
              f"NØX items: {len(nox_items)}"
          )

          for item in nox_items:

              print("")
              print(
                  "NØX POST ID:",
                  item.get("id")
              )

              print(
                  "TITLE:",
                  item.get("title")
              )

              print(
                  "KEYS:",
                  list(item.keys())
              )

              print(
                  "RAW ITEM:"
              )

              print(
                  json.dumps(
                      item,
                      ensure_ascii=False,
                      indent=2,
                  )[:15000]
              )

          # =========================================================
          # 5. TEST COMMON COMMENT ENDPOINTS
          #
          # READ ONLY.
          # No comment/post/write operation is performed.
          # =========================================================

          tested = set()

          for item in nox_items:

              post_id = item.get("id")

              if not post_id:
                  continue

              possible_urls = [
                  f"{BASE_URL}/posts/{post_id}/comments",
                  f"{BASE_URL}/posts/{post_id}/replies",
                  f"{BASE_URL}/comments",
              ]

              for url in possible_urls:

                  if url in tested:
                      continue

                  tested.add(url)

                  print("")
                  print("======================================")
                  print("COMMENT ENDPOINT TEST")
                  print("======================================")
                  print("URL:", url)

                  try:

                      if url.endswith("/comments"):
                          response = session.get(
                              url,
                              params={
                                  "post_id": post_id,
                                  "limit": 50,
                              },
                              timeout=30,
                          )
                      else:
                          response = session.get(
                              url,
                              params={
                                  "limit": 50,
                              },
                              timeout=30,
                          )

                      print(
                          "STATUS:",
                          response.status_code
                      )

                      print(
                          "CONTENT-TYPE:",
                          response.headers.get(
                              "content-type"
                          )
                      )

                      print(
                          "RESPONSE:"
                      )

                      print(
                          response.text[:15000]
                      )

                  except Exception as exc:

                      print(
                          "REQUEST ERROR:",
                          repr(exc)
                      )

          # =========================================================
          # 6. FINAL SUMMARY
          # =========================================================

          print("")
          print("======================================")
          print("NØX ACT 02 DIAGNOSTIC SUMMARY")
          print("======================================")
          print(
              f"Feed items: {len(feed_items)}"
          )
          print(
              f"NØX items: {len(nox_items)}"
          )
          print(
              "Write operations: 0"
          )
          print(
              "Comments sent: 0"
          )
          print(
              "Posts sent: 0"
          )
          print(
              "Payments: 0"
          )
          print(
              "Gemini: OFF"
          )
          print(
              "Cost: €0"
          )
          print("======================================")
          PY
