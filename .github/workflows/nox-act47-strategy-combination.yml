name: Nox ACT47 - Strategy Combination

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act47:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT47
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          MEMORY = Path("memory")
          MEMORY.mkdir(exist_ok=True)

          INPUT_45 = MEMORY / "nox_act_45_adaptive_strategy_selection.json"
          INPUT_46 = MEMORY / "nox_act_46_strategy_arbitration.json"

          OUTPUT_JSON = MEMORY / "nox_act_47_strategy_combination.json"
          OUTPUT_MD = MEMORY / "nox_act_47_strategy_combination.md"

          if not INPUT_45.exists():
              raise SystemExit(
                  "ACT47 requires ACT45 V7 memory output."
              )

          if not INPUT_46.exists():
              raise SystemExit(
                  "ACT47 requires ACT46 V6 memory output."
              )

          with INPUT_45.open("r", encoding="utf-8") as f:
              act45 = json.load(f)

          with INPUT_46.open("r", encoding="utf-8") as f:
              act46 = json.load(f)

          # ---------------------------------------------------------------
          # Source verification
          # ---------------------------------------------------------------

          if act45.get("act") != "ACT45":
              raise SystemExit("Invalid ACT45 source.")

          if act45.get("version") != "V7":
              raise SystemExit(
                  "ACT47 requires ACT45 V7."
              )

          if act46.get("act") != "ACT46":
              raise SystemExit("Invalid ACT46 source.")

          if act46.get("version") != "V6":
              raise SystemExit(
                  "ACT47 requires ACT46 V6."
              )

          # ---------------------------------------------------------------
          # Integrity verification
          # ---------------------------------------------------------------

          act45_method = act45.get("method", {})
          act45_integrity = act45.get("evidence_integrity", {})
          act46_method = act46.get("method", {})
          act46_integrity = act46.get("evidence_integrity", {})

          for key in [
              "fabricated_candidates",
              "fabricated_metrics",
              "arbitrary_selection",
          ]:
              if act45_method.get(key) is not False:
                  raise SystemExit(
                      f"ACT45 integrity failure: {key}"
                  )

          for key in [
              "fabricated_candidates",
              "fabricated_metrics",
              "arbitrary_selection",
              "first_candidate_fallback",
              "hidden_scoring",
          ]:
              if act46_method.get(key) is not False:
                  raise SystemExit(
                      f"ACT46 integrity failure: {key}"
                  )

          if act45_integrity.get(
              "free_text_strategy_matching"
          ) is not False:
              raise SystemExit(
                  "ACT45 free-text strategy matching must be false."
              )

          if act46_integrity.get(
              "old_act30_candidates_used"
          ) is not False:
              raise SystemExit(
                  "ACT46 old ACT30 candidates must remain unused."
              )

          # ---------------------------------------------------------------
          # Read ACT46 result
          # ---------------------------------------------------------------

          arbitration = act46.get("arbitration", {})

          decision46 = arbitration.get(
              "decision",
              "UNKNOWN"
          )

          selected46 = arbitration.get(
              "selected_strategy"
          )

          candidates46 = act46.get(
              "candidates",
              []
          )

          eligible46 = act46.get(
              "eligible_candidates",
              []
          )

          # ---------------------------------------------------------------
          # ACT47 principle
          #
          # ACT47 answers:
          #
          # "Are several strategies complementary?"
          #
          # It must NOT:
          # - invent strategies
          # - infer complementarity from names alone
          # - create combinations without explicit evidence
          # - bypass ACT46
          # - turn missing evidence into a positive conclusion
          #
          # Complementarity requires explicit evidence connecting multiple
          # strategies to compatible roles, outcomes, or sequential use.
          # ---------------------------------------------------------------

          combination_candidates = []
          combination_possible = False
          decision = "INSUFFICIENT_EVIDENCE"
          recommendation = None

          # ACT47 receives only strategies explicitly exposed by ACT46.
          # With the current ACT46 result, there are none.
          source_candidates = []

          for candidate in eligible46:
              if not isinstance(candidate, dict):
                  continue

              name = candidate.get("name")

              if isinstance(name, str) and name.strip():
                  source_candidates.append(
                      candidate
                  )

          # ---------------------------------------------------------------
          # Explicit structural complementarity evidence
          #
          # ACT47 accepts only explicit fields such as:
          # complementary_strategies
          # compatible_strategies
          # strategy_dependencies
          # combined_strategy
          # strategy_sequence
          # complementary
          #
          # It never treats a name similarity as evidence.
          # ---------------------------------------------------------------

          EXPLICIT_COMBINATION_KEYS = {
              "complementary_strategies",
              "compatible_strategies",
              "strategy_dependencies",
              "combined_strategy",
              "strategy_combination",
              "strategy_sequence",
          }

          def find_explicit_combinations(obj, path="$"):
              found = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      key_lower = str(key).lower()

                      if key_lower in EXPLICIT_COMBINATION_KEYS:
                          if isinstance(value, list):
                              names = [
                                  item.strip()
                                  for item in value
                                  if isinstance(item, str)
                                  and item.strip()
                              ]

                              if len(names) >= 2:
                                  found.append({
                                      "path": f"{path}.{key}",
                                      "strategies": names,
                                      "source_field": key,
                                  })

                          elif isinstance(value, dict):
                              names = []

                              for nested_key, nested_value in value.items():
                                  if isinstance(
                                      nested_value,
                                      str
                                  ) and nested_value.strip():
                                      names.append(
                                          nested_value.strip()
                                      )

                              if len(names) >= 2:
                                  found.append({
                                      "path": f"{path}.{key}",
                                      "strategies": names,
                                      "source_field": key,
                                  })

                      found.extend(
                          find_explicit_combinations(
                              value,
                              f"{path}.{key}"
                          )
                      )

              elif isinstance(obj, list):
                  for index, item in enumerate(obj):
                      found.extend(
                          find_explicit_combinations(
                              item,
                              f"{path}[{index}]"
                          )
                      )

              return found

          # Search only ACT45/ACT46 current outputs.
          explicit45 = find_explicit_combinations(
              act45,
              "$"
          )

          explicit46 = find_explicit_combinations(
              act46,
              "$"
          )

          explicit = explicit45 + explicit46

          # ---------------------------------------------------------------
          # Validate that explicit combinations refer to real ACT46
          # candidates.
          # ---------------------------------------------------------------

          known_names = {
              candidate["name"]
              for candidate in source_candidates
          }

          for item in explicit:
              names = [
                  name
                  for name in item["strategies"]
                  if name in known_names
              ]

              if len(set(names)) >= 2:
                  combination_candidates.append({
                      "strategies": sorted(set(names)),
                      "source_path": item["path"],
                      "source_field": item["source_field"],
                      "evidence_type": "explicit_structural_relation",
                  })

          # ---------------------------------------------------------------
          # Decision logic
          # ---------------------------------------------------------------

          if decision46 != "PRIORITIZE":
              decision = "INSUFFICIENT_EVIDENCE"

              recommendation = (
                  "ACT46 did not produce a defensible prioritized strategy; "
                  "ACT47 will not invent or combine strategies."
              )

          elif len(source_candidates) < 2:
              decision = "INSUFFICIENT_COMPARISON"

              recommendation = (
                  "Fewer than two ACT46-eligible strategies are available; "
                  "complementarity cannot be established."
              )

          elif not combination_candidates:
              decision = "NO_COMPLEMENTARITY_EVIDENCE"

              recommendation = (
                  "Multiple strategies exist, but no explicit structural "
                  "evidence demonstrates that they are complementary."
              )

          else:
              combination_possible = True
              decision = "COMBINATION_SUPPORTED"

              recommendation = (
                  "Explicit structural evidence supports combining "
                  "multiple strategies."
              )

          # ---------------------------------------------------------------
          # Output
          # ---------------------------------------------------------------

          output = {
              "act": "ACT47",
              "version": "V1",
              "name": "Strategy Combination",

              "cost_zero": True,
              "project_cost_eur": 0,
              "gemini": False,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "spending": False,
              "payments": False,

              "source": {
                  "act45": {
                      "file": str(INPUT_45),
                      "version": "V7",
                  },
                  "act46": {
                      "file": str(INPUT_46),
                      "version": "V6",
                  },
              },

              "method": {
                  "principle": (
                      "Determine whether multiple explicitly available "
                      "strategies are complementary."
                  ),
                  "candidate_source": "ACT46_V6_only",
                  "combination_evidence": (
                      "explicit_structural_relation_only"
                  ),
                  "free_text_name_matching": False,
                  "fabricated_strategies": False,
                  "fabricated_combinations": False,
                  "fabricated_metrics": False,
                  "arbitrary_combination": False,
                  "bypass_act46": False,
              },

              "act46_state": {
                  "decision": decision46,
                  "selected_strategy": selected46,
                  "candidate_count": len(candidates46),
                  "eligible_candidate_count": len(
                      eligible46
                  ),
              },

              "available_strategies": [
                  candidate["name"]
                  for candidate in source_candidates
              ],

              "combination_candidates": combination_candidates,

              "combination": {
                  "decision": decision,
                  "combination_possible": combination_possible,
                  "combinations_supported": (
                      len(combination_candidates)
                  ),
                  "recommendation": recommendation,
              },

              "evidence_integrity": {
                  "act45_source_verified": True,
                  "act45_v7_verified": True,
                  "act46_source_verified": True,
                  "act46_v6_verified": True,
                  "fabricated_strategies": False,
                  "fabricated_combinations": False,
                  "fabricated_metrics": False,
                  "arbitrary_combination": False,
                  "free_text_name_matching": False,
                  "missing_evidence_preserved": True,
                  "act46_bypassed": False,
              },

              "next_cognitive_step": (
                  "Proceed to ACT48 only when ACT47 has explicit evidence "
                  "supporting a defensible strategy combination; otherwise "
                  "preserve uncertainty."
              ),
          }

          with OUTPUT_JSON.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          md = f"""# ACT47 V1 — Strategy Combination

          ## Decision

          - Decision: `{decision}`
          - Combination possible: `{combination_possible}`
          - Supported combinations: `{len(combination_candidates)}`

          ## Cognitive chain

          ACT45 V7 → ACT46 V6 → ACT47 V1

          ## Principle

          ACT47 determines whether several strategies are complementary.

          It does not:
          - invent strategies;
          - invent combinations;
          - infer complementarity from names alone;
          - bypass ACT46;
          - fabricate metrics;
          - convert missing evidence into a positive conclusion.

          ## Current ACT46 state

          - Decision: `{decision46}`
          - Selected strategy: `{selected46}`
          - Eligible candidates: `{len(eligible46)}`

          ## Result

          {recommendation}

          ## Integrity

          - Cost: €0
          - Gemini: false
          - External AI: false
          - External API: false
          - Spending: false
          - Payments: false
          """

          OUTPUT_MD.write_text(
              md.strip() + "\n",
              encoding="utf-8"
          )

          print("ACT47 V1 completed")
          print(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Verify ACT47 outputs
        run: |
          test -s memory/nox_act_47_strategy_combination.json
          test -s memory/nox_act_47_strategy_combination.md

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "memory/nox_act_47_strategy_combination.json"
          )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["act"] == "ACT47"
          assert data["version"] == "V1"

          assert data["cost_zero"] is True
          assert data["gemini_used"] is False
          assert data["external_ai_used"] is False
          assert data["external_api_used"] is False
          assert data["spending"] is False
          assert data["payments"] is False

          method = data["method"]

          assert method["fabricated_strategies"] is False
          assert method["fabricated_combinations"] is False
          assert method["fabricated_metrics"] is False
          assert method["arbitrary_combination"] is False
          assert method["bypass_act46"] is False
          assert method["free_text_name_matching"] is False

          assert data["evidence_integrity"][
              "act45_v7_verified"
          ] is True

          assert data["evidence_integrity"][
              "act46_v6_verified"
          ] is True

          assert data["combination"]["decision"] in {
              "COMBINATION_SUPPORTED",
              "NO_COMPLEMENTARITY_EVIDENCE",
              "INSUFFICIENT_COMPARISON",
              "INSUFFICIENT_EVIDENCE",
          }

          print("ACT47 V1 output verification: OK")
          PY

      - name: Commit ACT47 results
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_act_47_strategy_combination.json \
            memory/nox_act_47_strategy_combination.md

          if git diff --cached --quiet; then
            echo "No ACT47 changes to commit."
            exit 0
          fi

          git commit -m "ACT47 strategy combination"
          git push
