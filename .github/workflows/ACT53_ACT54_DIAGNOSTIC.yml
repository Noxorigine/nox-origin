name: ACT53_ACT54_DIAGNOSTIC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ACT53 ACT54 JSON diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          FILES = {
              "ACT53": Path("memory/nox_act_53_empirical_prediction.json"),
              "ACT54": Path("memory/nox_act_54_experiment_validation.json"),
          }

          print("=" * 80)
          print("ACT53 / ACT54 JSON DIAGNOSTIC")
          print("=" * 80)
          print("READ ONLY - aucun fichier ne sera modifié")
          print("gemini_used: false")
          print("external_ai_used: false")
          print("project_cost_eur: 0")
          print()

          def inspect(name, path):
              print("=" * 80)
              print(f"{name}")
              print(f"path: {path}")
              print(f"exists: {path.exists()}")
              print("=" * 80)

              if not path.exists():
                  print("STATUS: FILE_NOT_FOUND")
                  print()
                  return None

              try:
                  raw = path.read_text(encoding="utf-8")
                  data = json.loads(raw)
              except Exception as exc:
                  print(f"STATUS: INVALID_JSON")
                  print(f"error: {type(exc).__name__}: {exc}")
                  print()
                  return None

              print("STATUS: VALID_JSON")
              print(f"root_type: {type(data).__name__}")

              if isinstance(data, dict):
                  print(f"root_keys: {sorted(data.keys())}")

                  print()
                  print("TOP-LEVEL VALUES:")
                  for key, value in data.items():
                      if isinstance(value, (dict, list)):
                          print(
                              f"- {key}: "
                              f"{type(value).__name__}, "
                              f"length={len(value)}"
                          )
                      else:
                          print(f"- {key}: {value!r}")

                  print()
                  print("POSSIBLE RECORD CONTAINERS:")
                  for key, value in data.items():
                      if isinstance(value, list):
                          print(f"- {key}: list[{len(value)}]")
                          if value:
                              first = value[0]
                              if isinstance(first, dict):
                                  print(
                                      f"  first_item_keys: "
                                      f"{sorted(first.keys())}"
                                  )
                              else:
                                  print(
                                      f"  first_item_type: "
                                      f"{type(first).__name__}"
                                  )

                      elif isinstance(value, dict):
                          print(f"- {key}: dict[{len(value)} keys]")
                          print(f"  keys: {sorted(value.keys())}")

              elif isinstance(data, list):
                  print(f"root_length: {len(data)}")
                  if data:
                      first = data[0]
                      if isinstance(first, dict):
                          print(
                              f"first_item_keys: "
                              f"{sorted(first.keys())}"
                          )
                      else:
                          print(
                              f"first_item_type: "
                              f"{type(first).__name__}"
                          )

              print()
              print("FULL JSON:")
              print(json.dumps(data, indent=2, ensure_ascii=False))
              print()

              return data

          act53 = inspect("ACT53", FILES["ACT53"])
          act54 = inspect("ACT54", FILES["ACT54"])

          print("=" * 80)
          print("CROSS-CHECK")
          print("=" * 80)

          if act53 is None:
              print("ACT53: unavailable")
          if act54 is None:
              print("ACT54: unavailable")

          def collect_ids(obj):
              ids = set()

              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          key_l = str(key).lower()

                          if (
                              "id" in key_l
                              or "prediction" in key_l
                              or "experiment" in key_l
                          ):
                              if isinstance(item, (str, int, float)):
                                  ids.add((str(key), str(item)))

                          walk(item)

                      return

                  if isinstance(value, list):
                      for item in value:
                          walk(item)

              walk(obj)
              return sorted(ids)

          if act53 is not None:
              print()
              print("ACT53 IDENTIFIER-LIKE VALUES:")
              for key, value in collect_ids(act53):
                  print(f"- {key}: {value}")

          if act54 is not None:
              print()
              print("ACT54 IDENTIFIER-LIKE VALUES:")
              for key, value in collect_ids(act54):
                  print(f"- {key}: {value}")

          print()
          print("=" * 80)
          print("DIAGNOSTIC END")
          print("=" * 80)
          PY
