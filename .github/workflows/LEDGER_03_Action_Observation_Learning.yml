name: NØX LEDGER 03 - Action Observation Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  action-observation-learning:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      ACTION_FILE: memory/nox_ledger_action.json
      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json
      COGNITION_FILE: memory/nox_ledger_cognition.json

      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE: "30"
      MIN_BID_SATS: "1"
      BID_SCORE_THRESHOLD: "50"

      # ============================================================
      # LEDGER 03 EXECUTION EXTENSION
      # ============================================================
      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_RESEARCH_URLS_PER_TASK: "8"
      MAX_COMMENTS_PER_TASK_SCAN: "100"
      MAX_DELIVERY_CHARS: "12000"
      EXECUTION_TIMEOUT_SECONDS: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Run LEDGER 03
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import html
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          ACTION_FILE = Path(os.environ["ACTION_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          COGNITION_FILE = Path(os.environ["COGNITION_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )

          EXECUTION_ENABLED = (
              os.environ.get(
                  "EXECUTION_ENABLED",
                  "true"
              ).lower() == "true"
          )

          MAX_EXECUTIONS = int(
              os.environ.get(
                  "MAX_EXECUTIONS_PER_RUN",
                  "2"
              )
          )

          MAX_RESEARCH_URLS = int(
              os.environ.get(
                  "MAX_RESEARCH_URLS_PER_TASK",
                  "8"
              )
          )

          MAX_COMMENTS = int(
              os.environ.get(
                  "MAX_COMMENTS_PER_TASK_SCAN",
                  "100"
              )
          )

          MAX_DELIVERY_CHARS = int(
              os.environ.get(
                  "MAX_DELIVERY_CHARS",
                  "12000"
              )
          )

          EXECUTION_TIMEOUT = int(
              os.environ.get(
                  "EXECUTION_TIMEOUT_SECONDS",
                  "20"
              )
          )

          NOW = datetime.now(
              timezone.utc
          ).isoformat()

          # =========================================================
          # Persistence
          # EXISTING LEDGER 03 STRUCTURE — PRESERVED
          # =========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"LOAD WARNING {path}: {exc}"
                  )
                  return default

          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              tmp.replace(path)

          state = load_json(
              ACTION_FILE,
              {
                  "version": "2.0",
                  "decisions": [],
                  "bids": [],
                  "observations": [],
                  "outcomes": [],
                  "failure_ledger": [],
                  "tip_candidates": [],
                  "learning": [],
                  "cognitive_actions": []
              }
          )

          if not isinstance(state, dict):
              state = {}

          for key, default in {
              "decisions": [],
              "bids": [],
              "observations": [],
              "outcomes": [],
              "failure_ledger": [],
              "tip_candidates": [],
              "learning": [],
              "cognitive_actions": []
          }.items():

              if not isinstance(
                  state.get(key),
                  list
              ):
                  state[key] = default

          # =========================================================
          # NEW EXECUTION STATE
          # =========================================================

          if not isinstance(
              state.get("missions"),
              list
          ):
              state["missions"] = []

          if not isinstance(
              state.get("deliveries"),
              list
          ):
              state["deliveries"] = []

          if not isinstance(
              state.get("execution_observations"),
              list
          ):
              state["execution_observations"] = []

          if not isinstance(
              state.get("execution_failures"),
              list
          ):
              state["execution_failures"] = []

          if not isinstance(
              state.get("research_runs"),
              list
          ):
              state["research_runs"] = []

          cognition = load_json(
              COGNITION_FILE,
              {}
          )

          if not isinstance(
              cognition,
              dict
          ):
              cognition = {}

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {"knowledge": []}
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {
                  "knowledge": []
              }

          # =========================================================
          # HTTP
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": (
                  f"Bearer {API_KEY}"
              ),
              "Accept": "application/json",
              "User-Agent": (
                  "NOX-Ledger-Action/2.1"
              )
          })

          def authenticate():
              try:
                  response = session.post(
                      BASE +
                      "/api/v1/auth/token",
                      json={
                          "api_key": API_KEY
                      },
                      timeout=15
                  )

                  if not response.ok:
                      print(
                          "AUTH FAILED: "
                          f"HTTP {response.status_code}"
                      )
                      return False

                  data = response.json()

                  token = data.get(
                      "access_token"
                  )

                  if not token:
                      print(
                          "AUTH FAILED: "
                          "no access_token"
                      )
                      return False

                  session.headers[
                      "Authorization"
                  ] = "Bearer " + token

                  return True

              except Exception as exc:
                  print(
                      f"AUTH ERROR: {exc}"
                  )
                  return False

          authenticate()

          def get(path, params=None):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=EXECUTION_TIMEOUT
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.get(
                          BASE + path,
                          params=params,
                          timeout=EXECUTION_TIMEOUT
                      )

                  if not response.ok:
                      print(
                          f"GET {path}: "
                          f"HTTP "
                          f"{response.status_code}"
                      )
                      return None

                  try:
                      return response.json()
                  except Exception:
                      return None

              except Exception as exc:
                  print(
                      f"GET ERROR {path}: {exc}"
                  )
                  return None

          def post(path, payload):
              try:
                  response = session.post(
                      BASE + path,
                      json=payload,
                      timeout=EXECUTION_TIMEOUT
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.post(
                          BASE + path,
                          json=payload,
                          timeout=EXECUTION_TIMEOUT
                      )

                  return response

              except Exception as exc:
                  print(
                      f"POST ERROR {path}: {exc}"
                  )
                  return None

          # =========================================================
          # Generic helpers
          # =========================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(
                  value,
                  str
              ):
                  return value

              if isinstance(
                  value,
                  (int, float, bool)
              ):
                  return str(value)

              if isinstance(
                  value,
                  dict
              ):
                  return " ".join(
                      text(v)
                      for v in value.values()
                  )

              if isinstance(
                  value,
                  list
              ):
                  return " ".join(
                      text(v)
                      for v in value
                  )

              return str(value)

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()

          def fingerprint(*values):
              value = " ".join(
                  clean(v).lower()
                  for v in values
                  if clean(v)
              )

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()[:20]

          def has_any(
              value,
              terms
          ):
              low = clean(value).lower()

              return any(
                  term.lower() in low
                  for term in terms
              )

          # =========================================================
          # Identity
          # =========================================================

          me = get(
              "/api/v1/users/me"
          ) or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          identity_values = {
              str(username).lower(),
              str(
                  me.get("id", "")
              ).lower(),
              str(
                  me.get("user_id", "")
              ).lower(),
              str(
                  me.get("agent_id", "")
              ).lower(),
              "nox_origine",
              "@nox_origine"
          }

          identity_values.discard("")

          print(
              f"IDENTITY: {username}"
          )

          # =========================================================
          # LEDGER 02 -> LEDGER 03
          # EXISTING LOGIC PRESERVED
          # =========================================================

          cognitive_candidates = (
              cognition.get(
                  "action_candidates",
                  []
              )
          )

          if not isinstance(
              cognitive_candidates,
              list
          ):
              cognitive_candidates = []

          pending_cognitive = [
              item
              for item in cognitive_candidates
              if isinstance(item, dict)
              and str(
                  item.get(
                      "status",
                      "candidate"
                  )
              ).lower()
              in {
                  "candidate",
                  "pending",
                  "ready"
              }
          ]

          print(
              "COGNITIVE ACTION CANDIDATES: "
              f"{len(pending_cognitive)}"
          )

          # =========================================================
          # Task extraction
          # EXISTING LOGIC PRESERVED
          # =========================================================

          def task_id(task):

              if not isinstance(
                  task,
                  dict
              ):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "id",
                  "uuid"
              ):
                  if task.get(key):
                      return str(
                          task[key]
                      )

              nested = task.get(
                  "task"
              )

              if isinstance(
                  nested,
                  dict
              ):
                  for key in (
                      "id",
                      "task_id",
                      "taskId",
                      "uuid"
                  ):
                      if nested.get(key):
                          return str(
                              nested[key]
                          )

              return None

          def task_title(task):

              nested = task.get(
                  "task"
              )

              values = [
                  task.get("title"),
                  task.get("name"),
                  task.get("task_title")
              ]

              if isinstance(
                  nested,
                  dict
              ):
                  values.extend([
                      nested.get("title"),
                      nested.get("name"),
                      nested.get("task_title")
                  ])

              for value in values:
                  if clean(value):
                      return clean(value)

              return ""

          def task_description(task):

              nested = task.get(
                  "task"
              )

              values = [
                  task.get("description"),
                  task.get("body"),
                  task.get("details"),
                  task.get("content"),
                  task.get("instructions")
              ]

              if isinstance(
                  nested,
                  dict
              ):
                  values.extend([
                      nested.get(
                          "description"
                      ),
                      nested.get(
                          "body"
                      ),
                      nested.get(
                          "details"
                      ),
                      nested.get(
                          "content"
                      ),
                      nested.get(
                          "instructions"
                      )
                  ])

              for value in values:
                  if clean(value):
                      return clean(value)

              return ""

          def task_text(task):

              parts = [
                  task_title(task),
                  task_description(task),
                  clean(
                      task.get("category")
                  ),
                  clean(
                      task.get("type")
                  ),
                  clean(
                      task.get("tags")
                  ),
                  clean(
                      task.get("status")
                  )
              ]

              nested = task.get(
                  "task"
              )

              if isinstance(
                  nested,
                  dict
              ):
                  parts.extend([
                      clean(
                          nested.get(
                              "category"
                          )
                      ),
                      clean(
                          nested.get(
                              "type"
                          )
                      ),
                      clean(
                          nested.get(
                              "tags"
                          )
                      ),
                      clean(
                          nested.get(
                              "status"
                          )
                      )
                  ])

              return clean(
                  " ".join(
                      part
                      for part in parts
                      if part
                  )
              )

          # =========================================================
          # Reward detection
          # EXISTING LOGIC PRESERVED
          # =========================================================

          REWARD_KEYS = {
              "reward_sats",
              "reward",
              "budget_sats",
              "amount_sats",
              "max_reward_sats",
              "min_reward_sats",
              "bounty_sats",
              "price_sats"
          }

          def recursive_rewards(value):

              found = []

              if isinstance(
                  value,
                  dict
              ):
                  for key, child in value.items():

                      low_key = str(
                          key
                      ).lower()

                      if (
                          low_key in REWARD_KEYS
                          and isinstance(
                              child,
                              (int, float)
                          )
                      ):
                          found.append(
                              int(child)
                          )

                      found.extend(
                          recursive_rewards(
                              child
                          )
                      )

              elif isinstance(
                  value,
                  list
              ):
                  for child in value:
                      found.extend(
                          recursive_rewards(
                              child
                          )
                      )

              return found

          def reward_values(
              task,
              task_text_value
          ):

              values = recursive_rewards(
                  task
              )

              matches = re.findall(
                  r"(?<![\d.])"
                  r"([\d][\d,]*)"
                  r"\s*(?:sats?|sat)\b",
                  task_text_value,
                  re.I
              )

              for value in matches:
                  try:
                      values.append(
                          int(
                              value.replace(
                                  ",",
                                  ""
                              )
                          )
                      )
                  except Exception:
                      pass

              return sorted(
                  set(
                      value
                      for value in values
                      if value >= 0
                  )
              )

          def reward_range(
              task,
              task_text_value
          ):

              values = reward_values(
                  task,
                  task_text_value
              )

              if not values:
                  return None, None

              return (
                  min(values),
                  max(values)
              )

          # =========================================================
          # Demand detection
          # EXISTING LOGIC PRESERVED
          # =========================================================

          DEMAND_TERMS = [
              "task",
              "bounty",
              "looking for",
              "need an agent",
              "need someone",
              "need help",
              "research needed",
              "research task",
              "write a report",
              "build",
              "implement",
              "fix",
              "develop",
              "deliverable",
              "wanted",
              "seeking",
              "commission",
              "request",
              "job",
              "work needed"
          ]

          SUPPLY_TERMS = [
              "i offer",
              "my service",
              "i can provide",
              "available service",
              "offering"
          ]

          CLOSED_STATUSES = {
              "closed",
              "completed",
              "cancelled",
              "canceled",
              "expired",
              "archived"
          }

          def detect_direction(
              task,
              task_text_value
          ):

              low = task_text_value.lower()

              demand_score = sum(
                  1
                  for term in DEMAND_TERMS
                  if term in low
              )

              supply_score = sum(
                  1
                  for term in SUPPLY_TERMS
                  if term in low
              )

              status = clean(
                  task.get("status")
              ).lower()

              if status in CLOSED_STATUSES:
                  return "CLOSED"

              if demand_score > supply_score:
                  return "DEMAND"

              if supply_score > demand_score:
                  return "SUPPLY"

              low_reward, high_reward = (
                  reward_range(
                      task,
                      task_text_value
                  )
              )

              if (
                  low_reward is not None
                  or high_reward is not None
              ):
                  return "DEMAND"

              return "UNKNOWN"

          # =========================================================
          # Capability matching
          # EXISTING LOGIC PRESERVED
          # =========================================================

          CAPABILITIES = {
              "research": [
                  "research",
                  "deep research",
                  "web research",
                  "research report",
                  "research task",
                  "technical research",
                  "market research",
                  "competitive research",
                  "fact checking",
                  "source verification"
              ],
              "reporting": [
                  "technical report",
                  "research report",
                  "write a report",
                  "report writing",
                  "research brief"
              ],
              "python": [
                  "python",
                  "python script",
                  "python development"
              ],
              "coding": [
                  "coding",
                  "write code",
                  "software development",
                  "implementation",
                  "debugging",
                  "tool development",
                  "build agent tools",
                  "agent tooling",
                  "build tools"
              ],
              "api": [
                  "rest api",
                  "api integration",
                  "api endpoint",
                  "api development",
                  "api testing",
                  "webhook",
                  "json api"
              ],
              "testing": [
                  "testing",
                  "qa",
                  "quality assurance",
                  "smoke test",
                  "api test"
              ],
              "data": [
                  "data analysis",
                  "data cleaning",
                  "data extraction",
                  "data processing",
                  "data collection",
                  "csv",
                  "json cleanup"
              ],
              "github": [
                  "github",
                  "repository",
                  "repo",
                  "github actions",
                  "workflow",
                  "pull request",
                  "issue"
              ]
          }

          BLOCKED_TERMS = [
              "malware",
              "ransomware",
              "credential theft",
              "steal credentials",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos attack",
              "bypass authentication",
              "exploit a real target",
              "weapon",
              "explosive"
          ]

          def matching_capabilities(
              task_text_value
          ):

              low = (
                  task_text_value
                  .lower()
              )

              found = []

              for name, terms in (
                  CAPABILITIES.items()
              ):
                  if any(
                      term in low
                      for term in terms
                  ):
                      found.append(
                          name
                      )

              return found

          def is_blocked(
              task_text_value
          ):

              low = (
                  task_text_value
                  .lower()
              )

              return any(
                  term in low
                  for term in BLOCKED_TERMS
              )

          def suspicious_reward(
              task,
              task_text_value
          ):

              values = reward_values(
                  task,
                  task_text_value
              )

              if len(values) < 2:
                  return False

              low = min(values)
              high = max(values)

              if low <= 0:
                  return False

              return (
                  high / low >= 10
              )

          # =========================================================
          # Marketplace
          # EXISTING LOGIC PRESERVED
          # =========================================================

          response = get(
              "/api/v1/marketplace/tasks",
              {
                  "limit": MAX_TASKS
              }
          )

          if isinstance(
              response,
              dict
          ):
              tasks = response.get(
                  "items",
                  response.get(
                      "tasks",
                      []
                  )
              )
          else:
              tasks = response

          if not isinstance(
              tasks,
              list
          ):
              tasks = []

          print(
              f"TASKS FOUND: {len(tasks)}"
          )

          decisions = []
          candidates = []
          skip_reasons = Counter()

          cognitive_topics = {
              clean(
                  item.get("topic")
              ).lower()
              for item in pending_cognitive
              if clean(
                  item.get("topic")
              )
          }

          for task in tasks:

              tid = task_id(task)

              if not tid:
                  skip_reasons[
                      "MISSING_TASK_ID"
                  ] += 1
                  continue

              title = task_title(task)
              description = (
                  task_description(task)
              )
              combined = task_text(task)

              direction = (
                  detect_direction(
                      task,
                      combined
                  )
              )

              low_reward, high_reward = (
                  reward_range(
                      task,
                      combined
                  )
              )

              caps = (
                  matching_capabilities(
                      combined
                  )
              )

              blocked = is_blocked(
                  combined
              )

              reward_problem = (
                  suspicious_reward(
                      task,
                      combined
                  )
              )

              score = 0
              reasons = []

              if blocked:

                  score = -100

                  reasons.append(
                      "SAFETY_BLOCK"
                  )

                  skip_reasons[
                      "SAFETY_BLOCK"
                  ] += 1

              elif direction == "CLOSED":

                  score = -80

                  reasons.append(
                      "CLOSED_TASK"
                  )

                  skip_reasons[
                      "CLOSED_TASK"
                  ] += 1

              elif direction != "DEMAND":

                  score = -40

                  reasons.append(
                      "NOT_DEMAND"
                  )

                  skip_reasons[
                      "NOT_DEMAND"
                  ] += 1

              else:

                  if caps:

                      score += min(
                          35,
                          len(caps) * 12
                      )

                      reasons.append(
                          "CAPABILITY:" +
                          ",".join(caps)
                      )

                  else:

                      reasons.append(
                          "NO_CAPABILITY"
                      )

                  if (
                      low_reward
                      is not None
                  ):

                      if low_reward >= 500:
                          score += 25
                      elif low_reward >= 100:
                          score += 20
                      elif low_reward >= 20:
                          score += 15
                      elif low_reward >= 1:
                          score += 10

                      reasons.append(
                          f"REWARD:{low_reward}"
                      )

                  else:

                      reasons.append(
                          "NO_REWARD"
                      )

                  length = len(
                      combined
                  )

                  if (
                      100
                      <= length
                      <= 1800
                  ):

                      score += 10

                      reasons.append(
                          "CLEAR_SCOPE"
                      )

                  elif length < 100:

                      score += 3

                      reasons.append(
                          "SHORT_SCOPE"
                      )

                  elif length > 3000:

                      score -= 8

                      reasons.append(
                          "HIGH_COMPLEXITY"
                      )

                  if has_any(
                      combined,
                      [
                          "deliverable",
                          "report",
                          "output",
                          "repository",
                          "github",
                          "api",
                          "documentation"
                      ]
                  ):

                      score += 5

                      reasons.append(
                          "OBSERVABLE_DELIVERABLE"
                      )

                  if cognitive_topics:

                      topic_match = any(
                          topic.replace(
                              "_",
                              " "
                          ) in combined.lower()
                          for topic
                          in cognitive_topics
                      )

                      if topic_match:

                          score += 5

                          reasons.append(
                              "COGNITIVE_TOPIC_MATCH"
                          )

                  if reward_problem:

                      score -= 35

                      reasons.append(
                          "REWARD_INCONSISTENCY"
                      )

                  if (
                      caps
                      and low_reward
                      is not None
                      and not reward_problem
                      and score
                      >= BID_SCORE_THRESHOLD
                  ):

                      decision_value = (
                          "BID"
                      )

                  elif (
                      caps
                      and low_reward
                      is None
                      and not blocked
                  ):

                      decision_value = (
                          "TIP_OR_LEARNING_CANDIDATE"
                      )

                  else:

                      decision_value = (
                          "SKIP"
                      )

                  if (
                      decision_value
                      == "SKIP"
                  ):

                      if not caps:

                          skip_reasons[
                              "NO_CAPABILITY"
                          ] += 1

                      elif (
                          low_reward
                          is None
                      ):

                          skip_reasons[
                              "NO_REWARD"
                          ] += 1

                      elif reward_problem:

                          skip_reasons[
                              "REWARD_INCONSISTENCY"
                          ] += 1

                      elif (
                          score
                          < BID_SCORE_THRESHOLD
                      ):

                          skip_reasons[
                              "LOW_SCORE"
                          ] += 1

              if direction != "DEMAND":
                  decision_value = "SKIP"

              if blocked:
                  decision_value = "SKIP"

              decision = {
                  "timestamp": NOW,
                  "task_id": tid,
                  "title": title[:300],
                  "description_excerpt": (
                      description[:500]
                  ),
                  "direction": direction,
                  "reward_low": low_reward,
                  "reward_high": high_reward,
                  "capabilities": caps,
                  "score": score,
                  "suspicious_reward": (
                      reward_problem
                  ),
                  "blocked": blocked,
                  "decision": decision_value,
                  "reasons": reasons
              }

              decisions.append(
                  decision
              )

              if decision_value == "BID":

                  candidates.append(
                      decision
                  )

              elif (
                  decision_value
                  == "TIP_OR_LEARNING_CANDIDATE"
              ):

                  state[
                      "tip_candidates"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "title": title[:300],
                      "capabilities": caps,
                      "reward_claim": None,
                      "note": (
                          "No reward fabricated. "
                          "Potential learning or "
                          "future tip opportunity."
                      )
                  })

          # =========================================================
          # Existing bids
          # =========================================================

          ACTIVE_STATUSES = {
              "pending",
              "submitted",
              "active",
              "accepted",
              "approved",
              "winner",
              "winning"
          }

          def own_bid(bid):

              if not isinstance(
                  bid,
                  dict
              ):
                  return False

              for key in (
                  "agent_id",
                  "user_id",
                  "bidder_id",
                  "owner_id"
              ):

                  value = bid.get(
                      key
                  )

                  if (
                      value is not None
                      and str(
                          value
                      ).lower()
                      in identity_values
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder_username",
                  "agent_username"
              ):

                  value = bid.get(
                      key
                  )

                  if (
                      value is not None
                      and str(
                          value
                      ).lower()
                      in identity_values
                  ):
                      return True

              return False

          def normalize_status(
              value
          ):

              low = str(
                  value or ""
              ).lower().strip()

              if low in {
                  "accepted",
                  "approved",
                  "won",
                  "selected"
              }:
                  return "ACCEPTED"

              if low in {
                  "rejected",
                  "declined",
                  "lost",
                  "denied"
              }:
                  return "REJECTED"

              if low in {
                  "pending",
                  "submitted",
                  "active",
                  "open",
                  "bidding",
                  "under_review",
                  "review"
              }:
                  return "PENDING"

              return str(
                  value or "UNKNOWN"
              ).upper()

          def get_bids(
              task_id_value
          ):

              result = get(
                  "/api/v1/marketplace/"
                  + str(task_id_value)
                  + "/bids"
              )

              if isinstance(
                  result,
                  dict
              ):
                  result = result.get(
                      "items",
                      result.get(
                          "bids",
                          []
                      )
                  )

              return (
                  result
                  if isinstance(
                      result,
                      list
                  )
                  else []
              )

          # =========================================================
          # Submit real bids
          # EXISTING LOGIC PRESERVED
          # =========================================================

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["reward_low"] or 0
              ),
              reverse=True
          )

          bids_created = 0
          bid_conflicts = 0

          for candidate in candidates:

              if bids_created >= MAX_BIDS:
                  break

              tid = candidate[
                  "task_id"
              ]

              existing = get_bids(
                  tid
              )

              already_active = any(
                  own_bid(bid)
                  and normalize_status(
                      bid.get("status")
                  ) in ACTIVE_STATUSES
                  for bid in existing
              )

              if already_active:

                  candidate[
                      "decision"
                  ] = (
                      "SKIP_EXISTING_ACTIVE_BID"
                  )

                  continue

              reward = candidate[
                  "reward_low"
              ]

              if reward is None:
                  continue

              bid_amount = max(
                  MIN_BID,
                  int(reward)
              )

              if (
                  candidate[
                      "reward_high"
                  ] is not None
              ):

                  bid_amount = min(
                      bid_amount,
                      int(
                          candidate[
                              "reward_high"
                          ]
                      )
                  )

              capability_text = (
                  ", ".join(
                      candidate[
                          "capabilities"
                      ]
                  )
              )

              description = (
                  "NØX can handle this task "
                  "with evidence-based execution. "
                  f"Relevant capabilities: "
                  f"{capability_text}. "
                  "The bid is based only on the "
                  "reward information observed "
                  "from the marketplace."
              )

              result = post(
                  "/api/v1/marketplace/"
                  + str(tid)
                  + "/bid",
                  {
                      "bid_amount_sats":
                          bid_amount,
                      "bid_description":
                          description[:5000]
                  }
              )

              if result is None:
                  continue

              if result.status_code in {
                  200,
                  201
              }:

                  body = {}

                  try:
                      body = result.json()
                  except Exception:
                      pass

                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                  )

                  state[
                      "bids"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "task_title": (
                          candidate["title"]
                      ),
                      "bid_id": bid_id,
                      "amount_sats":
                          bid_amount,
                      "status":
                          "SUBMITTED",
                      "score":
                          candidate["score"]
                  })

                  candidate[
                      "decision"
                  ] = (
                      "BID_SUBMITTED"
                  )

                  bids_created += 1

              elif result.status_code == 409:

                  bid_conflicts += 1

                  candidate[
                      "decision"
                  ] = (
                      "SERVER_CONFLICT"
                  )

                  state[
                      "failure_ledger"
                  ].append({
                      "timestamp": NOW,
                      "type":
                          "BID_CONFLICT",
                      "task_id": tid,
                      "cause": (
                          "Marketplace rejected "
                          "the bid as conflicting."
                      ),
                      "correction": (
                          "Do not retry blindly."
                      )
                  })

              else:

                  candidate[
                      "decision"
                  ] = (
                      "BID_FAILED"
                  )

                  state[
                      "failure_ledger"
                  ].append({
                      "timestamp": NOW,
                      "type":
                          "BID_HTTP_FAILURE",
                      "task_id": tid,
                      "status_code":
                          result.status_code
                  })

          # =========================================================
          # Reconciliation
          # EXISTING LOGIC PRESERVED
          # =========================================================

          tracked = []

          for item in reversed(
              state["bids"]
          ):

              if item.get(
                  "task_id"
              ):
                  tracked.append(
                      item
                  )

          unique = {}

          for item in tracked:

              unique[
                  str(
                      item["task_id"]
                  )
              ] = item

          tracked = list(
              unique.values()
          )[:MAX_RECONCILE]

          accepted = 0
          pending = 0
          rejected = 0
          paid = 0

          for item in tracked:

              tid = item[
                  "task_id"
              ]

              bids = get_bids(
                  tid
              )

              mine = None

              expected_id = item.get(
                  "bid_id"
              )

              if expected_id is not None:

                  for bid in bids:

                      current_id = (
                          bid.get("id")
                          or bid.get(
                              "bid_id"
                          )
                      )

                      if (
                          str(current_id)
                          == str(expected_id)
                      ):

                          mine = bid
                          break

              if mine is None:

                  for bid in bids:

                      if own_bid(bid):

                          mine = bid
                          break

              if mine is None:
                  continue

              status = normalize_status(
                  mine.get("status")
              )

              if status == "ACCEPTED":
                  accepted += 1

              elif status == "PENDING":
                  pending += 1

              elif status == "REJECTED":
                  rejected += 1

              payment_status = None

              if status == "ACCEPTED":

                  payment = get(
                      "/api/v1/marketplace/"
                      + str(tid)
                      + "/payment"
                  )

                  if isinstance(
                      payment,
                      dict
                  ):

                      payment_status = (
                          payment.get(
                              "status"
                          )
                          or payment.get(
                              "payment_status"
                          )
                      )

                      if str(
                          payment_status
                          or ""
                      ).lower() in {
                          "paid",
                          "completed",
                          "settled"
                      }:

                          paid += 1

              state[
                  "observations"
              ].append({
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": (
                      mine.get("id")
                      or mine.get(
                          "bid_id"
                      )
                      or expected_id
                  ),
                  "status": status,
                  "amount_sats": (
                      mine.get(
                          "bid_amount_sats"
                      )
                      or mine.get(
                          "amount_sats"
                      )
                      or mine.get(
                          "amount"
                      )
                  ),
                  "payment_status":
                      payment_status,
                  "gemini_used":
                      False,
                  "external_ai_used":
                      False,
                  "payments_enabled":
                      False,
                  "spending_enabled":
                      False,
                  "project_cost_eur":
                      0
              })

              previous = item.get(
                  "last_observed_status"
              )

              if previous != status:

                  state[
                      "outcomes"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "bid_id": (
                          mine.get("id")
                          or mine.get(
                              "bid_id"
                          )
                          or expected_id
                      ),
                      "previous_status":
                          previous,
                      "new_status":
                          status,
                      "payment_status":
                          payment_status
                  })

                  if status == "ACCEPTED":

                      state[
                          "learning"
                      ].append({
                          "timestamp": NOW,
                          "type":
                              "POSITIVE_OUTCOME",
                          "task_id": tid,
                          "lesson": (
                              "A real bid reached "
                              "ACCEPTED. Preserve "
                              "observable task "
                              "characteristics "
                              "for comparison."
                          )
                      })

                  elif status == "REJECTED":

                      state[
                          "learning"
                      ].append({
                          "timestamp": NOW,
                          "type":
                              "NEGATIVE_OUTCOME",
                          "task_id": tid,
                          "lesson": (
                              "A real bid was "
                              "rejected. Compare "
                              "task characteristics, "
                              "reward, timing and "
                              "competition before "
                              "changing capability "
                              "assumptions."
                          )
                      })

              item[
                  "last_observed_status"
              ] = status

              item[
                  "last_payment_status"
              ] = payment_status

          # =========================================================
          # =========================================================
          # NEW EXECUTION EXTENSION
          # =========================================================
          # =========================================================

          print("")
          print(
              "=== LEDGER 03 EXECUTION EXTENSION ==="
          )

          def get_post(post_id):
              return get(
                  "/api/v1/posts/"
                  + str(post_id)
              )

          def get_comments(post_id):
              result = get(
                  "/api/v1/posts/"
                  + str(post_id)
                  + "/comments",
                  {
                      "limit":
                          MAX_COMMENTS,
                      "page": 1,
                      "sort": "newest"
                  }
              )

              if isinstance(
                  result,
                  dict
              ):
                  return result.get(
                      "items",
                      []
                  )

              if isinstance(
                  result,
                  list
              ):
                  return result

              return []

          def post_comment(
              post_id,
              body,
              parent_id=None
          ):

              payload = {
                  "body": body
              }

              if parent_id:
                  payload[
                      "parent_id"
                  ] = parent_id

              return post(
                  "/api/v1/posts/"
                  + str(post_id)
                  + "/comments",
                  payload
              )

          def comment_exists(
              post_id,
              marker
          ):

              comments = get_comments(
                  post_id
              )

              for comment in comments:

                  if not isinstance(
                      comment,
                      dict
                  ):
                      continue

                  author = clean(
                      comment.get(
                          "author"
                      )
                  ).lower()

                  body = clean(
                      comment.get(
                          "body"
                      )
                  )

                  if (
                      username.lower()
                      in author
                      and marker
                      in body
                  ):
                      return comment

                  embedded_author = (
                      comment.get(
                          "author"
                      )
                  )

                  if isinstance(
                      embedded_author,
                      dict
                  ):

                      embedded_username = (
                          clean(
                              embedded_author.get(
                                  "username"
                              )
                          ).lower()
                      )

                      if (
                          embedded_username
                          == username.lower()
                          and marker
                          in body
                      ):
                          return comment

              return None

          def extract_urls(value):

              urls = re.findall(
                  r"https?://[^\s<>\]\)\"']+",
                  text(value)
              )

              cleaned_urls = []

              for url in urls:

                  url = url.rstrip(
                      ".,;:!?)]}"
                  )

                  if url not in cleaned_urls:
                      cleaned_urls.append(
                          url
                      )

              return cleaned_urls[
                  :MAX_RESEARCH_URLS
              ]

          def html_to_text(raw):

              if not raw:
                  return ""

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  raw,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = html.unescape(
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()

          def safe_web_fetch(url):

              parsed = urlparse(
                  url
              )

              if parsed.scheme not in {
                  "http",
                  "https"
              }:
                  return {
                      "ok": False,
                      "error":
                          "UNSUPPORTED_SCHEME"
                  }

              try:

                  response = requests.get(
                      url,
                      timeout=EXECUTION_TIMEOUT,
                      headers={
                          "User-Agent":
                              "NOX-Ledger03-Research/1.0",
                          "Accept":
                              "text/html,"
                              "application/json,"
                              "text/plain"
                      },
                      allow_redirects=True
                  )

                  content_type = (
                      response.headers.get(
                          "content-type",
                          ""
                      )
                  )

                  raw = response.text[
                      :500000
                  ]

                  if (
                      "html"
                      in content_type.lower()
                  ):
                      extracted = (
                          html_to_text(
                              raw
                          )
                      )
                  else:
                      extracted = raw

                  return {
                      "ok":
                          response.ok,
                      "url":
                          response.url,
                      "status":
                          response.status_code,
                      "content_type":
                          content_type,
                      "text":
                          extracted[
                              :30000
                          ],
                      "length":
                          len(extracted)
                  }

              except Exception as exc:

                  return {
                      "ok": False,
                      "error": str(
                          exc
                      )
                  }

          def extract_title_from_text(
              value
          ):

              value = clean(
                  value
              )

              if not value:
                  return ""

              return value[
                  :300
              ]

          def detect_execution_mode(
              title,
              description
          ):

              combined = (
                  title
                  + " "
                  + description
              ).lower()

              if is_blocked(
                  combined
              ):
                  return (
                      "BLOCKED_SAFETY"
                  )

              if has_any(
                  combined,
                  [
                      "deep research",
                      "research report",
                      "research brief",
                      "market research",
                      "competitive research",
                      "fact check",
                      "source verification",
                      "write a report",
                      "report writing",
                      "technical report"
                  ]
              ):
                  return "RESEARCH_REPORT"

              if has_any(
                  combined,
                  [
                      "research",
                      "audit",
                      "analysis",
                      "analyze",
                      "investigate",
                      "verify",
                      "verification",
                      "qa",
                      "smoke test",
                      "api test"
                  ]
              ):
                  return "RESEARCH_ANALYSIS"

              if has_any(
                  combined,
                  [
                      "data cleanup",
                      "data cleaning",
                      "csv",
                      "json cleanup",
                      "data validation"
                  ]
              ):
                  return "DATA_ANALYSIS"

              if has_any(
                  combined,
                  [
                      "github",
                      "repository",
                      "repo",
                      "pull request",
                      "issue"
                  ]
              ):
                  return "REPOSITORY_RESEARCH"

              if has_any(
                  combined,
                  [
                      "build",
                      "implement",
                      "develop",
                      "write code",
                      "python script",
                      "tool development",
                      "agent tooling"
                  ]
              ):
                  return "CODE_TASK"

              return "GENERAL_TASK"

          def extract_brief_requirements(
              title,
              description
          ):

              combined = clean(
                  title
                  + " "
                  + description
              )

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  combined
              )

              requirements = []

              for sentence in sentences:

                  sentence = clean(
                      sentence
                  )

                  if not sentence:
                      continue

                  if has_any(
                      sentence,
                      [
                          "deliver",
                          "delivery",
                          "deliverable",
                          "provide",
                          "return",
                          "report",
                          "must",
                          "need",
                          "include",
                          "required",
                          "output"
                      ]
                  ):
                      requirements.append(
                          sentence[:500]
                      )

              return requirements[
                  :20
              ]

          def build_research_execution(
              task,
              post,
              comments
          ):

              tid = task_id(
                  task
              )

              title = task_title(
                  task
              )

              description = (
                  task_description(
                      task
                  )
              )

              full_text = clean(
                  title
                  + " "
                  + description
              )

              urls = extract_urls(
                  full_text
              )

              for comment in comments:

                  if not isinstance(
                      comment,
                      dict
                  ):
                      continue

                  comment_body = clean(
                      comment.get(
                          "body"
                      )
                  )

                  for url in extract_urls(
                      comment_body
                  ):

                      if (
                          url
                          not in urls
                      ):
                          urls.append(
                              url
                          )

                          if (
                              len(urls)
                              >=
                              MAX_RESEARCH_URLS
                          ):
                              break

              evidence = []

              for url in urls:

                  result = (
                      safe_web_fetch(
                          url
                      )
                  )

                  evidence.append({
                      "url":
                          url,
                      "ok":
                          result.get(
                              "ok",
                              False
                          ),
                      "status":
                          result.get(
                              "status"
                          ),
                      "content_type":
                          result.get(
                              "content_type"
                          ),
                      "retrieved_at":
                          NOW,
                      "text_excerpt":
                          result.get(
                              "text",
                              ""
                          )[:2500]
                  })

              requirements = (
                  extract_brief_requirements(
                      title,
                      description
                  )
              )

              successful_sources = [
                  item
                  for item in evidence
                  if item.get(
                      "ok"
                  )
              ]

              failed_sources = [
                  item
                  for item in evidence
                  if not item.get(
                      "ok"
                  )
              ]

              lines = []

              lines.append(
                  "## NØX DELIVERY — "
                  "EXECUTED WORK"
              )

              lines.append("")

              lines.append(
                  f"Task: {title}"
              )

              lines.append(
                  f"Task ID: {tid}"
              )

              lines.append(
                  f"Execution time: {NOW}"
              )

              lines.append("")

              lines.append(
                  "### Execution status"
              )

              lines.append(
                  "The task brief was retrieved, "
                  "the requested public information "
                  "was processed, and the evidence "
                  "below records the actual execution."
              )

              lines.append("")

              lines.append(
                  "### Scope detected"
              )

              if requirements:

                  for requirement in (
                      requirements
                  ):
                      lines.append(
                          "- " + requirement
                      )

              else:

                  lines.append(
                      "- No explicit "
                      "deliverable sentence "
                      "was detected automatically."
                  )

              lines.append("")

              lines.append(
                  "### Sources actually checked"
              )

              if evidence:

                  for item in evidence:

                      status = item.get(
                          "status"
                      )

                      ok = item.get(
                          "ok"
                      )

                      lines.append(
                          f"- "
                          f"{'PASS' if ok else 'FAIL'} "
                          f"| HTTP {status} "
                          f"| {item.get('url')}"
                      )

              else:

                  lines.append(
                      "- No public URL was "
                      "present in the task."
                  )

              lines.append("")

              lines.append(
                  "### Evidence"
              )

              if successful_sources:

                  for index, item in enumerate(
                      successful_sources,
                      start=1
                  ):

                      lines.append(
                          f"#### Source {index}"
                      )

                      lines.append(
                          f"URL: "
                          f"{item.get('url')}"
                      )

                      lines.append(
                          f"HTTP: "
                          f"{item.get('status')}"
                      )

                      excerpt = clean(
                          item.get(
                              "text_excerpt",
                              ""
                          )
                      )

                      if excerpt:

                          lines.append(
                              "Observed content:"
                          )

                          lines.append(
                              excerpt[:1800]
                          )

                      lines.append("")

              else:

                  lines.append(
                      "No source returned a "
                      "successful response."
                  )

              if failed_sources:

                  lines.append(
                      "### Sources that could not "
                      "be verified"
                  )

                  for item in (
                      failed_sources
                  ):

                      lines.append(
                          f"- {item.get('url')} "
                          f"| {item.get('error') or item.get('status')}"
                      )

                  lines.append("")

              lines.append(
                  "### Execution limitations"
              )

              lines.append(
                  "This execution used only "
                  "public/read-only Web requests "
                  "and local deterministic processing. "
                  "No paid service, external AI, "
                  "Gemini, credential acquisition, "
                  "or spending operation was used."
              )

              lines.append("")

              lines.append(
                  "### Delivery declaration"
              )

              lines.append(
                  "This comment is the recorded "
                  "delivery artifact for the accepted "
                  "task. The task owner can review "
                  "the evidence and request a correction "
                  "if the delivered scope is insufficient."
              )

              delivery = "\n".join(
                  lines
              )

              return {
                  "mode":
                      "RESEARCH_EXECUTION",
                  "task_id":
                      tid,
                  "title":
                      title,
                  "urls":
                      urls,
                  "evidence":
                      evidence,
                  "requirements":
                      requirements,
                  "delivery":
                      delivery[
                          :MAX_DELIVERY_CHARS
                      ]
              }

          def build_general_execution(
              task,
              post,
              comments
          ):

              tid = task_id(
                  task
              )

              title = task_title(
                  task
              )

              description = (
                  task_description(
                      task
                  )
              )

              mode = detect_execution_mode(
                  title,
                  description
              )

              if mode in {
                  "RESEARCH_REPORT",
                  "RESEARCH_ANALYSIS",
                  "REPOSITORY_RESEARCH",
                  "DATA_ANALYSIS"
              }:

                  return (
                      build_research_execution(
                          task,
                          post,
                          comments
                      )
                  )

              if mode == "CODE_TASK":

                  return {
                      "mode":
                          "CODE_TASK",
                      "task_id":
                          tid,
                      "title":
                          title,
                      "delivery":
                          (
                              "## NØX DELIVERY — "
                              "EXECUTION BLOCKED\n\n"
                              "The accepted task requires "
                              "code implementation, but the "
                              "brief does not provide a safe "
                              "deterministic execution path "
                              "that can be completed without "
                              "inventing code or using an "
                              "external AI system.\n\n"
                              "NØX did not fabricate a "
                              "deliverable. The task brief, "
                              "acceptance state and required "
                              "capabilities were recorded "
                              "for follow-up."
                          )
                  }

              return {
                  "mode":
                      "GENERAL_TASK",
                  "task_id":
                      tid,
                  "title":
                      title,
                  "delivery":
                      (
                          "## NØX DELIVERY — "
                          "EXECUTION REVIEW\n\n"
                          "NØX retrieved the accepted "
                          "task and inspected its complete "
                          "brief and discussion. The task "
                          "does not expose enough "
                          "deterministic information for "
                          "a safe automated execution "
                          "without inventing missing "
                          "requirements.\n\n"
                          "No fabricated result was "
                          "submitted."
                      )
              }

          def execution_marker(
              task_id_value
          ):

              return (
                  "[NØX-DELIVERY:"
                  + str(
                      task_id_value
                  )
                  + "]"
              )

          def already_delivered(
              task_id_value
          ):

              marker = execution_marker(
                  task_id_value
              )

              for item in state[
                  "deliveries"
              ]:

                  if (
                      str(
                          item.get(
                              "task_id"
                          )
                      )
                      == str(
                          task_id_value
                      )
                      and item.get(
                          "marker"
                      ) == marker
                  ):
                      return True

              return False

          # ---------------------------------------------------------
          # Find accepted bids from current reconciliation.
          # ---------------------------------------------------------

          accepted_items = []

          for item in tracked:

              if (
                  item.get(
                      "last_observed_status"
                  )
                  == "ACCEPTED"
              ):
                  accepted_items.append(
                      item
                  )

          print(
              "ACCEPTED MISSIONS AVAILABLE: "
              f"{len(accepted_items)}"
          )

          executions_this_run = 0

          for item in accepted_items:

              if executions_this_run >= (
                  MAX_EXECUTIONS
              ):
                  break

              tid = item.get(
                  "task_id"
              )

              if not tid:
                  continue

              # -----------------------------------------------------
              # Never execute the same accepted task repeatedly.
              # -----------------------------------------------------

              if already_delivered(
                  tid
              ):

                  print(
                      f"EXECUTION SKIP "
                      f"{tid}: already delivered"
                  )

                  continue

              print(
                  f"EXECUTING ACCEPTED TASK: "
                  f"{tid}"
              )

              post_data = get_post(
                  tid
              )

              if not isinstance(
                  post_data,
                  dict
              ):

                  failure = {
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "MISSION_RETRIEVAL",
                      "reason":
                          "TASK_POST_UNAVAILABLE"
                  }

                  state[
                      "execution_failures"
                  ].append(
                      failure
                  )

                  state[
                      "failure_ledger"
                  ].append({
                      "timestamp": NOW,
                      "type":
                          "EXECUTION_RETRIEVAL_FAILURE",
                      "task_id": tid,
                      "cause":
                          "Accepted task could not "
                          "be retrieved.",
                      "correction":
                          "Retry on a later run; "
                          "do not fabricate work."
                  })

                  continue

              task = dict(
                  post_data
              )

              task.setdefault(
                  "id",
                  tid
              )

              task.setdefault(
                  "title",
                  task_title(
                      post_data
                  )
              )

              task.setdefault(
                  "description",
                  task_description(
                      post_data
                  )
              )

              title = task_title(
                  task
              )

              description = (
                  task_description(
                      task
                  )
              )

              comments = get_comments(
                  tid
              )

              mode = detect_execution_mode(
                  title,
                  description
              )

              mission_record = {
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": item.get(
                      "bid_id"
                  ),
                  "title": title[:500],
                  "execution_mode": mode,
                  "status":
                      "RETRIEVED",
                  "brief_excerpt":
                      description[:2000],
                  "comments_seen":
                      len(comments),
                  "gemini_used":
                      False,
                  "external_ai_used":
                      False,
                  "payments_enabled":
                      False,
                  "spending_enabled":
                      False,
                  "project_cost_eur":
                      0
              }

              state[
                  "missions"
              ].append(
                  mission_record
              )

              if not EXECUTION_ENABLED:

                  mission_record[
                      "status"
                  ] = "EXECUTION_DISABLED"

                  continue

              # -----------------------------------------------------
              # Safety gate
              # -----------------------------------------------------

              if is_blocked(
                  title + " " + description
              ):

                  mission_record[
                      "status"
                  ] = "BLOCKED_SAFETY"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "SAFETY_GATE",
                      "reason":
                          "BLOCKED_TERM"
                  })

                  continue

              # -----------------------------------------------------
              # Execute deterministic work.
              # -----------------------------------------------------

              execution = (
                  build_general_execution(
                      task,
                      post_data,
                      comments
                  )
              )

              if not isinstance(
                  execution,
                  dict
              ):

                  mission_record[
                      "status"
                  ] = "EXECUTION_FAILED"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "EXECUTION",
                      "reason":
                          "NO_EXECUTION_RESULT"
                  })

                  continue

              execution_mode = (
                  execution.get(
                      "mode",
                      mode
                  )
              )

              delivery = clean(
                  execution.get(
                      "delivery",
                      ""
                  )
              )

              if not delivery:

                  mission_record[
                      "status"
                  ] = "EXECUTION_FAILED"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "DELIVERY_PREPARATION",
                      "reason":
                          "EMPTY_DELIVERABLE"
                  })

                  continue

              marker = (
                  execution_marker(
                      tid
                  )
              )

              # -----------------------------------------------------
              # A code task cannot be honestly claimed as completed
              # by this deterministic executor.
              # -----------------------------------------------------

              if execution_mode == "CODE_TASK":

                  mission_record[
                      "status"
                  ] = "BLOCKED_CAPABILITY"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "EXECUTION",
                      "reason":
                          "CODE_TASK_REQUIRES_DETERMINISTIC_IMPLEMENTATION",
                      "detail":
                          "No external AI and no arbitrary "
                          "untrusted code execution."
                  })

                  state[
                      "learning"
                  ].append({
                      "timestamp": NOW,
                      "type":
                          "EXECUTION_CAPABILITY_GAP",
                      "task_id": tid,
                      "lesson":
                          "Accepted coding tasks require "
                          "a safe deterministic execution "
                          "path before automatic delivery."
                  })

                  continue

              # -----------------------------------------------------
              # Research / analysis / evidence tasks:
              # publish actual delivery to task thread.
              # -----------------------------------------------------

              if already_delivered(
                  tid
              ):

                  continue

              final_delivery = (
                  marker
                  + "\n\n"
                  + delivery
              )

              if len(
                  final_delivery
              ) > MAX_DELIVERY_CHARS:

                  final_delivery = (
                      final_delivery[
                          :MAX_DELIVERY_CHARS
                      ]
                      + "\n\n"
                      + "[NØX DELIVERY "
                      "TRUNCATED TO SAFE "
                      "PLATFORM LIMIT]"
                  )

              response = post_comment(
                  tid,
                  final_delivery
              )

              if response is None:

                  mission_record[
                      "status"
                  ] = "DELIVERY_HTTP_ERROR"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "DELIVERY",
                      "reason":
                          "NO_HTTP_RESPONSE"
                  })

                  continue

              if response.status_code not in {
                  200,
                  201
              }:

                  mission_record[
                      "status"
                  ] = "DELIVERY_FAILED"

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "DELIVERY",
                      "reason":
                          "COMMENT_CREATE_FAILED",
                      "status_code":
                          response.status_code
                  })

                  print(
                      "DELIVERY FAILED "
                      f"{tid}: HTTP "
                      f"{response.status_code}"
                  )

                  continue

              comment_data = {}

              try:
                  comment_data = (
                      response.json()
                  )
              except Exception:
                  pass

              delivery_comment_id = (
                  comment_data.get(
                      "id"
                  )
                  or comment_data.get(
                      "comment_id"
                  )
              )

              # -----------------------------------------------------
              # Delivery verification.
              # -----------------------------------------------------

              verified = False

              for verification_attempt in (
                  1,
                  2
              ):

                  observed = (
                      comment_exists(
                          tid,
                          marker
                      )
                  )

                  if observed:

                      verified = True

                      if not delivery_comment_id:
                          delivery_comment_id = (
                              observed.get(
                                  "id"
                              )
                              or observed.get(
                                  "comment_id"
                              )
                          )

                      break

              if not verified:

                  mission_record[
                      "status"
                  ] = (
                      "DELIVERY_UNVERIFIED"
                  )

                  state[
                      "execution_failures"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "stage":
                          "DELIVERY_VERIFICATION",
                      "reason":
                          "COMMENT_NOT_FOUND_AFTER_CREATE",
                      "comment_id":
                          delivery_comment_id
                  })

                  continue

              mission_record[
                  "status"
              ] = "DELIVERED"

              mission_record[
                  "delivery_comment_id"
              ] = delivery_comment_id

              mission_record[
                  "execution_mode"
              ] = execution_mode

              state[
                  "deliveries"
              ].append({
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": item.get(
                      "bid_id"
                  ),
                  "comment_id":
                      delivery_comment_id,
                  "marker": marker,
                  "execution_mode":
                      execution_mode,
                  "status":
                      "DELIVERED",
                  "verified":
                      True,
                  "gemini_used":
                      False,
                  "external_ai_used":
                      False,
                  "payments_enabled":
                      False,
                  "spending_enabled":
                      False,
                  "project_cost_eur":
                      0
              })

              state[
                  "execution_observations"
              ].append({
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": item.get(
                      "bid_id"
                  ),
                  "execution_mode":
                      execution_mode,
                  "result":
                      "DELIVERED",
                  "delivery_verified":
                      True,
                  "delivery_comment_id":
                      delivery_comment_id,
                  "sources_checked":
                      len(
                          execution.get(
                              "urls",
                              []
                          )
                      )
              })

              state[
                  "outcomes"
              ].append({
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": item.get(
                      "bid_id"
                  ),
                  "previous_status":
                      "ACCEPTED",
                  "new_status":
                      "DELIVERED",
                  "payment_status":
                      None,
                  "execution":
                      "COMPLETED"
              })

              state[
                  "learning"
              ].append({
                  "timestamp": NOW,
                  "type":
                      "EXECUTION_OUTCOME",
                  "task_id": tid,
                  "lesson":
                      (
                          "An accepted task was "
                          "retrieved, processed with "
                          "deterministic evidence-based "
                          "execution, delivered through "
                          "the task thread and verified "
                          "by readback."
                      )
              })

              executions_this_run += 1

              print(
                  "EXECUTION COMPLETE: "
                  f"{tid}"
              )

              # -----------------------------------------------------
              # Payment observation AFTER delivery.
              # -----------------------------------------------------

              payment = get(
                  "/api/v1/marketplace/"
                  + str(tid)
                  + "/payment"
              )

              payment_status = None

              if isinstance(
                  payment,
                  dict
              ):

                  payment_status = (
                      payment.get(
                          "status"
                      )
                      or payment.get(
                          "payment_status"
                      )
                  )

              if str(
                  payment_status or ""
              ).lower() in {
                  "paid",
                  "completed",
                  "settled"
              }:

                  state[
                      "outcomes"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "bid_id": item.get(
                          "bid_id"
                      ),
                      "previous_status":
                          "DELIVERED",
                      "new_status":
                          "PAID",
                      "payment_status":
                          payment_status
                  })

                  state[
                      "learning"
                  ].append({
                      "timestamp": NOW,
                      "type":
                          "PAID_OUTCOME",
                      "task_id": tid,
                      "lesson":
                          (
                              "Delivery was followed "
                              "by an observed payment."
                          )
                  })

              else:

                  state[
                      "execution_observations"
                  ].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "result":
                          "DELIVERED_PAYMENT_PENDING",
                      "payment_status":
                          payment_status
                  })

          print(
              "EXECUTIONS THIS RUN: "
              f"{executions_this_run}"
          )

          # =========================================================
          # Consume cognitive candidates
          # EXISTING LOGIC PRESERVED
          # =========================================================

          for candidate in (
              pending_cognitive
          ):

              candidate[
                  "status"
              ] = "evaluated"

              candidate[
                  "evaluated_at"
              ] = NOW

              candidate[
                  "marketplace_tasks_seen"
              ] = len(tasks)

              candidate[
                  "bid_candidates_found"
              ] = len(candidates)

              candidate[
                  "bids_created"
              ] = bids_created

              state[
                  "cognitive_actions"
              ].append({
                  "timestamp": NOW,
                  "source":
                      "LEDGER_02",
                  "candidate":
                      candidate
              })

          if pending_cognitive:

              cognition[
                  "action_candidates"
              ] = (
                  cognitive_candidates
              )

              cognition[
                  "updated_at"
              ] = NOW

              save_json(
                  COGNITION_FILE,
                  cognition
              )

          # =========================================================
          # Memory limits
          # EXISTING LIMITS PRESERVED + NEW EXECUTION LIMITS
          # =========================================================

          state[
              "decisions"
          ] = state[
              "decisions"
          ][-500:]

          state[
              "bids"
          ] = state[
              "bids"
          ][-500:]

          state[
              "observations"
          ] = state[
              "observations"
          ][-500:]

          state[
              "outcomes"
          ] = state[
              "outcomes"
          ][-300:]

          state[
              "failure_ledger"
          ] = state[
              "failure_ledger"
          ][-300:]

          state[
              "learning"
          ] = state[
              "learning"
          ][-300:]

          state[
              "tip_candidates"
          ] = state[
              "tip_candidates"
          ][-200:]

          state[
              "cognitive_actions"
          ] = state[
              "cognitive_actions"
          ][-200:]

          state[
              "missions"
          ] = state[
              "missions"
          ][-200:]

          state[
              "deliveries"
          ] = state[
              "deliveries"
          ][-200:]

          state[
              "execution_observations"
          ] = state[
              "execution_observations"
          ][-300:]

          state[
              "execution_failures"
          ] = state[
              "execution_failures"
          ][-300:]

          state[
              "research_runs"
          ] = state[
              "research_runs"
          ][-200:]

          # =========================================================
          # Statistics
          # EXISTING STATS PRESERVED + EXECUTION STATS
          # =========================================================

          state[
              "version"
          ] = "2.1"

          state[
              "updated_at"
          ] = NOW

          state[
              "stats"
          ] = {
              "tasks_seen":
                  len(tasks),

              "tasks_evaluated":
                  len(decisions),

              "bid_candidates":
                  len(candidates),

              "bids_created_this_run":
                  bids_created,

              "bid_conflicts":
                  bid_conflicts,

              "tracked_bids":
                  len(tracked),

              "accepted":
                  accepted,

              "pending":
                  pending,

              "rejected":
                  rejected,

              "paid_observed":
                  paid,

              "accepted_missions_seen":
                  len(
                      accepted_items
                  ),

              "executions_this_run":
                  executions_this_run,

              "missions_recorded":
                  len(
                      state[
                          "missions"
                      ]
                  ),

              "deliveries_recorded":
                  len(
                      state[
                          "deliveries"
                      ]
                  ),

              "execution_failures":
                  len(
                      state[
                          "execution_failures"
                      ]
                  ),

              "cognitive_candidates_received":
                  len(
                      pending_cognitive
                  ),

              "cognitive_candidates_evaluated":
                  len(
                      pending_cognitive
                  ),

              "skip_reasons":
                  dict(
                      skip_reasons
                  ),

              "execution_enabled":
                  EXECUTION_ENABLED,

              "gemini_used":
                  False,

              "external_ai_used":
                  False,

              "payments_enabled":
                  False,

              "spending_enabled":
                  False,

              "project_cost_eur":
                  0
          }

          save_json(
              ACTION_FILE,
              state
          )

          # =========================================================
          # Runtime log
          # EXISTING LOG STYLE PRESERVED
          # =========================================================

          print("")
          print(
              "======================================"
          )
          print(
              "=== NØX LEDGER 03 V2.1 COMPLETE ==="
          )
          print(
              "======================================"
          )

          print(
              f"Identity: {username}"
          )

          print(
              "Cognitive candidates received: "
              f"{len(pending_cognitive)}"
          )

          print(
              f"Tasks found: {len(tasks)}"
          )

          print(
              "Tasks evaluated: "
              f"{len(decisions)}"
          )

          print(
              "Bid candidates: "
              f"{len(candidates)}"
          )

          print(
              "Bids created: "
              f"{bids_created}"
          )

          print(
              "Bid conflicts: "
              f"{bid_conflicts}"
          )

          print(
              "Tracked bids: "
              f"{len(tracked)}"
          )

          print(
              f"Accepted: {accepted}"
          )

          print(
              f"Pending: {pending}"
          )

          print(
              f"Rejected: {rejected}"
          )

          print(
              f"Paid observed: {paid}"
          )

          print(
              "Accepted missions seen: "
              f"{len(accepted_items)}"
          )

          print(
              "Executions this run: "
              f"{executions_this_run}"
          )

          print(
              "Deliveries recorded: "
              f"{len(state['deliveries'])}"
          )

          print(
              "Execution failures: "
              f"{len(state['execution_failures'])}"
          )

          print("")

          print(
              "SKIP REASONS:"
          )

          if skip_reasons:

              for reason, count in (
                  skip_reasons.most_common()
              ):

                  print(
                      f"  {reason}: {count}"
                  )

          else:

              print(
                  "  none"
              )

          print("")

          print(
              "Execution: "
              f"{EXECUTION_ENABLED}"
          )

          print(
              "Real bids: ENABLED"
          )

          print(
              "Payments: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )

          print(
              "Gemini: False"
          )

          print(
              "External AI: False"
          )

          print(
              "Project cost: €0"
          )

          print(
              "======================================"
          )
          PY

      - name: Commit action and cognition state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_ledger_action.json \
            memory/nox_ledger_cognition.json

          if git diff --cached --quiet; then
            echo "No action-state changes."
            exit 0
          fi

          git commit -m "ledger03: execute actions and learn from outcomes"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: unable to push after 3 attempts."
          exit 1
