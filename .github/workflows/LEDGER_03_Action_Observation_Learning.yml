      - name: Commit action state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_ledger_action.json

          if git diff --cached --quiet; then
            echo "No action-state changes."
            exit 0
          fi

          git commit -m "ledger03: update action results and learning"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 2
              continue
            fi

            git push origin HEAD:main && exit 0
            sleep 2
          done

          exit 1
