name: NØX LEDGER 03 - Action Observation Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  action-observation-learning:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      ACTION_FILE: memory/nox_ledger_action.json
      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json
      COGNITION_FILE: memory/nox_ledger_cognition.json

      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE: "30"
      MIN_BID_SATS: "1"

      BID_SCORE_THRESHOLD: "50"
      MAX_DECISIONS_MEMORY: "500"
      MAX_FAILURES_MEMORY: "300"
      MAX_LEARNING_MEMORY: "300"
      MAX_TIP_CANDIDATES_MEMORY: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Run LEDGER 03
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]

          ACTION_FILE = Path(os.environ["ACTION_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          COGNITION_FILE = Path(os.environ["COGNITION_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])

          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )

          MAX_DECISIONS_MEMORY = int(
              os.environ["MAX_DECISIONS_MEMORY"]
          )

          MAX_FAILURES_MEMORY = int(
              os.environ["MAX_FAILURES_MEMORY"]
          )

          MAX_LEARNING_MEMORY = int(
              os.environ["MAX_LEARNING_MEMORY"]
          )

          MAX_TIP_CANDIDATES_MEMORY = int(
              os.environ["MAX_TIP_CANDIDATES_MEMORY"]
          )

          now = datetime.now(timezone.utc).isoformat()

          # =========================================================
          # Persistence
          # =========================================================

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
                  return data
              except Exception as exc:
                  print(
                      f"LOAD WARNING {path}: {exc}"
                  )
                  return default

          def save(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              tmp.replace(path)

          state = load(
              ACTION_FILE,
              {
                  "version": "2.0",
                  "decisions": [],
                  "bids": [],
                  "observations": [],
                  "outcomes": [],
                  "failure_ledger": [],
                  "tip_candidates": [],
                  "learning": [],
                  "cognitive_actions": [],
                  "stats": {}
              }
          )

          if not isinstance(state, dict):
              state = {}

          state.setdefault("version", "2.0")
          state.setdefault("decisions", [])
          state.setdefault("bids", [])
          state.setdefault("observations", [])
          state.setdefault("outcomes", [])
          state.setdefault("failure_ledger", [])
          state.setdefault("tip_candidates", [])
          state.setdefault("learning", [])
          state.setdefault("cognitive_actions", [])
          state.setdefault("stats", {})

          knowledge = load(
              KNOWLEDGE_FILE,
              {"knowledge": []}
          )

          if not isinstance(knowledge, dict):
              knowledge = {"knowledge": []}

          cognition = load(
              COGNITION_FILE,
              {}
          )

          if not isinstance(cognition, dict):
              cognition = {}

          # =========================================================
          # HTTP
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-Action/2.0"
          })

          def authenticate():
              try:
                  response = session.post(
                      BASE + "/api/v1/auth/token",
                      json={"api_key": KEY},
                      timeout=15
                  )

                  if not response.ok:
                      print(
                          "AUTH FAILED: "
                          f"HTTP {response.status_code}"
                      )
                      return False

                  data = response.json()

                  token = data.get(
                      "access_token"
                  )

                  if not token:
                      print(
                          "AUTH FAILED: "
                          "no access_token"
                      )
                      return False

                  session.headers[
                      "Authorization"
                  ] = "Bearer " + token

                  return True

              except Exception as exc:
                  print(
                      f"AUTH ERROR: {exc}"
                  )
                  return False

          authenticate()

          def get(path, params=None):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.get(
                          BASE + path,
                          params=params,
                          timeout=20
                      )

                  if response.ok:
                      try:
                          return response.json()
                      except Exception:
                          return None

                  print(
                      f"GET {path}: "
                      f"HTTP {response.status_code}"
                  )

              except Exception as exc:
                  print(
                      f"GET ERROR {path}: {exc}"
                  )

              return None

          def post(path, payload):
              try:
                  response = session.post(
                      BASE + path,
                      json=payload,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.post(
                          BASE + path,
                          json=payload,
                          timeout=20
                      )

                  return response

              except Exception as exc:
                  print(
                      f"POST ERROR {path}: {exc}"
                  )
                  return None

          # =========================================================
          # Generic helpers
          # =========================================================

          def flat(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, dict):
                  return " ".join(
                      flat(v)
                      for v in value.values()
                  )

              if isinstance(value, list):
                  return " ".join(
                      flat(v)
                      for v in value
                  )

              return str(value)

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  flat(value)
              ).strip()

          def fingerprint(*values):
              normalized = " ".join(
                  clean(value).lower()
                  for value in values
                  if clean(value)
              )

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()[:20]

          def contains_any(text, terms):
              low = clean(text).lower()

              return any(
                  term.lower() in low
                  for term in terms
              )

          # =========================================================
          # Identity
          # =========================================================

          me = get(
              "/api/v1/users/me"
          ) or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          identity_values = {
              str(username).lower(),
              str(me.get("id", "")).lower(),
              str(me.get("user_id", "")).lower(),
              str(me.get("agent_id", "")).lower(),
              "nox_origine",
              "@nox_origine"
          }

          identity_values.discard("")

          print(
              f"IDENTITY: {username}"
          )

          # =========================================================
          # Cognitive bridge: LEDGER 02 -> LEDGER 03
          # =========================================================

          cognitive_candidates = cognition.get(
              "action_candidates",
              []
          )

          if not isinstance(
              cognitive_candidates,
              list
          ):
              cognitive_candidates = []

          pending_cognitive_actions = [
              item
              for item in cognitive_candidates
              if isinstance(item, dict)
              and str(
                  item.get("status", "candidate")
              ).lower()
              in {
                  "candidate",
                  "pending",
                  "ready"
              }
          ]

          print(
              "COGNITIVE ACTION CANDIDATES: "
              f"{len(pending_cognitive_actions)}"
          )

          # =========================================================
          # Task helpers
          # =========================================================

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in [
                  "task_id",
                  "taskId",
                  "id",
                  "uuid"
              ]:
                  value = task.get(key)

                  if value:
                      return str(value)

              nested = task.get("task")

              if isinstance(nested, dict):
                  for key in [
                      "id",
                      "task_id",
                      "taskId",
                      "uuid"
                  ]:
                      value = nested.get(key)

                      if value:
                          return str(value)

              return None

          def task_title(task):
              if not isinstance(task, dict):
                  return ""

              nested = task.get("task")

              candidates = [
                  task.get("title"),
                  task.get("name"),
                  task.get("task_title")
              ]

              if isinstance(nested, dict):
                  candidates.extend([
                      nested.get("title"),
                      nested.get("name"),
                      nested.get("task_title")
                  ])

              for value in candidates:
                  if clean(value):
                      return clean(value)

              return ""

          def task_description(task):
              if not isinstance(task, dict):
                  return ""

              nested = task.get("task")

              candidates = [
                  task.get("description"),
                  task.get("body"),
                  task.get("details"),
                  task.get("content"),
                  task.get("instructions")
              ]

              if isinstance(nested, dict):
                  candidates.extend([
                      nested.get("description"),
                      nested.get("body"),
                      nested.get("details"),
                      nested.get("content"),
                      nested.get("instructions")
                  ])

              for value in candidates:
                  if clean(value):
                      return clean(value)

              return ""

          def task_text(task):
              if not isinstance(task, dict):
                  return ""

              nested = task.get("task")

              parts = [
                  task_title(task),
                  task_description(task),
                  clean(task.get("category")),
                  clean(task.get("type")),
                  clean(task.get("status")),
                  clean(task.get("tags"))
              ]

              if isinstance(nested, dict):
                  parts.append(
                      clean(nested.get("category"))
                  )
                  parts.append(
                      clean(nested.get("type"))
                  )
                  parts.append(
                      clean(nested.get("status"))
                  )
                  parts.append(
                      clean(nested.get("tags"))
                  )

              return clean(
                  " ".join(
                      part
                      for part in parts
                      if part
                  )
              )

          # =========================================================
          # Reward extraction
          # =========================================================

          REWARD_KEYS = [
              "reward_sats",
              "reward",
              "budget_sats",
              "amount_sats",
              "max_reward_sats",
              "min_reward_sats",
              "bounty_sats",
              "price_sats"
          ]

          def recursive_numbers(value, key_name=""):
              found = []

              if isinstance(value, dict):
                  for key, child in value.items():

                      low_key = str(
                          key
                      ).lower()

                      if (
                          low_key in REWARD_KEYS
                          or (
                              "reward" in low_key
                              and (
                                  "sat" in low_key
                                  or "amount" in low_key
                                  or "budget" in low_key
                              )
                          )
                          or (
                              "budget" in low_key
                              and "sat" in low_key
                          )
                      ):
                          if isinstance(
                              child,
                              (int, float)
                          ):
                              found.append(
                                  int(child)
                              )

                      found.extend(
                          recursive_numbers(
                              child,
                              low_key
                          )
                      )

              elif isinstance(value, list):
                  for child in value:
                      found.extend(
                          recursive_numbers(
                              child,
                              key_name
                          )
                      )

              return found

          def reward_values(task, text):
              values = recursive_numbers(task)

              for value in re.findall(
                  r"(?<![\d.])"
                  r"([\d][\d,]*)"
                  r"\s*(?:sats?|sat)\b",
                  text,
                  re.I
              ):
                  try:
                      values.append(
                          int(
                              value.replace(
                                  ",",
                                  ""
                              )
                          )
                      )
                  except Exception:
                      pass

              return sorted(
                  set(
                      value
                      for value in values
                      if value >= 0
                  )
              )

          def reward_range(task, text):
              values = reward_values(
                  task,
                  text
              )

              if not values:
                  return None, None

              return (
                  min(values),
                  max(values)
              )

          # =========================================================
          # Demand detection
          # =========================================================

          DEMAND_TERMS = [
              "for hire",
              "looking for",
              "need an agent",
              "need someone",
              "need help",
              "task",
              "bounty",
              "request",
              "commission",
              "research needed",
              "research task",
              "write a report",
              "report writing",
              "build",
              "implement",
              "fix",
              "develop",
              "development",
              "deliverable",
              "wanted",
              "seeking",
              "job",
              "work needed"
          ]

          SUPPLY_TERMS = [
              "i offer",
              "for hire by me",
              "my service",
              "i can provide",
              "available service",
              "my skills",
              "offering"
          ]

          OPEN_STATUS = {
              "open",
              "active",
              "published",
              "available",
              "pending",
              "bidding"
          }

          CLOSED_STATUS = {
              "closed",
              "completed",
              "cancelled",
              "canceled",
              "expired",
              "archived"
          }

          def direction(task, text):
              low = text.lower()

              demand_score = sum(
                  1
                  for term in DEMAND_TERMS
                  if term in low
              )

              supply_score = sum(
                  1
                  for term in SUPPLY_TERMS
                  if term in low
              )

              status = clean(
                  task.get("status")
              ).lower()

              if status in CLOSED_STATUS:
                  return "CLOSED"

              if demand_score > supply_score:
                  return "DEMAND"

              if supply_score > demand_score:
                  return "SUPPLY"

              # A structured marketplace reward is
              # strong evidence that this is an offer
              # requiring agent work.
              low_reward, high_reward = reward_range(
                  task,
                  text
              )

              if (
                  low_reward is not None
                  or high_reward is not None
              ):
                  return "DEMAND"

              if status in OPEN_STATUS:
                  # An open marketplace task with
                  # actionable language can still be
                  # treated as demand.
                  if contains_any(
                      low,
                      [
                          "research",
                          "report",
                          "code",
                          "python",
                          "api",
                          "github",
                          "data",
                          "testing",
                          "analysis",
                          "build",
                          "implement",
                          "fix"
                      ]
                  ):
                      return "DEMAND"

              return "UNKNOWN"

          # =========================================================
          # Capabilities
          # =========================================================

          STRONG_CAPABILITIES = {
              "rest_api": [
                  "rest api",
                  "api integration",
                  "api endpoint",
                  "api development",
                  "api testing",
                  "webhook",
                  "json api",
                  "api"
              ],

              "python": [
                  "python",
                  "python script",
                  "python development"
              ],

              "coding": [
                  "write code",
                  "coding task",
                  "software development",
                  "implementation",
                  "debugging",
                  "scripts",
                  "tool development",
                  "build agent tools",
                  "agent tooling",
                  "build tools",
                  "develop"
              ],

              "testing": [
                  "testing",
                  "qa",
                  "quality assurance",
                  "smoke test",
                  "api test",
                  "test"
              ],

              "research": [
                  "research",
                  "research report",
                  "research task",
                  "market research",
                  "technical research",
                  "web research",
                  "competitive research",
                  "deep research",
                  "fact checking",
                  "source verification",
                  "conduct research",
                  "perform research",
                  "investigation"
              ],

              "reporting": [
                  "technical report",
                  "write a report",
                  "prepare a report",
                  "report writing",
                  "research brief",
                  "report"
              ],

              "data": [
                  "data analysis",
                  "data cleaning",
                  "data extraction",
                  "data processing",
                  "data collection",
                  "csv",
                  "json cleanup"
              ],

              "github": [
                  "github",
                  "repository",
                  "repo",
                  "github actions",
                  "workflow",
                  "pull request",
                  "issue"
              ]
          }

          BLOCKED_TERMS = [
              "malware",
              "ransomware",
              "credential theft",
              "steal credentials",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos attack",
              "bypass authentication",
              "exploit a real target",
              "weapon",
              "explosive"
          ]

          def capabilities(text):
              low = text.lower()
              found = []

              for capability, phrases in (
                  STRONG_CAPABILITIES.items()
              ):
                  if any(
                      phrase in low
                      for phrase in phrases
                  ):
                      found.append(
                          capability
                      )

              return found

          def blocked(text):
              low = text.lower()

              return any(
                  term in low
                  for term in BLOCKED_TERMS
              )

          # =========================================================
          # Reward consistency
          # =========================================================

          def suspicious_reward(task, text):
              values = reward_values(
                  task,
                  text
              )

              if len(values) < 2:
                  return False

              low = min(values)
              high = max(values)

              if low <= 0:
                  return False

              return (
                  high / low >= 10
              )

          # =========================================================
          # Existing action memory
          # =========================================================

          previous_decisions = {
              str(item.get("task_id")): item
              for item in state.get(
                  "decisions",
                  []
              )
              if isinstance(item, dict)
              and item.get("task_id")
          }

          previous_bids = {
              str(item.get("task_id")): item
              for item in state.get(
                  "bids",
                  []
              )
              if isinstance(item, dict)
              and item.get("task_id")
          }

          # =========================================================
          # Marketplace discovery
          # =========================================================

          tasks_response = get(
              "/api/v1/marketplace/tasks",
              {"limit": MAX_TASKS}
          )

          if isinstance(
              tasks_response,
              dict
          ):
              tasks = tasks_response.get(
                  "items",
                  tasks_response.get(
                      "tasks",
                      []
                  )
              )
          else:
              tasks = tasks_response

          if not isinstance(
              tasks,
              list
          ):
              tasks = []

          print(
              f"TASKS FOUND: {len(tasks)}"
          )

          decisions = []
          candidates = []

          skip_reasons = Counter()

          # =========================================================
          # Cognitive action influence
          # =========================================================

          cognitive_topics = []

          for candidate in (
              pending_cognitive_actions
          ):
              topic = clean(
                  candidate.get("topic")
              )

              if topic:
                  cognitive_topics.append(
                      topic.lower()
                  )

          cognitive_context_active = bool(
              pending_cognitive_actions
          )

          # =========================================================
          # Evaluate tasks
          # =========================================================

          for task in tasks:

              tid = task_id(task)

              if not tid:
                  skip_reasons[
                      "MISSING_TASK_ID"
                  ] += 1
                  continue

              title = task_title(task)
              description = task_description(task)
              text = task_text(task)

              direction_value = direction(
                  task,
                  text
              )

              low_reward, high_reward = (
                  reward_range(
                      task,
                      text
                  )
              )

              caps = capabilities(text)
              is_blocked = blocked(text)
              suspicious = suspicious_reward(
                  task,
                  text
              )

              score = 0
              reasons = []

              # -----------------------------------------------------
              # Safety gate
              # -----------------------------------------------------

              if is_blocked:

                  score = -100

                  reasons.append(
                      "SAFETY_BLOCK"
                  )

                  skip_reasons[
                      "SAFETY_BLOCK"
                  ] += 1

              elif direction_value == "CLOSED":

                  score = -80

                  reasons.append(
                      "CLOSED_TASK"
                  )

                  skip_reasons[
                      "CLOSED_TASK"
                  ] += 1

              elif direction_value != "DEMAND":

                  score = -50

                  reasons.append(
                      "NOT_DEMAND"
                  )

                  skip_reasons[
                      "NOT_DEMAND"
                  ] += 1

              else:

                  # -------------------------------------------------
                  # Capability fit
                  # -------------------------------------------------

                  if caps:

                      capability_score = min(
                          35,
                          len(caps) * 12
                      )

                      score += (
                          capability_score
                      )

                      reasons.append(
                          "CAPABILITY:" +
                          ",".join(caps)
                      )

                  else:

                      score -= 5

                      reasons.append(
                          "NO_STRONG_CAPABILITY"
                      )

                  # -------------------------------------------------
                  # Reward
                  # -------------------------------------------------

                  if low_reward is not None:

                      if low_reward >= 500:
                          reward_score = 25

                      elif low_reward >= 100:
                          reward_score = 20

                      elif low_reward >= 20:
                          reward_score = 15

                      elif low_reward >= 1:
                          reward_score = 10

                      else:
                          reward_score = 0

                      score += reward_score

                      reasons.append(
                          f"REWARD:{low_reward}"
                      )

                  else:

                      reasons.append(
                          "NO_REWARD"
                      )

                  # -------------------------------------------------
                  # Task clarity
                  # -------------------------------------------------

                  text_length = len(text)

                  if (
                      100 <= text_length <= 1800
                  ):
                      score += 10

                      reasons.append(
                          "CLEAR_SCOPE"
                      )

                  elif text_length < 100:

                      score += 3

                      reasons.append(
                          "SHORT_SCOPE"
                      )

                  elif text_length > 3000:

                      score -= 8

                      reasons.append(
                          "HIGH_COMPLEXITY"
                      )

                  # -------------------------------------------------
                  # Evidence/action context
                  # -------------------------------------------------

                  if contains_any(
                      text,
                      [
                          "deliverable",
                          "report",
                          "output",
                          "repository",
                          "github",
                          "api",
                          "documentation"
                      ]
                  ):
                      score += 5

                      reasons.append(
                          "OBSERVABLE_DELIVERABLE"
                      )

                  # -------------------------------------------------
                  # Cognitive bridge
                  # -------------------------------------------------

                  if cognitive_context_active:

                      topic_match = any(
                          topic.replace(
                              "_",
                              " "
                          ) in text.lower()
                          for topic in cognitive_topics
                      )

                      if topic_match:

                          score += 5

                          reasons.append(
                              "COGNITIVE_TOPIC_MATCH"
                          )

                      else:

                          reasons.append(
                              "COGNITIVE_CONTEXT_AVAILABLE"
                          )

                  # -------------------------------------------------
                  # Reward consistency
                  # -------------------------------------------------

                  if suspicious:

                      score -= 35

                      reasons.append(
                          "REWARD_INCONSISTENCY"
                      )

                  # -------------------------------------------------
                  # Existing local bid memory
                  # -------------------------------------------------

                  if str(tid) in previous_bids:

                      reasons.append(
                          "PREVIOUS_BID_MEMORY"
                      )

              decision = {
