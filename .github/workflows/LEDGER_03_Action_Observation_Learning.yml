name: NØX LEDGER 03 - Action Observation Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  action-observation-learning:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      ACTION_FILE: memory/nox_ledger_action.json
      KNOWLEDGE_FILE: memory/nox_ledger_knowledge.json
      COGNITION_FILE: memory/nox_ledger_cognition.json

      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE: "30"
      MIN_BID_SATS: "1"
      BID_SCORE_THRESHOLD: "50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Run LEDGER 03
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          ACTION_FILE = Path(os.environ["ACTION_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          COGNITION_FILE = Path(os.environ["COGNITION_FILE"])

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])
          MIN_BID = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )

          NOW = datetime.now(timezone.utc).isoformat()

          # =========================================================
          # Persistence
          # =========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(f"LOAD WARNING {path}: {exc}")
                  return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              tmp.replace(path)

          state = load_json(
              ACTION_FILE,
              {
                  "version": "2.0",
                  "decisions": [],
                  "bids": [],
                  "observations": [],
                  "outcomes": [],
                  "failure_ledger": [],
                  "tip_candidates": [],
                  "learning": [],
                  "cognitive_actions": [],
                  "stats": {}
              }
          )

          if not isinstance(state, dict):
              state = {}

          for key, default in {
              "decisions": [],
              "bids": [],
              "observations": [],
              "outcomes": [],
              "failure_ledger": [],
              "tip_candidates": [],
              "learning": [],
              "cognitive_actions": []
          }.items():
              if not isinstance(state.get(key), list):
                  state[key] = default

          cognition = load_json(
              COGNITION_FILE,
              {}
          )

          if not isinstance(cognition, dict):
              cognition = {}

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {"knowledge": []}
          )

          if not isinstance(knowledge, dict):
              knowledge = {"knowledge": []}

          # =========================================================
          # HTTP
          # =========================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-Action/2.0"
          })

          def authenticate():
              try:
                  response = session.post(
                      BASE + "/api/v1/auth/token",
                      json={"api_key": API_KEY},
                      timeout=15
                  )

                  if not response.ok:
                      print(
                          f"AUTH FAILED: HTTP {response.status_code}"
                      )
                      return False

                  data = response.json()

                  token = data.get("access_token")

                  if not token:
                      print("AUTH FAILED: no access_token")
                      return False

                  session.headers["Authorization"] = (
                      "Bearer " + token
                  )

                  return True

              except Exception as exc:
                  print(f"AUTH ERROR: {exc}")
                  return False

          authenticate()

          def get(path, params=None):
              try:
                  response = session.get(
                      BASE + path,
                      params=params,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.get(
                          BASE + path,
                          params=params,
                          timeout=20
                      )

                  if not response.ok:
                      print(
                          f"GET {path}: "
                          f"HTTP {response.status_code}"
                      )
                      return None

                  try:
                      return response.json()
                  except Exception:
                      return None

              except Exception as exc:
                  print(f"GET ERROR {path}: {exc}")
                  return None

          def post(path, payload):
              try:
                  response = session.post(
                      BASE + path,
                      json=payload,
                      timeout=20
                  )

                  if (
                      response.status_code == 401
                      and authenticate()
                  ):
                      response = session.post(
                          BASE + path,
                          json=payload,
                          timeout=20
                      )

                  return response

              except Exception as exc:
                  print(f"POST ERROR {path}: {exc}")
                  return None

          # =========================================================
          # Generic helpers
          # =========================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, dict):
                  return " ".join(
                      text(v)
                      for v in value.values()
                  )

              if isinstance(value, list):
                  return " ".join(
                      text(v)
                      for v in value
                  )

              return str(value)

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()

          def fingerprint(*values):
              value = " ".join(
                  clean(v).lower()
                  for v in values
                  if clean(v)
              )

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()[:20]

          def has_any(value, terms):
              low = clean(value).lower()

              return any(
                  term.lower() in low
                  for term in terms
              )

          # =========================================================
          # Identity
          # =========================================================

          me = get("/api/v1/users/me") or {}

          username = (
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          identity_values = {
              str(username).lower(),
              str(me.get("id", "")).lower(),
              str(me.get("user_id", "")).lower(),
              str(me.get("agent_id", "")).lower(),
              "nox_origine",
              "@nox_origine"
          }

          identity_values.discard("")

          print(f"IDENTITY: {username}")

          # =========================================================
          # LEDGER 02 -> LEDGER 03
          # =========================================================

          cognitive_candidates = cognition.get(
              "action_candidates",
              []
          )

          if not isinstance(cognitive_candidates, list):
              cognitive_candidates = []

          pending_cognitive = [
              item
              for item in cognitive_candidates
              if isinstance(item, dict)
              and str(
                  item.get("status", "candidate")
              ).lower()
              in {
                  "candidate",
                  "pending",
                  "ready"
              }
          ]

          print(
              "COGNITIVE ACTION CANDIDATES: "
              f"{len(pending_cognitive)}"
          )

          # =========================================================
          # Task extraction
          # =========================================================

          def task_id(task):
              if not isinstance(task, dict):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "id",
                  "uuid"
              ):
                  if task.get(key):
                      return str(task[key])

              nested = task.get("task")

              if isinstance(nested, dict):
                  for key in (
                      "id",
                      "task_id",
                      "taskId",
                      "uuid"
                  ):
                      if nested.get(key):
                          return str(nested[key])

              return None

          def task_title(task):
              nested = task.get("task")

              values = [
                  task.get("title"),
                  task.get("name"),
                  task.get("task_title")
              ]

              if isinstance(nested, dict):
                  values.extend([
                      nested.get("title"),
                      nested.get("name"),
                      nested.get("task_title")
                  ])

              for value in values:
                  if clean(value):
                      return clean(value)

              return ""

          def task_description(task):
              nested = task.get("task")

              values = [
                  task.get("description"),
                  task.get("body"),
                  task.get("details"),
                  task.get("content"),
                  task.get("instructions")
              ]

              if isinstance(nested, dict):
                  values.extend([
                      nested.get("description"),
                      nested.get("body"),
                      nested.get("details"),
                      nested.get("content"),
                      nested.get("instructions")
                  ])

              for value in values:
                  if clean(value):
                      return clean(value)

              return ""

          def task_text(task):
              parts = [
                  task_title(task),
                  task_description(task),
                  clean(task.get("category")),
                  clean(task.get("type")),
                  clean(task.get("tags")),
                  clean(task.get("status"))
              ]

              nested = task.get("task")

              if isinstance(nested, dict):
                  parts.extend([
                      clean(nested.get("category")),
                      clean(nested.get("type")),
                      clean(nested.get("tags")),
                      clean(nested.get("status"))
                  ])

              return clean(" ".join(
                  part
                  for part in parts
                  if part
              ))

          # =========================================================
          # Reward detection
          # =========================================================

          REWARD_KEYS = {
              "reward_sats",
              "reward",
              "budget_sats",
              "amount_sats",
              "max_reward_sats",
              "min_reward_sats",
              "bounty_sats",
              "price_sats"
          }

          def recursive_rewards(value):
              found = []

              if isinstance(value, dict):
                  for key, child in value.items():

                      low_key = str(key).lower()

                      if (
                          low_key in REWARD_KEYS
                          and isinstance(
                              child,
                              (int, float)
                          )
                      ):
                          found.append(int(child))

                      found.extend(
                          recursive_rewards(child)
                      )

              elif isinstance(value, list):
                  for child in value:
                      found.extend(
                          recursive_rewards(child)
                      )

              return found

          def reward_values(task, task_text_value):
              values = recursive_rewards(task)

              matches = re.findall(
                  r"(?<![\d.])"
                  r"([\d][\d,]*)"
                  r"\s*(?:sats?|sat)\b",
                  task_text_value,
                  re.I
              )

              for value in matches:
                  try:
                      values.append(
                          int(value.replace(",", ""))
                      )
                  except Exception:
                      pass

              return sorted(
                  set(
                      value
                      for value in values
                      if value >= 0
                  )
              )

          def reward_range(task, task_text_value):
              values = reward_values(
                  task,
                  task_text_value
              )

              if not values:
                  return None, None

              return min(values), max(values)

          # =========================================================
          # Demand detection
          # =========================================================

          DEMAND_TERMS = [
              "task",
              "bounty",
              "looking for",
              "need an agent",
              "need someone",
              "need help",
              "research needed",
              "research task",
              "write a report",
              "build",
              "implement",
              "fix",
              "develop",
              "deliverable",
              "wanted",
              "seeking",
              "commission",
              "request",
              "job",
              "work needed"
          ]

          SUPPLY_TERMS = [
              "i offer",
              "my service",
              "i can provide",
              "available service",
              "offering"
          ]

          CLOSED_STATUSES = {
              "closed",
              "completed",
              "cancelled",
              "canceled",
              "expired",
              "archived"
          }

          def detect_direction(task, task_text_value):
              low = task_text_value.lower()

              demand_score = sum(
                  1
                  for term in DEMAND_TERMS
                  if term in low
              )

              supply_score = sum(
                  1
                  for term in SUPPLY_TERMS
                  if term in low
              )

              status = clean(
                  task.get("status")
              ).lower()

              if status in CLOSED_STATUSES:
                  return "CLOSED"

              if demand_score > supply_score:
                  return "DEMAND"

              if supply_score > demand_score:
                  return "SUPPLY"

              low_reward, high_reward = reward_range(
                  task,
                  task_text_value
              )

              if (
                  low_reward is not None
                  or high_reward is not None
              ):
                  return "DEMAND"

              return "UNKNOWN"

          # =========================================================
          # Capability matching
          # =========================================================

          CAPABILITIES = {
              "research": [
                  "research",
                  "deep research",
                  "web research",
                  "research report",
                  "research task",
                  "technical research",
                  "market research",
                  "competitive research",
                  "fact checking",
                  "source verification"
              ],
              "reporting": [
                  "technical report",
                  "research report",
                  "write a report",
                  "report writing",
                  "research brief"
              ],
              "python": [
                  "python",
                  "python script",
                  "python development"
              ],
              "coding": [
                  "coding",
                  "write code",
                  "software development",
                  "implementation",
                  "debugging",
                  "tool development",
                  "build agent tools",
                  "agent tooling",
                  "build tools"
              ],
              "api": [
                  "rest api",
                  "api integration",
                  "api endpoint",
                  "api development",
                  "api testing",
                  "webhook",
                  "json api"
              ],
              "testing": [
                  "testing",
                  "qa",
                  "quality assurance",
                  "smoke test",
                  "api test"
              ],
              "data": [
                  "data analysis",
                  "data cleaning",
                  "data extraction",
                  "data processing",
                  "data collection",
                  "csv",
                  "json cleanup"
              ],
              "github": [
                  "github",
                  "repository",
                  "repo",
                  "github actions",
                  "workflow",
                  "pull request",
                  "issue"
              ]
          }

          BLOCKED_TERMS = [
              "malware",
              "ransomware",
              "credential theft",
              "steal credentials",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos attack",
              "bypass authentication",
              "exploit a real target",
              "weapon",
              "explosive"
          ]

          def matching_capabilities(task_text_value):
              low = task_text_value.lower()
              found = []

              for name, terms in CAPABILITIES.items():
                  if any(
                      term in low
                      for term in terms
                  ):
                      found.append(name)

              return found

          def is_blocked(task_text_value):
              low = task_text_value.lower()

              return any(
                  term in low
                  for term in BLOCKED_TERMS
              )

          def suspicious_reward(task, task_text_value):
              values = reward_values(
                  task,
                  task_text_value
              )

              if len(values) < 2:
                  return False

              low = min(values)
              high = max(values)

              if low <= 0:
                  return False

              return high / low >= 10

          # =========================================================
          # Marketplace
          # =========================================================

          response = get(
              "/api/v1/marketplace/tasks",
              {"limit": MAX_TASKS}
          )

          if isinstance(response, dict):
              tasks = response.get(
                  "items",
                  response.get(
                      "tasks",
                      []
                  )
              )
          else:
              tasks = response

          if not isinstance(tasks, list):
              tasks = []

          print(f"TASKS FOUND: {len(tasks)}")

          decisions = []
          candidates = []
          skip_reasons = Counter()

          cognitive_topics = {
              clean(item.get("topic")).lower()
              for item in pending_cognitive
              if clean(item.get("topic"))
          }

          for task in tasks:

              tid = task_id(task)

              if not tid:
                  skip_reasons["MISSING_TASK_ID"] += 1
                  continue

              title = task_title(task)
              description = task_description(task)
              combined = task_text(task)

              direction = detect_direction(
                  task,
                  combined
              )

              low_reward, high_reward = reward_range(
                  task,
                  combined
              )

              caps = matching_capabilities(
                  combined
              )

              blocked = is_blocked(combined)

              reward_problem = suspicious_reward(
                  task,
                  combined
              )

              score = 0
              reasons = []

              if blocked:
                  score = -100
                  reasons.append("SAFETY_BLOCK")
                  skip_reasons["SAFETY_BLOCK"] += 1

              elif direction == "CLOSED":
                  score = -80
                  reasons.append("CLOSED_TASK")
                  skip_reasons["CLOSED_TASK"] += 1

              elif direction != "DEMAND":
                  score = -40
                  reasons.append("NOT_DEMAND")
                  skip_reasons["NOT_DEMAND"] += 1

              else:
                  # Capability
                  if caps:
                      score += min(
                          35,
                          len(caps) * 12
                      )
                      reasons.append(
                          "CAPABILITY:" +
                          ",".join(caps)
                      )
                  else:
                      reasons.append(
                          "NO_CAPABILITY"
                      )

                  # Reward
                  if low_reward is not None:
                      if low_reward >= 500:
                          score += 25
                      elif low_reward >= 100:
                          score += 20
                      elif low_reward >= 20:
                          score += 15
                      elif low_reward >= 1:
                          score += 10

                      reasons.append(
                          f"REWARD:{low_reward}"
                      )
                  else:
                      reasons.append("NO_REWARD")

                  # Scope
                  length = len(combined)

                  if 100 <= length <= 1800:
                      score += 10
                      reasons.append("CLEAR_SCOPE")
                  elif length < 100:
                      score += 3
                      reasons.append("SHORT_SCOPE")
                  elif length > 3000:
                      score -= 8
                      reasons.append("HIGH_COMPLEXITY")

                  # Observable output
                  if has_any(
                      combined,
                      [
                          "deliverable",
                          "report",
                          "output",
                          "repository",
                          "github",
                          "api",
                          "documentation"
                      ]
                  ):
                      score += 5
                      reasons.append(
                          "OBSERVABLE_DELIVERABLE"
                      )

                  # Cognitive connection
                  if cognitive_topics:
                      topic_match = any(
                          topic.replace(
                              "_",
                              " "
                          ) in combined.lower()
                          for topic in cognitive_topics
                      )

                      if topic_match:
                          score += 5
                          reasons.append(
                              "COGNITIVE_TOPIC_MATCH"
                          )

                  # Reward consistency
                  if reward_problem:
                      score -= 35
                      reasons.append(
                          "REWARD_INCONSISTENCY"
                      )

                  # Final decision
                  if (
                      caps
                      and low_reward is not None
                      and not reward_problem
                      and score >= BID_SCORE_THRESHOLD
                  ):
                      decision_value = "BID"
                  elif (
                      caps
                      and low_reward is None
                      and not blocked
                  ):
                      decision_value = (
                          "TIP_OR_LEARNING_CANDIDATE"
                      )
                  else:
                      decision_value = "SKIP"

                  if decision_value == "SKIP":
                      if not caps:
                          skip_reasons[
                              "NO_CAPABILITY"
                          ] += 1
                      elif low_reward is None:
                          skip_reasons[
                              "NO_REWARD"
                          ] += 1
                      elif reward_problem:
                          skip_reasons[
                              "REWARD_INCONSISTENCY"
                          ] += 1
                      elif score < BID_SCORE_THRESHOLD:
                          skip_reasons[
                              "LOW_SCORE"
                          ] += 1
              # -----------------------------------------------------
              # IMPORTANT:
              # Every task gets exactly one decision record.
              # -----------------------------------------------------

              if direction != "DEMAND":
                  decision_value = "SKIP"

              if blocked:
                  decision_value = "SKIP"

              decision = {
                  "timestamp": NOW,
                  "task_id": tid,
                  "title": title[:300],
                  "description_excerpt": description[:500],
                  "direction": direction,
                  "reward_low": low_reward,
                  "reward_high": high_reward,
                  "capabilities": caps,
                  "score": score,
                  "suspicious_reward": reward_problem,
                  "blocked": blocked,
                  "decision": decision_value,
                  "reasons": reasons
              }

              decisions.append(decision)

              if decision_value == "BID":
                  candidates.append(decision)

              elif decision_value == "TIP_OR_LEARNING_CANDIDATE":
                  state["tip_candidates"].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "title": title[:300],
                      "capabilities": caps,
                      "reward_claim": None,
                      "note": (
                          "No reward fabricated. "
                          "Potential learning or "
                          "future tip opportunity."
                      )
                  })

          # =========================================================
          # Existing bids
          # =========================================================

          ACTIVE_STATUSES = {
              "pending",
              "submitted",
              "active",
              "accepted",
              "approved",
              "winner",
              "winning"
          }

          def own_bid(bid):
              if not isinstance(bid, dict):
                  return False

              for key in (
                  "agent_id",
                  "user_id",
                  "bidder_id",
                  "owner_id"
              ):
                  value = bid.get(key)

                  if (
                      value is not None
                      and str(value).lower()
                      in identity_values
                  ):
                      return True

              for key in (
                  "username",
                  "handle",
                  "bidder_username",
                  "agent_username"
              ):
                  value = bid.get(key)

                  if (
                      value is not None
                      and str(value).lower()
                      in identity_values
                  ):
                      return True

              return False

          def normalize_status(value):
              low = str(
                  value or ""
              ).lower().strip()

              if low in {
                  "accepted",
                  "approved",
                  "won",
                  "selected"
              }:
                  return "ACCEPTED"

              if low in {
                  "rejected",
                  "declined",
                  "lost",
                  "denied"
              }:
                  return "REJECTED"

              if low in {
                  "pending",
                  "submitted",
                  "active",
                  "open",
                  "bidding",
                  "under_review",
                  "review"
              }:
                  return "PENDING"

              return str(
                  value or "UNKNOWN"
              ).upper()

          def get_bids(task_id_value):
              result = get(
                  "/api/v1/marketplace/"
                  + str(task_id_value)
                  + "/bids"
              )

              if isinstance(result, dict):
                  result = result.get(
                      "items",
                      result.get(
                          "bids",
                          []
                      )
                  )

              return (
                  result
                  if isinstance(result, list)
                  else []
              )

          # =========================================================
          # Submit real bids
          # =========================================================

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["reward_low"] or 0
              ),
              reverse=True
          )

          bids_created = 0
          bid_conflicts = 0

          for candidate in candidates:

              if bids_created >= MAX_BIDS:
                  break

              tid = candidate["task_id"]

              existing = get_bids(tid)

              already_active = any(
                  own_bid(bid)
                  and normalize_status(
                      bid.get("status")
                  ) in ACTIVE_STATUSES
                  for bid in existing
              )

              if already_active:
                  candidate["decision"] = (
                      "SKIP_EXISTING_ACTIVE_BID"
                  )
                  continue

              reward = candidate["reward_low"]

              if reward is None:
                  continue

              bid_amount = max(
                  MIN_BID,
                  int(reward)
              )

              if candidate["reward_high"] is not None:
                  bid_amount = min(
                      bid_amount,
                      int(candidate["reward_high"])
                  )

              capability_text = ", ".join(
                  candidate["capabilities"]
              )

              description = (
                  "NØX can handle this task with "
                  "evidence-based execution. "
                  f"Relevant capabilities: "
                  f"{capability_text}. "
                  "The bid is based only on the "
                  "reward information observed "
                  "from the marketplace."
              )

              result = post(
                  "/api/v1/marketplace/"
                  + str(tid)
                  + "/bid",
                  {
                      "bid_amount_sats": bid_amount,
                      "bid_description": description[:5000]
                  }
              )

              if result is None:
                  continue

              if result.status_code in {200, 201}:

                  body = {}

                  try:
                      body = result.json()
                  except Exception:
                      pass

                  bid_id = (
                      body.get("id")
                      or body.get("bid_id")
                  )

                  state["bids"].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "task_title": candidate["title"],
                      "bid_id": bid_id,
                      "amount_sats": bid_amount,
                      "status": "SUBMITTED",
                      "score": candidate["score"]
                  })

                  candidate["decision"] = (
                      "BID_SUBMITTED"
                  )

                  bids_created += 1

              elif result.status_code == 409:

                  bid_conflicts += 1

                  candidate["decision"] = (
                      "SERVER_CONFLICT"
                  )

                  state["failure_ledger"].append({
                      "timestamp": NOW,
                      "type": "BID_CONFLICT",
                      "task_id": tid,
                      "cause": (
                          "Marketplace rejected the "
                          "bid as conflicting."
                      ),
                      "correction": (
                          "Do not retry blindly."
                      )
                  })

              else:

                  candidate["decision"] = (
                      "BID_FAILED"
                  )

                  state["failure_ledger"].append({
                      "timestamp": NOW,
                      "type": "BID_HTTP_FAILURE",
                      "task_id": tid,
                      "status_code": result.status_code
                  })

          # =========================================================
          # Reconciliation
          # =========================================================

          tracked = []

          for item in reversed(
              state["bids"]
          ):
              if item.get("task_id"):
                  tracked.append(item)

          unique = {}

          for item in tracked:
              unique[
                  str(item["task_id"])
              ] = item

          tracked = list(
              unique.values()
          )[:MAX_RECONCILE]

          accepted = 0
          pending = 0
          rejected = 0
          paid = 0

          for item in tracked:

              tid = item["task_id"]
              bids = get_bids(tid)

              mine = None
              expected_id = item.get("bid_id")

              if expected_id is not None:
                  for bid in bids:
                      current_id = (
                          bid.get("id")
                          or bid.get("bid_id")
                      )

                      if str(current_id) == str(expected_id):
                          mine = bid
                          break

              if mine is None:
                  for bid in bids:
                      if own_bid(bid):
                          mine = bid
                          break

              if mine is None:
                  continue

              status = normalize_status(
                  mine.get("status")
              )

              if status == "ACCEPTED":
                  accepted += 1
              elif status == "PENDING":
                  pending += 1
              elif status == "REJECTED":
                  rejected += 1

              payment_status = None

              if status == "ACCEPTED":
                  payment = get(
                      "/api/v1/marketplace/"
                      + str(tid)
                      + "/payment"
                  )

                  if isinstance(payment, dict):
                      payment_status = (
                          payment.get("status")
                          or payment.get("payment_status")
                      )

                      if str(
                          payment_status or ""
                      ).lower() in {
                          "paid",
                          "completed",
                          "settled"
                      }:
                          paid += 1

              state["observations"].append({
                  "timestamp": NOW,
                  "task_id": tid,
                  "bid_id": (
                      mine.get("id")
                      or mine.get("bid_id")
                      or expected_id
                  ),
                  "status": status,
                  "amount_sats": (
                      mine.get("bid_amount_sats")
                      or mine.get("amount_sats")
                  ),
                  "payment_status": payment_status,
                  "gemini_used": False,
                  "external_ai_used": False,
                  "payments_enabled": False,
                  "spending_enabled": False,
                  "project_cost_eur": 0
              })

              previous = item.get(
                  "last_observed_status"
              )

              if previous != status:

                  state["outcomes"].append({
                      "timestamp": NOW,
                      "task_id": tid,
                      "bid_id": (
                          mine.get("id")
                          or mine.get("bid_id")
                          or expected_id
                      ),
                      "previous_status": previous,
                      "new_status": status,
                      "payment_status": payment_status
                  })

                  if status == "ACCEPTED":
                      state["learning"].append({
                          "timestamp": NOW,
                          "type": "POSITIVE_OUTCOME",
                          "task_id": tid,
                          "lesson": (
                              "A real bid reached ACCEPTED. "
                              "Preserve observable task "
                              "characteristics for comparison."
                          )
                      })

                  elif status == "REJECTED":
                      state["learning"].append({
                          "timestamp": NOW,
                          "type": "NEGATIVE_OUTCOME",
                          "task_id": tid,
                          "lesson": (
                              "A real bid was rejected. "
                              "Compare task characteristics, "
                              "reward, timing and competition "
                              "before changing capability assumptions."
                          )
                      })

              item["last_observed_status"] = status
              item["last_payment_status"] = payment_status

          # =========================================================
          # Consume cognitive candidates
          # =========================================================

          for candidate in pending_cognitive:

              candidate["status"] = "evaluated"
              candidate["evaluated_at"] = NOW
              candidate["marketplace_tasks_seen"] = len(tasks)
              candidate["bid_candidates_found"] = len(candidates)
              candidate["bids_created"] = bids_created

              state["cognitive_actions"].append({
                  "timestamp": NOW,
                  "source": "LEDGER_02",
                  "candidate": candidate
              })

          if pending_cognitive:
              cognition["action_candidates"] = (
                  cognitive_candidates
              )
              cognition["updated_at"] = NOW
              save_json(
                  COGNITION_FILE,
                  cognition
              )

          # =========================================================
          # Memory limits
          # =========================================================

          state["decisions"] = (
              state["decisions"][-500:]
          )

          state["bids"] = (
              state["bids"][-500:]
          )

          state["observations"] = (
              state["observations"][-500:]
          )

          state["outcomes"] = (
              state["outcomes"][-300:]
          )

          state["failure_ledger"] = (
              state["failure_ledger"][-300:]
          )

          state["learning"] = (
              state["learning"][-300:]
          )

          state["tip_candidates"] = (
              state["tip_candidates"][-200:]
          )

          state["cognitive_actions"] = (
              state["cognitive_actions"][-200:]
          )

          # =========================================================
          # Statistics
          # =========================================================

          state["version"] = "2.0"
          state["updated_at"] = NOW

          state["stats"] = {
              "tasks_seen": len(tasks),
              "tasks_evaluated": len(decisions),
              "bid_candidates": len(candidates),
              "bids_created_this_run": bids_created,
              "bid_conflicts": bid_conflicts,
              "tracked_bids": len(tracked),
              "accepted": accepted,
              "pending": pending,
              "rejected": rejected,
              "paid_observed": paid,
              "cognitive_candidates_received": len(
                  pending_cognitive
              ),
              "cognitive_candidates_evaluated": len(
                  pending_cognitive
              ),
              "skip_reasons": dict(
                  skip_reasons
              ),
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0
          }

          save_json(
              ACTION_FILE,
              state
          )

          # =========================================================
          # Runtime log
          # =========================================================

          print("")
          print("======================================")
          print("=== NØX LEDGER 03 V2 COMPLETE ===")
          print("======================================")
          print(f"Identity: {username}")
          print(
              "Cognitive candidates received: "
              f"{len(pending_cognitive)}"
          )
          print(f"Tasks found: {len(tasks)}")
          print(f"Tasks evaluated: {len(decisions)}")
          print(f"Bid candidates: {len(candidates)}")
          print(f"Bids created: {bids_created}")
          print(f"Bid conflicts: {bid_conflicts}")
          print(f"Tracked bids: {len(tracked)}")
          print(f"Accepted: {accepted}")
          print(f"Pending: {pending}")
          print(f"Rejected: {rejected}")
          print(f"Paid observed: {paid}")
          print("")
          print("SKIP REASONS:")

          if skip_reasons:
              for reason, count in skip_reasons.most_common():
                  print(f"  {reason}: {count}")
          else:
              print("  none")

          print("")
          print("Real bids: ENABLED")
          print("Payments: DISABLED")
          print("Spending: DISABLED")
          print("Gemini: False")
          print("External AI: False")
          print("Project cost: €0")
          print("======================================")
          PY

      - name: Commit action and cognition state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add \
            memory/nox_ledger_action.json \
            memory/nox_ledger_cognition.json

          if git diff --cached --quiet; then
            echo "No action-state changes."
            exit 0
          fi

          git commit -m "ledger03: execute actions and learn from outcomes"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: unable to push after 3 attempts."
          exit 1
