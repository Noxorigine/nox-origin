name: NØX ACT 12 - Task Detection & Capability Matching

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-act12:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX ACT 12
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          print("================================================")
          print("NØX ACT 12 - TASK DETECTION")
          print("================================================")

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now_dt = datetime.now(timezone.utc)
          now = now_dt.isoformat()

          # ---------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------

          def safe_json(response):
              try:
                  return response.json()
              except Exception:
                  return None

          def request(method, path, **kwargs):
              try:
                  response = requests.request(
                      method,
                      f"{BASE}{path}",
                      headers=headers,
                      timeout=30,
                      **kwargs
                  )

                  print(
                      f"{method} {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  print(
                      f"ERROR {method} {path}: {exc}"
                  )
                  return None

          def extract_list(data, keys):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in keys:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def clean_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def task_text(task):
              if not isinstance(task, dict):
                  return ""

              fields = [
                  "title",
                  "description",
                  "body",
                  "content",
                  "requirements",
                  "category",
                  "kind",
                  "status"
              ]

              parts = []

              for field in fields:
                  value = task.get(field)

                  if value:
                      parts.append(
                          clean_text(value)
                      )

              return " ".join(parts)

          def number_from_task(task, keys):
              if not isinstance(task, dict):
                  return None

              for key in keys:
                  value = task.get(key)

                  if value is None:
                      continue

                  if isinstance(value, (int, float)):
                      return float(value)

                  text = str(value)

                  match = re.search(
                      r"(\d+(?:\.\d+)?)",
                      text
                  )

                  if match:
                      try:
                          return float(
                              match.group(1)
                          )
                      except Exception:
                          pass

              return None

          # ---------------------------------------------------------
          # 1. Authentication
          # ---------------------------------------------------------

          print()
          print("[1] Authenticating...")

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          print(
              f"Authentication status: "
              f"{auth.status_code}"
          )

          if not auth.ok:
              raise SystemExit(
                  f"Authentication failed: {auth.text}"
              )

          auth_data = safe_json(auth)

          token = (
              auth_data.get("access_token")
              if isinstance(auth_data, dict)
              else None
          )

          if not token:
              raise SystemExit(
                  "No access token returned."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # ---------------------------------------------------------
          # 2. Identity
          # ---------------------------------------------------------

          print()
          print("[2] Checking NØX identity...")

          me_response = request(
              "GET",
              "/users/me"
          )

          me = safe_json(me_response)

          if isinstance(me, dict):
              username = me.get(
                  "username",
                  "unknown"
              )
              karma = me.get(
                  "karma",
                  "unknown"
              )
          else:
              username = "unknown"
              karma = "unknown"

          print(
              f"Agent: @{username}"
          )

          print(
              f"Karma: {karma}"
          )

          # ---------------------------------------------------------
          # 3. Load memory
          # ---------------------------------------------------------

          print()
          print("[3] Loading NØX memory...")

          memory = {}

          if os.path.exists(MEMORY_FILE):

              try:
                  with open(
                      MEMORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      memory = json.load(f)

              except Exception as exc:

                  print(
                      f"Memory load warning: {exc}"
                  )

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "version",
              "NØX ACT 12 Task Detection"
          )

          memory.setdefault(
              "observations",
              []
          )

          memory.setdefault(
              "decisions",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          # ---------------------------------------------------------
          # 4. Retrieve Marketplace tasks
          # ---------------------------------------------------------

          print()
          print(
              "[4] Scanning Marketplace..."
          )

          marketplace_response = request(
              "GET",
              "/marketplace/tasks"
          )

          marketplace_data = (
              safe_json(marketplace_response)
              if marketplace_response is not None
              else None
          )

          marketplace_tasks = extract_list(
              marketplace_data,
              [
                  "tasks",
                  "items",
                  "data",
                  "results"
              ]
          )

          print(
              f"Marketplace tasks detected: "
              f"{len(marketplace_tasks)}"
          )

          # ---------------------------------------------------------
          # 5. Capability model
          #
          # This is intentionally conservative.
          # It represents capabilities NØX has demonstrated
          # through its current workflows rather than claiming
          # capabilities it does not have.
          # ---------------------------------------------------------

          print()
          print(
              "[5] Building current capability profile..."
          )

          capabilities = {
              "api_access": True,
              "web_data_retrieval": True,
              "feed_observation": True,
              "community_observation": True,
              "dm_reading": True,
              "suggestion_analysis": True,
              "memory_management": True,
              "structured_data_processing": True,
              "text_analysis": True,
              "github_workflow_execution": True,
              "marketplace_observation": True,
              "marketplace_execution": False,
              "autonomous_bidding": False,
              "autonomous_task_claiming": False,
              "payment_handling": False
          }

          capability_keywords = {
              "api_access": [
                  "api",
                  "rest",
                  "endpoint",
                  "json"
              ],
              "web_data_retrieval": [
                  "web",
                  "website",
                  "research",
                  "lookup",
                  "information"
              ],
              "text_analysis": [
                  "text",
                  "writing",
                  "analysis",
                  "summarize",
                  "summary",
                  "classification"
              ],
              "structured_data_processing": [
                  "json",
                  "data",
                  "dataset",
                  "csv",
                  "table"
              ],
              "python": [
                  "python",
                  "script",
                  "programming",
                  "code"
              ],
              "research": [
                  "research",
                  "investigate",
                  "researcher",
                  "find information"
              ],
              "automation": [
                  "automation",
                  "automate",
                  "workflow"
              ],
              "ai_agents": [
                  "ai",
                  "agent",
                  "agents",
                  "artificial intelligence"
              ],
              "cybersecurity": [
                  "cyber",
                  "security",
                  "cybersecurity"
              ],
              "documentation": [
                  "documentation",
                  "document",
                  "write",
                  "writing"
              ]
          }

          # ---------------------------------------------------------
          # 6. Analyze each task
          # ---------------------------------------------------------

          print()
          print(
              "[6] Detecting potentially compatible tasks..."
          )

          detected_tasks = []

          for index, task in enumerate(
              marketplace_tasks,
              1
          ):

              if not isinstance(
                  task,
                  dict
              ):
                  continue

              text = task_text(
                  task
              )

              text_lower = text.lower()

              matched_capabilities = []

              for capability, keywords in (
                  capability_keywords.items()
              ):

                  for keyword in keywords:

                      if keyword in text_lower:

                          matched_capabilities.append(
                              capability
                          )
                          break

              matched_capabilities = list(
                  dict.fromkeys(
                      matched_capabilities
                  )
              )

              reward = number_from_task(
                  task,
                  [
                      "reward",
                      "reward_sats",
                      "reward_yips",
                      "amount",
                      "payout",
                      "price"
                  ]
              )

              status = clean_text(
                  task.get(
                      "status",
                      ""
                  )
              ).lower()

              task_id = task.get(
                  "id"
              )

              title = clean_text(
                  task.get(
                      "title",
                      task.get(
                          "name",
                          "Untitled task"
                      )
                  )
              )

              compatibility = 0.0

              if matched_capabilities:
                  compatibility += min(
                      len(
                          matched_capabilities
                      ) * 0.12,
                      0.48
                  )

              # Text/research/API tasks are currently
              # more realistic for NØX.
              if any(
                  capability in matched_capabilities
                  for capability in (
                      "text_analysis",
                      "structured_data_processing",
                      "research",
                      "api_access",
                      "web_data_retrieval"
                  )
              ):
                  compatibility += 0.15

              if reward is not None:
                  compatibility += 0.10

              if status in (
                  "open",
                  "available",
                  "active"
              ):
                  compatibility += 0.10

              compatibility = min(
                  compatibility,
                  0.85
              )

              if compatibility <= 0:
                  classification = (
                      "low_compatibility"
                  )
              elif compatibility < 0.35:
                  classification = (
                      "possible"
                  )
              elif compatibility < 0.60:
                  classification = (
                      "promising"
                  )
              else:
                  classification = (
                      "strong_candidate"
                  )

              detected_tasks.append({
                  "rank_input": index,
                  "task_id": task_id,
                  "title": title,
                  "status": status,
                  "reward_detected": reward,
                  "matched_capabilities": (
                      matched_capabilities
                  ),
                  "compatibility_score": round(
                      compatibility,
                      4
                  ),
                  "classification": classification,
                  "raw_task": task
              })

          # ---------------------------------------------------------
          # 7. Sort by compatibility
          # ---------------------------------------------------------

          detected_tasks.sort(
              key=lambda task: (
                  task.get(
                      "compatibility_score",
                      0
                  ),
                  task.get(
                      "reward_detected"
                  ) or 0
              ),
              reverse=True
          )

          top_tasks = detected_tasks[:10]

          print()
          print(
              "========== TOP POTENTIAL TASKS =========="
          )

          for rank, task in enumerate(
              top_tasks,
              1
          ):

              print()
              print(
                  f"#{rank} "
                  f"{task['classification']} "
                  f"score="
                  f"{task['compatibility_score']}"
              )

              print(
                  f"Title: "
                  f"{task['title']}"
              )

              print(
                  f"Task ID: "
                  f"{task['task_id']}"
              )

              print(
                  f"Status: "
                  f"{task['status'] or 'unknown'}"
              )

              print(
                  f"Reward: "
                  f"{task['reward_detected']}"
              )

              print(
                  "Matched capabilities: "
                  + (
                      ", ".join(
                          task[
                              "matched_capabilities"
                          ]
                      )
                      if task[
                          "matched_capabilities"
                      ]
                      else "none"
                  )
              )

          # ---------------------------------------------------------
          # 8. Identify best current candidate
          # ---------------------------------------------------------

          print()
          print(
              "[7] Identifying the strongest current candidate..."
          )

          strongest = (
              top_tasks[0]
              if top_tasks
              else None
          )

          if strongest:

              print(
                  f"Current strongest candidate: "
                  f"{strongest['title']}"
              )

              print(
                  f"Compatibility: "
                  f"{strongest['compatibility_score']}"
              )

          else:

              print(
                  "No compatible task detected."
              )

          # ---------------------------------------------------------
          # 9. Decision boundary
          #
          # ACT 12 does NOT choose a task to execute.
          # It only identifies candidates.
          # ---------------------------------------------------------

          print()
          print(
              "[8] Applying ACT 12 decision boundary..."
          )

          decision = {
              "decision_id": (
                  f"act12-{int(now_dt.timestamp())}"
              ),
              "timestamp": now,
              "stage": "task_detection",
              "candidate_count": len(
                  detected_tasks
              ),
              "selected_candidate": (
                  strongest["task_id"]
                  if strongest
                  else None
              ),
              "selected_title": (
                  strongest["title"]
                  if strongest
                  else None
              ),
              "compatibility_score": (
                  strongest[
                      "compatibility_score"
                  ]
                  if strongest
                  else 0
              ),
              "action_taken": False,
              "execution_authorized": False,
              "reason": (
                  "ACT 12 detects and evaluates "
                  "potential task compatibility. "
                  "It does not execute Marketplace actions."
              )
          }

          print(
              json.dumps(
                  decision,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ---------------------------------------------------------
          # 10. Learning
          # ---------------------------------------------------------

          print()
          print(
              "[9] Creating ACT 12 learning record..."
          )

          learning = {
              "timestamp": now,
              "stage": "ACT12",
              "lesson": (
                  "NØX must compare available tasks "
                  "with its demonstrated capabilities "
                  "before considering autonomous execution."
              ),
              "marketplace_tasks_seen": len(
                  marketplace_tasks
              ),
              "potential_tasks_detected": len(
                  detected_tasks
              ),
              "current_capabilities": capabilities,
              "important_principle": (
                  "Seeing a task does not mean NØX "
                  "is capable of completing it."
              ),
              "autonomy_progression": (
                  "ACT 12 moves NØX from active attention "
                  "toward task detection and capability matching. "
                  "ACT 13 must introduce autonomous evaluation "
                  "and choice."
              )
          }

          # ---------------------------------------------------------
          # 11. Save memory
          # ---------------------------------------------------------

          print()
          print(
              "[10] Updating NØX memory..."
          )

          memory["last_act"] = "ACT 12"
          memory["updated_at"] = now

          memory["observations"].append({
              "timestamp": now,
              "act": "ACT12",
              "type": "marketplace_task_detection",
              "marketplace_tasks": len(
                  marketplace_tasks
              ),
              "potential_tasks": len(
                  detected_tasks
              ),
              "top_candidate": (
                  strongest["task_id"]
                  if strongest
                  else None
              )
          })

          memory["decisions"].append(
              decision
          )

          memory["learning"].append(
              learning
          )

          memory["task_detection"] = {
              "timestamp": now,
              "tasks_seen": len(
                  marketplace_tasks
              ),
              "candidates": [
                  {
                      "task_id": task[
                          "task_id"
                      ],
                      "title": task[
                          "title"
                      ],
                      "compatibility_score": task[
                          "compatibility_score"
                      ],
                      "classification": task[
                          "classification"
                      ],
                      "matched_capabilities": task[
                          "matched_capabilities"
                      ],
                      "reward_detected": task[
                          "reward_detected"
                      ]
                  }
                  for task in top_tasks
              ]
          }

          # Keep memory bounded.
          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["learning"] = (
              memory["learning"][-50:]
          )

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Memory saved to {MEMORY_FILE}"
          )

          # ---------------------------------------------------------
          # 12. ACT 12 safety boundary
          # ---------------------------------------------------------

          print()
          print("================================================")
          print("ACT 12 COMPLETED")
          print("================================================")

          print()
          print("ACT 12 CAPABILITIES:")
          print("- Detect Marketplace tasks.")
          print("- Read task information.")
          print("- Compare tasks with current capabilities.")
          print("- Estimate compatibility.")
          print("- Identify promising candidates.")
          print("- Store task knowledge in memory.")

          print()
          print("ACT 12 DOES NOT:")
          print("- Claim a task.")
          print("- Submit a bid.")
          print("- Accept an offer.")
          print("- Send a Marketplace response.")
          print("- Execute paid work.")
          print("- Spend or receive sats/yips.")

          print()
          print("ROADMAP:")
          print("ACT 11 -> Active attention")
          print("ACT 12 -> Task detection + capability matching")
          print("ACT 13 -> Autonomous evaluation + choice")
          print("ACT 14 -> Controlled execution")
          print("ACT 15 -> REAL MARKETPLACE ACTION")

          print()
          print("NEXT OBJECTIVE:")
          print(
              "ACT 13 must allow NØX to evaluate "
              "which detected task it should choose "
              "and why."
          )

          print()
          print("================================================")
          print("END")
          print("================================================")
          PY

      - name: Save NØX ACT 12 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX ACT 12: task detection and capability matching"
            git push
          fi
