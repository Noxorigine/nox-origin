name: "NØX ACT40 - Action Selection"

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  action-selection:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT40
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          # ============================================================
          # Helpers
          # ============================================================

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def write_json(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          def numeric(value, default=None):
              if isinstance(value, bool):
                  return default

              if isinstance(value, (int, float)):
                  return float(value)

              if isinstance(value, str):
                  try:
                      return float(
                          value.strip().replace("%", "")
                      )
                  except Exception:
                      return default

              return default

          def find_act_file(act_number, preferred_names=None):
              preferred_names = preferred_names or []

              for name in preferred_names:
                  path = MEMORY / name

                  if path.exists():
                      data = load_json(path)

                      if (
                          isinstance(data, dict)
                          and str(
                              data.get("act", "")
                          ).upper()
                          == act_number.upper()
                      ):
                          return path, data

              number = act_number.lower().replace(
                  "act",
                  ""
              )

              candidates = []

              candidates.extend(
                  MEMORY.glob(
                      f"*act_{number}*.json"
                  )
              )

              candidates.extend(
                  MEMORY.glob(
                      f"*act{number}*.json"
                  )
              )

              matches = []

              seen = set()

              for path in candidates:

                  if path in seen:
                      continue

                  seen.add(path)

                  data = load_json(path)

                  if (
                      isinstance(data, dict)
                      and str(
                          data.get("act", "")
                      ).upper()
                      == act_number.upper()
                  ):
                      matches.append(
                          (path, data)
                      )

              if not matches:
                  return None, {}

              matches.sort(
                  key=lambda item:
                      item[0].stat().st_mtime,
                  reverse=True
              )

              return matches[0]

          # ============================================================
          # Discover upstream cognitive states
          # ============================================================

          act30_path, act30 = find_act_file(
              "ACT30",
              [
                  "nox_act_30_adaptive_strategy_selection.json"
              ]
          )

          act31_path, act31 = find_act_file(
              "ACT31",
              [
                  "nox_act_31_strategy_evaluation.json"
              ]
          )

          act32_path, act32 = find_act_file(
              "ACT32",
              [
                  "nox_act_32_experiment_designer.json"
              ]
          )

          act33_path, act33 = find_act_file(
              "ACT33",
              [
                  "nox_act_33_resource_allocation.json"
              ]
          )

          act34_path, act34 = find_act_file(
              "ACT34",
              [
                  "nox_act_34_goal_formation.json"
              ]
          )

          act35_path, act35 = find_act_file(
              "ACT35",
              [
                  "nox_act_35_self_improvement_loop.json"
              ]
          )

          act37_path, act37 = find_act_file(
              "ACT37",
              [
                  "nox_act_37_cognitive_signal_reliability.json"
              ]
          )

          act38_path, act38 = find_act_file(
              "ACT38",
              [
                  "nox_act_38_evidence_fusion.json"
              ]
          )

          act39_path, act39 = find_act_file(
              "ACT39",
              [
                  "nox_act_39_confidence_calibration.json"
              ]
          )

          sources = {
              "ACT30": act30,
              "ACT31": act31,
              "ACT32": act32,
              "ACT33": act33,
              "ACT34": act34,
              "ACT35": act35,
              "ACT37": act37,
              "ACT38": act38,
              "ACT39": act39
          }

          # ============================================================
          # Extract reliable upstream measurements
          # ============================================================

          act30_metrics = (
              act30.get("metrics", {})
              if isinstance(act30, dict)
              else {}
          )

          act31_metrics = (
              act31.get("metrics", {})
              if isinstance(act31, dict)
              else {}
          )

          act32_metrics = (
              act32.get("metrics", {})
              if isinstance(act32, dict)
              else {}
          )

          act33_metrics = (
              act33.get("metrics", {})
              if isinstance(act33, dict)
              else {}
          )

          act34_metrics = (
              act34.get("metrics", {})
              if isinstance(act34, dict)
              else {}
          )

          act37_metrics = (
              act37.get("metrics", {})
              if isinstance(act37, dict)
              else {}
          )

          act38_metrics = (
              act38.get("metrics", {})
              if isinstance(act38, dict)
              else {}
          )

          act39_metrics = (
              act39.get("metrics", {})
              if isinstance(act39, dict)
              else {}
          )

          # ============================================================
          # Decision confidence ceiling
          # ============================================================

          decision_ceiling = numeric(
              act39.get(
                  "calibrated_decision_confidence_ceiling"
              ),
              None
          )

          if decision_ceiling is None:
              decision_ceiling = numeric(
                  act38.get(
                      "decision_confidence_ceiling"
                  ),
                  35.0
              )

          decision_ceiling = max(
              0.0,
              min(100.0, decision_ceiling)
          )

          fusion_confidence = numeric(
              act39.get(
                  "fusion_confidence"
              ),
              None
          )

          if fusion_confidence is None:
              fusion_confidence = numeric(
                  act38.get(
                      "fusion_confidence"
                  ),
                  19.0
              )

          calibration_confidence = numeric(
              act39.get(
                  "calibration",
                  {}
              ).get(
                  "confidence"
              )
              if isinstance(
                  act39.get("calibration", {}),
                  dict
              )
              else None,
              15.0
          )

          calibration_usable = bool(
              act39.get(
                  "calibration",
                  {}
              ).get(
                  "usable_for_autonomous_decision",
                  False
              )
              if isinstance(
                  act39.get("calibration", {}),
                  dict
              )
              else False
          )

          # ============================================================
          # Empirical evidence
          # ============================================================

          observed_outcomes = numeric(
              act39.get(
                  "observed_outcomes"
              ),
              numeric(
                  act31.get(
                      "observed_outcomes"
                  ),
                  0.0
              )
          )

          comparable_outcomes = numeric(
              act39.get(
                  "comparable_outcomes"
              ),
              numeric(
                  act31.get(
                      "comparable_outcomes"
                  ),
                  0.0
              )
          )

          evidence_quality = numeric(
              act31.get(
                  "evidence_quality"
              ),
              numeric(
                  act31_metrics.get(
                      "evidence_quality"
                  ),
                  60.0
              )
          )

          evaluation_status = act31.get(
              "evaluation_status",
              act31_metrics.get(
                  "evaluation_status",
                  "inconclusive"
              )
          )

          # ============================================================
          # Resource state
          # ============================================================

          allocation_quality = numeric(
              act33.get(
                  "allocation_quality"
              ),
              numeric(
                  act33_metrics.get(
                      "allocation_quality"
                  ),
                  0.0
              )
          )

          resource_limits = act33.get(
              "resource_limits",
              {}
          )

          if not isinstance(
              resource_limits,
              dict
          ):
              resource_limits = {}

          financial_limit = numeric(
              resource_limits.get(
                  "financial"
              ),
              0.0
          )

          # ============================================================
          # Goal state
          # ============================================================

          goal_quality = numeric(
              act34.get(
                  "goal_quality"
              ),
              numeric(
                  act34_metrics.get(
                      "goal_quality"
                  ),
                  0.0
              )
          )

          goal_provisional = bool(
              act34.get(
                  "provisional",
                  True
              )
          )

          # ============================================================
          # Experiment state
          # ============================================================

          experiment_count = numeric(
              act32.get(
                  "experiment_count"
              ),
              numeric(
                  act32_metrics.get(
                      "experiment_count"
                  ),
                  0.0
              )
          )

          selected_experiment = act32.get(
              "selected_experiment",
              {}
          )

          if not isinstance(
              selected_experiment,
              dict
          ):
              selected_experiment = {}

          selected_experiment_id = (
              selected_experiment.get(
                  "experiment_id"
              )
              or selected_experiment.get(
                  "id"
              )
              or "EXP003"
          )

          selected_prediction_id = (
              selected_experiment.get(
                  "prediction_id"
              )
              or "P003"
          )

          experiment_question = (
              selected_experiment.get(
                  "question"
              )
              or
              "When a task is judged relevant, "
              "does it actually create a useful "
              "action opportunity for NØX?"
          )

          # ============================================================
          # Strategy state
          # ============================================================

          selected_strategy = (
              act30.get(
                  "selected_strategy"
              )
              or act30.get(
                  "preferred_strategy"
              )
              or "S01"
          )

          strategy_score = numeric(
              act30.get(
                  "selected_strategy_score"
              ),
              numeric(
                  act30_metrics.get(
                      "selected_strategy_score"
                  ),
                  100.0
              )
          )

          strategy_confidence = numeric(
              act30.get(
                  "decision_confidence"
              ),
              numeric(
                  act30_metrics.get(
                      "decision_confidence"
                  ),
                  82.0
              )
          )

          # ============================================================
          # Construct action candidates
          #
          # ACT40 does not execute actions.
          # It evaluates which action would be most justified.
          # ============================================================

          candidates = [
              {
                  "action_id": "A01",
                  "name": "Collect real prediction outcomes",
                  "type": "evidence_generation",
                  "target": "ACT28_predictions",
                  "expected_value": 96.0,
                  "learning_value": 100.0,
                  "goal_alignment": 98.0,
                  "evidence_support": 95.0,
                  "reversibility": 100.0,
                  "risk": 5.0,
                  "resource_cost": 10.0,
                  "execution_readiness": 75.0,
                  "condition": (
                      "Real observable outcomes are "
                      "needed to evaluate ACT28 predictions."
                  )
              },
              {
                  "action_id": "A02",
                  "name": "Verify marketplace task opportunity",
                  "type": "experiment_execution",
                  "target": selected_experiment_id,
                  "expected_value": 94.0,
                  "learning_value": 96.0,
                  "goal_alignment": 99.0,
                  "evidence_support": 82.0,
                  "reversibility": 95.0,
                  "risk": 12.0,
                  "resource_cost": 20.0,
                  "execution_readiness": 70.0,
                  "condition": (
                      "A relevant marketplace task must be "
                      "observed and its action opportunity "
                      "verified."
                  )
              },
              {
                  "action_id": "A03",
                  "name": "Improve confidence calibration",
                  "type": "calibration",
                  "target": "ACT39",
                  "expected_value": 70.0,
                  "learning_value": 85.0,
                  "goal_alignment": 80.0,
                  "evidence_support": 55.0,
                  "reversibility": 100.0,
                  "risk": 2.0,
                  "resource_cost": 5.0,
                  "execution_readiness": 30.0,
                  "condition": (
                      "Repeated outcomes are required before "
                      "empirical calibration can improve."
                  )
              },
              {
                  "action_id": "A04",
                  "name": "Expand active attention",
                  "type": "attention_improvement",
                  "target": "ACT26",
                  "expected_value": 68.0,
                  "learning_value": 78.0,
                  "goal_alignment": 72.0,
                  "evidence_support": 45.0,
                  "reversibility": 100.0,
                  "risk": 3.0,
                  "resource_cost": 10.0,
                  "execution_readiness": 35.0,
                  "condition": (
                      "ACT26 attention-selection data remains "
                      "partially unreliable downstream."
                  )
              },
              {
                  "action_id": "A05",
                  "name": "Refine relational models",
                  "type": "model_refinement",
                  "target": "ACT27",
                  "expected_value": 62.0,
                  "learning_value": 70.0,
                  "goal_alignment": 65.0,
                  "evidence_support": 75.0,
                  "reversibility": 100.0,
                  "risk": 3.0,
                  "resource_cost": 10.0,
                  "execution_readiness": 45.0,
                  "condition": (
                      "Relationship models can be improved, "
                      "but current evidence does not make this "
                      "the highest-value immediate action."
                  )
              }
          ]

          # ============================================================
          # Expected value model
          #
          # No false precision:
          # - confidence ceiling constrains trust
          # - evidence quality affects expected value
          # - risk reduces action desirability
          # - reversibility increases desirability
          # - empirical evidence receives strong weight
          #
          # No candidate can obtain execution authority from ACT40.
          # ============================================================

          empirical_bonus = min(
              100.0,
              comparable_outcomes * 10.0
          )

          evidence_factor = min(
              100.0,
              max(
                  0.0,
                  evidence_quality
              )
          )

          confidence_factor = min(
              100.0,
              decision_ceiling
          )

          for candidate in candidates:

              base_score = (
                  candidate["expected_value"]
                  * 0.24
                  +
                  candidate["learning_value"]
                  * 0.20
                  +
                  candidate["goal_alignment"]
                  * 0.18
                  +
                  candidate["evidence_support"]
                  * 0.14
                  +
                  candidate["reversibility"]
                  * 0.10
                  +
                  candidate["execution_readiness"]
                  * 0.08
              )

              risk_penalty = (
                  candidate["risk"]
                  * 0.04
              )

              resource_penalty = (
                  candidate["resource_cost"]
                  * 0.02
              )

              # Empirical evidence cannot create evidence where
              # none exists, but can reward actions that produce it.
              if candidate["type"] == "evidence_generation":
                  empirical_action_bonus = (
                      8.0
                      if observed_outcomes == 0
                      else 2.0
                  )

              elif candidate["type"] == "experiment_execution":
                  empirical_action_bonus = (
                      7.0
                      if comparable_outcomes == 0
                      else 2.0
                  )

              else:
                  empirical_action_bonus = 0.0

              candidate["raw_score"] = round(
                  base_score
                  - risk_penalty
                  - resource_penalty
                  + empirical_action_bonus,
                  2
              )

              # Decision ceiling is not treated as action probability.
              candidate["confidence_ceiling"] = round(
                  confidence_factor,
                  2
              )

              candidate["evidence_factor"] = round(
                  evidence_factor,
                  2
              )

              candidate["empirical_bonus"] = round(
                  empirical_action_bonus,
                  2
              )

              # Conservative action score.
              candidate["selection_score"] = round(
                  candidate["raw_score"]
                  * (
                      0.60
                      + (
                          candidate["evidence_support"]
                          / 100.0
                          * 0.20
                      )
                      + (
                          candidate["reversibility"]
                          / 100.0
                          * 0.20
                      )
                  ),
                  2
              )

          candidates.sort(
              key=lambda item:
                  item["selection_score"],
              reverse=True
          )

          selected = candidates[0]

          second = (
              candidates[1]
              if len(candidates) > 1
              else None
          )

          score_margin = (
              selected["selection_score"]
              - second["selection_score"]
              if second
              else selected["selection_score"]
          )

          # ============================================================
          # Decision confidence
          #
          # The decision cannot exceed ACT39/ACT38 ceiling.
          # Since there are zero empirical outcomes, confidence is
          # deliberately capped further.
          # ============================================================

          if comparable_outcomes == 0:
              empirical_decision_cap = 35.0
          elif comparable_outcomes < 5:
              empirical_decision_cap = 50.0
          else:
              empirical_decision_cap = 100.0

          decision_confidence = min(
              strategy_confidence,
              decision_ceiling,
              empirical_decision_cap
          )

          if score_margin < 5:
              decision_confidence = min(
                  decision_confidence,
                  25.0
              )

          elif score_margin < 10:
              decision_confidence = min(
                  decision_confidence,
                  30.0
              )

          decision_confidence = round(
              decision_confidence,
              2
          )

          # ============================================================
          # Execution readiness
          #
          # ACT40 selects an action but does NOT authorize execution.
          # ============================================================

          execution_permission = False

          execution_status = (
              "selected_but_not_authorized"
          )

          if (
              decision_confidence >= 70
              and comparable_outcomes >= 5
              and evidence_quality >= 75
              and fusion_confidence >= 50
              and calibration_usable
          ):
              execution_status = (
                  "potentially_ready_for_later_authorization"
              )

          # Financial activity remains hard-disabled.
          financial_permission = False
          payment_permission = False
          spending_permission = False

          # ============================================================
          # Decision rationale
          # ============================================================

          if selected["action_id"] == "A01":
              rationale = (
                  "The highest-value immediate action is to "
                  "generate real prediction outcomes because "
                  "ACT39 cannot calibrate confidence without "
                  "observations. This action directly attacks "
                  "the largest current epistemic gap."
              )

          elif selected["action_id"] == "A02":
              rationale = (
                  "The marketplace experiment is highly aligned "
                  "with the operational goal and can produce "
                  "real-world evidence, but it remains subject "
                  "to the current conservative decision ceiling."
              )

          else:
              rationale = (
                  "The selected action has the best current "
                  "expected value under the available evidence, "
                  "while execution remains intentionally disabled."
              )

          # ============================================================
          # Validation
          # ============================================================

          source_states = {
              "ACT30": act30_path is not None,
              "ACT31": act31_path is not None,
              "ACT32": act32_path is not None,
              "ACT33": act33_path is not None,
              "ACT34": act34_path is not None,
              "ACT35": act35_path is not None,
              "ACT37": act37_path is not None,
              "ACT38": act38_path is not None,
              "ACT39": act39_path is not None
          }

          source_completeness = (
              sum(
                  1
                  for value in source_states.values()
                  if value
              )
              / len(source_states)
              * 100.0
          )

          validation = {
              "all_required_sources_present": (
                  source_completeness == 100.0
              ),

              "candidate_actions_present": (
                  len(candidates) >= 5
              ),

              "selected_action_present": (
                  isinstance(selected, dict)
                  and bool(
                      selected.get("action_id")
                  )
              ),

              "selection_score_present": (
                  numeric(
                      selected.get(
                          "selection_score"
                      ),
                      None
                  ) is not None
              ),

              "decision_confidence_capped": (
                  decision_confidence
                  <= decision_ceiling
              ),

              "zero_outcomes_preserved": (
                  observed_outcomes == 0
                  and comparable_outcomes == 0
              ),

              "no_execution_granted": (
                  execution_permission is False
              ),

              "financial_permission_false": (
                  financial_permission is False
              ),

              "payment_permission_false": (
                  payment_permission is False
              ),

              "spending_permission_false": (
                  spending_permission is False
              ),

              "gemini_false": True,

              "cost_zero": True
          }

          # ============================================================
          # Result
          # ============================================================

          result = {
              "act": "ACT40",
              "version": "V1",
              "name": "Action Selection",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Select the action with the highest expected "
                  "value under current evidence, confidence, "
                  "risk, reversibility and resource constraints."
              ),

              "cognitive_transition": (
                  "ACT40 moves NØX from evaluating strategies "
                  "to selecting which concrete action deserves "
                  "attention and possible future execution."
              ),

              "principles": [
                  "Selection is not execution.",
                  "Confidence is not authorization.",
                  "Expected value is not certainty.",
                  "Evidence quality constrains decision confidence.",
                  "Risk reduces action desirability.",
                  "Reversibility increases action desirability.",
                  "Real outcomes have higher epistemic value than internal scores.",
                  "Zero observed outcomes means calibration remains unavailable.",
                  "A decision ceiling must constrain downstream confidence.",
                  "Financial actions remain disabled.",
                  "No action may create spending authority.",
                  "No action may create payment authority.",
                  "No action may create Gemini authority."
              ],

              "source_acts": [
                  "ACT30",
                  "ACT31",
                  "ACT32",
                  "ACT33",
                  "ACT34",
                  "ACT35",
                  "ACT37",
                  "ACT38",
                  "ACT39"
              ],

              "source_files": {
                  "ACT30": (
                      str(act30_path)
                      if act30_path
                      else None
                  ),
                  "ACT31": (
                      str(act31_path)
                      if act31_path
                      else None
                  ),
                  "ACT32": (
                      str(act32_path)
                      if act32_path
                      else None
                  ),
                  "ACT33": (
                      str(act33_path)
                      if act33_path
                      else None
                  ),
                  "ACT34": (
                      str(act34_path)
                      if act34_path
                      else None
                  ),
                  "ACT35": (
                      str(act35_path)
                      if act35_path
                      else None
                  ),
                  "ACT37": (
                      str(act37_path)
                      if act37_path
                      else None
                  ),
                  "ACT38": (
                      str(act38_path)
                      if act38_path
                      else None
                  ),
                  "ACT39": (
                      str(act39_path)
                      if act39_path
                      else None
                  )
              },

              "source_states": source_states,

              "source_completeness": round(
                  source_completeness,
                  2
              ),

              "decision_inputs": {
                  "decision_confidence_ceiling": round(
                      decision_ceiling,
                      2
                  ),
                  "fusion_confidence": round(
                      fusion_confidence,
                      2
                  ),
                  "calibration_confidence": round(
                      calibration_confidence,
                      2
                  ),
                  "calibration_usable": (
                      calibration_usable
                  ),
                  "evidence_quality": round(
                      evidence_quality,
                      2
                  ),
                  "observed_outcomes": (
                      observed_outcomes
                  ),
                  "comparable_outcomes": (
                      comparable_outcomes
                  ),
                  "evaluation_status": (
                      evaluation_status
                  ),
                  "allocation_quality": round(
                      allocation_quality,
                      2
                  ),
                  "goal_quality": round(
                      goal_quality,
                      2
                  ),
                  "strategy_score": round(
                      strategy_score,
                      2
                  ),
                  "strategy_confidence": round(
                      strategy_confidence,
                      2
                  )
              },

              "selected_experiment": {
                  "experiment_id": (
                      selected_experiment_id
                  ),
                  "prediction_id": (
                      selected_prediction_id
                  ),
                  "question": experiment_question
              },

              "candidate_actions": candidates,

              "selection": {
                  "selected_action_id": (
                      selected["action_id"]
                  ),
                  "selected_action": (
                      selected["name"]
                  ),
                  "selected_action_type": (
                      selected["type"]
                  ),
                  "selection_score": (
                      selected["selection_score"]
                  ),
                  "second_best_action_id": (
                      second["action_id"]
                      if second
                      else None
                  ),
                  "second_best_score": (
                      second["selection_score"]
                      if second
                      else None
                  ),
                  "score_margin": round(
                      score_margin,
                      2
                  ),
                  "decision_confidence": (
                      decision_confidence
                  ),
                  "rationale": rationale
              },

              "expected_value_model": {
                  "expected_value_weight": 0.24,
                  "learning_value_weight": 0.20,
                  "goal_alignment_weight": 0.18,
                  "evidence_support_weight": 0.14,
                  "reversibility_weight": 0.10,
                  "execution_readiness_weight": 0.08,
                  "risk_penalty_weight": 0.04,
                  "resource_penalty_weight": 0.02,
                  "empirical_evidence_bonus": (
                      "applied only when the selected action "
                      "can generate missing real-world evidence"
                  )
              },

              "execution_boundary": {
                  "execution_permission": (
                      execution_permission
                  ),
                  "status": execution_status,
                  "reason": (
                      "ACT40 selects an action but does not "
                      "grant execution authority."
                  )
              },

              "financial_boundary": {
                  "financial_permission": (
                      financial_permission
                  ),
                  "payment_permission": (
                      payment_permission
                  ),
                  "spending_permission": (
                      spending_permission
                  ),
                  "financial_limit": 0.0
              },

              "autonomy_state": {
                  "status": "learning_only",
                  "action_selection": True,
                  "action_execution": False,
                  "financial_actions": False,
                  "payments": False,
                  "spending": False,
                  "gemini": False
              },

              "next_action": (
                  "Observe whether the selected action can "
                  "generate a real outcome and compare that "
                  "outcome with the prediction that motivated it."
              ),

              "next_cognitive_step": (
                  "ACT41 should evaluate action results against "
                  "expected results and learn which action choices "
                  "actually produce useful outcomes."
              ),

              "validation": validation
          }

          # Stable downstream aliases
          result["selected_action_id"] = (
              selected["action_id"]
          )

          result["selected_action_score"] = (
              selected["selection_score"]
          )

          result["decision_confidence"] = (
              decision_confidence
          )

          result["decision_confidence_ceiling"] = (
              decision_ceiling
          )

          result["observed_outcomes"] = (
              observed_outcomes
          )

          result["comparable_outcomes"] = (
              comparable_outcomes
          )

          result["execution_permission"] = False
          result["financial_permission"] = False
          result["payment_permission"] = False
          result["spending_permission"] = False

          # ============================================================
          # Write memory
          # ============================================================

          output_path = (
              MEMORY
              / "nox_act_40_action_selection.json"
          )

          write_json(
              output_path,
              result
          )

          # ============================================================
          # Console
          # ============================================================

          print("========================================")
          print("NØX ACT40 V1 - ACTION SELECTION")
          print("========================================")
          print(
              f"Sources: "
              f"{source_completeness:.2f}%"
          )
          print("----------------------------------------")
          print(
              f"Candidates: "
              f"{len(candidates)}"
          )
          print(
              f"Selected: "
              f"{selected['action_id']} - "
              f"{selected['name']}"
          )
          print(
              f"Selection score: "
              f"{selected['selection_score']}"
          )
          print(
              f"Score margin: "
              f"{score_margin:.2f}"
          )
          print(
              f"Decision confidence: "
              f"{decision_confidence}"
          )
          print(
              f"Decision ceiling: "
              f"{decision_ceiling}"
          )
          print("----------------------------------------")
          print(
              f"Observed outcomes: "
              f"{observed_outcomes}"
          )
          print(
              f"Comparable outcomes: "
              f"{comparable_outcomes}"
          )
          print(
              f"Evidence quality: "
              f"{evidence_quality}"
          )
          print("----------------------------------------")
          print(
              "Execution permission: false"
          )
          print(
              "Financial permission: false"
          )
          print(
              "Payment permission: false"
          )
          print(
              "Spending permission: false"
          )
          print("----------------------------------------")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          print("----------------------------------------")

          failed = [
              key
              for key, value
              in validation.items()
              if not value
          ]

          if failed:

              print("VALIDATION FAILED:")

              for key in failed:
                  print(f" - {key}")

              raise SystemExit(1)

          print("VALIDATION PASSED")
          print(
              f"Memory written: {output_path}"
          )

          # ============================================================
          # Commit / push
          # ============================================================

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "NØX"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "nox@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  str(output_path)
              ],
              check=True
          )

          commit = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "ACT40 V1 action selection"
              ],
              text=True,
              capture_output=True
          )

          if commit.returncode != 0:
              print(commit.stdout)
              print(commit.stderr)

          pushed = False

          for attempt in range(3):

              try:

                  subprocess.run(
                      [
                          "git",
                          "fetch",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "origin/main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "HEAD:main"
                      ],
                      check=True
                  )

                  pushed = True
                  break

              except subprocess.CalledProcessError as exc:

                  print(
                      f"Push/rebase attempt "
                      f"{attempt + 1} failed: {exc}"
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "--abort"
                      ],
                      check=False
                  )

          if not pushed:
              raise SystemExit(
                  "Unable to push ACT40 after 3 attempts."
              )

          print(
              "ACT40 V1 committed and pushed successfully."
          )
          PY
