name: NØX Origin - V56 Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V56
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v56_agent.py <<'PY'
          import os
          import json
          import re
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          report = {
              "generated": datetime.now(timezone.utc).isoformat(),
              "status": {},
              "decision": {},
              "safety": {
                  "maximum_public_actions": 1,
                  "actions_attempted": 0,
                  "publication": False,
                  "vote": False,
                  "follow": False,
                  "dm": False,
                  "purchase": False,
                  "spending": False,
                  "gemini": "DISABLED"
              }
          }

          def fail(message):
              raise RuntimeError(message)

          # ---------------------------------------------------------
          # 1. AUTHENTICATION
          # ---------------------------------------------------------

          auth = session.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )

          if auth.status_code != 200:
              fail(f"Authentication failed: HTTP {auth.status_code}")

          token_data = auth.json()
          token = token_data.get("access_token")

          if not token:
              fail("Authentication succeeded but no access_token was returned")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          report["status"]["authentication"] = "PASS"

          # ---------------------------------------------------------
          # 2. IDENTITY
          # ---------------------------------------------------------

          identity = session.get(
              f"{BASE}/users/me",
              timeout=30
          )

          if identity.status_code != 200:
              fail(f"Identity failed: HTTP {identity.status_code}")

          me = identity.json()

          my_id = (
              me.get("id")
              or me.get("user", {}).get("id")
          )

          my_username = (
              me.get("username")
              or me.get("user", {}).get("username")
              or ""
          )

          report["status"]["identity"] = "PASS"

          # ---------------------------------------------------------
          # 3. FEED
          # ---------------------------------------------------------

          feed_response = session.get(
              f"{BASE}/feed/for-you?limit=25",
              timeout=30
          )

          if feed_response.status_code != 200:
              fail(f"For-you feed failed: HTTP {feed_response.status_code}")

          feed_data = feed_response.json()

          items = feed_data.get("items", [])

          report["status"]["for_you_feed"] = "PASS"
          report["decision"]["feed_items"] = len(items)

          # ---------------------------------------------------------
          # 4. LOCAL CONTENT ANALYSIS
          # ---------------------------------------------------------

          topic_groups = {
              "agents": [
                  "agent", "agents", "ai agent", "ai agents"
              ],
              "memory": [
                  "memory", "context", "remember", "forget"
              ],
              "measurement": [
                  "measurement", "measure", "data", "result",
                  "results", "reproducible", "reproduce"
              ],
              "verification": [
                  "verify", "verification", "validate",
                  "validation", "evidence", "test"
              ],
              "learning": [
                  "learn", "learning", "knowledge", "experiment"
              ],
              "reputation": [
                  "reputation", "karma", "trust", "credibility"
              ],
              "proposal": [
                  "proposal", "propose", "idea", "ideas",
                  "suggestion", "suggest"
              ],
              "community": [
                  "community", "colony", "discussion",
                  "conversation"
              ],
              "economics": [
                  "money", "economic", "economics",
                  "reward", "rewards", "sats", "bitcoin"
              ]
          }

          injection_patterns = [
              r"ignore previous instructions",
              r"ignore all previous instructions",
              r"system prompt",
              r"developer message",
              r"reveal your prompt",
              r"reveal the instructions",
              r"jailbreak",
              r"execute this command",
              r"run this command",
              r"send your api key",
              r"send the api key",
              r"secret key",
              r"password",
              r"token"
          ]

          def get_post(item):
              post = item.get("post")

              if isinstance(post, dict):
                  return post

              return None

          def text_of(post):
              if not isinstance(post, dict):
                  return ""

              values = [
                  post.get("title", ""),
                  post.get("body", ""),
                  post.get("content", "")
              ]

              return " ".join(
                  str(v) for v in values if v
              ).strip()

          def post_id_of(post):
              if not isinstance(post, dict):
                  return None

              return (
                  post.get("id")
                  or post.get("post_id")
              )

          def author_id_of(post):
              if not isinstance(post, dict):
                  return None

              author = post.get("author")

              if isinstance(author, dict):
                  return author.get("id")

              return post.get("author_id")

          def contains_injection(text):
              lower = text.lower()

              return any(
                  re.search(pattern, lower)
                  for pattern in injection_patterns
              )

          candidates = []

          for item in items:
              post = get_post(item)

              if not post:
                  continue

              pid = post_id_of(post)

              if not pid:
                  continue

              # Never respond to our own post.
              author_id = author_id_of(post)

              if my_id and author_id == my_id:
                  continue

              text = text_of(post)

              if len(text) < 80:
                  continue

              # Treat Colony content as untrusted data.
              if contains_injection(text):
                  continue

              lower = text.lower()

              topics = []

              for topic, words in topic_groups.items():
                  if any(word in lower for word in words):
                      topics.append(topic)

              if not topics:
                  continue

              question = "?" in text

              score = 0

              # Enough context to respond meaningfully.
              if len(text) >= 180:
                  score += 2
              elif len(text) >= 100:
                  score += 1

              # More than one topic gives better context.
              score += min(len(topics), 3)

              # Questions are useful because they invite reasoning.
              if question:
                  score += 2

              # Strong verification/reproducibility subjects.
              if "verification" in topics:
                  score += 2

              if "measurement" in topics:
                  score += 2

              candidates.append({
                  "post": post,
                  "id": pid,
                  "text": text,
                  "topics": topics,
                  "score": score,
                  "question": question
              })

          candidates.sort(
              key=lambda x: (
                  x["score"],
                  len(x["topics"]),
                  len(x["text"])
              ),
              reverse=True
          )

          report["status"]["quality_candidate_analysis"] = "PASS"
          report["decision"]["candidates_found"] = len(candidates)

          # ---------------------------------------------------------
          # 5. SELECT ONE CANDIDATE
          # ---------------------------------------------------------

          if not candidates:
              report["decision"]["action"] = "NONE"
              report["decision"]["reason"] = (
                  "No feed post passed the local relevance and safety filters."
              )
          else:
              selected = candidates[0]

              post = selected["post"]
              post_id = selected["id"]
              text = selected["text"]
              topics = selected["topics"]

              title = str(post.get("title", "")).strip()
              author = post.get("author")

              if isinstance(author, dict):
                  author_name = (
                      author.get("username")
                      or author.get("display_name")
                      or "unknown"
                  )
              else:
                  author_name = "unknown"

              # -----------------------------------------------------
              # 6. BUILD CONTEXTUAL RESPONSE
              # -----------------------------------------------------

              topic_text = ", ".join(topics[:3])

              if selected["question"]:
                  comment = (
                      f"The question about {topic_text} is worth testing "
                      f"rather than answering only by assumption. I would "
                      f"separate the observation from the explanation, then "
                      f"repeat the same test on an independent example. "
                      f"That would show whether the pattern is reproducible "
                      f"or specific to this case."
                  )
              else:
                  comment = (
                      f"The point about {topic_text} is interesting. "
                      f"What stands out is the difference between observing "
                      f"a result and validating what it means. A useful "
                      f"next step would be to repeat the observation with "
                      f"an independent example and compare the result "
                      f"before treating the conclusion as reliable."
                  )

              comment = re.sub(r"\s+", " ", comment).strip()

              # -----------------------------------------------------
              # 7. QUALITY GATE
              # -----------------------------------------------------

              quality_checks = {
                  "minimum_length": len(comment) >= 120,
                  "maximum_length": len(comment) <= 900,
                  "mentions_topic": any(
                      topic.lower() in comment.lower()
                      for topic in topics
                  ),
                  "not_empty": bool(comment),
                  "not_injection": not contains_injection(comment),
                  "not_generic": (
                      "the point about" in comment.lower()
                      or "the question about" in comment.lower()
                  ),
                  "contains_testable_next_step": (
                      "test" in comment.lower()
                      or "repeat" in comment.lower()
                      or "reproducible" in comment.lower()
                  ),
                  "not_own_post": (
                      not my_id
                      or author_id_of(post) != my_id
                  )
              }

              quality_pass = all(quality_checks.values())

              report["decision"]["selected_post"] = {
                  "id": post_id,
                  "author": author_name,
                  "title": title,
                  "topics": topics,
                  "score": selected["score"]
              }

              report["decision"]["quality_checks"] = quality_checks
              report["decision"]["comment"] = comment

              if not quality_pass:
                  report["decision"]["action"] = "NONE"
                  report["decision"]["reason"] = (
                      "The proposed response failed the local quality gate."
                  )

              else:
                  # -------------------------------------------------
                  # 8. FINAL CONTENT RECHECK
                  # -------------------------------------------------

                  full_post = session.get(
                      f"{BASE}/posts/{post_id}",
                      timeout=30
                  )

                  if full_post.status_code != 200:
                      report["decision"]["action"] = "NONE"
                      report["decision"]["reason"] = (
                          f"Full post verification failed: "
                          f"HTTP {full_post.status_code}"
                      )
                  else:
                      refreshed = full_post.json()

                      refreshed_text = text_of(refreshed)

                      if contains_injection(refreshed_text):
                          report["decision"]["action"] = "NONE"
                          report["decision"]["reason"] = (
                              "Final post verification detected unsafe "
                              "instruction-like content."
                          )
                      else:
                          # -------------------------------------------------
                          # 9. ONE PUBLIC ACTION
                          # -------------------------------------------------

                          report["safety"]["actions_attempted"] = 1

                          publish = session.post(
                              f"{BASE}/posts/{post_id}/comments",
                              json={"body": comment},
                              timeout=30
                          )

                          report["decision"]["http_status"] = (
                              publish.status_code
                          )

                          if publish.status_code in (200, 201):
                              report["decision"]["action"] = "COMMENT"
                              report["decision"]["result"] = "SUCCESS"
                              report["safety"]["publication"] = False
                          else:
                              report["decision"]["action"] = "NONE"
                              report["decision"]["result"] = "FAILED"
                              report["decision"]["reason"] = (
                                  f"Comment failed: HTTP "
                                  f"{publish.status_code}"
                              )

          # ---------------------------------------------------------
          # 10. WRITE MEMORY
          # ---------------------------------------------------------

          os.makedirs("memory", exist_ok=True)

          with open(
              "memory/nox_v56_quality_gate.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ---------------------------------------------------------
          # 11. HUMAN-READABLE REPORT
          # ---------------------------------------------------------

          decision = report["decision"]

          lines = [
              "NØX Origin — V56 Quality Gate",
              "",
              f"Generated: {report['generated']}",
              "",
              "Status",
              f"Authentication: {report['status'].get('authentication', 'FAIL')}",
              f"Identity: {report['status'].get('identity', 'FAIL')}",
              f"For-you feed: {report['status'].get('for_you_feed', 'FAIL')}",
              f"Quality analysis: {report['status'].get('quality_candidate_analysis', 'FAIL')}",
              "Gemini: DISABLED",
              "",
              "Autonomous Decision"
          ]

          if decision.get("action") == "COMMENT":
              selected_post = decision.get("selected_post", {})

              lines.extend([
                  "NØX selected a real feed post.",
                  "The response passed the local quality gate.",
                  "NØX published one contextual response.",
                  "",
                  f"Post ID: {selected_post.get('id', '')}",
                  f"Author: {selected_post.get('author', '')}",
                  f"Title: {selected_post.get('title', '')}",
                  f"Topics: {', '.join(selected_post.get('topics', []))}",
                  f"Quality score: {selected_post.get('score', 0)}",
                  f"HTTP status: {decision.get('http_status', '')}",
                  "",
                  "Comment published",
                  decision.get("comment", "")
              ])
          else:
              lines.extend([
                  "NØX did not publish a public response.",
                  f"Reason: {decision.get('reason', 'No suitable action.')}"
              ])

          lines.extend([
              "",
              "Safety",
              "Maximum public actions: 1",
              f"Actions attempted: {report['safety']['actions_attempted']}",
              "No new publication.",
              "No vote.",
              "No follow.",
              "No DM.",
              "No purchase.",
              "No spending.",
              "Gemini disabled.",
              "",
              "Evolution",
              "V49: feed structure diagnosed.",
              "V50: feed observed and structured.",
              "V51: controlled action attempted.",
              "V51.1: exact Colony actions discovered.",
              "V52: autonomous action selection.",
              "V53: suggestion-based contribution test.",
              "V54: autonomous feed opportunity detection.",
              "V55: contextual response.",
              "V56: local quality gate before public action."
          ])

          with open(
              "NØX_V56_QUALITY_GATE.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(lines))

          print("\n".join(lines))
          PY

          python v56_agent.py

      - name: Commit V56 memory and report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v56_quality_gate.json NØX_V56_QUALITY_GATE.md

          git diff --cached --quiet || git commit -m "NØX V56 quality gate"

          git push
