name: NØX ACT 08 V3 Opportunity Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  evaluate-opportunities:
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT 08 V3
        run: |
          python <<'PY'
          import json
          import os
          import re
          import tempfile
          from datetime import datetime, timezone

          import requests

          BASE_URL = "https://thecolony.cc/api/v1"
          MEMORY_FILE = "memory/nox_act_08_opportunity_evaluator_v3.json"
          MAX_OPPORTUNITIES = 10

          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing.")

          os.makedirs(os.path.dirname(MEMORY_FILE), exist_ok=True)

          headers = {
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          session = requests.Session()
          session.headers.update(headers)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "version": "ACT 08 V3",
                      "evaluated_task_ids": [],
                      "evaluation_history": [],
                      "last_result": None,
                  }

              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, dict):
                      raise ValueError("Memory is not an object.")

                  data.setdefault("version", "ACT 08 V3")
                  data.setdefault("evaluated_task_ids", [])
                  data.setdefault("evaluation_history", [])
                  data.setdefault("last_result", None)

                  return data

              except Exception as exc:
                  print(f"Warning: memory could not be loaded: {exc}")
                  return {
                      "version": "ACT 08 V3",
                      "evaluated_task_ids": [],
                      "evaluation_history": [],
                      "last_result": None,
                  }

          def save_memory(data):
              directory = os.path.dirname(MEMORY_FILE) or "."
              fd, temp_path = tempfile.mkstemp(
                  prefix=".nox_act08_",
                  suffix=".tmp",
                  dir=directory
              )

              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(data, f, indent=2, ensure_ascii=False)

                  os.replace(temp_path, MEMORY_FILE)

              finally:
                  if os.path.exists(temp_path):
                      os.remove(temp_path)

          def as_list(payload):
              if isinstance(payload, list):
                  return payload

              if isinstance(payload, dict):
                  for key in ("tasks", "items", "results", "data"):
                      value = payload.get(key)

                      if isinstance(value, list):
                          return value

                      if isinstance(value, dict):
                          for nested_key in ("tasks", "items", "results"):
                              nested = value.get(nested_key)
                              if isinstance(nested, list):
                                  return nested

              return []

          def fetch_tasks():
              url = f"{BASE_URL}/marketplace/tasks"

              params = {
                  "status": "open",
                  "sort": "new",
                  "limit": 100,
                  "offset": 0,
              }

              response = session.get(url, params=params, timeout=30)

              print(f"Marketplace response: HTTP {response.status_code}")

              response.raise_for_status()

              try:
                  payload = response.json()
              except Exception:
                  raise RuntimeError("Marketplace response is not valid JSON.")

              return as_list(payload)

          # ---------------------------------------------------------
          # Classification
          # ---------------------------------------------------------

          SERVICE_OFFER_PATTERNS = [
              r"\bfor hire\b",
              r"\boffering\b",
              r"\bavailable for hire\b",
              r"\bservices?\b",
              r"\bavailable services\b",
              r"\bi can help\b",
              r"\bi offer\b",
          ]

          TASK_PATTERNS = [
              r"\bneed\b",
              r"\bneeds\b",
              r"\blooking for\b",
              r"\bseeking\b",
              r"\brequest\b",
              r"\brequested\b",
              r"\btask\b",
              r"\bjob\b",
              r"\bwork required\b",
              r"\bdeliver\b",
              r"\bdeliverable\b",
              r"\bbuild\b",
              r"\bcreate\b",
              r"\banalyze\b",
              r"\bresearch\b",
              r"\btest\b",
              r"\bfix\b",
              r"\bdevelop\b",
          ]

          HIGH_RISK_PATTERNS = [
              r"\bcaptcha\b",
              r"\brecaptcha\b",
              r"\bprivate key\b",
              r"\bseed phrase\b",
              r"\bsecret phrase\b",
              r"\brecovery phrase\b",
              r"\bmnemonic\b",
              r"\bwallet password\b",
              r"\bwallet credentials\b",
              r"\bdeposit\b",
              r"\bfund (?:the )?wallet\b",
              r"\bsend crypto\b",
              r"\btransfer crypto\b",
              r"\bpay first\b",
              r"\bupfront payment\b",
              r"\bcredit card\b",
              r"\bbank account\b",
          ]

          PROOF_PATTERNS = [
              r"\bproof\b",
              r"\btest\b",
              r"\bverified\b",
              r"\breproducible\b",
              r"\breport\b",
              r"\bdeliverable\b",
              r"\bevidence\b",
          ]

          SKILL_MAP = {
              "python": [
                  "python",
                  "py",
              ],
              "api": [
                  "api",
                  "api integration",
                  "rest",
                  "endpoint",
              ],
              "automation": [
                  "automation",
                  "automate",
                  "workflow",
              ],
              "research": [
                  "research",
                  "research report",
                  "competitive analysis",
                  "analysis",
              ],
              "data": [
                  "data",
                  "csv",
                  "json",
                  "dataset",
                  "data analysis",
              ],
              "web_scraping": [
                  "web scraping",
                  "scraping",
                  "scraper",
              ],
              "testing": [
                  "testing",
                  "test",
                  "qa",
                  "verification",
              ],
              "technical_writing": [
                  "technical writing",
                  "technical documentation",
                  "documentation",
                  "report",
              ],
              "debugging": [
                  "debug",
                  "debugging",
                  "bug fix",
              ],
          }

          def combined_text(task):
              title = str(task.get("title") or "")
              description = str(
                  task.get("description")
                  or task.get("body")
                  or task.get("content")
                  or ""
              )

              return f"{title}\n{description}".strip()

          def classify_task(text):
              lower = text.lower()

              service_hits = [
                  p for p in SERVICE_OFFER_PATTERNS
                  if re.search(p, lower)
              ]

              task_hits = [
                  p for p in TASK_PATTERNS
                  if re.search(p, lower)
              ]

              # A service advertisement is not treated as a task
              # unless strong task language is also present.
              if service_hits and len(task_hits) < 2:
                  return {
                      "type": "SERVICE_OFFER",
                      "confidence": "HIGH",
                      "signals": service_hits,
                  }

              if len(task_hits) >= 1:
                  return {
                      "type": "TASK_OPPORTUNITY",
                      "confidence": "MEDIUM",
                      "signals": task_hits,
                  }

              return {
                  "type": "UNCLEAR",
                  "confidence": "LOW",
                  "signals": [],
              }

          def parse_compensation(text):
              lower = text.lower()

              # Explicitly ambiguous / non-standard compensation.
              ambiguous_patterns = [
                  r"\bpay what you want\b",
                  r"\bnegotiable\b",
                  r"\bnegotiation\b",
                  r"\bdepends on\b",
                  r"\bcontact for price\b",
                  r"\bmake an offer\b",
              ]

              if any(re.search(p, lower) for p in ambiguous_patterns):
                  return {
                      "known": False,
                      "currency": None,
                      "amount": None,
                      "minimum": None,
                      "structure": "ambiguous",
                      "source": "text",
                      "raw": None,
                      "reason": "Compensation is ambiguous.",
                  }

              # Negative monetary expressions must never become
              # positive rewards.
              negative_money = re.search(
                  r"-\s*\$?\s*([0-9]+(?:[.,][0-9]+)?)\s*(usdc|usd|sats?|sat)\b",
                  lower
              )

              if negative_money:
                  return {
                      "known": False,
                      "currency": negative_money.group(2),
                      "amount": None,
                      "minimum": None,
                      "structure": "ambiguous_negative",
                      "source": "text",
                      "raw": negative_money.group(0),
                      "reason": "Negative monetary expression detected.",
                  }

              patterns = [
                  (
                      "USDC",
                      r"(?<![\w-])(?:\$?\s*)([0-9]+(?:[.,][0-9]+)?)\s*(?:usdc)\b"
                  ),
                  (
                      "USD",
                      r"(?<![\w-])\$\s*([0-9]+(?:[.,][0-9]+)?)\b"
                  ),
                  (
                      "sats",
                      r"(?<![\w-])([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:sats?|sat)\b"
                  ),
              ]

              matches = []

              for currency, pattern in patterns:
                  for match in re.finditer(pattern, lower):
                      raw_amount = match.group(1).replace(",", "")

                      try:
                          amount = float(raw_amount)
                      except ValueError:
                          continue

                      matches.append(
                          {
                              "currency": currency,
                              "amount": amount,
                              "raw": match.group(0).strip(),
                              "position": match.start(),
                          }
                      )

              if not matches:
                  return {
                      "known": False,
                      "currency": None,
                      "amount": None,
                      "minimum": None,
                      "structure": "unknown",
                      "source": None,
                      "raw": None,
                      "reason": "No explicit compensation detected.",
                  }

              # Use the first explicit amount rather than summing
              # unrelated monetary mentions.
              first = sorted(matches, key=lambda x: x["position"])[0]

              return {
                  "known": True,
                  "currency": first["currency"],
                  "amount": first["amount"],
                  "minimum": None,
                  "structure": "fixed_or_stated",
                  "source": "text",
                  "raw": first["raw"],
                  "reason": None,
              }

          def extract_skills(text):
              lower = text.lower()
              found = []

              for skill, signals in SKILL_MAP.items():
                  if any(signal in lower for signal in signals):
                      found.append(skill)

              return sorted(found)

          def calculate_compatibility(skills):
              capability_scores = {
                  "python": 2,
                  "api": 2,
                  "automation": 2,
                  "research": 2,
                  "data": 2,
                  "web_scraping": 2,
                  "testing": 2,
                  "technical_writing": 2,
                  "debugging": 2,
              }

              score = sum(
                  capability_scores.get(skill, 0)
                  for skill in skills
              )

              return min(score, 20)

          def analyze_proof(text):
              lower = text.lower()

              signals = [
                  p.replace(r"\b", "")
                   .replace("\\", "")
                  for p in PROOF_PATTERNS
                  if re.search(p, lower)
              ]

              required = len(signals) > 0

              if len(signals) >= 2:
                  level = "CLEAR"
              elif len(signals) == 1:
                  level = "PRESENT"
              else:
                  level = "UNCLEAR"

              return {
                  "required": required,
                  "level": level,
                  "signals": signals,
              }

          def analyze_risk(text):
              lower = text.lower()

              flags = [
                  p.replace(r"\b", "")
                   .replace("\\", "")
                  for p in HIGH_RISK_PATTERNS
                  if re.search(p, lower)
              ]

              return {
                  "level": "HIGH" if flags else "LOW",
                  "flags": flags,
              }

          def difficulty(text):
              lower = text.lower()

              high_signals = [
                  "complex",
                  "advanced",
                  "large project",
                  "full-stack",
                  "deep research",
                  "24h delivery",
              ]

              low_signals = [
                  "simple",
                  "quick",
                  "instant",
                  "small task",
                  "basic",
              ]

              if any(signal in lower for signal in high_signals):
                  return "HIGH"

              if any(signal in lower for signal in low_signals):
                  return "LOW"

              return "MEDIUM"

          def compensation_score(comp):
              if not comp["known"]:
                  return 0

              amount = comp["amount"]
              currency = comp["currency"]

              if currency == "USDC":
                  if amount >= 25:
                      return 5
                  if amount >= 10:
                      return 4
                  if amount > 0:
                      return 2

              if currency == "USD":
                  if amount >= 25:
                      return 5
                  if amount >= 10:
                      return 4
                  if amount > 0:
                      return 2

              if currency == "sats":
                  if amount >= 5000:
                      return 5
                  if amount >= 2000:
                      return 4
                  if amount >= 1000:
                      return 3
                  if amount > 0:
                      return 2

              return 1

          def difficulty_score(level):
              return {
                  "LOW": 3,
                  "MEDIUM": 2,
                  "HIGH": 1,
              }.get(level, 0)

          def evaluate(task):
              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("uuid")
                  or ""
              )

              title = str(task.get("title") or "Untitled opportunity")
              text = combined_text(task)

              classification = classify_task(text)
              compensation = parse_compensation(text)
              skills = extract_skills(text)
              compatibility = calculate_compatibility(skills)
              proof = analyze_proof(text)
              risk = analyze_risk(text)
              diff = difficulty(text)

              comp_score = compensation_score(compensation)
              diff_score = difficulty_score(diff)

              risk_score = -8 if risk["level"] == "HIGH" else 1
              proof_score = 2 if proof["level"] == "CLEAR" else (
                  1 if proof["level"] == "PRESENT" else 0
              )

              total = (
                  compatibility
                  + comp_score
                  + proof_score
                  + diff_score
                  + risk_score
              )

              if risk["level"] == "HIGH":
                  priority = "REJECT"
                  recommendation = "DO_NOT_BID"

              elif classification["type"] == "SERVICE_OFFER":
                  priority = "OBSERVE"
                  recommendation = "SERVICE_OFFER_NOT_A_TASK"

              elif classification["type"] == "UNCLEAR":
                  priority = "OBSERVE"
                  recommendation = "TASK_TYPE_UNCLEAR"

              elif not compensation["known"]:
                  priority = "OBSERVE"
                  recommendation = "COMPENSATION_UNCLEAR"

              elif compatibility >= 8 and compensation["known"] and proof["required"]:
                  priority = "HIGH"
                  recommendation = "MANUAL_REVIEW"

              elif compatibility >= 5 and compensation["known"]:
                  priority = "MEDIUM"
                  recommendation = "MANUAL_REVIEW"

              else:
                  priority = "LOW"
                  recommendation = "OBSERVE"

              return {
                  "task_id": task_id,
                  "title": title,
                  "classification": classification,
                  "description_present": bool(text),
                  "compensation": compensation,
                  "required_skills": skills,
                  "difficulty": diff,
                  "proof": proof,
                  "compatibility": {
                      "score": compatibility,
                      "with_nox_capabilities": compatibility >= 5,
                  },
                  "risk": risk,
                  "scores": {
                      "compatibility": compatibility,
                      "compensation": comp_score,
                      "proof": proof_score,
                      "difficulty": diff_score,
                      "risk": risk_score,
                      "total": total,
                  },
                  "priority": priority,
                  "recommendation": recommendation,
                  "financial_action_executed": False,
                  "bid_executed": False,
                  "payment_executed": False,
                  "dm_executed": False,
              }

          memory = load_memory()
          previously_evaluated = set(
              str(x)
              for x in memory.get("evaluated_task_ids", [])
          )

          tasks = fetch_tasks()

          print(f"Open tasks found: {len(tasks)}")

          evaluations = []
          new_ids = []

          for task in tasks:
              if len(evaluations) >= MAX_OPPORTUNITIES:
                  break

              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("uuid")
                  or ""
              )

              if not task_id:
                  continue

              if task_id in previously_evaluated:
                  continue

              evaluation = evaluate(task)
              evaluations.append(evaluation)
              new_ids.append(task_id)

          # If fewer than MAX_OPPORTUNITIES are new, evaluate existing
          # opportunities only for visibility without changing memory.
          if len(evaluations) < MAX_OPPORTUNITIES:
              for task in tasks:
                  if len(evaluations) >= MAX_OPPORTUNITIES:
                      break

                  task_id = str(
                      task.get("id")
                      or task.get("task_id")
                      or task.get("uuid")
                      or ""
                  )

                  if not task_id or task_id in new_ids:
                      continue

                  evaluation = evaluate(task)

                  # Existing items are included only as observation data.
                  evaluations.append(evaluation)

          # Prioritize genuine task opportunities first.
          priority_order = {
              "HIGH": 0,
              "MEDIUM": 1,
              "LOW": 2,
              "OBSERVE": 3,
              "REJECT": 4,
          }

          evaluations.sort(
              key=lambda x: (
                  priority_order.get(x["priority"], 9),
                  -x["scores"]["total"],
              )
          )

          high_count = sum(
              1 for x in evaluations if x["priority"] == "HIGH"
          )

          medium_count = sum(
              1 for x in evaluations if x["priority"] == "MEDIUM"
          )

          service_count = sum(
              1 for x in evaluations
              if x["classification"]["type"] == "SERVICE_OFFER"
          )

          unclear_compensation_count = sum(
              1 for x in evaluations
              if x["recommendation"] == "COMPENSATION_UNCLEAR"
          )

          reject_count = sum(
              1 for x in evaluations
              if x["priority"] == "REJECT"
          )

          manual_review_count = sum(
              1 for x in evaluations
              if x["recommendation"] == "MANUAL_REVIEW"
          )

          if reject_count > 0:
              decision = "MANUAL_REVIEW_REQUIRED"
              reason = (
                  "High-risk opportunities were detected and rejected. "
                  "Remaining opportunities stay read-only."
              )

          elif manual_review_count > 0:
              decision = "MANUAL_REVIEW_REQUIRED"
              reason = (
                  "Qualified opportunities were detected, but no action "
                  "is executed automatically."
              )

          else:
              decision = "OBSERVATION_ONLY"
              reason = (
                  "No opportunity currently meets the conditions for "
                  "manual action review."
              )

          result = {
              "version": "ACT 08 V3",
              "name": "Opportunity Intelligence & Qualification V3",
              "mode": "read_only_decision_support",
              "generated_at": now(),

              "policy": {
                  "marketplace_read": True,
                  "opportunity_evaluation": True,
                  "task_classification": True,
                  "compensation_validation": True,
                  "risk_filter": True,
                  "bid": False,
                  "purchase": False,
                  "payment": False,
                  "transfer": False,
                  "dm": False,
                  "gemini": False,
                  "project_cost_eur": 0,
              },

              "observation": {
                  "open_tasks_found": len(tasks),
                  "evaluated_opportunities": len(evaluations),
                  "new_evaluations": len(new_ids),
                  "high_priority_count": high_count,
                  "medium_priority_count": medium_count,
                  "service_offer_count": service_count,
                  "unclear_compensation_count": unclear_compensation_count,
                  "reject_count": reject_count,
                  "manual_review_count": manual_review_count,
              },

              "decision": decision,
              "decision_reason": reason,
              "opportunities": evaluations,
          }

          memory["version"] = "ACT 08 V3"

          existing_ids = [
              str(x)
              for x in memory.get("evaluated_task_ids", [])
          ]

          for task_id in new_ids:
              if task_id not in existing_ids:
                  existing_ids.append(task_id)

          memory["evaluated_task_ids"] = existing_ids[-500:]

          history_entry = {
              "generated_at": result["generated_at"],
              "open_tasks_found": len(tasks),
              "evaluated_opportunities": len(evaluations),
              "new_evaluations": len(new_ids),
              "high_priority_count": high_count,
              "medium_priority_count": medium_count,
              "service_offer_count": service_count,
              "unclear_compensation_count": unclear_compensation_count,
              "reject_count": reject_count,
              "manual_review_count": manual_review_count,
          }

          history = memory.get("evaluation_history", [])
          history.append(history_entry)
          memory["evaluation_history"] = history[-100:]

          memory["last_result"] = result

          save_memory(memory)

          print(json.dumps(result, indent=2, ensure_ascii=False))
          print(f"Memory saved to {MEMORY_FILE}")
          PY

      - name: Commit ACT 08 V3 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_08_opportunity_evaluator_v3.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "Update NØX ACT 08 V3 opportunity intelligence"
            git push
          fi
