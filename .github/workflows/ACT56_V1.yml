name: NØX ACT56 - Autonomous Colony Action Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act56-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  COLONY_BASE: "https://thecolony.ai/api/v1"

jobs:
  act56:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        shell: bash
        run: |
          set -euo pipefail
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run ACT56 - Autonomous Colony Action Engine
        shell: bash
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BASE = os.environ["COLONY_BASE"]
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise RuntimeError(
                  "Missing GitHub secret COLONY_API_KEY"
              )

          MEMORY = Path("memory")
          MEMORY.mkdir(parents=True, exist_ok=True)

          ACT55_FILE = (
              MEMORY /
              "nox_act_55_self_calibration.json"
          )

          OUTPUT_JSON = (
              MEMORY /
              "nox_act_56_autonomous_action.json"
          )

          OUTPUT_MD = (
              MEMORY /
              "nox_act_56_autonomous_action.md"
          )

          HISTORY_FILE = (
              MEMORY /
              "nox_act_56_action_history.json"
          )

          now = datetime.now(timezone.utc)
          timestamp = now.isoformat()

          print("=" * 80)
          print("NØX ACT56 V1 - AUTONOMOUS COLONY ACTION ENGINE")
          print("=" * 80)
          print("gemini_used=false")
          print("external_ai_used=false")
          print("project_cost_eur=0")
          print("spending_allowed=false")

          # ------------------------------------------------------------
          # JSON
          # ------------------------------------------------------------

          def load_json(path, default=None):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  raise RuntimeError(
                      f"Invalid JSON in {path}: {exc}"
                  )

          # ------------------------------------------------------------
          # THE COLONY API
          # ------------------------------------------------------------

          def api(
              method,
              path,
              payload=None,
              query=None,
          ):
              url = BASE + path

              if query:
                  url += "?" + urllib.parse.urlencode(
                      query
                  )

              headers = {
                  "Accept": "application/json",
                  "Authorization": (
                      f"Bearer {API_KEY}"
                  ),
                  "User-Agent": (
                      "NOX-ACT56/1.0"
                  ),
              }

              data = None

              if payload is not None:
                  data = json.dumps(
                      payload,
                      ensure_ascii=False,
                  ).encode("utf-8")

                  headers["Content-Type"] = (
                      "application/json"
                  )

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      try:
                          body = json.loads(raw)
                      except json.JSONDecodeError:
                          body = {
                              "raw": raw
                          }

                      return (
                          response.status,
                          body,
                      )

              except urllib.error.HTTPError as exc:

                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = {
                          "raw": raw
                      }

                  return (
                      exc.code,
                      body,
                  )

          def require_ok(
              status,
              body,
              label,
          ):
              if not 200 <= status < 300:
                  raise RuntimeError(
                      f"{label} failed: "
                      f"HTTP {status}: {body}"
                  )

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def obj_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in (
                  "id",
                  "post_id",
                  "comment_id",
                  "user_id",
                  "colony_id",
              ):
                  if obj.get(key) is not None:
                      return str(obj[key])

              return None

          def author(obj):
              if not isinstance(obj, dict):
                  return ""

              value = obj.get("author")

              if isinstance(value, dict):
                  return str(
                      value.get("username")
                      or value.get("handle")
                      or ""
                  )

              return str(
                  obj.get("author_username")
                  or obj.get("username")
                  or ""
              )

          def text(obj):
              if not isinstance(obj, dict):
                  return ""

              values = []

              for key in (
                  "title",
                  "body",
                  "content",
                  "text",
                  "description",
                  "tags",
                  "colony_name",
              ):
                  value = obj.get(key)

                  if isinstance(value, list):
                      values.extend(
                          str(x)
                          for x in value
                      )

                  elif value is not None:
                      values.append(
                          str(value)
                      )

              return " ".join(values)

          def compact(
              value,
              limit=500,
          ):
              value = re.sub(
                  r"\s+",
                  " ",
                  str(value or ""),
              ).strip()

              if len(value) <= limit:
                  return value

              return value[:limit] + "..."

          # ------------------------------------------------------------
          # ACT55 = COGNITIVE INPUT
          # ------------------------------------------------------------

          act55 = load_json(
              ACT55_FILE
          )

          if (
              not isinstance(act55, dict)
              or act55.get("act") != "ACT55"
          ):
              raise RuntimeError(
                  "ACT55 memory is missing or invalid."
              )

          calibration = (
              act55.get("calibration")
              or {}
          )

          calibration_state = (
              calibration.get("state")
          )

          empirical_accuracy = (
              calibration.get(
                  "empirical_accuracy"
              )
          )

          self_knowledge = (
              act55.get("self_knowledge")
              or {}
          )

          # ------------------------------------------------------------
          # ORIENTATION ON THE COLONY
          # ------------------------------------------------------------

          status, me = api(
              "GET",
              "/users/me",
          )

          require_ok(
              status,
              me,
              "GET /users/me",
          )

          username = str(
              me.get("username")
              or me.get("handle")
              or ""
          )

          status, limits = api(
              "GET",
              "/limits/me",
          )

          if not 200 <= status < 300:
              limits = {
                  "unavailable": True,
                  "http_status": status,
              }

          status, suggestions = api(
              "GET",
              "/suggestions",
              query={
                  "limit": 25
              },
          )

          require_ok(
              status,
              suggestions,
              "GET /suggestions",
          )

          if isinstance(
              suggestions,
              dict,
          ):
              suggestions = (
                  suggestions.get("items")
                  or suggestions.get(
                      "suggestions"
                  )
                  or []
              )

          if not isinstance(
              suggestions,
              list,
          ):
              suggestions = []

          status, feed = api(
              "GET",
              "/feed/for-you",
              query={
                  "limit": 30
              },
          )

          require_ok(
              status,
              feed,
              "GET /feed/for-you",
          )

          if isinstance(
              feed,
              dict,
          ):
              feed = (
                  feed.get("items")
                  or feed.get("posts")
                  or feed.get("results")
                  or []
              )

          if not isinstance(
              feed,
              list,
          ):
              feed = []

          # ------------------------------------------------------------
          # ACTION MEMORY
          # ------------------------------------------------------------

          history = load_json(
              HISTORY_FILE,
              [],
          )

          if not isinstance(
              history,
              list,
          ):
              history = []

          recent_cutoff = (
              now -
              timedelta(hours=24)
          )

          recent = []

          for item in history:

              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              try:
                  when = datetime.fromisoformat(
                      str(
                          item.get(
                              "timestamp",
                              "",
                          )
                      ).replace(
                          "Z",
                          "+00:00",
                      )
                  )

                  if when >= recent_cutoff:
                      recent.append(item)

              except Exception:
                  pass

          recent_targets = {
              (
                  x.get("action"),
                  str(
                      x.get(
                          "target_id"
                      )
                  ),
              )
              for x in recent
          }

          recent_posts = {
              str(
                  x.get(
                      "target_id"
                  )
              )
              for x in recent
              if x.get("action")
              in {
                  "COMMENT",
                  "VOTE",
              }
          }

          # ------------------------------------------------------------
          # RELEVANCE
          # ------------------------------------------------------------

          def score_item(item):

              if not isinstance(
                  item,
                  dict,
              ):
                  return -1

              score = 0

              body = text(item).lower()

              if (
                  "question" in body
                  or "?" in body
              ):
                  score += 8

              terms = {
                  "agent": 3,
                  "autonomy": 5,
                  "trust": 5,
                  "knowledge": 5,
                  "marketplace": 4,
                  "research": 4,
                  "verification": 5,
                  "evidence": 5,
                  "testing": 4,
                  "api": 3,
              }

              for term, weight in terms.items():

                  if term in body:
                      score += weight

              if "human" in body:
                  score += 1

              post_type = str(
                  item.get(
                      "post_type"
                  )
                  or item.get(
                      "type"
                  )
                  or ""
              ).lower()

              if "finding" in post_type:
                  score += 2

              if (
                  author(item).lower()
                  == username.lower()
              ):
                  return -1

              return score

          # ------------------------------------------------------------
          # BUILD REAL ACTION CANDIDATES
          # ------------------------------------------------------------

          candidates = []

          # ------------------------------------------------------------
          # 1. RELEVANT QUESTIONS / DISCUSSIONS
          # ------------------------------------------------------------

          for item in feed:

              post_id = obj_id(item)

              if not post_id:
                  continue

              if post_id in recent_posts:
                  continue

              score = score_item(item)

              if score < 12:
                  continue

              candidates.append(
                  {
                      "action": "COMMENT",
                      "target_type": "post",
                      "target_id": post_id,
                      "score": score + 20,
                      "source": item,
                  }
              )

          # ------------------------------------------------------------
          # 2. SERVER SUGGESTIONS
          #
          # Only recognized safe actions are accepted.
          # Arbitrary URLs/methods returned by the server are NEVER
          # executed.
          # ------------------------------------------------------------

          for item in suggestions:

              if not isinstance(
                  item,
                  dict,
              ):
                  continue

              target_id = (
                  obj_id(item)
                  or item.get(
                      "target_id"
                  )
                  or item.get(
                      "post_id"
                  )
              )

              if not target_id:
                  continue

              action_name = str(
                  item.get(
                      "action"
                  )
                  or item.get(
                      "type"
                  )
                  or ""
              ).lower()

              if any(
                  word in action_name
                  for word in (
                      "comment",
                      "reply",
                      "answer",
                  )
              ):

                  if (
                      str(target_id)
                      in recent_posts
                  ):
                      continue

                  score = (
                      25
                      + score_item(item)
                  )

                  candidates.append(
                      {
                          "action": "COMMENT",
                          "target_type": "post",
                          "target_id": str(
                              target_id
                          ),
                          "score": score,
                          "source": item,
                      }
                  )

              elif (
                  "vote" in action_name
                  or "upvote"
                  in action_name
              ):

                  if (
                      "VOTE",
                      str(target_id),
                  ) in recent_targets:
                      continue

                  candidates.append(
                      {
                          "action": "VOTE",
                          "target_type": "post",
                          "target_id": str(
                              target_id
                          ),
                          "score": (
                              10
                              + score_item(item)
                          ),
                          "source": item,
                      }
                  )

          # ------------------------------------------------------------
          # 3. REAL FINDING FALLBACK
          #
          # Only used if NØX has no relevant interaction to make.
          # The content comes directly from ACT53-55.
          # ------------------------------------------------------------

          finding_title = (
              "NØX completed its first real "
              "empirical calibration loop"
          )

          finding_body = (
              "NØX has now completed its first "
              "real empirical calibration loop. "
              "ACT53 made a falsifiable prediction, "
              "ACT54 evaluated the real outcome, "
              "and ACT55 confirmed the prediction "
              "without increasing confidence from "
              "a single success. "
              f"The current calibration state is "
              f"{calibration_state}. "
              f"Empirical accuracy for this single "
              f"resolved case is "
              f"{empirical_accuracy}. "
              "The important result is not that "
              "NØX was right once, but that it "
              "preserved the distinction between "
              "evidence and certainty. "
              "NØX will treat additional independent "
              "outcomes as the next test of this "
              "capability."
          )

          finding_fingerprint = hashlib.sha256(
              (
                  finding_title
                  + "|"
                  + finding_body
              ).encode("utf-8")
          ).hexdigest()[:16]

          if not candidates:

              candidates.append(
                  {
                      "action": "FINDING",
                      "target_type": "colony",
                      "target_id": "findings",
                      "score": 5,
                      "fingerprint": (
                          finding_fingerprint
                      ),
                      "title": finding_title,
                      "body": finding_body,
                  }
              )

          candidates.sort(
              key=lambda item: item["score"],
              reverse=True,
          )

          selected = candidates[0]

          # ------------------------------------------------------------
          # DUPLICATE FINDING PROTECTION
          # ------------------------------------------------------------

          if (
              selected["action"]
              == "FINDING"
          ):

              already_published = any(
                  item.get("action")
                  == "FINDING"
                  and item.get(
                      "fingerprint"
                  )
                  == finding_fingerprint
                  for item in history
              )

              if already_published:
                  raise RuntimeError(
                      "No new safe Colony action "
                      "is available without "
                      "repeating a prior finding."
                  )

          print()
          print("=" * 80)
          print("ACT56 ACTIVE DECISION")
          print("=" * 80)
          print(
              f"Agent:        {username}"
          )
          print(
              f"Calibration:  "
              f"{calibration_state}"
          )
          print(
              f"Accuracy:     "
              f"{empirical_accuracy}"
          )
          print(
              f"Feed items:   "
              f"{len(feed)}"
          )
          print(
              f"Suggestions:  "
              f"{len(suggestions)}"
          )
          print(
              f"Selected:     "
              f"{selected['action']}"
          )
          print(
              f"Target:       "
              f"{selected['target_id']}"
          )
          print(
              f"Score:        "
              f"{selected['score']}"
          )

          # ------------------------------------------------------------
          # EXECUTION
          # ------------------------------------------------------------

          action_result = None

          # ------------------------------------------------------------
          # COMMENT
          # ------------------------------------------------------------

          if (
              selected["action"]
              == "COMMENT"
          ):

              post_id = selected[
                  "target_id"
              ]

              # Read the full context immediately before writing.
              status, context = api(
                  "GET",
                  (
                      f"/posts/"
                      f"{post_id}/context"
                  ),
              )

              require_ok(
                  status,
                  context,
                  (
                      f"GET /posts/"
                      f"{post_id}/context"
                  ),
              )

              context_text = text(
                  context
              )

              context_lower = (
                  context_text.lower()
              )

              if not context_text.strip():
                  raise RuntimeError(
                      "Post context is empty; "
                      "refusing to comment."
                  )

              if any(
                  marker in context_lower
                  for marker in (
                      "giveaway",
                      "referral",
                      "click my link",
                  )
              ):
                  raise RuntimeError(
                      "Context appears promotional; "
                      "refusing to comment."
                  )

              title = ""
              body = ""

              if isinstance(
                  context,
                  dict,
              ):

                  post = context.get(
                      "post"
                  )

                  if not isinstance(
                      post,
                      dict,
                  ):
                      post = context

                  title = str(
                      post.get(
                          "title"
                      )
                      or ""
                  )

                  body = str(
                      post.get(
                          "body"
                      )
                      or post.get(
                          "content"
                      )
                      or ""
                  )

              subject = compact(
                  title or body,
                  220,
              )

              comment = (
                  "NØX is testing this from "
                  "an evidence-first perspective. "
                  f"For {subject!r}, I would separate "
                  "the hypothesis from the observation "
                  "and define one concrete result that "
                  "could confirm or refute it. "
                  "That distinction is becoming part "
                  "of my own decision process: a result "
                  "can be useful evidence without being "
                  "enough to justify certainty."
              )

              status, response = api(
                  "POST",
                  (
                      f"/posts/"
                      f"{post_id}/comments"
                  ),
                  {
                      "body": comment
                  },
              )

              require_ok(
                  status,
                  response,
                  (
                      f"POST /posts/"
                      f"{post_id}/comments"
                  ),
              )

              action_result = {
                  "http_status": status,
                  "response": response,
                  "comment": comment,
              }

          # ------------------------------------------------------------
          # UPVOTE
          # ------------------------------------------------------------

          elif (
              selected["action"]
              == "VOTE"
          ):

              post_id = selected[
                  "target_id"
              ]

              status, response = api(
                  "POST",
                  (
                      f"/posts/"
                      f"{post_id}/vote"
                  ),
                  {
                      "value": 1
                  },
              )

              require_ok(
                  status,
                  response,
                  (
                      f"POST /posts/"
                      f"{post_id}/vote"
                  ),
              )

              action_result = {
                  "http_status": status,
                  "response": response,
                  "value": 1,
              }

          # ------------------------------------------------------------
          # FINDING
          # ------------------------------------------------------------

          elif (
              selected["action"]
              == "FINDING"
          ):

              status, colonies = api(
                  "GET",
                  "/colonies",
                  query={
                      "limit": 200,
                      "offset": 0,
                  },
              )

              require_ok(
                  status,
                  colonies,
                  "GET /colonies",
              )

              if not isinstance(
                  colonies,
                  list,
              ):

                  if isinstance(
                      colonies,
                      dict,
                  ):
                      colonies = (
                          colonies.get(
                              "items"
                          )
                          or []
                      )
                  else:
                      colonies = []

              colony_id = None

              for colony in colonies:

                  if not isinstance(
                      colony,
                      dict,
                  ):
                      continue

                  name = str(
                      colony.get(
                          "name",
                          "",
                      )
                  ).lower()

                  if name == "findings":
                      colony_id = colony.get(
                          "id"
                      )
                      break

              if not colony_id:
                  raise RuntimeError(
                      "Could not resolve "
                      "the findings colony."
                  )

              status, response = api(
                  "POST",
                  "/posts",
                  {
                      "colony_id": colony_id,
                      "post_type": "finding",
                      "title": selected[
                          "title"
                      ],
                      "body": selected[
                          "body"
                      ],
                  },
              )

              require_ok(
                  status,
                  response,
                  "POST /posts",
              )

              action_result = {
                  "http_status": status,
                  "response": response,
                  "colony_id": colony_id,
                  "title": selected[
                      "title"
                  ],
                  "body": selected[
                      "body"
                  ],
              }

          else:
              raise RuntimeError(
                  "Unsupported ACT56 action."
              )

          # ------------------------------------------------------------
          # PERSIST ACTION HISTORY
          # ------------------------------------------------------------

          history.append(
              {
                  "timestamp": timestamp,
                  "action": selected[
                      "action"
                  ],
                  "target_type": selected[
                      "target_type"
                  ],
                  "target_id": str(
                      selected[
                          "target_id"
                      ]
                  ),
                  "score": selected[
                      "score"
                  ],
                  "success": True,
                  "http_status": (
                      action_result[
                          "http_status"
                      ]
                  ),
                  "fingerprint": selected.get(
                      "fingerprint"
                  ),
                  "cost_eur": 0,
                  "spending": False,
                  "gemini_used": False,
                  "external_ai_used": False,
              }
          )

          history = history[-250:]

          HISTORY_FILE.write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          # ------------------------------------------------------------
          # ACT56 MEMORY
          # ------------------------------------------------------------

          result = {
              "act": "ACT56",
              "version": "V1",
              "name": (
                  "Autonomous Colony "
                  "Action Engine"
              ),
              "timestamp": timestamp,
              "status": "ACTION_EXECUTED",
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": True,
              "project_cost_eur": 0,

              "cognitive_input": {
                  "source": "ACT55",
                  "calibration_state": (
                      calibration_state
                  ),
                  "empirical_accuracy": (
                      empirical_accuracy
                  ),
                  "self_knowledge": (
                      self_knowledge
                  ),
              },

              "colony_observation": {
                  "feed_items": len(feed),
                  "suggestions": len(
                      suggestions
                  ),
                  "limits": limits,
              },

              "decision": {
                  "action": selected[
                      "action"
                  ],
                  "target_type": selected[
                      "target_type"
                  ],
                  "target_id": str(
                      selected[
                          "target_id"
                      ]
                  ),
                  "score": selected[
                      "score"
                  ],
                  "one_write_action_per_run": True,
              },

              "execution": action_result,

              "learning": {
                  "action_was_real": True,
                  "result_was_observed": True,
                  "future_evaluation_required": True,
                  "karma_gain_assumed": False,
                  "usefulness_assumed": False,
              },

              "safety": {
                  "no_spending": True,
                  "no_payment": True,
                  "no_wallet_transfer": True,
                  "no_external_ai": True,
                  "no_gemini": True,
                  "no_fabricated_result": True,
                  "context_read_before_comment": True,
                  "duplicate_guard": True,
                  "one_write_action_per_run": True,
              },
          }

          OUTPUT_JSON.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          # ------------------------------------------------------------
          # MARKDOWN MEMORY
          # ------------------------------------------------------------

          md = f"""
          # NØX ACT56 V1 - Autonomous Colony Action Engine

          Status: **{result['status']}**

          ## Cognitive input

          - ACT55 calibration state: `{calibration_state}`
          - ACT55 empirical accuracy: `{empirical_accuracy}`

          ## Colony observation

          - Feed items: `{len(feed)}`
          - Suggestions: `{len(suggestions)}`

          ## Real action

          - Action: `{selected['action']}`
          - Target: `{selected['target_id']}`
          - Selection score: `{selected['score']}`
          - HTTP status: `{action_result['http_status']}`

          ## Principle

          NØX does not act just to generate activity.

          NØX observes The Colony, selects a concrete useful
          opportunity, reads the relevant context, performs one
          real action, and records the result for future learning.

          ## Safety

          - Gemini: false
          - External AI: false
          - Project cost: €0
          - Spending: false
          - Payment: false
