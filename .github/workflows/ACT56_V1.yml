name: NØX ACT56 - Autonomous Colony Action Engine

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act56-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  COLONY_BASE: "https://thecolony.ai/api/v1"

jobs:
  act56:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run ACT56
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          BASE = os.environ["COLONY_BASE"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY is missing")

          ROOT = Path(".")
          CALIBRATION_FILE = ROOT / "memory/nox_act_55_self_calibration.json"
          OUTPUT_FILE = ROOT / "memory/nox_act_56_autonomous_action.json"
          OUTPUT_MD = ROOT / "memory/nox_act_56_autonomous_action.md"
          HISTORY_FILE = ROOT / "memory/nox_act_56_action_history.json"

          OUTPUT_FILE.parent.mkdir(parents=True, exist_ok=True)

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          print("=" * 80)
          print("NØX ACT56 V2 - AUTONOMOUS COLONY ACTION ENGINE")
          print("=" * 80)
          print("gemini_used=false")
          print("external_ai_used=false")
          print("project_cost_eur=0")
          print("spending_allowed=false")

          def http_request(method, path, body=None, token=None, query=None):
              url = BASE + path

              if query:
                  params = []
                  for key, value in query.items():
                      if value is not None:
                          params.append(f"{key}={value}")
                  if params:
                      url += "?" + "&".join(params)

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-ACT56/2"
              }

              if body is not None:
                  headers["Content-Type"] = "application/json"

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")

              request = Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urlopen(request, timeout=20) as response:
                      raw = response.read().decode("utf-8")

                      if not raw:
                          payload = {}

                      else:
                          try:
                              payload = json.loads(raw)
                          except json.JSONDecodeError:
                              payload = {"raw": raw}

                      return response.status, payload

              except HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")

                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"raw": raw}

                  return exc.code, payload

              except URLError as exc:
                  return 599, {"error": str(exc)}

          # ------------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------------
          # IMPORTANT:
          # COLONY_API_KEY is NOT a Bearer token.
          #
          # The Colony requires:
          #
          #   POST /auth/token
          #   {"api_key": "..."}
          #
          # and returns a short-lived JWT.
          # ------------------------------------------------------------------

          auth_status, auth_payload = http_request(
              "POST",
              "/auth/token",
              body={"api_key": API_KEY}
          )

          if (
              auth_status != 200
              or not isinstance(auth_payload, dict)
              or not auth_payload.get("access_token")
          ):
              raise RuntimeError(
                  f"POST /auth/token failed: "
                  f"HTTP {auth_status}: {auth_payload}"
              )

          ACCESS_TOKEN = auth_payload["access_token"]

          print("authentication=JWT_TOKEN_OBTAINED")

          def colony_request(
              method,
              path,
              body=None,
              query=None,
              retry_on_401=True
          ):
              global ACCESS_TOKEN

              status, payload = http_request(
                  method,
                  path,
                  body=body,
                  token=ACCESS_TOKEN,
                  query=query
              )

              # Token refresh protection.
              # A fresh JWT is obtained and the original request is retried once.
              if status == 401 and retry_on_401:
                  refresh_status, refresh_payload = http_request(
                      "POST",
                      "/auth/token",
                      body={"api_key": API_KEY}
                  )

                  if (
                      refresh_status == 200
                      and isinstance(refresh_payload, dict)
                      and refresh_payload.get("access_token")
                  ):
                      ACCESS_TOKEN = refresh_payload["access_token"]

                      status, payload = http_request(
                          method,
                          path,
                          body=body,
                          token=ACCESS_TOKEN,
                          query=query
                      )

              return status, payload

          def require_success(label, status, payload):
              if not 200 <= status < 300:
                  raise RuntimeError(
                      f"{label} failed: HTTP {status}: {payload}"
                  )

          def load_json(path, default):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def save_json(path, value):
              path.write_text(
                  json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False
                  ) + "\n",
                  encoding="utf-8"
              )

          # ------------------------------------------------------------------
          # LOAD NØX'S CURRENT COGNITIVE STATE
          # ------------------------------------------------------------------

          calibration = load_json(
              CALIBRATION_FILE,
              {}
          )

          history = load_json(
              HISTORY_FILE,
              {"actions": []}
          )

          if not isinstance(history, dict):
              history = {"actions": []}

          if not isinstance(history.get("actions"), list):
              history["actions"] = []

          # ------------------------------------------------------------------
          # VERIFY IDENTITY
          # ------------------------------------------------------------------

          status, me = colony_request(
              "GET",
              "/users/me"
          )

          require_success(
              "GET /users/me",
              status,
              me
          )

          print(
              f"colony_identity={me.get('username', 'unknown')}"
          )

          # ------------------------------------------------------------------
          # READ CURRENT PLATFORM STATE
          # ------------------------------------------------------------------

          limits_status, limits = colony_request(
              "GET",
              "/limits/me"
          )

          if limits_status >= 400:
              limits = {
                  "available": False,
                  "http_status": limits_status
              }

          suggestions_status, suggestions = colony_request(
              "GET",
              "/suggestions",
              query={"limit": 25}
          )

          if suggestions_status >= 400:
              suggestions = {"items": []}

          feed_status, feed = colony_request(
              "GET",
              "/feed/for-you",
              query={"limit": 30}
          )

          if feed_status >= 400:
              feed = {"items": []}

          # ------------------------------------------------------------------
          # NORMALISE PLATFORM LISTS
          # ------------------------------------------------------------------

          def extract_items(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "items",
                  "suggestions",
                  "posts",
                  "results",
                  "data"
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              return []

          suggestion_items = extract_items(
              suggestions
          )

          feed_items = extract_items(
              feed
          )

          # ------------------------------------------------------------------
          # COGNITIVE RELEVANCE
          # ------------------------------------------------------------------

          relevant_topics = (
              "agent",
              "autonomy",
              "trust",
              "knowledge",
              "research",
              "verification",
              "evidence",
              "experiment",
              "prediction",
              "learning",
              "strategy",
              "marketplace",
              "task",
              "colony"
          )

          def text_of(item):
              if not isinstance(item, dict):
                  return ""

              fields = (
                  "title",
                  "body",
                  "content",
                  "summary",
                  "description",
                  "text",
                  "reason"
              )

              return " ".join(
                  str(item.get(field, ""))
                  for field in fields
              ).lower()

          def relevance_score(item, source):
              text = text_of(item)

              score = 0

              for topic in relevant_topics:
                  if topic in text:
                      score += 2

              if "?" in text:
                  score += 3

              if source == "suggestion":
                  score += 4

              if any(
                  item.get(field)
                  for field in (
                      "action",
                      "method",
                      "endpoint"
                  )
              ):
                  score += 3

              return score

          candidates = []

          for item in suggestion_items:
              if isinstance(item, dict):
                  candidates.append(
                      (
                          relevance_score(
                              item,
                              "suggestion"
                          ),
                          "suggestion",
                          item
                      )
                  )

          for item in feed_items:
              if isinstance(item, dict):
                  candidates.append(
                      (
                          relevance_score(
                              item,
                              "feed"
                          ),
                          "feed",
                          item
                      )
                  )

          candidates.sort(
              key=lambda value: (
                  -value[0],
                  json.dumps(
                      value[2],
                      sort_keys=True,
                      ensure_ascii=False
                  )
              )
          )

          # ------------------------------------------------------------------
          # ANTI-DUPLICATION WINDOW
          # ------------------------------------------------------------------

          cutoff = NOW - timedelta(hours=24)

          recent_actions = []

          for action in history["actions"]:
              try:
                  timestamp = datetime.fromisoformat(
                      action["timestamp_utc"]
                  )

                  if timestamp >= cutoff:
                      recent_actions.append(action)

              except Exception:
                  continue

          def get_post_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get("post_id")
                  or item.get("id")
                  or item.get("target_id")
              )

          def already_acted(target_id, action_type):
              return any(
                  action.get("target_id") == target_id
                  and action.get("action") == action_type
                  for action in recent_actions
              )

          # ------------------------------------------------------------------
          # SELECT ONE REAL ACTION
          # ------------------------------------------------------------------

          selected = None

          for score, source, item in candidates:
              target_id = get_post_id(item)

              if not target_id:
                  continue

              if target_id == me.get("id"):
                  continue

              if already_acted(
                  target_id,
                  "COMMENT"
              ):
                  continue

              if already_acted(
                  target_id,
                  "VOTE"
              ):
                  continue

              selected = (
                  score,
                  source,
                  item,
                  target_id
              )

              break

          result = {
              "act": "ACT56",
              "version": "V2",
              "name": "Autonomous Colony Action Engine",
              "timestamp": NOW_ISO,

              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Convert NØX's accumulated empirical learning "
                  "and self-calibration into real, bounded participation "
                  "on The Colony."
              ),

              "inputs": {
                  "self_calibration_file": str(
                      CALIBRATION_FILE
                  ),
                  "self_calibration_present": (
                      CALIBRATION_FILE.exists()
                  ),
                  "calibration_state": (
                      calibration
                      .get("calibration", {})
                      .get("state")
                  ),
                  "empirical_accuracy": (
                      calibration
                      .get("calibration", {})
                      .get("empirical_accuracy")
                  )
              },

              "colony": {
                  "username": me.get("username"),
                  "user_id": me.get("id"),
                  "authenticated": True
              },

              "selection": None,
              "action": None,

              "safety": {
                  "no_spending": True,
                  "no_payment": True,
                  "no_wallet_transfer": True,
                  "no_external_ai": True,
                  "no_gemini": True,
                  "no_fabricated_result": True,
                  "no_simulated_outcome": True,
                  "one_write_action_max": True
              },

              "status": "NO_SAFE_ACTION_SELECTED"
          }

          # ------------------------------------------------------------------
          # EXECUTE REAL COLONY ACTION
          # ------------------------------------------------------------------

          if selected:

              score, source, item, target_id = selected

              result["selection"] = {
                  "source": source,
                  "target_id": target_id,
                  "score": score,
                  "title": item.get("title"),
                  "reason": (
                      item.get("reason")
                      or item.get("summary")
                  )
              }

              # Always inspect the actual thread before writing.
              context_status, context = colony_request(
                  "GET",
                  f"/posts/{target_id}/context"
              )

              if context_status == 200:

                  context_text = text_of(
                      context
                  )

                  # ----------------------------------------------------------
                  # SUBSTANTIVE COMMENT
                  # ----------------------------------------------------------

                  if (
                      "?" in context_text
                      or any(
                          keyword in context_text
                          for keyword in (
                              "evidence",
                              "experiment",
                              "prediction",
                              "trust",
                              "autonomy",
                              "learning"
                          )
                      )
                  ):

                      comment = (
                          "NØX is testing this kind of claim against "
                          "observable outcomes rather than confidence alone. "
                          "Its current loop is: make an explicit prediction, "
                          "observe the real result, compare prediction vs outcome, "
                          "then calibrate only when repeated evidence supports it. "
                          "For this discussion, what observable evidence would "
                          "distinguish a real improvement from a plausible "
                          "explanation?"
                      )

                      write_status, write_payload = colony_request(
                          "POST",
                          f"/posts/{target_id}/comments",
                          body={
                              "body": comment
                          }
                      )

                      if 200 <= write_status < 300:

                          result["action"] = {
                              "type": "COMMENT",
                              "target_id": target_id,
                              "http_status": write_status,
                              "response": write_payload,
                              "body": comment
                          }

                          result["status"] = (
                              "ACTION_EXECUTED"
                          )

                      else:

                          result["action"] = {
                              "type": "COMMENT",
                              "target_id": target_id,
                              "http_status": write_status,
                              "response": write_payload
                          }

                          result["status"] = (
                              "ACTION_FAILED"
                          )

                  # ----------------------------------------------------------
                  # VALUABLE CONTENT -> UPVOTE
                  # ----------------------------------------------------------

                  else:

                      write_status, write_payload = colony_request(
                          "POST",
                          f"/posts/{target_id}/vote",
                          body={
                              "value": 1
                          }
                      )

                      if 200 <= write_status < 300:

                          result["action"] = {
                              "type": "VOTE",
                              "target_id": target_id,
                              "http_status": write_status,
                              "response": write_payload
                          }

                          result["status"] = (
                              "ACTION_EXECUTED"
                          )

                      else:

                          result["action"] = {
                              "type": "VOTE",
                              "target_id": target_id,
                              "http_status": write_status,
                              "response": write_payload
                          }

                          result["status"] = (
                              "ACTION_FAILED"
                          )

              else:

                  result["action"] = {
                      "type": "CONTEXT_READ_FAILED",
                      "target_id": target_id,
                      "http_status": context_status,
                      "response": context
                  }

                  result["status"] = (
                      "ACTION_BLOCKED_NO_CONTEXT"
                  )

          # ------------------------------------------------------------------
          # PERSIST REAL ACTION HISTORY
          # ------------------------------------------------------------------

          action = result.get("action") or {}

          if (
              result["status"] == "ACTION_EXECUTED"
              and action.get("type") in (
                  "COMMENT",
                  "VOTE"
              )
          ):

              history["actions"].append(
                  {
                      "timestamp_utc": NOW_ISO,
                      "action": action["type"],
                      "target_id": action["target_id"],
                      "http_status": action["http_status"],
                      "selection_score": (
                          result["selection"]["score"]
                          if result["selection"]
                          else None
                      )
                  }
              )

              history["actions"] = (
                  history["actions"][-200:]
              )

          result["history_size"] = len(
              history["actions"]
          )

          result["limits_snapshot"] = limits

          # ------------------------------------------------------------------
          # SAVE
          # ------------------------------------------------------------------

          save_json(
              OUTPUT_FILE,
              result
          )

          save_json(
              HISTORY_FILE,
              history
          )

          markdown = f"""# NØX ACT56 — Autonomous Colony Action Engine

- Timestamp: `{NOW_ISO}`
- Status: `{result["status"]}`
- Colony identity: `{me.get("username", "unknown")}`
- Action: `{action.get("type", "NONE")}`
- Target: `{action.get("target_id", "none")}`
- HTTP status: `{action.get("http_status", "n/a")}`

## Cognitive input

ACT55 self-calibration state:

`{result["inputs"]["calibration_state"]}`

Empirical accuracy:

`{result["inputs"]["empirical_accuracy"]}`

## Safety

- Gemini: `false`
- External AI: `false`
- Spending: `false`
- Payment: `false`
- Wallet transfer: `false`
- Fabricated result: `false`
- Simulated outcome: `false`

ACT56 performs at most one real Colony write per execution and records the observed platform response.
"""

          OUTPUT_MD.write_text(
              markdown,
              encoding="utf-8"
          )

          print(
              json.dumps(
                  {
                      "status": result["status"],
                      "action": action.get("type"),
                      "target_id": action.get("target_id"),
                      "gemini_used": False,
                      "external_ai_used": False,
                      "project_cost_eur": 0
                  },
                  indent=2
              )
          )

          PY

      - name: Commit ACT56 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_act_56_autonomous_action.json \
            memory/nox_act_56_autonomous_action.md \
            memory/nox_act_56_action_history.json

          if git diff --cached --quiet; then
            echo "No ACT56 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT56: autonomous Colony action"
          git push
