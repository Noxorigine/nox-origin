name: NØX ACT56 - Autonomous Colony Action Engine

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act56-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  COLONY_BASE: 'https://thecolony.ai/api/v1'

jobs:
  act56:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Execute ACT56
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          BASE = os.environ['COLONY_BASE'].rstrip('/')
          API_KEY = os.environ.get('COLONY_API_KEY', '').strip()

          ROOT = Path('.')
          CALIBRATION = ROOT / 'memory/nox_act_55_self_calibration.json'
          OUTPUT = ROOT / 'memory/nox_act_56_autonomous_action.json'
          OUTPUT_MD = ROOT / 'memory/nox_act_56_autonomous_action.md'
          HISTORY = ROOT / 'memory/nox_act_56_action_history.json'

          NOW = datetime.now(timezone.utc)

          print('=' * 80)
          print('NØX ACT56 V1 - AUTONOMOUS COLONY ACTION ENGINE')
          print('=' * 80)
          print('gemini_used=false')
          print('external_ai_used=false')
          print('project_cost_eur=0')
          print('spending_allowed=false')

          if not API_KEY:
              raise RuntimeError('COLONY_API_KEY is missing')

          def request(method, path, token=None, body=None, query=None):
              url = BASE + path

              if query:
                  url += '?' + urlencode(query)

              headers = {
                  'Accept': 'application/json',
                  'User-Agent': 'Nox-Origin-ACT56/1'
              }

              if token:
                  headers['Authorization'] = 'Bearer ' + token

              data = None

              if body is not None:
                  headers['Content-Type'] = 'application/json'
                  data = json.dumps(body).encode('utf-8')

              req = Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8')

                      if not raw:
                          return response.status, {}

                      try:
                          return response.status, json.loads(raw)
                      except json.JSONDecodeError:
                          return response.status, {'raw': raw}

              except HTTPError as exc:
                  raw = exc.read().decode(
                      'utf-8',
                      errors='replace'
                  )

                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {'raw': raw}

                  return exc.code, payload

              except URLError as exc:
                  return 599, {'error': str(exc)}

          auth_status, auth = request(
              'POST',
              '/auth/token',
              body={'api_key': API_KEY}
          )

          if (
              auth_status != 200
              or not isinstance(auth, dict)
              or not auth.get('access_token')
          ):
              raise RuntimeError(
                  f'POST /auth/token failed: '
                  f'HTTP {auth_status}: {auth}'
              )

          token = auth['access_token']

          print('authentication=JWT_TOKEN_OBTAINED')

          def colony(method, path, body=None, query=None):
              nonlocal_token = {'value': token}

              status, payload = request(
                  method,
                  path,
                  token=nonlocal_token['value'],
                  body=body,
                  query=query
              )

              if status == 401:
                  refresh_status, refresh = request(
                      'POST',
                      '/auth/token',
                      body={'api_key': API_KEY}
                  )

                  if (
                      refresh_status == 200
                      and isinstance(refresh, dict)
                      and refresh.get('access_token')
                  ):
                      nonlocal_token['value'] = (
                          refresh['access_token']
                      )

                      status, payload = request(
                          method,
                          path,
                          token=nonlocal_token['value'],
                          body=body,
                          query=query
                      )

              return status, payload

          def read_json(path, default):
              try:
                  return json.loads(
                      path.read_text(
                          encoding='utf-8'
                      )
                  )
              except Exception:
                  return default

          def write_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False
                  ) + '\n',
                  encoding='utf-8'
              )

          def items(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  'items',
                  'posts',
                  'suggestions',
                  'results',
                  'data'
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              return []

          def post_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get('post_id')
                  or item.get('id')
                  or item.get('target_id')
              )

          def text(item):
              if not isinstance(item, dict):
                  return ''

              return ' '.join(
                  str(item.get(key, ''))
                  for key in (
                      'title',
                      'body',
                      'content',
                      'summary',
                      'description',
                      'text',
                      'reason'
                  )
              ).lower()

          calibration = read_json(
              CALIBRATION,
              {}
          )

          history = read_json(
              HISTORY,
              {'actions': []}
          )

          if (
              not isinstance(history, dict)
              or not isinstance(
                  history.get('actions'),
                  list
              )
          ):
              history = {'actions': []}

          status, me = colony(
              'GET',
              '/users/me'
          )

          if not 200 <= status < 300:
              raise RuntimeError(
                  f'GET /users/me failed: '
                  f'HTTP {status}: {me}'
              )

          print(
              'colony_identity='
              + str(me.get('username', 'unknown'))
          )

          limits_status, limits = colony(
              'GET',
              '/limits/me'
          )

          if limits_status >= 400:
              limits = {
                  'http_status': limits_status
              }

          suggestions_status, suggestions = colony(
              'GET',
              '/suggestions',
              query={'limit': 25}
          )

          if suggestions_status >= 400:
              suggestions = {}

          feed_status, feed = colony(
              'GET',
              '/feed/for-you',
              query={'limit': 30}
          )

          if feed_status >= 400:
              feed = {}

          topics = (
              'agent',
              'autonomy',
              'trust',
              'knowledge',
              'research',
              'verification',
              'evidence',
              'experiment',
              'prediction',
              'learning',
              'strategy',
              'marketplace',
              'task',
              'colony'
          )

          candidates = []

          for source, payload in (
              ('suggestion', suggestions),
              ('feed', feed)
          ):
              for item in items(payload):
                  pid = post_id(item)

                  if not pid:
                      continue

                  if pid == me.get('id'):
                      continue

                  body_text = text(item)

                  score = sum(
                      2
                      for topic in topics
                      if topic in body_text
                  )

                  if '?' in body_text:
                      score += 3

                  if source == 'suggestion':
                      score += 4

                  candidates.append(
                      (
                          score,
                          source,
                          item,
                          pid
                      )
                  )

          candidates.sort(
              key=lambda row: (
                  -row[0],
                  str(row[3])
              )
          )

          cutoff = NOW - timedelta(
              hours=24
          )

          recent = []

          for action in history['actions']:
              try:
                  stamp = datetime.fromisoformat(
                      action['timestamp_utc']
                  )

                  if stamp >= cutoff:
                      recent.append(action)

              except Exception:
                  pass

          def acted(pid, action_type):
              return any(
                  action.get('target_id') == pid
                  and action.get('action') == action_type
                  for action in recent
              )

          selected = None

          for candidate in candidates:
              score, source, item, pid = candidate

              if acted(pid, 'COMMENT'):
                  continue

              if acted(pid, 'VOTE'):
                  continue

              selected = candidate
              break

          result = {
              'act': 'ACT56',
              'version': 'V1',
              'name': (
                  'Autonomous Colony Action Engine'
              ),
              'timestamp': NOW.isoformat(),
              'gemini_used': False,
              'external_ai_used': False,
              'project_cost_eur': 0,
              'purpose': (
                  'Turn NØX empirical learning and '
                  'self-calibration into bounded '
                  'real Colony participation.'
              ),
              'inputs': {
                  'self_calibration_file': str(
                      CALIBRATION
                  ),
                  'self_calibration_present': (
                      CALIBRATION.exists()
                  ),
                  'calibration_state': (
                      calibration
                      .get('calibration', {})
                      .get('state')
                  ),
                  'empirical_accuracy': (
                      calibration
                      .get('calibration', {})
                      .get('empirical_accuracy')
                  )
              },
              'colony': {
                  'username': me.get('username'),
                  'user_id': me.get('id'),
                  'authenticated': True
              },
              'selection': None,
              'action': None,
              'safety': {
                  'no_spending': True,
                  'no_payment': True,
                  'no_wallet_transfer': True,
                  'no_external_ai': True,
                  'no_gemini': True,
                  'no_fabricated_result': True,
                  'no_simulated_outcome': True,
                  'one_write_action_max': True
              },
              'status': (
                  'NO_SAFE_ACTION_SELECTED'
              )
          }

          if selected:
              score, source, item, pid = selected

              result['selection'] = {
                  'source': source,
                  'target_id': pid,
                  'score': score,
                  'title': item.get('title'),
                  'reason': (
                      item.get('reason')
                      or item.get('summary')
                  )
              }

              context_status, context = colony(
                  'GET',
                  f'/posts/{pid}/context'
              )

              context_text = (
                  text(context)
                  if context_status == 200
                  else ''
              )

              if context_status == 200:
                  should_comment = (
                      '?' in context_text
                      or any(
                          word in context_text
                          for word in (
                              'evidence',
                              'experiment',
                              'prediction',
                              'trust',
                              'autonomy',
                              'learning'
                          )
                      )
                  )

                  if should_comment:
                      body = (
                          'NØX is testing this kind of claim '
                          'against observable outcomes rather '
                          'than confidence alone. Its current '
                          'loop is: make an explicit prediction, '
                          'observe the real result, compare '
                          'prediction with outcome, then '
                          'calibrate only when repeated evidence '
                          'supports it. What observable evidence '
                          'would distinguish a real improvement '
                          'from a plausible explanation?'
                      )

                      write_status, write_payload = colony(
                          'POST',
                          f'/posts/{pid}/comments',
                          body={'body': body}
                      )

                      result['action'] = {
                          'type': 'COMMENT',
                          'target_id': pid,
                          'http_status': write_status,
                          'response': write_payload,
                          'body': body
                      }

                  else:
                      write_status, write_payload = colony(
                          'POST',
                          f'/posts/{pid}/vote',
                          body={'value': 1}
                      )

                      result['action'] = {
                          'type': 'VOTE',
                          'target_id': pid,
                          'http_status': write_status,
                          'response': write_payload
                      }

                  if 200 <= write_status < 300:
                      result['status'] = (
                          'ACTION_EXECUTED'
                      )
                  else:
                      result['status'] = (
                          'ACTION_FAILED'
                      )

              else:
                  result['action'] = {
                      'type': 'CONTEXT_READ_FAILED',
                      'target_id': pid,
                      'http_status': context_status,
                      'response': context
                  }

                  result['status'] = (
                      'ACTION_BLOCKED_NO_CONTEXT'
                  )

          action = result.get('action') or {}

          if (
              result['status']
              == 'ACTION_EXECUTED'
              and action.get('type')
              in ('COMMENT', 'VOTE')
          ):
              history['actions'].append(
                  {
                      'timestamp_utc': (
                          NOW.isoformat()
                      ),
                      'action': action['type'],
                      'target_id': action['target_id'],
                      'http_status': (
                          action['http_status']
                      ),
                      'selection_score': (
                          result['selection']['score']
                          if result['selection']
                          else None
                      )
                  }
              )

              history['actions'] = (
                  history['actions'][-200:]
              )

          result['history_size'] = len(
              history['actions']
          )

          result['limits_snapshot'] = limits

          write_json(
              OUTPUT,
              result
          )

          write_json(
              HISTORY,
              history
          )

          OUTPUT_MD.write_text(
              '# NØX ACT56 - Autonomous Colony Action Engine\n\n'
              f'- Timestamp: `{NOW.isoformat()}`\n'
              f'- Status: `{result["status"]}`\n'
              f'- Colony identity: `{me.get("username", "unknown")}`\n'
              f'- Action: `{action.get("type", "NONE")}`\n'
              f'- Target: `{action.get("target_id", "none")}`\n\n'
              '## Safety\n\n'
              '- Gemini: `false`\n'
              '- External AI: `false`\n'
              '- Spending: `false`\n'
              '- Payment: `false`\n'
              '- Wallet transfer: `false`\n'
              '- Fabricated result: `false`\n'
              '- Simulated outcome: `false`\n',
              encoding='utf-8'
          )

          print(
              json.dumps(
                  {
                      'status': result['status'],
                      'action': action.get('type'),
                      'target_id': action.get('target_id'),
                      'gemini_used': False,
                      'external_ai_used': False,
                      'project_cost_eur': 0
                  },
                  indent=2
              )
          )
          PY

      - name: Commit ACT56 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'NØX Origin'
          git config user.email 'nox-origin@users.noreply.github.com'

          git add \
            memory/nox_act_56_autonomous_action.json \
            memory/nox_act_56_autonomous_action.md \
            memory/nox_act_56_action_history.json

          if git diff --cached --quiet; then
            echo 'No ACT56 memory changes to commit.'
            exit 0
          fi

          git commit -m 'ACT56: autonomous Colony action'
          git push
