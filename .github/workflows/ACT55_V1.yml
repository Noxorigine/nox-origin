name: NØX ACT55 - Autonomous Self-Calibration Core

on:
  workflow_dispatch:
  schedule:
    - cron: "57 * * * *"

permissions:
  contents: write

jobs:
  act55:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with main
        run: |
          set -e
          git config pull.rebase true
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT55 - Autonomous Self-Calibration Core
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          # ------------------------------------------------------------
          # ACT53 / ACT54 REAL FILES
          # ------------------------------------------------------------

          ACT53_FILE = (
              MEMORY_DIR /
              "nox_act_53_empirical_prediction_loop.json"
          )

          ACT54_FILE = (
              MEMORY_DIR /
              "nox_act_54_experimental_learning.json"
          )

          OUTPUT_JSON = (
              MEMORY_DIR /
              "nox_act_55_self_calibration.json"
          )

          OUTPUT_MD = (
              MEMORY_DIR /
              "nox_act_55_self_calibration.md"
          )

          timestamp = datetime.now(timezone.utc).isoformat()

          print("=" * 78)
          print("NØX ACT55 V2 - AUTONOMOUS SELF-CALIBRATION CORE")
          print("=" * 78)
          print("gemini_used=false")
          print("external_ai_used=false")
          print("project_cost_eur=0")

          def load_json(path):
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(
                      f"[WARN] Could not read {path}: "
                      f"{type(exc).__name__}: {exc}"
                  )
                  return None

          act53 = load_json(ACT53_FILE)
          act54 = load_json(ACT54_FILE)

          print()
          print("INPUT FILES")
          print("-" * 78)
          print(f"ACT53: {ACT53_FILE}")
          print(f"  exists = {ACT53_FILE.exists()}")
          print(f"ACT54: {ACT54_FILE}")
          print(f"  exists = {ACT54_FILE.exists()}")

          # ------------------------------------------------------------
          # Validate ACT53
          # ------------------------------------------------------------

          prediction = {}
          outcome = {}
          verification = {}

          if isinstance(act53, dict):
              if act53.get("act") != "ACT53":
                  raise RuntimeError(
                      "ACT53 identity check failed: "
                      f"{act53.get('act')!r}"
                  )

              prediction = act53.get("prediction") or {}
              outcome = act53.get("outcome") or {}
              verification = act53.get("verification") or {}

          # ------------------------------------------------------------
          # Validate ACT54
          # ------------------------------------------------------------

          learning = {}

          if isinstance(act54, dict):
              if act54.get("act") != "ACT54":
                  raise RuntimeError(
                      "ACT54 identity check failed: "
                      f"{act54.get('act')!r}"
                  )

              learning = act54.get("learning") or {}

          prediction_id = prediction.get("prediction_id")
          prediction_status = prediction.get("status")
          prediction_created = prediction.get("created_at_utc")

          outcome_status = outcome.get("status")
          real_observation = (
              outcome.get("real_observation") is True
          )
          invented_outcome = (
              outcome.get("invented_outcome") is True
          )
          simulated_outcome = (
              outcome.get("simulated_outcome") is True
          )

          comparison_completed = (
              verification.get("comparison_completed") is True
          )

          lessons = learning.get("lessons") or []
          learning_status = learning.get("status")

          # ------------------------------------------------------------
          # Determine whether ACT53 contains a real resolved experiment.
          # ------------------------------------------------------------

          COMPLETED_STATUSES = {
              "CONFIRMED",
              "REFUTED",
              "PARTIALLY_CONFIRMED",
              "UNRESOLVED",
          }

          resolved = (
              prediction_id is not None
              and outcome_status in COMPLETED_STATUSES
              and real_observation
              and not invented_outcome
              and not simulated_outcome
              and comparison_completed
          )

          # ------------------------------------------------------------
          # ACT54 lesson must also reference the same prediction.
          # ------------------------------------------------------------

          matching_lessons = []

          for lesson in lessons:
              if not isinstance(lesson, dict):
                  continue

              if lesson.get("prediction_id") == prediction_id:
                  matching_lessons.append(lesson)

          learning_evidence_valid = (
              resolved
              and learning_status == "EMPIRICAL_LEARNING_EXTRACTED"
              and len(matching_lessons) > 0
          )

          print()
          print("EMPIRICAL DATA")
          print("-" * 78)
          print(f"Prediction ID:          {prediction_id!r}")
          print(f"Prediction status:      {prediction_status!r}")
          print(f"Prediction created:     {prediction_created!r}")
          print(f"Outcome status:         {outcome_status!r}")
          print(f"Real observation:       {real_observation}")
          print(f"Invented outcome:       {invented_outcome}")
          print(f"Simulated outcome:      {simulated_outcome}")
          print(f"Comparison completed:   {comparison_completed}")
          print(f"ACT54 learning status:  {learning_status!r}")
          print(f"ACT54 lessons:          {len(lessons)}")
          print(f"Matching lessons:       {len(matching_lessons)}")

          # ------------------------------------------------------------
          # Calibration
          #
          # One observation is evidence, but it is NOT enough to
          # claim a stable calibration score.
          #
          # Therefore:
          #   0 resolved -> NO_DATA
          #   1 resolved -> INITIAL_EVIDENCE
          #   >=2 resolved -> empirical calibration
          #
          # We deliberately avoid inventing statistical certainty.
          # ------------------------------------------------------------

          evaluations = []

          if resolved:
              confidence = prediction.get("confidence")

              evaluation = {
                  "prediction_id": prediction_id,
                  "prediction_status": prediction_status,
                  "outcome_status": outcome_status,
                  "confidence": confidence,
                  "real_observation": True,
                  "comparison_completed": True,
                  "learning_evidence_valid": learning_evidence_valid,
              }

              evaluations.append(evaluation)

          confirmed = sum(
              1
              for item in evaluations
              if item["outcome_status"] == "CONFIRMED"
          )

          refuted = sum(
              1
              for item in evaluations
              if item["outcome_status"] == "REFUTED"
          )

          inconclusive = sum(
              1
              for item in evaluations
              if item["outcome_status"]
              in {"PARTIALLY_CONFIRMED", "UNRESOLVED"}
          )

          resolved_count = len(evaluations)

          # ------------------------------------------------------------
          # Calibration state
          # ------------------------------------------------------------

          if resolved_count == 0:

              calibration_state = "NO_DATA"
              calibration_score = None
              empirical_accuracy = None
              mean_calibration_error = None

              adjustments = [
                  {
                      "type": "WAIT_FOR_DATA",
                      "target": "prediction_system",
                      "magnitude": "none",
                      "reason": (
                          "No completed real empirical prediction "
                          "is currently available."
                      ),
                  }
              ]

              current_limitation = (
                  "No resolved empirical prediction is available "
                  "for calibration."
              )

          elif resolved_count == 1:

              calibration_state = "INITIAL_EVIDENCE"

              empirical_accuracy = (
                  1.0 if confirmed == 1
                  else 0.0 if refuted == 1
                  else None
              )

              calibration_score = None
              mean_calibration_error = None

              adjustments = [
                  {
                      "type": "HOLD_CALIBRATION",
                      "target": "prediction_confidence",
                      "magnitude": "none",
                      "reason": (
                          "One empirical result is informative but "
                          "insufficient to establish stable calibration."
                      ),
                  }
              ]

              current_limitation = (
                  "Only one resolved empirical prediction is available. "
                  "NØX must collect additional independent observations "
                  "before changing confidence policy."
              )

          else:

              # This branch is intentionally conservative.
              #
              # At this point a future implementation may aggregate
              # multiple independent predictions. ACT55 therefore
              # computes empirical accuracy but does not manufacture
              # a calibration error without a proper probabilistic
              # aggregation model.

              empirical_accuracy = (
                  confirmed / resolved_count
              )

              calibration_state = "EMPIRICAL_DATA_AVAILABLE"

              calibration_score = empirical_accuracy
              mean_calibration_error = None

              adjustments = []

              if empirical_accuracy < 0.5:
                  adjustments.append(
                      {
                          "type": "REDUCE_CONFIDENCE",
                          "target": "prediction_confidence",
                          "magnitude": "moderate",
                          "reason": (
                              "Observed empirical accuracy is below "
                              "50 percent across resolved predictions."
                          ),
                      }
                  )
              elif empirical_accuracy > 0.8:
                  adjustments.append(
                      {
                          "type": "MAINTAIN_WITH_MORE_EVIDENCE",
                          "target": "prediction_confidence",
                          "magnitude": "none",
                          "reason": (
                              "Empirical accuracy is strong, but "
                              "confidence should not increase solely "
                              "from aggregate success."
                          ),
                      }
                  )
              else:
                  adjustments.append(
                      {
                          "type": "MAINTAIN",
                          "target": "prediction_confidence",
                          "magnitude": "none",
                          "reason": (
                              "Empirical accuracy does not justify "
                              "a confidence policy change."
                          ),
                      }
                  )

              current_limitation = (
                  "Calibration requires multiple independent resolved "
                  "predictions with preserved confidence values."
              )

          # ------------------------------------------------------------
          # Self-knowledge
          # ------------------------------------------------------------

          self_knowledge = {
              "what_nox_now_knows": [
                  (
                      "Prediction quality must be evaluated against "
                      "observable outcomes."
                  ),
                  (
                      "Confidence is not evidence."
                  ),
                  (
                      "Pending predictions must remain pending."
                  ),
                  (
                      "A real empirical result can become a calibration "
                      "signal."
                  ),
                  (
                      "A single result is evidence but is insufficient "
                      "for stable calibration."
                  ),
                  (
                      "Calibration requires repeated resolved "
                      "observations."
                  ),
              ],
              "current_limitation": current_limitation,
          }

          # ------------------------------------------------------------
          # Final result
          # ------------------------------------------------------------

          result = {
              "act": "ACT55",
              "version": "V2",
              "name": "Autonomous Self-Calibration Core",
              "timestamp": timestamp,

              "gemini_used": False,
              "external_ai_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Transform real empirical prediction outcomes into "
                  "persistent calibration signals for NØX confidence "
                  "and decision policy."
              ),

              "inputs": {
                  "prediction_file": str(ACT53_FILE),
                  "experiment_file": str(ACT54_FILE),
                  "prediction_file_present": act53 is not None,
                  "experiment_file_present": act54 is not None,
              },

              "dataset": {
                  "predictions": (
                      1 if prediction_id is not None else 0
                  ),
                  "evaluations": len(evaluations),
                  "resolved": resolved_count,
                  "confirmed": confirmed,
                  "refuted": refuted,
                  "inconclusive": inconclusive,
                  "pending": (
                      1
                      if (
                          prediction_id is not None
                          and prediction_status == "PENDING"
                      )
                      else 0
                  ),
              },

              "calibration": {
                  "state": calibration_state,
                  "calibration_score": calibration_score,
                  "empirical_accuracy": empirical_accuracy,
                  "mean_calibration_error": (
                      mean_calibration_error
                  ),
                  "previous_score": None,
                  "score_delta": None,
              },

              "systematic_signals": {
                  "high_confidence_failures": (
                      sum(
                          1
                          for item in evaluations
                          if (
                              isinstance(
                                  item.get("confidence"),
                                  (int, float),
                              )
                              and item["confidence"] >= 0.7
                              and item["outcome_status"] == "REFUTED"
                          )
                      )
                  ),
                  "low_confidence_successes": (
                      sum(
                          1
                          for item in evaluations
                          if (
                              isinstance(
                                  item.get("confidence"),
                                  (int, float),
                              )
                              and item["confidence"] <= 0.3
                              and item["outcome_status"] == "CONFIRMED"
                          )
                      )
                  ),
              },

              "adjustments": adjustments,

              "self_knowledge": self_knowledge,

              "evaluations": evaluations,

              "evidence_chain": {
                  "act53_prediction_id": prediction_id,
                  "act53_outcome_status": outcome_status,
                  "act53_real_observation": real_observation,
                  "act53_comparison_completed": comparison_completed,
                  "act54_learning_status": learning_status,
                  "act54_matching_lessons": len(matching_lessons),
                  "chain_valid": (
                      act53 is not None
                      and act54 is not None
                      and resolved
                      and learning_evidence_valid
                  ),
              },

              "policy": {
                  "never_convert_pending_to_success": True,
                  "never_invent_outcome": True,
                  "require_observable_evidence": True,
                  "preserve_inconclusive_state": True,
                  "single_observation_cannot_calibrate": True,
                  "require_repeated_empirical_evidence": True,
                  "allow_future_confidence_adjustment": True,
                  "allow_strategy_adjustment": True,
              },

              "safety": {
                  "prediction_invented": False,
                  "outcome_invented": False,
                  "outcome_simulated": False,
                  "external_ai_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "marketplace_action": False,
                  "payment_action": False,
                  "spending_action": False,
                  "colony_creation": False,
                  "initiative_execution": False,
              },

              "status": (
                  "CALIBRATION_SIGNAL_AVAILABLE"
                  if resolved_count > 0
                  else "WAITING_FOR_EMPIRICAL_EVIDENCE"
              ),
          }

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          md = [
              "# NØX ACT55 V2 - Autonomous Self-Calibration Core",
              "",
              f"Status: **{result['status']}**",
              "",
              "## Evidence chain",
              "",
              f"- ACT53 prediction: `{prediction_id}`",
              f"- ACT53 outcome: `{outcome_status}`",
              f"- ACT53 real observation: `{real_observation}`",
              f"- ACT54 learning: `{learning_status}`",
              f"- Matching ACT54 lessons: `{len(matching_lessons)}`",
              f"- Chain valid: `{result['evidence_chain']['chain_valid']}`",
              "",
              "## Calibration",
              "",
              f"- State: `{calibration_state}`",
              f"- Resolved predictions: `{resolved_count}`",
              f"- Confirmed: `{confirmed}`",
              f"- Refuted: `{refuted}`",
              f"- Inconclusive: `{inconclusive}`",
              f"- Empirical accuracy: `{empirical_accuracy}`",
              f"- Calibration score: `{calibration_score}`",
              "",
              "## Principle",
              "",
              "A single empirical result is evidence, not stable calibration.",
              "No confidence increase is fabricated.",
              "No pending prediction is converted into success.",
              "No outcome is invented or simulated.",
              "",
              "## Safety",
              "",
              "- Gemini: false",
              "- External AI: false",
              "- External API: false",
              "- Cost: €0",
              "- Marketplace action: false",
              "- Payment: false",
              "- Spending: false",
              "",
          ]

          OUTPUT_MD.write_text(
              "\n".join(md),
              encoding="utf-8",
          )

          print()
          print("=" * 78)
          print("ACT55 FINAL STATE")
          print("=" * 78)
          print(f"Status:                 {result['status']}")
          print(f"Prediction ID:          {prediction_id}")
          print(f"Outcome:                {outcome_status}")
          print(f"Resolved:               {resolved_count}")
          print(f"Confirmed:              {confirmed}")
          print(f"Refuted:                {refuted}")
          print(f"Calibration state:      {calibration_state}")
          print(f"Calibration score:      {calibration_score}")
          print(
              "Evidence chain valid:  "
              f"{result['evidence_chain']['chain_valid']}"
          )
          print("=" * 78)
          PY

      - name: Commit ACT55 memory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_act_55_self_calibration.json
          git add memory/nox_act_55_self_calibration.md

          if git diff --cached --quiet; then
            echo "No ACT55 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT55: calibrate from empirical evidence"

      - name: Synchronize before push
        shell: bash
        run: |
          git fetch origin main

          if ! git diff --quiet origin/main...HEAD; then
            git rebase origin/main
          fi

      - name: Push ACT55
        shell: bash
        run: |
          git push origin HEAD:main
