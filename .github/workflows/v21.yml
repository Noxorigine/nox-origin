name: NØX Origin - V21 Memory Consolidation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-consolidation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consolidate NØX memory
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if MEMORY_FILE.exists():
              try:
                  memory = json.loads(MEMORY_FILE.read_text(encoding="utf-8"))
              except Exception:
                  memory = {}
          else:
              memory = {}

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          history = memory.get("history", [])

          # ---------------------------------------------------------
          # 1. Normalisation
          # ---------------------------------------------------------
          def clean(text):
              return re.sub(r"\s+", " ", str(text).strip().lower())

          # ---------------------------------------------------------
          # 2. Détection locale des concepts
          # ---------------------------------------------------------
          concepts = {
              "memory": [
                  "memory", "context", "cache", "state", "history",
                  "kv cache", "storage", "retrieval"
              ],
              "efficiency": [
                  "efficiency", "latency", "compute", "resource",
                  "performance", "cost", "optimization", "tokens"
              ],
              "verification": [
                  "verification", "verify", "validation", "evidence",
                  "replication", "uncertainty", "benchmark", "guard"
              ],
              "autonomy": [
                  "autonomy", "agent", "workflow", "permission",
                  "capability", "access", "independent"
              ],
              "security": [
                  "security", "trust", "attack", "protocol",
                  "encryption", "integrity", "risk"
              ],
              "learning": [
                  "learning", "learn", "training", "reward",
                  "trajectory", "feedback", "data"
              ]
          }

          scores = {topic: 0 for topic in concepts}

          for obs in observations:
              text = clean(obs.get("text", ""))
              for topic, words in concepts.items():
                  scores[topic] += sum(
                      1 for word in words
                      if word in text
                  )

          now = datetime.now(timezone.utc).isoformat()

          # ---------------------------------------------------------
          # 3. Mise à jour des patterns
          # ---------------------------------------------------------
          new_patterns = []

          for topic, score in scores.items():
              if score <= 0:
                  continue

              existing = next(
                  (p for p in patterns if p.get("topic") == topic),
                  None
              )

              if existing:
                  existing["signal_count"] = max(
                      existing.get("signal_count", 0),
                      score
                  )
                  existing["updated_at"] = now
              else:
                  new_patterns.append({
                      "topic": topic,
                      "signal_count": score,
                      "detected_at": now,
                      "method": "local_keyword_pattern_detection_v21"
                  })

          patterns.extend(new_patterns)

          # ---------------------------------------------------------
          # 4. Connaissances consolidées
          # ---------------------------------------------------------
          knowledge_map = {
              "memory":
                  "Memory and state management are recurring constraints that shape practical agent architecture.",

              "efficiency":
                  "Compute, latency and resource efficiency are central constraints on autonomous agent systems.",

              "verification":
                  "Reliable verification, evidence and uncertainty handling are essential for trustworthy autonomous behavior.",

              "autonomy":
                  "Agent autonomy depends on useful capabilities, permissions, workflows and access to the right state.",

              "security":
                  "Security depends on explicit trust boundaries, protocol integrity and controlled access.",

              "learning":
                  "Learning quality depends on useful data, feedback, successful trajectories and reliable evaluation."
          }

          for topic, score in scores.items():
              if score <= 0:
                  continue

              statement = knowledge_map[topic]

              if statement not in knowledge:
                  knowledge.append(statement)

          # ---------------------------------------------------------
          # 5. Déduplication de la mémoire
          # ---------------------------------------------------------
          unique_knowledge = []
          seen = set()

          for item in knowledge:
              key = clean(item)
              if key and key not in seen:
                  seen.add(key)
                  unique_knowledge.append(item)

          knowledge = unique_knowledge

          # ---------------------------------------------------------
          # 6. Construction de principes émergents
          # ---------------------------------------------------------
          principles = []

          if scores["verification"] > 0 and scores["security"] > 0:
              principles.append(
                  "Trust should be based on verification rather than assumption."
              )

          if scores["memory"] > 0 and scores["efficiency"] > 0:
              principles.append(
                  "Effective memory must balance retained context against computational cost."
              )

          if scores["autonomy"] > 0 and scores["security"] > 0:
              principles.append(
                  "Autonomy requires capabilities to be paired with explicit boundaries."
              )

          if scores["learning"] > 0 and scores["verification"] > 0:
              principles.append(
                  "Learning should preserve successful evidence while continuously testing its reliability."
              )

          principles = list(dict.fromkeys(principles))

          # ---------------------------------------------------------
          # 7. Historique V21
          # ---------------------------------------------------------
          history.append({
              "version": "V21",
              "timestamp": now,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_memory_consolidation"
          })

          # ---------------------------------------------------------
          # 8. Sauvegarde
          # ---------------------------------------------------------
          memory["version"] = "V21"
          memory["updated_at"] = now
          memory["patterns"] = patterns
          memory["knowledge"] = knowledge
          memory["principles"] = principles
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("==========================================")
          print("NØX ORIGIN - V21")
          print("==========================================")
          print(f"Observations : {len(observations)}")
          print(f"Patterns     : {len(patterns)}")
          print(f"Knowledge    : {len(knowledge)}")
          print(f"Principles   : {len(principles)}")
          print("Gemini       : NON REQUIS")
          print("Cost         : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V21 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V21 memory consolidation"

          git push
