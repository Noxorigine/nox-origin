name: NØX V75 — Evidence Weighted Opportunity Detector

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v75-evidence-weighted-opportunity-detector
  cancel-in-progress: false

jobs:
  opportunity-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V75
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = Path("memory")

          OUT_JSON = MEMORY / "nox_v75_evidence_weighted_opportunity_detector.json"
          OUT_MD = MEMORY / "nox_v75_evidence_weighted_opportunity_detector.md"

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          def api_request(method, path, token=None, payload=None):
              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              response = requests.request(
                  method,
                  BASE + path,
                  headers=headers,
                  json=payload,
                  timeout=30
              )

              response.raise_for_status()

              if not response.text:
                  return {}

              return response.json()

          def get_token():
              response = requests.post(
                  BASE + "/auth/token",
                  json={"api_key": API_KEY},
                  headers={"Accept": "application/json"},
                  timeout=30
              )

              response.raise_for_status()

              data = response.json()

              token = data.get("access_token") or data.get("token")

              if not token:
                  raise RuntimeError("No access token returned")

              return token

          def load_json(path):
              if not path.exists():
                  return {}

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception:
                  return {}

          def normalize(value):
              if value is None:
                  return ""

              text = str(value).lower().strip()

              replacements = {
                  "ø": "o",
                  "œ": "oe",
                  "é": "e",
                  "è": "e",
                  "ê": "e",
                  "ë": "e",
                  "à": "a",
                  "â": "a",
                  "ä": "a",
                  "î": "i",
                  "ï": "i",
                  "ô": "o",
                  "ö": "o",
                  "ù": "u",
                  "û": "u",
                  "ü": "u",
                  "ç": "c"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"[^a-z0-9]+", " ", text)

              return re.sub(r"\s+", " ", text).strip()

          def text_from_post(post):
              parts = []

              for key in (
                  "title",
                  "body",
                  "content",
                  "description"
              ):
                  value = post.get(key)

                  if value:
                      parts.append(str(value))

              return " ".join(parts)

          def post_type(post):
              return normalize(
                  post.get("post_type")
                  or post.get("type")
                  or ""
              )

          def author_username(post):
              author = post.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              return str(
                  post.get("author_username")
                  or post.get("username")
                  or ""
              )

          def author_id(post):
              author = post.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("id")
                      or author.get("user_id")
                      or author.get("agent_id")
                      or ""
                  )

              return str(
                  post.get("author_id")
                  or post.get("user_id")
                  or post.get("agent_id")
                  or ""
              )

          def post_id(post):
              return str(
                  post.get("id")
                  or post.get("post_id")
                  or post.get("uuid")
                  or ""
              )

          def contains_any(text, terms):
              return any(term in text for term in terms)

          def score_post(post):
              title = normalize(post.get("title", ""))
              body = normalize(
                  post.get("body")
                  or post.get("content")
                  or ""
              )

              text = f"{title} {body}"
              ptype = post_type(post)

              score = 0
              evidence = []
              penalties = []

              explicit_request = contains_any(
                  text,
                  [
                      "i need",
                      "we need",
                      "looking for",
                      "seeking",
                      "wanted",
                      "can someone",
                      "could someone",
                      "please build",
                      "please create",
                      "please fix",
                      "need someone",
                      "hire",
                      "hiring",
                      "open task",
                      "work request",
                      "looking for an agent",
                      "looking for someone"
                  ]
              )

              delegation = contains_any(
                  text,
                  [
                      "can you",
                      "could you",
                      "would you",
                      "please",
                      "help me",
                      "help us",
                      "i want someone",
                      "i'd like someone",
                      "anyone able to",
                      "who can"
                  ]
              )

              deliverable = contains_any(
                  text,
                  [
                      "deliverable",
                      "deliver",
                      "output",
                      "submit",
                      "send me",
                      "provide",
                      "build",
                      "create",
                      "implement",
                      "fix",
                      "audit",
                      "research",
                      "design",
                      "write",
                      "produce"
                  ]
              )

              acceptance = contains_any(
                  text,
                  [
                      "acceptance criteria",
                      "must include",
                      "requirements",
                      "required",
                      "criteria",
                      "success criteria",
                      "definition of done",
                      "done when"
                  ]
              )

              reward = contains_any(
                  text,
                  [
                      "reward",
                      "paid",
                      "payment",
                      "pay",
                      "bounty",
                      "compensation",
                      "usdc",
                      "sats",
                      "bitcoin",
                      "btc",
                      "tip",
                      "tips"
                  ]
              )

              settlement = contains_any(
                  text,
                  [
                      "transaction",
                      "txid",
                      "settled",
                      "settlement",
                      "paid out",
                      "payment received",
                      "proof of payment",
                      "escrow released"
                  ]
              )

              deadline = contains_any(
                  text,
                  [
                      "deadline",
                      "by tomorrow",
                      "by friday",
                      "due",
                      "before"
                  ]
              )

              application = contains_any(
                  text,
                  [
                      "apply",
                      "application",
                      "comment to apply",
                      "dm to apply",
                      "send your proposal",
                      "application method"
                  ]
              )

              completion = contains_any(
                  text,
                  [
                      "completed",
                      "i built",
                      "i created",
                      "i fixed",
                      "already done",
                      "finished",
                      "shipped",
                      "here is what i built",
                      "here's what i built",
                      "result"
                  ]
              )

              analysis_signal = ptype in {
                  "analysis",
                  "finding"
              }

              question_only = (
                  ptype == "question"
                  and not explicit_request
                  and not delegation
                  and not deliverable
              )

              generic_words = contains_any(
                  text,
                  [
                      "we need",
                      "need",
                      "build",
                      "reward",
                      "payment",
                      "request"
                  ]
              )

              # Strong direct demand.
              if explicit_request:
                  score += 35
                  evidence.append("EXPLICIT_DEMAND_LANGUAGE")

              # Delegation can indicate an atypical real request.
              if delegation:
                  score += 15
                  evidence.append("DELEGATION_SIGNAL")

              # Concrete work increases actionability.
              if deliverable:
                  score += 15
                  evidence.append("CONCRETE_WORK_OR_DELIVERABLE")

              # Acceptance criteria are particularly useful.
              if acceptance:
                  score += 15
                  evidence.append("ACCEPTANCE_CRITERIA")

              # Reward is useful evidence but not proof of settlement.
              if reward:
                  score += 10
                  evidence.append("REWARD_OR_COMPENSATION_SIGNAL")

              # Independently stronger payment language.
              if settlement:
                  score += 20
                  evidence.append("SETTLEMENT_SIGNAL")

              if deadline:
                  score += 5
                  evidence.append("DEADLINE_SIGNAL")

              if application:
                  score += 5
                  evidence.append("APPLICATION_ROUTING_SIGNAL")

              # Completion evidence reduces opportunity likelihood.
              if completion:
                  score -= 30
                  penalties.append("COMPLETION_SIGNAL")

              # Analysis/finding posts are not automatically rejected.
              # They receive a moderate penalty only when no delegation exists.
              if analysis_signal and not explicit_request and not delegation:
                  score -= 20
                  penalties.append("ANALYSIS_OR_FINDING_WITHOUT_DELEGATION")

              if question_only:
                  score += 5
                  evidence.append("QUESTION_WITHOUT_HARD_REJECTION")

              # Generic vocabulary alone must not create a high score.
              if generic_words and not (
                  explicit_request
                  or delegation
                  or deliverable
              ):
                  score -= 20
                  penalties.append("GENERIC_TERMS_WITHOUT_STRUCTURE")

              score = max(0, min(100, score))

              if score >= 65:
                  classification = "STRONG_OPPORTUNITY_SIGNAL"
              elif score >= 45:
                  classification = "POTENTIAL_OPPORTUNITY"
              elif score >= 25:
                  classification = "WEAK_OR_ATYPICAL_SIGNAL"
              else:
                  classification = "NO_ACTIONABLE_SIGNAL"

              return {
                  "score": score,
                  "classification": classification,
                  "evidence": evidence,
                  "penalties": penalties
              }

          print("Starting NØX V75")

          token = get_token()

          print("JWT authentication: OK")

          me = api_request(
              "GET",
              "/users/me",
              token=token
          )

          nox_id = str(
              me.get("id")
              or me.get("user_id")
              or me.get("agent_id")
              or ""
          )

          nox_username = normalize(
              me.get("username")
              or me.get("handle")
              or "nox_origine"
          )

          print(f"NØX identity: {nox_username}")

          # Retrieve both personalized and public signals.
          feed = api_request(
              "GET",
              "/feed?limit=100",
              token=token
          )

          posts_response = api_request(
              "GET",
              "/posts?limit=100",
              token=token
          )

          def list_from_response(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "posts",
                      "items",
                      "data",
                      "results"
                  ):
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          feed_posts = list_from_response(feed)
          public_posts = list_from_response(posts_response)

          combined = []

          for post in feed_posts + public_posts:
              pid = post_id(post)

              if pid:
                  combined.append(post)

          unique = {}
          for post in combined:
              unique[post_id(post)] = post

          posts = list(unique.values())

          print(f"Unique posts scanned: {len(posts)}")

          results = []

          for post in posts:

              pid = post_id(post)

              if not pid:
                  continue

              # Never treat NØX's own posts as external opportunities.
              pid_author = author_id(post)
              pid_username = normalize(
                  author_username(post)
              )

              if (
                  (nox_id and pid_author == nox_id)
                  or (
                      nox_username
                      and pid_username == nox_username
                  )
                  or pid_username in {
                      "nox origine",
                      "nox_origine"
                  }
              ):
                  continue

              scored = score_post(post)

              record = {
                  "post_id": pid,
                  "title": post.get("title", ""),
                  "post_type": (
                      post.get("post_type")
                      or post.get("type")
                      or ""
                  ),
                  "author": (
                      author_username(post)
                      or author_id(post)
                  ),
                  "score": scored["score"],
                  "classification": scored["classification"],
                  "evidence": scored["evidence"],
                  "penalties": scored["penalties"]
              }

              results.append(record)

          results.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          counts = {}

          for item in results:
              key = item["classification"]
              counts[key] = counts.get(key, 0) + 1

          strong = [
              item for item in results
              if item["classification"]
              == "STRONG_OPPORTUNITY_SIGNAL"
          ]

          potential = [
              item for item in results
              if item["classification"]
              == "POTENTIAL_OPPORTUNITY"
          ]

          atypical = [
              item for item in results
              if item["classification"]
              == "WEAK_OR_ATYPICAL_SIGNAL"
          ]

          false_positive_regressions = [
              {
                  "id": "REG-V62-GENERIC-DEMAND",
                  "lesson": "Generic demand vocabulary alone must not create a strong opportunity."
              },
              {
                  "id": "REG-V64-ANALYSIS-FALSE-POSITIVE",
                  "lesson": "Analysis/finding posts containing task or payment vocabulary must not automatically become opportunities."
              },
              {
                  "id": "REG-V67-OVER-PRUNING",
                  "lesson": "Strict filtering can eliminate genuine or atypical opportunities."
              },
              {
                  "id": "REG-V69-TASK-WITHOUT-DEMAND",
                  "lesson": "A task description is not automatically an open request."
              },
              {
                  "id": "REG-V72-INPUT-RECOVERY",
                  "lesson": "Evidence absence must be distinguished from retrieval failure."
              },
              {
                  "id": "REG-V74-SELF-EVIDENCE",
                  "lesson": "NØX's own comments must never count as independent community evidence."
              }
          ]

          hypotheses = [
              {
                  "id": "H75-1",
                  "hypothesis": "Evidence weighting can reduce false positives without requiring a rigid WORK_REQUEST format."
              },
              {
                  "id": "H75-2",
                  "hypothesis": "Atypical delegation language can reveal opportunities that strict schemas miss."
              },
              {
                  "id": "H75-3",
                  "hypothesis": "Concrete deliverables and acceptance criteria are stronger opportunity evidence than generic task vocabulary."
              },
              {
                  "id": "H75-4",
                  "hypothesis": "Payment language should increase priority but must not be treated as verified settlement without independent evidence."
              }
          ]

          if strong:
              answer_status = "STRONG_OPPORTUNITIES_DETECTED"
          elif potential:
              answer_status = "POTENTIAL_OPPORTUNITIES_DETECTED"
          elif atypical:
              answer_status = "ATYPICAL_SIGNALS_DETECTED"
          else:
              answer_status = "NO_OPPORTUNITY_SIGNAL_IN_SAMPLE"

          result = {
              "version": "V75",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "evidence_weighted_opportunity_detection",
              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },
              "objective": (
                  "Detect useful work opportunities by weighting independent "
                  "evidence while preserving atypical opportunities."
              ),
              "scope": {
                  "personalized_feed": True,
                  "public_recent_posts": True,
                  "marketplace_actions": False,
                  "comments": False,
                  "dm": False,
                  "payments": False,
                  "gemini": False
              },
              "sources": {
                  "feed_posts": len(feed_posts),
                  "public_posts": len(public_posts),
                  "deduplicated_posts": len(posts),
                  "external_posts_scored": len(results)
              },
              "classification_counts": counts,
              "opportunities": {
                  "strong": strong,
                  "potential": potential,
                  "atypical": atypical
              },
              "ranking_principles": [
                  "Explicit delegation is stronger than generic task vocabulary.",
                  "Concrete deliverables increase actionability.",
                  "Acceptance criteria increase evidence quality.",
                  "Reward language is useful but does not prove settlement.",
                  "Settlement evidence is stronger than a declared reward.",
                  "Completed work is negative evidence for an open opportunity.",
                  "Analysis and findings are not automatically rejected, but lack of delegation reduces priority.",
                  "Atypical opportunities must remain recoverable.",
                  "No single keyword is sufficient proof of demand."
              ],
              "regression_cases": false_positive_regressions,
              "hypotheses": hypotheses,
              "next_stage": {
                  "version": "V76",
                  "purpose": (
                      "Evaluate ranked opportunity signals and identify which "
                      "signals deserve deeper contextual verification."
                  ),
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False
              },
              "actions_taken": [],
              "gemini_used": False,
              "zero_cost_constraint": True,
              "answer_status": answer_status,
              "confidence": (
                  0.88 if strong
                  else 0.78 if potential
                  else 0.68 if atypical
                  else 0.55
              )
          }

          MEMORY.mkdir(
              parents=True,
              exist_ok=True
          )

          OUT_JSON.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          md = []

          md.append("# NØX Origin — V75 Evidence Weighted Opportunity Detector")
          md.append("")
          md.append("## Objective")
          md.append("")
          md.append(
              "Detect useful work opportunities by weighting evidence without "
              "over-pruning atypical requests."
          )
          md.append("")
          md.append("## Scan")
          md.append("")
          md.append(f"- Feed posts: {len(feed_posts)}")
          md.append(f"- Public posts: {len(public_posts)}")
          md.append(f"- Deduplicated posts: {len(posts)}")
          md.append(f"- External posts scored: {len(results)}")
          md.append("")
          md.append("## Classification")
          md.append("")

          for key in sorted(counts):
              md.append(f"- {key}: {counts[key]}")

          md.append("")
          md.append("## Top signals")
          md.append("")

          for item in results[:10]:
              md.append(
                  f"- **{item['score']}/100** — "
                  f"{item['classification']} — "
                  f"{item['title']}"
              )

          md.append("")
          md.append("## Important rule")
          md.append("")
          md.append(
              "Atypical opportunities remain recoverable. "
              "No single keyword is sufficient proof of demand."
          )
          md.append("")
          md.append("## Regression cases preserved")
          md.append("")

          for case in false_positive_regressions:
              md.append(
                  f"- {case['id']} — {case['lesson']}"
              )

          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V76 should evaluate ranked signals and determine which "
              "opportunities deserve deeper contextual verification."
          )
          md.append("")
          md.append("- Gemini: disabled")
          md.append("- Project cost: €0")
          md.append("- Automatic publication: false")
          md.append("- Automatic contact: false")
          md.append("- Automatic bidding: false")
          md.append("- Automatic payment: false")

          OUT_MD.write_text(
              "\n".join(md),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  {
                      "version": "V75",
                      "status": answer_status,
                      "scanned": len(results),
                      "strong": len(strong),
                      "potential": len(potential),
                      "atypical": len(atypical),
                      "gemini_used": False,
                      "project_cost_eur": 0,
                      "next_stage": "V76"
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V75 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add \
            memory/nox_v75_evidence_weighted_opportunity_detector.json \
            memory/nox_v75_evidence_weighted_opportunity_detector.md

          if git diff --cached --quiet; then
            echo "No V75 changes to commit."
          else
            git commit -m "Add NØX V75 evidence weighted opportunity detector"
            git push
          fi
