name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 1,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          print(
              f"Previous observations: "
              f"{len(memory.get('observations', []))}"
          )

          print(
              f"Previous decisions: "
              f"{len(memory.get('decisions', []))}"
          )

          print(
              f"Previous actions: "
              f"{len(memory.get('actions', []))}"
          )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          print("The Colony authentication successful.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # --------------------------------------------------
          # 3. PERSONALIZED FEED
          # --------------------------------------------------

          print()
          print("NØX is observing its personalized feed...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"For-you feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Personalized feed received.")

          # --------------------------------------------------
          # 4. SUGGESTIONS
          # --------------------------------------------------

          print()
          print("NØX is checking suggested actions...")

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          print("Suggested actions received.")

          # --------------------------------------------------
          # 5. EXTRACT SUGGESTIONS
          # --------------------------------------------------

          actions = []

          if isinstance(suggestions_data, dict):
              actions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )

          if not isinstance(actions, list):
              actions = []

          print(
              f"Available suggestions: {len(actions)}"
          )

          # --------------------------------------------------
          # 6. NØX DECISION
          # --------------------------------------------------

          selected_action = None

          if actions:
              selected_action = actions[0]

          now = datetime.now(timezone.utc).isoformat()

          observation = {
              "timestamp": now,
              "feed": feed_data
          }

          decision = {
              "timestamp": now,
              "selected_action": selected_action
          }

          learning = {
              "timestamp": now,
              "observation_count": (
                  len(feed_data.get("items", []))
                  if isinstance(feed_data, dict)
                  else None
              ),
              "suggestion_count": len(actions),
              "note": (
                  "NØX observed The Colony and selected "
                  "the highest-ranked available suggestion."
              )
          }

          # --------------------------------------------------
          # 7. UPDATE MEMORY
          # --------------------------------------------------

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          memory["observations"].append(observation)

          memory["decisions"].append(decision)

          if selected_action is not None:
              memory["actions"].append({
                  "timestamp": now,
                  "action": selected_action,
                  "status": "selected"
              })

          memory["learnings"].append(learning)

          # Keep the memory small and manageable.
          memory["observations"] = memory["observations"][-50:]
          memory["decisions"] = memory["decisions"][-50:]
          memory["actions"] = memory["actions"][-50:]
          memory["learnings"] = memory["learnings"][-50:]

          # --------------------------------------------------
          # 8. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("NØX memory updated successfully.")

          # --------------------------------------------------
          # 9. DISPLAY DECISION
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX DECISION")
          print("====================================")

          if selected_action:
              print(
                  json.dumps(
                      selected_action,
                      ensure_ascii=False,
                      indent=2
                  )
              )
          else:
              print(
                  "No suggested action available."
              )

          print()
          print("====================================")
          print("NØX INTELLIGENCE COMPLETED")
          print("====================================")
          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: update memory"
            git push
          fi
