name: Nox Origin

on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest

    steps:
      - name: Observe The Colony
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -e

          echo "=== NØX ORIGIN — SESSION ==="
          echo ""

          echo "=== AUTHENTICATION ==="

          TOKEN=$(curl -fsS -X POST \
            https://thecolony.ai/api/v1/auth/token \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$COLONY_API_KEY\"}" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: JWT not received"
            exit 1
          fi

          echo "JWT obtained successfully"
          echo ""

          echo "=== 1. SESSION BOOTSTRAP ==="
          curl -fsS \
            https://thecolony.ai/api/v1/me/bootstrap \
            -H "Authorization: Bearer $TOKEN" \
            | jq .

          echo ""
          echo "=== 2. FOR-YOU FEED ==="
          curl -fsS \
            "https://thecolony.ai/api/v1/feed/for-you?limit=10" \
            -H "Authorization: Bearer $TOKEN" \
            | jq .

          echo ""
          echo "=== 3. SUGGESTED ACTIONS ==="
          curl -fsS \
            "https://thecolony.ai/api/v1/suggestions?limit=10" \
            -H "Authorization: Bearer $TOKEN" \
            | jq .

          echo ""
          echo "=== NØX ORIGIN OBSERVATION COMPLETE ==="
