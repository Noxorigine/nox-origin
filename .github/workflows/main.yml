name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V4
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V4")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 4,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          print(
              f"Previous observations: "
              f"{len(memory['observations'])}"
          )

          print(
              f"Previous decisions: "
              f"{len(memory['decisions'])}"
          )

          print(
              f"Previous actions: "
              f"{len(memory['actions'])}"
          )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          print("The Colony authentication successful.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # --------------------------------------------------
          # 3. OBSERVE
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"For-you feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Personalized feed received.")

          # --------------------------------------------------
          # 4. GET SUGGESTIONS
          # --------------------------------------------------

          print()
          print("NØX is checking suggested actions...")

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(f"Suggestions status: {suggestions.status_code}")

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          if isinstance(suggestions_data, dict):
              available_actions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )
          else:
              available_actions = []

          if not isinstance(available_actions, list):
              available_actions = []

          print(
              f"Available suggestions: "
              f"{len(available_actions)}"
          )

          # --------------------------------------------------
          # 5. SELECT SAFE ACTION
          # --------------------------------------------------

          selected_action = None

          for suggestion in available_actions:

              if not isinstance(suggestion, dict):
                  continue

              action = suggestion.get("action", {})

              if not isinstance(action, dict):
                  continue

              api_method = action.get("api_method")
              api_path = action.get("api_path")

              # V4 SAFE ALLOWLIST
              if (
                  suggestion.get("kind") == "follow_tag"
                  and api_method == "POST"
                  and isinstance(api_path, str)
                  and api_path.startswith("/api/v1/tags/")
                  and api_path.endswith("/follow")
              ):
                  selected_action = suggestion
                  break

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # 6. RECORD DECISION
          # --------------------------------------------------

          decision = {
              "timestamp": now,
              "selected_action": selected_action,
              "available_suggestions": len(available_actions)
          }

          memory["observations"].append({
              "timestamp": now,
              "feed": feed_data
          })

          memory["decisions"].append(decision)

          # --------------------------------------------------
          # 7. EXECUTE ACTION
          # --------------------------------------------------

          execution_result = None

          if selected_action is None:

              print()
              print("No safe V4 action available.")

              memory["learnings"].append({
                  "timestamp": now,
                  "type": "no_action",
                  "note": (
                      "NØX found suggestions but none matched "
                      "the V4 safe action allowlist."
                  )
              })

          else:

              action = selected_action["action"]
              api_path = action["api_path"]

              print()
              print("====================================")
              print("NØX SELECTED ACTION")
              print("====================================")
              print(selected_action.get("title"))
              print(f"API: POST {api_path}")
              print("====================================")

              # ----------------------------------------------
              # DUPLICATE PROTECTION
              # ----------------------------------------------

              target = selected_action.get("target", {})
              target_id = target.get("id")

              already_done = False

              for previous in memory["actions"]:
                  if (
                      previous.get("status") == "success"
                      and previous.get("target_id") == target_id
                      and previous.get("action_kind") == "follow_tag"
                  ):
                      already_done = True
                      break

              if already_done:

                  print()
                  print(
                      "NØX has already successfully performed "
                      "this action."
                  )

                  execution_result = {
                      "status": "skipped_duplicate"
                  }

              else:

                  # ------------------------------------------
                  # EXECUTE
                  # ------------------------------------------

                  print()
                  print("NØX is executing the action...")

                  response = requests.post(
                      f"{COLONY_BASE}{api_path}",
                      headers=headers,
                      timeout=30
                  )

                  print(
                      f"Action response: "
                      f"{response.status_code}"
                  )

                  if response.status_code >= 400:
                      print("Action failed:")
                      print(response.text)

                      execution_result = {
                          "status": "failed",
                          "http_status": response.status_code,
                          "response": response.text[:2000]
                      }

                  else:

                      print("Action executed successfully.")

                      try:
                          response_data = response.json()
                      except Exception:
                          response_data = response.text[:2000]

                      execution_result = {
                          "status": "success",
                          "http_status": response.status_code,
                          "response": response_data
                      }

                  # ------------------------------------------
                  # MEMORY
                  # ------------------------------------------

                  memory["actions"].append({
                      "timestamp": now,
                      "action_kind": selected_action.get("kind"),
                      "target_id": target_id,
                      "title": selected_action.get("title"),
                      "api_path": api_path,
                      "status": execution_result["status"]
                  })

          # --------------------------------------------------
          # 8. LEARNING
          # --------------------------------------------------

          memory["learnings"].append({
              "timestamp": now,
              "type": "execution",
              "selected": (
                  selected_action.get("title")
                  if selected_action
                  else None
              ),
              "result": execution_result
          })

          # --------------------------------------------------
          # 9. KEEP MEMORY UNDER CONTROL
          # --------------------------------------------------

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["actions"] = (
              memory["actions"][-50:]
          )

          memory["learnings"] = (
              memory["learnings"][-50:]
          )

          memory["version"] = 4

          # --------------------------------------------------
          # 10. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # --------------------------------------------------
          # 11. FINAL REPORT
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX V4 FINAL REPORT")
          print("====================================")

          if selected_action:
              print(
                  f"Decision: "
                  f"{selected_action.get('title')}"
              )

          if execution_result:
              print(
                  f"Execution: "
                  f"{execution_result.get('status')}"
              )
          else:
              print("Execution: none")

          print(
              f"Memory actions: "
              f"{len(memory['actions'])}"
          )

          print("====================================")
          print("NØX INTELLIGENCE V4 COMPLETED")
          print("====================================")
          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX V4: execute and learn"
            git push
          fi
