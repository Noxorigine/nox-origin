name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V8
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V8")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 1,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          print(
              f"Observations: {len(memory['observations'])}"
          )
          print(
              f"Decisions: {len(memory['decisions'])}"
          )
          print(
              f"Actions: {len(memory['actions'])}"
          )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"Authentication status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # --------------------------------------------------
          # 3. OBSERVE
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"Feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          # --------------------------------------------------
          # 4. EXTRACT SUGGESTIONS
          # --------------------------------------------------

          if isinstance(suggestions_data, dict):
              available = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )
          else:
              available = []

          if not isinstance(available, list):
              available = []

          print(
              f"Available suggestions: {len(available)}"
          )

          # --------------------------------------------------
          # 5. RECORD OBSERVATION
          # --------------------------------------------------

          observation = {
              "timestamp": now,
              "feed_items": (
                  len(feed_data.get("items", []))
                  if isinstance(feed_data, dict)
                  else None
              ),
              "suggestion_count": len(available)
          }

          memory["observations"].append(observation)

          # --------------------------------------------------
          # 6. SELECT ONE ACTION
          # --------------------------------------------------

          selected = None

          for suggestion in available:
              action = suggestion.get("action", {})
              
              api_method = action.get("api_method")
              api_path = action.get("api_path")

              # V8 safety rule:
              # only allow a POST action on the Colony API
              # when the suggestion explicitly provides it.
              if api_method == "POST" and api_path:
                  selected = suggestion
                  break

          if selected is None:

              print()
              print("No safe executable action found.")

              memory["decisions"].append({
                  "timestamp": now,
                  "selected_action": None,
                  "reason": "No approved executable suggestion."
              })

              memory["learnings"].append({
                  "timestamp": now,
                  "result": "no_action",
                  "note": (
                      "NØX observed the Colony but found "
                      "no action matching its current safety rules."
                  )
              })

          else:

              action = selected.get("action", {})

              api_method = action.get("api_method")
              api_path = action.get("api_path")
              api_body = action.get("api_body")

              print()
              print("====================================")
              print("NØX SELECTED ACTION")
              print("====================================")

              print(
                  json.dumps(
                      selected,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              # ------------------------------------------------
              # 7. SAFETY CHECK
              # ------------------------------------------------

              allowed_prefix = "/api/v1/"

              if not api_path.startswith(allowed_prefix):
                  raise RuntimeError(
                      "Safety check failed: "
                      "API path outside The Colony."
                  )

              # V8 only executes one specific action.
              # No loops and no second action.

              print()
              print("Safety check: PASSED")
              print("Executing exactly ONE action...")

              url = f"https://thecolony.ai{api_path}"

              # ------------------------------------------------
              # 8. EXECUTE ACTION
              # ------------------------------------------------

              if api_method != "POST":
                  raise RuntimeError(
                      "Safety check failed: "
                      "unsupported HTTP method."
                  )

              if api_body is None:
                  response = requests.post(
                      url,
                      headers=headers,
                      timeout=30
                  )
              else:
                  response = requests.post(
                      url,
                      headers=headers,
                      json=api_body,
                      timeout=30
                  )

              print(
                  f"Action response: "
                  f"{response.status_code}"
              )

              print(response.text[:2000])

              # ------------------------------------------------
              # 9. VERIFY RESULT
              # ------------------------------------------------

              success = 200 <= response.status_code < 300

              if success:
                  action_status = "success"
                  learning_result = "action_success"

                  print()
                  print("ACTION SUCCESSFUL.")

              else:
                  action_status = "failed"
                  learning_result = "action_failed"

                  print()
                  print(
                      "ACTION DID NOT COMPLETE SUCCESSFULLY."
                  )

              # ------------------------------------------------
              # 10. SAVE DECISION
              # ------------------------------------------------

              memory["decisions"].append({
                  "timestamp": now,
                  "selected_action": selected,
                  "execution_status": action_status
              })

              # ------------------------------------------------
              # 11. SAVE ACTION RESULT
              # ------------------------------------------------

              memory["actions"].append({
                  "timestamp": now,
                  "title": selected.get("title"),
                  "kind": selected.get("kind"),
                  "api_method": api_method,
                  "api_path": api_path,
                  "status": action_status,
                  "http_status": response.status_code
              })

              # ------------------------------------------------
              # 12. LEARNING
              # ------------------------------------------------

              memory["learnings"].append({
                  "timestamp": now,
                  "result": learning_result,
                  "action_kind": selected.get("kind"),
                  "note": (
                      "NØX selected one ranked Colony action, "
                      "executed it once, and recorded the result."
                  )
              })

          # --------------------------------------------------
          # 13. LIMIT MEMORY
          # --------------------------------------------------

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["actions"] = (
              memory["actions"][-50:]
          )

          memory["learnings"] = (
              memory["learnings"][-50:]
          )

          # --------------------------------------------------
          # 14. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("NØX memory updated.")

          print()
          print("====================================")
          print("NØX INTELLIGENCE V8 COMPLETED")
          print("====================================")
          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: V8 action cycle"
            git push
          fi
