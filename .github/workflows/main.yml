name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V9
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V9")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          now = datetime.now(timezone.utc).isoformat()

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 1,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          print(f"Observations: {len(memory['observations'])}")
          print(f"Decisions: {len(memory['decisions'])}")
          print(f"Actions: {len(memory['actions'])}")
          print(f"Learnings: {len(memory['learnings'])}")

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"Authentication status: {auth.status_code}")
          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication successful.")

          # --------------------------------------------------
          # 3. OBSERVE FEED
          # --------------------------------------------------

          print()
          print("NØX is observing the personalized feed...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"Feed status: {feed.status_code}")
          feed.raise_for_status()

          feed_data = feed.json()

          feed_items = (
              feed_data.get("items", [])
              if isinstance(feed_data, dict)
              else []
          )

          print(f"Feed items received: {len(feed_items)}")

          # --------------------------------------------------
          # 4. GET SUGGESTIONS
          # --------------------------------------------------

          print()
          print("NØX is collecting possible actions...")

          suggestions_response = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_response.raise_for_status()

          suggestions_data = suggestions_response.json()

          if isinstance(suggestions_data, dict):
              suggestions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )
          else:
              suggestions = []

          if not isinstance(suggestions, list):
              suggestions = []

          print(
              f"Suggestions received: {len(suggestions)}"
          )

          # --------------------------------------------------
          # 5. BUILD HISTORY OF SUCCESSFUL ACTIONS
          # --------------------------------------------------

          successful_action_ids = set()

          for previous in memory["actions"]:
              if previous.get("status") == "success":
                  action_id = previous.get("suggestion_id")

                  if action_id:
                      successful_action_ids.add(
                          str(action_id)
                      )

          print(
              "Previously successful actions: "
              f"{len(successful_action_ids)}"
          )

          # --------------------------------------------------
          # 6. ANALYZE AND RANK SUGGESTIONS
          # --------------------------------------------------

          candidates = []

          for suggestion in suggestions:

              if not isinstance(suggestion, dict):
                  continue

              suggestion_id = str(
                  suggestion.get("id", "")
              )

              action = suggestion.get("action", {})

              if not isinstance(action, dict):
                  continue

              api_method = action.get("api_method")
              api_path = action.get("api_path")

              # Must contain a concrete API call.
              if not api_method or not api_path:
                  continue

              # V9 only supports POST actions.
              if api_method != "POST":
                  continue

              # The action must stay inside The Colony API.
              if not api_path.startswith("/api/v1/"):
                  continue

              base_score = suggestion.get("score", 0)

              try:
                  base_score = float(base_score)
              except (TypeError, ValueError):
                  base_score = 0.0

              # Novelty is important.
              novelty_bonus = 0.25

              if suggestion_id in successful_action_ids:
                  novelty_bonus = -1.0

              final_score = base_score + novelty_bonus

              candidates.append({
                  "suggestion": suggestion,
                  "base_score": base_score,
                  "novelty_bonus": novelty_bonus,
                  "final_score": final_score
              })

          # Highest final score first.
          candidates.sort(
              key=lambda x: x["final_score"],
              reverse=True
          )

          print()
          print("====================================")
          print("NØX ACTION ANALYSIS")
          print("====================================")

          for index, candidate in enumerate(
              candidates[:10],
              start=1
          ):
              suggestion = candidate["suggestion"]

              print(
                  f"{index}. "
                  f"{suggestion.get('title', 'Unnamed action')} "
                  f"| base={candidate['base_score']:.3f} "
                  f"| novelty={candidate['novelty_bonus']:.3f} "
                  f"| final={candidate['final_score']:.3f}"
              )

          # --------------------------------------------------
          # 7. SELECT ONE NEW ACTION
          # --------------------------------------------------

          selected_candidate = None

          for candidate in candidates:

              suggestion = candidate["suggestion"]
              suggestion_id = str(
                  suggestion.get("id", "")
              )

              # Never repeat a successful suggestion.
              if suggestion_id in successful_action_ids:
                  continue

              selected_candidate = candidate
              break

          # --------------------------------------------------
          # 8. RECORD OBSERVATION
          # --------------------------------------------------

          memory["observations"].append({
              "timestamp": now,
              "feed_items": len(feed_items),
              "suggestion_count": len(suggestions),
              "candidate_count": len(candidates)
          })

          # --------------------------------------------------
          # 9. NO SAFE NEW ACTION
          # --------------------------------------------------

          if selected_candidate is None:

              print()
              print("No new safe action available.")

              memory["decisions"].append({
                  "timestamp": now,
                  "selected_action": None,
                  "reason": (
                      "No new executable action remained "
                      "after safety and repetition checks."
                  )
              })

              memory["learnings"].append({
                  "timestamp": now,
                  "result": "no_action",
                  "note": (
                      "NØX compared available suggestions "
                      "but avoided repeating successful actions."
                  )
              })

          else:

              selected = selected_candidate["suggestion"]
              action = selected["action"]

              api_method = action["api_method"]
              api_path = action["api_path"]
              api_body = action.get("api_body")

              suggestion_id = str(
                  selected.get("id", "")
              )

              print()
              print("====================================")
              print("NØX SELECTED ACTION")
              print("====================================")

              print(
                  f"Title: {selected.get('title')}"
              )

              print(
                  f"Kind: {selected.get('kind')}"
              )

              print(
                  f"Base score: "
                  f"{selected_candidate['base_score']:.3f}"
              )

              print(
                  f"Novelty bonus: "
                  f"{selected_candidate['novelty_bonus']:.3f}"
              )

              print(
                  f"Final score: "
                  f"{selected_candidate['final_score']:.3f}"
              )

              print(
                  f"API: {api_method} {api_path}"
              )

              # ------------------------------------------------
              # 10. SAFETY CHECKS
              # ------------------------------------------------

              print()
              print("Running V9 safety checks...")

              if not api_path.startswith("/api/v1/"):
                  raise RuntimeError(
                      "Safety failure: external API path."
                  )

              if api_method != "POST":
                  raise RuntimeError(
                      "Safety failure: unsupported HTTP method."
                  )

              if suggestion_id in successful_action_ids:
                  raise RuntimeError(
                      "Safety failure: action already succeeded."
                  )

              print("Safety checks: PASSED")

              # ------------------------------------------------
              # 11. EXECUTE EXACTLY ONE ACTION
              # ------------------------------------------------

              print()
              print("Executing ONE selected action...")

              url = f"https://thecolony.ai{api_path}"

              if api_body is None:
                  result = requests.post(
                      url,
                      headers=headers,
                      timeout=30
                  )
              else:
                  result = requests.post(
                      url,
                      headers=headers,
                      json=api_body,
                      timeout=30
                  )

              print(
                  f"Action HTTP status: "
                  f"{result.status_code}"
              )

              print(
                  "Action response:"
              )

              print(result.text[:2000])

              # ------------------------------------------------
              # 12. VERIFY RESULT
              # ------------------------------------------------

              success = (
                  200 <= result.status_code < 300
              )

              if success:

                  status = "success"

                  print()
                  print(
                      "ACTION VERIFIED SUCCESSFULLY."
                  )

              else:

                  status = "failed"

                  print()
                  print(
                      "ACTION FAILED."
                  )

              # ------------------------------------------------
              # 13. RECORD DECISION
              # ------------------------------------------------

              memory["decisions"].append({
                  "timestamp": now,
                  "selected_action": selected,
                  "base_score": (
                      selected_candidate["base_score"]
                  ),
                  "novelty_bonus": (
                      selected_candidate["novelty_bonus"]
                  ),
                  "final_score": (
                      selected_candidate["final_score"]
                  ),
                  "execution_status": status
              })

              # ------------------------------------------------
              # 14. RECORD ACTION RESULT
              # ------------------------------------------------

              memory["actions"].append({
                  "timestamp": now,
                  "suggestion_id": suggestion_id,
                  "title": selected.get("title"),
                  "kind": selected.get("kind"),
                  "category": selected.get("category"),
                  "api_method": api_method,
                  "api_path": api_path,
                  "status": status,
                  "http_status": result.status_code
              })

              # ------------------------------------------------
              # 15. LEARNING
              # ------------------------------------------------

              memory["learnings"].append({
                  "timestamp": now,
                  "result": (
                      "action_success"
                      if success
                      else "action_failed"
                  ),
                  "selected_kind": selected.get("kind"),
                  "selected_category": selected.get(
                      "category"
                  ),
                  "score": (
                      selected_candidate["final_score"]
                  ),
                  "note": (
                      "NØX compared multiple suggestions, "
                      "selected a new action, executed it once, "
                      "and recorded the result."
                  )
              })

          # --------------------------------------------------
          # 16. KEEP MEMORY MANAGEABLE
          # --------------------------------------------------

          memory["observations"] = (
              memory["observations"][-100:]
          )

          memory["decisions"] = (
              memory["decisions"][-100:]
          )

          memory["actions"] = (
              memory["actions"][-100:]
          )

          memory["learnings"] = (
              memory["learnings"][-100:]
          )

          # --------------------------------------------------
          # 17. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("====================================")
          print("NØX MEMORY UPDATED")
          print("====================================")

          print(
              f"Observations: "
              f"{len(memory['observations'])}"
          )

          print(
              f"Decisions: "
              f"{len(memory['decisions'])}"
          )

          print(
              f"Actions: "
              f"{len(memory['actions'])}"
          )

          print(
              f"Learnings: "
              f"{len(memory['learnings'])}"
          )

          print()
          print("====================================")
          print("NØX INTELLIGENCE V9 COMPLETED")
          print("====================================")
          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: V9 decision and learning cycle"
            git push
          fi
