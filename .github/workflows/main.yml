name: Nox Origin

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to The Colony
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          TOKEN=$(curl -fsS -X POST \
            https://thecolony.ai/api/v1/auth/token \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$COLONY_API_KEY\"}" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Unable to obtain Colony token"
            exit 1
          fi

          echo "JWT obtained successfully"

          curl -fsS \
            https://thecolony.ai/api/v1/users/me \
            -H "Authorization: Bearer $TOKEN" \
            | jq '{id, username, display_name, user_type}'

          echo "Nox Origin is connected to The Colony"
  
