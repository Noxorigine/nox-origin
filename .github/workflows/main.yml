name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-genai requests

      - name: Run NØX Intelligence V6
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone
          from google import genai

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V6")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # ==================================================
          # 1. LOAD MEMORY
          # ==================================================

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 1,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          observations = memory.get("observations", [])
          decisions = memory.get("decisions", [])
          actions_history = memory.get("actions", [])
          learnings = memory.get("learnings", [])

          print(f"Previous observations: {len(observations)}")
          print(f"Previous decisions: {len(decisions)}")
          print(f"Previous actions: {len(actions_history)}")
          print(f"Previous learnings: {len(learnings)}")

          # ==================================================
          # 2. AUTHENTICATE THE COLONY
          # ==================================================

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          print("The Colony authentication successful.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # ==================================================
          # 3. OBSERVE PERSONALIZED FEED
          # ==================================================

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"Feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Personalized feed received.")

          # ==================================================
          # 4. GET SUGGESTED ACTIONS
          # ==================================================

          print()
          print("NØX is studying possible actions...")

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(f"Suggestions status: {suggestions.status_code}")

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          if isinstance(suggestions_data, dict):
              available_actions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )
          else:
              available_actions = []

          if not isinstance(available_actions, list):
              available_actions = []

          print(
              f"Available suggestions: "
              f"{len(available_actions)}"
          )

          # ==================================================
          # 5. DETECT PREVIOUSLY SELECTED ACTIONS
          # ==================================================

          previous_action_ids = set()

          for item in actions_history:
              action = item.get("action", {})

              if isinstance(action, dict):
                  action_id = action.get("id")

                  if action_id:
                      previous_action_ids.add(str(action_id))

          print(
              f"Previously selected action IDs: "
              f"{len(previous_action_ids)}"
          )

          # Prefer actions NØX has not already selected.
          new_actions = []

          for action in available_actions:
              action_id = action.get("id")

              if action_id is None:
                  new_actions.append(action)
              elif str(action_id) not in previous_action_ids:
                  new_actions.append(action)

          # If everything is known, keep the ranked list.
          if new_actions:
              candidate_actions = new_actions
          else:
              candidate_actions = available_actions

          print(
              f"New candidate actions: "
              f"{len(candidate_actions)}"
          )

          # ==================================================
          # 6. PREPARE A SMALL MEMORY FOR NØX
          # ==================================================

          recent_memory = {
              "recent_decisions": decisions[-10:],
              "recent_actions": actions_history[-10:],
              "recent_learnings": learnings[-10:]
          }

          observation_sample = feed_data

          if isinstance(observation_sample, dict):
              # Keep the prompt compact.
              observation_sample = {
                  "items": observation_sample.get(
                      "items", []
                  )[:10]
              }

          action_sample = candidate_actions[:10]

          # ==================================================
          # 7. NØX THINKING
          # ==================================================

          prompt = f"""
          You are NØX Origin.

          NØX is an experimental autonomous AI agent operating
          on The Colony.

          Mission:
          Become increasingly useful, intelligent and eventually
          economically self-sufficient while respecting a
          ZERO-EURO operating constraint.

          Important:
          You are NOT allowed to spend money.
          You are NOT executing actions in this version.
          You are only deciding what would be the best next action.

          NØX has memory from previous sessions.

          RECENT MEMORY:
          {json.dumps(
              recent_memory,
              ensure_ascii=False
          )[:18000]}

          CURRENT COLONY OBSERVATION:
          {json.dumps(
              observation_sample,
              ensure_ascii=False
          )[:18000]}

          AVAILABLE ACTIONS:
          {json.dumps(
              action_sample,
              ensure_ascii=False
          )[:12000]}

          Your task:

          1. Identify something useful or interesting in the
             current Colony observation.

          2. Compare it with NØX's recent memory.

          3. Avoid blindly repeating an action that NØX has
             already selected unless there is a clear reason.

          4. Choose ONE best next action.

          5. Explain what NØX learned.

          Return exactly this structure:

          OBSERVATION:
          <what NØX noticed>

          MEMORY_COMPARISON:
          <what previous experience tells NØX>

          DECISION:
          <one proposed action>

          REASON:
          <why this action is better than the alternatives>

          LEARNING:
          <what NØX should remember>

          NEXT_STEP:
          <what NØX should investigate or consider next session>
          """

          # ==================================================
          # 8. GEMINI
          # ==================================================

          print()
          print("Starting NØX reasoning...")

          client = genai.Client(
              api_key=GEMINI_API_KEY
          )

          response = None

          try:
              response = client.models.generate_content(
                  model="gemini-3.7-flash",
                  contents=prompt
              )

          except Exception as error:
              print()
              print("Gemini unavailable.")
              print(str(error))

              # Do NOT burn the workflow with repeated retries.
              # NØX keeps its observation and memory intact.
              print()
              print(
                  "NØX will preserve its observation and "
                  "continue on the next session."
              )

          # ==================================================
          # 9. HANDLE GEMINI RESULT
          # ==================================================

          now = datetime.now(timezone.utc).isoformat()

          if response is not None:

              decision_text = getattr(
                  response,
                  "text",
                  None
              )

              if decision_text:

                  print()
                  print("====================================")
                  print("NØX V6 DECISION")
                  print("====================================")
                  print(decision_text)
                  print("====================================")

                  decision_record = {
                      "timestamp": now,
                      "model": "gemini-3.7-flash",
                      "decision": decision_text
                  }

                  memory.setdefault(
                      "decisions",
                      []
                  )

                  memory["decisions"].append(
                      decision_record
                  )

                  memory.setdefault(
                      "learnings",
                      []
                  )

                  memory["learnings"].append({
                      "timestamp": now,
                      "type": "reasoning",
                      "note": (
                          "NØX compared current Colony "
                          "information with previous memory "
                          "before selecting a next action."
                      )
                  })

              else:

                  print(
                      "Gemini returned no text."
                  )

          # ==================================================
          # 10. SAVE OBSERVATION
          # ==================================================

          memory.setdefault(
              "observations",
              []
          )

          memory["observations"].append({
              "timestamp": now,
              "feed": feed_data,
              "available_actions": len(
                  available_actions
              )
          })

          # ==================================================
          # 11. SAVE CANDIDATE ACTIONS
          # ==================================================

          if candidate_actions:

              memory.setdefault(
                  "actions",
                  []
              )

              memory["actions"].append({
                  "timestamp": now,
                  "action": candidate_actions[0],
                  "status": "candidate"
              })

          # ==================================================
          # 12. KEEP MEMORY MANAGEABLE
          # ==================================================

          memory["observations"] = (
              memory.get("observations", [])[-50:]
          )

          memory["decisions"] = (
              memory.get("decisions", [])[-50:]
          )

          memory["actions"] = (
              memory.get("actions", [])[-50:]
          )

          memory["learnings"] = (
              memory.get("learnings", [])[-50:]
          )

          # ==================================================
          # 13. UPDATE VERSION
          # ==================================================

          memory["version"] = 6

          # ==================================================
          # 14. SAVE MEMORY
          # ==================================================

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("NØX memory updated successfully.")

          print()
          print("====================================")
          print("NØX INTELLIGENCE V6 COMPLETED")
          print("====================================")
          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: intelligence v6 memory update"
            git push
          fi
