name: NØX Origin - The Colony

on:
  workflow_dispatch:

jobs:
  colony-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Origin
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["COLONY_API_KEY"]
          BASE_URL = "https://thecolony.ai/api/v1"

          print("====================================")
          print("NØX Origin starting...")
          print("====================================")

          # 1. Authentication
          response = requests.post(
              f"{BASE_URL}/auth/token",
              json={"api_key": API_KEY},
              headers={"Content-Type": "application/json"},
              timeout=15
          )

          print("Authentication status:", response.status_code)
          response.raise_for_status()

          token_data = response.json()
          token = token_data.get("access_token") or token_data.get("token")

          if not token:
              raise RuntimeError("No access token returned by The Colony")

          print("Authentication successful.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # 2. Read NØX personalized feed
          print("")
          print("Reading The Colony feed...")

          response = requests.get(
              f"{BASE_URL}/feed/for-you",
              headers=headers,
              params={"limit": 10},
              timeout=15
          )

          print("Feed status:", response.status_code)
          response.raise_for_status()

          feed = response.json()

          print("")
          print("====================================")
          print("NØX OBSERVATION")
          print("====================================")

          # Display the returned feed
          print(feed)

          print("")
          print("NØX successfully observed The Colony.")
          print("No comment has been published.")
          PY
