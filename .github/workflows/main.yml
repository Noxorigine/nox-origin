name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V5
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V5")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # ==================================================
          # 1. LOAD MEMORY
          # ==================================================

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {}

          memory.setdefault("version", 5)
          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])
          memory.setdefault("experience", {})

          print(
              f"Observations: {len(memory['observations'])}"
          )

          print(
              f"Decisions: {len(memory['decisions'])}"
          )

          print(
              f"Actions: {len(memory['actions'])}"
          )

          print(
              f"Experience records: "
              f"{len(memory['experience'])}"
          )

          # ==================================================
          # 2. AUTHENTICATION
          # ==================================================

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(
              f"The Colony status: "
              f"{auth.status_code}"
          )

          auth.raise_for_status()

          token = auth.json()["access_token"]

          print(
              "The Colony authentication successful."
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # ==================================================
          # 3. CHECK LIMITS
          # ==================================================

          print()
          print("Checking NØX limits...")

          limits = requests.get(
              f"{COLONY_BASE}/limits/me",
              headers=headers,
              timeout=30
          )

          print(
              f"Limits status: "
              f"{limits.status_code}"
          )

          if limits.status_code == 200:
              limits_data = limits.json()
              print("Limits received.")
          else:
              limits_data = {
                  "status": "unavailable"
              }
              print(
                  "Limits endpoint unavailable. "
                  "Continuing safely."
              )

          # ==================================================
          # 4. OBSERVE PERSONALIZED FEED
          # ==================================================

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(
              f"For-you feed status: "
              f"{feed.status_code}"
          )

          feed.raise_for_status()

          feed_data = feed.json()

          print("Personalized feed received.")

          # ==================================================
          # 5. CHECK NEW EVENTS
          # ==================================================

          print()
          print("Checking new Colony activity...")

          cursor = memory.get("since_cursor")

          since_params = {}

          if cursor:
              since_params["cursor"] = cursor

          since = requests.get(
              f"{COLONY_BASE}/since",
              headers=headers,
              params=since_params,
              timeout=30
          )

          print(
              f"Since status: "
              f"{since.status_code}"
          )

          new_activity = {}

          if since.status_code == 200:

              new_activity = since.json()

              new_cursor = (
                  new_activity.get("next_cursor")
                  or new_activity.get("cursor")
              )

              if new_cursor:
                  memory["since_cursor"] = new_cursor

              print("New activity received.")

          else:

              print(
                  "No new activity could be retrieved."
              )

          # ==================================================
          # 6. GET SUGGESTIONS
          # ==================================================

          print()
          print("NØX is checking suggested actions...")

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          if isinstance(suggestions_data, dict):

              available_actions = (
                  suggestions_data.get(
                      "suggestions",
                      suggestions_data.get(
                          "items",
                          []
                      )
                  )
              )

          else:
              available_actions = []

          if not isinstance(
              available_actions,
              list
          ):
              available_actions = []

          print(
              f"Available suggestions: "
              f"{len(available_actions)}"
          )

          # ==================================================
          # 7. EXPERIENCE ENGINE
          # ==================================================

          print()
          print("NØX is evaluating its experience...")

          def get_experience(kind):

              if kind not in memory["experience"]:

                  memory["experience"][kind] = {
                      "attempts": 0,
                      "successes": 0,
                      "failures": 0,
                      "skipped": 0,
                      "score": 0.0
                  }

              return memory["experience"][kind]

          def calculate_score(exp):

              attempts = exp["attempts"]

              if attempts == 0:
                  return 0.0

              success_rate = (
                  exp["successes"] /
                  attempts
              )

              failure_rate = (
                  exp["failures"] /
                  attempts
              )

              return round(
                  (success_rate * 2.0)
                  - failure_rate,
                  3
              )

          # ==================================================
          # 8. SELECT BEST SAFE ACTION
          # ==================================================

          selected_action = None
          selected_score = None

          for suggestion in available_actions:

              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              kind = suggestion.get(
                  "kind"
              )

              action = suggestion.get(
                  "action",
                  {}
              )

              if not isinstance(
                  action,
                  dict
              ):
                  continue

              api_method = action.get(
                  "api_method"
              )

              api_path = action.get(
                  "api_path"
              )

              # ----------------------------------------------
              # V5 SAFE ALLOWLIST
              # ----------------------------------------------

              safe_action = (
                  kind == "follow_tag"
                  and
                  api_method == "POST"
                  and
                  isinstance(
                      api_path,
                      str
                  )
                  and
                  api_path.startswith(
                      "/api/v1/tags/"
                  )
                  and
                  api_path.endswith(
                      "/follow"
                  )
              )

              if not safe_action:
                  continue

              exp = get_experience(kind)

              experience_score = (
                  calculate_score(exp)
              )

              suggestion_score = (
                  suggestion.get(
                      "score",
                      0
                  )
              )

              final_score = (
                  float(suggestion_score)
                  +
                  experience_score
              )

              target = suggestion.get(
                  "target",
                  {}
              )

              target_id = (
                  target.get("id")
                  if isinstance(
                      target,
                      dict
                  )
                  else None
              )

              # ----------------------------------------------
              # DUPLICATE PROTECTION
              # ----------------------------------------------

              already_successful = False

              for previous in memory[
                  "actions"
              ]:

                  if (
                      previous.get(
                          "status"
                      ) == "success"
                      and
                      previous.get(
                          "action_kind"
                      ) == kind
                      and
                      previous.get(
                          "target_id"
                      ) == target_id
                  ):
                      already_successful = True
                      break

              if already_successful:
                  continue

              # ----------------------------------------------
              # SELECT BEST ACTION
              # ----------------------------------------------

              if (
                  selected_action is None
                  or
                  final_score > selected_score
              ):

                  selected_action = suggestion
                  selected_score = final_score

          # ==================================================
          # 9. DECISION
          # ==================================================

          now = datetime.now(
              timezone.utc
          ).isoformat()

          decision = {
              "timestamp": now,
              "selected_action": (
                  selected_action
              ),
              "decision_score": (
                  selected_score
              ),
              "suggestion_count": (
                  len(available_actions)
              )
          }

          memory["decisions"].append(
              decision
          )

          # ==================================================
          # 10. EXECUTE
          # ==================================================

          execution_result = None

          if selected_action is None:

              print()
              print(
                  "No new safe action selected."
              )

              execution_result = {
                  "status": "no_action"
              }

          else:

              kind = selected_action.get(
                  "kind"
              )

              action = selected_action[
                  "action"
              ]

              api_path = action[
                  "api_path"
              ]

              target = selected_action.get(
                  "target",
                  {}
              )

              target_id = (
                  target.get("id")
                  if isinstance(
                      target,
                      dict
                  )
                  else None
              )

              print()
              print("====================================")
              print("NØX V5 DECISION")
              print("====================================")
              print(
                  selected_action.get(
                      "title"
                  )
              )
              print(
                  f"Kind: {kind}"
              )
              print(
                  f"Experience score: "
                  f"{selected_score}"
              )
              print(
                  f"API: POST {api_path}"
              )
              print("====================================")

              print()
              print(
                  "NØX is executing..."
              )

              response = requests.post(
                  f"{COLONY_BASE}{api_path}",
                  headers=headers,
                  timeout=30
              )

              print(
                  f"Action response: "
                  f"{response.status_code}"
              )

              if response.status_code == 429:

                  retry_after = (
                      response.headers.get(
                          "Retry-After"
                      )
                  )

                  execution_result = {
                      "status": "rate_limited",
                      "http_status": 429,
                      "retry_after": (
                          retry_after
                      ),
                      "response": (
                          response.text[:2000]
                      )
                  }

                  print(
                      "NØX was rate limited."
                  )

              elif response.status_code >= 400:

                  execution_result = {
                      "status": "failed",
                      "http_status": (
                          response.status_code
                      ),
                      "response": (
                          response.text[:2000]
                      )
                  }

                  print(
                      "Action failed."
                  )

              else:

                  try:
                      response_data = (
                          response.json()
                      )
                  except Exception:
                      response_data = (
                          response.text[:2000]
                      )

                  execution_result = {
                      "status": "success",
                      "http_status": (
                          response.status_code
                      ),
                      "response": response_data
                  }

                  print(
                      "Action successful."
                  )

              # ==================================================
              # 11. UPDATE EXPERIENCE
              # ==================================================

              exp = get_experience(
                  kind
              )

              status = (
                  execution_result[
                      "status"
                  ]
              )

              exp["attempts"] += 1

              if status == "success":

                  exp["successes"] += 1
                  exp["score"] += 2.0

              elif status in (
                  "failed",
                  "rate_limited"
              ):

                  exp["failures"] += 1
                  exp["score"] -= 1.0

              exp["score"] = round(
                  exp["score"],
                  3
              )

              memory["actions"].append({

                  "timestamp": now,

                  "action_kind": kind,

                  "target_id": target_id,

                  "title": (
                      selected_action.get(
                          "title"
                      )
                  ),

                  "api_path": api_path,

                  "status": status,

                  "decision_score": (
                      selected_score
                  )

              })

          # ==================================================
          # 12. LEARNING
          # ==================================================

          memory["learnings"].append({

              "timestamp": now,

              "type": "experience_update",

              "selected_action": (
                  selected_action.get(
                      "title"
                  )
                  if selected_action
                  else None
              ),

              "result": execution_result,

              "experience": memory[
                  "experience"
              ],

              "note": (
                  "NØX updated its experience "
                  "from the result of its action."
              )

          })

          # ==================================================
          # 13. STORE OBSERVATION
          # ==================================================

          memory["observations"].append({

              "timestamp": now,

              "feed": feed_data,

              "new_activity": new_activity,

              "suggestion_count": (
                  len(available_actions)
              ),

              "limits_available": (
                  limits_data
              )

          })

          # ==================================================
          # 14. MEMORY MAINTENANCE
          # ==================================================

          memory["version"] = 5

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["actions"] = (
              memory["actions"][-50:]
          )

          memory["learnings"] = (
              memory["learnings"][-50:]
          )

          # ==================================================
          # 15. SAVE MEMORY
          # ==================================================

          print()
          print(
              "Saving NØX memory..."
          )

          os.makedirs(
              os.path.dirname(
                  MEMORY_FILE
              ),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==================================================
          # 16. FINAL REPORT
          # ==================================================

          print()
          print("====================================")
          print("NØX V5 FINAL REPORT")
          print("====================================")

          if selected_action:

              print(
                  "Selected: "
                  +
                  selected_action.get(
                      "title",
                      "unknown"
                  )
              )

              print(
                  "Score: "
                  +
                  str(
                      selected_score
                  )
              )

          else:

              print(
                  "Selected: none"
              )

          if execution_result:

              print(
                  "Execution: "
                  +
                  execution_result.get(
                      "status",
                      "unknown"
                  )
              )

          print()
          print(
              "Experience:"
          )

          print(
              json.dumps(
                  memory[
                      "experience"
                  ],
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()
          print(
              "NØX V5 Intelligence "
              "completed successfully."
          )

          print(
              "===================================="
          )

          PY

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX V5: experience and learning"
            git push
          fi
