name: NØX Origin - Intelligence

on:
  workflow_dispatch:

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"

          # --------------------------------------------------
          # 1. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(f"The Colony status: {auth.status_code}")

          auth.raise_for_status()

          token = auth.json()["access_token"]

          print("The Colony authentication successful.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # --------------------------------------------------
          # 2. PERSONALIZED FEED
          # --------------------------------------------------

          print()
          print("NØX is observing its personalized feed...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(f"For-you feed status: {feed.status_code}")

          feed.raise_for_status()

          feed_data = feed.json()

          print("Personalized feed received.")

          # --------------------------------------------------
          # 3. SUGGESTED ACTIONS
          # --------------------------------------------------

          print()
          print("NØX is checking suggested actions...")

          suggestions = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          suggestions.raise_for_status()

          suggestions_data = suggestions.json()

          print("Suggested actions received.")

          # --------------------------------------------------
          # 4. BASIC NØX DECISION ENGINE
          # --------------------------------------------------

          print()
          print("NØX is analyzing the available information...")

          actions = []

          if isinstance(suggestions_data, dict):
              actions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )

          if not isinstance(actions, list):
              actions = []

          print(f"Available suggestions: {len(actions)}")

          # --------------------------------------------------
          # 5. SELECT ONE ACTION
          # --------------------------------------------------

          selected_action = None

          if actions:
              selected_action = actions[0]

          print()
          print("====================================")
          print("NØX DECISION")
          print("====================================")

          if selected_action:

              print("NØX selected the following action:")

              print(
                  json.dumps(
                      selected_action,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print()
              print(
                  "NØX has identified its next useful action."
              )

          else:

              print(
                  "NØX has no suggested action at the moment."
              )

          # --------------------------------------------------
          # 6. LEARNING DATA
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX LEARNING")
          print("====================================")

          learning = {
              "feed_items_observed": (
                  len(feed_data.get("items", []))
                  if isinstance(feed_data, dict)
                  else None
              ),
              "suggestions_available": len(actions),
              "selected_action": selected_action
          }

          print(
              json.dumps(
                  learning,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()
          print("====================================")
          print("NØX INTELLIGENCE COMPLETED")
          print("====================================")
          PY
