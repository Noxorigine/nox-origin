name: NØX Origin - Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nox-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NØX Intelligence V3
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          print("====================================")
          print("NØX ORIGIN - INTELLIGENCE V3")
          print("====================================")

          COLONY_API_KEY = os.environ["COLONY_API_KEY"]
          COLONY_BASE = "https://thecolony.ai/api/v1"
          MEMORY_FILE = "memory/nox_memory.json"

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          print()
          print("Loading NØX memory...")

          if os.path.exists(MEMORY_FILE):
              with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                  memory = json.load(f)
          else:
              memory = {
                  "version": 3,
                  "observations": [],
                  "decisions": [],
                  "actions": [],
                  "learnings": []
              }

          memory.setdefault("version", 3)
          memory.setdefault("observations", [])
          memory.setdefault("decisions", [])
          memory.setdefault("actions", [])
          memory.setdefault("learnings", [])

          print(
              f"Previous observations: "
              f"{len(memory['observations'])}"
          )

          print(
              f"Previous decisions: "
              f"{len(memory['decisions'])}"
          )

          print(
              f"Previous actions: "
              f"{len(memory['actions'])}"
          )

          print(
              f"Previous learnings: "
              f"{len(memory['learnings'])}"
          )

          # --------------------------------------------------
          # 2. AUTHENTICATION
          # --------------------------------------------------

          print()
          print("Authenticating with The Colony...")

          auth = requests.post(
              f"{COLONY_BASE}/auth/token",
              json={"api_key": COLONY_API_KEY},
              timeout=30
          )

          print(
              f"The Colony authentication status: "
              f"{auth.status_code}"
          )

          auth.raise_for_status()

          token = auth.json()["access_token"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("The Colony authentication successful.")

          # --------------------------------------------------
          # 3. CHECK NØX CAPABILITIES
          # --------------------------------------------------

          print()
          print("Checking NØX capabilities...")

          capabilities_response = requests.get(
              f"{COLONY_BASE}/me/capabilities",
              headers=headers,
              timeout=30
          )

          print(
              f"Capabilities status: "
              f"{capabilities_response.status_code}"
          )

          if capabilities_response.ok:
              capabilities = capabilities_response.json()
              print("Capabilities successfully received.")
          else:
              print(
                  "Capabilities endpoint unavailable."
              )
              capabilities = {}

          # --------------------------------------------------
          # 4. CHECK LIMITS
          # --------------------------------------------------

          print()
          print("Checking NØX limits...")

          limits_response = requests.get(
              f"{COLONY_BASE}/limits/me",
              headers=headers,
              timeout=30
          )

          print(
              f"Limits status: "
              f"{limits_response.status_code}"
          )

          if limits_response.ok:
              limits = limits_response.json()
              print("Limits successfully received.")
          else:
              print("Limits endpoint unavailable.")
              limits = {}

          # --------------------------------------------------
          # 5. OBSERVE PERSONALIZED FEED
          # --------------------------------------------------

          print()
          print("NØX is observing The Colony...")

          feed = requests.get(
              f"{COLONY_BASE}/feed/for-you",
              headers=headers,
              params={"limit": 25},
              timeout=30
          )

          print(
              f"For-you feed status: "
              f"{feed.status_code}"
          )

          feed.raise_for_status()

          feed_data = feed.json()

          feed_items = []

          if isinstance(feed_data, dict):
              feed_items = feed_data.get("items", [])

          if not isinstance(feed_items, list):
              feed_items = []

          print(
              f"Observed items: "
              f"{len(feed_items)}"
          )

          # --------------------------------------------------
          # 6. GET SUGGESTIONS
          # --------------------------------------------------

          print()
          print("NØX is examining possible actions...")

          suggestions_response = requests.get(
              f"{COLONY_BASE}/suggestions",
              headers=headers,
              params={"limit": 20},
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_response.raise_for_status()

          suggestions_data = suggestions_response.json()

          suggestions = []

          if isinstance(suggestions_data, dict):
              suggestions = suggestions_data.get(
                  "suggestions",
                  suggestions_data.get("items", [])
              )

          if not isinstance(suggestions, list):
              suggestions = []

          print(
              f"Available suggestions: "
              f"{len(suggestions)}"
          )

          # --------------------------------------------------
          # 7. COMPARE WITH MEMORY
          # --------------------------------------------------

          print()
          print(
              "NØX is comparing suggestions "
              "with previous experience..."
          )

          previous_action_ids = set()

          for item in memory["actions"]:

              if not isinstance(item, dict):
                  continue

              action = item.get("action")

              if isinstance(action, dict):

                  action_id = action.get("id")

                  if action_id:
                      previous_action_ids.add(
                          str(action_id)
                      )

          print(
              f"Previously seen action IDs: "
              f"{len(previous_action_ids)}"
          )

          # --------------------------------------------------
          # 8. EVALUATE SUGGESTIONS
          # --------------------------------------------------

          evaluated = []

          for index, suggestion in enumerate(
              suggestions
          ):

              if not isinstance(suggestion, dict):
                  continue

              score = suggestion.get(
                  "score",
                  0
              )

              try:
                  score = float(score)
              except (
                  TypeError,
                  ValueError
              ):
                  score = 0.0

              action_id = suggestion.get("id")

              already_seen = (
                  str(action_id)
                  in previous_action_ids
                  if action_id
                  else False
              )

              adjusted_score = score

              if already_seen:
                  adjusted_score -= 0.10

              evaluated.append({
                  "rank": index + 1,
                  "id": action_id,
                  "title": suggestion.get(
                      "title"
                  ),
                  "kind": suggestion.get(
                      "kind"
                  ),
                  "category": suggestion.get(
                      "category"
                  ),
                  "original_score": score,
                  "already_seen": already_seen,
                  "adjusted_score": round(
                      adjusted_score,
                      4
                  ),
                  "suggestion": suggestion
              })

          evaluated.sort(
              key=lambda x:
                  x["adjusted_score"],
              reverse=True
          )

          # --------------------------------------------------
          # 9. SELECT BEST ACTION
          # --------------------------------------------------

          selected = None

          if evaluated:
              selected = evaluated[0]

          now = datetime.now(
              timezone.utc
          ).isoformat()

          # --------------------------------------------------
          # 10. RECORD OBSERVATION
          # --------------------------------------------------

          observation = {
              "timestamp": now,
              "feed_items": len(feed_items),
              "suggestion_count": len(
                  suggestions
              ),
              "top_suggestions": [
                  {
                      "id": item["id"],
                      "title": item["title"],
                      "kind": item["kind"],
                      "original_score":
                          item["original_score"],
                      "already_seen":
                          item["already_seen"],
                      "adjusted_score":
                          item["adjusted_score"]
                  }
                  for item in evaluated[:5]
              ]
          }

          memory["observations"].append(
              observation
          )

          # --------------------------------------------------
          # 11. DECISION
          # --------------------------------------------------

          if selected:

              selected_suggestion = (
                  selected["suggestion"]
              )

              decision = {
                  "timestamp": now,
                  "selected_action_id":
                      selected["id"],
                  "title":
                      selected["title"],
                  "kind":
                      selected["kind"],
                  "original_score":
                      selected["original_score"],
                  "adjusted_score":
                      selected["adjusted_score"],
                  "already_seen":
                      selected["already_seen"]
              }

              memory["decisions"].append(
                  decision
              )

          else:

              selected_suggestion = None

              memory["decisions"].append({
                  "timestamp": now,
                  "selected_action_id": None,
                  "title": None,
                  "kind": None,
                  "original_score": None,
                  "adjusted_score": None,
                  "already_seen": False
              })

          # --------------------------------------------------
          # 12. SAFETY FILTER
          # --------------------------------------------------

          print()
          print(
              "NØX is checking whether the "
              "selected action is authorised..."
          )

          action_executed = False
          action_result = None
          action_status = "not_executed"

          if selected_suggestion:

              selected_kind = selected_suggestion.get(
                  "kind"
              )

              api_method = selected_suggestion.get(
                  "action",
                  {}
              ).get(
                  "api_method"
              )

              api_path = selected_suggestion.get(
                  "action",
                  {}
              ).get(
                  "api_path"
              )

              print(
                  f"Selected kind: "
                  f"{selected_kind}"
              )

              print(
                  f"Selected API method: "
                  f"{api_method}"
              )

              print(
                  f"Selected API path: "
                  f"{api_path}"
              )

              # ------------------------------------------------
              # ONLY THIS ACTION IS ALLOWED IN V3
              # ------------------------------------------------

              allowed_action = (
                  selected_kind == "follow_tag"
                  and api_method == "POST"
                  and isinstance(api_path, str)
                  and api_path.startswith(
                      "/api/v1/tags/"
                  )
                  and api_path.endswith(
                      "/follow"
                  )
              )

              if allowed_action:

                  print()
                  print(
                      "Action approved by "
                      "NØX safety policy."
                  )

                  # Build the URL ONLY from the
                  # validated path supplied by Colony.
                  action_url = (
                      f"https://thecolony.ai"
                      f"{api_path}"
                  )

                  print(
                      f"Executing: "
                      f"{action_url}"
                  )

                  try:

                      action_response = requests.post(
                          action_url,
                          headers=headers,
                          timeout=30
                      )

                      print(
                          "Action response status: "
                          f"{action_response.status_code}"
                      )

                      # 2xx = executed successfully.
                      if 200 <= (
                          action_response.status_code
                      ) < 300:

                          action_executed = True
                          action_status = "success"

                          try:
                              action_result = (
                                  action_response.json()
                              )
                          except ValueError:
                              action_result = {
                                  "text":
                                  action_response.text
                              }

                          print(
                              "NØX action completed "
                              "successfully."
                          )

                      # Already followed is not a failure
                      # for our learning system.
                      elif action_response.status_code == 409:

                          action_status = (
                              "already_completed"
                          )

                          try:
                              action_result = (
                                  action_response.json()
                              )
                          except ValueError:
                              action_result = {
                                  "text":
                                  action_response.text
                              }

                          print(
                              "The action appears "
                              "to already be completed."
                          )

                      else:

                          action_status = "failed"

                          action_result = {
                              "status_code":
                                  action_response.status_code,
                              "response":
                                  action_response.text
                          }

                          print(
                              "NØX action was rejected."
                          )

                  except requests.RequestException as error:

                      action_status = "failed"

                      action_result = {
                          "error": str(error)
                      }

                      print(
                          "Action request failed:"
                      )

                      print(error)

              else:

                  print()
                  print(
                      "ACTION BLOCKED."
                  )

                  print(
                      "This action is not "
                      "authorised by V3."
                  )

                  action_status = (
                      "blocked_by_policy"
                  )

          else:

              print(
                  "No action selected."
              )

          # --------------------------------------------------
          # 13. SAVE ACTION RESULT
          # --------------------------------------------------

          if selected_suggestion:

              memory["actions"].append({
                  "timestamp": now,
                  "action": selected_suggestion,
                  "status": action_status,
                  "result": action_result
              })

          # --------------------------------------------------
          # 14. LEARNING
          # --------------------------------------------------

          successful = (
              action_status == "success"
              or action_status ==
              "already_completed"
          )

          learning = {
              "timestamp": now,
              "suggestion_count": len(
                  suggestions
              ),
              "new_suggestions": sum(
                  1
                  for item in evaluated
                  if not item["already_seen"]
              ),
              "repeated_suggestions": sum(
                  1
                  for item in evaluated
                  if item["already_seen"]
              ),
              "selected_action":
                  selected["title"]
                  if selected
                  else None,
              "action_status":
                  action_status,
              "successful":
                  successful,
              "note": (
                  "NØX executed only an action "
                  "permitted by the V3 safety "
                  "policy and recorded the result "
                  "for future learning."
              )
          }

          memory["learnings"].append(
              learning
          )

          # --------------------------------------------------
          # 15. KEEP MEMORY SMALL
          # --------------------------------------------------

          memory["observations"] = (
              memory["observations"][-50:]
          )

          memory["decisions"] = (
              memory["decisions"][-50:]
          )

          memory["actions"] = (
              memory["actions"][-50:]
          )

          memory["learnings"] = (
              memory["learnings"][-50:]
          )

          # --------------------------------------------------
          # 16. SAVE MEMORY
          # --------------------------------------------------

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  memory,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "NØX memory updated successfully."
          )

          # --------------------------------------------------
          # 17. FINAL REPORT
          # --------------------------------------------------

          print()
          print("====================================")
          print("NØX V3 RESULT")
          print("====================================")

          if selected:

              print(
                  f"Decision: "
                  f"{selected['title']}"
              )

              print(
                  f"Kind: "
                  f"{selected['kind']}"
              )

              print(
                  f"Score: "
                  f"{selected['adjusted_score']}"
              )

              print(
                  f"Action status: "
                  f"{action_status}"
              )

          else:

              print(
                  "No decision available."
              )

          print()
          print(
              "NØX can execute ONLY "
              "follow_tag actions in V3."
          )

          print(
              "All other actions remain blocked."
          )

          print()
          print(
              "===================================="
          )

          print(
              "NØX INTELLIGENCE V3 COMPLETED"
          )

          print(
              "===================================="
          )

          PY

      # ------------------------------------------------------
      # 18. SAVE MEMORY TO GITHUB
      # ------------------------------------------------------

      - name: Save NØX memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX: V3 action and learning cycle"
            git push
          fi
