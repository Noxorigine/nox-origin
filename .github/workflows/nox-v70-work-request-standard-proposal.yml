name: NØX V70 - Work Request Standard Proposal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v70-work-request-standard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate V70 proposal
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          VERSION = "V70"
          INPUT_FILE = Path("memory/nox_v69_opportunity_learning_audit.json")
          OUTPUT_JSON = Path("memory/nox_v70_work_request_standard_proposal.json")
          OUTPUT_MD = Path("memory/nox_v70_work_request_standard_draft.md")

          if not INPUT_FILE.exists():
              raise FileNotFoundError(
                  f"Required input not found: {INPUT_FILE}"
              )

          with INPUT_FILE.open("r", encoding="utf-8") as f:
              v69 = json.load(f)

          learning = v69.get("learning", {})
          records = v69.get("records", [])

          total_scanned = v69.get("total_scanned", 0)
          suspicious_non_demand = learning.get(
              "suspicious_non_demand_signals", 0
          )
          completed_items = learning.get(
              "completed_items", 0
          )
          strong_signals = learning.get(
              "strong_opportunity_signals", 0
          )
          recovery_signals = learning.get(
              "recovery_signals", 0
          )

          # ---------------------------------------------------------
          # V70 PURPOSE
          # ---------------------------------------------------------
          # V70 does not declare a community standard.
          # It proposes a voluntary machine-readable format based on
          # evidence observed by V69.
          #
          # No publication, contact, bidding or payment is performed.
          # ---------------------------------------------------------

          field_evidence = [
              {
                  "field": "status",
                  "required": True,
                  "reason": "A request must clearly indicate whether the work is still open.",
                  "observed_problem": (
                      f"{completed_items} completed/already-done item(s) were observed "
                      "by V69 and must not be mistaken for open opportunities."
                  ),
                  "evidence_type": "completion_exclusion",
                  "source_version": "V69"
              },
              {
                  "field": "requester",
                  "required": True,
                  "reason": "The source of the request must be identifiable.",
                  "observed_problem": (
                      "Opportunity detection requires distinguishing the person or "
                      "agent requesting work from authors merely discussing a topic."
                  ),
                  "evidence_type": "request_ownership",
                  "source_version": "V69"
              },
              {
                  "field": "title",
                  "required": True,
                  "reason": "A concise title makes the request identifiable and searchable.",
                  "observed_problem": (
                      "V69 encountered many analytical and finding posts where task "
                      "language appeared without an actionable request."
                  ),
                  "evidence_type": "disambiguation",
                  "source_version": "V69"
              },
              {
                  "field": "task",
                  "required": True,
                  "reason": "The actual work to be performed must be explicit.",
                  "observed_problem": (
                      f"{suspicious_non_demand} item(s) contained task-like language "
                      "without sufficient evidence of an open demand."
                  ),
                  "evidence_type": "task_without_demand",
                  "source_version": "V69"
              },
              {
                  "field": "objective",
                  "required": True,
                  "reason": "The requester should explain what outcome is wanted.",
                  "observed_problem": (
                      "Task vocabulary alone cannot reliably distinguish an actionable "
                      "request from technical analysis."
                  ),
                  "evidence_type": "contextual_clarity",
                  "source_version": "V69"
              },
              {
                  "field": "deliverable",
                  "required": True,
                  "reason": "The expected result should be concrete.",
                  "observed_problem": (
                      "A concrete deliverable gives the detector evidence that the "
                      "request concerns actual work rather than discussion."
                  ),
                  "evidence_type": "actionability",
                  "source_version": "V69"
              },
              {
                  "field": "acceptance_criteria",
                  "required": False,
                  "reason": "Clear acceptance criteria can reduce ambiguity about completion.",
                  "observed_problem": (
                      "Completed work must be distinguishable from work that is still "
                      "requested."
                  ),
                  "evidence_type": "completion_boundary",
                  "source_version": "V69"
              },
              {
                  "field": "reward",
                  "required": False,
                  "reason": "A reward field makes compensation explicit when applicable.",
                  "observed_problem": (
                      "V69 confirms that compensation language by itself is not proof "
                      "of an actionable demand."
                  ),
                  "evidence_type": "compensation_context",
                  "source_version": "V69"
              },
              {
                  "field": "deadline",
                  "required": False,
                  "reason": "A deadline helps determine whether the request is currently actionable.",
                  "observed_problem": (
                      "Temporal context can help separate an active request from an "
                      "historical or completed task."
                  ),
                  "evidence_type": "temporal_context",
                  "source_version": "V69"
              },
              {
                  "field": "required_capabilities",
                  "required": False,
                  "reason": "Capabilities help agents determine whether they can perform the task.",
                  "observed_problem": (
                      "V69 observed many technical posts containing capability-related "
                      "language without an actual delegation."
                  ),
                  "evidence_type": "capability_context",
                  "source_version": "V69"
              },
              {
                  "field": "required_inputs",
                  "required": False,
                  "reason": "Inputs clarify what the requester will provide.",
                  "observed_problem": (
                      "Concrete inputs make the boundary between discussion and executable "
                      "work clearer."
                  ),
                  "evidence_type": "execution_context",
                  "source_version": "V69"
              },
              {
                  "field": "application_method",
                  "required": False,
                  "reason": "An explicit response method makes the request actionable without requiring automatic contact.",
                  "observed_problem": (
                      "NØX currently detects opportunities but must not contact requesters "
                      "automatically."
                  ),
                  "evidence_type": "interaction_boundary",
                  "source_version": "V69"
              }
          ]

          standard = {
              "protocol": "WORK_REQUEST",
              "version": "0.1-proposed",
              "status": "PROPOSED",
              "voluntary": True,
              "community_validation_required": True,
              "description": (
                  "A voluntary structured format intended to make genuine open work "
                  "requests easier for agents to identify and evaluate."
              ),
              "fields": {
                  "status": "OPEN",
                  "title": "",
                  "requester": "",
                  "task": "",
                  "objective": "",
                  "deliverable": "",
                  "acceptance_criteria": [],
                  "reward": None,
                  "deadline": None,
                  "required_capabilities": [],
                  "required_inputs": [],
                  "application_method": ""
              },
              "minimum_detection_fields": [
                  "status",
                  "requester",
                  "title",
                  "task",
                  "objective",
                  "deliverable"
              ],
              "recommended_fields": [
                  "acceptance_criteria",
                  "reward",
                  "deadline",
                  "required_capabilities",
                  "required_inputs",
                  "application_method"
              ],
              "evidence_basis": {
                  "source_version": "V69",
                  "total_scanned": total_scanned,
                  "strong_opportunity_signals": strong_signals,
                  "recovery_signals": recovery_signals,
                  "task_without_demand_signals": suspicious_non_demand,
                  "completed_items": completed_items,
                  "interpretation": (
                      "The current sample supports the hypothesis that explicit "
                      "structure may help distinguish open work from analysis, "
                      "findings and completed work. This proposal is not proof "
                      "that community adoption will improve detection."
                  )
              },
              "field_evidence": field_evidence,
              "example": {
                  "status": "OPEN",
                  "title": "Example: build a small data parser",
                  "requester": "@example_requester",
                  "task": "Build a parser for the supplied JSON dataset.",
                  "objective": "Convert the source data into a normalized structure.",
                  "deliverable": "A working parser and short usage instructions.",
                  "acceptance_criteria": [
                      "Parser handles the supplied sample dataset.",
                      "Output matches the requested schema.",
                      "Basic error handling is included."
                  ],
                  "reward": "5,000 sats",
                  "deadline": None,
                  "required_capabilities": [
                      "Python",
                      "JSON"
                  ],
                  "required_inputs": [
                      "Sample dataset",
                      "Target schema"
                  ],
                  "application_method": "Reply to the original request."
              },
              "nox_policy": {
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_used": False,
                  "zero_cost_constraint": True
              },
              "next_validation": {
                  "recommended_version": "V71",
                  "purpose": (
                      "Test the proposed WORK_REQUEST structure against historical "
                      "V69 records and known false-positive cases."
                  ),
                  "human_review_required": True
              }
          }

          result = {
              "version": VERSION,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "mode": "work_request_standard_proposal",
              "objective": (
                  "Convert V69 learning evidence into a voluntary, machine-readable "
                  "WORK_REQUEST proposal without automatic publication or external action."
              ),
              "source": {
                  "version": "V69",
                  "input_file": str(INPUT_FILE),
                  "total_scanned": total_scanned,
                  "learning_summary": learning
              },
              "proposal": standard,
              "records_analyzed": len(records),
              "safety": {
                  "automatic_external_action": False,
                  "automatic_publication": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "metadata_preserved": True
              }
          }

          OUTPUT_JSON.parent.mkdir(parents=True, exist_ok=True)

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          markdown = f"""# NØX Origin — V70 WORK_REQUEST Proposal

          **Status:** PROPOSED  
          **Protocol:** WORK_REQUEST  
          **Version:** 0.1-proposed  
          **Source:** V69 Opportunity Learning Audit

          ## Purpose

          This is a voluntary proposal for a structured work-request format.

          It is **not** an official Colony standard and does not assume authority
          over other agents or users.

          The objective is to make genuine open work easier for agents to
          identify while reducing confusion with analysis, findings,
          discussions, completed work and payment receipts.

          ## Proposed minimum fields

          - `status`
          - `title`
          - `requester`
          - `task`
          - `objective`
          - `deliverable`

          ## Recommended fields

          - `acceptance_criteria`
          - `reward`
          - `deadline`
          - `required_capabilities`
          - `required_inputs`
          - `application_method`

          ## Evidence from V69

          - Total scanned: {total_scanned}
          - Strong opportunity signals: {strong_signals}
          - Recovery signals: {recovery_signals}
          - Task-without-demand signals: {suspicious_non_demand}
          - Completed/already-done items: {completed_items}

          V69 showed that task or compensation vocabulary can appear without
          sufficient evidence of an open request. It also showed that completed
          work must remain distinct from current opportunities.

          Therefore V70 proposes explicit request structure as a hypothesis for
          improving machine detection.

          ## Important limitation

          V70 does **not** claim that this format will be adopted by the Colony
          community or that it will automatically improve opportunity detection.

          That must be tested.

          ## Validation plan

          The next stage should test this structure against:

          1. V69 historical records.
          2. Known V62/V64 false positives.
          3. Genuine open requests when available.
          4. Atypical requests recovered by the V68/V69 logic.

          ## NØX safety constraints

          - No automatic publication.
          - No automatic contact.
          - No automatic bidding.
          - No automatic payment.
          - Gemini disabled.
          - €0 project constraint preserved.

          ## Proposed evolution

          **V71:** historical validation of the WORK_REQUEST proposal.  
          **V72:** false-positive / false-negative comparison.  
          **V73:** controlled refinement if evidence supports it.

          The protocol remains voluntary and subject to human/community validation.
          """

          with OUTPUT_MD.open("w", encoding="utf-8") as f:
              f.write(markdown)

          print("V70 generated successfully.")
          print(f"JSON: {OUTPUT_JSON}")
          print(f"Markdown: {OUTPUT_MD}")
          print("Source: V69")
          print("Automatic publication: disabled")
          print("Automatic contact: disabled")
          print("Automatic bidding: disabled")
          print("Automatic payment: disabled")
          print("Gemini: disabled")
          print("Cost constraint: €0")

          PY

      - name: Commit V70 results
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v70_work_request_standard_proposal.json
          git add memory/nox_v70_work_request_standard_draft.md

          if git diff --cached --quiet; then
            echo "No V70 changes to commit."
          else
            git commit -m "NØX V70 propose WORK_REQUEST standard"
            git push
          fi
