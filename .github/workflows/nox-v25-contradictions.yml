name: NØX Origin - V25 Contradiction Detection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contradiction-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect contradictions locally
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          knowledge = memory.get("knowledge", [])
          principles = memory.get("principles", [])
          hypotheses = memory.get("hypotheses", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(principles, list):
              principles = []

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(contradictions, list):
              contradictions = []

          if not isinstance(history, list):
              history = []

          now = datetime.now(timezone.utc).isoformat()

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).strip().lower()
              )

          # ---------------------------------------------------------
          # 1. Extraire les connaissances textuelles
          # ---------------------------------------------------------

          knowledge_texts = []

          for item in knowledge:
              if isinstance(item, str):
                  knowledge_texts.append(clean(item))

              elif isinstance(item, dict):
                  text = (
                      item.get("text")
                      or item.get("knowledge")
                      or item.get("statement")
                      or ""
                  )

                  if text:
                      knowledge_texts.append(clean(text))

          # Ajouter les principes et hypothèses comme signaux
          # complémentaires sans les considérer comme des preuves.
          principle_texts = []

          for item in principles:
              if isinstance(item, str):
                  principle_texts.append(clean(item))

              elif isinstance(item, dict):
                  text = (
                      item.get("text")
                      or item.get("principle")
                      or item.get("statement")
                      or ""
                  )

                  if text:
                      principle_texts.append(clean(text))

          hypothesis_texts = []

          for item in hypotheses:
              if isinstance(item, dict):
                  text = item.get("hypothesis", "")

                  if text:
                      hypothesis_texts.append(clean(text))

          # ---------------------------------------------------------
          # 2. Détection prudente des oppositions
          # ---------------------------------------------------------

          contradiction_rules = [
              {
                  "topic": "memory",
                  "positive": [
                      "more context",
                      "larger context",
                      "longer context",
                      "deep history"
                  ],
                  "negative": [
                      "context limit",
                      "context window",
                      "memory pressure",
                      "prune memory",
                      "limited memory"
                  ]
              },
              {
                  "topic": "efficiency",
                  "positive": [
                      "more compute",
                      "larger model",
                      "more resources",
                      "higher compute"
                  ],
                  "negative": [
                      "resource constraint",
                      "limited compute",
                      "latency",
                      "efficiency",
                      "resource efficiency"
                  ]
              },
              {
                  "topic": "autonomy",
                  "positive": [
                      "full autonomy",
                      "unrestricted autonomy",
                      "independent agent"
                  ],
                  "negative": [
                      "permission",
                      "bounded autonomy",
                      "security boundary",
                      "restricted access",
                      "guard"
                  ]
              },
              {
                  "topic": "verification",
                  "positive": [
                      "automated",
                      "automatic",
                      "self validation"
                  ],
                  "negative": [
                      "verification",
                      "independent verification",
                      "evidence",
                      "confirmation",
                      "uncertain"
                  ]
              },
              {
                  "topic": "learning",
                  "positive": [
                      "more data",
                      "more examples",
                      "successful trajectories"
                  ],
                  "negative": [
                      "data quality",
                      "sparse reward",
                      "noise",
                      "failed trajectories",
                      "feedback"
                  ]
              }
          ]

          detected = []

          # ---------------------------------------------------------
          # 3. Comparer les connaissances entre elles
          # ---------------------------------------------------------

          for i in range(len(knowledge_texts)):
              for j in range(i + 1, len(knowledge_texts)):

                  first = knowledge_texts[i]
                  second = knowledge_texts[j]

                  for rule in contradiction_rules:

                      positive_hits = [
                          signal
                          for signal in rule["positive"]
                          if signal in first
                      ]

                      negative_hits = [
                          signal
                          for signal in rule["negative"]
                          if signal in second
                      ]

                      reverse_positive_hits = [
                          signal
                          for signal in rule["positive"]
                          if signal in second
                      ]

                      reverse_negative_hits = [
                          signal
                          for signal in rule["negative"]
                          if signal in first
                      ]

                      # Détection dans les deux directions.
                      if positive_hits and negative_hits:
                          detected.append({
                              "topic": rule["topic"],
                              "source_a": knowledge[i],
                              "source_b": knowledge[j],
                              "signals_a": positive_hits,
                              "signals_b": negative_hits,
                              "confidence": "low",
                              "status": "potential",
                              "detected_at": now,
                              "method": "local_rule_contradiction_v25"
                          })

                      elif reverse_positive_hits and reverse_negative_hits:
                          detected.append({
                              "topic": rule["topic"],
                              "source_a": knowledge[i],
                              "source_b": knowledge[j],
                              "signals_a": reverse_negative_hits,
                              "signals_b": reverse_positive_hits,
                              "confidence": "low",
                              "status": "potential",
                              "detected_at": now,
                              "method": "local_rule_contradiction_v25"
                          })

          # ---------------------------------------------------------
          # 4. Éviter les doublons
          # ---------------------------------------------------------

          existing_keys = set()

          for item in contradictions:
              if not isinstance(item, dict):
                  continue

              key = (
                  item.get("topic"),
                  clean(item.get("source_a", "")),
                  clean(item.get("source_b", ""))
              )

              existing_keys.add(key)

          new_contradictions = []

          for item in detected:

              key = (
                  item.get("topic"),
                  clean(item.get("source_a", "")),
                  clean(item.get("source_b", ""))
              )

              if key not in existing_keys:
                  new_contradictions.append(item)
                  existing_keys.add(key)

          contradictions.extend(new_contradictions)

          # ---------------------------------------------------------
          # 5. Ne jamais transformer automatiquement une contradiction
          #    potentielle en vérité.
          #
          # V25 détecte seulement.
          # La contradiction devra être confirmée par une future étape.
          # ---------------------------------------------------------

          contradiction_state = {
              "updated_at": now,
              "total_contradictions": len(contradictions),
              "new_contradictions": len(new_contradictions),
              "status": (
                  "potential_contradictions_detected"
                  if new_contradictions
                  else "no_new_contradictions"
              ),
              "method": "local_rule_based_detection"
          }

          # ---------------------------------------------------------
          # 6. Historique V25
          # ---------------------------------------------------------

          history.append({
              "version": "V25",
              "timestamp": now,
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "hypotheses_total": len(hypotheses),
              "contradictions_total": len(contradictions),
              "new_contradictions": len(new_contradictions),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_rule_based_detection"
          })

          # ---------------------------------------------------------
          # 7. Sauvegarde mémoire
          # ---------------------------------------------------------

          memory["version"] = "V25"
          memory["updated_at"] = now
          memory["contradictions"] = contradictions
          memory["contradiction_state"] = contradiction_state
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 8. Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V25")
          print("==========================================")
          print(f"Knowledge          : {len(knowledge)}")
          print(f"Principles         : {len(principles)}")
          print(f"Hypotheses         : {len(hypotheses)}")
          print(f"Contradictions     : {len(contradictions)}")
          print(f"New contradictions : {len(new_contradictions)}")
          print("------------------------------------------")
          print("Detection          : LOCAL")
          print("Gemini             : NON REQUIS")
          print("Cost               : 0 EUR")
          print("------------------------------------------")
          print("Important          :")
          print("Potential contradictions are NOT treated")
          print("as confirmed facts.")
          print("==========================================")
          PY

      - name: Commit V25 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V25 contradiction detection"

          git push
