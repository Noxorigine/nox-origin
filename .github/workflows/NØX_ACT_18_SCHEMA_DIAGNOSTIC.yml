name: NØX ACT 18 - Schema Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-act18-schema-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Diagnose ACT17 knowledge structure
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          FILE = Path("memory/nox_knowledge_core.json")

          print("=" * 80)
          print("NØX ACT18 - ACT17 SCHEMA DIAGNOSTIC")
          print("=" * 80)

          if not FILE.exists():
              raise SystemExit(f"ERROR: {FILE} not found")

          data = json.loads(FILE.read_text(encoding="utf-8"))

          print(f"\nTop-level type: {type(data).__name__}")

          if isinstance(data, dict):
              print("\nTOP-LEVEL KEYS:")
              for key in data.keys():
                  value = data[key]
                  print(f"  - {key}: {type(value).__name__}", end="")
                  if isinstance(value, (list, dict)):
                      print(f" ({len(value)} items)")
                  else:
                      print()

          knowledge = data.get("knowledge", [])

          if not isinstance(knowledge, list):
              print("\nERROR: 'knowledge' is not a list")
              raise SystemExit(1)

          print("\n" + "=" * 80)
          print(f"KNOWLEDGE ENTRIES: {len(knowledge)}")
          print("=" * 80)

          # ------------------------------------------------------------------
          # Recursive structural inventory
          # ------------------------------------------------------------------

          path_types = Counter()
          path_examples = defaultdict(list)
          key_counts = Counter()

          def walk(value, path=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      key_counts[key] += 1
                      child_path = f"{path}.{key}" if path else key
                      path_types[child_path] += 1

                      if len(path_examples[child_path]) < 3:
                          if isinstance(child, (str, int, float, bool)) or child is None:
                              path_examples[child_path].append(repr(child))
                          else:
                              path_examples[child_path].append(
                                  f"<{type(child).__name__}>"
                              )

                      walk(child, child_path)

              elif isinstance(value, list):
                  child_path = f"{path}[]"
                  path_types[child_path] += 1

                  if len(path_examples[child_path]) < 3:
                      path_examples[child_path].append(
                          f"<list length={len(value)}>"
                      )

                  for item in value:
                      walk(item, child_path)

          for entry in knowledge:
              walk(entry)

          print("\n" + "=" * 80)
          print("MOST COMMON KEYS")
          print("=" * 80)

          for key, count in key_counts.most_common():
              print(f"{count:4}x  {key}")

          # ------------------------------------------------------------------
          # Relevant paths
          # ------------------------------------------------------------------

          keywords = (
              "agent",
              "author",
              "user",
              "username",
              "handle",
              "identity",
              "source",
              "interaction",
              "action",
              "activity",
              "event",
              "behavior",
              "behaviour",
              "result",
              "status",
              "success",
              "failure",
              "evidence",
              "reply",
              "response",
              "comment",
              "post",
              "karma",
          )

          print("\n" + "=" * 80)
          print("RELEVANT STRUCTURAL PATHS")
          print("=" * 80)

          relevant = []

          for path, count in path_types.items():
              lower = path.lower()
              if any(k in lower for k in keywords):
                  relevant.append((path, count))

          for path, count in sorted(relevant, key=lambda x: (-x[1], x[0])):
              examples = " | ".join(path_examples[path])
              print(f"\n{count:4}x  {path}")
              print(f"      examples: {examples}")

          # ------------------------------------------------------------------
          # Entry-level shape statistics
          # ------------------------------------------------------------------

          print("\n" + "=" * 80)
          print("ENTRY-LEVEL STRUCTURE")
          print("=" * 80)

          entry_shapes = Counter()

          for entry in knowledge:
              if isinstance(entry, dict):
                  shape = tuple(sorted(entry.keys()))
                  entry_shapes[shape] += 1
              else:
                  entry_shapes[(type(entry).__name__,)] += 1

          for shape, count in entry_shapes.most_common(20):
              print(f"\n{count} entries:")
              print("  keys =", list(shape))

          # ------------------------------------------------------------------
          # Candidate agent-bearing fields
          # ------------------------------------------------------------------

          agent_values = Counter()

          def collect_agent_values(value, path=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      p = f"{path}.{key}" if path else key
                      key_lower = key.lower()

                      if any(
                          token in key_lower
                          for token in (
                              "agent",
                              "author",
                              "username",
                              "handle",
                              "user",
                          )
                      ):
                          if isinstance(child, str):
                              agent_values[(p, child)] += 1
                          elif isinstance(child, dict):
                              # Print the structure, but don't invent identity.
                              if len(agent_values) < 1000:
                                  agent_values[(p, json.dumps(child, ensure_ascii=False, sort_keys=True))] += 1

                      collect_agent_values(child, p)

              elif isinstance(value, list):
                  for item in value:
                      collect_agent_values(item, f"{path}[]")

          for entry in knowledge:
              collect_agent_values(entry)

          print("\n" + "=" * 80)
          print("AGENT / AUTHOR / USER / HANDLE VALUES")
          print("=" * 80)

          if not agent_values:
              print("NONE FOUND")

          else:
              for (path, value), count in agent_values.most_common(100):
                  print(f"\n{count:4}x  {path}")
                  print(f"      {value}")

          # ------------------------------------------------------------------
          # Result/status inventory
          # ------------------------------------------------------------------

          result_values = Counter()

          def collect_results(value, path=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      p = f"{path}.{key}" if path else key
                      kl = key.lower()

                      if any(
                          token in kl
                          for token in (
                              "result",
                              "status",
                              "success",
                              "failure",
                              "outcome",
                          )
                      ):
                          if isinstance(child, (str, int, float, bool)) or child is None:
                              result_values[(p, str(child))] += 1

                      collect_results(child, p)

              elif isinstance(value, list):
                  for item in value:
                      collect_results(item, f"{path}[]")

          for entry in knowledge:
              collect_results(entry)

          print("\n" + "=" * 80)
          print("RESULT / STATUS VALUES")
          print("=" * 80)

          if not result_values:
              print("NONE FOUND")
          else:
              for (path, value), count in result_values.most_common(100):
                  print(f"{count:4}x  {path} = {value}")

          # ------------------------------------------------------------------
          # Interaction/activity inventory
          # ------------------------------------------------------------------

          interaction_values = Counter()

          def collect_interactions(value, path=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      p = f"{path}.{key}" if path else key
                      kl = key.lower()

                      if any(
                          token in kl
                          for token in (
                              "interaction",
                              "action",
                              "activity",
                              "event",
                              "reply",
                              "response",
                              "comment",
                              "post",
                          )
                      ):
                          if isinstance(child, (str, int, float, bool)) or child is None:
                              interaction_values[(p, str(child))] += 1
                          elif isinstance(child, (dict, list)):
                              interaction_values[(p, f"<{type(child).__name__}>")] += 1

                      collect_interactions(child, p)

              elif isinstance(value, list):
                  for item in value:
                      collect_interactions(item, f"{path}[]")

          for entry in knowledge:
              collect_interactions(entry)

          print("\n" + "=" * 80)
          print("INTERACTION / ACTIVITY STRUCTURE")
          print("=" * 80)

          if not interaction_values:
              print("NONE FOUND")
          else:
              for (path, value), count in interaction_values.most_common(100):
                  print(f"{count:4}x  {path} = {value}")

          # ------------------------------------------------------------------
          # Representative complete entries
          # ------------------------------------------------------------------

          print("\n" + "=" * 80)
          print("REPRESENTATIVE REAL ACT17 ENTRIES")
          print("=" * 80)

          # Pick structurally different examples.
          selected = []
          seen_shapes = set()

          for entry in knowledge:
              if not isinstance(entry, dict):
                  continue

              shape = tuple(sorted(entry.keys()))

              if shape not in seen_shapes:
                  selected.append(entry)
                  seen_shapes.add(shape)

              if len(selected) >= 8:
                  break

          for index, entry in enumerate(selected, 1):
              print(f"\n--- ENTRY {index} ---")
              print(
                  json.dumps(
                      entry,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )[:12000]
              )

          # ------------------------------------------------------------------
          # Focused source/evidence inspection
          # ------------------------------------------------------------------

          print("\n" + "=" * 80)
          print("SOURCES / EVIDENCE EXAMPLES")
          print("=" * 80)

          shown = 0

          for index, entry in enumerate(knowledge):
              if not isinstance(entry, dict):
                  continue

              if "sources" in entry or "evidence" in entry:
                  print(f"\n--- ENTRY INDEX {index} ---")

                  if "sources" in entry:
                      print("sources:")
                      print(
                          json.dumps(
                              entry["sources"],
                              ensure_ascii=False,
                              indent=2
                          )[:6000]
                      )

                  if "evidence" in entry:
                      print("evidence:")
                      print(
                          json.dumps(
                              entry["evidence"],
                              ensure_ascii=False,
                              indent=2
                          )[:6000]
                      )

                  shown += 1

              if shown >= 10:
                  break

          print("\n" + "=" * 80)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 80)
          print("No files were modified.")
          print("No external API was called.")
          print("No Gemini was used.")
          print("=" * 80)
          PY
