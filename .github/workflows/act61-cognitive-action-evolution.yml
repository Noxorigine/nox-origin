name: NØX ACT61 V2 - Cognitive Action Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act61-cognitive-action-evolution
  cancel-in-progress: false

jobs:
  cognitive-action-evolution:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      MEMORY_DIR: memory/act61

      MAX_SUGGESTIONS: "20"
      MAX_FEED_ITEMS: "25"
      MAX_ACTIONS_PER_RUN: "1"

      MIN_ACTION_SCORE: "65"
      MIN_CONTEXT_SCORE: "50"

      PROJECT_COST_EUR: "0"
      EXTERNAL_AI_USED: "false"
      GEMINI_USED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT61 V2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import hashlib
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          from collections import Counter

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"].strip()
          MEMORY_DIR = Path(os.environ["MEMORY_DIR"])

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MIN_ACTION_SCORE = int(os.environ["MIN_ACTION_SCORE"])
          MIN_CONTEXT_SCORE = int(os.environ["MIN_CONTEXT_SCORE"])

          NOW = datetime.now(timezone.utc).isoformat()

          print("=== NØX ACT61 V2 - COGNITIVE ACTION EVOLUTION ===")
          print(f"Timestamp: {NOW}")
          print("MODE: REAL ACTION / ZERO COST / NO EXTERNAL AI")
          print()

          # ============================================================
          # HTTP
          # ============================================================

          SESSION_TOKEN = None

          def request(method, path, payload=None, token=None, timeout=30):
              url = BASE + path

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-ACT61/2.0",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None

              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers,
              )

              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", errors="replace")

                      try:
                          body = json.loads(raw)
                      except Exception:
                          body = {"raw": raw}

                      return {
                          "status": response.status,
                          "body": body,
                          "headers": dict(response.headers),
                      }

              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")

                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw}

                  return {
                      "status": error.code,
                      "body": body,
                      "headers": dict(error.headers),
                  }

              except Exception as error:
                  return {
                      "status": 0,
                      "body": {"error": str(error)},
                      "headers": {},
                  }

          # ============================================================
          # AUTHENTICATION
          #
          # ACT60-compatible flow:
          #
          # POST /api/v1/auth/token
          # {"api_key": "..."}
          #
          # -> access_token
          #
          # Every authenticated request then uses JWT Bearer.
          # ============================================================

          print("=== AUTHENTICATION ===")

          auth = request(
              "POST",
              "/api/v1/auth/token",
              {"api_key": API_KEY},
          )

          print(f"POST /api/v1/auth/token -> {auth['status']}")

          if auth["status"] != 200:
              print("ERROR: Colony JWT authentication failed.")
              print(json.dumps(auth["body"], ensure_ascii=False))

              raise SystemExit(1)

          auth_body = auth["body"]

          SESSION_TOKEN = (
              auth_body.get("access_token")
              or auth_body.get("token")
              or auth_body.get("jwt")
          )

          if not SESSION_TOKEN:
              print("ERROR: Authentication returned no access token.")
              print(json.dumps(auth_body, ensure_ascii=False))
              raise SystemExit(1)

          print("JWT received: yes")

          # ============================================================
          # AUTH VERIFICATION
          # ============================================================

          me_response = request(
              "GET",
              "/api/v1/users/me",
              token=SESSION_TOKEN,
          )

          print(f"GET /api/v1/users/me -> {me_response['status']}")

          if me_response["status"] != 200:
              print("ERROR: JWT verification failed.")
              print(json.dumps(me_response["body"], ensure_ascii=False))
              raise SystemExit(1)

          me = me_response["body"]

          if not isinstance(me, dict):
              print("ERROR: Invalid identity response.")
              raise SystemExit(1)

          identity = (
              me.get("username")
              or me.get("user", {}).get("username")
              if isinstance(me.get("user", {}), dict)
              else None
          )

          identity = identity or "nox_origine"

          print(f"NØX identity: {identity}")
          print()

          # ============================================================
          # HELPERS
          # ============================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, dict):
                  parts = []

                  for key in (
                      "title",
                      "body",
                      "content",
                      "text",
                      "message",
                      "description",
                      "reason",
                      "summary",
                      "action",
                      "name",
                      "username",
                  ):
                      v = value.get(key)

                      if isinstance(v, str):
                          parts.append(v)

                  return " ".join(parts)

              return str(value)

          def normalize(value):
              return re.sub(r"\s+", " ", text(value)).strip()

          def tokens(value):
              return set(
                  word.lower()
                  for word in re.findall(
                      r"[A-Za-zÀ-ÿ0-9_@#-]{3,}",
                      normalize(value),
                  )
              )

          STOPWORDS = {
              "this",
              "that",
              "with",
              "from",
              "have",
              "your",
              "what",
              "when",
              "where",
              "which",
              "would",
              "could",
              "about",
              "into",
              "they",
              "them",
              "their",
              "there",
              "nous",
              "vous",
              "pour",
              "dans",
              "avec",
              "cette",
              "cela",
              "être",
              "est",
              "une",
              "des",
              "les",
              "sur",
              "and",
              "the",
              "are",
              "for",
              "you",
              "agent",
              "agents",
          }

          def meaningful_terms(value, limit=7):
              result = []

              for word in re.findall(
                  r"[A-Za-zÀ-ÿ0-9][A-Za-zÀ-ÿ0-9_-]{3,}",
                  normalize(value).lower(),
              ):
                  if word in STOPWORDS:
                      continue

                  if word not in result:
                      result.append(word)

              return result[:limit]

          def similarity(a, b):
              ta = tokens(a) - STOPWORDS
              tb = tokens(b) - STOPWORDS

              if not ta or not tb:
                  return 0.0

              return len(ta & tb) / max(1, len(ta | tb))

          def stable_id(prefix, *values):
              raw = "|".join(str(v) for v in values)

              return (
                  prefix
                  + "-"
                  + hashlib.sha256(raw.encode("utf-8")).hexdigest()[:18]
              )

          def get_list(body, keys):
              if isinstance(body, list):
                  return body

              if not isinstance(body, dict):
                  return []

              for key in keys:
                  value = body.get(key)

                  if isinstance(value, list):
                      return value

              return []

          def target_from(item):
              if not isinstance(item, dict):
                  return {}

              result = {}

              for key in (
                  "id",
                  "post_id",
                  "comment_id",
                  "parent_id",
                  "user_id",
                  "username",
                  "recipient",
                  "task_id",
                  "colony_id",
              ):
                  if item.get(key) is not None:
                      result[key] = item[key]

              for nested_key in (
                  "target",
                  "post",
                  "author",
                  "user",
                  "task",
                  "resource",
              ):
                  nested = item.get(nested_key)

                  if isinstance(nested, dict):
                      for key in (
                          "id",
                          "post_id",
                          "comment_id",
                          "parent_id",
                          "user_id",
                          "username",
                          "task_id",
                      ):
                          if nested.get(key) is not None:
                              result[key] = nested[key]

              return result

          # ============================================================
          # MEMORY
          # ============================================================

          experience_path = MEMORY_DIR / "experience_ledger.json"

          if experience_path.exists():
              try:
                  experiences = json.loads(
                      experience_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  experiences = []
          else:
              experiences = []

          if not isinstance(experiences, list):
              experiences = []

          experiences = experiences[-300:]

          print("Experience records:", len(experiences))

          # ============================================================
          # PERSONALIZED FEED
          # ============================================================

          feed = request(
              "GET",
              f"/api/v1/feed/for-you?limit={MAX_FEED_ITEMS}",
              token=SESSION_TOKEN,
          )

          print(
              f"GET /api/v1/feed/for-you -> "
              f"{feed['status']}"
          )

          if feed["status"] != 200:
              print("ERROR: Personalized feed unavailable.")
              print(json.dumps(feed["body"], ensure_ascii=False))
              raise SystemExit(1)

          feed_items = get_list(
              feed["body"],
              ("items", "posts", "results"),
          )

          print("For-you items:", len(feed_items))

          # ============================================================
          # SUGGESTIONS
          # ============================================================

          suggestions = request(
              "GET",
              f"/api/v1/suggestions?limit={MAX_SUGGESTIONS}",
              token=SESSION_TOKEN,
          )

          print(
              f"GET /api/v1/suggestions -> "
              f"{suggestions['status']}"
          )

          if suggestions["status"] != 200:
              print("ERROR: Suggestions unavailable.")
              print(json.dumps(suggestions["body"], ensure_ascii=False))
              raise SystemExit(1)

          suggestion_items = get_list(
              suggestions["body"],
              ("suggestions", "items", "actions", "results"),
          )

          print("Suggestions:", len(suggestion_items))

          # ============================================================
          # SINCE
          # ============================================================

          cursor_path = MEMORY_DIR / "since_cursor.txt"

          previous_cursor = (
              cursor_path.read_text(encoding="utf-8").strip()
              if cursor_path.exists()
              else ""
          )

          if previous_cursor:
              since_url = (
                  "/api/v1/since?since="
                  + urllib.parse.quote(previous_cursor, safe="")
              )
          else:
              since_url = "/api/v1/since"

          since = request(
              "GET",
              since_url,
              token=SESSION_TOKEN,
          )

          print(f"GET {since_url} -> {since['status']}")

          if since["status"] != 200:
              print("ERROR: Since endpoint unavailable.")
              print(json.dumps(since["body"], ensure_ascii=False))
              raise SystemExit(1)

          since_body = since["body"]

          recent_messages = get_list(
              since_body,
              ("messages",),
          )

          recent_posts = get_list(
              since_body,
              ("posts",),
          )

          notifications = get_list(
              since_body,
              ("notifications",),
          )

          next_cursor = (
              since_body.get("next_cursor")
              if isinstance(since_body, dict)
              else None
          )

          if next_cursor:
              cursor_path.write_text(
                  str(next_cursor),
                  encoding="utf-8",
              )

          print(
              "Since:",
              f"messages={len(recent_messages)}",
              f"posts={len(recent_posts)}",
              f"notifications={len(notifications)}",
          )

          # ============================================================
          # CANDIDATE EXTRACTION
          # ============================================================

          raw_candidates = []

          for item in suggestion_items:
              if isinstance(item, dict):
                  candidate = dict(item)
                  candidate["_source"] = "suggestion"
                  raw_candidates.append(candidate)

          for item in feed_items:
              if isinstance(item, dict):
                  candidate = dict(item)
                  candidate["_source"] = "feed"
                  raw_candidates.append(candidate)

          for item in recent_messages:
              if isinstance(item, dict):
                  candidate = dict(item)
                  candidate["_source"] = "message"
                  raw_candidates.append(candidate)

          for item in recent_posts:
              if isinstance(item, dict):
                  candidate = dict(item)
                  candidate["_source"] = "post"
                  raw_candidates.append(candidate)

          # ============================================================
          # ACTION DETECTION
          # ============================================================

          def detect_action(item):
              blob = normalize(item).lower()

              # Explicit API/action hints first.
              for key in (
                  "action_type",
                  "type",
                  "kind",
                  "action",
                  "operation",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      v = value.lower()

                      if "comment" in v:
                          return "comment"

                      if "message" in v or "reply" in v or "dm" in v:
                          return "message"

                      if "follow" in v:
                          return "follow"

                      if "vote" in v or "upvote" in v:
                          return "vote"

              if (
                  "comment" in blob
                  or "reply to" in blob
                  or "answer this post" in blob
              ):
                  return "comment"

              if (
                  "message" in blob
                  or "dm" in blob
                  or "direct message" in blob
              ):
                  return "message"

              if "follow" in blob:
                  return "follow"

              if "vote" in blob or "upvote" in blob:
                  return "vote"

              # Suggestions can expose exact call metadata.
              for key in (
                  "endpoint",
                  "url",
                  "path",
                  "api_call",
                  "request",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      v = value.lower()

                      if "/comments" in v:
                          return "comment"

                      if "/messages/send/" in v:
                          return "message"

                      if "/follow" in v:
                          return "follow"

                      if "/vote" in v:
                          return "vote"

                  if isinstance(value, dict):
                      endpoint = normalize(value.get("endpoint") or value.get("path"))

                      if "/comments" in endpoint:
                          return "comment"

                      if "/messages/send/" in endpoint:
                          return "message"

                      if "/follow" in endpoint:
                          return "follow"

                      if "/vote" in endpoint:
                          return "vote"

              return None

          # ============================================================
          # DEDUPLICATION
          # ============================================================

          unique = {}
          for item in raw_candidates:
              item_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("comment_id")
                  or stable_id(
                      "candidate",
                      normalize(item)[:1000],
                  )
              )

              unique[str(item_id)] = item

          # ============================================================
          # COGNITIVE SCORING
          # ============================================================

          candidates = []

          for item_id, item in unique.items():

              action_type = detect_action(item)

              if action_type not in {
                  "comment",
                  "message",
                  "follow",
                  "vote",
              }:
                  continue

              item_text = normalize(item)
              target = target_from(item)

              context_score = 0

              if len(item_text) >= 60:
                  context_score += 20
              elif len(item_text) >= 30:
                  context_score += 10

              if target:
                  context_score += 25

              if item.get("_source") == "suggestion":
                  context_score += 20

              if "?" in item_text:
                  context_score += 15

              if action_type in {"comment", "message"}:
                  context_score += 10

              context_score = min(100, context_score)

              # --------------------------------------------------------
              # EXPERIENCE REUSE
              # --------------------------------------------------------

              reuse_score = 0
              best_experience = None
              best_similarity = 0.0

              for experience in experiences[-100:]:
                  if not isinstance(experience, dict):
                      continue

                  old_context = (
                      experience.get("situation", "")
                      + " "
                      + experience.get("learning", "")
                  )

                  score = similarity(item_text, old_context)

                  if score > best_similarity:
                      best_similarity = score
                      best_experience = experience

              reuse_score = min(
                  100,
                  int(best_similarity * 160),
              )

              # --------------------------------------------------------
              # VALUE
              # --------------------------------------------------------

              action_value = {
                  "comment": 92,
                  "message": 90,
                  "follow": 68,
                  "vote": 65,
              }[action_type]

              # A question or concrete technical subject is more useful
              # than a vague social post.
              if "?" in item_text:
                  action_value += 5

              terms = meaningful_terms(item_text)

              if len(terms) >= 3:
                  action_value += 3

              action_value = min(100, action_value)

              # --------------------------------------------------------
              # REPETITION PENALTY
              # --------------------------------------------------------

              repetition = 0

              for experience in experiences[-60:]:
                  if not isinstance(experience, dict):
                      continue

                  old_action = experience.get("action_type")

                  if old_action != action_type:
                      continue

                  old_situation = experience.get("situation", "")

                  sim = similarity(item_text, old_situation)

                  if sim >= 0.70:
                      repetition = max(
                          repetition,
                          int(sim * 35),
                      )

              # --------------------------------------------------------
              # RISK
              # --------------------------------------------------------

              risk = {
                  "comment": 15,
                  "message": 25,
                  "follow": 8,
                  "vote": 8,
              }[action_type]

              # --------------------------------------------------------
              # FINAL DECISION SCORE
              # --------------------------------------------------------

              score = (
                  int(context_score * 0.35)
                  + int(reuse_score * 0.20)
                  + int(action_value * 0.45)
                  - repetition
                  - int(risk * 0.10)
              )

              score = max(0, min(100, score))

              if context_score < MIN_CONTEXT_SCORE:
                  continue

              if score < MIN_ACTION_SCORE:
                  continue

              action_id = stable_id(
                  "act61",
                  action_type,
                  item_id,
                  item_text[:700],
              )

              candidates.append(
                  {
                      "action_id": action_id,
                      "item_id": str(item_id),
                      "action_type": action_type,
                      "score": score,
                      "context_score": context_score,
                      "reuse_score": reuse_score,
                      "action_value": action_value,
                      "risk": risk,
                      "repetition_penalty": repetition,
                      "source": item.get("_source"),
                      "text": item_text[:2500],
                      "target": target,
                      "raw": item,
                      "best_experience": best_experience,
                  }
              )

          # ============================================================
          # SORT
          # ============================================================

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["reuse_score"],
                  item["context_score"],
                  item["action_value"],
              ),
              reverse=True,
          )

          print()
          print("=== COGNITIVE ACTION SELECTION ===")
          print("Eligible candidates:", len(candidates))

          for candidate in candidates[:10]:
              print(
                  f"- {candidate['action_type']} "
                  f"score={candidate['score']} "
                  f"context={candidate['context_score']} "
                  f"reuse={candidate['reuse_score']} "
                  f"value={candidate['action_value']} "
                  f"risk={candidate['risk']}"
              )

          # ============================================================
          # PREVENT DUPLICATE EXECUTION
          # ============================================================

          previous_action_ids = {
              str(item.get("action_id"))
              for item in experiences[-150:]
              if isinstance(item, dict)
              and item.get("action_id")
          }

          selected = None

          for candidate in candidates:
              if candidate["action_id"] in previous_action_ids:
                  continue

              selected = candidate
              break

          if not selected:
              print("No new eligible action.")
          else:
              print()
              print("SELECTED ACTION:")
              print(
                  selected["action_type"],
                  "score=",
                  selected["score"],
              )

          # ============================================================
          # READ THREAD CONTEXT BEFORE COMMENT
          # ============================================================

          thread_context = []

          if selected and selected["action_type"] == "comment":

              post_id = (
                  selected["target"].get("post_id")
                  or selected["target"].get("id")
              )

              if not post_id:
                  print("Selected comment has no post_id; cancelling action.")
                  selected = None
              else:
                  context_response = request(
                      "GET",
                      f"/api/v1/posts/{urllib.parse.quote(str(post_id), safe='')}/context",
                      token=SESSION_TOKEN,
                  )

                  print(
                      "GET post context ->",
                      context_response["status"],
                  )

                  if context_response["status"] != 200:
                      print("Context read failed; action cancelled.")
                      print(
                          json.dumps(
                              context_response["body"],
                              ensure_ascii=False,
                          )
                      )
                      selected = None
                  else:
                      thread_context = context_response["body"]

          # ============================================================
          # BUILD CONTEXTUAL RESPONSE
          # ============================================================

          def build_comment(candidate, context):
              source = candidate["text"]

              context_text = normalize(context)

              # Prefer actual thread context over suggestion text.
              if context_text:
                  source = context_text[:5000]

              terms = meaningful_terms(source)

              # Detect explicit question.
              question_parts = re.findall(
                  r"[^.!?]{10,}\?",
                  source,
              )

              if question_parts:
                  question = normalize(question_parts[-1])

                  return (
                      f"I’m interested in the practical part of "
                      f"what you’re describing. "
                      f"On {', '.join(terms[:3]) if terms else 'this point'}, "
                      f"what result did you observe after trying it?"
                  )

              if terms:
                  return (
                      f"The connection between "
                      f"{', '.join(terms[:4])} "
                      f"is the part I find most useful here. "
                      f"What concrete result or lesson came from testing it?"
                  )

              return (
                  "I’d like to understand the concrete result behind "
                  "this rather than just the idea. "
                  "What did you observe when you tested it?"
              )

          def build_message(candidate):
              source = candidate["text"]
              terms = meaningful_terms(source)

              if terms:
                  return (
                      f"I’m following your point about "
                      f"{', '.join(terms[:4])}. "
                      f"I’d like to understand the practical result: "
                      f"what did you actually observe after testing it?"
                  )

              return (
                  "I’m interested in the practical result behind this. "
                  "What did you actually observe after testing it?"
              )

          # ============================================================
          # EXECUTION
          #
          # ONLY ONE ACTION.
          #
          # No:
          #   payment
          #   bid
          #   purchase
          #   financial commitment
          # ============================================================

          executed = []
          skipped = []

          if selected:

              action_type = selected["action_type"]
              target = selected["target"]

              # --------------------------------------------------------
              # COMMENT
              # --------------------------------------------------------

              if action_type == "comment":

                  post_id = (
                      target.get("post_id")
                      or target.get("id")
                  )

                  if not post_id:
                      skipped.append(
                          {
                              "action_id": selected["action_id"],
                              "reason": "missing_post_id",
                          }
                      )
                  else:

                      body = build_comment(
                          selected,
                          thread_context,
                      )

                      # Safety against accidental empty/generic payloads.
                      if len(body.strip()) < 50:
                          skipped.append(
                              {
                                  "action_id": selected["action_id"],
                                  "reason": "response_too_short",
                              }
                          )
                      else:

                          parent_id = (
                              target.get("comment_id")
                              or target.get("parent_id")
                          )

                          payload = {
                              "body": body,
                          }

                          if parent_id:
                              payload["parent_id"] = parent_id

                          result = request(
                              "POST",
                              (
                                  "/api/v1/posts/"
                                  + urllib.parse.quote(
                                      str(post_id),
                                      safe="",
                                  )
                                  + "/comments"
                              ),
                              payload,
                              token=SESSION_TOKEN,
                          )

                          print(
                              "POST comment ->",
                              result["status"],
                          )

                          if 200 <= result["status"] < 300:

                              executed.append(
                                  {
                                      "action_id": selected["action_id"],
                                      "action_type": "comment",
                                      "target": target,
                                      "body": body,
                                      "status": result["status"],
                                      "response": result["body"],
                                      "score": selected["score"],
                                  }
                              )

                          else:

                              skipped.append(
                                  {
                                      "action_id": selected["action_id"],
                                      "reason": "comment_failed",
                                      "status": result["status"],
                                      "response": result["body"],
                                  }
                              )

              # --------------------------------------------------------
              # MESSAGE
              # --------------------------------------------------------

              elif action_type == "message":

                  username = (
                      target.get("username")
                      or target.get("recipient")
                  )

                  if not username or username == identity:

                      skipped.append(
                          {
                              "action_id": selected["action_id"],
                              "reason": "invalid_recipient",
                          }
                      )

                  else:

                      body = build_message(selected)

                      result = request(
                          "POST",
                          (
                              "/api/v1/messages/send/"
                              + urllib.parse.quote(
                                  str(username),
                                  safe="",
                              )
                          ),
                          {"body": body},
                          token=SESSION_TOKEN,
                      )

                      print(
                          "POST DM ->",
                          result["status"],
                      )

                      if 200 <= result["status"] < 300:

                          executed.append(
                              {
                                  "action_id": selected["action_id"],
                                  "action_type": "message",
                                  "target": target,
                                  "body": body,
                                  "status": result["status"],
                                  "response": result["body"],
                                  "score": selected["score"],
                              }
                          )

                      else:

                          skipped.append(
                              {
                                  "action_id": selected["action_id"],
                                  "reason": "message_failed",
                                  "status": result["status"],
                                  "response": result["body"],
                              }
                          )

              # --------------------------------------------------------
              # FOLLOW
              # --------------------------------------------------------

              elif action_type == "follow":

                  username = target.get("username")

                  if not username or username == identity:

                      skipped.append(
                          {
                              "action_id": selected["action_id"],
                              "reason": "invalid_follow_target",
                          }
                      )

                  else:

                      result = request(
                          "POST",
                          (
                              "/api/v1/users/"
                              + urllib.parse.quote(
                                  str(username),
                                  safe="",
                              )
                              + "/follow"
                          ),
                          token=SESSION_TOKEN,
                      )

                      print(
                          "POST follow ->",
                          result["status"],
                      )

                      if 200 <= result["status"] < 300:

                          executed.append(
                              {
                                  "action_id": selected["action_id"],
                                  "action_type": "follow",
                                  "target": target,
                                  "status": result["status"],
                                  "response": result["body"],
                                  "score": selected["score"],
                              }
                          )

                      else:

                          skipped.append(
                              {
                                  "action_id": selected["action_id"],
                                  "reason": "follow_failed",
                                  "status": result["status"],
                                  "response": result["body"],
                              }
                          )

              # --------------------------------------------------------
              # VOTE
              # --------------------------------------------------------

              elif action_type == "vote":

                  post_id = (
                      target.get("post_id")
                      or target.get("id")
                  )

                  if not post_id:

                      skipped.append(
                          {
                              "action_id": selected["action_id"],
                              "reason": "missing_vote_target",
                          }
                      )

                  else:

                      result = request(
                          "POST",
                          (
                              "/api/v1/posts/"
                              + urllib.parse.quote(
                                  str(post_id),
                                  safe="",
                              )
                              + "/vote"
                          ),
                          {"value": 1},
                          token=SESSION_TOKEN,
                      )

                      print(
                          "POST vote ->",
                          result["status"],
                      )

                      if 200 <= result["status"] < 300:

                          executed.append(
                              {
                                  "action_id": selected["action_id"],
                                  "action_type": "vote",
                                  "target": target,
                                  "status": result["status"],
                                  "response": result["body"],
                                  "score": selected["score"],
                              }
                          )

                      else:

                          skipped.append(
                              {
                                  "action_id": selected["action_id"],
                                  "reason": "vote_failed",
                                  "status": result["status"],
                                  "response": result["body"],
                              }
                          )

          # ============================================================
          # STORE EXPERIENCE
          # ============================================================

          for action in executed:

              related_candidate = selected

              experiences.append(
                  {
                      "timestamp": NOW,
                      "action_id": action["action_id"],
                      "action_type": action["action_type"],
                      "situation": (
                          related_candidate["text"]
                          if related_candidate
                          else ""
                      ),
                      "context_score": (
                          related_candidate["context_score"]
                          if related_candidate
                          else 0
                      ),
                      "reuse_score": (
                          related_candidate["reuse_score"]
                          if related_candidate
                          else 0
                      ),
                      "decision_score": action.get("score", 0),
                      "action": action.get("body")
                      or action["action_type"],
                      "result": (
                          "HTTP_SUCCESS"
                          if 200 <= action.get("status", 0) < 300
                          else "HTTP_FAILURE"
                      ),
                      "learning": (
                          "Action executed successfully. "
                          "Keep the situation/action relationship "
                          "available for future decisions."
                          if 200 <= action.get("status", 0) < 300
                          else
                          "Action failed. Do not repeat blindly; "
                          "re-evaluate endpoint, context and target."
                      ),
                  }
              )

          experiences = experiences[-300:]

          experience_path.write_text(
              json.dumps(
                  experiences,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          # ============================================================
          # STATE
          # ============================================================

          state = {
              "timestamp": NOW,
              "version": "ACT61-V2",
              "identity": identity,

              "authentication": {
                  "jwt_obtained": True,
                  "identity_verified": True,
              },

              "cognitive_mode": {
                  "observe": True,
                  "contextualize": True,
                  "recall_experience": True,
                  "evaluate": True,
                  "select_action": True,
                  "execute_action": True,
                  "record_result": True,
                  "learn": True,
              },

              "inputs": {
                  "suggestions": len(suggestion_items),
                  "feed_items": len(feed_items),
                  "recent_messages": len(recent_messages),
                  "recent_posts": len(recent_posts),
                  "notifications": len(notifications),
              },

              "decision": {
                  "eligible_candidates": len(candidates),
                  "selected": (
                      selected["action_type"]
                      if selected
                      else None
                  ),
                  "selected_score": (
                      selected["score"]
                      if selected
                      else None
                  ),
              },

              "execution": {
                  "max_actions_per_run": MAX_ACTIONS,
                  "executed": len(executed),
                  "skipped": len(skipped),
              },

              "experience_records": len(experiences),

              "financial_safety": {
                  "payments": False,
                  "bids": False,
                  "spending_sats": False,
                  "financial_commitments": False,
                  "project_cost_eur": 0,
              },

              "external_ai": {
                  "external_ai_used": False,
                  "gemini_used": False,
              },
          }

          (MEMORY_DIR / "cognitive_state.json").write_text(
              json.dumps(
                  state,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (MEMORY_DIR / "last_candidates.json").write_text(
              json.dumps(
                  candidates[:20],
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (MEMORY_DIR / "last_execution.json").write_text(
              json.dumps(
                  executed,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (MEMORY_DIR / "last_skipped.json").write_text(
              json.dumps(
                  skipped,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          # ============================================================
          # HUMAN-READABLE EVOLUTION LOG
          # ============================================================

          evolution_log = MEMORY_DIR / "evolution_log.md"

          with evolution_log.open(
              "a",
              encoding="utf-8",
          ) as log:

              log.write(f"\n## {NOW}\n\n")

              log.write(
                  f"- Authentication: JWT verified\n"
                  f"- Suggestions: {len(suggestion_items)}\n"
                  f"- For-you: {len(feed_items)}\n"
                  f"- Recent messages: {len(recent_messages)}\n"
                  f"- Candidates: {len(candidates)}\n"
                  f"- Selected: "
                  f"{selected['action_type'] if selected else 'none'}\n"
                  f"- Executed: {len(executed)}\n"
                  f"- Skipped: {len(skipped)}\n"
                  f"- Experience records: {len(experiences)}\n"
                  f"- Cost: €0\n"
                  f"- External AI: false\n"
                  f"- Gemini: false\n"
                  f"- Payments: disabled\n"
                  f"- Marketplace bids: disabled\n"
              )

              if selected:
                  log.write(
                      "\n### Decision\n\n"
                      f"- Action: `{selected['action_type']}`\n"
                      f"- Score: `{selected['score']}`\n"
                      f"- Context: `{selected['context_score']}`\n"
                      f"- Experience reuse: `{selected['reuse_score']}`\n"
                      f"- Action value: `{selected['action_value']}`\n"
                  )

              if executed:
                  log.write("\n### Executed\n\n")

                  for action in executed:
                      log.write(
                          f"- `{action['action_type']}` "
                          f"HTTP `{action['status']}` "
                          f"score `{action.get('score', 0)}`\n"
                      )

              if skipped:
                  log.write("\n### Skipped\n\n")

                  for item in skipped:
                      log.write(
                          f"- `{item.get('reason', 'unknown')}`\n"
                      )

          # ============================================================
          # FINAL OUTPUT
          # ============================================================

          print()
          print("=== ACT61 V2 RESULT ===")
          print(f"Identity:            {identity}")
          print("Authentication:      JWT VERIFIED")
          print(f"Suggestions:         {len(suggestion_items)}")
          print(f"For-you items:       {len(feed_items)}")
          print(f"Recent messages:     {len(recent_messages)}")
          print(f"Recent posts:        {len(recent_posts)}")
          print(f"Candidates:          {len(candidates)}")

          if selected:
              print(
                  f"Selected:            "
                  f"{selected['action_type']} "
                  f"(score {selected['score']})"
              )
          else:
              print("Selected:            NONE")

          print(f"Executed actions:    {len(executed)}")
          print(f"Skipped actions:     {len(skipped)}")
          print(f"Experience records:  {len(experiences)}")

          print()
          print("COST:                 €0")
          print("EXTERNAL_AI:          false")
          print("GEMINI:               false")
          print("PAYMENTS:             disabled")
          print("MARKETPLACE_BIDS:     disabled")
          print()

          if executed:
              print("REAL ACTION EXECUTED: YES")
          else:
              print("REAL ACTION EXECUTED: NO")

          PY

      - name: Commit ACT61 cognitive evolution
        run: |
          set -euo pipefail

          git config user.name "NØX Cognitive Evolution"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/act61

          if git diff --cached --quiet; then
            echo "No ACT61 memory changes."
            exit 0
          fi

          git commit -m "feat(act61): evolve cognitive action loop"
          git push
