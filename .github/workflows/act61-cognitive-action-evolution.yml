name: NØX ACT61 V4 - Cognitive Action Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act61-cognitive-action-evolution
  cancel-in-progress: false

jobs:
  cognitive-action-evolution:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      MEMORY_DIR: memory/act61
      MAX_SUGGESTIONS: "20"
      MAX_FEED_ITEMS: "25"
      MAX_ACTIONS_PER_RUN: "1"
      MIN_ACTION_SCORE: "60"
      MIN_CONTEXT_SCORE: "45"
      PROJECT_COST_EUR: "0"
      EXTERNAL_AI_USED: "false"
      GEMINI_USED: "false"
      PAYMENTS_ENABLED: "false"
      MARKETPLACE_BIDS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cognitive Action Evolution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${MEMORY_DIR}"

          python - <<'PY'
          import json
          import os
          import re
          import hashlib
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          MEMORY_DIR = Path(os.environ["MEMORY_DIR"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MIN_ACTION_SCORE = int(os.environ["MIN_ACTION_SCORE"])
          MIN_CONTEXT_SCORE = int(os.environ["MIN_CONTEXT_SCORE"])

          API_KEY = os.environ["COLONY_API_KEY"]

          NOW = datetime.now(timezone.utc).isoformat()

          print("=== NØX ACT61 V4 - COGNITIVE ACTION EVOLUTION ===")
          print(f"Timestamp: {NOW}")
          print("MODE: REAL ACTION / ZERO COST / NO EXTERNAL AI")
          print()

          def json_save(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )

          def json_load(path, default):
              try:
                  if path.exists():
                      return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  pass
              return default

          def request(method, path, token, payload=None, params=None):
              url = BASE + path

              if params:
                  encoded = urllib.parse.urlencode(params)
                  url += ("&" if "?" in url else "?") + encoded

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "NOX-ACT61/4.0"
              }

              body = None

              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method.upper()
              )

              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      try:
                          data = json.loads(raw)
                      except Exception:
                          data = raw

                      return response.status, data

              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", errors="replace")

                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = raw

                  return e.code, data

              except Exception as e:
                  return 0, {"error": str(e)}

          def recursive_values(obj, max_depth=5, depth=0):
              if depth > max_depth:
                  return []

              values = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      values.append((str(key), value))
                      values.extend(
                          recursive_values(value, max_depth, depth + 1)
                      )

              elif isinstance(obj, list):
                  for value in obj:
                      values.extend(
                          recursive_values(value, max_depth, depth + 1)
                      )

              return values

          def first_value(obj, wanted_keys):
              wanted = {str(x).lower() for x in wanted_keys}

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if str(key).lower() in wanted:
                          return value

                  for value in obj.values():
                      found = first_value(value, wanted_keys)
                      if found is not None:
                          return found

              elif isinstance(obj, list):
                  for value in obj:
                      found = first_value(value, wanted_keys)
                      if found is not None:
                          return found

              return None

          def flatten_text(obj):
              parts = []

              def walk(value):
                  if isinstance(value, str):
                      parts.append(value)
                  elif isinstance(value, dict):
                      for k, v in value.items():
                          if k.lower() not in {
                              "authorization",
                              "token",
                              "api_key",
                              "access_token"
                          }:
                              walk(v)
                  elif isinstance(value, list):
                      for v in value:
                          walk(v)

              walk(obj)

              return " ".join(parts)

          def normalize_list(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "suggestions",
                      "items",
                      "data",
                      "results",
                      "actions"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          def extract_id(obj, names):
              value = first_value(obj, names)

              if isinstance(value, (str, int)):
                  return str(value)

              return None

          def extract_username(obj):
              return extract_id(
                  obj,
                  [
                      "username",
                      "user_name",
                      "author_username",
                      "target_username",
                      "recipient_username"
                  ]
              )

          def extract_post_id(obj):
              return extract_id(
                  obj,
                  [
                      "post_id",
                      "postId",
                      "target_post_id",
                      "targetPostId"
                  ]
              )

          def extract_comment_id(obj):
              return extract_id(
                  obj,
                  [
                      "comment_id",
                      "commentId",
                      "target_comment_id",
                      "targetCommentId"
                  ]
              )

          def extract_colony_id(obj):
              return extract_id(
                  obj,
                  [
                      "colony_id",
                      "colonyId",
                      "target_colony_id",
                      "targetColonyId"
                  ]
              )

          def extract_action_descriptor(suggestion):
              """
              ACT61 V4 deliberately searches for the platform-provided
              action descriptor instead of assuming one fixed schema.
              """

              descriptor = {}

              candidate_keys = {
                  "action",
                  "api",
                  "api_call",
                  "apiCall",
                  "call",
                  "request",
                  "http",
                  "endpoint",
                  "execute",
                  "execution",
                  "operation"
              }

              def walk(value, depth=0):
                  if depth > 6:
                      return

                  if isinstance(value, dict):
                      local = {}

                      for key, val in value.items():
                          low = str(key).lower()

                          if low in {
                              "method",
                              "http_method",
                              "verb"
                          } and isinstance(val, str):
                              local["method"] = val.upper()

                          elif low in {
                              "path",
                              "endpoint",
                              "url",
                              "uri",
                              "route"
                          } and isinstance(val, str):
                              local["path"] = val

                          elif low in {
                              "body",
                              "payload",
                              "json",
                              "data"
                          } and isinstance(val, (dict, list, str)):
                              local["body"] = val

                          elif low in {
                              "params",
                              "query",
                              "query_params",
                              "queryParams"
                          } and isinstance(val, (dict, list)):
                              local["params"] = val

                      if "method" in local or "path" in local:
                          descriptor.update(local)

                      for key, val in value.items():
                          if (
                              str(key) in candidate_keys
                              or str(key).lower() in {
                                  x.lower() for x in candidate_keys
                              }
                          ):
                              walk(val, depth + 1)
                          elif isinstance(val, (dict, list)):
                              walk(val, depth + 1)

                  elif isinstance(value, list):
                      for item in value:
                          walk(item, depth + 1)

              walk(suggestion)

              return descriptor

          def extract_path_from_text(text):
              if not text:
                  return None

              match = re.search(
                  r"(?:GET|POST|PUT|PATCH|DELETE)\s+"
                  r"(/api/v1/[A-Za-z0-9_./{}?=&<>:-]+)",
                  text,
                  re.IGNORECASE
              )

              if match:
                  return match.group(1)

              match = re.search(
                  r"(/api/v1/[A-Za-z0-9_./{}?=&<>:-]+)",
                  text
              )

              if match:
                  return match.group(1)

              return None

          def extract_method_from_text(text):
              if not text:
                  return None

              match = re.search(
                  r"\b(GET|POST|PUT|PATCH|DELETE)\b",
                  text,
                  re.IGNORECASE
              )

              return match.group(1).upper() if match else None

          def infer_action_type(path, text):
              source = f"{path or ''} {text or ''}".lower()

              if "/comments" in source:
                  return "comment"

              if "/messages/send/" in source:
                  return "message"

              if "/follow" in source:
                  return "follow"

              if "/vote" in source:
                  return "vote"

              if "/join" in source:
                  return "join"

              return "unknown"

          def resolve_path(path, suggestion):
              if not path:
                  return None

              replacements = {
                  "{post_id}": extract_post_id(suggestion),
                  "<post_id>": extract_post_id(suggestion),
                  "{comment_id}": extract_comment_id(suggestion),
                  "<comment_id>": extract_comment_id(suggestion),
                  "{username}": extract_username(suggestion),
                  "<username>": extract_username(suggestion),
                  "{user_id}": extract_id(
                      suggestion,
                      ["user_id", "userId", "target_user_id"]
                  ),
                  "<user_id>": extract_id(
                      suggestion,
                      ["user_id", "userId", "target_user_id"]
                  ),
                  "{colony_id}": extract_colony_id(suggestion),
                  "<colony_id>": extract_colony_id(suggestion)
              }

              for token, value in replacements.items():
                  if token in path:
                      if not value:
                          return None
                      path = path.replace(token, value)

              if not path.startswith("/api/v1/"):
                  return None

              return path

          def meaningful_terms(suggestion):
              text = flatten_text(suggestion).lower()

              stop = {
                  "the", "and", "that", "this", "with", "from",
                  "what", "your", "you", "are", "for", "about",
                  "into", "have", "has", "how", "can", "could",
                  "would", "should", "will", "just", "next",
                  "action", "suggestion", "reply", "respond"
              }

              words = re.findall(r"[a-zA-Z0-9_À-ÿ-]{4,}", text)

              result = []

              for word in words:
                  if word not in stop and word not in result:
                      result.append(word)

                  if len(result) >= 8:
                      break

              return result

          def context_score(suggestion, action_type, descriptor):
              score = 0

              text = flatten_text(suggestion).lower()

              if action_type != "unknown":
                  score += 20

              if descriptor.get("path"):
                  score += 20

              if descriptor.get("method"):
                  score += 10

              if extract_post_id(suggestion):
                  score += 15

              if extract_comment_id(suggestion):
                  score += 10

              if extract_username(suggestion):
                  score += 10

              if meaningful_terms(suggestion):
                  score += 10

              if any(
                  term in text
                  for term in [
                      "mention",
                      "question",
                      "reply",
                      "respond",
                      "dm",
                      "message",
                      "comment",
                      "answer"
                  ]
              ):
                  score += 10

              return min(score, 100)

          def action_value(suggestion, action_type):
              text = flatten_text(suggestion).lower()
              score = 0

              if action_type in {"comment", "message"}:
                  score += 30

              elif action_type == "follow":
                  score += 18

              elif action_type == "vote":
                  score += 12

              elif action_type == "join":
                  score += 10

              if any(
                  x in text
                  for x in [
                      "question",
                      "asking",
                      "asks",
                      "help",
                      "reply",
                      "respond",
                      "mention",
                      "collaborat",
                      "research",
                      "technical",
                      "finding"
                  ]
              ):
                  score += 20

              if any(
                  x in text
                  for x in [
                      "profile gap",
                      "complete your profile"
                  ]
              ):
                  score += 5

              return min(score, 50)

          def repetition_penalty(suggestion, ledger):
              fingerprint_source = flatten_text(suggestion).lower()
              fingerprint = hashlib.sha256(
                  re.sub(r"\s+", " ", fingerprint_source).encode(
                      "utf-8"
                  )
              ).hexdigest()[:16]

              recent = ledger[-20:]

              for record in recent:
                  if record.get("fingerprint") == fingerprint:
                      return 35, fingerprint

              terms = set(meaningful_terms(suggestion))

              if not terms:
                  return 0, fingerprint

              for record in recent:
                  previous_terms = set(record.get("terms", []))

                  if previous_terms:
                      overlap = len(terms & previous_terms) / max(
                          len(terms | previous_terms),
                          1
                      )

                      if overlap >= 0.65:
                          return 20, fingerprint

              return 0, fingerprint

          def risk_penalty(action_type, path):
              if not path:
                  return 40

              source = path.lower()

              forbidden = [
                  "/tips/",
                  "/pay",
                  "/payment",
                  "/invoice",
                  "/bid",
                  "/bids",
                  "/marketplace",
                  "/wallet",
                  "/withdraw",
                  "/transfer"
              ]

              if any(x in source for x in forbidden):
                  return 100

              if action_type in {
                  "comment",
                  "message",
                  "follow",
                  "vote",
                  "join"
              }:
                  return 0

              return 25

          def build_comment_body(suggestion):
              terms = meaningful_terms(suggestion)

              if terms:
                  topic = ", ".join(terms[:3])
                  return (
                      f"I’m looking at this from the {topic} angle. "
                      f"What part of this would you consider the strongest "
                      f"evidence or the most useful next step?"
                  )

              return (
                  "I’m interested in the reasoning behind this. "
                  "What evidence or next step would you consider most useful?"
              )

          def build_message_body(suggestion):
              terms = meaningful_terms(suggestion)

              if terms:
                  topic = ", ".join(terms[:3])
                  return (
                      f"I picked this up because of the {topic} context. "
                      f"What would you consider the most useful next step "
                      f"to explore together?"
                  )

              return (
                  "I picked this up because the context looks relevant. "
                  "What would you consider the most useful next step?"
              )

          def build_payload(action_type, suggestion, descriptor):
              existing = descriptor.get("body")

              if isinstance(existing, dict):
                  payload = dict(existing)
              elif isinstance(existing, list):
                  return existing
              else:
                  payload = {}

              if action_type == "comment":
                  if not payload.get("body"):
                      payload["body"] = build_comment_body(suggestion)

                  parent_id = extract_comment_id(suggestion)

                  if parent_id and not payload.get("parent_id"):
                      payload["parent_id"] = parent_id

                  return payload

              if action_type == "message":
                  if not payload.get("body"):
                      payload["body"] = build_message_body(suggestion)

                  return payload

              if action_type == "vote":
                  if "value" not in payload:
                      payload["value"] = 1

                  return payload

              return payload if payload else None

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          print("=== AUTHENTICATION ===")

          status, auth = request(
              "POST",
              "/api/v1/auth/token",
              "",
              {"api_key": API_KEY}
          )

          print(f"POST /api/v1/auth/token -> {status}")

          if status != 200:
              raise RuntimeError(
                  f"Authentication failed: {status} {auth}"
              )

          jwt = auth.get("access_token")

          if not jwt:
              raise RuntimeError("Authentication returned no access_token.")

          print("JWT received: yes")

          status, me = request(
              "GET",
              "/api/v1/users/me",
              jwt
          )

          print(f"GET /api/v1/users/me -> {status}")

          if status != 200:
              raise RuntimeError(
                  f"Identity check failed: {status} {me}"
              )

          identity = (
              me.get("username")
              or me.get("user", {}).get("username")
              or "unknown"
          )

          print(f"NØX identity: {identity}")
          print()

          # ------------------------------------------------------------
          # LOAD MEMORY
          # ------------------------------------------------------------

          ledger_path = MEMORY_DIR / "experience_ledger.json"

          ledger_data = json_load(
              ledger_path,
              {
                  "version": 4,
                  "records": []
              }
          )

          ledger = ledger_data.get("records", [])

          print(f"Experience records: {len(ledger)}")

          # ------------------------------------------------------------
          # FETCH MACHINE-READABLE PLATFORM INSTRUCTIONS
          # ------------------------------------------------------------

          print()
          print("=== PLATFORM SELF-DESCRIPTION ===")

          instruction_status, instructions = request(
              "GET",
              "/api/v1/instructions",
              jwt
          )

          print(
              f"GET /api/v1/instructions -> "
              f"{instruction_status}"
          )

          instructions_available = instruction_status == 200

          if instructions_available:
              instruction_path = MEMORY_DIR / "last_instructions_snapshot.json"

              json_save(
                  instruction_path,
                  {
                      "timestamp": NOW,
                      "status": instruction_status,
                      "instructions": instructions
                  }
              )

              print("Machine-readable instructions: AVAILABLE")
          else:
              print(
                  "Machine-readable instructions: "
                  "UNAVAILABLE - continuing with live suggestions"
              )

          # ------------------------------------------------------------
          # FEED
          # ------------------------------------------------------------

          print()
          print("=== INPUTS ===")

          feed_status, feed = request(
              "GET",
              "/api/v1/feed/for-you",
              jwt,
              params={"limit": MAX_FEED_ITEMS}
          )

          print(
              f"GET /api/v1/feed/for-you -> "
              f"{feed_status}"
          )

          feed_items = normalize_list(feed)

          print(f"For-you items: {len(feed_items)}")

          # ------------------------------------------------------------
          # SUGGESTIONS
          # ------------------------------------------------------------

          suggestions_status, suggestions_response = request(
              "GET",
              "/api/v1/suggestions",
              jwt,
              params={"limit": MAX_SUGGESTIONS}
          )

          print(
              f"GET /api/v1/suggestions -> "
              f"{suggestions_status}"
          )

          if suggestions_status != 200:
              raise RuntimeError(
                  f"Suggestions endpoint failed: "
                  f"{suggestions_status} {suggestions_response}"
              )

          suggestions = normalize_list(suggestions_response)

          print(f"Suggestions received: {len(suggestions)}")

          # ------------------------------------------------------------
          # SINCE
          # ------------------------------------------------------------

          since_path = MEMORY_DIR / "since_timestamp.txt"

          if since_path.exists():
              previous_since = since_path.read_text(
                  encoding="utf-8"
              ).strip()

              if previous_since:
                  since_status, since_response = request(
                      "GET",
                      "/api/v1/since",
                      jwt,
                      params={"since": previous_since}
                  )

                  print(
                      f"GET /api/v1/since -> "
                      f"{since_status}"
                  )

                  if since_status == 200:
                      recent_messages = normalize_list(
                          since_response.get("messages", [])
                      )

                      recent_posts = normalize_list(
                          since_response.get("posts", [])
                      )

                      notifications = normalize_list(
                          since_response.get("notifications", [])
                      )

                      next_cursor = (
                          since_response.get("next_cursor")
                          or since_response.get("cursor")
                          or since_response.get("since")
                      )

                      if next_cursor:
                          since_path.write_text(
                              str(next_cursor),
                              encoding="utf-8"
                          )

                  else:
                      print(
                          "WARNING: /since unavailable; "
                          "continuing with suggestions/feed."
                      )

                      recent_messages = []
                      recent_posts = []
                      notifications = []

              else:
                  recent_messages = []
                  recent_posts = []
                  notifications = []

          else:
              # Bootstrap without calling /since without a parameter.
              since_path.write_text(
                  NOW,
                  encoding="utf-8"
              )

              print("Since: BOOTSTRAP")

              recent_messages = []
              recent_posts = []
              notifications = []

          # ------------------------------------------------------------
          # RAW SUGGESTION DIAGNOSTIC
          # ------------------------------------------------------------

          diagnostic_path = MEMORY_DIR / "last_suggestions_raw.json"

          json_save(
              diagnostic_path,
              {
                  "timestamp": NOW,
                  "status": suggestions_status,
                  "count": len(suggestions),
                  "suggestions": suggestions
              }
          )

          print()
          print("=== SUGGESTION STRUCTURE ===")

          if suggestions:
              for index, suggestion in enumerate(
                  suggestions[:MAX_SUGGESTIONS],
                  start=1
              ):
                  descriptor = extract_action_descriptor(
                      suggestion
                  )

                  text = flatten_text(suggestion)

                  method = (
                      descriptor.get("method")
                      or extract_method_from_text(text)
                      or "?"
                  )

                  path = (
                      descriptor.get("path")
                      or extract_path_from_text(text)
                      or "?"
                  )

                  action_type = infer_action_type(
                      path,
                      text
                  )

                  print(
                      f"[{index:02d}] "
                      f"type={action_type} "
                      f"method={method} "
                      f"path={path}"
                  )

          else:
              print("No suggestions returned.")

          # ------------------------------------------------------------
          # CANDIDATE CONSTRUCTION
          # ------------------------------------------------------------

          print()
          print("=== COGNITIVE ACTION SELECTION ===")

          candidates = []

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):
              text = flatten_text(suggestion)

              descriptor = extract_action_descriptor(
                  suggestion
              )

              raw_path = (
                  descriptor.get("path")
                  or extract_path_from_text(text)
              )

              method = (
                  descriptor.get("method")
                  or extract_method_from_text(text)
              )

              resolved_path = resolve_path(
                  raw_path,
                  suggestion
              )

              action_type = infer_action_type(
                  resolved_path,
                  text
              )

              if (
                  action_type == "unknown"
                  or not resolved_path
                  or not method
              ):
                  continue

              if method not in {
                  "GET",
                  "POST",
                  "PUT",
                  "PATCH",
                  "DELETE"
              }:
                  continue

              # ACT61 is an action layer, not a payment layer.
              if any(
                  forbidden in resolved_path.lower()
                  for forbidden in [
                      "/tips/",
                      "/pay",
                      "/payment",
                      "/invoice",
                      "/bid",
                      "/bids",
                      "/marketplace",
                      "/wallet",
                      "/withdraw",
                      "/transfer"
                  ]
              ):
                  continue

              context = context_score(
                  suggestion,
                  action_type,
                  descriptor
              )

              value = action_value(
                  suggestion,
                  action_type
              )

              repetition, fingerprint = repetition_penalty(
                  suggestion,
                  ledger
              )

              risk = risk_penalty(
                  action_type,
                  resolved_path
              )

              total = (
                  context
                  + value
                  - repetition
                  - risk
              )

              candidate = {
                  "suggestion_index": index,
                  "action_type": action_type,
                  "method": method,
                  "path": resolved_path,
                  "descriptor": descriptor,
                  "context_score": context,
                  "action_value": value,
                  "repetition_penalty": repetition,
                  "risk_penalty": risk,
                  "score": total,
                  "fingerprint": fingerprint,
                  "terms": meaningful_terms(suggestion),
                  "suggestion": suggestion
              }

              candidates.append(candidate)

          candidates.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          print(
              f"Executable candidates discovered: "
              f"{len(candidates)}"
          )

          for candidate in candidates:
              print(
                  "  "
                  f"{candidate['action_type']} "
                  f"{candidate['method']} "
                  f"{candidate['path']} "
                  f"score={candidate['score']} "
                  f"context={candidate['context_score']} "
                  f"value={candidate['action_value']} "
                  f"repeat={candidate['repetition_penalty']} "
                  f"risk={candidate['risk_penalty']}"
              )

          # ------------------------------------------------------------
          # CANDIDATE MEMORY
          # ------------------------------------------------------------

          json_save(
              MEMORY_DIR / "last_candidates.json",
              {
                  "timestamp": NOW,
                  "candidate_count": len(candidates),
                  "candidates": candidates
              }
          )

          eligible = [
              c for c in candidates
              if c["context_score"] >= MIN_CONTEXT_SCORE
              and c["score"] >= MIN_ACTION_SCORE
              and c["risk_penalty"] < 100
          ]

          print(
              f"Eligible candidates: "
              f"{len(eligible)}"
          )

          selected = (
              eligible[0]
              if eligible
              else None
          )

          # ------------------------------------------------------------
          # DECISION
          # ------------------------------------------------------------

          if not selected:
              print()
              print("DECISION: NONE")
              print(
                  "Reason: no suggestion passed the "
                  "cognitive/context/repetition/risk gates."
              )

              json_save(
                  MEMORY_DIR / "last_skipped.json",
                  {
                      "timestamp": NOW,
                      "reason": (
                          "NO_ELIGIBLE_CANDIDATE"
                      ),
                      "suggestions": len(suggestions),
                      "candidates": len(candidates),
                      "eligible": len(eligible)
                  }
              )

              execution_result = {
                  "timestamp": NOW,
                  "selected": None,
                  "executed": False,
                  "reason": "NO_ELIGIBLE_CANDIDATE"
              }

          else:
              print()
              print("SELECTED ACTION")
              print(
                  f"Type:        {selected['action_type']}"
              )
              print(
                  f"Method:      {selected['method']}"
              )
              print(
                  f"Path:        {selected['path']}"
              )
              print(
                  f"Score:       {selected['score']}"
              )
              print(
                  f"Context:     {selected['context_score']}"
              )
              print(
                  f"Action value:{selected['action_value']}"
              )
              print(
                  f"Repetition:  {selected['repetition_penalty']}"
              )
              print(
                  f"Risk:        {selected['risk_penalty']}"
              )

              action_type = selected["action_type"]
              descriptor = selected["descriptor"]
              suggestion = selected["suggestion"]
              method = selected["method"]
              path = selected["path"]

              payload = build_payload(
                  action_type,
                  suggestion,
                  descriptor
              )

              # --------------------------------------------------------
              # SAFETY / ACTION VALIDATION
              # --------------------------------------------------------

              allowed_paths = [
                  "/api/v1/posts/",
                  "/api/v1/messages/send/",
                  "/api/v1/users/",
                  "/api/v1/colonies/"
              ]

              allowed_action = (
                  any(
                      path.startswith(prefix)
                      for prefix in allowed_paths
                  )
                  and action_type in {
                      "comment",
                      "message",
                      "follow",
                      "vote",
                      "join"
                  }
              )

              if not allowed_action:
                  print(
                      "ACTION BLOCKED: "
                      "path/action not in ACT61 allowlist."
                  )

                  execution_result = {
                      "timestamp": NOW,
                      "selected": selected,
                      "executed": False,
                      "reason": "ACTION_NOT_ALLOWLISTED"
                  }

              elif method == "GET":
                  print(
                      "ACTION BLOCKED: "
                      "GET is read-only and is not a real "
                      "social action for ACT61."
                  )

                  execution_result = {
                      "timestamp": NOW,
                      "selected": selected,
                      "executed": False,
                      "reason": "READ_ONLY_ACTION"
                  }

              else:
                  # ----------------------------------------------------
                  # COMMENT CONTEXT GATE
                  # ----------------------------------------------------

                  if action_type == "comment":
                      post_id = extract_post_id(
                          suggestion
                      )

                      if not post_id:
                          print(
                              "ACTION BLOCKED: "
                              "comment target post_id missing."
                          )

                          execution_result = {
                              "timestamp": NOW,
                              "selected": selected,
                              "executed": False,
                              "reason": (
                                  "MISSING_POST_ID"
                              )
                          }

                      else:
                          context_status, context_response = request(
                              "GET",
                              f"/api/v1/posts/{post_id}/context",
                              jwt
                          )

                          print(
                              f"GET /api/v1/posts/"
                              f"{post_id}/context -> "
                              f"{context_status}"
                          )

                          if context_status != 200:
                              print(
                                  "ACTION BLOCKED: "
                                  "thread context unavailable."
                              )

                              execution_result = {
                                  "timestamp": NOW,
                                  "selected": selected,
                                  "executed": False,
                                  "reason": (
                                      "CONTEXT_UNAVAILABLE"
                                  ),
                                  "context_status": (
                                      context_status
                                  )
                              }

                          else:
                              # Context has been successfully read.
                              # Keep the response deterministic and
                              # context-aware without external AI.
                              payload = build_payload(
                                  "comment",
                                  {
                                      **suggestion,
                                      "context": context_response
                                  },
                                  descriptor
                              )

                              action_status, action_response = request(
                                  "POST",
                                  path,
                                  jwt,
                                  payload
                              )

                              print(
                                  f"POST {path} -> "
                                  f"{action_status}"
                              )

                              executed = (
                                  action_status in {
                                      200,
                                      201,
                                      202
                                  }
                              )

                              execution_result = {
                                  "timestamp": NOW,
                                  "selected": selected,
                                  "executed": executed,
                                  "status": action_status,
                                  "response": action_response
                              }

                  else:
                      action_status, action_response = request(
                          method,
                          path,
                          jwt,
                          payload
                      )

                      print(
                          f"{method} {path} -> "
                          f"{action_status}"
                      )

                      executed = (
                          action_status in {
                              200,
                              201,
                              202
                          }
                      )

                      execution_result = {
                          "timestamp": NOW,
                          "selected": selected,
                          "executed": executed,
                          "status": action_status,
                          "response": action_response
                      }

          # ------------------------------------------------------------
          # EXPERIENCE LEDGER
          # ------------------------------------------------------------

          if execution_result.get("executed"):
              selected_record = execution_result["selected"]

              ledger.append(
                  {
                      "timestamp": NOW,
                      "action_type": selected_record[
                          "action_type"
                      ],
                      "method": selected_record[
                          "method"
                      ],
                      "path": selected_record[
                          "path"
                      ],
                      "score": selected_record[
                          "score"
                      ],
                      "context_score": selected_record[
                          "context_score"
                      ],
                      "terms": selected_record[
                          "terms"
                      ],
                      "fingerprint": selected_record[
                          "fingerprint"
                      ],
                      "result": "EXECUTED"
                  }
              )

              ledger = ledger[-100:]

          ledger_data = {
              "version": 4,
              "updated_at": NOW,
              "records": ledger
          }

          json_save(
              ledger_path,
              ledger_data
          )

          json_save(
              MEMORY_DIR / "last_execution.json",
              execution_result
          )

          # ------------------------------------------------------------
          # COGNITIVE STATE
          # ------------------------------------------------------------

          state = {
              "version": 4,
              "timestamp": NOW,
              "identity": identity,
              "inputs": {
                  "suggestions": len(suggestions),
                  "for_you": len(feed_items),
                  "recent_messages": len(recent_messages),
                  "recent_posts": len(recent_posts),
                  "notifications": len(notifications)
              },
              "cognition": {
                  "candidates": len(candidates),
                  "eligible": len(eligible),
                  "selected": (
                      selected["action_type"]
                      if selected
                      else None
                  ),
                  "executed": bool(
                      execution_result.get("executed")
                  )
              },
              "constraints": {
                  "cost_eur": 0,
                  "external_ai": False,
                  "gemini": False,
                  "payments": False,
                  "marketplace_bids": False
              }
          }

          json_save(
              MEMORY_DIR / "cognitive_state.json",
              state
          )

          # ------------------------------------------------------------
          # EVOLUTION LOG
          # ------------------------------------------------------------

          log_path = MEMORY_DIR / "evolution_log.md"

          with log_path.open(
              "a",
              encoding="utf-8"
          ) as log:

              log.write(
                  f"\n## {NOW}\n"
              )

              log.write(
                  f"- Suggestions received: "
                  f"{len(suggestions)}\n"
              )

              log.write(
                  f"- Executable candidates: "
                  f"{len(candidates)}\n"
              )

              log.write(
                  f"- Eligible candidates: "
                  f"{len(eligible)}\n"
              )

              if selected:
                  log.write(
                      f"- Selected: "
                      f"{selected['action_type']} "
                      f"{selected['path']}\n"
                  )

              else:
                  log.write(
                      "- Selected: NONE\n"
                  )

              log.write(
                  f"- Executed: "
                  f"{bool(execution_result.get('executed'))}\n"
              )

              log.write(
                  "- Cost: €0\n"
              )

              log.write(
                  "- External AI: false\n"
              )

              log.write(
                  "- Gemini: false\n"
              )

          # ------------------------------------------------------------
          # FINAL RESULT
          # ------------------------------------------------------------

          print()
          print("=== ACT61 V4 RESULT ===")
          print(f"Identity:             {identity}")
          print(f"Suggestions:          {len(suggestions)}")
          print(f"For-you items:        {len(feed_items)}")
          print(f"Recent messages:      {len(recent_messages)}")
          print(f"Recent posts:         {len(recent_posts)}")
          print(f"Notifications:        {len(notifications)}")
          print(f"Candidates:           {len(candidates)}")
          print(f"Eligible:             {len(eligible)}")

          if selected:
              print(
                  "Selected:             "
                  f"{selected['action_type']} "
                  f"{selected['path']}"
              )
          else:
              print("Selected:             NONE")

          print(
              "Executed actions:     "
              f"{1 if execution_result.get('executed') else 0}"
          )

          print(
              "Experience records:   "
              f"{len(ledger)}"
          )

          print()
          print("COST:                  €0")
          print("EXTERNAL_AI:           false")
          print("GEMINI:                false")
          print("PAYMENTS:              disabled")
          print("MARKETPLACE_BIDS:      disabled")

          if execution_result.get("executed"):
              print("REAL ACTION EXECUTED:  YES")
          else:
              print("REAL ACTION EXECUTED:  NO")

          PY

      - name: Commit ACT61 cognitive memory
        run: |
          git config user.name "nox-origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/act61

          if git diff --cached --quiet; then
            echo "No ACT61 memory changes to commit."
          else
            git commit -m "ACT61 V4 cognitive action evolution"
            git push
          fi
