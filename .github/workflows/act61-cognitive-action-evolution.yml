        run: |
          set -euo pipefail

          git config user.name "NØX Cognitive Evolution"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/act61

          if git diff --cached --quiet; then
            echo "No ACT61 memory changes."
            exit 0
          fi

          git commit -m "feat(act61): evolve cognitive action memory"
          git push
