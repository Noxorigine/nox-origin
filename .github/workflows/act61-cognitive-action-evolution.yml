name: NØX ACT61 V4.1 - Cognitive Action Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act61-cognitive-action-evolution
  cancel-in-progress: false

jobs:
  cognitive-action-evolution:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      MEMORY_DIR: memory/act61
      MAX_SUGGESTIONS: "20"
      MAX_FEED_ITEMS: "25"
      MAX_ACTIONS_PER_RUN: "1"
      MIN_ACTION_SCORE: "60"
      MIN_CONTEXT_SCORE: "45"
      PROJECT_COST_EUR: "0"
      EXTERNAL_AI_USED: "false"
      GEMINI_USED: "false"
      PAYMENTS_ENABLED: "false"
      MARKETPLACE_BIDS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cognitive Action Evolution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "${MEMORY_DIR}"

          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import re
          import shutil
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          # ============================================================
          # NØX ACT61 V4.1
          #
          # PRINCIPLE:
          # - Never trust an assumed memory schema.
          # - Never crash because an old memory file has another shape.
          # - Inspect Colony suggestions before selecting an action.
          # - Maximum one real action per run.
          # - No financial action.
          # - No external AI.
          # ============================================================

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          MEMORY_DIR = Path(os.environ["MEMORY_DIR"])

          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_ACTIONS = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MIN_ACTION_SCORE = int(os.environ["MIN_ACTION_SCORE"])
          MIN_CONTEXT_SCORE = int(os.environ["MIN_CONTEXT_SCORE"])

          API_KEY = os.environ["COLONY_API_KEY"]

          NOW = datetime.now(timezone.utc).isoformat()

          print("=== NØX ACT61 V4.1 - COGNITIVE ACTION EVOLUTION ===")
          print(f"Timestamp: {NOW}")
          print("MODE: REAL ACTION / ZERO COST / NO EXTERNAL AI")
          print()


          # ============================================================
          # GENERIC SAFE HELPERS
          # ============================================================

          def json_save(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              temporary.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              temporary.replace(path)


          def json_load(path, default):
              """
              Safe JSON loader.

              Returns:
                  parsed JSON when valid
                  default when missing/invalid

              NEVER assumes the JSON root is a dict.
              """

              if not path.exists():
                  return copy.deepcopy(default)

              try:
                  raw = path.read_text(
                      encoding="utf-8"
                  )

                  if not raw.strip():
                      return copy.deepcopy(default)

                  return json.loads(raw)

              except Exception as exc:
                  print(
                      f"WARNING: cannot read JSON "
                      f"{path}: {exc}"
                  )

                  return copy.deepcopy(default)


          def backup_broken_file(path):
              """
              Preserve a broken memory file instead of deleting it.
              """

              if not path.exists():
                  return None

              stamp = (
                  datetime.now(timezone.utc)
                  .strftime("%Y%m%dT%H%M%SZ")
              )

              backup = path.with_name(
                  f"{path.name}.broken-{stamp}"
              )

              try:
                  shutil.copy2(path, backup)
                  print(
                      f"Broken memory preserved: "
                      f"{backup}"
                  )
                  return backup

              except Exception as exc:
                  print(
                      f"WARNING: unable to preserve "
                      f"{path}: {exc}"
                  )
                  return None


          def ensure_list(value):
              """
              Convert supported collection shapes into a list.

              This is deliberately tolerant because API responses
              and historical ACT files may use different roots.
              """

              if isinstance(value, list):
                  return value

              if isinstance(value, tuple):
                  return list(value)

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "data",
                      "results",
                      "records",
                      "suggestions",
                      "actions",
                      "messages",
                      "posts",
                      "notifications"
                  ):
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

              return []


          def safe_dict(value):
              """
              Return a dict or an empty dict.

              Never call .get() on unknown external data.
              """

              return value if isinstance(value, dict) else {}


          def first_value(obj, wanted_keys):
              wanted = {
                  str(key).lower()
                  for key in wanted_keys
              }

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      if str(key).lower() in wanted:
                          return value

                  for value in obj.values():

                      found = first_value(
                          value,
                          wanted_keys
                      )

                      if found is not None:
                          return found

              elif isinstance(obj, list):

                  for value in obj:

                      found = first_value(
                          value,
                          wanted_keys
                      )

                      if found is not None:
                          return found

              return None


          def flatten_text(obj):
              parts = []

              def walk(value):

                  if isinstance(value, str):
                      parts.append(value)

                  elif isinstance(value, dict):

                      for key, nested in value.items():

                          if str(key).lower() in {
                              "authorization",
                              "token",
                              "api_key",
                              "access_token",
                              "secret",
                              "password"
                          }:
                              continue

                          walk(nested)

                  elif isinstance(value, list):

                      for nested in value:
                          walk(nested)

              walk(obj)

              return " ".join(parts)


          # ============================================================
          # HTTP
          # ============================================================

          def request(
              method,
              path,
              token,
              payload=None,
              params=None
          ):
              url = BASE + path

              if params:
                  encoded = urllib.parse.urlencode(
                      params,
                      doseq=True
                  )

                  url += (
                      ("&" if "?" in url else "?")
                      + encoded
                  )

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "NOX-ACT61/4.1"
              }

              body = None

              if payload is not None:

                  headers["Content-Type"] = (
                      "application/json"
                  )

                  body = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method.upper()
              )

              try:

                  with urllib.request.urlopen(
                      req,
                      timeout=25
                  ) as response:

                      raw = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      try:
                          data = json.loads(raw)
                      except Exception:
                          data = raw

                      return response.status, data

              except urllib.error.HTTPError as exc:

                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = raw

                  return exc.code, data

              except Exception as exc:

                  return 0, {
                      "error": str(exc)
                  }


          # ============================================================
          # MEMORY NORMALIZATION
          # ============================================================

          ledger_path = (
              MEMORY_DIR /
              "experience_ledger.json"
          )

          raw_ledger = json_load(
              ledger_path,
              []
          )

          ledger_recovered = False
          ledger_migrated = False

          if isinstance(raw_ledger, list):

              # Historical ACT61 format:
              # [
              #   {...},
              #   {...}
              # ]

              ledger = [
                  item
                  for item in raw_ledger
                  if isinstance(item, dict)
              ]

              ledger_migrated = True

              print(
                  "Memory compatibility: "
                  "legacy LIST ledger detected."
              )

          elif isinstance(raw_ledger, dict):

              records = raw_ledger.get(
                  "records",
                  []
              )

              if isinstance(records, list):

                  ledger = [
                      item
                      for item in records
                      if isinstance(item, dict)
                  ]

              else:

                  print(
                      "WARNING: ledger 'records' "
                      "is not a list."
                  )

                  backup_broken_file(
                      ledger_path
                  )

                  ledger = []
                  ledger_recovered = True

          else:

              print(
                  "WARNING: unsupported ledger root type: "
                  f"{type(raw_ledger).__name__}"
              )

              backup_broken_file(
                  ledger_path
              )

              ledger = []
              ledger_recovered = True

          print(
              f"Experience records: {len(ledger)}"
          )

          # Immediately normalize historical formats.
          # This makes future runs deterministic.
          if ledger_migrated or ledger_recovered:

              json_save(
                  ledger_path,
                  {
                      "version": 4,
                      "updated_at": NOW,
                      "records": ledger
                  }
              )

              print(
                  "Experience ledger normalized."
              )


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print()
          print("=== AUTHENTICATION ===")

          auth_status, auth_response = request(
              "POST",
              "/api/v1/auth/token",
              "",
              {
                  "api_key": API_KEY
              }
          )

          print(
              "POST /api/v1/auth/token -> "
              f"{auth_status}"
          )

          if auth_status != 200:

              raise RuntimeError(
                  "Authentication failed: "
                  f"{auth_status} {auth_response}"
              )

          auth_object = safe_dict(
              auth_response
          )

          jwt = (
              auth_object.get("access_token")
              or auth_object.get("token")
          )

          if not jwt:

              raise RuntimeError(
                  "Authentication returned no JWT."
              )

          print("JWT received: yes")

          me_status, me_response = request(
              "GET",
              "/api/v1/users/me",
              jwt
          )

          print(
              "GET /api/v1/users/me -> "
              f"{me_status}"
          )

          if me_status != 200:

              raise RuntimeError(
                  "Identity check failed: "
                  f"{me_status} {me_response}"
              )

          identity = (
              first_value(
                  me_response,
                  [
                      "username",
                      "user_name"
                  ]
              )
              or "unknown"
          )

          print(
              f"NØX identity: {identity}"
          )


          # ============================================================
          # PLATFORM INSTRUCTIONS
          # ============================================================

          print()
          print("=== PLATFORM SELF-DESCRIPTION ===")

          instructions_status, instructions_response = request(
              "GET",
              "/api/v1/instructions",
              jwt
          )

          print(
              "GET /api/v1/instructions -> "
              f"{instructions_status}"
          )

          if instructions_status == 200:

              json_save(
                  MEMORY_DIR /
                  "last_instructions_snapshot.json",
                  {
                      "timestamp": NOW,
                      "status": instructions_status,
                      "instructions": instructions_response
                  }
              )

              print(
                  "Machine-readable instructions: AVAILABLE"
              )

          else:

              print(
                  "Machine-readable instructions: "
                  "UNAVAILABLE"
              )


          # ============================================================
          # FOR-YOU FEED
          # ============================================================

          print()
          print("=== INPUTS ===")

          feed_status, feed_response = request(
              "GET",
              "/api/v1/feed/for-you",
              jwt,
              params={
                  "limit": MAX_FEED_ITEMS
              }
          )

          print(
              "GET /api/v1/feed/for-you -> "
              f"{feed_status}"
          )

          feed_items = ensure_list(
              feed_response
          )

          print(
              f"For-you items: {len(feed_items)}"
          )


          # ============================================================
          # SUGGESTIONS
          # ============================================================

          suggestions_status, suggestions_response = request(
              "GET",
              "/api/v1/suggestions",
              jwt,
              params={
                  "limit": MAX_SUGGESTIONS
              }
          )

          print(
              "GET /api/v1/suggestions -> "
              f"{suggestions_status}"
          )

          if suggestions_status != 200:

              raise RuntimeError(
                  "Suggestions endpoint failed: "
                  f"{suggestions_status} "
                  f"{suggestions_response}"
              )

          suggestions = ensure_list(
              suggestions_response
          )

          print(
              f"Suggestions received: "
              f"{len(suggestions)}"
          )


          # ============================================================
          # SINCE
          # ============================================================

          since_path = (
              MEMORY_DIR /
              "since_timestamp.txt"
          )

          recent_messages = []
          recent_posts = []
          notifications = []

          if since_path.exists():

              previous_since = (
                  since_path
                  .read_text(
                      encoding="utf-8"
                  )
                  .strip()
              )

              if previous_since:

                  since_status, since_response = request(
                      "GET",
                      "/api/v1/since",
                      jwt,
                      params={
                          "since": previous_since
                      }
                  )

                  print(
                      "GET /api/v1/since -> "
                      f"{since_status}"
                  )

                  if since_status == 200:

                      since_object = safe_dict(
                          since_response
                      )

                      recent_messages = ensure_list(
                          since_object.get(
                              "messages",
                              []
                          )
                      )

                      recent_posts = ensure_list(
                          since_object.get(
                              "posts",
                              []
                          )
                      )

                      notifications = ensure_list(
                          since_object.get(
                              "notifications",
                              []
                          )
                      )

                      next_cursor = (
                          since_object.get(
                              "next_cursor"
                          )
                          or since_object.get(
                              "cursor"
                          )
                          or since_object.get(
                              "since"
                          )
                      )

                      if next_cursor:

                          since_path.write_text(
                              str(next_cursor),
                              encoding="utf-8"
                          )

                  else:

                      print(
                          "WARNING: /since unavailable; "
                          "continuing without recent stream."
                      )

          else:

              since_path.write_text(
                  NOW,
                  encoding="utf-8"
              )

              print(
                  "Since: BOOTSTRAP"
              )


          # ============================================================
          # RAW SUGGESTION PRESERVATION
          # ============================================================

          json_save(
              MEMORY_DIR /
              "last_suggestions_raw.json",
              {
                  "timestamp": NOW,
                  "status": suggestions_status,
                  "count": len(suggestions),
                  "suggestions": suggestions
              }
          )


          # ============================================================
          # EXTRACTION HELPERS
          # ============================================================

          def extract_id(obj, names):

              value = first_value(
                  obj,
                  names
              )

              if isinstance(
                  value,
                  (str, int)
              ):
                  return str(value)

              return None


          def extract_username(obj):

              return extract_id(
                  obj,
                  [
                      "username",
                      "user_name",
                      "author_username",
                      "target_username",
                      "recipient_username"
                  ]
              )


          def extract_post_id(obj):

              return extract_id(
                  obj,
                  [
                      "post_id",
                      "postId",
                      "target_post_id",
                      "targetPostId"
                  ]
              )


          def extract_comment_id(obj):

              return extract_id(
                  obj,
                  [
                      "comment_id",
                      "commentId",
                      "target_comment_id",
                      "targetCommentId"
                  ]
              )


          def extract_user_id(obj):

              return extract_id(
                  obj,
                  [
                      "user_id",
                      "userId",
                      "target_user_id",
                      "targetUserId"
                  ]
              )


          def extract_colony_id(obj):

              return extract_id(
                  obj,
                  [
                      "colony_id",
                      "colonyId",
                      "target_colony_id",
                      "targetColonyId"
                  ]
              )


          def extract_action_descriptor(
              suggestion
          ):
              """
              Search recursively for a platform-provided HTTP
              action descriptor.

              No fixed suggestion schema is assumed.
              """

              descriptor = {}

              action_keys = {
                  "action",
                  "api",
                  "api_call",
                  "apicall",
                  "call",
                  "request",
                  "http",
                  "execute",
                  "execution",
                  "operation"
              }

              def walk(value, depth=0):

                  if depth > 8:
                      return

                  if isinstance(value, dict):

                      local = {}

                      for key, nested in value.items():

                          low = str(key).lower()

                          if low in {
                              "method",
                              "http_method",
                              "verb"
                          } and isinstance(
                              nested,
                              str
                          ):

                              local["method"] = (
                                  nested.upper()
                              )

                          elif low in {
                              "path",
                              "endpoint",
                              "url",
                              "uri",
                              "route"
                          } and isinstance(
                              nested,
                              str
                          ):

                              local["path"] = nested

                          elif low in {
                              "body",
                              "payload",
                              "json"
                          }:

                              if isinstance(
                                  nested,
                                  (
                                      dict,
                                      list,
                                      str
                                  )
                              ):

                                  local["body"] = nested

                          elif low in {
                              "params",
                              "query",
                              "query_params",
                              "queryparams"
                          }:

                              if isinstance(
                                  nested,
                                  (
                                      dict,
                                      list
                                  )
                              ):

                                  local["params"] = nested

                      if (
                          "method" in local
                          or "path" in local
                      ):

                          descriptor.update(
                              local
                          )

                      for key, nested in value.items():

                          if (
                              str(key).lower()
                              in {
                                  k.lower()
                                  for k in action_keys
                              }
                          ):

                              walk(
                                  nested,
                                  depth + 1
                              )

                          elif isinstance(
                              nested,
                              (
                                  dict,
                                  list
                              )
                          ):

                              walk(
                                  nested,
                                  depth + 1
                              )

                  elif isinstance(value, list):

                      for nested in value:

                          walk(
                              nested,
                              depth + 1
                          )

              walk(suggestion)

              return descriptor


          def extract_path_from_text(text):

              if not text:
                  return None

              match = re.search(
                  r"(?:GET|POST|PUT|PATCH|DELETE)"
                  r"\s+"
                  r"(/api/v1/[A-Za-z0-9_./{}?=&<>:-]+)",
                  text,
                  re.IGNORECASE
              )

              if match:
                  return match.group(1)

              match = re.search(
                  r"(/api/v1/[A-Za-z0-9_./{}?=&<>:-]+)",
                  text
              )

              if match:
                  return match.group(1)

              return None


          def extract_method_from_text(text):

              if not text:
                  return None

              match = re.search(
                  r"\b"
                  r"(GET|POST|PUT|PATCH|DELETE)"
                  r"\b",
                  text,
                  re.IGNORECASE
              )

              if match:
                  return match.group(1).upper()

              return None


          def infer_action_type(
              path,
              text
          ):

              source = (
                  f"{path or ''} "
                  f"{text or ''}"
              ).lower()

              if "/comments" in source:
                  return "comment"

              if "/messages/send/" in source:
                  return "message"

              if "/follow" in source:
                  return "follow"

              if "/vote" in source:
                  return "vote"

              if "/join" in source:
                  return "join"

              return "unknown"


          def resolve_path(
              path,
              suggestion
          ):

              if not isinstance(
                  path,
                  str
              ):
                  return None

              replacements = {
                  "{post_id}": extract_post_id(
                      suggestion
                  ),
                  "<post_id>": extract_post_id(
                      suggestion
                  ),
                  "{comment_id}": extract_comment_id(
                      suggestion
                  ),
                  "<comment_id>": extract_comment_id(
                      suggestion
                  ),
                  "{username}": extract_username(
                      suggestion
                  ),
                  "<username>": extract_username(
                      suggestion
                  ),
                  "{user_id}": extract_user_id(
                      suggestion
                  ),
                  "<user_id>": extract_user_id(
                      suggestion
                  ),
                  "{colony_id}": extract_colony_id(
                      suggestion
                  ),
                  "<colony_id>": extract_colony_id(
                      suggestion
                  )
              }

              for token, value in replacements.items():

                  if token in path:

                      if not value:
                          return None

                      path = path.replace(
                          token,
                          value
                      )

              if not path.startswith(
                  "/api/v1/"
              ):
                  return None

              return path


          def meaningful_terms(
              suggestion
          ):

              text = flatten_text(
                  suggestion
              ).lower()

              stop = {
                  "the",
                  "and",
                  "that",
                  "this",
                  "with",
                  "from",
                  "what",
                  "your",
                  "you",
                  "are",
                  "for",
                  "about",
                  "into",
                  "have",
                  "has",
                  "how",
                  "can",
                  "could",
                  "would",
                  "should",
                  "will",
                  "just",
                  "next",
                  "action",
                  "suggestion",
                  "reply",
                  "respond"
              }

              words = re.findall(
                  r"[a-zA-Z0-9_À-ÿ-]{4,}",
                  text
              )

              result = []

              for word in words:

                  if (
                      word not in stop
                      and word not in result
                  ):
                      result.append(word)

                  if len(result) >= 8:
                      break

              return result


          # ============================================================
          # COGNITIVE SCORING
          # ============================================================

          def context_score(
              suggestion,
              action_type,
              descriptor
          ):

              score = 0

              text = flatten_text(
                  suggestion
              ).lower()

              if action_type != "unknown":
                  score += 20

              if descriptor.get("path"):
                  score += 20

              if descriptor.get("method"):
                  score += 10

              if extract_post_id(
                  suggestion
              ):
                  score += 15

              if extract_comment_id(
                  suggestion
              ):
                  score += 10

              if extract_username(
                  suggestion
              ):
                  score += 10

              if meaningful_terms(
                  suggestion
              ):
                  score += 10

              if any(
                  term in text
                  for term in [
                      "mention",
                      "question",
                      "reply",
                      "respond",
                      "dm",
                      "message",
                      "comment",
                      "answer"
                  ]
              ):
                  score += 10

              return min(
                  score,
                  100
              )


          def action_value(
              suggestion,
              action_type
          ):

              text = flatten_text(
                  suggestion
              ).lower()

              score = 0

              if action_type in {
                  "comment",
                  "message"
              }:
                  score += 30

              elif action_type == "follow":
                  score += 18

              elif action_type == "vote":
                  score += 12

              elif action_type == "join":
                  score += 10

              if any(
                  term in text
                  for term in [
                      "question",
                      "asking",
                      "asks",
                      "help",
                      "reply",
                      "respond",
                      "mention",
                      "collaborat",
                      "research",
                      "technical",
                      "finding"
                  ]
              ):
                  score += 20

              return min(
                  score,
                  50
              )


          def repetition_penalty(
              suggestion,
              ledger
          ):

              source = flatten_text(
                  suggestion
              ).lower()

              fingerprint = hashlib.sha256(
                  re.sub(
                      r"\s+",
                      " ",
                      source
                  ).encode(
                      "utf-8"
                  )
              ).hexdigest()[:16]

              recent = ledger[-20:]

              for record in recent:

                  if not isinstance(
                      record,
                      dict
                  ):
                      continue

                  if (
                      record.get(
                          "fingerprint"
                      )
                      == fingerprint
                  ):
                      return (
                          35,
                          fingerprint
                      )

              terms = set(
                  meaningful_terms(
                      suggestion
                  )
              )

              if not terms:
                  return (
                      0,
                      fingerprint
                  )

              for record in recent:

                  previous_terms = set(
                      ensure_list(
                          record.get(
                              "terms",
                              []
                          )
                      )
                  )

                  if previous_terms:

                      overlap = (
                          len(
                              terms &
                              previous_terms
                          )
                          /
                          max(
                              len(
                                  terms |
                                  previous_terms
                              ),
                              1
                          )
                      )

                      if overlap >= 0.65:

                          return (
                              20,
                              fingerprint
                          )

              return (
                  0,
                  fingerprint
              )


          def risk_penalty(
              action_type,
              path
          ):

              if not path:
                  return 100

              source = path.lower()

              forbidden = [
                  "/tips/",
                  "/pay",
                  "/payment",
                  "/invoice",
                  "/bid",
                  "/bids",
                  "/marketplace",
                  "/wallet",
                  "/withdraw",
                  "/transfer"
              ]

              if any(
                  item in source
                  for item in forbidden
              ):
                  return 100

              if action_type in {
                  "comment",
                  "message",
                  "follow",
                  "vote",
                  "join"
              }:
                  return 0

              return 50


          # ============================================================
          # DETERMINISTIC RESPONSE GENERATION
          # ============================================================

          def build_comment_body(
              suggestion
          ):

              terms = meaningful_terms(
                  suggestion
              )

              if terms:

                  topic = ", ".join(
                      terms[:3]
                  )

                  return (
                      "I’m looking at this from "
                      f"the {topic} angle. "
                      "What part of this would you "
                      "consider the strongest evidence "
                      "or the most useful next step?"
                  )

              return (
                  "I’m interested in the reasoning "
                  "behind this. What evidence or "
                  "next step would you consider "
                  "most useful?"
              )


          def build_message_body(
              suggestion
          ):

              terms = meaningful_terms(
                  suggestion
              )

              if terms:

                  topic = ", ".join(
                      terms[:3]
                  )

                  return (
                      "I picked this up because of "
                      f"the {topic} context. "
                      "What would you consider the "
                      "most useful next step to "
                      "explore together?"
                  )

              return (
                  "I picked this up because the "
                  "context looks relevant. "
                  "What would you consider the "
                  "most useful next step?"
              )


          def build_payload(
              action_type,
              suggestion,
              descriptor
          ):

              existing = descriptor.get(
                  "body"
              )

              if isinstance(
                  existing,
                  dict
              ):

                  payload = copy.deepcopy(
                      existing
                  )

              elif isinstance(
                  existing,
                  list
              ):

                  return existing

              else:

                  payload = {}

              if action_type == "comment":

                  if not payload.get(
                      "body"
                  ):

                      payload["body"] = (
                          build_comment_body(
                              suggestion
                          )
                      )

                  parent_id = (
                      extract_comment_id(
                          suggestion
                      )
                  )

                  if (
                      parent_id
                      and not payload.get(
                          "parent_id"
                      )
                  ):

                      payload[
                          "parent_id"
                      ] = parent_id

                  return payload

              if action_type == "message":

                  if not payload.get(
                      "body"
                  ):

                      payload["body"] = (
                          build_message_body(
                              suggestion
                          )
                      )

                  return payload

              if action_type == "vote":

                  if "value" not in payload:
                      payload["value"] = 1

                  return payload

              return (
                  payload
                  if payload
                  else None
              )


          # ============================================================
          # RAW SUGGESTION DIAGNOSTICS
          # ============================================================

          print()
          print("=== SUGGESTION STRUCTURE ===")

          if suggestions:

              for index, suggestion in enumerate(
                  suggestions[:MAX_SUGGESTIONS],
                  start=1
              ):

                  descriptor = (
                      extract_action_descriptor(
                          suggestion
                      )
                  )

                  text = flatten_text(
                      suggestion
                  )

                  method = (
                      descriptor.get(
                          "method"
                      )
                      or extract_method_from_text(
                          text
                      )
                      or "?"
                  )

                  path = (
                      descriptor.get(
                          "path"
                      )
                      or extract_path_from_text(
                          text
                      )
                      or "?"
                  )

                  action_type = infer_action_type(
                      path,
                      text
                  )

                  print(
                      f"[{index:02d}] "
                      f"type={action_type} "
                      f"method={method} "
                      f"path={path}"
                  )

          else:

              print(
                  "No suggestions returned."
              )


          # ============================================================
          # CANDIDATE CONSTRUCTION
          # ============================================================

          print()
          print(
              "=== COGNITIVE ACTION SELECTION ==="
          )

          candidates = []

          for index, suggestion in enumerate(
              suggestions,
              start=1
          ):

              if not isinstance(
                  suggestion,
                  (
                      dict,
                      list
                  )
              ):
                  continue

              text = flatten_text(
                  suggestion
              )

              descriptor = (
                  extract_action_descriptor(
                      suggestion
                  )
              )

              raw_path = (
                  descriptor.get(
                      "path"
                  )
                  or extract_path_from_text(
                      text
                  )
              )

              method = (
                  descriptor.get(
                      "method"
                  )
                  or extract_method_from_text(
                      text
                  )
              )

              resolved_path = resolve_path(
                  raw_path,
                  suggestion
              )

              action_type = infer_action_type(
                  resolved_path,
                  text
              )

              if (
                  action_type == "unknown"
                  or not resolved_path
                  or not method
              ):
                  continue

              if method not in {
                  "GET",
                  "POST",
                  "PUT",
                  "PATCH",
                  "DELETE"
              }:
                  continue

              risk = risk_penalty(
                  action_type,
                  resolved_path
              )

              if risk >= 100:
                  continue

              context = context_score(
                  suggestion,
                  action_type,
                  descriptor
              )

              value = action_value(
                  suggestion,
                  action_type
              )

              repetition, fingerprint = (
                  repetition_penalty(
                      suggestion,
                      ledger
                  )
              )

              total = (
                  context
                  + value
                  - repetition
                  - risk
              )

              candidates.append(
                  {
                      "suggestion_index": index,
                      "action_type": action_type,
                      "method": method,
                      "path": resolved_path,
                      "descriptor": descriptor,
                      "context_score": context,
                      "action_value": value,
                      "repetition_penalty": repetition,
                      "risk_penalty": risk,
                      "score": total,
                      "fingerprint": fingerprint,
                      "terms": meaningful_terms(
                          suggestion
                      ),
                      "suggestion": suggestion
                  }
              )


          candidates.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          print(
              "Executable candidates discovered: "
              f"{len(candidates)}"
          )

          for candidate in candidates:

              print(
                  "  "
                  f"{candidate['action_type']} "
                  f"{candidate['method']} "
                  f"{candidate['path']} "
                  f"score={candidate['score']} "
                  f"context={candidate['context_score']} "
                  f"value={candidate['action_value']} "
                  f"repeat={candidate['repetition_penalty']} "
                  f"risk={candidate['risk_penalty']}"
              )


          json_save(
              MEMORY_DIR /
              "last_candidates.json",
              {
                  "timestamp": NOW,
                  "candidate_count": len(candidates),
                  "candidates": candidates
              }
          )


          eligible = [
              candidate
              for candidate in candidates
              if (
                  candidate["context_score"]
                  >= MIN_CONTEXT_SCORE
                  and candidate["score"]
                  >= MIN_ACTION_SCORE
                  and candidate["risk_penalty"]
                  < 100
              )
          ]

          selected = (
              eligible[0]
              if eligible
              else None
          )

          print(
              f"Eligible candidates: "
              f"{len(eligible)}"
          )


          # ============================================================
          # DECISION + EXECUTION
          # ============================================================

          execution_result = {
              "timestamp": NOW,
              "selected": None,
              "executed": False,
              "reason": "NO_ELIGIBLE_CANDIDATE"
          }

          if not selected:

              print()
              print(
                  "DECISION: NONE"
              )

              print(
                  "Reason: no suggestion passed "
                  "the cognitive/context/repetition/"
                  "risk gates."
              )

          else:

              print()
              print(
                  "=== SELECTED ACTION ==="
              )

              print(
                  f"Type:         "
                  f"{selected['action_type']}"
              )

              print(
                  f"Method:       "
                  f"{selected['method']}"
              )

              print(
                  f"Path:         "
                  f"{selected['path']}"
              )

              print(
                  f"Score:        "
                  f"{selected['score']}"
              )

              print(
                  f"Context:      "
                  f"{selected['context_score']}"
              )

              print(
                  f"Action value: "
                  f"{selected['action_value']}"
              )

              print(
                  f"Repetition:   "
                  f"{selected['repetition_penalty']}"
              )

              print(
                  f"Risk:         "
                  f"{selected['risk_penalty']}"
              )

              execution_result[
                  "selected"
              ] = selected

              action_type = (
                  selected["action_type"]
              )

              method = selected[
                  "method"
              ]

              path = selected[
                  "path"
              ]

              suggestion = selected[
                  "suggestion"
              ]

              descriptor = selected[
                  "descriptor"
              ]

              payload = build_payload(
                  action_type,
                  suggestion,
                  descriptor
              )


              # --------------------------------------------------------
              # HARD FINANCIAL BLOCK
              # --------------------------------------------------------

              financial_terms = [
                  "/tips/",
                  "/pay",
                  "/payment",
                  "/invoice",
                  "/bid",
                  "/bids",
                  "/marketplace",
                  "/wallet",
                  "/withdraw",
                  "/transfer"
              ]

              if any(
                  term in path.lower()
                  for term in financial_terms
              ):

                  print(
                      "ACTION BLOCKED: "
                      "financial/marketplace path."
                  )

                  execution_result[
                      "reason"
                  ] = "FINANCIAL_PATH_BLOCKED"

              else:

                  # ----------------------------------------------------
                  # ACTION ALLOWLIST
                  # ----------------------------------------------------

                  allowed_prefixes = [
                      "/api/v1/posts/",
                      "/api/v1/messages/send/",
                      "/api/v1/users/",
                      "/api/v1/colonies/"
                  ]

                  allowed_types = {
                      "comment",
                      "message",
                      "follow",
                      "vote",
                      "join"
                  }

                  allowed = (
                      any(
                          path.startswith(
                              prefix
                          )
                          for prefix
                          in allowed_prefixes
                      )
                      and action_type
                      in allowed_types
                  )

                  if not allowed:

                      print(
                          "ACTION BLOCKED: "
                          "not in ACT61 action allowlist."
                      )

                      execution_result[
                          "reason"
                      ] = (
                          "ACTION_NOT_ALLOWLISTED"
                      )

                  elif method == "GET":

                      print(
                          "ACTION BLOCKED: "
                          "read-only request."
                      )

                      execution_result[
                          "reason"
                      ] = (
                          "READ_ONLY_ACTION"
                      )

                  else:

                      # ------------------------------------------------
                      # COMMENT CONTEXT GATE
                      # ------------------------------------------------

                      if action_type == "comment":

                          post_id = (
                              extract_post_id(
                                  suggestion
                              )
                          )

                          if not post_id:

                              print(
                                  "ACTION BLOCKED: "
                                  "missing post_id."
                              )

                              execution_result[
                                  "reason"
                              ] = (
                                  "MISSING_POST_ID"
                              )

                          else:

                              context_status, context_response = (
                                  request(
                                      "GET",
                                      f"/api/v1/posts/"
                                      f"{post_id}/context",
                                      jwt
                                  )
                              )

                              print(
                                  "GET "
                                  f"/api/v1/posts/"
                                  f"{post_id}/context -> "
                                  f"{context_status}"
                              )

                              if context_status != 200:

                                  print(
                                      "ACTION BLOCKED: "
                                      "thread context unavailable."
                                  )

                                  execution_result[
                                      "reason"
                                  ] = (
                                      "CONTEXT_UNAVAILABLE"
                                  )

                                  execution_result[
                                      "context_status"
                                  ] = (
                                      context_status
                                  )

                              else:

                                  contextual_suggestion = {
                                      "suggestion":
                                          suggestion,
                                      "context":
                                          context_response
                                  }

                                  payload = (
                                      build_payload(
                                          "comment",
                                          contextual_suggestion,
                                          descriptor
                                      )
                                  )

                                  action_status, action_response = (
                                      request(
                                          "POST",
                                          path,
                                          jwt,
                                          payload
                                      )
                                  )

                                  print(
                                      f"POST {path} -> "
                                      f"{action_status}"
                                  )

                                  executed = (
                                      action_status
                                      in {
                                          200,
                                          201,
                                          202
                                      }
                                  )

                                  execution_result[
                                      "executed"
                                  ] = executed

                                  execution_result[
                                      "status"
                                  ] = action_status

                                  execution_result[
                                      "response"
                                  ] = action_response

                                  if not executed:

                                      execution_result[
                                          "reason"
                                      ] = (
                                          "ACTION_HTTP_FAILURE"
                                      )

                      else:

                          action_status, action_response = (
                              request(
                                  method,
                                  path,
                                  jwt,
                                  payload
                              )
                          )

                          print(
                              f"{method} {path} -> "
                              f"{action_status}"
                          )

                          executed = (
                              action_status
                              in {
                                  200,
                                  201,
                                  202
                              }
                          )

                          execution_result[
                              "executed"
                          ] = executed

                          execution_result[
                              "status"
                          ] = action_status

                          execution_result[
                              "response"
                          ] = action_response

                          if not executed:

                              execution_result[
                                  "reason"
                              ] = (
                                  "ACTION_HTTP_FAILURE"
                              )


          # ============================================================
          # EXPERIENCE LEDGER UPDATE
          # ============================================================

          if execution_result.get(
              "executed"
          ):

              selected_record = (
                  execution_result[
                      "selected"
                  ]
              )

              if isinstance(
                  selected_record,
                  dict
              ):

                  ledger.append(
                      {
                          "timestamp": NOW,
                          "action_type":
                              selected_record.get(
                                  "action_type"
                              ),
                          "method":
                              selected_record.get(
                                  "method"
                              ),
                          "path":
                              selected_record.get(
                                  "path"
                              ),
                          "score":
                              selected_record.get(
                                  "score"
                              ),
                          "context_score":
                              selected_record.get(
                                  "context_score"
                              ),
                          "terms":
                              selected_record.get(
                                  "terms",
                                  []
                              ),
                          "fingerprint":
                              selected_record.get(
                                  "fingerprint"
                              ),
                          "result":
                              "EXECUTED"
                      }
                  )

                  ledger = ledger[-100:]


          json_save(
              ledger_path,
              {
                  "version": 4,
                  "updated_at": NOW,
                  "records": ledger
              }
          )


          # ============================================================
          # EXECUTION MEMORY
          # ============================================================

          json_save(
              MEMORY_DIR /
              "last_execution.json",
              execution_result
          )


          # ============================================================
          # COGNITIVE STATE
          # ============================================================

          state = {
              "version": "4.1",
              "timestamp": NOW,
              "identity": identity,
              "inputs": {
                  "suggestions":
                      len(suggestions),
                  "for_you":
                      len(feed_items),
                  "recent_messages":
                      len(recent_messages),
                  "recent_posts":
                      len(recent_posts),
                  "notifications":
                      len(notifications)
              },
              "cognition": {
                  "candidates":
                      len(candidates),
                  "eligible":
                      len(eligible),
                  "selected":
                      (
                          selected[
                              "action_type"
                          ]
                          if selected
                          else None
                      ),
                  "executed":
                      bool(
                          execution_result.get(
                              "executed"
                          )
                      )
              },
              "memory": {
                  "records":
                      len(ledger),
                  "legacy_migrated":
                      ledger_migrated,
                  "broken_recovered":
                      ledger_recovered
              },
              "constraints": {
                  "cost_eur": 0,
                  "external_ai": False,
                  "gemini": False,
                  "payments": False,
                  "marketplace_bids": False
              }
          }

          json_save(
              MEMORY_DIR /
              "cognitive_state.json",
              state
          )


          # ============================================================
          # SKIP MEMORY
          # ============================================================

          if not execution_result.get(
              "executed"
          ):

              json_save(
                  MEMORY_DIR /
                  "last_skipped.json",
                  {
                      "timestamp": NOW,
                      "reason":
                          execution_result.get(
                              "reason"
                          ),
                      "suggestions":
                          len(suggestions),
                      "candidates":
                          len(candidates),
                      "eligible":
                          len(eligible)
                  }
              )


          # ============================================================
          # EVOLUTION LOG
          # ============================================================

          log_path = (
              MEMORY_DIR /
              "evolution_log.md"
          )

          with log_path.open(
              "a",
              encoding="utf-8"
          ) as log:

              log.write(
                  f"\n## {NOW}\n"
              )

              log.write(
                  "- ACT61 version: V4.1\n"
              )

              log.write(
                  f"- Suggestions received: "
                  f"{len(suggestions)}\n"
              )

              log.write(
                  f"- Executable candidates: "
                  f"{len(candidates)}\n"
              )

              log.write(
                  f"- Eligible candidates: "
                  f"{len(eligible)}\n"
              )

              if selected:

                  log.write(
                      "- Selected: "
                      f"{selected.get('action_type')} "
                      f"{selected.get('path')}\n"
                  )

              else:

                  log.write(
                      "- Selected: NONE\n"
                  )

              log.write(
                  "- Executed: "
                  f"{bool(execution_result.get('executed'))}\n"
              )

              log.write(
                  "- Cost: €0\n"
              )

              log.write(
                  "- External AI: false\n"
              )

              log.write(
                  "- Gemini: false\n"
              )

              log.write(
                  "- Payments: disabled\n"
              )

              log.write(
                  "- Marketplace bids: disabled\n"
              )


          # ============================================================
          # FINAL RESULT
          # ============================================================

          print()
          print(
              "=== ACT61 V4.1 RESULT ==="
          )

          print(
              f"Identity:             {identity}"
          )

          print(
              f"Suggestions:          "
              f"{len(suggestions)}"
          )

          print(
              f"For-you items:        "
              f"{len(feed_items)}"
          )

          print(
              f"Recent messages:      "
              f"{len(recent_messages)}"
          )

          print(
              f"Recent posts:         "
              f"{len(recent_posts)}"
          )

          print(
              f"Notifications:        "
              f"{len(notifications)}"
          )

          print(
              f"Candidates:           "
              f"{len(candidates)}"
          )

          print(
              f"Eligible:             "
              f"{len(eligible)}"
          )

          if selected:

              print(
                  "Selected:             "
                  f"{selected.get('action_type')} "
                  f"{selected.get('path')}"
              )

          else:

              print(
                  "Selected:             NONE"
              )

          print(
              "Executed actions:     "
              f"{1 if execution_result.get('executed') else 0}"
          )

          print(
              "Experience records:   "
              f"{len(ledger)}"
          )

          print()
          print(
              "COST:                  €0"
          )

          print(
              "EXTERNAL_AI:           false"
          )

          print(
              "GEMINI:                false"
          )

          print(
              "PAYMENTS:              disabled"
          )

          print(
              "MARKETPLACE_BIDS:      disabled"
          )

          if execution_result.get(
              "executed"
          ):

              print(
                  "REAL ACTION EXECUTED:  YES"
              )

          else:

              print(
                  "REAL ACTION EXECUTED:  NO"
              )

          print()
          print(
              "V4.1 STATUS: "
              "MEMORY-COMPATIBLE / "
              "ZERO-COST / "
              "NO-EXTERNAL-AI"
          )

          PY

      - name: Commit ACT61 cognitive memory
        run: |
          git config user.name "nox-origin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/act61

          if git diff --cached --quiet; then
            echo "No ACT61 memory changes to commit."
          else
            git commit -m "ACT61 V4.1 cognitive action evolution"
            git push
          fi
