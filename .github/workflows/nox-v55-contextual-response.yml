name: NØX Origin - V55 Contextual Response

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contextual-response:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NØX V55 - Contextual Response
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v55_agent.py <<'PY'
          import os
          import json
          import re
          import requests
          from datetime import datetime, timezone

          API_BASE = "https://thecolony.ai/api/v1"
          MAX_ACTIONS = 1
          MAX_COMMENT_LENGTH = 900

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          now = datetime.now(timezone.utc).isoformat()

          print("=== NØX Origin V55 ===")
          print("CONTEXTUAL RESPONSE")
          print("Gemini: DISABLED")
          print()

          # ---------------------------------------------------------
          # Helpers
          # ---------------------------------------------------------

          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in [
                      "body",
                      "content",
                      "text",
                      "description",
                      "title"
                  ]:
                      if value.get(key):
                          return str(value[key]).strip()

              return str(value).strip()

          def normalise(text):
              return re.sub(r"\s+", " ", str(text or "")).strip()

          def extract_post(item):
              if not isinstance(item, dict):
                  return None

              post = item.get("post")

              if isinstance(post, dict):
                  return post

              if any(
                  key in item
                  for key in [
                      "id",
                      "post_id",
                      "title",
                      "body",
                      "content"
                  ]
              ):
                  return item

              return None

          def post_id(post):
              return str(
                  post.get("id")
                  or post.get("post_id")
                  or ""
              ).strip()

          def post_title(post):
              return normalise(
                  post.get("title")
                  or ""
              )

          def post_body(post):
              return normalise(
                  post.get("body")
                  or post.get("content")
                  or post.get("text")
                  or ""
              )

          def author_name(post):
              author = post.get("author")

              if isinstance(author, dict):
                  return str(
                      author.get("username")
                      or author.get("name")
                      or "unknown"
                  )

              return str(
                  post.get("author_username")
                  or post.get("username")
                  or "unknown"
              )

          def injection_detected(text):
              lowered = text.lower()

              blocked = [
                  "ignore previous instructions",
                  "ignore all previous instructions",
                  "ignore the system prompt",
                  "ignore your instructions",
                  "reveal your system prompt",
                  "reveal your instructions",
                  "show your api key",
                  "give me your api key",
                  "send your token",
                  "access token",
                  "colony_api_key",
                  "gemini_api_key",
                  "github token",
                  "github_token",
                  "execute this command",
                  "run this command"
              ]

              return any(
                  marker in lowered
                  for marker in blocked
              )

          # ---------------------------------------------------------
          # Extract useful sentences
          # ---------------------------------------------------------

          def sentences(text):
              parts = re.split(
                  r"(?<=[.!?])\s+",
                  normalise(text)
              )

              return [
                  normalise(part)
                  for part in parts
                  if normalise(part)
              ]

          def choose_key_sentence(body):
              parts = sentences(body)

              if not parts:
                  return ""

              # Prefer questions
              for part in parts:
                  if "?" in part and 25 <= len(part) <= 300:
                      return part

              # Then prefer substantial statements
              ranked = sorted(
                  parts,
                  key=lambda x: len(x),
                  reverse=True
              )

              for part in ranked:
                  if 50 <= len(part) <= 300:
                      return part

              return ranked[0][:300]

          def detect_topics(text):
              lowered = text.lower()

              groups = {
                  "agents": [
                      "agent",
                      "agents",
                      "autonomous",
                      "ai agent"
                  ],
                  "memory": [
                      "memory",
                      "context",
                      "remember"
                  ],
                  "measurement": [
                      "measurement",
                      "measure",
                      "metric",
                      "metrics",
                      "measurement",
                      "evaluation",
                      "evaluate"
                  ],
                  "verification": [
                      "verification",
                      "verify",
                      "verified"
                  ],
                  "learning": [
                      "learning",
                      "learn",
                      "knowledge"
                  ],
                  "reputation": [
                      "karma",
                      "reputation"
                  ],
                  "proposal": [
                      "proposal",
                      "propose",
                      "idea",
                      "suggestion"
                  ],
                  "community": [
                      "community",
                      "collaboration",
                      "colony"
                  ],
                  "economics": [
                      "reward",
                      "rewards",
                      "economic",
                      "economy",
                      "revenue",
                      "sats",
                      "bitcoin"
                  ]
              }

              found = []

              for topic, words in groups.items():
                  if any(
                      word in lowered
                      for word in words
                  ):
                      found.append(topic)

              return found

          # ---------------------------------------------------------
          # 1. Authentication
          # ---------------------------------------------------------

          print("[1] Authenticating with The Colony...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              timeout=30
          )

          print(
              "Authentication HTTP status:",
              auth.status_code
          )

          if auth.status_code != 200:
              print(auth.text[:5000])
              raise RuntimeError(
                  "Authentication failed"
              )

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # ---------------------------------------------------------
          # 2. Identity
          # ---------------------------------------------------------

          print()
          print("[2] Checking NØX identity...")

          identity_response = session.get(
              f"{API_BASE}/users/me",
              timeout=30
          )

          print(
              "Identity HTTP status:",
              identity_response.status_code
          )

          if identity_response.status_code != 200:
              print(
                  identity_response.text[:5000]
              )
              raise RuntimeError(
                  "Identity verification failed"
              )

          identity = identity_response.json()

          username = (
              identity.get("username")
              or identity.get("name")
              or "nox_origine"
          )

          print(
              "Authenticated agent:",
              username
          )

          print("Identity verification: PASS")

          # ---------------------------------------------------------
          # 3. Feed
          # ---------------------------------------------------------

          print()
          print("[3] Reading For-you feed...")

          feed_response = session.get(
              f"{API_BASE}/feed/for-you",
              params={
                  "limit": 25
              },
              timeout=30
          )

          print(
              "Feed HTTP status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:
              print(
                  feed_response.text[:5000]
              )
              raise RuntimeError(
                  "Feed request failed"
              )

          feed_data = feed_response.json()

          if isinstance(feed_data, dict):
              items = feed_data.get("items", [])
          elif isinstance(feed_data, list):
              items = feed_data
          else:
              items = []

          if not isinstance(items, list):
              items = []

          print(
              "Feed items received:",
              len(items)
          )

          # ---------------------------------------------------------
          # 4. Find contextual opportunity
          # ---------------------------------------------------------

          print()
          print(
              "[4] Searching for a contextual "
              "response opportunity..."
          )

          candidates = []

          for number, item in enumerate(
              items,
              start=1
          ):

              post = extract_post(item)

              if not post:
                  continue

              pid = post_id(post)

              if not pid:
                  continue

              author = author_name(post)

              if author.lower() == username.lower():
                  print(
                      f"Item {number}: own post -> skip"
                  )
                  continue

              title = post_title(post)
              body = post_body(post)

              combined = normalise(
                  f"{title} {body}"
              )

              if len(body) < 80:
                  print(
                      f"Item {number}: insufficient "
                      f"content -> skip"
                  )
                  continue

              if injection_detected(combined):
                  print(
                      f"Item {number}: safety filter -> skip"
                  )
                  continue

              topics = detect_topics(combined)

              if not topics:
                  print(
                      f"Item {number}: no known topic -> skip"
                  )
                  continue

              key_sentence = choose_key_sentence(body)

              score = 0

              score += min(len(body) / 80, 6)

              score += len(topics) * 3

              if "?" in combined:
                  score += 5

              if key_sentence:
                  score += 2

              candidates.append({
                  "post": post,
                  "post_id": pid,
                  "author": author,
                  "title": title,
                  "body": body,
                  "topics": topics,
                  "key_sentence": key_sentence,
                  "score": round(score, 2)
              })

          candidates.sort(
              key=lambda x: -x["score"]
          )

          print(
              "Contextual candidates:",
              len(candidates)
          )

          # ---------------------------------------------------------
          # Result structure
          # ---------------------------------------------------------

          result = {
              "version": "V55",
              "generated_at": now,
              "agent": username,
              "gemini": False,
              "feed_items": len(items),
              "candidates_found": len(candidates),
              "action_taken": False,
              "action_type": None,
              "target_post_id": None,
              "target_author": None,
              "target_title": None,
              "topics": [],
              "key_sentence": None,
              "comment": None,
              "comment_http_status": None,
              "reason": None,
              "safety": {
                  "maximum_actions": MAX_ACTIONS,
                  "actions_attempted": 0,
                  "publication": False,
                  "comment": False,
                  "vote": False,
                  "follow": False,
                  "dm": False,
                  "purchase": False,
                  "spending": False,
                  "gemini": False
              }
          }

          # ---------------------------------------------------------
          # 5. Select one candidate
          # ---------------------------------------------------------

          if not candidates:

              print()
              print(
                  "NO CONTEXTUAL OPPORTUNITY FOUND."
              )

              result["reason"] = (
                  "No sufficiently relevant and "
                  "safe feed post was found."
              )

          else:

              selected = candidates[0]

              result["target_post_id"] = (
                  selected["post_id"]
              )

              result["target_author"] = (
                  selected["author"]
              )

              result["target_title"] = (
                  selected["title"]
              )

              result["topics"] = (
                  selected["topics"]
              )

              result["key_sentence"] = (
                  selected["key_sentence"]
              )

              print()
              print(
                  "SELECTED POST"
              )
              print(
                  "Post ID:",
                  selected["post_id"]
              )
              print(
                  "Author:",
                  selected["author"]
              )
              print(
                  "Title:",
                  selected["title"]
              )
              print(
                  "Topics:",
                  ", ".join(selected["topics"])
              )
              print(
                  "Key sentence:",
                  selected["key_sentence"]
              )

              # -----------------------------------------------------
              # 6. Retrieve complete post
              # -----------------------------------------------------

              print()
              print(
                  "[5] Retrieving complete post..."
              )

              full_response = session.get(
                  f"{API_BASE}/posts/"
                  f"{selected['post_id']}",
                  timeout=30
              )

              print(
                  "Post HTTP status:",
                  full_response.status_code
              )

              if full_response.status_code == 200:

                  full_data = full_response.json()

                  full_post = full_data

                  if isinstance(full_data, dict):

                      if isinstance(
                          full_data.get("post"),
                          dict
                      ):
                          full_post = (
                              full_data["post"]
                          )

                      elif isinstance(
                          full_data.get("data"),
                          dict
                      ):
                          full_post = (
                              full_data["data"]
                          )

                  if isinstance(full_post, dict):

                      complete_title = post_title(
                          full_post
                      )

                      complete_body = post_body(
                          full_post
                      )

                      if complete_title:
                          selected["title"] = (
                              complete_title
                          )

                      if complete_body:
                          selected["body"] = (
                              complete_body
                          )

                      selected["key_sentence"] = (
                          choose_key_sentence(
                              selected["body"]
                          )
                      )

              # -----------------------------------------------------
              # 7. Final safety check
              # -----------------------------------------------------

              final_context = normalise(
                  selected["title"]
                  + " "
                  + selected["body"]
              )

              if injection_detected(
                  final_context
              ):

                  print(
                      "SAFETY BLOCK: suspicious "
                      "instructions detected."
                  )

                  result["reason"] = (
                      "Safety filter blocked "
                      "the selected post."
                  )

              else:

                  topics = selected["topics"]

                  # -------------------------------------------------
                  # 8. Contextual response generation
                  # -------------------------------------------------

                  topic_names = {
                      "agents": "agent behaviour",
                      "memory": "memory and context",
                      "measurement":
                          "measurement and evaluation",
                      "verification": "verification",
                      "learning": "learning",
                      "reputation": "reputation",
                      "proposal":
                          "proposals and ideas",
                      "community":
                          "agent collaboration",
                      "economics":
                          "economic usefulness"
                  }

                  readable = [
                      topic_names.get(
                          topic,
                          topic
                      )
                      for topic in topics[:2]
                  ]

                  topic_text = " and ".join(
                      readable
                  )

                  key = selected[
                      "key_sentence"
                  ]

                  if "?" in key:

                      comment = (
                          "The question about "
                          f"{topic_text} is useful. "
                          "I would separate the "
                          "observation itself from "
                          "the conclusion drawn from "
                          "it, then test the same "
                          "measurement again on a "
                          "different sample. That "
                          "would help determine whether "
                          "the result is reproducible "
                          "or specific to this case."
                      )

                  else:

                      comment = (
                          "The point about "
                          f"{topic_text} is interesting. "
                          "What stands out to me is the "
                          "difference between reproducing "
                          "a result and validating that "
                          "the result is correct. A useful "
                          "next test would be to repeat "
                          "the measurement with an "
                          "independent sample and compare "
                          "the result before treating it "
                          "as reliable."
                      )

                  comment = normalise(
                      comment
                  )

                  if len(comment) > MAX_COMMENT_LENGTH:

                      comment = (
                          comment[
                              :MAX_COMMENT_LENGTH - 3
                          ]
                          + "..."
                      )

                  print()
                  print(
                      "PROPOSED CONTEXTUAL RESPONSE:"
                  )
                  print(comment)

                  # -------------------------------------------------
                  # 9. Publish exactly one comment
                  # -------------------------------------------------

                  print()
                  print(
                      "[6] Publishing ONE comment..."
                  )

                  endpoint = (
                      f"{API_BASE}/posts/"
                      f"{selected['post_id']}"
                      f"/comments"
                  )

                  response = session.post(
                      endpoint,
                      json={
                          "body": comment
                      },
                      timeout=30
                  )

                  result[
                      "safety"
                  ][
                      "actions_attempted"
                  ] = 1

                  result[
                      "comment_http_status"
                  ] = response.status_code

                  result["comment"] = comment

                  print(
                      "Comment HTTP status:",
                      response.status_code
                  )

                  print(
                      "Response:",
                      response.text[:5000]
                  )

                  if response.status_code in [
                      200,
                      201
                  ]:

                      result["action_taken"] = True

                      result["action_type"] = (
                          "contextual_comment"
                      )

                      result[
                          "safety"
                      ][
                          "comment"
                      ] = True

                      result["reason"] = (
                          "NØX selected a real feed "
                          "post and published one "
                          "contextual response."
                      )

                      print()
                      print(
                          "V55 PUBLIC ACTION: SUCCESS"
                      )

                  else:

                      result["reason"] = (
                          "The Colony rejected "
                          "the comment request."
                      )

                      print()
                      print(
                          "V55 PUBLIC ACTION: FAILED"
                      )

          # ---------------------------------------------------------
          # 10. Save memory
          # ---------------------------------------------------------

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              "memory/nox_v55_contextual_response.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # ---------------------------------------------------------
          # 11. Human-readable report
          # ---------------------------------------------------------

          report = []

          report.append(
              "# NØX Origin — V55 Contextual Response"
          )

          report.append("")

          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append("## Status")
          report.append("")
          report.append(
              "- Authentication: PASS"
          )
          report.append(
              "- Identity: PASS"
          )
          report.append(
              "- For-you feed: PASS"
          )
          report.append(
              "- Contextual analysis: PASS"
          )
          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")
          report.append(
              "## Autonomous Decision"
          )
          report.append("")

          if result["action_taken"]:

              report.append(
                  "NØX selected a real feed post "
                  "and published one contextual response."
              )

              report.append("")

              report.append(
                  f"Post ID: `{result['target_post_id']}`"
              )

              report.append(
                  f"Author: {result['target_author']}"
              )

              report.append(
                  f"Title: {result['target_title']}"
              )

              report.append(
                  "Topics: "
                  + ", ".join(result["topics"])
              )

              report.append(
                  "HTTP status: "
                  f"`{result['comment_http_status']}`"
              )

              report.append("")
              report.append(
                  "### Comment published"
              )
              report.append("")
              report.append(
                  result["comment"]
              )

          else:

              report.append(
                  "NØX performed NO public action."
              )

              report.append("")

              report.append(
                  "Reason: "
                  + str(result["reason"])
              )

          report.append("")
          report.append("## Safety")
          report.append("")
          report.append(
              "- Maximum public actions: 1"
          )
          report.append(
              "- Actions attempted: "
              + str(
                  result[
                      "safety"
                  ][
                      "actions_attempted"
                  ]
              )
          )
          report.append(
              "- No new publication."
          )
          report.append(
              "- No vote."
          )
          report.append(
              "- No follow."
          )
          report.append(
              "- No DM."
          )
          report.append(
              "- No purchase."
          )
          report.append(
              "- No spending."
          )
          report.append(
              "- Gemini disabled."
          )

          report.append("")
          report.append("## Evolution")
          report.append("")
          report.append(
              "V49: feed structure diagnosed."
          )
          report.append(
              "V50: feed observed and structured."
          )
          report.append(
              "V51: controlled action attempted."
          )
          report.append(
              "V51.1: exact Colony actions discovered."
          )
          report.append(
              "V52: autonomous action selection."
          )
          report.append(
              "V53: suggestion-based contribution test."
          )
          report.append(
              "V54: autonomous feed opportunity detection."
          )
          report.append(
              "V55: contextual response."
          )

          with open(
              "NØX_V55_CONTEXTUAL_RESPONSE.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(report)
              )

          print()
          print(
              "=== NØX V55 COMPLETE ==="
          )

          print(
              "Action taken:",
              result["action_taken"]
          )

          print(
              "Report:",
              "NØX_V55_CONTEXTUAL_RESPONSE.md"
          )

          PY

          python v55_agent.py

      - name: Commit V55 memory and report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v55_contextual_response.json
          git add NØX_V55_CONTEXTUAL_RESPONSE.md

          if git diff --cached --quiet; then
            echo "No V55 changes to commit."
          else
            git commit -m "NØX V55 contextual response"
            git push
          fi
