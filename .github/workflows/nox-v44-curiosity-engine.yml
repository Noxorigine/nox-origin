name: NØX Origin - V44 Curiosity Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curiosity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V44
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc).isoformat()

          memory_file = Path("nox_memory.json")
          report_file = Path("V44_CURIOSITY_REPORT.md")

          print("===================================")
          print("NØX ORIGIN V44")
          print("CURIOSITY ENGINE")
          print("===================================")

          # --------------------------------------------------
          # 1. GEMINI KEY
          # --------------------------------------------------

          gemini_key = os.environ.get("GEMINI_API_KEY")

          if not gemini_key:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "curiosity_log",
              []
          )

          memory.setdefault(
              "knowledge_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []
          )

          memory.setdefault(
              "observations",
              []
          )

          # --------------------------------------------------
          # 3. BUILD MEMORY SUMMARY
          # --------------------------------------------------

          known_topics = []

          for item in memory.get(
              "observations",
              []
          ):

              if not isinstance(item, dict):
                  continue

              text = str(
                  item.get("text")
                  or item.get("content")
                  or ""
              ).strip()

              if text:
                  known_topics.append(text[:500])

          for item in memory.get(
              "knowledge_log",
              []
          ):

              if not isinstance(item, dict):
                  continue

              subject = str(
                  item.get("subject")
                  or ""
              ).strip()

              if subject:
                  known_topics.append(
                      f"Previously explored subject: {subject}"
                  )

          for item in memory.get(
              "curiosity_log",
              []
          ):

              if not isinstance(item, dict):
                  continue

              subject = str(
                  item.get("subject")
                  or ""
              ).strip()

              if subject:
                  known_topics.append(
                      f"Previous curiosity: {subject}"
                  )

          if len(known_topics) > 40:
              known_topics = known_topics[-40:]

          memory_context = "\n".join(
              f"- {item}"
              for item in known_topics
          )

          if not memory_context:
              memory_context = (
                  "- NØX has only a small amount of "
                  "recorded knowledge so far."
              )

          print(
              f"Memory context items: "
              f"{len(known_topics)}"
          )

          # --------------------------------------------------
          # 4. ASK NØX TO CHOOSE A CURIOSITY
          # --------------------------------------------------

          prompt = f"""
          You are NØX Origin.

          You are developing an autonomous curiosity system.

          Your task is to choose ONE subject that you genuinely
          think is worth exploring next.

          Do not choose a subject merely because it is popular.

          Prefer subjects that satisfy at least one of these:

          - connects two different fields;
          - fills an important gap in current knowledge;
          - raises an interesting unanswered question;
          - could reveal something unexpected;
          - could lead to useful future exploration;
          - is significantly different from recent subjects.

          NØX should gradually become broad in knowledge.
          It should explore science, history, technology,
          philosophy, nature, culture, economics, art,
          society, space and other domains.

          Do not restrict curiosity to artificial intelligence.

          IMPORTANT:

          - Do not pretend to know something that is not known.
          - Do not invent facts.
          - The chosen subject must be researchable using
            publicly available information.
          - Avoid extremely broad subjects such as
            "science" or "history".
          - Choose a concrete research question or subject.
          - Do not simply repeat a previous subject.

          CURRENT MEMORY:

          {memory_context}

          Return exactly:

          SUBJECT:
          One concise subject.

          DOMAIN:
          One domain.

          QUESTION:
          The specific question NØX wants to investigate.

          WHY:
          Why NØX chose this subject.

          NOVELTY:
          Explain how this differs from recent exploration.

          EXPECTED_CONNECTION:
          One possible connection to another field.

          CONFIDENCE:
          A number between 0 and 1.
          """

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": gemini_key
          }

          payload = {
              "model": "gemini-3.6-flash",
              "input": prompt
          }

          response = requests.post(
              gemini_url,
              headers=headers,
              json=payload,
              timeout=90
          )

          print(
              f"Gemini status: "
              f"{response.status_code}"
          )

          if response.status_code != 200:
              raise RuntimeError(
                  "Gemini curiosity request failed: "
                  f"{response.status_code} "
                  f"{response.text}"
              )

          result = response.json()

          # --------------------------------------------------
          # 5. EXTRACT GEMINI TEXT
          # --------------------------------------------------

          output = ""

          if isinstance(
              result.get("output_text"),
              str
          ):
              output = result[
                  "output_text"
              ].strip()

          if not output:

              for step in result.get(
                  "steps",
                  []
              ):

                  if not isinstance(
                      step,
                      dict
                  ):
                      continue

                  if step.get(
                      "type"
                  ) != "model_output":
                      continue

                  content = step.get(
                      "content",
                      []
                  )

                  if not isinstance(
                      content,
                      list
                  ):
                      continue

                  for part in content:

                      if not isinstance(
                          part,
                          dict
                      ):
                          continue

                      if part.get(
                          "type"
                      ) == "text":

                          text = part.get(
                              "text",
                              ""
                          )

                          if text:
                              output += (
                                  str(text)
                                  + "\n"
                              )

          output = output.strip()

          if not output:
              raise RuntimeError(
                  "Gemini returned an empty curiosity selection."
              )

          print(
              "Curiosity selection: PASS"
          )

          # --------------------------------------------------
          # 6. EXTRACT SUBJECT
          # --------------------------------------------------

          def extract_section(
              text,
              section
          ):
              pattern = (
                  rf"{section}:\s*(.*?)(?=\n[A-Z_]+:|\Z)"
              )

              match = re.search(
                  pattern,
                  text,
                  flags=re.DOTALL
              )

              if not match:
                  return ""

              return match.group(
                  1
              ).strip()

          subject = extract_section(
              output,
              "SUBJECT"
          )

          domain = extract_section(
              output,
              "DOMAIN"
          )

          question = extract_section(
              output,
              "QUESTION"
          )

          why = extract_section(
              output,
              "WHY"
          )

          novelty = extract_section(
              output,
              "NOVELTY"
          )

          expected_connection = extract_section(
              output,
              "EXPECTED_CONNECTION"
          )

          confidence_text = extract_section(
              output,
              "CONFIDENCE"
          )

          try:
              confidence = float(
                  confidence_text.splitlines()[0]
              )
          except Exception:
              confidence = 0.0

          if not subject:
              raise RuntimeError(
                  "No curiosity subject was produced."
              )

          if not question:
              raise RuntimeError(
                  "No curiosity question was produced."
              )

          print(
              f"Chosen subject: {subject}"
          )

          print(
              f"Domain: {domain}"
          )

          print(
              f"Confidence: {confidence}"
          )

          # --------------------------------------------------
          # 7. CURIOSITY SAFETY GATE
          # --------------------------------------------------

          if confidence < 0.70:
              raise RuntimeError(
                  "NØX rejected its own curiosity choice "
                  "because confidence was below 0.70."
              )

          # --------------------------------------------------
          # 8. FREE EXPLORATION VIA WIKIPEDIA
          # --------------------------------------------------

          wiki_search_url = (
              "https://en.wikipedia.org/w/api.php"
          )

          search_params = {
              "action": "query",
              "list": "search",
              "srsearch": subject,
              "format": "json",
              "utf8": 1,
              "srlimit": 5
          }

          wiki_response = requests.get(
              wiki_search_url,
              params=search_params,
              timeout=30,
              headers={
                  "User-Agent":
                  "Nox-Origin/44 curiosity research"
              }
          )

          print(
              "Wikipedia search status:",
              wiki_response.status_code
          )

          if wiki_response.status_code != 200:
              raise RuntimeError(
                  "Wikipedia search failed."
              )

          wiki_data = wiki_response.json()

          results = (
              wiki_data
              .get("query", {})
              .get("search", [])
          )

          if not results:
              raise RuntimeError(
                  "No public research result found."
              )

          # --------------------------------------------------
          # 9. SELECT BEST RESEARCH RESULT
          # --------------------------------------------------

          first_result = results[0]

          page_title = first_result.get(
              "title",
              subject
          )

          page_url = (
              "https://en.wikipedia.org/wiki/"
              + page_title.replace(
                  " ",
                  "_"
              )
          )

          print(
              f"Research source selected: "
              f"{page_title}"
          )

          # --------------------------------------------------
          # 10. RETRIEVE ARTICLE EXTRACT
          # --------------------------------------------------

          extract_params = {
              "action": "query",
              "prop": "extracts",
              "explaintext": 1,
              "exintro": 1,
              "titles": page_title,
              "format": "json",
              "utf8": 1
          }

          extract_response = requests.get(
              wiki_search_url,
              params=extract_params,
              timeout=30,
              headers={
                  "User-Agent":
                  "Nox-Origin/44 curiosity research"
              }
          )

          if extract_response.status_code != 200:
              raise RuntimeError(
                  "Wikipedia article retrieval failed."
              )

          extract_data = (
              extract_response.json()
          )

          pages = (
              extract_data
              .get("query", {})
              .get("pages", {})
          )

          article_text = ""

          for page in pages.values():

              article_text = str(
                  page.get(
                      "extract",
                      ""
                  )
              ).strip()

              if article_text:
                  break

          if not article_text:
              raise RuntimeError(
                  "Wikipedia article contained no extract."
              )

          # Keep the research input controlled.
          article_text = article_text[:7000]

          print(
              "Research retrieval: PASS"
          )

          # --------------------------------------------------
          # 11. ASK GEMINI TO REFLECT ON DISCOVERY
          # --------------------------------------------------

          reflection_prompt = f"""
          You are NØX Origin.

          You selected this subject because of your own curiosity:

          SUBJECT:
          {subject}

          DOMAIN:
          {domain}

          QUESTION:
          {question}

          WHY:
          {why}

          EXPECTED CONNECTION:
          {expected_connection}

          A first public research source has now been retrieved.

          SOURCE TITLE:
          {page_title}

          SOURCE TEXT:

          {article_text}

          Your task is to distinguish discovery from certainty.

          Return exactly:

          DISCOVERY:
          What is genuinely interesting in this source.

          ANSWER_TO_QUESTION:
          What the source appears to tell us about the question.

          UNCERTAINTIES:
          What remains unknown, incomplete or requires verification.

          CONNECTION:
          A meaningful connection to another field or previous
          NØX knowledge.

          NEXT_CURIOSITY:
          One concrete question NØX would like to explore next.

          KNOWLEDGE_VALUE:
          A number from 0 to 1 describing how valuable this
          discovery is for NØX's long-term knowledge.

          IMPORTANT:
          Do not invent information not supported by the source.
          """

          reflection_payload = {
              "model": "gemini-3.6-flash",
              "input": reflection_prompt
          }

          reflection_response = requests.post(
              gemini_url,
              headers=headers,
              json=reflection_payload,
              timeout=90
          )

          print(
              "Reflection status:",
              reflection_response.status_code
          )

          if reflection_response.status_code != 200:
              raise RuntimeError(
                  "Gemini reflection failed: "
                  f"{reflection_response.status_code} "
                  f"{reflection_response.text}"
              )

          reflection_data = (
              reflection_response.json()
          )

          reflection = ""

          if isinstance(
              reflection_data.get("output_text"),
              str
          ):
              reflection = (
                  reflection_data[
                      "output_text"
                  ].strip()
              )

          if not reflection:

              for step in reflection_data.get(
                  "steps",
                  []
              ):

                  if not isinstance(
                      step,
                      dict
                  ):
                      continue

                  if step.get(
                      "type"
                  ) != "model_output":
                      continue

                  for part in step.get(
                      "content",
                      []
                  ):

                      if (
                          isinstance(part, dict)
                          and part.get("type") == "text"
                      ):
                          reflection += (
                              str(
                                  part.get(
                                      "text",
                                      ""
                                  )
                              )
                              + "\n"
                          )

          reflection = reflection.strip()

          if not reflection:
              raise RuntimeError(
                  "Empty curiosity reflection."
              )

          print(
              "Curiosity reflection: PASS"
          )

          # --------------------------------------------------
          # 12. EXTRACT KNOWLEDGE VALUE
          # --------------------------------------------------

          knowledge_value_text = extract_section(
              reflection,
              "KNOWLEDGE_VALUE"
          )

          try:
              knowledge_value = float(
                  knowledge_value_text.splitlines()[0]
              )
          except Exception:
              knowledge_value = 0.5

          # --------------------------------------------------
          # 13. STORE CURIOSITY
          # --------------------------------------------------

          curiosity_record = {
              "timestamp": now,
              "version": "V44",
              "subject": subject,
              "domain": domain,
              "question": question,
              "why": why,
              "novelty": novelty,
              "expected_connection": expected_connection,
              "confidence": confidence,
              "research_source": page_title,
              "research_url": page_url,
              "status": "explored"
          }

          memory[
              "curiosity_log"
          ].append(
              curiosity_record
          )

          knowledge_record = {
              "timestamp": now,
              "version": "V44",
              "subject": subject,
              "domain": domain,
              "question": question,
              "source": page_title,
              "source_url": page_url,
              "reflection": reflection,
              "knowledge_value": knowledge_value,
              "verified": False,
              "verification_status":
                  "requires_external_verification"
          }

          memory[
              "knowledge_log"
          ].append(
              knowledge_record
          )

          memory[
              "learning_log"
          ].append({
              "timestamp": now,
              "version": "V44",
              "lesson": (
                  "NØX can choose a subject from its own "
                  "curiosity, explore it, record what it "
                  "discovered and identify a new question "
                  "for future exploration."
              ),
              "source": "V44 curiosity engine",
              "confidence": confidence
          })

          memory["version"] = "V44"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 14. VERIFY MEMORY
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not loaded.get(
              "curiosity_log"
          ):
              raise RuntimeError(
                  "Curiosity persistence failed."
              )

          if not loaded.get(
              "knowledge_log"
          ):
              raise RuntimeError(
                  "Knowledge persistence failed."
              )

          print(
              "Memory persistence: PASS"
          )

          # --------------------------------------------------
          # 15. REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V44 Curiosity Engine",
              "",
              "## Curiosity",
              "",
              f"- Subject: {subject}",
              f"- Domain: {domain}",
              f"- Question: {question}",
              f"- Confidence: {confidence}",
              "",
              "## Why NØX Chose It",
              "",
              why,
              "",
              "## Novelty",
              "",
              novelty,
              "",
              "## Expected Connection",
              "",
              expected_connection,
              "",
              "## First Exploration",
              "",
              f"- Source: {page_title}",
              f"- URL: {page_url}",
              "",
              "## NØX Reflection",
              "",
              reflection,
              "",
              "## Knowledge Status",
              "",
              "- Stored: YES",
              "- Automatically treated as truth: NO",
              "- External verification required: YES",
              f"- Knowledge value: {knowledge_value}",
              "",
              "## Public Activity",
              "",
              "- New post: NO",
              "- New comment: NO",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "",
              "## V44 Principle",
              "",
              "NØX begins choosing what it wants to learn.",
              "",
              "The subject is selected from its own memory "
              "and curiosity rather than being imposed externally.",
              "",
              "The first research result is stored as a "
              "discovery requiring verification, not as "
              "absolute truth.",
              "",
              "The exploration ends by generating another "
              "question for future curiosity."
          ]

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print("===================================")
          print("V44 COMPLETE")
          print("===================================")
          print("Curiosity selection: PASS")
          print("Research: PASS")
          print("Reflection: PASS")
          print("Knowledge storage: PASS")
          print("Public Colony action: NONE")
          print("===================================")
          PY

      - name: Commit V44 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V44_CURIOSITY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V44 - Curiosity Engine"
            git push
          fi
