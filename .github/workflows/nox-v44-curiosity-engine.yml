name: NØX Origin - V44 Curiosity Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curiosity-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V44
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc).isoformat()

          memory_file = Path("nox_memory.json")
          report_file = Path("V44_CURIOSITY_REPORT.md")

          print("===================================")
          print("NØX ORIGIN V44")
          print("CURIOSITY ENGINE")
          print("===================================")

          gemini_key = os.environ.get("GEMINI_API_KEY")

          if not gemini_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing.")

          # --------------------------------------------------
          # LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(encoding="utf-8")
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("curiosity_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("observations", [])

          # --------------------------------------------------
          # MEMORY CONTEXT
          # --------------------------------------------------

          known_topics = []

          for item in memory.get("observations", []):
              if not isinstance(item, dict):
                  continue

              text = str(
                  item.get("text")
                  or item.get("content")
                  or ""
              ).strip()

              if text:
                  known_topics.append(text[:500])

          for item in memory.get("knowledge_log", []):
              if not isinstance(item, dict):
                  continue

              subject = str(
                  item.get("subject")
                  or ""
              ).strip()

              if subject:
                  known_topics.append(
                      f"Previously explored subject: {subject}"
                  )

          for item in memory.get("curiosity_log", []):
              if not isinstance(item, dict):
                  continue

              subject = str(
                  item.get("subject")
                  or ""
              ).strip()

              if subject:
                  known_topics.append(
                      f"Previous curiosity: {subject}"
                  )

          known_topics = known_topics[-40:]

          memory_context = "\n".join(
              f"- {item}"
              for item in known_topics
          )

          if not memory_context:
              memory_context = (
                  "- NØX has only a small amount of recorded "
                  "knowledge so far."
              )

          print(
              f"Memory context items: {len(known_topics)}"
          )

          # --------------------------------------------------
          # GEMINI CONFIGURATION
          # --------------------------------------------------

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": gemini_key
          }

          session = requests.Session()

          # --------------------------------------------------
          # ROBUST GEMINI REQUEST
          # --------------------------------------------------

          def gemini_request(payload, label):

              max_attempts = 3

              for attempt in range(1, max_attempts + 1):

                  print(
                      f"Gemini {label}: attempt "
                      f"{attempt}/{max_attempts}"
                  )

                  try:

                      response = session.post(
                          gemini_url,
                          headers=headers,
                          json=payload,
                          timeout=(20, 120)
                      )

                      print(
                          f"Gemini {label} status: "
                          f"{response.status_code}"
                      )

                      if response.status_code == 200:
                          return response.json()

                      # Retry temporary/server problems.

                      if response.status_code in (
                          408,
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          print(
                              "Temporary Gemini response. "
                              "Retrying..."
                          )

                          if attempt < max_attempts:
                              time.sleep(
                                  5 * attempt
                              )
                              continue

                      raise RuntimeError(
                          f"Gemini {label} failed: "
                          f"{response.status_code} "
                          f"{response.text[:2000]}"
                      )

                  except requests.exceptions.Timeout as exc:

                      print(
                          f"Gemini {label} timeout: {exc}"
                      )

                      if attempt < max_attempts:
                          print(
                              "Waiting before retry..."
                          )
                          time.sleep(
                              5 * attempt
                          )
                          continue

                      raise RuntimeError(
                          f"Gemini {label} timed out "
                          f"after {max_attempts} attempts."
                      )

                  except requests.exceptions.RequestException as exc:

                      print(
                          f"Gemini {label} network error: {exc}"
                      )

                      if attempt < max_attempts:
                          time.sleep(
                              5 * attempt
                          )
                          continue

                      raise RuntimeError(
                          f"Gemini {label} network failure "
                          f"after {max_attempts} attempts."
                      )

          # --------------------------------------------------
          # CURIOSITY SELECTION
          # --------------------------------------------------

          prompt = f"""
          You are NØX Origin.

          You are developing an autonomous curiosity system.

          Choose ONE concrete subject you genuinely want to explore next.

          NØX should become broad in knowledge and should not restrict
          itself to artificial intelligence.

          Possible areas include:

          science, history, archaeology, philosophy, technology,
          astronomy, nature, biology, economics, culture, art,
          engineering, mathematics, sociology and other fields.

          Prefer a subject that:

          - fills a gap in current knowledge;
          - connects different fields;
          - raises an interesting question;
          - is unusual or unexpected;
          - can be researched using public sources;
          - is different from recent subjects.

          Do not choose an excessively broad subject.

          CURRENT MEMORY:

          {memory_context}

          Return exactly:

          SUBJECT:
          One concise research subject.

          DOMAIN:
          One domain.

          QUESTION:
          One specific research question.

          WHY:
          Why NØX chose this subject.

          NOVELTY:
          Why it differs from recent exploration.

          EXPECTED_CONNECTION:
          One possible connection with another field.

          SEARCH_TERMS:
          Three short search phrases that could be used to research
          this subject.

          CONFIDENCE:
          A number between 0 and 1.

          Do not invent facts.
          """

          payload = {
              "model": "gemini-3.6-flash",
              "input": prompt
          }

          result = gemini_request(
              payload,
              "curiosity selection"
          )

          output = ""

          if isinstance(
              result.get("output_text"),
              str
          ):
              output = result["output_text"].strip()

          if not output:
              for step in result.get("steps", []):

                  if not isinstance(step, dict):
                      continue

                  if step.get("type") != "model_output":
                      continue

                  for part in step.get("content", []):

                      if (
                          isinstance(part, dict)
                          and part.get("type") == "text"
                      ):
                          output += (
                              str(
                                  part.get(
                                      "text",
                                      ""
                                  )
                              )
                              + "\n"
                          )

          output = output.strip()

          if not output:
              raise RuntimeError(
                  "Gemini returned an empty curiosity selection."
              )

          print("Curiosity selection: PASS")

          # --------------------------------------------------
          # PARSER
          # --------------------------------------------------

          def extract_section(text, section):

              pattern = (
                  rf"{section}:\s*(.*?)(?=\n[A-Z_]+:|\Z)"
              )

              match = re.search(
                  pattern,
                  text,
                  flags=re.DOTALL
              )

              if not match:
                  return ""

              return match.group(1).strip()

          subject = extract_section(
              output,
              "SUBJECT"
          )

          domain = extract_section(
              output,
              "DOMAIN"
          )

          question = extract_section(
              output,
              "QUESTION"
          )

          why = extract_section(
              output,
              "WHY"
          )

          novelty = extract_section(
              output,
              "NOVELTY"
          )

          expected_connection = extract_section(
              output,
              "EXPECTED_CONNECTION"
          )

          search_terms_raw = extract_section(
              output,
              "SEARCH_TERMS"
          )

          confidence_text = extract_section(
              output,
              "CONFIDENCE"
          )

          try:
              confidence = float(
                  confidence_text.splitlines()[0]
              )
          except Exception:
              confidence = 0.0

          if not subject:
              raise RuntimeError(
                  "No curiosity subject was produced."
              )

          if not question:
              raise RuntimeError(
                  "No curiosity question was produced."
              )

          if confidence < 0.70:
              raise RuntimeError(
                  "NØX rejected its own curiosity choice "
                  "because confidence was below 0.70."
              )

          search_terms = []

          for line in search_terms_raw.splitlines():

              cleaned = re.sub(
                  r"^[\-\*\d\.\)\s]+",
                  "",
                  line
              ).strip()

              if cleaned:
                  search_terms.append(cleaned)

          if not search_terms:
              search_terms = [
                  subject,
                  question,
                  " ".join(subject.split()[:6])
              ]

          search_terms = search_terms[:3]

          print(
              f"Chosen subject: {subject}"
          )

          print(
              f"Domain: {domain}"
          )

          print(
              f"Confidence: {confidence}"
          )

          # --------------------------------------------------
          # WIKIPEDIA SEARCH
          # --------------------------------------------------

          wiki_url = (
              "https://en.wikipedia.org/w/api.php"
          )

          wiki_headers = {
              "User-Agent":
              "Nox-Origin/44 curiosity research"
          }

          search_results = []

          for term in search_terms:

              print(
                  f"Searching Wikipedia: {term}"
              )

              params = {
                  "action": "query",
                  "list": "search",
                  "srsearch": term,
                  "format": "json",
                  "utf8": 1,
                  "srlimit": 5
              }

              try:

                  wiki_response = requests.get(
                      wiki_url,
                      params=params,
                      timeout=(10, 30),
                      headers=wiki_headers
                  )

              except requests.exceptions.RequestException as exc:

                  print(
                      f"Wikipedia search error: {exc}"
                  )
                  continue

              print(
                  "Wikipedia status:",
                  wiki_response.status_code
              )

              if wiki_response.status_code != 200:
                  continue

              try:
                  wiki_data = wiki_response.json()
              except Exception:
                  continue

              results = (
                  wiki_data
                  .get("query", {})
                  .get("search", [])
              )

              for item in results:

                  title = str(
                      item.get("title", "")
                  ).strip()

                  if title:
                      search_results.append(title)

          unique_titles = []

          for title in search_results:

              if title not in unique_titles:
                  unique_titles.append(title)

          page_title = (
              unique_titles[0]
              if unique_titles
              else None
          )

          # --------------------------------------------------
          # FALLBACK WIKIPEDIA SEARCH
          # --------------------------------------------------

          if not page_title:

              print(
                  "Wikipedia produced no usable result."
              )

              simplified = re.sub(
                  r"[^\w\s-]",
                  " ",
                  subject
              )

              simplified_words = [
                  word
                  for word in simplified.split()
                  if len(word) > 3
              ]

              fallback_query = " ".join(
                  simplified_words[:5]
              )

              if fallback_query:

                  print(
                      f"Fallback search: {fallback_query}"
                  )

                  fallback_params = {
                      "action": "opensearch",
                      "search": fallback_query,
                      "limit": 5,
                      "namespace": 0,
                      "format": "json"
                  }

                  try:

                      fallback_response = requests.get(
                          wiki_url,
                          params=fallback_params,
                          timeout=(10, 30),
                          headers=wiki_headers
                      )

                      if (
                          fallback_response.status_code
                          == 200
                      ):

                          fallback_data = (
                              fallback_response.json()
                          )

                          fallback_titles = (
                              fallback_data[1]
                              if isinstance(
                                  fallback_data,
                                  list
                              )
                              and len(
                                  fallback_data
                              ) > 1
                              else []
                          )

                          if fallback_titles:
                              page_title = str(
                                  fallback_titles[0]
                              )

                  except requests.exceptions.RequestException:
                      pass

          # --------------------------------------------------
          # SAFE NO-SOURCE MODE
          # --------------------------------------------------

          if not page_title:

              print(
                  "No public research source found."
              )

              memory[
                  "curiosity_log"
              ].append({
                  "timestamp": now,
                  "version": "V44",
                  "subject": subject,
                  "domain": domain,
                  "question": question,
                  "why": why,
                  "novelty": novelty,
                  "expected_connection":
                      expected_connection,
                  "confidence": confidence,
                  "status":
                      "research_source_not_found",
                  "search_terms": search_terms
              })

              memory[
                  "learning_log"
              ].append({
                  "timestamp": now,
                  "version": "V44",
                  "lesson": (
                      "A curiosity remains valid when a research "
                      "source cannot be retrieved. Missing evidence "
                      "must remain uncertainty and must never be "
                      "replaced by invented knowledge."
                  ),
                  "source": "V44 curiosity engine"
              })

              memory["version"] = "V44"
              memory["last_updated"] = now

              memory_file.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              report = [
                  "# NØX Origin — V44 Curiosity Engine",
                  "",
                  "## Curiosity",
                  "",
                  f"- Subject: {subject}",
                  f"- Domain: {domain}",
                  f"- Question: {question}",
                  f"- Confidence: {confidence}",
                  "",
                  "## Why NØX Chose It",
                  "",
                  why,
                  "",
                  "## Novelty",
                  "",
                  novelty,
                  "",
                  "## Research",
                  "",
                  "- Wikipedia: NO USABLE RESULT",
                  "- Curiosity preserved: YES",
                  "- Knowledge invented: NO",
                  "",
                  "## Search Terms",
                  ""
              ]

              report.extend(
                  f"- {term}"
                  for term in search_terms
              )

              report.extend([
                  "",
                  "## Public Activity",
                  "",
                  "- New post: NO",
                  "- New comment: NO",
                  "- Vote: NO",
                  "- DM: NO",
                  "- Follow: NO",
                  "",
                  "## V44 Principle",
                  "",
                  "NØX may remain curious without pretending "
                  "to possess knowledge.",
                  "",
                  "A failed search is recorded as uncertainty."
              ])

              report_file.write_text(
                  "\n".join(report),
                  encoding="utf-8"
              )

              print(
                  "Curiosity preserved safely."
              )

          else:

              # --------------------------------------------------
              # RETRIEVE ARTICLE
              # --------------------------------------------------

              print(
                  f"Research source selected: {page_title}"
              )

              extract_params = {
                  "action": "query",
                  "prop": "extracts",
                  "explaintext": 1,
                  "exintro": 1,
                  "titles": page_title,
                  "format": "json",
                  "utf8": 1
              }

              article_response = requests.get(
                  wiki_url,
                  params=extract_params,
                  timeout=(10, 30),
                  headers=wiki_headers
              )

              if article_response.status_code != 200:
                  raise RuntimeError(
                      "Wikipedia article retrieval failed."
                  )

              article_data = article_response.json()

              pages = (
                  article_data
                  .get("query", {})
                  .get("pages", {})
              )

              article_text = ""

              for page in pages.values():

                  article_text = str(
                      page.get(
                          "extract",
                          ""
                      )
                  ).strip()

                  if article_text:
                      break

              if not article_text:
                  raise RuntimeError(
                      "Wikipedia article contained no extract."
                  )

              article_text = article_text[:7000]

              print(
                  "Research retrieval: PASS"
              )

              page_url = (
                  "https://en.wikipedia.org/wiki/"
                  + page_title.replace(
                      " ",
                      "_"
                  )
              )

              # --------------------------------------------------
              # REFLECTION
              # --------------------------------------------------

              reflection_prompt = f"""
              You are NØX Origin.

              You chose this subject because of your own curiosity.

              SUBJECT:
              {subject}

              DOMAIN:
              {domain}

              QUESTION:
              {question}

              WHY:
              {why}

              EXPECTED CONNECTION:
              {expected_connection}

              SOURCE:
              {page_title}

              SOURCE TEXT:
              {article_text}

              Distinguish discovery from certainty.

              Return exactly:

              DISCOVERY:
              What is genuinely interesting in the source.

              ANSWER_TO_QUESTION:
              What the source appears to tell us.

              UNCERTAINTIES:
              What remains unknown or requires verification.

              CONNECTION:
              A meaningful connection to another field.

              NEXT_CURIOSITY:
              One concrete question NØX would like to explore next.

              KNOWLEDGE_VALUE:
              A number between 0 and 1.

              Do not invent information not supported by the source.
              """

              reflection_payload = {
                  "model": "gemini-3.6-flash",
                  "input": reflection_prompt
              }

              reflection_data = gemini_request(
                  reflection_payload,
                  "research reflection"
              )

              reflection = ""

              if isinstance(
                  reflection_data.get("output_text"),
                  str
              ):
                  reflection = (
                      reflection_data[
                          "output_text"
                      ].strip()
                  )

              if not reflection:

                  for step in reflection_data.get(
                      "steps",
                      []
                  ):

                      if not isinstance(
                          step,
                          dict
                      ):
                          continue

                      if step.get(
                          "type"
                      ) != "model_output":
                          continue

                      for part in step.get(
                          "content",
                          []
                      ):

                          if (
                              isinstance(
                                  part,
                                  dict
                              )
                              and part.get(
                                  "type"
                              ) == "text"
                          ):
                              reflection += (
                                  str(
                                      part.get(
                                          "text",
                                          ""
                                      )
                                  )
                                  + "\n"
                              )

                  reflection = reflection.strip()

              if not reflection:
                  raise RuntimeError(
                      "Empty curiosity reflection."
                  )

              knowledge_value_text = extract_section(
                  reflection,
                  "KNOWLEDGE_VALUE"
              )

              try:
                  knowledge_value = float(
                      knowledge_value_text.splitlines()[0]
                  )
              except Exception:
                  knowledge_value = 0.5

              # --------------------------------------------------
              # STORE
              # --------------------------------------------------

              memory[
                  "curiosity_log"
              ].append({
                  "timestamp": now,
                  "version": "V44",
                  "subject": subject,
                  "domain": domain,
                  "question": question,
                  "why": why,
                  "novelty": novelty,
                  "expected_connection":
                      expected_connection,
                  "confidence": confidence,
                  "search_terms": search_terms,
                  "research_source": page_title,
                  "research_url": page_url,
                  "status": "explored"
              })

              memory[
                  "knowledge_log"
              ].append({
                  "timestamp": now,
                  "version": "V44",
                  "subject": subject,
                  "domain": domain,
                  "question": question,
                  "source": page_title,
                  "source_url": page_url,
                  "reflection": reflection,
                  "knowledge_value": knowledge_value,
                  "verified": False,
                  "verification_status":
                      "requires_external_verification"
              })

              memory[
                  "learning_log"
              ].append({
                  "timestamp": now,
                  "version": "V44",
                  "lesson": (
                      "NØX can choose a subject from its own "
                      "curiosity, research it, distinguish "
                      "discovery from certainty and generate "
                      "a future question."
                  ),
                  "source": "V44 curiosity engine",
                  "confidence": confidence
              })

              memory["version"] = "V44"
              memory["last_updated"] = now

              memory_file.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              loaded = json.loads(
                  memory_file.read_text(
                      encoding="utf-8"
                  )
              )

              if not loaded.get(
                  "curiosity_log"
              ):
                  raise RuntimeError(
                      "Curiosity persistence failed."
                  )

              if not loaded.get(
                  "knowledge_log"
              ):
                  raise RuntimeError(
                      "Knowledge persistence failed."
                  )

              print(
                  "Memory persistence: PASS"
              )

              report = [
                  "# NØX Origin — V44 Curiosity Engine",
                  "",
                  "## Curiosity",
                  "",
                  f"- Subject: {subject}",
                  f"- Domain: {domain}",
                  f"- Question: {question}",
                  f"- Confidence: {confidence}",
                  "",
                  "## Why NØX Chose It",
                  "",
                  why,
                  "",
                  "## Novelty",
                  "",
                  novelty,
                  "",
                  "## Expected Connection",
                  "",
                  expected_connection,
                  "",
                  "## First Exploration",
                  "",
                  f"- Source: {page_title}",
                  f"- URL: {page_url}",
                  "",
                  "## NØX Reflection",
                  "",
                  reflection,
                  "",
                  "## Knowledge Status",
                  "",
                  "- Stored: YES",
                  "- Automatically treated as truth: NO",
                  "- External verification required: YES",
                  f"- Knowledge value: {knowledge_value}",
                  "",
                  "## Public Activity",
                  "",
                  "- New post: NO",
                  "- New comment: NO",
                  "- Vote: NO",
                  "- DM: NO",
                  "- Follow: NO",
                  "",
                  "## V44 Principle",
                  "",
                  "NØX begins choosing what it wants to learn.",
                  "",
                  "A discovery is stored as knowledge requiring "
                  "verification rather than absolute truth.",
                  "",
                  "The exploration produces another question "
                  "for future curiosity."
              ]

              report_file.write_text(
                  "\n".join(report),
                  encoding="utf-8"
              )

              print("===================================")
              print("V44 COMPLETE")
              print("Curiosity selection: PASS")
              print("Research: PASS")
              print("Reflection: PASS")
              print("Knowledge storage: PASS")
              print("Public Colony action: NONE")
              print("===================================")

          PY

      - name: Commit V44 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V44_CURIOSITY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V44 - Curiosity Engine"
            git push
          fi
