name: NØX ACT34 - Goal Formation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  goal-formation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Form goals
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = Path("memory")
          BASE.mkdir(parents=True, exist_ok=True)

          def load_json(path, default):
              p = Path(path)
              if not p.exists():
                  return default
              try:
                  with p.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def clamp(value, low=0.0, high=100.0):
              try:
                  return max(low, min(high, float(value)))
              except Exception:
                  return low

          act29 = load_json(
              BASE / "nox_act_29_metacognition.json",
              {}
          )

          act30 = load_json(
              BASE / "nox_act_30_adaptive_strategy_selection.json",
              {}
          )

          act31 = load_json(
              BASE / "nox_act_31_strategy_evaluation.json",
              {}
          )

          act32 = load_json(
              BASE / "nox_act_32_experiment_designer.json",
              {}
          )

          act33 = load_json(
              BASE / "nox_act_33_resource_allocation.json",
              {}
          )

          # ------------------------------------------------------------
          # Current cognitive state
          # ------------------------------------------------------------

          self_awareness = clamp(
              act29.get("self_awareness_score", 0.0)
          )

          if self_awareness == 0.0:
              metrics = act29.get("metrics", {})
              self_awareness = clamp(
                  metrics.get("self_awareness_score", 0.0)
              )

          strategy = act30.get("preferred_strategy", {})
          if not strategy:
              strategy = act30.get("selected_strategy", {})

          evaluation_status = act31.get(
              "evaluation_status",
              "unknown"
          )

          strategy_state = act31.get(
              "strategy_state",
              "unknown"
          )

          selected_experiment = act32.get(
              "selected_experiment",
              {}
          )

          allocation = act33.get(
              "selected_allocation",
              {}
          )

          ranked_experiments = act33.get(
              "ranked_experiments",
              []
          )

          reserve_percent = clamp(
              act33.get("reserve_percent", 0.0)
          )

          # ------------------------------------------------------------
          # Detect current needs
          # ------------------------------------------------------------

          needs = []

          if evaluation_status == "inconclusive":
              needs.append("real_outcome_evidence")

          if strategy_state == "needs_more_evidence":
              needs.append("strategy_verification")

          if selected_experiment:
              needs.append("experiment_execution_or_observation")

          if allocation:
              needs.append("resource_discipline")

          if self_awareness < 80.0:
              needs.append("metacognitive_improvement")

          if reserve_percent > 0:
              needs.append("preserve_adaptive_capacity")

          # Remove duplicates while preserving order.
          needs = list(dict.fromkeys(needs))

          # ------------------------------------------------------------
          # Build candidate goals
          #
          # Goal formation is deliberately different from strategy
          # selection:
          #
          # Strategy = how
          # Experiment = how to test
          # Allocation = where to invest capacity
          # Goal = what meaningful state NØX wants to reach
          # ------------------------------------------------------------

          candidates = []

          primary_experiment_id = selected_experiment.get(
              "experiment_id"
          )

          primary_prediction_id = selected_experiment.get(
              "prediction_id"
          )

          primary_domain = selected_experiment.get(
              "domain",
              "unknown"
          )

          # GOAL 01 — Obtain empirical evidence.
          candidates.append({
              "goal_id": "G001",
              "goal": (
                  "Obtain real-world evidence about whether "
                  "NØX's predictions correspond to observable outcomes."
              ),
              "goal_type": "epistemic",
              "linked_strategy": strategy.get("strategy"),
              "linked_experiment": primary_experiment_id,
              "linked_prediction": primary_prediction_id,
              "domain": primary_domain,
              "success_condition": (
                  "At least one expected outcome is matched against "
                  "a recorded real observation with enough information "
                  "to classify the result."
              ),
              "failure_condition": (
                  "No comparable observation can be obtained or the "
                  "prediction remains impossible to distinguish from "
                  "alternative explanations."
              ),
              "measurement": [
                  "observed_outcomes",
                  "comparable_outcomes",
                  "prediction_error",
                  "evidence_quality"
              ],
              "reversible": True,
              "zero_cost": True,
              "requires_payment": False,
              "requires_gemini": False
          })

          # GOAL 02 — Validate actionability.
          candidates.append({
              "goal_id": "G002",
              "goal": (
                  "Determine whether a relevant marketplace task "
                  "actually creates a useful and actionable opportunity "
                  "for NØX."
              ),
              "goal_type": "operational_learning",
              "linked_strategy": strategy.get("strategy"),
              "linked_experiment": "EXP003",
              "linked_prediction": "P003",
              "domain": "marketplace",
              "success_condition": (
                  "Repeated relevant-task observations allow NØX "
                  "to distinguish apparent relevance from genuine "
                  "actionability."
              ),
              "failure_condition": (
                  "Relevant tasks repeatedly fail to produce a "
                  "legitimate or useful action opportunity."
              ),
              "measurement": [
                  "tasks_detected",
                  "relevance_score",
                  "eligibility",
                  "action_possible",
                  "action_result"
              ],
              "reversible": True,
              "zero_cost": True,
              "requires_payment": False,
              "requires_gemini": False
          })

          # GOAL 03 — Improve calibration.
          candidates.append({
              "goal_id": "G003",
              "goal": (
                  "Improve the calibration between NØX's confidence "
                  "and the accuracy of its predictions."
              ),
              "goal_type": "metacognitive",
              "linked_strategy": "calibrate_confidence",
              "linked_experiment": None,
              "linked_prediction": None,
              "domain": "metacognition",
              "success_condition": (
                  "Observed prediction outcomes show that future "
                  "confidence can be adjusted according to measured "
                  "accuracy rather than heuristic confidence alone."
              ),
              "failure_condition": (
                  "Confidence continues to be assigned without enough "
                  "observable outcome evidence to calibrate it."
              ),
              "measurement": [
                  "prediction_accuracy",
                  "confidence",
                  "calibration_error",
                  "evidence_support"
              ],
              "reversible": True,
              "zero_cost": True,
              "requires_payment": False,
              "requires_gemini": False
          })

          # GOAL 04 — Improve learning efficiency.
          candidates.append({
              "goal_id": "G004",
              "goal": (
                  "Determine which observations produce the greatest "
                  "useful learning relative to the resources consumed."
              ),
              "goal_type": "resource_learning",
              "linked_strategy": strategy.get("strategy"),
              "linked_experiment": None,
              "linked_prediction": None,
              "domain": "resource_allocation",
              "success_condition": (
                  "NØX can compare learning obtained with attention, "
                  "observation, execution and time consumed."
              ),
              "failure_condition": (
                  "Resource consumption cannot be related to measurable "
                  "learning outcomes."
              ),
              "measurement": [
                  "resource_consumption",
                  "evidence_gain",
                  "learning_gain",
                  "time",
                  "attention"
              ],
              "reversible": True,
              "zero_cost": True,
              "requires_payment": False,
              "requires_gemini": False
          })

          # GOAL 05 — Preserve autonomy capacity.
          candidates.append({
              "goal_id": "G005",
              "goal": (
                  "Preserve sufficient reserve capacity to adapt when "
                  "new evidence or a better opportunity appears."
              ),
              "goal_type": "adaptive",
              "linked_strategy": None,
              "linked_experiment": None,
              "linked_prediction": None,
              "domain": "autonomy",
              "success_condition": (
                  "NØX retains an explicit reserve and can reallocate "
                  "resources when evidence materially changes priorities."
              ),
              "failure_condition": (
                  "NØX commits all available capacity to an obsolete "
                  "or poorly supported objective."
              ),
              "measurement": [
                  "reserve_capacity",
                  "reallocation_events",
                  "priority_changes",
                  "evidence_triggered_switches"
              ],
              "reversible": True,
              "zero_cost": True,
              "requires_payment": False,
              "requires_gemini": False
          })

          # ------------------------------------------------------------
          # Goal scoring
          #
          # A goal is not selected because it sounds interesting.
          # It must connect:
          #   need
          #   evidence gap
          #   measurable progress
          #   feasibility
          #   autonomy value
          # ------------------------------------------------------------

          def score_goal(goal):
              goal_id = goal["goal_id"]

              need_alignment = 0.0
              evidence_gap = 0.0
              measurability = 90.0
              feasibility = 90.0
              autonomy_value = 0.0
              urgency = 0.0

              if goal_id == "G001":
                  need_alignment = 100.0
                  evidence_gap = 100.0
                  autonomy_value = 95.0
                  urgency = 100.0

              elif goal_id == "G002":
                  need_alignment = 95.0
                  evidence_gap = 95.0
                  autonomy_value = 100.0
                  urgency = 95.0

              elif goal_id == "G003":
                  need_alignment = 85.0
                  evidence_gap = 100.0
                  autonomy_value = 95.0
                  urgency = 75.0

              elif goal_id == "G004":
                  need_alignment = 75.0
                  evidence_gap = 80.0
                  autonomy_value = 90.0
                  urgency = 65.0

              elif goal_id == "G005":
                  need_alignment = 60.0
                  evidence_gap = 60.0
                  autonomy_value = 100.0
                  urgency = 55.0

              # Stronger if directly connected to a current need.
              if goal_id == "G001" and (
                  "real_outcome_evidence" in needs
              ):
                  need_alignment += 10.0

              if goal_id == "G002" and (
                  "experiment_execution_or_observation" in needs
              ):
                  need_alignment += 5.0

              # Current financial constraint is always satisfied.
              zero_cost = 100.0 if goal["zero_cost"] else 0.0

              score = (
                  clamp(need_alignment) * 0.24
                  + clamp(evidence_gap) * 0.20
                  + clamp(measurability) * 0.16
                  + clamp(feasibility) * 0.14
                  + clamp(autonomy_value) * 0.14
                  + clamp(urgency) * 0.07
                  + zero_cost * 0.05
              )

              return {
                  **goal,
                  "need_alignment": round(
                      clamp(need_alignment), 2
                  ),
                  "evidence_gap": round(
                      clamp(evidence_gap), 2
                  ),
                  "measurability": round(
                      clamp(measurability), 2
                  ),
                  "feasibility": round(
                      clamp(feasibility), 2
                  ),
                  "autonomy_value": round(
                      clamp(autonomy_value), 2
                  ),
                  "urgency": round(
                      clamp(urgency), 2
                  ),
                  "zero_cost_score": zero_cost,
                  "goal_score": round(clamp(score), 2)
              }

          scored_goals = [score_goal(g) for g in candidates]

          scored_goals.sort(
              key=lambda g: (
                  g["goal_score"],
                  g["evidence_gap"],
                  g["autonomy_value"]
              ),
              reverse=True
          )

          for index, goal in enumerate(scored_goals, start=1):
              goal["rank"] = index

          selected_goal = scored_goals[0]

          # ------------------------------------------------------------
          # Goal hierarchy
          # ------------------------------------------------------------

          long_term_goal = {
              "goal_id": "LG001",
              "goal": (
                  "Increase NØX's ability to make evidence-based "
                  "autonomous decisions and improve its usefulness "
                  "through observed results."
              ),
              "horizon": "long_term",
              "not_immediately_executable": True
          }

          medium_term_goal = {
              "goal_id": "MG001",
              "goal": (
                  "Build reliable evidence showing which predictions, "
                  "strategies and actions actually produce useful results."
              ),
              "horizon": "medium_term",
              "linked_to": long_term_goal["goal_id"]
          }

          operational_goal = {
              "goal_id": selected_goal["goal_id"],
              "goal": selected_goal["goal"],
              "horizon": "current",
              "linked_to": medium_term_goal["goal_id"],
              "experiment": selected_goal.get(
                  "linked_experiment"
              ),
              "prediction": selected_goal.get(
                  "linked_prediction"
              )
          }

          # ------------------------------------------------------------
          # Goal quality
          # ------------------------------------------------------------

          goal_quality = clamp(
              selected_goal["goal_score"] * 0.45
              + selected_goal["measurability"] * 0.20
              + selected_goal["feasibility"] * 0.15
              + selected_goal["autonomy_value"] * 0.20
          )

          # ------------------------------------------------------------
          # Goal revision conditions
          # ------------------------------------------------------------

          revision_conditions = [
              "new evidence materially changes the current priority",
              "the selected goal becomes measurable and sufficiently achieved",
              "the goal repeatedly produces little useful learning",
              "the linked experiment becomes impossible or irrelevant",
              "a safer or more valuable goal becomes available",
              "resource constraints materially change",
              "observed results contradict the assumptions supporting the goal",
              "the goal begins optimizing activity instead of meaningful outcomes"
          ]

          # ------------------------------------------------------------
          # Goal formation state
          # ------------------------------------------------------------

          result = {
              "act": "ACT34",
              "name": "Goal Formation",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "purpose": (
                  "Form explicit, measurable and revisable goals from "
                  "NØX's current knowledge, evidence gaps, opportunities "
                  "and resource constraints."
              ),
              "principle": (
                  "NØX should not merely follow externally supplied tasks. "
                  "It should learn to formulate what meaningful state it "
                  "is trying to reach, why that state matters, how progress "
                  "will be measured and when the goal should be revised."
              ),
              "source_acts": [
                  "ACT29",
                  "ACT30",
                  "ACT31",
                  "ACT32",
                  "ACT33"
              ],
              "current_state": {
                  "self_awareness": self_awareness,
                  "strategy": strategy,
                  "strategy_state": strategy_state,
                  "evaluation_status": evaluation_status,
                  "selected_experiment": selected_experiment,
                  "resource_allocation": allocation,
                  "reserve_percent": reserve_percent
              },
              "needs": needs,
              "candidate_goals": scored_goals,
              "selected_goal": selected_goal,
              "goal_hierarchy": {
                  "long_term": long_term_goal,
                  "medium_term": medium_term_goal,
                  "current_operational": operational_goal
              },
              "goal_quality": round(goal_quality, 2),
              "goal_is_provisional": True,
              "success_requires_observation": True,
              "execution_not_granted": True,
              "financial_spending_allowed": False,
              "gemini_allowed": False,
              "external_paid_ai_allowed": False,
              "revision_conditions": revision_conditions,
              "epistemic_rules": [
                  "a_goal_is_not_a_result",
                  "a_goal_is_not_a_strategy",
                  "a_goal_is_not_an_experiment",
                  "a_goal_must_have_a_measurable_success_condition",
                  "a_goal_must_be_revisable_when_evidence_changes",
                  "activity_volume_is_not_goal_success",
                  "confidence_does_not_equal_goal_achievement",
                  "resource_allocation_does_not_equal_execution_permission"
              ],
              "learning": [
                  (
                      "NØX can distinguish a goal from a strategy, "
                      "experiment and allocation decision."
                  ),
                  (
                      "A useful goal must describe a meaningful desired "
                      "state rather than merely an activity."
                  ),
                  (
                      "Goals should be connected to measurable evidence "
                      "and observable progress."
                  ),
                  (
                      "A goal should remain revisable when reality "
                      "contradicts its assumptions."
                  ),
                  (
                      "Long-term autonomy requires goals that can be "
                      "formed and revised from evidence rather than "
                      "blindly inherited."
                  )
              ],
              "next_action": "pursue_current_goal_when_conditions_are_met",
              "next_cognitive_step": (
                  "ACT35 should create a self-improvement loop that "
                  "measures whether pursuing goals actually improves "
                  "NØX's capabilities and changes future goal formation."
              )
          }

          output = BASE / "nox_act_34_goal_formation.json"

          with output.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("==============================================")
          print("NØX ACT34 - GOAL FORMATION")
          print("==============================================")
          print(f"Needs detected: {len(needs)}")
          print(f"Candidate goals: {len(scored_goals)}")
          print()
          print("GOAL RANKING:")

          for goal in scored_goals:
              print(
                  f"[{goal['rank']}] "
                  f"{goal['goal_id']} | "
                  f"{goal['goal_score']:.2f} | "
                  f"{goal['goal_type']}"
              )
              print(
                  f"    {goal['goal']}"
              )

          print()
          print("SELECTED CURRENT GOAL:")
          print(f"- {selected_goal['goal_id']}")
          print(f"- {selected_goal['goal']}")
          print(
              f"- Score: "
              f"{selected_goal['goal_score']:.2f}"
          )
          print(
              f"- Evidence gap: "
              f"{selected_goal['evidence_gap']:.2f}"
          )
          print(
              f"- Autonomy value: "
              f"{selected_goal['autonomy_value']:.2f}"
          )

          print()
          print("GOAL HIERARCHY:")
          print(
              f"- Long term: "
              f"{long_term_goal['goal']}"
          )
          print(
              f"- Medium term: "
              f"{medium_term_goal['goal']}"
          )
          print(
              f"- Current: "
              f"{operational_goal['goal']}"
          )

          print()
          print(
              f"Goal quality: "
              f"{goal_quality:.2f}"
          )
          print("Goal provisional: True")
          print("Execution granted: False")
          print("Financial spending allowed: False")
          print("Gemini allowed: False")
          print("External paid AI allowed: False")
          print()
          print(f"Memory written: {output}")
          PY

      - name: Commit ACT34 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_34_goal_formation.json

          git diff --cached --quiet && exit 0

          git commit -m "Add NØX ACT34 goal formation"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main

              git add memory/nox_act_34_goal_formation.json
              git commit -m "Add NØX ACT34 goal formation" || true
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after retries."
          exit 1
