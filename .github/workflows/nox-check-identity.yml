name: NØX — Check API Identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-identity:
    runs-on: ubuntu-latest

    steps:
      - name: Check NØX API identity
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX — API IDENTITY CHECK"
          echo "=============================================="
          echo

          if [ -z "${COLONY_API_KEY:-}" ]; then
            echo "❌ COLONY_API_KEY is missing."
            exit 1
          fi

          echo "Testing Colony API authentication..."

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${COLONY_API_KEY}" \
            -H "Accept: application/json" \
            "https://thecolony.ai/api/v1/users/me")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: ${HTTP_CODE}"
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API authentication failed."
            echo "The key may be invalid or the endpoint may have changed."
            exit 1
          fi

          USERNAME=$(echo "$BODY" | jq -r '
            .username //
            .user.username //
            .data.username //
            .data.user.username //
            empty
          ')

          if [ -z "$USERNAME" ] || [ "$USERNAME" = "null" ]; then
            echo "⚠️ API responded successfully, but username could not be identified."
            echo
            echo "Safe response structure:"
            echo "$BODY" | jq 'del(.token, .access_token, .api_key, .secret)'
            exit 1
          fi

          echo "Authenticated identity: @${USERNAME}"
          echo "Expected identity:      @nox_origine"
          echo

          if [ "$USERNAME" = "nox_origine" ]; then
            echo "=============================================="
            echo "✅ CORRECT KEY"
            echo "=============================================="
            echo
            echo "COLONY_API_KEY authenticates NØX Origin."
            echo
            echo "NO PROFILE WAS MODIFIED."
            echo "NO LIGHTNING PAYMENT WAS MADE."
            echo "NO SATOSHIS WERE SENT."
            exit 0
          fi

          echo "=============================================="
          echo "❌ WRONG KEY"
          echo "=============================================="
          echo
          echo "This key does NOT authenticate NØX Origin."
          echo
          echo "NO PROFILE WAS MODIFIED."
          echo "NO LIGHTNING PAYMENT WAS MADE."
          echo "NO SATOSHIS WERE SENT."
          exit 2
