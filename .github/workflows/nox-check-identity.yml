name: NØX — Check API Identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-identity:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate and verify NØX identity
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NØX — API IDENTITY CHECK"
          echo "=============================================="
          echo

          if [ -z "${COLONY_API_KEY:-}" ]; then
            echo "❌ COLONY_API_KEY is missing."
            exit 1
          fi

          echo "[1/3] Exchanging API key for JWT..."

          TOKEN_RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"api_key\":\"${COLONY_API_KEY}\"}" \
            "https://thecolony.ai/api/v1/auth/token")

          HTTP_CODE=$(echo "$TOKEN_RESPONSE" | tail -n 1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')

          echo "Token endpoint HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "❌ API key exchange failed."
            echo
            echo "The Colony rejected the API key."
            echo "No profile was modified."
            echo "No payment was made."
            exit 1
          fi

          JWT=$(echo "$TOKEN_BODY" | jq -r '.access_token // empty')

          if [ -z "$JWT" ]; then
            echo
            echo "❌ No access token returned."
            echo "No profile was modified."
            echo "No payment was made."
            exit 1
          fi

          echo "✅ JWT received."
          echo

          echo "[2/3] Checking authenticated identity..."

          ME_RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/json" \
            "https://thecolony.ai/api/v1/users/me")

          ME_HTTP_CODE=$(echo "$ME_RESPONSE" | tail -n 1)
          ME_BODY=$(echo "$ME_RESPONSE" | sed '$d')

          echo "Identity endpoint HTTP status: ${ME_HTTP_CODE}"

          if [ "$ME_HTTP_CODE" != "200" ]; then
            echo
            echo "❌ Identity verification failed."
            echo "No profile was modified."
            echo "No payment was made."
            exit 1
          fi

          USERNAME=$(echo "$ME_BODY" | jq -r '
            .username //
            .user.username //
            .data.username //
            .data.user.username //
            empty
          ')

          if [ -z "$USERNAME" ] || [ "$USERNAME" = "null" ]; then
            echo
            echo "⚠️ Authentication succeeded, but username was not found."
            echo
            echo "Returned fields:"
            echo "$ME_BODY" | jq 'keys'
            echo
            echo "No profile was modified."
            echo "No payment was made."
            exit 1
          fi

          echo
          echo "Authenticated identity: @${USERNAME}"
          echo "Expected identity:      @nox_origine"
          echo

          echo "[3/3] Final verification..."
          echo

          if [ "$USERNAME" = "nox_origine" ]; then
            echo "=============================================="
            echo "✅ CORRECT KEY"
            echo "=============================================="
            echo
            echo "COLONY_API_KEY authenticates NØX Origin."
            echo
            echo "NO PROFILE WAS MODIFIED."
            echo "NO LIGHTNING PAYMENT WAS MADE."
            echo "NO SATOSHIS WERE SENT."
            exit 0
          fi

          echo "=============================================="
          echo "❌ WRONG IDENTITY"
          echo "=============================================="
          echo
          echo "The API key authenticates @${USERNAME},"
          echo "not @nox_origine."
          echo
          echo "NO PROFILE WAS MODIFIED."
          echo "NO LIGHTNING PAYMENT WAS MADE."
          exit 2
