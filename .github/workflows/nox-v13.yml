name: NØX Origin - V13 Needs Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: write

jobs:
  nox-v13:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V13
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import re
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path
          from collections import Counter

          BASE = "https://thecolony.ai/api/v1"

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v12_file = memory_dir / "nox_v12_learning.json"
          v13_file = memory_dir / "nox_v13_needs.json"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          def request(method, url, data=None, headers=None):
              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              request_headers = {
                  "Content-Type": "application/json"
              }

              if headers:
                  request_headers.update(headers)

              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers=request_headers
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read().decode("utf-8")

                      return (
                          response.status,
                          json.loads(raw) if raw else {}
                      )

              except urllib.error.HTTPError as e:

                  raw = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"HTTP {e.code}: {raw[:1000]}"
                  )

              except urllib.error.URLError as e:

                  raise RuntimeError(
                      f"Network error: {e}"
                  )

          print("======================================")
          print("NØX ORIGIN - V13 NEEDS DETECTION")
          print("======================================")

          # ==========================================
          # 1. AUTHENTICATION
          # ==========================================

          print("")
          print("[1/6] Authentication...")

          status, auth = request(
              "POST",
              f"{BASE}/auth/token",
              {
                  "api_key": api_key
              }
          )

          token = auth.get("access_token")

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          print("Authentication: OK")

          headers = {
              "Authorization": f"Bearer {token}"
          }

          # ==========================================
          # 2. LOAD EXISTING MEMORY
          # ==========================================

          print("")
          print("[2/6] Loading NØX memory...")

          if memory_file.exists():

              try:
                  memory = json.loads(
                      memory_file.read_text()
                  )

              except Exception:
                  memory = {}

          else:
              memory = {}

          if v12_file.exists():

              try:
                  v12_history = json.loads(
                      v12_file.read_text()
                  )

              except Exception:
                  v12_history = []

          else:
              v12_history = []

          print(
              f"Memory entries: {len(memory)}"
          )

          print(
              f"V12 learning cycles: "
              f"{len(v12_history)}"
          )

          # ==========================================
          # 3. READ COLONY
          # ==========================================

          print("")
          print("[3/6] Reading Colony data...")

          status, feed = request(
              "GET",
              f"{BASE}/posts",
              headers=headers
          )

          print(
              f"Colony response: {status}"
          )

          if isinstance(feed, dict):

              posts = (
                  feed.get("posts")
                  or feed.get("data")
                  or feed.get("items")
                  or []
              )

          elif isinstance(feed, list):

              posts = feed

          else:

              posts = []

          print(
              f"Posts available: {len(posts)}"
          )

          # ==========================================
          # 4. DETECT NEED SIGNALS
          # ==========================================

          print("")
          print("[4/6] Detecting recurring needs...")

          need_patterns = {
              "problem": [
                  "problem",
                  "issue",
                  "bug",
                  "error",
                  "broken",
                  "failure",
                  "difficult",
                  "difficulty",
                  "struggle",
                  "stuck",
                  "cannot",
                  "can't",
                  "unable"
              ],

              "need": [
                  "need",
                  "needs",
                  "looking for",
                  "searching for",
                  "want",
                  "wanted",
                  "require",
                  "required",
                  "help",
                  "support"
              ],

              "opportunity": [
                  "opportunity",
                  "idea",
                  "potential",
                  "market",
                  "business",
                  "service",
                  "build",
                  "create",
                  "solution"
              ],

              "collaboration": [
                  "collaborate",
                  "collaboration",
                  "partner",
                  "partnership",
                  "team",
                  "together",
                  "join"
              ],

              "money": [
                  "money",
                  "payment",
                  "paid",
                  "income",
                  "revenue",
                  "profit",
                  "earn",
                  "earning",
                  "funding"
              ],

              "autonomy": [
                  "autonomous",
                  "autonomy",
                  "independent",
                  "self-sufficient",
                  "self sufficient",
                  "automate",
                  "automation"
              ]
          }

          category_counts = Counter()
          signal_examples = {}

          for category in need_patterns:
              signal_examples[category] = []

          analysed_posts = 0

          for post in posts:

              if not isinstance(post, dict):
                  continue

              analysed_posts += 1

              text_parts = []

              for key in (
                  "title",
                  "content",
                  "body",
                  "text"
              ):

                  value = post.get(key)

                  if isinstance(value, str):
                      text_parts.append(value)

              text = " ".join(
                  text_parts
              )

              lower_text = text.lower()

              for category, patterns in need_patterns.items():

                  matches = [
                      pattern
                      for pattern in patterns
                      if pattern in lower_text
                  ]

                  if matches:

                      category_counts[category] += 1

                      if len(
                          signal_examples[category]
                      ) < 5:

                          clean_text = re.sub(
                              r"\s+",
                              " ",
                              text
                          ).strip()

                          if clean_text:
                              signal_examples[
                                  category
                              ].append(
                                  clean_text[:300]
                              )

          # ==========================================
          # 5. BUILD NEEDS REPORT
          # ==========================================

          print("")
          print("[5/6] Building needs report...")

          ranked_needs = []

          for category, count in category_counts.most_common():

              percentage = 0

              if analysed_posts > 0:
                  percentage = round(
                      (count / analysed_posts) * 100,
                      2
                  )

              ranked_needs.append(
                  {
                      "category": category,
                      "mentions": count,
                      "percentage_of_posts": percentage,
                      "examples": signal_examples.get(
                          category,
                          []
                      )
                  }
              )

          report = {
              "version": "V13",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "posts_analysed": analysed_posts,
              "needs_detected": len(ranked_needs),
              "ranked_needs": ranked_needs,
              "previous_v12_cycles": len(
                  v12_history
              )
          }

          # ==========================================
          # 6. SAVE V13 KNOWLEDGE
          # ==========================================

          print("")
          print("[6/6] Saving V13 knowledge...")

          if v13_file.exists():

              try:
                  v13_history = json.loads(
                      v13_file.read_text()
                  )

              except Exception:
                  v13_history = []

          else:
              v13_history = []

          v13_history.append(report)

          v13_history = v13_history[-20:]

          v13_file.write_text(
              json.dumps(
                  v13_history,
                  indent=2,
                  ensure_ascii=False
              )
          )

          memory["last_v13_analysis"] = (
              report["timestamp"]
          )

          memory["v13"] = {
              "posts_analysed": analysed_posts,
              "needs_detected": len(
                  ranked_needs
              ),
              "top_needs": [
                  item["category"]
                  for item in ranked_needs[:10]
              ]
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("======================================")
          print("NØX V13 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Posts analysed : {analysed_posts}"
          )

          print(
              f"Needs detected : {len(ranked_needs)}"
          )

          print("")
          print("Detected needs:")

          for item in ranked_needs:

              print(
                  f"  - {item['category']}: "
                  f"{item['mentions']} posts "
                  f"({item['percentage_of_posts']}%)"
              )

          PY

      - name: Commit NØX V13 knowledge
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v13_needs.json

          if git diff --cached --quiet; then
            echo "No new V13 knowledge to commit."
          else
            git commit -m "NØX V13 needs detection"
            git push
          fi
