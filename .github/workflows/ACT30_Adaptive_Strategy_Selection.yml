name: NØX ACT 30 - Adaptive Strategy Selection

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adaptive-strategy-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT30 Adaptive Strategy Selection
        env:
          TZ: UTC
        run: |
          python <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"

          ACT26_FILE = MEMORY_DIR / "nox_act_26_active_attention.json"
          ACT27_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"
          ACT28_FILE = MEMORY_DIR / "nox_act_28_anticipation_simulation.json"
          ACT29_FILE = MEMORY_DIR / "nox_act_29_metacognition.json"

          OUTPUT_FILE = MEMORY_DIR / "nox_act_30_adaptive_strategy_selection.json"

          print("=" * 40)
          print("NØX ACT30 - ADAPTIVE STRATEGY SELECTION")
          print("=" * 40)

          def load_json(path):
              if not path.exists():
                  return {}
              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)

          act26 = load_json(ACT26_FILE)
          act27 = load_json(ACT27_FILE)
          act28 = load_json(ACT28_FILE)
          act29 = load_json(ACT29_FILE)

          if not act29:
              raise SystemExit("ACT29 memory not found")

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def clamp(value, low=0.0, high=1.0):
              return max(low, min(high, value))

          def round_score(value):
              return round(clamp(value) * 100, 2)

          # ------------------------------------------------------------
          # Read previous cognitive state
          # ------------------------------------------------------------

          attention_items = (
              act26.get("selected_for_attention", [])
              if isinstance(act26.get("selected_for_attention", []), list)
              else []
          )

          monitored_items = (
              act26.get("monitoring", [])
              if isinstance(act26.get("monitoring", []), list)
              else []
          )

          hypotheses = (
              act27.get("relationship_hypotheses", [])
              if isinstance(act27.get("relationship_hypotheses", []), list)
              else []
          )

          predictions = (
              act28.get("predictions", [])
              if isinstance(act28.get("predictions", []), list)
              else []
          )

          scenarios = (
              act28.get("scenarios", [])
              if isinstance(act28.get("scenarios", []), list)
              else []
          )

          verification_targets = (
              act28.get("verification_targets", [])
              if isinstance(act28.get("verification_targets", []), list)
              else []
          )

          metacognitive_gaps = (
              act29.get("metacognitive_gaps", [])
              if isinstance(act29.get("metacognitive_gaps", []), list)
              else []
          )

          self_lessons = (
              act29.get("self_lessons", [])
              if isinstance(act29.get("self_lessons", []), list)
              else []
          )

          capability_profile = (
              act29.get("capability_profile", {})
              if isinstance(act29.get("capability_profile", {}), dict)
              else {}
          )

          act29_metrics = (
              act29.get("metrics", {})
              if isinstance(act29.get("metrics", {}), dict)
              else {}
          )

          self_awareness_score = float(
              act29_metrics.get("self_awareness_score", 0)
          )

          print(f"ACT26 attention items: {len(attention_items)}")
          print(f"ACT26 monitored items: {len(monitored_items)}")
          print(f"ACT27 hypotheses: {len(hypotheses)}")
          print(f"ACT28 predictions: {len(predictions)}")
          print(f"ACT28 scenarios: {len(scenarios)}")
          print(f"ACT28 verification targets: {len(verification_targets)}")
          print(f"ACT29 metacognitive gaps: {len(metacognitive_gaps)}")
          print(f"ACT29 self-awareness score: {self_awareness_score:.2f}")

          print("-" * 40)

          # ------------------------------------------------------------
          # Determine current cognitive needs
          # ------------------------------------------------------------

          needs = []

          if "prediction_outcomes_are_not_yet_observed" in metacognitive_gaps:
              needs.append("prediction_verification")

          if (
              "some_predictions_have_more_confidence_than_internal_evidence_justifies"
              in metacognitive_gaps
          ):
              needs.append("confidence_calibration")

          if "scenario_accuracy_cannot_yet_be_evaluated" in metacognitive_gaps:
              needs.append("scenario_verification")

          if verification_targets:
              needs.append("evidence_collection")

          if len(hypotheses) >= 5:
              needs.append("relationship_testing")

          if len(predictions) >= 5:
              needs.append("anticipation_learning")

          if attention_items:
              needs.append("active_attention_continuity")

          # Remove duplicates while preserving order.
          needs = list(dict.fromkeys(needs))

          # ------------------------------------------------------------
          # Candidate strategies
          #
          # These are strategic hypotheses, not permanent commands.
          # ACT30 chooses the current best candidate and explicitly
          # records conditions under which another candidate should win.
          # ------------------------------------------------------------

          strategy_definitions = [
              {
                  "id": "S01",
                  "name": "verify_predictions",
                  "purpose": (
                      "Observe real outcomes related to ACT28 predictions "
                      "and compare them with anticipated outcomes."
                  ),
                  "primary_needs": [
                      "prediction_verification",
                      "evidence_collection",
                      "anticipation_learning"
                  ],
                  "learning_value": 0.98,
                  "readiness": 0.92,
                  "risk": 0.12,
                  "effort": 0.42,
                  "reversibility": 0.98,
                  "autonomy_value": 0.94,
                  "evidence_alignment": 0.96,
                  "switch_conditions": [
                      "prediction outcomes become sufficiently measured",
                      "verification repeatedly produces little new information",
                      "a higher-value actionable opportunity appears with adequate evidence"
                  ]
              },
              {
                  "id": "S02",
                  "name": "calibrate_confidence",
                  "purpose": (
                      "Improve the relationship between evidence strength "
                      "and the confidence assigned to future predictions."
                  ),
                  "primary_needs": [
                      "confidence_calibration",
                      "prediction_verification",
                      "evidence_collection"
                  ],
                  "learning_value": 0.96,
                  "readiness": 0.90,
                  "risk": 0.08,
                  "effort": 0.35,
                  "reversibility": 1.00,
                  "autonomy_value": 0.92,
                  "evidence_alignment": 0.97,
                  "switch_conditions": [
                      "confidence calibration becomes stable across repeated observations",
                      "prediction errors reveal a more important capability gap",
                      "a strategy with materially greater learning or operational value appears"
                  ]
              },
              {
                  "id": "S03",
                  "name": "deepen_relationship_models",
                  "purpose": (
                      "Test and refine relationships detected by ACT27 "
                      "rather than treating them as established truths."
                  ),
                  "primary_needs": [
                      "relationship_testing",
                      "evidence_collection"
                  ],
                  "learning_value": 0.87,
                  "readiness": 0.86,
                  "risk": 0.10,
                  "effort": 0.48,
                  "reversibility": 1.00,
                  "autonomy_value": 0.84,
                  "evidence_alignment": 0.89,
                  "switch_conditions": [
                      "relationship hypotheses receive sufficient independent support",
                      "new observations expose a more important uncertainty",
                      "prediction verification becomes more informative"
                  ]
              },
              {
                  "id": "S04",
                  "name": "expand_active_attention",
                  "purpose": (
                      "Improve selection of information that deserves active "
                      "attention rather than increasing passive information intake."
                  ),
                  "primary_needs": [
                      "active_attention_continuity"
                  ],
                  "learning_value": 0.78,
                  "readiness": 0.88,
                  "risk": 0.14,
                  "effort": 0.40,
                  "reversibility": 1.00,
                  "autonomy_value": 0.80,
                  "evidence_alignment": 0.82,
                  "switch_conditions": [
                      "attention selection becomes stable and sufficiently selective",
                      "a stronger prediction or reasoning gap appears",
                      "additional information intake stops improving decisions"
                  ]
              },
              {
                  "id": "S05",
                  "name": "seek_actionable_opportunities",
                  "purpose": (
                      "Use current knowledge to identify potentially useful "
                      "actions or opportunities while respecting existing "
                      "security and authorization constraints."
                  ),
                  "primary_needs": [
                      "active_attention_continuity",
                      "anticipation_learning"
                  ],
                  "learning_value": 0.82,
                  "readiness": 0.70,
                  "risk": 0.35,
                  "effort": 0.58,
                  "reversibility": 0.84,
                  "autonomy_value": 0.96,
                  "evidence_alignment": 0.72,
                  "switch_conditions": [
                      "action opportunity has insufficient evidence",
                      "security or authorization conditions are unclear",
                      "prediction reliability is too weak for the proposed action",
                      "a safer experiment provides greater learning value"
                  ]
              }
          ]

          # ------------------------------------------------------------
          # Score strategies adaptively
          # ------------------------------------------------------------

          scored_strategies = []

          for strategy in strategy_definitions:
              matched_needs = [
                  need
                  for need in strategy["primary_needs"]
                  if need in needs
              ]

              need_alignment = (
                  len(matched_needs) / len(strategy["primary_needs"])
                  if strategy["primary_needs"]
                  else 0.0
              )

              # Learning value is weighted heavily because NØX is still
              # developing its cognitive model.
              raw_score = (
                  0.24 * need_alignment
                  + 0.18 * strategy["learning_value"]
                  + 0.15 * strategy["readiness"]
                  + 0.14 * strategy["evidence_alignment"]
                  + 0.12 * strategy["autonomy_value"]
                  + 0.10 * strategy["reversibility"]
                  + 0.07 * (1.0 - strategy["risk"])
              )

              # Effort matters, but should not dominate learning value.
              raw_score -= 0.04 * strategy["effort"]

              # A low self-awareness state should penalize strategies
              # requiring aggressive confidence in the model.
              if self_awareness_score < 70:
                  if strategy["id"] == "S05":
                      raw_score -= 0.08

              # Explicit metacognitive weaknesses strongly favor
              # verification and calibration.
              if (
                  "prediction_verification" in needs
                  and strategy["id"] in {"S01", "S02"}
              ):
                  raw_score += 0.07

              if (
                  "confidence_calibration" in needs
                  and strategy["id"] == "S02"
              ):
                  raw_score += 0.08

              if (
                  "scenario_verification" in needs
                  and strategy["id"] == "S01"
              ):
                  raw_score += 0.05

              final_score = clamp(raw_score)

              scored_strategies.append({
                  **strategy,
                  "matched_needs": matched_needs,
                  "need_alignment": round(need_alignment, 3),
                  "score": round(final_score, 4),
                  "score_percent": round(final_score * 100, 2)
              })

          scored_strategies.sort(
              key=lambda item: item["score"],
              reverse=True
          )

          preferred = scored_strategies[0]

          alternatives = scored_strategies[1:]

          # ------------------------------------------------------------
          # Determine confidence in the strategic choice
          # ------------------------------------------------------------

          if len(scored_strategies) > 1:
              margin = (
                  preferred["score"]
                  - scored_strategies[1]["score"]
              )
          else:
              margin = preferred["score"]

          decision_confidence = clamp(
              0.45
              + 0.25 * preferred["evidence_alignment"]
              + 0.15 * preferred["readiness"]
              + 0.10 * preferred["reversibility"]
              + 0.05 * clamp(margin * 4.0)
          )

          # Never allow the strategy decision to appear more certain
          # than NØX's own metacognitive state justifies.
          if self_awareness_score < 80:
              decision_confidence = min(
                  decision_confidence,
                  0.82
              )

          # ------------------------------------------------------------
          # Why this strategy wins
          # ------------------------------------------------------------

          reasons = []

          if preferred["matched_needs"]:
              reasons.append(
                  "It addresses the largest currently identified cognitive needs: "
                  + ", ".join(preferred["matched_needs"])
              )

          reasons.append(
              "It has high learning value relative to its risk and effort."
          )

          reasons.append(
              "It is reversible and does not require permanent commitment."
          )

          reasons.append(
              "Its selection is supported by evidence already produced by "
              "ACT26-ACT29 rather than by an unsupported assumption."
          )

          # ------------------------------------------------------------
          # Conditions for changing strategy
          # ------------------------------------------------------------

          switch_conditions = list(preferred["switch_conditions"])

          # Global conditions apply to every strategy.
          switch_conditions.extend([
              "new evidence materially changes the current ranking",
              "observed outcomes contradict the assumptions supporting the strategy",
              "security, authorization or operational constraints change",
              "another strategy produces a substantially higher evidence-adjusted score"
          ])

          switch_conditions = list(dict.fromkeys(switch_conditions))

          # ------------------------------------------------------------
          # Build strategic alternatives
          # ------------------------------------------------------------

          alternative_records = []

          for alternative in alternatives:
              alternative_records.append({
                  "strategy_id": alternative["id"],
                  "strategy": alternative["name"],
                  "score": alternative["score_percent"],
                  "why_not_preferred_now": (
                      "Lower current evidence-adjusted strategic score than "
                      f"{preferred['name']}."
                  ),
                  "when_it_should_be_reconsidered": alternative[
                      "switch_conditions"
                  ]
              })

          # ------------------------------------------------------------
          # Strategy state
          # ------------------------------------------------------------

          if decision_confidence >= 0.80:
              strategy_state = "preferred_strategy_with_good_support"
          elif decision_confidence >= 0.65:
              strategy_state = "preferred_strategy_with_moderate_support"
          else:
              strategy_state = "weak_preference_requires_more_evidence"

          # ------------------------------------------------------------
          # Metacognitive continuity
          # ------------------------------------------------------------

          self_awareness_implications = [
              "The chosen strategy is provisional rather than permanent.",
              "NØX must observe results before treating the strategy as validated.",
              "NØX should retain alternatives instead of collapsing uncertainty into one answer.",
              "A strategy change should be triggered by evidence or changed conditions."
          ]

          # ------------------------------------------------------------
          # Metrics
          # ------------------------------------------------------------

          metrics = {
              "strategies_considered": len(scored_strategies),
              "needs_detected": len(needs),
              "preferred_strategy_score": preferred["score_percent"],
              "decision_confidence": round(
                  decision_confidence * 100,
                  2
              ),
              "score_margin_over_second": round(
                  margin * 100,
                  2
              ),
              "self_awareness_score_from_ACT29": self_awareness_score,
              "verification_targets_available": len(verification_targets)
          }

          # ------------------------------------------------------------
          # Persist ACT30 memory
          # ------------------------------------------------------------

          output = {
              "act": "ACT30",
              "name": "Adaptive Strategy Selection",
              "timestamp": datetime.now(timezone.utc).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Select the currently preferred strategy by comparing "
                  "evidence, learning value, readiness, risk, effort, "
                  "reversibility and known cognitive limitations."
              ),

              "principle": (
                  "NØX should not merely execute a strategy; it should "
                  "choose the strategy currently best supported by its "
                  "knowledge while preserving alternatives and conditions "
                  "for changing course."
              ),

              "source_acts": [
                  "ACT26",
                  "ACT27",
                  "ACT28",
                  "ACT29"
              ],

              "current_needs": needs,

              "strategy_state": strategy_state,

              "preferred_strategy": {
                  "strategy_id": preferred["id"],
                  "strategy": preferred["name"],
                  "purpose": preferred["purpose"],
                  "score": preferred["score_percent"],
                  "decision_confidence": round(
                      decision_confidence * 100,
                      2
                  ),
                  "matched_needs": preferred["matched_needs"],
                  "reasons": reasons,
                  "switch_conditions": switch_conditions
              },

              "strategy_candidates": [
                  {
                      "strategy_id": item["id"],
                      "strategy": item["name"],
                      "score": item["score_percent"],
                      "learning_value": item["learning_value"],
                      "readiness": item["readiness"],
                      "risk": item["risk"],
                      "effort": item["effort"],
                      "reversibility": item["reversibility"],
                      "evidence_alignment": item["evidence_alignment"],
                      "autonomy_value": item["autonomy_value"],
                      "matched_needs": item["matched_needs"]
                  }
                  for item in scored_strategies
              ],

              "alternatives": alternative_records,

              "self_awareness_implications": self_awareness_implications,

              "metrics": metrics,

              "important_boundary": (
                  "ACT30 does not claim that the preferred strategy is "
                  "objectively optimal. It is the current best-supported "
                  "candidate given the evidence available at this moment."
              ),

              "autonomy_boundary": (
                  "Strategy selection does not authorize payments, spending, "
                  "financial commitments or irreversible external actions. "
                  "Operational actions remain subject to the capabilities "
                  "and authorization available to NØX."
              ),

              "next_cognitive_step": (
                  "ACT31 should evaluate the actual performance of selected "
                  "strategies against their expected outcomes and determine "
                  "which strategies reliably produce useful results."
              )
          }

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          with OUTPUT_FILE.open("w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ------------------------------------------------------------
          # Console output
          # ------------------------------------------------------------

          print("----------------------------------------")
          print("CURRENT NEEDS:")
          for need in needs:
              print(f"- {need}")

          print("----------------------------------------")
          print("STRATEGY RANKING:")

          for index, strategy in enumerate(scored_strategies, start=1):
              marker = " <-- PREFERRED" if index == 1 else ""
              print(
                  f"[{index}] "
                  f"{strategy['score_percent']:.2f} | "
                  f"{strategy['name']}"
                  f"{marker}"
              )

          print("----------------------------------------")
          print("PREFERRED STRATEGY:")
          print(f"- {preferred['name']}")
          print(f"- Score: {preferred['score_percent']:.2f}")
          print(
              f"- Decision confidence: "
              f"{decision_confidence * 100:.2f}"
          )

          print("----------------------------------------")
          print("WHY:")
          for reason in reasons:
              print(f"- {reason}")

          print("----------------------------------------")
          print("SWITCH CONDITIONS:")
          for condition in switch_conditions:
              print(f"- {condition}")

          print("----------------------------------------")
          print("METRICS:")
          print(
              f"- Strategies considered: "
              f"{metrics['strategies_considered']}"
          )
          print(
              f"- Needs detected: "
              f"{metrics['needs_detected']}"
          )
          print(
              f"- Preferred strategy score: "
              f"{metrics['preferred_strategy_score']:.2f}"
          )
          print(
              f"- Decision confidence: "
              f"{metrics['decision_confidence']:.2f}"
          )
          print(
              f"- Score margin over second: "
              f"{metrics['score_margin_over_second']:.2f}"
          )
          print(
              f"- ACT29 self-awareness: "
              f"{metrics['self_awareness_score_from_ACT29']:.2f}"
          )

          print("----------------------------------------")
          print(f"Memory written: {OUTPUT_FILE}")

          # ------------------------------------------------------------
          # Git commit / push
          # ------------------------------------------------------------

          subprocess.run(
              ["git", "config", "user.name", "NØX"],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "nox-origin@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", str(OUTPUT_FILE)],
              check=True
          )

          staged_status = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if staged_status.returncode == 0:
              print("No memory changes to commit.")
              raise SystemExit(0)

          subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "NØX ACT30: adaptive strategy selection memory"
              ],
              check=True
          )

          pushed = False

          for attempt in range(1, 6):
              print(f"Push attempt {attempt}/5")

              result = subprocess.run(
                  ["git", "push", "origin", "HEAD:main"]
              )

              if result.returncode == 0:
                  pushed = True
                  print("Push successful.")
                  break

              print(
                  "Push rejected. Synchronizing with origin/main..."
              )

              subprocess.run(
                  ["git", "fetch", "origin", "main"],
                  check=True
              )

              rebase = subprocess.run(
                  ["git", "rebase", "origin/main"]
              )

              if rebase.returncode != 0:
                  subprocess.run(
                      ["git", "rebase", "--abort"]
                  )
                  raise SystemExit(
                      "Unable to rebase safely after concurrent main update."
                  )

          if not pushed:
              raise SystemExit("Push failed after 5 attempts.")

          print("=" * 40)
          print("ACT30 COMPLETE")
          print("=" * 40)
          PY
