              )

              try:
                  payment = api_get(
                      f"/marketplace/{tid}/payment"
                  )

                  payments.append({
                      "task_id":
                          tid,
                      "observed_at":
                          now_iso(),
                      "payment":
                          payment
                  })

              except Exception:
                  pass

          print(
              f"Payments observed: "
              f"{len(payments)}"
          )

          print(
              "Payment creation: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )


          # ============================================================
          # LEARNING
          # ============================================================

          selection_history = marketplace.get(
              "selection_history",
              []
          )

          cognitive_feedback = marketplace.get(
              "cognitive_feedback",
              []
          )

          if not isinstance(
              selection_history,
              list
          ):
              selection_history = []

          if not isinstance(
              cognitive_feedback,
              list
          ):
              cognitive_feedback = []

          for candidate in candidates:

              selection_history.append({
                  "task_id":
                      candidate["task_id"],
                  "title":
                      candidate["title"],
                  "feasibility":
                      candidate[
                          "feasibility_score"
                      ],
                  "opportunity":
                      candidate[
                          "opportunity_score"
                      ],
                  "ledger_signals":
                      candidate[
                          "ledger_signals"
                      ],
                  "decision":
                      "candidate",
                  "timestamp":
                      now_iso()
              })

          for delivery in deliveries:

              outcomes.append({
                  "type":
                      "successful_delivery",
                  "task_id":
                      delivery["task_id"],
                  "title":
                      delivery["title"],
                  "result":
                      "delivered",
                  "timestamp":
                      delivery["delivered_at"]
              })

          for failure in execution_failures:

              failures.append(
                  failure
              )

          if rate_limited:

              failures.append({
                  "type":
                      "platform_rate_limit",
                  "stage":
                      "bidding",
                  "reason":
                      "RATE_LIMIT_BID",
                  "timestamp":
                      now_iso(),
                  "learning":
                      (
                          "Stop bidding immediately "
                          "when the platform returns "
                          "a bid rate limit."
                      )
              })

          cognitive_feedback.append({
              "timestamp":
                  now_iso(),
              "source":
                  "LEDGER_04",
              "loop":
                  "Research -> Understand -> "
                  "Reflect -> Choose -> Act -> "
                  "Observe -> Learn -> Adapt",
              "tasks_found":
                  len(tasks),
              "tasks_evaluated":
                  len(evaluations),
              "candidates":
                  len(candidates),
              "bids_created":
                  bids_created,
              "accepted_missions":
                  len(accepted),
              "executions":
                  len(executions),
              "deliveries":
                  len(deliveries),
              "execution_failures":
                  len(execution_failures),
              "rate_limited":
                  rate_limited,
              "bid_remaining":
                  bid_remaining,
              "learning":
                  (
                      "Quality over bid volume. "
                      "Use Ledger 01 knowledge, "
                      "Ledger 02 cognition and "
                      "Ledger 03 experience before "
                      "acting."
                  )
          })


          # ============================================================
          # SAVE MEMORY
          # ============================================================

          marketplace_state = {
              "schema_version":
                  "3.0",

              "identity":
                  NOX_IDENTITY,

              "updated_at":
                  now_iso(),

              "constraints": {
                  "gemini_enabled":
                      False,
                  "external_ai_enabled":
                      False,
                  "payments_enabled":
                      False,
                  "spending_enabled":
                      False,
                  "project_cost_eur":
                      0
              },

              "strategy": {
                  "quality_over_volume":
                      True,
                  "requires_capability":
                      True,
                  "requires_feasibility":
                      True,
                  "requires_clear_deliverable":
                      REQUIRE_CLEAR_DELIVERABLE,
                  "requires_zero_cost":
                      REQUIRE_ZERO_COST,
                  "rejects_external_ai":
                      REQUIRE_NO_EXTERNAL_AI,
                  "cross_ledger_decision":
                      True,
                  "uses_historical_learning":
                      True,
                  "uses_platform_limits":
                      True
              },

              "tracked_bids":
                  trim(
                      tracked_bids,
                      MAX_MEMORY_ITEMS
                  ),

              "outcomes":
                  trim(
                      outcomes,
                      MAX_TASK_MEMORY
                  ),

              "failures":
                  trim(
                      failures,
                      MAX_FAILURE_MEMORY
                  ),

              "selection_history":
                  trim(
                      selection_history,
                      MAX_TASK_MEMORY
                  ),

              "cognitive_feedback":
                  trim(
                      cognitive_feedback,
                      MAX_MEMORY_ITEMS
                  ),

              "last_run": {
                  "tasks_found":
                      len(tasks),
                  "tasks_evaluated":
                      len(evaluations),
                  "candidates":
                      len(candidates),
                  "bids_created":
                      bids_created,
                  "bid_errors":
                      bid_errors,
                  "rate_limited":
                      rate_limited,
                  "accepted_missions":
                      len(accepted),
                  "executions":
                      len(executions),
                  "deliveries":
                      len(deliveries),
                  "execution_failures":
                      len(execution_failures),
                  "payments_observed":
                      len(payments),
                  "bid_remaining":
                      bid_remaining,
                  "timestamp":
                      now_iso()
              }
          }

          save_json(
              MEMORY_MARKETPLACE,
              marketplace_state
          )


          # ============================================================
          # FINAL SUMMARY
          # ============================================================

          print()
          print(
