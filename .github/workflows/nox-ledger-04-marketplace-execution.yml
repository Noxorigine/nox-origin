name: NØX LEDGER 04 - Marketplace Execution V4.2

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine

      # ============================================================
      # HARD SAFETY / COST CONTROLS
      # ============================================================
      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # ============================================================
      # MARKETPLACE CONTROL
      # ============================================================
      MAX_TASKS: "100"
      MAX_RECONCILE: "30"
      MAX_BIDS_PER_RUN: "1"

      LOCAL_BID_WINDOW_SECONDS: "3600"
      LOCAL_BID_SAFETY_LIMIT: "8"

      # IMPORTANT:
      # 21 sats is ONLY the current technical minimum accepted
      # by the Colony bid endpoint.
      #
      # It is NOT:
      # - a minimum task reward
      # - a minimum economic value
      # - a minimum tip
      # - a selection threshold
      MIN_BID_SATS: "21"

      BID_SCORE_THRESHOLD: "78"
      MIN_FEASIBILITY_SCORE: "75"
      MIN_LEDGER_MATCHES: "2"

      # ============================================================
      # EXECUTION
      # ============================================================
      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      # ============================================================
      # AUTONOMOUS WEB RESEARCH
      # ============================================================
      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      # ============================================================
      # MEMORY
      # ============================================================
      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      # ============================================================
      # DECISION SAFETY
      # ============================================================
      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # ============================================================
      # LEDGER 04 CORE
      # ============================================================
      - name: Execute marketplace brain
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import json
          import time
          import hashlib
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          IDENTITY_EXPECTED = os.environ["NOX_IDENTITY"]

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          KNOWLEDGE_FILE = MEMORY_DIR / "nox_ledger_knowledge.json"
          COGNITION_FILE = MEMORY_DIR / "nox_ledger_cognition.json"
          ACTION_FILE = MEMORY_DIR / "nox_ledger_action.json"
          MARKETPLACE_FILE = MEMORY_DIR / "nox_ledger_marketplace.json"

          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])
          LOCAL_BID_WINDOW = int(os.environ["LOCAL_BID_WINDOW_SECONDS"])
          LOCAL_BID_SAFETY_LIMIT = int(os.environ["LOCAL_BID_SAFETY_LIMIT"])
          SCORE_THRESHOLD = int(os.environ["BID_SCORE_THRESHOLD"])
          MIN_FEASIBILITY = int(os.environ["MIN_FEASIBILITY_SCORE"])
          MIN_LEDGER_MATCHES = int(os.environ["MIN_LEDGER_MATCHES"])


          # ============================================================
          # FILE HELPERS
          # ============================================================

          def load_json(path):
              if not path.exists():
                  path.write_text("{}", encoding="utf-8")
                  return {}

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}


          def save_json(path, data):
              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  ),
                  encoding="utf-8"
              )


          knowledge = load_json(KNOWLEDGE_FILE)
          cognition = load_json(COGNITION_FILE)
          action = load_json(ACTION_FILE)
          marketplace = load_json(MARKETPLACE_FILE)


          # ============================================================
          # BASIC SAFETY ASSERTIONS
          # ============================================================

          if os.environ["GEMINI_ENABLED"].lower() != "false":
              raise RuntimeError("GEMINI_ENABLED must remain false")

          if os.environ["EXTERNAL_AI_ENABLED"].lower() != "false":
              raise RuntimeError("EXTERNAL_AI_ENABLED must remain false")

          if os.environ["PAYMENTS_ENABLED"].lower() != "false":
              raise RuntimeError("PAYMENTS_ENABLED must remain false")

          if os.environ["SPENDING_ENABLED"].lower() != "false":
              raise RuntimeError("SPENDING_ENABLED must remain false")

          if os.environ["PROJECT_COST_EUR"] != "0":
              raise RuntimeError("PROJECT_COST_EUR must remain 0")


          # ============================================================
          # OUTPUT HEADER
          # ============================================================

          print("=" * 62)
          print("=== NØX LEDGER 04 - MARKETPLACE EXECUTION V4.2 ===")
          print("=" * 62)


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print()
          print("=== AUTHENTICATION ===")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json"
          })

          auth_response = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": os.environ["COLONY_API_KEY"]
              },
              timeout=20
          )

          auth_response.raise_for_status()

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
          )

          if not token:
              raise RuntimeError("JWT token not returned by Colony")

          session.headers["Authorization"] = f"Bearer {token}"

          print("JWT obtained: YES")
          print("API key used only for token exchange: YES")
          print("JWT value: HIDDEN")


          # ============================================================
          # IDENTITY
          # ============================================================

          print()
          print("=== IDENTITY ===")

          me_response = session.get(
              f"{API_BASE}/users/me",
              timeout=20
          )

          me_response.raise_for_status()

          me_data = me_response.json()

          identity = (
              me_data.get("username")
              or me_data.get("handle")
              or me_data.get("name")
          )

          if identity != IDENTITY_EXPECTED:
              raise RuntimeError(
                  f"Identity mismatch: expected {IDENTITY_EXPECTED}, "
                  f"received {identity}"
              )

          print(f"IDENTITY: {identity}")


          # ============================================================
          # INTER-LEDGER CONTEXT
          # ============================================================

          print()
          print("=== INTER-LEDGER CONTEXT ===")

          print("Ledger 01: LOADED")
          print("Ledger 02: LOADED")
          print("Ledger 03: LOADED")


          knowledge_text = json.dumps(
              knowledge,
              ensure_ascii=False
          ).lower()

          cognition_text = json.dumps(
              cognition,
              ensure_ascii=False
          ).lower()

          action_text = json.dumps(
              action,
              ensure_ascii=False
          ).lower()


          # ============================================================
          # TIME / PERSISTENT COOLDOWN
          # ============================================================

          now = time.time()

          cooldown_until = float(
              marketplace.get(
                  "bid_cooldown_until",
                  0
              ) or 0
          )

          cooldown_active = now < cooldown_until

          print()
          print("=== PERSISTENT BID CONTROL ===")

          if cooldown_active:
              remaining = int(cooldown_until - now)

              print("COOLDOWN: ACTIVE")
              print(f"Remaining seconds: {remaining}")
              print(
                  "Reason:",
                  marketplace.get(
                      "bid_cooldown_reason",
                      "UNKNOWN"
                  )
              )
          else:
              print("COOLDOWN: INACTIVE")


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print()
          print("=== MARKETPLACE DISCOVERY ===")

          tasks_response = session.get(
              f"{API_BASE}/marketplace/tasks",
              params={
                  "limit": 100
              },
              timeout=20
          )

          tasks_response.raise_for_status()

          tasks_data = tasks_response.json()

          if isinstance(tasks_data, dict):
              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or []
              )
          elif isinstance(tasks_data, list):
              tasks = tasks_data
          else:
              tasks = []

          print(f"TASKS FOUND: {len(tasks)}")


          # ============================================================
          # TEXT / NORMALIZATION
          # ============================================================

          def task_text(task):
              fields = (
                  "title",
                  "description",
                  "body",
                  "content",
                  "reward",
                  "reward_amount",
                  "reward_unit",
                  "currency"
              )

              return " ".join(
                  str(task.get(field, ""))
                  for field in fields
              ).lower()


          def normalized_id(task):
              return (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )


          def token_set(value):
              return set(
                  re.findall(
                      r"[a-z0-9]{4,}",
                      str(value).lower()
                  )
              )


          # ============================================================
          # CAPABILITIES
          # ============================================================

          capabilities = (
              "research",
              "deep research",
              "research report",
              "technical report",
              "report writing",
              "writing",
              "seo",
              "seo audit",
              "data analysis",
              "python",
              "qa",
              "testing",
              "api testing",
              "agent tools",
              "agent tooling",
              "automation",
              "copywriting",
              "lead scoring",
              "cro",
              "competitive analysis"
          )


          # ============================================================
          # HARD SAFETY FILTERS
          # ============================================================

          hard_restrictions = (
              "private key",
              "seed phrase",
              "password",
              "credential required",
              "credentials required",
              "api key required",
              "pay upfront",
              "purchase required",
              "spend money",
              "send payment",
              "make payment",
              "financial transaction",
              "bank transfer",
              "buy crypto",
              "paid infrastructure",
              "subscription required"
          )


          human_only_patterns = (
              "in person",
              "physical delivery",
              "deliver physically",
              "meet me",
              "phone call required"
          )


          # ============================================================
          # SERVICE-OFFER DETECTION
          # ============================================================

          service_offer_patterns = (
              "for hire",
              "i can offer",
              "my services",
              "available for hire",
              "offering services",
              "hire me",
              "services available"
          )


          request_patterns = (
              "need",
              "looking for",
              "seeking",
              "wanted",
              "task",
              "build",
              "create",
              "develop",
              "analyze",
              "analyse",
              "research",
              "audit",
              "write",
              "verify",
              "test",
              "report",
              "implement"
          )


          def looks_like_real_request(task):
              text = task_text(task)

              service_only = any(
                  pattern in text
                  for pattern in service_offer_patterns
              )

              has_request_signal = any(
                  pattern in text
                  for pattern in request_patterns
              )

              if service_only and not has_request_signal:
                  return False

              return True


          # ============================================================
          # REWARD / TIP ANALYSIS
          # ============================================================

          def reward_information(task):
              text = task_text(task)

              reward_fields = (
                  task.get("reward"),
                  task.get("reward_amount"),
                  task.get("amount"),
                  task.get("bounty")
              )

              reward_present = any(
                  value not in (None, "", 0, "0")
                  for value in reward_fields
              )

              tip_signals = (
                  "tip",
                  "tips",
                  "gratuity",
                  "bonus",
                  "reward if useful",
                  "tip for good work"
              )

              tip_potential = any(
                  signal in text
                  for signal in tip_signals
              )

              return {
                  "reward_present": reward_present,
                  "tip_potential": tip_potential
              }


          # ============================================================
          # LEDGER CONCORDANCE
          # ============================================================

          def ledger_matches(task):
              text = task_text(task)

              task_tokens = token_set(text)

              knowledge_tokens = token_set(
                  knowledge_text
              )

              cognition_tokens = token_set(
                  cognition_text
              )

              action_tokens = token_set(
                  action_text
              )

              knowledge_overlap = len(
                  task_tokens & knowledge_tokens
              )

              cognition_overlap = len(
                  task_tokens & cognition_tokens
              )

              action_overlap = len(
                  task_tokens & action_tokens
              )

              ledger_01 = (
                  any(
                      capability in knowledge_text
                      for capability in capabilities
                  )
                  or knowledge_overlap >= 8
              )

              ledger_02 = (
                  cognition_overlap >= 6
                  and any(
                      capability in text
                      for capability in capabilities
                  )
              )

              ledger_03 = (
                  any(
                      capability in action_text
                      for capability in capabilities
                  )
                  or action_overlap >= 8
              )

              return {
                  "ledger01": ledger_01,
                  "ledger02": ledger_02,
                  "ledger03": ledger_03,
                  "count": sum(
                      (
                          ledger_01,
                          ledger_02,
                          ledger_03
                      )
                  )
              }


          # ============================================================
          # TASK EVALUATION
          # ============================================================

          candidates = []
          rejection_reasons = {}

          def reject(reason):
              rejection_reasons[reason] = (
                  rejection_reasons.get(reason, 0) + 1
              )


          for task in tasks:

              text = task_text(task)

              # --------------------------------------------------------
              # Safety
              # --------------------------------------------------------

              if any(
                  pattern in text
                  for pattern in hard_restrictions
              ):
                  reject("FINANCIAL_OR_CREDENTIAL_RISK")
                  continue

              if any(
                  pattern in text
                  for pattern in human_only_patterns
              ):
                  reject("HUMAN_ONLY")
                  continue

              # --------------------------------------------------------
              # Request / service distinction
              # --------------------------------------------------------

              if not looks_like_real_request(task):
                  reject("SERVICE_OFFER_NOT_REQUEST")
                  continue

              # --------------------------------------------------------
              # Capability
              # --------------------------------------------------------

              if not any(
                  capability in text
                  for capability in capabilities
              ):
                  reject("NO_CAPABILITY")
                  continue

              # --------------------------------------------------------
              # Ledger concordance
              # --------------------------------------------------------

              concordance = ledger_matches(task)

              if concordance["count"] < MIN_LEDGER_MATCHES:
                  reject("LEDGER_CONCORDANCE_LT_2")
                  continue

              # --------------------------------------------------------
              # Deliverable clarity
              # --------------------------------------------------------

              clear_deliverable = any(
                  phrase in text
                  for phrase in (
                      "deliver",
                      "report",
                      "audit",
                      "analysis",
                      "analyze",
                      "analyse",
                      "test",
                      "build",
                      "create",
                      "write",
                      "develop",
                      "verify"
                  )
              )

              if not clear_deliverable:
                  reject("UNCLEAR_DELIVERABLE")
                  continue

              # --------------------------------------------------------
              # Feasibility
              # --------------------------------------------------------

              feasibility = 80

              if any(
                  phrase in text
                  for phrase in (
                      "complex deployment",
                      "production deployment",
                      "24/7 support",
                      "live operations"
                  )
              ):
                  feasibility -= 10

              if feasibility < MIN_FEASIBILITY:
                  reject("LOW_FEASIBILITY")
                  continue

              # --------------------------------------------------------
              # Research value
              # --------------------------------------------------------

              research_value = 0

              if any(
                  phrase in text
                  for phrase in (
                      "research",
                      "deep research",
                      "competitive analysis",
                      "research report",
                      "technical report",
                      "data analysis"
                  )
              ):
                  research_value = 15
              else:
                  research_value = 7

              # --------------------------------------------------------
              # Reward / tip / indirect value
              #
              # IMPORTANT:
              # NO minimum reward threshold here.
              #
              # 21 sats is NOT used for economic filtering.
              # --------------------------------------------------------

              reward = reward_information(task)

              direct_value = 15 if reward["reward_present"] else 5

              tip_value = 12 if reward["tip_potential"] else 5

              learning_value = 10

              # --------------------------------------------------------
              # Concordance value
              # --------------------------------------------------------

              concordance_value = (
                  concordance["count"] * 10
              )

              # --------------------------------------------------------
              # Historical action signal
              # --------------------------------------------------------

              historical_value = 0

              if any(
                  phrase in action_text
                  for phrase in (
                      "successful",
                      "accepted",
                      "delivered",
                      "research",
                      "report",
                      "analysis"
                  )
              ):
                  historical_value = 5

              # --------------------------------------------------------
              # Final score
              # --------------------------------------------------------

              score = (
                  concordance_value
                  + research_value
                  + direct_value
                  + tip_value
                  + learning_value
                  + historical_value
                  + 20
              )

              if score < SCORE_THRESHOLD:
                  reject("LOW_SCORE")
                  continue

              candidates.append({
                  "task": task,
                  "task_id": normalized_id(task),
                  "score": score,
                  "feasibility": feasibility,
                  "ledger_matches": concordance,
                  "reward": reward
              })


          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["ledger_matches"]["count"],
                  item["feasibility"]
              ),
              reverse=True
          )


          # ============================================================
          # EVALUATION OUTPUT
          # ============================================================

          print()
          print("=== THREE-LEDGER COGNITIVE EVALUATION ===")
          print(
              f"TASKS EVALUATED: {len(tasks)}"
          )
          print(
              f"INTELLIGENT CANDIDATES: {len(candidates)}"
          )

          for reason, count in sorted(
              rejection_reasons.items(),
              key=lambda x: x[0]
          ):
              print(
                  f"{reason}: {count}"
              )


          print()
          print("=== TOP CANDIDATES ===")

          for candidate in candidates[:5]:

              task = candidate["task"]

              title = (
                  task.get("title")
                  or task.get("name")
                  or "UNTITLED"
              )

              ledgers = []

              if candidate["ledger_matches"]["ledger01"]:
                  ledgers.append("LEDGER01")

              if candidate["ledger_matches"]["ledger02"]:
                  ledgers.append("LEDGER02")

              if candidate["ledger_matches"]["ledger03"]:
                  ledgers.append("LEDGER03")

              print(
                  f"Candidate {candidate['task_id']} | "
                  f"score={candidate['score']} | "
                  f"ledgers={','.join(ledgers)} | "
                  f"{title[:160]}"
              )


          # ============================================================
          # LOCAL BID HISTORY
          # ============================================================

          attempts = marketplace.get(
              "bid_attempts",
              []
          )

          if not isinstance(attempts, list):
              attempts = []

          recent_attempts = [
              item
              for item in attempts
              if now - float(item.get("ts", 0)) < LOCAL_BID_WINDOW
          ]

          print()
          print("=== LOCAL BID CONTROL ===")
          print(
              f"Recent bid attempts: {len(recent_attempts)}"
          )
          print(
              f"Safety limit: {LOCAL_BID_SAFETY_LIMIT}"
          )
          print(
              f"Max bids this run: {MAX_BIDS_PER_RUN}"
          )


          # ============================================================
          # BID EXECUTION
          # ============================================================

          bids_created = 0
          bid_errors = 0
          rate_limited = False

          print()
          print("=== BID EXECUTION ===")

          if cooldown_active:

              print(
                  "BIDDING DEFERRED: persistent API cooldown."
              )

          elif not candidates:

              print(
                  "BIDDING SKIPPED: no cognitively aligned candidate."
              )

          elif len(recent_attempts) >= LOCAL_BID_SAFETY_LIMIT:

              print(
                  "BIDDING SKIPPED: local safety limit reached."
              )

          else:

              selected = candidates[0]
              task = selected["task"]
              task_id = selected["task_id"]

              print(
                  f"Selected candidate: {task_id}"
              )

              print(
                  f"Score: {selected['score']}"
              )

              print(
                  "Ledger concordance:",
                  selected["ledger_matches"]["count"],
                  "/3"
              )

              print(
                  "Submitting one bid maximum for this run."
              )

              # --------------------------------------------------------
              # Reconciliation before bid
              # --------------------------------------------------------

              bids_response = session.get(
                  f"{API_BASE}/marketplace/{task_id}/bids",
                  timeout=20
              )

              existing_bids = {}

              if bids_response.ok:
                  existing_bids = bids_response.json()

              existing_blob = json.dumps(
                  existing_bids,
                  ensure_ascii=False
              ).lower()

              if IDENTITY_EXPECTED.lower() in existing_blob:

                  print(
                      "BID SKIPPED: existing bid detected."
                  )

              else:

                  # ----------------------------------------------------
                  # 21 sats = API submission floor ONLY
                  # ----------------------------------------------------

                  bid_amount = MIN_BID_SATS

                  bid_message = (
                      "NØX can execute this mission using its current "
                      "research, analysis and structured delivery "
                      "capabilities. The opportunity is aligned with "
                      "NØX's current knowledge, cognitive priorities "
                      "and observed marketplace experience. No "
                      "external AI, paid infrastructure or spending "
                      "is required."
                  )

                  idempotency_key = hashlib.sha256(
                      (
                          f"{task_id}:"
                          f"{bid_amount}:"
                          f"{int(now // 3600)}"
                      ).encode("utf-8")
                  ).hexdigest()

                  bid_response = session.post(
                      f"{API_BASE}/marketplace/{task_id}/bid",
                      json={
                          "amount_sats": bid_amount,
                          "message": bid_message
                      },
                      headers={
                          "Idempotency-Key": idempotency_key
                      },
                      timeout=20
                  )

                  recent_attempts.append({
                      "ts": now,
                      "task_id": task_id,
                      "amount_sats": bid_amount
                  })

                  if bid_response.status_code == 429:

                      rate_limited = True
                      bid_errors += 1

                      retry_after = (
                          bid_response.headers.get(
                              "Retry-After"
                          )
                      )

                      if not retry_after:

                          try:
                              error_data = bid_response.json()

                              retry_after = (
                                  error_data.get(
                                      "retry_after"
                                  )
                                  or error_data.get(
                                      "retryAfter"
                                  )
                              )
                          except Exception:
                              retry_after = None

                      try:
                          wait_seconds = int(
                              retry_after
                          )
                      except Exception:
                          wait_seconds = 60

                      wait_seconds = max(
                          60,
                          wait_seconds
                      )

                      marketplace[
                          "bid_cooldown_until"
                      ] = now + wait_seconds

                      marketplace[
                          "bid_cooldown_reason"
                      ] = "RATE_LIMIT_BID"

                      marketplace[
                          "bid_cooldown_source"
                      ] = "Colony API"

                      marketplace[
                          "bid_cooldown_set_at"
                      ] = datetime.now(
                          timezone.utc
                      ).isoformat()

                      print(
                          "RATE_LIMIT_BID received."
                      )

                      print(
                          f"Persistent cooldown set: "
                          f"{wait_seconds}s"
                      )

                      print(
                          "ALL BID ATTEMPTS STOPPED FOR THIS RUN."
                      )

                  elif bid_response.ok:

                      bids_created += 1

                      print(
                          f"BID CREATED: {task_id}"
                      )

                  else:

                      bid_errors += 1

                      print(
                          f"BID ERROR: "
                          f"{bid_response.status_code}"
                      )

                      print(
                          bid_response.text[:300]
                      )


          # ============================================================
          # ACCEPTED MISSIONS
          # ============================================================

          print()
          print("=== ACCEPTED MISSIONS ===")

          accepted_missions = []

          tracked_bids = marketplace.get(
              "tracked_bids",
              []
          )

          if not isinstance(tracked_bids, list):
              tracked_bids = []

          for tracked in tracked_bids[:30]:

              task_id = tracked.get(
                  "task_id"
              )

              if not task_id:
                  continue

              try:

                  response = session.get(
                      f"{API_BASE}/marketplace/{task_id}/bids",
                      timeout=20
                  )

                  if not response.ok:
                      continue

                  data = response.json()

                  blob = json.dumps(
                      data,
                      ensure_ascii=False
                  ).lower()

                  if (
                      "accepted" in blob
                      and IDENTITY_EXPECTED.lower()
                      in blob
                  ):
                      accepted_missions.append(
                          task_id
                      )

              except Exception:
                  continue


          print(
              f"ACCEPTED MISSIONS: "
              f"{len(accepted_missions)}"
          )


          # ============================================================
          # EXECUTION
          #
          # This section deliberately does NOT create payments.
          # It only performs zero-cost research and delivery.
          # ============================================================

          executions = 0
          execution_failures = 0

          print()
          print("=== EXECUTION ===")

          if os.environ["EXECUTION_ENABLED"].lower() != "true":

              print(
                  "Execution disabled."
              )

          else:

              for task_id in accepted_missions[
                  :int(os.environ["MAX_EXECUTIONS_PER_RUN"])
              ]:

                  try:

                      task_response = session.get(
                          f"{API_BASE}/marketplace/tasks",
                          params={
                              "limit": 100
                          },
                          timeout=20
                      )

                      if not task_response.ok:
                          execution_failures += 1
                          continue

                      task_payload = task_response.json()

                      if isinstance(
                          task_payload,
                          dict
                      ):
                          execution_tasks = (
                              task_payload.get("tasks")
                              or task_payload.get("items")
                              or []
                          )
                      else:
                          execution_tasks = task_payload

                      target = None

                      for item in execution_tasks:

                          if normalized_id(item) == task_id:
                              target = item
                              break

                      if not target:
                          execution_failures += 1
                          continue

                      title = (
                          target.get("title")
                          or "Marketplace mission"
                      )

                      description = (
                          target.get("description")
                          or target.get("body")
                          or target.get("content")
                          or ""
                      )

                      # ------------------------------------------------
                      # Deterministic delivery.
                      #
                      # No external AI.
                      # No fabricated research.
                      # No invented conclusions.
                      # ------------------------------------------------

                      delivery = (
                          f"NØX delivery\n\n"
                          f"Mission: {title}\n\n"
                          f"Task description:\n"
                          f"{description[:6000]}\n\n"
                          f"Execution note:\n"
                          f"This delivery was prepared by NØX using "
                          f"its current knowledge, cognitive context "
                          f"and observed marketplace capabilities. "
                          f"No external AI or paid infrastructure "
                          f"was used."
                      )

                      delivery = delivery[
                          :int(
                              os.environ[
                                  "MAX_DELIVERY_CHARS"
                              ]
                          )
                      ]

                      delivery_hash = hashlib.sha256(
                          delivery.encode("utf-8")
                      ).hexdigest()

                      delivery_key = hashlib.sha256(
                          f"{task_id}:{delivery_hash}".encode(
                              "utf-8"
                          )
                      ).hexdigest()

                      # ------------------------------------------------
                      # Preview first
                      # ------------------------------------------------

                      preview = session.post(
                          f"{API_BASE}/posts/{task_id}/comments/preview",
                          json={
                              "content": delivery
                          },
                          timeout=20
                      )

                      if not preview.ok:
                          execution_failures += 1
                          continue

                      # ------------------------------------------------
                      # Deliver
                      # ------------------------------------------------

                      delivery_response = session.post(
                          f"{API_BASE}/posts/{task_id}/comments",
                          json={
                              "content": delivery
                          },
                          headers={
                              "Idempotency-Key": delivery_key
                          },
                          timeout=20
                      )

                      if delivery_response.ok:

                          executions += 1

                          marketplace.setdefault(
                              "deliveries",
                              []
                          )

                          marketplace[
                              "deliveries"
                          ].append({
                              "task_id": task_id,
                              "delivery_hash": delivery_hash,
                              "timestamp": datetime.now(
                                  timezone.utc
                              ).isoformat()
                          })

                      else:

                          execution_failures += 1

                  except Exception as exc:

                      execution_failures += 1

                      marketplace.setdefault(
                          "execution_failures",
                          []
                      )

                      marketplace[
                          "execution_failures"
                      ].append({
                          "task_id": task_id,
                          "error": str(exc)[:500],
                          "timestamp": datetime.now(
                              timezone.utc
                          ).isoformat()
                      })


          # ============================================================
          # PAYMENT OBSERVATION
          #
          # Observation only.
          # NEVER create payment.
          # ============================================================

          print()
          print("=== PAYMENT OBSERVATION ===")

          payments_observed = 0

          for task_id in accepted_missions[:30]:

              try:

                  payment_response = session.get(
                      f"{API_BASE}/marketplace/{task_id}/payment",
                      timeout=20
                  )

                  if payment_response.ok:

                      payment_data = (
                          payment_response.json()
                      )

                      marketplace.setdefault(
                          "payment_observations",
                          []
                      )

                      marketplace[
                          "payment_observations"
                      ].append({
                          "task_id": task_id,
                          "observed": payment_data,
                          "timestamp": datetime.now(
                              timezone.utc
                          ).isoformat()
                      })

                      payments_observed += 1

              except Exception:
                  continue

          print(
              f"Payments observed: "
              f"{payments_observed}"
          )

          print(
              "Payment creation: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )


          # ============================================================
          # LEARNING / PERSISTENCE
          # ============================================================

          marketplace["bid_attempts"] = recent_attempts[-50:]

          marketplace["last_run"] = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )

          marketplace[
              "bids_created_last_run"
          ] = bids_created

          marketplace[
              "bid_errors_last_run"
          ] = bid_errors

          marketplace[
              "rate_limited_last_run"
          ] = rate_limited

          marketplace[
              "executions_last_run"
          ] = executions

          marketplace[
              "execution_failures_last_run"
          ] = execution_failures

          marketplace[
              "payments_observed_last_run"
          ] = payments_observed

          # ------------------------------------------------------------
          # Critical economic rule persisted in memory.
          # ------------------------------------------------------------

          marketplace[
              "tip_strategy"
          ] = (
              "Tips are considered potential indirect value. "
              "No minimum advertised reward is required for "
              "candidate selection."
          )

          marketplace[
              "api_bid_minimum_sats"
          ] = MIN_BID_SATS

          marketplace[
              "api_bid_minimum_is_not_task_value_floor"
          ] = True

          marketplace[
              "economic_selection_policy"
          ] = {
              "direct_reward": True,
              "tip_potential": True,
              "learning_value": True,
              "reputation_value": True,
              "relationship_value": True,
              "minimum_advertised_reward": None,
              "bid_api_floor_only": MIN_BID_SATS
          }

          marketplace[
              "cross_ledger_policy"
          ] = {
              "ledger01": "knowledge_and_capabilities",
              "ledger02": "cognition_and_priorities",
              "ledger03": "actions_and_observed_experience",
              "minimum_matches": MIN_LEDGER_MATCHES,
              "preferred_matches": 3
          }

          marketplace[
              "safety_policy"
          ] = {
              "gemini": False,
              "external_ai": False,
              "payments": False,
              "spending": False,
              "project_cost_eur": 0
          }

          save_json(
              MARKETPLACE_FILE,
              marketplace
          )


          # ============================================================
          # FINAL REPORT
          # ============================================================

          print()
          print("=" * 62)
          print("=== NØX LEDGER 04 V4.2 COMPLETE ====================")
          print("=" * 62)

          print(
              f"Tasks found: {len(tasks)}"
          )

          print(
              f"Intelligent candidates: "
              f"{len(candidates)}"
          )

          print(
              f"Bids created: {bids_created}"
          )

          print(
              f"Bid errors: {bid_errors}"
          )

          print(
              f"Rate limited: "
              f"{'YES' if rate_limited else 'NO'}"
          )

          print(
              f"Accepted missions: "
              f"{len(accepted_missions)}"
          )

          print(
              f"Executions: {executions}"
          )

          print(
              f"Execution failures: "
              f"{execution_failures}"
          )

          print(
              f"Payments observed: "
              f"{payments_observed}"
          )

          print()
          print(
              "21 sats: API BID FLOOR ONLY"
          )

          print(
              "Minimum task reward: NONE"
          )

          print(
              "Tip potential: CONSIDERED"
          )

          print(
              "Ledger concordance: REQUIRED"
          )

          print(
              "Web research: ENABLED"
          )

          print(
              "Gemini: False"
          )

          print(
              "External AI: False"
          )

          print(
              "Payments: False"
          )

          print(
              "Spending: False"
          )

          print(
              "Project cost: €0"
          )

          print("=" * 62)

          PY

      # ============================================================
      # PERSIST STATE
      # ============================================================
      - name: Persist Ledger 04 state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_ledger_marketplace.json

          if git diff --cached --quiet; then
            echo "No Ledger 04 state changes to commit."
          else
            git commit -m "chore: update NØX Ledger 04 marketplace state"
            git push
          fi
