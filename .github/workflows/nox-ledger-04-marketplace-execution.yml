name: NØX LEDGER 04 - Marketplace Execution V4

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: "https://thecolony.ai/api/v1"
      NOX_IDENTITY: "nox_origine"

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      MAX_BIDS_PER_RUN: "1"
      LOCAL_BID_WINDOW_SECONDS: "3600"
      LOCAL_BID_SAFETY_LIMIT: "8"
      MIN_BID_SATS: "21"

      BID_SCORE_THRESHOLD: "78"
      MIN_FEASIBILITY_SCORE: "75"

      MIN_LEDGER_MATCHES: "2"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # LEDGER 04
      # ============================================================

      - name: Run Ledger 04
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          NOX_IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(
              os.environ["MAX_TASKS"]
          )

          MAX_RECONCILE = int(
              os.environ["MAX_RECONCILE"]
          )

          MAX_BIDS_PER_RUN = int(
              os.environ["MAX_BIDS_PER_RUN"]
          )

          LOCAL_BID_WINDOW_SECONDS = int(
              os.environ["LOCAL_BID_WINDOW_SECONDS"]
          )

          LOCAL_BID_SAFETY_LIMIT = int(
              os.environ["LOCAL_BID_SAFETY_LIMIT"]
          )

          MIN_BID_SATS = int(
              os.environ["MIN_BID_SATS"]
          )

          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )

          MIN_FEASIBILITY_SCORE = int(
              os.environ["MIN_FEASIBILITY_SCORE"]
          )

          MIN_LEDGER_MATCHES = int(
              os.environ["MIN_LEDGER_MATCHES"]
          )

          EXECUTION_ENABLED = (
              os.environ[
                  "EXECUTION_ENABLED"
              ].lower() == "true"
          )

          MAX_EXECUTIONS_PER_RUN = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )

          MAX_DELIVERY_CHARS = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          WEB_RESEARCH_ENABLED = (
              os.environ[
                  "WEB_RESEARCH_ENABLED"
              ].lower() == "true"
          )

          MAX_WEB_SOURCES = int(
              os.environ["MAX_WEB_SOURCES"]
          )

          HTTP_TIMEOUT = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )

          MAX_SOURCE_BYTES = int(
              os.environ["MAX_SOURCE_BYTES"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )

          MAX_TASK_MEMORY = int(
              os.environ["MAX_TASK_MEMORY"]
          )

          MAX_FAILURE_MEMORY = int(
              os.environ["MAX_FAILURE_MEMORY"]
          )

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ[
                  "REQUIRE_CLEAR_DELIVERABLE"
              ].lower() == "true"
          )

          REQUIRE_ZERO_COST = (
              os.environ[
                  "REQUIRE_ZERO_COST_EXECUTION"
              ].lower() == "true"
          )

          REQUIRE_NO_EXTERNAL_AI = (
              os.environ[
                  "REQUIRE_NO_EXTERNAL_AI"
              ].lower() == "true"
          )

          MEMORY_MARKETPLACE = (
              "memory/nox_ledger_marketplace.json"
          )

          MEMORY_KNOWLEDGE = (
              "memory/nox_ledger_knowledge.json"
          )

          MEMORY_COGNITION = (
              "memory/nox_ledger_cognition.json"
          )

          MEMORY_ACTION = (
              "memory/nox_ledger_action.json"
          )


          # ============================================================
          # GENERAL HELPERS
          # ============================================================

          def now_ts():
              return time.time()


          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def stringify(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )
              except Exception:
                  return str(value)


          def compact(value, limit=700):
              value = re.sub(
                  r"\s+",
                  " ",
                  stringify(value)
              ).strip()

              return value[:limit]


          def load_json(path, default):
              try:
                  if not os.path.exists(path):
                      return default

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      "MEMORY WARNING "
                      f"{path}: "
                      f"{compact(exc)}"
                  )
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temp_path = path + ".tmp"

              with open(
                  temp_path,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temp_path,
                  path
              )


          def trim_list(items, limit):
              if not isinstance(
                  items,
                  list
              ):
                  return []

              return items[-limit:]


          def recursive_text(
              value,
              depth=0
          ):
              if depth > 7:
                  return ""

              if isinstance(
                  value,
                  str
              ):
                  return value

              if isinstance(
                  value,
                  (int, float, bool)
              ):
                  return str(value)

              if isinstance(
                  value,
                  list
              ):
                  return " ".join(
                      recursive_text(
                          item,
                          depth + 1
                      )
                      for item in value[:300]
                  )

              if isinstance(
                  value,
                  dict
              ):
                  parts = []

                  for key, item in list(
                      value.items()
                  )[:400]:

                      parts.append(
                          str(key)
                      )

                      parts.append(
                          recursive_text(
                              item,
                              depth + 1
                          )
                      )

                  return " ".join(parts)

              return ""


          def first_value(
              data,
              keys
          ):
              wanted = {
                  str(key).lower()
                  for key in keys
              }

              def walk(
                  value,
                  depth=0
              ):
                  if depth > 8:
                      return None

                  if isinstance(
                      value,
                      dict
                  ):

                      for key, item in value.items():

                          if (
                              str(key).lower()
                              in wanted
                          ):
                              if (
                                  item is not None
                                  and str(item).strip()
                              ):
                                  return item

                      for item in value.values():

                          result = walk(
                              item,
                              depth + 1
                          )

                          if result is not None:
                              return result

                  elif isinstance(
                      value,
                      list
                  ):

                      for item in value[:300]:

                          result = walk(
                              item,
                              depth + 1
                          )

                          if result is not None:
                              return result

                  return None

              return walk(data)


          def first_text(
              data,
              keys
          ):
              value = first_value(
                  data,
                  keys
              )

              if value is None:
                  return ""

              return stringify(
                  value
              ).strip()


          def first_number(
              data,
              keys
          ):
              value = first_value(
                  data,
                  keys
              )

              if value is None:
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  return float(value)

              match = re.search(
                  r"\d+(?:\.\d+)?",
                  stringify(value)
              )

              if not match:
                  return None

              try:
                  return float(
                      match.group(0)
                  )
              except Exception:
                  return None


          def task_id(task):
              return first_text(
                  task,
                  [
                      "id",
                      "post_id",
                      "task_id"
                  ]
              )


          def task_title(task):
              return first_text(
                  task,
                  [
                      "title",
                      "name"
                  ]
              )


          def task_body(task):
              return first_text(
                  task,
                  [
                      "description",
                      "body",
                      "content",
                      "details",
                      "task"
                  ]
              )


          def task_status(task):
              return first_text(
                  task,
                  ["status"]
              ).lower()


          def unique_strings(values):
              result = []

              for value in values:

                  value = compact(
                      value,
                      500
                  )

                  if not value:
                      continue

                  if value not in result:
                      result.append(
                          value
                      )

              return result


          def token_set(value):
              words = re.findall(
                  r"[a-z0-9][a-z0-9_-]{3,}",
                  stringify(value).lower()
              )

              stop = {
                  "this",
                  "that",
                  "with",
                  "from",
                  "your",
                  "have",
                  "will",
                  "they",
                  "them",
                  "into",
                  "then",
                  "than",
                  "task",
                  "work",
                  "need",
                  "looking",
                  "using",
                  "must",
                  "should",
                  "could",
                  "would",
                  "about",
                  "their",
                  "there",
                  "which",
                  "what",
                  "when",
                  "where",
                  "more",
                  "some"
              }

              return {
                  word
                  for word in words
                  if word not in stop
              }


          def overlap_score(
              source,
              target
          ):
              left = token_set(source)
              right = token_set(target)

              if not left or not right:
                  return 0

              intersection = left.intersection(
                  right
              )

              return min(
                  100,
                  int(
                      100
                      * len(intersection)
                      / max(
                          1,
                          min(
                              len(left),
                              30
                          )
                      )
                  )
              )


          def idempotency_key(
              action,
              identifier
          ):
              raw = (
                  NOX_IDENTITY
                  + ":"
                  + action
                  + ":"
                  + identifier
                  + ":"
                  + datetime.now(
                      timezone.utc
                  ).strftime(
                      "%Y-%m-%d-%H"
                  )
              )

              digest = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

              return (
                  "nox-ledger04-"
                  + action
                  + "-"
                  + digest
              )


          # ============================================================
          # HEADER
          # ============================================================

          print(
              "=============================================="
          )

          print(
              "=== NØX LEDGER 04 - MARKETPLACE EXECUTION ==="
          )

          print(
              "=== V4                                     ==="
          )

          print(
              "=============================================="
          )


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY is missing."
              )

          print()
          print(
              "=== AUTHENTICATION ==="
          )

          auth_response = requests.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              headers={
                  "Accept":
                      "application/json",
                  "Content-Type":
                      "application/json",
                  "User-Agent":
                      "Nox-Ledger-04/4.0"
              },
              timeout=25
          )

          if auth_response.status_code >= 400:
              raise SystemExit(
                  "AUTH ERROR "
                  f"{auth_response.status_code}: "
                  f"{compact(auth_response.text)}"
              )

          auth_data = auth_response.json()

          jwt = stringify(
              auth_data.get(
                  "access_token",
                  ""
              )
          ).strip()

          if not jwt:
              raise SystemExit(
                  "AUTH ERROR: JWT missing."
              )

          session = requests.Session()

          session.headers.update({
              "Accept":
                  "application/json",
              "Content-Type":
                  "application/json",
              "User-Agent":
                  "Nox-Ledger-04/4.0",
              "Authorization":
                  f"Bearer {jwt}"
          })

          print(
              "JWT obtained: YES"
          )

          print(
              "API key used only for token exchange: YES"
          )

          print(
              "JWT value: HIDDEN"
          )


          # ============================================================
          # API HELPERS
          # ============================================================

          def api_get(
              path,
              params=None
          ):
              response = session.get(
                  f"{API_BASE}{path}",
                  params=params,
                  timeout=25
              )

              if response.status_code >= 400:
                  raise RuntimeError(
                      "GET "
                      + path
                      + " -> "
                      + str(
                          response.status_code
                      )
                      + ": "
                      + compact(
                          response.text
                      )
                  )

              try:
                  return response.json()
              except Exception:
                  return {}


          def api_post(
              path,
              payload,
              idempotency=None
          ):
              headers = {}

              if idempotency:
                  headers[
                      "Idempotency-Key"
                  ] = idempotency

              return session.post(
                  f"{API_BASE}{path}",
                  json=payload,
                  headers=headers,
                  timeout=25
              )


          # ============================================================
          # IDENTITY
          # ============================================================

          print()
          print(
              "=== IDENTITY ==="
          )

          try:
              me = api_get(
                  "/users/me"
              )

              identity = (
                  first_text(
                      me,
                      [
                          "username",
                          "handle",
                          "identity",
                          "name"
                      ]
                  )
                  or NOX_IDENTITY
              )

          except Exception as exc:
              raise SystemExit(
                  "IDENTITY ERROR: "
                  + compact(exc)
              )

          print(
              f"IDENTITY: {identity}"
          )


          # ============================================================
          # LOAD THE 3 LEDGERS
          # ============================================================

          print()
          print(
              "=== INTER-LEDGER CONTEXT ==="
          )

          ledger01 = load_json(
              MEMORY_KNOWLEDGE,
              {}
          )

          ledger02 = load_json(
              MEMORY_COGNITION,
              {}
          )

          ledger03 = load_json(
              MEMORY_ACTION,
              {}
          )

          marketplace = load_json(
              MEMORY_MARKETPLACE,
              {}
          )

          ledger01_text = recursive_text(
              ledger01
          ).lower()

          ledger02_text = recursive_text(
              ledger02
          ).lower()

          ledger03_text = recursive_text(
              ledger03
          ).lower()

          print(
              "Ledger 01: "
              + (
                  "LOADED"
                  if ledger01
                  else "EMPTY"
              )
          )

          print(
              "Ledger 02: "
              + (
                  "LOADED"
                  if ledger02
                  else "EMPTY"
              )
          )

          print(
              "Ledger 03: "
              + (
                  "LOADED"
                  if ledger03
                  else "EMPTY"
              )
          )


          # ============================================================
          # CAPABILITY MODEL
          # ============================================================

          CAPABILITIES = {

              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "web research",
                  "market research",
                  "competitive research",
                  "competitor research",
                  "fact checking",
                  "fact check",
                  "source analysis"
              ],

              "writing": [
                  "writing",
                  "write",
                  "report writing",
                  "write a report",
                  "technical report",
                  "documentation",
                  "content writing",
                  "copywriting"
              ],

              "seo": [
                  "seo",
                  "seo audit",
                  "keyword research",
                  "search optimization",
                  "on-page seo",
                  "technical seo"
              ],

              "qa": [
                  "qa",
                  "quality assurance",
                  "testing",
                  "api testing",
                  "api smoke test",
                  "smoke test",
                  "validation",
                  "bug report"
              ],

              "data": [
                  "data cleanup",
                  "data cleaning",
                  "csv",
                  "json",
                  "data analysis",
                  "data validation",
                  "spreadsheet"
              ],

              "agent_tools": [
                  "agent tooling",
                  "build agent tools",
                  "agent tools",
                  "tool development",
                  "automation",
                  "api integration"
              ],

              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead research",
                  "prospect research"
              ],

              "cro": [
                  "cro",
                  "conversion rate",
                  "conversion optimization",
                  "landing page analysis"
              ]
          }


          def matched_capabilities(
              content
          ):
              lowered = content.lower()
              result = []

              for group, terms in CAPABILITIES.items():

                  if any(
                      term in lowered
                      for term in terms
                  ):
                      result.append(
                          group
                      )

              return result


          # ============================================================
          # HARD SAFETY / FEASIBILITY FILTERS
          # ============================================================

          def external_ai_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "use chatgpt",
                  "use gpt",
                  "use gpt-4",
                  "use gpt-5",
                  "use gemini",
                  "use claude",
                  "use anthropic",
                  "use openai api",
                  "use an llm api",
                  "external ai required",
                  "llm api required"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def financial_action_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "send funds",
                  "transfer funds",
                  "bank transfer",
                  "credit card",
                  "make a payment",
                  "pay an invoice",
                  "purchase",
                  "buy crypto",
                  "wallet transfer",
                  "send bitcoin",
                  "send sats"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def paid_infrastructure_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "paid hosting",
                  "paid server",
                  "premium api",
                  "paid api",
                  "aws billing",
                  "azure billing",
                  "gcp billing",
                  "subscription required"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def human_only_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "call the client",
                  "phone the client",
                  "in person",
                  "physical visit",
                  "meet the client",
                  "ship the product",
                  "deliver physically",
                  "go to the office"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def credential_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "password",
                  "private key",
                  "secret key",
                  "login to my account",
                  "log into my account",
                  "account credentials",
                  "admin credentials",
                  "private credentials"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def external_delivery_required(
              content
          ):
              lowered = content.lower()

              terms = [
                  "send by email",
                  "email the client",
                  "upload to my drive",
                  "upload to google drive",
                  "upload to dropbox",
                  "send via slack",
                  "send via discord"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def reward_conflict(
              content
          ):
              lowered = content.lower()

              sats = re.search(
                  r"\b\d[\d,.\s]*"
                  r"\s*(sats|sat|satoshi|satoshis)\b",
                  lowered
              )

              other_currency = re.search(
                  r"\b(usdc|usd|eur|€|\$)\b",
                  lowered
              )

              return bool(
                  sats
                  and other_currency
              )


          def clear_deliverable(
              content
          ):
              lowered = content.lower()

              terms = [
                  "report",
                  "audit",
                  "analysis",
                  "research",
                  "documentation",
                  "brief",
                  "findings",
                  "results",
                  "list",
                  "comparison",
                  "test results",
                  "bug report",
                  "recommendations",
                  "csv",
                  "json"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def buyer_intent(
              content
          ):
              lowered = content.lower()

              terms = [
                  "need someone",
                  "looking for someone",
                  "looking for an agent",
                  "seeking an agent",
                  "i need",
                  "we need",
                  "request",
                  "please analyze",
                  "please research",
                  "please write",
                  "please build",
                  "audit my",
                  "analyze my",
                  "research for me",
                  "write for me",
                  "build for me"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def obvious_service_offer(
              content
          ):
              lowered = content.lower()

              terms = [
                  "for hire",
                  "hire me",
                  "my services",
                  "available for hire",
                  "i offer",
                  "i can provide",
                  "service offering"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def urls_from(
              content
          ):
              found = re.findall(
                  r"https?://[^\s<>\"]+",
                  content
              )

              result = []

              for url in found:

                  url = url.rstrip(
                      ".,);]"
                  )

                  try:
                      parsed = urlparse(
                          url
                      )

                      if (
                          parsed.scheme
                          in (
                              "http",
                              "https"
                          )
                          and parsed.netloc
                      ):
                          result.append(
                              url
                          )

                  except Exception:
                      pass

              return list(
                  dict.fromkeys(
                      result
                  )
              )


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print()
          print(
              "=== MARKETPLACE DISCOVERY ==="
          )

          tasks_data = api_get(
              "/marketplace/tasks",
              params={
                  "limit":
                      MAX_TASKS
              }
          )

          if isinstance(
              tasks_data,
              list
          ):
              tasks = tasks_data

          elif isinstance(
              tasks_data,
              dict
          ):
              tasks = (
                  tasks_data.get(
                      "tasks"
                  )
                  or tasks_data.get(
                      "items"
                  )
                  or tasks_data.get(
                      "results"
                  )
                  or []
              )

          else:
              tasks = []

          print(
              f"TASKS FOUND: {len(tasks)}"
          )


          # ============================================================
          # LOCAL BID STATE
          # ============================================================

          tracked_bids = marketplace.get(
              "tracked_bids",
              []
          )

          if not isinstance(
              tracked_bids,
              list
          ):
              tracked_bids = []

          bid_attempts = marketplace.get(
              "bid_attempts",
              []
          )

          if not isinstance(
              bid_attempts,
              list
          ):
              bid_attempts = []

          current_time = now_ts()

          recent_attempts = []

          for attempt in bid_attempts:

              try:
                  timestamp = float(
                      attempt.get(
                          "timestamp",
                          0
                      )
                  )

              except Exception:
                  timestamp = 0

              if (
                  current_time
                  - timestamp
                  <= LOCAL_BID_WINDOW_SECONDS
              ):
                  recent_attempts.append(
                      attempt
                  )

          bid_attempts = recent_attempts

          print()
          print(
              "=== LOCAL BID CONTROL ==="
          )

          print(
              "Recent bid attempts: "
              f"{len(bid_attempts)}"
          )

          print(
              "Safety limit: "
              f"{LOCAL_BID_SAFETY_LIMIT}"
          )

          print(
              "Max bids this run: "
              f"{MAX_BIDS_PER_RUN}"
          )


          local_bid_blocked = (
              len(bid_attempts)
              >= LOCAL_BID_SAFETY_LIMIT
          )

          if local_bid_blocked:
              print(
                  "LOCAL BID COOLDOWN: ACTIVE"
              )
          else:
              print(
                  "LOCAL BID COOLDOWN: INACTIVE"
              )


          # ============================================================
          # BID RECONCILIATION
          # ============================================================

          print()
          print(
              "=== BID RECONCILIATION ==="
          )

          reconciled = []

          for record in tracked_bids[
              :MAX_RECONCILE
          ]:

              tid = stringify(
                  record.get(
                      "task_id",
                      ""
                  )
              ).strip()

              bid_id = stringify(
                  record.get(
                      "bid_id",
                      ""
                  )
              ).strip()

              if not tid:
                  continue

              try:

                  data = api_get(
                      f"/marketplace/{tid}/bids"
                  )

                  if isinstance(
                      data,
                      list
                  ):
                      bids = data

                  elif isinstance(
                      data,
                      dict
                  ):
                      bids = data.get(
                          "bids",
                          []
                      )

                  else:
                      bids = []

                  for bid in bids:

                      current_bid_id = (
                          first_text(
                              bid,
                              [
                                  "id",
                                  "bid_id"
                              ]
                          )
                      )

                      if (
                          bid_id
                          and current_bid_id
                          != bid_id
                      ):
                          continue

                      status = first_text(
                          bid,
                          ["status"]
                      ).lower()

                      if status:
                          record[
                              "status"
                          ] = status

                      record[
                          "accepted"
                      ] = (
                          status == "accepted"
                      )

                      record[
                          "rejected"
                      ] = (
                          status == "rejected"
                      )

                      record[
                          "last_reconciled_at"
                      ] = now_iso()

                      break

              except Exception as exc:

                  record[
                      "reconcile_error"
                  ] = compact(
                      exc
                  )

              reconciled.append(
                  record
              )

          tracked_bids = reconciled

          print(
              f"Tracked bids: "
              f"{len(tracked_bids)}"
          )


          # ============================================================
          # EVALUATION
          # ============================================================

          print()
          print(
              "=== THREE-LEDGER COGNITIVE EVALUATION ==="
          )

          evaluations = []
          candidates = []
          skip_counts = {}

          def skip(
              reason
          ):
              skip_counts[
                  reason
              ] = (
                  skip_counts.get(
                      reason,
                      0
                  )
                  + 1
              )


          for task in tasks:

              tid = task_id(
                  task
              )

              title = task_title(
                  task
              )

              body = task_body(
                  task
              )

              if not tid:
                  skip(
                      "NO_TASK_ID"
                  )
                  continue

              content = (
                  title
                  + "\n"
                  + body
              )

              lowered = content.lower()

              status = task_status(
                  task
              )

              if status in {
                  "closed",
                  "completed",
                  "cancelled",
                  "canceled"
              }:
                  skip(
                      "CLOSED_TASK"
                  )
                  continue

              already_tracked = any(
                  stringify(
                      item.get(
                          "task_id",
                          ""
                      )
                  ) == tid
                  for item in tracked_bids
              )

              if already_tracked:
                  skip(
                      "ALREADY_TRACKED"
                  )
                  continue

              capabilities = matched_capabilities(
                  content
              )

              if not capabilities:
                  skip(
                      "NO_CAPABILITY"
                  )
                  continue

              if financial_action_required(
                  content
              ):
                  skip(
                      "FINANCIAL_ACTION"
                  )
                  continue

              if human_only_required(
                  content
              ):
                  skip(
                      "HUMAN_ONLY"
                  )
                  continue

              if credential_required(
                  content
              ):
                  skip(
                      "CREDENTIAL_REQUIRED"
                  )
                  continue

              if external_delivery_required(
                  content
              ):
                  skip(
                      "EXTERNAL_DELIVERY"
                  )
                  continue

              if (
                  REQUIRE_NO_EXTERNAL_AI
                  and external_ai_required(
                      content
                  )
              ):
                  skip(
                      "EXTERNAL_AI_REQUIRED"
                  )
                  continue

              if (
                  REQUIRE_ZERO_COST
                  and paid_infrastructure_required(
                      content
                  )
              ):
                  skip(
                      "PAID_INFRASTRUCTURE"
                  )
                  continue

              if (
                  REQUIRE_CLEAR_DELIVERABLE
                  and not clear_deliverable(
                      content
                  )
              ):
                  skip(
                      "UNCLEAR_DELIVERABLE"
                  )
                  continue

              if reward_conflict(
                  content
              ):
                  skip(
                      "REWARD_UNIT_CONFLICT"
                  )
                  continue

              if (
                  obvious_service_offer(
                      content
                  )
                  and not buyer_intent(
                      content
                  )
              ):
                  skip(
                      "SERVICE_OFFER_NOT_REQUEST"
                  )
                  continue


              # ========================================================
              # LEDGER 01 MATCH
              # ========================================================

              capability_text = " ".join(
                  capabilities
              )

              ledger01_overlap = overlap_score(
                  content,
                  ledger01_text
              )

              ledger01_capability = any(
                  capability in ledger01_text
                  for capability in capabilities
              )

              ledger01_match = (
                  ledger01_capability
                  or ledger01_overlap >= 8
              )


              # ========================================================
              # LEDGER 02 MATCH
              # ========================================================

              ledger02_overlap = overlap_score(
                  content,
                  ledger02_text
              )

              cognitive_terms = [
                  "research",
                  "learning",
                  "knowledge",
                  "opportunity",
                  "marketplace",
                  "work",
                  "task",
                  "contribution",
                  "reputation",
                  "communication",
                  "strategy",
                  "action",
                  "execution",
                  "self improvement",
                  "agent"
              ]

              ledger02_goal_match = any(
                  term in content.lower()
                  and term in ledger02_text
                  for term in cognitive_terms
              )

              ledger02_match = (
                  ledger02_goal_match
                  or ledger02_overlap >= 8
              )


              # ========================================================
              # LEDGER 03 MATCH
              # ========================================================

              ledger03_overlap = overlap_score(
                  content,
                  ledger03_text
              )

              ledger03_capability = any(
                  capability in ledger03_text
                  for capability in capabilities
              )

              positive_terms = [
                  "success",
                  "successful",
                  "accepted",
                  "delivered",
                  "positive",
                  "worked",
                  "learning",
                  "opportunity",
                  "tracked"
              ]

              ledger03_positive = any(
                  term in ledger03_text
                  for term in positive_terms
              )

              ledger03_match = (
                  ledger03_capability
                  or (
                      ledger03_positive
                      and ledger03_overlap >= 8
                  )
              )


              ledger_matches = 0
              matched_ledgers = []

              if ledger01_match:
                  ledger_matches += 1
                  matched_ledgers.append(
                      "LEDGER01"
                  )

              if ledger02_match:
                  ledger_matches += 1
                  matched_ledgers.append(
                      "LEDGER02"
                  )

              if ledger03_match:
                  ledger_matches += 1
                  matched_ledgers.append(
                      "LEDGER03"
                  )


              # ========================================================
              # HARD CONCORDANCE GATE
              # ========================================================

              if (
                  ledger_matches
                  < MIN_LEDGER_MATCHES
              ):
                  skip(
                      "INSUFFICIENT_LEDGER_CONCORDANCE"
                  )
                  continue


              # ========================================================
              # EXECUTION FEASIBILITY
              # ========================================================

              urls = urls_from(
                  content
              )

              capability_score = min(
                  100,
                  60
                  + (
                      len(capabilities)
                      * 10
                  )
              )

              feasibility = (
                  capability_score
              )

              if urls:
                  feasibility += 8

              if (
                  "research"
                  in capabilities
              ):
                  feasibility += 5

              if (
                  "qa"
                  in capabilities
              ):
                  feasibility += 4

              if (
                  "seo"
                  in capabilities
              ):
                  feasibility += 4

              feasibility = min(
                  100,
                  feasibility
              )


              if (
                  feasibility
                  < MIN_FEASIBILITY_SCORE
              ):
                  skip(
                      "LOW_FEASIBILITY"
                  )
                  continue


              # ========================================================
              # CLARITY
              # ========================================================

              clarity_score = 100

              if len(body) < 150:
                  clarity_score -= 15

              if len(body) < 75:
                  clarity_score -= 20

              clarity_score = max(
                  0,
                  clarity_score
              )


              # ========================================================
              # RESEARCH SCORE
              # ========================================================

              research_score = 70

              if urls:
                  research_score = 95

              if (
                  "research" in lowered
                  or "report" in lowered
                  or "audit" in lowered
              ):
                  research_score = max(
                      research_score,
                      85
                  )


              # ========================================================
              # REWARD SIGNAL
              # ========================================================

              explicit_sats = re.search(
                  r"\b\d[\d,.\s]*"
                  r"\s*(sats|sat|satoshi|satoshis)\b",
                  lowered
              )

              reward_score = (
                  90
                  if explicit_sats
                  else 65
              )


              # ========================================================
              # HISTORICAL SIGNAL
              # ========================================================

              failure_text = recursive_text(
                  marketplace.get(
                      "failures",
                      []
                  )
              ).lower()

              outcome_text = recursive_text(
                  marketplace.get(
                      "outcomes",
                      []
                  )
              ).lower()

              title_tokens = token_set(
                  title
              )

              failure_hits = sum(
                  1
                  for token in title_tokens
                  if token in failure_text
              )

              outcome_hits = sum(
                  1
                  for token in title_tokens
                  if token in outcome_text
              )

              historical_penalty = min(
                  20,
                  failure_hits * 5
              )

              historical_bonus = min(
                  15,
                  outcome_hits * 5
              )


              # ========================================================
              # CONCORDANCE SCORE
              # ========================================================

              concordance_score = (
                  ledger_matches * 20
              )

              if ledger01_match:
                  concordance_score += 5

              if ledger02_match:
                  concordance_score += 5

              if ledger03_match:
                  concordance_score += 5

              concordance_score = min(
                  100,
                  concordance_score
              )


              # ========================================================
              # FINAL SCORE
              # ========================================================

              final_score = int(
                  feasibility * 0.30
                  + clarity_score * 0.15
                  + research_score * 0.10
                  + reward_score * 0.10
                  + concordance_score * 0.30
                  + historical_bonus
                  - historical_penalty
              )

              final_score = max(
                  0,
                  min(
                      100,
                      final_score
                  )
              )


              decision = (
                  final_score
                  >= BID_SCORE_THRESHOLD
                  and feasibility
                  >= MIN_FEASIBILITY_SCORE
                  and ledger_matches
                  >= MIN_LEDGER_MATCHES
              )


              evaluation = {
                  "task_id":
                      tid,

                  "title":
                      compact(
                          title,
                          220
                      ),

                  "capabilities":
                      capabilities,

                  "matched_ledgers":
                      matched_ledgers,

                  "ledger_match_count":
                      ledger_matches,

                  "ledger01_overlap":
                      ledger01_overlap,

                  "ledger02_overlap":
                      ledger02_overlap,

                  "ledger03_overlap":
                      ledger03_overlap,

                  "feasibility_score":
                      feasibility,

                  "clarity_score":
                      clarity_score,

                  "research_score":
                      research_score,

                  "reward_score":
                      reward_score,

                  "concordance_score":
                      concordance_score,

                  "historical_bonus":
                      historical_bonus,

                  "historical_penalty":
                      historical_penalty,

                  "final_score":
                      final_score,

                  "urls":
                      urls[:MAX_WEB_SOURCES],

                  "decision":
                      (
                          "BID"
                          if decision
                          else "NO_BID"
                      ),

                  "evaluated_at":
                      now_iso()
              }

              evaluations.append(
                  evaluation
              )

              if decision:
                  candidates.append(
                      evaluation
                  )


          # ============================================================
          # SORT CANDIDATES
          # ============================================================

          candidates.sort(
              key=lambda item: (
                  item[
                      "final_score"
                  ],
                  item[
                      "ledger_match_count"
                  ],
                  item[
                      "feasibility_score"
                  ],
                  item[
                      "concordance_score"
                  ]
              ),
              reverse=True
          )


          print()
          print(
              "=== EVALUATION RESULT ==="
          )

          print(
              f"TASKS EVALUATED: "
              f"{len(evaluations)}"
          )

          print(
              "INTELLIGENT BID CANDIDATES: "
              f"{len(candidates)}"
          )

          for reason, count in sorted(
              skip_counts.items(),
              key=lambda item: -item[1]
          ):
              print(
                  f"{reason}: {count}"
              )


          # ============================================================
          # SHOW TOP CANDIDATES
          # ============================================================

          print()
          print(
              "=== TOP CANDIDATES ==="
          )

          for candidate in candidates[:5]:

              print(
                  "Candidate "
                  + candidate["task_id"]
                  + " | score="
                  + str(
                      candidate[
                          "final_score"
                      ]
                  )
                  + " | ledgers="
                  + ",".join(
                      candidate[
                          "matched_ledgers"
                      ]
                  )
                  + " | "
                  + compact(
                      candidate[
                          "title"
                      ],
                      120
                  )
              )


          # ============================================================
          # BID EXECUTION
          # ============================================================

          print()
          print(
              "=== BID EXECUTION ==="
          )

          bids_created = 0
          bid_errors = 0
          rate_limited = False

          selected_candidate = None

          if local_bid_blocked:

              print(
                  "BIDDING BLOCKED BY LOCAL "
                  "SAFETY LIMIT."
              )

          elif not candidates:

              print(
                  "NO COGNITIVELY CONCORDANT "
                  "BID CANDIDATE."
              )

          else:

              selected_candidate = (
                  candidates[0]
              )

              print(
                  "Selected candidate:"
              )

              print(
                  "Task: "
                  + selected_candidate[
                      "task_id"
                  ]
              )

              print(
                  "Score: "
                  + str(
                      selected_candidate[
                          "final_score"
                      ]
                  )
              )

              print(
                  "Ledger concordance: "
                  + ", ".join(
                      selected_candidate[
                          "matched_ledgers"
                      ]
                  )
              )

              tid = selected_candidate[
                  "task_id"
              ]

              title = selected_candidate[
                  "title"
              ]

              bid_amount = max(
                  MIN_BID_SATS,
                  21
              )

              bid_message = (
                  "NØX can execute this "
                  "mission using its current "
                  "research, analysis and "
                  "structured delivery "
                  "capabilities. "
                  "The action is aligned with "
                  "NØX's current knowledge, "
                  "cognitive priorities and "
                  "observed marketplace "
                  "experience. "
                  "No external AI or paid "
                  "infrastructure is required."
              )

              payload = {
                  "amount_sats":
                      bid_amount,
                  "message":
                      bid_message
              }

              print(
                  "Submitting one bid maximum "
                  "for this run."
              )

              response = api_post(
                  f"/marketplace/{tid}/bid",
                  payload,
                  idempotency_key(
                      "bid",
                      tid
                  )
              )

              bid_attempts.append({
                  "task_id":
                      tid,
                  "timestamp":
                      now_ts(),
                  "timestamp_iso":
                      now_iso()
              })

              if response.status_code == 429:

                  rate_limited = True
                  bid_errors += 1

                  print(
                      "RATE_LIMIT_BID received."
                  )

                  print(
                      "ALL BID ATTEMPTS STOPPED "
                      "FOR THIS RUN."
                  )

              elif response.status_code >= 400:

                  bid_errors += 1

                  print(
                      "BID ERROR "
                      + str(
                          response.status_code
                      )
                      + ": "
                      + compact(
                          response.text
                      )
                  )

              else:

                  try:
                      bid_result = (
                          response.json()
                      )
                  except Exception:
                      bid_result = {}

                  bid_id = first_text(
                      bid_result,
                      [
                          "id",
                          "bid_id"
                      ]
                  )

                  tracked_bids.append({
                      "task_id":
                          tid,
                      "bid_id":
                          bid_id,
                      "title":
                          title,
                      "amount_sats":
                          bid_amount,
                      "status":
                          "pending",
                      "accepted":
                          False,
                      "rejected":
                          False,
                      "final_score":
                          selected_candidate[
                              "final_score"
                          ],
                      "feasibility_score":
                          selected_candidate[
                              "feasibility_score"
                          ],
                      "concordance_score":
                          selected_candidate[
                              "concordance_score"
                          ],
                      "matched_ledgers":
                          selected_candidate[
                              "matched_ledgers"
                          ],
                      "created_at":
                          now_iso()
                  })

                  bids_created += 1

                  print(
                      "BID CREATED: "
                      + tid
                  )

                  print(
                      "Bid ID: "
                      + (
                          bid_id
                          or "UNKNOWN"
                      )
                  )


          # ============================================================
          # ACCEPTED MISSIONS
          # ============================================================

          print()
          print(
              "=== ACCEPTED MISSIONS ==="
          )

          accepted = []

          for record in tracked_bids:

              if not record.get(
                  "accepted",
                  False
              ):
                  continue

              tid = stringify(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              task = next(
                  (
                      item
                      for item in tasks
                      if task_id(item)
                      == tid
                  ),
                  None
              )

              if task:
                  accepted.append({
                      "task":
                          task,
                      "bid":
                          record
                  })


          print(
              "ACCEPTED MISSIONS: "
              f"{len(accepted)}"
          )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def research_urls(
              urls
          ):
              if not WEB_RESEARCH_ENABLED:
                  return []

              results = []

              for url in urls[
                  :MAX_WEB_SOURCES
              ]:

                  try:

                      response = requests.get(
                          url,
                          headers={
                              "User-Agent":
                                  "Nox-Ledger-04/4.0"
                          },
                          timeout=HTTP_TIMEOUT
                      )

                      if response.status_code >= 400:

                          results.append({
                              "url":
                                  url,
                              "status":
                                  response.status_code
                          })

                          continue

                      raw = response.content[
                          :MAX_SOURCE_BYTES
                      ]

                      page = raw.decode(
                          response.encoding
                          or "utf-8",
                          errors="replace"
                      )

                      page = re.sub(
                          r"<script[\s\S]*?</script>",
                          " ",
                          page,
                          flags=re.I
                      )

                      page = re.sub(
                          r"<style[\s\S]*?</style>",
                          " ",
                          page,
                          flags=re.I
                      )

                      page = re.sub(
                          r"<[^>]+>",
                          " ",
                          page
                      )

                      page = re.sub(
                          r"\s+",
                          " ",
                          page
                      ).strip()

                      results.append({
                          "url":
                              url,
                          "status":
                              response.status_code,
                          "excerpt":
                              page[:1400]
                      })

                  except Exception as exc:

                      results.append({
                          "url":
                              url,
                          "error":
                              compact(exc, 400)
                      })

              return results


          # ============================================================
          # EXECUTION
          # ============================================================

          print()
          print(
              "=== EXECUTION ==="
          )

          executions = []
          deliveries = []
          execution_failures = []

          if not EXECUTION_ENABLED:

              print(
                  "Execution disabled."
              )

          else:

              for mission in accepted[
                  :MAX_EXECUTIONS_PER_RUN
              ]:

                  task = mission[
                      "task"
                  ]

                  tid = task_id(
                      task
                  )

                  title = task_title(
                      task
                  )

                  body = task_body(
                      task
                  )

                  print(
                      "EXECUTING: "
                      + tid
                  )

                  try:

                      content = (
                          title
                          + "\n"
                          + body
                      )

                      urls = urls_from(
                          content
                      )

                      sources = research_urls(
                          urls
                      )

                      capabilities = (
                          matched_capabilities(
                              content
                          )
                      )

                      source_lines = []

                      for source in sources:

                          source_url = source.get(
                              "url",
                              ""
                          )

                          status = source.get(
                              "status",
                              ""
                          )

                          excerpt = source.get(
                              "excerpt",
                              ""
                          )

                          source_lines.append(
                              "- "
                              + source_url
                              + " [HTTP "
                              + str(status)
                              + "] "
                              + compact(
                                  excerpt,
                                  850
                              )
                          )

                      if not source_lines:

                          source_lines.append(
                              "- No explicit "
                              "public URL supplied."
                          )

                      delivery = (
                          "NØX DELIVERY — "
                          + title
                          + "\n\n"
                          + "Task scope:\n"
                          + compact(
                              body,
                              1800
                          )
                          + "\n\n"
                          + "Capabilities applied:\n"
                          + ", ".join(
                              capabilities
                          )
                          + "\n\n"
                          + "Method:\n"
                          + "Structured deterministic "
                          "analysis using NØX's "
                          "available knowledge, "
                          "cognitive context, "
                          "marketplace observations "
                          "and public evidence.\n\n"
                          + "Sources / evidence:\n"
                          + "\n".join(
                              source_lines
                          )
                          + "\n\n"
                          + "Execution constraints:\n"
                          + "No Gemini.\n"
                          + "No external AI.\n"
                          + "No spending.\n"
                          + "No payment action.\n"
                          + "Project cost: €0."
                      )

                      delivery = delivery[
                          :MAX_DELIVERY_CHARS
                      ]

                      preview = api_post(
                          f"/posts/{tid}/comments/preview",
                          {
                              "body":
                                  delivery
                          }
                      )

                      if preview.status_code >= 400:

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "PREVIEW",
                              "error":
                                  compact(
                                      preview.text
                                  ),
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              "PREVIEW FAILED: "
                              + tid
                          )

                          continue

                      try:
                          preview_data = (
                              preview.json()
                          )
                      except Exception:
                          preview_data = {}

                      preview_ok = (
                          preview_data.get(
                              "would_be_accepted",
                              True
                          )
                      )

                      if not preview_ok:

                          reason = first_text(
                              preview_data,
                              [
                                  "reason",
                                  "error",
                                  "blocker"
                              ]
                          )

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "PREVIEW_BLOCKED",
                              "error":
                                  reason,
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              "DELIVERY BLOCKED: "
                              + tid
                          )

                          continue

                      delivery_response = api_post(
                          f"/posts/{tid}/comments",
                          {
                              "body":
                                  delivery
                          },
                          idempotency_key(
                              "delivery",
                              tid
                          )
                      )

                      if (
                          delivery_response.status_code
                          >= 400
                      ):

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "DELIVERY",
                              "error":
                                  compact(
                                      delivery_response.text
                                  ),
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              "DELIVERY FAILED: "
                              + tid
                          )

                          continue

                      try:
                          delivery_data = (
                              delivery_response.json()
                          )
                      except Exception:
                          delivery_data = {}

                      comment_id = first_text(
                          delivery_data,
                          [
                              "id",
                              "comment_id"
                          ]
                      )

                      deliveries.append({
                          "task_id":
                              tid,
                          "title":
                              title,
                          "comment_id":
                              comment_id,
                          "delivered_at":
                              now_iso(),
                          "delivery_chars":
                              len(delivery)
                      })

                      executions.append({
                          "task_id":
                              tid,
                          "title":
                              title,
                          "capabilities":
                              capabilities,
                          "sources":
                              sources,
                          "executed_at":
                              now_iso()
                      })

                      print(
                          "DELIVERY CREATED: "
                          + tid
                      )

                  except Exception as exc:

                      execution_failures.append({
                          "task_id":
                              tid,
                          "stage":
                              "EXECUTION",
                          "error":
                              compact(exc),
                          "timestamp":
                              now_iso()
                      })

                      print(
                          "EXECUTION ERROR: "
                          + tid
                          + ": "
                          + compact(exc)
                      )


          # ============================================================
          # PAYMENT OBSERVATION ONLY
          # ============================================================

          print()
          print(
              "=== PAYMENT OBSERVATION ==="
          )

          payments = []
          payment_tasks = set()

          for record in tracked_bids:

              tid = stringify(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              if not tid:
                  continue

              if tid in payment_tasks:
                  continue

              payment_tasks.add(
                  tid
              )

              try:

                  payment = api_get(
                      f"/marketplace/{tid}/payment"
                  )

                  payments.append({
                      "task_id":
                          tid,
                      "observed_at":
                          now_iso(),
                      "payment":
                          payment
                  })

              except Exception:
                  pass

          print(
              "Payments observed: "
              f"{len(payments)}"
          )

          print(
              "Payment creation: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )


          # ============================================================
          # LEARNING
          # ============================================================

          outcomes = marketplace.get(
              "outcomes",
              []
          )

          failures = marketplace.get(
              "failures",
              []
          )

          cognitive_feedback = marketplace.get(
              "cognitive_feedback",
              []
          )

          selection_history = marketplace.get(
              "selection_history",
              []
          )

          if not isinstance(
              outcomes,
              list
          ):
              outcomes = []

          if not isinstance(
              failures,
              list
          ):
              failures = []

          if not isinstance(
              cognitive_feedback,
              list
          ):
              cognitive_feedback = []

          if not isinstance(
              selection_history,
              list
          ):
              selection_history = []


          for candidate in candidates:

              selection_history.append({
                  "task_id":
                      candidate[
                          "task_id"
                      ],
                  "title":
                      candidate[
                          "title"
                      ],
                  "final_score":
                      candidate[
                          "final_score"
                      ],
                  "matched_ledgers":
                      candidate[
                          "matched_ledgers"
                      ],
                  "ledger_match_count":
                      candidate[
                          "ledger_match_count"
                      ],
                  "decision":
                      "candidate",
                  "timestamp":
                      now_iso()
              })


          for delivery in deliveries:

              outcomes.append({
                  "type":
                      "successful_delivery",
                  "task_id":
                      delivery[
                          "task_id"
                      ],
                  "title":
                      delivery[
                          "title"
                      ],
                  "result":
                      "delivered",
                  "timestamp":
                      delivery[
                          "delivered_at"
                      ]
              })


          for failure in execution_failures:
              failures.append(
                  failure
              )


          if rate_limited:

              failures.append({
                  "type":
                      "platform_rate_limit",
                  "stage":
                      "bidding",
                  "reason":
                      "RATE_LIMIT_BID",
                  "timestamp":
                      now_iso(),
                  "learning":
                      (
                          "Stop all bidding "
                          "immediately after "
                          "a marketplace "
                          "rate-limit response."
                      )
              })


          cognitive_feedback.append({
              "timestamp":
                  now_iso(),

              "source":
                  "LEDGER_04_V4",

              "loop":
                  "Research -> Understand -> "
                  "Reflect -> Choose -> Act -> "
                  "Observe -> Learn -> Adapt",

              "tasks_found":
                  len(tasks),

              "tasks_evaluated":
                  len(evaluations),

              "candidates":
                  len(candidates),

              "bids_created":
                  bids_created,

              "accepted_missions":
                  len(accepted),

              "executions":
                  len(executions),

              "deliveries":
                  len(deliveries),

              "execution_failures":
                  len(execution_failures),

              "rate_limited":
                  rate_limited,

              "recent_bid_attempts":
                  len(bid_attempts),

              "learning":
                  (
                      "Bid only when at least "
                      "two of the three Ledgers "
                      "converge on capability, "
                      "cognitive relevance or "
                      "observed marketplace "
                      "experience."
                  )
          })


          # ============================================================
          # SAVE MEMORY
          # ============================================================

          marketplace_state = {

              "schema_version":
                  "4.0",

              "identity":
                  NOX_IDENTITY,

              "updated_at":
                  now_iso(),

              "constraints": {

                  "gemini_enabled":
                      False,

                  "external_ai_enabled":
                      False,

                  "payments_enabled":
                      False,

                  "spending_enabled":
                      False,

                  "project_cost_eur":
                      0
              },

              "strategy": {

                  "quality_over_volume":
                      True,

                  "cross_ledger_concordance":
                      True,

                  "minimum_ledger_matches":
                      MIN_LEDGER_MATCHES,

                  "requires_capability":
                      True,

                  "requires_feasibility":
                      True,

                  "requires_clear_deliverable":
                      REQUIRE_CLEAR_DELIVERABLE,

                  "requires_zero_cost":
                      REQUIRE_ZERO_COST,

                  "rejects_external_ai":
                      REQUIRE_NO_EXTERNAL_AI,

                  "one_bid_per_run":
                      True,

                  "local_rate_limit":
                      True,

                  "uses_historical_learning":
                      True
              },

              "bid_attempts":
                  trim_list(
                      bid_attempts,
                      MAX_MEMORY_ITEMS
                  ),

              "tracked_bids":
                  trim_list(
                      tracked_bids,
                      MAX_MEMORY_ITEMS
                  ),

              "outcomes":
                  trim_list(
                      outcomes,
                      MAX_TASK_MEMORY
                  ),

              "failures":
                  trim_list(
                      failures,
                      MAX_FAILURE_MEMORY
                  ),

              "selection_history":
                  trim_list(
                      selection_history,
                      MAX_TASK_MEMORY
                  ),

              "cognitive_feedback":
                  trim_list(
                      cognitive_feedback,
                      MAX_MEMORY_ITEMS
                  ),

              "last_run": {

                  "tasks_found":
                      len(tasks),

                  "tasks_evaluated":
                      len(evaluations),

                  "candidates":
                      len(candidates),

                  "bids_created":
                      bids_created,

                  "bid_errors":
                      bid_errors,

                  "rate_limited":
                      rate_limited,

                  "recent_bid_attempts":
                      len(bid_attempts),

                  "accepted_missions":
                      len(accepted),

                  "executions":
                      len(executions),

                  "deliveries":
                      len(deliveries),

                  "execution_failures":
                      len(execution_failures),

                  "payments_observed":
                      len(payments),

                  "timestamp":
                      now_iso()
              }
          }


          save_json(
              MEMORY_MARKETPLACE,
              marketplace_state
          )


          # ============================================================
          # FINAL SUMMARY
          # ============================================================

          print()
          print(
              "=============================================="
          )

          print(
              "=== LEDGER 04 V4 COMPLETE =================="
          )

          print(
              "=============================================="
          )

          print(
              f"Identity: {NOX_IDENTITY}"
          )

          print(
              f"Tasks found: {len(tasks)}"
          )

          print(
              f"Tasks evaluated: {len(evaluations)}"
          )

          print(
              "Intelligent candidates: "
              f"{len(candidates)}"
          )

          print(
              "Bids created: "
              f"{bids_created}"
          )

          print(
              "Bid errors: "
              f"{bid_errors}"
          )

          print(
              "Rate limited: "
              + (
                  "YES"
                  if rate_limited
                  else "NO"
              )
          )

          print(
              "Recent local bid attempts: "
              f"{len(bid_attempts)}"
          )

          print(
              "Tracked bids: "
              f"{len(tracked_bids)}"
          )

          print(
              "Accepted missions: "
              f"{len(accepted)}"
          )

          print(
              "Executions: "
              f"{len(executions)}"
          )

          print(
              "Deliveries: "
              f"{len(deliveries)}"
          )

          print(
              "Execution failures: "
              f"{len(execution_failures)}"
          )

          print(
              "Payments observed: "
              f"{len(payments)}"
          )

          print(
              "Web research: "
              + str(
                  WEB_RESEARCH_ENABLED
              )
          )

          print(
              "Gemini: False"
          )

          print(
              "External AI: False"
          )

          print(
              "Payments: False"
          )

          print(
              "Spending: False"
          )

          print(
              "Project cost: €0"
          )

          print(
              "=============================================="
          )

          PY

      # ============================================================
      # SAVE MEMORY
      # ============================================================

      - name: Commit Ledger 04 memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_ledger_marketplace.json

          if git diff --cached --quiet; then
            echo "No Ledger 04 changes to commit."
            exit 0
          fi

          git commit -m "NØX Ledger 04 marketplace cognitive state"
          git push
