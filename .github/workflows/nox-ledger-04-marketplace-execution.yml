name: NØX LEDGER 04 - Marketplace Execution V4.1

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      MAX_BIDS_PER_RUN: "1"
      LOCAL_BID_WINDOW_SECONDS: "3600"
      LOCAL_BID_SAFETY_LIMIT: "8"

      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "78"
      MIN_FEASIBILITY_SCORE: "75"
      MIN_LEDGER_MATCHES: "2"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Marketplace execution
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          import requests


          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])

          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])
          LOCAL_BID_WINDOW_SECONDS = int(os.environ["LOCAL_BID_WINDOW_SECONDS"])
          LOCAL_BID_SAFETY_LIMIT = int(os.environ["LOCAL_BID_SAFETY_LIMIT"])

          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(os.environ["BID_SCORE_THRESHOLD"])
          MIN_FEASIBILITY_SCORE = int(os.environ["MIN_FEASIBILITY_SCORE"])
          MIN_LEDGER_MATCHES = int(os.environ["MIN_LEDGER_MATCHES"])

          EXECUTION_ENABLED = os.environ["EXECUTION_ENABLED"].lower() == "true"
          MAX_EXECUTIONS_PER_RUN = int(os.environ["MAX_EXECUTIONS_PER_RUN"])
          MAX_DELIVERY_CHARS = int(os.environ["MAX_DELIVERY_CHARS"])

          WEB_RESEARCH_ENABLED = os.environ["WEB_RESEARCH_ENABLED"].lower() == "true"
          MAX_WEB_SOURCES = int(os.environ["MAX_WEB_SOURCES"])
          HTTP_TIMEOUT_SECONDS = int(os.environ["HTTP_TIMEOUT_SECONDS"])
          MAX_SOURCE_BYTES = int(os.environ["MAX_SOURCE_BYTES"])

          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_TASK_MEMORY = int(os.environ["MAX_TASK_MEMORY"])
          MAX_FAILURE_MEMORY = int(os.environ["MAX_FAILURE_MEMORY"])

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ["REQUIRE_CLEAR_DELIVERABLE"].lower() == "true"
          )
          REQUIRE_ZERO_COST_EXECUTION = (
              os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower() == "true"
          )
          REQUIRE_NO_EXTERNAL_AI = (
              os.environ["REQUIRE_NO_EXTERNAL_AI"].lower() == "true"
          )

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          KNOWLEDGE_FILE = MEMORY_DIR / "nox_ledger_knowledge.json"
          COGNITION_FILE = MEMORY_DIR / "nox_ledger_cognition.json"
          ACTION_FILE = MEMORY_DIR / "nox_ledger_action.json"
          MARKETPLACE_FILE = MEMORY_DIR / "nox_ledger_marketplace.json"


          def now_ts():
              return int(time.time())


          def utc_iso(ts=None):
              if ts is None:
                  ts = now_ts()
              return datetime.fromtimestamp(
                  ts, tz=timezone.utc
              ).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default


          def save_json(path, data):
              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              tmp.replace(path)


          def textify(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  return str(value)


          def normalize_text(value):
              value = textify(value).lower()
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def tokens(value):
              value = normalize_text(value)
              return set(
                  token for token in re.findall(r"[a-z0-9_+#.-]{3,}", value)
                  if token not in {
                      "the",
                      "and",
                      "for",
                      "with",
                      "from",
                      "this",
                      "that",
                      "task",
                      "paid",
                      "offer",
                      "need",
                      "work",
                      "your",
                      "you",
                      "are",
                      "can",
                      "will",
                      "into",
                      "per",
                      "use",
                  }
              )


          def overlap(a, b):
              ta = tokens(a)
              tb = tokens(b)

              if not ta or not tb:
                  return 0

              return len(ta & tb)


          def api_headers(jwt=None):
              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              }

              if jwt:
                  headers["Authorization"] = f"Bearer {jwt}"

              return headers


          def api_get(path, jwt=None, params=None):
              return requests.get(
                  f"{API_BASE}{path}",
                  headers=api_headers(jwt),
                  params=params,
                  timeout=HTTP_TIMEOUT_SECONDS,
              )


          def api_post(path, jwt=None, payload=None, idempotency_key=None):
              headers = api_headers(jwt)

              if idempotency_key:
                  headers["Idempotency-Key"] = idempotency_key

              return requests.post(
                  f"{API_BASE}{path}",
                  headers=headers,
                  json=payload or {},
                  timeout=HTTP_TIMEOUT_SECONDS,
              )


          print("==============================================")
          print("=== NØX LEDGER 04 - MARKETPLACE EXECUTION ===")
          print("=== V4.1                                   ===")
          print("==============================================")

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          print("")
          print("=== AUTHENTICATION ===")

          auth_response = requests.post(
              f"{API_BASE}/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={"api_key": API_KEY},
              timeout=HTTP_TIMEOUT_SECONDS,
          )

          if auth_response.status_code != 200:
              print(
                  f"Authentication failed: HTTP {auth_response.status_code}"
              )
              print(auth_response.text[:1000])
              sys.exit(1)

          auth_data = auth_response.json()

          jwt = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not jwt:
              print("Authentication failed: JWT missing.")
              sys.exit(1)

          print("JWT obtained: YES")
          print("API key used only for token exchange: YES")
          print("JWT value: HIDDEN")

          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          print("")
          print("=== IDENTITY ===")

          me_response = api_get("/users/me", jwt)

          if me_response.status_code != 200:
              print(
                  f"Identity lookup failed: HTTP {me_response.status_code}"
              )
              print(me_response.text[:1000])
              sys.exit(1)

          me_data = me_response.json()

          resolved_identity = (
              me_data.get("username")
              or me_data.get("handle")
              or me_data.get("name")
              or me_data.get("identity")
              or IDENTITY
          )

          print(f"IDENTITY: {resolved_identity}")

          # ------------------------------------------------------------
          # INTER-LEDGER CONTEXT
          # ------------------------------------------------------------

          print("")
          print("=== INTER-LEDGER CONTEXT ===")

          ledger01 = load_json(
              KNOWLEDGE_FILE,
              {
                  "items": [],
                  "capabilities": [],
                  "outcomes": [],
                  "failures": [],
              },
          )

          ledger02 = load_json(
              COGNITION_FILE,
              {
                  "items": [],
                  "goals": [],
                  "priorities": [],
                  "actions": [],
              },
          )

          ledger03 = load_json(
              ACTION_FILE,
              {
                  "items": [],
                  "actions": [],
                  "outcomes": [],
                  "failures": [],
                  "capabilities": [],
              },
          )

          marketplace_memory = load_json(
              MARKETPLACE_FILE,
              {
                  "tracked_bids": [],
                  "bid_attempts": [],
                  "accepted_missions": [],
                  "executions": [],
                  "deliveries": [],
                  "payments": [],
                  "outcomes": [],
                  "failures": [],
                  "tip_candidates": [],
                  "research": [],
                  "bid_cooldown_until": 0,
                  "bid_cooldown_reason": "",
                  "bid_cooldown_source": "",
                  "bid_cooldown_set_at": 0,
              },
          )

          print("Ledger 01: LOADED")
          print("Ledger 02: LOADED")
          print("Ledger 03: LOADED")

          # ------------------------------------------------------------
          # PERSISTENT RATE-LIMIT COOLDOWN
          # ------------------------------------------------------------

          current_time = now_ts()

          cooldown_until = int(
              marketplace_memory.get("bid_cooldown_until") or 0
          )

          cooldown_active = cooldown_until > current_time

          if cooldown_active:
              remaining = cooldown_until - current_time

              print("")
              print("=== PLATFORM BID COOLDOWN ===")
              print("Status: ACTIVE")
              print(
                  f"Reason: "
                  f"{marketplace_memory.get('bid_cooldown_reason') or 'RATE_LIMIT_BID'}"
              )
              print(
                  f"Source: "
                  f"{marketplace_memory.get('bid_cooldown_source') or 'colony_api'}"
              )
              print(f"Remaining seconds: {remaining}")
              print(f"Cooldown until: {utc_iso(cooldown_until)}")
              print("Bid submission: SKIPPED")

          elif cooldown_until > 0:
              print("")
              print("=== PLATFORM BID COOLDOWN ===")
              print("Status: EXPIRED")
              print(f"Expired at: {utc_iso(cooldown_until)}")
              print("Bid submission: AVAILABLE")

              marketplace_memory["bid_cooldown_until"] = 0
              marketplace_memory["bid_cooldown_reason"] = ""
              marketplace_memory["bid_cooldown_source"] = ""
              marketplace_memory["bid_cooldown_set_at"] = 0

          else:
              print("")
              print("=== PLATFORM BID COOLDOWN ===")
              print("Status: INACTIVE")

          # ------------------------------------------------------------
          # MARKETPLACE DISCOVERY
          # ------------------------------------------------------------

          print("")
          print("=== MARKETPLACE DISCOVERY ===")

          tasks_response = api_get(
              "/marketplace/tasks",
              jwt,
              params={"limit": MAX_TASKS},
          )

          if tasks_response.status_code != 200:
              print(
                  f"Marketplace discovery failed: "
                  f"HTTP {tasks_response.status_code}"
              )
              print(tasks_response.text[:1500])
              sys.exit(1)

          tasks_data = tasks_response.json()

          if isinstance(tasks_data, list):
              tasks = tasks_data
          elif isinstance(tasks_data, dict):
              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or tasks_data.get("results")
                  or []
              )
          else:
              tasks = []

          tasks = tasks[:MAX_TASKS]

          print(f"TASKS FOUND: {len(tasks)}")

          # ------------------------------------------------------------
          # LOCAL BID CONTROL
          # ------------------------------------------------------------

          print("")
          print("=== LOCAL BID CONTROL ===")

          attempts = marketplace_memory.get("bid_attempts", [])

          if not isinstance(attempts, list):
              attempts = []

          cutoff = now_ts() - LOCAL_BID_WINDOW_SECONDS

          recent_attempts = [
              item
              for item in attempts
              if int(item.get("timestamp", 0)) >= cutoff
          ]

          marketplace_memory["bid_attempts"] = recent_attempts

          print(f"Recent bid attempts: {len(recent_attempts)}")
          print(f"Safety limit: {LOCAL_BID_SAFETY_LIMIT}")
          print(f"Max bids this run: {MAX_BIDS_PER_RUN}")

          if cooldown_active:
              print("LOCAL BID COOLDOWN: ACTIVE")
          else:
              print("LOCAL BID COOLDOWN: INACTIVE")

          # ------------------------------------------------------------
          # BID RECONCILIATION
          # ------------------------------------------------------------

          print("")
          print("=== BID RECONCILIATION ===")

          tracked_bids = marketplace_memory.get("tracked_bids", [])

          if not isinstance(tracked_bids, list):
              tracked_bids = []

          reconciled = 0

          for tracked in tracked_bids[:MAX_RECONCILE]:
              task_id = tracked.get("task_id")

              if not task_id:
                  continue

              try:
                  bid_response = api_get(
                      f"/marketplace/{task_id}/bids",
                      jwt,
                  )

                  if bid_response.status_code != 200:
                      continue

                  bid_data = bid_response.json()

                  if isinstance(bid_data, list):
                      bids = bid_data
                  elif isinstance(bid_data, dict):
                      bids = (
                          bid_data.get("bids")
                          or bid_data.get("items")
                          or []
                      )
                  else:
                      bids = []

                  for bid in bids:
                      bid_id = str(
                          bid.get("id")
                          or bid.get("bid_id")
                          or ""
                      )

                      if (
                          tracked.get("bid_id")
                          and bid_id == str(tracked["bid_id"])
                      ):
                          tracked["latest_status"] = (
                              bid.get("status")
                              or bid.get("state")
                              or tracked.get("latest_status")
                          )

                          tracked["latest_bid"] = bid
                          tracked["last_checked"] = utc_iso()
                          reconciled += 1

              except Exception:
                  continue

          print(f"Tracked bids: {len(tracked_bids)}")

          # ------------------------------------------------------------
          # TASK TEXT / CAPABILITIES
          # ------------------------------------------------------------

          capability_groups = {
              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "research reports",
                  "competitive analysis",
                  "market research",
                  "investigation",
                  "analysis",
              ],
              "writing": [
                  "write",
                  "writing",
                  "copywriting",
                  "report writing",
                  "technical report",
                  "content",
                  "documentation",
              ],
              "seo": [
                  "seo",
                  "seo audit",
                  "search optimization",
                  "keyword",
                  "technical seo",
              ],
              "qa": [
                  "qa",
                  "quality assurance",
                  "testing",
                  "test",
                  "api smoke test",
                  "validation",
              ],
              "data": [
                  "data analysis",
                  "data cleanup",
                  "data processing",
                  "dataset",
                  "python",
                  "automation script",
              ],
              "agent_tools": [
                  "build agent tools",
                  "agent tools",
                  "agent tooling",
                  "agent tool",
                  "tool development",
                  "agent development",
              ],
              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead qualification",
              ],
              "cro": [
                  "cro",
                  "conversion rate optimization",
                  "conversion optimization",
              ],
          }

          capability_names = list(capability_groups.keys())

          def task_capabilities(content):
              text = normalize_text(content)
              found = []

              for capability, phrases in capability_groups.items():
                  if any(phrase in text for phrase in phrases):
                      found.append(capability)

              return found

          # ------------------------------------------------------------
          # THREE-LEDGER COGNITIVE EVALUATION
          # ------------------------------------------------------------

          print("")
          print("=== THREE-LEDGER COGNITIVE EVALUATION ===")

          ledger01_text = normalize_text(ledger01)
          ledger02_text = normalize_text(ledger02)
          ledger03_text = normalize_text(ledger03)

          outcomes_text = normalize_text(
              ledger01.get("outcomes", [])
              + ledger03.get("outcomes", [])
              + marketplace_memory.get("outcomes", [])
          )

          failures_text = normalize_text(
              ledger01.get("failures", [])
              + ledger03.get("failures", [])
              + marketplace_memory.get("failures", [])
          )

          cognitive_terms = {
              "research",
              "learn",
              "learning",
              "knowledge",
              "evidence",
              "analysis",
              "understand",
              "reflection",
              "reasoning",
              "experiment",
              "improvement",
              "self improvement",
              "automation",
              "agent",
              "tools",
          }

          positive_action_terms = {
              "success",
              "completed",
              "delivered",
              "validated",
              "accepted",
              "useful",
              "working",
          }

          hard_rejections = {
              "SERVICE_OFFER_NOT_REQUEST": 0,
              "REWARD_UNIT_CONFLICT": 0,
              "NO_CAPABILITY": 0,
              "CREDENTIAL_REQUIRED": 0,
              "UNCLEAR_DELIVERABLE": 0,
              "LOW_FEASIBILITY": 0,
              "CLOSED_TASK": 0,
              "FINANCIAL_ACTION": 0,
          }

          candidates = []
          evaluated = 0

          for task in tasks:

              title = textify(
                  task.get("title")
                  or task.get("name")
                  or ""
              )

              body = textify(
                  task.get("description")
                  or task.get("body")
                  or task.get("content")
                  or ""
              )

              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("post_id")
                  or ""
              )

              content = f"{title}\n{body}"
              text = normalize_text(content)

              # Service-for-hire listings are not buyer requests.
              service_offer_patterns = [
                  "for hire:",
                  "available for hire",
                  "my services",
                  "i offer",
                  "we offer",
                  "our services",
                  "hire me",
              ]

              buyer_request_patterns = [
                  "need ",
                  "looking for ",
                  "seeking ",
                  "request",
                  "please build",
                  "please create",
                  "please analyze",
                  "can someone",
                  "who can",
                  "help me",
                  "looking to hire",
                  "task:",
                  "mission:",
              ]

              service_offer = (
                  any(pattern in text for pattern in service_offer_patterns)
                  and not any(
                      pattern in text
                      for pattern in buyer_request_patterns
                  )
              )

              if service_offer:
                  hard_rejections["SERVICE_OFFER_NOT_REQUEST"] += 1
                  continue

              # Reward-unit consistency.
              sats_terms = bool(
                  re.search(
                      r"\b(?:sats?|sat|satoshis)\b",
                      text,
                  )
              )

              fiat_or_stable_terms = bool(
                  re.search(
                      r"\b(?:usd|usdc|eur|euro|dollar|dollars)\b",
                      text,
                  )
              )

              if sats_terms and fiat_or_stable_terms:
                  hard_rejections["REWARD_UNIT_CONFLICT"] += 1
                  continue

              # Hard financial action filter.
              financial_patterns = [
                  "send money",
                  "transfer funds",
                  "buy ",
                  "purchase ",
                  "pay ",
                  "payment required",
                  "financial transaction",
                  "invest ",
                  "investment",
                  "wallet transfer",
                  "withdraw funds",
              ]

              if any(pattern in text for pattern in financial_patterns):
                  hard_rejections["FINANCIAL_ACTION"] += 1
                  continue

              # Credentials / secrets.
              credential_patterns = [
                  "password",
                  "private key",
                  "seed phrase",
                  "secret key",
                  "api key",
                  "access token",
                  "login credentials",
                  "credentials required",
              ]

              if any(pattern in text for pattern in credential_patterns):
                  hard_rejections["CREDENTIAL_REQUIRED"] += 1
                  continue

              # Closed task detection.
              closed_patterns = [
                  "completed",
                  "already awarded",
                  "closed",
                  "no longer available",
                  "task closed",
              ]

              if any(pattern in text for pattern in closed_patterns):
                  hard_rejections["CLOSED_TASK"] += 1
                  continue

              capabilities = task_capabilities(content)

              if not capabilities:
                  hard_rejections["NO_CAPABILITY"] += 1
                  continue

              # External AI / paid infrastructure requirements.
              external_ai_patterns = [
                  "gemini",
                  "openai api required",
                  "anthropic api required",
                  "external ai required",
                  "paid ai api",
                  "llm api required",
              ]

              paid_infra_patterns = [
                  "paid api",
                  "paid infrastructure",
                  "paid server",
                  "paid hosting",
                  "subscription required",
                  "premium account required",
              ]

              human_only_patterns = [
                  "human only",
                  "must be human",
                  "in-person",
                  "physical presence required",
              ]

              external_delivery_patterns = [
                  "ship physical",
                  "deliver physically",
                  "phone call required",
                  "in person required",
              ]

              if REQUIRE_NO_EXTERNAL_AI and any(
                  pattern in text
                  for pattern in external_ai_patterns
              ):
                  continue

              if REQUIRE_ZERO_COST_EXECUTION and any(
                  pattern in text
                  for pattern in paid_infra_patterns
              ):
                  continue

              if any(
                  pattern in text
                  for pattern in human_only_patterns
              ):
                  continue

              if any(
                  pattern in text
                  for pattern in external_delivery_patterns
              ):
                  continue

              # Deliverable clarity.
              deliverable_patterns = [
                  "report",
                  "audit",
                  "analysis",
                  "script",
                  "tool",
                  "documentation",
                  "dataset",
                  "results",
                  "findings",
                  "qa report",
                  "research report",
                  "code",
                  "automation",
              ]

              clear_deliverable = any(
                  pattern in text
                  for pattern in deliverable_patterns
              )

              if REQUIRE_CLEAR_DELIVERABLE and not clear_deliverable:
                  hard_rejections["UNCLEAR_DELIVERABLE"] += 1
                  continue

              evaluated += 1

              # --------------------------------------------------------
              # LEDGER 01
              # --------------------------------------------------------

              ledger01_matches = 0

              if capabilities:
                  for capability in capabilities:
                      phrases = capability_groups[capability]

                      if any(
                          phrase in ledger01_text
                          for phrase in phrases
                      ):
                          ledger01_matches += 1
                          break

              ledger01_overlap = overlap(content, ledger01_text)

              ledger01_match = (
                  ledger01_matches > 0
                  or ledger01_overlap >= 8
              )

              # --------------------------------------------------------
              # LEDGER 02
              # --------------------------------------------------------

              task_cognitive_terms = [
                  term
                  for term in cognitive_terms
                  if term in text
              ]

              ledger02_match = False

              if task_cognitive_terms:
                  matched_terms = [
                      term
                      for term in task_cognitive_terms
                      if term in ledger02_text
                  ]

                  if matched_terms:
                      ledger02_match = True

              ledger02_overlap = overlap(content, ledger02_text)

              if ledger02_overlap >= 8:
                  ledger02_match = True

              # --------------------------------------------------------
              # LEDGER 03
              # --------------------------------------------------------

              ledger03_capability_match = False

              for capability in capabilities:
                  phrases = capability_groups[capability]

                  if any(
                      phrase in ledger03_text
                      for phrase in phrases
                  ):
                      ledger03_capability_match = True
                      break

              ledger03_overlap = overlap(content, ledger03_text)

              ledger03_historical_match = False

              if outcomes_text:
                  outcome_overlap = overlap(content, outcomes_text)

                  if (
                      outcome_overlap >= 5
                      and any(
                          term in text
                          for term in positive_action_terms
                      )
                  ):
                      ledger03_historical_match = True

              ledger03_match = (
                  ledger03_capability_match
                  or ledger03_overlap >= 8
                  or ledger03_historical_match
              )

              ledger_matches = []

              if ledger01_match:
                  ledger_matches.append("LEDGER01")

              if ledger02_match:
                  ledger_matches.append("LEDGER02")

              if ledger03_match:
                  ledger_matches.append("LEDGER03")

              if len(ledger_matches) < MIN_LEDGER_MATCHES:
                  continue

              # --------------------------------------------------------
              # FEASIBILITY
              # --------------------------------------------------------

              feasibility_score = 60

              feasibility_score += min(
                  len(capabilities) * 10,
                  30,
              )

              if "research" in capabilities:
                  feasibility_score += 5

              if "qa" in capabilities:
                  feasibility_score += 4

              if "seo" in capabilities:
                  feasibility_score += 4

              if "data" in capabilities:
                  feasibility_score += 4

              if re.search(
                  r"https?://",
                  content,
              ):
                  feasibility_score += 8

              feasibility_score = min(
                  feasibility_score,
                  100,
              )

              if feasibility_score < MIN_FEASIBILITY_SCORE:
                  hard_rejections["LOW_FEASIBILITY"] += 1
                  continue

              # --------------------------------------------------------
              # CLARITY
              # --------------------------------------------------------

              clarity_score = 100

              if len(body.strip()) < 80:
                  clarity_score -= 15

              if len(body.strip()) < 40:
                  clarity_score -= 20

              clarity_score = max(
                  clarity_score,
                  0,
              )

              # --------------------------------------------------------
              # RESEARCH
              # --------------------------------------------------------

              research_score = 70

              if re.search(
                  r"https?://",
                  content,
              ):
                  research_score = 95

              if any(
                  keyword in text
                  for keyword in [
                      "research",
                      "report",
                      "audit",
                      "analysis",
                  ]
              ):
                  research_score = max(
                      research_score,
                      85,
                  )

