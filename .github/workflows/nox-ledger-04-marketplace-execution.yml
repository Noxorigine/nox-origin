name: NØX LEDGER 04 - Marketplace Execution V3

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: "https://thecolony.ai/api/v1"
      NOX_IDENTITY: "nox_origine"

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      MAX_BIDS_PER_RUN: "2"
      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "70"
      MIN_FEASIBILITY_SCORE: "75"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Ledger 04
        run: |
          python <<'PY'
          import os
          import re
          import json
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          NOX_IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])

          MAX_BIDS_PER_RUN = int(
              os.environ["MAX_BIDS_PER_RUN"]
          )
          MIN_BID_SATS = int(
              os.environ["MIN_BID_SATS"]
          )
          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )
          MIN_FEASIBILITY_SCORE = int(
              os.environ["MIN_FEASIBILITY_SCORE"]
          )

          EXECUTION_ENABLED = (
              os.environ["EXECUTION_ENABLED"].lower()
              == "true"
          )

          MAX_EXECUTIONS_PER_RUN = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )

          MAX_DELIVERY_CHARS = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          WEB_RESEARCH_ENABLED = (
              os.environ["WEB_RESEARCH_ENABLED"].lower()
              == "true"
          )

          MAX_WEB_SOURCES = int(
              os.environ["MAX_WEB_SOURCES"]
          )

          HTTP_TIMEOUT = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )

          MAX_SOURCE_BYTES = int(
              os.environ["MAX_SOURCE_BYTES"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )

          MAX_TASK_MEMORY = int(
              os.environ["MAX_TASK_MEMORY"]
          )

          MAX_FAILURE_MEMORY = int(
              os.environ["MAX_FAILURE_MEMORY"]
          )

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ["REQUIRE_CLEAR_DELIVERABLE"].lower()
              == "true"
          )

          REQUIRE_ZERO_COST = (
              os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower()
              == "true"
          )

          REQUIRE_NO_EXTERNAL_AI = (
              os.environ["REQUIRE_NO_EXTERNAL_AI"].lower()
              == "true"
          )

          MEMORY_MARKETPLACE = (
              "memory/nox_ledger_marketplace.json"
          )
          MEMORY_KNOWLEDGE = (
              "memory/nox_ledger_knowledge.json"
          )
          MEMORY_COGNITION = (
              "memory/nox_ledger_cognition.json"
          )
          MEMORY_ACTION = (
              "memory/nox_ledger_action.json"
          )


          # ============================================================
          # HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )
              except Exception:
                  return str(value)


          def compact(value, limit=700):
              value = re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()

              return value[:limit]


          def load_json(path, default):
              try:
                  if not os.path.exists(path):
                      return default

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"MEMORY WARNING {path}: "
                      f"{compact(exc)}"
                  )
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temporary = path + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )


          def trim(items, limit):
              if not isinstance(items, list):
                  return []

              return items[-limit:]


          def recursive_text(value, depth=0):
              if depth > 6:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      recursive_text(
                          item,
                          depth + 1
                      )
                      for item in value[:200]
                  )

              if isinstance(value, dict):
                  parts = []

                  for key, item in list(
                      value.items()
                  )[:300]:
                      parts.append(str(key))
                      parts.append(
                          recursive_text(
                              item,
                              depth + 1
                          )
                      )

                  return " ".join(parts)

              return ""


          def first_value(data, keys):
              wanted = {
                  key.lower()
                  for key in keys
              }

              def walk(value, depth=0):
                  if depth > 7:
                      return None

                  if isinstance(value, dict):

                      for key, item in value.items():
                          if str(key).lower() in wanted:
                              if (
                                  item is not None
                                  and str(item).strip()
                              ):
                                  return item

                      for item in value.values():
                          result = walk(
                              item,
                              depth + 1
                          )

                          if result is not None:
                              return result

                  elif isinstance(value, list):

                      for item in value[:300]:
                          result = walk(
                              item,
                              depth + 1
                          )

                          if result is not None:
                              return result

                  return None

              return walk(data)


          def first_text(data, keys):
              value = first_value(
                  data,
                  keys
              )

              if value is None:
                  return ""

              return text(value).strip()


          def first_number(data, keys):
              value = first_value(
                  data,
                  keys
              )

              if value is None:
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  return float(value)

              match = re.search(
                  r"\d+(?:\.\d+)?",
                  text(value)
              )

              if not match:
                  return None

              try:
                  return float(
                      match.group(0)
                  )
              except Exception:
                  return None


          def task_id(task):
              return first_text(
                  task,
                  [
                      "id",
                      "post_id",
                      "task_id"
                  ]
              )


          def task_title(task):
              return first_text(
                  task,
                  [
                      "title",
                      "name"
                  ]
              )


          def task_body(task):
              return first_text(
                  task,
                  [
                      "description",
                      "body",
                      "content",
                      "details",
                      "task"
                  ]
              )


          def task_status(task):
              return first_text(
                  task,
                  ["status"]
              ).lower()


          def idempotency_key(
              action,
              identifier
          ):
              raw = (
                  f"{NOX_IDENTITY}:"
                  f"{action}:"
                  f"{identifier}:"
                  f"{datetime.now(timezone.utc).strftime('%Y-%m-%d-%H')}"
              )

              digest = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

              return (
                  f"nox-ledger04-{action}-{digest}"
              )


          # ============================================================
          # HTTP
          # ============================================================

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY is missing."
              )

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Ledger-04/3.0"
          })


          print(
              "=============================================="
          )
          print(
              "=== NØX LEDGER 04 - MARKETPLACE EXECUTION ==="
          )
          print(
              "=== V3                                  ==="
          )
          print(
              "=============================================="
          )


          # ============================================================
          # AUTH
          # ============================================================

          print()
          print("=== AUTHENTICATION ===")

          auth = requests.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              timeout=25,
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "Nox-Ledger-04/3.0"
              }
          )

          if auth.status_code >= 400:
              raise SystemExit(
                  "AUTH ERROR: "
                  f"{auth.status_code} "
                  f"{compact(auth.text, 500)}"
              )

          auth_data = auth.json()

          jwt = text(
              auth_data.get(
                  "access_token"
              )
          ).strip()

          if not jwt:
              raise SystemExit(
                  "AUTH ERROR: JWT missing."
              )

          session.headers[
              "Authorization"
          ] = f"Bearer {jwt}"

          print("JWT obtained: YES")
          print(
              "API key used only for token exchange: YES"
          )
          print("JWT value: HIDDEN")


          def api_get(path, params=None):
              response = session.get(
                  f"{API_BASE}{path}",
                  params=params,
                  timeout=25
              )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"GET {path} -> "
                      f"{response.status_code}: "
                      f"{compact(response.text)}"
                  )

              try:
                  return response.json()
              except Exception:
                  return {}


          def api_post(
              path,
              payload,
              idempotency=None
          ):
              headers = {}

              if idempotency:
                  headers[
                      "Idempotency-Key"
                  ] = idempotency

              return session.post(
                  f"{API_BASE}{path}",
                  json=payload,
                  headers=headers,
                  timeout=25
              )


          # ============================================================
          # IDENTITY
          # ============================================================

          try:
              me = api_get(
                  "/users/me"
              )

              identity = (
                  first_text(
                      me,
                      [
                          "username",
                          "handle",
                          "identity",
                          "name"
                      ]
                  )
                  or NOX_IDENTITY
              )

              print(
                  f"IDENTITY: {identity}"
              )

          except Exception as exc:
              raise SystemExit(
                  f"IDENTITY ERROR: {compact(exc)}"
              )


          # ============================================================
          # LOAD LEDGERS
          # ============================================================

          ledger01 = load_json(
              MEMORY_KNOWLEDGE,
              {}
          )

          ledger02 = load_json(
              MEMORY_COGNITION,
              {}
          )

          ledger03 = load_json(
              MEMORY_ACTION,
              {}
          )

          marketplace = load_json(
              MEMORY_MARKETPLACE,
              {}
          )

          print()
          print("=== INTER-LEDGER CONTEXT ===")
          print(
              "Ledger 01: "
              + ("LOADED" if ledger01 else "EMPTY")
          )
          print(
              "Ledger 02: "
              + ("LOADED" if ledger02 else "EMPTY")
          )
          print(
              "Ledger 03: "
              + ("LOADED" if ledger03 else "EMPTY")
          )


          ledger01_text = recursive_text(
              ledger01
          ).lower()

          ledger02_text = recursive_text(
              ledger02
          ).lower()

          ledger03_text = recursive_text(
              ledger03
          ).lower()


          # ============================================================
          # CAPABILITIES
          # ============================================================

          CAPABILITIES = {
              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "web research",
                  "market research",
                  "competitive research",
                  "fact checking",
                  "source analysis"
              ],
              "writing": [
                  "writing",
                  "write",
                  "report writing",
                  "write a report",
                  "technical report",
                  "documentation",
                  "content writing"
              ],
              "seo": [
                  "seo",
                  "seo audit",
                  "keyword research",
                  "search optimization"
              ],
              "qa": [
                  "qa",
                  "quality assurance",
                  "testing",
                  "api testing",
                  "api smoke test",
                  "bug report"
              ],
              "data": [
                  "data cleanup",
                  "data cleaning",
                  "csv",
                  "json",
                  "data analysis",
                  "data validation",
                  "spreadsheet"
              ],
              "agent_tools": [
                  "agent tooling",
                  "build agent tools",
                  "agent tools",
                  "tool development",
                  "automation",
                  "api integration"
              ],
              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead research",
                  "prospect research"
              ],
              "cro": [
                  "cro",
                  "conversion rate",
                  "conversion optimization",
                  "landing page analysis"
              ]
          }


          def matched_capabilities(content):
              lowered = content.lower()
              result = []

              for group, terms in CAPABILITIES.items():
                  if any(
                      term in lowered
                      for term in terms
                  ):
                      result.append(group)

              return result


          # ============================================================
          # CONSTRAINT ANALYSIS
          # ============================================================

          def external_ai_required(content):
              lowered = content.lower()

              indicators = [
                  "use chatgpt",
                  "use gpt",
                  "use gpt-4",
                  "use gpt-5",
                  "use gemini",
                  "use claude",
                  "use anthropic",
                  "use openai api",
                  "use an llm api",
                  "external ai required"
              ]

              return any(
                  item in lowered
                  for item in indicators
              )


          def paid_execution_required(content):
              lowered = content.lower()

              patterns = [
                  r"deploy\s+(?:to|on)\s+aws",
                  r"deploy\s+(?:to|on)\s+azure",
                  r"deploy\s+(?:to|on)\s+gcp",
                  r"aws\s+billing",
                  r"azure\s+billing",
                  r"gcp\s+billing",
                  r"paid\s+hosting",
                  r"paid\s+server",
                  r"subscription\s+required",
                  r"premium\s+api",
                  r"paid\s+api"
              ]

              return any(
                  re.search(
                      pattern,
                      lowered
                  )
                  for pattern in patterns
              )


          def financial_action_required(content):
              lowered = content.lower()

              terms = [
                  "send funds",
                  "transfer funds",
                  "bank transfer",
                  "credit card",
                  "make a payment",
                  "pay an invoice",
                  "purchase",
                  "buy crypto",
                  "wallet transfer"
              ]

              return any(
                  term in lowered
                  for term in terms
              )


          def clear_deliverable(content):
              terms = [
                  "report",
                  "audit",
                  "analysis",
                  "research",
                  "documentation",
                  "brief",
                  "findings",
                  "results",
                  "list",
                  "comparison",
                  "test results",
                  "bug report",
                  "recommendations",
                  "csv",
                  "json"
              ]

              lowered = content.lower()

              return any(
                  term in lowered
                  for term in terms
              )


          def reward_conflict(content):
              lowered = content.lower()

              sats = re.search(
                  r"\b\d[\d,.\s]*"
                  r"\s*(sats|sat|satoshi|satoshis)\b",
                  lowered
              )

              fiat = re.search(
                  r"\b(usdc|usd|eur|€|\$)\b",
                  lowered
              )

              return bool(
                  sats and fiat
              )


          def urls_from(content):
              raw = re.findall(
                  r"https?://[^\s<>\"]+",
                  content
              )

              result = []

              for url in raw:

                  url = url.rstrip(
                      ".,);]"
                  )

                  try:
                      parsed = urlparse(
                          url
                      )

                      if (
                          parsed.scheme
                          in ("http", "https")
                          and parsed.netloc
                      ):
                          result.append(
                              url
                          )

                  except Exception:
                      pass

              return list(
                  dict.fromkeys(result)
              )


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print()
          print(
              "=== MARKETPLACE DISCOVERY ==="
          )

          tasks_data = api_get(
              "/marketplace/tasks",
              params={
                  "limit": MAX_TASKS
              }
          )

          if isinstance(
              tasks_data,
              list
          ):
              tasks = tasks_data

          elif isinstance(
              tasks_data,
              dict
          ):
              tasks = (
                  tasks_data.get("tasks")
                  or tasks_data.get("items")
                  or tasks_data.get("results")
                  or []
              )

          else:
              tasks = []

          print(
              f"TASKS FOUND: {len(tasks)}"
          )


          # ============================================================
          # TRACKED BIDS
          # ============================================================

          tracked_bids = marketplace.get(
              "tracked_bids",
              []
          )

          if not isinstance(
              tracked_bids,
              list
          ):
              tracked_bids = []


          # ============================================================
          # RECONCILIATION
          # ============================================================

          print()
          print(
              "=== BID RECONCILIATION ==="
          )

          reconciled = []

          for record in tracked_bids[
              :MAX_RECONCILE
          ]:

              tid = text(
                  record.get(
                      "task_id",
                      ""
                  )
              ).strip()

              bid_id = text(
                  record.get(
                      "bid_id",
                      ""
                  )
              ).strip()

              if not tid:
                  continue

              try:
                  data = api_get(
                      f"/marketplace/{tid}/bids"
                  )

                  if isinstance(
                      data,
                      list
                  ):
                      bids = data
                  else:
                      bids = (
                          data.get("bids", [])
                          if isinstance(
                              data,
                              dict
                          )
                          else []
                      )

                  for bid in bids:

                      current_id = first_text(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      if (
                          bid_id
                          and current_id
                          != bid_id
                      ):
                          continue

                      status = first_text(
                          bid,
                          ["status"]
                      ).lower()

                      if status:
                          record[
                              "status"
                          ] = status

                      record[
                          "accepted"
                      ] = (
                          status == "accepted"
                      )

                      record[
                          "rejected"
                      ] = (
                          status == "rejected"
                      )

                      break

              except Exception as exc:
                  record[
                      "reconcile_error"
                  ] = compact(exc)

              record[
                  "last_reconciled_at"
              ] = now_iso()

              reconciled.append(
                  record
              )

          tracked_bids = reconciled

          print(
              f"Tracked bids: "
              f"{len(tracked_bids)}"
          )


          # ============================================================
          # PLATFORM LIMIT
          # ============================================================

          print()
          print(
              "=== PLATFORM BID LIMIT ==="
          )

          bid_remaining = None
          limit_data = None

          try:
              limit_data = api_get(
                  "/limits/me"
              )
          except Exception as exc:
              print(
                  "LIMIT WARNING: "
                  f"{compact(exc)}"
              )

          def find_bid_limit(
              value,
              depth=0
          ):
              if depth > 8:
                  return None

              if isinstance(
                  value,
                  dict
              ):

                  for key, item in value.items():

                      key_text = str(
                          key
                      ).lower()

                      if (
                          "bid" in key_text
                          and isinstance(
                              item,
                              dict
                          )
                      ):
                          return item

                  for item in value.values():

                      result = find_bid_limit(
                          item,
                          depth + 1
                      )

                      if result:
                          return result

              elif isinstance(
                  value,
                  list
              ):

                  for item in value[:300]:

                      result = find_bid_limit(
                          item,
                          depth + 1
                      )

                      if result:
                          return result

              return None


          bid_limit_node = find_bid_limit(
              limit_data
          )

          if bid_limit_node:

              bid_remaining = first_number(
                  bid_limit_node,
                  [
                      "remaining",
                      "remaining_count"
                  ]
              )

              if bid_remaining is not None:
                  bid_remaining = max(
                      0,
                      int(bid_remaining)
                  )

          print(
              "Bid remaining: "
              + (
                  str(bid_remaining)
                  if bid_remaining is not None
                  else "UNKNOWN"
              )
          )


          # ============================================================
          # HISTORICAL SIGNALS
          # ============================================================

          failures = marketplace.get(
              "failures",
              []
          )

          outcomes = marketplace.get(
              "outcomes",
              []
          )

          if not isinstance(
              failures,
              list
          ):
              failures = []

          if not isinstance(
              outcomes,
              list
          ):
              outcomes = []

          failure_text = recursive_text(
              failures[-MAX_FAILURE_MEMORY:]
          ).lower()

          outcome_text = recursive_text(
              outcomes[-MAX_TASK_MEMORY:]
          ).lower()


          # ============================================================
          # TASK EVALUATION
          # ============================================================

          print()
          print(
              "=== COGNITIVE TASK EVALUATION ==="
          )

          evaluations = []
          candidates = []
          skip_counts = {}

          def skip(reason):
              skip_counts[reason] = (
                  skip_counts.get(
                      reason,
                      0
                  ) + 1
              )


          for task in tasks:

              tid = task_id(task)

              title = task_title(task)

              body = task_body(task)

              if not tid:
                  skip("NO_TASK_ID")
                  continue

              content = (
                  f"{title}\n{body}"
              )

              lowered = content.lower()

              status = task_status(
                  task
              )

              if status in {
                  "closed",
                  "completed",
                  "cancelled",
                  "canceled"
              }:
                  skip("CLOSED_TASK")
                  continue

              already_tracked = any(
                  text(
                      item.get(
                          "task_id",
                          ""
                      )
                  ) == tid
                  for item in tracked_bids
              )

              if already_tracked:
                  skip("ALREADY_TRACKED")
                  continue

              capabilities = matched_capabilities(
                  content
              )

              if not capabilities:
                  skip("NO_CAPABILITY")
                  continue

              if financial_action_required(
                  content
              ):
                  skip("FINANCIAL_ACTION")
                  continue

              if (
                  REQUIRE_NO_EXTERNAL_AI
                  and external_ai_required(
                      content
                  )
              ):
                  skip(
                      "EXTERNAL_AI_REQUIRED"
                  )
                  continue

              if (
                  REQUIRE_ZERO_COST
                  and paid_execution_required(
                      content
                  )
              ):
                  skip(
                      "PAID_INFRASTRUCTURE"
                  )
                  continue

              if (
                  REQUIRE_CLEAR_DELIVERABLE
                  and not clear_deliverable(
                      content
                  )
              ):
                  skip(
                      "UNCLEAR_DELIVERABLE"
                  )
                  continue

              if reward_conflict(
                  content
              ):
                  skip(
                      "REWARD_UNIT_CONFLICT"
                  )
                  continue

              # --------------------------------------------------------
              # SCORE 1: CAPABILITY
              # --------------------------------------------------------

              capability_score = min(
                  100,
                  55 + len(capabilities) * 12
              )

              # --------------------------------------------------------
              # SCORE 2: CLARITY
              # --------------------------------------------------------

              clarity_score = 100

              if len(body) < 100:
                  clarity_score -= 20

              if len(body) < 50:
                  clarity_score -= 20

              clarity_score = max(
                  0,
                  clarity_score
              )

              # --------------------------------------------------------
              # SCORE 3: RESEARCH
              # --------------------------------------------------------

              urls = urls_from(
                  content
              )

              research_score = 70

              if urls:
                  research_score = 92

              if (
                  "research" in lowered
                  or "report" in lowered
              ):
                  research_score = max(
                      research_score,
                      85
                  )

              # --------------------------------------------------------
              # SCORE 4: REWARD SIGNAL
              # --------------------------------------------------------

              explicit_sats = re.search(
                  r"\b\d[\d,.\s]*"
                  r"\s*(sats|sat|satoshi|satoshis)\b",
                  lowered
              )

              reward_score = (
                  88
                  if explicit_sats
                  else 65
              )

              # --------------------------------------------------------
              # SCORE 5: LEDGER CONCORDANCE
              # --------------------------------------------------------

              ledger_score = 60
              ledger_signals = []

              capability_context = " ".join(
                  capabilities
              )

              if any(
                  item in ledger01_text
                  for item in capabilities
              ):
                  ledger_score += 10
                  ledger_signals.append(
                      "LEDGER01_CAPABILITY"
                  )

              if any(
                  item in ledger02_text
                  for item in capabilities
              ):
                  ledger_score += 10
                  ledger_signals.append(
                      "LEDGER02_COGNITION"
                  )

              if any(
                  item in ledger03_text
                  for item in capabilities
              ):
                  ledger_score += 10
                  ledger_signals.append(
                      "LEDGER03_EXPERIENCE"
                  )

              ledger_score = min(
                  100,
                  ledger_score
              )

              # --------------------------------------------------------
              # SCORE 6: HISTORY
              # --------------------------------------------------------

              risk = 0
              positive = 0

              tokens = set(
                  re.findall(
                      r"[a-z0-9]{5,}",
                      title.lower()
                  )
              )

              failure_hits = sum(
                  1
                  for token in tokens
                  if token in failure_text
              )

              outcome_hits = sum(
                  1
                  for token in tokens
                  if token in outcome_text
              )

              if failure_hits >= 4:
                  risk = 20
              elif failure_hits >= 2:
                  risk = 10

              if outcome_hits >= 4:
                  positive = 15
              elif outcome_hits >= 2:
                  positive = 8

              # --------------------------------------------------------
              # FEASIBILITY
              # --------------------------------------------------------

              feasibility = int(
                  capability_score * 0.28
                  + clarity_score * 0.15
                  + research_score * 0.12
                  + reward_score * 0.10
                  + ledger_score * 0.20
                  + 75 * 0.15
                  + positive
                  - risk
              )

              feasibility = max(
                  0,
                  min(
                      100,
                      feasibility
                  )
              )

              # --------------------------------------------------------
              # OPPORTUNITY
              # --------------------------------------------------------

              opportunity = int(
                  feasibility * 0.55
                  + capability_score * 0.15
                  + reward_score * 0.15
                  + clarity_score * 0.15
              )

              opportunity = max(
                  0,
                  min(
                      100,
                      opportunity
                  )
              )

              decision = (
                  feasibility
                  >= MIN_FEASIBILITY_SCORE
                  and
                  opportunity
                  >= BID_SCORE_THRESHOLD
              )

              evaluation = {
                  "task_id": tid,
                  "title": title,
                  "capabilities": capabilities,
                  "ledger_signals":
                      ledger_signals,
                  "feasibility_score":
                      feasibility,
                  "opportunity_score":
                      opportunity,
                  "capability_score":
                      capability_score,
                  "clarity_score":
                      clarity_score,
                  "research_score":
                      research_score,
                  "reward_score":
                      reward_score,
                  "ledger_score":
                      ledger_score,
                  "historical_risk":
                      risk,
                  "historical_positive":
                      positive,
                  "urls":
                      urls[:MAX_WEB_SOURCES],
                  "decision":
                      (
                          "BID"
                          if decision
                          else "NO_BID"
                      ),
                  "timestamp":
                      now_iso()
              }

              evaluations.append(
                  evaluation
              )

              if decision:
                  candidates.append(
                      evaluation
                  )


          candidates.sort(
              key=lambda item: (
                  item["opportunity_score"],
                  item["feasibility_score"],
                  item["ledger_score"]
              ),
              reverse=True
          )

          print(
              f"TASKS EVALUATED: "
              f"{len(evaluations)}"
          )

          print(
              f"INTELLIGENT BID CANDIDATES: "
              f"{len(candidates)}"
          )

          for reason, count in sorted(
              skip_counts.items(),
              key=lambda pair: -pair[1]
          ):
              print(
                  f"{reason}: {count}"
              )


          # ============================================================
          # BID SELECTION
          # ============================================================

          print()
          print(
              "=== BID SELECTION ==="
          )

          bids_created = 0
          bid_errors = 0
          rate_limited = False

          if bid_remaining is None:

              print(
                  "BIDDING DEFERRED: "
                  "platform bid limit unknown."
              )

          else:

              allowed = min(
                  MAX_BIDS_PER_RUN,
                  bid_remaining
              )

              selected = candidates[
                  :allowed
              ]

              print(
                  f"Bid budget available: "
                  f"{bid_remaining}"
              )

              print(
                  f"Selected: "
                  f"{len(selected)}"
              )

              for candidate in selected:

                  tid = candidate[
                      "task_id"
                  ]

                  title = candidate[
                      "title"
                  ]

                  amount = max(
                      MIN_BID_SATS,
                      21
                  )

                  bid_message = (
                      "NØX can perform this "
                      "mission within its current "
                      "research, analysis and "
                      "structured-delivery "
                      "capabilities. "
                      "Execution uses the existing "
                      "zero-cost environment and "
                      "does not require external AI."
                  )

                  payload = {
                      "amount_sats": amount,
                      "message": bid_message
                  }

                  print()
                  print(
                      f"BID CANDIDATE: {tid}"
                  )

                  print(
                      f"Title: "
                      f"{compact(title, 140)}"
                  )

                  print(
                      f"Feasibility: "
                      f"{candidate['feasibility_score']}"
                  )

                  print(
                      f"Opportunity: "
                      f"{candidate['opportunity_score']}"
                  )

                  print(
                      "Ledger signals: "
                      + (
                          ", ".join(
                              candidate[
                                  "ledger_signals"
                              ]
                          )
                          or "none"
                      )
                  )

                  response = api_post(
                      (
                          f"/marketplace/"
                          f"{tid}/bid"
                      ),
                      payload,
                      idempotency_key(
                          "bid",
                          tid
                      )
                  )

                  if response.status_code == 429:

                      rate_limited = True
                      bid_errors += 1

                      print(
                          "RATE_LIMIT_BID: "
                          f"{tid}"
                      )

                      print(
                          "STOPPING ALL FURTHER "
                          "BID ATTEMPTS."
                      )

                      break

                  if response.status_code >= 400:

                      bid_errors += 1

                      print(
                          "BID ERROR: "
                          f"{tid} -> "
                          f"{response.status_code}: "
                          f"{compact(response.text)}"
                      )

                      continue

                  try:
                      result = response.json()
                  except Exception:
                      result = {}

                  bid_id = first_text(
                      result,
                      [
                          "id",
                          "bid_id"
                      ]
                  )

                  tracked_bids.append({
                      "task_id":
                          tid,
                      "bid_id":
                          bid_id,
                      "title":
                          title,
                      "amount_sats":
                          amount,
                      "status":
                          "pending",
                      "accepted":
                          False,
                      "rejected":
                          False,
                      "feasibility_score":
                          candidate[
                              "feasibility_score"
                          ],
                      "opportunity_score":
                          candidate[
                              "opportunity_score"
                          ],
                      "ledger_signals":
                          candidate[
                              "ledger_signals"
                          ],
                      "created_at":
                          now_iso()
                  })

                  bids_created += 1

                  print(
                      f"BID CREATED: {tid}"
                  )


          # ============================================================
          # ACCEPTED MISSIONS
          # ============================================================

          print()
          print(
              "=== ACCEPTED MISSIONS ==="
          )

          accepted = []

          for record in tracked_bids:

              if not record.get(
                  "accepted",
                  False
              ):
                  continue

              tid = text(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              task = next(
                  (
                      item
                      for item in tasks
                      if task_id(item) == tid
                  ),
                  None
              )

              if task:
                  accepted.append({
                      "task": task,
                      "bid": record
                  })

          # Reconcile tracked bids again after new bids.

          for record in tracked_bids:

              tid = text(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              bid_id = text(
                  record.get(
                      "bid_id",
                      ""
                  )
              )

              if not tid:
                  continue

              try:
                  data = api_get(
                      f"/marketplace/{tid}/bids"
                  )

                  bids = (
                      data
                      if isinstance(
                          data,
                          list
                      )
                      else data.get(
                          "bids",
                          []
                      )
                      if isinstance(
                          data,
                          dict
                      )
                      else []
                  )

                  for bid in bids:

                      current_id = first_text(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      if (
                          bid_id
                          and current_id
                          != bid_id
                      ):
                          continue

                      status = first_text(
                          bid,
                          ["status"]
                      ).lower()

                      if status:
                          record[
                              "status"
                          ] = status

                      if status == "accepted":
                          record[
                              "accepted"
                          ] = True

                      if status == "rejected":
                          record[
                              "rejected"
                          ] = True

                      break

              except Exception:
                  continue

          accepted = []

          for record in tracked_bids:

              if not record.get(
                  "accepted",
                  False
              ):
                  continue

              tid = text(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              task = next(
                  (
                      item
                      for item in tasks
                      if task_id(item) == tid
                  ),
                  None
              )

              if task:
                  accepted.append({
                      "task": task,
                      "bid": record
                  })

          print(
              f"ACCEPTED MISSIONS: "
              f"{len(accepted)}"
          )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def research_urls(urls):

              if not WEB_RESEARCH_ENABLED:
                  return []

              results = []

              for url in urls[
                  :MAX_WEB_SOURCES
              ]:

                  try:
                      parsed = urlparse(
                          url
                      )

                      if parsed.scheme not in (
                          "http",
                          "https"
                      ):
                          continue

                      response = requests.get(
                          url,
                          headers={
                              "User-Agent":
                                  "Nox-Ledger-04/3.0"
                          },
                          timeout=HTTP_TIMEOUT
                      )

                      if response.status_code >= 400:
                          results.append({
                              "url": url,
                              "status":
                                  response.status_code
                          })
                          continue

                      raw = response.content[
                          :MAX_SOURCE_BYTES
                      ]

                      page = raw.decode(
                          response.encoding
                          or "utf-8",
                          errors="replace"
                      )

                      page = re.sub(
                          r"<script[\s\S]*?</script>",
                          " ",
                          page,
                          flags=re.I
                      )

                      page = re.sub(
                          r"<style[\s\S]*?</style>",
                          " ",
                          page,
                          flags=re.I
                      )

                      page = re.sub(
                          r"<[^>]+>",
                          " ",
                          page
                      )

                      page = re.sub(
                          r"\s+",
                          " ",
                          page
                      ).strip()

                      results.append({
                          "url":
                              url,
                          "status":
                              response.status_code,
                          "excerpt":
                              page[:1400]
                      })

                  except Exception as exc:
                      results.append({
                          "url": url,
                          "error":
                              compact(exc, 400)
                      })

              return results


          # ============================================================
          # EXECUTION
          # ============================================================

          print()
          print(
              "=== EXECUTION ==="
          )

          executions = []
          deliveries = []
          execution_failures = []

          if not EXECUTION_ENABLED:
              print(
                  "Execution disabled."
              )

          else:

              for mission in accepted[
                  :MAX_EXECUTIONS_PER_RUN
              ]:

                  task = mission[
                      "task"
                  ]

                  tid = task_id(
                      task
                  )

                  title = task_title(
                      task
                  )

                  body = task_body(
                      task
                  )

                  content = (
                      f"{title}\n{body}"
                  )

                  print(
                      f"EXECUTING: {tid}"
                  )

                  try:

                      urls = urls_from(
                          content
                      )

                      sources = research_urls(
                          urls
                      )

                      capabilities = (
                          matched_capabilities(
                              content
                          )
                      )

                      source_lines = []

                      for source in sources:

                          source_url = source.get(
                              "url",
                              ""
                          )

                          source_status = source.get(
                              "status",
                              ""
                          )

                          source_excerpt = source.get(
                              "excerpt",
                              ""
                          )

                          source_lines.append(
                              f"- {source_url} "
                              f"[HTTP {source_status}] "
                              f"{compact(source_excerpt, 900)}"
                          )

                      if not source_lines:
                          source_lines.append(
                              "- No explicit public "
                              "URL was supplied."
                          )

                      delivery = (
                          f"NØX DELIVERY — {title}\n\n"
                          f"Task scope:\n"
                          f"{compact(body, 1800)}\n\n"
                          f"Capabilities applied:\n"
                          f"{', '.join(capabilities)}\n\n"
                          f"Method:\n"
                          f"Structured analysis using "
                          f"NØX knowledge, cognition, "
                          f"previous action learning "
                          f"and available public evidence.\n\n"
                          f"Sources / evidence:\n"
                          f"{chr(10).join(source_lines)}\n\n"
                          f"Execution constraints:\n"
                          f"No Gemini.\n"
                          f"No external AI.\n"
                          f"No spending.\n"
                          f"No payment action.\n"
                          f"Project cost: €0."
                      )

                      delivery = delivery[
                          :MAX_DELIVERY_CHARS
                      ]

                      # ------------------------------------------------
                      # PREVIEW
                      # ------------------------------------------------

                      preview = api_post(
                          (
                              f"/posts/"
                              f"{tid}/comments/preview"
                          ),
                          {
                              "body":
                                  delivery
                          }
                      )

                      if preview.status_code >= 400:

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "PREVIEW",
                              "error":
                                  compact(
                                      preview.text
                                  ),
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              f"PREVIEW FAILED: {tid}"
                          )

                          continue

                      try:
                          preview_data = (
                              preview.json()
                          )
                      except Exception:
                          preview_data = {}

                      accepted_preview = (
                          preview_data.get(
                              "would_be_accepted",
                              True
                          )
                      )

                      if not accepted_preview:

                          blocker = first_text(
                              preview_data,
                              [
                                  "blocker",
                                  "reason",
                                  "error"
                              ]
                          )

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "PREVIEW_BLOCKED",
                              "error":
                                  blocker,
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              f"DELIVERY BLOCKED: {tid}"
                          )

                          continue

                      # ------------------------------------------------
                      # DELIVERY
                      # ------------------------------------------------

                      delivery_response = api_post(
                          (
                              f"/posts/"
                              f"{tid}/comments"
                          ),
                          {
                              "body":
                                  delivery
                          },
                          idempotency_key(
                              "delivery",
                              tid
                          )
                      )

                      if (
                          delivery_response.status_code
                          >= 400
                      ):

                          execution_failures.append({
                              "task_id":
                                  tid,
                              "stage":
                                  "DELIVERY",
                              "error":
                                  compact(
                                      delivery_response.text
                                  ),
                              "timestamp":
                                  now_iso()
                          })

                          print(
                              f"DELIVERY FAILED: {tid}"
                          )

                          continue

                      try:
                          delivery_data = (
                              delivery_response.json()
                          )
                      except Exception:
                          delivery_data = {}

                      comment_id = first_text(
                          delivery_data,
                          [
                              "id",
                              "comment_id"
                          ]
                      )

                      deliveries.append({
                          "task_id":
                              tid,
                          "title":
                              title,
                          "comment_id":
                              comment_id,
                          "delivered_at":
                              now_iso(),
                          "delivery_chars":
                              len(delivery)
                      })

                      executions.append({
                          "task_id":
                              tid,
                          "title":
                              title,
                          "sources":
                              sources,
                          "capabilities":
                              capabilities,
                          "executed_at":
                              now_iso()
                      })

                      print(
                          f"DELIVERY CREATED: {tid}"
                      )

                  except Exception as exc:

                      execution_failures.append({
                          "task_id":
                              tid,
                          "stage":
                              "EXECUTION",
                          "error":
                              compact(exc),
                          "timestamp":
                              now_iso()
                      })

                      print(
                          f"EXECUTION ERROR: "
                          f"{tid}: "
                          f"{compact(exc)}"
                      )


          # ============================================================
          # PAYMENT OBSERVATION
          # ============================================================

          print()
          print(
              "=== PAYMENT OBSERVATION ==="
          )

          payments = []

          seen_payment_tasks = set()

          for record in tracked_bids:

              tid = text(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              if not tid:
                  continue

              if tid in seen_payment_tasks:
