name: NØX LEDGER 04 - Marketplace Execution V4.1

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine

      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      MAX_BIDS_PER_RUN: "1"
      LOCAL_BID_WINDOW_SECONDS: "3600"
      LOCAL_BID_SAFETY_LIMIT: "8"

      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "78"
      MIN_FEASIBILITY_SCORE: "75"
      MIN_LEDGER_MATCHES: "2"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      - name: Marketplace execution
        run: |
          set -euo pipefail

          python <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]
          IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])

          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])
          LOCAL_BID_WINDOW_SECONDS = int(
              os.environ["LOCAL_BID_WINDOW_SECONDS"]
          )
          LOCAL_BID_SAFETY_LIMIT = int(
              os.environ["LOCAL_BID_SAFETY_LIMIT"]
          )

          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(
              os.environ["BID_SCORE_THRESHOLD"]
          )
          MIN_FEASIBILITY_SCORE = int(
              os.environ["MIN_FEASIBILITY_SCORE"]
          )
          MIN_LEDGER_MATCHES = int(
              os.environ["MIN_LEDGER_MATCHES"]
          )

          EXECUTION_ENABLED = (
              os.environ["EXECUTION_ENABLED"].lower() == "true"
          )
          MAX_EXECUTIONS_PER_RUN = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )
          MAX_DELIVERY_CHARS = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          WEB_RESEARCH_ENABLED = (
              os.environ["WEB_RESEARCH_ENABLED"].lower() == "true"
          )
          MAX_WEB_SOURCES = int(
              os.environ["MAX_WEB_SOURCES"]
          )
          HTTP_TIMEOUT_SECONDS = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )
          MAX_SOURCE_BYTES = int(
              os.environ["MAX_SOURCE_BYTES"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )
          MAX_TASK_MEMORY = int(
              os.environ["MAX_TASK_MEMORY"]
          )
          MAX_FAILURE_MEMORY = int(
              os.environ["MAX_FAILURE_MEMORY"]
          )

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ["REQUIRE_CLEAR_DELIVERABLE"].lower()
              == "true"
          )
          REQUIRE_ZERO_COST_EXECUTION = (
              os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower()
              == "true"
          )
          REQUIRE_NO_EXTERNAL_AI = (
              os.environ["REQUIRE_NO_EXTERNAL_AI"].lower()
              == "true"
          )

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          MARKETPLACE_FILE = (
              MEMORY_DIR / "nox_ledger_marketplace.json"
          )
          KNOWLEDGE_FILE = (
              MEMORY_DIR / "nox_ledger_knowledge.json"
          )
          COGNITION_FILE = (
              MEMORY_DIR / "nox_ledger_cognition.json"
          )
          ACTION_FILE = (
              MEMORY_DIR / "nox_ledger_action.json"
          )


          # ============================================================
          # HELPERS
          # ============================================================

          def now_ts():
              return int(time.time())


          def utc_iso(ts=None):
              if ts is None:
                  ts = now_ts()

              return datetime.fromtimestamp(
                  ts,
                  tz=timezone.utc
              ).isoformat()


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception:
                  return default


          def save_json(path, data):
              temp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temp.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              temp.replace(path)


          def textify(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )
              except Exception:
                  return str(value)


          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  textify(value).lower()
              ).strip()


          def token_set(value):
              return set(
                  re.findall(
                      r"[a-z0-9_+#.-]{3,}",
                      normalize(value)
                  )
              )


          def overlap(a, b):
              left = token_set(a)
              right = token_set(b)

              if not left or not right:
                  return 0

              return len(left & right)


          def headers(jwt=None):
              result = {
                  "Accept": "application/json",
                  "Content-Type": "application/json"
              }

              if jwt:
                  result["Authorization"] = (
                      f"Bearer {jwt}"
                  )

              return result


          def get_api(path, jwt=None, params=None):
              return requests.get(
                  f"{API_BASE}{path}",
                  headers=headers(jwt),
                  params=params,
                  timeout=HTTP_TIMEOUT_SECONDS
              )


          def post_api(
              path,
              jwt=None,
              payload=None,
              idempotency_key=None
          ):
              request_headers = headers(jwt)

              if idempotency_key:
                  request_headers["Idempotency-Key"] = (
                      idempotency_key
                  )

              return requests.post(
                  f"{API_BASE}{path}",
                  headers=request_headers,
                  json=payload or {},
                  timeout=HTTP_TIMEOUT_SECONDS
              )


          def extract_items(data, keys):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in keys:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []


          # ============================================================
          # START
          # ============================================================

          print("==============================================")
          print("=== NØX LEDGER 04 - MARKETPLACE EXECUTION ===")
          print("=== V4.1                                   ===")
          print("==============================================")


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print("")
          print("=== AUTHENTICATION ===")

          auth = requests.post(
              f"{API_BASE}/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json"
              },
              json={"api_key": API_KEY},
              timeout=HTTP_TIMEOUT_SECONDS
          )

          if auth.status_code != 200:
              print(
                  f"Authentication failed: HTTP "
                  f"{auth.status_code}"
              )
              print(auth.text[:1000])
              sys.exit(1)

          auth_data = auth.json()

          jwt = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not jwt:
              print("Authentication failed: JWT missing.")
              sys.exit(1)

          print("JWT obtained: YES")
          print("API key used only for token exchange: YES")
          print("JWT value: HIDDEN")


          # ============================================================
          # IDENTITY
          # ============================================================

          print("")
          print("=== IDENTITY ===")

          identity_response = get_api(
              "/users/me",
              jwt
          )

          if identity_response.status_code != 200:
              print(
                  "Identity lookup failed: "
                  f"HTTP {identity_response.status_code}"
              )
              print(identity_response.text[:1000])
              sys.exit(1)

          identity_data = identity_response.json()

          resolved_identity = (
              identity_data.get("username")
              or identity_data.get("handle")
              or identity_data.get("name")
              or identity_data.get("identity")
              or IDENTITY
          )

          print(
              f"IDENTITY: {resolved_identity}"
          )


          # ============================================================
          # LOAD LEDGERS
          # ============================================================

          print("")
          print("=== INTER-LEDGER CONTEXT ===")

          ledger01 = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          ledger02 = load_json(
              COGNITION_FILE,
              {}
          )

          ledger03 = load_json(
              ACTION_FILE,
              {}
          )

          memory = load_json(
              MARKETPLACE_FILE,
              {
                  "tracked_bids": [],
                  "bid_attempts": [],
                  "accepted_missions": [],
                  "executions": [],
                  "deliveries": [],
                  "payments": [],
                  "outcomes": [],
                  "failures": [],
                  "research": [],
                  "bid_cooldown_until": 0,
                  "bid_cooldown_reason": "",
                  "bid_cooldown_source": "",
                  "bid_cooldown_set_at": 0
              }
          )

          print("Ledger 01: LOADED")
          print("Ledger 02: LOADED")
          print("Ledger 03: LOADED")


          # ============================================================
          # PERSISTENT BID COOLDOWN
          # ============================================================

          current = now_ts()

          cooldown_until = int(
              memory.get("bid_cooldown_until") or 0
          )

          cooldown_active = (
              cooldown_until > current
          )

          print("")
          print("=== PLATFORM BID COOLDOWN ===")

          if cooldown_active:
              remaining = (
                  cooldown_until - current
              )

              print("Status: ACTIVE")
              print(
                  "Reason: "
                  + str(
                      memory.get(
                          "bid_cooldown_reason"
                      )
                      or "RATE_LIMIT_BID"
                  )
              )
              print(
                  "Source: "
                  + str(
                      memory.get(
                          "bid_cooldown_source"
                      )
                      or "colony_api"
                  )
              )
              print(
                  f"Remaining seconds: {remaining}"
              )
              print(
                  "Cooldown until: "
                  f"{utc_iso(cooldown_until)}"
              )

          elif cooldown_until > 0:
              print("Status: EXPIRED")

              memory["bid_cooldown_until"] = 0
              memory["bid_cooldown_reason"] = ""
              memory["bid_cooldown_source"] = ""
              memory["bid_cooldown_set_at"] = 0

          else:
              print("Status: INACTIVE")


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print("")
          print("=== MARKETPLACE DISCOVERY ===")

          tasks_response = get_api(
              "/marketplace/tasks",
              jwt,
              params={"limit": MAX_TASKS}
          )

          if tasks_response.status_code != 200:
              print(
                  "Marketplace discovery failed: "
                  f"HTTP {tasks_response.status_code}"
              )
              print(tasks_response.text[:1500])
              sys.exit(1)

          tasks = extract_items(
              tasks_response.json(),
              ["tasks", "items", "results"]
          )

          tasks = tasks[:MAX_TASKS]

          print(
              f"TASKS FOUND: {len(tasks)}"
          )


          # ============================================================
          # LOCAL BID CONTROL
          # ============================================================

          print("")
          print("=== LOCAL BID CONTROL ===")

          attempts = memory.get(
              "bid_attempts",
              []
          )

          if not isinstance(attempts, list):
              attempts = []

          cutoff = (
              now_ts()
              - LOCAL_BID_WINDOW_SECONDS
          )

          recent_attempts = [
              item
              for item in attempts
              if int(
                  item.get("timestamp", 0)
              ) >= cutoff
          ]

          memory["bid_attempts"] = (
              recent_attempts
          )

          print(
              f"Recent bid attempts: "
              f"{len(recent_attempts)}"
          )
          print(
              f"Safety limit: "
              f"{LOCAL_BID_SAFETY_LIMIT}"
          )
          print(
              f"Max bids this run: "
              f"{MAX_BIDS_PER_RUN}"
          )

          if cooldown_active:
              print(
                  "LOCAL BID COOLDOWN: ACTIVE"
              )
          else:
              print(
                  "LOCAL BID COOLDOWN: INACTIVE"
              )


          # ============================================================
          # BID RECONCILIATION
          # ============================================================

          print("")
          print("=== BID RECONCILIATION ===")

          tracked_bids = memory.get(
              "tracked_bids",
              []
          )

          if not isinstance(
              tracked_bids,
              list
          ):
              tracked_bids = []

          for tracked in tracked_bids[
              :MAX_RECONCILE
          ]:
              task_id = tracked.get(
                  "task_id"
              )

              if not task_id:
                  continue

              try:
                  result = get_api(
                      f"/marketplace/{task_id}/bids",
                      jwt
                  )

                  if result.status_code != 200:
                      continue

                  bids = extract_items(
                      result.json(),
                      ["bids", "items"]
                  )

                  target_bid_id = str(
                      tracked.get("bid_id") or ""
                  )

                  for bid in bids:
                      bid_id = str(
                          bid.get("id")
                          or bid.get("bid_id")
                          or ""
                      )

                      if (
                          target_bid_id
                          and bid_id == target_bid_id
                      ):
                          tracked["latest_status"] = (
                              bid.get("status")
                              or bid.get("state")
                              or tracked.get(
                                  "latest_status"
                              )
                          )
                          tracked["latest_bid"] = bid
                          tracked["last_checked"] = (
                              utc_iso()
                          )

              except Exception:
                  continue

          print(
              f"Tracked bids: "
              f"{len(tracked_bids)}"
          )


          # ============================================================
          # CAPABILITIES
          # ============================================================

          capability_groups = {
              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "research reports",
                  "competitive analysis",
                  "market research",
                  "investigation",
                  "analysis"
              ],
              "writing": [
                  "write",
                  "writing",
                  "copywriting",
                  "report writing",
                  "technical report",
                  "content",
                  "documentation"
              ],
              "seo": [
                  "seo",
                  "seo audit",
                  "search optimization",
                  "keyword",
                  "technical seo"
              ],
              "qa": [
                  "qa",
                  "quality assurance",
                  "testing",
                  "test",
                  "api smoke test",
                  "validation"
              ],
              "data": [
                  "data analysis",
                  "data cleanup",
                  "data processing",
                  "dataset",
                  "python",
                  "automation script"
              ],
              "agent_tools": [
                  "build agent tools",
                  "agent tools",
                  "agent tooling",
                  "agent tool",
                  "tool development",
                  "agent development"
              ],
              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead qualification"
              ],
              "cro": [
                  "cro",
                  "conversion rate optimization",
                  "conversion optimization"
              ]
          }


          def task_capabilities(content):
              text = normalize(content)
              result = []

              for capability, phrases in (
                  capability_groups.items()
              ):
                  if any(
                      phrase in text
                      for phrase in phrases
                  ):
                      result.append(capability)

              return result


          # ============================================================
          # THREE-LEDGER EVALUATION
          # ============================================================

          print("")
          print(
              "=== THREE-LEDGER COGNITIVE EVALUATION ==="
          )

          ledger01_text = normalize(
              ledger01
          )
          ledger02_text = normalize(
              ledger02
          )
          ledger03_text = normalize(
              ledger03
          )

          outcomes_text = normalize(
              str(
                  ledger01.get("outcomes", [])
              )
              + " "
              + str(
                  ledger03.get("outcomes", [])
              )
              + " "
              + str(
                  memory.get("outcomes", [])
              )
          )

          failures_text = normalize(
              str(
                  ledger01.get("failures", [])
              )
              + " "
              + str(
                  ledger03.get("failures", [])
              )
              + " "
              + str(
                  memory.get("failures", [])
              )
          )

          rejection_counts = {
              "SERVICE_OFFER_NOT_REQUEST": 0,
              "REWARD_UNIT_CONFLICT": 0,
              "NO_CAPABILITY": 0,
              "CREDENTIAL_REQUIRED": 0,
              "UNCLEAR_DELIVERABLE": 0,
              "LOW_FEASIBILITY": 0,
              "CLOSED_TASK": 0,
              "FINANCIAL_ACTION": 0
          }

          candidates = []
          evaluated = 0

          for task in tasks:

              title = textify(
                  task.get("title")
                  or task.get("name")
                  or ""
              )

              body = textify(
                  task.get("description")
                  or task.get("body")
                  or task.get("content")
                  or ""
              )

              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("post_id")
                  or ""
              )

              content = (
                  title
                  + "\n"
                  + body
              )

              text = normalize(content)

              # --------------------------------------------------------
              # SERVICE OFFER FILTER
              # --------------------------------------------------------

              offer_patterns = [
                  "for hire:",
                  "available for hire",
                  "my services",
                  "i offer",
                  "we offer",
                  "our services",
                  "hire me"
              ]

              request_patterns = [
                  "need ",
                  "looking for ",
                  "seeking ",
                  "request",
                  "please build",
                  "please create",
                  "please analyze",
                  "can someone",
                  "who can",
                  "help me",
                  "looking to hire",
                  "task:",
                  "mission:"
              ]

              if (
                  any(
                      p in text
                      for p in offer_patterns
                  )
                  and not any(
                      p in text
                      for p in request_patterns
                  )
              ):
                  rejection_counts[
                      "SERVICE_OFFER_NOT_REQUEST"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # REWARD UNIT FILTER
              # --------------------------------------------------------

              has_sats = bool(
                  re.search(
                      r"\b(?:sats?|sat|satoshis)\b",
                      text
                  )
              )

              has_other_currency = bool(
                  re.search(
                      r"\b(?:usd|usdc|eur|euro|dollar|dollars)\b",
                      text
                  )
              )

              if (
                  has_sats
                  and has_other_currency
              ):
                  rejection_counts[
                      "REWARD_UNIT_CONFLICT"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # FINANCIAL ACTION FILTER
              # --------------------------------------------------------

              financial_patterns = [
                  "send money",
                  "transfer funds",
                  "buy ",
                  "purchase ",
                  "pay ",
                  "payment required",
                  "financial transaction",
                  "invest ",
                  "investment",
                  "wallet transfer",
                  "withdraw funds"
              ]

              if any(
                  p in text
                  for p in financial_patterns
              ):
                  rejection_counts[
                      "FINANCIAL_ACTION"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # CREDENTIAL FILTER
              # --------------------------------------------------------

              credential_patterns = [
                  "password",
                  "private key",
                  "seed phrase",
                  "secret key",
                  "api key",
                  "access token",
                  "login credentials",
                  "credentials required"
              ]

              if any(
                  p in text
                  for p in credential_patterns
              ):
                  rejection_counts[
                      "CREDENTIAL_REQUIRED"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # CLOSED TASK FILTER
              # --------------------------------------------------------

              closed_patterns = [
                  "completed",
                  "already awarded",
                  "closed",
                  "no longer available",
                  "task closed"
              ]

              if any(
                  p in text
                  for p in closed_patterns
              ):
                  rejection_counts[
                      "CLOSED_TASK"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # CAPABILITY FILTER
              # --------------------------------------------------------

              capabilities = task_capabilities(
                  content
              )

              if not capabilities:
                  rejection_counts[
                      "NO_CAPABILITY"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # ZERO-COST / NO-EXTERNAL-AI FILTER
              # --------------------------------------------------------

              external_ai_patterns = [
                  "gemini",
                  "openai api required",
                  "anthropic api required",
                  "external ai required",
                  "paid ai api",
                  "llm api required"
              ]

              paid_infra_patterns = [
                  "paid api",
                  "paid infrastructure",
                  "paid server",
                  "paid hosting",
                  "subscription required",
                  "premium account required"
              ]

              human_only_patterns = [
                  "human only",
                  "must be human",
                  "in-person",
                  "physical presence required"
              ]

              external_delivery_patterns = [
                  "ship physical",
                  "deliver physically",
                  "phone call required",
                  "in person required"
              ]

              if (
                  REQUIRE_NO_EXTERNAL_AI
                  and any(
                      p in text
                      for p in external_ai_patterns
                  )
              ):
                  continue

              if (
                  REQUIRE_ZERO_COST_EXECUTION
                  and any(
                      p in text
                      for p in paid_infra_patterns
                  )
              ):
                  continue

              if any(
                  p in text
                  for p in human_only_patterns
              ):
                  continue

              if any(
                  p in text
                  for p in external_delivery_patterns
              ):
                  continue

              # --------------------------------------------------------
              # DELIVERABLE CLARITY
              # --------------------------------------------------------

              deliverable_patterns = [
                  "report",
                  "audit",
                  "analysis",
                  "script",
                  "tool",
                  "documentation",
                  "dataset",
                  "results",
                  "findings",
                  "qa report",
                  "research report",
                  "code",
                  "automation"
              ]

              if (
                  REQUIRE_CLEAR_DELIVERABLE
                  and not any(
                      p in text
                      for p in deliverable_patterns
                  )
              ):
                  rejection_counts[
                      "UNCLEAR_DELIVERABLE"
                  ] += 1
                  continue

              evaluated += 1

              # --------------------------------------------------------
              # LEDGER 01
              # --------------------------------------------------------

              ledger01_match = False

              for capability in capabilities:
                  if any(
                      phrase in ledger01_text
                      for phrase in capability_groups[
                          capability
                      ]
                  ):
                      ledger01_match = True
                      break

              if overlap(
                  content,
                  ledger01_text
              ) >= 8:
                  ledger01_match = True

              # --------------------------------------------------------
              # LEDGER 02
              # --------------------------------------------------------

              cognitive_terms = [
                  "research",
                  "learning",
                  "knowledge",
                  "evidence",
                  "analysis",
                  "understand",
                  "reflection",
                  "reasoning",
                  "experiment",
                  "improvement",
                  "automation",
                  "agent",
                  "tools"
              ]

              ledger02_match = any(
                  term in text
                  and term in ledger02_text
                  for term in cognitive_terms
              )

              if overlap(
                  content,
                  ledger02_text
              ) >= 8:
                  ledger02_match = True

              # --------------------------------------------------------
              # LEDGER 03
              # --------------------------------------------------------

              ledger03_match = False

              for capability in capabilities:
                  if any(
                      phrase in ledger03_text
                      for phrase in capability_groups[
                          capability
                      ]
                  ):
                      ledger03_match = True
                      break

              if overlap(
                  content,
                  ledger03_text
              ) >= 8:
                  ledger03_match = True

              if outcomes_text:
                  if (
                      overlap(
                          content,
                          outcomes_text
                      ) >= 5
                      and any(
                          word in text
                          for word in [
                              "success",
                              "completed",
                              "delivered",
                              "validated",
                              "accepted",
                              "useful"
                          ]
                      )
                  ):
                      ledger03_match = True

              # --------------------------------------------------------
              # CONCORDANCE
              # --------------------------------------------------------

              matched_ledgers = []

              if ledger01_match:
                  matched_ledgers.append(
                      "LEDGER01"
                  )

              if ledger02_match:
                  matched_ledgers.append(
                      "LEDGER02"
                  )

              if ledger03_match:
                  matched_ledgers.append(
                      "LEDGER03"
                  )

              if len(matched_ledgers) < (
                  MIN_LEDGER_MATCHES
              ):
                  continue

              # --------------------------------------------------------
              # FEASIBILITY
              # --------------------------------------------------------

              feasibility = 60

              feasibility += min(
                  len(capabilities) * 10,
                  30
              )

              if "research" in capabilities:
                  feasibility += 5

              if "qa" in capabilities:
                  feasibility += 4

              if "seo" in capabilities:
                  feasibility += 4

              if "data" in capabilities:
                  feasibility += 4

              if re.search(
                  r"https?://",
                  content
              ):
                  feasibility += 8

              feasibility = min(
                  feasibility,
                  100
              )

              if feasibility < (
                  MIN_FEASIBILITY_SCORE
              ):
                  rejection_counts[
                      "LOW_FEASIBILITY"
                  ] += 1
                  continue

              # --------------------------------------------------------
              # SCORE
              # --------------------------------------------------------

              clarity = 100

              if len(body.strip()) < 80:
                  clarity -= 15

              if len(body.strip()) < 40:
                  clarity -= 20

              clarity = max(
                  clarity,
                  0
              )

              research_score = 70

              if re.search(
                  r"https?://",
                  content
              ):
                  research_score = 95

              if any(
                  word in text
                  for word in [
                      "research",
                      "report",
                      "audit",
                      "analysis"
                  ]
              ):
                  research_score = max(
                      research_score,
                      85
                  )

              reward_score = (
                  90
                  if has_sats
                  else 65
              )

              concordance_score = (
                  len(matched_ledgers)
                  / 3
                  * 100
              )

              historical_bonus = 0

              if outcomes_text:
                  historical_bonus = min(
                      overlap(
                          content,
                          outcomes_text
                      ),
                      8
                  )

              historical_penalty = 0

              if failures_text:
                  historical_penalty = min(
                      overlap(
                          content,
                          failures_text
                      ),
                      8
                  )

              score = int(
                  round(
                      feasibility * 0.30
                      + clarity * 0.15
                      + research_score * 0.10
                      + reward_score * 0.10
                      + concordance_score * 0.30
                      + historical_bonus
                      - historical_penalty
                  )
              )

              if score < BID_SCORE_THRESHOLD:
                  continue

              candidates.append(
                  {
                      "task_id": task_id,
                      "title": title,
                      "body": body,
                      "content": content,
                      "score": score,
                      "ledger_matches": matched_ledgers,
                      "capabilities": capabilities,
                      "feasibility": feasibility
                  }
              )


          # ============================================================
          # EVALUATION RESULT
          # ============================================================

          print("")
          print("=== EVALUATION RESULT ===")
          print(
              f"TASKS EVALUATED: {evaluated}"
          )
          print(
              "INTELLIGENT BID CANDIDATES: "
              f"{len(candidates)}"
          )

          for key, value in rejection_counts.items():
              print(
                  f"{key}: {value}"
              )

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  len(
                      item["ledger_matches"]
                  ),
                  item["feasibility"]
              ),
              reverse=True
          )

          print("")
          print("=== TOP CANDIDATES ===")

          for candidate in candidates[:5]:
              print(
                  f"Candidate "
                  f"{candidate['task_id']} "
                  f"| score={candidate['score']} "
                  f"| ledgers="
                  f"{','.join(candidate['ledger_matches'])} "
                  f"| {candidate['title']}"
              )


          # ============================================================
          # BID EXECUTION
          # ============================================================

          print("")
          print("=== BID EXECUTION ===")

          selected = None
          bids_created = 0
          bid_errors = 0
          rate_limited = False

          if cooldown_active:
              print(
                  "BIDDING SKIPPED: "
                  "persistent platform cooldown active."
              )

          elif len(recent_attempts) >= (
              LOCAL_BID_SAFETY_LIMIT
          ):
              print(
                  "BIDDING SKIPPED: "
                  "local safety limit reached."
              )

          elif MAX_BIDS_PER_RUN <= 0:
              print(
                  "BIDDING SKIPPED: "
                  "MAX_BIDS_PER_RUN <= 0."
              )

          elif candidates:
              selected = candidates[0]

          else:
              print(
                  "BIDDING SKIPPED: "
                  "no intelligent candidate."
              )


          if selected is not None:

              print("Selected candidate:")
              print(
                  f"Task: {selected['task_id']}"
              )
              print(
                  f"Score: {selected['score']}"
              )
              print(
                  "Ledger concordance: "
                  + ",".join(
                      selected["ledger_matches"]
                  )
              )
              print(
                  "Submitting one bid maximum "
                  "for this run."
              )

              bid_message = (
                  "NØX can execute this mission "
                  "using its current research, "
                  "analysis and structured delivery "
                  "capabilities. The action is aligned "
                  "with NØX's current knowledge, "
                  "cognitive priorities and observed "
                  "marketplace experience. No external "
                  "AI or paid infrastructure is required."
              )

              payload = {
                  "amount_sats": MIN_BID_SATS,
                  "message": bid_message
              }

              idempotency_seed = (
                  f"{selected['task_id']}:"
                  f"{MIN_BID_SATS}:"
                  f"{utc_iso()[:13]}"
              )

              idempotency_key = hashlib.sha256(
                  idempotency_seed.encode(
                      "utf-8"
                  )
              ).hexdigest()

              response = post_api(
                  f"/marketplace/"
                  f"{selected['task_id']}/bid",
                  jwt,
                  payload,
                  idempotency_key
              )

              attempt = {
                  "timestamp": now_ts(),
                  "timestamp_iso": utc_iso(),
                  "task_id": selected["task_id"],
                  "title": selected["title"],
                  "score": selected["score"],
                  "amount_sats": MIN_BID_SATS,
                  "status_code": response.status_code
              }

              if response.status_code in (
                  200,
                  201
              ):

                  bids_created = 1

                  try:
                      result = response.json()
                  except Exception:
                      result = {}

                  attempt["status"] = "created"
                  attempt["response"] = result

                  recent_attempts.append(
                      attempt
                  )

                  bid_id = (
                      result.get("id")
                      or result.get("bid_id")
                      or (
                          result.get("bid", {})
                          .get("id")
                      )
                  )

                  tracked_bids.append(
                      {
                          "task_id": selected[
                              "task_id"
                          ],
                          "bid_id": bid_id,
                          "amount_sats": MIN_BID_SATS,
                          "created_at": utc_iso(),
                          "latest_status": "pending",
                          "title": selected[
                              "title"
                          ]
                      }
                  )

                  print(
                      "BID CREATED: YES"
                  )

              elif response.status_code == 429:

                  bid_errors = 1
                  rate_limited = True

                  retry_after = 0

                  header_value = (
                      response.headers.get(
                          "Retry-After"
                      )
                  )

                  try:
                      retry_after = int(
                          float(header_value)
                      )
                  except Exception:
                      retry_after = 0

                  try:
                      error_data = (
                          response.json()
                      )
                  except Exception:
                      error_data = {}

                  if retry_after <= 0:
                      try:
                          retry_after = int(
                              error_data.get(
                                  "retry_after",
                                  0
                              )
                              or error_data.get(
                                  "retryAfter",
                                  0
                              )
                              or 0
                          )
                      except Exception:
                          retry_after = 0

                  # Safety fallback:
                  # never retry immediately after a rate limit.
                  retry_after = max(
                      retry_after,
                      60
                  )

                  cooldown_until_new = (
                      now_ts()
                      + retry_after
                  )

                  memory[
                      "bid_cooldown_until"
                  ] = cooldown_until_new

                  memory[
                      "bid_cooldown_reason"
                  ] = "RATE_LIMIT_BID"

                  memory[
                      "bid_cooldown_source"
                  ] = "colony_api"

                  memory[
                      "bid_cooldown_set_at"
                  ] = now_ts()

                  attempt["status"] = (
                      "rate_limited"
                  )
                  attempt["retry_after"] = (
                      retry_after
                  )
                  attempt[
                      "cooldown_until"
                  ] = cooldown_until_new

                  recent_attempts.append(
                      attempt
                  )

                  print(
                      "RATE_LIMIT_BID received."
                  )
                  print(
                      f"Server retry_after: "
                      f"{retry_after}s"
                  )
                  print(
                      "Persistent bid cooldown saved."
                  )
                  print(
                      "Cooldown until: "
                      f"{utc_iso(cooldown_until_new)}"
                  )
                  print(
                      "ALL BID ATTEMPTS STOPPED "
                      "FOR THIS RUN."
                  )

              else:

                  bid_errors = 1

                  attempt["status"] = "error"
                  attempt["response"] = (
                      response.text[:1000]
                  )

                  recent_attempts.append(
                      attempt
                  )

                  print(
                      f"BID ERROR: "
                      f"HTTP {response.status_code}"
                  )
                  print(
                      response.text[:1000]
                  )
                  print(
                      "ALL BID ATTEMPTS STOPPED "
                      "FOR THIS RUN."
                  )


          memory["bid_attempts"] = (
              recent_attempts[
                  -MAX_MEMORY_ITEMS:
              ]
          )

          memory["tracked_bids"] = (
              tracked_bids[
                  -MAX_MEMORY_ITEMS:
              ]
          )


          # ============================================================
          # ACCEPTED MISSIONS
          # ============================================================

          print("")
          print("=== ACCEPTED MISSIONS ===")

          accepted_missions = []

          for tracked in tracked_bids:

              status = normalize(
                  tracked.get(
                      "latest_status"
                  )
              )

              if status in {
                  "accepted",
                  "accept",
                  "awarded",
                  "winner"
              }:
                  accepted_missions.append(
                      tracked
                  )

          memory["accepted_missions"] = (
              accepted_missions[
                  -MAX_MEMORY_ITEMS:
              ]
          )

          print(
              "ACCEPTED MISSIONS: "
              f"{len(accepted_missions)}"
          )


          # ============================================================
          # EXECUTION
          # ============================================================

          print("")
          print("=== EXECUTION ===")

          executions = memory.get(
              "executions",
              []
          )

          deliveries = memory.get(
              "deliveries",
              []
          )

          failures = memory.get(
              "failures",
              []
          )

          research_memory = memory.get(
              "research",
              []
          )

          executions_this_run = 0
          deliveries_this_run = 0
          execution_failures = 0

          if (
              EXECUTION_ENABLED
              and accepted_missions
          ):

              for mission in accepted_missions[
                  :MAX_EXECUTIONS_PER_RUN
              ]:

                  if (
                      executions_this_run
                      >= MAX_EXECUTIONS_PER_RUN
                  ):
                      break

                  task_id = mission.get(
                      "task_id"
                  )

                  if not task_id:
                      continue

                  print(
                      "Processing accepted mission: "
                      f"{task_id}"
                  )

                  try:

                      task_response = get_api(
                          "/marketplace/tasks",
                          jwt
                      )

                      mission_task = None

                      if (
                          task_response.status_code
                          == 200
                      ):

                          all_tasks = extract_items(
                              task_response.json(),
                              [
                                  "tasks",
                                  "items",
                                  "results"
                              ]
                          )

                          for task in all_tasks:

                              current_id = str(
                                  task.get("id")
                                  or task.get(
                                      "task_id"
                                  )
                                  or task.get(
                                      "post_id"
                                  )
                                  or ""
                              )

                              if (
                                  current_id
                                  == str(task_id)
                              ):
                                  mission_task = task
                                  break

                      if mission_task is None:

                          failures.append(
                              {
                                  "timestamp": utc_iso(),
                                  "task_id": task_id,
                                  "type": "TECHNICAL",
                                  "reason": (
                                      "Accepted task "
                                      "could not be retrieved."
                                  )
                              }
                          )

                          execution_failures += 1
                          continue

                      title = textify(
                          mission_task.get(
                              "title"
                          )
                          or mission_task.get(
                              "name"
                          )
                          or ""
                      )

                      body = textify(
                          mission_task.get(
                              "description"
                          )
                          or mission_task.get(
                              "body"
                          )
                          or mission_task.get(
                              "content"
                          )
                          or ""
                      )

                      urls = re.findall(
                          r"https?://[^\s<>\"]+",
                          body
                      )

                      urls = list(
                          dict.fromkeys(
                              urls
                          )
                      )[:MAX_WEB_SOURCES]

                      research_lines = []

                      if (
                          WEB_RESEARCH_ENABLED
                          and urls
                      ):

                          print(
                              "Research sources: "
                              f"{len(urls)}"
                          )

                          for url in urls:

                              try:

                                  parsed = urlparse(
                                      url
                                  )

                                  if (
                                      parsed.scheme
                                      not in {
                                          "http",
                                          "https"
                                      }
                                  ):
                                      continue

                                  source_response = (
                                      requests.get(
                                          url,
                                          headers={
                                              "User-Agent":
                                              "Nox-Ledger-04/1.0"
                                          },
                                          timeout=(
                                              HTTP_TIMEOUT_SECONDS
                                          ),
                                          stream=True
                                      )
                                  )

                                  if (
                                      source_response
                                      .status_code
                                      != 200
                                  ):
                                      continue

                                  chunks = []
                                  total_bytes = 0

                                  for chunk in (
                                      source_response
                                      .iter_content(
                                          chunk_size=8192,
                                          decode_unicode=True
                                      )
                                  ):

                                      if not chunk:
                                          continue

                                      chunks.append(
                                          chunk
                                      )

                                      total_bytes += len(
                                          chunk.encode(
                                              "utf-8",
                                              errors="ignore"
                                          )
                                      )

                                      if (
                                          total_bytes
                                          >= MAX_SOURCE_BYTES
                                      ):
                                          break

                                  source_text = normalize(
                                      "".join(chunks)
                                  )

                                  if source_text:
                                      research_lines.append(
                                          {
                                              "url": url,
                                              "status": (
                                                  source_response
                                                  .status_code
                                              ),
                                              "excerpt": (
                                                  source_text[
                                                      :4000
                                                  ]
                                              )
                                          }
                                      )

                              except Exception as exc:

                                  research_lines.append(
                                      {
                                          "url": url,
                                          "status": "error",
                                          "error": str(
                                              exc
                                          )[:300]
                                      }
                                  )

                      research_memory.append(
                          {
                              "timestamp": utc_iso(),
                              "task_id": task_id,
                              "sources": research_lines
                          }
                      )

                      report_parts = [
                          "NØX DELIVERY",
                          f"Task: {title}",
                          "",
                          "Scope:",
                          body[:5000],
                          ""
                      ]

                      if research_lines:

                          report_parts.append(
                              "Research sources reviewed:"
                          )

                          for source in (
                              research_lines
                          ):

                              report_parts.append(
                                  "- "
                                  + str(
                                      source.get(
                                          "url"
                                      )
                                  )
                              )

                              excerpt = source.get(
                                  "excerpt"
                              )

                              if excerpt:
                                  report_parts.append(
                                      excerpt[:1200]
                                  )

                      else:

                          report_parts.append(
                              "No external research "
                              "source was available "
                              "in the task."
                          )

                      report_parts.append("")
                      report_parts.append(
                          "Method: deterministic "
                          "analysis without "
                          "external AI."
                      )

                      delivery = "\n".join(
                          report_parts
                      )[:MAX_DELIVERY_CHARS]

                      preview = post_api(
                          f"/posts/{task_id}"
                          "/comments/preview",
                          jwt,
                          {
                              "content": delivery
                          }
                      )

                      if preview.status_code not in (
                          200,
                          201
                      ):

                          failures.append(
                              {
                                  "timestamp": utc_iso(),
                                  "task_id": task_id,
                                  "type": "DELIVERY",
                                  "reason": (
                                      "Comment preview "
                                      "rejected."
                                  ),
                                  "status_code": (
                                      preview.status_code
                                  )
                              }
                          )

                          execution_failures += 1
                          continue

                      try:
                          preview_data = (
                              preview.json()
                          )
                      except Exception:
                          preview_data = {}

                      preview_ok = preview_data.get(
                          "accepted",
                          preview_data.get(
                              "valid",
                              True
                          )
                      )

                      if not preview_ok:

                          failures.append(
                              {
                                  "timestamp": utc_iso(),
                                  "task_id": task_id,
                                  "type": "DELIVERY",
                                  "reason": (
                                      "Comment preview "
                                      "did not accept "
                                      "delivery."
                                  )
                              }
                          )

                          execution_failures += 1
                          continue

                      delivery_key = hashlib.sha256(
                          (
                              f"{task_id}:"
                              f"{hashlib.sha256("
                              f"delivery.encode('utf-8')"
                              f").hexdigest()}"
                          ).encode("utf-8")
                      ).hexdigest()

                      comment_response = post_api(
                          f"/posts/{task_id}"
                          "/comments",
                          jwt,
                          {
                              "content": delivery
                          },
                          delivery_key
                      )

                      if comment_response.status_code not in (
                          200,
                          201
                      ):

                          failures.append(
                              {
                                  "timestamp": utc_iso(),
                                  "task_id": task_id,
                                  "type": "DELIVERY",
                                  "reason": (
                                      "Delivery comment "
                                      "creation failed."
                                  ),
                                  "status_code": (
                                      comment_response
                                      .status_code
                                  )
                              }
                          )

                          execution_failures += 1
                          continue

                      executions_this_run += 1
                      deliveries_this_run += 1

                      executions.append(
                          {
                              "timestamp": utc_iso(),
                              "task_id": task_id,
                              "title": title,
                              "status": "completed"
                          }
                      )

                      deliveries.append(
                          {
                              "timestamp": utc_iso(),
                              "task_id": task_id,
                              "title": title,
                              "delivery": delivery,
                              "status": "delivered"
                          }
                      )

                      print(
                          "Delivery completed: "
                          f"{task_id}"
                      )

                  except Exception as exc:

                      failures.append(
                          {
                              "timestamp": utc_iso(),
                              "task_id": task_id,
                              "type": "TECHNICAL",
                              "reason": str(exc)[:1000]
                          }
                      )

                      execution_failures += 1


          # ============================================================
          # PAYMENT OBSERVATION
          # ============================================================

          print("")
          print("=== PAYMENT OBSERVATION ===")

          payments = memory.get(
              "payments",
              []
          )

          payments_observed = 0

          observed_task_ids = set()

          for tracked in tracked_bids:

              task_id = tracked.get(
                  "task_id"
              )

              if task_id:
                  observed_task_ids.add(
                      str(task_id)
                  )

          for task_id in list(
              observed_task_ids
          )[:MAX_RECONCILE]:

              try:

                  payment_response = get_api(
                      f"/marketplace/{task_id}/payment",
                      jwt
                  )

                  if (
                      payment_response.status_code
                      != 200
                  ):
                      continue

                  payment_data = (
                      payment_response.json()
                  )

                  if payment_data:

                      payments.append(
                          {
                              "timestamp": utc_iso(),
                              "task_id": task_id,
                              "payment": payment_data
                          }
                      )

                      payments_observed += 1

              except Exception:
                  continue

          memory["payments"] = (
              payments[
                  -MAX_MEMORY_ITEMS:
              ]
          )

          print(
              f"Payments observed: "
              f"{payments_observed}"
          )
          print(
              "Payment creation: DISABLED"
          )
          print(
              "Spending: DISABLED"
          )


          # ============================================================
          # MEMORY SAVE
          # ============================================================

          memory["executions"] = (
              executions[
                  -MAX_MEMORY_ITEMS:
              ]
          )

          memory["deliveries"] = (
              deliveries[
                  -MAX_MEMORY_ITEMS:
              ]
          )

          memory["failures"] = (
              failures[
                  -MAX_FAILURE_MEMORY:
              ]
          )

          memory["research"] = (
              research_memory[
                  -MAX_TASK_MEMORY:
              ]
          )

          memory["last_run"] = utc_iso()

          memory["last_run_summary"] = {
              "tasks_found": len(tasks),
              "tasks_evaluated": evaluated,
              "intelligent_candidates": len(
                  candidates
              ),
              "bids_created": bids_created,
              "bid_errors": bid_errors,
              "rate_limited": rate_limited,
              "accepted_missions": len(
                  accepted_missions
              ),
              "executions": executions_this_run,
              "deliveries": deliveries_this_run,
              "execution_failures": (
                  execution_failures
              ),
              "payments_observed": (
                  payments_observed
              )
          }

          save_json(
              MARKETPLACE_FILE,
              memory
          )


          # ============================================================
          # FINAL LOG
          # ============================================================

          print("")
          print("==============================================")
          print("=== LEDGER 04 V4.1 COMPLETE ================")
          print("==============================================")

          print(
              f"Identity: {resolved_identity}"
          )
          print(
              f"Tasks found: {len(tasks)}"
          )
          print(
              f"Tasks evaluated: {evaluated}"
          )
          print(
              "Intelligent candidates: "
              f"{len(candidates)}"
          )
          print(
              f"Bids created: {bids_created}"
          )
          print(
              f"Bid errors: {bid_errors}"
          )
          print(
              "Rate limited: "
              + (
                  "YES"
                  if rate_limited
                  else "NO"
              )
          )
          print(
              "Recent local bid attempts: "
              f"{len(memory['bid_attempts'])}"
          )
          print(
              "Tracked bids: "
              f"{len(memory['tracked_bids'])}"
          )
          print(
              "Accepted missions: "
              f"{len(accepted_missions)}"
          )
          print(
              f"Executions: {executions_this_run}"
          )
          print(
              f"Deliveries: {deliveries_this_run}"
          )
          print(
              "Execution failures: "
              f"{execution_failures}"
          )
          print(
              f"Payments observed: "
              f"{payments_observed}"
          )

          final_cooldown = int(
              memory.get(
                  "bid_cooldown_until",
                  0
              )
              or 0
          )

          if final_cooldown > now_ts():

              print(
                  "Bid cooldown: ACTIVE"
              )
              print(
                  "Cooldown until: "
                  f"{utc_iso(final_cooldown)}"
              )

          else:
              print(
                  "Bid cooldown: INACTIVE"
              )

          print(
              "Web research: "
              f"{WEB_RESEARCH_ENABLED}"
          )
          print("Gemini: False")
          print("External AI: False")
          print("Payments: False")
          print("Spending: False")
          print("Project cost: €0")

          print("==============================================")
          PY

      - name: Commit marketplace memory
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_ledger_marketplace.json

          if git diff --cached --quiet; then
            echo "No marketplace memory changes to commit."
            exit 0
          fi

          git commit -m "chore: update Ledger 04 marketplace memory"
          git push
