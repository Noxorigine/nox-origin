                  + clarity_score * 0.15
                  + research_score * 0.10
                  + reward_score * 0.10
                  + concordance_score * 0.30
                  + historical_bonus
                  - historical_penalty
              )

              score = int(round(score))

              if score < BID_SCORE_THRESHOLD:
