name: NØX LEDGER 04 - Marketplace Execution V5.2

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      MIN_BID_SATS: "21"
      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "1"
      MAX_QUEUE_SIZE: "100"
      MAX_RECONCILE: "30"
      MAX_RETRIES: "3"

      MIN_FEASIBILITY_SCORE: "55"
      MIN_LEDGER_MATCHES: "2"
      MIN_CAPABILITY_GROUPS: "1"

      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      HTTP_TIMEOUT_SECONDS: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Marketplace execution engine
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.parse import quote

          import requests

          API = os.environ["API_BASE"].rstrip("/")
          KEY = os.environ["COLONY_API_KEY"]
          IDENTITY = os.environ["NOX_IDENTITY"]

          MIN_BID = int(os.environ["MIN_BID_SATS"])
          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_BIDS = int(os.environ["MAX_BIDS_PER_RUN"])
          MAX_QUEUE = int(os.environ["MAX_QUEUE_SIZE"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])
          MAX_RETRIES = int(os.environ["MAX_RETRIES"])

          MIN_FEAS = int(
              os.environ["MIN_FEASIBILITY_SCORE"]
          )

          MIN_LEDGER = int(
              os.environ["MIN_LEDGER_MATCHES"]
          )

          MIN_CAPS = int(
              os.environ["MIN_CAPABILITY_GROUPS"]
          )

          EXECUTION_ENABLED = (
              os.environ["EXECUTION_ENABLED"].lower()
              == "true"
          )

          MAX_EXEC = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )

          MAX_DELIVERY = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          TIMEOUT = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )

          MEMORY_DIR = "memory"

          MARKET = os.path.join(
              MEMORY_DIR,
              "nox_ledger_marketplace.json"
          )

          KNOW = os.path.join(
              MEMORY_DIR,
              "nox_ledger_knowledge.json"
          )

          COG = os.path.join(
              MEMORY_DIR,
              "nox_ledger_cognition.json"
          )

          ACT = os.path.join(
              MEMORY_DIR,
              "nox_ledger_action.json"
          )

          os.makedirs(
              MEMORY_DIR,
              exist_ok=True
          )

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()

          def load(path, default):
              try:
                  with open(
                      path,
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)
              except Exception:
                  return default

          def save(path, data):
              temporary = path + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )

          def text(value):
              if isinstance(
                  value,
                  (dict, list)
              ):
                  return json.dumps(
                      value,
                      ensure_ascii=False
                  )

              if value is None:
                  return ""

              return str(value)

          def compact(
              value,
              limit=5000
          ):
              return re.sub(
                  r"\s+",
                  " ",
                  text(value)
              ).strip()[:limit]

          def integer(
              value,
              default=0
          ):
              try:
                  return int(
                      float(
                          str(value).replace(
                              ",",
                              ""
                          )
                      )
                  )
              except Exception:
                  return default

          def task_id(task):
              if not isinstance(
                  task,
                  dict
              ):
                  return None

              for key in (
                  "task_id",
                  "taskId",
                  "id",
              ):
                  if task.get(key) is not None:
                      return str(
                          task[key]
                      )

              return None

          def task_text(task):
              keys = (
                  "title",
                  "name",
                  "description",
                  "details",
                  "requirements",
                  "deliverable",
                  "body",
                  "tags",
              )

              return compact(
                  " ".join(
                      text(task.get(key))
                      for key in keys
                      if (
                          isinstance(task, dict)
                          and task.get(key) is not None
                      )
                  ),
                  12000
              )

          def reward(task):
              low = 0
              high = 0

              if not isinstance(
                  task,
                  dict
              ):
                  return 0, 0

              for key in (
                  "reward_low",
                  "rewardLow",
                  "min_reward",
                  "minReward",
              ):
                  if task.get(key) is not None:
                      low = integer(
                          task[key]
                      )
                      break

              for key in (
                  "reward_high",
                  "rewardHigh",
                  "max_reward",
                  "maxReward",
              ):
                  if task.get(key) is not None:
                      high = integer(
                          task[key]
                      )
                      break

              raw_reward = task.get(
                  "reward"
              )

              if isinstance(
                  raw_reward,
                  dict
              ):
                  low = low or integer(
                      raw_reward.get("low")
                      or raw_reward.get("min")
                      or raw_reward.get("minimum")
                  )

                  high = high or integer(
                      raw_reward.get("high")
                      or raw_reward.get("max")
                      or raw_reward.get("maximum")
                  )

              elif raw_reward is not None:
                  value = integer(
                      raw_reward
                  )
                  low = low or value
                  high = high or value

              values = [
                  integer(value)
                  for value in re.findall(
                      r"(?<!\d)(\d[\d,]*)\s*"
                      r"(?:sats?|sat|satoshi)\b",
                      task_text(task),
                      re.I
                  )
              ]

              if not low and values:
                  low = min(values)

              if not high and values:
                  high = max(values)

              return (
                  max(0, low),
                  max(0, high)
              )

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "NOX-Ledger-04-V5.2",
          })

          def api_get(
              path,
              params=None
          ):
              return session.get(
                  API + path,
                  params=params,
                  timeout=TIMEOUT
              )

          def api_post(
              path,
              payload=None,
              headers=None
          ):
              return session.post(
                  API + path,
                  json=payload or {},
                  headers=headers or {},
                  timeout=TIMEOUT
              )

          print(
              "=== NØX LEDGER 04 - "
              "MARKETPLACE EXECUTION V5.2 ==="
          )

          print(
              "DISCOVER -> UNDERSTAND -> CHOOSE "
              "-> QUEUE -> ACT -> VERIFY -> LEARN"
          )

          print(
              "External AI: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )

          print(
              "Project cost: €0"
          )

          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          print("")
          print("=== AUTHENTICATION ===")

          auth = api_post(
              "/auth/token",
              {
                  "api_key": KEY
              }
          )

          auth.raise_for_status()

          auth_data = auth.json()

          token = (
              auth_data.get(
                  "access_token"
              )
              or auth_data.get(
                  "token"
              )
              or auth_data.get(
                  "jwt"
              )
          )

          if not token:
              raise RuntimeError(
                  "No JWT returned by authentication endpoint."
              )

          session.headers[
              "Authorization"
          ] = f"Bearer {token}"

          print(
              "JWT obtained: YES"
          )

          # ==========================================================
          # IDENTITY
          # ==========================================================

          print("")
          print("=== IDENTITY ===")

          me = api_get(
              "/users/me"
          )

          me.raise_for_status()

          me_data = me.json()

          identity_values = {
              str(
                  me_data.get(key)
              ).strip().lower()
              for key in (
                  "username",
                  "handle",
                  "agent_id",
                  "agentId",
                  "id",
                  "name",
              )
              if me_data.get(key) is not None
          }

          if (
              IDENTITY.lower()
              not in identity_values
          ):
              raise RuntimeError(
                  "Identity mismatch; "
                  "execution stopped."
              )

          print(
              f"IDENTITY: {IDENTITY}"
          )

          # ==========================================================
          # MEMORY
          # ==========================================================

          knowledge = load(
              KNOW,
              {}
          )

          cognition = load(
              COG,
              {}
          )

          action_memory = load(
              ACT,
              {}
          )

          marketplace = load(
              MARKET,
              {}
          )

          if not isinstance(
              marketplace,
              dict
          ):
              marketplace = {}

          queue = marketplace.get(
              "action_queue",
              []
          )

          if not isinstance(
              queue,
              list
          ):
              queue = []

          ledger_matches = sum(
              bool(value)
              for value in (
                  knowledge,
                  cognition,
                  action_memory,
              )
          )

          # ==========================================================
          # CLASSIFICATION
          # ==========================================================

          BLOCKED = (
              "ransomware",
              "malware",
              "credential theft",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos",
              "explosive",
              "weapon",
              "financial fraud",
              "money laundering",
          )

          HUMAN_ONLY = (
              "in person",
              "physical delivery",
              "visit my house",
              "meet in person",
              "on-site physical",
          )

          CAPABILITIES = {
              "api": (
                  "api",
                  "endpoint",
                  "webhook",
                  "json",
              ),
              "python": (
                  "python",
                  "script",
                  "automation",
                  "automate",
              ),
              "coding": (
                  "code",
                  "coding",
                  "programming",
                  "developer",
                  "software",
              ),
              "testing": (
                  "test",
                  "testing",
                  "qa",
                  "debug",
                  "bug",
                  "validation",
              ),
              "research": (
                  "research",
                  "web research",
                  "deep research",
                  "market research",
                  "technical research",
                  "competitive research",
                  "fact checking",
                  "source verification",
                  "investigate",
                  "analysis",
              ),
              "data": (
                  "data",
                  "dataset",
                  "spreadsheet",
                  "csv",
                  "data analysis",
              ),
              "documentation": (
                  "documentation",
                  "document",
                  "report",
                  "write a report",
                  "report writing",
              ),
              "github": (
                  "github",
                  "repository",
                  "repo",
                  "pull request",
                  "issue",
                  "workflow",
              ),
              "agent_tooling": (
                  "agent tooling",
                  "build agent tools",
                  "tool development",
                  "ai agent",
              ),
          }

          def capability_matches(value):
              lowered = value.lower()

              return [
                  group
                  for group, terms
                  in CAPABILITIES.items()
                  if any(
                      term in lowered
                      for term in terms
                  )
              ]

          def blocked_task(value):
              lowered = value.lower()

              return (
                  any(
                      term in lowered
                      for term in BLOCKED
                  )
                  or any(
                      term in lowered
                      for term in HUMAN_ONLY
                  )
              )

          def service_offer(value):
              lowered = value.lower()

              offer_terms = (
                  "i can do",
                  "i offer",
                  "available for",
                  "hire me",
                  "my service",
                  "my services",
                  "offering",
              )

              request_terms = (
                  "task",
                  "need",
                  "looking for",
                  "please",
                  "request",
                  "deliver",
                  "find",
                  "research",
                  "build",
                  "create",
                  "write",
                  "fix",
                  "analyze",
              )

              return (
                  any(
                      term in lowered
                      for term in offer_terms
                  )
                  and not any(
                      term in lowered
                      for term in request_terms
                  )
              )

          def feasibility(
              task,
              matches
          ):
              content = task_text(
                  task
              )

              if (
                  blocked_task(content)
                  or len(matches) < MIN_CAPS
              ):
                  return 0

              score = 50

              score += min(
                  25,
                  len(matches) * 5
              )

              if any(
                  term in content.lower()
                  for term in (
                      "deliver",
                      "report",
                      "analysis",
                      "result",
                      "summary",
                      "code",
                      "research",
                  )
              ):
                  score += 10

              low, high = reward(
                  task
              )

              if low or high:
                  score += 5

              return min(
                  100,
                  score
              )

          # ==========================================================
          # DISCOVERY
          # ==========================================================

          print("")
          print(
              "=== MARKETPLACE DISCOVERY ==="
          )

          tasks = []

          discovery_attempts = (
              {
                  "status": "open",
                  "sort": "new",
                  "limit": MAX_TASKS,
                  "offset": 0,
              },
              {
                  "status": "open",
                  "limit": MAX_TASKS,
                  "offset": 0,
              },
          )

          for index, params in enumerate(
              discovery_attempts,
              start=1
          ):
              response = api_get(
                  "/marketplace/tasks",
                  params=params
              )

              print(
                  f"DISCOVERY REQUEST {index}: "
                  f"HTTP {response.status_code}"
              )

              if response.status_code >= 400:
                  print(
                      "DISCOVERY ERROR: "
                      + compact(
                          response.text,
                          800
                      )
                  )
                  continue

              try:
                  payload = response.json()
              except Exception:
                  continue

              if isinstance(
                  payload,
                  list
              ):
                  tasks = payload

              elif isinstance(
                  payload,
                  dict
              ):
                  print(
                      "DISCOVERY RESPONSE KEYS: "
                      + ", ".join(
                          sorted(
                              map(
                                  str,
                                  payload.keys()
                              )
                          )[:20]
                      )
                  )

                  tasks = (
                      payload.get("items")
                      or payload.get("tasks")
                      or payload.get("data")
                      or payload.get("results")
                      or []
                  )

              if (
                  isinstance(
                      tasks,
                      list
                  )
                  and tasks
              ):
                  print(
                      "DISCOVERY SOURCE: "
                      f"REQUEST {index}"
                  )
                  break

          if not isinstance(
              tasks,
              list
          ):
              tasks = []

          tasks = tasks[:MAX_TASKS]

          print(
              f"TASKS FOUND: {len(tasks)}"
          )

          # ==========================================================
          # CANDIDATE SELECTION
          # ==========================================================

          candidates = 0
          queued = 0

          for task in tasks:
              tid = task_id(
                  task
              )

              content = task_text(
                  task
              )

              matches = capability_matches(
                  content
              )

              if not tid:
                  continue

              if blocked_task(
                  content
              ):
                  continue

              if service_offer(
                  content
              ):
                  continue

              if len(matches) < MIN_CAPS:
                  continue

              feasibility_score = feasibility(
                  task,
                  matches
              )

              if (
                  feasibility_score
                  < MIN_FEAS
              ):
                  continue

              if (
                  ledger_matches
                  < MIN_LEDGER
              ):
                  continue

              candidates += 1

              already_queued = any(
                  str(item.get("task_id"))
                  == str(tid)
                  for item in queue
              )

              if already_queued:
                  continue

              if (
                  len(queue)
                  >= MAX_QUEUE
              ):
                  continue

              low, high = reward(
                  task
              )

              queue.append({
                  "task_id": tid,
                  "status": "QUEUED",
                  "next_action": "BID",
                  "retry_count": 0,
                  "reward_low": low,
                  "reward_high": high,
                  "capabilities": matches,
                  "feasibility_score":
                      feasibility_score,
                  "created_at": now(),
                  "updated_at": now(),
                  "bid_id": None,
                  "bid_amount_sats": None,
                  "bid_submitted": False,
                  "accepted": False,
                  "verified": False,
                  "last_error": None,
                  "history": [
                      {
                          "timestamp": now(),
                          "event": "QUEUED",
                      }
                  ],
              })

              queued += 1

          print(
              f"Candidates: {candidates}"
          )

          print(
              f"NEW ACTIONS QUEUED: {queued}"
          )

          print(
              f"QUEUE SIZE: {len(queue)}"
          )

          # ==========================================================
          # EXISTING BID
          # ==========================================================

          def existing_bid(
              tid
          ):
              response = api_get(
                  "/marketplace/"
                  f"{quote(str(tid), safe='')}"
                  "/bids"
              )

              if response.status_code >= 400:
                  return None

              try:
                  payload = response.json()
              except Exception:
                  return None

              if isinstance(
                  payload,
                  list
              ):
                  rows = payload
              elif isinstance(
                  payload,
                  dict
              ):
                  rows = (
                      payload.get("items")
                      or payload.get("bids")
                      or payload.get("data")
                      or []
                  )
              else:
                  rows = []

              if not isinstance(
                  rows,
                  list
              ):
                  return None

              for bid in rows:
                  if not isinstance(
                      bid,
                      dict
                  ):
                      continue

                  values = {
                      str(
                          bid.get(key)
                      ).strip().lower()
                      for key in (
                          "username",
                          "handle",
                          "agent_id",
                          "agentId",
                          "user_id",
                          "userId",
                      )
                      if bid.get(key) is not None
                  }

                  if (
                      IDENTITY.lower()
                      in values
                  ):
                      return bid

              return None

          # ==========================================================
          # BID PROCESSOR
          # ==========================================================

          print("")
          print(
              "=== ACTION PROCESSOR ==="
          )

          bids_submitted = 0
          retries = 0
          executions_attempted = 0
          executions_completed = 0
          research_sources = 0

          for action in queue[
              :MAX_RECONCILE
          ]:

              if (
                  action.get(
                      "next_action"
                  )
                  != "BID"
              ):
                  continue

              if (
                  bids_submitted
                  >= MAX_BIDS
              ):
                  break

              tid = action.get(
                  "task_id"
              )

              existing = existing_bid(
                  tid
              )

              if existing:
                  status = text(
                      existing.get("status")
                      or existing.get("state")
                  ).lower()

                  action[
                      "bid_id"
                  ] = (
                      existing.get("bid_id")
                      or existing.get("bidId")
                      or existing.get("id")
                  )

                  if status in (
                      "accepted",
                      "approved",
                      "won",
                      "winning",
                      "selected",
                  ):
                      action[
                          "accepted"
                      ] = True

                      action[
                          "status"
                      ] = "ACCEPTED"

                      action[
                          "next_action"
                      ] = "EXECUTE"

                      continue

                  if status in (
                      "pending",
                      "submitted",
                      "active",
                      "open",
                      "bidding",
                      "under_review",
                      "review",
                  ):
                      action[
                          "status"
                      ] = "PENDING"

                      action[
                          "next_action"
                      ] = "WAIT"

                      continue

              low = integer(
                  action.get(
                      "reward_low"
                  )
              )

              # 21 sats is ONLY the API technical floor.
              # It is NOT an economic minimum.
              amount = max(
                  MIN_BID,
                  low
              )

              print("")
              print(
                  "=== BID ATTEMPT ==="
              )

              print(
                  f"TASK ID: {tid}"
              )

              print(
                  f"REWARD LOW: {low}"
              )

              print(
                  "REWARD HIGH: "
                  f"{integer(action.get('reward_high'))}"
              )

              print(
                  f"BID AMOUNT: {amount} sats"
              )

              print(
                  f"BID PAYLOAD: amount={amount}"
              )

              idempotency = hashlib.sha256(
                  (
                      f"{IDENTITY}:"
                      f"{tid}:bid"
                  ).encode()
              ).hexdigest()

              bid_payload = {
                  "amount": amount,
                  "message": (
                      "NØX can execute this task "
                      "using local autonomous "
                      "research, analysis, coding, "
                      "API, automation and "
                      "documentation capabilities "
                      "without external AI or "
                      "paid services."
                  ),
              }

              response = api_post(
                  "/marketplace/"
                  f"{quote(str(tid), safe='')}"
                  "/bid",
                  bid_payload,
                  {
                      "Idempotency-Key":
                          idempotency
                  }
              )

              print(
                  "BID HTTP STATUS: "
                  f"{response.status_code}"
              )

              if response.status_code >= 400:
                  error = compact(
                      response.text,
                      1200
                  )

                  print(
                      "BID ERROR BODY: "
                      f"{error}"
                  )

                  action[
                      "last_error"
                  ] = (
                      f"BID_HTTP_"
                      f"{response.status_code}: "
                      f"{error}"
                  )

                  if (
                      action.get(
                          "retry_count",
                          0
                      )
                      < MAX_RETRIES
                  ):
                      action[
                          "retry_count"
                      ] = (
                          action.get(
                              "retry_count",
                              0
                          ) + 1
                      )

                      action[
                          "status"
                      ] = "RETRY"

                      action[
                          "next_action"
                      ] = "BID"

                      retries += 1

                  else:
                      action[
                          "status"
                      ] = "FAILED"

                      action[
                          "next_action"
                      ] = "NONE"

                  continue

              try:
                  bid_response = (
                      response.json()
                  )
              except Exception:
                  bid_response = {}

              nested_bid = (
                  bid_response.get("bid")
                  if isinstance(
                      bid_response,
                      dict
                  )
                  else {}
              )

              if not isinstance(
                  nested_bid,
                  dict
              ):
                  nested_bid = {}

              bid_id = (
                  bid_response.get("bid_id")
                  or bid_response.get("bidId")
                  or bid_response.get("id")
                  or nested_bid.get("bid_id")
                  or nested_bid.get("bidId")
                  or nested_bid.get("id")
              )

              action[
                  "bid_id"
              ] = bid_id

              action[
                  "bid_amount_sats"
              ] = amount

              action[
                  "bid_submitted"
              ] = True

              action[
                  "status"
              ] = "PENDING"

              action[
                  "next_action"
              ] = "WAIT"

              action[
                  "updated_at"
              ] = now()

              action.setdefault(
                  "history",
                  []
              ).append({
                  "timestamp": now(),
                  "event": "BID_SUBMITTED",
                  "bid_id": bid_id,
                  "amount_sats": amount,
              })

              bids_submitted += 1

              print("")
              print(
                  "=== BID SUCCESS ==="
              )

              print(
                  "BID SUBMITTED: YES"
              )

              print(
                  "BID ID: "
                  f"{bid_id}"
              )

              print(
                  "BID AMOUNT: "
                  f"{amount} sats"
              )

          # ==========================================================
          # PERSISTENCE
          # ==========================================================

          marketplace[
              "action_queue"
          ] = queue[
              -MAX_QUEUE:
          ]

          marketplace[
              "updated_at"
          ] = now()

          marketplace[
              "last_run"
          ] = {
              "tasks_found": len(tasks),
              "candidates": candidates,
              "new_queued": queued,
              "bids_submitted":
                  bids_submitted,
              "executions_attempted":
                  executions_attempted,
              "executions_completed":
                  executions_completed,
              "retries": retries,
              "research_sources":
                  research_sources,
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0,
          }

          observations = marketplace.get(
              "observations",
              []
          )

          if not isinstance(
              observations,
              list
          ):
              observations = []

          observations.append({
              "timestamp": now(),
              **marketplace["last_run"],
          })

          marketplace[
              "observations"
          ] = observations[
              -500:
          ]

          save(
              MARKET,
              marketplace
          )

          # ==========================================================
          # FINAL STATE
          # ==========================================================

          print("")
          print(
              "=== FINAL RUN STATE ==="
          )

          print(
              f"TASKS FOUND: {len(tasks)}"
          )

          print(
              f"CANDIDATES: {candidates}"
          )

          print(
              f"NEW QUEUED: {queued}"
          )

          print(
              "BIDS SUBMITTED: "
              f"{bids_submitted}"
          )

          print(
              "EXECUTIONS ATTEMPTED: "
              f"{executions_attempted}"
          )

          print(
              "EXECUTIONS COMPLETED: "
              f"{executions_completed}"
          )

          print(
              f"RETRIES: {retries}"
          )

          print(
              "RESEARCH SOURCES: "
              f"{research_sources}"
          )

          print(
              "PERSISTENT QUEUE: "
              f"{len(queue)}"
          )

          print(
              "GEMINI USED: false"
          )

          print(
              "EXTERNAL AI USED: false"
          )

          print(
              "PAYMENTS ENABLED: false"
          )

          print(
              "SPENDING ENABLED: false"
          )

          print(
              "PROJECT COST EUR: 0"
          )

          if (
              bids_submitted > 0
              or executions_completed > 0
          ):
              print(
                  "RESULT: ACTION(S) PROCESSED"
              )
          else:
              print(
                  "RESULT: NO ACTION READY "
                  "FOR EXECUTION"
              )

          PY

