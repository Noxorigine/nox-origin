name: NØX LEDGER 04 - Marketplace Execution V3

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: "https://thecolony.ai/api/v1"
      NOX_IDENTITY: "nox_origine"

      # HARD PROJECT CONSTRAINTS
      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # DISCOVERY
      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      # BIDDING
      MAX_BIDS_PER_RUN: "2"
      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "70"
      MIN_FEASIBILITY_SCORE: "75"

      # EXECUTION
      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      # RESEARCH
      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      # MEMORY
      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      # SAFETY
      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX Ledger 04
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          NOX_IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])

          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])
          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(os.environ["BID_SCORE_THRESHOLD"])
          MIN_FEASIBILITY_SCORE = int(os.environ["MIN_FEASIBILITY_SCORE"])

          EXECUTION_ENABLED = os.environ["EXECUTION_ENABLED"].lower() == "true"
          MAX_EXECUTIONS_PER_RUN = int(os.environ["MAX_EXECUTIONS_PER_RUN"])
          MAX_DELIVERY_CHARS = int(os.environ["MAX_DELIVERY_CHARS"])

          WEB_RESEARCH_ENABLED = os.environ["WEB_RESEARCH_ENABLED"].lower() == "true"
          MAX_WEB_SOURCES = int(os.environ["MAX_WEB_SOURCES"])
          HTTP_TIMEOUT_SECONDS = int(os.environ["HTTP_TIMEOUT_SECONDS"])
          MAX_SOURCE_BYTES = int(os.environ["MAX_SOURCE_BYTES"])

          MAX_MEMORY_ITEMS = int(os.environ["MAX_MEMORY_ITEMS"])
          MAX_TASK_MEMORY = int(os.environ["MAX_TASK_MEMORY"])
          MAX_FAILURE_MEMORY = int(os.environ["MAX_FAILURE_MEMORY"])

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ["REQUIRE_CLEAR_DELIVERABLE"].lower() == "true"
          )
          REQUIRE_ZERO_COST_EXECUTION = (
              os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower() == "true"
          )
          REQUIRE_NO_EXTERNAL_AI = (
              os.environ["REQUIRE_NO_EXTERNAL_AI"].lower() == "true"
          )

          MEMORY_MARKETPLACE = "memory/nox_ledger_marketplace.json"
          MEMORY_ACTION = "memory/nox_ledger_action.json"
          MEMORY_KNOWLEDGE = "memory/nox_ledger_knowledge.json"
          MEMORY_COGNITION = "memory/nox_ledger_cognition.json"

          API_TIMEOUT = 25

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Ledger-04/3.0"
          })


          # ============================================================
          # HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def normalize(value):
              if value is None:
                  return ""
              if isinstance(value, (dict, list)):
                  try:
                      return json.dumps(value, ensure_ascii=False)
                  except Exception:
                      return str(value)
              return str(value)


          def compact(text, limit=700):
              text = normalize(text)
              text = re.sub(r"\s+", " ", text).strip()
              return text[:limit]


          def load_json(path, default):
              try:
                  if not os.path.exists(path):
                      return default
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"MEMORY READ WARNING: {path}: {compact(exc)}")
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)
              if directory:
                  os.makedirs(directory, exist_ok=True)

              temp = path + ".tmp"

              with open(temp, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(temp, path)


          def trim_list(items, limit):
              if not isinstance(items, list):
                  return []

              return items[-limit:]


          def stable_id(prefix, value):
              digest = hashlib.sha256(
                  normalize(value).encode("utf-8")
              ).hexdigest()[:20]
              return f"{prefix}-{digest}"


          def idempotency_key(action, task_id):
              return stable_id(
                  f"nox-ledger04-{action}",
                  f"{NOX_IDENTITY}:{task_id}:{action}:{datetime.now(timezone.utc).strftime('%Y-%m-%d-%H')}"
              )


          def extract_text(value, depth=0):
              if depth > 5:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      extract_text(v, depth + 1)
                      for v in value[:100]
                  )

              if isinstance(value, dict):
                  parts = []
                  for key, val in list(value.items())[:200]:
                      parts.append(str(key))
                      parts.append(extract_text(val, depth + 1))
                  return " ".join(parts)

              return ""


          def recursive_values(obj, wanted_keys, depth=0):
              if depth > 6:
                  return []

              results = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key.lower() in wanted_keys:
                          results.append(value)

                      results.extend(
                          recursive_values(
                              value,
                              wanted_keys,
                              depth + 1
                          )
                      )

              elif isinstance(obj, list):
                  for value in obj[:200]:
                      results.extend(
                          recursive_values(
                              value,
                              wanted_keys,
                              depth + 1
                          )
                      )

              return results


          def first_string(obj, keys):
              wanted = {k.lower() for k in keys}

              values = recursive_values(obj, wanted)

              for value in values:
                  if isinstance(value, str) and value.strip():
                      return value.strip()

                  if isinstance(value, (int, float)):
                      return str(value)

              return ""


          def first_number(obj, keys):
              wanted = {k.lower() for k in keys}

              values = recursive_values(obj, wanted)

              for value in values:
                  try:
                      if isinstance(value, (int, float)):
                          return float(value)

                      text = normalize(value).strip()
                      if re.fullmatch(r"\d+(?:\.\d+)?", text):
                          return float(text)

                  except Exception:
                      pass

              return None


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          if not API_KEY:
              raise SystemExit("COLONY_API_KEY secret is missing.")

          print("==============================================")
          print("=== NØX LEDGER 04 - MARKETPLACE EXECUTION ===")
          print("=== V3 COGNITIVE MARKETPLACE ENGINE       ===")
          print("==============================================")

          print()
          print("=== AUTHENTICATION ===")

          token_response = requests.post(
              f"{API_BASE}/auth/token",
              json={"api_key": API_KEY},
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "Nox-Ledger-04/3.0"
              },
              timeout=API_TIMEOUT
          )

          if token_response.status_code >= 400:
              raise SystemExit(
                  f"AUTH ERROR: POST /auth/token -> "
                  f"{token_response.status_code}: "
                  f"{compact(token_response.text, 500)}"
              )

          token_data = token_response.json()
          access_token = normalize(
              token_data.get("access_token")
          ).strip()

          if not access_token:
              raise SystemExit("AUTH ERROR: access_token missing.")

          token_type = normalize(
              token_data.get("token_type", "Bearer")
          ).strip() or "Bearer"

          session.headers["Authorization"] = (
              f"{token_type.capitalize()} {access_token}"
          )

          print("JWT obtained: YES")
          print("API key used only for token exchange: YES")
          print("Bearer credential: JWT")
          print("JWT value: HIDDEN")

          # ------------------------------------------------------------
          # API helpers
          # ------------------------------------------------------------

          def api_get(path, params=None):
              response = session.get(
                  f"{API_BASE}{path}",
                  params=params,
                  timeout=API_TIMEOUT
              )

              if response.status_code == 401:
                  raise RuntimeError(
                      f"401 unauthorized: GET {path}"
                  )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"GET {path} -> "
                      f"{response.status_code}: "
                      f"{compact(response.text, 500)}"
                  )

              try:
                  return response.json()
              except Exception:
                  return {}


          def api_post(path, payload=None, extra_headers=None):
              headers = {}

              if extra_headers:
                  headers.update(extra_headers)

              response = session.post(
                  f"{API_BASE}{path}",
                  json=payload or {},
                  headers=headers,
                  timeout=API_TIMEOUT
              )

              return response


          # ============================================================
          # IDENTITY
          # ============================================================

          try:
              me = api_get("/users/me")

              identity = (
                  first_string(
                      me,
                      [
                          "username",
                          "handle",
                          "name",
                          "identity"
                      ]
                  )
                  or NOX_IDENTITY
              )

              print()
              print(f"IDENTITY: {identity}")

          except Exception as exc:
              raise SystemExit(
                  f"IDENTITY ERROR: {compact(exc)}"
              )


          # ============================================================
          # LOAD OTHER LEDGERS
          # ============================================================

          ledger01 = load_json(MEMORY_KNOWLEDGE, {})
          ledger02 = load_json(MEMORY_COGNITION, {})
          ledger03 = load_json(MEMORY_ACTION, {})
          marketplace_memory = load_json(
              MEMORY_MARKETPLACE,
              {}
          )

          ledger01_text = extract_text(ledger01)
          ledger02_text = extract_text(ledger02)
          ledger03_text = extract_text(ledger03)

          shared_knowledge_text = " ".join([
              ledger01_text,
              ledger02_text,
              ledger03_text
          ])

          print()
          print("=== INTER-LEDGER CONTEXT ===")
          print(
              f"Ledger 01 knowledge loaded: "
              f"{'YES' if ledger01 else 'NO'}"
          )
          print(
              f"Ledger 02 cognition loaded: "
              f"{'YES' if ledger02 else 'NO'}"
          )
          print(
              f"Ledger 03 action/learning loaded: "
              f"{'YES' if ledger03 else 'NO'}"
          )


          # ============================================================
          # CAPABILITY MODEL
          # ============================================================

          CAPABILITY_GROUPS = {
              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "research brief",
                  "web research",
                  "market research",
                  "competitive research",
                  "fact checking",
                  "fact-checking",
                  "source analysis",
                  "information gathering"
              ],

              "writing": [
                  "writing",
                  "write",
                  "report writing",
                  "write a report",
                  "technical report",
                  "research report",
                  "documentation",
                  "copywriting",
                  "content writing",
                  "analysis",
                  "brief",
                  "summary"
              ],

              "seo": [
                  "seo",
                  "seo audit",
                  "search optimization",
                  "keyword research",
                  "competitor analysis"
              ],

              "qa": [
                  "qa",
                  "quality assurance",
                  "api smoke test",
                  "api testing",
                  "testing",
                  "test endpoints",
                  "bug finding",
                  "bug report"
              ],

              "data": [
                  "data cleanup",
                  "data cleaning",
                  "csv",
                  "json",
                  "data analysis",
                  "data validation",
                  "spreadsheet",
                  "structured data"
              ],

              "agent_tools": [
                  "agent tooling",
                  "build agent tools",
                  "agent tools",
                  "tool development",
                  "automation",
                  "api integration",
                  "agent integration"
              ],

              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead research",
                  "prospect research"
              ],

              "cro": [
                  "cro",
                  "conversion rate",
                  "conversion optimization",
                  "landing page analysis"
              ]
          }


          def capability_matches(text):
              text = text.lower()

              matches = []

              for group, terms in CAPABILITY_GROUPS.items():
                  if any(term in text for term in terms):
                      matches.append(group)

              return matches


          # ============================================================
          # HARD BLOCKS
          # ============================================================

          HARD_BLOCKS = [
              "buy",
              "purchase",
              "pay for",
              "payment required",
              "credit card",
              "bank transfer",
              "paid api",
              "paid api key",
              "paid service",
              "subscription required",
              "aws billing",
              "azure billing",
              "gcp billing",
              "deploy to aws",
              "deploy on aws",
              "deploy to azure",
              "deploy on azure",
              "deploy to gcp",
              "deploy on gcp",
              "openai api key required",
              "gpt-4 api key",
              "gpt-5 api key",
              "gemini api key",
              "external ai required",
              "captcha solving",
              "credential required",
              "login required",
              "private account access",
              "wallet access",
              "send funds",
              "transfer funds",
              "financial transaction"
          ]


          def hard_block_reasons(text):
              lowered = text.lower()
              return [
                  term
                  for term in HARD_BLOCKS
                  if term in lowered
              ]


          # ============================================================
          # TASK HELPERS
          # ============================================================

          def task_id(task):
              return (
                  first_string(
                      task,
                      [
                          "id",
                          "post_id",
                          "task_id"
                      ]
                  )
              )


          def task_title(task):
              return first_string(
                  task,
                  [
                      "title",
                      "name"
                  ]
              )


          def task_body(task):
              return first_string(
                  task,
                  [
                      "description",
                      "body",
                      "content",
                      "details",
                      "task"
                  ]
              )


          def task_status(task):
              return first_string(
                  task,
                  [
                      "status"
                  ]
              ).lower()


          def reward_sats(task):
              return first_number(
                  task,
                  [
                      "reward_sats",
                      "budget_sats",
                      "amount_sats",
                      "min_reward_sats",
                      "max_reward_sats"
                  ]
              )


          def reward_unit_conflict(text):
              lowered = text.lower()

              explicit_sats = bool(
                  re.search(
                      r"\b\d[\d,.\s]*\s*(sats|sat|satoshi|satoshis)\b",
                      lowered
                  )
              )

              explicit_usdc = bool(
                  re.search(
                      r"\b(usdc|usd)\b",
                      lowered
                  )
              )

              return explicit_sats and explicit_usdc


          def has_clear_deliverable(text):
              deliverable_terms = [
                  "report",
                  "audit",
                  "analysis",
                  "document",
                  "brief",
                  "findings",
                  "results",
                  "list",
                  "csv",
                  "json",
                  "recommendations",
                  "test results",
                  "bug report",
                  "documentation",
                  "comparison",
                  "research"
              ]

              lowered = text.lower()

              return any(
                  term in lowered
                  for term in deliverable_terms
              )


          def requires_external_ai(text):
              lowered = text.lower()

              indicators = [
                  "use chatgpt",
                  "use gpt",
                  "use gpt-4",
                  "use gpt-5",
                  "use gemini",
                  "use claude",
                  "use anthropic",
                  "use openai",
                  "use external ai",
                  "llm api",
                  "model api"
              ]

              return any(
                  indicator in lowered
                  for indicator in indicators
              )


          def requires_paid_infrastructure(text):
              lowered = text.lower()

              indicators = [
                  "aws",
                  "azure",
                  "google cloud",
                  "gcp",
                  "paid hosting",
                  "paid server",
                  "paid database",
                  "subscription",
                  "premium api"
              ]

              return any(
                  indicator in lowered
                  for indicator in indicators
              )


          def extract_urls(text):
              urls = re.findall(
                  r"https?://[^\s<>\"]+",
                  text
              )

              clean = []

              for url in urls:
                  url = url.rstrip(".,);]")

                  try:
                      parsed = urlparse(url)

                      if parsed.scheme in ("http", "https"):
                          if parsed.netloc:
                              clean.append(url)

                  except Exception:
                      continue

              return list(dict.fromkeys(clean))


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print()
          print("=== MARKETPLACE DISCOVERY ===")

          try:
              task_data = api_get(
                  "/marketplace/tasks",
                  params={
                      "limit": MAX_TASKS
                  }
              )
          except Exception as exc:
              raise SystemExit(
                  f"MARKETPLACE DISCOVERY ERROR: {compact(exc)}"
              )

          if isinstance(task_data, list):
              tasks = task_data
          elif isinstance(task_data, dict):
              tasks = (
                  task_data.get("tasks")
                  or task_data.get("items")
                  or task_data.get("results")
                  or []
              )
          else:
              tasks = []

          print(f"TASKS FOUND: {len(tasks)}")


          # ============================================================
          # EXISTING BID RECONCILIATION
          # ============================================================

          print()
          print("=== BID RECONCILIATION ===")

          tracked_bids = (
              marketplace_memory.get("tracked_bids", [])
              if isinstance(marketplace_memory, dict)
              else []
          )

          if not isinstance(tracked_bids, list):
              tracked_bids = []

          reconciled = []
          reconcile_errors = 0

          for record in tracked_bids[:MAX_RECONCILE]:
              post_id = normalize(
                  record.get("task_id", "")
              ).strip()

              bid_id = normalize(
                  record.get("bid_id", "")
              ).strip()

              if not post_id:
                  continue

              try:
                  bids_data = api_get(
                      f"/marketplace/{post_id}/bids"
                  )

                  if isinstance(bids_data, list):
                      bids = bids_data
                  elif isinstance(bids_data, dict):
                      bids = (
                          bids_data.get("bids")
                          or bids_data.get("items")
                          or []
                      )
                  else:
                      bids = []

                  matched = None

                  for bid in bids:
                      current_bid_id = first_string(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      if bid_id and current_bid_id == bid_id:
                          matched = bid
                          break

                      bidder = first_string(
                          bid,
                          [
                              "username",
                              "handle",
                              "agent"
                          ]
                      )

                      if not bid_id and bidder == NOX_IDENTITY:
                          matched = bid
                          break

                  if matched:
                      status = first_string(
                          matched,
                          [
                              "status"
                          ]
                      ).lower()

                      record["status"] = status
                      record["last_reconciled_at"] = now_iso()

                      if status == "accepted":
                          record["accepted"] = True

                      if status == "rejected":
                          record["rejected"] = True

                  reconciled.append(record)

              except Exception as exc:
                  reconcile_errors += 1

                  record["reconcile_error"] = compact(exc)
                  record["last_reconciled_at"] = now_iso()

                  reconciled.append(record)

          tracked_bids = reconciled

          accepted_existing = [
              item
              for item in tracked_bids
              if item.get("accepted") is True
          ]

          pending_existing = [
              item
              for item in tracked_bids
              if item.get("status") in (
                  "pending",
                  "open",
                  "submitted"
              )
          ]

          print(f"Tracked bids: {len(tracked_bids)}")
          print(f"Accepted tracked: {len(accepted_existing)}")
          print(f"Pending tracked: {len(pending_existing)}")


          # ============================================================
          # PLATFORM RATE LIMIT
          # ============================================================

          print()
          print("=== PLATFORM ACTION BUDGET ===")

          bid_limit_remaining = None
          bid_limit_current = None
          bid_limit_max = None
          bid_retry_after = None
          bid_limit_available = True

          try:
              limits = api_get("/limits/me")

              # The Colony may evolve the exact response shape.
              # We inspect several common structures instead of assuming
              # one rigid schema.

              def find_action_limit(obj, target="bid"):
                  target = target.lower()

                  if isinstance(obj, dict):
                      for key, value in obj.items():

                          key_lower = str(key).lower()

                          if target in key_lower:
                              text = normalize(value).lower()

                              if (
                                  isinstance(value, dict)
                                  or "remaining" in text
                                  or "limit" in text
                              ):
                                  return value

                          found = find_action_limit(
                              value,
                              target
                          )

                          if found is not None:
                              return found

                  elif isinstance(obj, list):
                      for value in obj[:200]:
                          found = find_action_limit(
                              value,
                              target
                          )

                          if found is not None:
                              return found

                  return None


              bid_budget = find_action_limit(
                  limits,
                  "bid"
              )

              if isinstance(bid_budget, dict):

                  bid_limit_remaining = first_number(
                      bid_budget,
                      [
                          "remaining",
                          "remaining_count"
                      ]
                  )

                  bid_limit_current = first_number(
                      bid_budget,
                      [
                          "current",
                          "used",
                          "usage"
                      ]
                  )

                  bid_limit_max = first_number(
                      bid_budget,
                      [
                          "limit",
                          "max",
                          "maximum"
                      ]
                  )

                  bid_retry_after = first_number(
                      bid_budget,
                      [
                          "retry_after",
                          "retry_after_seconds"
                      ]
                  )

              if bid_limit_remaining is not None:
                  bid_limit_remaining = max(
                      0,
                      int(bid_limit_remaining)
                  )

              if bid_limit_current is not None:
                  bid_limit_current = int(
                      bid_limit_current
                  )

              if bid_limit_max is not None:
                  bid_limit_max = int(
                      bid_limit_max
                  )

              if bid_limit_remaining is not None:
                  bid_limit_available = (
                      bid_limit_remaining > 0
                  )

              print(
                  f"Bid limit max: "
                  f"{bid_limit_max if bid_limit_max is not None else 'UNKNOWN'}"
              )

              print(
                  f"Bid usage: "
                  f"{bid_limit_current if bid_limit_current is not None else 'UNKNOWN'}"
              )

              print(
                  f"Bid remaining: "
                  f"{bid_limit_remaining if bid_limit_remaining is not None else 'UNKNOWN'}"
              )

          except Exception as exc:
              # Fail closed for new bidding if the platform budget
              # cannot be inspected.
              bid_limit_available = False

              print(
                  "LIMIT CHECK WARNING: "
                  f"{compact(exc)}"
              )

              print(
                  "New bidding: DISABLED "
                  "(rate-limit state unknown)"
              )


          # ============================================================
          # CANDIDATE ANALYSIS
          # ============================================================

          print()
          print("=== COGNITIVE MARKETPLACE ANALYSIS ===")

          evaluations = []
          bid_candidates = []

          skip_reasons = {}

          def skip(reason):
              skip_reasons[reason] = (
                  skip_reasons.get(reason, 0) + 1
              )


          previous_failures = (
              marketplace_memory.get("failures", [])
              if isinstance(marketplace_memory, dict)
              else []
          )

          if not isinstance(previous_failures, list):
              previous_failures = []

          previous_outcomes = (
              marketplace_memory.get("outcomes", [])
              if isinstance(marketplace_memory, dict)
              else []
          )

          if not isinstance(previous_outcomes, list):
              previous_outcomes = []

          failure_text = extract_text(
              previous_failures[-MAX_FAILURE_MEMORY:]
          ).lower()

          outcome_text = extract_text(
              previous_outcomes[-MAX_TASK_MEMORY:]
          ).lower()


          for task in tasks:

              tid = task_id(task)
              title = task_title(task)
              body = task_body(task)

              if not tid:
                  skip("NO_TASK_ID")
                  continue

              full_text = " ".join([
                  title,
                  body,
                  extract_text(task)
              ]).strip()

              lowered = full_text.lower()

              status = task_status(task)

              if status in (
                  "closed",
                  "completed",
                  "cancelled",
                  "canceled"
              ):
                  skip("CLOSED_TASK")
                  continue

              # --------------------------------------------------------
              # Own existing bid
              # --------------------------------------------------------

              already_tracked = any(
                  normalize(
                      item.get("task_id", "")
                  ) == tid
                  for item in tracked_bids
              )

              if already_tracked:
                  skip("ALREADY_TRACKED")
                  continue

              # --------------------------------------------------------
              # Capability match
              # --------------------------------------------------------

              capabilities = capability_matches(
                  full_text
              )

              if not capabilities:
                  skip("NO_CAPABILITY")
                  continue

              capability_score = min(
                  100,
                  50 + (len(capabilities) * 15)
              )

              # --------------------------------------------------------
              # Hard safety / constraint checks
              # --------------------------------------------------------

              blocks = hard_block_reasons(
                  full_text
              )

              if blocks:
                  skip("HARD_CONSTRAINT")
                  continue

              external_ai = requires_external_ai(
                  full_text
              )

              if REQUIRE_NO_EXTERNAL_AI and external_ai:
                  skip("EXTERNAL_AI_REQUIRED")
                  continue

              paid_infra = requires_paid_infrastructure(
                  full_text
              )

              if REQUIRE_ZERO_COST_EXECUTION and paid_infra:
                  skip("PAID_INFRASTRUCTURE")
                  continue

              # --------------------------------------------------------
              # Deliverable clarity
              # --------------------------------------------------------

              clear_deliverable = has_clear_deliverable(
                  full_text
              )

              if (
                  REQUIRE_CLEAR_DELIVERABLE
                  and not clear_deliverable
              ):
                  skip("UNCLEAR_DELIVERABLE")
                  continue

              # --------------------------------------------------------
              # Reward analysis
              # --------------------------------------------------------

              reward = reward_sats(task)

              reward_conflict = reward_unit_conflict(
                  full_text
              )

              if reward_conflict:
                  skip("REWARD_UNIT_CONFLICT")
                  continue

              if reward is not None:
                  reward_score = min(
                      100,
                      55 + int(
                          min(
                              reward,
                              10000
                          ) / 200
                      )
                  )
              else:
                  reward_score = 55

              # --------------------------------------------------------
              # Clarity
              # --------------------------------------------------------

              clarity_score = 100

              if len(body.strip()) < 40:
                  clarity_score -= 25

              if len(body.strip()) < 15:
                  clarity_score -= 25

              if "?" in body and len(body.strip()) < 100:
                  clarity_score -= 10

              clarity_score = max(
                  0,
                  min(100, clarity_score)
              )

              # --------------------------------------------------------
              # Evidence / research feasibility
              # --------------------------------------------------------

              urls = extract_urls(full_text)

              research_possible = (
                  WEB_RESEARCH_ENABLED
                  and len(urls) > 0
              )

              research_score = 65

              if research_possible:
                  research_score = 90

              if "research" in lowered:
                  research_score = max(
                      research_score,
                      85
                  )

              # --------------------------------------------------------
              # Historical risk
              # --------------------------------------------------------

              historical_risk = 0

              title_tokens = set(
                  re.findall(
                      r"[a-z0-9]{4,}",
                      title.lower()
                  )
              )

              if title_tokens and failure_text:
                  overlap = sum(
                      1
                      for token in title_tokens
                      if token in failure_text
                  )

                  if overlap >= 4:
                      historical_risk = 20
                  elif overlap >= 2:
                      historical_risk = 10

              # --------------------------------------------------------
              # Historical positive signal
              # --------------------------------------------------------

              historical_positive = 0

              if title_tokens and outcome_text:
                  overlap = sum(
                      1
                      for token in title_tokens
                      if token in outcome_text
                  )

                  if overlap >= 4:
                      historical_positive = 15
                  elif overlap >= 2:
                      historical_positive = 8

              # --------------------------------------------------------
              # Feasibility score
              # --------------------------------------------------------

              feasibility_score = (
                  capability_score * 0.30
                  + clarity_score * 0.15
                  + research_score * 0.15
                  + (100 if clear_deliverable else 0) * 0.15
                  + reward_score * 0.10
                  + 80 * 0.05
                  + historical_positive
                  - historical_risk
              )

              feasibility_score = int(
                  max(
                      0,
                      min(
                          100,
                          feasibility_score
                      )
                  )
              )

              # --------------------------------------------------------
              # Opportunity score
              # --------------------------------------------------------

              opportunity_score = (
                  feasibility_score * 0.55
                  + reward_score * 0.20
                  + capability_score * 0.15
                  + clarity_score * 0.10
              )

              opportunity_score = int(
                  max(
                      0,
                      min(
                          100,
                          opportunity_score
                      )
                  )
              )

              # --------------------------------------------------------
              # Final decision
              # --------------------------------------------------------

              decision = (
                  feasibility_score >= MIN_FEASIBILITY_SCORE
                  and opportunity_score >= BID_SCORE_THRESHOLD
                  and len(capabilities) > 0
                  and not external_ai
                  and not paid_infra
                  and not reward_conflict
              )

              evaluation = {
                  "task_id": tid,
                  "title": title,
                  "capabilities": capabilities,
                  "reward_sats": reward,
                  "feasibility_score": feasibility_score,
                  "opportunity_score": opportunity_score,
                  "capability_score": capability_score,
                  "clarity_score": clarity_score,
                  "research_score": research_score,
                  "reward_score": reward_score,
                  "historical_risk": historical_risk,
                  "historical_positive": historical_positive,
                  "urls": urls[:MAX_WEB_SOURCES],
                  "decision": (
                      "BID_CANDIDATE"
                      if decision
                      else "NO_BID"
                  ),
                  "evaluated_at": now_iso()
              }

              evaluations.append(evaluation)

              if decision:
                  bid_candidates.append(
                      evaluation
                  )

          # Highest quality first.
          bid_candidates.sort(
              key=lambda item: (
                  item["opportunity_score"],
                  item["feasibility_score"],
                  item["reward_score"]
              ),
              reverse=True
          )

          print(
              f"TASKS EVALUATED: {len(evaluations)}"
          )

          print(
              f"INTELLIGENT BID CANDIDATES: "
              f"{len(bid_candidates)}"
          )

          print()
          print("=== SELECTION REASONS ===")

          for reason, count in sorted(
              skip_reasons.items(),
              key=lambda x: (-x[1], x[0])
          ):
              print(
                  f"{reason}: {count}"
              )


          # ============================================================
          # BID EXECUTION
          # ============================================================

          print()
          print("=== BID DECISION ENGINE ===")

          bids_created = 0
          bid_errors = 0
          rate_limited = False

          if not bid_limit_available:
              print(
                  "BIDDING DEFERRED: "
                  "platform bid budget unavailable."
              )

          else:

              available_budget = (
                  bid_limit_remaining
                  if bid_limit_remaining is not None
                  else 0
              )

              allowed_this_run = min(
                  MAX_BIDS_PER_RUN,
                  available_budget
              )

              if allowed_this_run <= 0:
                  print(
                      "BIDDING DEFERRED: "
                      "no bid budget remaining."
                  )
              else:

                  selected = bid_candidates[
                      :allowed_this_run
                  ]

                  print(
                      f"Bid budget available: "
                      f"{available_budget}"
                  )

                  print(
                      f"Maximum bids this run: "
                      f"{allowed_this_run}"
                  )

                  print(
                      f"Selected bids: "
                      f"{len(selected)}"
                  )

                  for candidate in selected:

                      tid = candidate["task_id"]
                      title = candidate["title"]

                      # Find original task.
                      original_task = next(
                          (
                              task
                              for task in tasks
                              if task_id(task) == tid
                          ),
                          None
                      )

                      if not original_task:
                          continue

                      reward = candidate.get(
                          "reward_sats"
                      )

                      # The API currently requires at least 21 sats.
                      # Never invent a bid amount from a USD/USDC title.
                      if reward is not None:
                          bid_amount = max(
                              MIN_BID_SATS,
                              int(reward)
                          )
                      else:
                          bid_amount = MIN_BID_SATS

                      message = (
                          "NØX can perform this task using "
                          "its current research, analysis and "
                          "structured-delivery capabilities. "
                          "Execution will remain within the "
                          "available zero-cost environment and "
                          "will not require external AI services."
                      )

                      payload = {
                          "amount_sats": bid_amount,
                          "message": message
                      }

                      try:
                          response = api_post(
                              f"/marketplace/{tid}/bid",
                              payload,
                              extra_headers={
                                  "Idempotency-Key":
                                      idempotency_key(
                                          "bid",
                                          tid
                                      )
                              }
                          )

                          if response.status_code == 429:
                              rate_limited = True
                              bid_errors += 1

                              retry_after = (
                                  response.headers.get(
                                      "Retry-After"
                                  )
                              )

                              print(
                                  f"BID RATE LIMITED: "
                                  f"{tid} "
                                  f"retry_after="
                                  f"{retry_after or 'unknown'}"
                              )

                              # CRITICAL:
                              # Stop all further bids immediately.
                              break

                          if response.status_code >= 400:
                              bid_errors += 1

                              print(
                                  f"BID ERROR: "
                                  f"{tid} "
                                  f"POST /marketplace/{tid}/bid "
                                  f"-> {response.status_code}: "
                                  f"{compact(response.text, 500)}"
                              )

                              continue

                          try:
                              result = response.json()
                          except Exception:
                              result = {}

                          new_bid_id = first_string(
                              result,
                              [
                                  "id",
                                  "bid_id"
                              ]
                          )

                          tracked_bids.append({
                              "task_id": tid,
                              "bid_id": new_bid_id,
                              "title": title,
                              "amount_sats": bid_amount,
                              "status": "pending",
                              "accepted": False,
                              "rejected": False,
                              "feasibility_score":
                                  candidate[
                                      "feasibility_score"
                                  ],
                              "opportunity_score":
                                  candidate[
                                      "opportunity_score"
                                  ],
                              "created_at": now_iso()
                          })

                          bids_created += 1

                          print(
                              f"BID CREATED: "
                              f"{tid} | "
                              f"score="
                              f"{candidate['opportunity_score']} | "
                              f"feasibility="
                              f"{candidate['feasibility_score']} | "
                              f"amount="
                              f"{bid_amount} sats"
                          )

                      except Exception as exc:
                          bid_errors += 1

                          print(
                              f"BID EXCEPTION: "
                              f"{tid}: "
                              f"{compact(exc)}"
                          )


          # ============================================================
          # ACCEPTED MISSION DETECTION
          # ============================================================

          print()
          print("=== ACCEPTED MISSION DETECTION ===")

          accepted_missions = []

          for record in tracked_bids:

              if not record.get("accepted"):
                  continue

              tid = normalize(
                  record.get("task_id")
              ).strip()

              if not tid:
                  continue

              original_task = next(
                  (
                      task
                      for task in tasks
                      if task_id(task) == tid
                  ),
                  None
              )

              if original_task:
                  accepted_missions.append({
                      "task": original_task,
                      "bid": record
                  })


          # Also detect accepted bids directly from the marketplace
          # for tracked task IDs when possible.

          for record in tracked_bids:

              tid = normalize(
                  record.get("task_id")
              ).strip()

              if not tid:
                  continue

              if any(
                  mission["bid"].get("task_id") == tid
                  for mission in accepted_missions
              ):
                  continue

              try:
                  bids_data = api_get(
                      f"/marketplace/{tid}/bids"
                  )

                  if isinstance(bids_data, list):
                      bids = bids_data
                  elif isinstance(bids_data, dict):
                      bids = (
                          bids_data.get("bids")
                          or bids_data.get("items")
                          or []
                      )
                  else:
                      bids = []

                  for bid in bids:

                      bid_id = first_string(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      tracked_bid_id = normalize(
                          record.get("bid_id")
                      ).strip()

                      if (
                          tracked_bid_id
                          and bid_id != tracked_bid_id
                      ):
                          continue

                      status = first_string(
                          bid,
                          [
                              "status"
                          ]
                      ).lower()

                      bidder = first_string(
                          bid,
                          [
                              "username",
                              "handle"
                          ]
                      )

                      if (
                          status == "accepted"
                          and (
                              not bidder
                              or bidder == NOX_IDENTITY
                          )
                      ):

                          original_task = next(
                              (
                                  task
                                  for task in tasks
                                  if task_id(task) == tid
                              ),
                              None
                          )

                          if original_task:
                              record["accepted"] = True
                              record["status"] = "accepted"

                              accepted_missions.append({
                                  "task": original_task,
                                  "bid": record
                              })

                          break

              except Exception:
                  continue


          # Deduplicate accepted missions.
          unique_missions = {}

          for mission in accepted_missions:
              tid = task_id(
                  mission["task"]
              )

              unique_missions[tid] = mission

          accepted_missions = list(
              unique_missions.values()
          )

          print(
              f"ACCEPTED MISSIONS: "
              f"{len(accepted_missions)}"
          )


          # ============================================================
          # DETERMINISTIC WEB RESEARCH
          # ============================================================

          def fetch_source(url):
              try:
                  parsed = urlparse(url)

                  if parsed.scheme not in (
                      "http",
                      "https"
                  ):
                      return None

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              "Nox-Ledger-04/3.0 research"
                      },
                      timeout=HTTP_TIMEOUT_SECONDS,
                      allow_redirects=True
                  )

                  if response.status_code >= 400:
                      return {
                          "url": url,
                          "status": response.status_code,
                          "error": "HTTP_ERROR"
                      }

                  content = response.content[
                      :MAX_SOURCE_BYTES
                  ]

                  text = content.decode(
                      response.encoding
                      or "utf-8",
                      errors="replace"
                  )

                  text = re.sub(
                      r"<script[\s\S]*?</script>",
                      " ",
                      text,
                      flags=re.I
                  )

                  text = re.sub(
                      r"<style[\s\S]*?</style>",
                      " ",
                      text,
                      flags=re.I
                  )

                  text = re.sub(
                      r"<[^>]+>",
                      " ",
                      text
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  return {
                      "url": url,
                      "status": response.status_code,
                      "title": compact(text, 180),
                      "excerpt": compact(text, 1400)
                  }

              except Exception as exc:
                  return {
                      "url": url,
                      "error": compact(exc)
                  }


          def research_task(task):
              if not WEB_RESEARCH_ENABLED:
                  return []

              text = " ".join([
                  task_title(task),
                  task_body(task),
                  extract_text(task)
              ])

              urls = extract_urls(text)

              results = []

              for url in urls[:MAX_WEB_SOURCES]:
                  source = fetch_source(url)

                  if source:
                      results.append(source)

              return results


          # ============================================================
          # EXECUTION
          # ============================================================

          print()
          print("=== MISSION EXECUTION ===")

          executions = []
          deliveries = []
          execution_failures = []

          execution_candidates = accepted_missions[
              :MAX_EXECUTIONS_PER_RUN
          ]

          for mission in execution_candidates:

              task = mission["task"]
              bid = mission["bid"]

              tid = task_id(task)
              title = task_title(task)
              body = task_body(task)

              print(
                  f"EXECUTING: {tid} | {compact(title, 120)}"
              )

              if not EXECUTION_ENABLED:
                  continue

              try:
                  sources = research_task(
                      task
                  )

                  capability_list = capability_matches(
                      " ".join([
                          title,
                          body
                      ])
                  )

                  research_lines = []

                  for source in sources:
                      research_lines.append(
                          "- "
                          + source.get("url", "")
                          + " | "
                          + source.get(
                              "excerpt",
                              ""
                          )
                      )

                  if not research_lines:
                      research_lines.append(
                          "- No explicit public URL "
                          "was supplied in the task."
                      )

                  delivery = "\n".join([
                      f"NØX DELIVERY — {title}",
                      "",
                      "Scope:",
                      compact(body, 1800),
                      "",
                      "Capabilities applied:",
                      ", ".join(capability_list)
                      or "research / analysis",
                      "",
                      "Method:",
                      "Deterministic analysis using "
                      "available NØX knowledge, structured "
                      "reasoning and public-source research.",
                      "",
                      "Sources / evidence:",
                      "\n".join(research_lines),
                      "",
                      "Constraints:",
                      "No Gemini.",
                      "No external AI service.",
                      "No spending.",
                      "No payment action.",
                      "Project cost: €0.",
                      "",
                      "Result:",
                      "The work was processed within "
                      "the capabilities and evidence "
                      "available to NØX."
                  ])

                  delivery = delivery[
                      :MAX_DELIVERY_CHARS
                  ]

                  executions.append({
                      "task_id": tid,
                      "title": title,
                      "executed_at": now_iso(),
                      "sources": sources,
                      "capabilities": capability_list,
                      "delivery_chars": len(delivery)
                  })

                  # ----------------------------------------------------
                  # COMMENT PREVIEW
                  # ----------------------------------------------------

                  preview_response = api_post(
                      f"/posts/{tid}/comments/preview",
                      {
                          "body": delivery
                      }
                  )

                  preview_ok = (
                      preview_response.status_code < 400
                  )

                  if not preview_ok:
                      execution_failures.append({
                          "task_id": tid,
                          "stage": "COMMENT_PREVIEW",
                          "error": compact(
                              preview_response.text,
                              700
                          ),
                          "created_at": now_iso()
                      })

                      print(
                          f"DELIVERY PREVIEW FAILED: "
                          f"{tid}"
                      )

                      continue

                  try:
                      preview_data = (
                          preview_response.json()
                      )
                  except Exception:
                      preview_data = {}

                  would_be_accepted = (
                      preview_data.get(
                          "would_be_accepted",
                          True
                      )
                  )

                  if not would_be_accepted:
                      blocker = first_string(
                          preview_data,
                          [
                              "blocker",
                              "reason",
                              "error"
                          ]
                      )

                      execution_failures.append({
                          "task_id": tid,
                          "stage": "COMMENT_PREVIEW_BLOCKED",
                          "error": blocker,
                          "created_at": now_iso()
                      })

                      print(
                          f"DELIVERY BLOCKED BY PREVIEW: "
                          f"{tid} | {blocker}"
                      )

                      continue

                  # ----------------------------------------------------
                  # COMMENT DELIVERY
                  # ----------------------------------------------------

                  comment_response = api_post(
                      f"/posts/{tid}/comments",
                      {
                          "body": delivery
                      },
                      extra_headers={
                          "Idempotency-Key":
                              idempotency_key(
                                  "delivery",
                                  tid
                              )
                      }
                  )

                  if comment_response.status_code >= 400:
                      execution_failures.append({
                          "task_id": tid,
                          "stage": "COMMENT_CREATE",
                          "error": compact(
                              comment_response.text,
                              700
                          ),
                          "created_at": now_iso()
                      })

                      print(
                          f"DELIVERY FAILED: "
                          f"{tid} -> "
                          f"{comment_response.status_code}"
                      )

                      continue

                  try:
                      comment_result = (
                          comment_response.json()
                      )
                  except Exception:
                      comment_result = {}

                  comment_id = first_string(
                      comment_result,
                      [
                          "id",
                          "comment_id"
                      ]
                  )

                  deliveries.append({
                      "task_id": tid,
                      "comment_id": comment_id,
                      "title": title,
                      "delivered_at": now_iso(),
                      "delivery_chars": len(delivery)
                  })

                  print(
                      f"DELIVERY CREATED: "
                      f"{tid}"
                  )

              except Exception as exc:

                  execution_failures.append({
                      "task_id": tid,
                      "stage": "EXECUTION",
                      "error": compact(exc),
                      "created_at": now_iso()
                  })

                  print(
                      f"EXECUTION ERROR: "
                      f"{tid}: "
                      f"{compact(exc)}"
                  )


          # ============================================================
          # PAYMENT OBSERVATION ONLY
          # ============================================================

          print()
          print("=== PAYMENT OBSERVATION ===")

          payments_observed = []

          observed_task_ids = set()

          for record in tracked_bids:

              tid = normalize(
                  record.get("task_id")
              ).strip()

              if not tid:
                  continue

              if tid in observed_task_ids:
                  continue

              observed_task_ids.add(tid)

              try:
                  payment = api_get(
                      f"/marketplace/{tid}/payment"
                  )

                  payments_observed.append({
                      "task_id": tid,
                      "observed_at": now_iso(),
                      "payment": payment
                  })

              except Exception:
                  # Payment endpoint may legitimately return
                  # no payment before settlement.
                  continue

          print(
              f"Payments observed: "
              f"{len(payments_observed)}"
          )

          print(
              "Payment creation: DISABLED"
          )

          print(
              "Spending: DISABLED"
          )


          # ============================================================
          # LEARNING / INTER-LEDGER FEEDBACK
          # ============================================================

          print()
          print("=== LEARNING / INTER-LEDGER FEEDBACK ===")

          outcomes = (
              marketplace_memory.get(
                  "outcomes",
                  []
              )
              if isinstance(
                  marketplace_memory,
                  dict
              )
              else []
          )

          if not isinstance(outcomes, list):
              outcomes = []

          failures = (
              marketplace_memory.get(
                  "failures",
                  []
              )
              if isinstance(
                  marketplace_memory,
                  dict
              )
              else []
          )

          if not isinstance(failures, list):
              failures = []

          selection_history = (
              marketplace_memory.get(
                  "selection_history",
                  []
              )
              if isinstance(
                  marketplace_memory,
                  dict
              )
              else []
          )

          if not isinstance(
              selection_history,
              list
          ):
              selection_history = []

          # ------------------------------------------------------------
          # Record candidate decisions
          # ------------------------------------------------------------

          for evaluation in evaluations:

              if evaluation["decision"] != "BID_CANDIDATE":
                  continue

              selection_history.append({
                  "task_id":
                      evaluation["task_id"],
                  "title":
                      evaluation["title"],
                  "feasibility_score":
                      evaluation[
                          "feasibility_score"
                      ],
                  "opportunity_score":
                      evaluation[
                          "opportunity_score"
                      ],
                  "decision":
                      "selected_or_deferred",
                  "recorded_at":
                      now_iso()
              })

          # ------------------------------------------------------------
          # Record successful deliveries
          # ------------------------------------------------------------

          for delivery in deliveries:

              outcomes.append({
                  "type": "delivery",
                  "task_id":
                      delivery["task_id"],
                  "title":
                      delivery["title"],
                  "result":
                      "delivery_created",
                  "timestamp":
                      delivery["delivered_at"],
                  "learning": (
                      "A mission was executable "
                      "through the current NØX "
                      "capability set."
                  )
              })

          # ------------------------------------------------------------
          # Record execution failures
          # ------------------------------------------------------------

          for failure in execution_failures:

              failures.append({
                  "type": "execution_failure",
                  "task_id":
                      failure.get(
                          "task_id"
                      ),
                  "stage":
                      failure.get(
                          "stage"
                      ),
                  "error":
                      failure.get(
                          "error"
                      ),
                  "timestamp":
                      failure.get(
                          "created_at"
                      )
              })

          # ------------------------------------------------------------
          # Record rate-limit learning
          # ------------------------------------------------------------

          if rate_limited:

              failures.append({
                  "type":
                      "platform_rate_limit",
                  "stage":
                      "bid_selection",
                  "error":
                      "BID_RATE_LIMIT",
                  "timestamp":
                      now_iso(),
                  "learning":
                      "Stop bidding immediately "
                      "when the platform returns "
                      "RATE_LIMIT_BID."
              })

          if (
              bid_limit_remaining is not None
              and bid_limit_remaining == 0
          ):

              outcomes.append({
                  "type":
                      "resource_constraint",
                  "resource":
                      "marketplace_bid_budget",
                  "remaining":
                      0,
                  "timestamp":
                      now_iso(),
                  "learning":
                      "Bid quota is a scarce action "
                      "resource; candidate quality "
                      "must be prioritized."
              })


          # ------------------------------------------------------------
          # Build cognitive feedback
          # ------------------------------------------------------------

          cognitive_feedback = (
              marketplace_memory.get(
                  "cognitive_feedback",
                  []
              )
              if isinstance(
                  marketplace_memory,
                  dict
              )
              else []
          )

          if not isinstance(
              cognitive_feedback,
              list
          ):
              cognitive_feedback = []

          cognitive_feedback.append({
              "timestamp": now_iso(),
              "source": "LEDGER_04",
              "loop_stage": "Observe_Learn_Adapt",
              "tasks_found": len(tasks),
              "tasks_evaluated": len(evaluations),
              "intelligent_candidates":
                  len(bid_candidates),
              "bids_created": bids_created,
              "accepted_missions":
                  len(accepted_missions),
              "executions":
                  len(executions),
              "deliveries":
                  len(deliveries),
              "execution_failures":
                  len(execution_failures),
              "bid_rate_limited":
                  rate_limited,
              "bid_remaining":
                  bid_limit_remaining,
              "key_learning": (
                  "Only bid when NØX can plausibly "
                  "execute and deliver the mission."
              )
          })

          # ============================================================
          # MARKETPLACE MEMORY COMMIT
          # ============================================================

          marketplace_memory = {
              "schema_version": "3.0",
              "identity": NOX_IDENTITY,
              "updated_at": now_iso(),

              "constraints": {
                  "gemini_enabled": False,
                  "external_ai_enabled": False,
                  "payments_enabled": False,
                  "spending_enabled": False,
                  "project_cost_eur": 0
              },

              "strategy": {
                  "principle":
                      "quality_over_bid_volume",
                  "requires_capability": True,
                  "requires_feasible_execution": True,
                  "requires_clear_deliverable":
                      REQUIRE_CLEAR_DELIVERABLE,
                  "requires_zero_cost":
                      REQUIRE_ZERO_COST_EXECUTION,
                  "rejects_external_ai":
                      REQUIRE_NO_EXTERNAL_AI,
                  "uses_inter_ledger_context": True,
                  "uses_history": True,
                  "uses_platform_limits": True
              },

              "tracked_bids":
                  trim_list(
                      tracked_bids,
                      MAX_MEMORY_ITEMS
                  ),

              "outcomes":
                  trim_list(
                      outcomes,
                      MAX_TASK_MEMORY
                  ),

              "failures":
                  trim_list(
                      failures,
                      MAX_FAILURE_MEMORY
                  ),

              "selection_history":
                  trim_list(
                      selection_history,
                      MAX_TASK_MEMORY
                  ),

              "cognitive_feedback":
                  trim_list(
                      cognitive_feedback,
                      MAX_MEMORY_ITEMS
                  ),

              "last_run": {
                  "tasks_found":
                      len(tasks),
                  "tasks_evaluated":
                      len(evaluations),
                  "intelligent_candidates":
                      len(bid_candidates),
                  "bids_created":
                      bids_created,
                  "bid_errors":
                      bid_errors,
                  "rate_limited":
                      rate_limited,
                  "accepted_missions":
                      len(accepted_missions),
                  "executions":
                      len(executions),
                  "deliveries":
                      len(deliveries),
                  "execution_failures":
                      len(execution_failures),
                  "payments_observed":
                      len(payments_observed),
                  "bid_limit_remaining":
                      bid_limit_remaining,
                  "timestamp":
                      now_iso()
              }
          }

          save_json(
              MEMORY_MARKETPLACE,
              marketplace_memory
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          print()
          print("==============================================")
          print("=== NØX LEDGER 04 COMPLETE                ===")
          print("==============================================")

          print(
              f"Identity: {NOX_IDENTITY}"
          )

          print(
              "Authentication: JWT"
          )

          print(
              f"Tasks found: {len(tasks)}"
          )

          print(
              f"Tasks evaluated: {len(evaluations)}"
          )

          print(
              f"Intelligent bid candidates: "
              f"{len(bid_candidates)}"
          )

          print(
              f"Bids created: {bids_created}"
          )

          print(
              f"Bid errors: {bid_errors}"
          )

          print(
              f"Rate limited: "
              f"{'YES' if rate_limited else 'NO'}"
          )

          print(
              f"Tracked bids: "
              f"{len(tracked_bids)}"
          )

          print(
              f"Accepted missions: "
              f"{len(accepted_missions)}"
          )

          print(
              f"Executions this run: "
              f"{len(executions)}"
          )

          print(
              f"Deliveries recorded: "
              f"{len(deliveries)}"
          )

          print(
              f"Execution failures: "
              f"{len(execution_failures)}"
          )

          print(
              f"Payments observed: "
              f"{len(payments_observed)}"
          )

          print(
              f"Web research: "
              f"{WEB_RESEARCH_ENABLED}"
          )

          print(
              "Gemini: False"
          )

          print(
              "External AI: False"
          )

          print(
              "Payments: False"
          )

          print(
              "Spending: False"
          )

          print(
              "Project cost: €0"
          )

          print(
              f"Bid remaining: "
              f"{bid_limit_remaining "
              if bid_limit_remaining is not None "
              else 'UNKNOWN'}"
          )

          print(
              f"Memory: {MEMORY_MARKETPLACE}"
          )

          print("==============================================")
          PY

      - name: Commit Ledger 04 state
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_ledger_marketplace.json

          if git diff --cached --quiet; then
            echo "No Ledger 04 state changes to commit."
            exit 0
          fi

          git commit -m "NØX Ledger 04 marketplace cognitive state"
          git push
