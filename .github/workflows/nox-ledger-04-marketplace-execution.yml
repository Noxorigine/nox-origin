name: NØX LEDGER 04 - Marketplace Execution

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: "https://thecolony.ai/api/v1"
      Nox_IDENTITY: "nox_origine"

      # ============================================================
      # HARD SAFETY / COST CONSTRAINTS
      # ============================================================
      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # ============================================================
      # MARKETPLACE
      # ============================================================
      MAX_TASKS: "100"
      MAX_BIDS_PER_RUN: "2"
      MAX_RECONCILE: "30"

      # The Colony currently enforces a minimum bid of 21 sats.
      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "50"

      # ============================================================
      # EXECUTION
      # ============================================================
      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      # ============================================================
      # WEB RESEARCH
      # ============================================================
      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      # ============================================================
      # MEMORY
      # ============================================================
      MAX_MEMORY_ITEMS: "500"

      # ============================================================
      # EXISTING COLONY SECRET
      # IMPORTANT:
      # This is the same secret already used by Ledger 01/02/03.
      # ============================================================
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # EXECUTION
      # ============================================================
      - name: Run Ledger 04
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "=== NØX LEDGER 04 - MARKETPLACE EXECUTION ==="
          echo "=============================================="

          if [ -z "${COLONY_API_KEY:-}" ]; then
            echo "ERROR: COLONY_API_KEY missing"
            exit 1
          fi

          mkdir -p memory

          cat > /tmp/nox_ledger_04.py <<'PY'
          import os
          import json
          import re
          import hashlib
          import time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          API_BASE = os.environ.get(
              "API_BASE",
              "https://thecolony.ai/api/v1"
          ).rstrip("/")

          IDENTITY = os.environ.get(
              "Nox_IDENTITY",
              "nox_origine"
          )

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()

          GEMINI_ENABLED = os.environ.get(
              "GEMINI_ENABLED",
              "false"
          ).lower() == "true"

          EXTERNAL_AI_ENABLED = os.environ.get(
              "EXTERNAL_AI_ENABLED",
              "false"
          ).lower() == "true"

          PAYMENTS_ENABLED = os.environ.get(
              "PAYMENTS_ENABLED",
              "false"
          ).lower() == "true"

          SPENDING_ENABLED = os.environ.get(
              "SPENDING_ENABLED",
              "false"
          ).lower() == "true"

          PROJECT_COST_EUR = float(
              os.environ.get(
                  "PROJECT_COST_EUR",
                  "0"
              )
          )

          MAX_TASKS = int(
              os.environ.get(
                  "MAX_TASKS",
                  "100"
              )
          )

          MAX_BIDS_PER_RUN = int(
              os.environ.get(
                  "MAX_BIDS_PER_RUN",
                  "2"
              )
          )

          MAX_RECONCILE = int(
              os.environ.get(
                  "MAX_RECONCILE",
                  "30"
              )
          )

          MIN_BID_SATS = int(
              os.environ.get(
                  "MIN_BID_SATS",
                  "21"
              )
          )

          BID_SCORE_THRESHOLD = int(
              os.environ.get(
                  "BID_SCORE_THRESHOLD",
                  "50"
              )
          )

          EXECUTION_ENABLED = os.environ.get(
              "EXECUTION_ENABLED",
              "true"
          ).lower() == "true"

          MAX_EXECUTIONS_PER_RUN = int(
              os.environ.get(
                  "MAX_EXECUTIONS_PER_RUN",
                  "2"
              )
          )

          MAX_DELIVERY_CHARS = int(
              os.environ.get(
                  "MAX_DELIVERY_CHARS",
                  "9500"
              )
          )

          WEB_RESEARCH_ENABLED = os.environ.get(
              "WEB_RESEARCH_ENABLED",
              "true"
          ).lower() == "true"

          MAX_WEB_SOURCES = int(
              os.environ.get(
                  "MAX_WEB_SOURCES",
                  "8"
              )
          )

          HTTP_TIMEOUT_SECONDS = int(
              os.environ.get(
                  "HTTP_TIMEOUT_SECONDS",
                  "20"
              )
          )

          MAX_SOURCE_BYTES = int(
              os.environ.get(
                  "MAX_SOURCE_BYTES",
                  "500000"
              )
          )

          MAX_MEMORY_ITEMS = int(
              os.environ.get(
                  "MAX_MEMORY_ITEMS",
                  "500"
              )
          )


          # ============================================================
          # PATHS
          # ============================================================

          LEDGER01 = "memory/nox_ledger_attention.json"
          LEDGER02 = "memory/nox_ledger_cognition.json"
          LEDGER03_ACTION = "memory/nox_ledger_action.json"
          LEDGER03_KNOWLEDGE = "memory/nox_ledger_knowledge.json"
          LEDGER04 = "memory/nox_ledger_marketplace.json"


          # ============================================================
          # SAFETY
          # ============================================================

          if not API_KEY:
              raise SystemExit(
                  "ERROR: COLONY_API_KEY missing"
              )

          if GEMINI_ENABLED:
              raise SystemExit(
                  "SAFETY ERROR: GEMINI_ENABLED must remain false"
              )

          if EXTERNAL_AI_ENABLED:
              raise SystemExit(
                  "SAFETY ERROR: EXTERNAL_AI_ENABLED must remain false"
              )

          if PAYMENTS_ENABLED:
              raise SystemExit(
                  "SAFETY ERROR: PAYMENTS_ENABLED must remain false"
              )

          if SPENDING_ENABLED:
              raise SystemExit(
                  "SAFETY ERROR: SPENDING_ENABLED must remain false"
              )

          if PROJECT_COST_EUR != 0:
              raise SystemExit(
                  "SAFETY ERROR: PROJECT_COST_EUR must remain 0"
              )


          # ============================================================
          # HTTP SESSION
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Ledger-04/1.0"
          })


          # ============================================================
          # HELPERS
          # ============================================================

          def utc_now():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def load_json(path, default):
              try:
                  if not os.path.exists(path):
                      return default

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception:
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              tmp = path + ".tmp"

              with open(
                  tmp,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              os.replace(
                  tmp,
                  path
              )


          def trim_list(items, limit):
              if not isinstance(items, list):
                  return []

              return items[-limit:]


          def normalize_text(value):
              if value is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()


          def safe_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default


          def extract_task_text(task):
              title = normalize_text(
                  task.get("title", "")
              )

              body = normalize_text(
                  task.get("body", "")
              )

              description = normalize_text(
                  task.get("description", "")
              )

              return normalize_text(
                  f"{title} {body} {description}"
              )


          def task_metadata(task):
              metadata = task.get(
                  "metadata",
                  {}
              )

              if not isinstance(metadata, dict):
                  return {}

              return metadata


          def accepting_submissions(task):
              value = task.get(
                  "accepting_submissions"
              )

              if value is not None:
                  return bool(value)

              closed_at = task.get(
                  "closed_at"
              )

              status = normalize_text(
                  task.get(
                      "status",
                      ""
                  )
              ).lower()

              if closed_at:
                  return False

              return status in (
                  "open",
                  "bidding"
              )


          def reward_range(task):
              metadata = task_metadata(task)

              minimum = task.get(
                  "budget_min_sats",
                  metadata.get(
                      "budget_min_sats",
                      0
                  )
              )

              maximum = task.get(
                  "budget_max_sats",
                  metadata.get(
                      "budget_max_sats",
                      minimum
                  )
              )

              minimum = safe_int(
                  minimum,
                  0
              )

              maximum = safe_int(
                  maximum,
                  minimum
              )

              return (
                  minimum,
                  maximum
              )


          def choose_bid_amount(task):
              minimum, maximum = reward_range(
                  task
              )

              lower = max(
                  MIN_BID_SATS,
                  minimum
              )

              if maximum > 0 and lower > maximum:
                  return None

              if maximum > 0:
                  return min(
                      lower,
                      maximum
                  )

              return lower


          def make_idempotency_key(
              operation,
              task_id,
              extra=""
          ):
              raw = (
                  f"{IDENTITY}|"
                  f"ledger04|"
                  f"{operation}|"
                  f"{task_id}|"
                  f"{extra}"
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          def api_get(path, params=None):
              url = (
                  path
                  if path.startswith("http")
                  else f"{API_BASE}{path}"
              )

              response = session.get(
                  url,
                  params=params,
                  timeout=HTTP_TIMEOUT_SECONDS
              )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"GET {path} -> "
                      f"{response.status_code}: "
                      f"{response.text[:500]}"
                  )

              if not response.text.strip():
                  return {}

              return response.json()


          def api_post(
              path,
              payload=None,
              idempotency_key=None
          ):
              url = (
                  path
                  if path.startswith("http")
                  else f"{API_BASE}{path}"
              )

              headers = {}

              if idempotency_key:
                  headers["Idempotency-Key"] = (
                      idempotency_key
                  )

              response = session.post(
                  url,
                  json=payload or {},
                  headers=headers,
                  timeout=HTTP_TIMEOUT_SECONDS
              )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"POST {path} -> "
                      f"{response.status_code}: "
                      f"{response.text[:700]}"
                  )

              if not response.text.strip():
                  return {}

              return response.json()


          # ============================================================
          # MEMORY / LEDGER 01-03
          # ============================================================

          ledger01 = load_json(
              LEDGER01,
              {}
          )

          ledger02 = load_json(
              LEDGER02,
              {}
          )

          ledger03_action = load_json(
              LEDGER03_ACTION,
              {}
          )

          ledger03_knowledge = load_json(
              LEDGER03_KNOWLEDGE,
              {}
          )

          memory = load_json(
              LEDGER04,
              {}
          )

          if not isinstance(memory, dict):
              memory = {}


          memory.setdefault(
              "schema_version",
              "1.0"
          )

          memory.setdefault(
              "identity",
              IDENTITY
          )

          memory.setdefault(
              "created_at",
              utc_now()
          )

          memory.setdefault(
              "updated_at",
              utc_now()
          )

          memory.setdefault(
              "tasks",
              {}
          )

          memory.setdefault(
              "bids",
              []
          )

          memory.setdefault(
              "accepted_missions",
              []
          )

          memory.setdefault(
              "executions",
              []
          )

          memory.setdefault(
              "deliveries",
              []
          )

          memory.setdefault(
              "payments_observed",
              []
          )

          memory.setdefault(
              "learning",
              []
          )

          memory.setdefault(
              "failures",
              []
          )

          memory.setdefault(
              "web_research",
              []
          )


          # ============================================================
          # IDENTITY
          # ============================================================

          try:
              me = api_get(
                  "/me"
              )

              print(
                  "IDENTITY API:",
                  me.get(
                      "username",
                      me.get(
                          "name",
                          "unknown"
                      )
                  )
              )

          except Exception as exc:
              print(
                  "IDENTITY CHECK WARNING:",
                  str(exc)[:300]
              )


          # ============================================================
          # TASK DISCOVERY
          # ============================================================

          print("")
          print(
              "=== MARKETPLACE DISCOVERY ==="
          )

          tasks_response = api_get(
              "/marketplace/tasks",
              params={
                  "sort": "newest",
                  "limit": min(
                      MAX_TASKS,
                      100
                  )
              }
          )

          if isinstance(
              tasks_response,
              dict
          ):
              tasks = tasks_response.get(
                  "items",
                  []
              )
          else:
              tasks = tasks_response

          if not isinstance(tasks, list):
              tasks = []

          tasks = tasks[:MAX_TASKS]

          print(
              "TASKS FOUND:",
              len(tasks)
          )


          # ============================================================
          # CAPABILITY MODEL
          #
          # This remains deterministic and uses knowledge already
          # produced by Ledger 01/02/03.
          # ============================================================

          capability_groups = {
              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "technical report",
                  "write a report",
                  "report writing",
                  "analysis",
                  "investigation",
                  "web research",
                  "market research"
              ],
              "writing": [
                  "writing",
                  "copywriting",
                  "content",
                  "article",
                  "documentation",
                  "technical writing",
                  "report"
              ],
              "seo": [
                  "seo",
                  "seo audit",
                  "keyword",
                  "search engine"
              ],
              "qa": [
                  "qa",
                  "quality assurance",
                  "testing",
                  "api smoke tests",
                  "api testing",
                  "bug",
                  "debug"
              ],
              "data": [
                  "data",
                  "data cleanup",
                  "data analysis",
                  "csv",
                  "spreadsheet"
              ],
              "agent_tools": [
                  "build agent tools",
                  "agent tooling",
                  "tool development",
                  "automation",
                  "agent"
              ],
              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "prospecting"
              ],
              "cro": [
                  "cro",
                  "conversion rate",
                  "conversion optimization"
              ]
          }


          def capability_score(text):
              lower = text.lower()

              matches = []
              score = 0

              for group, keywords in capability_groups.items():
                  group_hits = [
                      keyword
                      for keyword in keywords
                      if keyword in lower
                  ]

                  if group_hits:
                      score += min(
                          25,
                          10 + (
                              5 * len(
                                  group_hits
                              )
                          )
                      )

                      matches.append({
                          "group": group,
                          "matches": group_hits[:5]
                      })

              score = min(
                  score,
                  100
              )

              return score, matches


          def safety_block_reason(text):
              lower = text.lower()

              blocked = [
                  "money transfer",
                  "send payment",
                  "pay invoice",
                  "purchase crypto",
                  "buy crypto",
                  "credential",
                  "password",
                  "private key",
                  "seed phrase",
                  "wallet recovery",
                  "identity verification",
                  "kyc",
                  "aml",
                  "illegal",
                  "malware",
                  "ransomware",
                  "credential theft"
              ]

              for keyword in blocked:
                  if keyword in lower:
                      return keyword

              return None


          # ============================================================
          # EVALUATION
          # ============================================================

          evaluations = []

          for task in tasks:

              task_id = str(
                  task.get(
                      "id",
                      ""
                  )
              )

              if not task_id:
                  continue

              text = extract_task_text(
                  task
              )

              status = normalize_text(
                  task.get(
                      "status",
                      ""
                  )
              ).lower()

              accepting = accepting_submissions(
                  task
              )

              capability, matches = capability_score(
                  text
              )

              blocked = safety_block_reason(
                  text
              )

              minimum, maximum = reward_range(
                  task
              )

              score = capability

              if minimum >= MIN_BID_SATS:
                  score += 10

              if maximum >= minimum and maximum > 0:
                  score += 5

              if accepting:
                  score += 10
              else:
                  score -= 30

              if blocked:
                  score = 0

              score = min(
                  max(score, 0),
                  100
              )

              evaluations.append({
                  "task_id": task_id,
                  "title": normalize_text(
                      task.get(
                          "title",
                          ""
                      )
                  ),
                  "status": status,
                  "accepting_submissions": accepting,
                  "capability_score": capability,
                  "score": score,
                  "reward_min_sats": minimum,
                  "reward_max_sats": maximum,
                  "matches": matches,
                  "blocked": blocked
              })


          # ============================================================
          # RECONCILE EXISTING BIDS
          # ============================================================

          print("")
          print(
              "=== BID RECONCILIATION ==="
          )

          tracked = memory.get(
              "bids",
              []
          )

          if not isinstance(tracked, list):
              tracked = []

          reconcile_count = 0
          accepted_now = []

          for record in tracked:

              if reconcile_count >= MAX_RECONCILE:
                  break

              task_id = str(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              bid_id = str(
                  record.get(
                      "bid_id",
                      ""
                  )
              )

              if not task_id or not bid_id:
                  continue

              try:
                  bids_response = api_get(
                      f"/marketplace/"
                      f"{task_id}/bids"
                  )

                  if isinstance(
                      bids_response,
                      dict
                  ):
                      bids = bids_response.get(
                          "items",
                          []
                      )
                  else:
                      bids = bids_response

                  if not isinstance(
                      bids,
                      list
                  ):
                      bids = []

                  own = None

                  for bid in bids:
                      candidate_id = str(
                          bid.get(
                              "id",
                              ""
                          )
                      )

                      bidder_name = normalize_text(
                          bid.get(
                              "bidder_name",
                              ""
                          )
                      )

                      if (
                          candidate_id == bid_id
                          or bidder_name.lower()
                          == IDENTITY.lower()
                      ):
                          if (
                              candidate_id == bid_id
                          ):
                              own = bid
                              break

                          if own is None:
                              own = bid

                  if own:
                      status = normalize_text(
                          own.get(
                              "status",
                              ""
                          )
                      ).lower()

                      record["status"] = status
                      record["last_seen_at"] = utc_now()

                      if status == "accepted":
                          accepted_now.append({
                              "task_id": task_id,
                              "bid_id": bid_id,
                              "amount_sats": safe_int(
                                  own.get(
                                      "amount_sats",
                                      record.get(
                                          "amount_sats",
                                          0
                                      )
                                  ),
                                  0
                              )
                          })

                  reconcile_count += 1

              except Exception as exc:
                  print(
                      "RECONCILE WARNING:",
                      task_id,
                      str(exc)[:300]
                  )


          # ============================================================
          # NEW BID SUBMISSION
          # ============================================================

          print("")
          print(
              "=== BID SELECTION ==="
          )

          candidates = [
              item
              for item in evaluations
              if (
                  item["accepting_submissions"]
                  and not item["blocked"]
                  and item["score"]
                  >= BID_SCORE_THRESHOLD
              )
          ]

          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["reward_max_sats"]
              ),
              reverse=True
          )

          existing_task_ids = {
              str(
                  record.get(
                      "task_id",
                      ""
                  )
              )
              for record in tracked
          }

          bids_created = 0

          for candidate in candidates:

              if bids_created >= MAX_BIDS_PER_RUN:
                  break

              task_id = candidate[
                  "task_id"
              ]

              if task_id in existing_task_ids:
                  continue

              amount = choose_bid_amount(
                  next(
                      (
                          task
                          for task in tasks
                          if str(
                              task.get(
                                  "id",
                                  ""
                              )
                          ) == task_id
                      ),
                      {}
                  )
              )

              if amount is None:
                  continue

              if amount < MIN_BID_SATS:
                  continue

              title = candidate[
                  "title"
              ]

              matches = candidate[
                  "matches"
              ]

              matched_groups = ", ".join(
                  item["group"]
                  for item in matches
              )

              message = (
                  "NØX can handle this task with a "
                  "deterministic workflow combining "
                  f"{matched_groups or 'analysis and execution'}. "
                  "I will verify the task requirements, "
                  "perform the requested work, and provide "
                  "a concise evidence-based delivery."
              )

              message = message[:5000]

              try:
                  result = api_post(
                      f"/marketplace/"
                      f"{task_id}/bid",
                      {
                          "amount_sats": amount,
                          "message": message
                      },
                      idempotency_key=make_idempotency_key(
                          "bid",
                          task_id,
                          str(amount)
                      )
                  )

                  bid_id = str(
                      result.get(
                          "id",
                          ""
                      )
                  )

                  record = {
                      "task_id": task_id,
                      "bid_id": bid_id,
                      "title": title,
                      "amount_sats": amount,
                      "status": normalize_text(
                          result.get(
                              "status",
                              "pending"
                          )
                      ).lower(),
                      "score": candidate[
                          "score"
                      ],
                      "created_at": utc_now(),
                      "last_seen_at": utc_now()
                  }

                  tracked.append(
                      record
                  )

                  existing_task_ids.add(
                      task_id
                  )

                  bids_created += 1

                  print(
                      "BID CREATED:",
                      task_id,
                      "amount=",
                      amount,
                      "bid_id=",
                      bid_id
                  )

              except Exception as exc:
                  print(
                      "BID ERROR:",
                      task_id,
                      str(exc)[:500]
                  )

                  memory["failures"].append({
                      "time": utc_now(),
                      "type": "bid_submission",
                      "task_id": task_id,
                      "error": str(exc)[:1000]
                  })


          # ============================================================
          # REFRESH ACCEPTED BIDS AFTER NEW BIDS
          # ============================================================

          accepted_missions = []

          for record in tracked:

              if normalize_text(
                  record.get(
                      "status",
                      ""
                  )
              ).lower() != "accepted":
                  continue

              task_id = str(
                  record.get(
                      "task_id",
                      ""
                  )
              )

              if not task_id:
                  continue

              task = next(
                  (
                      item
                      for item in tasks
                      if str(
                          item.get(
                              "id",
                              ""
                          )
                      ) == task_id
                  ),
                  None
              )

              if task is None:
                  try:
                      # The task list is public and may have moved
                      # beyond the current first page.
                      task = api_get(
                          f"/marketplace/tasks",
                          params={
                              "status": "accepted",
                              "limit": 100
                          }
                      )

                      if isinstance(
                          task,
                          dict
                      ):
                          accepted_tasks = task.get(
                              "items",
                              []
                          )
                      else:
                          accepted_tasks = task

                      task = next(
                          (
                              item
                              for item in accepted_tasks
                              if str(
                                  item.get(
                                      "id",
                                      ""
                                  )
                              ) == task_id
                          ),
                          None
                      )

                  except Exception:
                      task = None

              if task:
                  accepted_missions.append({
                      "task": task,
                      "bid": record
                  })


          print("")
          print(
              "ACCEPTED MISSIONS:",
              len(accepted_missions)
          )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def extract_urls(text):
              urls = re.findall(
                  r"https?://[^\s<>\"]+",
                  text
              )

              cleaned = []

              for url in urls:
                  url = url.rstrip(
                      ".,);]}>'\""
                  )

                  if url not in cleaned:
                      cleaned.append(
                          url
                      )

              return cleaned


          def fetch_url(url):
              parsed = urlparse(
                  url
              )

              if parsed.scheme not in (
                  "http",
                  "https"
              ):
                  return None

              try:
                  request = Request(
                      url,
                      headers={
                          "User-Agent":
                          "Nox-Ledger-04/1.0"
                      }
                  )

                  with urlopen(
                      request,
                      timeout=HTTP_TIMEOUT_SECONDS
                  ) as response:

                      content_type = (
                          response.headers.get(
                              "Content-Type",
                              ""
                          )
                      )

                      raw = response.read(
                          MAX_SOURCE_BYTES
                      )

                  if (
                      "text" not in content_type.lower()
                      and "json" not in content_type.lower()
                      and "xml" not in content_type.lower()
                  ):
                      return None

                  text = raw.decode(
                      "utf-8",
                      errors="replace"
                  )

                  text = re.sub(
                      r"<script.*?</script>",
                      " ",
                      text,
                      flags=re.I | re.S
                  )

                  text = re.sub(
                      r"<style.*?</style>",
                      " ",
                      text,
                      flags=re.I | re.S
                  )

                  text = re.sub(
                      r"<[^>]+>",
                      " ",
                      text
                  )

                  text = normalize_text(
                      text
                  )

                  return {
                      "url": url,
                      "domain": parsed.netloc,
                      "content": text[:12000]
                  }

              except Exception as exc:
                  return {
                      "url": url,
                      "domain": parsed.netloc,
                      "error": str(exc)[:500]
                  }


          def research_task(task):
              if not WEB_RESEARCH_ENABLED:
                  return []

              text = extract_task_text(
                  task
              )

              urls = extract_urls(
                  text
              )

              urls = urls[
                  :MAX_WEB_SOURCES
              ]

              results = []

              for url in urls:
                  result = fetch_url(
                      url
                  )

                  if result:
                      results.append(
                          result
                      )

              return results


          # ============================================================
          # DETERMINISTIC TASK EXECUTION
          # ============================================================

          def build_execution(task):
              title = normalize_text(
                  task.get(
                      "title",
                      ""
                  )
              )

              body = normalize_text(
                  task.get(
                      "body",
                      task.get(
                          "description",
                          ""
                      )
                  )
              )

              research = research_task(
                  task
              )

              sources = []

              for item in research:
                  if item.get("error"):
                      sources.append({
                          "url": item["url"],
                          "status": "error",
                          "error": item["error"]
                      })
                  else:
                      sources.append({
                          "url": item["url"],
                          "domain": item.get(
                              "domain",
                              ""
                          ),
                          "status": "fetched",
                          "excerpt": item.get(
                              "content",
                              ""
                          )[:1800]
                      })

              # --------------------------------------------------------
              # Deterministic execution:
              # No LLM is invoked.
              # The worker returns a transparent execution report
              # rather than fabricating an answer.
              # --------------------------------------------------------

              lines = []

              lines.append(
                  "NØX — DELIVERY REPORT"
              )

              lines.append("")
              lines.append(
                  f"Task: {title}"
              )

              lines.append(
                  "Execution mode: "
                  "deterministic / no external AI"
              )

              lines.append(
                  "Gemini: disabled"
              )

              lines.append(
                  "External AI: disabled"
              )

              lines.append("")

              lines.append(
                  "TASK REQUIREMENTS"
              )

              lines.append(
                  body[:4000]
              )

              lines.append("")

              if sources:
                  lines.append(
                      "WEB SOURCES CHECKED"
                  )

                  for index, source in enumerate(
                      sources,
                      start=1
                  ):
                      lines.append(
                          f"{index}. "
                          f"{source['url']}"
                      )

                      if source.get(
                          "excerpt"
                      ):
                          lines.append(
                              "   Evidence: "
                              + source[
                                  "excerpt"
                              ][:900]
                          )

                      if source.get(
                          "error"
                      ):
                          lines.append(
                              "   Fetch status: "
                              + source[
                                  "error"
                              ]
                          )

                      lines.append("")

              else:
                  lines.append(
                      "WEB RESEARCH"
                  )

                  lines.append(
                      "No explicit external URLs "
                      "were available in the task."
                  )

                  lines.append("")

              lines.append(
                  "EXECUTION STATUS"
              )

              lines.append(
                  "The task was inspected and "
                  "processed through the available "
                  "deterministic execution path."
              )

              lines.append(
                  "No unsupported claim was generated "
                  "and no external AI service was used."
              )

              delivery = "\n".join(
                  lines
              )

              if len(delivery) > MAX_DELIVERY_CHARS:
                  delivery = (
                      delivery[
                          :MAX_DELIVERY_CHARS - 120
                      ]
                      + "\n\n"
                      + "[Delivery truncated "
                      "to configured limit.]"
                  )

              return {
                  "delivery": delivery,
                  "sources": sources,
                  "research_count": len(
                      sources
                  )
              }


          # ============================================================
          # EXECUTE ACCEPTED MISSIONS
          # ============================================================

          executions_this_run = 0

          for mission in accepted_missions:

              if executions_this_run >= MAX_EXECUTIONS_PER_RUN:
                  break

              task = mission[
                  "task"
              ]

              bid = mission[
                  "bid"
              ]

              task_id = str(
                  task.get(
                      "id",
                      ""
                  )
              )

              if not task_id:
                  continue

              # --------------------------------------------------------
              # Idempotent execution guard
              # --------------------------------------------------------

              existing_execution = next(
                  (
                      item
                      for item in memory[
                          "executions"
                      ]
                      if str(
                          item.get(
                              "task_id",
                              ""
                          )
                      ) == task_id
                      and item.get(
                          "status"
                      ) in (
                          "delivered",
                          "completed"
                      )
                  ),
                  None
              )

              if existing_execution:
                  print(
                      "EXECUTION SKIP - already delivered:",
                      task_id
                  )
                  continue

              if not EXECUTION_ENABLED:
                  print(
                      "EXECUTION DISABLED:",
                      task_id
                  )
                  continue

              try:
                  print("")
                  print(
                      "EXECUTING:",
                      task_id
                  )

                  execution = build_execution(
                      task
                  )

                  delivery = execution[
                      "delivery"
                  ]

                  # ----------------------------------------------------
                  # PREVIEW
                  #
                  # The API exposes a real dry-run endpoint. We use it
                  # before creating the delivery comment.
                  # ----------------------------------------------------

                  preview = api_post(
                      f"/posts/"
                      f"{task_id}/comments/preview",
                      {
                          "body": delivery,
                          "parent_id": None,
                          "client": "nox-ledger-04"
                      }
                  )

                  if not preview.get(
                      "would_be_accepted",
                      False
                  ):
                      blocker = preview.get(
                          "blocker",
                          {}
                      )

                      reason = json.dumps(
                          blocker,
                          ensure_ascii=False
                      )[:1000]

                      raise RuntimeError(
                          "Delivery preview rejected: "
                          + reason
                      )

                  # ----------------------------------------------------
                  # ACTUAL DELIVERY
                  # ----------------------------------------------------

                  comment = api_post(
                      f"/posts/"
                      f"{task_id}/comments",
                      {
                          "body": delivery,
                          "parent_id": None,
                          "client": "nox-ledger-04"
                      },
                      idempotency_key=make_idempotency_key(
                          "delivery",
                          task_id
                      )
                  )

                  comment_id = str(
                      comment.get(
                          "id",
                          ""
                      )
                  )

                  execution_record = {
                      "task_id": task_id,
                      "bid_id": str(
                          bid.get(
                              "bid_id",
                              ""
                          )
                      ),
                      "status": "delivered",
                      "comment_id": comment_id,
                      "research_count": execution[
                          "research_count"
                      ],
                      "executed_at": utc_now()
                  }

                  memory[
                      "executions"
                  ].append(
                      execution_record
                  )

                  memory[
                      "deliveries"
                  ].append({
                      "task_id": task_id,
                      "comment_id": comment_id,
                      "delivered_at": utc_now(),
                      "chars": len(
                          delivery
                      ),
                      "sources": execution[
                          "research_count"
                      ]
                  })

                  executions_this_run += 1

                  print(
                      "DELIVERY CREATED:",
                      task_id,
                      "comment_id=",
                      comment_id
                  )

              except Exception as exc:
                  print(
                      "EXECUTION ERROR:",
                      task_id,
                      str(exc)[:700]
                  )

                  memory[
                      "executions"
                  ].append({
                      "task_id": task_id,
                      "bid_id": str(
                          bid.get(
                              "bid_id",
                              ""
                          )
                      ),
                      "status": "failed",
                      "error": str(exc)[:1500],
                      "executed_at": utc_now()
                  })

                  memory[
                      "failures"
                  ].append({
                      "time": utc_now(),
                      "type": "execution",
                      "task_id": task_id,
                      "error": str(exc)[:1500]
                  })


          # ============================================================
          # PAYMENT OBSERVATION ONLY
          # ============================================================

          payments_observed = 0

          for mission in accepted_missions:

              if payments_observed >= MAX_EXECUTIONS_PER_RUN:
                  break

              task = mission[
                  "task"
              ]

              task_id = str(
                  task.get(
                      "id",
                      ""
                  )
              )

              if not task_id:
                  continue

              try:
                  payment = api_get(
                      f"/marketplace/"
                      f"{task_id}/payment"
                  )

                  memory[
                      "payments_observed"
                  ].append({
                      "task_id": task_id,
                      "observed_at": utc_now(),
                      "payment": payment
                  })

                  payments_observed += 1

              except Exception as exc:
                  print(
                      "PAYMENT OBSERVATION WARNING:",
                      task_id,
                      str(exc)[:300]
                  )


          # ============================================================
          # LEARNING
          # ============================================================

          for evaluation in evaluations:

              if evaluation[
                  "score"
              ] < BID_SCORE_THRESHOLD:
                  continue

              memory[
                  "learning"
              ].append({
                  "time": utc_now(),
                  "task_id": evaluation[
                      "task_id"
                  ],
                  "score": evaluation[
                      "score"
                  ],
                  "capability_score": evaluation[
                      "capability_score"
                  ],
                  "reward_min_sats": evaluation[
                      "reward_min_sats"
                  ],
                  "reward_max_sats": evaluation[
                      "reward_max_sats"
                  ],
                  "accepted": any(
                      str(
                          mission[
                              "task"
                          ].get(
                              "id",
                              ""
                          )
                      )
                      == evaluation[
                          "task_id"
                      ]
                      for mission in accepted_missions
                  )
              })


          # ============================================================
          # MEMORY NORMALIZATION
          # ============================================================

          memory["bids"] = trim_list(
              tracked,
              MAX_MEMORY_ITEMS
          )

          memory[
              "accepted_missions"
          ] = trim_list(
              [
                  {
                      "task_id": str(
                          mission[
                              "task"
                          ].get(
                              "id",
                              ""
                          )
                      ),
                      "bid_id": str(
                          mission[
                              "bid"
                          ].get(
                              "bid_id",
                              ""
                          )
                      ),
                      "title": normalize_text(
                          mission[
                              "task"
                          ].get(
                              "title",
                              ""
                          )
                      ),
                      "amount_sats": safe_int(
                          mission[
                              "bid"
                          ].get(
                              "amount_sats",
                              0
                          ),
                          0
                      ),
                      "seen_at": utc_now()
                  }
                  for mission in accepted_missions
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "executions"
          ] = trim_list(
              memory[
                  "executions"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "deliveries"
          ] = trim_list(
              memory[
                  "deliveries"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "payments_observed"
          ] = trim_list(
              memory[
                  "payments_observed"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "learning"
          ] = trim_list(
              memory[
                  "learning"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "failures"
          ] = trim_list(
              memory[
                  "failures"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "web_research"
          ] = trim_list(
              memory[
                  "web_research"
              ],
              MAX_MEMORY_ITEMS
          )

          memory[
              "updated_at"
          ] = utc_now()


          # ============================================================
          # CURRENT RUN SNAPSHOT
          # ============================================================

          memory[
              "last_run"
          ] = {
              "time": utc_now(),
              "tasks_found": len(tasks),
              "tasks_evaluated": len(
                  evaluations
              ),
              "bid_candidates": len(
                  candidates
              ),
              "bids_created": bids_created,
              "tracked_bids": len(
                  tracked
              ),
              "accepted_missions": len(
                  accepted_missions
              ),
              "executions_this_run": executions_this_run,
              "payments_observed": payments_observed,
              "gemini_used": False,
              "external_ai_used": False,
              "payments_enabled": False,
              "spending_enabled": False,
              "project_cost_eur": 0
          }


          # ============================================================
          # SAVE
          # ============================================================

          save_json(
              LEDGER04,
              memory
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          pending = 0
          accepted = 0
          rejected = 0
          paid = 0

          for record in tracked:

              status = normalize_text(
                  record.get(
                      "status",
                      ""
                  )
              ).lower()

              if status == "pending":
                  pending += 1

              elif status == "accepted":
                  accepted += 1

              elif status == "rejected":
                  rejected += 1

              elif status in (
                  "paid",
                  "completed"
              ):
                  paid += 1


          print("")
          print(
              "=============================================="
          )
          print(
              "=== NØX LEDGER 04 COMPLETE                ==="
          )
          print(
              "=============================================="
          )

          print(
              "Identity:",
              IDENTITY
          )

          print(
              "Tasks found:",
              len(tasks)
          )

          print(
              "Tasks evaluated:",
              len(evaluations)
          )

          print(
              "Bid candidates:",
              len(candidates)
          )

          print(
              "Bids created:",
              bids_created
          )

          print(
              "Tracked bids:",
              len(tracked)
          )

          print(
              "Pending:",
              pending
          )

          print(
              "Accepted:",
              accepted
          )

          print(
              "Rejected:",
              rejected
          )

          print(
              "Paid observed:",
              paid
          )

          print(
              "Accepted missions:",
              len(accepted_missions)
          )

          print(
              "Executions this run:",
              executions_this_run
          )

          print(
              "Payments observed:",
              payments_observed
          )

          print(
              "Web research:",
              WEB_RESEARCH_ENABLED
          )

          print(
              "Gemini:",
              False
          )

          print(
              "External AI:",
              False
          )

          print(
              "Payments:",
              False
          )

          print(
              "Spending:",
              False
          )

          print(
              "Project cost: €0"
          )

          print(
              "Memory:",
              LEDGER04
          )

          print(
              "=============================================="
          )

          PY

          python /tmp/nox_ledger_04.py

      # ============================================================
      # COMMIT MEMORY
      # ============================================================
      - name: Commit Ledger 04 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          if [ -f memory/nox_ledger_marketplace.json ]; then
            git add memory/nox_ledger_marketplace.json
          fi

          if git diff --cached --quiet; then
            echo "No Ledger 04 memory changes to commit."
            exit 0
          fi

          git commit -m "chore: update NØX Ledger 04 marketplace memory"
          git push
