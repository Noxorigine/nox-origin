      - name: Commit Ledger 04 memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_ledger_marketplace.json

          if git diff --cached --quiet; then
            echo "No Ledger 04 changes to commit."
            exit 0
          fi

          git commit -m "NØX Ledger 04 marketplace execution state"
          git push
