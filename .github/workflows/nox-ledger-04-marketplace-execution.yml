name: NØX LEDGER 04 - Marketplace Execution V3

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: "https://thecolony.ai/api/v1"
      NOX_IDENTITY: "nox_origine"

      # ============================================================
      # HARD PROJECT CONSTRAINTS
      # ============================================================
      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # ============================================================
      # DISCOVERY
      # ============================================================
      MAX_TASKS: "100"
      MAX_RECONCILE: "30"

      # ============================================================
      # BIDDING
      # ============================================================
      MAX_BIDS_PER_RUN: "2"
      MIN_BID_SATS: "21"
      BID_SCORE_THRESHOLD: "70"
      MIN_FEASIBILITY_SCORE: "75"

      # ============================================================
      # EXECUTION
      # ============================================================
      EXECUTION_ENABLED: "true"
      MAX_EXECUTIONS_PER_RUN: "2"
      MAX_DELIVERY_CHARS: "9500"

      # ============================================================
      # WEB RESEARCH
      # ============================================================
      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"

      # ============================================================
      # MEMORY
      # ============================================================
      MAX_MEMORY_ITEMS: "500"
      MAX_TASK_MEMORY: "300"
      MAX_FAILURE_MEMORY: "200"

      # ============================================================
      # DECISION SAFETY
      # ============================================================
      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      # ============================================================
      # AUTH
      # ============================================================
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX Ledger 04
        run: |
          python <<'PY'
          import os
          import re
          import json
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          NOX_IDENTITY = os.environ["NOX_IDENTITY"]

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])

          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])
          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(os.environ["BID_SCORE_THRESHOLD"])
          MIN_FEASIBILITY_SCORE = int(
              os.environ["MIN_FEASIBILITY_SCORE"]
          )

          EXECUTION_ENABLED = (
              os.environ["EXECUTION_ENABLED"].lower() == "true"
          )

          MAX_EXECUTIONS_PER_RUN = int(
              os.environ["MAX_EXECUTIONS_PER_RUN"]
          )

          MAX_DELIVERY_CHARS = int(
              os.environ["MAX_DELIVERY_CHARS"]
          )

          WEB_RESEARCH_ENABLED = (
              os.environ["WEB_RESEARCH_ENABLED"].lower() == "true"
          )

          MAX_WEB_SOURCES = int(
              os.environ["MAX_WEB_SOURCES"]
          )

          HTTP_TIMEOUT_SECONDS = int(
              os.environ["HTTP_TIMEOUT_SECONDS"]
          )

          MAX_SOURCE_BYTES = int(
              os.environ["MAX_SOURCE_BYTES"]
          )

          MAX_MEMORY_ITEMS = int(
              os.environ["MAX_MEMORY_ITEMS"]
          )

          MAX_TASK_MEMORY = int(
              os.environ["MAX_TASK_MEMORY"]
          )

          MAX_FAILURE_MEMORY = int(
              os.environ["MAX_FAILURE_MEMORY"]
          )

          REQUIRE_CLEAR_DELIVERABLE = (
              os.environ["REQUIRE_CLEAR_DELIVERABLE"].lower()
              == "true"
          )

          REQUIRE_ZERO_COST_EXECUTION = (
              os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower()
              == "true"
          )

          REQUIRE_NO_EXTERNAL_AI = (
              os.environ["REQUIRE_NO_EXTERNAL_AI"].lower()
              == "true"
          )

          MEMORY_MARKETPLACE = (
              "memory/nox_ledger_marketplace.json"
          )

          MEMORY_ACTION = (
              "memory/nox_ledger_action.json"
          )

          MEMORY_KNOWLEDGE = (
              "memory/nox_ledger_knowledge.json"
          )

          MEMORY_COGNITION = (
              "memory/nox_ledger_cognition.json"
          )

          API_TIMEOUT = 25


          # ============================================================
          # HTTP SESSION
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Nox-Ledger-04/3.0"
          })


          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def normalize(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  try:
                      return json.dumps(
                          value,
                          ensure_ascii=False
                      )
                  except Exception:
                      return str(value)

              return str(value)


          def compact(value, limit=700):
              text = normalize(value)
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

              return text[:limit]


          def load_json(path, default):
              try:
                  if not os.path.exists(path):
                      return default

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      return json.load(handle)

              except Exception as exc:
                  print(
                      f"MEMORY READ WARNING: "
                      f"{path}: {compact(exc)}"
                  )

                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)

              if directory:
                  os.makedirs(
                      directory,
                      exist_ok=True
                  )

              temporary = path + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temporary,
                  path
              )


          def trim_list(items, limit):
              if not isinstance(items, list):
                  return []

              return items[-limit:]


          def stable_id(prefix, value):
              digest = hashlib.sha256(
                  normalize(value).encode("utf-8")
              ).hexdigest()[:20]

              return f"{prefix}-{digest}"


          def idempotency_key(action, task_id):
              hour_key = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d-%H"
              )

              return stable_id(
                  f"nox-ledger04-{action}",
                  (
                      f"{NOX_IDENTITY}:"
                      f"{task_id}:"
                      f"{action}:"
                      f"{hour_key}"
                  )
              )


          def extract_text(value, depth=0):
              if depth > 6:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(
                  value,
                  (int, float, bool)
              ):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      extract_text(
                          item,
                          depth + 1
                      )
                      for item in value[:200]
                  )

              if isinstance(value, dict):
                  parts = []

                  for key, item in list(
                      value.items()
                  )[:300]:

                      parts.append(str(key))
                      parts.append(
                          extract_text(
                              item,
                              depth + 1
                          )
                      )

                  return " ".join(parts)

              return ""


          def recursive_values(
              obj,
              wanted_keys,
              depth=0
          ):
              if depth > 7:
                  return []

              results = []

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      if str(key).lower() in wanted_keys:
                          results.append(value)

                      results.extend(
                          recursive_values(
                              value,
                              wanted_keys,
                              depth + 1
                          )
                      )

              elif isinstance(obj, list):

                  for value in obj[:300]:

                      results.extend(
                          recursive_values(
                              value,
                              wanted_keys,
                              depth + 1
                          )
                      )

              return results


          def first_string(obj, keys):
              wanted = {
                  str(key).lower()
                  for key in keys
              }

              values = recursive_values(
                  obj,
                  wanted
              )

              for value in values:

                  if isinstance(
                      value,
                      str
                  ) and value.strip():

                      return value.strip()

                  if isinstance(
                      value,
                      (int, float)
                  ):
                      return str(value)

              return ""


          def first_number(obj, keys):
              wanted = {
                  str(key).lower()
                  for key in keys
              }

              values = recursive_values(
                  obj,
                  wanted
              )

              for value in values:

                  if isinstance(
                      value,
                      (int, float)
                  ):
                      return float(value)

                  text = normalize(
                      value
                  ).strip()

                  match = re.fullmatch(
                      r"\d+(?:\.\d+)?",
                      text
                  )

                  if match:
                      return float(text)

              return None


          # ============================================================
          # API
          # ============================================================

          if not API_KEY:
              raise SystemExit(
                  "COLONY_API_KEY secret is missing."
              )

          print(
              "=============================================="
          )
          print(
              "=== NØX LEDGER 04 - MARKETPLACE EXECUTION ==="
          )
          print(
              "=== V3 COGNITIVE MARKETPLACE ENGINE       ==="
          )
          print(
              "=============================================="
          )


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print()
          print(
              "=== AUTHENTICATION ==="
          )

          token_response = requests.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": API_KEY
              },
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "Nox-Ledger-04/3.0"
              },
              timeout=API_TIMEOUT
          )

          if token_response.status_code >= 400:
              raise SystemExit(
                  "AUTH ERROR: "
                  "POST /auth/token -> "
                  f"{token_response.status_code}: "
                  f"{compact(token_response.text, 500)}"
              )

          token_data = token_response.json()

          access_token = normalize(
              token_data.get(
                  "access_token"
              )
          ).strip()

          if not access_token:
              raise SystemExit(
                  "AUTH ERROR: access_token missing."
              )

          token_type = normalize(
              token_data.get(
                  "token_type",
                  "Bearer"
              )
          ).strip()

          if not token_type:
              token_type = "Bearer"

          session.headers["Authorization"] = (
              f"{token_type.capitalize()} "
              f"{access_token}"
          )

          print(
              "JWT obtained: YES"
          )

          print(
              "API key used only for token exchange: YES"
          )

          print(
              "Bearer credential: JWT"
          )

          print(
              "JWT value: HIDDEN"
          )


          def api_get(path, params=None):
              response = session.get(
                  f"{API_BASE}{path}",
                  params=params,
                  timeout=API_TIMEOUT
              )

              if response.status_code == 401:
                  raise RuntimeError(
                      f"401 unauthorized: GET {path}"
                  )

              if response.status_code >= 400:
                  raise RuntimeError(
                      f"GET {path} -> "
                      f"{response.status_code}: "
                      f"{compact(response.text, 500)}"
                  )

              try:
                  return response.json()
              except Exception:
                  return {}


          def api_post(
              path,
              payload=None,
              extra_headers=None
          ):
              headers = {}

              if extra_headers:
                  headers.update(
                      extra_headers
                  )

              return session.post(
                  f"{API_BASE}{path}",
                  json=payload or {},
                  headers=headers,
                  timeout=API_TIMEOUT
              )


          # ============================================================
          # IDENTITY
          # ============================================================

          try:
              me = api_get(
                  "/users/me"
              )

              identity = (
                  first_string(
                      me,
                      [
                          "username",
                          "handle",
                          "name",
                          "identity"
                      ]
                  )
                  or NOX_IDENTITY
              )

              print()
              print(
                  f"IDENTITY: {identity}"
              )

          except Exception as exc:
              raise SystemExit(
                  "IDENTITY ERROR: "
                  f"{compact(exc)}"
              )


          # ============================================================
          # LOAD INTER-LEDGER CONTEXT
          # ============================================================

          ledger01 = load_json(
              MEMORY_KNOWLEDGE,
              {}
          )

          ledger02 = load_json(
              MEMORY_COGNITION,
              {}
          )

          ledger03 = load_json(
              MEMORY_ACTION,
              {}
          )

          marketplace_memory = load_json(
              MEMORY_MARKETPLACE,
              {}
          )

          print()
          print(
              "=== INTER-LEDGER CONTEXT ==="
          )

          print(
              "Ledger 01 knowledge loaded: "
              + (
                  "YES"
                  if ledger01
                  else "NO"
              )
          )

          print(
              "Ledger 02 cognition loaded: "
              + (
                  "YES"
                  if ledger02
                  else "NO"
              )
          )

          print(
              "Ledger 03 action/learning loaded: "
              + (
                  "YES"
                  if ledger03
                  else "NO"
              )
          )


          # ============================================================
          # CAPABILITY MODEL
          # ============================================================

          CAPABILITY_GROUPS = {

              "research": [
                  "research",
                  "deep research",
                  "research report",
                  "research brief",
                  "web research",
                  "market research",
                  "competitive research",
                  "fact checking",
                  "fact-checking",
                  "source analysis",
                  "information gathering"
              ],

              "writing": [
                  "writing",
                  "write",
                  "report writing",
                  "write a report",
                  "technical report",
                  "research report",
                  "documentation",
                  "copywriting",
                  "content writing",
                  "analysis",
                  "brief",
                  "summary"
              ],

              "seo": [
                  "seo",
                  "seo audit",
                  "search optimization",
                  "keyword research",
                  "competitor analysis"
              ],

              "qa": [
                  "qa",
                  "quality assurance",
                  "api smoke test",
                  "api testing",
                  "testing",
                  "test endpoints",
                  "bug finding",
                  "bug report"
              ],

              "data": [
                  "data cleanup",
                  "data cleaning",
                  "csv",
                  "json",
                  "data analysis",
                  "data validation",
                  "spreadsheet",
                  "structured data"
              ],

              "agent_tools": [
                  "agent tooling",
                  "build agent tools",
                  "agent tools",
                  "tool development",
                  "automation",
                  "api integration",
                  "agent integration"
              ],

              "lead_scoring": [
                  "lead scoring",
                  "lead generation",
                  "lead research",
                  "prospect research"
              ],

              "cro": [
                  "cro",
                  "conversion rate",
                  "conversion optimization",
                  "landing page analysis"
              ]
          }


          def capability_matches(text):
              lowered = text.lower()
              matches = []

              for group, terms in (
                  CAPABILITY_GROUPS.items()
              ):
                  if any(
                      term in lowered
                      for term in terms
                  ):
                      matches.append(group)

              return matches


          # ============================================================
          # HARD CONSTRAINTS
          # ============================================================

          HARD_BLOCKS = [
              "buy",
              "purchase",
              "pay for",
              "payment required",
              "credit card",
              "bank transfer",
              "paid api",
              "paid api key",
              "paid service",
              "subscription required",
              "aws billing",
              "azure billing",
              "gcp billing",
              "deploy to aws",
              "deploy on aws",
              "deploy to azure",
              "deploy on azure",
              "deploy to gcp",
              "deploy on gcp",
              "openai api key required",
              "gpt-4 api key",
              "gpt-5 api key",
              "gemini api key",
              "external ai required",
              "captcha solving",
              "credential required",
              "login required",
              "private account access",
              "wallet access",
              "send funds",
              "transfer funds",
              "financial transaction"
          ]


          def hard_block_reasons(text):
              lowered = text.lower()

              return [
                  term
                  for term in HARD_BLOCKS
                  if term in lowered
              ]


          def requires_external_ai(text):
              lowered = text.lower()

              indicators = [
                  "use chatgpt",
                  "use gpt",
                  "use gpt-4",
                  "use gpt-5",
                  "use gemini",
                  "use claude",
                  "use anthropic",
                  "use openai",
                  "use external ai",
                  "llm api",
                  "model api"
              ]

              return any(
                  indicator in lowered
                  for indicator in indicators
              )


          def requires_paid_infrastructure(text):
              lowered = text.lower()

              indicators = [
                  "aws",
                  "azure",
                  "google cloud",
                  "gcp",
                  "paid hosting",
                  "paid server",
                  "paid database",
                  "subscription",
                  "premium api"
              ]

              return any(
                  indicator in lowered
                  for indicator in indicators
              )


          def has_clear_deliverable(text):
              terms = [
                  "report",
                  "audit",
                  "analysis",
                  "document",
                  "brief",
                  "findings",
                  "results",
                  "list",
                  "csv",
                  "json",
                  "recommendations",
                  "test results",
                  "bug report",
                  "documentation",
                  "comparison",
                  "research"
              ]

              lowered = text.lower()

              return any(
                  term in lowered
                  for term in terms
              )


          def reward_unit_conflict(text):
              lowered = text.lower()

              explicit_sats = bool(
                  re.search(
                      r"\b\d[\d,.\s]*"
                      r"\s*(sats|sat|satoshi|satoshis)\b",
                      lowered
                  )
              )

              explicit_usdc = bool(
                  re.search(
                      r"\b(usdc|usd)\b",
                      lowered
                  )
              )

              return (
                  explicit_sats
                  and explicit_usdc
              )


          def extract_urls(text):
              urls = re.findall(
                  r"https?://[^\s<>\"]+",
                  text
              )

              cleaned = []

              for url in urls:

                  url = url.rstrip(
                      ".,);]"
                  )

                  try:
                      parsed = urlparse(
                          url
                      )

                      if (
                          parsed.scheme
                          in ("http", "https")
                          and parsed.netloc
                      ):
                          cleaned.append(
                              url
                          )

                  except Exception:
                      continue

              return list(
                  dict.fromkeys(
                      cleaned
                  )
              )


          # ============================================================
          # MARKETPLACE DISCOVERY
          # ============================================================

          print()
          print(
              "=== MARKETPLACE DISCOVERY ==="
          )

          try:
              task_data = api_get(
                  "/marketplace/tasks",
                  params={
                      "limit": MAX_TASKS
                  }
              )

          except Exception as exc:
              raise SystemExit(
                  "MARKETPLACE DISCOVERY ERROR: "
                  f"{compact(exc)}"
              )

          if isinstance(
              task_data,
              list
          ):
              tasks = task_data

          elif isinstance(
              task_data,
              dict
          ):
              tasks = (
                  task_data.get("tasks")
                  or task_data.get("items")
                  or task_data.get("results")
                  or []
              )

          else:
              tasks = []

          print(
              f"TASKS FOUND: {len(tasks)}"
          )


          # ============================================================
          # EXISTING BID RECONCILIATION
          # ============================================================

          print()
          print(
              "=== BID RECONCILIATION ==="
          )

          tracked_bids = []

          if isinstance(
              marketplace_memory,
              dict
          ):
              tracked_bids = marketplace_memory.get(
                  "tracked_bids",
                  []
              )

          if not isinstance(
              tracked_bids,
              list
          ):
              tracked_bids = []

          reconciled = []

          for record in tracked_bids[
              :MAX_RECONCILE
          ]:

              task_id_value = normalize(
                  record.get(
                      "task_id",
                      ""
                  )
              ).strip()

              bid_id_value = normalize(
                  record.get(
                      "bid_id",
                      ""
                  )
              ).strip()

              if not task_id_value:
                  continue

              try:
                  bids_data = api_get(
                      f"/marketplace/"
                      f"{task_id_value}/bids"
                  )

                  if isinstance(
                      bids_data,
                      list
                  ):
                      bids = bids_data

                  elif isinstance(
                      bids_data,
                      dict
                  ):
                      bids = (
                          bids_data.get("bids")
                          or bids_data.get("items")
                          or []
                      )

                  else:
                      bids = []

                  matched = None

                  for bid in bids:

                      current_id = first_string(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      if (
                          bid_id_value
                          and current_id
                          == bid_id_value
                      ):
                          matched = bid
                          break

                  if matched:

                      status = first_string(
                          matched,
                          [
                              "status"
                          ]
                      ).lower()

                      record["status"] = status
                      record[
                          "last_reconciled_at"
                      ] = now_iso()

                      record["accepted"] = (
                          status == "accepted"
                      )

                      record["rejected"] = (
                          status == "rejected"
                      )

                  reconciled.append(
                      record
                  )

              except Exception as exc:

                  record[
                      "reconcile_error"
                  ] = compact(exc)

                  record[
                      "last_reconciled_at"
                  ] = now_iso()

                  reconciled.append(
                      record
                  )

          tracked_bids = reconciled

          print(
              f"Tracked bids: "
              f"{len(tracked_bids)}"
          )


          # ============================================================
          # PLATFORM BID LIMIT
          # ============================================================

          print()
          print(
              "=== PLATFORM ACTION BUDGET ==="
          )

          bid_limit_remaining = None
          bid_limit_current = None
          bid_limit_max = None
          bid_limit_retry_after = None

          limits_available = False

          try:
              limits = api_get(
                  "/limits/me"
              )

              def find_limit_node(
                  obj,
                  target="bid",
                  depth=0
              ):
                  if depth > 8:
                      return None

                  if isinstance(
                      obj,
                      dict
                  ):

                      for key, value in (
                          obj.items()
                      ):

                          key_text = str(
                              key
                          ).lower()

                          if target in key_text:

                              if isinstance(
                                  value,
                                  dict
                              ):
                                  return value

                          found = find_limit_node(
                              value,
                              target,
                              depth + 1
                          )

                          if found is not None:
                              return found

                  elif isinstance(
                      obj,
                      list
                  ):

                      for value in obj[:300]:

                          found = find_limit_node(
                              value,
                              target,
                              depth + 1
                          )

                          if found is not None:
                              return found

                  return None


              bid_node = find_limit_node(
                  limits,
                  "bid"
              )

              if isinstance(
                  bid_node,
                  dict
              ):

                  bid_limit_remaining = (
                      first_number(
                          bid_node,
                          [
                              "remaining",
                              "remaining_count"
                          ]
                      )
                  )

                  bid_limit_current = (
                      first_number(
                          bid_node,
                          [
                              "current",
                              "used",
                              "usage"
                          ]
                      )
                  )

                  bid_limit_max = (
                      first_number(
                          bid_node,
                          [
                              "limit",
                              "max",
                              "maximum"
                          ]
                      )
                  )

                  bid_limit_retry_after = (
                      first_number(
                          bid_node,
                          [
                              "retry_after",
                              "retry_after_seconds"
                          ]
                      )
                  )

              if bid_limit_remaining is not None:
                  bid_limit_remaining = max(
                      0,
                      int(
                          bid_limit_remaining
                      )
                  )

              if bid_limit_current is not None:
                  bid_limit_current = int(
                      bid_limit_current
                  )

              if bid_limit_max is not None:
                  bid_limit_max = int(
                      bid_limit_max
                  )

              limits_available = (
                  bid_limit_remaining
                  is not None
              )

              print(
                  "Bid limit max: "
                  + (
                      str(bid_limit_max)
                      if bid_limit_max is not None
                      else "UNKNOWN"
                  )
              )

              print(
                  "Bid usage: "
                  + (
                      str(bid_limit_current)
                      if bid_limit_current is not None
                      else "UNKNOWN"
                  )
              )

              print(
                  "Bid remaining: "
                  + (
                      str(bid_limit_remaining)
                      if bid_limit_remaining is not None
                      else "UNKNOWN"
                  )
              )

          except Exception as exc:

              print(
                  "LIMIT CHECK WARNING: "
                  f"{compact(exc)}"
              )

              print(
                  "New bidding: DEFERRED "
                  "(rate-limit state unknown)"
              )


          # ============================================================
          # HISTORICAL MEMORY
          # ============================================================

          previous_failures = []

          previous_outcomes = []

          if isinstance(
              marketplace_memory,
              dict
          ):

              previous_failures = (
                  marketplace_memory.get(
                      "failures",
                      []
                  )
              )

              previous_outcomes = (
                  marketplace_memory.get(
                      "outcomes",
                      []
                  )
              )

          if not isinstance(
              previous_failures,
              list
          ):
              previous_failures = []

          if not isinstance(
              previous_outcomes,
              list
          ):
              previous_outcomes = []

          failure_text = extract_text(
              previous_failures[
                  -MAX_FAILURE_MEMORY:
              ]
          ).lower()

          outcome_text = extract_text(
              previous_outcomes[
                  -MAX_TASK_MEMORY:
              ]
          ).lower()


          # ============================================================
          # TASK HELPERS
          # ============================================================

          def get_task_id(task):
              return first_string(
                  task,
                  [
                      "id",
                      "post_id",
                      "task_id"
                  ]
              )


          def get_task_title(task):
              return first_string(
                  task,
                  [
                      "title",
                      "name"
                  ]
              )


          def get_task_body(task):
              return first_string(
                  task,
                  [
                      "description",
                      "body",
                      "content",
                      "details",
                      "task"
                  ]
              )


          def get_task_status(task):
              return first_string(
                  task,
                  [
                      "status"
                  ]
              ).lower()


          # ============================================================
          # COGNITIVE TASK EVALUATION
          # ============================================================

          print()
          print(
              "=== COGNITIVE MARKETPLACE ANALYSIS ==="
          )

          evaluations = []
          bid_candidates = []
          skip_reasons = {}

          def record_skip(reason):
              skip_reasons[reason] = (
                  skip_reasons.get(
                      reason,
                      0
                  ) + 1
              )


          for task in tasks:

              task_id_value = get_task_id(
                  task
              )

              title = get_task_title(
                  task
              )

              body = get_task_body(
                  task
              )

              if not task_id_value:
                  record_skip(
                      "NO_TASK_ID"
                  )
                  continue

              full_text = " ".join([
                  title,
                  body,
                  extract_text(task)
              ]).strip()

              lowered = full_text.lower()

              status = get_task_status(
                  task
              )

              if status in (
                  "closed",
                  "completed",
                  "cancelled",
                  "canceled"
              ):
                  record_skip(
                      "CLOSED_TASK"
                  )
                  continue

              # --------------------------------------------------------
              # ALREADY TRACKED
              # --------------------------------------------------------

              already_tracked = any(
                  normalize(
                      item.get(
                          "task_id",
                          ""
                      )
                  ) == task_id_value
                  for item in tracked_bids
              )

              if already_tracked:
                  record_skip(
                      "ALREADY_TRACKED"
                  )
                  continue

              # --------------------------------------------------------
              # CAPABILITY
              # --------------------------------------------------------

              capabilities = capability_matches(
                  full_text
              )

              if not capabilities:
                  record_skip(
                      "NO_CAPABILITY"
                  )
                  continue

              capability_score = min(
                  100,
                  50
                  + (
                      len(capabilities)
                      * 15
                  )
              )

              # --------------------------------------------------------
              # HARD BLOCKS
              # --------------------------------------------------------

              blocks = hard_block_reasons(
                  full_text
              )

              if blocks:
                  record_skip(
                      "HARD_CONSTRAINT"
                  )
                  continue

              external_ai = (
                  requires_external_ai(
                      full_text
                  )
              )

              if (
                  REQUIRE_NO_EXTERNAL_AI
                  and external_ai
              ):
                  record_skip(
                      "EXTERNAL_AI_REQUIRED"
                  )
                  continue

              paid_infrastructure = (
                  requires_paid_infrastructure(
                      full_text
                  )
              )

              if (
                  REQUIRE_ZERO_COST_EXECUTION
                  and paid_infrastructure
              ):
                  record_skip(
                      "PAID_INFRASTRUCTURE"
                  )
                  continue

              # --------------------------------------------------------
              # DELIVERABLE
              # --------------------------------------------------------

              clear_deliverable = (
                  has_clear_deliverable(
                      full_text
                  )
              )

              if (
                  REQUIRE_CLEAR_DELIVERABLE
                  and not clear_deliverable
              ):
                  record_skip(
                      "UNCLEAR_DELIVERABLE"
                  )
                  continue

              # --------------------------------------------------------
              # REWARD COHERENCE
              # --------------------------------------------------------

              reward_conflict = (
                  reward_unit_conflict(
                      full_text
                  )
              )

              if reward_conflict:
                  record_skip(
                      "REWARD_UNIT_CONFLICT"
                  )
                  continue

              reward_score = 65

              # A reward explicitly mentioned in the task
              # is a positive information signal, but never
              # becomes an automatic bid amount.
              reward_match = re.search(
                  r"(\d[\d,.\s]*)\s*"
                  r"(sats|sat|satoshi|satoshis)",
                  lowered
              )

              if reward_match:
                  reward_score = 85

              # --------------------------------------------------------
              # CLARITY
              # --------------------------------------------------------

              clarity_score = 100

              if len(body.strip()) < 80:
                  clarity_score -= 20

              if len(body.strip()) < 40:
                  clarity_score -= 20

              if len(body.strip()) < 15:
                  clarity_score -= 25

              clarity_score = max(
                  0,
                  min(
                      100,
                      clarity_score
                  )
              )

              # --------------------------------------------------------
              # RESEARCH
              # --------------------------------------------------------

              urls = extract_urls(
                  full_text
              )

              research_score = 70

              if urls:
                  research_score = 90

              if "research" in lowered:
                  research_score = max(
                      research_score,
                      85
                  )

              # --------------------------------------------------------
              # HISTORY
              # --------------------------------------------------------

              historical_risk = 0
              historical_positive = 0

              title_tokens = set(
                  re.findall(
                      r"[a-z0-9]{4,}",
                      title.lower()
                  )
              )

              if (
                  title_tokens
                  and failure_text
              ):

                  overlap = sum(
                      1
                      for token in title_tokens
                      if token in failure_text
                  )

                  if overlap >= 4:
                      historical_risk = 20

                  elif overlap >= 2:
                      historical_risk = 10

              if (
                  title_tokens
                  and outcome_text
              ):

                  overlap = sum(
                      1
                      for token in title_tokens
                      if token in outcome_text
                  )

                  if overlap >= 4:
                      historical_positive = 15

                  elif overlap >= 2:
                      historical_positive = 8

              # --------------------------------------------------------
              # FEASIBILITY
              # --------------------------------------------------------

              feasibility_score = int(
                  (
                      capability_score * 0.30
                      + clarity_score * 0.15
                      + research_score * 0.15
                      + (
                          100
                          if clear_deliverable
                          else 0
                      ) * 0.15
                      + reward_score * 0.10
                      + 80 * 0.15
                      + historical_positive
                      - historical_risk
                  )
              )

              feasibility_score = max(
                  0,
                  min(
                      100,
                      feasibility_score
                  )
              )

              # --------------------------------------------------------
              # OPPORTUNITY
              # --------------------------------------------------------

              opportunity_score = int(
                  (
                      feasibility_score * 0.55
                      + reward_score * 0.20
                      + capability_score * 0.15
                      + clarity_score * 0.10
                  )
              )

              opportunity_score = max(
                  0,
                  min(
                      100,
                      opportunity_score
                  )
              )

              # --------------------------------------------------------
              # FINAL DECISION
              # --------------------------------------------------------

              decision = (
                  feasibility_score
                  >= MIN_FEASIBILITY_SCORE
                  and
                  opportunity_score
                  >= BID_SCORE_THRESHOLD
                  and
                  not external_ai
                  and
                  not paid_infrastructure
                  and
                  not reward_conflict
              )

              evaluation = {
                  "task_id": task_id_value,
                  "title": title,
                  "capabilities": capabilities,
                  "feasibility_score":
                      feasibility_score,
                  "opportunity_score":
                      opportunity_score,
                  "capability_score":
                      capability_score,
                  "clarity_score":
                      clarity_score,
                  "research_score":
                      research_score,
                  "reward_score":
                      reward_score,
                  "historical_risk":
                      historical_risk,
                  "historical_positive":
                      historical_positive,
                  "urls":
                      urls[:MAX_WEB_SOURCES],
                  "decision":
                      (
                          "BID_CANDIDATE"
                          if decision
                          else "NO_BID"
                      ),
                  "evaluated_at":
                      now_iso()
              }

              evaluations.append(
                  evaluation
              )

              if decision:
                  bid_candidates.append(
                      evaluation
                  )


          # ============================================================
          # SORT BY QUALITY
          # ============================================================

          bid_candidates.sort(
              key=lambda item: (
                  item["feasibility_score"],
                  item["opportunity_score"],
                  item["clarity_score"],
                  item["capability_score"]
              ),
              reverse=True
          )

          print(
              f"TASKS EVALUATED: "
              f"{len(evaluations)}"
          )

          print(
              f"INTELLIGENT BID CANDIDATES: "
              f"{len(bid_candidates)}"
          )

          print()
          print(
              "=== SELECTION FILTERS ==="
          )

          for reason, count in sorted(
              skip_reasons.items(),
              key=lambda item: (
                  -item[1],
                  item[0]
              )
          ):
              print(
                  f"{reason}: {count}"
              )


          # ============================================================
          # BID EXECUTION
          # ============================================================

          print()
          print(
              "=== BID DECISION ENGINE ==="
          )

          bids_created = 0
          bid_errors = 0
          rate_limited = False
          bids_deferred = 0

          if not limits_available:

              bids_deferred = len(
                  bid_candidates
              )

              print(
                  "BIDDING DEFERRED: "
                  "platform bid budget unknown."
              )

          else:

              available_budget = max(
                  0,
                  int(
                      bid_limit_remaining
                  )
              )

              allowed_this_run = min(
                  MAX_BIDS_PER_RUN,
                  available_budget
              )

              if allowed_this_run <= 0:

                  bids_deferred = len(
                      bid_candidates
                  )

                  print(
                      "BIDDING DEFERRED: "
                      "no bid budget remaining."
                  )

              else:

                  selected = bid_candidates[
                      :allowed_this_run
                  ]

                  bids_deferred = max(
                      0,
                      len(
                          bid_candidates
                      )
                      - len(selected)
                  )

                  print(
                      f"Bid budget available: "
                      f"{available_budget}"
                  )

                  print(
                      f"Maximum bids this run: "
                      f"{allowed_this_run}"
                  )

                  print(
                      f"Selected high-quality bids: "
                      f"{len(selected)}"
                  )

                  for candidate in selected:

                      task_id_value = (
                          candidate[
                              "task_id"
                          ]
                      )

                      title = candidate[
                          "title"
                      ]

                      # ------------------------------------------------
                      # IMPORTANT:
                      # Bid amount is never derived from a possible
                      # USD/USDC amount in a task title.
                      # Use the platform minimum safe amount.
                      # ------------------------------------------------

                      bid_amount = max(
                          MIN_BID_SATS,
                          21
                      )

                      message = (
                          "NØX can perform this mission "
                          "using its current research, "
                          "analysis and structured-delivery "
                          "capabilities. "
                          "Execution remains within the "
                          "available zero-cost environment "
                          "and does not require external AI."
                      )

                      payload = {
                          "amount_sats":
                              bid_amount,
                          "message":
                              message
                      }

                      print()
                      print(
                          "BID ATTEMPT:"
                      )

                      print(
                          f"  Task: "
                          f"{task_id_value}"
                      )

                      print(
                          f"  Score: "
                          f"{candidate['opportunity_score']}"
                      )

                      print(
                          f"  Feasibility: "
                          f"{candidate['feasibility_score']}"
                      )

                      print(
                          f"  Amount: "
                          f"{bid_amount} sats"
                      )

                      try:

                          response = api_post(
                              (
                                  f"/marketplace/"
                                  f"{task_id_value}/bid"
                              ),
                              payload,
                              extra_headers={
                                  "Idempotency-Key":
                                      idempotency_key(
                                          "bid",
                                          task_id_value
                                      )
                              }
                          )

                          # ------------------------------------------------
                          # RATE LIMIT = STOP IMMEDIATELY
                          # ------------------------------------------------

                          if response.status_code == 429:

                              rate_limited = True
                              bid_errors += 1

                              retry_after = (
                                  response.headers.get(
                                      "Retry-After"
                                  )
                              )

                              print(
                                  "BID RATE LIMITED: "
                                  f"{task_id_value}"
                              )

                              print(
                                  "Retry-After: "
                                  + (
                                      retry_after
                                      or "unknown"
                                  )
                              )

                              # Never continue hammering the endpoint.
                              break

                          if response.status_code >= 400:

                              bid_errors += 1

                              print(
                                  "BID ERROR: "
                                  f"{task_id_value} "
                                  f"-> "
                                  f"{response.status_code}: "
                                  f"{compact(response.text, 500)}"
                              )

                              continue

                          try:
                              result = (
                                  response.json()
                              )
                          except Exception:
                              result = {}

                          new_bid_id = first_string(
                              result,
                              [
                                  "id",
                                  "bid_id"
                              ]
                          )

                          tracked_bids.append({
                              "task_id":
                                  task_id_value,
                              "bid_id":
                                  new_bid_id,
                              "title":
                                  title,
                              "amount_sats":
                                  bid_amount,
                              "status":
                                  "pending",
                              "accepted":
                                  False,
                              "rejected":
                                  False,
                              "feasibility_score":
                                  candidate[
                                      "feasibility_score"
                                  ],
                              "opportunity_score":
                                  candidate[
                                      "opportunity_score"
                                  ],
                              "capabilities":
                                  candidate[
                                      "capabilities"
                                  ],
                              "created_at":
                                  now_iso()
                          })

                          bids_created += 1

                          print(
                              "BID CREATED: "
                              f"{task_id_value}"
                          )

                      except Exception as exc:

                          bid_errors += 1

                          print(
                              "BID EXCEPTION: "
                              f"{task_id_value}: "
                              f"{compact(exc)}"
                          )


          # ============================================================
          # ACCEPTED MISSION DETECTION
          # ============================================================

          print()
          print(
              "=== ACCEPTED MISSION DETECTION ==="
          )

          accepted_missions = []

          for record in tracked_bids:

              if not record.get(
                  "accepted",
                  False
              ):
                  continue

              task_id_value = normalize(
                  record.get(
                      "task_id",
                      ""
                  )
              ).strip()

              if not task_id_value:
                  continue

              original_task = next(
                  (
                      task
                      for task in tasks
                      if get_task_id(
                          task
                      ) == task_id_value
                  ),
                  None
              )

              if original_task:

                  accepted_missions.append({
                      "task":
                          original_task,
                      "bid":
                          record
                  })


          # ------------------------------------------------------------
          # Direct reconciliation of tracked bids
          # ------------------------------------------------------------

          for record in tracked_bids:

              task_id_value = normalize(
                  record.get(
                      "task_id",
                      ""
                  )
              ).strip()

              bid_id_value = normalize(
                  record.get(
                      "bid_id",
                      ""
                  )
              ).strip()

              if not task_id_value:
                  continue

              if any(
                  mission["bid"].get(
                      "task_id"
                  ) == task_id_value
                  and mission["bid"].get(
                      "bid_id"
                  ) == bid_id_value
                  for mission in accepted_missions
              ):
                  continue

              try:

                  bids_data = api_get(
                      (
                          f"/marketplace/"
                          f"{task_id_value}/bids"
                      )
                  )

                  if isinstance(
                      bids_data,
                      list
                  ):
                      bids = bids_data

                  elif isinstance(
                      bids_data,
                      dict
                  ):
                      bids = (
                          bids_data.get("bids")
                          or bids_data.get("items")
                          or []
                      )

                  else:
                      bids = []

                  for bid in bids:

                      current_bid_id = first_string(
                          bid,
                          [
                              "id",
                              "bid_id"
                          ]
                      )

                      if (
                          bid_id_value
                          and
                          current_bid_id
                          != bid_id_value
                      ):
                          continue

                      status = first_string(
                          bid,
                          [
                              "status"
                          ]
                      ).lower()

                      if status != "accepted":
                          continue

                      record[
                          "accepted"
                      ] = True

                      record[
                          "status"
                      ] = "accepted"

                      original_task = next(
                          (
                              task
                              for task in tasks
                              if get_task_id(
                                  task
                              )
                              == task_id_value
                          ),
                          None
                      )

                      if original_task:

                          accepted_missions.append({
                              "task":
                                  original_task,
                              "bid":
                                  record
                          })

                      break

              except Exception:
                  continue


          # ------------------------------------------------------------
          # Deduplicate missions
          # ------------------------------------------------------------

          unique_missions = {}

          for mission in accepted_missions:

              mission_id = get_task_id(
                  mission["task"]
              )

              unique_missions[
                  mission_id
              ] = mission

          accepted_missions = list(
              unique_missions.values()
          )

          print(
              f"ACCEPTED MISSIONS: "
              f"{len(accepted_missions)}"
          )


          # ============================================================
          # WEB RESEARCH
          # ============================================================

          def fetch_source(url):

              try:

                  parsed = urlparse(
                      url
                  )

                  if parsed.scheme not in (
                      "http",
                      "https"
                  ):
                      return None

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                              "Nox-Ledger-04/3.0"
                      },
                      timeout=HTTP_TIMEOUT_SECONDS,
                      allow_redirects=True
                  )

                  if response.status_code >= 400:

                      return {
                          "url": url,
                          "status":
                              response.status_code,
                          "error":
                              "HTTP_ERROR"
                      }

                  content = response.content[
                      :MAX_SOURCE_BYTES
                  ]

                  text = content.decode(
                      response.encoding
                      or "utf-8",
                      errors="replace"
                  )

                  text = re.sub(
                      r"<script[\s\S]*?"
                      r"</script>",
                      " ",
                      text,
                      flags=re.I
                  )

                  text = re.sub(
                      r"<style[\s\S]*?"
                      r"</style>",
                      " ",
                      text,
                      flags=re.I
                  )

                  text = re.sub(
                      r"<[^>]+>",
                      " ",
                      text
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  return {
                      "url":
                          url,
                      "status":
                          response.status_code,
                      "excerpt":
                          compact(
                              text,
                              1400
                          )
                  }

              except Exception as exc:

                  return {
                      "url":
                          url,
                      "error":
                          compact(exc)
                  }


          def research_task(task):

              if not WEB_RESEARCH_ENABLED:
                  return []

              text = " ".join([
                  get_task_title(task),
                  get_task_body(task),
                  extract_text(task)
              ])

              urls = extract_urls(
                  text
              )

              results = []

              for url in urls[
                  :MAX_WEB_SOURCES
              ]:

                  source = fetch_source(
                      url
                  )

                  if source:
                      results.append(
                          source
                      )

              return results


          # ============================================================
          # MISSION EXECUTION
          # ============================================================

          print()
          print(
              "=== MISSION EXECUTION ==="
          )

          executions = []
          deliveries = []
          execution_failures = []

          execution_candidates = (
              accepted_missions[
                  :MAX_EXECUTIONS_PER_RUN
              ]
          )

          for mission in execution_candidates:

              task = mission["task"]

              task_id_value = get_task_id(
                  task
              )

              title = get_task_title(
                  task
              )

              body = get_task_body(
                  task
              )

              print(
                  "EXECUTING: "
                  f"{task_id_value} | "
                  f"{compact(title, 120)}"
              )

              if not EXECUTION_ENABLED:
                  continue

              try:

                  sources = research_task(
                      task
                  )

                  capabilities = (
                      capability_matches(
                          " ".join([
                              title,
                              body
                          ])
                      )
                  )

                  research_lines = []

                  for source in sources:

                      research_lines.append(
                          "- "
                          + source.get(
                              "url",
                              ""
                          )
                          + " | "
                          + source.get(
                              "excerpt",
                              ""
                          )
                      )

                  if not research_lines:

                      research_lines.append(
                          "- No explicit public "
                          "URL supplied in task."
