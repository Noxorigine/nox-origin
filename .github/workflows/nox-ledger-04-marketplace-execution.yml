def submit_bid(action):
    global bids_this_run

    if bids_this_run >= MAX_BIDS_PER_RUN:
        return False, "RUN_BID_LIMIT"

    task_id = action["task_id"]

    print("")
    print("=== BID ATTEMPT ===")
    print(f"TASK ID: {task_id}")

    existing = get_existing_bid(task_id)

    if existing:
        bid_id = (
            existing.get("bid_id")
            or existing.get("bidId")
            or existing.get("id")
        )

        if bid_id is not None:
            action["bid_id"] = str(bid_id)

        status = normalize_text(
            existing.get("status")
            or existing.get("state")
        ).lower()

        print(
            "EXISTING BID: "
            f"id={action.get('bid_id')} "
            f"status={status}"
        )

        action["bid_submitted"] = True

        if status in (
            "accepted",
            "approved",
            "won",
            "winning",
            "selected"
        ):
            action["accepted"] = True
            action["status"] = "ACCEPTED"
            action["next_action"] = "EXECUTE"

            print("BID STATE: ACCEPTED")

            return False, "ALREADY_ACCEPTED"

        if status in (
            "rejected",
            "declined",
            "denied",
            "lost",
            "cancelled",
            "canceled",
            "expired"
        ):
            action["bid_submitted"] = False
            action["accepted"] = False
            action["status"] = "RETRY"
            action["next_action"] = "BID"

            print("BID STATE: PREVIOUSLY REJECTED")

            return False, "PREVIOUS_BID_REJECTED"

        action["status"] = "PENDING"
        action["next_action"] = "WAIT"

        print("BID STATE: PENDING")

        return False, "ALREADY_SUBMITTED"

    # ============================================================
    # BID AMOUNT
    # ============================================================
    #
    # 21 sats is the technical marketplace floor.
    # It is NOT an economic task-value filter.
    #
    # We therefore do NOT reject a task because its advertised
    # reward metadata is below 21 sats.
    #
    # If a real task reward is available and above the floor,
    # NØX can bid up to that advertised lower bound.
    # Otherwise the technical floor is used.
    # ============================================================

    low = safe_int(
        action.get("reward_low")
    )

    bid_amount = max(
        MIN_BID_SATS,
        low
    )

    print(
        f"REWARD LOW: {low}"
    )
    print(
        f"REWARD HIGH: "
        f"{action.get('reward_high', 0)}"
    )
    print(
        f"BID AMOUNT: {bid_amount} sats"
    )

    message = (
        "NØX can complete this task using autonomous "
        "research, coding, API, automation, analysis, "
        "documentation or verification capabilities as "
        "appropriate. Execution uses no paid external "
        "services and no external AI."
    )

    idempotency_key = hashlib.sha256(
        f"{NOX_IDENTITY}:{task_id}:bid"
        .encode("utf-8")
    ).hexdigest()

    # IMPORTANT:
    # The Colony marketplace bid API expects "amount",
    # not "amount_sats".
    payload = {
        "amount": bid_amount,
        "message": message
    }

    print(
        "BID PAYLOAD: "
        f"amount={bid_amount}"
    )

    response = api_post(
        "/marketplace/"
        f"{quote_plus(str(task_id))}/bid",
        payload,
        {
            "Idempotency-Key": idempotency_key
        }
    )

    print(
        f"BID HTTP STATUS: "
        f"{response.status_code}"
    )

    if response.status_code == 429:
        action["last_error"] = (
            "Marketplace rate limit (429)."
        )

        print(
            "BID RESULT: RATE_LIMIT"
        )

        return False, "RATE_LIMIT"

    if response.status_code >= 400:
        error_body = compact_text(
            response.text,
            1200
        )

        action["last_error"] = (
            f"BID_HTTP_{response.status_code}: "
            f"{error_body}"
        )

        print(
            "BID RESULT: HTTP ERROR"
        )
        print(
            f"BID ERROR BODY: {error_body}"
        )

        return False, (
            f"BID_HTTP_{response.status_code}"
        )

    try:
        payload_response = response.json()
    except Exception:
        payload_response = {}

    bid_id = None

    if isinstance(
        payload_response,
        dict
    ):
        bid_id = (
            payload_response.get("bid_id")
            or payload_response.get("bidId")
            or payload_response.get("id")
        )

        if isinstance(
            payload_response.get("bid"),
            dict
        ):
            bid_id = (
                payload_response["bid"].get(
                    "bid_id"
                )
                or payload_response["bid"].get(
                    "bidId"
                )
                or payload_response["bid"].get(
                    "id"
                )
                or bid_id
            )

    action["bid_id"] = (
        str(bid_id)
        if bid_id is not None
        else None
    )

    action["bid_amount_sats"] = bid_amount
    action["bid_submitted"] = True
    action["accepted"] = False
    action["status"] = "PENDING"
    action["next_action"] = "WAIT"
    action["updated_at"] = now_iso()

    action["history"].append({
        "timestamp": now_iso(),
        "event": "BID_SUBMITTED",
        "amount_sats": bid_amount,
        "bid_id": action["bid_id"]
    })

    bids_this_run += 1
    stats["bids_submitted"] += 1

    print("")
    print("=== BID SUCCESS ===")
    print(
        f"BID SUBMITTED: YES"
    )
    print(
        f"BID ID: "
        f"{action['bid_id']}"
    )
    print(
        f"BID AMOUNT: "
        f"{bid_amount} sats"
    )

    return True, "BID_SUBMITTED"
