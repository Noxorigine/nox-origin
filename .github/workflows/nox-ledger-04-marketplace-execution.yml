          )

          print(
              f"Intelligent candidates: {len(candidates)}"
          )

          print(
              f"Bids created: {bids_created}"
          )

          print(
              f"Bid errors: {bid_errors}"
          )

          print(
              "Rate limited: "
              + (
                  "YES"
                  if rate_limited
                  else "NO"
              )
          )

          print(
              f"Tracked bids: {len(tracked_bids)}"
          )

          print(
              f"Accepted missions: {len(accepted)}"
          )

          print(
              f"Executions: {len(executions)}"
          )

          print(
              f"Deliveries: {len(deliveries)}"
          )

          print(
              f"Execution failures: "
              f"{len(execution_failures)}"
          )

          print(
              f"Payments observed: {len(payments)}"
          )

          print(
              "Web research: "
              + str(
                  WEB_RESEARCH_ENABLED
              )
          )

          print("Gemini: False")
          print("External AI: False")
          print("Payments: False")
          print("Spending: False")
          print("Project cost: €0")

          print(
