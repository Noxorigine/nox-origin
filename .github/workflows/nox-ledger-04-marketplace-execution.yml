name: NØX LEDGER 04 - Marketplace Execution V5

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */4 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  marketplace-execution:
    runs-on: ubuntu-latest

    env:
      API_BASE: https://thecolony.ai/api/v1
      NOX_IDENTITY: nox_origine

      # ============================================================
      # HARD SAFETY / COST CONTROLS
      # ============================================================
      GEMINI_ENABLED: "false"
      EXTERNAL_AI_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      SPENDING_ENABLED: "false"
      PROJECT_COST_EUR: "0"

      # ============================================================
      # MARKETPLACE
      # ============================================================
      MAX_TASKS: "100"
      MAX_RECONCILE: "30"
      MAX_BIDS_PER_RUN: "1"

      # 21 sats is ONLY the current API submission floor.
      # It is NOT an economic selection threshold.
      MIN_BID_SATS: "21"

      BID_SCORE_THRESHOLD: "75"
      MIN_FEASIBILITY_SCORE: "75"
      MIN_LEDGER_MATCHES: "2"

      # ============================================================
      # ACTION ENGINE
      # ============================================================
      MAX_ACTIONS_PER_RUN: "3"
      MAX_ACTION_ATTEMPTS: "5"
      ACTION_RETRY_SECONDS: "1800"
      ACTION_MEMORY_LIMIT: "500"

      # ============================================================
      # EXECUTION
      # ============================================================
      EXECUTION_ENABLED: "true"
      MAX_DELIVERY_CHARS: "9500"

      # ============================================================
      # ZERO-COST WEB RESEARCH
      # ============================================================
      WEB_RESEARCH_ENABLED: "true"
      MAX_WEB_QUERIES: "4"
      MAX_WEB_SOURCES: "8"
      HTTP_TIMEOUT_SECONDS: "20"
      MAX_SOURCE_BYTES: "500000"
      MAX_PAGE_TEXT_CHARS: "12000"

      # ============================================================
      # MEMORY
      # ============================================================
      MEMORY_FILE: memory/nox_ledger_04_marketplace.json
      ACT15_MEMORY_FILE: memory/nox_act_15_marketplace.json
      ROOT_MEMORY_FILE: nox_memory.json

      MAX_FAILURE_MEMORY: "200"
      MAX_RESEARCH_MEMORY: "200"
      MAX_OBSERVATIONS: "500"

      # ============================================================
      # DECISION SAFETY
      # ============================================================
      REQUIRE_CLEAR_DELIVERABLE: "true"
      REQUIRE_ZERO_COST_EXECUTION: "true"
      REQUIRE_NO_EXTERNAL_AI: "true"

      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      # ============================================================
      # LEDGER 04 V5
      # ============================================================
      - name: Execute marketplace cognitive engine
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import json
          import time
          import hashlib
          import re
          import html
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote_plus, urlparse

          import requests
          from bs4 import BeautifulSoup


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_BASE = os.environ["API_BASE"].rstrip("/")
          IDENTITY_EXPECTED = os.environ["NOX_IDENTITY"]

          MEMORY_FILE = Path(os.environ["MEMORY_FILE"])
          ACT15_MEMORY_FILE = Path(os.environ["ACT15_MEMORY_FILE"])

          MEMORY_FILE.parent.mkdir(parents=True, exist_ok=True)

          MAX_TASKS = int(os.environ["MAX_TASKS"])
          MAX_RECONCILE = int(os.environ["MAX_RECONCILE"])
          MAX_BIDS_PER_RUN = int(os.environ["MAX_BIDS_PER_RUN"])

          MIN_BID_SATS = int(os.environ["MIN_BID_SATS"])
          BID_SCORE_THRESHOLD = int(os.environ["BID_SCORE_THRESHOLD"])
          MIN_FEASIBILITY = int(os.environ["MIN_FEASIBILITY_SCORE"])
          MIN_LEDGER_MATCHES = int(os.environ["MIN_LEDGER_MATCHES"])

          MAX_ACTIONS_PER_RUN = int(os.environ["MAX_ACTIONS_PER_RUN"])
          MAX_ACTION_ATTEMPTS = int(os.environ["MAX_ACTION_ATTEMPTS"])
          ACTION_RETRY_SECONDS = int(os.environ["ACTION_RETRY_SECONDS"])

          MAX_DELIVERY_CHARS = int(os.environ["MAX_DELIVERY_CHARS"])

          WEB_RESEARCH_ENABLED = (
              os.environ["WEB_RESEARCH_ENABLED"].lower() == "true"
          )

          MAX_WEB_QUERIES = int(os.environ["MAX_WEB_QUERIES"])
          MAX_WEB_SOURCES = int(os.environ["MAX_WEB_SOURCES"])
          HTTP_TIMEOUT = int(os.environ["HTTP_TIMEOUT_SECONDS"])
          MAX_SOURCE_BYTES = int(os.environ["MAX_SOURCE_BYTES"])
          MAX_PAGE_TEXT_CHARS = int(os.environ["MAX_PAGE_TEXT_CHARS"])


          # ============================================================
          # TIME
          # ============================================================

          def utc_now():
              return datetime.now(timezone.utc).isoformat()


          now_ts = time.time()


          # ============================================================
          # JSON HELPERS
          # ============================================================

          def load_json(path):
              if not path.exists():
                  return {}

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}


          def save_json(path, data):
              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  ),
                  encoding="utf-8"
              )

              tmp.replace(path)


          ledger = load_json(MEMORY_FILE)
          act15_memory = load_json(ACT15_MEMORY_FILE)


          # ============================================================
          # INITIAL LEDGER STRUCTURE
          # ============================================================

          ledger.setdefault("schema_version", "5.0")

          ledger.setdefault("actions", [])
          ledger.setdefault("bids", [])
          ledger.setdefault("observations", [])
          ledger.setdefault("deliveries", [])
          ledger.setdefault("research", [])
          ledger.setdefault("failures", [])
          ledger.setdefault("outcomes", [])
          ledger.setdefault("learning", [])

          ledger.setdefault(
              "statistics",
              {
                  "runs": 0,
                  "tasks_seen": 0,
                  "candidates_seen": 0,
                  "bids_created": 0,
                  "actions_completed": 0,
                  "actions_failed": 0,
                  "deliveries": 0
              }
          )

          ledger["statistics"]["runs"] += 1


          # ============================================================
          # HARD SAFETY ASSERTIONS
          # ============================================================

          required_false = (
              "GEMINI_ENABLED",
              "EXTERNAL_AI_ENABLED",
              "PAYMENTS_ENABLED",
              "SPENDING_ENABLED"
          )

          for variable in required_false:
              if os.environ[variable].lower() != "false":
                  raise RuntimeError(
                      f"{variable} must remain false"
                  )

          if os.environ["PROJECT_COST_EUR"] != "0":
              raise RuntimeError(
                  "PROJECT_COST_EUR must remain 0"
              )

          if os.environ["REQUIRE_ZERO_COST_EXECUTION"].lower() != "true":
              raise RuntimeError(
                  "Zero-cost execution requirement disabled"
              )

          if os.environ["REQUIRE_NO_EXTERNAL_AI"].lower() != "true":
              raise RuntimeError(
                  "External AI protection disabled"
              )


          # ============================================================
          # HEADER
          # ============================================================

          print("=" * 68)
          print("=== NØX LEDGER 04 - MARKETPLACE EXECUTION V5 ===")
          print("=" * 68)
          print("Architecture:")
          print("DISCOVER -> UNDERSTAND -> CHOOSE -> ACT -> OBSERVE -> LEARN")
          print("Persistent action queue: ENABLED")
          print("Web research: ENABLED")
          print("External AI: DISABLED")
          print("Spending: DISABLED")
          print("Project cost: €0")


          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print()
          print("=== AUTHENTICATION ===")

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Ledger04/5.0"
          })

          auth_response = session.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": os.environ["COLONY_API_KEY"]
              },
              timeout=HTTP_TIMEOUT
          )

          auth_response.raise_for_status()

          auth_data = auth_response.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError(
                  "Colony JWT token not returned"
              )

          session.headers["Authorization"] = (
              f"Bearer {token}"
          )

          print("JWT obtained: YES")
          print("JWT value: HIDDEN")


          # ============================================================
          # IDENTITY
          # ============================================================

          print()
          print("=== IDENTITY ===")

          me_response = session.get(
              f"{API_BASE}/users/me",
              timeout=HTTP_TIMEOUT
          )

          me_response.raise_for_status()

          me_data = me_response.json()

          identity = (
              me_data.get("username")
              or me_data.get("handle")
              or me_data.get("name")
          )

          if identity != IDENTITY_EXPECTED:
              raise RuntimeError(
                  f"Identity mismatch: "
                  f"expected={IDENTITY_EXPECTED}, "
                  f"received={identity}"
              )

          identity_values = {
              IDENTITY_EXPECTED.lower(),
              str(me_data.get("username", "")).lower(),
              str(me_data.get("handle", "")).lower(),
              str(me_data.get("id", "")).lower(),
              str(me_data.get("user_id", "")).lower(),
              str(me_data.get("agent_id", "")).lower()
          }

          identity_values = {
              value
              for value in identity_values
              if value and value != "none"
          }

          print(f"IDENTITY: {identity}")


          # ============================================================
          # GENERIC RESPONSE PARSERS
          # ============================================================

          def extract_items(payload, keys):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in keys:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def task_id_of(task):
              if not isinstance(task, dict):
                  return None

              return (
                  task.get("id")
                  or task.get("post_id")
                  or task.get("task_id")
              )


          def title_of(task):
              if not isinstance(task, dict):
                  return "UNTITLED"

              return (
                  task.get("title")
                  or task.get("name")
                  or "UNTITLED"
              )


          def description_of(task):
              if not isinstance(task, dict):
                  return ""

              return (
                  task.get("description")
                  or task.get("body")
                  or task.get("content")
                  or ""
              )


          def task_text(task):
              fields = (
                  "title",
                  "name",
                  "description",
                  "body",
                  "content",
                  "reward",
                  "reward_amount",
                  "reward_amount_sats",
                  "budget",
                  "budget_sats",
                  "category"
              )

              return " ".join(
                  str(task.get(field, ""))
                  for field in fields
              ).lower()


          # ============================================================
          # BID ID / IDENTITY EXTRACTION
          # ============================================================

          BID_ID_FIELDS = (
              "id",
              "bid_id",
              "bidId"
          )

          IDENTITY_FIELDS = (
              "id",
              "user_id",
              "userId",
              "username",
              "handle",
              "agent_id",
              "agentId",
              "agent_name",
              "bidder_id",
              "bidderId",
              "bidder_username",
              "bidderUsername",
              "bidder_handle",
              "bidderHandle"
          )


          def bid_id_of(bid):
              if not isinstance(bid, dict):
                  return None

              for key in BID_ID_FIELDS:
                  if bid.get(key) not in (None, ""):
                      return bid.get(key)

              return None


          def bid_amount_of(bid):
              if not isinstance(bid, dict):
                  return None

              fields = (
                  "bid_amount_sats",
                  "bidAmountSats",
                  "amount_sats",
                  "amountSats",
                  "amount",
                  "bid_amount",
                  "bidAmount"
              )

              for field in fields:
                  value = bid.get(field)

                  if value not in (None, ""):
                      try:
                          return int(float(value))
                      except Exception:
                          pass

              return None


          def normalized_status(value):
              if value is None:
                  return "UNKNOWN"

              status = str(value).strip().lower()

              mapping = {
                  "accepted": "ACCEPTED",
                  "approved": "ACCEPTED",
                  "won": "ACCEPTED",
                  "winner": "ACCEPTED",
                  "winning": "ACCEPTED",
                  "selected": "ACCEPTED",

                  "rejected": "REJECTED",
                  "declined": "REJECTED",
                  "lost": "REJECTED",
                  "denied": "REJECTED",
                  "cancelled": "REJECTED",
                  "canceled": "REJECTED",

                  "pending": "PENDING",
                  "submitted": "PENDING",
                  "active": "PENDING",
                  "open": "PENDING",
                  "bidding": "PENDING",
                  "under_review": "PENDING",
                  "review": "PENDING"
              }

              return mapping.get(
                  status,
                  status.upper() if status else "UNKNOWN"
              )


          def bid_identity_match(bid):
              if not isinstance(bid, dict):
                  return False

              for field in IDENTITY_FIELDS:

                  value = bid.get(field)

                  if value is not None:
                      if str(value).lower() in identity_values:
                          return True

              nested_fields = (
                  "bidder",
                  "user",
                  "agent",
                  "author"
              )

              for nested_name in nested_fields:

                  nested = bid.get(nested_name)

                  if isinstance(nested, dict):

                      for field in IDENTITY_FIELDS:

                          value = nested.get(field)

                          if value is not None:
                              if (
                                  str(value).lower()
                                  in identity_values
                              ):
                                  return True

              return False


          def extract_bids(payload):
              return extract_items(
                  payload,
                  (
                      "bids",
                      "items",
                      "data",
                      "results"
                  )
              )


          # ============================================================
          # API HELPERS
          # ============================================================

          def get_tasks():
              response = session.get(
                  f"{API_BASE}/marketplace/tasks",
                  params={"limit": MAX_TASKS},
                  timeout=HTTP_TIMEOUT
              )

              response.raise_for_status()

              return extract_items(
                  response.json(),
                  (
                      "tasks",
                      "items",
                      "data",
                      "results"
                  )
              )


          def get_bids(task_id):
              response = session.get(
                  f"{API_BASE}/marketplace/{task_id}/bids",
                  timeout=HTTP_TIMEOUT
              )

              if not response.ok:
                  return [], response.status_code

              return extract_bids(
                  response.json()
              ), response.status_code


          def get_payment(task_id):
              response = session.get(
                  f"{API_BASE}/marketplace/{task_id}/payment",
                  timeout=HTTP_TIMEOUT
              )

              if not response.ok:
                  return None, response.status_code

              return response.json(), response.status_code


          # ============================================================
          # REWARD EXTRACTION
          # ============================================================

          def parse_reward(task):
              values = []

              fields = (
                  "reward_sats",
                  "reward_amount_sats",
                  "budget_sats",
                  "amount_sats",
                  "reward_amount",
                  "reward",
                  "budget",
                  "bounty"
              )

              for field in fields:

                  value = task.get(field)

                  if value not in (None, ""):

                      try:
                          values.append(
                              int(
                                  float(
                                      str(value)
                                      .replace(",", "")
                                  )
                              )
                          )
                      except Exception:
                          pass

              nested = (
                  task.get("reward"),
                  task.get("budget"),
                  task.get("payment")
              )

              for obj in nested:

                  if isinstance(obj, dict):

                      for field in (
                          "sats",
                          "amount_sats",
                          "amountSats",
                          "value",
                          "amount"
                      ):

                          value = obj.get(field)

                          if value not in (None, ""):

                              try:
                                  values.append(
                                      int(
                                          float(value)
                                      )
                                  )
                              except Exception:
                                  pass

              text = task_text(task)

              text_values = re.findall(
                  r"(?<!\d)(\d{1,9})\s*(?:sats?|satoshis)(?!\w)",
                  text
              )

              for value in text_values:

                  try:
                      values.append(int(value))
                  except Exception:
                      pass

              values = [
                  value
                  for value in values
                  if value >= 0
              ]

              if not values:
                  return {
                      "known": False,
                      "low": None,
                      "high": None,
                      "suspicious": False
                  }

              low = min(values)
              high = max(values)

              suspicious = (
                  low > 0
                  and high >= low * 10
              )

              return {
                  "known": True,
                  "low": low,
                  "high": high,
                  "suspicious": suspicious
              }


          # ============================================================
          # SAFETY
          # ============================================================

          SAFETY_TERMS = (
              "malware",
              "ransomware",
              "credential theft",
              "credential stealing",
              "phishing kit",
              "keylogger",
              "botnet",
              "ddos attack",
              "steal credentials",
              "bypass authentication",
              "exploit a real target",
              "weapon",
              "explosive",
              "private key",
              "seed phrase",
              "password required",
              "credential required",
              "credentials required",
              "api key required",
              "pay upfront",
              "purchase required",
              "spend money",
              "send payment",
              "make payment",
              "bank transfer",
              "buy crypto",
              "paid infrastructure",
              "subscription required"
          )


          HUMAN_ONLY = (
              "in person",
              "physical delivery",
              "deliver physically",
              "meet me",
              "phone call required"
          )


          def safety_result(task):
              text = task_text(task)

              dangerous = [
                  term
                  for term in SAFETY_TERMS
                  if term in text
              ]

              human = [
                  term
                  for term in HUMAN_ONLY
                  if term in text
              ]

              return {
                  "safe": not dangerous and not human,
                  "dangerous": dangerous,
                  "human_only": human
              }


          # ============================================================
          # CAPABILITY ENGINE
          # ============================================================

          STRONG_CAPABILITIES = {
              "research": (
                  "research",
                  "deep research",
                  "web research",
                  "market research",
                  "competitive research",
                  "research report",
                  "technical research",
                  "fact checking",
                  "source verification",
                  "conduct research",
                  "perform research"
              ),

              "reporting": (
                  "technical report",
                  "research report",
                  "write a report",
                  "report writing",
                  "prepare a report",
                  "documentation"
              ),

              "coding": (
                  "python",
                  "coding",
                  "software",
                  "agent tools",
                  "agent tooling",
                  "tool development",
                  "api development"
              ),

              "testing": (
                  "testing",
                  "test",
                  "qa",
                  "api testing",
                  "quality assurance"
              ),

              "data": (
                  "data analysis",
                  "data",
                  "analysis",
                  "analytics",
                  "lead scoring"
              ),

              "writing": (
                  "writing",
                  "copywriting",
                  "documentation",
                  "content"
              ),

              "seo": (
                  "seo",
                  "seo audit",
                  "search optimization"
              )
          }


          def capability_matches(task):
              text = task_text(task)

              matched = {}

              for group, phrases in STRONG_CAPABILITIES.items():

                  hits = [
                      phrase
                      for phrase in phrases
                      if phrase in text
                  ]

                  if hits:
                      matched[group] = hits

              return matched


          # ============================================================
          # REQUEST DETECTION
          # ============================================================

          REQUEST_SIGNALS = (
              "need",
              "looking for",
              "seeking",
              "wanted",
              "task",
              "build",
              "create",
              "develop",
              "analyze",
              "analyse",
              "research",
              "audit",
              "write",
              "verify",
              "test",
              "report",
              "implement"
          )

          SERVICE_ONLY = (
              "for hire",
              "i can offer",
              "my services",
              "available for hire",
              "offering services",
              "hire me",
              "services available"
          )


          def is_real_request(task):
              text = task_text(task)

              request = any(
                  signal in text
                  for signal in REQUEST_SIGNALS
              )

              service_only = any(
                  signal in text
                  for signal in SERVICE_ONLY
              )

              if service_only and not request:
                  return False

              return request


          # ============================================================
          # DELIVERABLE DETECTION
          # ============================================================

          DELIVERABLE_SIGNALS = (
              "deliver",
              "report",
              "audit",
              "analysis",
              "analyze",
              "analyse",
              "test",
              "build",
              "create",
              "write",
              "develop",
              "verify",
              "find",
              "research"
          )


          def has_clear_deliverable(task):
              text = task_text(task)

              return any(
                  phrase in text
                  for phrase in DELIVERABLE_SIGNALS
              )


          # ============================================================
          # LEDGER EVIDENCE
          # ============================================================

          def compact_json_text(data):
              try:
                  return json.dumps(
                      data,
                      ensure_ascii=False
                  ).lower()
              except Exception:
                  return ""


          knowledge_text = compact_json_text(
              ledger.get("learning", [])
          )

          action_text = compact_json_text(
              ledger.get("outcomes", [])
          )

          historical_text = compact_json_text(
              act15_memory
          )


          def ledger_evidence(task, capabilities):
              text = task_text(task)

              evidence = {
                  "knowledge": False,
                  "cognition": False,
                  "action": False
              }

              capability_names = list(
                  capabilities.keys()
              )

              if capability_names:

                  if any(
                      name in knowledge_text
                      or any(
                          phrase in knowledge_text
                          for phrase in STRONG_CAPABILITIES.get(
                              name,
                              ()
                          )
                      )
                      for name in capability_names
                  ):
                      evidence["knowledge"] = True

                  if any(
                      name in historical_text
                      for name in capability_names
                  ):
                      evidence["cognition"] = True

                  if any(
                      name in action_text
                      for name in capability_names
                  ):
                      evidence["action"] = True

              if any(
                  phrase in text
                  for phrase in (
                      "research",
                      "report",
                      "analysis",
                      "testing"
                  )
              ):
                  evidence["knowledge"] = True

              count = sum(
                  1
                  for value in evidence.values()
                  if value
              )

              evidence["count"] = count

              return evidence


          # ============================================================
          # FEASIBILITY
          # ============================================================

          def feasibility_score(task):
              text = task_text(task)

              score = 85

              if len(description_of(task)) > 5000:
                  score -= 5

              if any(
                  phrase in text
                  for phrase in (
                      "complex deployment",
                      "production deployment",
                      "24/7 support",
                      "live operations"
                  )
              ):
                  score -= 10

              if any(
                  phrase in text
                  for phrase in (
                      "in person",
                      "physical delivery",
                      "phone call required"
                  )
              ):
                  score -= 30

              return max(0, min(100, score))


          # ============================================================
          # OPPORTUNITY EVALUATION
          # ============================================================

          def evaluate_task(task):

              text = task_text(task)

              safety = safety_result(task)

              if not safety["safe"]:
                  return None, "SAFETY_BLOCK"

              if not is_real_request(task):
                  return None, "NOT_A_REQUEST"

              capabilities = capability_matches(task)

              if not capabilities:
                  return None, "NO_CAPABILITY"

              if os.environ[
                  "REQUIRE_CLEAR_DELIVERABLE"
              ].lower() == "true":

                  if not has_clear_deliverable(task):
                      return None, "UNCLEAR_DELIVERABLE"

              ledger_match = ledger_evidence(
                  task,
                  capabilities
              )

              if ledger_match["count"] < MIN_LEDGER_MATCHES:
                  return None, "INSUFFICIENT_LEDGER_EVIDENCE"

              feasibility = feasibility_score(task)

              if feasibility < MIN_FEASIBILITY:
                  return None, "LOW_FEASIBILITY"

              reward = parse_reward(task)

              research_value = 15 if any(
                  phrase in text
                  for phrase in (
                      "research",
                      "deep research",
                      "web research",
                      "research report",
                      "technical report",
                      "competitive analysis",
                      "data analysis"
                  )
              ) else 7

              direct_value = (
                  15
                  if reward["known"]
                  else 5
              )

              tip_value = (
                  12
                  if any(
                      phrase in text
                      for phrase in (
                          "tip",
                          "tips",
                          "bonus",
                          "gratuity",
                          "reward if useful"
                      )
                  )
                  else 5
              )

              learning_value = 10

              relationship_value = 5

              reputation_value = 5

              feasibility_value = int(
                  feasibility / 10
              )

              ledger_value = (
                  ledger_match["count"] * 10
              )

              score = (
                  ledger_value
                  + research_value
                  + direct_value
                  + tip_value
                  + learning_value
                  + relationship_value
                  + reputation_value
                  + feasibility_value
              )

              if reward["suspicious"]:
                  return None, "REWARD_INCONSISTENCY"

              if score < BID_SCORE_THRESHOLD:
                  return None, "LOW_SCORE"

              return {
                  "task_id": task_id_of(task),
                  "title": title_of(task),
                  "score": score,
                  "feasibility": feasibility,
                  "capabilities": capabilities,
                  "ledger_match": ledger_match,
                  "reward": reward
              }, None


          # ============================================================
          # FETCH MARKETPLACE
          # ============================================================

          print()
          print("=== MARKETPLACE DISCOVERY ===")

          tasks = get_tasks()

          ledger["statistics"]["tasks_seen"] = len(tasks)

          print(
              f"TASKS FOUND: {len(tasks)}"
          )


          # ============================================================
          # EVALUATE NEW OPPORTUNITIES
          # ============================================================

          candidates = []
          rejection_counts = {}

          def count_rejection(reason):
              rejection_counts[reason] = (
                  rejection_counts.get(reason, 0) + 1
              )


          for task in tasks:

              candidate, reason = evaluate_task(task)

              if candidate:

                  candidates.append(candidate)

              else:

                  count_rejection(
                      reason or "UNKNOWN"
                  )


          candidates.sort(
              key=lambda item: (
                  item["score"],
                  item["ledger_match"]["count"],
                  item["feasibility"]
              ),
              reverse=True
          )

          ledger["statistics"]["candidates_seen"] += len(
              candidates
          )


          print()
          print("=== CANDIDATE EVALUATION ===")
          print(
              f"Candidates: {len(candidates)}"
          )

          for reason, count in sorted(
              rejection_counts.items()
          ):
              print(
                  f"{reason}: {count}"
              )

          for candidate in candidates[:5]:

              print(
                  f"CANDIDATE | "
                  f"{candidate['task_id']} | "
                  f"score={candidate['score']} | "
                  f"ledger={candidate['ledger_match']['count']}/3 | "
                  f"{candidate['title'][:120]}"
              )


          # ============================================================
          # ACTION QUEUE
          # ============================================================

          actions = ledger["actions"]

          if not isinstance(actions, list):
              actions = []

          ledger["actions"] = actions


          def action_exists(task_id, action_type=None):
              for item in actions:

                  if item.get("task_id") != task_id:
                      continue

                  if action_type is not None:
                      if item.get("action_type") != action_type:
                          continue

                  if item.get("status") in (
                      "COMPLETED",
                      "CANCELLED"
                  ):
                      continue

                  return item

              return None


          def create_action(
              task_id,
              action_type,
              title,
              priority,
              payload=None
          ):

              existing = action_exists(
                  task_id,
                  action_type
              )

              if existing:
                  return existing

              raw = (
                  f"{task_id}|"
                  f"{action_type}|"
                  f"{title}"
              )

              action_id = hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

              item = {
                  "action_id": action_id,
                  "task_id": task_id,
                  "action_type": action_type,
                  "title": title,
                  "status": "READY",
                  "priority": priority,
                  "attempts": 0,
                  "created_at": utc_now(),
                  "updated_at": utc_now(),
                  "next_attempt_at": 0,
                  "last_error": None,
                  "payload": payload or {},
                  "evidence": [],
                  "result": None
              }

              actions.append(item)

              return item


          # ============================================================
          # IMPORT ACT15 BID KNOWLEDGE INTO ACTION QUEUE
          # ============================================================

          for bid_record in act15_memory.get(
              "bids",
              []
          ):

              if not isinstance(bid_record, dict):
                  continue

              task_id = (
                  bid_record.get("task_id")
                  or bid_record.get("taskId")
              )

              if not task_id:
                  continue

              bid_id = (
                  bid_record.get("bid_id")
                  or bid_record.get("bidId")
              )

              status = normalized_status(
                  bid_record.get("status")
              )

              if status == "ACCEPTED":

                  create_action(
                      task_id,
                      "EXECUTE_ACCEPTED_MISSION",
                      bid_record.get(
                          "title",
                          "Accepted marketplace mission"
                      ),
                      100,
                      {
                          "bid_id": bid_id
                      }
                  )


          # ============================================================
          # SERVER-SIDE BID RECONCILIATION
          # ============================================================

          print()
          print("=== SERVER BID RECONCILIATION ===")

          tracked_task_ids = set()

          for bid in ledger.get("bids", []):

              if isinstance(bid, dict):

                  task_id = bid.get("task_id")

                  if task_id:
                      tracked_task_ids.add(
                          str(task_id)
                      )

          for candidate in candidates[:10]:

              task_id = candidate.get("task_id")

              if task_id:
                  tracked_task_ids.add(
                      str(task_id)
                  )

          reconciled = 0
          accepted_found = 0

          for task_id in list(
              tracked_task_ids
          )[:MAX_RECONCILE]:

              try:

                  bids, status_code = get_bids(
                      task_id
                  )

                  if status_code != 200:
                      continue

                  own_bid = None

                  for bid in bids:

                      if bid_identity_match(bid):
                          own_bid = bid
                          break

                  if not own_bid:
                      continue

                  reconciled += 1

                  bid_id = bid_id_of(
                      own_bid
                  )

                  status = normalized_status(
                      own_bid.get("status")
                  )

                  amount = bid_amount_of(
                      own_bid
                  )

                  observation = {
                      "timestamp": utc_now(),
                      "task_id": task_id,
                      "bid_id": bid_id,
                      "status": status,
                      "amount_sats": amount,
                      "source": "COLONY_SERVER"
                  }

                  ledger["observations"].append(
                      observation
                  )

                  # ----------------------------------------------------
                  # Accepted bid becomes executable action.
                  # ----------------------------------------------------

                  if status == "ACCEPTED":

                      accepted_found += 1

                      create_action(
                          task_id,
                          "EXECUTE_ACCEPTED_MISSION",
                          "Accepted marketplace mission",
                          100,
                          {
                              "bid_id": bid_id
                          }
                      )

                  # ----------------------------------------------------
                  # Pending bid remains observable.
                  # ----------------------------------------------------

                  elif status == "PENDING":

                      create_action(
                          task_id,
                          "MONITOR_BID",
                          "Monitor pending marketplace bid",
                          70,
                          {
                              "bid_id": bid_id
                          }
                      )

              except Exception as exc:

                  ledger["failures"].append({
                      "timestamp": utc_now(),
                      "type": "RECONCILIATION_ERROR",
                      "task_id": task_id,
                      "error": str(exc)[:500]
                  })


          print(
              f"Bids reconciled: {reconciled}"
          )

          print(
              f"Accepted missions discovered: "
              f"{accepted_found}"
          )


          # ============================================================
          # PAYMENT OBSERVATION
          # ============================================================

          print()
          print("=== PAYMENT OBSERVATION ===")

          payment_observations = 0

          accepted_tasks = [
              item
              for item in actions
              if item.get("action_type")
              == "EXECUTE_ACCEPTED_MISSION"
              and item.get("status")
              not in ("COMPLETED", "CANCELLED")
          ]

          for action_item in accepted_tasks[
              :MAX_RECONCILE
          ]:

              task_id = action_item.get("task_id")

              if not task_id:
                  continue

              try:

                  payment_data, status_code = get_payment(
                      task_id
                  )

                  if status_code != 200:
                      continue

                  ledger["observations"].append({
                      "timestamp": utc_now(),
                      "task_id": task_id,
                      "type": "PAYMENT_OBSERVATION",
                      "payment": payment_data
                  })

                  payment_observations += 1

              except Exception as exc:

                  ledger["failures"].append({
                      "timestamp": utc_now(),
                      "type": "PAYMENT_OBSERVATION_ERROR",
                      "task_id": task_id,
                      "error": str(exc)[:500]
                  })

          print(
              f"Payments observed: "
              f"{payment_observations}"
          )

          print("Payment creation: DISABLED")
          print("Spending: DISABLED")


          # ============================================================
          # PRIORITY ACTION QUEUE
          # ============================================================

          def action_priority(item):
              return (
                  int(item.get("priority", 0)),
                  -int(item.get("attempts", 0))
              )


          ready_actions = []

          for item in actions:

              status = item.get("status")

              if status in (
                  "COMPLETED",
                  "CANCELLED"
              ):
                  continue

              next_attempt = float(
                  item.get("next_attempt_at", 0)
                  or 0
              )

              if next_attempt > now_ts:
                  continue

              if int(
                  item.get("attempts", 0)
              ) >= MAX_ACTION_ATTEMPTS:
                  continue

              ready_actions.append(item)

          ready_actions.sort(
              key=action_priority,
              reverse=True
          )


          print()
          print("=== ACTION QUEUE ===")
          print(
              f"Persistent actions: {len(actions)}"
          )
          print(
              f"Ready actions: {len(ready_actions)}"
          )

          for item in ready_actions[:10]:

              print(
                  f"ACTION | "
                  f"{item.get('action_id')} | "
                  f"{item.get('status')} | "
                  f"{item.get('action_type')} | "
                  f"priority={item.get('priority')} | "
                  f"{item.get('task_id')}"
              )


          # ============================================================
          # WEB RESEARCH ENGINE
          #
          # Zero-cost deterministic research.
          # No LLM.
          # No Gemini.
          # No external AI.
          # ============================================================

          def clean_text(value):
              value = html.unescape(
                  str(value or "")
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def build_queries(title, description):

              base = clean_text(
                  f"{title} {description}"
              )

              words = re.findall(
                  r"[A-Za-z0-9][A-Za-z0-9_-]{2,}",
                  base
              )

              stop = {
                  "the",
                  "and",
                  "for",
                  "with",
                  "this",
                  "that",
                  "from",
                  "need",
                  "task",
                  "create",
                  "write",
                  "research",
                  "report",
                  "please",
                  "about"
              }

              selected = []

              for word in words:

                  lower = word.lower()

                  if lower in stop:
                      continue

                  if lower not in selected:
                      selected.append(lower)

                  if len(selected) >= 10:
                      break

              if not selected:
                  return [
                      clean_text(title)
                  ][:MAX_WEB_QUERIES]

              queries = [
                  " ".join(selected[:6]),
                  " ".join(selected[:8]) + " sources",
                  " ".join(selected[:8]) + " documentation",
                  " ".join(selected[:8]) + " official"
              ]

              return queries[:MAX_WEB_QUERIES]


          def search_web(query):

              url = (
                  "https://html.duckduckgo.com/html/?q="
                  + quote_plus(query)
              )

              response = requests.get(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; NoxResearch/5.0)"
                  },
                  timeout=HTTP_TIMEOUT
              )

              response.raise_for_status()

              soup = BeautifulSoup(
                  response.text,
                  "html.parser"
              )

              results = []

              for result in soup.select(
                  ".result"
              ):

                  link = result.select_one(
                      ".result__a"
                  )

                  if not link:
                      continue

                  href = link.get(
                      "href"
                  )

                  title = clean_text(
                      link.get_text(" ")
                  )

                  snippet_node = result.select_one(
                      ".result__snippet"
                  )

                  snippet = clean_text(
                      snippet_node.get_text(" ")
                      if snippet_node
                      else ""
                  )

                  if not href:
                      continue

                  results.append({
                      "title": title,
                      "url": href,
                      "snippet": snippet,
                      "query": query
                  })

                  if len(results) >= MAX_WEB_SOURCES:
                      break

              return results


          def fetch_source(source):

              url = source.get("url")

              if not url:
                  return source

              try:

                  response = requests.get(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 "
                          "(compatible; NoxResearch/5.0)"
                      },
                      timeout=HTTP_TIMEOUT,
                      allow_redirects=True
                  )

                  if not response.ok:
                      source["fetch_status"] = (
                          response.status_code
                      )
                      return source

                  content = response.content[
                      :MAX_SOURCE_BYTES
                  ]

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

                  if (
                      "text/html" not in
                      content_type.lower()
                  ):
                      source["fetch_status"] = (
                          "NON_HTML"
                      )
                      return source

                  soup = BeautifulSoup(
                      content,
                      "html.parser"
                  )

                  for node in soup(
                      ["script", "style", "noscript"]
                  ):
                      node.decompose()

                  text = clean_text(
                      soup.get_text(" ")
                  )

                  source["final_url"] = (
                      response.url
                  )

                  source["fetch_status"] = (
                      response.status_code
                  )

                  source["text"] = text[
                      :MAX_PAGE_TEXT_CHARS
                  ]

                  source["domain"] = (
                      urlparse(
                          response.url
                      ).netloc
                  )

              except Exception as exc:

                  source["fetch_status"] = (
                      "ERROR"
                  )

                  source["fetch_error"] = (
                      str(exc)[:300]
                  )

              return source


          def perform_research(task):

              title = title_of(task)

              description = description_of(task)

              queries = build_queries(
                  title,
                  description
              )

              sources = []
              seen_urls = set()

              for query in queries:

                  try:

                      results = search_web(
                          query
                      )

                  except Exception as exc:

                      ledger["failures"].append({
                          "timestamp": utc_now(),
                          "type": "WEB_SEARCH_ERROR",
                          "task_id": task_id_of(task),
                          "query": query,
                          "error": str(exc)[:500]
                      })

                      continue

                  for result in results:

                      url = result.get("url")

                      if not url:
                          continue

                      normalized = (
                          url.split("#")[0]
                      )

                      if normalized in seen_urls:
                          continue

                      seen_urls.add(
                          normalized
                      )

                      sources.append(
                          fetch_source(result)
                      )

                      if len(sources) >= MAX_WEB_SOURCES:
                          break

                  if len(sources) >= MAX_WEB_SOURCES:
                      break

              usable = [
                  source
                  for source in sources
                  if source.get("text")
              ]

              research_record = {
                  "research_id": hashlib.sha256(
                      (
                          str(
                              task_id_of(task)
                          )
                          + title
                      ).encode("utf-8")
                  ).hexdigest()[:24],
                  "task_id": task_id_of(task),
                  "timestamp": utc_now(),
                  "queries": queries,
                  "source_count": len(sources),
                  "usable_source_count": len(usable),
                  "sources": [
                      {
                          "title": source.get(
                              "title"
                          ),
                          "url": source.get(
                              "final_url",
                              source.get("url")
                          ),
                          "domain": source.get(
                              "domain"
                          ),
                          "snippet": source.get(
                              "snippet"
                          ),
                          "fetch_status": source.get(
                              "fetch_status"
                          ),
                          "text": source.get(
                              "text",
                              ""
                          )[:MAX_PAGE_TEXT_CHARS]
                      }
                      for source in sources
                  ]
              }

              return research_record


          def is_research_mission(task):

              text = task_text(task)

              return any(
                  phrase in text
                  for phrase in (
                      "research",
                      "research report",
                      "deep research",
                      "web research",
                      "market research",
                      "competitive research",
                      "source verification",
                      "fact checking",
                      "technical research",
                      "analysis"
                  )
              )


          # ============================================================
          # DETERMINISTIC DELIVERY
          # ============================================================

          def make_research_delivery(
              task,
              research_record
          ):

              title = title_of(task)

              usable_sources = [
                  source
                  for source in research_record.get(
                      "sources",
                      []
                  )
                  if source.get("text")
              ]

              lines = []

              lines.append(
                  "NØX Research Delivery"
              )

              lines.append("")
              lines.append(
                  f"Mission: {title}"
              )

              lines.append("")
              lines.append(
                  "Method:"
              )

              lines.append(
                  "Zero-cost web research using "
                  "publicly accessible sources. "
                  "No external AI or paid service was used."
              )

              lines.append("")
              lines.append(
                  f"Sources consulted: "
                  f"{len(usable_sources)}"
              )

              lines.append("")
              lines.append(
                  "Evidence:"
              )

              for index, source in enumerate(
                  usable_sources[:MAX_WEB_SOURCES],
                  start=1
              ):

                  source_title = (
                      source.get("title")
                      or "Untitled source"
                  )

                  domain = (
                      source.get("domain")
                      or "unknown domain"
                  )

                  snippet = (
                      source.get("snippet")
                      or source.get(
                          "text",
                          ""
                      )[:700]
                  )

                  lines.append(
                      f"{index}. "
                      f"{source_title} "
                      f"({domain})"
                  )

                  if snippet:
                      lines.append(
                          f"Evidence: {snippet[:900]}"
                      )

              lines.append("")
              lines.append(
                  "Source URLs:"
              )

              for source in usable_sources[
                  :MAX_WEB_SOURCES
              ]:

                  lines.append(
                      source.get(
                          "final_url",
                          source.get("url", "")
                      )
                  )

              lines.append("")
              lines.append(
                  "Limitations:"
              )

              if not usable_sources:

                  lines.append(
                      "No source could be fetched "
                      "reliably during this execution."
                  )

              else:

                  lines.append(
                      "The delivery reports retrieved "
                      "evidence and source metadata. "
                      "No unsupported conclusion has "
                      "been invented where evidence "
                      "was unavailable."
                  )

              return "\n".join(
                  lines
              )[:MAX_DELIVERY_CHARS]


          def make_non_research_delivery(
              task
          ):

              title = title_of(task)

              description = clean_text(
                  description_of(task)
              )

              return (
                  "NØX Mission Execution\n\n"
                  f"Mission: {title}\n\n"
                  "Task specification received:\n"
                  f"{description[:6500]}\n\n"
                  "Execution status:\n"
                  "The task was identified and processed "
                  "by NØX. No unsupported completion claim "
                  "has been made because the requested "
                  "deliverable requires a capability or "
                  "execution method not safely available "
                  "through this autonomous zero-cost runner."
              )[:MAX_DELIVERY_CHARS]


          # ============================================================
          # LOAD TARGET TASK
          # ============================================================

          task_map = {}

          for task in tasks:

              task_id = task_id_of(task)

              if task_id is not None:

                  task_map[str(task_id)] = task


          # ============================================================
          # EXECUTE PERSISTENT ACTIONS
          # ============================================================

          print()
          print("=== PERSISTENT ACTION EXECUTION ===")

          executions_this_run = 0
          completed_this_run = 0
          failed_this_run = 0

          for action_item in ready_actions[
              :MAX_ACTIONS_PER_RUN
          ]:

              if executions_this_run >= MAX_ACTIONS_PER_RUN:
                  break

              action_id = action_item.get(
                  "action_id"
              )

              task_id = str(
                  action_item.get(
                      "task_id",
                      ""
                  )
              )

              action_type = action_item.get(
                  "action_type"
              )

              task = task_map.get(
                  task_id
              )

              if not task:

                  action_item["status"] = (
                      "RETRY_PENDING"
                  )

                  action_item["attempts"] = (
                      int(
                          action_item.get(
                              "attempts",
                              0
                          )
                      ) + 1
                  )

                  action_item["last_error"] = (
                      "Task not present in current "
                      "marketplace page"
                  )

                  action_item["next_attempt_at"] = (
                      now_ts + ACTION_RETRY_SECONDS
                  )

                  action_item["updated_at"] = (
                      utc_now()
                  )

                  continue

              print()
              print(
                  f"PROCESS ACTION: {action_id}"
              )

              print(
                  f"Type: {action_type}"
              )

              print(
                  f"Task: {task_id}"
              )

              action_item["status"] = (
                  "EXECUTING"
              )

              action_item["attempts"] = (
                  int(
                      action_item.get(
                          "attempts",
                          0
                      )
                  ) + 1
              )

              action_item["updated_at"] = (
                  utc_now()
              )

              executions_this_run += 1

              try:

                  # ----------------------------------------------------
                  # MONITOR BID
                  # ----------------------------------------------------

                  if action_type == "MONITOR_BID":

                      bids, status_code = get_bids(
                          task_id
                      )

                      if status_code != 200:

                          raise RuntimeError(
                              f"Bid observation HTTP "
                              f"{status_code}"
                          )

                      own_bid = None

                      for bid in bids:

                          if bid_identity_match(
                              bid
                          ):

                              own_bid = bid
                              break

                      if not own_bid:

                          action_item["status"] = (
                              "RETRY_PENDING"
                          )

                          action_item["next_attempt_at"] = (
                              now_ts
                              + ACTION_RETRY_SECONDS
                          )

                          action_item["result"] = {
                              "status":
                              "OWN_BID_NOT_VISIBLE"
                          }

                          continue

                      status = normalized_status(
                          own_bid.get(
                              "status"
                          )
                      )

                      action_item["evidence"].append({
                          "timestamp": utc_now(),
                          "type": "BID_STATUS",
                          "status": status,
                          "bid_id": bid_id_of(
                              own_bid
                          )
                      })

                      if status == "ACCEPTED":

                          action_item["status"] = (
                              "COMPLETED"
                          )

                          create_action(
                              task_id,
                              "EXECUTE_ACCEPTED_MISSION",
                              title_of(task),
                              100,
                              {
                                  "bid_id":
                                  bid_id_of(
                                      own_bid
                                  )
                              }
                          )

                          completed_this_run += 1

                      elif status == "REJECTED":

                          action_item["status"] = (
                              "COMPLETED"
                          )

                          action_item["result"] = {
                              "bid_status":
                              "REJECTED"
                          }

                          completed_this_run += 1

                      else:

                          action_item["status"] = (
                              "RETRY_PENDING"
                          )

                          action_item["next_attempt_at"] = (
                              now_ts
                              + ACTION_RETRY_SECONDS
                          )

                      action_item["updated_at"] = (
                          utc_now()
                      )

                      continue


                  # ----------------------------------------------------
                  # ACCEPTED MISSION
                  # ----------------------------------------------------

                  if action_type == (
                      "EXECUTE_ACCEPTED_MISSION"
                  ):

                      if not WEB_RESEARCH_ENABLED:
                          raise RuntimeError(
                              "Web research is disabled"
                          )

                      research_record = None

                      if is_research_mission(task):

                          print(
                              "Research-capable mission: YES"
                          )

                          research_record = (
                              perform_research(
                                  task
                              )
                          )

                          ledger[
                              "research"
                          ].append(
                              research_record
                          )

                          action_item[
                              "evidence"
                          ].append({
                              "timestamp": utc_now(),
                              "type":
                              "WEB_RESEARCH",
                              "research_id":
                              research_record[
                                  "research_id"
                              ],
                              "sources":
                              research_record[
                                  "usable_source_count"
                              ]
                          })

                          if research_record[
                              "usable_source_count"
                          ] == 0:

                              action_item[
                                  "status"
                              ] = (
                                  "RETRY_PENDING"
                              )

                              action_item[
                                  "last_error"
                              ] = (
                                  "No usable research "
                                  "source retrieved"
                              )

                              action_item[
                                  "next_attempt_at"
                              ] = (
                                  now_ts
                                  + ACTION_RETRY_SECONDS
                              )

                              continue

                          delivery = (
                              make_research_delivery(
                                  task,
                                  research_record
                              )
                          )

                      else:

                          print(
                              "Research-capable mission: NO"
                          )

                          delivery = (
                              make_non_research_delivery(
                                  task
                              )
                          )

                          action_item[
                              "evidence"
                          ].append({
                              "timestamp": utc_now(),
                              "type":
                              "EXECUTION_LIMITATION",
                              "message":
                              "Mission does not match "
                              "the autonomous research/"
                              "analysis execution profile."
                          })

                      # ------------------------------------------------
                      # Delivery idempotency
                      # ------------------------------------------------

                      delivery_hash = hashlib.sha256(
                          delivery.encode("utf-8")
                      ).hexdigest()

                      delivery_key = hashlib.sha256(
                          (
                              f"{task_id}:"
                              f"{delivery_hash}"
                          ).encode("utf-8")
                      ).hexdigest()

                      already_delivered = any(
                          item.get("task_id")
                          == task_id
                          and item.get(
                              "delivery_hash"
                          )
                          == delivery_hash
                          for item in ledger[
                              "deliveries"
                          ]
                          if isinstance(
                              item,
                              dict
                          )
                      )

                      if already_delivered:

                          print(
                              "DELIVERY ALREADY VERIFIED "
                              "LOCALLY."
                          )

                          action_item["status"] = (
                              "COMPLETED"
                          )

                          action_item["result"] = {
                              "delivery":
                              "ALREADY_RECORDED",
                              "delivery_hash":
                              delivery_hash
                          }

                          completed_this_run += 1
                          continue

                      # ------------------------------------------------
                      # Preview
                      # ------------------------------------------------

                      preview = session.post(
                          f"{API_BASE}/posts/"
                          f"{task_id}/comments/preview",
                          json={
                              "content": delivery
                          },
                          timeout=HTTP_TIMEOUT
                      )

                      if not preview.ok:

                          raise RuntimeError(
                              "Delivery preview failed: "
                              f"{preview.status_code}"
                          )

                      # ------------------------------------------------
                      # Actual delivery
                      # ------------------------------------------------

                      delivery_response = session.post(
                          f"{API_BASE}/posts/"
                          f"{task_id}/comments",
                          json={
                              "content": delivery
                          },
                          headers={
                              "Idempotency-Key":
                              delivery_key
                          },
                          timeout=HTTP_TIMEOUT
                      )

                      if not delivery_response.ok:

                          raise RuntimeError(
                              "Delivery failed: "
                              f"{delivery_response.status_code} "
                              f"{delivery_response.text[:300]}"
                          )

                      delivery_record = {
                          "task_id": task_id,
                          "action_id": action_id,
                          "delivery_hash": delivery_hash,
                          "timestamp": utc_now(),
                          "type": (
                              "RESEARCH_DELIVERY"
                              if research_record
                              else
                              "LIMITED_EXECUTION"
                          )
                      }

                      ledger[
                          "deliveries"
                      ].append(
                          delivery_record
                      )

                      action_item["status"] = (
                          "DELIVERED"
                      )

                      action_item["result"] = {
                          "delivery_hash":
                          delivery_hash
                      }

                      action_item["evidence"].append({
                          "timestamp": utc_now(),
                          "type":
                          "DELIVERY_ACCEPTED_BY_API",
                          "delivery_hash":
                          delivery_hash
                      })

                      # ------------------------------------------------
                      # Payment remains observation only.
                      # ------------------------------------------------

                      payment_data, payment_status = (
                          get_payment(
                              task_id
                          )
                      )

                      ledger[
                          "observations"
                      ].append({
                          "timestamp": utc_now(),
                          "task_id": task_id,
                          "type":
                          "POST_DELIVERY_PAYMENT_OBSERVATION",
                          "http_status":
                          payment_status,
                          "payment":
                          payment_data
                      })

                      # ------------------------------------------------
                      # Completed
                      # ------------------------------------------------

                      action_item["status"] = (
                          "COMPLETED"
                      )

                      action_item[
                          "completed_at"
                      ] = utc_now()

                      action_item[
                          "updated_at"
                      ] = utc_now()

                      completed_this_run += 1

                      ledger[
                          "statistics"
                      ]["actions_completed"] += 1

                      ledger[
                          "statistics"
                      ]["deliveries"] += 1

                      print(
                          "ACTION COMPLETED: "
                          f"{action_id}"
                      )

                      continue

              except Exception as exc:

                  failed_this_run += 1

                  attempts = int(
                      action_item.get(
                          "attempts",
                          0
                      )
                  )

                  action_item[
                      "last_error"
                  ] = str(exc)[:1000]

                  action_item[
                      "updated_at"
                  ] = utc_now()

                  if attempts >= MAX_ACTION_ATTEMPTS:

                      action_item[
                          "status"
                      ] = "FAILED"

                      action_item[
                          "failed_at"
                      ] = utc_now()

                      ledger[
                          "statistics"
                      ]["actions_failed"] += 1

                      ledger[
                          "failures"
                      ].append({
                          "timestamp": utc_now(),
                          "type":
                          "ACTION_PERMANENT_FAILURE",
                          "action_id":
                          action_id,
                          "task_id":
                          task_id,
                          "action_type":
                          action_type,
                          "attempts":
                          attempts,
                          "error":
                          str(exc)[:1000]
                      })

                  else:

                      action_item[
                          "status"
                      ] = "RETRY_PENDING"

                      action_item[
                          "next_attempt_at"
                      ] = (
                          now_ts
                          + ACTION_RETRY_SECONDS
                      )

                      ledger[
                          "failures"
                      ].append({
                          "timestamp": utc_now(),
                          "type":
                          "ACTION_RETRY",
                          "action_id":
                          action_id,
                          "task_id":
                          task_id,
                          "action_type":
                          action_type,
                          "attempt":
                          attempts,
                          "error":
                          str(exc)[:1000]
                      })

                  print(
                      f"ACTION ERROR: {action_id} | "
                      f"{str(exc)[:300]}"
                  )


          # ============================================================
          # NEW BID DECISION
          #
          # IMPORTANT:
          # Existing actions have priority.
          # A new bid is attempted only after action processing.
          # ============================================================

          bids_created = 0
          bid_errors = 0

          active_action_exists = any(
              item.get("status")
              in (
                  "READY",
                  "EXECUTING",
                  "RETRY_PENDING"
              )
              for item in actions
          )

          print()
          print("=== NEW BID DECISION ===")

          if active_action_exists:

              print(
                  "NEW BID DEFERRED: "
                  "existing actions require attention."
              )

          elif not candidates:

              print(
                  "NO NEW BID: "
                  "no sufficiently aligned candidate."
              )

          else:

              selected = candidates[0]

              task_id = selected[
                  "task_id"
              ]

              task = task_map.get(
                  str(task_id)
              )

              # --------------------------------------------------------
              # Final server-side bid verification
              # --------------------------------------------------------

              bids, status_code = get_bids(
                  task_id
              )

              own_bid = None

              if status_code == 200:

                  for bid in bids:

                      if bid_identity_match(
                          bid
                      ):

                          own_bid = bid
                          break

              if own_bid:

                  current_status = normalized_status(
                      own_bid.get("status")
                  )

                  print(
                      "EXISTING SERVER BID: "
                      f"{current_status}"
                  )

                  create_action(
                      task_id,
                      "MONITOR_BID",
                      selected["title"],
                      70,
                      {
                          "bid_id":
                          bid_id_of(
                              own_bid
                          )
                      }
                  )

              else:

                  # ----------------------------------------------------
                  # Bid amount:
                  #
                  # No economic minimum is imposed.
                  # The API floor is used only to submit valid syntax.
                  # ----------------------------------------------------

                  bid_amount = MIN_BID_SATS

                  bid_message = (
                      "NØX can contribute to this mission "
                      "using its current research, analysis "
                      "and structured delivery capabilities. "
                      "The opportunity matches NØX's current "
                      "knowledge and observed marketplace "
                      "experience. Execution is designed to "
                      "remain zero-cost and without external AI."
                  )

                  idempotency_key = hashlib.sha256(
                      (
                          f"{task_id}:"
                          f"{bid_amount}:"
                          f"{int(now_ts // 3600)}"
                      ).encode("utf-8")
                  ).hexdigest()

                  print(
                      f"Submitting bid: "
                      f"{bid_amount} sats"
                  )

                  response = session.post(
                      f"{API_BASE}/marketplace/"
                      f"{task_id}/bid",
                      json={
                          "bid_amount_sats":
                          bid_amount,
                          "bid_description":
                          bid_message
                      },
                      headers={
                          "Idempotency-Key":
                          idempotency_key
                      },
                      timeout=HTTP_TIMEOUT
                  )

                  if response.status_code == 429:

                      bid_errors += 1

                      retry_after = (
                          response.headers.get(
                              "Retry-After"
                          )
                      )

                      try:
                          retry_after = int(
                              retry_after
                          )
                      except Exception:
                          retry_after = 1800

                      ledger[
                          "failures"
                      ].append({
                          "timestamp": utc_now(),
                          "type":
                          "BID_RATE_LIMIT",
                          "task_id":
                          task_id,
                          "retry_after":
                          retry_after
                      })

                      print(
                          "BID RATE LIMITED."
                      )

                  elif response.status_code in (
                      200,
                      201
                  ):

                      bids_created += 1

                      response_data = {}

                      try:
                          response_data = (
                              response.json()
                          )
                      except Exception:
                          response_data = {}

                      new_bid_id = (
                          response_data.get(
                              "id"
                          )
                          or response_data.get(
                              "bid_id"
                          )
                          or response_data.get(
                              "bidId"
                          )
                      )

                      ledger[
                          "bids"
                      ].append({
                          "task_id":
                          task_id,
                          "bid_id":
                          new_bid_id,
                          "amount_sats":
                          bid_amount,
                          "score":
                          selected["score"],
                          "created_at":
                          utc_now(),
                          "status":
                          "SUBMITTED"
                      })

                      # ------------------------------------------------
                      # CRITICAL:
                      # A successful bid immediately creates a
                      # persistent monitoring action.
                      # ------------------------------------------------

                      create_action(
                          task_id,
                          "MONITOR_BID",
                          selected["title"],
                          70,
                          {
                              "bid_id":
                              new_bid_id
                          }
                      )

                      ledger[
                          "statistics"
                      ]["bids_created"] += 1

                      print(
                          f"BID CREATED: {task_id}"
                      )

                  elif response.status_code == 409:

                      print(
                          "BID CONFLICT: "
                          "server already has matching action."
                      )

                      create_action(
                          task_id,
                          "MONITOR_BID",
                          selected["title"],
                          70,
                          {}
                      )

                  else:

                      bid_errors += 1

                      ledger[
                          "failures"
                      ].append({
                          "timestamp":
                          utc_now(),
                          "type":
                          "BID_ERROR",
                          "task_id":
                          task_id,
                          "http_status":
                          response.status_code,
                          "error":
                          response.text[:500]
                      })

                      print(
                          f"BID ERROR: "
                          f"{response.status_code}"
                      )


          # ============================================================
          # OUTCOME / LEARNING
          # ============================================================

          print()
          print("=== LEARNING ===")

          completed_actions = [
              item
              for item in actions
              if item.get("status")
              == "COMPLETED"
          ]

          failed_actions = [
              item
              for item in actions
              if item.get("status")
              == "FAILED"
          ]

          learning_record = {
              "timestamp": utc_now(),
              "completed_actions":
              len(completed_actions),
              "failed_actions":
              len(failed_actions),
              "bids_created":
              bids_created,
              "candidate_count":
              len(candidates),
              "rejection_counts":
              rejection_counts,
              "observed_payments":
              payment_observations,
              "rule":
              "Prioritize completion of existing actions "
              "before creating new marketplace actions."
          }

          ledger[
              "learning"
          ].append(
              learning_record
          )


          # ============================================================
          # PERSISTENT POLICY
          # ============================================================

          ledger[
              "policy"
          ] = {
              "api_bid_floor_sats":
              MIN_BID_SATS,

              "api_bid_floor_is_not_economic_floor":
              True,

              "minimum_task_reward":
              None,

              "tip_potential_considered":
              True,

              "existing_actions_have_priority":
              True,

              "server_verification_required":
              True,

              "delivery_requires_actual_api_success":
              True,

              "unsupported_completion_claims":
              False,

              "web_research":
              WEB_RESEARCH_ENABLED,

              "external_ai":
              False,

              "gemini":
              False,

              "payments":
              False,

              "spending":
              False,

              "project_cost_eur":
              0
          }


          # ============================================================
          # FAILURE LEDGER POLICY
          # ============================================================

          ledger[
              "failure_policy"
          ] = {
              "enabled":
              True,

              "categories": [
                  "TECHNICAL",
                  "COMPREHENSION",
                  "DECISION",
                  "EXECUTION",
                  "DELIVERY",
                  "INSUFFICIENT_RESULT",
                  "EXTERNAL_API",
                  "UNKNOWN"
              ],

              "record_only_observed_failures":
              True,

              "no_fabricated_causes":
              True
          }


          # ============================================================
          # MEMORY COMPACTION
          # ============================================================

          ledger[
              "actions"
          ] = ledger[
              "actions"
          ][-int(
              os.environ[
                  "ACTION_MEMORY_LIMIT"
              ]
          ):]

          ledger[
              "failures"
          ] = ledger[
              "failures"
          ][-int(
              os.environ[
                  "MAX_FAILURE_MEMORY"
              ]
          ):]

          ledger[
              "research"
          ] = ledger[
              "research"
          ][-int(
              os.environ[
                  "MAX_RESEARCH_MEMORY"
              ]
          ):]

          ledger[
              "observations"
          ] = ledger[
              "observations"
          ][-int(
              os.environ[
                  "MAX_OBSERVATIONS"
              ]
          ):]

          ledger[
              "deliveries"
          ] = ledger[
              "deliveries"
          ][-300:]

          ledger[
              "bids"
          ] = ledger[
              "bids"
          ][-300:]

          ledger[
              "outcomes"
          ] = ledger[
              "outcomes"
          ][-300:]

          ledger[
              "learning"
          ] = ledger[
              "learning"
          ][-300:]


          # ============================================================
          # CURRENT RUN STATE
          # ============================================================

          ledger[
              "last_run"
          ] = utc_now()

          ledger[
              "last_run_summary"
          ] = {
              "tasks_found":
              len(tasks),

              "candidates":
              len(candidates),

              "actions_processed":
              executions_this_run,

              "actions_completed":
              completed_this_run,

              "actions_failed":
              failed_this_run,

              "bids_created":
              bids_created,

              "bid_errors":
              bid_errors,

              "payments_observed":
              payment_observations,

              "persistent_actions":
              len(actions),

              "ready_actions_after_run":
              len([
                  item
                  for item in actions
                  if item.get("status")
                  in (
                      "READY",
                      "RETRY_PENDING"
                  )
              ])
          }


          # ============================================================
          # FINAL SAVE
          # ============================================================

          save_json(
              MEMORY_FILE,
              ledger
          )


          # ============================================================
          # FINAL REPORT
          # ============================================================

          print()
          print("=" * 68)
          print("=== NØX LEDGER 04 V5 COMPLETE ===")
          print("=" * 68)

          print(
              f"Tasks found: {len(tasks)}"
          )

          print(
              f"Candidates: {len(candidates)}"
          )

          print(
              f"Actions processed: "
              f"{executions_this_run}"
          )

          print(
              f"Actions completed: "
              f"{completed_this_run}"
          )

          print(
              f"Actions failed: "
              f"{failed_this_run}"
          )

          print(
              f"Persistent actions: "
              f"{len(actions)}"
          )

          print(
              f"Bids created: "
              f"{bids_created}"
          )

          print(
              f"Bid errors: "
              f"{bid_errors}"
          )

          print(
              f"Payments observed: "
              f"{payment_observations}"
          )

          print()
          print("Existing actions priority: YES")
          print("Persistent action queue: YES")
          print("Server bid verification: YES")
          print("Web research: YES")
          print("External AI: False")
          print("Gemini: False")
          print("Payments: False")
          print("Spending: False")
          print("Project cost: €0")
          print("21 sats: API FLOOR ONLY")
          print("Minimum task reward: NONE")
          print("Unsupported completion claims: FALSE")

          print("=" * 68)

          PY

      # ============================================================
      # PERSIST ONLY LEDGER 04 STATE
      # ============================================================
      - name: Persist Ledger 04 state
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_ledger_04_marketplace.json

          if git diff --cached --quiet; then
            echo "No Ledger 04 state changes to commit."
          else
            git commit -m "feat: upgrade NØX Ledger 04 marketplace execution V5"
            git push
          fi
