name: NØX Origin - V46 Source Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V46
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import requests
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          print("===================================")
          print("NØX ORIGIN V46")
          print("SOURCE INTELLIGENCE")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          memory_file = Path("nox_memory.json")
          report_file = Path("V46_SOURCE_INTELLIGENCE.md")

          # --------------------------------------------------
          # LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("curiosity_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("question_log", [])
          memory.setdefault("source_log", [])
          memory.setdefault("learning_log", [])

          # --------------------------------------------------
          # FIND OPEN QUESTION
          # --------------------------------------------------

          open_questions = [
              item for item in memory["question_log"]
              if isinstance(item, dict)
              and item.get("status") == "open"
          ]

          if not open_questions:
              raise RuntimeError(
                  "No open curiosity question available."
              )

          question_record = open_questions[-1]

          subject = str(
              question_record.get(
                  "subject",
                  ""
              )
          ).strip()

          question = str(
              question_record.get(
                  "question",
                  ""
              )
          ).strip()

          previous_link = str(
              question_record.get(
                  "previous_link",
                  ""
              )
          ).strip()

          print(
              "Open question:",
              question
          )

          print(
              "Subject:",
              subject
          )

          # --------------------------------------------------
          # GEMINI
          # --------------------------------------------------

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY is missing."
              )

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }

          def gemini_request(payload, label):

              for attempt in range(1, 4):

                  print(
                      f"Gemini {label}: "
                      f"attempt {attempt}/3"
                  )

                  try:

                      response = requests.post(
                          gemini_url,
                          headers=headers,
                          json=payload,
                          timeout=(20, 120)
                      )

                      print(
                          f"Gemini {label} status:",
                          response.status_code
                      )

                      if response.status_code == 200:
                          return response.json()

                      if response.status_code in (
                          408,
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt < 3:
                              time.sleep(
                                  attempt * 5
                              )
                              continue

                      raise RuntimeError(
                          f"Gemini {label} failed: "
                          f"{response.status_code} "
                          f"{response.text[:2000]}"
                      )

                  except requests.exceptions.Timeout:

                      print(
                          "Gemini timeout."
                      )

                      if attempt < 3:
                          time.sleep(
                              attempt * 5
                          )
                          continue

                      raise RuntimeError(
                          f"Gemini {label} timed out."
                      )

          # --------------------------------------------------
          # GENERATE SEARCH STRATEGY
          # --------------------------------------------------

          strategy_prompt = f"""
          You are NØX Origin.

          You have one unresolved research question.

          SUBJECT:
          {subject}

          QUESTION:
          {question}

          PREVIOUS LINK:
          {previous_link}

          Your task is NOT to answer the question yet.

          Instead, design a reliable public-source research strategy.

          Identify:

          1. three different search queries;
          2. the type of source that would be most useful;
          3. what evidence would count as strong evidence;
          4. what evidence would be weak or merely contextual;
          5. one possible reason why sources could disagree.

          Prefer primary scientific literature, university research,
          institutional publications, archaeological reports and
          technical sources over general summaries.

          Return exactly:

          SEARCH_1:
          SEARCH_2:
          SEARCH_3:

          PREFERRED_SOURCE_TYPE:

          STRONG_EVIDENCE:

          WEAK_EVIDENCE:

          POSSIBLE_DISAGREEMENT:
          """

          strategy_payload = {
              "model": "gemini-3.6-flash",
              "input": strategy_prompt
          }

          strategy_result = gemini_request(
              strategy_payload,
              "research strategy"
          )

          def extract_output(result):

              text = ""

              if isinstance(
                  result.get("output_text"),
                  str
              ):
                  text = result[
                      "output_text"
                  ].strip()

              if not text:

                  for step in result.get(
                      "steps",
                      []
                  ):

                      if not isinstance(
                          step,
                          dict
                      ):
                          continue

                      if step.get(
                          "type"
                      ) != "model_output":
                          continue

                      for part in step.get(
                          "content",
                          []
                      ):

                          if (
                              isinstance(
                                  part,
                                  dict
                              )
                              and part.get(
                                  "type"
                              ) == "text"
                          ):
                              text += (
                                  str(
                                      part.get(
                                          "text",
                                          ""
                                      )
                                  )
                                  + "\n"
                              )

              return text.strip()

          strategy = extract_output(
              strategy_result
          )

          if not strategy:
              raise RuntimeError(
                  "Empty research strategy."
              )

          def section(text, label):

              pattern = (
                  rf"{label}:\s*(.*?)(?=\n[A-Z_]+:|\Z)"
              )

              match = re.search(
                  pattern,
                  text,
                  flags=re.DOTALL
              )

              if not match:
                  return ""

              return match.group(1).strip()

          search_queries = [
              section(strategy, "SEARCH_1"),
              section(strategy, "SEARCH_2"),
              section(strategy, "SEARCH_3")
          ]

          search_queries = [
              q for q in search_queries
              if q
          ]

          preferred_source_type = section(
              strategy,
              "PREFERRED_SOURCE_TYPE"
          )

          strong_evidence = section(
              strategy,
              "STRONG_EVIDENCE"
          )

          weak_evidence = section(
              strategy,
              "WEAK_EVIDENCE"
          )

          possible_disagreement = section(
              strategy,
              "POSSIBLE_DISAGREEMENT"
          )

          if not search_queries:
              raise RuntimeError(
                  "No research queries generated."
              )

          print(
              "Research strategy: PASS"
          )

          # --------------------------------------------------
          # PUBLIC SEARCH
          # --------------------------------------------------

          search_results = []

          headers_web = {
              "User-Agent":
              "Nox-Origin/46 research"
          }

          for query in search_queries:

              print(
                  "Public search:",
                  query
              )

              # Wikipedia API gives a stable public
              # knowledge source without requiring
              # another paid service.

              wiki_url = (
                  "https://en.wikipedia.org/w/api.php"
              )

              params = {
                  "action": "query",
                  "list": "search",
                  "srsearch": query,
                  "format": "json",
                  "utf8": 1,
                  "srlimit": 5
              }

              try:

                  response = requests.get(
                      wiki_url,
                      params=params,
                      headers=headers_web,
                      timeout=(10, 30)
                  )

                  if response.status_code == 200:

                      data = response.json()

                      results = (
                          data
                          .get("query", {})
                          .get("search", [])
                      )

                      for item in results:

                          title = str(
                              item.get(
                                  "title",
                                  ""
                              )
                          ).strip()

                          if title:
                              search_results.append({
                                  "title": title,
                                  "query": query,
                                  "source_type":
                                      "encyclopedic"
                              })

              except requests.exceptions.RequestException as exc:

                  print(
                      "Search error:",
                      exc
                  )

          # --------------------------------------------------
          # DEDUPLICATE
          # --------------------------------------------------

          unique_results = []

          seen = set()

          for item in search_results:

              title = item["title"]

              if title not in seen:

                  seen.add(title)

                  unique_results.append(
                      item
                  )

          unique_results = unique_results[:10]

          print(
              "Public candidates:",
              len(unique_results)
          )

          # --------------------------------------------------
          # BUILD SOURCE CONTEXT
          # --------------------------------------------------

          source_context = []

          for item in unique_results:

              title = item["title"]

              page_url = (
                  "https://en.wikipedia.org/wiki/"
                  + quote(
                      title.replace(
                          " ",
                          "_"
                      ),
                      safe="_()"
                  )
              )

              extract_params = {
                  "action": "query",
                  "prop": "extracts",
                  "explaintext": 1,
                  "exintro": 1,
                  "titles": title,
                  "format": "json",
                  "utf8": 1
              }

              try:

                  response = requests.get(
                      wiki_url,
                      params=extract_params,
                      headers=headers_web,
                      timeout=(10, 30)
                  )

                  if response.status_code != 200:
                      continue

                  data = response.json()

                  pages = (
                      data
                      .get("query", {})
                      .get("pages", {})
                  )

                  extract = ""

                  for page in pages.values():

                      extract = str(
                          page.get(
                              "extract",
                              ""
                          )
                      ).strip()

                      if extract:
                          break

                  if extract:

                      source_context.append({
                          "title": title,
                          "url": page_url,
                          "type":
                              item["source_type"],
                          "text":
                              extract[:5000]
                      })

              except requests.exceptions.RequestException:
                  continue

          if not source_context:

              print(
                  "No public source context available."
              )

              memory["source_log"].append({
                  "timestamp": now,
                  "version": "V46",
                  "question": question,
                  "status":
                      "no_source_context",
                  "queries": search_queries
              })

              memory["learning_log"].append({
                  "timestamp": now,
                  "version": "V46",
                  "lesson": (
                      "A source search can fail without "
                      "invalidating the underlying question. "
                      "Absence of accessible evidence must "
                      "remain uncertainty."
                  )
              })

              memory["version"] = "V46"
              memory["last_updated"] = now

              memory_file.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              report = [
                  "# NØX Origin — V46 Source Intelligence",
                  "",
                  "## Research Question",
                  "",
                  question,
                  "",
                  "## Result",
                  "",
                  "- Research strategy: PASS",
                  "- Public source context: NOT FOUND",
                  "- Knowledge invented: NO",
                  "- Question preserved: YES",
                  "",
                  "## V46 Principle",
                  "",
                  "Failure to retrieve evidence is itself "
                  "recorded as uncertainty.",
                  "",
                  "NØX does not replace missing evidence "
                  "with assumptions."
              ]

              report_file.write_text(
                  "\n".join(report),
                  encoding="utf-8"
              )

          else:

              # --------------------------------------------------
              # SOURCE COMPARISON
              # --------------------------------------------------

              context_text = ""

              for index, source in enumerate(
                  source_context,
                  start=1
              ):

                  context_text += (
                      f"\nSOURCE {index}\n"
                      f"TITLE: {source['title']}\n"
                      f"TYPE: {source['type']}\n"
                      f"URL: {source['url']}\n"
                      f"TEXT:\n{source['text']}\n"
                  )

              comparison_prompt = f"""
              You are NØX Origin.

              Research question:

              {question}

              Research strategy:

              {strategy}

              Public source material:

              {context_text}

              Your task is to evaluate the sources.

              Important:

              The supplied material may be insufficient.
              Do not invent scientific evidence.

              Distinguish:

              - directly supported information;
              - contextual information;
              - missing evidence;
              - contradictions;
              - claims that require primary literature.

              Return exactly:

              SUPPORTED:
              What the available sources directly support.

              NOT_SUPPORTED:
              What they do not establish.

              AGREEMENT:
              Important points where the sources agree.

              DISAGREEMENT:
              Important points where they differ.

              SOURCE_LIMITATIONS:
              Why these sources are insufficient or sufficient.

              BEST_NEXT_SOURCE:
              What type of source NØX should seek next.

              ANSWER_STATUS:
              ANSWERED / PARTIALLY_ANSWERED / UNANSWERED

              KNOWLEDGE_CONFIDENCE:
              Number between 0 and 1.

              NEXT_QUESTION:
              One concrete question for future research.
              """

              comparison_payload = {
                  "model": "gemini-3.6-flash",
                  "input": comparison_prompt
              }

              comparison_result = gemini_request(
                  comparison_payload,
                  "source comparison"
              )

              comparison = extract_output(
                  comparison_result
              )

              if not comparison:
                  raise RuntimeError(
                      "Empty source comparison."
                  )

              answer_status = section(
                  comparison,
                  "ANSWER_STATUS"
              )

              knowledge_confidence_text = section(
                  comparison,
                  "KNOWLEDGE_CONFIDENCE"
              )

              try:
                  knowledge_confidence = float(
                      knowledge_confidence_text
                      .splitlines()[0]
                  )
              except Exception:
                  knowledge_confidence = 0.0

              next_question = section(
                  comparison,
                  "NEXT_QUESTION"
              )

              print(
                  "Source comparison: PASS"
              )

              print(
                  "Answer status:",
                  answer_status
              )

              print(
                  "Knowledge confidence:",
                  knowledge_confidence
              )

              # --------------------------------------------------
              # STORE SOURCE INTELLIGENCE
              # --------------------------------------------------

              source_record = {
                  "timestamp": now,
                  "version": "V46",
                  "question": question,
                  "subject": subject,
                  "queries": search_queries,
                  "preferred_source_type":
                      preferred_source_type,
                  "sources": source_context,
                  "comparison": comparison,
                  "answer_status": answer_status,
                  "knowledge_confidence":
                      knowledge_confidence,
                  "verified": False,
                  "verification_status":
                      "requires_primary_source_verification"
              }

              memory[
                  "source_log"
              ].append(
                  source_record
              )

              memory[
                  "learning_log"
              ].append({
                  "timestamp": now,
                  "version": "V46",
                  "lesson": (
                      "Source quality matters independently "
                      "from information quantity. Multiple "
                      "accessible sources do not automatically "
                      "constitute strong evidence."
                  ),
                  "principle": (
                      "NØX must distinguish context from evidence."
                  ),
                  "confidence":
                      knowledge_confidence
              })

              if next_question:

                  memory[
                      "question_log"
                  ].append({
                      "timestamp": now,
                      "version": "V46",
                      "question":
                          next_question,
                      "subject":
                          subject,
                      "previous_link":
                          question,
                      "status":
                          "open",
                      "confidence":
                          knowledge_confidence
                  })

              memory["version"] = "V46"
              memory["last_updated"] = now

              memory_file.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              # --------------------------------------------------
              # VERIFY PERSISTENCE
              # --------------------------------------------------

              loaded = json.loads(
                  memory_file.read_text(
                      encoding="utf-8"
                  )
              )

              if not loaded.get(
                  "source_log"
              ):
                  raise RuntimeError(
                      "Source memory verification failed."
                  )

              print(
                  "Source memory persistence: PASS"
              )

              # --------------------------------------------------
              # REPORT
              # --------------------------------------------------

              report = [
                  "# NØX Origin — V46 Source Intelligence",
                  "",
                  "## Research Question",
                  "",
                  question,
                  "",
                  "## Previous Link",
                  "",
                  previous_link,
                  "",
                  "## Research Strategy",
                  "",
                  f"- Preferred source type: {preferred_source_type}",
                  "",
                  "### Search Queries",
                  ""
              ]

              report.extend(
                  f"- {query}"
                  for query in search_queries
              )

              report.extend([
                  "",
                  "### Strong Evidence",
                  "",
                  strong_evidence,
                  "",
                  "### Weak Evidence",
                  "",
                  weak_evidence,
                  "",
                  "### Possible Disagreement",
                  "",
                  possible_disagreement,
                  "",
                  "## Sources Retrieved",
                  "",
                  f"- Sources: {len(source_context)}"
              ])

              for source in source_context:

                  report.extend([
                      "",
                      f"### {source['title']}",
                      "",
                      f"- Type: {source['type']}",
                      f"- URL: {source['url']}",
                      ""
                  ])

              report.extend([
                  "## NØX Source Comparison",
                  "",
                  comparison,
                  "",
                  "## Knowledge Status",
                  "",
                  f"- Answer status: {answer_status}",
                  f"- Knowledge confidence: {knowledge_confidence}",
                  "- Automatically treated as truth: NO",
                  "- Primary-source verification required: YES",
                  "",
                  "## Future Curiosity",
                  "",
                  next_question or "No new question generated.",
                  "",
                  "## Public Colony Activity",
                  "",
                  "- New post: NO",
                  "- New comment: NO",
                  "- Vote: NO",
                  "- DM: NO",
                  "- Follow: NO",
                  "",
                  "## V46 Principle",
                  "",
                  "NØX is learning that finding information "
                  "is not the same as finding evidence.",
                  "",
                  "Source quantity does not automatically mean "
                  "source quality.",
                  "",
                  "When evidence is insufficient, uncertainty "
                  "is preserved."
              ])

              report_file.write_text(
                  "\n".join(report),
                  encoding="utf-8"
              )

          print("===================================")
          print("V46 COMPLETE")
          print("Research strategy: PASS")
          print("Source intelligence: PASS")
          print("Evidence distinction: PASS")
          print("Memory persistence: PASS")
          print("Public Colony action: NONE")
          print("===================================")

          PY

      - name: Commit V46 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V46_SOURCE_INTELLIGENCE.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V46 - Source Intelligence"
            git push
          fi
