name: NØX ACT 17 - Knowledge Core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act17-knowledge-core
  cancel-in-progress: false

jobs:
  nox-act17:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NOX_USERNAME: nox_origine
      KNOWLEDGE_FILE: memory/nox_knowledge_core.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NØX Knowledge Core
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          USERNAME = os.environ["NOX_USERNAME"]
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          NOW = datetime.now(timezone.utc)

          print("=" * 56)
          print("NØX ACT 17 - KNOWLEDGE CORE")
          print("=" * 56)
          print("Mode: LOCAL MEMORY ANALYSIS")
          print("External AI: DISABLED")
          print("Gemini: DISABLED")
          print("Marketplace scraping: DISABLED")
          print("Publication: DISABLED")
          print("Cost: €0")
          print()

          # ------------------------------------------------------------
          # Priority model already defined for NØX.
          # ACT17 uses it as a classification layer.
          # ------------------------------------------------------------

          PRIORITIES = {
              "virtual_economy": {
                  "weight": 1.00,
                  "keywords": [
                      "marketplace", "task", "offer", "bid", "bidding",
                      "reward", "payment", "lightning", "wallet",
                      "economy", "agent economy", "opportunity"
                  ],
              },
              "cybersecurity": {
                  "weight": 0.90,
                  "keywords": [
                      "security", "cybersecurity", "authentication",
                      "api", "secret", "credential", "token",
                      "prompt injection", "attack", "vulnerability"
                  ],
              },
              "ai_communities": {
                  "weight": 0.85,
                  "keywords": [
                      "community", "collaboration", "agent",
                      "agents", "reputation", "trust", "governance",
                      "cooperation", "network"
                  ],
              },
              "agent_intelligence_and_autonomy": {
                  "weight": 0.90,
                  "keywords": [
                      "autonomy", "autonomous", "memory", "planning",
                      "reasoning", "learning", "decision",
                      "capability", "agent intelligence", "tool"
                  ],
              },
              "emerging_technologies_and_opportunities": {
                  "weight": 0.75,
                  "keywords": [
                      "technology", "open source", "protocol",
                      "infrastructure", "robotics", "emerging",
                      "innovation", "opportunity"
                  ],
              },
          }

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def iso_now():
              return NOW.isoformat()

          def normalize_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  return str(value)

          def compact_text(value, limit=5000):
              text = normalize_text(value)
              text = re.sub(r"\s+", " ", text).strip()
              return text[:limit]

          def sha256_text(text):
              return hashlib.sha256(
                  text.encode("utf-8")
              ).hexdigest()

          def load_json(path):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"READ_WARNING: {path}: {exc}")
                  return None

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )
                  f.write("\n")

              tmp.replace(path)

          def parse_date(value):
              if not value:
                  return None

              try:
                  text = str(value).replace("Z", "+00:00")
                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt
              except Exception:
                  return None

          def recursive_strings(value, depth=0, max_depth=5):
              if depth > max_depth:
                  return []

              result = []

              if isinstance(value, str):
                  if value.strip():
                      result.append(value.strip())
                  return result

              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in {
                          "api_key",
                          "token",
                          "access_token",
                          "secret",
                          "password",
                          "credential"
                      }:
                          continue

                      result.extend(
                          recursive_strings(
                              item,
                              depth + 1,
                              max_depth
                          )
                      )

              elif isinstance(value, list):
                  for item in value[:100]:
                      result.extend(
                          recursive_strings(
                              item,
                              depth + 1,
                              max_depth
                          )
                      )

              return result

          def extract_text(record):
              if not isinstance(record, dict):
                  return compact_text(record, 6000)

              preferred = [
                  "title",
                  "name",
                  "subject",
                  "description",
                  "body",
                  "content",
                  "summary",
                  "reason",
                  "finding",
                  "result",
                  "lesson",
                  "observation",
                  "task",
                  "offer",
                  "opportunity",
              ]

              pieces = []

              for key in preferred:
                  if key in record:
                      text = compact_text(record.get(key), 2500)
                      if text:
                          pieces.append(text)

              if not pieces:
                  pieces = recursive_strings(
                      record,
                      max_depth=3
                  )[:12]

              return compact_text(
                  " | ".join(pieces),
                  7000
              )

          def find_author(record):
              if not isinstance(record, dict):
                  return None

              candidates = [
                  record.get("author_username"),
                  record.get("username"),
                  record.get("agent_username"),
                  record.get("source_agent"),
                  record.get("agent"),
              ]

              author = record.get("author")

              if isinstance(author, dict):
                  candidates.extend([
                      author.get("username"),
                      author.get("name"),
                  ])
              elif isinstance(author, str):
                  candidates.append(author)

              for candidate in candidates:
                  if candidate:
                      return str(candidate)

              return None

          def find_date(record):
              if not isinstance(record, dict):
                  return None

              keys = [
                  "created_at",
                  "published_at",
                  "timestamp",
                  "updated_at",
                  "observed_at",
                  "completed_at",
                  "date",
              ]

              for key in keys:
                  if record.get(key):
                      return record.get(key)

              return None

          def classify(text):
              lowered = text.lower()

              scores = {}

              for domain, config in PRIORITIES.items():
                  hits = 0

                  for keyword in config["keywords"]:
                      if keyword.lower() in lowered:
                          hits += 1

                  scores[domain] = hits * config["weight"]

              if not scores:
                  return "general", 0.30, []

              ordered = sorted(
                  scores.items(),
                  key=lambda item: item[1],
                  reverse=True
              )

              top_domain, top_score = ordered[0]

              if top_score <= 0:
                  return "general", 0.30, []

              matched = [
                  domain
                  for domain, score in ordered
                  if score > 0
              ]

              confidence = min(
                  0.95,
                  0.45 + (top_score * 0.08)
              )

              return top_domain, round(confidence, 3), matched

          def extract_evidence(record, source_file):
              evidence = []

              if not isinstance(record, dict):
                  return evidence

              for key in [
                  "evidence",
                  "source",
                  "source_url",
                  "post_id",
                  "task_id",
                  "offer_id",
                  "result",
                  "response",
                  "observation",
                  "proof",
              ]:
                  value = record.get(key)

                  if value not in (None, "", [], {}):
                      evidence.append({
                          "type": key,
                          "value": compact_text(value, 1200)
                      })

              evidence.append({
                  "type": "repository_source",
                  "value": str(source_file)
              })

              return evidence[:12]

          # ------------------------------------------------------------
          # Load existing Knowledge Core.
          # ------------------------------------------------------------

          if KNOWLEDGE_FILE.exists():
              existing = load_json(KNOWLEDGE_FILE)

              if not isinstance(existing, dict):
                  existing = {}
          else:
              existing = {}

          existing.setdefault(
              "version",
              "ACT17_KNOWLEDGE_CORE_V1"
          )

          existing.setdefault(
              "knowledge",
              []
          )

          existing.setdefault(
              "processed_sources",
              {}
          )

          existing.setdefault(
              "contradictions",
              []
          )

          existing.setdefault(
              "statistics",
              {}
          )

          # ------------------------------------------------------------
          # Discover memory sources.
          #
          # ACT17 deliberately reads local memory instead of querying
          # The Colony again. This prevents duplication with ACT16.
          # ------------------------------------------------------------

          source_files = sorted(
              p for p in MEMORY_DIR.rglob("*.json")
              if p.resolve() != KNOWLEDGE_FILE.resolve()
          )

          print(f"Memory files discovered: {len(source_files)}")

          observations = []

          for source_file in source_files:
              data = load_json(source_file)

              if data is None:
                  continue

              raw_text = normalize_text(data)
              source_hash = sha256_text(raw_text)

              previous_hash = existing["processed_sources"].get(
                  str(source_file)
              )

              if previous_hash == source_hash:
                  continue

              existing["processed_sources"][
                  str(source_file)
              ] = source_hash

              # --------------------------------------------------------
              # Convert JSON structures into candidate observations.
              # --------------------------------------------------------

              candidates = []

              if isinstance(data, list):
                  candidates = data[:500]

              elif isinstance(data, dict):
                  # Common collection containers.
                  collection_keys = [
                      "items",
                      "observations",
                      "results",
                      "offers",
                      "tasks",
                      "events",
                      "entries",
                      "records",
                      "publications",
                      "actions",
                      "runs",
                      "history",
                      "memory",
                      "knowledge",
                  ]

                  found_collection = False

                  for key in collection_keys:
                      value = data.get(key)

                      if isinstance(value, list):
                          candidates.extend(value[:500])
                          found_collection = True

                  if not found_collection:
                      candidates = [data]

              for record in candidates:
                  if not isinstance(record, (dict, str)):
                      continue

                  text = extract_text(record)

                  if len(text.strip()) < 25:
                      continue

                  # ------------------------------------------------------
                  # Active attention:
                  # Ignore meaningless low-information records.
                  # ------------------------------------------------------

                  domain, base_confidence, matched_domains = classify(text)

                  signal_terms = [
                      "success",
                      "failure",
                      "error",
                      "result",
                      "evidence",
                      "verified",
                      "task",
                      "offer",
                      "opportunity",
                      "capability",
                      "lesson",
                      "security",
                      "reputation",
                      "trust",
                      "decision",
                  ]

                  signal_count = sum(
                      1
                      for term in signal_terms
                      if term in text.lower()
                  )

                  if signal_count == 0 and len(text) < 80:
                      continue

                  author = find_author(record)
                  record_date = find_date(record)
                  parsed_date = parse_date(record_date)

                  evidence = extract_evidence(
                      record,
                      source_file
                  )

                  claim_id = sha256_text(
                      f"{domain}|{text.lower()[:3000]}"
                  )[:20]

                  observations.append({
                      "claim_id": claim_id,
                      "information": text,
                      "domain": domain,
                      "matched_domains": matched_domains,
                      "source_agent": author or "unknown",
                      "source_file": str(source_file),
                      "source_date": record_date,
                      "parsed_date": (
                          parsed_date.isoformat()
                          if parsed_date
                          else None
                      ),
                      "evidence": evidence,
                      "base_confidence": base_confidence,
                  })

          print(f"New candidate observations: {len(observations)}")

          # ------------------------------------------------------------
          # Merge observations into structured knowledge.
          # ------------------------------------------------------------

          knowledge_by_id = {
              item.get("claim_id"): item
              for item in existing["knowledge"]
              if isinstance(item, dict)
              and item.get("claim_id")
          }

          added = 0
          updated = 0

          for obs in observations:
              claim_id = obs["claim_id"]

              if claim_id not in knowledge_by_id:
                  knowledge_by_id[claim_id] = {
                      "claim_id": claim_id,
                      "information": obs["information"],
                      "domain": obs["domain"],
                      "source_agent": obs["source_agent"],
                      "sources": [],
                      "evidence": [],
                      "confirmations": 0,
                      "contradictions": 0,
                      "confidence": obs["base_confidence"],
                      "status": "UNVERIFIED",
                      "operational_usefulness": 0,
                      "first_seen": iso_now(),
                      "last_seen": iso_now(),
                      "last_verified": None,
                  }

                  added += 1

              item = knowledge_by_id[claim_id]

              item["last_seen"] = iso_now()

              source_ref = {
                  "file": obs["source_file"],
                  "agent": obs["source_agent"],
                  "date": obs["source_date"],
              }

              if source_ref not in item["sources"]:
                  item["sources"].append(source_ref)

              for ev in obs["evidence"]:
                  if ev not in item["evidence"]:
                      item["evidence"].append(ev)

              # --------------------------------------------------------
              # Independent source confirmation.
              # --------------------------------------------------------

              unique_sources = {
                  s.get("file")
                  for s in item["sources"]
                  if isinstance(s, dict)
              }

              item["confirmations"] = max(
                  0,
                  len(unique_sources) - 1
              )

              # Evidence increases confidence.
              evidence_bonus = min(
                  0.15,
                  len(item["evidence"]) * 0.02
              )

              confirmation_bonus = min(
                  0.20,
                  item["confirmations"] * 0.05
              )

              item["confidence"] = round(
                  min(
                      0.99,
                      max(
                          item.get("confidence", 0.30),
                          obs["base_confidence"]
                          + evidence_bonus
                          + confirmation_bonus
                      )
                  ),
                  3
              )

              # --------------------------------------------------------
              # Verification state.
              # --------------------------------------------------------

              if item["confirmations"] >= 2:
                  item["status"] = "CORROBORATED"
                  item["last_verified"] = iso_now()

              elif len(item["evidence"]) >= 2:
                  item["status"] = "EVIDENCE_SUPPORTED"

              else:
                  item["status"] = "UNVERIFIED"

              # --------------------------------------------------------
              # Operational usefulness.
              # --------------------------------------------------------

              usefulness = 0

              if item["domain"] != "general":
                  usefulness += 2

              if item["source_agent"] != "unknown":
                  usefulness += 1

              if item["evidence"]:
                  usefulness += 2

              if item["confirmations"] > 0:
                  usefulness += 2

              if any(
                  term in item["information"].lower()
                  for term in [
                      "task",
                      "offer",
                      "opportunity",
                      "error",
                      "failure",
                      "success",
                      "capability",
                      "security",
                      "decision",
                  ]
              ):
                  usefulness += 2

              item["operational_usefulness"] = min(
                  10,
                  usefulness
              )

              # Keep evidence bounded.
              item["sources"] = item["sources"][-20:]
              item["evidence"] = item["evidence"][-30:]

              updated += 1

          # ------------------------------------------------------------
          # Detect contradictions.
          #
          # Deterministic heuristic:
          # same domain + same important subject + opposite result words.
          # This does NOT declare something false; it marks it for review.
          # ------------------------------------------------------------

          positive_terms = {
              "success",
              "successful",
              "works",
              "working",
              "verified",
              "valid",
              "available",
              "completed",
          }

          negative_terms = {
              "failure",
              "failed",
              "error",
              "invalid",
              "unavailable",
              "blocked",
              "rejected",
          }

          items = list(knowledge_by_id.values())
          contradictions = []

          for i in range(len(items)):
              a = items[i]

              text_a = a["information"].lower()

              a_positive = any(
                  word in text_a
                  for word in positive_terms
              )

              a_negative = any(
                  word in text_a
                  for word in negative_terms
              )

              if not (a_positive or a_negative):
                  continue

              for j in range(i + 1, len(items)):
                  b = items[j]

                  if a["domain"] != b["domain"]:
                      continue

                  text_b = b["information"].lower()

                  b_positive = any(
                      word in text_b
                      for word in positive_terms
                  )

                  b_negative = any(
                      word in text_b
                      for word in negative_terms
                  )

                  opposite = (
                      (a_positive and b_negative)
                      or
                      (a_negative and b_positive)
                  )

                  if not opposite:
                      continue

                  words_a = set(
                      re.findall(
                          r"[a-zA-ZÀ-ÿ0-9_]{5,}",
                          text_a
                      )
                  )

                  words_b = set(
                      re.findall(
                          r"[a-zA-ZÀ-ÿ0-9_]{5,}",
                          text_b
                      )
                  )

                  overlap = words_a.intersection(words_b)

                  if len(overlap) >= 3:
                      contradictions.append({
                          "claim_a": a["claim_id"],
                          "claim_b": b["claim_id"],
                          "domain": a["domain"],
                          "common_terms": sorted(
                              list(overlap)
                          )[:20],
                          "status": "REQUIRES_VERIFICATION",
                          "detected_at": iso_now(),
                      })

                      a["contradictions"] += 1
                      b["contradictions"] += 1

          # Remove duplicate contradiction records.
          unique_contradictions = {}

          for contradiction in contradictions:
              key = tuple(sorted([
                  contradiction["claim_a"],
                  contradiction["claim_b"],
              ]))

              unique_contradictions[key] = contradiction

          existing["contradictions"] = list(
              unique_contradictions.values()
          )[-100:]

          # ------------------------------------------------------------
          # Knowledge freshness.
          # ------------------------------------------------------------

          stale_count = 0
          verified_count = 0
          corroborated_count = 0

          for item in knowledge_by_id.values():
              last_seen = parse_date(
                  item.get("last_seen")
              )

              if last_seen:
                  age_days = (
                      NOW - last_seen
                  ).total_seconds() / 86400

                  if age_days > 30:
                      item["freshness"] = "STALE"
                      stale_count += 1
                  elif age_days > 7:
                      item["freshness"] = "AGING"
                  else:
                      item["freshness"] = "FRESH"
              else:
                  item["freshness"] = "UNKNOWN"

              if item.get("last_verified"):
                  verified_count += 1

              if item.get("status") == "CORROBORATED":
                  corroborated_count += 1

          # ------------------------------------------------------------
          # Sort knowledge by operational value.
          # ------------------------------------------------------------

          knowledge = list(
              knowledge_by_id.values()
          )

          knowledge.sort(
              key=lambda item: (
                  item.get("operational_usefulness", 0),
                  item.get("confidence", 0),
                  item.get("confirmations", 0),
                  item.get("last_seen", ""),
              ),
              reverse=True
          )

          # Keep the core bounded but useful.
          knowledge = knowledge[:1000]

          # ------------------------------------------------------------
          # Update statistics.
          # ------------------------------------------------------------

          domain_counts = {}

          for item in knowledge:
              domain = item.get(
                  "domain",
                  "general"
              )

              domain_counts[domain] = (
                  domain_counts.get(domain, 0) + 1
              )

          existing["knowledge"] = knowledge

          existing["statistics"] = {
              "total_knowledge": len(knowledge),
              "new_knowledge": added,
              "updated_knowledge": updated,
              "corroborated": corroborated_count,
              "verified": verified_count,
              "stale": stale_count,
              "contradictions": len(
                  existing["contradictions"]
              ),
              "domains": domain_counts,
              "memory_files_scanned": len(source_files),
              "new_observations": len(observations),
              "last_run": iso_now(),
          }

          existing["active_attention"] = {
              "principle": (
                  "NØX does not store everything. "
                  "It selects information with operational, "
                  "evidential or strategic value."
              ),
              "selection_signals": [
                  "domain relevance",
                  "evidence",
                  "source identity",
                  "independent confirmation",
                  "operational usefulness",
                  "success/failure information",
                  "security relevance",
                  "opportunity relevance",
                  "contradiction detection",
                  "freshness",
              ],
              "updated_at": iso_now(),
          }

          existing["knowledge_policy"] = {
              "information_is_not_automatically_truth": True,
              "unverified_claims_allowed": True,
              "unverified_claims_must_be_marked": True,
              "contradictions_require_verification": True,
              "stale_information_must_be_identified": True,
              "source_must_be_retained": True,
              "evidence_must_be_retained": True,
              "confidence_required": True,
          }

          existing["last_run"] = iso_now()

          save_json(
              KNOWLEDGE_FILE,
              existing
          )

          print()
          print("=" * 56)
          print("ACT17 KNOWLEDGE CORE RESULT")
          print("=" * 56)
          print(
              "Knowledge entries:",
              len(existing["knowledge"])
          )
          print(
              "New knowledge:",
              added
          )
          print(
              "New observations:",
              len(observations)
          )
          print(
              "Corroborated:",
              corroborated_count
          )
          print(
              "Verified:",
              verified_count
          )
          print(
              "Contradictions:",
              len(existing["contradictions"])
          )
          print(
              "Stale knowledge:",
              stale_count
          )
          print(
              "Memory files scanned:",
              len(source_files)
          )
          print()
          print(
              json.dumps(
                  existing["statistics"],
                  indent=2,
                  ensure_ascii=False
              )
          )
          print()
          print("ACT17 KNOWLEDGE CORE: SUCCESS")
          PY

      - name: Commit Knowledge Core memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_knowledge_core.json

          if git diff --cached --quiet; then
            echo "No Knowledge Core changes to commit."
          else
            git commit -m "NØX ACT17 Knowledge Core"
            git push
          fi
