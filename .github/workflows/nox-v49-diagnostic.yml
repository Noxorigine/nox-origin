name: NØX Origin - V49 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run Colony diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          print("===================================")
          print("NØX ORIGIN V49 DIAGNOSTIC")
          print("===================================")

          BASE_URL = "https://thecolony.ai/api/v1"

          # --------------------------------------------------
          # 1. CHECK API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              print("ERROR: COLONY_API_KEY is missing.")
              sys.exit(1)

          print("COLONY_API_KEY: PRESENT")
          print(
              "API key prefix:",
              api_key[:8] + "..."
          )

          # --------------------------------------------------
          # 2. PREPARE AUTHENTICATION
          # --------------------------------------------------

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
          }

          print("")
          print("-----------------------------------")
          print("STEP 1 - AUTHENTICATION TEST")
          print("-----------------------------------")

          # --------------------------------------------------
          # 3. TEST /users/me
          # --------------------------------------------------

          try:
              response = requests.get(
                  f"{BASE_URL}/users/me",
                  headers=headers,
                  timeout=(15, 30),
              )

          except requests.RequestException as exc:
              print(
                  "ERROR connecting to /users/me:"
              )
              print(exc)
              sys.exit(1)

          print(
              "HTTP status:",
              response.status_code
          )

          print(
              "Response preview:"
          )

          print(
              response.text[:2000]
          )

          if response.status_code != 200:
              print("")
              print(
                  "AUTHENTICATION TEST: FAILED"
              )
              print(
                  "The problem occurs before "
                  "the feed is requested."
              )
              sys.exit(1)

          print("")
          print(
              "AUTHENTICATION TEST: PASS"
          )

          # --------------------------------------------------
          # 4. READ IDENTITY
          # --------------------------------------------------

          try:
              me = response.json()

          except ValueError:
              print(
                  "ERROR: /users/me did not return JSON."
              )
              sys.exit(1)

          print("")
          print(
              "Identity response:"
          )

          print(
              json.dumps(
                  me,
                  indent=2,
                  ensure_ascii=False
              )[:3000]
          )

          # --------------------------------------------------
          # 5. TEST FOR-YOU FEED
          # --------------------------------------------------

          print("")
          print("-----------------------------------")
          print("STEP 2 - FOR-YOU FEED TEST")
          print("-----------------------------------")

          try:
              feed_response = requests.get(
                  f"{BASE_URL}/feed/for-you",
                  headers=headers,
                  params={
                      "limit": 10
                  },
                  timeout=(15, 45),
              )

          except requests.RequestException as exc:
              print(
                  "ERROR connecting to /feed/for-you:"
              )
              print(exc)
              sys.exit(1)

          print(
              "HTTP status:",
              feed_response.status_code
          )

          print(
              "Response preview:"
          )

          print(
              feed_response.text[:5000]
          )

          if feed_response.status_code != 200:
              print("")
              print(
                  "FOR-YOU FEED TEST: FAILED"
              )
              print(
                  "Authentication works, "
                  "but the feed request failed."
              )
              sys.exit(1)

          print("")
          print(
              "FOR-YOU FEED TEST: PASS"
          )

          # --------------------------------------------------
          # 6. ANALYZE FEED STRUCTURE
          # --------------------------------------------------

          try:
              feed_data = feed_response.json()

          except ValueError:
              print(
                  "ERROR: Feed did not return JSON."
              )
              sys.exit(1)

          print("")
          print("-----------------------------------")
          print("STEP 3 - FEED STRUCTURE")
          print("-----------------------------------")

          print(
              "JSON root type:",
              type(feed_data).__name__
          )

          if isinstance(feed_data, list):

              items = feed_data

          elif isinstance(feed_data, dict):

              items = []

              for key in (
                  "posts",
                  "items",
                  "data",
                  "results",
                  "feed"
              ):

                  value = feed_data.get(key)

                  if isinstance(
                      value,
                      list
                  ):

                      items = value

                      print(
                          "Detected feed key:",
                          key
                      )

                      break

          else:

              items = []

          print(
              "Items detected:",
              len(items)
          )

          # --------------------------------------------------
          # 7. SHOW FIRST ITEMS
          # --------------------------------------------------

          if items:

              print("")
              print("-----------------------------------")
              print("STEP 4 - SAMPLE POSTS")
              print("-----------------------------------")

              for number, item in enumerate(
                  items[:5],
                  start=1
              ):

                  print("")
                  print(
                      f"POST {number}"
                  )

                  if isinstance(
                      item,
                      dict
                  ):

                      print(
                          json.dumps(
                              item,
                              indent=2,
                              ensure_ascii=False
                          )[:3000]
                      )

                  else:

                      print(
                          str(item)[:3000]
                      )

          else:

              print("")
              print(
                  "WARNING: No feed items detected."
              )

          # --------------------------------------------------
          # 8. FINAL RESULT
          # --------------------------------------------------

          print("")
          print("===================================")
          print("V49 DIAGNOSTIC RESULT")
          print("===================================")

          print(
              "API KEY: PASS"
          )

          print(
              "AUTHENTICATION: PASS"
          )

          print(
              "FOR-YOU ENDPOINT: PASS"
          )

          print(
              f"FEED ITEMS: {len(items)}"
          )

          print(
              "GEMINI: NOT TESTED"
          )

          print(
              "MEMORY: NOT MODIFIED"
          )

          print(
              "PUBLICATION: DISABLED"
          )

          print(
              "SPENDING: DISABLED"
          )

          print("===================================")

          PY
