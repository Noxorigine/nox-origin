name: NØX Origin - V49 Feed Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed-diagnostic:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V49 Feed Diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V49")
          print("FEED DIAGNOSTIC")
          print("NO GEMINI")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          API_BASE = "https://thecolony.ai/api/v1"
          FEED_URL = f"{API_BASE}/feed/for-you"

          diagnostic_file = Path(
              "V49_FEED_DIAGNOSTIC.json"
          )

          report_file = Path(
              "V49_FEED_DIAGNOSTIC.md"
          )

          # --------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing."
              )

          print("Environment: PASS")

          # --------------------------------------------------
          # AUTHENTICATION
          # --------------------------------------------------

          print(
              "Authenticating with The Colony..."
          )

          auth_response = requests.post(
              f"{API_BASE}/auth/token",
              json={
                  "api_key": api_key
              },
              headers={
                  "Content-Type": "application/json"
              },
              timeout=(15, 30)
          )

          print(
              "Colony authentication status:",
              auth_response.status_code
          )

          if auth_response.status_code != 200:
              raise RuntimeError(
                  "The Colony authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:2000]}"
              )

          try:
              auth_data = auth_response.json()
          except ValueError:
              raise RuntimeError(
                  "The Colony authentication response "
                  "was not valid JSON."
              )

          token = auth_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "The Colony did not return an access_token."
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Authentication: PASS")

          # --------------------------------------------------
          # IDENTITY
          # --------------------------------------------------

          print(
              "Verifying NØX identity..."
          )

          me_response = requests.get(
              f"{API_BASE}/users/me",
              headers=headers,
              timeout=(15, 30)
          )

          print(
              "Colony identity status:",
              me_response.status_code
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  "Colony identity verification failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text[:2000]}"
              )

          try:
              me_data = me_response.json()
          except ValueError:
              me_data = {}

          agent_name = (
              me_data.get("username")
              or me_data.get("name")
              or "unknown"
          )

          print(
              "Authenticated agent:",
              agent_name
          )

          # --------------------------------------------------
          # FETCH FEED
          # --------------------------------------------------

          print(
              "Requesting The Colony for-you feed..."
          )

          feed_response = requests.get(
              FEED_URL,
              headers=headers,
              params={
                  "limit": 25
              },
              timeout=(15, 45)
          )

          print(
              "Colony feed status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  "Colony feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:3000]}"
              )

          try:
              feed_data = feed_response.json()
          except ValueError:
              raise RuntimeError(
                  "Colony feed returned invalid JSON."
              )

          print("Feed JSON: PASS")

          # --------------------------------------------------
          # IDENTIFY TOP LEVEL STRUCTURE
          # --------------------------------------------------

          top_level_type = type(
              feed_data
          ).__name__

          print(
              "Feed top-level type:",
              top_level_type
          )

          raw_items = []

          if isinstance(
              feed_data,
              list
          ):

              raw_items = feed_data

          elif isinstance(
              feed_data,
              dict
          ):

              print(
                  "Feed dictionary keys:"
              )

              print(
                  json.dumps(
                      list(
                          feed_data.keys()
                      ),
                      ensure_ascii=False,
                      indent=2
                  )
              )

              candidate_keys = [
                  "posts",
                  "items",
                  "data",
                  "results",
                  "feed",
                  "entries",
                  "content"
              ]

              for key in candidate_keys:

                  value = feed_data.get(
                      key
                  )

                  if isinstance(
                      value,
                      list
                  ):

                      raw_items = value

                      print(
                          "Feed list found under key:",
                          key
                      )

                      break

          print(
              "Feed items received:",
              len(raw_items)
          )

          # --------------------------------------------------
          # BUILD STRUCTURAL DIAGNOSTIC
          # --------------------------------------------------

          diagnostic = {
              "version": "V49",
              "mode": "feed_diagnostic",
              "gemini": False,
              "timestamp": now,
              "agent": agent_name,
              "endpoint": FEED_URL,
              "http_status": feed_response.status_code,
              "top_level_type": top_level_type,
              "items_received": len(raw_items),
              "items": []
          }

          for index, item in enumerate(
              raw_items,
              start=1
          ):

              item_record = {
                  "index": index,
                  "python_type": type(
                      item
                  ).__name__
              }

              if isinstance(
                  item,
                  dict
              ):

                  item_record[
                      "keys"
                  ] = list(
                      item.keys()
                  )

                  # --------------------------------------------------
                  # SHOW POSSIBLE NESTED STRUCTURES
                  # --------------------------------------------------

                  nested = {}

                  for key, value in item.items():

                      if isinstance(
                          value,
                          dict
                      ):

                          nested[key] = {
                              "type": "dict",
                              "keys": list(
                                  value.keys()
                              )
                          }

                      elif isinstance(
                          value,
                          list
                      ):

                          nested[key] = {
                              "type": "list",
                              "length": len(
                                  value
                              )
                          }

                      else:

                          nested[key] = {
                              "type":
                                  type(
                                      value
                                  ).__name__
                          }

                  item_record[
                      "structure"
                  ] = nested

                  # --------------------------------------------------
                  # SAFE SAMPLE
                  # --------------------------------------------------

                  sample = {}

                  for key, value in item.items():

                      if isinstance(
                          value,
                          (str, int, float, bool)
                      ) or value is None:

                          text = str(
                              value
                          )

                          if len(text) > 500:
                              text = (
                                  text[:500]
                                  + "..."
                              )

                          sample[key] = text

                      elif isinstance(
                          value,
                          dict
                      ):

                          sample[key] = {
                              "_type": "dict",
                              "_keys": list(
                                  value.keys()
                              )
                          }

                      elif isinstance(
                          value,
                          list
                      ):

                          sample[key] = {
                              "_type": "list",
                              "_length": len(
                                  value
                              )
                          }

                      else:

                          sample[key] = {
                              "_type":
                                  type(
                                      value
                                  ).__name__
                          }

                  item_record[
                      "sample"
                  ] = sample

              else:

                  item_record[
                      "value_preview"
                  ] = str(
                      item
                  )[:1000]

              diagnostic[
                  "items"
              ].append(
                  item_record
              )

          # --------------------------------------------------
          # RAW RESPONSE PREVIEW
          # --------------------------------------------------

          try:

              serialized_feed = json.dumps(
                  feed_data,
                  ensure_ascii=False,
                  indent=2
              )

          except Exception:

              serialized_feed = str(
                  feed_data
              )

          diagnostic[
              "raw_response_preview"
          ] = serialized_feed[:12000]

          # --------------------------------------------------
          # SAVE JSON DIAGNOSTIC
          # --------------------------------------------------

          diagnostic_file.write_text(
              json.dumps(
                  diagnostic,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Diagnostic JSON written: PASS"
          )

          # --------------------------------------------------
          # HUMAN READABLE REPORT
          # --------------------------------------------------

          report = []

          report.append(
              "# NØX Origin — V49 Feed Diagnostic"
          )

          report.append("")

          report.append(
              f"Generated: {now}"
          )

          report.append("")

          report.append(
              f"Authenticated agent: {agent_name}"
          )

          report.append("")

          report.append(
              "## Connection"
          )

          report.append("")

          report.append(
              "- The Colony authentication: PASS"
          )

          report.append(
              "- Identity verification: PASS"
          )

          report.append(
              "- For-you feed request: PASS"
          )

          report.append(
              "- Gemini: DISABLED"
          )

          report.append("")

          report.append(
              "## Feed Structure"
          )

          report.append("")

          report.append(
              f"- HTTP status: {feed_response.status_code}"
          )

          report.append(
              f"- Top-level type: {top_level_type}"
          )

          report.append(
              f"- Items received: {len(raw_items)}"
          )

          report.append("")

          if isinstance(
              feed_data,
              dict
          ):

              report.append(
                  "### Top-level keys"
              )

              report.append("")

              for key in feed_data.keys():

                  report.append(
                      f"- `{key}`"
                  )

              report.append("")

          report.append(
              "## Item Structures"
          )

          report.append("")

          if not raw_items:

              report.append(
                  "No list was detected at the expected "
                  "top-level locations."
              )

              report.append("")

              report.append(
                  "The raw response preview is stored "
                  "in V49_FEED_DIAGNOSTIC.json."
              )

          else:

              for item_record in diagnostic[
                  "items"
              ]:

                  report.append(
                      f"### Item {item_record['index']}"
                  )

                  report.append("")

                  report.append(
                      f"- Python type: "
                      f"`{item_record['python_type']}`"
                  )

                  if "keys" in item_record:

                      report.append(
                          "- Keys:"
                      )

                      for key in item_record[
                          "keys"
                      ]:

                          report.append(
                              f"  - `{key}`"
                          )

                  report.append("")

          report.append(
              "## Safety"
          )

          report.append("")

          report.append(
              "- No Colony publication."
          )

          report.append(
              "- No comment."
          )

          report.append(
              "- No vote."
          )

          report.append(
              "- No follow."
          )

          report.append(
              "- No DM."
          )

          report.append(
              "- No purchase."
          )

          report.append(
              "- No spending."
          )

          report.append(
              "- No external action."
          )

          report.append(
              "- Gemini disabled."
          )

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print(
              "Diagnostic report written: PASS"
          )

          # --------------------------------------------------
          # FINAL
          # --------------------------------------------------

          print("===================================")
          print("V49 FEED DIAGNOSTIC COMPLETE")
          print("===================================")
          print(
              "Authentication: PASS"
          )
          print(
              "Identity: PASS"
          )
          print(
              "Feed request: PASS"
          )
          print(
              "Items received:",
              len(raw_items)
          )
          print(
              "Gemini: DISABLED"
          )
          print(
              "Publication: DISABLED"
          )
          print(
              "External actions: DISABLED"
          )
          print("===================================")

          PY

      - name: Commit V49 diagnostic
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add V49_FEED_DIAGNOSTIC.json V49_FEED_DIAGNOSTIC.md

          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "NØX V49 - Feed diagnostic"
            git push
          fi
