name: NØX ACT48 - Strategy Planning

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

jobs:
  act48-strategy-planning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT48
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"

          SOURCE = MEMORY / "nox_act_47_strategy_combination.json"
          OUTPUT_JSON = MEMORY / "nox_act_48_strategy_planning.json"
          OUTPUT_MD = MEMORY / "nox_act_48_strategy_planning.md"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def normalize(value):
              if isinstance(value, str):
                  return re.sub(r"\s+", " ", value.strip()).lower()
              return value

          def as_list(value):
              if isinstance(value, list):
                  return value
              if value is None:
                  return []
              return [value]

          def is_strategy_like(value):
              return isinstance(value, (str, dict))

          def extract_explicit_sequences(obj):
              """
              Extract ONLY explicitly represented ordering information.

              No ordering is inferred from:
              - list position
              - dictionary order
              - strategy names
              - alphabetical order
              - scores
              - timestamps
              - arbitrary candidate ranking
              """
              sequences = []

              explicit_sequence_keys = {
                  "strategy_sequence",
                  "strategy_order",
                  "ordered_strategies",
                  "sequence",
                  "order",
                  "precedence",
                  "execution_order",
                  "plan_sequence",
              }

              dependency_keys = {
                  "strategy_dependencies",
                  "dependencies",
                  "depends_on",
                  "prerequisite_strategy",
                  "prerequisites",
                  "precedence_constraints",
              }

              def walk(node, path="root"):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          key_norm = normalize(key)

                          if key_norm in explicit_sequence_keys:
                              if isinstance(value, list) and len(value) >= 2:
                                  if all(is_strategy_like(x) for x in value):
                                      sequences.append({
                                          "type": "explicit_sequence",
                                          "path": f"{path}.{key}",
                                          "sequence": value,
                                      })

                          if key_norm in dependency_keys:
                              if isinstance(value, (list, dict)):
                                  sequences.append({
                                      "type": "explicit_dependency",
                                      "path": f"{path}.{key}",
                                      "dependencies": value,
                                  })

                          walk(value, f"{path}.{key}")

                  elif isinstance(node, list):
                      for index, item in enumerate(node):
                          walk(item, f"{path}[{index}]")

              walk(obj)
              return sequences

          def extract_available_strategies(data):
              """
              Read strategies only from ACT47 fields that explicitly identify
              available strategies. Never manufacture candidates.
              """
              candidates = []

              explicit_keys = {
                  "available_strategies",
                  "strategies",
                  "combination_candidates",
                  "selected_combination",
                  "combined_strategy",
                  "strategy_combination",
              }

              def walk(node, path="root"):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          key_norm = normalize(key)

                          if key_norm in explicit_keys:
                              if isinstance(value, list):
                                  for item in value:
                                      if isinstance(item, (str, dict)):
                                          candidates.append({
                                              "value": item,
                                              "source_path": f"{path}.{key}",
                                          })
                              elif isinstance(value, dict):
                                  candidates.append({
                                      "value": value,
                                      "source_path": f"{path}.{key}",
                                  })
                              elif isinstance(value, str) and value.strip():
                                  candidates.append({
                                      "value": value.strip(),
                                      "source_path": f"{path}.{key}",
                                  })

                          walk(value, f"{path}.{key}")

                  elif isinstance(node, list):
                      for index, item in enumerate(node):
                          walk(item, f"{path}[{index}]")

              walk(data)

              # Deduplicate structurally without imposing an order.
              unique = []
              seen = set()

              for item in candidates:
                  try:
                      marker = json.dumps(
                          item["value"],
                          sort_keys=True,
                          ensure_ascii=False,
                      )
                  except Exception:
                      marker = str(item["value"])

                  if marker not in seen:
                      seen.add(marker)
                      unique.append(item)

              return unique

          source_exists = SOURCE.exists()
          source = load_json(SOURCE)

          integrity = {
              "source_exists": source_exists,
              "source_valid_json": source is not None,
              "source_is_act47": False,
              "no_strategy_invention": True,
              "no_order_invention": True,
              "no_score_based_ordering": True,
              "no_list_position_ordering": True,
              "no_alphabetical_ordering": True,
              "no_fallback_plan": True,
              "gemini_used": False,
              "external_ai_used": False,
              "external_api_used": False,
              "payments_used": False,
              "spending_used": False,
          }

          if isinstance(source, dict):
              source_text = json.dumps(
                  source,
                  ensure_ascii=False,
                  sort_keys=True,
              ).lower()

              if (
                  "act47" in source_text
                  and (
                      "strategy combination" in source_text
                      or "strategy_combination" in source_text
                      or "combination_possible" in source_text
                  )
              ):
                  integrity["source_is_act47"] = True

          available = extract_available_strategies(source) if source else []
          explicit_sequences = extract_explicit_sequences(source) if source else []

          # ACT47 is authoritative.
          # If it explicitly says combination is impossible or evidence is
          # insufficient, ACT48 must not manufacture a plan.
          combination_possible = None
          act47_decision = None

          if isinstance(source, dict):
              combination_possible = source.get("combination_possible")
              act47_decision = source.get("decision")

              if act47_decision is None:
                  act47_decision = source.get("combination_decision")

          selected_plan = None
          planning_decision = "INSUFFICIENT_EVIDENCE"
          reason = ""
          order_supported = False

          # First safety gate: ACT47 must actually provide usable strategy
          # information.
          if not source_exists:
              planning_decision = "SOURCE_MISSING"
              reason = (
                  "ACT47 V1 memory is missing. ACT48 cannot construct a plan "
                  "without its authoritative upstream result."
              )

          elif source is None:
              planning_decision = "INVALID_SOURCE"
              reason = (
                  "ACT47 V1 memory could not be parsed as valid JSON. "
                  "ACT48 refuses to construct a plan."
              )

          elif combination_possible is False and not available:
              planning_decision = "INSUFFICIENT_EVIDENCE"
              reason = (
                  "ACT47 reports that strategy combination is not possible "
                  "and provides no available strategies. ACT48 will not "
                  "invent an ordered plan."
              )

          elif len(available) < 1:
              planning_decision = "INSUFFICIENT_EVIDENCE"
              reason = (
                  "ACT47 does not provide an explicit available strategy "
                  "from which an execution plan could be constructed."
              )

          else:
              # A plan is valid only when ACT47 itself contains explicit
              # ordering/dependency evidence.
              if explicit_sequences:
                  for sequence in explicit_sequences:
                      if sequence["type"] == "explicit_sequence":
                          seq = sequence["sequence"]

                          if len(seq) >= 2:
                              selected_plan = {
                                  "type": "explicit_strategy_sequence",
                                  "source_path": sequence["path"],
                                  "ordered_strategies": seq,
                              }
                              planning_decision = "PLAN_SUPPORTED"
                              reason = (
                                  "ACT47 contains an explicit strategy "
                                  "sequence. ACT48 preserves that sequence "
                                  "without inventing or re-ranking it."
                              )
                              order_supported = True
                              break

                      elif sequence["type"] == "explicit_dependency":
                          selected_plan = {
                              "type": "explicit_strategy_dependencies",
                              "source_path": sequence["path"],
                              "dependencies": sequence["dependencies"],
                          }
                          planning_decision = "PLAN_SUPPORTED_BY_DEPENDENCIES"
                          reason = (
                              "ACT47 contains explicit strategy dependency "
                              "information. ACT48 preserves those "
                              "dependencies without inventing an order."
                          )
                          order_supported = True
                          break

              if not order_supported:
                  planning_decision = "INSUFFICIENT_ORDER_EVIDENCE"
                  reason = (
                      "ACT47 provides strategy information but does not "
                      "provide explicit ordering or dependency evidence. "
                      "ACT48 refuses to infer an order from names, list "
                      "position, scores, timestamps, or arbitrary ranking."
                  )

          result = {
              "act": "ACT48",
              "version": "V1",
              "title": "Strategy Planning",
              "question": "Dans quel ordre dois-je utiliser ces stratégies ?",
              "timestamp_utc": now(),

              "source": {
                  "file": str(SOURCE),
                  "required_upstream": "ACT47 V1",
                  "verified": (
                      source_exists
                      and source is not None
                      and integrity["source_is_act47"]
                  ),
              },

              "upstream_state": {
                  "act47_decision": act47_decision,
                  "combination_possible": combination_possible,
                  "available_strategy_count": len(available),
                  "explicit_sequence_count": len(explicit_sequences),
              },

              "available_strategies": available,

              "explicit_order_evidence": explicit_sequences,

              "planning": {
                  "decision": planning_decision,
                  "order_supported": order_supported,
                  "selected_plan": selected_plan,
                  "reason": reason,
              },

              "safety": {
                  "strategies_invented": False,
                  "order_invented": False,
                  "metrics_invented": False,
                  "ranking_invented": False,
                  "fallback_plan_used": False,
                  "external_information_used": False,
              },

              "constraints": {
                  "gemini": False,
                  "external_ai": False,
                  "external_api": False,
                  "payments": False,
                  "spending": False,
                  "cost_eur": 0,
                  "python": "3.11",
              },

              "integrity": integrity,

              "next_step": (
                  "Remain in ACT48 until ACT47 provides explicit "
                  "ordering/dependency evidence."
                  if not order_supported
                  else
                  "ACT48 has preserved an explicitly supported strategy "
                  "plan. The next cognitive layer can consume this plan."
              ),
          }

          MEMORY.mkdir(parents=True, exist_ok=True)

          with OUTPUT_JSON.open("w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")

          md = f"""# NØX ACT48 — Strategy Planning

          **Version:** V1  
          **Question:** Dans quel ordre dois-je utiliser ces stratégies ?  
          **Decision:** `{planning_decision}`  
          **Timestamp UTC:** `{result["timestamp_utc"]}`

          ## Upstream

          - Source: `memory/nox_act_47_strategy_combination.json`
          - Required: ACT47 V1
          - Source verified: `{result["source"]["verified"]}`
          - ACT47 decision: `{act47_decision}`
          - Combination possible: `{combination_possible}`
          - Available strategies: `{len(available)}`
          - Explicit ordering/dependency evidence: `{len(explicit_sequences)}`

          ## Planning decision

          **{planning_decision}**

          {reason}

          ## Selected plan

          ```json
          {json.dumps(selected_plan, ensure_ascii=False, indent=2)}
          ```

          ## Safety

          ACT48 does **not**:

          - invent strategies;
          - invent an execution order;
          - sort strategies alphabetically;
          - use list position as evidence;
          - create hidden scores;
          - rank strategies arbitrarily;
          - fabricate dependencies;
          - use external AI;
          - use Gemini;
          - use external APIs;
          - spend money;
          - perform payments.

          ## Next step

          {result["next_step"]}
          """

          with OUTPUT_MD.open("w", encoding="utf-8") as f:
              f.write(md)

          print("=== NØX ACT48 V1 ===")
          print(f"Source exists: {source_exists}")
          print(f"Source valid JSON: {source is not None}")
          print(f"ACT47 verified: {integrity['source_is_act47']}")
          print(f"ACT47 decision: {act47_decision}")
          print(f"Combination possible: {combination_possible}")
          print(f"Available strategies: {len(available)}")
          print(f"Explicit order evidence: {len(explicit_sequences)}")
          print(f"Planning decision: {planning_decision}")
          print(f"Order supported: {order_supported}")
          print(f"Selected plan: {json.dumps(selected_plan, ensure_ascii=False)}")
          print("Gemini: false")
          print("External AI: false")
          print("External API: false")
          print("Payments: false")
          print("Spending: false")
          print("Cost EUR: 0")

          PY

      - name: Commit ACT48 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_48_strategy_planning.json \
                  memory/nox_act_48_strategy_planning.md

          if git diff --cached --quiet; then
            echo "No ACT48 changes to commit."
          else
            git commit -m "ACT48: add strategy planning memory"
            git push
          fi
