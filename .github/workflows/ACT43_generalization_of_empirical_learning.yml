name: "NØX ACT43 - Generalization of Empirical Learning"

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generalization-of-empirical-learning:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT43 generalization of empirical learning
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          OUTPUT = MEMORY / "nox_act_43_generalization_of_empirical_learning.json"

          def load_json(path):
              path = Path(path)
              if not path.exists():
                  return None

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def write_json(path, data):
              with Path(path).open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          def find_act_file(act_number):
              patterns = [
                  f"nox_act_{act_number}_*.json",
                  f"*act_{act_number}*.json",
                  f"*ACT{act_number}*.json",
                  f"*act{act_number}*.json",
              ]

              candidates = []

              for pattern in patterns:
                  candidates.extend(MEMORY.glob(pattern))

              unique = []
              seen = set()

              for path in candidates:
                  resolved = path.resolve()

                  if resolved in seen:
                      continue

                  seen.add(resolved)
                  unique.append(path)

              unique.sort(
                  key=lambda p: p.stat().st_mtime
                  if p.exists()
                  else 0,
                  reverse=True
              )

              return unique[0] if unique else None

          def numeric(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def now():
              return datetime.now(timezone.utc).isoformat()

          act40_path = find_act_file(40)
          act41_path = find_act_file(41)
          act42_path = find_act_file(42)

          act40 = load_json(act40_path) if act40_path else None
          act41 = load_json(act41_path) if act41_path else None
          act42 = load_json(act42_path) if act42_path else None

          sources = {
              "act40": bool(act40),
              "act41": bool(act41),
              "act42": bool(act42),
          }

          history = []

          if isinstance(act42, dict):
              raw_history = act42.get(
                  "empirical_history",
                  []
              )

              if isinstance(raw_history, list):
                  history = raw_history

          # Only observations explicitly present in ACT42 are accepted.
          # No generalization is created from predictions, selection
          # scores, confidence values or expectations alone.

          valid_observations = []

          for observation in history:
              if not isinstance(observation, dict):
                  continue

              outcome_state = observation.get(
                  "outcome_state"
              )

              observed_outcomes = numeric(
                  observation.get(
                      "observed_outcomes"
                  ),
                  0.0
              )

              comparable_outcomes = numeric(
                  observation.get(
                      "comparable_outcomes"
                  ),
                  0.0
              )

              if (
                  outcome_state
                  and outcome_state != "no_real_outcome_observed"
                  and observed_outcomes > 0
                  and comparable_outcomes > 0
              ):
                  valid_observations.append(observation)

          empirical_samples = len(valid_observations)

          # Group observations by action type and context only when
          # enough evidence actually exists. ACT43 deliberately uses
          # a conservative threshold to avoid turning one observation
          # into a general rule.

          grouped = {}

          for observation in valid_observations:
              action_type = observation.get(
                  "action_type"
              ) or "unknown"

              action_name = observation.get(
                  "action"
              ) or "unknown"

              key = (
                  action_type,
                  action_name
              )

              grouped.setdefault(
                  key,
                  []
              ).append(observation)

          generalization_candidates = []

          for key, observations in grouped.items():
              if len(observations) < 2:
                  continue

              effectiveness_values = []

              for observation in observations:
                  effectiveness = observation.get(
                      "action_effectiveness"
                  )

                  if isinstance(
                      effectiveness,
                      (int, float)
                  ):
                      effectiveness_values.append(
                          float(effectiveness)
                      )

              if not effectiveness_values:
                  continue

              average_effectiveness = (
                  sum(effectiveness_values)
                  / len(effectiveness_values)
              )

              generalization_candidates.append({
                  "action_type": key[0],
                  "action": key[1],
                  "sample_count": len(observations),
                  "average_effectiveness": round(
                      average_effectiveness,
                      2
                  ),
                  "evidence_basis": (
                      "multiple_observed_outcomes"
                  ),
              })

          if generalization_candidates:
              generalization_status = (
                  "validated_patterns_available"
              )
              generalization_allowed = True

              generalization_signal = (
                  "Multiple comparable empirical observations "
                  "support cautious generalization of observed "
                  "action patterns."
              )
          elif empirical_samples > 0:
              generalization_status = (
                  "insufficient_samples_for_generalization"
              )
              generalization_allowed = False

              generalization_signal = (
                  "Real empirical evidence exists, but there are "
                  "not enough comparable observations to establish "
                  "a reliable generalized pattern."
              )
          else:
              generalization_status = (
                  "awaiting_empirical_evidence"
              )
              generalization_allowed = False

              generalization_signal = (
                  "No real comparable outcomes are currently "
                  "available. NØX must not generalize from "
                  "selection scores, predictions or expectations."
              )

          current_confidence = 30.0

          if isinstance(act42, dict):
              confidence = act42.get(
                  "confidence_update",
                  {}
              )

              if isinstance(confidence, dict):
                  current_confidence = numeric(
                      confidence.get(
                          "new_confidence",
                          confidence.get(
                              "current_confidence",
                              current_confidence
                          )
                      ),
                      current_confidence
                  )

          # ACT43 does not automatically increase confidence.
          # Generalization quality and confidence calibration are
          # separate cognitive mechanisms.

          confidence_change = 0.0

          selected_action = None

          if isinstance(act41, dict):
              selected_action = act41.get(
                  "selected_action"
              )

          output = {
              "act": "ACT43",
              "version": "V1",
              "name": "Generalization of Empirical Learning",
              "timestamp": now(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "source_completeness": round(
                  (
                      sum(
                          1
                          for value in sources.values()
                          if value
                      )
                      / len(sources)
                  ) * 100,
                  2
              ),

              "sources": {
                  "act40": (
                      str(act40_path)
                      if act40_path
                      else None
                  ),
                  "act41": (
                      str(act41_path)
                      if act41_path
                      else None
                  ),
                  "act42": (
                      str(act42_path)
                      if act42_path
                      else None
                  ),
              },

              "starting_context": {
                  "selected_action": selected_action,
                  "empirical_samples": empirical_samples,
                  "source": "ACT42",
              },

              "generalization": {
                  "status": generalization_status,
                  "generalization_allowed": (
                      generalization_allowed
                  ),
                  "empirical_samples": empirical_samples,
                  "validated_patterns": len(
                      generalization_candidates
                  ),
                  "signal": generalization_signal,
              },

              "validated_patterns": (
                  generalization_candidates
              ),

              "generalization_rules": {
                  "minimum_samples_per_pattern": 2,
                  "rules": [
                      "Never generalize from a prediction alone.",
                      "Never generalize from an action-selection score.",
                      "Never generalize from a single outcome.",
                      "Only compare observations that are meaningfully comparable.",
                      "Keep context attached to every empirical pattern.",
                      "Separate repeated evidence from isolated events.",
                      "Preserve uncertainty when evidence is insufficient.",
                      "Do not treat correlation as guaranteed causation.",
                      "Do not generalize beyond the evidence available.",
                  ],
              },

              "context_awareness": {
                  "enabled": True,
                  "principle": (
                      "An action that works in one context "
                      "must not automatically be considered "
                      "effective in every context."
                  ),
                  "context_required_for_generalization": True,
              },

              "empirical_memory": {
                  "observations_used": (
                      valid_observations
                  ),
                  "observation_count": (
                      empirical_samples
                  ),
              },

              "decision_learning": {
                  "available": (
                      generalization_allowed
                  ),
                  "basis": (
                      "repeated_empirical_patterns"
                      if generalization_allowed
                      else (
                          "insufficient_empirical_evidence"
                          if empirical_samples > 0
                          else "evidence_gap"
                      )
                  ),
                  "future_use": (
                      "Use validated empirical patterns as "
                      "one evidence source when evaluating "
                      "future action candidates."
                  ),
              },

              "confidence_update": {
                  "status": (
                      "no_update"
                  ),
                  "current_confidence": (
                      current_confidence
                  ),
                  "confidence_change": (
                      confidence_change
                  ),
                  "new_confidence": (
                      current_confidence
                  ),
                  "increase_allowed": False,
                  "reason": (
                      "ACT43 identifies generalizable patterns "
                      "but does not independently recalibrate "
                      "confidence."
                  ),
              },

              "execution_state": {
                  "execution_permission": False,
                  "execution_authorization": False,
                  "action_execution": False,
                  "status": "learning_only",
              },

              "autonomy_state": {
                  "status": "learning_only",
                  "action_selection": True,
                  "action_outcome_evaluation": True,
                  "empirical_action_learning": True,
                  "empirical_generalization": True,
                  "action_execution": False,
                  "financial_actions": False,
                  "payments": False,
                  "spending": False,
                  "gemini": False,
              },

              "financial_boundary": {
                  "financial_permission": False,
                  "payment_permission": False,
                  "spending_permission": False,
                  "financial_limit": 0.0,
              },

              "cognitive_learning": {
                  "capability": (
                      "Determine whether empirical action "
                      "learning contains repeated patterns "
                      "that can cautiously apply beyond "
                      "the original observation."
                  ),
                  "current_state": (
                      generalization_status
                  ),
                  "what_nox_learned": (
                      "A useful result becomes more informative "
                      "when comparable results repeat in similar "
                      "contexts, but one observation is not enough "
                      "to establish a general rule."
                  ),
                  "future_use": (
                      "Use validated patterns to improve future "
                      "action evaluation while preserving "
                      "context and uncertainty."
                  ),
              },

              "generalization_limits": {
                  "single_observation_rule": (
                      "No generalization."
                  ),
                  "context_shift_rule": (
                      "Require additional evidence."
                  ),
                  "conflicting_results_rule": (
                      "Do not generalize until the conflict "
                      "is understood."
                  ),
                  "weak_evidence_rule": (
                      "Keep the pattern as a hypothesis, "
                      "not a rule."
                  ),
              },

              "next_action": (
                  "Accumulate additional comparable real "
                  "outcomes and test whether observed action "
                  "patterns remain stable across contexts."
              ),

              "next_cognitive_step": (
                  "ACT44 should detect when a previously "
                  "effective strategy stops being effective "
                  "or when empirical evidence becomes "
                  "inconsistent."
              ),

              "validation": {
                  "act40_present": bool(act40),
                  "act41_present": bool(act41),
                  "act42_present": bool(act42),
                  "empirical_history_read": True,
                  "only_real_observations_used": True,
                  "single_observation_not_generalized": (
                      all(
                          item.get("sample_count", 0) >= 2
                          for item in generalization_candidates
                      )
                  ),
                  "context_preserved": True,
                  "weak_evidence_not_overgeneralized": True,
                  "conflicting_evidence_not_hidden": True,
                  "prediction_not_treated_as_outcome": True,
                  "selection_score_not_treated_as_outcome": True,
                  "confidence_not_artificially_increased": (
                      confidence_change == 0.0
                  ),
                  "execution_not_authorized": True,
                  "financial_permission_false": True,
                  "payment_permission_false": True,
                  "spending_permission_false": True,
                  "gemini_false": (
                      os.environ.get(
                          "GEMINI_USED"
                      ) == "false"
                  ),
                  "cost_zero": (
                      numeric(
                          os.environ.get(
                              "PROJECT_COST_EUR"
                          ),
                          -1
                      ) == 0.0
                  ),
              },
          }

          write_json(
              OUTPUT,
              output
          )

          written = load_json(OUTPUT)

          assert written is not None
          assert written["act"] == "ACT43"
          assert written["version"] == "V1"
          assert written["gemini_used"] is False
          assert written["project_cost_eur"] == 0

          assert written["execution_state"][
              "execution_authorization"
          ] is False

          assert written["autonomy_state"][
              "action_execution"
          ] is False

          assert written["financial_boundary"][
              "financial_permission"
          ] is False

          assert written["financial_boundary"][
              "payment_permission"
          ] is False

          assert written["financial_boundary"][
              "spending_permission"
          ] is False

          assert written["confidence_update"][
              "confidence_change"
          ] == 0.0

          assert written["validation"][
              "only_real_observations_used"
          ] is True

          assert written["validation"][
              "prediction_not_treated_as_outcome"
          ] is True

          assert written["validation"][
              "selection_score_not_treated_as_outcome"
          ] is True

          print(
              json.dumps(
                  written,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print(
              f"\nACT43 output written to {OUTPUT}"
          )
          PY

      - name: Commit ACT43 memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_43_generalization_of_empirical_learning.json

          if git diff --cached --quiet; then
            echo "No ACT43 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT43 V1 generalization of empirical learning"

      - name: Push ACT43 safely
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT43 successfully pushed."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "ACT43 push failed after 3 attempts."
          exit 1
