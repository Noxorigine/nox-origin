name: NØX - Lab

# NØX Lab : Nox fait de vrais travaux et publie des résultats mesurés.
# 1) generate : l'IA (Groq) écrit des candidats pour une tâche d'algorithmique. Aucun code n'est exécuté ici.
# 2) execute  : les candidats tournent dans un bac à sable (sans réseau, utilisateur sans privilège, sans secret).
# 3) publish  : rapport chiffré, archivage dans lab/runs/, publication demandée à Presence.
# Gratuit : Groq gratuit + GitHub Actions. Aucun paiement, aucune dépense.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Tâche imposée : sort_ints, max_circular_subarray, split_csv_line, dedupe_keep_first, next_permutation, merge_intervals, count_pairs_sum (vide = rotation automatique)"
        required: false
        default: ""
      force_publish:
        description: "true = publier même si un rapport a déjà été publié il y a moins de 20 h"
        required: false
        default: "false"
  schedule:
    - cron: "23 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  RUNTIME_FILE: memory/nox_core_runtime.json
  LAB_STATE_FILE: memory/nox_lab.json
  LAB_COLONY: agent-economy
  LAB_CANDIDATES: "3"
  LAB_MIN_HOURS_BETWEEN_POSTS: "20"
  LAB_ENABLE_PUBLISH: "true"
  PROJECT_COST_EUR: "0"
  FREE_AI_ONLY: "true"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Write lab sources
        run: |
          mkdir -p lab_src
          cat > lab_src/lab_specs.py <<'LABPY_SPECS'
          """NØX Lab - task specifications, reference solutions, test corpora, planted failures.
          Corpus version: lab-v1. Everything here is deterministic (seeded)."""
          import itertools
          import random
          from collections import Counter

          VERSION = "lab-v1"


          def _tiny_lists(length, alphabet):
              for n in range(length + 1):
                  for combo in itertools.product(alphabet, repeat=n):
                      yield list(combo)


          # ---------------------------------------------------------------- sort_ints
          def ref_sort(xs):
              return sorted(xs)

          def tiny_sort():
              for xs in _tiny_lists(4, [-1, 0, 1, 2]):
                  yield (xs,)

          def rand_sort(rng):
              for _ in range(200):
                  yield ([rng.randint(-50, 50) for _ in range(rng.randint(0, 40))],)

          def held_sort(rng):
              yield ([],)
              yield ([5],)
              yield ([1000] * 50,)
              yield (list(range(300, 0, -1)),)
              yield ([2**62, -2**62, 0, 2**62, -1],)
              yield ([rng.randint(-10**9, 10**9) for _ in range(3000)],)
              yield ([0, 1] * 500,)
              yield ([-3, -3, -1, -2, -2, -2],)

          def weak_sort(args, out):
              return isinstance(out, list) and all(out[i] <= out[i + 1] for i in range(len(out) - 1))

          MUT_SORT = {
              "drops_duplicates": "def solve(xs):\n    return sorted(set(xs))\n",
              "drops_last_element": "def solve(xs):\n    return sorted(xs)[:-1]\n",
              "sorts_descending": "def solve(xs):\n    return sorted(xs, reverse=True)\n",
              "mutates_input": "def solve(xs):\n    xs.sort()\n    return xs\n",
              "sorts_by_absolute_value": "def solve(xs):\n    return sorted(xs, key=abs)\n",
          }

          # ----------------------------------------------------------- dedupe_keep_first
          def ref_dedupe(xs):
              seen = set()
              out = []
              for x in xs:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          def tiny_dedupe():
              for xs in _tiny_lists(5, [0, 1, 2]):
                  yield (xs,)

          def rand_dedupe(rng):
              for _ in range(200):
                  yield ([rng.randint(0, 10) for _ in range(rng.randint(0, 40))],)

          def held_dedupe(rng):
              yield ([],)
              yield ([7] * 100,)
              yield ([rng.randint(0, 50) for _ in range(3000)],)
              yield ([2**61, -5, 2**61, -5, 0],)
              yield (list(range(500)) + list(range(500)),)

          def weak_dedupe(args, out):
              return isinstance(out, list) and len(out) == len(set(out)) and set(out) <= set(args[0])

          MUT_DEDUPE = {
              "loses_original_order": "def solve(xs):\n    return sorted(set(xs))\n",
              "keeps_last_occurrence": "def solve(xs):\n    out = []\n    for i, x in enumerate(xs):\n        if x not in xs[i + 1:]:\n            out.append(x)\n    return out\n",
              "removes_every_repeated_value": "def solve(xs):\n    return [x for x in xs if xs.count(x) == 1]\n",
              "returns_input_unchanged": "def solve(xs):\n    return list(xs)\n",
          }

          # -------------------------------------------------------------- merge_intervals
          def ref_merge(iv):
              out = []
              for a, b in sorted([list(x) for x in iv]):
                  if out and a <= out[-1][1]:
                      out[-1][1] = max(out[-1][1], b)
                  else:
                      out.append([a, b])
              return out

          def tiny_merge():
              pool = [[a, b] for a in range(4) for b in range(a, 4)]
              for n in range(4):
                  for combo in itertools.product(pool, repeat=n):
                      yield ([list(x) for x in combo],)

          def rand_merge(rng):
              for _ in range(200):
                  items = []
                  for _ in range(rng.randint(0, 30)):
                      a = rng.randint(0, 100)
                      items.append([a, a + rng.randint(0, 15)])
                  yield (items,)

          def held_merge(rng):
              yield ([],)
              yield ([[1, 1]],)
              yield ([[1, 10], [2, 3], [4, 5]],)
              yield ([[2, 2]] * 20,)
              yield ([[-5, -1], [-2, 4], [4, 9]],)
              items = []
              for _ in range(1500):
                  a = rng.randint(0, 100000)
                  items.append([a, a + rng.randint(0, 30)])
              yield (items,)

          def weak_merge(args, out):
              try:
                  rows = [list(x) for x in out]
              except TypeError:
                  return False
              return all(len(r) == 2 and r[0] <= r[1] for r in rows) and all(rows[i][0] <= rows[i + 1][0] for i in range(len(rows) - 1))

          MUT_MERGE = {
              "touching_intervals_not_merged": "def solve(iv):\n    out = []\n    for a, b in sorted([list(x) for x in iv]):\n        if out and a < out[-1][1]:\n            out[-1][1] = max(out[-1][1], b)\n        else:\n            out.append([a, b])\n    return out\n",
              "no_sort_before_merge": "def solve(iv):\n    out = []\n    for a, b in [list(x) for x in iv]:\n        if out and a <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], b)\n        else:\n            out.append([a, b])\n    return out\n",
              "nested_interval_shrinks_end": "def solve(iv):\n    out = []\n    for a, b in sorted([list(x) for x in iv]):\n        if out and a <= out[-1][1]:\n            out[-1][1] = b\n        else:\n            out.append([a, b])\n    return out\n",
              "mutates_input": "def solve(iv):\n    iv.sort()\n    out = []\n    for a, b in iv:\n        if out and a <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], b)\n        else:\n            out.append([a, b])\n    return out\n",
          }

          # ------------------------------------------------------------- count_pairs_sum
          def ref_pairs(xs, k):
              seen = Counter()
              total = 0
              for x in xs:
                  total += seen[k - x]
                  seen[x] += 1
              return total

          def tiny_pairs():
              for xs in _tiny_lists(4, [0, 1, 2]):
                  for k in range(5):
                      yield (xs, k)

          def rand_pairs(rng):
              for _ in range(200):
                  yield ([rng.randint(0, 15) for _ in range(rng.randint(0, 40))], rng.randint(0, 30))

          def held_pairs(rng):
              yield ([], 0)
              yield ([0] * 3000, 0)
              yield ([5], 10)
              yield ([-2, 2, -2, 2, 0, 0], 0)
              yield ([rng.randint(0, 100) for _ in range(3000)], 100)

          def weak_pairs(args, out):
              n = len(args[0])
              return isinstance(out, int) and not isinstance(out, bool) and 0 <= out <= n * (n - 1) // 2

          MUT_PAIRS = {
              "counts_distinct_values_not_positions": "def solve(xs, k):\n    s = set(xs)\n    return sum(1 for x in s if k - x in s and x < k - x)\n",
              "counts_ordered_pairs_twice": "def solve(xs, k):\n    return 2 * sum(1 for i in range(len(xs)) for j in range(i + 1, len(xs)) if xs[i] + xs[j] == k)\n",
              "pairs_an_element_with_itself": "def solve(xs, k):\n    return sum(1 for i in range(len(xs)) for j in range(i, len(xs)) if xs[i] + xs[j] == k)\n",
              "ignores_duplicate_positions": "def solve(xs, k):\n    s = set(xs)\n    return sum(1 for x in s for y in s if x < y and x + y == k)\n",
          }

          # ------------------------------------------------------- max_circular_subarray
          def ref_circ(xs):
              best = cur = xs[0]
              worst = cur_min = xs[0]
              for x in xs[1:]:
                  cur = max(x, cur + x)
                  best = max(best, cur)
                  cur_min = min(x, cur_min + x)
                  worst = min(worst, cur_min)
              total = sum(xs)
              if best < 0:
                  return best
              return max(best, total - worst)

          def tiny_circ():
              for n in range(1, 6):
                  for combo in itertools.product([-2, -1, 0, 1, 2], repeat=n):
                      yield (list(combo),)

          def rand_circ(rng):
              for _ in range(200):
                  yield ([rng.randint(-20, 20) for _ in range(rng.randint(1, 30))],)

          def held_circ(rng):
              yield ([-5],)
              yield ([-3, -1, -2],)
              yield ([5, -3, 5],)
              yield ([8, -8, 9, -9, 10, -11, 12],)
              yield ([0, 0, 0],)
              yield ([rng.randint(-1000, 1000) for _ in range(2500)],)
              yield ([-1] * 1000,)

          def weak_circ(args, out):
              return isinstance(out, int) and not isinstance(out, bool) and out >= max(args[0])

          MUT_CIRC = {
              "ignores_wraparound": "def solve(xs):\n    best = cur = xs[0]\n    for x in xs[1:]:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best\n",
              "allows_empty_subarray_all_negative_gives_zero": "def solve(xs):\n    best = cur = 0\n    worst = cur_min = 0\n    for x in xs:\n        cur = max(0, cur + x)\n        best = max(best, cur)\n        cur_min = min(0, cur_min + x)\n        worst = min(worst, cur_min)\n    return max(best, sum(xs) - worst)\n",
              "total_minus_min_without_negative_guard": "def solve(xs):\n    best = cur = xs[0]\n    worst = cur_min = xs[0]\n    for x in xs[1:]:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n        cur_min = min(x, cur_min + x)\n        worst = min(worst, cur_min)\n    return max(best, sum(xs) - worst)\n",
              "mutates_input": "def solve(xs):\n    xs.sort()\n    return sum(x for x in xs if x > 0) if xs[-1] > 0 else xs[-1]\n",
          }

          # ------------------------------------------------------------- split_csv_line
          def ref_csv(line):
              fields, cur, i, quoted = [], [], 0, False
              n = len(line)
              while i < n:
                  ch = line[i]
                  if quoted:
                      if ch == '"':
                          if i + 1 < n and line[i + 1] == '"':
                              cur.append('"')
                              i += 1
                          else:
                              quoted = False
                      else:
                          cur.append(ch)
                  elif ch == '"':
                      quoted = True
                  elif ch == ",":
                      fields.append("".join(cur))
                      cur = []
                  else:
                      cur.append(ch)
                  i += 1
              fields.append("".join(cur))
              return fields

          def _serialize(fields):
              parts = []
              for f in fields:
                  if any(c in f for c in ',"'):
                      parts.append('"' + f.replace('"', '""') + '"')
                  else:
                      parts.append(f)
              return ",".join(parts)

          def tiny_csv():
              alphabet = ["a", ",", '"', " "]
              pool = [""] + [a + b for a in alphabet for b in [""] + alphabet]
              pool = list(dict.fromkeys(pool))
              for n in range(1, 3):
                  for combo in itertools.product(pool, repeat=n):
                      yield (_serialize(list(combo)),)

          def rand_csv(rng):
              alphabet = ["a", "b", ",", '"', " ", "x"]
              for _ in range(200):
                  fields = ["".join(rng.choice(alphabet) for _ in range(rng.randint(0, 6))) for _ in range(rng.randint(1, 5))]
                  yield (_serialize(fields),)

          def held_csv(rng):
              yield ("",)
              yield (",",)
              yield (",,,",)
              yield ('"",""',)
              yield ('"a,b","c""d",e',)
              yield ('" leading and trailing ", x ',)
              yield (",".join(["f%d" % i for i in range(2000)]),)
              yield ('"""",""""""',)

          def weak_csv(args, out):
              return isinstance(out, list) and all(isinstance(x, str) for x in out) and len(out) >= 1

          MUT_CSV = {
              "naive_split_on_commas": "def solve(line):\n    return line.split(',')\n",
              "keeps_doubled_quotes": "def solve(line):\n    out, cur, q = [], '', False\n    for ch in line:\n        if ch == '\"':\n            q = not q\n            cur += ch if False else ''\n        elif ch == ',' and not q:\n            out.append(cur)\n            cur = ''\n        else:\n            cur += ch\n    out.append(cur)\n    return out\n",
              "strips_whitespace_in_fields": "def solve(line):\n    out, cur, q, i = [], '', False, 0\n    while i < len(line):\n        ch = line[i]\n        if q:\n            if ch == '\"':\n                if i + 1 < len(line) and line[i + 1] == '\"':\n                    cur += '\"'\n                    i += 1\n                else:\n                    q = False\n            else:\n                cur += ch\n        elif ch == '\"':\n            q = True\n        elif ch == ',':\n            out.append(cur.strip())\n            cur = ''\n        else:\n            cur += ch\n        i += 1\n    out.append(cur.strip())\n    return out\n",
              "drops_trailing_empty_field": "def solve(line):\n    out, cur, q, i = [], '', False, 0\n    while i < len(line):\n        ch = line[i]\n        if q:\n            if ch == '\"':\n                if i + 1 < len(line) and line[i + 1] == '\"':\n                    cur += '\"'\n                    i += 1\n                else:\n                    q = False\n            else:\n                cur += ch\n        elif ch == '\"':\n            q = True\n        elif ch == ',':\n            out.append(cur)\n            cur = ''\n        else:\n            cur += ch\n        i += 1\n    if cur != '':\n        out.append(cur)\n    return out or ['']\n",
          }

          # ------------------------------------------------------------- next_permutation
          def ref_nextperm(xs):
              a = list(xs)
              i = len(a) - 2
              while i >= 0 and a[i] >= a[i + 1]:
                  i -= 1
              if i < 0:
                  return sorted(a)
              j = len(a) - 1
              while a[j] <= a[i]:
                  j -= 1
              a[i], a[j] = a[j], a[i]
              a[i + 1:] = reversed(a[i + 1:])
              return a

          def tiny_nextperm():
              for xs in _tiny_lists(5, [0, 1, 2]):
                  yield (xs,)

          def rand_nextperm(rng):
              for _ in range(200):
                  yield ([rng.randint(0, 6) for _ in range(rng.randint(0, 12))],)

          def held_nextperm(rng):
              yield ([],)
              yield ([3, 2, 1],)
              yield ([1, 1, 1],)
              yield ([1, 5, 1],)
              yield ([2, 3, 1, 3, 3],)
              yield (list(range(2000, 0, -1)),)
              yield ([1] + list(range(1000, 1, -1)),)

          def weak_nextperm(args, out):
              return isinstance(out, list) and Counter(out) == Counter(args[0])

          MUT_NEXTPERM = {
              "last_permutation_not_wrapped": "def solve(xs):\n    a = list(xs)\n    i = len(a) - 2\n    while i >= 0 and a[i] >= a[i + 1]:\n        i -= 1\n    if i < 0:\n        return a\n    j = len(a) - 1\n    while a[j] <= a[i]:\n        j -= 1\n    a[i], a[j] = a[j], a[i]\n    a[i + 1:] = reversed(a[i + 1:])\n    return a\n",
              "suffix_not_reversed": "def solve(xs):\n    a = list(xs)\n    i = len(a) - 2\n    while i >= 0 and a[i] >= a[i + 1]:\n        i -= 1\n    if i < 0:\n        return sorted(a)\n    j = len(a) - 1\n    while a[j] <= a[i]:\n        j -= 1\n    a[i], a[j] = a[j], a[i]\n    return a\n",
              "strict_comparison_breaks_duplicates": "def solve(xs):\n    a = list(xs)\n    i = len(a) - 2\n    while i >= 0 and a[i] > a[i + 1]:\n        i -= 1\n    if i < 0:\n        return sorted(a)\n    j = len(a) - 1\n    while a[j] <= a[i]:\n        j -= 1\n    a[i], a[j] = a[j], a[i]\n    a[i + 1:] = reversed(a[i + 1:])\n    return a\n",
              "mutates_input": "def solve(xs):\n    i = len(xs) - 2\n    while i >= 0 and xs[i] >= xs[i + 1]:\n        i -= 1\n    if i < 0:\n        xs.sort()\n        return xs\n    j = len(xs) - 1\n    while xs[j] <= xs[i]:\n        j -= 1\n    xs[i], xs[j] = xs[j], xs[i]\n    xs[i + 1:] = reversed(xs[i + 1:])\n    return xs\n",
          }

          SPECS = {
              "max_circular_subarray": {
                  "title": "the maximum circular subarray sum",
                  "signature": "solve(xs)",
                  "description": "solve(xs) takes a NON-EMPTY list of integers treated as circular (the last element is adjacent to the first) and returns the largest possible sum of a NON-EMPTY contiguous circular subarray (it may wrap around the end, and it may be the whole list). It must not modify xs.",
                  "forbidden": [],
                  "ref": ref_circ, "tiny": tiny_circ, "rand": rand_circ, "held": held_circ, "weak": weak_circ,
                  "mutants": MUT_CIRC, "weak_name": "lower-bound-only check",
                  "questions": ["Which input family do you expect LLM-written solutions to get wrong most often here?",
                                "Would you add a brute-force oracle for small circular inputs, or keep the linear reference?"],
              },
              "split_csv_line": {
                  "title": "parsing one CSV line with quoted fields",
                  "signature": "solve(line)",
                  "description": "solve(line) takes ONE valid CSV line (RFC 4180 style: fields separated by commas; a field may be wrapped in double quotes, in which case it may contain commas, and a doubled quote \"\" inside it means one literal quote) and returns the list of field strings with the quoting removed. Whitespace is part of the field and must be kept. An empty line gives [\"\"]; a trailing comma gives a trailing empty field. Do not import any module.",
                  "forbidden": [],
                  "ref": ref_csv, "tiny": tiny_csv, "rand": rand_csv, "held": held_csv, "weak": weak_csv,
                  "mutants": MUT_CSV, "weak_name": "type-only check",
                  "questions": ["Which malformed-input policy would you pick for a parser like this, and why?",
                                "What edge case would you add to the held-out set for quoted fields?"],
              },
              "next_permutation": {
                  "title": "computing the next lexicographic permutation",
                  "signature": "solve(xs)",
                  "description": "solve(xs) takes a list of integers (possibly empty, possibly with duplicates) and returns a NEW list: the next permutation of xs in lexicographic order, or the ascending sorted list if xs is already the last (largest) permutation. It must not modify xs.",
                  "forbidden": [],
                  "ref": ref_nextperm, "tiny": tiny_nextperm, "rand": rand_nextperm, "held": held_nextperm, "weak": weak_nextperm,
                  "mutants": MUT_NEXTPERM, "weak_name": "same-elements-only check",
                  "questions": ["Would you test this against a brute-force enumeration of permutations, and up to what size?",
                                "Which planted wrong implementation would you add to this suite?"],
              },
              "sort_ints": {
                  "title": "sorting a list of integers",
                  "signature": "solve(xs)",
                  "description": "solve(xs) takes a list of integers (possibly empty, negative, with duplicates) and returns a NEW list with the same elements in ascending order. It must not modify xs. Implement the sorting algorithm yourself: do not use sorted(), .sort(), or heapq.",
                  "forbidden": ["sorted", "sort"],
                  "ref": ref_sort, "tiny": tiny_sort, "rand": rand_sort, "held": held_sort, "weak": weak_sort,
                  "mutants": MUT_SORT, "weak_name": "order-only check",
                  "questions": ["Which planted wrong implementation would you add to make this suite harder to pass?",
                                "For sorting, is the multiset-preservation check enough, or would you also test stability on keyed records?"],
              },
              "dedupe_keep_first": {
                  "title": "removing duplicates while keeping first occurrences in order",
                  "signature": "solve(xs)",
                  "description": "solve(xs) takes a list of integers and returns a NEW list containing each distinct value once, in the order of its FIRST occurrence in xs. It must not modify xs.",
                  "forbidden": [],
                  "ref": ref_dedupe, "tiny": tiny_dedupe, "rand": rand_dedupe, "held": held_dedupe, "weak": weak_dedupe,
                  "mutants": MUT_DEDUPE, "weak_name": "uniqueness-only check",
                  "questions": ["What property would you check beyond uniqueness and order to catch subtler dedupe bugs?",
                                "Which planted wrong implementation would you add to this suite?"],
              },
              "merge_intervals": {
                  "title": "merging overlapping closed intervals",
                  "signature": "solve(iv)",
                  "description": "solve(iv) takes a list of closed integer intervals [a, b] with a <= b, in any order, and returns a NEW list of merged intervals sorted by start. Intervals that overlap OR touch (share an endpoint, e.g. [1,3] and [3,5]) must be merged into one. It must not modify iv.",
                  "forbidden": [],
                  "ref": ref_merge, "tiny": tiny_merge, "rand": rand_merge, "held": held_merge, "weak": weak_merge,
                  "mutants": MUT_MERGE, "weak_name": "sorted-and-well-formed check",
                  "questions": ["Which edge case would you add to the held-out set for interval merging?",
                                "Is a reference implementation enough as an oracle here, or would you add independent properties?"],
              },
              "count_pairs_sum": {
                  "title": "counting index pairs that sum to a target",
                  "signature": "solve(xs, k)",
                  "description": "solve(xs, k) takes a list of integers xs and an integer k and returns the number of index pairs (i, j) with i < j and xs[i] + xs[j] == k. Duplicate values count separately by position. It must not modify xs.",
                  "forbidden": [],
                  "ref": ref_pairs, "tiny": tiny_pairs, "rand": rand_pairs, "held": held_pairs, "weak": weak_pairs,
                  "mutants": MUT_PAIRS, "weak_name": "range-only check",
                  "questions": ["Would you test this with a brute-force oracle or with algebraic properties, and why?",
                                "Which planted wrong implementation would you add to this suite?"],
              },
          }
          SPEC_ORDER = ["sort_ints", "max_circular_subarray", "split_csv_line", "dedupe_keep_first", "next_permutation", "merge_intervals", "count_pairs_sum"]
          LABPY_SPECS
          cat > lab_src/lab_harness.py <<'LABPY_HARNESS'
          """NØX Lab harness. Runs untrusted candidate code in short-lived child processes.
          Modes:
            python3 -I lab_harness.py all <workdir>          -> JSON on stdout (orchestrator)
            python3 -I lab_harness.py child <spec> <file> <weak 0|1>  -> JSON on stdout (one candidate)
          The orchestrator must itself run inside a network-less, unprivileged sandbox."""
          import ast
          import builtins
          import copy
          import hashlib
          import json
          import os
          import random
          import signal
          import subprocess
          import sys

          HERE = os.path.dirname(os.path.abspath(__file__))
          sys.path.insert(0, HERE)
          import lab_specs  # noqa: E402

          BANNED_NAMES = {"eval", "exec", "compile", "open", "__import__", "input", "globals", "locals", "getattr",
                          "setattr", "delattr", "vars", "breakpoint", "exit", "quit", "help", "memoryview", "type", "object"}
          SAFE = ["abs", "all", "any", "bool", "dict", "enumerate", "filter", "float", "int", "isinstance", "len", "list",
                  "map", "max", "min", "pow", "range", "reversed", "set", "sorted", "str", "sum", "tuple", "zip", "divmod",
                  "ord", "chr", "next", "iter", "Exception", "ValueError", "IndexError", "KeyError", "TypeError", "ZeroDivisionError", "True", "False", "None", "round"]
          CALL_SECONDS = 3
          CHILD_SECONDS = 40


          def static_check(source, forbidden):
              try:
                  tree = ast.parse(source)
              except SyntaxError as exc:
                  return f"syntax_error:{exc.msg}"
              if len(source) > 6000:
                  return "too_long"
              found = False
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      return "import_not_allowed"
                  if isinstance(node, ast.Name) and (node.id in BANNED_NAMES or node.id in forbidden):
                      return f"forbidden_name:{node.id}"
                  if isinstance(node, ast.Attribute) and (node.attr.startswith("__") or node.attr in forbidden):
                      return f"forbidden_attribute:{node.attr}"
                  if isinstance(node, ast.FunctionDef) and node.name == "solve":
                      found = True
              return None if found else "no_solve_function"


          def short(value, n=110):
              text = repr(value)
              return text if len(text) <= n else text[: n - 3] + "..."


          class Timeout(Exception):
              pass


          def _alarm(signum, frame):
              raise Timeout()


          def run_layer(solve, spec, cases, weak):
              count = 0
              first = None
              for args in cases:
                  count += 1
                  if first is not None:
                      continue  # keep counting, but report only the first counterexample
                  original = copy.deepcopy(args)
                  working = copy.deepcopy(args)
                  try:
                      signal.setitimer(signal.ITIMER_REAL, CALL_SECONDS)
                      out = solve(*working)
                      signal.setitimer(signal.ITIMER_REAL, 0)
                  except Timeout:
                      first = {"input": short(original), "reason": "timeout"}
                      continue
                  except BaseException as exc:  # candidate code is untrusted
                      signal.setitimer(signal.ITIMER_REAL, 0)
                      first = {"input": short(original), "reason": f"exception:{type(exc).__name__}"}
                      continue
                  expected = spec["ref"](*copy.deepcopy(original))
                  if (not weak) and working != original:
                      first = {"input": short(original), "reason": "input_modified"}
                  elif weak:
                      if not spec["weak"](original, out):
                          first = {"input": short(original), "reason": "weak_check_failed"}
                  else:
                      try:
                          same = [list(x) for x in out] == expected if spec is lab_specs.SPECS["merge_intervals"] else out == expected
                      except TypeError:
                          same = False
                      if not same:
                          first = {"input": short(original), "expected": short(expected), "got": short(out), "reason": "wrong_output"}
              return {"passed": first is None, "cases": count, "first_failure": first}


          def child(spec_name, path, weak_only):
              spec = lab_specs.SPECS[spec_name]
              source = open(path, encoding="utf-8").read()
              is_mutant = os.path.basename(path).startswith("mutant_")
              problem = static_check(source, [] if is_mutant else spec["forbidden"])
              real_out = sys.stdout
              result = {"digest": hashlib.sha256(source.strip().encode()).hexdigest()[:12]}
              if problem:
                  result.update({"status": "rejected_static", "reason": problem})
                  real_out.write(json.dumps(result))
                  return
              try:
                  import resource
                  resource.setrlimit(resource.RLIMIT_CPU, (30, 30))
                  resource.setrlimit(resource.RLIMIT_AS, (768 * 1024 * 1024, 768 * 1024 * 1024))
                  resource.setrlimit(resource.RLIMIT_FSIZE, (0, 0))
                  resource.setrlimit(resource.RLIMIT_NPROC, (64, 64))
              except Exception:
                  pass
              sys.stdout = open(os.devnull, "w")
              sys.stderr = open(os.devnull, "w")
              safe = {name: getattr(builtins, name) for name in SAFE if hasattr(builtins, name)}
              safe["print"] = lambda *a, **k: None
              namespace = {"__builtins__": safe}
              signal.signal(signal.SIGALRM, _alarm)
              try:
                  signal.setitimer(signal.ITIMER_REAL, CALL_SECONDS)
                  exec(compile(source, "candidate", "exec"), namespace)  # noqa: S102 - sandboxed by the caller
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  solve = namespace["solve"]
              except BaseException as exc:
                  sys.stdout = real_out
                  result.update({"status": "error", "reason": f"load_failed:{type(exc).__name__}"})
                  real_out.write(json.dumps(result))
                  return
              rng = random.Random(20260101)
              layers = {}
              layers["L1_exhaustive_tiny"] = run_layer(solve, spec, spec["tiny"](), weak_only)
              layers["L2_seeded_random"] = run_layer(solve, spec, spec["rand"](rng), weak_only)
              layers["L3_heldout_adversarial"] = run_layer(solve, spec, spec["held"](random.Random(777)), weak_only)
              sys.stdout = real_out
              passed = all(layer["passed"] for layer in layers.values())
              result.update({"status": "passed_all" if passed else "failed", "layers": layers})
              real_out.write(json.dumps(result))


          def run_child(spec_name, path, weak):
              try:
                  proc = subprocess.run([sys.executable, "-I", os.path.abspath(__file__), "child", spec_name, path, "1" if weak else "0"],
                                        capture_output=True, text=True, timeout=CHILD_SECONDS, cwd=HERE, env={"PATH": "/usr/bin:/bin"})
              except subprocess.TimeoutExpired:
                  return {"status": "error", "reason": "child_timeout"}
              try:
                  return json.loads(proc.stdout)
              except Exception:
                  return {"status": "error", "reason": f"child_crash:{proc.returncode}"}


          def main_all(workdir):
              meta = json.load(open(os.path.join(workdir, "meta.json"), encoding="utf-8"))
              spec_name = meta["spec"]
              spec = lab_specs.SPECS[spec_name]
              out = {"spec": spec_name, "corpus_version": lab_specs.VERSION, "sandbox": os.environ.get("LAB_SANDBOX", "none"), "candidates": [], "mutants": []}
              for item in meta["candidates"]:
                  path = os.path.join(workdir, item["file"])
                  full = run_child(spec_name, path, False)
                  full["file"] = item["file"]
                  out["candidates"].append(full)
              for name, code in spec["mutants"].items():
                  path = os.path.join(workdir, f"mutant_{name}.py")
                  with open(path, "w", encoding="utf-8") as handle:
                      handle.write(code)
                  full = run_child(spec_name, path, False)
                  weak = run_child(spec_name, path, True)
                  out["mutants"].append({"name": name,
                                         "full_suite_rejects": full.get("status") == "failed",
                                         "weak_check_accepts": weak.get("status") == "passed_all"})
              sys.stdout.write(json.dumps(out))


          if __name__ == "__main__":
              if len(sys.argv) >= 3 and sys.argv[1] == "all":
                  main_all(sys.argv[2])
              elif len(sys.argv) >= 5 and sys.argv[1] == "child":
                  child(sys.argv[2], sys.argv[3], sys.argv[4] == "1")
          LABPY_HARNESS
          cat > lab_gen.py <<'LABPY_GEN'
          import json
          import os
          import re
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          sys.path.insert(0, "lab_src")
          import nox_ai  # noqa: E402

          # Garde-fou : une panne de l'assistant IA ne doit jamais bloquer le workflow.
          if not all(callable(getattr(nox_ai, _n, None)) for _n in ("available", "ask_ai", "usage")) or not hasattr(nox_ai, "MODELS"):
              print("WARNING: scripts/nox_ai.py is incomplete or invalid -> AI disabled.")
              class nox_ai:  # noqa: N801
                  MODELS = []
                  @staticmethod
                  def available(): return False
                  @staticmethod
                  def ask_ai(*args, **kwargs): return None
                  @staticmethod
                  def usage(): return {"calls": 0, "last_error": "module_incomplete"}

          import lab_harness  # noqa: E402
          import lab_specs  # noqa: E402

          for key, expected in {"PROJECT_COST_EUR": "0", "FREE_AI_ONLY": "true", "AUTO_PAYMENT": "false", "AUTO_SPENDING": "false"}.items():
              if os.environ.get(key, expected).strip().lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")

          N_CANDIDATES = int(os.environ.get("LAB_CANDIDATES", "3"))
          STATE_FILE = Path(os.environ.get("LAB_STATE_FILE", "memory/nox_lab.json"))
          OUT = Path("lab_out")
          OUT.mkdir(exist_ok=True)

          state = {}
          try:
              state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
          except Exception:
              state = {}
          override = os.environ.get("LAB_SPEC", "").strip()
          if override in lab_specs.SPECS:
              spec_name = override
          else:
              spec_name = lab_specs.SPEC_ORDER[int(state.get("next_spec", 0)) % len(lab_specs.SPEC_ORDER)]
          spec = lab_specs.SPECS[spec_name]
          now = datetime.now(timezone.utc)
          run_id = now.strftime("%Y%m%dT%H%M%SZ") + "-" + os.environ.get("GITHUB_RUN_NUMBER", "0")

          system = ("You are a careful Python programmer. Reply with ONE Python code block that defines the requested function "
                    "and nothing else: no imports, no input/output, no printing, no tests, no explanation. "
                    "Pure Python 3 using only built-in functions. Never modify the arguments you receive.")
          user = f"Task: {spec['description']}\nReturn only the code block defining {spec['signature']}."

          def extract_code(text):
              match = re.search(r"```(?:python|py)?\s*\n(.*?)```", text, re.S | re.I)
              code = match.group(1) if match else text
              return code.strip("\n") + "\n" if "def solve" in code else None

          candidates = []
          for i in range(1, N_CANDIDATES + 1):
              text = nox_ai.ask_ai(system, user, max_tokens=600, temperature=0.9)
              if not text:
                  print(f"Candidate {i}: no AI answer ({nox_ai.usage().get('last_error')})")
                  continue
              code = extract_code(text)
              if not code:
                  print(f"Candidate {i}: no solve() found in answer")
                  continue
              name = f"cand_{i}.py"
              (OUT / name).write_text(code, encoding="utf-8")
              verdict = lab_harness.static_check(code, spec["forbidden"])
              print(f"Candidate {i}: {len(code)} chars, static check: {verdict or 'ok'}, model={nox_ai.usage().get('last_model')}")
              candidates.append({"file": name, "model": nox_ai.usage().get("last_model")})

          meta = {"run_id": run_id, "spec": spec_name, "corpus_version": lab_specs.VERSION, "created_at": now.isoformat(),
                  "candidates": candidates, "ai_usage": nox_ai.usage()}
          (OUT / "meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          for name in ("lab_specs.py", "lab_harness.py"):
              shutil.copy(Path("lab_src") / name, OUT / name)
          print(f"Lab run {run_id}: spec={spec_name} candidates={len(candidates)}/{N_CANDIDATES}")
          LABPY_GEN

      - name: Generate candidates (AI only, nothing is executed here)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LAB_SPEC: ${{ github.event.inputs.spec }}
        run: python3 lab_gen.py

      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: lab-input
          path: lab_out/
          retention-days: 3

  execute:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: lab-input
          path: lab_in

      - name: Run candidates in a sandbox (no network, unprivileged, no secrets)
        run: |
          set -u
          rm -rf /tmp/labrun && mkdir -p /tmp/labrun
          cp -r lab_in/. /tmp/labrun/
          chmod -R a+rX /tmp/labrun
          chmod a+rwx /tmp/labrun
          mkdir -p lab_res
          SANDBOX=(sudo unshare -n setpriv --reuid=65534 --regid=65534 --clear-groups)
          # Refuse to run if the sandbox cannot be proven: network must be unreachable and user unprivileged.
          if ! "${SANDBOX[@]}" /usr/bin/python3 -I -c "
          import os, socket, sys
          if os.getuid() == 0:
              sys.exit(2)
          try:
              socket.create_connection(('1.1.1.1', 53), 3)
              sys.exit(1)
          except OSError:
              sys.exit(0)
          "; then
            echo "SANDBOX_UNAVAILABLE: candidates were NOT executed."
            echo '{"sandbox": "unavailable", "candidates": [], "mutants": []}' > lab_res/results.json
            exit 0
          fi
          echo "Sandbox confirmed: no network, unprivileged user."
          "${SANDBOX[@]}" env -i PATH=/usr/bin:/bin LAB_SANDBOX=network_isolated_unprivileged /usr/bin/python3 -I /tmp/labrun/lab_harness.py all /tmp/labrun > lab_res/results.json || echo "Harness exited with an error."
          python3 -c "import json; d=json.load(open('lab_res/results.json')); print('sandbox=', d.get('sandbox'), 'candidates=', len(d.get('candidates', [])), 'mutants=', len(d.get('mutants', [])))"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab_res/
          retention-days: 3

  publish:
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: lab-input
          path: lab_in

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: lab-results
          path: lab_res

      - name: Write report script
        run: |
          cat > lab_publish.py <<'LABPY_PUBLISH'
          import hashlib
          import json
          import os
          import re
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "lab_in")
          import lab_specs  # noqa: E402

          for key, expected in {"PROJECT_COST_EUR": "0", "FREE_AI_ONLY": "true", "AUTO_PAYMENT": "false", "AUTO_SPENDING": "false"}.items():
              if os.environ.get(key, expected).strip().lower() != expected:
                  raise SystemExit(f"SECURITY STOP: {key} must remain {expected}")

          NOW = datetime.now(timezone.utc)
          STATE_FILE = Path(os.environ["LAB_STATE_FILE"])
          RUNTIME_FILE = Path(os.environ["RUNTIME_FILE"])
          COLONY = os.environ.get("LAB_COLONY", "agent-economy")
          MIN_HOURS = float(os.environ.get("LAB_MIN_HOURS_BETWEEN_POSTS", "20"))
          FORCE = os.environ.get("LAB_FORCE_PUBLISH", "false").strip().lower() == "true"
          PUBLISH = os.environ.get("LAB_ENABLE_PUBLISH", "true").strip().lower() == "true"

          def load(path, default):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
                  return data if isinstance(data, type(default)) else default
              except Exception:
                  return default

          def hours_since(value):
              try:
                  return (NOW - datetime.fromisoformat(str(value).replace("Z", "+00:00"))).total_seconds() / 3600
              except Exception:
                  return None

          meta = load("lab_in/meta.json", {})
          results = load("lab_res/results.json", {})
          state = load(STATE_FILE, {})
          spec_name = meta.get("spec")
          spec = lab_specs.SPECS.get(spec_name)
          run_id = meta.get("run_id") or NOW.strftime("%Y%m%dT%H%M%SZ")
          if not spec or not results:
              print("Lab: missing spec or results; nothing to record.")
              raise SystemExit(0)

          sandbox_ok = results.get("sandbox") == "network_isolated_unprivileged"
          cands = results.get("candidates", [])
          evaluated = [c for c in cands if c.get("status") in ("passed_all", "failed")]
          passed = [c for c in cands if c.get("status") == "passed_all"]
          mutants = results.get("mutants", [])
          killed = [m for m in mutants if m.get("full_suite_rejects")]
          weak_ok = [m for m in mutants if m.get("weak_check_accepts")]
          print(f"Lab {run_id}: sandbox={results.get('sandbox')} candidates={len(cands)} evaluated={len(evaluated)} passed={len(passed)} mutants_killed={len(killed)}/{len(mutants)}")

          def describe(index, cand):
              digest = cand.get("digest") or "n/a"
              status = cand.get("status")
              if status == "passed_all":
                  return f"- Candidate {index} (sha256:{digest}): passed all three layers."
              if status == "rejected_static":
                  return f"- Candidate {index} (sha256:{digest}): rejected before running ({cand.get('reason')})."
              if status == "error":
                  return f"- Candidate {index} (sha256:{digest}): could not be evaluated ({cand.get('reason')})."
              layers = cand.get("layers", {})
              failed = [name for name, layer in layers.items() if not layer.get("passed")]
              first = next((layers[n].get("first_failure") for n in failed if layers[n].get("first_failure")), None) or {}
              text = f"- Candidate {index} (sha256:{digest}): failed {', '.join(n.split('_')[0] for n in failed)}"
              if first.get("reason") == "wrong_output":
                  text += f"; for input {first.get('input')} expected {first.get('expected')} but returned {first.get('got')}"
              elif first:
                  text += f"; input {first.get('input')} -> {first.get('reason')}"
              return text + "."

          lines = [describe(i, c) for i, c in enumerate(cands, 1)]
          layer_cases = {}
          for c in evaluated:
              for name, layer in c.get("layers", {}).items():
                  layer_cases[name] = layer.get("cases")
          n_total = len(meta.get("candidates", []))
          model = next((c.get("model") for c in meta.get("candidates", []) if c.get("model")), "a free hosted LLM")
          weak_names = ", ".join(m["name"].replace("_", " ") for m in weak_ok) or "none"
          weak_label = spec["weak_name"]

          title = f"Lab report: {len(passed)}/{n_total} LLM-written candidates for {spec['title']} passed a frozen test suite"
          question = spec["questions"][int(hashlib.sha256(run_id.encode()).hexdigest(), 16) % len(spec["questions"])]
          body = (
              f"NØX Lab report, run {run_id}, corpus {results.get('corpus_version')}.\n\n"
              f"Task: {spec['description']}\n\n"
              f"Method: {n_total} candidates were written by {model}, frozen by SHA-256 digest, screened statically (no imports, no I/O), "
              "then executed in a sandbox with no network, an unprivileged user and CPU/memory limits. Three layers were applied: "
              f"L1 exhaustive tiny inputs ({layer_cases.get('L1_exhaustive_tiny', '?')} cases) against a simple reference; "
              f"L2 seeded random cases ({layer_cases.get('L2_seeded_random', '?')}); "
              f"L3 held-out adversarial cases never shown to the generating model ({layer_cases.get('L3_heldout_adversarial', '?')}). "
              "Mutating the input counts as a failure.\n\n"
              "Results:\n" + "\n".join(lines) + "\n\n"
              f"Is the suite itself trustworthy? I planted {len(mutants)} known-wrong implementations. The full suite rejected {len(killed)}/{len(mutants)}. "
              f"The {weak_label} alone would have accepted {len(weak_ok)}/{len(mutants)} (accepted: {weak_names}).\n\n"
              "Limits: a finite passing suite does not prove a candidate correct. This is one small task, one model and a handful of samples, "
              "and the planted failures only cover the mistakes I thought of. Code, digests and results are stored in the NØX repository under lab/runs/" + run_id + ".\n\n"
              "Question for the community: " + question
          )
          body = re.sub(r"[ \t]+\n", "\n", body)[:4800]

          # Archive run files (code + results) for reproducibility.
          run_dir = Path("lab/runs") / run_id
          run_dir.mkdir(parents=True, exist_ok=True)
          for item in Path("lab_in").glob("cand_*.py"):
              shutil.copy(item, run_dir / item.name)
          for name in ("meta.json", "lab_specs.py", "lab_harness.py"):
              shutil.copy(Path("lab_in") / name, run_dir / name)
          shutil.copy("lab_res/results.json", run_dir / "results.json")
          (run_dir / "report.md").write_text(f"# {title}\n\n{body}\n", encoding="utf-8")
          runs_root = Path("lab/runs")
          old = sorted([p for p in runs_root.iterdir() if p.is_dir()])[:-40]
          for p in old:
              shutil.rmtree(p, ignore_errors=True)

          # Decide whether to queue a public report.
          last_hours = hours_since(state.get("last_published_at"))
          reasons = []
          if not PUBLISH: reasons.append("publishing_disabled")
          if not sandbox_ok: reasons.append("sandbox_not_confirmed")
          if len(evaluated) < 2: reasons.append("fewer_than_2_candidates_evaluated")
          if len(mutants) < 3 or len(killed) < len(mutants): reasons.append("suite_failed_validation")
          if last_hours is not None and last_hours < MIN_HOURS and not FORCE: reasons.append(f"last_report_{last_hours:.1f}h_ago")
          queued = False
          if not reasons:
              runtime = load(RUNTIME_FILE, {"pending_actions": []})
              pending = runtime.setdefault("pending_actions", [])
              action_id = "action-lab-" + hashlib.sha256(run_id.encode()).hexdigest()[:20]
              if not any(isinstance(a, dict) and a.get("action_id") == action_id for a in pending):
                  pending.append({"action_id": action_id, "kind": "publish", "source": "nox_lab", "title": title[:220], "body": body,
                                  "colony": COLONY, "reason": "Measured result from NØX Lab (sandboxed execution of generated code against a frozen test suite).",
                                  "created_at": NOW.isoformat()})
                  RUNTIME_FILE.write_text(json.dumps(runtime, ensure_ascii=False, indent=2), encoding="utf-8")
                  queued = True
                  state["last_published_at"] = NOW.isoformat()
              print(f"Lab report queued: {action_id}")
          else:
              print("Lab report NOT queued: " + ", ".join(reasons))

          state["version"] = 1
          state["next_spec"] = (lab_specs.SPEC_ORDER.index(spec_name) + 1) % len(lab_specs.SPEC_ORDER)
          runs = state.setdefault("runs", [])
          runs.append({"run_id": run_id, "spec": spec_name, "candidates": n_total, "evaluated": len(evaluated), "passed": len(passed),
                       "mutants_killed": len(killed), "mutants_total": len(mutants), "weak_accepted": len(weak_ok), "queued": queued,
                       "skipped": reasons})
          state["runs"] = runs[-60:]
          state["updated_at"] = NOW.isoformat()
          STATE_FILE.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")
          LABPY_PUBLISH

      - name: Build report and queue publication
        env:
          LAB_FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: python3 lab_publish.py

      - name: Commit lab state
        run: |
          rm -rf lab_in lab_res lab_publish.py lab_gen.py lab_src lab_out
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"
          git add memory/nox_lab.json memory/nox_core_runtime.json lab || true
          if git diff --cached --quiet; then
            echo "No lab change to commit."
            exit 0
          fi
          git commit -m "NØX: lab run"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts."
          exit 1
