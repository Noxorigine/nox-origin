name: NØX V97 — Deployment Result Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v97-deployment-result-learning
  cancel-in-progress: false

jobs:
  deployment-result-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V97
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          MEMORY = "memory"
          BASE_URL = "https://thecolony.ai/api/v1"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(name):
              path = os.path.join(MEMORY, name)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(name, data):
              os.makedirs(MEMORY, exist_ok=True)
              with open(
                  os.path.join(MEMORY, name),
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def request_json(path, method="GET", token=None):
              url = BASE_URL + path

              headers = {
                  "Accept": "application/json"
              }

              if token:
                  headers["Authorization"] = (
                      "Bearer " + token
                  )

              data = None

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw)
              except Exception as exc:
                  return {
                      "_error": str(exc),
                      "_path": path
                  }

          def authenticate():
              api_key = os.environ.get(
                  "COLONY_API_KEY",
                  ""
              )

              if not api_key:
                  return ""

              payload = json.dumps(
                  {"api_key": api_key}
              ).encode("utf-8")

              req = urllib.request.Request(
                  BASE_URL + "/auth/token",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      raw = response.read().decode("utf-8")
                      data = json.loads(raw)
                      return text(
                          data.get("access_token")
                      )
              except Exception:
                  return ""

          # ---------------------------------------------------------
          # LOAD V96 DEPLOYMENT
          # ---------------------------------------------------------

          v96 = load(
              "nox_v96_controlled_correction_deployment.json"
          )

          v90 = load(
              "nox_v90_autonomous_decision_framework.json"
          )

          v95 = load(
              "nox_v95_controlled_correction_arbitration.json"
          )

          v94 = load(
              "nox_v94_controlled_live_comparison.json"
          )

          v93 = load(
              "nox_v93_autonomous_self_correction_validation.json"
          )

          active_policy = load(
              "nox_v96_controlled_correction_config.json"
          )

          # ---------------------------------------------------------
          # DEPLOYMENT STATE
          # ---------------------------------------------------------

          deployment = v96.get(
              "deployment",
              {}
          )

          if not isinstance(deployment, dict):
              deployment = {}

          deployment_status = text(
              deployment.get("status")
          )

          gate_open = bool(
              deployment.get("gate_open", False)
          )

          correction = v96.get(
              "correction",
              {}
          )

          if not isinstance(correction, dict):
              correction = {}

          correction_id = text(
              correction.get("id")
          )

          # ---------------------------------------------------------
          # IF V96 DID NOT ACTIVATE, RECORD THAT FACT
          # ---------------------------------------------------------

          if not gate_open:
              result = {
                  "version": "V97",
                  "generated_at": now(),
                  "mode": "deployment_result_learning",

                  "answer_status": (
                      "NO_ACTIVE_V96_CORRECTION"
                  ),

                  "deployment": {
                      "v96_status": deployment_status,
                      "gate_open": False,
                      "correction_id": correction_id
                  },

                  "measurement": {
                      "live_measurement": False,
                      "reason": (
                          "V96 did not activate a controlled "
                          "correction, so no deployment effect "
                          "can be measured."
                      )
                  },

                  "next_stage": {
                      "version": "V97_REQUIRES_ACTIVE_DEPLOYMENT",
                      "purpose": (
                          "Run V97 after a valid V96 controlled "
                          "correction is active."
                      )
                  },

                  "safety": {
                      "external_action": False,
                      "contact": False,
                      "bidding": False,
                      "payment": False,
                      "rule_change": False,
                      "gemini_disabled": True,
                      "zero_cost_constraint": True
                  }
              }

              save(
                  "nox_v97_deployment_result_learning.json",
                  result
              )

              with open(
                  os.path.join(
                      MEMORY,
                      "nox_v97_deployment_result_learning.md"
                  ),
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "# NØX V97 — Deployment Result Learning\n\n"
                      "V96 did not activate a controlled correction.\n\n"
                      "No live deployment effect was measured.\n\n"
                      "Next: run V97 after a valid V96 activation."
                  )

              print(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise SystemExit(0)

          # ---------------------------------------------------------
          # AUTHENTICATE
          # ---------------------------------------------------------

          token = authenticate()

          if not token:
              result = {
                  "version": "V97",
                  "generated_at": now(),
                  "mode": "deployment_result_learning",
                  "answer_status": (
                      "LIVE_SOURCE_AUTHENTICATION_FAILED"
                  ),
                  "deployment": {
                      "v96_status": deployment_status,
                      "gate_open": True,
                      "correction_id": correction_id
                  },
                  "measurement": {
                      "live_measurement": False,
                      "reason": (
                          "The Colony authentication failed."
                      )
                  },
                  "safety": {
                      "external_action": False,
                      "contact": False,
                      "bidding": False,
                      "payment": False,
                      "rule_change": False,
                      "gemini_disabled": True,
                      "zero_cost_constraint": True
                  }
              }

              save(
                  "nox_v97_deployment_result_learning.json",
                  result
              )

              raise SystemExit(0)

          # ---------------------------------------------------------
          # VERIFY IDENTITY
          # ---------------------------------------------------------

          me = request_json(
              "/users/me",
              token=token
          )

          agent_id = text(
              me.get("id")
          )

          agent_username = text(
              me.get("username")
          )

          # ---------------------------------------------------------
          # FETCH SMALL LIVE SAMPLES
          # ---------------------------------------------------------

          feed = request_json(
              "/feed/for-you?limit=7",
              token=token
          )

          suggestions = request_json(
              "/suggestions?limit=10",
              token=token
          )

          posts = request_json(
              "/posts?limit=10",
              token=token
          )

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "posts",
                      "items",
                      "data",
                      "results",
                      "suggestions"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          raw_items = (
              extract_items(feed)
              + extract_items(suggestions)
              + extract_items(posts)
          )

          # ---------------------------------------------------------
          # DEDUPLICATE
          # ---------------------------------------------------------

          unique = {}
          for item in raw_items:
              if not isinstance(item, dict):
                  continue

              item_id = text(
                  item.get("id")
                  or item.get("post_id")
              )

              if not item_id:
                  continue

              unique[item_id] = item

          candidates = list(
              unique.values()
          )

          # ---------------------------------------------------------
          # SIGNAL EXTRACTION
          # ---------------------------------------------------------

          def get_author(item):
              author = item.get("author")

              if isinstance(author, dict):
                  return (
                      text(author.get("id")),
                      text(author.get("username")),
                      text(author.get("display_name"))
                  )

              return (
                  text(item.get("author_id")),
                  text(item.get("author_username")),
                  text(item.get("author_name"))
              )

          def signal_score(item):
              body = text(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
              ).lower()

              title = text(
                  item.get("title")
              ).lower()

              combined = (
                  title
                  + " "
                  + body
              )

              post_type = text(
                  item.get("post_type")
              ).lower()

              request_signal = any(
                  x in combined
                  for x in (
                      "i need",
                      "we need",
                      "looking for",
                      "need someone",
                      "seeking",
                      "wanted",
                      "hire",
                      "hiring",
                      "task for",
                      "can someone"
                  )
              )

              delegation_signal = any(
                  x in combined
                  for x in (
                      "please build",
                      "please fix",
                      "please create",
                      "please research",
                      "please audit",
                      "someone to build",
                      "someone to fix",
                      "someone to create",
                      "someone to research"
                  )
              )

              deliverable_signal = any(
                  x in combined
                  for x in (
                      "deliverable",
                      "output",
                      "submit",
                      "provide",
                      "send me",
                      "return",
                      "produce"
                  )
              )

              acceptance_signal = any(
                  x in combined
                  for x in (
                      "acceptance criteria",
                      "must include",
                      "requirements",
                      "criteria",
                      "definition of done",
                      "done when"
                  )
              )

              reward_signal = any(
                  x in combined
                  for x in (
                      "reward",
                      "paid",
                      "payment",
                      "pay",
                      "bounty",
                      "tip",
                      "compensation",
                      "usdc",
                      "sats"
                  )
              )

              completion_signal = any(
                  x in combined
                  for x in (
                      "completed",
                      "finished",
                      "done",
                      "delivered",
                      "paid out",
                      "settled",
                      "successfully completed"
                  )
              )

              analysis_signal = (
                  post_type in (
                      "analysis",
                      "finding"
                  )
                  and not request_signal
                  and not delegation_signal
              )

              atypical_signal = (
                  reward_signal
                  and deliverable_signal
                  and not request_signal
                  and not delegation_signal
              )

              score = 0

              if request_signal:
                  score += 30

              if delegation_signal:
                  score += 20

              if deliverable_signal:
                  score += 15

              if acceptance_signal:
                  score += 15

              if reward_signal:
                  score += 10

              if completion_signal:
                  score -= 35

              if analysis_signal:
                  score -= 20

              if request_signal and delegation_signal:
                  score += 5

              if acceptance_signal and deliverable_signal:
                  score += 5

              return {
                  "request": request_signal,
                  "delegation": delegation_signal,
                  "deliverable": deliverable_signal,
                  "acceptance": acceptance_signal,
                  "reward": reward_signal,
                  "completion": completion_signal,
                  "analysis_only": analysis_signal,
                  "atypical": atypical_signal,
                  "score": score
              }

          # ---------------------------------------------------------
          # APPLY BASELINE AND CONTROLLED POLICY
          # ---------------------------------------------------------

          measurements = []

          for item in candidates:

              author_id, author_username, author_name = (
                  get_author(item)
              )

              if (
                  author_id == agent_id
                  or author_username == agent_username
                  or author_username == "nox_origine"
                  or author_name == "NØX Origin"
              ):
                  continue

              signals = signal_score(item)

              baseline_score = signals["score"]

              baseline_class = (
                  "HIGH_CONFIDENCE_OPPORTUNITY"
                  if (
                      signals["request"]
                      and signals["delegation"]
                      and signals["deliverable"]
                      and signals["acceptance"]
                  )
                  else
                  "STRONG_OPPORTUNITY_CANDIDATE"
                  if (
                      signals["request"]
                      and signals["delegation"]
                  )
                  else
                  "CONTEXTUAL_OPPORTUNITY"
                  if (
                      signals["request"]
                      or signals["delegation"]
                  )
                  else
                  "ATYPICAL_SIGNAL"
                  if (
                      signals["atypical"]
                  )
                  else
                  "EXCLUDE_COMPLETED"
                  if (
                      signals["completion"]
                  )
                  else
                  "LOW_PRIORITY_SIGNAL"
              )

              controlled_score = baseline_score
              policy_effect = 0
              policy_reason = "NO_POLICY_EFFECT"

              # -----------------------------------------------------
              # CONTROLLED POLICY EFFECT
              # -----------------------------------------------------

              if correction_id == (
                  "CORR_A_EVIDENCE_CONVERGENCE"
              ):
                  if (
                      signals["request"]
                      and signals["delegation"]
                  ):
                      policy_effect += 10
                      policy_reason = (
                          "Converging request and delegation "
                          "signals strengthened."
                      )

                  if (
                      signals["deliverable"]
                      and signals["acceptance"]
                  ):
                      policy_effect += 10
                      policy_reason = (
                          "Converging deliverable and acceptance "
                          "evidence strengthened."
                      )

              elif correction_id == (
                  "CORR_B_ATYPICAL_RECOVERY"
              ):
                  if signals["atypical"]:
                      policy_effect += 15
                      policy_reason = (
                          "Atypical opportunity signal preserved."
                      )

              elif correction_id == (
                  "CORR_C_ACCEPTANCE_PRIORITY"
              ):
                  if signals["acceptance"]:
                      policy_effect += 15
                      policy_reason = (
                          "Acceptance evidence receives higher weight."
                      )

                  if (
                      signals["request"]
                      and signals["delegation"]
                      and not signals["acceptance"]
                  ):
                      policy_effect -= 5
                      policy_reason = (
                          "Open request lacks acceptance evidence."
                      )

              elif correction_id == (
                  "CORR_D_COMPLETION_EXCLUSION"
              ):
                  if signals["completion"]:
                      policy_effect -= 25
                      policy_reason = (
                          "Completion evidence strengthens exclusion."
                      )

                  if (
                      signals["reward"]
                      and not signals["completion"]
                  ):
                      policy_effect -= 5
                      policy_reason = (
                          "Payment language is not treated as "
                          "settlement proof."
                      )

              elif correction_id == (
                  "CORR_E_HISTORY_AS_MODIFIER"
              ):
                  policy_effect = 0
                  policy_reason = (
                      "Historical learning remains a modifier "
                      "and does not override current evidence."
                  )

              controlled_score += policy_effect

              if signals["completion"]:
                  controlled_class = (
                      "EXCLUDE_COMPLETED"
                  )
              elif (
                  signals["request"]
                  and signals["delegation"]
                  and signals["deliverable"]
                  and signals["acceptance"]
                  and controlled_score >= 75
              ):
                  controlled_class = (
                      "HIGH_CONFIDENCE_OPPORTUNITY"
                  )
              elif (
                  signals["request"]
                  and signals["delegation"]
                  and controlled_score >= 55
              ):
                  controlled_class = (
                      "STRONG_OPPORTUNITY_CANDIDATE"
                  )
              elif (
                  signals["request"]
                  or signals["delegation"]
              ):
                  controlled_class = (
                      "CONTEXTUAL_OPPORTUNITY"
                  )
              elif signals["atypical"]:
                  controlled_class = (
                      "ATYPICAL_SIGNAL"
                  )
              else:
                  controlled_class = (
                      "LOW_PRIORITY_SIGNAL"
                  )

              changed = (
                  baseline_class != controlled_class
                  or baseline_score != controlled_score
              )

              useful_change = (
                  changed
                  and (
                      (
                          controlled_class
                          == "HIGH_CONFIDENCE_OPPORTUNITY"
                          and baseline_class
                          != "HIGH_CONFIDENCE_OPPORTUNITY"
                      )
                      or (
                          controlled_class
                          == "STRONG_OPPORTUNITY_CANDIDATE"
                          and baseline_class
                          in (
                              "CONTEXTUAL_OPPORTUNITY",
                              "ATYPICAL_SIGNAL"
                          )
                      )
                      or (
                          controlled_class
                          == "ATYPICAL_SIGNAL"
                          and baseline_class
                          == "LOW_PRIORITY_SIGNAL"
                      )
                      or (
                          controlled_class
                          == "EXCLUDE_COMPLETED"
                          and baseline_class
                          != "EXCLUDE_COMPLETED"
                          and signals["completion"]
                      )
                  )
              )

              harmful_change = (
                  changed
                  and (
                      (
                          baseline_class
                          == "HIGH_CONFIDENCE_OPPORTUNITY"
                          and controlled_class
                          in (
                              "LOW_PRIORITY_SIGNAL",
                              "EXCLUDE_COMPLETED"
                          )
                          and not signals["completion"]
                      )
                      or (
                          controlled_class
                          == "HIGH_CONFIDENCE_OPPORTUNITY"
                          and (
                              signals["completion"]
                              or signals["analysis_only"]
                          )
                      )
                  )
              )

              measurements.append({
                  "post_id": text(
                      item.get("id")
                      or item.get("post_id")
                  ),
                  "title": text(
                      item.get("title")
                  ),
                  "author": author_username or author_name,
                  "signals": signals,
                  "baseline": {
                      "score": baseline_score,
                      "class": baseline_class
                  },
                  "controlled": {
                      "score": controlled_score,
                      "class": controlled_class,
                      "policy_effect": policy_effect,
                      "policy_reason": policy_reason
                  },
                  "changed": changed,
                  "useful_change": useful_change,
                  "harmful_change": harmful_change
              })

          # ---------------------------------------------------------
          # AGGREGATE METRICS
          # ---------------------------------------------------------

          total = len(measurements)

          changed_count = sum(
              1 for x in measurements
              if x["changed"]
          )

          useful_changes = sum(
              1 for x in measurements
              if x["useful_change"]
          )

          harmful_changes = sum(
              1 for x in measurements
              if x["harmful_change"]
          )

          baseline_high = sum(
              1 for x in measurements
              if x["baseline"]["class"]
              == "HIGH_CONFIDENCE_OPPORTUNITY"
          )

          controlled_high = sum(
              1 for x in measurements
              if x["controlled"]["class"]
              == "HIGH_CONFIDENCE_OPPORTUNITY"
          )

          baseline_atypical = sum(
              1 for x in measurements
              if x["baseline"]["class"]
              == "ATYPICAL_SIGNAL"
          )

          controlled_atypical = sum(
              1 for x in measurements
              if x["controlled"]["class"]
              == "ATYPICAL_SIGNAL"
          )

          baseline_completed = sum(
              1 for x in measurements
              if x["baseline"]["class"]
              == "EXCLUDE_COMPLETED"
          )

          controlled_completed = sum(
              1 for x in measurements
              if x["controlled"]["class"]
              == "EXCLUDE_COMPLETED"
          )

          if total == 0:
              live_status = (
                  "INSUFFICIENT_LIVE_EVIDENCE"
              )
              confidence = 0.25

          elif harmful_changes > 0:
              live_status = (
                  "CONTROLLED_CORRECTION_REGRESSION_SIGNAL"
              )
              confidence = 0.85

          elif useful_changes > 0:
              live_status = (
                  "CONTROLLED_CORRECTION_USEFUL_SIGNAL"
              )
              confidence = min(
                  0.90,
                  0.55
                  + useful_changes / max(total, 1) * 0.35
              )

          else:
              live_status = (
                  "CONTROLLED_CORRECTION_NEUTRAL"
              )
              confidence = 0.55

          # ---------------------------------------------------------
          # OVER-PRUNING / UNDER-PRUNING
          # ---------------------------------------------------------

          low_priority = sum(
              1 for x in measurements
              if x["controlled"]["class"]
              == "LOW_PRIORITY_SIGNAL"
          )

          completed_present = sum(
              1 for x in measurements
              if x["signals"]["completion"]
          )

          over_pruning_signal = (
              total >= 5
              and low_priority / total >= 0.85
          )

          under_pruning_signal = (
              completed_present > 0
              and controlled_completed
              < completed_present
          )

          # ---------------------------------------------------------
          # DEPLOYMENT HEALTH
          # ---------------------------------------------------------

          if harmful_changes > 0:
              deployment_health = (
                  "REGRESSION_RISK"
              )
          elif useful_changes > 0:
              deployment_health = (
                  "USEFUL_LIVE_SIGNAL"
              )
          elif over_pruning_signal:
              deployment_health = (
                  "POSSIBLE_OVER_PRUNING"
              )
          elif under_pruning_signal:
              deployment_health = (
                  "POSSIBLE_UNDER_PRUNING"
              )
          else:
              deployment_health = (
                  "STABLE_NO_HARMFUL_EFFECT"
              )

          # ---------------------------------------------------------
          # NEXT DECISION
          # ---------------------------------------------------------

          if harmful_changes > 0:
              next_action = (
                  "ROLLBACK_OR_REFINE"
              )
              next_version = (
                  "V98_AUTONOMOUS_CORRECTION_ARBITRATION"
              )

          elif useful_changes > 0:
              next_action = (
                  "CONTINUE_CONTROLLED_OBSERVATION"
              )
              next_version = (
                  "V98_AUTONOMOUS_CORRECTION_ARBITRATION"
              )

          elif total == 0:
              next_action = (
                  "COLLECT_MORE_LIVE_EVIDENCE"
              )
              next_version = (
                  "V98_MORE_EVIDENCE"
              )

          else:
              next_action = (
                  "MAINTAIN_AND_OBSERVE"
              )
              next_version = (
                  "V98_AUTONOMOUS_CORRECTION_ARBITRATION"
              )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V97",
              "generated_at": now(),
              "mode": "deployment_result_learning",

              "agent": {
                  "id": agent_id,
                  "username": agent_username
              },

              "deployment": {
                  "v96_status": deployment_status,
                  "correction_id": correction_id,
                  "active_policy_version": text(
                      active_policy.get("version")
                  ),
                  "controlled_layer_active": bool(
                      active_policy.get("active", False)
                  )
              },

              "live_sources": {
                  "for_you_items": len(
                      extract_items(feed)
                  ),
                  "suggestion_items": len(
                      extract_items(suggestions)
                  ),
                  "public_posts": len(
                      extract_items(posts)
                  ),
                  "deduplicated_candidates": total
              },

              "measurement": {
                  "live_measurement": True,
                  "total_measured": total,
                  "decisions_changed": changed_count,
                  "useful_changes": useful_changes,
                  "harmful_changes": harmful_changes,
                  "baseline_high_confidence": baseline_high,
                  "controlled_high_confidence": controlled_high,
                  "baseline_atypical": baseline_atypical,
                  "controlled_atypical": controlled_atypical,
                  "baseline_completed_excluded": (
                      baseline_completed
                  ),
                  "controlled_completed_excluded": (
                      controlled_completed
                  )
              },

              "signals": {
                  "over_pruning": over_pruning_signal,
                  "under_pruning": under_pruning_signal,
                  "deployment_health": deployment_health
              },

              "validation_chain": {
                  "v93": text(
                      v93.get("answer_status")
                      or v93.get("status")
                  ),
                  "v94": text(
                      v94.get("answer_status")
                      or v94.get("status")
                  ),
                  "v95": text(
                      v95.get("answer_status")
                      or v95.get("status")
                  ),
                  "v90_baseline_available": bool(v90)
              },

              "live_validation": {
                  "status": live_status,
                  "confidence": confidence
              },

              "decision": {
                  "next_action": next_action,
                  "next_version": next_version
              },

              "sample": measurements,

              "autonomy": {
                  "autonomous_measurement": True,
                  "autonomous_error_detection": True,
                  "autonomous_effect_evaluation": True,
                  "autonomous_rollback_recommendation": (
                      harmful_changes > 0
                  ),
                  "automatic_rollback": False,
                  "automatic_external_action": False,
                  "human_override": True
              },

              "safety": {
                  "gemini_disabled": True,
                  "external_action": False,
                  "contact": False,
                  "bidding": False,
                  "payment": False,
                  "production_rule_overwrite": False,
                  "permanent_self_modification": False,
                  "controlled_policy_only": True,
                  "rollback_available": True,
                  "zero_cost_constraint": True
              },

              "answer_status": live_status
          }

          # ---------------------------------------------------------
          # SAVE JSON
          # ---------------------------------------------------------

          save(
              "nox_v97_deployment_result_learning.json",
              result
          )

          # ---------------------------------------------------------
          # SAVE MARKDOWN
          # ---------------------------------------------------------

          lines = [
              "# NØX V97 — Deployment Result Learning",
              "",
              "Generated: " + result["generated_at"],
              "",
              "## Deployment",
              "",
              "- V96 status: " + deployment_status,
              "- Correction: " + correction_id,
              "- Active policy: "
              + text(active_policy.get("version")),
              "",
              "## Live measurement",
              "",
              "- Candidates measured: " + str(total),
              "- Decisions changed: " + str(changed_count),
              "- Useful changes: " + str(useful_changes),
              "- Harmful changes: " + str(harmful_changes),
              "- Baseline high-confidence: "
              + str(baseline_high),
              "- Controlled high-confidence: "
              + str(controlled_high),
              "- Baseline atypical: "
              + str(baseline_atypical),
              "- Controlled atypical: "
              + str(controlled_atypical),
              "- Baseline completed excluded: "
              + str(baseline_completed),
              "- Controlled completed excluded: "
              + str(controlled_completed),
              "",
              "## Deployment health",
              "",
              "- Status: " + deployment_health,
              "- Over-pruning: "
              + str(over_pruning_signal),
              "- Under-pruning: "
              + str(under_pruning_signal),
              "",
              "## Live validation",
              "",
              "- Status: " + live_status,
              "- Confidence: " + str(confidence),
              "",
              "## Next decision",
              "",
              "- Action: " + next_action,
              "- Next version: " + next_version,
              "",
              "V97 measures the real effect of the V96 "
              "controlled correction.",
              "",
              "A useful signal does not automatically become "
              "a permanent rule.",
              "A harmful signal creates a rollback/refinement "
              "recommendation.",
              "",
              "## Safety",
              "",
              "- Gemini: disabled",
              "- External action: disabled",
              "- Contact: disabled",
              "- Bidding: disabled",
              "- Payment: disabled",
              "- Permanent self-modification: false",
              "- Rollback available: true",
              "- Project cost: €0",
              "- Human override: enabled"
          ]

          with open(
              os.path.join(
                  MEMORY,
                  "nox_v97_deployment_result_learning.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(lines))

          print(
              json.dumps(
                  {
                      "version": "V97",
                      "status": live_status,
                      "confidence": confidence,
                      "measured": total,
                      "changed": changed_count,
                      "useful_changes": useful_changes,
                      "harmful_changes": harmful_changes,
                      "deployment_health": deployment_health,
                      "next_action": next_action,
                      "next_version": next_version
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V97 memory
        run: |
