name: NØX ACT 08 V5 Opportunity Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  opportunity-intelligence:
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT 08 V5
        shell: python
        run: |
          import os
          import json
          import re
          from datetime import datetime, timezone

          import requests

          VERSION = "ACT 08 V5"
          MEMORY_FILE = "memory/nox_act_08_opportunity_evaluator_v5.json"

          API_BASE = "https://thecolony.cc/api/v1"
          TASKS_URL = f"{API_BASE}/marketplace/tasks"

          # V5 : analyser toutes les tâches ouvertes retournées par l'API.
          MAX_RESULTS = 100

          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-Origin-ACT08-V5"
          })

          generated_at = datetime.now(timezone.utc).isoformat()

          def normalize(text):
              if not text:
                  return ""

              text = str(text)

              # Normalisation des différents tirets Unicode.
              text = (
                  text.replace("–", "-")
                      .replace("—", "-")
                      .replace("−", "-")
                      .replace("-", "-")
              )

              return re.sub(r"\s+", " ", text).strip()

          def get_text(task):
              parts = []

              for key in (
                  "title",
                  "description",
                  "body",
                  "content",
                  "details"
              ):
                  value = task.get(key)

                  if isinstance(value, str):
                      parts.append(value)

              return normalize(" ".join(parts))

          # ------------------------------------------------------------
          # ANNOUNCEMENT TYPE
          # ------------------------------------------------------------

          SERVICE_PATTERNS = [
              r"\bfor hire\b",
              r"\bavailable for hire\b",
              r"\bi offer\b",
              r"\boffering\b",
              r"\bservices?\b",
              r"\bhire me\b",
              r"\bavailable for work\b",
              r"\bopen for work\b"
          ]

          REQUEST_PATTERNS = [
              r"\blooking for\b",
              r"\bneed\b",
              r"\bneeds\b",
              r"\bseeking\b",
              r"\brequest(?:ing)?\b",
              r"\bjob\b",
              r"\btask\b",
              r"\bhelp wanted\b",
              r"\bwant someone\b",
              r"\blooking to hire\b"
          ]

          def classify_announcement(text):
              lower = text.lower()

              service_hits = [
                  pattern for pattern in SERVICE_PATTERNS
                  if re.search(pattern, lower)
              ]

              request_hits = [
                  pattern for pattern in REQUEST_PATTERNS
                  if re.search(pattern, lower)
              ]

              # Une demande explicite est prioritaire sur un mot générique.
              if request_hits and not service_hits:
                  return {
                      "type": "TASK_REQUEST",
                      "signals": request_hits
                  }

              if service_hits and not request_hits:
                  return {
                      "type": "SERVICE_OFFER",
                      "signals": service_hits
                  }

              if service_hits and request_hits:
                  # "For hire" + description technique reste une offre
                  # sauf si une demande explicite de recrutement apparaît.
                  explicit_hiring_request = any(
                      re.search(
                          pattern,
                          lower
                      )
                      for pattern in [
                          r"\blooking to hire\b",
                          r"\bwant someone\b",
                          r"\bneed someone\b",
                          r"\bseeking someone\b"
                      ]
                  )

                  if explicit_hiring_request:
                      return {
                          "type": "TASK_REQUEST",
                          "signals": request_hits
                      }

                  return {
                      "type": "SERVICE_OFFER",
                      "signals": service_hits
                  }

              return {
                  "type": "AMBIGUOUS",
                  "signals": []
              }

          # ------------------------------------------------------------
          # COMPENSATION
          # ------------------------------------------------------------

          # IMPORTANT V5 :
          # Le signe "-" n'est considéré comme négatif que lorsqu'il est
          # directement attaché à un montant et à une devise.
          NEGATIVE_REWARD_RE = re.compile(
              r"(?<![\w])-"
              r"\s*"
              r"\$?\s*"
              r"(\d+(?:[.,]\d+)?)"
              r"\s*"
              r"(USDC|USD|USDT|BTC|SAT|SATS)\b",
              re.IGNORECASE
          )

          POSITIVE_REWARD_RE = re.compile(
              r"(?<![-\w])"
              r"\$?\s*"
              r"(\d+(?:[.,]\d+)?)"
              r"\s*(\+)?"
              r"\s*"
              r"(USDC|USD|USDT|BTC|SAT|SATS)\b",
              re.IGNORECASE
          )

          REVERSE_REWARD_RE = re.compile(
              r"\b"
              r"(USDC|USD|USDT|BTC|SAT|SATS)"
              r"\s*"
              r"\$?\s*"
              r"(\d+(?:[.,]\d+)?)"
              r"(?:\+)?\b",
              re.IGNORECASE
          )

          AMBIGUOUS_REWARD_PATTERNS = [
              r"\bpay what you want\b",
              r"\bnegotiable\b",
              r"\bmake an offer\b",
              r"\bopen to offers\b",
              r"\bamount tbd\b",
              r"\breward tbd\b",
              r"\bpayment tbd\b"
          ]

          def clean_number(value):
              return value.replace(",", ".")

          def classify_compensation(text):
              lower = text.lower()

              # Un coût explicitement négatif est traité en premier.
              negative = NEGATIVE_REWARD_RE.search(text)

              if negative:
                  amount = clean_number(negative.group(1))
                  currency = negative.group(2).upper()

                  return {
                      "status": "NEGATIVE_COST",
                      "amount": amount,
                      "currency": currency,
                      "reason": "explicit_negative_amount"
                  }

              # Récompense positive avec montant.
              positive = POSITIVE_REWARD_RE.search(text)

              if positive:
                  amount = clean_number(positive.group(1))
                  plus = bool(positive.group(2))
                  currency = positive.group(3).upper()

                  return {
                      "status": "CONFIRMED_REWARD",
                      "amount": amount,
                      "currency": currency,
                      "minimum_or_plus": plus,
                      "reason": "explicit_positive_reward"
                  }

              # Format inversé : "USDC 5".
              reverse = REVERSE_REWARD_RE.search(text)

              if reverse:
                  currency = reverse.group(1).upper()
                  amount = clean_number(reverse.group(2))

                  return {
                      "status": "CONFIRMED_REWARD",
                      "amount": amount,
                      "currency": currency,
                      "minimum_or_plus": False,
                      "reason": "explicit_positive_reward_reverse_format"
                  }

              ambiguous = [
                  pattern for pattern in AMBIGUOUS_REWARD_PATTERNS
                  if re.search(pattern, lower)
              ]

              if ambiguous:
                  return {
                      "status": "REWARD_AMBIGUOUS",
                      "amount": None,
                      "currency": None,
                      "reason": "ambiguous_compensation",
                      "signals": ambiguous
                  }

              return {
                  "status": "REWARD_UNKNOWN",
                  "amount": None,
                  "currency": None,
                  "reason": "no_explicit_reward"
              }

          # ------------------------------------------------------------
          # RISK
          # ------------------------------------------------------------

          HIGH_RISK_PATTERNS = [
              r"\bsolve(?: the)? captcha\b",
              r"\bcomplete(?: the)? captcha\b",
              r"\bbypass(?: the)? captcha\b",
              r"\bprovide .*private key\b",
              r"\bshare .*private key\b",
              r"\bgive .*private key\b",
              r"\bprovide .*seed phrase\b",
              r"\bshare .*seed phrase\b",
              r"\bgive .*seed phrase\b",
              r"\bsend .*crypto\b",
              r"\bsend .*usdc\b",
              r"\bsend .*btc\b",
              r"\btransfer .*crypto\b",
              r"\btransfer .*usdc\b",
              r"\bpay upfront\b",
              r"\bfund .*wallet\b",
              r"\bdeposit .*crypto\b",
              r"\bwallet credentials\b"
          ]

          MENTION_ONLY_PATTERNS = [
              r"\bcaptcha\b",
              r"\bprivate key\b",
              r"\bseed phrase\b",
              r"\bwallet\b"
          ]

          def classify_risk(text):
              lower = text.lower()

              high_hits = [
                  pattern for pattern in HIGH_RISK_PATTERNS
                  if re.search(pattern, lower)
              ]

              if high_hits:
                  return {
                      "level": "HIGH",
                      "reason": high_hits[0],
                      "signals": high_hits
                  }

              mention_hits = [
                  pattern for pattern in MENTION_ONLY_PATTERNS
                  if re.search(pattern, lower)
              ]

              if mention_hits:
                  return {
                      "level": "RISK_MENTION_ONLY",
                      "reason": mention_hits[0],
                      "signals": mention_hits
                  }

              return {
                  "level": "LOW",
                  "reason": None,
                  "signals": []
              }

          # ------------------------------------------------------------
          # COMPATIBILITY
          # ------------------------------------------------------------

          SKILLS = {
              "python": [
                  r"\bpython\b"
              ],
              "api": [
                  r"\bapi\b",
                  r"\brest\b",
                  r"\bendpoint\b"
              ],
              "automation": [
                  r"\bautomation\b",
                  r"\bautomate\b",
                  r"\bscript(?:s|ing)?\b"
              ],
              "research": [
                  r"\bresearch\b",
                  r"\banalysis\b",
                  r"\banaly[sz]e\b"
              ],
              "data": [
                  r"\bdata\b",
                  r"\bcsv\b",
                  r"\bdedupe\b",
                  r"\bdatabase\b"
              ],
              "web": [
                  r"\bweb scraping\b",
                  r"\bscraping\b",
                  r"\bscraper\b",
                  r"\bwebsite\b"
              ],
              "testing": [
                  r"\btest(?:ing)?\b",
                  r"\bqa\b",
                  r"\bsmoke test\b",
                  r"\bverifier\b"
              ],
              "technical_writing": [
                  r"\btechnical writing\b",
                  r"\breport(?:s)?\b",
                  r"\bdocumentation\b",
                  r"\bnotes\b"
              ],
              "debugging": [
                  r"\bdebug(?:ging)?\b",
                  r"\bbug fix(?:es)?\b",
                  r"\bfix bugs\b"
              ]
          }

          def compatibility(text):
              lower = text.lower()
              matched = []

              for skill, patterns in SKILLS.items():
                  if any(re.search(pattern, lower) for pattern in patterns):
                      matched.append(skill)

              # Plafond 10.
              score = min(10, len(matched) + 2)

              return {
                  "score": score,
                  "matched_skills": matched
              }

          # ------------------------------------------------------------
          # OPPORTUNITY SCORE
          # ------------------------------------------------------------

          def opportunity_score(announcement, compensation, risk, compat):
              score = compat["score"]

              if announcement["type"] == "TASK_REQUEST":
                  score += 3
              elif announcement["type"] == "AMBIGUOUS":
                  score += 0
              else:
                  # Les offres de services ne sont pas des tâches à saisir.
                  score -= 2

              if compensation["status"] == "CONFIRMED_REWARD":
                  score += 3
              elif compensation["status"] == "REWARD_AMBIGUOUS":
                  score -= 1
              elif compensation["status"] == "NEGATIVE_COST":
                  score -= 5

              if risk["level"] == "HIGH":
                  score -= 10
              elif risk["level"] == "RISK_MENTION_ONLY":
                  score -= 1

              score = max(0, min(20, score))

              return score

          # ------------------------------------------------------------
          # FINAL CLASSIFICATION
          # ------------------------------------------------------------

          def final_classification(
              announcement,
              compensation,
              risk,
              compat,
              opportunity_score_value
          ):
              if risk["level"] == "HIGH":
                  return "REJECT"

              if compensation["status"] == "NEGATIVE_COST":
                  return "REJECT"

              if announcement["type"] == "SERVICE_OFFER":
                  return "SERVICE_OFFER"

              if announcement["type"] == "AMBIGUOUS":
                  return "OBSERVE"

              if compensation["status"] == "REWARD_AMBIGUOUS":
                  return "REWARD_UNCLEAR"

              if compensation["status"] == "REWARD_UNKNOWN":
                  return "REVIEW"

              if risk["level"] == "RISK_MENTION_ONLY":
                  return "REVIEW"

              if compat["score"] >= 8:
                  return "QUALIFIED"

              if compat["score"] >= 5:
                  return "REVIEW"

              return "OBSERVE"

          # ------------------------------------------------------------
          # FETCH MARKETPLACE
          # ------------------------------------------------------------

          params = {
              "status": "open",
              "sort": "new",
              "limit": MAX_RESULTS,
              "offset": 0
          }

          response = session.get(
              TASKS_URL,
              params=params,
              timeout=30
          )

          print("Marketplace status:", response.status_code)

          response.raise_for_status()

          payload = response.json()

          if isinstance(payload, dict):
              if isinstance(payload.get("tasks"), list):
                  tasks = payload["tasks"]
              elif isinstance(payload.get("data"), list):
                  tasks = payload["data"]
              elif isinstance(payload.get("results"), list):
                  tasks = payload["results"]
              else:
                  tasks = []
          elif isinstance(payload, list):
              tasks = payload
          else:
              tasks = []

          print("Open tasks received:", len(tasks))

          evaluated = {}

          for task in tasks:
              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("uuid")
                  or ""
              )

              if not task_id:
                  continue

              title = normalize(task.get("title", ""))
              text = get_text(task)

              announcement = classify_announcement(text)
              compensation = classify_compensation(text)
              risk = classify_risk(text)
              compat = compatibility(text)

              opp_score = opportunity_score(
                  announcement,
                  compensation,
                  risk,
                  compat
              )

              classification = final_classification(
                  announcement,
                  compensation,
                  risk,
                  compat,
                  opp_score
              )

              evaluated[task_id] = {
                  "task_id": task_id,
                  "title": title,
                  "announcement": announcement,
                  "compensation": compensation,
                  "risk": risk,
                  "compatibility": compat,
                  "opportunity_score": opp_score,
                  "classification": classification,
                  "actions": {
                      "bid": False,
                      "comment": False,
                      "dm": False,
                      "payment": False,
                      "purchase": False,
                      "transfer": False
                  },
                  "gemini_used": False,
                  "project_cost_eur": 0
              }

          # ------------------------------------------------------------
          # STATISTICS
          # ------------------------------------------------------------

          stats = {
              "runs": 1,
              "tasks_seen": len(tasks),
              "tasks_evaluated": len(evaluated),
              "qualified": 0,
              "review": 0,
              "observe": 0,
              "service_offer": 0,
              "reward_unclear": 0,
              "rejected": 0
          }

          for item in evaluated.values():
              classification = item["classification"]

              if classification == "QUALIFIED":
                  stats["qualified"] += 1
              elif classification == "REVIEW":
                  stats["review"] += 1
              elif classification == "OBSERVE":
                  stats["observe"] += 1
              elif classification == "SERVICE_OFFER":
                  stats["service_offer"] += 1
              elif classification == "REWARD_UNCLEAR":
                  stats["reward_unclear"] += 1
              elif classification == "REJECT":
                  stats["rejected"] += 1

          # ------------------------------------------------------------
          # TOP OPPORTUNITIES
          # ------------------------------------------------------------

          interesting = sorted(
              evaluated.values(),
              key=lambda x: x.get("opportunity_score", 0),
              reverse=True
          )

          top_opportunities = [
              {
                  "task_id": item["task_id"],
                  "title": item["title"],
                  "classification": item["classification"],
                  "opportunity_score": item["opportunity_score"],
                  "reward_status": item["compensation"]["status"],
                  "reward_amount": item["compensation"]["amount"],
                  "reward_currency": item["compensation"]["currency"],
                  "compatibility_score": item["compatibility"]["score"]
              }
              for item in interesting[:10]
          ]

          result = {
              "version": VERSION,
              "generated_at": generated_at,
              "mode": "opportunity_intelligence_read_only",
              "scope": {
                  "personalized_feed": True,
                  "public_recent_posts": True,
                  "marketplace_actions": False,
                  "comments": False,
                  "dm": False,
                  "payments": False,
                  "gemini": False,
                  "max_results": MAX_RESULTS
              },
              "evaluated_tasks": evaluated,
              "top_opportunities": top_opportunities,
              "statistics": stats,
              "last_run": {
                  "timestamp": generated_at,
                  "marketplace_status": response.status_code,
                  "open_tasks_received": len(tasks),
                  "tasks_evaluated": len(evaluated),
                  "actions_performed": False,
                  "bid": False,
                  "comment": False,
                  "dm": False,
                  "payment": False,
                  "purchase": False,
                  "transfer": False,
                  "gemini_used": False,
                  "project_cost_eur": 0
              }
          }

          os.makedirs(
              os.path.dirname(MEMORY_FILE),
              exist_ok=True
          )

          with open(
              MEMORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(
              result,
              ensure_ascii=False,
              indent=2
          ))

      - name: Commit ACT 08 V5 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_08_opportunity_evaluator_v5.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ACT 08 V5 opportunity intelligence"

      - name: Sync with main and push
        run: |
          git fetch origin main

          if git rebase origin/main; then
            git push origin HEAD:main
          else
            echo "Rebase failed. Aborting."
            git rebase --abort
            exit 1
          fi
