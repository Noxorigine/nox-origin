name: NØX ACT 29 - Metacognition

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metacognition:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT29 Metacognition
        env:
          TZ: UTC
        run: |
          python <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY_DIR = ROOT / "memory"
          ACT28_FILE = MEMORY_DIR / "nox_act_28_anticipation_simulation.json"
          ACT27_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_29_metacognition.json"

          print("=" * 40)
          print("NØX ACT29 - METACOGNITION")
          print("=" * 40)

          if not ACT28_FILE.exists():
              raise SystemExit("ACT28 memory not found")

          with ACT28_FILE.open("r", encoding="utf-8") as f:
              act28 = json.load(f)

          act27 = {}
          if ACT27_FILE.exists():
              with ACT27_FILE.open("r", encoding="utf-8") as f:
                  act27 = json.load(f)

          predictions = act28.get("predictions", [])
          scenarios = act28.get("scenarios", [])
          verification_targets = act28.get("verification_targets", [])
          act28_metrics = act28.get("metrics", {})

          relation_counts = act27.get("relation_counts", {})
          hypotheses = act27.get("relationship_hypotheses", [])

          print(f"ACT28 predictions found: {len(predictions)}")
          print(f"ACT28 scenarios found: {len(scenarios)}")
          print(f"Verification targets found: {len(verification_targets)}")
          print(f"ACT27 hypotheses available: {len(hypotheses)}")
          print("-" * 40)

          # ------------------------------------------------------------
          # 1. Evaluate the quality of NØX's own predictions
          # ------------------------------------------------------------

          assessments = []

          def clamp(value, low=0.0, high=1.0):
              return max(low, min(high, value))

          for prediction in predictions:
              prediction_id = prediction.get("id", "unknown")
              relation = prediction.get("relation", "unknown")
              trigger = prediction.get("if", "")
              consequence = prediction.get("then", "")
              confidence = float(
                  prediction.get(
                      "predicted_confidence",
                      prediction.get("confidence", 0.5)
                  )
              )

              strengths = []
              weaknesses = []
              evidence_score = 0.0

              # A prediction based on a known ACT27 relationship has
              # stronger internal support.
              if relation in relation_counts:
                  support = int(relation_counts.get(relation, 0))
                  evidence_score = clamp(support / 6.0)
                  strengths.append("supported_by_ACT27_relationship")

                  if support >= 4:
                      strengths.append("multiple_observations")
                  elif support == 1:
                      weaknesses.append("limited_observation_support")
              else:
                  weaknesses.append("relation_not_present_in_ACT27_counts")

              # Confidence is treated as heuristic, not probability.
              if confidence >= 0.85:
                  if evidence_score < 0.50:
                      weaknesses.append("confidence_may_be_too_high_for_available_evidence")
                  else:
                      strengths.append("confidence_matches_reasonable_internal_support")

              elif confidence < 0.70:
                  strengths.append("uncertainty_is_explicit")

              # Causal caution.
              if relation == "shared_domain":
                  weaknesses.append("shared_context_does_not_establish_causation")

              # ACT28 predictions are forward-looking. Without observed
              # outcomes, correctness cannot yet be claimed.
              outcome_status = "not_yet_observed"

              assessments.append({
                  "prediction_id": prediction_id,
                  "relation": relation,
                  "trigger": trigger,
                  "consequence": consequence,
                  "predicted_confidence": round(confidence, 3),
                  "internal_evidence_score": round(evidence_score, 3),
                  "outcome_status": outcome_status,
                  "strengths": strengths,
                  "weaknesses": weaknesses
              })

          # ------------------------------------------------------------
          # 2. Identify recurring reasoning patterns
          # ------------------------------------------------------------

          total_predictions = len(assessments)

          high_confidence = [
              a for a in assessments
              if a["predicted_confidence"] >= 0.85
          ]

          low_support_high_confidence = [
              a for a in assessments
              if (
                  a["predicted_confidence"] >= 0.85
                  and a["internal_evidence_score"] < 0.50
              )
          ]

          explicit_uncertainty = [
              a for a in assessments
              if a["predicted_confidence"] < 0.70
          ]

          causal_caution = [
              a for a in assessments
              if "causation" in " ".join(a["weaknesses"])
          ]

          # ------------------------------------------------------------
          # 3. Evaluate scenario reasoning
          # ------------------------------------------------------------

          scenario_assessments = []

          for scenario in scenarios:
              scenario_id = scenario.get("id", "unknown")
              scenario_type = scenario.get("type", "unknown")
              confidence = float(
                  scenario.get(
                      "confidence",
                      scenario.get("predicted_confidence", 0.5)
                  )
              )
              description = scenario.get(
                  "description",
                  scenario.get("scenario", "")
              )

              weaknesses = []

              if confidence >= 0.85:
                  weaknesses.append(
                      "high_confidence_scenario_requires_future_external_verification"
                  )

              scenario_assessments.append({
                  "scenario_id": scenario_id,
                  "type": scenario_type,
                  "description": description,
                  "predicted_confidence": round(confidence, 3),
                  "status": "not_yet_observed",
                  "weaknesses": weaknesses
              })

          # ------------------------------------------------------------
          # 4. Determine what NØX currently knows about itself
          # ------------------------------------------------------------

          self_knowledge = {
              "knows_that_predictions_are_hypotheses": True,
              "knows_that_confidence_is_heuristic": True,
              "knows_that_shared_context_is_not_causation": True,
              "knows_that_future_predictions_require_observation": True,
              "knows_that_prediction_accuracy_cannot_yet_be_measured_without_outcomes": True,
              "can_identify_high_confidence_low_support_predictions": (
                  len(low_support_high_confidence) > 0
              ),
              "can_identify_reasoning_uncertainty": (
                  len(explicit_uncertainty) > 0
              )
          }

          # ------------------------------------------------------------
          # 5. Detect metacognitive gaps
          # ------------------------------------------------------------

          metacognitive_gaps = []

          if total_predictions > 0 and not any(
              a["outcome_status"] != "not_yet_observed"
              for a in assessments
          ):
              metacognitive_gaps.append(
                  "prediction_outcomes_are_not_yet_observed"
              )

          if low_support_high_confidence:
              metacognitive_gaps.append(
                  "some_predictions_have_more_confidence_than_internal_evidence_justifies"
              )

          if total_predictions > 0 and len(explicit_uncertainty) == 0:
              metacognitive_gaps.append(
                  "prediction_set_contains_no_low_confidence_predictions"
              )

          if scenarios and all(
              s["status"] == "not_yet_observed"
              for s in scenario_assessments
          ):
              metacognitive_gaps.append(
                  "scenario_accuracy_cannot_yet_be_evaluated"
              )

          if not verification_targets:
              metacognitive_gaps.append(
                  "no_verification_targets_available"
              )

          # ------------------------------------------------------------
          # 6. Generate lessons about NØX itself
          # ------------------------------------------------------------

          self_lessons = []

          if total_predictions:
              self_lessons.append({
                  "lesson": "NØX currently generates plausible predictions from observed relationships, but prediction plausibility is not equivalent to prediction accuracy.",
                  "type": "epistemic_boundary",
                  "importance": 0.95
              })

          if low_support_high_confidence:
              self_lessons.append({
                  "lesson": "NØX sometimes assigns relatively high confidence before enough independent evidence exists.",
                  "type": "confidence_calibration",
                  "importance": 0.92
              })

          if causal_caution:
              self_lessons.append({
                  "lesson": "NØX must preserve the distinction between correlation, shared context and causation.",
                  "type": "causal_reasoning",
                  "importance": 0.90
              })

          self_lessons.append({
              "lesson": "NØX needs repeated observation of real outcomes before it can determine which predictions and strategies are reliable.",
              "type": "learning_requirement",
              "importance": 0.94
          })

          self_lessons.append({
              "lesson": "NØX should adjust future confidence using observed prediction accuracy rather than confidence alone.",
              "type": "future_calibration",
              "importance": 0.93
          })

          # ------------------------------------------------------------
          # 7. Build a preliminary capability profile
          # ------------------------------------------------------------

          capability_profile = {
              "attention": {
                  "status": "developing",
                  "source": "ACT26"
              },
              "relational_understanding": {
                  "status": "developing",
                  "source": "ACT27"
              },
              "anticipation": {
                  "status": "developing",
                  "source": "ACT28"
              },
              "self_evaluation": {
                  "status": "developing",
                  "source": "ACT29"
              },
              "prediction_verification": {
                  "status": "not_yet_available",
                  "reason": "ACT28 predictions require observed outcomes"
              },
              "confidence_calibration": {
                  "status": "preliminary",
                  "reason": "initial heuristic evaluation only"
              },
              "strategy_selection": {
                  "status": "future",
                  "source": "ACT30"
              }
          }

          # ------------------------------------------------------------
          # 8. Produce metacognitive state
          # ------------------------------------------------------------

          if low_support_high_confidence:
              metacognitive_state = "confidence_requires_calibration"
          elif metacognitive_gaps:
              metacognitive_state = "learning_with_known_limits"
          else:
              metacognitive_state = "developing_self_knowledge"

          # A heuristic score measuring quality of self-awareness,
          # NOT intelligence and NOT prediction accuracy.
          self_awareness_score = 0.50

          if self_knowledge["knows_that_predictions_are_hypotheses"]:
              self_awareness_score += 0.08

          if self_knowledge["knows_that_confidence_is_heuristic"]:
              self_awareness_score += 0.08

          if self_knowledge["knows_that_shared_context_is_not_causation"]:
              self_awareness_score += 0.08

          if self_knowledge["knows_that_future_predictions_require_observation"]:
              self_awareness_score += 0.08

          if low_support_high_confidence:
              self_awareness_score -= 0.05

          self_awareness_score = round(
              clamp(self_awareness_score) * 100,
              2
          )

          # ------------------------------------------------------------
          # 9. Metrics
          # ------------------------------------------------------------

          metrics = {
              "predictions_evaluated": total_predictions,
              "scenarios_evaluated": len(scenario_assessments),
              "high_confidence_predictions": len(high_confidence),
              "high_confidence_low_support": len(low_support_high_confidence),
              "explicit_uncertainty_predictions": len(explicit_uncertainty),
              "causal_caution_cases": len(causal_caution),
              "metacognitive_gaps": len(metacognitive_gaps),
              "self_awareness_score": self_awareness_score
          }

          # ------------------------------------------------------------
          # 10. Persist ACT29 memory
          # ------------------------------------------------------------

          output = {
              "act": "ACT29",
              "name": "Metacognition",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Evaluate NØX's own reasoning, uncertainty, evidence quality, "
                  "limitations and confidence using ACT28 anticipation outputs."
              ),

              "principle": (
                  "NØX must not only reason about the world; it must also "
                  "evaluate how reliable its own reasoning currently is."
              ),

              "source_act": "ACT28",

              "input_predictions": len(predictions),
              "input_scenarios": len(scenarios),
              "input_verification_targets": len(verification_targets),

              "prediction_assessments": assessments,
              "scenario_assessments": scenario_assessments,

              "self_knowledge": self_knowledge,

              "metacognitive_state": metacognitive_state,

              "metacognitive_gaps": metacognitive_gaps,

              "self_lessons": self_lessons,

              "capability_profile": capability_profile,

              "metrics": metrics,

              "important_boundary": (
                  "ACT29 does not claim that ACT28 predictions are correct or "
                  "incorrect when real outcomes have not yet been observed. "
                  "It evaluates the quality and limitations of the reasoning "
                  "that produced those predictions."
              ),

              "next_cognitive_step": (
                  "ACT30 should use NØX's knowledge of its own strengths, "
                  "uncertainties and evidence quality to select which strategy "
                  "currently deserves to be pursued, while keeping alternatives "
                  "and conditions for strategy change explicit."
              )
          }

          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          with OUTPUT_FILE.open("w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("----------------------------------------")
          print("METACOGNITIVE STATE:")
          print(f"- {metacognitive_state}")

          print("----------------------------------------")
          print("SELF-KNOWLEDGE:")
          for key, value in self_knowledge.items():
              print(f"- {key}: {value}")

          print("----------------------------------------")
          print("REASONING LIMITS:")
          for gap in metacognitive_gaps:
              print(f"- {gap}")

          print("----------------------------------------")
          print("SELF LESSONS:")
          for lesson in self_lessons:
              print(
                  f"- {lesson['importance']:.2f} | "
                  f"{lesson['type']} | "
                  f"{lesson['lesson']}"
              )

          print("----------------------------------------")
          print("METRICS:")
          print(f"- Predictions evaluated: {metrics['predictions_evaluated']}")
          print(f"- Scenarios evaluated: {metrics['scenarios_evaluated']}")
          print(f"- High-confidence predictions: {metrics['high_confidence_predictions']}")
          print(f"- High-confidence / low-support: {metrics['high_confidence_low_support']}")
          print(f"- Explicit uncertainty: {metrics['explicit_uncertainty_predictions']}")
          print(f"- Causal caution cases: {metrics['causal_caution_cases']}")
          print(f"- Metacognitive gaps: {metrics['metacognitive_gaps']}")
          print(f"- Self-awareness score: {metrics['self_awareness_score']:.2f}")

          print("----------------------------------------")
          print(f"Memory written: {OUTPUT_FILE}")

          # ------------------------------------------------------------
          # 11. Commit and push with retry against concurrent writers
          # ------------------------------------------------------------

          subprocess.run(
              ["git", "config", "user.name", "NØX"],
              check=True
          )
          subprocess.run(
              ["git", "config", "user.email", "nox-origin@users.noreply.github.com"],
              check=True
          )

          subprocess.run(
              ["git", "add", str(OUTPUT_FILE)],
              check=True
          )

          status = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if status.returncode == 0:
              print("No memory changes to commit.")
              raise SystemExit(0)

          subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "NØX ACT29: metacognition memory"
              ],
              check=True
          )

          pushed = False

          for attempt in range(1, 6):
              print(f"Push attempt {attempt}/5")

              result = subprocess.run(
                  ["git", "push", "origin", "HEAD:main"]
              )

              if result.returncode == 0:
                  pushed = True
                  print("Push successful.")
                  break

              print("Push rejected. Synchronizing with origin/main...")

              subprocess.run(
                  ["git", "fetch", "origin", "main"],
                  check=True
              )

              rebase = subprocess.run(
                  ["git", "rebase", "origin/main"]
              )

              if rebase.returncode != 0:
                  subprocess.run(
                      ["git", "rebase", "--abort"]
                  )
                  raise SystemExit(
                      "Unable to rebase safely after concurrent main update."
                  )

          if not pushed:
              raise SystemExit("Push failed after 5 attempts.")

          print("=" * 40)
          print("ACT29 COMPLETE")
          print("=" * 40)
          PY
