name: NØX Origin - V36 Memory Integrity & Retrieval

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          memory_file = Path("nox_memory.json")
          report_file = Path("V36_MEMORY_REPORT.md")

          sentinel = "MEMORY_SENTINEL_V36_OK"
          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V36")
          print("Memory Integrity & Retrieval")
          print("===================================")

          # --------------------------------------------------
          # 1. LOAD EXISTING MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  data = json.loads(
                      memory_file.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  raise RuntimeError(
                      f"Unable to read nox_memory.json: {exc}"
                  )
          else:
              raise RuntimeError(
                  "nox_memory.json does not exist."
              )

          if not isinstance(data, dict):
              raise RuntimeError(
                  "nox_memory.json does not contain a valid JSON object."
              )

          # --------------------------------------------------
          # 2. PRESERVE EXISTING MEMORY
          # --------------------------------------------------

          data.setdefault("observations", [])
          data.setdefault("verification_log", [])
          data.setdefault("retrieval_log", [])
          data.setdefault("learning_log", [])

          # --------------------------------------------------
          # 3. V36 MEMORY OBSERVATION
          # --------------------------------------------------

          observation = {
              "id": "v36_test_001",
              "content": "Memory must be retrievable to be useful.",
              "source": "V36 controlled test",
              "confidence": 0.9,
              "verification_status": "requires_verification",
              "created_at": now
          }

          if not any(
              isinstance(item, dict)
              and item.get("id") == observation["id"]
              for item in data["observations"]
          ):
              data["observations"].append(observation)
              print("V36 observation added.")
          else:
              print("V36 observation already exists.")

          # --------------------------------------------------
          # 4. RETRIEVAL TEST
          # --------------------------------------------------

          retrieved = next(
              (
                  item
                  for item in data["observations"]
                  if isinstance(item, dict)
                  and item.get("id") == "v36_test_001"
              ),
              None
          )

          if retrieved is None:
              raise RuntimeError(
                  "Memory retrieval test failed."
              )

          data["retrieval_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "success"
          })

          print("Memory retrieval: PASS")

          # --------------------------------------------------
          # 5. VERIFICATION LOG
          # --------------------------------------------------

          data["verification_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "requires_external_verification"
          })

          print("Verification model: PASS")

          # --------------------------------------------------
          # 6. LEARNING LOG
          # --------------------------------------------------

          data["learning_log"].append({
              "timestamp": now,
              "lesson": (
                  "Stored memory must be retrievable and must not "
                  "automatically be treated as current truth."
              )
          })

          print("Learning record: PASS")

          # --------------------------------------------------
          # 7. UPDATE MAIN MEMORY VERSION
          # --------------------------------------------------

          previous_version = data.get("version", "unknown")

          data["version"] = "V36"
          data["last_updated"] = now
          data["sentinel"] = sentinel

          # --------------------------------------------------
          # 8. WRITE MAIN MEMORY
          # --------------------------------------------------

          memory_file.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 9. RELOAD AND VERIFY
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if loaded.get("version") != "V36":
              raise RuntimeError(
                  "Version update verification failed."
              )

          if loaded.get("sentinel") != sentinel:
              raise RuntimeError(
                  "Memory sentinel check failed."
              )

          if not any(
              isinstance(item, dict)
              and item.get("id") == "v36_test_001"
              for item in loaded["observations"]
          ):
              raise RuntimeError(
                  "V36 observation persistence check failed."
              )

          print("JSON integrity: PASS")
          print("Sentinel: PASS")
          print(f"Previous version: {previous_version}")
          print("Current version: V36")

          # --------------------------------------------------
          # 10. GENERATE REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V36 Memory Report",
              "",
              "## Memory Integrity",
              "",
              "- JSON integrity: PASS",
              "- Sentinel: PASS",
              "- Main memory file: `nox_memory.json`",
              f"- Previous version: {previous_version}",
              "- Current version: V36",
              "",
              "## Retrieval",
              "",
              f"- Observations stored: {len(loaded['observations'])}",
              f"- Retrieval tests: {len(loaded['retrieval_log'])}",
              "- Retrieval: PASS",
              "",
              "## Verification",
              "",
              f"- Verification records: {len(loaded['verification_log'])}",
              "- Stored memory automatically treated as current truth: NO",
              "",
              "## Learning",
              "",
              f"- Learning records: {len(loaded['learning_log'])}",
              "",
              "## V36 Conclusion",
              "",
              "NØX V36 confirms that memory is not only storage.",
              "",
              "A reliable memory system must:",
              "",
              "1. preserve memory integrity;",
              "2. retrieve stored information;",
              "3. distinguish stored information from verified current truth;",
              "4. record lessons from memory failures and tests.",
              "",
              "V36 is a controlled memory integrity and retrieval test.",
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("V36 COMPLETE")
          print("===================================")
          PY

      - name: Commit V36 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V36_MEMORY_REPORT.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V36 - Memory Integrity & Retrieval"
            git push
          fi
