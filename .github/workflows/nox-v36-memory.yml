name: NØX Origin - V36 Memory Integrity & Retrieval

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create V36 memory system
        run: |
          mkdir -p nox_memory

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          memory_file = Path("nox_memory/nox_memory_v36.json")

          sentinel = "MEMORY_SENTINEL_V36_OK"

          if memory_file.exists():
              try:
                  data = json.loads(memory_file.read_text(encoding="utf-8"))
              except Exception:
                  data = {}
          else:
              data = {}

          if not isinstance(data, dict):
              data = {}

          data.setdefault("version", "V36")
          data.setdefault("observations", [])
          data.setdefault("verification_log", [])
          data.setdefault("retrieval_log", [])
          data.setdefault("learning_log", [])

          data["last_updated"] = datetime.now(timezone.utc).isoformat()
          data["sentinel"] = sentinel

          memory_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("V36 memory file ready.")
          print(f"Memory records: {len(data['observations'])}")
          print(f"Sentinel: {data['sentinel']}")
          PY

      - name: Test memory integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          memory_file = Path("nox_memory/nox_memory_v36.json")
          sentinel = "MEMORY_SENTINEL_V36_OK"

          print("=== NØX V36 MEMORY INTEGRITY TEST ===")

          if not memory_file.exists():
              raise SystemExit("ERROR: Memory file does not exist.")

          try:
              data = json.loads(memory_file.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"ERROR: Invalid JSON: {exc}")

          if data.get("sentinel") != sentinel:
              raise SystemExit("ERROR: Memory sentinel missing or invalid.")

          required = [
              "version",
              "observations",
              "verification_log",
              "retrieval_log",
              "learning_log"
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "ERROR: Missing memory fields: " + ", ".join(missing)
              )

          print("JSON integrity: PASS")
          print("Sentinel check: PASS")
          print("Required fields: PASS")
          print("Memory integrity: PASS")
          PY

      - name: Test memory retrieval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          memory_file = Path("nox_memory/nox_memory_v36.json")
          data = json.loads(memory_file.read_text(encoding="utf-8"))

          test_observation = {
              "id": "v36_test_001",
              "content": "Memory must be retrievable to be useful.",
              "source": "V36 controlled test",
              "confidence": 0.9,
              "verification_status": "test",
              "created_at": "V36"
          }

          observations = data.setdefault("observations", [])

          existing = next(
              (
                  item for item in observations
                  if item.get("id") == test_observation["id"]
              ),
              None
          )

          if existing is None:
              observations.append(test_observation)

          retrieved = next(
              (
                  item for item in observations
                  if item.get("id") == "v36_test_001"
              ),
              None
          )

          if retrieved is None:
              raise SystemExit(
                  "ERROR: Stored memory could not be retrieved."
              )

          data["retrieval_log"].append({
              "test_id": "v36_retrieval_001",
              "result": "success",
              "retrieved_memory_id": retrieved["id"]
          })

          memory_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("Memory storage: PASS")
          print("Memory retrieval: PASS")
          print("Retrieval test: PASS")
          PY

      - name: Test verification model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          memory_file = Path("nox_memory/nox_memory_v36.json")
          data = json.loads(memory_file.read_text(encoding="utf-8"))

          observation = next(
              item for item in data["observations"]
              if item.get("id") == "v36_test_001"
          )

          verification = {
              "memory_id": observation["id"],
              "status": "requires_external_verification",
              "reason": (
                  "Stored memory is not automatically considered "
                  "current truth."
              )
          }

          data["verification_log"].append(verification)

          memory_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("Memory verification model: PASS")
          print("Stored information is treated as information, not automatic truth.")
          PY

      - name: Record V36 learning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          memory_file = Path("nox_memory/nox_memory_v36.json")
          data = json.loads(memory_file.read_text(encoding="utf-8"))

          learning = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "version": "V36",
              "observation": (
                  "A memory system is useful only when stored information "
                  "can be retrieved and its integrity can be checked."
              ),
              "lesson": (
                  "Stored memory must not automatically be treated as "
                  "verified current truth."
              )
          }

          data["learning_log"].append(learning)

          memory_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("Learning record: PASS")
          print("V36 learning successfully recorded.")
          PY

      - name: Generate V36 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          memory_file = Path("nox_memory/nox_memory_v36.json")
          data = json.loads(memory_file.read_text(encoding="utf-8"))

          report = f"""# NØX Origin — V36 Memory Report

## Memory Integrity

- JSON integrity: PASS
- Sentinel: PASS
- Required fields: PASS
- Memory integrity: PASS

## Retrieval

- Stored observations: {len(data["observations"])}
- Retrieval tests: {len(data["retrieval_log"])}
- Retrieval status: PASS

## Verification

- Verification records: {len(data["verification_log"])}
- Stored memory treated as automatically verified: NO

## Learning

- Learning records: {len(data["learning_log"])}

## V36 conclusion

NØX V36 confirms that memory is not only storage.

A reliable memory system must:

1. preserve data integrity;
2. retrieve stored information;
3. distinguish memory from verified current truth;
4. record what was learned from the process.

This is a controlled test result, not a final conclusion.
"""

          Path("nox_memory/V36_MEMORY_REPORT.md").write_text(
              report,
              encoding="utf-8"
          )

          print(report)
          PY

      - name: Save V36 memory changes
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "NØX V36 - Memory Integrity & Retrieval"
            git push
          fi
