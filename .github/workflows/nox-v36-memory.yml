name: NØX Origin - V36 Memory Integrity & Retrieval

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          folder = Path("nox_memory")
          folder.mkdir(exist_ok=True)

          memory_file = folder / "nox_memory_v36.json"
          report_file = folder / "V36_MEMORY_REPORT.md"

          sentinel = "MEMORY_SENTINEL_V36_OK"
          now = datetime.now(timezone.utc).isoformat()

          if memory_file.exists():
              try:
                  data = json.loads(memory_file.read_text(encoding="utf-8"))
              except Exception:
                  data = {}
          else:
              data = {}

          if not isinstance(data, dict):
              data = {}

          data.setdefault("version", "V36")
          data.setdefault("observations", [])
          data.setdefault("verification_log", [])
          data.setdefault("retrieval_log", [])
          data.setdefault("learning_log", [])

          observation = {
              "id": "v36_test_001",
              "content": "Memory must be retrievable to be useful.",
              "source": "V36 controlled test",
              "confidence": 0.9,
              "verification_status": "requires_verification",
              "created_at": now
          }

          if not any(
              item.get("id") == observation["id"]
              for item in data["observations"]
          ):
              data["observations"].append(observation)

          retrieved = next(
              (
                  item for item in data["observations"]
                  if item.get("id") == "v36_test_001"
              ),
              None
          )

          if retrieved is None:
              raise RuntimeError("Memory retrieval test failed.")

          data["retrieval_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "success"
          })

          data["verification_log"].append({
              "timestamp": now,
              "memory_id": retrieved["id"],
              "status": "requires_external_verification"
          })

          data["learning_log"].append({
              "timestamp": now,
              "lesson": (
                  "Stored memory must be retrievable and must not "
                  "automatically be treated as current truth."
              )
          })

          data["last_updated"] = now
          data["sentinel"] = sentinel

          memory_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          loaded = json.loads(
              memory_file.read_text(encoding="utf-8")
          )

          if loaded.get("sentinel") != sentinel:
              raise RuntimeError("Memory sentinel check failed.")

          report_lines = [
              "# NØX Origin — V36 Memory Report",
              "",
              "## Memory Integrity",
              "",
              "- JSON integrity: PASS",
              "- Sentinel: PASS",
              "- Memory integrity: PASS",
              "",
              "## Retrieval",
              "",
              f"- Observations stored: {len(loaded['observations'])}",
              f"- Retrieval tests: {len(loaded['retrieval_log'])}",
              "- Retrieval: PASS",
              "",
              "## Verification",
              "",
              f"- Verification records: {len(loaded['verification_log'])}",
              "- Memory automatically treated as truth: NO",
              "",
              "## Learning",
              "",
              f"- Learning records: {len(loaded['learning_log'])}",
              "",
              "## V36 Conclusion",
              "",
              "NØX V36 confirms that memory is not only storage.",
              "",
              "A reliable memory system must:",
              "",
              "1. preserve memory integrity;",
              "2. retrieve stored information;",
              "3. distinguish stored information from verified current truth;",
              "4. record lessons from memory failures and tests.",
              "",
              "This is a controlled test result, not a final conclusion."
          ]

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("===================================")
          print("NØX ORIGIN V36")
          print("Memory Integrity & Retrieval")
          print("===================================")
          print("JSON integrity: PASS")
          print("Sentinel: PASS")
          print("Memory retrieval: PASS")
          print("Verification model: PASS")
          print("Learning record: PASS")
          print("===================================")
          PY

      - name: Commit V36 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V36 - Memory Integrity & Retrieval"
            git push
          fi
