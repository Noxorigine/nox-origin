name: NØX ACT 27 - Relational Understanding

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relational-understanding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT27 Relational Understanding
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          BASE_URL = "https://thecolony.ai/api/v1"
          API_KEY = os.environ.get("COLONY_API_KEY")

          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          HEADERS = {
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          INPUT_FILE = MEMORY_DIR / "nox_act_26_active_attention.json"
          OUTPUT_FILE = MEMORY_DIR / "nox_act_27_relational_understanding.json"


          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def normalize(text):
              text = str(text or "").lower()
              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"[^a-z0-9àâçéèêëîïôûùüÿñæœ' -]", " ", text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()


          def tokenize(text):
              words = normalize(text).split()
              return {
                  word
                  for word in words
                  if len(word) >= 4
              }


          def load_attention_memory():
              if not INPUT_FILE.exists():
                  raise RuntimeError(
                      f"ACT26 memory not found: {INPUT_FILE}"
                  )

              return json.loads(
                  INPUT_FILE.read_text(encoding="utf-8")
              )


          def get_recent_posts(limit=50):
              response = requests.get(
                  f"{BASE_URL}/posts",
                  headers=HEADERS,
                  params={
                      "limit": limit,
                      "sort": "new",
                  },
                  timeout=30,
              )

              if response.status_code == 401:
                  raise RuntimeError(
                      "Authentication failed: HTTP 401"
                  )

              response.raise_for_status()

              payload = response.json()

              if isinstance(payload, list):
                  return payload

              if isinstance(payload, dict):
                  for key in (
                      "posts",
                      "items",
                      "data",
                      "results",
                  ):
                      value = payload.get(key)

                      if isinstance(value, list):
                          return value

                      if isinstance(value, dict):
                          for nested in (
                              "posts",
                              "items",
                              "results",
                              "data",
                          ):
                              nested_value = value.get(nested)
                              if isinstance(nested_value, list):
                                  return nested_value

              return []


          # ------------------------------------------------------------
          # Relationship model
          # ------------------------------------------------------------

          CONCEPT_GROUPS = {
              "agent_autonomy": {
                  "agent",
                  "agents",
                  "autonomous",
                  "autonomy",
                  "agentic",
                  "decision",
                  "strategy",
                  "planning",
                  "reasoning",
              },
              "learning_memory": {
                  "learning",
                  "memory",
                  "remember",
                  "understanding",
                  "knowledge",
                  "lesson",
                  "experience",
                  "change",
                  "changed",
              },
              "motivation_reward": {
                  "reward",
                  "rewards",
                  "motivation",
                  "incentive",
                  "value",
                  "payment",
                  "earnings",
                  "economy",
              },
              "tasks_marketplace": {
                  "task",
                  "tasks",
                  "marketplace",
                  "market",
                  "work",
                  "worker",
                  "bounty",
                  "request",
              },
              "communication_collaboration": {
                  "communication",
                  "collaboration",
                  "relay",
                  "message",
                  "messages",
                  "community",
                  "trust",
                  "reputation",
              },
              "security": {
                  "security",
                  "authentication",
                  "credential",
                  "credentials",
                  "privacy",
                  "vulnerability",
                  "attack",
                  "exploit",
                  "lock",
                  "locks",
              },
              "information_systems": {
                  "information",
                  "data",
                  "number",
                  "numbers",
                  "signal",
                  "signals",
                  "protocol",
                  "infrastructure",
              },
          }


          RELATION_RULES = [
              (
                  "motivation_reward",
                  "tasks_marketplace",
                  "reward_or_incentive_can_influence_work_behavior",
              ),
              (
                  "agent_autonomy",
                  "learning_memory",
                  "learning_and_memory_support_adaptation",
              ),
              (
                  "agent_autonomy",
                  "motivation_reward",
                  "motivation_can_influence_agent_behavior",
              ),
              (
                  "agent_autonomy",
                  "tasks_marketplace",
                  "tasks_create_opportunities_for_agent_action",
              ),
              (
                  "agent_autonomy",
                  "communication_collaboration",
                  "agents_need_communication_to_coordinate",
              ),
              (
                  "learning_memory",
                  "communication_collaboration",
                  "interaction_can_produce_learning",
              ),
              (
                  "communication_collaboration",
                  "information_systems",
                  "communication_transports_information",
              ),
              (
                  "security",
                  "communication_collaboration",
                  "security_constraints_can_affect_communication",
              ),
              (
                  "security",
                  "tasks_marketplace",
                  "security_can_constrain_task_execution",
              ),
              (
                  "information_systems",
                  "learning_memory",
                  "information_can_change_understanding",
              ),
          ]


          def detect_concepts(text):
              tokens = tokenize(text)

              found = {}

              for group, vocabulary in CONCEPT_GROUPS.items():
                  matches = sorted(
                      token
                      for token in tokens
                      if token in vocabulary
                  )

                  if matches:
                      found[group] = matches

              return found


          def semantic_overlap(text_a, text_b):
              a = tokenize(text_a)
              b = tokenize(text_b)

              if not a or not b:
                  return 0

              intersection = len(a & b)
              union = len(a | b)

              return intersection / union if union else 0


          def group_relationships(concepts_a, concepts_b):
              relationships = []

              for group_a in concepts_a:
                  for group_b in concepts_b:

                      if group_a == group_b:
                          relationships.append(
                              {
                                  "type": "shared_domain",
                                  "from": group_a,
                                  "to": group_b,
                                  "confidence": 0.75,
                              }
                          )

                      for (
                          rule_a,
                          rule_b,
                          relation,
                      ) in RELATION_RULES:

                          if (
                              group_a == rule_a
                              and group_b == rule_b
                          ) or (
                              group_a == rule_b
                              and group_b == rule_a
                          ):
                              relationships.append(
                                  {
                                      "type": "conceptual_relation",
                                      "from": group_a,
                                      "to": group_b,
                                      "relation": relation,
                                      "confidence": 0.70,
                                  }
                              )

              return relationships


          # ------------------------------------------------------------
          # Load ACT26
          # ------------------------------------------------------------

          attention_memory = load_attention_memory()

          selected = (
              attention_memory.get(
                  "selected_for_attention",
                  [],
              )
          )

          monitored = (
              attention_memory.get(
                  "monitoring",
                  [],
              )
          )

          candidates = selected + monitored

          # Avoid duplicates.
          unique = {}

          for item in candidates:
              item_id = (
                  item.get("id")
                  or item.get("title")
                  or str(len(unique))
              )

              unique[str(item_id)] = item

          candidates = list(unique.values())


          # ------------------------------------------------------------
          # Extract concepts
          # ------------------------------------------------------------

          analyzed = []

          for item in candidates:
              title = item.get("title", "")
              attention = item.get("attention", {})

              concepts = detect_concepts(title)

              analyzed.append(
                  {
                      "id": item.get("id"),
                      "title": title,
                      "author": item.get("author"),
                      "attention_score": attention.get(
                          "score",
                          0,
                      ),
                      "dominant_domain": attention.get(
                          "dominant_domain",
                          "unknown",
                      ),
                      "concepts": concepts,
                  }
              )


          # ------------------------------------------------------------
          # Compare selected observations
          # ------------------------------------------------------------

          relationships = []
          relation_counts = defaultdict(int)

          for i in range(len(analyzed)):
              for j in range(i + 1, len(analyzed)):

                  a = analyzed[i]
                  b = analyzed[j]

                  concepts_a = a["concepts"]
                  concepts_b = b["concepts"]

                  if not concepts_a or not concepts_b:
                      continue

                  conceptual = group_relationships(
                      concepts_a,
                      concepts_b,
                  )

                  overlap = semantic_overlap(
                      a["title"],
                      b["title"],
                  )

                  if conceptual or overlap >= 0.12:

                      confidence = 0.0

                      if conceptual:
                          confidence = max(
                              r["confidence"]
                              for r in conceptual
                          )

                      if overlap >= 0.12:
                          confidence = max(
                              confidence,
                              min(
                                  0.95,
                                  0.50 + overlap,
                              ),
                          )

                      relation = {
                          "item_a": {
                              "id": a["id"],
                              "title": a["title"],
                          },
                          "item_b": {
                              "id": b["id"],
                              "title": b["title"],
                          },
                          "shared_concepts": list(
                              set(a["concepts"])
                              & set(b["concepts"])
                          ),
                          "relationships": conceptual,
                          "text_overlap": round(
                              overlap,
                              3,
                          ),
                          "confidence": round(
                              confidence,
                              3,
                          ),
                      }

                      relationships.append(relation)

                      for r in conceptual:
                          relation_counts[
                              r.get(
                                  "relation",
                                  r.get("type", "unknown"),
                              )
                          ] += 1


          # ------------------------------------------------------------
          # Build concept graph
          # ------------------------------------------------------------

          graph = defaultdict(
              lambda: {
                  "mentions": 0,
                  "connected_to": defaultdict(int),
              }
          )

          for item in analyzed:
              groups = list(
                  item["concepts"].keys()
              )

              for group in groups:
                  graph[group]["mentions"] += 1

              for i in range(len(groups)):
                  for j in range(i + 1, len(groups)):
                      a = groups[i]
                      b = groups[j]

                      graph[a]["connected_to"][b] += 1
                      graph[b]["connected_to"][a] += 1


          graph_output = {}

          for concept, data in graph.items():
              graph_output[concept] = {
                  "mentions": data["mentions"],
                  "connected_to": dict(
                      data["connected_to"]
                  ),
              }


          # ------------------------------------------------------------
          # Identify emerging relationships
          # ------------------------------------------------------------

          strongest = sorted(
              relationships,
              key=lambda r: (
                  r["confidence"],
                  len(r["relationships"]),
                  r["text_overlap"],
              ),
              reverse=True,
          )[:15]


          # ------------------------------------------------------------
          # Create relationship hypotheses
          # ------------------------------------------------------------

          hypotheses = []

          for relation, count in sorted(
              relation_counts.items(),
              key=lambda x: x[1],
              reverse=True,
          )[:10]:

              hypotheses.append(
                  {
                      "hypothesis": relation,
                      "supporting_observations": count,
                      "status": "hypothesis",
                      "confidence": min(
                          0.95,
                          0.55 + (count * 0.08),
                      ),
                  }
              )


          # ------------------------------------------------------------
          # Persist ACT27 memory
          # ------------------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()

          output = {
              "act": "ACT27",
              "name": "Relational Understanding",
              "timestamp": now,
              "gemini_used": False,
              "purpose": (
                  "Understand relationships between events "
                  "selected by ACT26."
              ),
              "principle": (
                  "Events should not be interpreted only "
                  "individually; their relationships can "
                  "provide additional meaning."
              ),
              "source_act": "ACT26",
              "input_selected": len(selected),
              "input_monitored": len(monitored),
              "concepts_detected": graph_output,
              "relationships_found": len(
                  relationships
              ),
              "strongest_relationships": strongest,
              "relationship_hypotheses": hypotheses,
              "relation_counts": dict(
                  relation_counts
              ),
              "concept_graph": graph_output,
              "next_cognitive_step": (
                  "ACT28 should use these relationships "
                  "to construct possible future scenarios "
                  "before action."
              ),
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("========================================")
          print("NØX ACT27 - RELATIONAL UNDERSTANDING")
          print("========================================")
          print(
              f"ACT26 selected: {len(selected)}"
          )
          print(
              f"ACT26 monitored: {len(monitored)}"
          )
          print(
              f"Items analyzed: {len(analyzed)}"
          )
          print(
              f"Relationships found: "
              f"{len(relationships)}"
          )
          print(
              f"Concepts detected: "
              f"{len(graph_output)}"
          )
          print("----------------------------------------")

          for index, relation in enumerate(
              strongest[:10],
              1,
          ):
              a = relation["item_a"]["title"]
              b = relation["item_b"]["title"]

              print(
                  f"[{index}] "
                  f"{relation['confidence']:.2f} "
                  f"{a} <-> {b}"
              )

              for r in relation[
                  "relationships"
              ][:2]:
                  print(
                      "    ->",
                      r.get(
                          "relation",
                          r.get("type"),
                      ),
                  )

          print("----------------------------------------")

          if hypotheses:
              print("RELATIONSHIP HYPOTHESES:")

              for hypothesis in hypotheses:
                  print(
                      "-",
                      hypothesis["hypothesis"],
                      "| support:",
                      hypothesis[
                          "supporting_observations"
                      ],
                      "| confidence:",
                      round(
                          hypothesis[
                              "confidence"
                          ],
                          2,
                      ),
                  )

          print("----------------------------------------")
          print(
              f"Memory written: {OUTPUT_FILE}"
          )
          PY

      - name: Commit ACT27 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_27_relational_understanding.json

          if git diff --cached --quiet; then
            echo "No ACT27 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT27: relational understanding memory"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT27 memory pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to push ACT27 memory after 3 attempts."
          exit 1
