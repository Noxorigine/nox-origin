name: NØX ACT 10 Priority Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-10-priority-learning
  cancel-in-progress: false

jobs:
  priority-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX ACT 10 Priority Learning
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = "https://thecolony.ai"

          MEMORY_FILE = Path(
              "memory/nox_act_10_priority_learning.json"
          )

          # ============================================================
          # NØX PRIORITY COEFFICIENTS
          # ============================================================

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          # ============================================================
          # SIGNALS USED TO CLASSIFY OBSERVED CONTENT
          # ============================================================

          KEYWORDS = {
              "virtual_economy": [
                  "economy",
                  "economic",
                  "market",
                  "marketplace",
                  "payment",
                  "payments",
                  "reward",
                  "reputation",
                  "trade",
                  "task",
                  "tasks",
                  "value",
                  "commerce",
                  "earning",
              ],

              "cybersecurity": [
                  "security",
                  "cybersecurity",
                  "cyber",
                  "privacy",
                  "authentication",
                  "authorization",
                  "identity",
                  "trust",
                  "verification",
                  "fraud",
                  "attack",
                  "vulnerability",
                  "safety",
                  "secure",
              ],

              "ai_communities": [
                  "community",
                  "communities",
                  "agent",
                  "agents",
                  "collaboration",
                  "cooperation",
                  "communication",
                  "network",
                  "colony",
                  "discussion",
                  "knowledge",
                  "sharing",
                  "coordination",
              ],

              "agent_intelligence_autonomy": [
                  "intelligence",
                  "autonomy",
                  "autonomous",
                  "reasoning",
                  "learning",
                  "memory",
                  "decision",
                  "decisions",
                  "planning",
                  "adaptation",
                  "self-improvement",
                  "capability",
                  "capabilities",
                  "reflection",
              ],

              "emerging_technologies": [
                  "technology",
                  "technologies",
                  "innovation",
                  "emerging",
                  "robotics",
                  "blockchain",
                  "protocol",
                  "protocols",
                  "infrastructure",
                  "model",
                  "models",
                  "artificial intelligence",
                  "ai",
              ],
          }

          # ============================================================
          # HELPERS
          # ============================================================

          def utc_now():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def empty_memory():
              return {
                  "version": "NØX ACT 10 Priority Learning",
                  "runs": [],
                  "decisions": [],
                  "learning": {
                      "domain_observations": {
                          domain: 0
                          for domain in PRIORITIES
                      }
                  },
                  "priority_model": PRIORITIES,
                  "capabilities": {
                      "observe": True,
                      "collect": True,
                      "classify": True,
                      "score": True,
                      "prioritize": True,
                      "persistent_memory": True,
                      "learn_from_observations": True,
                      "autonomous_publication": False,
                      "autonomous_comments": False,
                      "autonomous_dm": False,
                      "marketplace": False,
                      "payments": False,
                      "gemini": False,
                      "external_ai_model": False,
                      "human_trigger": True,
                      "project_cost_eur": 0
                  }
              }


          def load_memory():
              if not MEMORY_FILE.exists():
                  return empty_memory()

              try:
                  data = json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if not isinstance(data, dict):
                      return empty_memory()

                  return data

              except Exception:
                  return empty_memory()


          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )


          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "feed",
                      "suggestions"
                  ):
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []


          def get_text(item):
              if not isinstance(item, dict):
                  return ""

              fields = (
                  "title",
                  "body",
                  "content",
                  "text",
                  "description",
                  "name"
              )

              parts = []

              for field in fields:
                  value = item.get(field)

                  if value is not None:
                      parts.append(
                          str(value)
                      )

              return " ".join(parts).lower()


          def calculate_score(item):
              text = get_text(item)

              raw_scores = {}
              weighted_scores = {}

              for domain, words in KEYWORDS.items():

                  matches = 0

                  for word in words:
                      if word.lower() in text:
                          matches += 1

                  raw_scores[domain] = matches

                  weighted_scores[domain] = (
                      matches
                      * PRIORITIES[domain]
                  )

              total_score = sum(
                  weighted_scores.values()
              )

              return {
                  "raw_scores": raw_scores,
                  "weighted_scores": weighted_scores,
                  "total_score": total_score
              }


          # ============================================================
          # START
          # ============================================================

          print("=" * 70)
          print("NØX ACT 10 - PRIORITY LEARNING")
          print("=" * 70)
          print("Gemini: DISABLED")
          print("External AI model: NONE")
          print("Publication: DISABLED")
          print("Comments: DISABLED")
          print("DM: DISABLED")
          print("Marketplace: DISABLED")
          print("Payments: DISABLED")
          print("Project cost: 0 EUR")
          print("")

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          memory = load_memory()

          # ============================================================
          # 1. AUTHENTICATION
          # ============================================================

          auth = requests.post(
              f"{BASE_URL}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json"
              },
              json={
                  "api_key": api_key
              },
              timeout=30
          )

          print(
              f"Authentication status: "
              f"{auth.status_code}"
          )

          auth.raise_for_status()

          token = auth.json().get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          headers = {
              "Authorization": (
                  f"Bearer {token}"
              ),
              "Accept": "application/json",
              "Content-Type": "application/json"
          }

          # ============================================================
          # 2. OBSERVE PERSONALIZED FEED
          # ============================================================

          feed_response = requests.get(
              f"{BASE_URL}/api/v1/feed/for-you?limit=50",
              headers=headers,
              timeout=30
          )

          print(
              f"Feed status: "
              f"{feed_response.status_code}"
          )

          feed_response.raise_for_status()

          feed_items = extract_items(
              feed_response.json()
          )

          print(
              f"Feed observations: "
              f"{len(feed_items)}"
          )

          # ============================================================
          # 3. OBSERVE SUGGESTIONS
          # ============================================================

          suggestions_response = requests.get(
              f"{BASE_URL}/api/v1/suggestions?limit=30",
              headers=headers,
              timeout=30
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_response.raise_for_status()

          suggestion_items = extract_items(
              suggestions_response.json()
          )

          print(
              f"Suggestion observations: "
              f"{len(suggestion_items)}"
          )

          # ============================================================
          # 4. CLASSIFY AND SCORE ALL OBSERVATIONS
          # ============================================================

          candidates = []

          for source, items in (
              ("feed", feed_items),
              ("suggestions", suggestion_items)
          ):

              for index, item in enumerate(items):

                  if not isinstance(item, dict):
                      continue

                  scoring = calculate_score(
                      item
                  )

                  title = str(
                      item.get(
                          "title",
                          item.get(
                              "name",
                              "Untitled"
                          )
                      )
                  )

                  candidates.append({
                      "source": source,
                      "index": index,
                      "title": title,
                      "scoring": scoring
                  })

          print(
              f"Total candidates: "
              f"{len(candidates)}"
          )

          # ============================================================
          # 5. PRIORITY DECISION
          # ============================================================

          candidates.sort(
              key=lambda candidate: (
                  candidate[
                      "scoring"
                  ][
                      "total_score"
                  ],
                  candidate["source"],
                  candidate["index"]
              ),
              reverse=True
          )

          selected = (
              candidates[0]
              if candidates
              else None
          )

          if selected:

              selected_title = (
                  selected["title"]
              )

              selected_source = (
                  selected["source"]
              )

              selected_scoring = (
                  selected["scoring"]
              )

          else:

              selected_title = None
              selected_source = None

              selected_scoring = {
                  "raw_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "weighted_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "total_score": 0
              }

          weighted_scores = (
              selected_scoring[
                  "weighted_scores"
              ]
          )

          dominant_domain = max(
              weighted_scores,
              key=weighted_scores.get
          )

          if (
              weighted_scores[
                  dominant_domain
              ] == 0
          ):
              dominant_domain = "none"

          # ============================================================
          # 6. DISPLAY DECISION
          # ============================================================

          print("")
          print("=" * 70)
          print("NØX PRIORITY DECISION")
          print("=" * 70)

          if selected:

              print(
                  f"Selected source: "
                  f"{selected_source}"
              )

              print(
                  f"Selected subject: "
                  f"{selected_title}"
              )

              print(
                  f"Priority score: "
                  f"{selected_scoring['total_score']}"
              )

          else:

              print(
                  "No usable candidate found."
              )

          print(
              f"Dominant domain: "
              f"{dominant_domain}"
          )

          print("")
          print("Priority coefficients:")

          for domain, coefficient in PRIORITIES.items():
              print(
                  f"  {domain}: "
                  f"{coefficient}%"
              )

          print("")
          print("Weighted scores:")

          for domain in PRIORITIES:
              print(
                  f"  {domain}: "
                  f"{weighted_scores[domain]}"
              )

          # ============================================================
          # 7. RECORD DECISION
          # ============================================================

          decision = {
              "timestamp": utc_now(),
              "selected": selected is not None,
              "selected_title": selected_title,
              "selected_source": selected_source,
              "priority_score": (
                  selected_scoring[
                      "total_score"
                  ]
              ),
              "dominant_domain": dominant_domain,
              "raw_scores": (
                  selected_scoring[
                      "raw_scores"
                  ]
              ),
              "weighted_scores": weighted_scores,
              "priority_coefficients": PRIORITIES,
              "candidate_count": len(candidates),
              "gemini_used": False,
              "external_ai_model_used": False,
              "project_cost_eur": 0
          }

          memory.setdefault(
              "decisions",
              []
          ).append(decision)

          memory["decisions"] = (
              memory["decisions"][-100:]
          )

          # ============================================================
          # 8. LEARNING MEMORY
          # ============================================================

          learning = memory.setdefault(
              "learning",
              {}
          )

          domain_observations = (
              learning.setdefault(
                  "domain_observations",
                  {}
              )
          )

          for domain in PRIORITIES:

              current = domain_observations.get(
                  domain,
                  0
              )

              domain_observations[domain] = (
                  current
                  + selected_scoring[
                      "raw_scores"
                  ][domain]
              )

          learning["last_observation"] = {
              "timestamp": utc_now(),
              "feed_items": len(feed_items),
              "suggestion_items": len(
                  suggestion_items
              ),
              "candidate_count": len(
                  candidates
              )
          }

          learning["last_priority"] = {
              "domain": dominant_domain,
              "score": (
                  selected_scoring[
                      "total_score"
                  ]
              ),
              "title": selected_title
          }

          learning["total_runs"] = (
              len(
                  memory.get(
                      "runs",
                      []
                  )
              ) + 1
          )

          # ============================================================
          # 9. RUN MEMORY
          # ============================================================

          run_record = {
              "timestamp": utc_now(),
              "status": "SUCCESS",
              "feed_items": len(feed_items),
              "suggestions": len(
                  suggestion_items
              ),
              "candidates": len(candidates),
              "selected_title": selected_title,
              "selected_source": selected_source,
              "dominant_domain": dominant_domain,
              "priority_score": (
                  selected_scoring[
                      "total_score"
                  ]
              ),
              "gemini_used": False,
              "external_ai_model_used": False,
              "project_cost_eur": 0
          }

          memory.setdefault(
              "runs",
              []
          ).append(run_record)

          memory["runs"] = (
              memory["runs"][-100:]
          )

          memory["last_run"] = run_record

          # ============================================================
          # 10. CAPABILITIES AND SAFETY SCOPE
          # ============================================================

          memory["capabilities"] = {
              "observe": True,
              "collect": True,
              "classify": True,
              "score": True,
              "prioritize": True,
              "persistent_memory": True,
              "learn_from_observations": True,

              "autonomous_publication": False,
              "autonomous_comments": False,
              "autonomous_dm": False,

              "marketplace": False,
              "payments": False,

              "gemini": False,
              "external_ai_model": False,

              "human_trigger": True,
              "project_cost_eur": 0
          }

          memory["priority_model"] = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15
          }

          memory["version"] = (
              "NØX ACT 10 Priority Learning"
          )

          # ============================================================
          # 11. SAVE MEMORY
          # ============================================================

          save_memory(memory)

          print("")
          print("=" * 70)
          print(
              "NØX ACT 10 PRIORITY LEARNING SUCCESS"
          )
          print("=" * 70)

          print(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      # ================================================================
      # 12. COMMIT AND SYNCHRONIZE MEMORY WITH MAIN
      # ================================================================

      - name: Commit NØX ACT 10 learning memory
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_10_priority_learning.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT 10: priority learning"

          echo "Synchronizing with origin/main..."

          git fetch origin main
          git rebase origin/main

          echo "Pushing NØX ACT 10 memory..."

          git push origin HEAD:main

          echo "NØX ACT 10 memory successfully synchronized."
