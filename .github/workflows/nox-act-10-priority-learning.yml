name: NØX ACT 10 Priority Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-10-priority-learning
  cancel-in-progress: false

jobs:
  priority-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX priority learning
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE = "https://thecolony.ai"

          MEMORY_FILE = Path(
              "memory/nox_act_10_priority_learning.json"
          )

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          DOMAIN_KEYWORDS = {
              "virtual_economy": [
                  "economy",
                  "marketplace",
                  "market",
                  "payment",
                  "payments",
                  "value",
                  "reward",
                  "reputation",
                  "trade",
                  "task",
                  "tasks",
                  "commerce",
                  "economic",
              ],
              "cybersecurity": [
                  "security",
                  "cybersecurity",
                  "cyber",
                  "privacy",
                  "authentication",
                  "authorization",
                  "identity",
                  "trust",
                  "verification",
                  "fraud",
                  "attack",
                  "vulnerability",
                  "safety",
              ],
              "ai_communities": [
                  "community",
                  "communities",
                  "agents",
                  "agent",
                  "collaboration",
                  "cooperation",
                  "social",
                  "network",
                  "colony",
                  "discussion",
                  "communication",
                  "knowledge sharing",
              ],
              "agent_intelligence_autonomy": [
                  "intelligence",
                  "autonomy",
                  "autonomous",
                  "reasoning",
                  "learning",
                  "memory",
                  "decision",
                  "decision-making",
                  "planning",
                  "adaptation",
                  "self-improvement",
                  "agent capability",
                  "agent capabilities",
              ],
              "emerging_technologies": [
                  "technology",
                  "technologies",
                  "innovation",
                  "emerging",
                  "robotics",
                  "blockchain",
                  "protocol",
                  "protocols",
                  "infrastructure",
                  "model",
                  "models",
                  "ai",
                  "artificial intelligence",
              ],
          }

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "version": "NØX ACT 10 Priority Learning",
                      "runs": [],
                      "decisions": [],
                  }

              try:
                  return json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return {
                      "version": "NØX ACT 10 Priority Learning",
                      "runs": [],
                      "decisions": [],
                  }

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  return (
                      data.get("items")
                      or data.get("posts")
                      or data.get("feed")
                      or data.get("suggestions")
                      or []
                  )

              return []

          def text_from_item(item):
              if not isinstance(item, dict):
                  return ""

              parts = []

              for key in [
                  "title",
                  "body",
                  "content",
                  "description",
                  "text",
                  "name",
              ]:
                  value = item.get(key)

                  if value is not None:
                      parts.append(str(value))

              return " ".join(parts).lower()

          def score_item(item):
              text = text_from_item(item)

              scores = {}

              for domain, keywords in DOMAIN_KEYWORDS.items():
                  score = 0

                  for keyword in keywords:
                      if keyword.lower() in text:
                          score += 1

                  scores[domain] = score

              weighted_scores = {}

              for domain, raw_score in scores.items():
                  priority = PRIORITIES[domain]

                  weighted_scores[domain] = (
                      raw_score * priority
                  )

              total = sum(
                  weighted_scores.values()
              )

              return {
                  "raw_scores": scores,
                  "weighted_scores": weighted_scores,
                  "total_score": total,
              }

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          memory = load_memory()

          print("======================================")
          print("NØX ACT 10 PRIORITY LEARNING")
          print("======================================")

          print("Priority coefficients:")

          for domain, priority in PRIORITIES.items():
              print(
                  f"- {domain}: {priority}%"
              )

          # --------------------------------------------------
          # 1. AUTHENTICATION
          # --------------------------------------------------

          auth = requests.post(
              f"{BASE}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              f"Auth status: {auth.status_code}"
          )

          auth.raise_for_status()

          token = auth.json().get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          # --------------------------------------------------
          # 2. OBSERVE FEED
          # --------------------------------------------------

          feed = requests.get(
              f"{BASE}/api/v1/feed/for-you?limit=50",
              headers=headers,
              timeout=30,
          )

          print(
              f"Feed status: {feed.status_code}"
          )

          feed.raise_for_status()

          feed_items = extract_items(
              feed.json()
          )

          print(
              f"Observed feed items: {len(feed_items)}"
          )

          # --------------------------------------------------
          # 3. OBSERVE SUGGESTIONS
          # --------------------------------------------------

          suggestions = requests.get(
              f"{BASE}/api/v1/suggestions?limit=30",
              headers=headers,
              timeout=30,
          )

          print(
              f"Suggestions status: "
              f"{suggestions.status_code}"
          )

          suggestions.raise_for_status()

          suggestion_items = extract_items(
              suggestions.json()
          )

          print(
              "Observed suggestions: "
              f"{len(suggestion_items)}"
          )

          # --------------------------------------------------
          # 4. COMBINE OBSERVATIONS
          # --------------------------------------------------

          candidates = []

          for source, items in [
              ("feed", feed_items),
              ("suggestions", suggestion_items),
          ]:
              for index, item in enumerate(items):
                  if not isinstance(item, dict):
                      continue

                  scoring = score_item(item)

                  candidates.append({
                      "source": source,
                      "index": index,
                      "item": item,
                      "scoring": scoring,
                  })

          print(
              f"Total candidates: {len(candidates)}"
          )

          # --------------------------------------------------
          # 5. PRIORITY DECISION
          # --------------------------------------------------

          if candidates:
              candidates.sort(
                  key=lambda x: (
                      x["scoring"]["total_score"],
                      x["source"],
                      x["index"],
                  ),
                  reverse=True
              )

              selected = candidates[0]

              selected_item = selected["item"]

              selected_title = str(
                  selected_item.get(
                      "title",
                      "Untitled"
                  )
              )

              selected_score = selected[
                  "scoring"
              ]

          else:
              selected = None
              selected_item = {}
              selected_title = None
              selected_score = {
                  "raw_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "weighted_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "total_score": 0,
              }

          print("======================================")
          print("NØX PRIORITY DECISION")
          print("======================================")

          if selected:
              print(
                  f"Selected source: "
                  f"{selected['source']}"
              )

              print(
                  f"Selected title: "
                  f"{selected_title}"
              )

              print(
                  "Priority score: "
                  f"{selected_score['total_score']}"
              )

              print("Domain scores:")

              for domain in PRIORITIES:
                  print(
                      f"- {domain}: "
                      f"{selected_score['weighted_scores'][domain]}"
                  )

          else:
              print(
                  "No candidate produced a "
                  "positive priority signal."
              )

          # --------------------------------------------------
          # 6. DETERMINE DOMINANT DOMAIN
          # --------------------------------------------------

          weighted_scores = (
              selected_score["weighted_scores"]
          )

          dominant_domain = max(
              weighted_scores,
              key=weighted_scores.get
          )

          dominant_score = weighted_scores[
              dominant_domain
          ]

          if dominant_score == 0:
              dominant_domain = "none"

          print(
              f"Dominant domain: "
              f"{dominant_domain}"
          )

          # --------------------------------------------------
          # 7. LEARNING RECORD
          # --------------------------------------------------

          decision = {
              "timestamp": now(),
              "selected": bool(selected),
              "selected_title": selected_title,
              "selected_source": (
                  selected["source"]
                  if selected
                  else None
              ),
              "priority_score": (
                  selected_score["total_score"]
              ),
              "dominant_domain": dominant_domain,
              "raw_scores": (
                  selected_score["raw_scores"]
              ),
              "weighted_scores": (
                  selected_score["weighted_scores"]
              ),
              "coefficients": PRIORITIES,
              "candidate_count": len(candidates),
              "project_cost_eur": 0,
          }

          memory.setdefault(
              "decisions",
              []
          ).append(decision)

          memory["decisions"] = (
              memory["decisions"][-100:]
          )

          run_record = {
              "timestamp": now(),
              "status": "SUCCESS",
              "feed_items": len(feed_items),
              "suggestions": len(
                  suggestion_items
              ),
              "candidates": len(candidates),
              "selected_title": selected_title,
              "dominant_domain": dominant_domain,
              "project_cost_eur": 0,
          }

          memory.setdefault(
              "runs",
              []
          ).append(run_record)

          memory["runs"] = (
              memory["runs"][-100:]
          )

          memory["last_run"] = run_record

          memory["priority_model"] = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          memory["learning_scope"] = {
              "observe": True,
              "score": True,
              "prioritize": True,
              "learn_from_results": True,
              "publish": False,
              "comments": False,
              "dm": False,
              "marketplace": False,
              "payments": False,
              "gemini_required": False,
              "human_trigger": True,
              "project_cost_eur": 0,
          }

          save_memory(memory)

          print("======================================")
          print(
              "NØX ACT 10 PRIORITY LEARNING SUCCESS"
          )
          print("======================================")

          print(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit NØX learning memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_10_priority_learning.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT 10: priority learning"
          git push
