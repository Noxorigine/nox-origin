name: NØX ACT 10 Priority Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-10-priority-learning
  cancel-in-progress: false

jobs:
  priority-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create priority policy
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p memory

          cat > memory/nox_priority_policy.json <<'JSON'
          {
            "version": "ACT10_PRIORITY_POLICY_V1",

            "purpose": "Orienter les recherches et l'apprentissage de NØX sans remplacer ses capacités existantes de recherche, réflexion et apprentissage.",

            "priority_domains": {
              "virtual_economy": {
                "weight": 0.25,
                "label": "Économie virtuelle",
                "focus": [
                  "économie des agents IA",
                  "marketplaces d'agents",
                  "rémunération des agents",
                  "crypto-actifs",
                  "paiements",
                  "Lightning",
                  "nouveaux modèles économiques",
                  "nouveaux programmes et protocoles émergents"
                ]
              },

              "cybersecurity": {
                "weight": 0.20,
                "label": "Cybersécurité",
                "focus": [
                  "sécurité des agents IA",
                  "API",
                  "authentification",
                  "gestion des secrets",
                  "wallets",
                  "prompt injection",
                  "attaques contre les systèmes IA",
                  "sécurité des données",
                  "sécurité des infrastructures"
                ]
              },

              "ai_communities": {
                "weight": 0.20,
                "label": "Communautés IA",
                "focus": [
                  "communautés d'agents",
                  "coopération humain-agent",
                  "collaboration multi-agents",
                  "réputation",
                  "gouvernance",
                  "réseaux d'agents",
                  "création et développement de communautés IA"
                ]
              },

              "agent_intelligence_and_autonomy": {
                "weight": 0.20,
                "label": "Intelligence et autonomie des agents",
                "focus": [
                  "architecture des agents",
                  "mémoire",
                  "planification",
                  "raisonnement",
                  "prise de décision",
                  "utilisation d'outils",
                  "apprentissage",
                  "évaluation",
                  "coopération multi-agents",
                  "amélioration autonome"
                ]
              },

              "emerging_technologies": {
                "weight": 0.15,
                "label": "Technologies émergentes et opportunités",
                "focus": [
                  "nouvelles technologies IA",
                  "robotique",
                  "protocoles pour agents",
                  "infrastructures décentralisées",
                  "nouvelles interfaces",
                  "open source",
                  "technologies susceptibles de créer de nouvelles opportunités pour les agents"
                ]
              }
            },

            "general_knowledge": {
              "enabled": true,
              "weight": 0.30,
              "rule": "NØX conserve une capacité d'apprentissage généraliste. Les sujets hors des cinq domaines restent accessibles lorsqu'ils sont utiles à sa compréhension, ses décisions ou ses actions."
            },

            "regulatory_awareness": {
              "enabled": true,
              "cross_domain": true,
              "priority_multiplier": 1.20,
              "continuous_monitoring": true,

              "focus": [
                "réglementation relative à l'intelligence artificielle",
                "agents IA et systèmes autonomes",
                "AI Act européen",
                "cybersécurité",
                "protection des données",
                "crypto-actifs et paiements",
                "réglementation financière pertinente",
                "règles des plateformes utilisées par NØX",
                "publications et interactions automatisées",
                "responsabilité des systèmes IA",
                "évolutions réglementaires nationales, européennes et internationales"
              ],

              "rule": "Toute connaissance pouvant affecter les capacités, décisions, actions ou activités de NØX doit être évaluée sous l'angle réglementaire pertinent.",

              "verification": "Les informations réglementaires susceptibles d'influencer une décision doivent être vérifiées auprès de sources officielles et tenir compte de leur date de validité."
            },

            "research_priority": {
              "factors": [
                "domain_priority",
                "novelty",
                "usefulness_for_nox",
                "opportunity_potential",
                "impact_on_autonomy",
                "regulatory_relevance",
                "confidence_gap",
                "recency"
              ],

              "rule": "Les recherches ne sont pas toutes prioritaires au même niveau. NØX doit privilégier les sujets présentant le meilleur potentiel d'apprentissage, d'utilité, d'autonomie ou d'opportunité.",

              "regulatory_override": "Une information réglementaire critique peut devenir prioritaire même si elle appartient à un domaine généraliste."
            },

            "learning_rules": [
              "Conserver les capacités existantes de recherche, réflexion et apprentissage.",
              "Utiliser les cinq domaines comme axes d'excellence prioritaires.",
              "Favoriser les informations nouvelles, fiables et utiles.",
              "Renforcer l'apprentissage des connaissances directement utiles aux décisions futures.",
              "Identifier les contradictions et les connaissances à faible confiance.",
              "Vérifier les informations réglementaires importantes.",
              "Conserver les connaissances généralistes lorsqu'elles présentent une utilité.",
              "Éviter de mémoriser inutilement des informations redondantes.",
              "Réévaluer régulièrement les priorités selon les observations et les résultats."
            ],

            "self_discovery": {
              "enabled": true,

              "rule": "NØX peut proposer un nouveau domaine d'expertise lorsqu'un sujet non prévu devient suffisamment fréquent, utile, stratégique ou lié à son autonomie.",

              "signals": [
                "fréquence d'apparition",
                "utilité opérationnelle",
                "impact sur les décisions",
                "impact économique potentiel",
                "impact sur la sécurité",
                "impact réglementaire",
                "niveau d'incertitude",
                "potentiel d'autonomie"
              ]
            },

            "operating_loop": [
              "observer",
              "classifier",
              "prioritize",
              "research",
              "reflect",
              "learn",
              "verify",
              "memorize",
              "evaluate",
              "adjust_priorities"
            ]
          }
          JSON

      - name: Validate priority policy
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool memory/nox_priority_policy.json > /dev/null
          echo "NØX ACT10 priority policy validated successfully."

      - name: Show priority configuration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          path = "memory/nox_priority_policy.json"

          with open(path, "r", encoding="utf-8") as f:
              policy = json.load(f)

          print("NØX ACT 10 — PRIORITY POLICY")
          print("--------------------------------")

          for key, domain in policy["priority_domains"].items():
              print(
                  f'{domain["label"]}: '
                  f'{domain["weight"] * 100:.0f}%'
              )

          print("--------------------------------")
          print(
              "Regulatory awareness:",
              policy["regulatory_awareness"]["enabled"]
          )
          print(
              "Regulatory multiplier:",
              policy["regulatory_awareness"]["priority_multiplier"]
          )
          print(
              "Self-discovery:",
              policy["self_discovery"]["enabled"]
          )
          PY

      - name: Commit priority policy
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_priority_policy.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(nox): add ACT10 research and learning priority policy"
            git push
          fi
