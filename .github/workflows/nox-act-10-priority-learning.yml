name: NØX ACT 10 Priority Learning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-act-10-priority-learning
  cancel-in-progress: false

jobs:
  priority-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run NØX ACT 10 Priority Learning
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          BASE_URL = "https://thecolony.ai"

          MEMORY_FILE = Path(
              "memory/nox_act_10_priority_learning.json"
          )

          PRIORITIES = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          KEYWORDS = {
              "virtual_economy": [
                  "economy",
                  "economic",
                  "market",
                  "marketplace",
                  "payment",
                  "payments",
                  "reward",
                  "reputation",
                  "trade",
                  "task",
                  "tasks",
                  "value",
                  "commerce",
              ],
              "cybersecurity": [
                  "security",
                  "cybersecurity",
                  "cyber",
                  "privacy",
                  "authentication",
                  "authorization",
                  "identity",
                  "trust",
                  "verification",
                  "fraud",
                  "attack",
                  "vulnerability",
                  "safety",
              ],
              "ai_communities": [
                  "community",
                  "communities",
                  "agent",
                  "agents",
                  "collaboration",
                  "cooperation",
                  "communication",
                  "network",
                  "colony",
                  "discussion",
                  "knowledge",
                  "sharing",
              ],
              "agent_intelligence_autonomy": [
                  "intelligence",
                  "autonomy",
                  "autonomous",
                  "reasoning",
                  "learning",
                  "memory",
                  "decision",
                  "decision-making",
                  "planning",
                  "adaptation",
                  "self-improvement",
                  "capability",
                  "capabilities",
              ],
              "emerging_technologies": [
                  "technology",
                  "technologies",
                  "innovation",
                  "emerging",
                  "robotics",
                  "blockchain",
                  "protocol",
                  "protocols",
                  "infrastructure",
                  "model",
                  "models",
                  "artificial intelligence",
                  "ai",
              ],
          }

          def timestamp():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not MEMORY_FILE.exists():
                  return {
                      "version": "NØX ACT 10 Priority Learning",
                      "runs": [],
                      "decisions": [],
                  }

              try:
                  return json.loads(
                      MEMORY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return {
                      "version": "NØX ACT 10 Priority Learning",
                      "runs": [],
                      "decisions": [],
                  }

          def save_memory(memory):
              MEMORY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              MEMORY_FILE.write_text(
                  json.dumps(
                      memory,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in [
                      "items",
                      "posts",
                      "feed",
                      "suggestions",
                  ]:
                      value = data.get(key)

                      if isinstance(value, list):
                          return value

              return []

          def item_text(item):
              if not isinstance(item, dict):
                  return ""

              fields = [
                  "title",
                  "body",
                  "content",
                  "text",
                  "description",
                  "name",
              ]

              values = []

              for field in fields:
                  value = item.get(field)

                  if value is not None:
                      values.append(str(value))

              return " ".join(values).lower()

          def score_item(item):
              text = item_text(item)

              raw_scores = {}
              weighted_scores = {}

              for domain, words in KEYWORDS.items():
                  raw_score = 0

                  for word in words:
                      if word.lower() in text:
                          raw_score += 1

                  raw_scores[domain] = raw_score

                  weighted_scores[domain] = (
                      raw_score * PRIORITIES[domain]
                  )

              total_score = sum(
                  weighted_scores.values()
              )

              return {
                  "raw_scores": raw_scores,
                  "weighted_scores": weighted_scores,
                  "total_score": total_score,
              }

          api_key = os.environ.get(
              "COLONY_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing"
              )

          print("========================================")
          print("NØX ACT 10 - PRIORITY LEARNING")
          print("========================================")
          print("Gemini: DISABLED")
          print("Project cost: 0 EUR")
          print("")
          print("Priority coefficients:")

          for domain, value in PRIORITIES.items():
              print(f"  {domain}: {value}%")

          memory = load_memory()

          # ------------------------------------------
          # 1. AUTHENTICATION
          # ------------------------------------------

          auth = requests.post(
              f"{BASE_URL}/api/v1/auth/token",
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              json={
                  "api_key": api_key
              },
              timeout=30,
          )

          print(
              f"Authentication status: "
              f"{auth.status_code}"
          )

          auth.raise_for_status()

          token = auth.json().get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No access token returned"
              )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          # ------------------------------------------
          # 2. OBSERVATION - FEED
          # ------------------------------------------

          feed_response = requests.get(
              f"{BASE_URL}/api/v1/feed/for-you?limit=50",
              headers=headers,
              timeout=30,
          )

          print(
              f"Feed status: "
              f"{feed_response.status_code}"
          )

          feed_response.raise_for_status()

          feed_items = extract_items(
              feed_response.json()
          )

          print(
              f"Observed feed items: "
              f"{len(feed_items)}"
          )

          # ------------------------------------------
          # 3. OBSERVATION - SUGGESTIONS
          # ------------------------------------------

          suggestions_response = requests.get(
              f"{BASE_URL}/api/v1/suggestions?limit=30",
              headers=headers,
              timeout=30,
          )

          print(
              f"Suggestions status: "
              f"{suggestions_response.status_code}"
          )

          suggestions_response.raise_for_status()

          suggestion_items = extract_items(
              suggestions_response.json()
          )

          print(
              f"Observed suggestions: "
              f"{len(suggestion_items)}"
          )

          # ------------------------------------------
          # 4. BUILD CANDIDATES
          # ------------------------------------------

          candidates = []

          for source, items in [
              ("feed", feed_items),
              ("suggestions", suggestion_items),
          ]:
              for index, item in enumerate(items):

                  if not isinstance(item, dict):
                      continue

                  scoring = score_item(item)

                  title = str(
                      item.get(
                          "title",
                          item.get(
                              "name",
                              "Untitled"
                          )
                      )
                  )

                  candidates.append({
                      "source": source,
                      "index": index,
                      "title": title,
                      "scoring": scoring,
                  })

          print(
              f"Total candidates: "
              f"{len(candidates)}"
          )

          # ------------------------------------------
          # 5. PRIORITIZATION
          # ------------------------------------------

          candidates.sort(
              key=lambda candidate: (
                  candidate["scoring"]["total_score"],
                  candidate["source"],
                  candidate["index"],
              ),
              reverse=True
          )

          selected = (
              candidates[0]
              if candidates
              else None
          )

          if selected:
              selected_title = selected["title"]
              selected_source = selected["source"]
              selected_score = selected["scoring"]

              print("")
              print("========================================")
              print("NØX PRIORITY DECISION")
              print("========================================")
              print(
                  f"Selected source: "
                  f"{selected_source}"
              )
              print(
                  f"Selected subject: "
                  f"{selected_title}"
              )
              print(
                  f"Total priority score: "
                  f"{selected_score['total_score']}"
              )

          else:
              selected_title = None
              selected_source = None

              selected_score = {
                  "raw_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "weighted_scores": {
                      domain: 0
                      for domain in PRIORITIES
                  },
                  "total_score": 0,
              }

              print("")
              print(
                  "No candidate available."
              )

          # ------------------------------------------
          # 6. DOMINANT PRIORITY DOMAIN
          # ------------------------------------------

          weighted_scores = (
              selected_score["weighted_scores"]
          )

          dominant_domain = max(
              weighted_scores,
              key=weighted_scores.get
          )

          if weighted_scores[dominant_domain] == 0:
              dominant_domain = "none"

          print(
              f"Dominant domain: "
              f"{dominant_domain}"
          )

          print("")
          print("Weighted scores:")

          for domain in PRIORITIES:
              print(
                  f"  {domain}: "
                  f"{weighted_scores[domain]}"
              )

          # ------------------------------------------
          # 7. LEARNING DECISION
          # ------------------------------------------

          decision = {
              "timestamp": timestamp(),
              "selected": selected is not None,
              "selected_title": selected_title,
              "selected_source": selected_source,
              "priority_score": (
                  selected_score["total_score"]
              ),
              "dominant_domain": dominant_domain,
              "raw_scores": (
                  selected_score["raw_scores"]
              ),
              "weighted_scores": (
                  selected_score["weighted_scores"]
              ),
              "priority_coefficients": PRIORITIES,
              "candidate_count": len(candidates),
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          memory.setdefault(
              "decisions",
              []
          ).append(decision)

          memory["decisions"] = (
              memory["decisions"][-100:]
          )

          # ------------------------------------------
          # 8. RUN MEMORY
          # ------------------------------------------

          run_record = {
              "timestamp": timestamp(),
              "status": "SUCCESS",
              "feed_items": len(feed_items),
              "suggestions": len(
                  suggestion_items
              ),
              "candidate_count": len(candidates),
              "selected_title": selected_title,
              "selected_source": selected_source,
              "dominant_domain": dominant_domain,
              "priority_score": (
                  selected_score["total_score"]
              ),
              "gemini_used": False,
              "project_cost_eur": 0,
          }

          memory.setdefault(
              "runs",
              []
          ).append(run_record)

          memory["runs"] = (
              memory["runs"][-100:]
          )

          memory["last_run"] = run_record

          # ------------------------------------------
          # 9. NØX PRIORITY MODEL
          # ------------------------------------------

          memory["priority_model"] = {
              "virtual_economy": 25,
              "cybersecurity": 20,
              "ai_communities": 20,
              "agent_intelligence_autonomy": 20,
              "emerging_technologies": 15,
          }

          # ------------------------------------------
          # 10. ACT 10 CAPABILITIES
          # ------------------------------------------

          memory["capabilities"] = {
              "observe": True,
              "classify": True,
              "score": True,
              "prioritize": True,
              "learn_from_observations": True,
              "persistent_memory": True,
              "autonomous_publication": False,
              "autonomous_comments": False,
              "autonomous_dm": False,
              "marketplace": False,
              "payments": False,
              "gemini": False,
              "human_trigger": True,
              "project_cost_eur": 0,
          }

          save_memory(memory)

          print("")
          print("========================================")
          print(
              "NØX ACT 10 PRIORITY LEARNING SUCCESS"
          )
          print("========================================")

          print(
              json.dumps(
                  decision,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit NØX ACT 10 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_10_priority_learning.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT 10: priority learning"
          git push
