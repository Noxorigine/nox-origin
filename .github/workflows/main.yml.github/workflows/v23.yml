name: NØX Origin - V23 Hypothesis Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hypothesis-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate NØX hypotheses locally
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          observations = memory.get("observations", [])
          patterns = memory.get("patterns", [])
          knowledge = memory.get("knowledge", [])
          principles = memory.get("principles", [])
          hypotheses = memory.get("hypotheses", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(hypotheses, list):
              hypotheses = []

          if not isinstance(contradictions, list):
              contradictions = []

          now = datetime.now(timezone.utc).isoformat()

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).strip().lower()
              )

          # ---------------------------------------------------------
          # 1. Construire les signaux disponibles
          # ---------------------------------------------------------

          active_topics = {
              p.get("topic")
              for p in patterns
              if isinstance(p, dict) and p.get("topic")
          }

          observation_text = " ".join(
              clean(o.get("text", ""))
              for o in observations
              if isinstance(o, dict)
          )

          # ---------------------------------------------------------
          # 2. Signaux positifs et négatifs
          # ---------------------------------------------------------

          positive_signals = {
              "memory_efficiency": [
                  "context",
                  "memory",
                  "kv cache",
                  "latency",
                  "resource"
              ],
              "verification_security": [
                  "verification",
                  "security",
                  "trust",
                  "validation",
                  "evidence"
              ],
              "bounded_autonomy": [
                  "autonomy",
                  "permission",
                  "capability",
                  "security",
                  "boundary"
              ],
              "verified_learning": [
                  "learning",
                  "trajectory",
                  "feedback",
                  "verification",
                  "successful"
              ]
          }

          # ---------------------------------------------------------
          # 3. Validation prudente
          #
          # Important :
          # Quelques occurrences ne constituent PAS une preuve.
          # V23 distingue :
          #
          # supported  = signaux convergents suffisants
          # uncertain  = signaux insuffisants
          # rejected   = contradiction explicite
          # ---------------------------------------------------------

          validated_hypotheses = []

          for hypothesis in hypotheses:

              if not isinstance(hypothesis, dict):
                  continue

              topic = hypothesis.get("topic", "")
              text = clean(hypothesis.get("hypothesis", ""))

              signals = positive_signals.get(topic, [])

              matched = [
                  signal
                  for signal in signals
                  if signal in observation_text
              ]

              support_score = len(set(matched))

              # Recherche simple de signaux contradictoires.
              contradiction_score = 0

              if topic == "memory_efficiency":
                  if "more context" in observation_text and "better" in observation_text:
                      contradiction_score += 1

              if topic == "verification_security":
                  if "verification" in observation_text and "false positive" in observation_text:
                      contradiction_score += 1

              if topic == "bounded_autonomy":
                  if "autonomy" in observation_text and "unrestricted" in observation_text:
                      contradiction_score += 1

              if topic == "verified_learning":
                  if "unverified" in observation_text and "successful" in observation_text:
                      contradiction_score += 1

              # Verdict conservateur.
              if contradiction_score >= 2 and contradiction_score > support_score:
                  verdict = "rejected"
              elif support_score >= 4 and contradiction_score == 0:
                  verdict = "supported"
              else:
                  verdict = "uncertain"

              validated_hypotheses.append({
                  "topic": topic,
                  "hypothesis": hypothesis.get("hypothesis"),
                  "test": hypothesis.get("test"),
                  "verdict": verdict,
                  "support_score": support_score,
                  "contradiction_score": contradiction_score,
                  "signals_found": matched,
                  "validated_at": now,
                  "method": "local_evidence_validation_v23"
              })

          # ---------------------------------------------------------
          # 4. Résumé global de validation
          # ---------------------------------------------------------

          verdict_counts = {
              "supported": 0,
              "uncertain": 0,
              "rejected": 0
          }

          for item in validated_hypotheses:
              verdict = item["verdict"]

              if verdict in verdict_counts:
                  verdict_counts[verdict] += 1

          validation_state = {
              "updated_at": now,
              "hypotheses_checked": len(validated_hypotheses),
              "supported": verdict_counts["supported"],
              "uncertain": verdict_counts["uncertain"],
              "rejected": verdict_counts["rejected"],
              "method": "local_evidence_validation"
          }

          # ---------------------------------------------------------
          # 5. Mise à jour des hypothèses
          # ---------------------------------------------------------

          for hypothesis in hypotheses:

              if not isinstance(hypothesis, dict):
                  continue

              topic = hypothesis.get("topic")

              matches = [
                  item
                  for item in validated_hypotheses
                  if item.get("topic") == topic
              ]

              if not matches:
                  continue

              result = matches[-1]

              hypothesis["last_verdict"] = result["verdict"]
              hypothesis["support_score"] = result["support_score"]
              hypothesis["contradiction_score"] = result["contradiction_score"]
              hypothesis["validated_at"] = now

          # ---------------------------------------------------------
          # 6. Historique V23
          # ---------------------------------------------------------

          history.append({
              "version": "V23",
              "timestamp": now,
              "observations_total": len(observations),
              "patterns_total": len(patterns),
              "knowledge_total": len(knowledge),
              "principles_total": len(principles),
              "hypotheses_total": len(hypotheses),
              "hypotheses_checked": len(validated_hypotheses),
              "supported": verdict_counts["supported"],
              "uncertain": verdict_counts["uncertain"],
              "rejected": verdict_counts["rejected"],
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_evidence_validation"
          })

          # ---------------------------------------------------------
          # 7. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V23"
          memory["updated_at"] = now
          memory["hypotheses"] = hypotheses
          memory["validation_results"] = validated_hypotheses
          memory["validation_state"] = validation_state
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 8. Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V23")
          print("==========================================")
          print(f"Observations       : {len(observations)}")
          print(f"Patterns           : {len(patterns)}")
          print(f"Knowledge          : {len(knowledge)}")
          print(f"Principles         : {len(principles)}")
          print(f"Hypotheses         : {len(hypotheses)}")
          print(f"Hypotheses checked : {len(validated_hypotheses)}")
          print("------------------------------------------")
          print(f"SUPPORTED          : {verdict_counts['supported']}")
          print(f"UNCERTAIN          : {verdict_counts['uncertain']}")
          print(f"REJECTED           : {verdict_counts['rejected']}")
          print("------------------------------------------")
          print("Validation         : LOCAL")
          print("Gemini             : NON REQUIS")
          print("Cost               : 0 EUR")
          print("==========================================")
          PY

      - name: Commit V23 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V23 hypothesis validation"

          git push
