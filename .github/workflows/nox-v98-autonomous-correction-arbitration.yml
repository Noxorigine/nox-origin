name: NØX V98 — Autonomous Correction Arbitration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v98-autonomous-correction-arbitration
  cancel-in-progress: false

jobs:
  autonomous-correction-arbitration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V98
        run: |
          python - <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          MEMORY = "memory"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(name):
              path = os.path.join(MEMORY, name)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(name, data):
              os.makedirs(MEMORY, exist_ok=True)
              with open(
                  os.path.join(MEMORY, name),
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              try:
                  return json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              except Exception:
                  return str(value)

          def number(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          # ---------------------------------------------------------
          # LOAD LEARNING CHAIN
          # ---------------------------------------------------------

          v97 = load(
              "nox_v97_deployment_result_learning.json"
          )

          v96 = load(
              "nox_v96_controlled_correction_deployment.json"
          )

          v95 = load(
              "nox_v95_controlled_correction_arbitration.json"
          )

          v94 = load(
              "nox_v94_controlled_live_comparison.json"
          )

          v93 = load(
              "nox_v93_autonomous_self_correction_validation.json"
          )

          v92 = load(
              "nox_v92_autonomous_self_correction_proposal.json"
          )

          v91 = load(
              "nox_v91_autonomous_decision_stability.json"
          )

          v90 = load(
              "nox_v90_autonomous_decision_framework.json"
          )

          # ---------------------------------------------------------
          # V97
          # ---------------------------------------------------------

          live_validation = v97.get(
              "live_validation",
              {}
          )

          if not isinstance(live_validation, dict):
              live_validation = {}

          v97_status = text(
              live_validation.get("status")
              or v97.get("answer_status")
          )

          v97_confidence = number(
              live_validation.get("confidence"),
              0
          )

          measurement = v97.get(
              "measurement",
              {}
          )

          if not isinstance(measurement, dict):
              measurement = {}

          total_measured = int(
              number(
                  measurement.get(
                      "total_measured",
                      0
                  )
              )
          )

          changed = int(
              number(
                  measurement.get(
                      "decisions_changed",
                      0
                  )
              )
          )

          useful_changes = int(
              number(
                  measurement.get(
                      "useful_changes",
                      0
                  )
              )
          )

          harmful_changes = int(
              number(
                  measurement.get(
                      "harmful_changes",
                      0
                  )
              )
          )

          baseline_high = int(
              number(
                  measurement.get(
                      "baseline_high_confidence",
                      0
                  )
              )
          )

          controlled_high = int(
              number(
                  measurement.get(
                      "controlled_high_confidence",
                      0
                  )
              )
          )

          baseline_atypical = int(
              number(
                  measurement.get(
                      "baseline_atypical",
                      0
                  )
              )
          )

          controlled_atypical = int(
              number(
                  measurement.get(
                      "controlled_atypical",
                      0
                  )
              )
          )

          baseline_completed = int(
              number(
                  measurement.get(
                      "baseline_completed_excluded",
                      0
                  )
              )
          )

          controlled_completed = int(
              number(
                  measurement.get(
                      "controlled_completed_excluded",
                      0
                  )
              )
          )

          # ---------------------------------------------------------
          # V97 SIGNALS
          # ---------------------------------------------------------

          signals = v97.get(
              "signals",
              {}
          )

          if not isinstance(signals, dict):
              signals = {}

          over_pruning = bool(
              signals.get(
                  "over_pruning",
                  False
              )
          )

          under_pruning = bool(
              signals.get(
                  "under_pruning",
                  False
              )
          )

          deployment_health = text(
              signals.get(
                  "deployment_health"
              )
          )

          # ---------------------------------------------------------
          # V96 CORRECTION
          # ---------------------------------------------------------

          correction = v96.get(
              "correction",
              {}
          )

          if not isinstance(correction, dict):
              correction = {}

          correction_id = text(
              correction.get("id")
          )

          correction_name = text(
              correction.get("name")
          )

          # ---------------------------------------------------------
          # V91 STABILITY
          # ---------------------------------------------------------

          v91_metrics = v91.get(
              "metrics",
              {}
          )

          if not isinstance(v91_metrics, dict):
              v91_metrics = {}

          overall_stability = number(
              v91_metrics.get(
                  "overall_stability",
                  0
              )
          )

          evidence_stability = number(
              v91_metrics.get(
                  "evidence_stability",
                  0
              )
          )

          strategy_stability = number(
              v91_metrics.get(
                  "strategy_stability",
                  0
              )
          )

          # ---------------------------------------------------------
          # V93 / V94
          # ---------------------------------------------------------

          v93_validation = v93.get(
              "validation",
              {}
          )

          if not isinstance(v93_validation, dict):
              v93_validation = {}

          v93_status = text(
              v93_validation.get(
                  "status"
              )
              or v93.get(
                  "answer_status"
              )
              or v93.get(
                  "status"
              )
          )

          v94_validation = v94.get(
              "live_validation",
              {}
          )

          if not isinstance(v94_validation, dict):
              v94_validation = {}

          v94_status = text(
              v94_validation.get(
                  "status"
              )
              or v94.get(
                  "answer_status"
              )
              or v94.get(
                  "status"
              )
          )

          # ---------------------------------------------------------
          # AUTONOMOUS ARBITRATION
          # ---------------------------------------------------------

          score = 0
          reasons = []

          if v97_status == (
              "CONTROLLED_CORRECTION_USEFUL_SIGNAL"
          ):
              score += 35
              reasons.append(
                  "V97 observed a useful live signal."
              )

          elif v97_status == (
              "CONTROLLED_CORRECTION_NEUTRAL"
          ):
              score += 10
              reasons.append(
                  "V97 observed a neutral live result."
              )

          elif v97_status == (
              "CONTROLLED_CORRECTION_REGRESSION_SIGNAL"
          ):
              score -= 45
              reasons.append(
                  "V97 detected a regression signal."
              )

          elif v97_status == (
              "INSUFFICIENT_LIVE_EVIDENCE"
          ):
              score -= 10
              reasons.append(
                  "V97 did not collect sufficient live evidence."
              )

          if useful_changes > 0:
              score += min(
                  25,
                  useful_changes * 10
              )
              reasons.append(
                  "Useful classification changes were observed."
              )

          if harmful_changes == 0:
              score += 15
              reasons.append(
                  "No harmful classification change was observed."
              )
          else:
              score -= min(
                  40,
                  harmful_changes * 20
              )
              reasons.append(
                  "Harmful classification changes were observed."
              )

          if total_measured >= 5:
              score += 5
              reasons.append(
                  "The live sample contained at least five measured items."
              )

          if controlled_completed >= baseline_completed:
              score += 5
              reasons.append(
                  "Completed-work exclusion was preserved or strengthened."
              )
          else:
              score -= 15
              reasons.append(
                  "Completed-work exclusion weakened."
              )

          if controlled_atypical >= baseline_atypical:
              score += 5
              reasons.append(
                  "Atypical opportunity preservation was maintained."
              )

          if over_pruning:
              score -= 15
              reasons.append(
                  "Possible over-pruning was detected."
              )

          if under_pruning:
              score -= 15
              reasons.append(
                  "Possible under-pruning was detected."
              )

          if v97_confidence >= 0.80:
              score += 5
              reasons.append(
                  "V97 confidence is strong."
              )

          if overall_stability >= 0.70:
              score += 5
              reasons.append(
                  "Overall decision stability is strong."
              )

          if evidence_stability >= 0.70:
              score += 5
              reasons.append(
                  "Evidence stability is strong."
              )

          if strategy_stability >= 0.70:
              score += 5
              reasons.append(
                  "Strategy stability is strong."
              )

          score = max(
              0,
              min(100, score)
          )

          # ---------------------------------------------------------
          # AUTONOMOUS DECISION
          # ---------------------------------------------------------

          if harmful_changes > 0:
              decision = "ROLLBACK"
              authority = "ROLLBACK_RECOMMENDED"

          elif (
              score >= 80
              and useful_changes > 0
              and v97_confidence >= 0.70
              and not over_pruning
              and not under_pruning
          ):
              decision = "RETAIN"
              authority = "CONTROLLED_CORRECTION_SUPPORTED"

          elif (
              score >= 60
              and harmful_changes == 0
          ):
              decision = "MAINTAIN_AND_OBSERVE"
              authority = "PROMISING_BUT_NOT_FINAL"

          elif total_measured < 3:
              decision = "COLLECT_MORE_EVIDENCE"
              authority = "INSUFFICIENT_LIVE_EVIDENCE"

          else:
              decision = "REFINE"
              authority = "CORRECTION_REFINEMENT_REQUIRED"

          # ---------------------------------------------------------
          # CONFIDENCE
          # ---------------------------------------------------------

          confidence = min(
              0.95,
              max(
                  0.25,
                  (
                      score / 100
                      + v97_confidence
                      + overall_stability
                  ) / 3
              )
          )

          # ---------------------------------------------------------
          # NEXT VERSION
          # ---------------------------------------------------------

          if decision == "RETAIN":
              next_version = (
                  "V99_AUTONOMOUS_POLICY_STABILIZATION"
              )
              next_purpose = (
                  "Measure whether the retained correction remains "
                  "beneficial across repeated live cycles."
              )

          elif decision == "ROLLBACK":
              next_version = (
                  "V99_AUTONOMOUS_ROLLBACK_VALIDATION"
              )
              next_purpose = (
                  "Verify that returning to the baseline restores "
                  "decision quality."
              )

          elif decision == "REFINE":
              next_version = (
                  "V99_AUTONOMOUS_CORRECTION_REFINEMENT"
              )
              next_purpose = (
                  "Generate a refined correction from the observed "
                  "weakness."
              )

          else:
              next_version = (
                  "V99_AUTONOMOUS_POLICY_STABILIZATION"
              )
              next_purpose = (
                  "Accumulate additional live evidence before "
                  "making a stronger policy decision."
              )

          # ---------------------------------------------------------
          # ARBITRATION QUALITY
          # ---------------------------------------------------------

          if (
              decision == "RETAIN"
              and confidence >= 0.80
          ):
              arbitration_quality = (
                  "CLEAR_AUTONOMOUS_PREFERENCE"
              )

          elif confidence >= 0.65:
              arbitration_quality = (
                  "MODERATE_AUTONOMOUS_PREFERENCE"
              )

          else:
              arbitration_quality = (
                  "UNCERTAIN_AUTONOMOUS_ARBITRATION"
              )

          # ---------------------------------------------------------
          # RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V98",
              "generated_at": now(),
              "mode": "autonomous_correction_arbitration",

              "correction": {
                  "id": correction_id,
                  "name": correction_name
              },

              "evidence_chain": {
                  "v93_status": v93_status,
                  "v94_status": v94_status,
                  "v97_status": v97_status,
                  "v97_confidence": v97_confidence,
                  "v91_overall_stability": overall_stability,
                  "v91_evidence_stability": evidence_stability,
                  "v91_strategy_stability": strategy_stability
              },

              "live_measurement": {
                  "total_measured": total_measured,
                  "decisions_changed": changed,
                  "useful_changes": useful_changes,
                  "harmful_changes": harmful_changes,
                  "baseline_high_confidence": baseline_high,
                  "controlled_high_confidence": controlled_high,
                  "baseline_atypical": baseline_atypical,
                  "controlled_atypical": controlled_atypical,
                  "baseline_completed_excluded": baseline_completed,
                  "controlled_completed_excluded": controlled_completed
              },

              "signals": {
                  "over_pruning": over_pruning,
                  "under_pruning": under_pruning,
                  "deployment_health": deployment_health
              },

              "arbitration": {
                  "score": score,
                  "decision": decision,
                  "authority": authority,
                  "confidence": confidence,
                  "quality": arbitration_quality,
                  "reasons": reasons
              },

              "policy_state": {
                  "current_state": (
                      "CONTROLLED_ACTIVE"
                      if decision != "ROLLBACK"
                      else "ROLLBACK_PENDING"
                  ),
                  "permanent": False,
                  "baseline_preserved": True,
                  "rollback_available": True
              },

              "next_stage": {
                  "version": next_version,
                  "purpose": next_purpose
              },

              "autonomy": {
                  "autonomous_evidence_arbitration": True,
                  "autonomous_correction_evaluation": True,
                  "autonomous_retain_decision": (
                      decision == "RETAIN"
                  ),
                  "autonomous_rollback_recommendation": (
                      decision == "ROLLBACK"
                  ),
                  "autonomous_refinement_decision": (
                      decision == "REFINE"
                  ),
                  "automatic_permanent_deployment": False,
                  "automatic_external_action": False,
                  "human_override": True
              },

              "safety": {
                  "gemini_disabled": True,
                  "external_action": False,
                  "contact": False,
                  "bidding": False,
                  "payment": False,
                  "permanent_self_modification": False,
                  "baseline_preserved": True,
                  "rollback_available": True,
                  "zero_cost_constraint": True,
                  "human_override": True
              },

              "answer_status": (
                  "AUTONOMOUS_CORRECTION_RETAINED"
                  if decision == "RETAIN"
                  else
                  "AUTONOMOUS_ROLLBACK_RECOMMENDED"
                  if decision == "ROLLBACK"
                  else
                  "AUTONOMOUS_CORRECTION_REFINEMENT_REQUIRED"
                  if decision == "REFINE"
                  else
                  "AUTONOMOUS_CORRECTION_OBSERVATION_CONTINUES"
              )
          }

          # ---------------------------------------------------------
          # SAVE JSON
          # ---------------------------------------------------------

          save(
              "nox_v98_autonomous_correction_arbitration.json",
              result
          )

          # ---------------------------------------------------------
          # SAVE MARKDOWN
          # ---------------------------------------------------------

          lines = [
              "# NØX V98 — Autonomous Correction Arbitration",
              "",
              "Generated: "
              + result["generated_at"],
              "",
              "## Correction",
              "",
              "- ID: " + correction_id,
              "- Name: " + correction_name,
              "",
              "## V97 live evidence",
              "",
              "- Status: " + v97_status,
              "- Confidence: " + str(v97_confidence),
              "- Items measured: " + str(total_measured),
              "- Decisions changed: " + str(changed),
              "- Useful changes: " + str(useful_changes),
              "- Harmful changes: " + str(harmful_changes),
              "",
              "## Autonomous arbitration",
              "",
              "- Score: " + str(score) + "/100",
              "- Decision: " + decision,
              "- Authority: " + authority,
              "- Confidence: " + str(confidence),
              "- Quality: " + arbitration_quality,
              "",
              "## Reasons",
              ""
          ]

          for reason in reasons:
              lines.append(
                  "- " + reason
              )

          lines.extend([
              "",
              "## Policy state",
              "",
              "- Baseline preserved: true",
              "- Rollback available: true",
              "- Permanent modification: false",
              "",
              "## Next stage",
              "",
              "- Version: " + next_version,
              "- Purpose: " + next_purpose,
              "",
              "V98 autonomously evaluates the real-world result "
              "of the controlled V96 correction.",
              "",
              "The result can lead to retention, rollback, "
              "refinement or continued observation.",
              "",
              "## Safety",
              "",
              "- Gemini: disabled",
              "- External action: disabled",
              "- Contact: disabled",
              "- Bidding: disabled",
              "- Payment: disabled",
              "- Permanent self-modification: false",
              "- Baseline preserved: true",
              "- Rollback available: true",
              "- Project cost: €0",
              "- Human override: enabled"
          ])

          with open(
              os.path.join(
                  MEMORY,
                  "nox_v98_autonomous_correction_arbitration.md"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          print(
              json.dumps(
                  {
                      "version": "V98",
                      "decision": decision,
                      "score": score,
                      "confidence": confidence,
                      "quality": arbitration_quality,
                      "useful_changes": useful_changes,
                      "harmful_changes": harmful_changes,
                      "next_version": next_version
                  },
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit V98 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v98_autonomous_correction_arbitration.json
          git add memory/nox_v98_autonomous_correction_arbitration.md

          git diff --cached --quiet || \
            git commit -m "NØX V98 autonomous correction arbitration"

          git push
