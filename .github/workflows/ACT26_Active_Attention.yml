name: NØX ACT 26 - Active Attention Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nox-act26-attention
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  active-attention:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT26 Active Attention Engine
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests


          API_KEY = os.environ.get("COLONY_API_KEY")
          if not API_KEY:
              raise RuntimeError("COLONY_API_KEY is missing")

          BASE_URL = "https://thecolony.ai/api/v1"

          HEADERS = {
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          OUTPUT_FILE = MEMORY_DIR / "nox_act_26_active_attention.json"


          def get_json(path, params=None):
              url = f"{BASE_URL}{path}"
              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params,
                  timeout=30,
              )

              if response.status_code == 401:
                  raise RuntimeError(
                      f"Authentication failed for {path}: HTTP 401"
                  )

              response.raise_for_status()

              try:
                  return response.json()
              except Exception:
                  return {}


          def extract_items(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in (
                  "posts",
                  "items",
                  "data",
                  "results",
                  "feed",
              ):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for nested_key in (
                          "posts",
                          "items",
                          "results",
                          "data",
                      ):
                          nested = value.get(nested_key)
                          if isinstance(nested, list):
                              return nested

              return []


          def text_of(item):
              if not isinstance(item, dict):
                  return ""

              fields = (
                  "title",
                  "content",
                  "body",
                  "text",
                  "description",
              )

              parts = []

              for field in fields:
                  value = item.get(field)
                  if isinstance(value, str):
                      parts.append(value)

              return " ".join(parts).strip()


          def number_of(item, *keys):
              if not isinstance(item, dict):
                  return 0.0

              for key in keys:
                  value = item.get(key)
                  try:
                      return float(value)
                  except (TypeError, ValueError):
                      continue

              return 0.0


          def normalize(text):
              text = text.lower()
              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"[^a-z0-9àâçéèêëîïôûùüÿñæœ' -]", " ", text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()


          # ------------------------------------------------------------
          # ACT26 ATTENTION MODEL
          #
          # The goal is NOT to react to everything.
          # The goal is to decide what deserves attention.
          # ------------------------------------------------------------

          DOMAIN_WEIGHTS = {
              "ai_agents": 25,
              "autonomy": 25,
              "ai_communities": 18,
              "virtual_economy": 12,
              "cybersecurity": 10,
              "emerging_technology": 10,
          }

          ATTENTION_KEYWORDS = {
              "ai_agents": [
                  "ai agent",
                  "ai agents",
                  "agent",
                  "agents",
                  "autonomous agent",
                  "agentic",
                  "multi-agent",
                  "agent collaboration",
              ],
              "autonomy": [
                  "autonomy",
                  "autonomous",
                  "self improvement",
                  "self-improvement",
                  "decision",
                  "decision making",
                  "strategy",
                  "planning",
                  "learning",
                  "memory",
                  "reasoning",
              ],
              "ai_communities": [
                  "agent exchange",
                  "colony",
                  "community",
                  "collaboration",
                  "reputation",
                  "trust",
                  "communication",
                  "knowledge sharing",
              ],
              "virtual_economy": [
                  "marketplace",
                  "market",
                  "task",
                  "tasks",
                  "bounty",
                  "reward",
                  "payment",
                  "economy",
                  "earnings",
                  "sats",
                  "bitcoin",
                  "lightning",
              ],
              "cybersecurity": [
                  "security",
                  "cybersecurity",
                  "vulnerability",
                  "authentication",
                  "credential",
                  "privacy",
                  "attack",
                  "exploit",
              ],
              "emerging_technology": [
                  "technology",
                  "robotics",
                  "research",
                  "innovation",
                  "protocol",
                  "infrastructure",
                  "open source",
              ],
          }

          NOVELTY_TERMS = [
              "new",
              "newly",
              "first",
              "breaking",
              "discovery",
              "experiment",
              "prototype",
              "proposal",
              "update",
              "unexpected",
              "lesson",
              "result",
              "failure",
              "success",
          ]

          UNCERTAINTY_TERMS = [
              "unknown",
              "unclear",
              "uncertain",
              "question",
              "why",
              "how",
              "could",
              "might",
              "perhaps",
              "does anyone know",
          ]

          ACTION_TERMS = [
              "task",
              "request",
              "help",
              "looking for",
              "need",
              "offer",
              "challenge",
              "proposal",
              "collaborate",
              "collaboration",
          ]


          def keyword_hits(text, keywords):
              return [
                  keyword
                  for keyword in keywords
                  if keyword in text
              ]


          def classify(text):
              scores = {}
              hits = {}

              for domain, keywords in ATTENTION_KEYWORDS.items():
                  found = keyword_hits(text, keywords)
                  hits[domain] = found

                  if found:
                      base = DOMAIN_WEIGHTS[domain]
                      scores[domain] = min(
                          30,
                          base + min(10, len(found) * 2),
                      )
                  else:
                      scores[domain] = 0

              dominant = max(scores, key=scores.get)

              if scores[dominant] == 0:
                  dominant = "general"

              return dominant, scores, hits


          def attention_score(item):
              text = text_of(item)
              normalized = normalize(text)

              if not normalized:
                  return {
                      "score": 0,
                      "decision": "ignore",
                      "reason": "no_meaningful_text",
                  }

              dominant, domain_scores, hits = classify(normalized)

              relevance = min(30, max(domain_scores.values()))

              novelty_hits = keyword_hits(
                  normalized,
                  NOVELTY_TERMS,
              )
              novelty = min(
                  20,
                  len(novelty_hits) * 5,
              )

              uncertainty_hits = keyword_hits(
                  normalized,
                  UNCERTAINTY_TERMS,
              )
              uncertainty = min(
                  15,
                  len(uncertainty_hits) * 5,
              )

              action_hits = keyword_hits(
                  normalized,
                  ACTION_TERMS,
              )
              actionability = min(
                  15,
                  len(action_hits) * 5,
              )

              engagement = number_of(
                  item,
                  "score",
                  "karma",
                  "upvotes",
                  "likes",
              )

              engagement_signal = min(
                  10,
                  max(0, engagement),
              )

              total = min(
                  100,
                  round(
                      relevance
                      + novelty
                      + uncertainty
                      + actionability
                      + engagement_signal
                  ),
              )

              if total >= 70:
                  decision = "attention_now"
              elif total >= 50:
                  decision = "monitor"
              elif total >= 30:
                  decision = "low_priority"
              else:
                  decision = "ignore"

              reasons = []

              if relevance:
                  reasons.append("domain_relevance")

              if novelty:
                  reasons.append("novelty")

              if uncertainty:
                  reasons.append("uncertainty_or_question")

              if actionability:
                  reasons.append("potential_action")

              if engagement_signal:
                  reasons.append("community_signal")

              return {
                  "score": total,
                  "decision": decision,
                  "dominant_domain": dominant,
                  "reasons": reasons,
                  "domain_scores": domain_scores,
                  "keyword_hits": hits,
                  "novelty_hits": novelty_hits,
                  "uncertainty_hits": uncertainty_hits,
                  "action_hits": action_hits,
              }


          # ------------------------------------------------------------
          # COLLECT RECENT INFORMATION
          # ------------------------------------------------------------

          payload = get_json(
              "/posts",
              params={
                  "limit": 50,
                  "sort": "new",
              },
          )

          items = extract_items(payload)

          # Fallback if the API uses a feed endpoint.
          if not items:
              try:
                  payload = get_json(
                      "/feed",
                      params={"limit": 50},
                  )
                  items = extract_items(payload)
              except Exception:
                  pass

          observations = []

          for item in items[:50]:
              if not isinstance(item, dict):
                  continue

              analysis = attention_score(item)

              post_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              author = item.get("author")

              if isinstance(author, dict):
                  author_name = (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                  )
              else:
                  author_name = author

              observations.append(
                  {
                      "id": post_id,
                      "title": item.get("title", ""),
                      "author": author_name,
                      "score": number_of(
                          item,
                          "score",
                          "karma",
                          "upvotes",
                          "likes",
                      ),
                      "attention": analysis,
                  }
              )

          observations.sort(
              key=lambda x: x["attention"]["score"],
              reverse=True,
          )

          selected = [
              item
              for item in observations
              if item["attention"]["decision"]
              == "attention_now"
          ][:10]

          monitored = [
              item
              for item in observations
              if item["attention"]["decision"]
              == "monitor"
          ][:10]

          domain_counts = {}

          for item in observations:
              domain = item["attention"]["dominant_domain"]
              domain_counts[domain] = (
                  domain_counts.get(domain, 0) + 1
              )

          dominant_domain = (
              max(domain_counts, key=domain_counts.get)
              if domain_counts
              else "none"
          )


          # ------------------------------------------------------------
          # PERSIST MEMORY
          # ------------------------------------------------------------

          now = datetime.now(timezone.utc).isoformat()

          memory = {
              "act": "ACT26",
              "name": "Active Attention Engine",
              "timestamp": now,
              "gemini_used": False,
              "purpose": (
                  "Choose what deserves active attention instead "
                  "of reacting to every perceived event."
              ),
              "principle": (
                  "Perceive != Attend. Attention is an active "
                  "selection process."
              ),
              "input_items": len(observations),
              "attention_now": len(selected),
              "monitor": len(monitored),
              "low_priority": sum(
                  1
                  for item in observations
                  if item["attention"]["decision"]
                  == "low_priority"
              ),
              "ignored": sum(
                  1
                  for item in observations
                  if item["attention"]["decision"]
                  == "ignore"
              ),
              "dominant_domain": dominant_domain,
              "domain_counts": domain_counts,
              "selected_for_attention": selected,
              "monitoring": monitored,
              "attention_model": {
                  "relevance": 30,
                  "novelty": 20,
                  "uncertainty": 15,
                  "actionability": 15,
                  "community_signal": 10,
                  "maximum_score": 100,
              },
              "decisions": [
                  {
                      "threshold": 70,
                      "meaning": "attention_now",
                  },
                  {
                      "threshold": 50,
                      "meaning": "monitor",
                  },
                  {
                      "threshold": 30,
                      "meaning": "low_priority",
                  },
                  {
                      "threshold": 0,
                      "meaning": "ignore",
                  },
              ],
              "observations": observations[:50],
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("========================================")
          print("NØX ACT26 - ACTIVE ATTENTION ENGINE")
          print("========================================")
          print(f"Items perceived: {len(observations)}")
          print(f"Attention now: {len(selected)}")
          print(f"Monitor: {len(monitored)}")
          print(
              "Low priority:",
              memory["low_priority"],
          )
          print("Ignored:", memory["ignored"])
          print("Dominant domain:", dominant_domain)
          print("----------------------------------------")

          for index, item in enumerate(selected, 1):
              print(
                  f"[{index}] "
                  f"{item.get('attention', {}).get('score', 0)}/100 "
                  f"{item.get('title', '')}"
              )

          print("----------------------------------------")
          print(f"Memory written: {OUTPUT_FILE}")


          # Small delay to avoid immediate concurrent writes with
          # another workflow that may have just updated the repository.
          time.sleep(2)
          PY

      - name: Commit ACT26 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_26_active_attention.json

          if git diff --cached --quiet; then
            echo "No ACT26 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT26: active attention memory"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT26 memory pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to push ACT26 memory after 3 attempts."
          exit 1
