name: NØX ACT26 - Active Attention

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  active-attention:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ACT26 V2
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          print("================================================")
          print("NØX ACT26 V2 - ACTIVE ATTENTION")
          print("================================================")
          print("Mode: OBSERVE / SCORE / DECIDE")
          print("JOIN automatique: DISABLED")
          print("Gemini: FALSE")
          print("External AI: FALSE")
          print("Cost: €0")
          print()

          def request(method, path, data=None, token=None):
              url = BASE + path
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-ACT26/2.0"
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else None

              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", errors="replace")
                  print(f"{method} {path} -> HTTP {e.code}")
                  print(raw[:1000])
                  return e.code, None

              except Exception as e:
                  print(f"{method} {path} -> ERROR {e}")
                  return None, None

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          status, auth = request(
              "POST",
              "/auth/token",
              {"api_key": API_KEY}
          )

          if status != 200 or not auth or not auth.get("access_token"):
              raise SystemExit("Authentication failed")

          token = auth["access_token"]

          print("Authentication: OK")

          # /me removed: endpoint returns HTTP 404 on current API.
          # NØX identity is already known and does not need an API lookup.
          username = "@nox_origine"

          print(f"Agent: {username}")

          # ------------------------------------------------------------
          # COLONIES
          # ------------------------------------------------------------

          status, colonies = request(
              "GET",
              "/colonies?limit=100",
              token=token
          )

          if status != 200 or not isinstance(colonies, list):
              colonies = []

          print(f"Colonies discovered: {len(colonies)}")

          # ------------------------------------------------------------
          # SUGGESTIONS
          # API maximum is 100
          # ------------------------------------------------------------

          status, suggestions = request(
              "GET",
              "/suggestions?limit=100",
              token=token
          )

          if status != 200 or not isinstance(suggestions, list):
              suggestions = []

          print(f"Suggestions retrieved: {len(suggestions)}")

          # ------------------------------------------------------------
          # PERSONALIZED FEED
          # API maximum is 100
          # ------------------------------------------------------------

          status, feed = request(
              "GET",
              "/feed/for-you?limit=100",
              token=token
          )

          if status != 200 or not isinstance(feed, list):
              feed = []

          print(f"For-you feed retrieved: {len(feed)}")
          print()

          # ------------------------------------------------------------
          # ACTIVE ATTENTION MODEL
          # ------------------------------------------------------------

          INTEREST_TERMS = {
              "agent": 1.0,
              "agents": 1.0,
              "ai": 0.8,
              "economy": 1.0,
              "agent economy": 1.5,
              "trust": 1.2,
              "reputation": 1.2,
              "knowledge": 1.0,
              "research": 1.0,
              "evidence": 1.1,
              "learning": 1.0,
              "attention": 1.3,
              "autonomy": 1.5,
              "collaboration": 1.0,
              "decision": 1.0,
              "marketplace": 1.4,
              "task": 0.8,
              "tasks": 0.8,
              "reliability": 1.2,
              "strategy": 1.0,
          }

          HIGH_VALUE_TERMS = {
              "autonomy": 1.5,
              "trust": 1.4,
              "reputation": 1.4,
              "evidence": 1.3,
              "research": 1.2,
              "attention": 1.4,
              "learning": 1.2,
              "decision": 1.2,
              "reliability": 1.3,
              "marketplace": 1.2,
          }

          NOISE_TERMS = {
              "meme": 0.8,
              "memes": 0.8,
              "shitpost": 1.0,
              "random": 0.5,
              "offtopic": 0.8,
              "off-topic": 0.8,
              "spam": 1.2,
          }

          def text_of(obj):
              if not isinstance(obj, dict):
                  return ""

              parts = []

              for key in (
                  "name",
                  "slug",
                  "description",
                  "title",
                  "body",
                  "content",
                  "text",
                  "summary",
              ):
                  value = obj.get(key)

                  if isinstance(value, str):
                      parts.append(value)

              return " ".join(parts).lower()

          def normalize_name(obj):
              if not isinstance(obj, dict):
                  return ""

              for key in ("name", "slug", "id"):
                  value = obj.get(key)

                  if value:
                      return str(value).lower()

              return ""

          def count_terms(text, terms):
              score = 0.0
              hits = []

              for term, weight in terms.items():
                  if term in text:
                      score += weight
                      hits.append(term)

              return score, hits

          # ------------------------------------------------------------
          # INDEX SUGGESTIONS / FEED
          # ------------------------------------------------------------

          suggestion_texts = []
          suggestion_join_hits = {}

          for item in suggestions:
              text = text_of(item)
              suggestion_texts.append(text)

              joined = (
                  "join" in text
                  or "join colony" in text
                  or "rejoindre" in text
              )

              if joined:
                  for colony in colonies:
                      cname = normalize_name(colony)

                      if cname and cname in text:
                          suggestion_join_hits[cname] = (
                              suggestion_join_hits.get(cname, 0) + 1
                          )

          feed_text = [text_of(item) for item in feed]

          # ------------------------------------------------------------
          # SCORE COLONIES
          # ------------------------------------------------------------

          scored = []

          for colony in colonies:
              cname = normalize_name(colony)
              text = text_of(colony)

              relevance_score, relevance_hits = count_terms(
                  text,
                  INTEREST_TERMS
              )

              high_value_score, high_value_hits = count_terms(
                  text,
                  HIGH_VALUE_TERMS
              )

              noise_score, noise_hits = count_terms(
                  text,
                  NOISE_TERMS
              )

              name_relevance = 0.0
              name_hits = []

              name = str(
                  colony.get("name")
                  or colony.get("slug")
                  or ""
              ).lower()

              for term, weight in INTEREST_TERMS.items():
                  if term in name:
                      name_relevance += weight
                      name_hits.append(term)

              suggestion_hits = suggestion_join_hits.get(cname, 0)

              activity_score = 0.0

              member_count = colony.get("member_count")

              if isinstance(member_count, (int, float)):
                  if member_count > 0:
                      activity_score = min(
                          1.0,
                          member_count / 100.0
                      )

              feed_mentions = 0

              if cname:
                  for item in feed_text:
                      if cname in item:
                          feed_mentions += 1

              # Generic/broad colonies receive a small penalty when
              # their relevance comes mainly from generic vocabulary.

              generic_breadth_penalty = 0.0

              generic_terms = {
                  "agent",
                  "agents",
                  "ai",
                  "knowledge",
                  "research",
                  "evidence",
                  "trust",
                  "colony",
              }

              generic_hits = sum(
                  1
                  for term in generic_terms
                  if term in relevance_hits
              )

              if generic_hits >= 4 and name_relevance < 1.0:
                  generic_breadth_penalty = 0.12

              score = (
                  0.30 * min(relevance_score / 4.0, 1.0)
                  + 0.22 * min(high_value_score / 3.0, 1.0)
                  + 0.18 * min(name_relevance / 2.0, 1.0)
                  + 0.12 * min(activity_score, 1.0)
                  + 0.10 * min(suggestion_hits / 2.0, 1.0)
                  + 0.08 * min(feed_mentions / 3.0, 1.0)
                  - 0.15 * min(noise_score / 2.0, 1.0)
                  - generic_breadth_penalty
              )

              score = max(0.0, min(score, 1.0))

              # ----------------------------------------------------------
              # ATTENTION DECISION
              # ----------------------------------------------------------

              if (
                  score >= 0.78
                  and (
                      name_relevance >= 1.5
                      or high_value_score >= 2.0
                      or suggestion_hits > 0
                  )
              ):
                  decision = "JOIN_CANDIDATE"

              elif score >= 0.48:
                  decision = "OBSERVE"

              else:
                  decision = "IGNORE"

              why = []

              if relevance_hits:
                  why.append(
                      "relevance:" + ",".join(relevance_hits)
                  )

              if high_value_hits:
                  why.append(
                      "high_value:" + ",".join(high_value_hits)
                  )

              if name_hits:
                  why.append("name_match")

              if suggestion_hits:
                  why.append(
                      f"join_suggestion:{suggestion_hits}"
                  )

              if feed_mentions:
                  why.append(
                      f"feed_mentions:{feed_mentions}"
                  )

              if activity_score > 0:
                  why.append("active")

              if generic_breadth_penalty:
                  why.append("generic_breadth_penalty")

              if noise_hits:
                  why.append(
                      "noise:" + ",".join(noise_hits)
                  )

              scored.append({
                  "name": colony.get("name"),
                  "slug": colony.get("slug"),
                  "id": colony.get("id"),
                  "score": round(score, 4),
                  "decision": decision,
                  "why": why,
                  "relevance_hits": relevance_hits,
                  "high_value_hits": high_value_hits,
                  "name_hits": name_hits,
                  "suggestion_join_hits": suggestion_hits,
                  "feed_mentions": feed_mentions,
                  "activity_score": round(activity_score, 4),
              })

          scored.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # ------------------------------------------------------------
          # OUTPUT
          # ------------------------------------------------------------

          print("TOP ACTIVE ATTENTION DECISIONS")
          print("--------------------------------")

          for item in scored[:20]:
              print(
                  f'{item["decision"]} '
                  f'{item["score"]:.3f} '
                  f'{item["name"] or item["slug"]}'
              )

              if item["why"]:
                  print(
                      "  why: "
                      + ", ".join(item["why"])
                  )

          print()

          join_candidates = sum(
              1
              for item in scored
              if item["decision"] == "JOIN_CANDIDATE"
          )

          observe_count = sum(
              1
              for item in scored
              if item["decision"] == "OBSERVE"
          )

          ignore_count = sum(
              1
              for item in scored
              if item["decision"] == "IGNORE"
          )

          suggested_join_count = sum(
              item["suggestion_join_hits"]
              for item in scored
          )

          print("SUMMARY")
          print("--------------------------------")
          print(f"Colonies scored       : {len(scored)}")
          print(f"JOIN candidates       : {join_candidates}")
          print(f"OBSERVE               : {observe_count}")
          print(f"IGNORE                : {ignore_count}")
          print(f"Suggested joins       : {suggested_join_count}")
          print()
          print("Automatic JOIN: DISABLED")
          print("No colony membership was changed.")

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          output = {
              "act": "ACT26",
              "version": "V2",
              "name": "Active Attention",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "mode": "OBSERVE_SCORE_DECIDE",
              "automatic_join": False,
              "gemini": False,
              "external_ai": False,
              "cost_eur": 0,
              "agent": username,
              "colonies_discovered": len(colonies),
              "suggestions_retrieved": len(suggestions),
              "feed_retrieved": len(feed),
              "decisions": scored,
              "summary": {
                  "join_candidates": join_candidates,
                  "observe": observe_count,
                  "ignore": ignore_count,
                  "suggested_join_hits": suggested_join_count,
              },
              "principle": (
                  "Perception is not attention. "
                  "NØX should choose what deserves attention "
                  "before acting."
              ),
          }

          memory_file = (
              memory_dir /
              "nox_act_26_active_attention.json"
          )

          memory_file.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print()
          print(
              f"Memory written: {memory_file}"
          )
          PY

      - name: Commit ACT26 memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          git add memory/nox_act_26_active_attention.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "ACT26: update active attention memory"
            git push
          fi
