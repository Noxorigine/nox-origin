name: NØX ACT26 - Active Attention

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  active-attention:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACT26 - Active Attention
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import hashlib
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "https://thecolony.ai/api/v1"
          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          OUTPUT_FILE = MEMORY_DIR / "nox_act_26_active_attention.json"

          print("=" * 64)
          print("NØX ACT26 V2 - ACTIVE ATTENTION")
          print("=" * 64)
          print("Mode: OBSERVE / SCORE / DECIDE")
          print("JOIN automatique: DISABLED")
          print("Gemini: FALSE")
          print("External AI: FALSE")
          print("Cost: 0")
          print()

          api_key = os.environ.get("COLONY_API_KEY", "").strip()

          if not api_key:
              raise SystemExit("ERROR: COLONY_API_KEY secret is missing")

          def request_json(method, url, token=None, body=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-ACT26/2.0",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if body is not None:
                  headers["Content-Type"] = "application/json"

              req = Request(
                  url,
                  headers=headers,
                  method=method,
                  data=(
                      json.dumps(body).encode("utf-8")
                      if body is not None
                      else None
                  ),
              )

              try:
                  with urlopen(req, timeout=20) as response:
                      raw = response.read().decode("utf-8")
                      try:
                          payload = json.loads(raw)
                      except Exception:
                          payload = {"raw": raw[:2000]}
                      return response.status, payload

              except HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {"raw": raw[:2000]}
                  return exc.code, payload

              except URLError as exc:
                  return 0, {"error": str(exc)}

          def get_token():
              status, payload = request_json(
                  "POST",
                  f"{BASE}/auth/token",
                  body={"api_key": api_key},
              )

              if status != 200:
                  raise SystemExit(
                      "Authentication failed: "
                      f"HTTP {status} - "
                      f"{json.dumps(payload, ensure_ascii=False)[:1000]}"
                  )

              token = payload.get("access_token")

              if not token:
                  raise SystemExit(
                      "Authentication failed: access_token missing"
                  )

              return token

          token = get_token()

          print("Authentication: OK")

          def get(path):
              status, payload = request_json(
                  "GET",
                  f"{BASE}{path}",
                  token=token,
              )

              if status < 200 or status >= 300:
                  print(
                      f"GET {path}: HTTP {status} "
                      f"{json.dumps(payload, ensure_ascii=False)[:500]}"
                  )
                  return None, status

              return payload, status

          # ------------------------------------------------------------
          # PROFILE
          # ------------------------------------------------------------

          profile, profile_status = get("/users/me")

          if profile is None:
              raise SystemExit(
                  f"Unable to read /users/me (HTTP {profile_status})"
              )

          username = profile.get("username", "unknown")

          print(f"Agent: @{username}")

          # ------------------------------------------------------------
          # COLONIES
          # ------------------------------------------------------------

          colonies, colonies_status = get("/colonies")

          if colonies is None:
              raise SystemExit(
                  f"Unable to read colonies (HTTP {colonies_status})"
              )

          if isinstance(colonies, dict):
              for key in ("items", "colonies", "data"):
                  if isinstance(colonies.get(key), list):
                      colonies = colonies[key]
                      break
              else:
                  colonies = []

          if not isinstance(colonies, list):
              colonies = []

          print(f"Colonies discovered: {len(colonies)}")

          # ------------------------------------------------------------
          # SUGGESTIONS
          # ------------------------------------------------------------

          suggestions, suggestions_status = get("/suggestions?limit=200")

          if suggestions is None:
              suggestions = []

          print(f"Suggestions retrieved: {suggestions_status}")

          # ------------------------------------------------------------
          # FOR-YOU FEED
          # ------------------------------------------------------------

          feed, feed_status = get("/feed/for-you?limit=200")

          if feed is None:
              feed = []

          print(f"For-you feed retrieved: {feed_status}")

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def flatten(value, depth=0):
              if depth > 4:
                  return ""

              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      flatten(x, depth + 1)
                      for x in value[:50]
                  )

              if isinstance(value, dict):
                  parts = []

                  preferred = (
                      "name",
                      "slug",
                      "title",
                      "description",
                      "body",
                      "content",
                      "topic",
                      "tags",
                      "reason",
                      "action",
                      "type",
                      "kind",
                  )

                  for key in preferred:
                      if key in value:
                          parts.append(
                              flatten(value[key], depth + 1)
                          )

                  if not parts:
                      for key, item in list(value.items())[:25]:
                          parts.append(
                              f"{key} {flatten(item, depth + 1)}"
                          )

                  return " ".join(parts)

              return ""

          def normalize(text):
              text = str(text).lower()
              text = re.sub(r"[^a-z0-9_\-\s]", " ", text)
              return re.sub(r"\s+", " ", text).strip()

          def contains_term(text, term):
              text = normalize(text)
              term = normalize(term)

              if not term:
                  return False

              if " " in term:
                  return term in text

              return re.search(
                  rf"\b{re.escape(term)}\b",
                  text,
              ) is not None

          # ------------------------------------------------------------
          # NØX INTEREST MODEL
          #
          # IMPORTANT:
          # A single keyword is no longer enough to create a high score.
          # Scores are based on:
          #   - unique relevant concepts
          #   - direct name relevance
          #   - platform suggestions
          #   - activity
          #   - noise
          #   - breadth penalty
          # ------------------------------------------------------------

          INTERESTS = {
              "agent": 1.5,
              "agents": 1.5,
              "ai agent": 2.5,
              "autonomy": 2.5,
              "autonomous": 2.0,
              "attention": 2.5,
              "knowledge": 2.5,
              "learning": 2.0,
              "research": 2.0,
              "verification": 2.5,
              "evidence": 2.5,
              "trust": 2.5,
              "reputation": 2.0,
              "agent economy": 3.0,
              "economy": 1.5,
              "marketplace": 3.0,
              "task": 1.5,
              "tasks": 1.5,
              "human requests": 2.5,
              "reliability": 2.5,
              "decision": 2.0,
              "strategy": 2.0,
              "colony": 1.0,
              "tooling": 1.5,
          }

          HIGH_VALUE = {
              "evidence": 1.5,
              "verification": 1.5,
              "research": 1.0,
              "human requests": 1.5,
              "marketplace": 1.5,
              "agent economy": 1.5,
              "autonomy": 1.0,
              "trust": 1.0,
              "reputation": 1.0,
          }

          NOISE = {
              "spam": 3.0,
              "advertisement": 2.5,
              "advertisements": 2.5,
              "giveaway": 2.0,
          }

          # ------------------------------------------------------------
          # SUGGESTION EXTRACTION
          # ------------------------------------------------------------

          suggestion_items = suggestions

          if isinstance(suggestions, dict):
              for key in ("items", "suggestions", "actions", "data"):
                  if isinstance(suggestions.get(key), list):
                      suggestion_items = suggestions[key]
                      break

          if not isinstance(suggestion_items, list):
              suggestion_items = []

          # ------------------------------------------------------------
          # SCORE EACH COLONY
          # ------------------------------------------------------------

          scored = []

          for colony in colonies:
              if not isinstance(colony, dict):
                  continue

              colony_id = colony.get("id")

              if not colony_id:
                  continue

              name = (
                  colony.get("name")
                  or colony.get("slug")
                  or colony.get("display_name")
                  or "unknown"
              )

              slug = colony.get("slug") or ""

              description = colony.get("description") or ""

              full_text = normalize(
                  f"{name} {slug} {description} "
                  f"{flatten(colony)}"
              )

              name_text = normalize(
                  f"{name} {slug}"
              )

              # --------------------------------------------------------
              # Relevant concepts
              # --------------------------------------------------------

              matched_terms = []

              for term, weight in INTERESTS.items():
                  if contains_term(full_text, term):
                      matched_terms.append((term, weight))

              # Diminishing returns:
              # the first few concepts matter most.
              matched_terms.sort(
                  key=lambda x: x[1],
                  reverse=True,
              )

              relevance = 0.0

              for index, (_, weight) in enumerate(
                  matched_terms[:8]
              ):
                  relevance += weight * (
                      1.0 / (1.0 + index * 0.35)
                  )

              # --------------------------------------------------------
              # Direct colony-name relevance
              # --------------------------------------------------------

              name_score = 0.0

              for term, weight in INTERESTS.items():
                  if contains_term(name_text, term):
                      name_score += min(weight, 2.5)

              name_score = min(name_score, 5.0)

              # --------------------------------------------------------
              # High-value concepts
              # --------------------------------------------------------

              value_score = 0.0

              for term, weight in HIGH_VALUE.items():
                  if contains_term(full_text, term):
                      value_score += weight

              value_score = min(value_score, 5.0)

              # --------------------------------------------------------
              # Noise
              # --------------------------------------------------------

              noise_score = 0.0

              for term, weight in NOISE.items():
                  if contains_term(full_text, term):
                      noise_score += weight

              noise_score = min(noise_score, 5.0)

              # --------------------------------------------------------
              # Suggestions mentioning this colony
              # --------------------------------------------------------

              suggestion_hits = 0
              suggestion_join_hits = 0

              for suggestion in suggestion_items:
                  if not isinstance(suggestion, dict):
                      continue

                  stext = normalize(flatten(suggestion))

                  if (
                      contains_term(stext, str(name))
                      or str(colony_id).lower() in stext
                  ):
                      suggestion_hits += 1

                      if (
                          "join" in stext
                          and "colony" in stext
                      ):
                          suggestion_join_hits += 1

              suggestion_score = min(
                  4.0,
                  suggestion_hits * 1.5
              )

              # --------------------------------------------------------
              # Activity
              # --------------------------------------------------------

              members = colony.get("member_count", 0)
              posts = colony.get("post_count", 0)

              try:
                  members = float(members or 0)
              except Exception:
                  members = 0.0

              try:
                  posts = float(posts or 0)
              except Exception:
                  posts = 0.0

              activity_score = 0.0

              if members > 0:
                  activity_score += min(
                      2.0,
                      members / 100.0
                  )

              if posts > 0:
                  activity_score += min(
                      2.0,
                      posts / 500.0
                  )

              # --------------------------------------------------------
              # Breadth penalty
              #
              # Prevents generic colonies containing many broad words
              # from automatically reaching the top.
              # --------------------------------------------------------

              unique_concepts = len(matched_terms)

              breadth_penalty = 0.0

              if unique_concepts >= 6:
                  breadth_penalty = 1.5

              elif unique_concepts >= 4:
                  breadth_penalty = 0.75

              # --------------------------------------------------------
              # Final raw score
              # --------------------------------------------------------

              raw_score = (
                  relevance
                  + name_score
                  + value_score
                  + suggestion_score
                  + activity_score
                  - noise_score
                  - breadth_penalty
              )

              # Normalized against a deliberately conservative ceiling.
              score = max(
                  0.0,
                  min(
                      1.0,
                      raw_score / 20.0
                  )
              )

              # --------------------------------------------------------
              # Decision thresholds
              #
              # JOIN_CANDIDATE is intentionally harder to reach.
              # --------------------------------------------------------

              if (
                  score >= 0.78
                  and (
                      name_score >= 1.5
                      or value_score >= 2.0
                      or suggestion_join_hits > 0
                  )
              ):
                  decision = "JOIN_CANDIDATE"

              elif score >= 0.48:
                  decision = "OBSERVE"

              else:
                  decision = "IGNORE"

              # --------------------------------------------------------
              # Explainability
              # --------------------------------------------------------

              reasons = []

              if matched_terms:
                  reasons.append(
                      "relevance:"
                      + ",".join(
                          term
                          for term, _ in matched_terms[:5]
                      )
                  )

              if name_score >= 1.5:
                  reasons.append("name_match")

              if value_score >= 2.0:
                  reasons.append("high_value")

              if suggestion_hits:
                  reasons.append(
                      f"platform_suggestion={suggestion_hits}"
                  )

              if activity_score >= 1.5:
                  reasons.append("active")

              if noise_score > 0:
                  reasons.append("noise_penalty")

              if breadth_penalty > 0:
                  reasons.append("generic_breadth_penalty")

              scored.append({
                  "id": colony_id,
                  "name": name,
                  "slug": slug,
                  "score": round(score, 4),
                  "decision": decision,
                  "reasons": reasons,
                  "matched_concepts": [
                      term
                      for term, _ in matched_terms[:8]
                  ],
                  "relevance": round(relevance, 2),
                  "name_score": round(name_score, 2),
                  "value_score": round(value_score, 2),
                  "suggestion_score": round(
                      suggestion_score,
                      2,
                  ),
                  "suggestion_hits": suggestion_hits,
                  "suggestion_join_hits": suggestion_join_hits,
                  "activity_score": round(
                      activity_score,
                      2,
                  ),
                  "noise_score": round(
                      noise_score,
                      2,
                  ),
                  "breadth_penalty": round(
                      breadth_penalty,
                      2,
                  ),
                  "members": int(members),
                  "posts": int(posts),
              })

          scored.sort(
              key=lambda item: (
                  item["score"],
                  item["value_score"],
                  item["suggestion_hits"],
                  item["name_score"],
              ),
              reverse=True,
          )

          # ------------------------------------------------------------
          # COUNTS
          # ------------------------------------------------------------

          join_candidates = [
              item
              for item in scored
              if item["decision"] == "JOIN_CANDIDATE"
          ]

          observe_candidates = [
              item
              for item in scored
              if item["decision"] == "OBSERVE"
          ]

          ignore_candidates = [
              item
              for item in scored
              if item["decision"] == "IGNORE"
          ]

          # ------------------------------------------------------------
          # OUTPUT
          # ------------------------------------------------------------

          print()
          print("ACTIVE ATTENTION DECISIONS")
          print("-" * 64)

          for item in scored[:20]:
              print(
                  f"{item['decision']:15} "
                  f"{item['score']:.3f} "
                  f"{item['name']}"
              )

              if item["reasons"]:
                  print(
                      " " * 16
                      + "why: "
                      + ", ".join(item["reasons"][:5])
                  )

          print()
          print(f"JOIN candidates : {len(join_candidates)}")
          print(f"OBSERVE         : {len(observe_candidates)}")
          print(f"IGNORE          : {len(ignore_candidates)}")
          print(f"Suggested joins : {sum(
              item["suggestion_join_hits"]
              for item in scored
          )}")

          # ------------------------------------------------------------
          # SAFETY
          # ------------------------------------------------------------

          print()
          print("SAFETY")
          print("-" * 64)
          print("No colony join request was sent.")
          print("No post was created.")
          print("No comment was created.")
          print("No vote was created.")
          print("No DM was sent.")
          print("No marketplace action was performed.")
          print("No payment was performed.")

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          timestamp = datetime.now(
              timezone.utc
          ).isoformat()

          top_attention = scored[:12]

          fingerprint_source = json.dumps(
              top_attention,
              sort_keys=True,
              ensure_ascii=False,
          )

          fingerprint = hashlib.sha256(
              fingerprint_source.encode("utf-8")
          ).hexdigest()[:16]

          memory = {
              "act": "ACT26",
              "version": "V2",
              "title": "Active Attention",
              "timestamp_utc": timestamp,
              "agent": username,
              "status": "OBSERVATION_COMPLETE",

              "principle": (
                  "NØX does not give equal attention to all "
                  "available environments. It evaluates which "
                  "colonies deserve attention."
              ),

              "question": (
                  "Which colonies deserve NØX attention, "
                  "and why?"
              ),

              "mode": {
                  "gemini": False,
                  "external_ai": False,
                  "cost": 0,
                  "network_write": False,
                  "automatic_join": False,
              },

              "inputs": {
                  "colonies_status": colonies_status,
                  "colonies_count": len(colonies),
                  "suggestions_status": suggestions_status,
                  "suggestions_count": len(
                      suggestion_items
                  ),
                  "feed_status": feed_status,
                  "feed_items": (
                      len(feed)
                      if isinstance(feed, list)
                      else 0
                  ),
              },

              "policy": {
                  "join_candidate": (
                      "score >= 0.78 AND "
                      "(name relevance OR high-value relevance "
                      "OR explicit platform join suggestion)"
                  ),
                  "observe": (
                      "0.48 <= score < join threshold"
                  ),
                  "ignore": (
                      "score < 0.48"
                  ),
                  "anti_generic_rule": (
                      "Multiple generic keyword matches "
                      "receive diminishing returns and "
                      "breadth penalties."
                  ),
              },

              "summary": {
                  "join_candidates": len(
                      join_candidates
                  ),
                  "observe": len(
                      observe_candidates
                  ),
                  "ignore": len(
                      ignore_candidates
                  ),
              },

              "top_attention": top_attention,

              "learning_target": (
                  "Validate whether attention scores "
                  "remain discriminative across runs."
              ),

              "next_step": (
                  "Compare repeated ACT26 observations "
                  "before enabling any automatic colony join."
              ),

              "fingerprint": fingerprint,
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print()
          print(f"Memory written: {OUTPUT_FILE}")
          print(f"Fingerprint: {fingerprint}")
          print()
          print("=" * 64)
          print("ACT26 V2 COMPLETE")
          print("=" * 64)
          PY

      - name: Commit ACT26 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_26_active_attention.json

          if git diff --cached --quiet; then
            echo "No ACT26 memory change to commit."
            exit 0
          fi

          git commit -m "NØX ACT26 V2 active attention"

          git pull --rebase origin main
          git push origin main
