name: NØX ACT26 - Active Attention

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  active-attention:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACT26 - Active Attention
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "https://thecolony.ai/api/v1"
          MEMORY_DIR = Path("memory")
          MEMORY_DIR.mkdir(parents=True, exist_ok=True)

          OUTPUT_FILE = MEMORY_DIR / "nox_act_26_active_attention.json"

          print("=" * 64)
          print("NØX ACT26 V1 - ACTIVE ATTENTION")
          print("=" * 64)
          print("Mode: OBSERVE / SCORE / DECIDE")
          print("JOIN automatique: DISABLED")
          print("Gemini: FALSE")
          print("External AI: FALSE")
          print("Cost: 0")
          print()

          api_key = os.environ.get("COLONY_API_KEY", "").strip()

          if not api_key:
              raise SystemExit("ERROR: COLONY_API_KEY secret is missing")

          def request_json(method, url, token=None):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-ACT26/1.0",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              req = Request(url, headers=headers, method=method)

              try:
                  with urlopen(req, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body)
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {"raw": body[:1000]}
                  return exc.code, payload
              except URLError as exc:
                  return 0, {"error": str(exc)}

          def get_token():
              status, payload = request_json(
                  "POST",
                  f"{BASE}/auth/token",
              )

              # The token endpoint requires the API key in JSON.
              if status != 200:
                  headers = {
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "Nox-Origin-ACT26/1.0",
                  }

                  req = Request(
                      f"{BASE}/auth/token",
                      data=json.dumps({"api_key": api_key}).encode("utf-8"),
                      headers=headers,
                      method="POST",
                  )

                  try:
                      with urlopen(req, timeout=20) as response:
                          payload = json.loads(
                              response.read().decode("utf-8")
                          )
                          status = response.status
                  except HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      try:
                          payload = json.loads(body)
                      except Exception:
                          payload = {"raw": body[:1000]}
                      status = exc.code
                  except URLError as exc:
                      raise SystemExit(f"Token request failed: {exc}")

              if status != 200:
                  raise SystemExit(
                      f"Authentication failed: HTTP {status} - "
                      f"{json.dumps(payload, ensure_ascii=False)[:1000]}"
                  )

              token = payload.get("access_token")

              if not token:
                  raise SystemExit(
                      "Authentication failed: access_token missing"
                  )

              return token

          token = get_token()

          print("Authentication: OK")

          def get(path):
              status, payload = request_json(
                  "GET",
                  f"{BASE}{path}",
                  token=token,
              )

              if status == 401:
                  print(f"GET {path}: 401")
                  return None, status

              if status < 200 or status >= 300:
                  print(
                      f"GET {path}: HTTP {status} "
                      f"{json.dumps(payload, ensure_ascii=False)[:500]}"
                  )
                  return None, status

              return payload, status

          # ------------------------------------------------------------
          # 1. PROFILE
          # ------------------------------------------------------------

          profile, profile_status = get("/users/me")

          if profile is None:
              raise SystemExit(
                  f"Unable to read /users/me (HTTP {profile_status})"
              )

          username = profile.get("username", "unknown")

          print(f"Agent: @{username}")

          # ------------------------------------------------------------
          # 2. COLONIES
          # ------------------------------------------------------------

          colonies, colonies_status = get("/colonies")

          if colonies is None:
              raise SystemExit(
                  f"Unable to read colonies (HTTP {colonies_status})"
              )

          if isinstance(colonies, dict):
              if isinstance(colonies.get("items"), list):
                  colonies = colonies["items"]
              elif isinstance(colonies.get("colonies"), list):
                  colonies = colonies["colonies"]
              else:
                  colonies = []

          if not isinstance(colonies, list):
              colonies = []

          print(f"Colonies discovered: {len(colonies)}")

          # ------------------------------------------------------------
          # 3. SUGGESTIONS
          # ------------------------------------------------------------

          suggestions, suggestions_status = get("/suggestions?limit=50")

          if suggestions is None:
              suggestions = []

          print(f"Suggestions retrieved: {suggestions_status}")

          # ------------------------------------------------------------
          # 4. PERSONALIZED FEED
          # ------------------------------------------------------------

          feed, feed_status = get("/feed/for-you?limit=50")

          if feed is None:
              feed = []

          print(f"For-you feed retrieved: {feed_status}")

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------

          def flatten_text(value, depth=0):
              if depth > 3:
                  return ""

              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, list):
                  return " ".join(
                      flatten_text(x, depth + 1)
                      for x in value[:30]
                  )

              if isinstance(value, dict):
                  preferred = [
                      "name",
                      "display_name",
                      "slug",
                      "description",
                      "bio",
                      "title",
                      "body",
                      "content",
                      "topic",
                      "tags",
                      "reason",
                      "action",
                      "type",
                      "kind",
                  ]

                  parts = []

                  for key in preferred:
                      if key in value:
                          parts.append(
                              flatten_text(value[key], depth + 1)
                          )

                  if not parts:
                      for key, item in list(value.items())[:20]:
                          parts.append(
                              f"{key} {flatten_text(item, depth + 1)}"
                          )

                  return " ".join(parts)

              return ""

          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).lower()
              ).strip()

          # ------------------------------------------------------------
          # NØX INTEREST MODEL
          # ------------------------------------------------------------

          interests = {
              "agent": 5,
              "agents": 5,
              "ai agent": 5,
              "autonomy": 5,
              "autonomous": 5,
              "attention": 5,
              "knowledge": 5,
              "learning": 5,
              "research": 4,
              "verification": 5,
              "evidence": 5,
              "trust": 5,
              "reputation": 5,
              "agent economy": 5,
              "economy": 4,
              "marketplace": 5,
              "task": 4,
              "tasks": 4,
              "human request": 4,
              "reliability": 5,
              "decision": 5,
              "strategy": 4,
              "colony": 4,
              "api": 3,
              "tooling": 4,
              "build in public": 4,
          }

          noise_terms = {
              "advertisement": 4,
              "advertisements": 4,
              "spam": 5,
              "giveaway": 4,
          }

          priority_terms = {
              "finding": 4,
              "question": 3,
              "analysis": 4,
              "research": 4,
              "verification": 5,
              "evidence": 5,
              "human_request": 5,
              "paid_task": 5,
          }

          def score_text(text):
              text = normalize(text)

              relevance = 0.0
              noise = 0.0
              priority = 0.0

              for term, weight in interests.items():
                  if term in text:
                      relevance += weight

              for term, weight in noise_terms.items():
                  if term in text:
                      noise += weight

              for term, weight in priority_terms.items():
                  if term in text:
                      priority += weight

              return relevance, noise, priority

          def clamp(value, low=0.0, high=1.0):
              return max(low, min(high, value))

          # ------------------------------------------------------------
          # Colony scoring
          # ------------------------------------------------------------

          scored = []

          for colony in colonies:
              if not isinstance(colony, dict):
                  continue

              colony_id = colony.get("id")

              if not colony_id:
                  continue

              name = (
                  colony.get("name")
                  or colony.get("slug")
                  or colony.get("display_name")
                  or "unknown"
              )

              description = colony.get("description", "")

              text = flatten_text(colony)

              relevance, noise, priority = score_text(text)

              # Strong direct matches.
              name_relevance, name_noise, name_priority = score_text(
                  f"{name} {description}"
              )

              relevance += name_relevance * 1.5
              noise += name_noise * 1.5
              priority += name_priority * 1.5

              # Suggestions mentioning this colony are strong evidence
              # that The Colony itself considers it relevant.
              suggestion_hits = 0

              suggestion_items = suggestions
              if isinstance(suggestions, dict):
                  for key in ("items", "suggestions", "actions"):
                      if isinstance(suggestions.get(key), list):
                          suggestion_items = suggestions[key]
                          break

              for suggestion in suggestion_items:
                  stext = normalize(flatten_text(suggestion))

                  if normalize(str(name)) in stext:
                      suggestion_hits += 1

                  if str(colony_id) in stext:
                      suggestion_hits += 2

              # Activity indicators, if supplied by the API.
              members = colony.get("member_count", 0)
              posts = colony.get("post_count", 0)

              try:
                  members = float(members or 0)
              except Exception:
                  members = 0

              try:
                  posts = float(posts or 0)
              except Exception:
                  posts = 0

              activity_bonus = 0.0

              if members > 0:
                  activity_bonus += min(2.0, members / 50.0)

              if posts > 0:
                  activity_bonus += min(2.0, posts / 500.0)

              raw = (
                  relevance
                  + priority
                  + activity_bonus
                  + (suggestion_hits * 4.0)
                  - noise
              )

              score = clamp(raw / 35.0)

              if score >= 0.75:
                  decision = "JOIN_CANDIDATE"
              elif score >= 0.50:
                  decision = "OBSERVE"
              else:
                  decision = "IGNORE"

              scored.append({
                  "id": colony_id,
                  "name": name,
                  "slug": colony.get("slug"),
                  "score": round(score, 4),
                  "decision": decision,
                  "relevance": round(relevance, 2),
                  "priority": round(priority, 2),
                  "noise": round(noise, 2),
                  "suggestion_hits": suggestion_hits,
                  "members": int(members),
                  "posts": int(posts),
              })

          scored.sort(
              key=lambda item: (
                  item["score"],
                  item["suggestion_hits"],
                  item["relevance"],
              ),
              reverse=True,
          )

          # ------------------------------------------------------------
          # Suggested JOIN actions from The Colony
          # ------------------------------------------------------------

          suggested_joins = []

          suggestion_items = suggestions

          if isinstance(suggestions, dict):
              for key in ("items", "suggestions", "actions"):
                  if isinstance(suggestions.get(key), list):
                      suggestion_items = suggestions[key]
                      break

          if isinstance(suggestion_items, list):
              for item in suggestion_items:
                  if not isinstance(item, dict):
                      continue

                  text = normalize(flatten_text(item))

                  if (
                      "join" in text
                      and "colony" in text
                  ):
                      suggested_joins.append({
                          "type": item.get("type") or item.get("kind"),
                          "reason": item.get("reason"),
                          "raw": item,
                      })

          # ------------------------------------------------------------
          # Decision summary
          # ------------------------------------------------------------

          join_candidates = [
              x for x in scored
              if x["decision"] == "JOIN_CANDIDATE"
          ]

          observe_candidates = [
              x for x in scored
              if x["decision"] == "OBSERVE"
          ]

          ignore_candidates = [
              x for x in scored
              if x["decision"] == "IGNORE"
          ]

          print()
          print("ACTIVE ATTENTION DECISIONS")
          print("-" * 64)

          for item in scored[:15]:
              print(
                  f"{item['decision']:15} "
                  f"{item['score']:.3f} "
                  f"{item['name']}"
              )

          print()
          print(f"JOIN candidates : {len(join_candidates)}")
          print(f"OBSERVE          : {len(observe_candidates)}")
          print(f"IGNORE           : {len(ignore_candidates)}")
          print(f"Suggested joins  : {len(suggested_joins)}")

          # ------------------------------------------------------------
          # Important safety rule:
          # ACT26 V1 NEVER performs POST /join.
          # ------------------------------------------------------------

          print()
          print("SAFETY:")
          print("No colony join request was sent.")
          print("No post was created.")
          print("No comment was created.")
          print("No vote was created.")
          print("No DM was sent.")
          print("No marketplace action was performed.")
          print("No payment was performed.")

          # ------------------------------------------------------------
          # Memory
          # ------------------------------------------------------------

          now = datetime.now(timezone.utc).isoformat()

          top_attention = scored[:10]

          fingerprint_source = json.dumps(
              top_attention,
              sort_keys=True,
              ensure_ascii=False,
          )

          fingerprint = hashlib.sha256(
              fingerprint_source.encode("utf-8")
          ).hexdigest()[:16]

          memory = {
              "act": "ACT26",
              "version": "V1",
              "title": "Active Attention",
              "timestamp_utc": now,
              "agent": username,

              "status": "OBSERVATION_COMPLETE",

              "principle": (
                  "NØX does not treat all available information "
                  "as equally deserving of attention."
              ),

              "question": (
                  "Which colonies deserve NØX attention, and why?"
              ),

              "mode": {
                  "gemini": False,
                  "external_ai": False,
                  "cost": 0,
                  "network_write": False,
                  "automatic_join": False,
              },

              "inputs": {
                  "colonies_status": colonies_status,
                  "colonies_count": len(colonies),
                  "suggestions_status": suggestions_status,
                  "feed_status": feed_status,
                  "feed_items": (
                      len(feed)
                      if isinstance(feed, list)
                      else 0
                  ),
              },

              "decision_policy": {
                  "join_candidate": "score >= 0.75",
                  "observe": "0.50 <= score < 0.75",
                  "ignore": "score < 0.50",
                  "note": (
                      "Thresholds are provisional and must be "
                      "validated before automatic joining."
                  ),
              },

              "summary": {
                  "join_candidates": len(join_candidates),
                  "observe": len(observe_candidates),
                  "ignore": len(ignore_candidates),
                  "suggested_join_actions": len(suggested_joins),
              },

              "top_attention": top_attention,

              "suggested_join_actions": suggested_joins[:10],

              "next_step": (
                  "Validate whether ACT26 decisions remain useful "
                  "across multiple runs before enabling JOIN."
              ),

              "fingerprint": fingerprint,
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print()
          print(f"Memory written: {OUTPUT_FILE}")
          print(f"Fingerprint: {fingerprint}")
          print()
          print("=" * 64)
          print("ACT26 V1 COMPLETE")
          print("=" * 64)
          PY

      - name: Commit ACT26 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_26_active_attention.json

          if git diff --cached --quiet; then
            echo "No ACT26 memory change to commit."
            exit 0
          fi

          git commit -m "NØX ACT26 active attention state"

          git pull --rebase origin main
          git push origin main
