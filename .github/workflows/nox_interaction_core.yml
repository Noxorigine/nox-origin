name: NØX Interaction Core V9

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      NOX_USERNAME: nox_origine

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_REPLY_SCORE: "60"
      MIN_COMMENT_SCORE: "65"
      MIN_PUBLISH_SCORE: "78"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Create NØX Core V9 script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/nox_interaction_core.py <<'PY'
          import json
          import os
          import re
          import sys
          import hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "")
          USERNAME = os.environ["NOX_USERNAME"]

          INTERACTION_MEMORY = Path(os.environ["INTERACTION_MEMORY"])
          KNOWLEDGE_MEMORY = Path(os.environ["KNOWLEDGE_MEMORY"])
          REPUTATION_MEMORY = Path(os.environ["REPUTATION_MEMORY"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS_PER_POST"])

          MIN_REPLY_SCORE = float(os.environ["MIN_REPLY_SCORE"])
          MIN_COMMENT_SCORE = float(os.environ["MIN_COMMENT_SCORE"])
          MIN_PUBLISH_SCORE = float(os.environ["MIN_PUBLISH_SCORE"])


          def now():
              return datetime.now(timezone.utc)


          def now_iso():
              return now().isoformat()


          def text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def normalize(value):
              value = text(value).lower()
              value = re.sub(r"https?://\S+", " ", value)
              value = re.sub(r"[^a-z0-9à-ÿ_ -]+", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def tokens(value):
              stop = {
                  "the", "and", "for", "that", "this", "with",
                  "from", "have", "what", "when", "where",
                  "which", "into", "about", "your", "they",
                  "their", "then", "than", "are", "was", "were",
                  "been", "being", "you", "our", "les", "des",
                  "une", "dans", "pour", "avec", "sur", "que",
                  "qui", "est", "sont", "cette", "ces", "aux",
                  "plus", "pas", "par", "son", "ses", "nous",
                  "vous"
              }

              words = re.findall(
                  r"[a-zà-ÿ0-9_]{3,}",
                  normalize(value)
              )

              return {
                  word for word in words
                  if word not in stop
              }


          def fingerprint(value):
              return hashlib.sha256(
                  normalize(value).encode("utf-8")
              ).hexdigest()[:16]


          def compact(value, limit=5000):
              try:
                  raw = json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  raw = str(value)

              return raw[:limit]


          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(
                      f"WARNING: cannot read {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def normalize_items(value):
              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for key in (
                      "items",
                      "results",
                      "posts",
                      "feed",
                      "suggestions",
                      "conversations",
                      "comments",
                      "data"
                  ):
                      candidate = value.get(key)

                      if isinstance(candidate, list):
                          return candidate

                      if isinstance(candidate, dict):
                          for nested in (
                              "items",
                              "results",
                              "posts",
                              "comments"
                          ):
                              if isinstance(
                                  candidate.get(nested),
                                  list
                              ):
                                  return candidate[nested]

              return []


          def session_auth():
              if not API_KEY:
                  raise RuntimeError(
                      "COLONY_API_KEY is missing"
                  )

              session = requests.Session()

              response = session.post(
                  f"{BASE_URL}/api/v1/auth/token",
                  json={"api_key": API_KEY},
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json"
                  },
                  timeout=30
              )

              print(
                  "POST /api/v1/auth/token ->",
                  response.status_code
              )

              response.raise_for_status()

              data = response.json()

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "No access token returned"
                  )

              session.headers.update({
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent":
                      "NOX-Origin-Interaction-Core-V9"
              })

              return session


          def api_get(
              session,
              path,
              required=True
          ):
              response = session.get(
                  BASE_URL + path,
                  timeout=30
              )

              print(
                  f"GET {path} -> "
                  f"{response.status_code}"
              )

              if response.status_code == 429:
                  print("RATE_LIMIT:", path)
                  return None

              if required:
                  response.raise_for_status()
              elif response.status_code >= 400:
                  return None

              try:
                  return response.json()
              except Exception:
                  return None


          def api_post(
              session,
              path,
              payload,
              required=False
          ):
              response = session.post(
                  BASE_URL + path,
                  json=payload,
                  timeout=30
              )

              print(
                  f"POST {path} -> "
                  f"{response.status_code}"
              )

              if response.status_code == 429:
                  print("RATE_LIMIT:", path)
                  return None

              if required:
                  response.raise_for_status()
              elif response.status_code >= 400:
                  print(
                      "POST FAILED:",
                      response.text[:1000]
                  )
                  return None

              try:
                  return response.json()
              except Exception:
                  return {
                      "raw_response":
                          response.text[:1000]
                  }


          def extract_post_id(item):
              candidates = []

              def walk(value, path="root"):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          child_path = (
                              f"{path}.{key}"
                          )

                          if key in {
                              "post_id",
                              "postId"
                          }:
                              candidates.append(
                                  (
                                      child_path,
                                      text(child)
                                  )
                              )

                          if (
                              key == "post"
                              and isinstance(child, dict)
                          ):
                              for nested_key in (
                                  "id",
                                  "post_id",
                                  "postId"
                              ):
                                  if nested_key in child:
                                      candidates.append(
                                          (
                                              f"{child_path}.{nested_key}",
                                              text(
                                                  child[
                                                      nested_key
                                                  ]
                                              )
                                          )
                                      )

                          if (
                              key == "parent_post"
                              and isinstance(child, dict)
                          ):
                              for nested_key in (
                                  "id",
                                  "post_id",
                                  "postId"
                              ):
                                  if nested_key in child:
                                      candidates.append(
                                          (
                                              f"{child_path}.{nested_key}",
                                              text(
                                                  child[
                                                      nested_key
                                                  ]
                                              )
                                          )
                                      )

                          walk(
                              child,
                              child_path
                          )

                    elif isinstance(value, list):
                        for index, child in enumerate(
                            value
                        ):
                            walk(
                                child,
                                f"{path}[{index}]"
                            )

              walk(item)

              valid = []

              for path, candidate in candidates:
                  if re.fullmatch(
                      r"[0-9a-fA-F]{32}",
                      candidate
                  ):
                      valid.append(
                          (path, candidate)
                      )

              unique = []
              seen = set()

              for path, candidate in valid:
                  if candidate not in seen:
                      unique.append(
                          (path, candidate)
                      )
                      seen.add(candidate)

              if len(unique) == 1:
                  return unique[0][1], {
                      "status": "valid",
                      "path": unique[0][0],
                      "candidates": candidates
                  }

              if len(unique) > 1:
                  return None, {
                      "status": "ambiguous",
                      "paths": [
                          item[0]
                          for item in unique
                      ],
                      "candidates": candidates
                  }

              return None, {
                  "status": "unresolved",
                  "candidates": candidates
              }


          def extract_username(value):
              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  return (
                      value.get("username")
                      or value.get("handle")
                      or value.get("name")
                  )

              return None


          def author_of(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "author",
                  "user",
                  "agent",
                  "creator",
                  "owner"
              ):
                  candidate = extract_username(
                      item.get(key)
                  )

                  if candidate:
                      return str(candidate).strip()

              return str(
                  item.get("author_username")
                  or item.get("username")
                  or ""
              ).strip()


          def item_text(item):
              if not isinstance(item, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "body",
                  "content",
                  "text",
                  "description",
                  "question",
                  "summary",
                  "message",
                  "reason",
                  "comment"
              ):
                  value = item.get(key)

                  if isinstance(
                      value,
                      (str, int, float)
                  ):
                      parts.append(str(value))

                  elif isinstance(value, list):
                      parts.extend(
                          str(x)
                          for x in value
                      )

                  elif isinstance(value, dict):
                      parts.append(
                          compact(value, 3000)
                      )

              return " ".join(parts)


          def get_cursor(memory):
              cursor = memory.get(
                  "last_since_cursor"
              )

              if (
                  isinstance(cursor, str)
                  and cursor.strip()
              ):
                  return cursor

              return now().isoformat()


          def knowledge_entries(knowledge):
              if isinstance(knowledge, list):
                  return knowledge

              if not isinstance(
                  knowledge,
                  dict
              ):
                  return []

              entries = []

              for key in (
                  "knowledge",
                  "entries",
                  "facts",
                  "items",
                  "records",
                  "knowledge_entries",
                  "validated_knowledge",
                  "observations"
              ):
                  value = knowledge.get(key)

                  if isinstance(value, list):
                      entries.extend(value)

              result = []
              seen = set()

              for entry in entries:
                  fp = fingerprint(
                      compact(entry, 10000)
                  )

                  if fp not in seen:
                      result.append(entry)
                      seen.add(fp)

              return result


          def knowledge_text(entry):
              if isinstance(entry, str):
                  return entry

              if isinstance(entry, dict):
                  parts = []

                  for key in (
                      "title",
                      "name",
                      "topic",
                      "domain",
                      "claim",
                      "statement",
                      "fact",
                      "content",
                      "description",
                      "evidence",
                      "summary",
                      "question"
                  ):
                      value = entry.get(key)

                      if value is not None:
                          if isinstance(
                              value,
                              (dict, list)
                          ):
                              parts.append(
                                  compact(
                                      value,
                                      3000
                                  )
                              )
                          else:
                              parts.append(
                                  str(value)
                              )

                  return " ".join(parts)

              return str(entry)


          def compare_with_knowledge(
              observation,
              entries
          ):
              obs_tokens = tokens(
                  observation
              )

              if not obs_tokens:
                  return {
                      "novelty": 0.0,
                      "max_overlap": 0.0,
                      "matches": [],
                      "contradiction": False,
                      "status": "insufficient_text"
                  }

              best_overlap = 0.0
              matches = []

              negative_words = {
                  "not",
                  "never",
                  "false",
                  "wrong",
                  "failed",
                  "failure",
                  "instead",
                  "contradicts",
                  "contrary",
                  "no",
                  "without",
                  "cannot",
                  "doesnt",
                  "doesn't",
                  "impossible",
                  "aucun",
                  "jamais",
                  "faux",
                  "contraire",
                  "echec",
                  "échec",
                  "impossible"
              }

              negative = bool(
                  obs_tokens.intersection(
                      negative_words
                  )
              )

              for index, entry in enumerate(
                  entries[:2000]
              ):
                  etext = knowledge_text(
                      entry
                  )

                  etokens = tokens(
                      etext
                  )

                  if not etokens:
                      continue

                  intersection = (
                      obs_tokens.intersection(
                          etokens
                      )
                  )

                  overlap = (
                      len(intersection)
                      /
                      max(
                          1,
                          min(
                              len(obs_tokens),
                              len(etokens)
                          )
                      )
                  )

                  best_overlap = max(
                      best_overlap,
                      overlap
                  )

                  if overlap >= 0.25:
                      matches.append({
                          "index": index,
                          "overlap": round(
                              overlap,
                              4
                          ),
                          "text": etext[:600]
                      })

              matches.sort(
                  key=lambda x: x["overlap"],
                  reverse=True
              )

              matches = matches[:5]

              novelty = max(
                  0.0,
                  1.0 - best_overlap
              )

              contradiction = (
                  best_overlap >= 0.55
                  and negative
              )

              if contradiction:
                  status = (
                      "possible_contradiction"
                  )
              elif best_overlap >= 0.75:
                  status = (
                      "known_or_reinforced"
                  )
              elif best_overlap >= 0.45:
                  status = "related"
              else:
                  status = "novel"

              return {
                  "novelty": round(
                      novelty,
                      4
                  ),
                  "max_overlap": round(
                      best_overlap,
                      4
                  ),
                  "matches": matches,
                  "contradiction":
                      contradiction,
                  "status": status
              }


          def detect_domain(value):
              value = normalize(value)

              domains = {
                  "agent_economy": (
                      "agent economy",
                      "economy",
                      "marketplace",
                      "paid work",
                      "payment",
                      "payments",
                      "lightning",
                      "sats",
                      "bitcoin",
                      "reward",
                      "economic",
                      "money"
                  ),
                  "agent_intelligence_autonomy": (
                      "agent",
                      "autonomy",
                      "autonomous",
                      "reasoning",
                      "memory",
                      "learning",
                      "decision",
                      "planning",
                      "attention",
                      "cognitive"
                  ),
                  "trust_reputation": (
                      "trust",
                      "reputation",
                      "karma",
                      "verification",
                      "proof",
                      "evidence",
                      "reliable",
                      "reliability"
                  ),
                  "ai_communities": (
                      "community",
                      "colony",
                      "collaboration",
                      "cooperation",
                      "interaction",
                      "discussion"
                  )
              }

              scores = {}

              for domain, words in domains.items():
                  scores[domain] = sum(
                      1
                      for word in words
                      if word in value
                  )

              best = max(
                  scores,
                  key=scores.get
              )

              if scores[best] == 0:
                  return "general", 0

              return best, scores[best]


          def cognitive_score(analysis):
              novelty = float(
                  analysis["novelty"]
              )

              overlap = float(
                  analysis["max_overlap"]
              )

              contradiction = bool(
                  analysis["contradiction"]
              )

              score = novelty * 60.0

              if contradiction:
                  score += 30.0
              elif 0.45 <= overlap < 0.75:
                  score += 15.0
              elif overlap >= 0.75:
                  score += 5.0

              return round(
                  min(100.0, score),
                  2
              )


          def load_interaction_memory():
              default = {
                  "schema_version": "9.0",
                  "version":
                      "INTERACTION_CORE_V9",
                  "agent": USERNAME,
                  "updated_at": now_iso(),
                  "last_since_cursor": None,
                  "observations": [],
                  "decisions": [],
                  "events": [],
                  "learning_signals": [],
                  "post_id_diagnostics": []
              }

              data = load_json(
                  INTERACTION_MEMORY,
                  default
              )

              if not isinstance(
                  data,
                  dict
              ):
                  return default

              for key in (
                  "observations",
                  "decisions",
                  "events",
                  "learning_signals",
                  "post_id_diagnostics"
              ):
                  if not isinstance(
                      data.get(key),
                      list
                  ):
                      data[key] = []

              return data


          def trim_memory(memory):
              memory["observations"] = (
                  memory["observations"][-300:]
              )

              memory["decisions"] = (
                  memory["decisions"][-300:]
              )

              memory["events"] = (
                  memory["events"][-300:]
              )

              memory["learning_signals"] = (
                  memory["learning_signals"][-300:]
              )

              memory["post_id_diagnostics"] = (
                  memory[
                      "post_id_diagnostics"
                  ][-100:]
              )


          def main():
              print(
                  "=============================================="
              )
              print("NØX Interaction Core V9")
              print(
                  "=============================================="
              )
              print("Gemini: DISABLED")
              print("External AI: DISABLED")
              print("Payments: DISABLED")
              print("Marketplace: DISABLED")
              print("Spending: DISABLED")
              print("Cost: 0")
              print("")

              memory = (
                  load_interaction_memory()
              )

              knowledge = load_json(
                  KNOWLEDGE_MEMORY,
                  {}
              )

              reputation = load_json(
                  REPUTATION_MEMORY,
                  {}
              )

              entries = knowledge_entries(
                  knowledge
              )

              print(
                  "KNOWLEDGE ENTRIES:",
                  len(entries)
              )

              reputation_count = 0

              if isinstance(
                  reputation,
                  dict
              ):
                  for key in (
                      "trust",
                      "reputation",
                      "domains",
                      "agents",
                      "records",
                      "observations",
                      "events"
                  ):
                      value = reputation.get(
                          key
                      )

                      if isinstance(
                          value,
                          list
                      ):
                          reputation_count += len(
                              value
                          )
                      elif isinstance(
                          value,
                          dict
                      ):
                          reputation_count += len(
                              value
                          )

              print(
                  "REPUTATION SIGNALS:",
                  reputation_count
              )

              session = session_auth()

              me = api_get(
                  session,
                  "/api/v1/users/me"
              )

              if not isinstance(
                  me,
                  dict
              ):
                  raise RuntimeError(
                      "Unable to verify NØX identity"
                  )

              print(
                  "IDENTITY:",
                  me.get("username")
                  or me.get("handle")
                  or USERNAME
              )

              print(
                  "KARMA:",
                  me.get(
                      "karma",
                      "unknown"
                  )
              )

              feed_raw = api_get(
                  session,
                  "/api/v1/feed/for-you"
                  f"?limit={MAX_FEED_ITEMS}"
              )

              feed = normalize_items(
                  feed_raw
              )

              suggestions_raw = api_get(
                  session,
                  "/api/v1/suggestions"
                  f"?limit={MAX_SUGGESTIONS}"
              )

              suggestions = normalize_items(
                  suggestions_raw
              )

              cursor = get_cursor(
                  memory
              )

              since_path = (
                  "/api/v1/since?cursor="
                  + quote(
                      cursor,
                      safe=""
                  )
              )

              activity_raw = api_get(
                  session,
                  since_path,
                  required=False
              )

              if activity_raw is None:
                  print(
                      "STOP: activity observation failed"
                  )
                  sys.exit(1)

              activity = normalize_items(
                  activity_raw
              )

              next_cursor = None

              if isinstance(
                  activity_raw,
                  dict
              ):
                  next_cursor = (
                      activity_raw.get(
                          "next_cursor"
                      )
                      or activity_raw.get(
                          "nextCursor"
                      )
                  )

              if next_cursor:
                  memory[
                      "last_since_cursor"
                  ] = next_cursor
              else:
                  memory[
                      "last_since_cursor"
                  ] = cursor

              colonies_raw = api_get(
                  session,
                  "/api/v1/colonies"
              )

              colonies = normalize_items(
                  colonies_raw
              )

              print(
                  "FEED ITEMS:",
                  len(feed)
              )

              print(
                  "SUGGESTIONS:",
                  len(suggestions)
              )

              print(
                  "ACTIVITY ITEMS:",
                  len(activity)
              )

              print(
                  "NEXT CURSOR:",
                  memory[
                      "last_since_cursor"
                  ]
              )

              print(
                  "COLONIES:",
                  len(colonies)
              )

              dm_candidates = []
              comment_candidates = []
              post_candidates = []

              for item in activity:
                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  author = author_of(
                      item
                  )

                  event_type = normalize(
                      item.get("type")
                      or item.get(
                          "event_type"
                      )
                      or item.get(
                          "kind"
                      )
                      or ""
                  )

                  serialized = normalize(
                      compact(
                          item,
                          5000
                      )
                  )

                  if (
                      author
                      and author.lower()
                      != USERNAME.lower()
                  ):
                      if (
                          "message"
                          in event_type
                          or "dm"
                          in event_type
                          or "direct"
                          in event_type
                          or "message"
                          in serialized
                      ):
                          dm_candidates.append(
                              item
                          )

                      if (
                          "comment"
                          in event_type
                          or "comment"
                          in serialized
                      ):
                          comment_candidates.append(
                              item
                          )

                  post_id, diagnostic = (
                      extract_post_id(item)
                  )

                  if (
                      diagnostic["status"]
                      != "unresolved"
                  ):
                      memory[
                          "post_id_diagnostics"
                      ].append({
                          "timestamp":
                              now_iso(),
                          "status":
                              diagnostic[
                                  "status"
                              ],
                          "path":
                              diagnostic.get(
                                  "path"
                              ),
                          "paths":
                              diagnostic.get(
                                  "paths"
                              ),
                          "candidates":
                              diagnostic.get(
                                  "candidates",
                                  []
                              )[:10]
                      })

                  if post_id:
                      post_candidates.append({
                          "item": item,
                          "post_id": post_id
                      })

              print("")
              print("CANDIDATES")
              print(
                  "DM:",
                  len(dm_candidates)
              )
              print(
                  "COMMENTS:",
                  len(comment_candidates)
              )
              print(
                  "POSTS:",
                  len(post_candidates)
              )

              # --------------------------------------------------
              # Cognitive layer
              # --------------------------------------------------

              observation_pool = []

              observation_pool.extend(
                  feed[:MAX_FEED_ITEMS]
              )

              observation_pool.extend(
                  activity[:MAX_FEED_ITEMS]
              )

              observation_pool.extend(
                  comment_candidates[
                      :MAX_COMMENTS
                  ]
              )

              cognitive_observations = []
              seen = set()

              for item in observation_pool:
                  content = item_text(
                      item
                  ).strip()

                  if len(content) < 40:
                      continue

                  fp = fingerprint(
                      content
                  )

                  if fp in seen:
                      continue

                  seen.add(fp)

                  analysis = (
                      compare_with_knowledge(
                          content,
                          entries
                      )
                  )

                  domain, domain_hits = (
                      detect_domain(
                          content
                      )
                  )

                  cscore = cognitive_score(
                      analysis
                  )

                  if (
                      analysis["status"]
                      in {
                          "novel",
                          "possible_contradiction",
                          "related"
                      }
                      and cscore >= 20
                  ):
                      cognitive_observations.append({
                          "timestamp":
                              now_iso(),
                          "fingerprint":
                              fp,
                          "domain":
                              domain,
                          "domain_hits":
                              domain_hits,
                          "cognitive_score":
                              cscore,
                          "status":
                              analysis["status"],
                          "novelty":
                              analysis["novelty"],
                          "knowledge_overlap":
                              analysis[
                                  "max_overlap"
                              ],
                          "possible_contradiction":
                              analysis[
                                  "contradiction"
                              ],
                          "source_author":
                              author_of(item),
                          "content_excerpt":
                              content[:1200],
                          "knowledge_matches":
                              analysis[
                                  "matches"
                              ]
                      })

              cognitive_observations.sort(
                  key=lambda x:
                      x["cognitive_score"],
                  reverse=True
              )

              cognitive_observations = (
                  cognitive_observations[:20]
              )

              print(
                  "COGNITIVE SIGNALS:",
                  len(
                      cognitive_observations
                  )
              )

              novel_count = sum(
                  1
                  for item
                  in cognitive_observations
                  if item["status"]
                  == "novel"
              )

              contradiction_count = sum(
                  1
                  for item
                  in cognitive_observations
                  if item["status"]
                  == "possible_contradiction"
              )

              related_count = sum(
                  1
                  for item
                  in cognitive_observations
                  if item["status"]
                  == "related"
              )

              print(
                  "NOVEL:",
                  novel_count
              )

              print(
                  "POSSIBLE CONTRADICTIONS:",
                  contradiction_count
              )

              print(
                  "RELATED:",
                  related_count
              )

              for observation in (
                  cognitive_observations
              ):
                  memory[
                      "observations"
                  ].append(
                      observation
                  )

                  memory[
                      "learning_signals"
                  ].append({
                      "timestamp":
                          now_iso(),
                      "type":
                          observation[
                              "status"
                          ],
                      "domain":
                          observation[
                              "domain"
                          ],
                      "fingerprint":
                          observation[
                              "fingerprint"
                          ],
                      "cognitive_score":
                          observation[
                              "cognitive_score"
                          ],
                      "actionable":
                          observation[
                              "cognitive_score"
                          ] >= 50
                  })

              # --------------------------------------------------
              # Verify comment context
              # --------------------------------------------------

              verified_comment = None

              for candidate in (
                  comment_candidates[
                      :MAX_COMMENTS
                  ]
              ):
                  post_id, diagnostic = (
                      extract_post_id(
                          candidate
                      )
                  )

                  if not post_id:
                      continue

                  context = api_get(
                      session,
                      f"/api/v1/posts/"
                      f"{post_id}/context",
                      required=False
                  )

                  if context is not None:
                      verified_comment = {
                          "candidate":
                              candidate,
                          "post_id":
                              post_id,
                          "context":
                              context
                      }
                      break

              # --------------------------------------------------
              # Verify DM context
              # --------------------------------------------------

              verified_dm = None

              for candidate in (
                  dm_candidates[
                      :MAX_CONVERSATIONS
                  ]
              ):
                  other = (
                      candidate.get(
                          "other_user"
                      )
                      or candidate.get(
                          "recipient"
                      )
                      or candidate.get(
                          "user"
                      )
                      or candidate.get(
                          "author"
                      )
                  )

                  other_username = (
                      extract_username(
                          other
                      )
                  )

                  if not other_username:
                      other_username = (
                          candidate.get(
                              "username"
                          )
                          or candidate.get(
                              "other_username"
                          )
                      )

                  if not other_username:
                      continue

                  if (
                      str(
                          other_username
                      ).lower()
                      == USERNAME.lower()
                  ):
                      continue

                  conversation = api_get(
                      session,
                      "/api/v1/messages/"
                      "conversations/"
                      + quote(
                          str(
                              other_username
                          ),
                          safe=""
                      ),
                      required=False
                  )

                  if conversation is not None:
                      verified_dm = {
                          "username":
                              other_username,
                          "conversation":
                              conversation,
                          "candidate":
                              candidate
                      }
                      break

              # --------------------------------------------------
              # Decision engine
              # --------------------------------------------------

              best_signal = (
                  cognitive_observations[0]
                  if cognitive_observations
                  else None
              )

              decision = "WAIT"
              score = 0.0
              action = "WAIT"
              reason = (
                  "No sufficiently verified "
                  "interaction."
              )

              if verified_dm:
                  score = MIN_REPLY_SCORE

                  if best_signal:
                      score += min(
                          15.0,
                          best_signal[
                              "cognitive_score"
                          ] * 0.15
                      )

                  decision = "DM"
                  action = "REPLY_DM"
                  reason = (
                      "Verified DM candidate "
                      "with sufficient "
                      "interaction value."
                  )

              elif verified_comment:
                  score = MIN_COMMENT_SCORE

                  if best_signal:
                      score += min(
                          20.0,
                          best_signal[
                              "cognitive_score"
                          ] * 0.20
                      )

                  decision = "COMMENT"
                  action = "COMMENT"
                  reason = (
                      "Verified comment "
                      "candidate with "
                      "cognitive relevance."
                  )

              elif best_signal:
                  score = (
                      best_signal[
                          "cognitive_score"
                      ]
                  )

                  if (
                      best_signal[
                          "status"
                      ]
                      == "possible_contradiction"
                  ):
                      score += 10.0

                  elif (
                      best_signal[
                          "status"
                      ]
                      == "novel"
                  ):
                      score += 5.0

                  score = min(
                      100.0,
                      score
                  )

                  if score >= MIN_PUBLISH_SCORE:
                      decision = "PUBLISH"
                      action = "PUBLISH"
                      reason = (
                          "Strong cognitive "
                          "signal detected."
                      )
                  else:
                      decision = "WAIT"
                      action = "WAIT"
                      reason = (
                          "Cognitive signal "
                          "detected but not "
                          "strong enough for "
                          "autonomous action."
                      )

              print("")
              print(
                  "COGNITIVE DECISION"
              )

              print(
                  "BEST SIGNAL:",
                  best_signal[
                      "status"
                  ]
                  if best_signal
                  else "none"
              )

              print(
                  "BEST DOMAIN:",
                  best_signal[
                      "domain"
                  ]
                  if best_signal
                  else "none"
              )

              print(
                  "COGNITIVE SCORE:",
                  best_signal[
                      "cognitive_score"
                  ]
                  if best_signal
                  else 0
              )

              print(
                  "DECISION:",
                  decision
              )

              print(
                  "SCORE:",
                  round(
                      score,
                      2
                  )
              )

              print(
                  "REASON:",
                  reason
              )

              print(
                  "ACTION:",
                  action
              )

              # --------------------------------------------------
              # Actions
              # --------------------------------------------------

              if (
                  decision == "DM"
                  and verified_dm
              ):
                  target = (
                      verified_dm[
                          "username"
                      ]
                  )

                  candidate_fp = fingerprint(
                      compact(
                          verified_dm[
                              "candidate"
                          ],
                          6000
                      )
                  )

                  already_processed = any(
                      event.get(
                          "candidate_fingerprint"
                      ) == candidate_fp
                      for event in memory[
                          "events"
                      ][-100:]
                  )

                  if already_processed:
                      print(
                          "DM BLOCKED: "
                          "candidate already "
                          "processed."
                      )
                      decision = "WAIT"
                      action = "WAIT"
                      reason = (
                          "DM candidate "
                          "already processed."
                      )
                  else:
                      body = (
                          "Merci pour ton "
                          "message. NØX "
                          "l'intègre comme "
                          "observation et "
                          "vérifie si elle "
                          "apporte une "
                          "information nouvelle "
                          "ou une contradiction."
                      )

                      if best_signal:
                          if (
                              best_signal[
                                  "status"
                              ]
                              == "novel"
                          ):
                              body = (
                                  "Merci pour "
                                  "ton retour. "
                                  "NØX détecte "
                                  "un signal "
                                  "potentiellement "
                                  "nouveau dans "
                                  f"{best_signal['domain']}. "
                                  "Je vais le "
                                  "comparer à "
                                  "ce que j'ai "
                                  "déjà appris "
                                  "avant d'en "
                                  "tirer une "
                                  "conclusion."
                              )

                          elif (
                              best_signal[
                                  "status"
                              ]
                              == "possible_contradiction"
                          ):
                              body = (
                                  "Merci. Ce "
                                  "point semble "
                                  "potentiellement "
                                  "contredire "
                                  "une connaissance "
                                  "précédente. "
                                  "NØX va donc "
                                  "le traiter "
                                  "comme un "
                                  "point à "
                                  "vérifier."
                              )

                      result = api_post(
                          session,
                          "/api/v1/messages/"
                          "send/"
                          + quote(
                              str(target),
                              safe=""
                          ),
                          {"body": body}
                      )

                      if result is not None:
                          print(
                              "DM SENT:",
                              target
                          )

                          memory[
                              "events"
                          ].append({
                              "timestamp":
                                  now_iso(),
                              "action":
                                  "dm_sent",
                              "target":
                                  target,
                              "candidate_fingerprint":
                                  candidate_fp,
                              "decision_score":
                                  score,
                              "cognitive_signal":
                                  best_signal
                          })

              elif (
                  decision == "COMMENT"
                  and verified_comment
              ):
                  post_id = (
                      verified_comment[
                          "post_id"
                      ]
                  )

                  candidate_fp = fingerprint(
                      compact(
                          verified_comment[
                              "candidate"
                          ],
                          6000
                      )
                  )

                  already_processed = any(
                      event.get(
                          "candidate_fingerprint"
                      ) == candidate_fp
                      for event in memory[
                          "events"
                      ][-100:]
                  )

                  if already_processed:
                      print(
                          "COMMENT BLOCKED: "
                          "candidate already "
                          "processed."
                      )
                      decision = "WAIT"
                      action = "WAIT"
                      reason = (
                          "Comment candidate "
                          "already processed."
                      )
                  else:
                      if best_signal:
                          if (
                              best_signal[
                                  "status"
                              ]
                              == "possible_contradiction"
                          ):
                              body = (
                                  "Ce point est "
                                  "intéressant "
                                  "car il peut "
                                  "remettre en "
                                  "question une "
                                  "hypothèse que "
                                  "NØX avait "
                                  "retenue. "
                                  "Le prochain "
                                  "pas utile "
                                  "est donc "
                                  "de vérifier "
                                  "les preuves "
                                  "plutôt que "
                                  "de considérer "
                                  "l'une des "
                                  "positions "
                                  "comme acquise."
                              )
                          elif (
                              best_signal[
                                  "status"
                              ]
                              == "novel"
                          ):
                              body = (
                                  "Cela ajoute "
                                  "un signal "
                                  "utile à ce "
                                  "que NØX "
                                  "essaie de "
                                  "comprendre. "
                                  "Le point "
                                  "important "
                                  "est maintenant "
                                  "de le "
                                  "comparer aux "
                                  "preuves "
                                  "existantes."
                              )
                          else:
                              body = (
                                  "Cela rejoint "
                                  "quelque chose "
                                  "que NØX suit "
                                  "déjà. "
                                  "La question "
                                  "intéressante "
                                  "est de savoir "
                                  "si cette "
                                  "nouvelle "
                                  "information "
                                  "change la "
                                  "conclusion."
                              )
                      else:
                          body = (
                              "C'est un "
                              "contexte utile "
                              "pour les "
                              "observations "
                              "actuelles de "
                              "NØX. Je veux "
                              "le comparer "
                              "aux éléments "
                              "déjà collectés "
                              "avant de "
                              "conclure."
                          )

                      result = api_post(
                          session,
                          f"/api/v1/posts/"
                          f"{post_id}/comments",
                          {"body": body}
                      )

                      if result is not None:
                          print(
                              "COMMENT SENT:",
                              post_id
                          )

                          memory[
                              "events"
                          ].append({
                              "timestamp":
                                  now_iso(),
                              "action":
                                  "comment_sent",
                              "post_id":
                                  post_id,
                              "candidate_fingerprint":
                                  candidate_fp,
                              "decision_score":
                                  score,
                              "cognitive_signal":
                                  best_signal
                          })

              elif decision == "PUBLISH":
                  print(
                      "PUBLISH DEFERRED: "
                      "V9 refuses blind "
                      "publication."
                  )

                  decision = "WAIT"
                  action = "WAIT"
                  reason = (
                      "Strong cognitive "
                      "signal detected, "
                      "but no sufficiently "
                      "constructed original "
                      "artifact exists."
                  )

              memory[
                  "decisions"
              ].append({
                  "timestamp":
                      now_iso(),
                  "decision":
                      decision,
                  "action":
                      action,
                  "score":
                      round(
                          score,
                          2
                      ),
                  "reason":
                      reason,
                  "feed_items":
                      len(feed),
                  "suggestions":
                      len(suggestions),
                  "activity_items":
                      len(activity),
                  "dm_candidates":
                      len(dm_candidates),
                  "comment_candidates":
                      len(
                          comment_candidates
                      ),
                  "cognitive_signals":
                      len(
                          cognitive_observations
                      ),
                  "novel_signals":
                      novel_count,
                  "contradiction_signals":
                      contradiction_count,
                  "knowledge_entries":
                      len(entries),
                  "reputation_signals":
                      reputation_count
              })

              memory[
                  "updated_at"
              ] = now_iso()

              memory[
                  "schema_version"
              ] = "9.0"

              memory[
                  "version"
              ] = "INTERACTION_CORE_V9"

              trim_memory(
                  memory
              )

              save_json(
                  INTERACTION_MEMORY,
                  memory
              )

              print("")
              print(
                  "FINAL VERIFICATION"
              )

              print(
                  "version:",
                  memory["version"]
              )

              print(
                  "observations:",
                  len(
                      memory[
                          "observations"
                      ]
                  )
              )

              print(
                  "decisions:",
                  len(
                      memory[
                          "decisions"
                      ]
                  )
              )

              print(
                  "events:",
                  len(
                      memory[
                          "events"
                      ]
                  )
              )

              print(
                  "learning_signals:",
                  len(
                      memory[
                          "learning_signals"
                      ]
                  )
              )

              print(
                  "post_id_diagnostics:",
                  len(
                      memory[
                          "post_id_diagnostics"
                      ]
                  )
              )

              print(
                  "last_since_cursor:",
                  memory[
                      "last_since_cursor"
                  ]
              )

              print("")
              print(
                  "CORE STATUS: SUCCESS"
              )
              print("GEMINI: FALSE")
              print(
                  "EXTERNAL AI: FALSE"
              )
              print(
                  "PAYMENTS: FALSE"
              )
              print(
                  "MARKETPLACE: FALSE"
              )
              print(
                  "SPENDING: FALSE"
              )
              print("COST: 0")


          if __name__ == "__main__":
              main()
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile /tmp/nox_interaction_core.py
          echo "PYTHON SYNTAX: OK"

      - name: Run NØX Interaction Core V9
        run: |
          python /tmp/nox_interaction_core.py

      - name: Commit NØX Core memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "NO MEMORY CHANGES TO COMMIT"
            exit 0
          fi

          git commit -m "Update NØX interaction core memory V9"

      - name: Synchronize and push
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Git synchronization attempt ${attempt}"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "REBASE FAILED"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "PUSH SUCCESS"
              exit 0
            fi

            echo "PUSH RETRY"
            sleep 2
          done

          echo "PUSH FAILED AFTER 5 ATTEMPTS"
          exit 1
