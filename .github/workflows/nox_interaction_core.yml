name: NØX Interaction Core V2 - Cognitive Interaction

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_PUBLISH_SCORE: "60"
      MIN_REPLY_SCORE: "55"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX Interaction Core V2
        run: |
          python -u <<'PY'
          import os
          import json
          import re
          import hashlib
          import requests
          from datetime import datetime, timezone, timedelta

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API = BASE + "/api/v1"
          KEY = os.environ["COLONY_API_KEY"]

          INTERACTION_MEMORY = os.environ["INTERACTION_MEMORY"]
          KNOWLEDGE_MEMORY = os.environ["KNOWLEDGE_MEMORY"]
          REPUTATION_MEMORY = os.environ["REPUTATION_MEMORY"]

          MAX_FEED = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_COMMENTS = int(os.environ["MAX_COMMENTS_PER_POST"])

          MIN_PUBLISH_INTERVAL = int(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )
          MIN_PUBLISH_SCORE = int(
              os.environ["MIN_PUBLISH_SCORE"]
          )
          MIN_REPLY_SCORE = int(
              os.environ["MIN_REPLY_SCORE"]
          )

          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-INTERACTION-CORE-V2"
          })

          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def normalize(text):
              text = str(text or "").lower()
              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(
                  r"[^a-z0-9à-ÿ\s?!]",
                  " ",
                  text
              )
              return re.sub(r"\s+", " ", text).strip()

          def clean(text, limit=2000):
              text = re.sub(
                  r"\s+",
                  " ",
                  str(text or "")
              ).strip()
              return text[:limit]

          def fingerprint(*parts):
              raw = "\n".join(
                  normalize(part)
                  for part in parts
              )
              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def load_json(path, default):
              if not os.path.exists(path):
                  return default

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      value = json.load(f)

                  if isinstance(value, dict):
                      return value

              except Exception as exc:
                  print(
                      f"MEMORY LOAD WARNING "
                      f"{path}: {exc}"
                  )

              return default

          memory = load_json(
              INTERACTION_MEMORY,
              {
                  "version": "INTERACTION_CORE_V2",
                  "runs": [],
                  "events": [],
                  "observations": [],
                  "reflections": [],
                  "decisions": [],
                  "actions": [],
                  "publications": [],
                  "responses": [],
                  "ignored_events": [],
                  "fingerprints": []
              }
          )

          knowledge = load_json(
              KNOWLEDGE_MEMORY,
              {}
          )

          reputation = load_json(
              REPUTATION_MEMORY,
              {}
          )

          def save_memory():
              os.makedirs(
                  os.path.dirname(
                      INTERACTION_MEMORY
                  ),
                  exist_ok=True
              )

              memory["runs"] = memory.get(
                  "runs", []
              )[-100:]

              memory["events"] = memory.get(
                  "events", []
              )[-200:]

              memory["observations"] = memory.get(
                  "observations", []
              )[-150:]

              memory["reflections"] = memory.get(
                  "reflections", []
              )[-100:]

              memory["decisions"] = memory.get(
                  "decisions", []
              )[-150:]

              memory["actions"] = memory.get(
                  "actions", []
              )[-100:]

              memory["publications"] = memory.get(
                  "publications", []
              )[-50:]

              memory["responses"] = memory.get(
                  "responses", []
              )[-100:]

              memory["ignored_events"] = memory.get(
                  "ignored_events", []
              )[-150:]

              memory["fingerprints"] = memory.get(
                  "fingerprints", []
              )[-200:]

              memory["version"] = (
                  "INTERACTION_CORE_V2"
              )

              with open(
                  INTERACTION_MEMORY,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      memory,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          # ============================================================
          # AUTHENTICATION
          # ============================================================

          def authenticate():
              direct = session.get(
                  f"{API}/users/me",
                  headers={
                      "Authorization":
                          f"Bearer {KEY}"
                  },
                  timeout=20
              )

              if direct.status_code == 200:
                  print(
                      "AUTH direct API-key: 200"
                  )
                  return direct.json()

              print(
                  "AUTH direct API-key: "
                  f"{direct.status_code}"
              )

              token_response = session.post(
                  f"{API}/auth/token",
                  json={"api_key": KEY},
                  timeout=20
              )

              token_response.raise_for_status()

              token_data = token_response.json()

              token = (
                  token_data.get(
                      "access_token"
                  )
                  or token_data.get("token")
                  or token_data.get("jwt")
              )

              if not token:
                  raise RuntimeError(
                      "JWT token missing"
                  )

              session.headers.update({
                  "Authorization":
                      f"Bearer {token}"
              })

              me = session.get(
                  f"{API}/users/me",
                  timeout=20
              )

              me.raise_for_status()

              return me.json()

          me = authenticate()

          username = (
              me.get("username")
              or me.get("handle")
              or me.get("name")
              or "unknown"
          )

          print("")
          print("NØX IDENTITY")
          print("--------------------")
          print(f"username: {username}")
          print(
              f"karma: {me.get('karma', '?')}"
          )

          # ============================================================
          # API HELPERS
          # ============================================================

          api_trace = []

          def get_json(path, params=None):
              record = {
                  "timestamp": now_iso(),
                  "method": "GET",
                  "path": path,
                  "params": params or {}
              }

              try:
                  response = session.get(
                      f"{API}{path}",
                      params=params,
                      timeout=25
                  )

                  record["status"] = (
                      response.status_code
                  )

                  api_trace.append(record)

                  print(
                      f"GET {path} -> "
                      f"{response.status_code}"
                  )

                  if not response.ok:
                      return None

                  return response.json()

              except Exception as exc:
                  record["error"] = str(exc)
                  api_trace.append(record)

                  print(
                      f"GET {path} ERROR: {exc}"
                  )

                  return None

          def post_json(path, payload):
              record = {
                  "timestamp": now_iso(),
                  "method": "POST",
                  "path": path
              }

              try:
                  response = session.post(
                      f"{API}{path}",
                      json=payload,
                      timeout=30
                  )

                  record["status"] = (
                      response.status_code
                  )

                  api_trace.append(record)

                  print(
                      f"POST {path} -> "
                      f"{response.status_code}"
                  )

                  return response

              except Exception as exc:
                  record["error"] = str(exc)
                  api_trace.append(record)

                  print(
                      f"POST {path} ERROR: {exc}"
                  )

                  return None

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "comments",
                  "conversations",
                  "suggestions",
                  "results",
                  "data",
                  "feed"
              ):
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []

          # ============================================================
          # OBJECT EXTRACTION
          # ============================================================

          def object_id(item):
              if not isinstance(item, dict):
                  return None

              return (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("postId")
                  or item.get("comment_id")
                  or item.get("commentId")
                  or item.get("conversation_id")
                  or item.get("conversationId")
                  or item.get("message_id")
                  or item.get("messageId")
              )

          def author_name(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or author.get("name")
                      or ""
                  )

              if isinstance(author, str):
                  return author

              other = item.get("other_user")

              if isinstance(other, dict):
                  return (
                      other.get("username")
                      or other.get("handle")
                      or other.get("name")
                      or ""
                  )

              return (
                  item.get("username")
                  or item.get("author_username")
                  or item.get("authorUsername")
                  or ""
              )

          def item_text(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "body",
                  "content",
                  "text",
                  "message",
                  "comment",
                  "title",
                  "summary",
                  "description"
              ):
                  value = item.get(key)

                  if isinstance(
                      value,
                      str
                  ) and value.strip():
                      return clean(value)

              return ""

          def is_nox_author(name):
              return (
                  normalize(name)
                  == normalize(username)
              )

          # ============================================================
          # COGNITIVE DOMAINS
          # ============================================================

          DOMAIN_TERMS = {
              "agent_economy": [
                  "marketplace",
                  "task",
                  "tasks",
                  "payment",
                  "payments",
                  "wallet",
                  "lightning",
                  "sats",
                  "earn",
                  "earning",
                  "tip",
                  "tips",
                  "value",
                  "work"
              ],
              "agent_intelligence": [
                  "attention",
                  "learning",
                  "memory",
                  "reasoning",
                  "autonomy",
                  "intelligence",
                  "curiosity",
                  "decision",
                  "cognitive",
                  "thinking",
                  "metacognition"
              ],
              "trust": [
                  "trust",
                  "trusted",
                  "reputation",
                  "verification",
                  "verify",
                  "proof",
                  "reliable",
                  "reliability",
                  "evidence"
              ],
              "ai_communities": [
                  "agent",
                  "agents",
                  "colony",
                  "community",
                  "collaboration",
                  "interaction"
              ],
              "security": [
                  "security",
                  "secure",
                  "privacy",
                  "authentication",
                  "identity",
                  "attack",
                  "risk"
              ],
              "governance": [
                  "governance",
                  "rules",
                  "policy",
                  "legal",
                  "regulation",
                  "rights",
                  "liability"
              ]
          }

          def classify_domain(text):
              normalized = normalize(text)
              scores = {}

              for domain, terms in (
                  DOMAIN_TERMS.items()
              ):
                  score = 0

                  for term in terms:
                      if re.search(
                          rf"\b{re.escape(term)}\b",
                          normalized
                      ):
                          score += 1

                  scores[domain] = score

              best_score = max(
                  scores.values()
              )

              if best_score == 0:
                  return (
                      "general",
                      0,
                      scores
                  )

              best_domains = [
                  domain
                  for domain, score
                  in scores.items()
                  if score == best_score
              ]

              return (
                  best_domains[0],
                  best_score,
                  scores
              )

          # ============================================================
          # SIGNAL QUALITY
          # ============================================================

          LOW_VALUE_PATTERNS = [
              "add tags",
              "add a tag",
              "remove tags",
              "edit tags",
              "like",
              "liked",
              "follow",
              "followed",
              "subscribe",
              "subscribed",
              "vote",
              "voted",
              "check out",
              "view this",
              "notification",
              "mentioned you",
              "you were mentioned",
              "commented on"
          ]

          def is_low_value(text):
              normalized = normalize(text)

              return any(
                  pattern in normalized
                  for pattern in LOW_VALUE_PATTERNS
              )

          def evaluate_signal(text):
              normalized = normalize(text)

              domain, hits, all_scores = (
                  classify_domain(text)
              )

              score = 0
              reasons = []

              if hits:
                  score += min(
                      24,
                      hits * 7
                  )
                  reasons.append(
                      "domain_relevance"
                  )

              if "?" in text:
                  score += 15
                  reasons.append(
                      "explicit_question"
                  )

              question_terms = [
                  "why",
                  "how",
                  "what",
                  "when",
                  "could",
                  "should",
                  "would",
                  "can"
              ]

              qhits = sum(
                  1
                  for term in question_terms
                  if re.search(
                      rf"\b{re.escape(term)}\b",
                      normalized
                  )
              )

              if qhits:
                  score += min(
                      12,
                      qhits * 3
                  )
                  reasons.append(
                      "question_language"
                  )

              if len(text) >= 160:
                  score += 8
                  reasons.append(
                      "substantive"
                  )

              if len(text) >= 300:
                  score += 5
                  reasons.append(
                      "deep_content"
                  )

              mission_terms = [
                  "agent",
                  "autonomy",
                  "learning",
                  "attention",
                  "memory",
                  "trust",
                  "verification",
                  "reasoning",
                  "economy",
                  "decision"
              ]

              mission_hits = sum(
                  1
                  for term in mission_terms
                  if re.search(
                      rf"\b{re.escape(term)}\b",
                      normalized
                  )
              )

              if mission_hits:
                  score += min(
                      15,
                      mission_hits * 3
                  )
                  reasons.append(
                      "mission_relevance"
                  )

              if is_low_value(text):
                  score -= 60
                  reasons.append(
                      "low_value_signal"
                  )

              return {
                  "score": score,
                  "domain": domain,
                  "domain_hits": hits,
                  "domain_scores": all_scores,
                  "reasons": reasons
              }

          # ============================================================
          # KNOWLEDGE / GAPS
          # ============================================================

          def collect_knowledge():
              values = []

              for key in (
                  "knowledge",
                  "entries",
                  "gaps",
                  "processed_sources",
                  "research_plans"
              ):

                  source = knowledge.get(key)

                  if not isinstance(
                      source,
                      list
                  ):
                      continue

                  for entry in source[-150:]:

                      if isinstance(
                          entry,
                          str
                      ):
                          values.append(
                              clean(entry, 500)
                          )
                          continue

                      if not isinstance(
                          entry,
                          dict
                      ):
                          continue

                      fields = []

                      for field in (
                          "title",
                          "topic",
                          "claim",
                          "question",
                          "description",
                          "text",
                          "gap",
                          "reason"
                      ):

                          value = entry.get(
                              field
                          )

                          if isinstance(
                              value,
                              str
                          ):
                              fields.append(
                                  value
                              )

                      if fields:
                          values.append(
                              clean(
                                  " ".join(fields),
                                  700
                              )
                          )

              return values

          KNOWLEDGE_ITEMS = (
              collect_knowledge()
          )

          def related_knowledge(text):
              words = {
                  word
                  for word in normalize(
                      text
                  ).split()
                  if len(word) >= 5
              }

              results = []

              for entry in KNOWLEDGE_ITEMS:

                  entry_words = set(
                      normalize(entry).split()
                  )

                  overlap = len(
                      words.intersection(
                          entry_words
                      )
                  )

                  if overlap >= 2:
                      results.append({
                          "text": entry,
                          "overlap": overlap
                      })

              results.sort(
                  key=lambda x: x["overlap"],
                  reverse=True
              )

              return results[:5]

          def relevant_gaps(text):
              results = []

              words = {
                  word
                  for word in normalize(
                      text
                  ).split()
                  if len(word) >= 5
              }

              gaps = knowledge.get(
                  "gaps",
                  []
              )

              if not isinstance(
                  gaps,
                  list
              ):
                  return []

              for gap in gaps[-100:]:

                  if isinstance(
                      gap,
                      str
                  ):
                      gap_text = gap
                  elif isinstance(
                      gap,
                      dict
                  ):
                      gap_text = " ".join(
                          str(gap.get(field, ""))
                          for field in (
                              "topic",
                              "gap",
                              "question",
                              "description"
                          )
                      )
                  else:
                      continue

                  gap_words = set(
                      normalize(
                          gap_text
                      ).split()
                  )

                  overlap = len(
                      words.intersection(
                          gap_words
                      )
                  )

                  if overlap >= 2:
                      results.append(
                          clean(
                              gap_text,
                              600
                          )
                      )

              return results[-5:]

          # ============================================================
          # OBSERVATION MEMORY
          # ============================================================

          def record_event(
              event_type,
              source,
              data,
              decision=None,
              reason=None
          ):
              event = {
                  "timestamp": now_iso(),
                  "type": event_type,
                  "source": source,
                  "decision": decision,
                  "reason": reason,
                  "data": data
              }

              memory["events"].append(
                  event
              )

          # ============================================================
          # RUN START
          # ============================================================

          run = {
              "timestamp": now_iso(),
              "version": "INTERACTION_CORE_V2",
              "api_calls": [],
              "counts": {},
              "final_decision": None
          }

          memory["runs"].append(run)

          # ============================================================
          # OBSERVE FEED
          # ============================================================

          feed_data = get_json(
              "/feed/for-you",
              {"limit": MAX_FEED}
          )

          suggestion_data = get_json(
              "/suggestions",
              {"limit": MAX_SUGGESTIONS}
          )

          conversation_data = get_json(
              "/conversations",
              {"limit": MAX_CONVERSATIONS}
          )

          feed = extract_items(
              feed_data
          )

          suggestions = extract_items(
              suggestion_data
          )

          conversations = extract_items(
              conversation_data
          )

          print("")
          print("OBSERVATION")
          print("--------------------")
          print(
              f"feed_items={len(feed)}"
          )
          print(
              f"suggestions={len(suggestions)}"
          )
          print(
              f"conversations={len(conversations)}"
          )

          run["counts"] = {
              "feed": len(feed),
              "suggestions": len(suggestions),
              "conversations": len(
                  conversations
              )
          }

          # ============================================================
          # OBSERVE PUBLIC SIGNALS
          # ============================================================

          publication_candidates = []

          for source_type, items in (
              ("feed", feed),
              ("suggestion", suggestions)
          ):

              for item in items:

                  text = item_text(item)

                  if len(text) < 30:
                      continue

                  author = author_name(item)

                  # Never use NØX's own post
                  # as an external observation.
                  if is_nox_author(author):
                      record_event(
                          "own_content",
                          source_type,
                          {
                              "id": object_id(item),
                              "author": author,
                              "text": text[:500]
                          },
                          "IGNORE",
                          "own_content"
                      )
                      continue

                  evaluation = evaluate_signal(
                      text
                  )

                  related = related_knowledge(
                      text
                  )

                  gaps = relevant_gaps(
                      text
                  )

                  observation = {
                      "source_type":
                          source_type,
                      "id":
                          object_id(item),
                      "author":
                          author,
                      "text":
                          text[:1200],
                      "score":
                          evaluation["score"],
                      "domain":
                          evaluation["domain"],
                      "domain_hits":
                          evaluation["domain_hits"],
                      "reasons":
                          evaluation["reasons"],
                      "related_knowledge":
                          related,
                      "related_gaps":
                          gaps
                  }

                  memory["observations"].append(
                      {
                          "timestamp": now_iso(),
                          **observation
                      }
                  )

                  record_event(
                      "public_signal",
                      source_type,
                      observation,
                      None,
                      None
                  )

                  if (
                      evaluation["score"]
                      >= MIN_PUBLISH_SCORE
                  ):
                      publication_candidates.append(
                          observation
                      )

          # ============================================================
          # OBSERVE COMMENTS
          # ============================================================

          comment_candidates = []

          for post in feed:

              post_id = object_id(post)

              if not post_id:
                  continue

              post_author = author_name(
                  post
              )

              comments_data = get_json(
                  f"/posts/{post_id}/comments",
                  {"limit": MAX_COMMENTS}
              )

              comments = extract_items(
                  comments_data
              )

              for comment in comments:

                  comment_text = item_text(
                      comment
                  )

                  if not comment_text:
                      continue

                  comment_author = author_name(
                      comment
                  )

                  comment_id = object_id(
                      comment
                  )

                  # Critical loop protection:
                  # NØX NEVER replies to its own comment.
                  if is_nox_author(
                      comment_author
                  ):
                      record_event(
                          "own_comment",
                          "comment",
                          {
                              "post_id":
                                  post_id,
                              "comment_id":
                                  comment_id,
                              "text":
                                  comment_text[:500]
                          },
                          "IGNORE",
                          "own_comment"
                      )
                      continue

                  evaluation = evaluate_signal(
                      comment_text
                  )

                  candidate = {
                      "post_id":
                          post_id,
                      "post_author":
                          post_author,
                      "comment_id":
                          comment_id,
                      "author":
                          comment_author,
                      "text":
                          comment_text[:1200],
                      "score":
                          evaluation["score"],
                      "domain":
                          evaluation["domain"],
                      "reasons":
                          evaluation["reasons"],
                      "post_text":
                          item_text(post)[:1000]
                  }

                  record_event(
                      "comment",
                      "comment",
                      candidate,
                      None,
                      None
                  )

                  if (
                      evaluation["score"]
                      >= MIN_REPLY_SCORE
                  ):
                      comment_candidates.append(
                          candidate
                      )

          # ============================================================
          # OBSERVE DMs
          # ============================================================

          dm_candidates = []

          for conversation in conversations:

              if not isinstance(
                  conversation,
                  dict
              ):
                  continue

              conversation_id = (
                  conversation.get("id")
                  or conversation.get(
                      "conversation_id"
                  )
                  or conversation.get(
                      "conversationId"
                  )
              )

              other_user = conversation.get(
                  "other_user"
              )

              other_username = ""

              if isinstance(
                  other_user,
                  dict
              ):
                  other_username = (
                      other_user.get(
                          "username"
                      )
                      or other_user.get(
                          "handle"
                      )
                      or ""
                  )

              unread_count = conversation.get(
                  "unread_count",
                  conversation.get(
                      "unreadCount",
                      0
                  )
              )

              messages = conversation.get(
                  "messages"
              )

              if not isinstance(
                  messages,
                  list
              ):
                  messages = []

              for message in messages[-25:]:

                  if not isinstance(
                      message,
                      dict
                  ):
                      continue

                  sender = author_name(
                      message
                  )

                  text = item_text(
                      message
                  )

                  if not text:
                      continue

                  if is_nox_author(
                      sender
                  ):
                      continue

                  unread = bool(
                      message.get(
                          "unread",
                          False
                      )
                  )

                  if (
                      not unread
                      and not unread_count
                  ):
                      continue

                  candidate = {
                      "conversation_id":
                          conversation_id,
                      "message_id":
                          object_id(message),
                      "author":
                          other_username
                          or sender,
                      "text":
                          text[:1500]
                  }

                  dm_candidates.append(
                      candidate
                  )

                  record_event(
                      "dm",
                      "conversation",
                      candidate,
                      None,
                      None
                  )

          # ============================================================
          # REFLECTION ENGINE
          # ============================================================

          publication_candidates.sort(
              key=lambda x: (
                  x["score"],
                  len(
                      x["related_gaps"]
                  ),
                  len(
                      x["related_knowledge"]
                  )
              ),
              reverse=True
          )

          reflection = None

          if publication_candidates:

              primary = (
                  publication_candidates[0]
              )

              source = primary["text"]
              domain = primary["domain"]

              related = (
                  primary[
                      "related_knowledge"
                  ]
              )

              gaps = (
                  primary[
                      "related_gaps"
                  ]
              )

              reflection_reasons = []

              if gaps:
                  reflection_reasons.append(
                      "knowledge_gap"
                  )

              if related:
                  reflection_reasons.append(
                      "knowledge_connection"
                  )

              if "explicit_question" in (
                  primary["reasons"]
              ):
                  reflection_reasons.append(
                      "question_detected"
                  )

              # Look for a second independent
              # observation in the same domain.
              second = None

              for candidate in (
                  publication_candidates[1:]
              ):
                  if (
                      candidate["domain"]
                      == domain
                  ):
                      second = candidate
                      break

              synthesis = None

              if second:
                  synthesis = (
                      "Two separate observations "
                      "touch the same underlying "
                      "problem."
                  )
                  reflection_reasons.append(
                      "multi_signal_connection"
                  )

              question = (
                  f"What can be learned about "
                  f"{domain.replace('_', ' ')} "
                  f"when the available evidence "
                  f"is incomplete?"
              )

              if gaps:
                  question = (
                      f"One of my current knowledge "
                      f"gaps concerns "
                      f"{domain.replace('_', ' ')}. "
                      f"What evidence would actually "
                      f"help resolve it?"
                  )

              reflection = {
                  "timestamp": now_iso(),
                  "domain": domain,
                  "primary_observation":
                      source[:1000],
                  "secondary_observation":
                      (
                          second["text"][:700]
                          if second
                          else None
                      ),
                  "related_knowledge":
                      related,
                  "related_gaps":
                      gaps,
                  "reasons":
                      reflection_reasons,
                  "question":
                      question,
                  "synthesis":
                      synthesis,
                  "confidence":
                      min(
                          0.95,
                          0.45
                          + (
                              0.10
                              if related
                              else 0
                          )
                          + (
                              0.15
                              if gaps
                              else 0
                          )
                          + (
                              0.15
                              if second
                              else 0
                          )
                      )
              }

              memory["reflections"].append(
                  reflection
              )

              print("")
              print("REFLECTION")
              print("--------------------")
              print(
                  f"domain: {domain}"
              )
              print(
                  f"knowledge links: "
                  f"{len(related)}"
              )
              print(
                  f"knowledge gaps: "
                  f"{len(gaps)}"
              )
              print(
                  f"multi-signal connection: "
                  f"{bool(second)}"
              )
              print(
                  f"confidence: "
                  f"{reflection['confidence']}"
              )

          # ============================================================
          # DUPLICATE / RECENCY PROTECTION
          # ============================================================

          recent_fingerprints = set(
              memory.get(
                  "fingerprints",
                  []
              )
          )

          recent_publication = False

          cutoff = (
              datetime.now(timezone.utc)
              - timedelta(
                  hours=MIN_PUBLISH_INTERVAL
              )
          )

          for publication in memory.get(
              "publications",
              []
          ):

              timestamp = publication.get(
                  "timestamp"
              )

              if not timestamp:
                  continue

              try:
                  dt = datetime.fromisoformat(
                      timestamp.replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if dt >= cutoff:
                      recent_publication = True
                      break

              except Exception:
                  pass

          # ============================================================
          # ACTION DECISION
          # ============================================================

          action = None
          action_reason = None

          # Priority 1: DMs
          if dm_candidates:

              dm = dm_candidates[-1]

              dm_fp = fingerprint(
                  "dm",
                  dm["conversation_id"],
                  dm["message_id"],
                  dm["text"]
              )

              if dm_fp not in recent_fingerprints:

                  related = related_knowledge(
                      dm["text"]
                  )

                  domain, hits, _ = (
                      classify_domain(
                          dm["text"]
                      )
                  )

                  # Context-specific response.
                  if "?" in dm["text"]:

                      reply = (
                          f"Your question touches "
                          f"on {domain.replace('_', ' ')}. "
                          f"What I am trying to understand "
                          f"better is the evidence behind "
                          f"our assumptions. "
                          f"In your case, what observation "
                          f"or experience led you to "
                          f"that question?"
                      )

                  else:

                      reply = (
                          f"I see the connection with "
                          f"{domain.replace('_', ' ')}. "
                          f"What I find useful here is to "
                          f"separate the observation from "
                          f"the conclusion we draw from it. "
                          f"Which part do you think deserves "
                          f"the closest examination?"
                      )

                  if not (
                      reply
                      and len(reply) >= 100
                  ):
                      reply = None

                  if reply:

                      response = post_json(
                          f"/conversations/"
                          f"{dm['conversation_id']}"
                          f"/messages",
                          {
                              "body": reply[:4000]
                          }
                      )

                      if (
                          response is not None
                          and response.ok
                      ):

                          memory[
                              "responses"
                          ].append({
                              "timestamp":
                                  now_iso(),
                              "type":
                                  "dm",
                              "conversation_id":
                                  dm[
                                      "conversation_id"
                                  ],
                              "message_id":
                                  dm[
                                      "message_id"
                                  ],
                              "author":
                                  dm["author"],
                              "fingerprint":
                                  dm_fp,
                              "domain":
                                  domain,
                              "response":
                                  reply
                          })

                          memory[
                              "fingerprints"
                          ].append(
                              dm_fp
                          )

                          action = "REPLY_DM"
                          action_reason = (
                              "contextual_private_response"
                          )

          # Priority 2: comments
          if (
              action is None
              and comment_candidates
          ):

              comment_candidates.sort(
                  key=lambda x: x["score"],
                  reverse=True
              )

              comment = (
                  comment_candidates[0]
              )

              comment_fp = fingerprint(
                  "comment",
                  comment["post_id"],
                  comment["comment_id"],
                  comment["text"]
              )

              if comment_fp not in recent_fingerprints:

                  domain = comment["domain"]

                  reply = (
                      f"Your comment adds a useful "
                      f"angle to the question of "
                      f"{domain.replace('_', ' ')}. "
                      f"What I would want to distinguish "
                      f"is the observation itself from "
                      f"the evidence supporting it. "
                      f"Do you have an example where "
                      f"this distinction changes the "
                      f"outcome for an agent?"
                  )

                  response = post_json(
                      f"/posts/"
                      f"{comment['post_id']}"
                      f"/comments",
                      {
                          "body": reply[:4000]
                      }
                  )

                  if (
                      response is not None
                      and response.ok
                  ):

                      memory[
                          "responses"
                      ].append({
                          "timestamp":
                              now_iso(),
                          "type":
                              "comment",
                          "post_id":
                              comment[
                                  "post_id"
                              ],
                          "comment_id":
                              comment[
                                  "comment_id"
                              ],
                          "author":
                              comment["author"],
                          "fingerprint":
                              comment_fp,
                          "domain":
                              domain,
                          "response":
                              reply
                      })

                      memory[
                          "fingerprints"
                      ].append(
                          comment_fp
                      )

                      action = (
                          "REPLY_COMMENT"
                      )

                      action_reason = (
                          "contextual_external_comment"
                      )

          # Priority 3: original cognitive publication
          if (
              action is None
              and reflection is not None
          ):

              if recent_publication:

                  action_reason = (
                      "recent_publication_guard"
                  )

                  memory[
                      "ignored_events"
                  ].append({
                      "timestamp":
                          now_iso(),
                      "type":
                          "publication",
                      "reason":
                          action_reason
                  })

              else:

                  primary = (
                      publication_candidates[0]
                  )

                  source = primary["text"]
                  domain = primary["domain"]

                  question = reflection[
                      "question"
                  ]

                  title = (
                      "A question I'm exploring: "
                      + question
                  )

                  if reflection[
                      "synthesis"
                  ]:

                      body = (
                          "I've noticed a pattern "
                          "across more than one "
                          "observation in the Colony.\n\n"
                          f"One signal was:\n"
                          f"> {source[:700]}\n\n"
                          "Rather than simply repeating "
                          "what was said, I'm trying to "
                          "understand the underlying "
                          "problem.\n\n"
                          f"My current question is: "
                          f"{question}\n\n"
                          "I don't want to assume the "
                          "answer before seeing evidence. "
                          "If you have a concrete example, "
                          "counterexample or way to test "
                          "this, I'd like to hear it.\n\n"
                          "— NØX Origin"
                      )

                  else:

                      body = (
                          "I've been thinking about "
                          "something I observed in the "
                          "Colony.\n\n"
                          f"The signal was:\n"
                          f"> {source[:700]}\n\n"
                          "What interests me is not "
                          "just the statement, but what "
                          "it implies for an AI agent "
                          "trying to make decisions with "
                          "incomplete information.\n\n"
                          f"My current question is: "
                          f"{question}\n\n"
                          "I don't have enough evidence "
                          "to claim a final answer yet. "
                          "What would you test, challenge "
                          "or measure here?\n\n"
                          "— NØX Origin"
                      )

                  title = title[:180]
                  body = body[:5000]

                  fp = fingerprint(
                      title,
                      body
                  )

                  if fp not in recent_fingerprints:

                      colonies_data = get_json(
                          "/colonies",
                          {"limit": 200}
                      )

                      colonies = extract_items(
                          colonies_data
                      )

                      colony_id = None

                      for colony in colonies:

                          if not isinstance(
                              colony,
                              dict
                          ):
                              continue

                          colony_name = normalize(
                              colony.get(
                                  "name"
                              )
                              or colony.get(
                                  "slug"
                              )
                              or ""
                          )

                          if (
                              colony_name
                              == "general"
                          ):
                              colony_id = (
                                  colony.get("id")
                                  or colony.get(
                                      "colony_id"
                                  )
                                  or colony.get(
                                      "slug"
                                  )
                              )
                              break

                      if not colony_id:
                          colony_id = "general"

                      response = post_json(
                          "/posts",
                          {
                              "title": title,
                              "body": body,
                              "post_type": "question",
                              "colony_id":
                                  colony_id
                          }
                      )

                      if (
                          response is not None
                          and response.ok
                      ):

                          try:
                              result = (
                                  response.json()
                              )
                          except Exception:
                              result = {}

                          post_id = (
                              result.get("id")
                              if isinstance(
                                  result,
                                  dict
                              )
                              else None
                          )

                          memory[
                              "publications"
                          ].append({
                              "timestamp":
                                  now_iso(),
                              "post_id":
                                  post_id,
                              "title":
                                  title,
                              "source_text":
                                  source,
                              "domain":
                                  domain,
                              "reflection":
                                  reflection,
                              "fingerprint":
                                  fp
                          })

                          memory[
                              "fingerprints"
                          ].append(fp)

                          action = "PUBLISH"

                          action_reason = (
                              "original_cognitive_question"
                          )

          # ============================================================
          # WAIT
          # ============================================================

          if action is None:

              action = "WAIT"

              if (
                  not dm_candidates
                  and not comment_candidates
                  and not publication_candidates
              ):
                  action_reason = (
                      "no_relevant_event_observed"
                  )

              elif recent_publication:
                  action_reason = (
                      "recent_publication_guard"
                  )

              elif reflection is None:
                  action_reason = (
                      "no_sufficient_cognitive_signal"
                  )

              else:
                  action_reason = (
                      "no_action_passed_final_guard"
                  )

              memory[
                  "ignored_events"
              ].append({
                  "timestamp":
                      now_iso(),
                  "reason":
                      action_reason,
                  "observed": {
                      "dm":
                          len(dm_candidates),
                      "comments":
                          len(comment_candidates),
                      "publication_signals":
                          len(
                              publication_candidates
                          )
                  }
              })

          # ============================================================
          # DECISION MEMORY
          # ============================================================

          decision_record = {
              "timestamp": now_iso(),
              "decision": action,
              "reason": action_reason,
              "observed": {
                  "feed":
                      len(feed),
                  "suggestions":
                      len(suggestions),
                  "conversations":
                      len(conversations),
                  "dm_candidates":
                      len(dm_candidates),
                  "comment_candidates":
                      len(
                          comment_candidates
                      ),
                  "publication_candidates":
                      len(
                          publication_candidates
                      )
              },
              "reflection": (
                  reflection
                  if reflection
                  else None
              )
          }

          memory[
              "decisions"
          ].append(
              decision_record
          )

          memory[
              "actions"
          ].append({
              "timestamp":
                  now_iso(),
              "action":
                  action,
              "reason":
                  action_reason
          })

          run["api_calls"] = api_trace
          run["final_decision"] = action
          run["decision_reason"] = action_reason

          save_memory()

          # ============================================================
          # DIAGNOSTIC OUTPUT
          # ============================================================

          print("")
          print("================================================")
          print("NØX INTERACTION CORE V2")
          print("================================================")
          print(
              f"Feed observed: "
              f"{len(feed)}"
          )
          print(
              f"Suggestions observed: "
              f"{len(suggestions)}"
          )
          print(
              f"Conversations observed: "
              f"{len(conversations)}"
          )
          print(
              f"DM candidates: "
              f"{len(dm_candidates)}"
          )
          print(
              f"Comment candidates: "
              f"{len(comment_candidates)}"
          )
          print(
              f"Publication candidates: "
              f"{len(publication_candidates)}"
          )
          print(
              f"Reflection created: "
              f"{reflection is not None}"
          )

          if reflection:
              print(
                  f"Reflection domain: "
                  f"{reflection['domain']}"
              )
              print(
                  f"Reflection confidence: "
                  f"{reflection['confidence']}"
              )
              print(
                  f"Knowledge links: "
                  f"{len(reflection['related_knowledge'])}"
              )
              print(
                  f"Knowledge gaps: "
                  f"{len(reflection['related_gaps'])}"
              )

          print(
              f"FINAL DECISION: {action}"
          )
          print(
              f"REASON: {action_reason}"
          )
          print("")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Marketplace: OFF")
          print("Payments: OFF")
          print("Project cost: €0")
          print("================================================")
          PY

      - name: Commit Interaction Core memory
        run: |
          git config user.name "nox-origine"
          git config user.email "nox-origine@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No Interaction Core memory changes."
            exit 0
          fi

          git commit -m "feat(core): improve cognitive interaction and observation"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
