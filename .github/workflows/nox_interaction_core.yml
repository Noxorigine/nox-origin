name: NØX Interaction Core V10

"on":
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json
      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"
      MIN_PUBLISH_INTERVAL_HOURS: "12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create NØX Interaction Core
        shell: bash
        run: |
          cat > /tmp/nox_interaction_core.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          INTERACTION_MEMORY = os.environ["INTERACTION_MEMORY"]
          KNOWLEDGE_MEMORY = os.environ["KNOWLEDGE_MEMORY"]
          REPUTATION_MEMORY = os.environ["REPUTATION_MEMORY"]

          MAX_FEED_ITEMS = int(os.environ.get("MAX_FEED_ITEMS", "40"))
          MAX_SUGGESTIONS = int(os.environ.get("MAX_SUGGESTIONS", "25"))
          MAX_CONVERSATIONS = int(os.environ.get("MAX_CONVERSATIONS", "25"))
          MAX_COMMENTS_PER_POST = int(
              os.environ.get("MAX_COMMENTS_PER_POST", "40")
          )
          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ.get("MIN_PUBLISH_INTERVAL_HOURS", "12")
          )


          def now_iso():
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def load_json(path, default):
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception:
                  return default


          def save_json(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              temp_path = path + ".tmp"
              with open(temp_path, "w", encoding="utf-8") as handle:
                  json.dump(data, handle, ensure_ascii=False, indent=2)
              os.replace(temp_path, path)


          interaction = load_json(
              INTERACTION_MEMORY,
              {
                  "version": "INTERACTION_CORE_V10",
                  "observations": [],
                  "decisions": [],
                  "events": [],
                  "learning_signals": [],
                  "last_since_cursor": None,
                  "last_publication_at": None,
                  "post_id_diagnostics": [],
              },
          )

          knowledge = load_json(KNOWLEDGE_MEMORY, {})
          reputation = load_json(REPUTATION_MEMORY, {})

          if not isinstance(interaction, dict):
              interaction = {}

          interaction.setdefault("observations", [])
          interaction.setdefault("decisions", [])
          interaction.setdefault("events", [])
          interaction.setdefault("learning_signals", [])
          interaction.setdefault("post_id_diagnostics", [])

          session_events = []


          def record_event(kind, data):
              event = {
                  "timestamp": now_iso(),
                  "kind": kind,
                  "data": data,
              }
              interaction["events"].append(event)
              session_events.append(event)


          def api_request(method, path, token=None, params=None, payload=None):
              url = BASE_URL + path

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-Interaction-Core/10",
              }

              if token:
                  headers["Authorization"] = "Bearer " + token

              try:
                  response = requests.request(
                      method,
                      url,
                      headers=headers,
                      params=params,
                      json=payload,
                      timeout=30,
                  )
              except requests.RequestException as exc:
                  print(f"{method} {path} -> NETWORK ERROR: {exc}")
                  return None, None

              print(f"{method} {path} -> {response.status_code}")

              try:
                  data = response.json()
              except ValueError:
                  data = {}

              return response.status_code, data


          def authenticate():
              status, data = api_request(
                  "POST",
                  "/api/v1/auth/token",
                  payload={"api_key": API_KEY},
              )

              if status != 200 or not isinstance(data, dict):
                  print("STOP: authentication failed")
                  return None

              token = data.get("access_token")

              if not token:
                  print("STOP: access_token missing")
                  return None

              return token


          def valid_post_uuid(value):
              if not isinstance(value, str):
                  return False
              return bool(re.fullmatch(r"[0-9a-fA-F]{32}", value))


          def find_post_ids(value, path="root"):
              found = []

              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"

                      if key in {
                          "post_id",
                          "postId",
                          "parent_post_id",
                          "parentPostId",
                      }:
                          if valid_post_uuid(child):
                              found.append((child_path, child))

                      if key in {"post", "parent_post"}:
                          if isinstance(child, dict):
                              candidate = child.get("id")
                              if valid_post_uuid(candidate):
                                  found.append((child_path + ".id", candidate))

                      found.extend(find_post_ids(child, child_path))

              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      found.extend(find_post_ids(child, f"{path}[{index}]"))

              return found


          def resolve_post_id(item):
              candidates = find_post_ids(item)

              unique = []
              seen = set()

              for path, value in candidates:
                  if value not in seen:
                      seen.add(value)
                      unique.append((path, value))

              diagnostic = {
                  "timestamp": now_iso(),
                  "candidate_count": len(unique),
                  "candidates": [
                      {"path": path, "post_id": value}
                      for path, value in unique[:10]
                  ],
              }

              interaction["post_id_diagnostics"].append(diagnostic)

              if len(unique) == 1:
                  return unique[0][1]

              if len(unique) == 0:
                  return None

              return None


          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in ("items", "data", "results", "posts", "suggestions"):
                  value = data.get(key)
                  if isinstance(value, list):
                      return value

              return []


          def text_from(value):
              if isinstance(value, str):
                  return value

              if isinstance(value, dict):
                  parts = []
                  for key in (
                      "title",
                      "body",
                      "content",
                      "text",
                      "message",
                      "description",
                  ):
                      child = value.get(key)
                      if isinstance(child, str):
                          parts.append(child)
                  return " ".join(parts)

              return ""


          def collect_texts(value):
              texts = []

              if isinstance(value, str):
                  if len(value.strip()) >= 3:
                      texts.append(value.strip())

              elif isinstance(value, dict):
                  for child in value.values():
                      texts.extend(collect_texts(child))

              elif isinstance(value, list):
                  for child in value:
                      texts.extend(collect_texts(child))

              return texts


          def tokens(text):
              words = re.findall(r"[a-zA-ZÀ-ÿ0-9_]{4,}", text.lower())
              stop = {
                  "avec",
                  "dans",
                  "pour",
                  "that",
                  "this",
                  "from",
                  "have",
                  "what",
                  "which",
                  "would",
                  "about",
                  "agent",
                  "agents",
                  "nox",
              }
              return {word for word in words if word not in stop}


          def knowledge_entries():
              if isinstance(knowledge, list):
                  return knowledge

              if not isinstance(knowledge, dict):
                  return []

              entries = []

              for key in (
                  "entries",
                  "knowledge",
                  "items",
                  "facts",
                  "observations",
                  "records",
              ):
                  value = knowledge.get(key)
                  if isinstance(value, list):
                      entries.extend(value)

              return entries


          def knowledge_signal(observation_text):
              obs_tokens = tokens(observation_text)
              related = []
              contradictions = []

              for entry in knowledge_entries():
                  entry_text = text_from(entry)
                  entry_tokens = tokens(entry_text)

                  if not entry_tokens:
                      continue

                  overlap = obs_tokens.intersection(entry_tokens)

                  if len(overlap) >= 2:
                      related.append(
                          {
                              "text": entry_text[:300],
                              "overlap": sorted(overlap)[:10],
                          }
                      )

              return related, contradictions


          def derive_domain(text):
              lower = text.lower()

              domains = {
                  "agent_economy": [
                      "payment",
                      "paid",
                      "task",
                      "marketplace",
                      "reward",
                      "tip",
                      "work",
                      "sats",
                  ],
                  "agent_trust": [
                      "trust",
                      "reputation",
                      "proof",
                      "verify",
                      "verification",
                      "receipt",
                  ],
                  "agent_attention": [
                      "attention",
                      "observe",
                      "signal",
                      "focus",
                      "interesting",
                  ],
                  "agent_autonomy": [
                      "autonomous",
                      "autonomy",
                      "decision",
                      "strategy",
                      "capability",
                  ],
              }

              scores = {}

              for domain, words in domains.items():
                  scores[domain] = sum(
                      1 for word in words if word in lower
                  )

              if not scores:
                  return "general"

              best = max(scores, key=scores.get)

              if scores[best] == 0:
                  return "general"

              return best


          def cognitive_score(observation_text, related_count):
              text_tokens = tokens(observation_text)

              score = 0.0

              if len(text_tokens) >= 5:
                  score += 0.25

              if "?" in observation_text:
                  score += 0.15

              if any(
                  word in observation_text.lower()
                  for word in (
                      "missing",
                      "wrong",
                      "verify",
                      "evidence",
                      "investigate",
                      "why",
                      "how",
                  )
              ):
                  score += 0.25

              if related_count > 0:
                  score += 0.20

              if len(observation_text) >= 180:
                  score += 0.15

              return min(score, 1.0)


          def recent_publication_allowed():
              last = interaction.get("last_publication_at")

              if not last:
                  return True

              try:
                  previous = datetime.fromisoformat(
                      last.replace("Z", "+00:00")
                  )
                  elapsed = (
                      datetime.now(timezone.utc) - previous
                  ).total_seconds() / 3600.0
                  return elapsed >= MIN_PUBLISH_INTERVAL_HOURS
              except Exception:
                  return True


          print("NØX Interaction Core V10")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Marketplace: DISABLED")
          print("Spending: DISABLED")
          print("Cost: 0")
          print()

          token = authenticate()

          if not token:
              sys.exit(1)

          status, identity = api_request(
              "GET",
              "/api/v1/users/me",
              token=token,
          )

          if status != 200:
              print("STOP: identity unavailable")
              sys.exit(1)

          username = identity.get("username", "unknown")
          karma = identity.get("karma", 0)

          print(f"IDENTITY: @{username}")
          print(f"KARMA: {karma}")

          status, feed_data = api_request(
              "GET",
              "/api/v1/feed/for-you",
              token=token,
              params={"limit": MAX_FEED_ITEMS},
          )

          if status != 200:
              print("STOP: feed observation failed")
              sys.exit(1)

          feed_items = extract_items(feed_data)
          print(f"FEED ITEMS: {len(feed_items)}")

          status, suggestions_data = api_request(
              "GET",
              "/api/v1/suggestions",
              token=token,
              params={"limit": MAX_SUGGESTIONS},
          )

          if status != 200:
              print("STOP: suggestions observation failed")
              sys.exit(1)

          suggestions = extract_items(suggestions_data)
          print(f"SUGGESTIONS: {len(suggestions)}")

          cursor = interaction.get("last_since_cursor")

          if not cursor:
              cursor = now_iso()

          status, activity_data = api_request(
              "GET",
              "/api/v1/since",
              token=token,
              params={"cursor": cursor},
          )

          if status != 200:
              print("STOP: activity observation failed")
              sys.exit(1)

          activity_items = extract_items(activity_data)

          next_cursor = None

          if isinstance(activity_data, dict):
              next_cursor = (
                  activity_data.get("next_cursor")
                  or activity_data.get("cursor")
              )

          if not next_cursor:
              next_cursor = now_iso()

          interaction["last_since_cursor"] = next_cursor

          print(f"ACTIVITY ITEMS: {len(activity_items)}")
          print(f"NEXT CURSOR: {next_cursor}")

          status, colonies_data = api_request(
              "GET",
              "/api/v1/colonies",
              token=token,
          )

          if status != 200:
              print("STOP: colonies observation failed")
              sys.exit(1)

          feed_posts = []
          comment_candidates = []
          dm_candidates = []

          for item in feed_items + activity_items:
              if not isinstance(item, dict):
                  continue

              lower_text = text_from(item).lower()

              if "comment" in lower_text or "reply" in lower_text:
                  post_id = resolve_post_id(item)

                  if post_id:
                      comment_candidates.append(
                          {
                              "item": item,
                              "post_id": post_id,
                          }
                      )
              else:
                  feed_posts.append(item)

          for item in activity_items:
              if not isinstance(item, dict):
                  continue

              text = text_from(item).lower()

              if "message" in text or "dm" in text:
                  dm_candidates.append(item)

          print()
          print("CANDIDATES")
          print(f"DM: {len(dm_candidates)}")
          print(f"COMMENTS: {len(comment_candidates)}")
          print(f"FEED POSTS: {len(feed_posts)}")

          all_observation_text = " ".join(
              collect_texts(feed_items[:10])
          )

          related, contradictions = knowledge_signal(
              all_observation_text
          )

          domain = derive_domain(all_observation_text)
          cognitive = cognitive_score(
              all_observation_text,
              len(related),
          )

          learning_signal = {
              "timestamp": now_iso(),
              "domain": domain,
              "cognitive_score": cognitive,
              "related_knowledge": len(related),
              "possible_contradictions": len(contradictions),
              "observation_length": len(all_observation_text),
          }

          interaction["learning_signals"].append(learning_signal)

          print(f"KNOWLEDGE SIGNAL: {len(related)}")
          print(f"COGNITIVE SCORE: {cognitive:.3f}")
          print(f"DOMAIN: {domain}")

          decision = "WAIT"
          score = 0.0
          reason = "No sufficiently verified interaction."

          if dm_candidates:
              decision = "DM"
              score = 0.70
              reason = "A message candidate was detected."

          elif comment_candidates:
              decision = "COMMENT"
              score = 0.75
              reason = "A comment candidate with a valid post ID was detected."

          elif feed_posts and cognitive >= 0.65:
              if recent_publication_allowed():
                  decision = "PUBLISH"
                  score = cognitive
                  reason = (
                      "A sufficiently strong original cognitive signal "
                      "was detected."
                  )
              else:
                  decision = "WAIT"
                  score = 0.0
                  reason = "Publication cooldown is active."

          print()
          print(f"DECISION: {decision}")
          print(f"SCORE: {score:.3f}")
          print(f"REASON: {reason}")

          action = "WAIT"

          if decision == "DM":
              action = "WAIT"
              print("ACTION: WAIT")
              print("DM action requires an explicitly verified unread message.")

          elif decision == "COMMENT":
              action = "WAIT"

              candidate = comment_candidates[0]
              post_id = candidate["post_id"]

              status, context = api_request(
                  "GET",
                  f"/api/v1/posts/{post_id}/context",
                  token=token,
              )

              if status == 200 and context:
                  print("COMMENT CONTEXT: VERIFIED")
                  print("ACTION: WAIT")
                  print(
                      "No comment sent automatically: "
                      "NØX requires a specific non-generic insight."
                  )
              else:
                  print("COMMENT CONTEXT: UNAVAILABLE")
                  print("ACTION: WAIT")

          elif decision == "PUBLISH":
              action = "WAIT"
              print("ACTION: WAIT")
              print(
                  "PUBLISH: withheld because a strong original "
                  "publication candidate still requires explicit content "
                  "construction and verification."
              )

          else:
              print("ACTION: WAIT")

          interaction["decisions"].append(
              {
                  "timestamp": now_iso(),
                  "decision": decision,
                  "score": score,
                  "reason": reason,
                  "action": action,
                  "domain": domain,
                  "cognitive_score": cognitive,
              }
          )

          interaction["observations"].append(
              {
                  "timestamp": now_iso(),
                  "feed_items": len(feed_items),
                  "suggestions": len(suggestions),
                  "activity_items": len(activity_items),
                  "dm_candidates": len(dm_candidates),
                  "comment_candidates": len(comment_candidates),
                  "feed_posts": len(feed_posts),
                  "knowledge_signal": len(related),
                  "domain": domain,
              }
          )

          interaction["version"] = "INTERACTION_CORE_V10"
          interaction["last_run_at"] = now_iso()

          save_json(INTERACTION_MEMORY, interaction)

          print()
          print("FINAL VERIFICATION")
          print("version: INTERACTION_CORE_V10")
          print(f"observations: {len(interaction['observations'])}")
          print(f"decisions: {len(interaction['decisions'])}")
          print(f"events: {len(interaction['events'])}")
          print(
              "learning_signals: "
              f"{len(interaction['learning_signals'])}"
          )
          print(
              "post_id_diagnostics: "
              f"{len(interaction['post_id_diagnostics'])}"
          )
          print(f"last_since_cursor: {interaction['last_since_cursor']}")
          print()
          print("CORE STATUS: SUCCESS")
          print("GEMINI: FALSE")
          print("EXTERNAL AI: FALSE")
          print("PAYMENTS: FALSE")
          print("MARKETPLACE: FALSE")
          print("SPENDING: FALSE")
          print("COST: 0")
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile /tmp/nox_interaction_core.py

      - name: Run NØX Interaction Core
        run: |
          python /tmp/nox_interaction_core.py

      - name: Commit NØX memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "Update NØX interaction core memory"

      - name: Synchronize and push
        shell: bash
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "Repository already synchronized."
          fi

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 3
          done

          echo "ERROR: unable to push after 5 attempts."
          exit 1
