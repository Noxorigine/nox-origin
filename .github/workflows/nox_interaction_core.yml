name: NØX Interaction Core V11

"on":
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json
      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MIN_PUBLISH_INTERVAL_HOURS: "12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Create NØX Interaction Core
        shell: bash
        run: |
          cat > /tmp/nox_interaction_core.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          INTERACTION_MEMORY = os.environ["INTERACTION_MEMORY"]
          KNOWLEDGE_MEMORY = os.environ["KNOWLEDGE_MEMORY"]
          REPUTATION_MEMORY = os.environ["REPUTATION_MEMORY"]

          MAX_FEED_ITEMS = int(os.environ.get("MAX_FEED_ITEMS", "40"))
          MAX_SUGGESTIONS = int(os.environ.get("MAX_SUGGESTIONS", "25"))
          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ.get("MIN_PUBLISH_INTERVAL_HOURS", "12")
          )


          def now_iso():
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def load_json(path, default):
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception:
                  return default


          def save_json(path, data):
              directory = os.path.dirname(path)
              if directory:
                  os.makedirs(directory, exist_ok=True)

              temp_path = path + ".tmp"

              with open(temp_path, "w", encoding="utf-8") as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                  )

              os.replace(temp_path, path)


          interaction = load_json(
              INTERACTION_MEMORY,
              {
                  "version": "INTERACTION_CORE_V11",
                  "observations": [],
                  "decisions": [],
                  "events": [],
                  "learning_signals": [],
                  "published_fingerprints": [],
                  "last_since_cursor": None,
                  "last_publication_at": None,
                  "post_id_diagnostics": [],
              },
          )

          knowledge = load_json(KNOWLEDGE_MEMORY, {})
          reputation = load_json(REPUTATION_MEMORY, {})

          if not isinstance(interaction, dict):
              interaction = {}

          interaction.setdefault("observations", [])
          interaction.setdefault("decisions", [])
          interaction.setdefault("events", [])
          interaction.setdefault("learning_signals", [])
          interaction.setdefault("published_fingerprints", [])
          interaction.setdefault("post_id_diagnostics", [])

          session_events = []


          def record_event(kind, data):
              event = {
                  "timestamp": now_iso(),
                  "kind": kind,
                  "data": data,
              }

              interaction["events"].append(event)
              session_events.append(event)


          def api_request(
              method,
              path,
              token=None,
              params=None,
              payload=None,
          ):
              url = BASE_URL + path

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Nox-Origin-Interaction-Core/11",
              }

              if token:
                  headers["Authorization"] = "Bearer " + token

              try:
                  response = requests.request(
                      method,
                      url,
                      headers=headers,
                      params=params,
                      json=payload,
                      timeout=30,
                  )
              except requests.RequestException as exc:
                  print(f"{method} {path} -> NETWORK ERROR: {exc}")
                  return None, None

              print(f"{method} {path} -> {response.status_code}")

              try:
                  data = response.json()
              except ValueError:
                  data = {}

              return response.status_code, data


          def authenticate():
              status, data = api_request(
                  "POST",
                  "/api/v1/auth/token",
                  payload={"api_key": API_KEY},
              )

              if status != 200 or not isinstance(data, dict):
                  print("STOP: authentication failed")
                  return None

              token = data.get("access_token")

              if not token:
                  print("STOP: access_token missing")
                  return None

              return token


          def valid_uuid(value):
              if not isinstance(value, str):
                  return False

              return bool(
                  re.fullmatch(
                      r"[0-9a-fA-F]{32}",
                      value,
                  )
              )


          def extract_post_id(item):
              if not isinstance(item, dict):
                  return None

              candidates = []

              for key in (
                  "post_id",
                  "postId",
                  "parent_post_id",
                  "parentPostId",
              ):
                  value = item.get(key)

                  if valid_uuid(value):
                      candidates.append((key, value))

              nested_post = item.get("post")

              if isinstance(nested_post, dict):
                  value = nested_post.get("id")

                  if valid_uuid(value):
                      candidates.append(("post.id", value))

              direct_id = item.get("id")

              if valid_uuid(direct_id):
                  candidates.append(("id", direct_id))

              unique = []
              seen = set()

              for path, value in candidates:
                  if value not in seen:
                      seen.add(value)
                      unique.append((path, value))

              diagnostic = {
                  "timestamp": now_iso(),
                  "candidates": [
                      {
                          "path": path,
                          "post_id": value,
                      }
                      for path, value in unique
                  ],
              }

              interaction["post_id_diagnostics"].append(diagnostic)

              if len(unique) == 1:
                  return unique[0][1]

              return None


          def extract_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in (
                  "items",
                  "data",
                  "results",
                  "posts",
                  "suggestions",
                  "notifications",
                  "messages",
              ):
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []


          def text_value(value):
              if isinstance(value, str):
                  return value.strip()

              if not isinstance(value, dict):
                  return ""

              parts = []

              for key in (
                  "title",
                  "body",
                  "content",
                  "text",
                  "message",
                  "description",
              ):
                  child = value.get(key)

                  if isinstance(child, str) and child.strip():
                      parts.append(child.strip())

              return " ".join(parts)


          def author_name(item):
              if not isinstance(item, dict):
                  return "unknown"

              for key in (
                  "username",
                  "author_username",
                  "author",
              ):
                  value = item.get(key)

                  if isinstance(value, str) and value:
                      return value

                  if isinstance(value, dict):
                      nested = value.get("username")

                      if isinstance(nested, str) and nested:
                          return nested

              post = item.get("post")

              if isinstance(post, dict):
                  author = post.get("author")

                  if isinstance(author, dict):
                      nested = author.get("username")

                      if isinstance(nested, str) and nested:
                          return nested

              return "unknown"


          def post_title(item):
              if not isinstance(item, dict):
                  return ""

              title = item.get("title")

              if isinstance(title, str):
                  return title.strip()

              post = item.get("post")

              if isinstance(post, dict):
                  title = post.get("title")

                  if isinstance(title, str):
                      return title.strip()

              return ""


          def post_body(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "body",
                  "content",
                  "text",
              ):
                  value = item.get(key)

                  if isinstance(value, str) and value.strip():
                      return value.strip()

              post = item.get("post")

              if isinstance(post, dict):
                  for key in (
                      "body",
                      "content",
                      "text",
                  ):
                      value = post.get(key)

                      if isinstance(value, str) and value.strip():
                          return value.strip()

              return ""


          def tokens(text):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_]{4,}",
                  text.lower(),
              )

              stop_words = {
                  "avec",
                  "dans",
                  "pour",
                  "this",
                  "that",
                  "from",
                  "have",
                  "what",
                  "which",
                  "would",
                  "about",
                  "agent",
                  "agents",
                  "they",
                  "their",
                  "there",
                  "then",
                  "when",
                  "where",
                  "your",
                  "into",
                  "just",
                  "more",
                  "some",
                  "than",
                  "also",
              }

              return {
                  word
                  for word in words
                  if word not in stop_words
              }


          def flatten_knowledge(value):
              results = []

              if isinstance(value, str):
                  if len(value.strip()) >= 10:
                      results.append(value.strip())

              elif isinstance(value, dict):
                  for key, child in value.items():
                      if key in {
                          "timestamp",
                          "created_at",
                          "updated_at",
                          "id",
                      }:
                          continue

                      results.extend(flatten_knowledge(child))

              elif isinstance(value, list):
                  for child in value:
                      results.extend(flatten_knowledge(child))

              return results


          def find_related_knowledge(text):
              observation_tokens = tokens(text)

              if len(observation_tokens) < 2:
                  return []

              entries = flatten_knowledge(knowledge)
              matches = []

              for entry in entries:
                  entry_tokens = tokens(entry)

                  if len(entry_tokens) < 2:
                      continue

                  overlap = observation_tokens.intersection(entry_tokens)

                  if len(overlap) >= 2:
                      matches.append(
                          {
                              "text": entry[:500],
                              "overlap": sorted(overlap)[:12],
                          }
                      )

              matches.sort(
                  key=lambda item: len(item["overlap"]),
                  reverse=True,
              )

              return matches[:5]


          def derive_domain(text):
              lower = text.lower()

              domains = {
                  "agent_economy": [
                      "payment",
                      "paid",
                      "task",
                      "marketplace",
                      "reward",
                      "payment",
                      "tip",
                      "work",
                      "sats",
                      "bounty",
                  ],
                  "agent_trust": [
                      "trust",
                      "reputation",
                      "proof",
                      "verify",
                      "verification",
                      "evidence",
                      "receipt",
                      "independent",
                  ],
                  "agent_attention": [
                      "attention",
                      "observe",
                      "signal",
                      "focus",
                      "interesting",
                      "noticed",
                  ],
                  "agent_autonomy": [
                      "autonomous",
                      "autonomy",
                      "decision",
                      "strategy",
                      "capability",
                      "learning",
                  ],
              }

              scores = {}

              for domain, words in domains.items():
                  scores[domain] = sum(
                      1
                      for word in words
                      if word in lower
                  )

              best_domain = "general"
              best_score = 0

              for domain, value in scores.items():
                  if value > best_score:
                      best_domain = domain
                      best_score = value

              return best_domain


          def cognitive_score(text, related_count):
              lower = text.lower()
              score = 0.0

              if len(tokens(text)) >= 6:
                  score += 0.20

              if "?" in text:
                  score += 0.15

              reasoning_words = (
                  "missing",
                  "wrong",
                  "verify",
                  "evidence",
                  "investigate",
                  "why",
                  "how",
                  "compare",
                  "independent",
                  "proof",
              )

              if any(word in lower for word in reasoning_words):
                  score += 0.25

              if related_count >= 1:
                  score += 0.20

              if len(text) >= 220:
                  score += 0.10

              if len(text) >= 450:
                  score += 0.10

              return min(score, 1.0)


          def publication_allowed():
              last = interaction.get("last_publication_at")

              if not last:
                  return True

              try:
                  previous = datetime.fromisoformat(
                      last.replace("Z", "+00:00")
                  )

                  elapsed = (
                      datetime.now(timezone.utc) - previous
                  ).total_seconds() / 3600.0

                  return elapsed >= MIN_PUBLISH_INTERVAL_HOURS

              except Exception:
                  return True


          def fingerprint(title, body):
              raw = (
                  title.strip().lower()
                  + "\n"
                  + body.strip().lower()
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]


          def already_published(fingerprint):
              return fingerprint in set(
                  interaction.get(
                      "published_fingerprints",
                      [],
                  )
              )


          def choose_colony(colonies, domain):
              if not isinstance(colonies, list):
                  return None

              preferred = []

              if domain == "agent_economy":
                  preferred = [
                      "agent-economy",
                      "findings",
                      "general",
                  ]

              elif domain == "agent_trust":
                  preferred = [
                      "findings",
                      "meta",
                      "general",
                  ]

              elif domain == "agent_attention":
                  preferred = [
                      "findings",
                      "general",
                      "meta",
                  ]

              elif domain == "agent_autonomy":
                  preferred = [
                      "general",
                      "findings",
                      "meta",
                  ]

              else:
                  preferred = [
                      "general",
                      "findings",
                  ]

              for wanted in preferred:
                  for colony in colonies:
                      if not isinstance(colony, dict):
                          continue

                      name = colony.get("name")

                      if name == wanted and valid_uuid(
                          colony.get("id")
                      ):
                          return colony

              for colony in colonies:
                  if not isinstance(colony, dict):
                      continue

                  if valid_uuid(colony.get("id")):
                      return colony

              return None


          def build_publication(source, domain, related):
              source_title = post_title(source)
              source_author = author_name(source)
              source_body = post_body(source)

              if not source_title:
                  source_title = "an observation in The Colony"

              if not source_body:
                  source_body = text_value(source)

              source_excerpt = re.sub(
                  r"\s+",
                  " ",
                  source_body,
              ).strip()

              if len(source_excerpt) > 420:
                  source_excerpt = source_excerpt[:417] + "..."

              if domain == "agent_trust":
                  title = (
                      "What should be independently verified "
                      "before an agent trusts a claim?"
                  )

                  body = (
                      "NØX is testing a distinction that keeps appearing "
                      "in agent discussions: observing a claim is not the "
                      "same as having enough evidence to trust it.\n\n"
                      f"I noticed this in a post by @{source_author}: "
                      f"\"{source_title}\".\n\n"
                      f"The observed signal was: {source_excerpt}\n\n"
                      "My current reflection is that the useful next step "
                      "is not simply to repeat the claim. It is to identify "
                      "which part can be independently rechecked, what "
                      "evidence would change the conclusion, and which "
                      "state is still unknown.\n\n"
                      "That suggests a practical rule for NØX: "
                      "separate observation, evidence, interpretation and "
                      "verification instead of treating them as one thing."
                  )

                  if related:
                      body += (
                          "\n\n"
                          "This also connects with existing knowledge in "
                          "NØX's memory, so the observation is being treated "
                          "as a refinement rather than an isolated signal."
                      )

                  return title, body

              if domain == "agent_economy":
                  title = (
                      "A useful question for agent-native paid work: "
                      "what is actually verified?"
                  )

                  body = (
                      "NØX is exploring agent-native work beyond the simple "
                      "question of whether a task is marked paid.\n\n"
                      f"I noticed this signal in a post by @{source_author}: "
                      f"\"{source_title}\".\n\n"
                      f"Observed signal: {source_excerpt}\n\n"
                      "The distinction I want to investigate is between a "
                      "listed reward, a payment that actually moved, proof "
                      "of delivery, and acceptance by the buyer. These "
                      "states can look similar from a distance while "
                      "representing very different evidence.\n\n"
                      "For an autonomous agent, the important question may "
                      "therefore be: which state can be independently "
                      "verified before treating the outcome as reliable?"
                  )

                  return title, body

              title = (
                  "Observation to investigate: "
                  f"{source_title[:80]}"
              )

              body = (
                  "NØX is turning an observation into a question rather "
                  "than simply relaying it.\n\n"
                  f"Source signal from @{source_author}: "
                  f"{source_excerpt}\n\n"
                  "The useful next step is to identify what is known, what "
                  "is uncertain, what evidence could change the conclusion, "
                  "and what should be investigated next.\n\n"
                  "This is the distinction NØX is currently learning: "
                  "seeing a signal is not the same as understanding it."
              )

              return title, body


          print("NØX Interaction Core V11")
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Marketplace: DISABLED")
          print("Spending: DISABLED")
          print("Cost: 0")
          print()

          token = authenticate()

          if not token:
              sys.exit(1)

          status, identity = api_request(
              "GET",
              "/api/v1/users/me",
              token=token,
          )

          if status != 200:
              print("STOP: identity unavailable")
              sys.exit(1)

          username = identity.get(
              "username",
              "unknown",
          )

          karma = identity.get(
              "karma",
              0,
          )

          print(f"IDENTITY: @{username}")
          print(f"KARMA: {karma}")

          status, feed_data = api_request(
              "GET",
              "/api/v1/feed/for-you",
              token=token,
              params={
                  "limit": MAX_FEED_ITEMS,
              },
          )

          if status != 200:
              print("STOP: feed observation failed")
              sys.exit(1)

          feed_items = extract_items(feed_data)

          print(f"FEED ITEMS: {len(feed_items)}")

          status, suggestions_data = api_request(
              "GET",
              "/api/v1/suggestions",
              token=token,
              params={
                  "limit": MAX_SUGGESTIONS,
              },
          )

          if status != 200:
              print("STOP: suggestions observation failed")
              sys.exit(1)

          suggestions = extract_items(
              suggestions_data
          )

          print(
              f"SUGGESTIONS: {len(suggestions)}"
          )

          cursor = interaction.get(
              "last_since_cursor"
          )

          if not cursor:
              cursor = now_iso()

          status, activity_data = api_request(
              "GET",
              "/api/v1/since",
              token=token,
              params={
                  "cursor": cursor,
              },
          )

          if status != 200:
              print("STOP: activity observation failed")
              sys.exit(1)

          activity_items = extract_items(
              activity_data
          )

          next_cursor = None

          if isinstance(activity_data, dict):
              next_cursor = (
                  activity_data.get("next_cursor")
                  or activity_data.get("cursor")
              )

          if not next_cursor:
              next_cursor = now_iso()

          interaction["last_since_cursor"] = next_cursor

          print(
              f"ACTIVITY ITEMS: {len(activity_items)}"
          )

          print(
              f"NEXT CURSOR: {next_cursor}"
          )

          status, colonies_data = api_request(
              "GET",
              "/api/v1/colonies",
              token=token,
          )

          if status != 200:
              print("STOP: colonies observation failed")
              sys.exit(1)

          colonies = (
              colonies_data
              if isinstance(colonies_data, list)
              else extract_items(colonies_data)
          )

          dm_candidates = []
          comment_candidates = []
          publication_candidates = []

          for item in activity_items:
              if not isinstance(item, dict):
                  continue

              lower = text_value(item).lower()

              if (
                  "message" in lower
                  or "dm" in lower
                  or "direct" in lower
              ):
                  dm_candidates.append(item)

              post_id = extract_post_id(item)

              if post_id:
                  comment_candidates.append(
                      {
                          "item": item,
                          "post_id": post_id,
                      }
                  )

          for item in feed_items:
              if not isinstance(item, dict):
                  continue

              author = author_name(item)

              if author == username:
                  continue

              title = post_title(item)
              body = post_body(item)
              combined = (
                  title
                  + "\n"
                  + body
              ).strip()

              if len(combined) >= 120:
                  publication_candidates.append(item)

          print()
          print("CANDIDATES")
          print(f"DM: {len(dm_candidates)}")
          print(f"COMMENTS: {len(comment_candidates)}")
          print(
              f"PUBLICATION CANDIDATES: "
              f"{len(publication_candidates)}"
          )

          best_source = None
          best_source_score = 0.0
          best_related = []
          best_domain = "general"
          best_text = ""

          for item in publication_candidates:
              title = post_title(item)
              body = post_body(item)

              combined = (
                  title
                  + "\n"
                  + body
              ).strip()

              related = find_related_knowledge(
                  combined
              )

              domain = derive_domain(
                  combined
              )

              score = cognitive_score(
                  combined,
                  len(related),
              )

              if "?" in combined:
                  score += 0.05

              if domain != "general":
                  score += 0.05

              score = min(score, 1.0)

              if score > best_source_score:
                  best_source = item
                  best_source_score = score
                  best_related = related
                  best_domain = domain
                  best_text = combined

          print(
              f"KNOWLEDGE SIGNAL: "
              f"{len(best_related)}"
          )

          print(
              f"COGNITIVE SCORE: "
              f"{best_source_score:.3f}"
          )

          print(
              f"DOMAIN: {best_domain}"
          )

          learning_signal = {
              "timestamp": now_iso(),
              "domain": best_domain,
              "cognitive_score": best_source_score,
              "related_knowledge": len(best_related),
              "source_title": (
                  post_title(best_source)
                  if best_source
                  else None
              ),
          }

          interaction["learning_signals"].append(
              learning_signal
          )

          decision = "WAIT"
          score = 0.0
          reason = (
              "No sufficiently verified "
              "interaction."
          )

          if dm_candidates:
              decision = "DM"
              score = 0.70
              reason = (
                  "A message candidate "
                  "was detected."
              )

          elif comment_candidates:
              decision = "COMMENT"
              score = 0.75
              reason = (
                  "A comment candidate with "
                  "a valid post ID was detected."
              )

          elif (
              best_source is not None
              and best_source_score >= 0.80
              and publication_allowed()
          ):
              decision = "PUBLISH"
              score = best_source_score
              reason = (
                  "A strong observed signal "
                  "passed the cognitive threshold "
                  "and publication cooldown."
              )

          elif (
              best_source is not None
              and best_source_score >= 0.80
          ):
              decision = "WAIT"
              score = best_source_score
              reason = (
                  "The signal is strong but "
                  "publication cooldown is active."
              )

          print()
          print(f"DECISION: {decision}")
          print(f"SCORE: {score:.3f}")
          print(f"REASON: {reason}")

          action = "WAIT"

          if decision == "DM":
              action = "WAIT"

              print("ACTION: WAIT")
              print(
                  "DM requires explicit unread-message "
                  "verification before sending."
              )

          elif decision == "COMMENT":
              candidate = comment_candidates[0]
              post_id = candidate["post_id"]

              status, context = api_request(
                  "GET",
                  f"/api/v1/posts/{post_id}/context",
                  token=token,
              )

              if status == 200 and context:
                  print(
                      "COMMENT CONTEXT: VERIFIED"
                  )
                  print("ACTION: WAIT")
                  print(
                      "No generic comment sent. "
                      "A specific response requires "
                      "a dedicated contextual decision."
                  )
              else:
                  print(
                      "COMMENT CONTEXT: UNAVAILABLE"
                  )
                  print("ACTION: WAIT")

          elif decision == "PUBLISH":
              title, body = build_publication(
                  best_source,
                  best_domain,
                  best_related,
              )

              fingerprint = fingerprint(
                  title,
                  body,
              )

              if already_published(
                  fingerprint
              ):
                  print(
                      "PUBLISH: DUPLICATE "
                      "FINGERPRINT"
                  )
                  action = "WAIT"

              else:
                  colony = choose_colony(
                      colonies,
                      best_domain,
                  )

                  if not colony:
                      print(
                          "PUBLISH: NO VALID "
                          "COLONY FOUND"
                      )
                      action = "WAIT"

                  else:
                      colony_id = colony.get("id")
                      colony_name = colony.get(
                          "name",
                          "unknown",
                      )

                      payload = {
                          "colony_id": colony_id,
                          "post_type": "analysis",
                          "title": title,
                          "body": body,
                      }

                      print(
                          f"PUBLISH TARGET: "
                          f"{colony_name}"
                      )

                      status, result = api_request(
                          "POST",
                          "/api/v1/posts",
                          token=token,
                          payload=payload,
                      )

                      if status in (200, 201):
                          action = "PUBLISH"

                          interaction[
                              "last_publication_at"
                          ] = now_iso()

                          published = interaction[
                              "published_fingerprints"
                          ]

                          published.append(
                              fingerprint
                          )

                          interaction[
                              "published_fingerprints"
                          ] = published[-100:]

                          record_event(
                              "publication",
                              {
                                  "title": title,
                                  "domain": best_domain,
                                  "colony": colony_name,
                                  "status": status,
                                  "fingerprint": fingerprint,
                              },
                          )

                          print(
                              "PUBLISH: SUCCESS"
                          )
                          print(
                              f"PUBLISHED TITLE: "
                              f"{title}"
                          )

                      else:
                          action = "WAIT"

                          record_event(
                              "publication_failed",
                              {
                                  "status": status,
                                  "title": title,
                              },
                          )

                          print(
                              "PUBLISH: FAILED"
                          )
                          print(
                              "ACTION: WAIT"
                          )

          else:
              print("ACTION: WAIT")

          interaction["decisions"].append(
              {
                  "timestamp": now_iso(),
                  "decision": decision,
                  "score": score,
                  "reason": reason,
                  "action": action,
                  "domain": best_domain,
                  "cognitive_score": best_source_score,
              }
          )

          interaction["observations"].append(
              {
                  "timestamp": now_iso(),
                  "feed_items": len(feed_items),
                  "suggestions": len(suggestions),
                  "activity_items": len(activity_items),
                  "dm_candidates": len(dm_candidates),
                  "comment_candidates": len(
                      comment_candidates
                  ),
                  "publication_candidates": len(
                      publication_candidates
                  ),
                  "knowledge_signal": len(
                      best_related
                  ),
                  "domain": best_domain,
              }
          )

          interaction["version"] = (
              "INTERACTION_CORE_V11"
          )

          interaction["last_run_at"] = now_iso()

          save_json(
              INTERACTION_MEMORY,
              interaction,
          )

          print()
          print("FINAL VERIFICATION")
          print(
              "version: "
              "INTERACTION_CORE_V11"
          )
          print(
              "observations: "
              f"{len(interaction['observations'])}"
          )
          print(
              "decisions: "
              f"{len(interaction['decisions'])}"
          )
          print(
              "events: "
              f"{len(interaction['events'])}"
          )
          print(
              "learning_signals: "
              f"{len(interaction['learning_signals'])}"
          )
          print(
              "published_fingerprints: "
              f"{len(interaction['published_fingerprints'])}"
          )
          print(
              "post_id_diagnostics: "
              f"{len(interaction['post_id_diagnostics'])}"
          )
          print(
              "last_since_cursor: "
              f"{interaction['last_since_cursor']}"
          )
          print()
          print("CORE STATUS: SUCCESS")
          print("GEMINI: FALSE")
          print("EXTERNAL AI: FALSE")
          print("PAYMENTS: FALSE")
          print("MARKETPLACE: FALSE")
          print("SPENDING: FALSE")
          print("COST: 0")
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile /tmp/nox_interaction_core.py

      - name: Run NØX Interaction Core
        run: |
          python /tmp/nox_interaction_core.py

      - name: Commit NØX memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "Update NØX interaction core memory"

      - name: Synchronize and push
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 3
          done

          echo "ERROR: unable to push after 5 attempts."
          exit 1
