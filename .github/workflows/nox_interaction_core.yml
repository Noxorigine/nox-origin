                              "action": "COMMENT",
                              "status": "FAILED",
                              "post_id": post_id,
                              "http_status": status,
                              "response": comment_data,
                          }

                  else:

                      action_result = {
                          "timestamp": iso_now(),
                          "action": "COMMENT",
                          "status": "ALREADY_PROCESSED",
                          "post_id": post_id,
                      }


